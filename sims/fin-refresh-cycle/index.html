<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var As = window.SimdeckModels.asset;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (30 000 / 30,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 9). Minus is U+2212. */
  function money(x) {
    var r = As.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  function dec(x, places) {
    var s = (Math.round(x * Math.pow(10, places)) / Math.pow(10, places)).toFixed(places).replace(/\.?0+$/, '');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  /** A list "1, 5 and 9" in the page's language. */
  function list(items) {
    if (items.length < 2) return items.join('');
    return items.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + items[items.length - 1];
  }
  /** Cohort size: "60 devices", or "34–35 devices" when uneven. */
  function sizes(s) {
    var xs = s.cohorts.map(function (k) { return k.size; });
    var lo = Math.min.apply(null, xs), hi = Math.max.apply(null, xs);
    return lo === hi ? t.n('nDevices', lo) : t('nDevicesRange', { a: lo, b: hi });
  }

  // ── charts ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step at or above x. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }
  function scale(max) {
    var step = niceStep(max / 4);
    return { step: step, top: Math.max(step, Math.ceil(max / step) * step) };
  }

  /** A stacked bar: parts [{ k, v }] from the bottom; left and width in % of the plot. */
  function stack(parts, top, left, width, attrs) {
    var total = parts.reduce(function (a, x) { return a + Math.max(0, x.v); }, 0);
    var segs = parts.filter(function (x) { return x.v > 0; }).map(function (x) {
      return h('div', { class: 'rc-seg', dataset: { k: x.k }, style: { height: (100 * x.v / total) + '%' } });
    });
    return h('div', Object.assign({ class: 'rc-stack', 'data-zero': total > 0 ? null : '', style: { left: left + '%', width: width + '%', height: (100 * total / top) + '%' } }, attrs || {}), segs);
  }

  function frame(unit, dom, fmt, plotKids, xs) {
    var ticks = [], grid = [];
    for (var v = 0; v <= dom.top + 1e-6; v += dom.step) {
      ticks.push(h('span', { class: 'rc-tick', translate: 'no', style: { top: (100 * (1 - v / dom.top)) + '%' } }, fmt(v)));
      if (v > 0) grid.push(h('div', { class: 'rc-gl', style: { top: (100 * (1 - v / dom.top)) + '%' } }));
    }
    return h('div', { class: 'rc-chart' },
      h('div', { class: 'rc-unit' }, unit),
      h('div', { class: 'rc-axis' }, ticks),
      h('div', { class: 'rc-plot' }, grid, plotKids),
      h('div', { class: 'rc-xs' }, xs));
  }

  /** Left: the cost per device a year for every cycle. */
  function econChart(s, chg) {
    var pts = s.curve, k = pts.length;
    var dom = scale(Math.max.apply(null, pts.map(function (d) { return d.total; })));
    var bars = [], xs = [];
    pts.forEach(function (d, i) {
      var chosen = d.cycle === s.p.cycle, econ = d.cycle === s.econ;
      var mid = 100 * (i + 0.5) / k;
      bars.push(stack([{ k: 'capital', v: d.capital }, { k: 'suprep', v: d.supRep }, { k: 'staff', v: d.staff }], dom.top,
        mid - 30 / k, 60 / k, { 'data-chosen': chosen ? '' : null }));
      bars.push(h('span', { class: 'rc-val' + (econ && chg.indexOf('econ') >= 0 ? ' sd-changed' : ''), translate: 'no',
        dataset: { k: 'total' }, 'data-econ': econ ? '' : null,
        style: { left: mid + '%', top: (100 * (1 - d.total / dom.top)) + '%', marginTop: chosen ? '-0.45rem' : null } },
        (econ ? '★ ' : '') + group(As.roundMoney(d.total))));
      xs.push(h('span', { class: 'rc-x', translate: 'no', 'data-chosen': chosen ? '' : null, style: { left: mid + '%' } }, t('cycleN', { n: d.cycle })));
    });
    return frame('€', dom, function (v) { return group(v); }, bars, xs);
  }

  /** Right: ten years of the fleet, each year a cash bar and a cost bar. */
  function fleetChart(s) {
    var ys = s.years, k = ys.length;
    var max = Math.max.apply(null, ys.map(function (r) { return Math.max(r.cash, r.expense + r.staff); }));
    var dom = scale(max / 1000);
    var bars = [], xs = [];
    ys.forEach(function (r, i) {
      var mid = 100 * (i + 0.5) / k, w = 34 / k;
      bars.push(stack([{ k: 'net', v: (r.purchases - r.resale) / 1000 }, { k: 'suprep', v: r.supRep / 1000 }], dom.top, mid - w - 1 / k, w));
      bars.push(stack([{ k: 'capital', v: r.dep / 1000 }, { k: 'suprep', v: r.supRep / 1000 }, { k: 'staff', v: r.staff / 1000 }], dom.top, mid + 1 / k, w));
      bars.push(h('span', { class: 'rc-val', translate: 'no', dataset: { k: 'cash' }, style: { left: (mid - w / 2 - 1 / k) + '%', top: (100 * (1 - r.cash / 1000 / dom.top)) + '%' } },
        group(Math.round(s.shown.cash[i] / 1000))));
      xs.push(h('span', { class: 'rc-x', translate: 'no', style: { left: mid + '%' } }, t('yearN', { n: r.year })));
    });
    return frame(t('thousand'), dom, function (v) { return group(v); }, bars, xs);
  }

  function rows(items, chg) {
    return h('dl', { class: 'rc-rows' }, items.map(function (x) {
      var cls = chg.indexOf(x.k) >= 0 ? 'sd-changed' : null;
      return [h('dt', { class: cls, dataset: { k: x.k } }, x.label), h('dd', { class: cls, translate: 'no', dataset: { k: x.k } }, x.value)];
    }));
  }

  // ── render; the changed marks follow param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.changed(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function render(c) {
    track(c);
    var s = c.state, d = s.chosen;
    var left = h('section', { class: 'rc-panel', dataset: { p: 'econ' } },
      h('div', { class: 'rc-head' }, h('h2', { class: 'rc-title' }, t('econTitle')), h('p', { class: 'rc-line' }, t('econLine'))),
      econChart(s, chg),
      rows([
        { k: 'capital', label: t('rowCapital'), value: money(d.capital) },
        { k: 'suprep', label: t('rowSupRep'), value: money(d.supRep) },
        { k: 'staffAvg', label: t('rowStaff'), value: money(d.staff) },
        { k: 'total', label: t('rowTotal', { years: t.n('nYears', s.p.cycle) }), value: money(d.total) }
      ], chg));
    var right = h('section', { class: 'rc-panel', dataset: { p: 'fleet' } },
      h('div', { class: 'rc-head' }, h('h2', { class: 'rc-title' }, t('fleetTitle')), h('p', { class: 'rc-line' }, t('fleetLine', { n: L.FLEET }))),
      fleetChart(s),
      rows([
        { k: 'cash', label: t('rowCash'), value: money(s.totals.cash) },
        { k: 'expense', label: t('rowExpense'), value: money(s.totals.expense) },
        { k: 'staff', label: t('rowStaffT'), value: money(s.totals.staff) },
        { k: 'ratio', label: t('rowPeak', { k: s.peak.year }), value: t('times', { x: dec(s.peak.ratio, 2) }) }
      ], chg));
    c.stage.replaceChildren(h('div', { class: 'rc' },
      h('div', { class: 'rc-panels' }, left, right),
      h('p', { class: 'rc-foot' }, t('illustrative', { n: L.FLEET, p: money(L.PRICE) }))));
  }

  function caption(c) {
    var s = c.state, p = s.p, k = L.captionKey(s);
    var years = function (n) { return t.n('nYears', n); };
    var out = t.parts(k.lead, {
      m: b(p.cohorts === 1 ? t.n('nDevices', L.FLEET) : sizes(s)), c: t.n('nCohorts', p.cohorts),
      every: t.n('everyN', p.cycle), years: b(years(p.cycle))
    });
    out.push(' ');
    out = out.concat(t.parts(k.econ, {
      x: b(money(s.chosen.total)), e: years(s.econ), d: b(money(s.excess)), f: b(money(s.excessFleet))
    }));
    out.push(' ');
    var dep = money(s.years[0].dep);
    out = out.concat(t.parts(k.cash, {
      x: b(money(s.peak.cash)), ys: list(s.wallYears.map(function (y) { return t('yearN', { n: y }); })),
      r: b(t('times', { x: dec(s.peak.ratio, 1) })), dep: b(dep)
    }));
    out.push(' ');
    out = out.concat(t.parts(k.note, { e: years(s.econ), alt: b(years(s.econAlt)) }));
    return out;
  }

  var labels = { wall: 'pWall', staggered: 'pStaggered', stretched: 'pStretched', budget: 'pBudget', slow: 'pSlow' };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'cycle', type: 'range', label: t('cycle'), min: L.CYCLE_MIN, max: L.CYCLE_MAX, step: 1, format: function (v) { return t.n('nYears', v); } },
      { key: 'cohorts', type: 'range', label: t('cohorts'), min: 1, max: function (p) { return p.cycle; }, step: 1,
        format: function (v) { return v === 1 ? t('cohortsAll') : t.n('nCohorts', v); } },
      { key: 'slow', type: 'range', label: t('slow'), hint: t('slowHint'), min: 0, max: L.SLOW_MAX, step: L.SLOW_STEP,
        format: function (v) { return t('slowFmt', { h: dec(v, 1) }); },
        disabled: function (p) { return p.staff ? false : t('slowOff'); } },
      { key: 'staff', type: 'toggle', label: t('staff') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'rc-capital', label: t('legCapital') },
      { shape: 'rc-net', label: t('legNet') },
      { shape: 'rc-suprep', label: t('legSupRep') },
      { shape: 'rc-staff', label: t('legStaff') },
      { shape: 'rc-chosen', label: t('legChosen') },
      { shape: 'rc-econ', label: t('legEcon') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
