<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // ── numbers in the page's language ──

  function dec(x, d) {
    var s = x.toFixed(d);
    if (d > 0) s = s.replace(/\.?0+$/, '');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  /** MiB: GiB from 1024 up (two decimals), one decimal below. */
  function mib(x) {
    if (x >= 1024 - 1e-9) return dec(x / 1024, 2) + ' ' + t('uGiB');
    return dec(x, 1) + ' ' + t('uMiB');
  }
  function fixed2(x) { var v = x.toFixed(2); return Simdeck.lang === 'hr' ? v.replace('.', ',') : v; }
  function rate(x) { return dec(x, 0) + ' ' + t('uMiBs'); }
  /** dataset without the empty keys (Simdeck.h would write "null") */
  function ds(o) {
    var out = {};
    Object.keys(o).forEach(function (k) { if (o[k] != null && o[k] !== false) out[k] = String(o[k]); });
    return out;
  }
  /** Seconds: ms under 1 s, then two decimals under 10 s (one with coarse), one decimal above. */
  function secs(s, coarse) {
    if (s < 1 - 5e-4) return dec(s * 1000, 0) + ' ' + t('uMs');
    return dec(s, s < 10 && !coarse ? 2 : 1) + ' ' + t('uS');
  }
  function ms(x) { return secs(x / 1000, true); }
  function data(text) { return h('span', { translate: 'no' }, String(text)); }

  // ── the source grid (K3), the link and the destination ──

  var KIND = {
    todo: { kind: 'ghost' },
    clean: { kind: 'fill', c: 3 },
    dirty: { kind: 'soft', c: 2 },
    paused: { kind: 'fill', c: 8, text: '‖' }
  };

  function source(s, p, dir) {
    var g = s.grid;
    var n = s.rounds.length;
    var cells = g.cells.map(function (k) { return Object.assign({}, KIND[k]); });
    var rows = Simdeck.blockGrid.split({ id: 'mem', cells: cells, brackets: [{ from: 0, len: g.wsCells, label: t('wsBracket') }] }, g.cols);
    rows.forEach(function (r, i) {
      r.label = i ? mib(i * g.cols * g.cellMiB) : '0';
      if (r.brackets && !r.brackets.length) delete r.brackets;   // split gives every piece a list; only the bracket's rows need a band
    });
    var count;
    if (s.view === 0) count = t('gridAll', { mib: mib(s.memMiB) });
    else if (!s.paused) count = t('gridDirty', { mib: mib(s.rounds[s.view - 1].dirtiedMiB), k: s.view });
    else count = t('gridPaused', { mib: mib(s.remainingMiB) });
    var line;
    if (!s.paused) {
      var r = s.rounds[s.view];
      line = [t.parts('roundLine', { k: h('b', null, String(r.i)), sent: data(mib(r.sentMiB)), sec: data(secs(r.seconds)), dirty: data(mib(r.dirtiedMiB)) })];
      if (r.throttlePct > 0) line.push(' ', t('roundThrottle', { thr: r.throttlePct }));
    } else {
      line = [t.parts('pauseLine', { rem: data(mib(s.remainingMiB)), dt: h('b', null, ms(s.downtimeMs)) })];
    }
    return Simdeck.blockGrid({
      dir: dir,
      title: t('src'),
      meta: [t('srcMeta', { m: mib(s.memMiB), w: mib(s.wssMiB) }), t('cellSize', { c: mib(g.cellMiB) })],
      count: { text: count, hl: s.paused },
      rows: rows,
      cellHeight: '1.6rem',
      foot: [h('p', { class: 'lm-roundline' }, line)]
    });
  }

  function link(p) {
    return h('div', { class: 'lm-link' },
      h('div', { class: 'lm-link-bw' }, rate(p.bwMiBs)),
      h('div', { class: 'lm-link-line', 'aria-hidden': 'true' }, h('span'), h('span', null, '▶')),
      h('div', { class: 'lm-link-label' }, t('link')));
  }

  function destination(s) {
    var sent = 0;
    for (var i = 0; i < s.view; i++) sent += s.rounds[i].sentMiB;
    if (s.paused) sent += s.remainingMiB;
    return h('section', { class: 'lm-dst' },
      h('h3', null, t('dst')),
      h('div', { class: 'lm-vm', dataset: { on: s.paused ? 'yes' : 'no' } }, s.paused ? '▶ ' + t('vm') : t('vm')),
      s.paused ? [h('p', null, t('pausedFor', { dt: ms(s.downtimeMs) })), h('p', null, t('runsOnDst'))] : h('p', null, t('runsOnSrc')),
      h('p', { class: 'lm-recv' }, t('received', { mib: mib(sent) })));
  }

  // ── the round chart ──

  function chart(s) {
    var n = s.rounds.length;
    var bars = s.rounds.map(function (r) { return { mib: r.sentMiB, k: 'round', i: r.i }; });
    bars.push({ mib: s.remainingMiB, k: 'pause', i: n });
    // the scale: the largest round after round 0, the pause and the limit, so round 0 (often far larger) is cut off
    var top = Math.max(s.limitMiB, s.remainingMiB, 1);
    for (var j = 1; j < n; j++) top = Math.max(top, s.rounds[j].sentMiB);
    top *= 1.12;
    var every = bars.length <= 16 ? 1 : 5;
    var cols = bars.map(function (b, k) {
      var cut = b.mib > top;
      var hgt = Math.min(1, b.mib / top) * 100;
      var sel = k === s.view;
      // the pause's label gives way to the selected round's when they stand side by side (the card has the downtime)
      var showVal = sel || cut || (b.k === 'pause' && s.view !== n - 1);
      // the value, and for the selected round and the pause its duration
      var val = b.k === 'pause' ? mib(b.mib) + ' · ' + ms(s.downtimeMs) : sel ? mib(b.mib) + ' · ' + secs(s.rounds[k].seconds) : mib(b.mib);
      return h('div', { class: 'lm-col', dataset: ds({ sel: sel, end: k === bars.length - 1 ? 'r' : k === 0 ? 'l' : null }) },
        h('div', { class: 'lm-bar', dataset: ds({ k: b.k, cut: cut }), style: { height: hgt + '%' } }),
        showVal ? h('span', { class: 'lm-val', translate: 'no', style: { bottom: 'calc(' + hgt + '% + 0.25rem)' } }, val) : null);
    });
    var axis = bars.map(function (b, k) {
      var label = b.k === 'pause' ? '‖' : k % every === 0 || k === s.view ? String(b.i) : '';
      return h('span', { translate: 'no', dataset: ds({ sel: k === s.view }) }, label);
    });
    var limitAt = s.limitMiB / top * 100;
    return h('section', { class: 'lm-chart' },
      h('div', { class: 'lm-chead' }, h('h3', null, t('chart')),
        h('span', { class: 'lm-limit-key' }, h('span', { class: 'sd-swatch', dataset: { shape: 'lm-limit' } }),
          t('limitLine', { mib: mib(s.limitMiB), ms: ms(params().downtimeMs), b: rate(params().bwMiBs) }))),
      h('div', { class: 'lm-plot' }, cols, h('div', { class: 'lm-limit', style: { bottom: limitAt + '%' } })),
      h('div', { class: 'lm-axis' }, axis),
      h('div', { class: 'lm-axis-name' }, t('axisRound'), ' · ‖ ', t('pauseMark')));
  }

  // ── the result card ──

  function card(s, chg) {
    var on = function (k) { return chg.indexOf(k) >= 0 ? 'sd-changed' : null; };
    var conv = s.outcome === 'converged';
    return h('section', { class: 'lm-card' },
      h('h3', null, t('result')),
      h('div', { class: 'lm-out ' + (on('outcome') || ''), dataset: { k: s.outcome } }, conv ? '✓ ' : '✗ ', t(conv ? 'outConverged' : 'outForced')),
      h('dl', null,
        h('dt', null, t('rRounds')), h('dd', { class: on('rounds'), translate: 'no' }, String(s.rounds.length)),
        h('dt', null, t('rTotal')), h('dd', { class: on('total') }, secs(s.totalS)),
        h('dt', null, t('rDowntime')), h('dd', { class: on('downtime') }, ms(s.downtimeMs)),
        h('dd', { class: 'lm-sub' }, t('rLimit', { lim: ms(params().downtimeMs) })),
        h('dt', null, t('rRatio')), h('dd', { class: on('ratio'), translate: 'no' }, fixed2(s.ratio)),
        h('dd', { class: 'lm-sub' }, s.ratio < 1 ? '↓ ' : '= ', t(s.ratio < 1 ? 'rRatioShrinks' : s.throttlePct > 0 && s.outcome === 'converged' ? 'rRatioUnthrottled' : 'rRatioGrows')),
        h('dt', null, t('rThrottle')), h('dd', { class: on('throttle'), translate: 'no' }, s.throttlePct + '\u00a0%')));
  }

  // ── render; the changed marks follow param changes, not the round slider ──

  var cur = null, lastKey = null, lastState = null, chg = [], views = 1;
  function params() { return cur; }
  function track(c) {
    var p = Object.assign({}, c.params);
    delete p.round;
    var key = JSON.stringify(p);   // not the preset: moving the round slider deselects it but changes no result
    if (key !== lastKey) {
      chg = lastState ? L.changed(lastState, c.state) : [];
      lastKey = key;
      lastState = c.state;
    }
  }

  function render(c) {
    cur = c.params;
    views = c.state.rounds.length;
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'lm' },
      h('div', { class: 'lm-top' }, source(s, c.params, c.dir), link(c.params), destination(s)),
      h('div', { class: 'lm-bottom' }, chart(s), card(s, chg))));
  }

  function caption(c) {
    var k = L.captionKey(c.state);
    var p = c.params;
    var out = [t(k.key, {
      d: dec(p.dirtyMiBs, 0), b: dec(p.bwMiBs, 0), ratio: fixed2(k.ratio), rounds: t.n('nRounds', k.n),
      rem: mib(k.rem), lim: ms(p.downtimeMs), dt: ms(k.dt), w: mib(k.w), thr: k.thr
    })];
    if (k.thr > 0 && k.key !== 'cThrottled') out.push(' ', t('cThrottleNote', { thr: k.thr }));
    return out;
  }

  var labels = {
    '10gbe-converges': 'p10gbe', '1gbe-busy': 'p1gbeBusy', 'dirty-faster': 'pDirtyFaster',
    'auto-converge': 'pAutoConverge', '1gbe-quiet': 'p1gbeQuiet'
  };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'dirtyMiBs', type: 'range', label: t('dirtyMiBs'), min: 0, max: 1500, step: 10, format: rate },
      { key: 'bwMiBs', type: 'range', label: t('bwMiBs'), min: 10, max: 2000, step: 10, format: rate },
      { key: 'memGiB', type: 'range', label: t('memGiB'), min: 1, max: 64, step: 1, format: function (v) { return v + ' ' + t('uGiB'); } },
      { key: 'wssMiB', type: 'range', label: t('wssMiB'), min: 64, max: 8192, step: 64, format: function (v) { return mib(v); } },
      { key: 'downtimeMs', type: 'range', label: t('downtimeMs'), min: 50, max: 2000, step: 10, format: function (v) { return ms(v); } },
      { key: 'maxRounds', type: 'range', label: t('maxRounds'), min: 5, max: 50, step: 1 },
      { key: 'autoConverge', type: 'toggle', label: t('autoConverge') },
      { key: 'round', type: 'range', label: t('round'), min: 0, max: function (p) { return L.lastView(p); }, step: 1,
        format: function (v) { return v >= views ? t('roundPause') : t('roundN', { k: v }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'bg-ghost', label: t('legTodo') },
      { shape: 'bg-fill', c: 3, label: t('legClean') },
      { shape: 'bg-soft', c: 2, label: t('legDirty') },
      { shape: 'lm-paused', label: t('legPaused') },
      { shape: 'lm-bar', label: t('legRound') },
      { shape: 'lm-limit', label: t('legLimit') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
