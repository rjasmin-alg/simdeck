<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Tablica MAC adresa</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { A: '1', B: '2', C: '3' };

  function data(text) { return h('b', { translate: 'no' }, text); }
  // t.parts puts the same node at every use of a placeholder, and a node can stand in one place only: copy repeats.
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) !== -1) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function host(x) { return h('b', { translate: 'no', class: 'sd-ink', dataset: { c: COLOUR[x] } }, x); }

  /** The role of each host in the current step: what the frame does to it. */
  function roleOf(s, x) {
    if (s.phase === 'idle') return null;
    if (x === s.src) return 'sends';
    if (s.phase === 'learn') return null;
    var p = L.port[x];
    if (s.out.indexOf(p) === -1) return 'nothing';
    if (s.action === 'forward') return 'gets';
    return x === s.dst ? 'getsCopy' : 'bystander';
  }

  function topology(s, c) {
    var frame = s.phase === 'idle'
      ? h('div', { class: 'mt-frame mt-none' }, t('frameNone'))
      : h('div', { class: 'mt-frame' }, parts('frameLine', { k: data(String(s.frame)), dst: host(s.dst), src: host(s.src) }));
    var ports = L.hosts.map(function (x) { return h('div', { class: 'mt-port', translate: 'no' }, String(L.port[x])); });
    var links = L.hosts.map(function (x) {
      var p = L.port[x], cls = '', label = null;
      if (s.phase !== 'idle' && x === s.src) { cls = 'mt-in'; label = '↑ ' + t('linkIn'); }
      else if (s.phase === 'decide' && s.out.indexOf(p) !== -1) {
        cls = s.action === 'forward' ? 'mt-fwd' : 'mt-copy';
        label = '↓ ' + t(s.action === 'forward' ? 'linkForward' : 'linkCopy');
      }
      var anim = cls && c.dir === 'forward' && (s.phase === 'learn' ? x === s.src : x !== s.src) ? ' sd-anim-in' : '';
      return h('div', { class: 'mt-link ' + cls + anim }, label ? h('span', null, label) : null);
    });
    var hosts = L.hosts.map(function (x) {
      var role = roleOf(s, x);
      var cls = role === 'sends' || role === 'gets' ? ' mt-active' : role === 'getsCopy' || role === 'bystander' ? ' mt-copyhost' : role === 'nothing' ? ' mt-idlehost' : '';
      var roleKey = { sends: 'roleSends', gets: 'roleGets', getsCopy: 'roleGetsCopy', bystander: 'roleBystander', nothing: 'roleNothing' }[role];
      return h('div', { class: 'mt-host' + cls },
        h('b', { class: 'sd-fill', dataset: { c: COLOUR[x] }, translate: 'no' }, x),
        h('small', null, t('portN', { port: L.port[x] })),
        h('div', { class: 'mt-role' }, roleKey ? t(roleKey) : ''));
    });
    return h('div', { class: 'mt-topo' },
      frame,
      h('div', { class: 'mt-switch' }, h('div', { class: 'mt-switch-name' }, t('switchName')), h('div', { class: 'mt-row' }, ports)),
      h('div', { class: 'mt-row' }, links),
      h('div', { class: 'mt-row' }, hosts));
  }

  function table(s) {
    var body;
    if (!s.table.length) body = h('p', { class: 'mt-empty' }, t('tableEmpty'));
    else {
      var head = h('tr', null, h('th', null, t('colMac')), h('th', null, t('colPort')), h('th', null, t('colTime')));
      var rows = s.table.map(function (r) {
        var cls = r.mac === s.changed ? 'sd-changed' : s.phase === 'decide' && s.action === 'forward' && r.mac === s.dst ? 'mt-hit' : null;
        return h('tr', { class: cls },
          h('td', { class: 'mt-mono' }, host(r.mac)),
          h('td', { class: 'mt-mono' }, data(String(r.port))),
          h('td', null, r.time ? t('timeFrame', { k: r.time }) : t('timeEarlier')));
      });
      body = h('table', { class: 'mt-table' }, h('thead', null, head), h('tbody', null, rows));
    }
    var look;
    if (s.phase === 'decide') {
      look = s.action === 'forward'
        ? h('div', { class: 'mt-lookup' }, parts('lookupFound', { dst: host(s.dst), port: data(String(s.out[0])) }))
        : h('div', { class: 'mt-lookup mt-miss' }, parts('lookupMissing', { dst: host(s.dst) }));
    } else look = h('div', { class: 'mt-lookup mt-later', 'aria-hidden': 'true' }, t('lookupMissing', { dst: 'A' }));
    return h('div', { class: 'mt-tab' }, h('h2', null, t('tableTitle')), body, look);
  }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: {} },
    { id: 'learn', label: t('presetLearn'), hint: t('presetLearnHint'), params: { knowC: false } },
    { id: 'reply', label: t('presetReply'), hint: t('presetReplyHint'), params: { pair: 'B-C', knowC: false } },
    { id: 'source', label: t('presetSource'), hint: t('presetSourceHint'), params: { knowA: true, knowC: false } }
  ];

  var params = [
    { key: 'pair', type: 'select', label: t('pair'), options: L.pairs.map(function (pr) {
      var ab = pr.split('-');
      return [pr, t('pairOption', { src: ab[0], dst: ab[1] })];
    }) },
    { key: 'knowA', type: 'toggle', label: t('knowA') },
    { key: 'knowB', type: 'toggle', label: t('knowB') },
    { key: 'knowC', type: 'toggle', label: t('knowC') }
  ];

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: presets,

    legend: [
      { shape: 'hollow', label: t('legendCopy') },
      { shape: 'hl', label: t('legendNew') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'mt' }, topology(c.state, c), table(c.state)));
    },

    caption: function (c) {
      var s = c.state;
      if (s.phase === 'idle') {
        var ab = c.params.pair.split('-');
        var v = { src: host(ab[0]), dst: host(ab[1]) };
        if (!s.table.length) return parts('captionIdleEmpty', v);
        var known = [];
        s.table.forEach(function (r, i) {
          if (i) known.push(t('listAnd'));
          known = known.concat(parts('knownItem', { mac: host(r.mac), port: data(String(r.port)) }));
        });
        return parts('captionIdle', Object.assign(v, { known: h('span', null, known) }));
      }
      if (s.phase === 'learn') {
        return parts(s.learned === 'new' ? 'captionLearnNew' : 'captionLearnRefresh',
          { k: data(String(s.frame)), src: host(s.src), port: data(String(s.inPort)) });
      }
      var out;
      if (s.action === 'forward') out = parts('captionForward', { dst: host(s.dst), port: data(String(s.out[0])) });
      else {
        var by = L.hosts.filter(function (x) { return x !== s.src && x !== s.dst; })[0];
        out = parts(L.lookup(s.table, by) ? 'captionFloodKnown' : 'captionFlood',
          { dst: host(s.dst), 'in': data(String(s.inPort)), by: host(by) });
      }
      if (c.last) out = out.concat([' '], parts('captionDone', { a: host(s.src), b: host(s.dst) }));
      return out;
    }
  });
})();
</script>
</body>
