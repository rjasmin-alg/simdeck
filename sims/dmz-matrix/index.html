<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  /** Data (addresses, services, test ids) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { class: 'dm-mono' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  function zn(z) { return t('zone_' + z); }
  function list(items) {
    if (items.length <= 1) return items.join('');
    return t('list2', { a: items.slice(0, -1).join(t('listSep')), b: items[items.length - 1] });
  }

  // ── "changed" marks: compare with the state shown before the last param change ──
  var shownKey = null, shownState = null, base = null, pending = null, toggled = null, refocus = null, mounted = false;
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== shownKey) {
      // while mounting, the kit renders a link's preset and then its params: nothing has changed yet
      base = mounted ? shownState : null; shownKey = key; shownState = c.state;
      // a chip click names its cell; any other change (a preset, a toggle, reset) names none
      toggled = pending && pending.key === key ? pending : null;
      pending = null;
    }
  }

  function click(cell, svc, reply) {
    var p = sim.params, k = L.param[cell];
    var patch = {};
    patch[k] = L.toggle(p[k], svc, reply);
    var next = Object.assign({}, p, patch);
    var on = reply ? L.unmask(patch[k]).replies.indexOf(svc) >= 0 : L.unmask(patch[k]).services.indexOf(svc) >= 0;
    pending = { key: JSON.stringify(next), cell: cell, svc: svc, reply: !!reply, on: on };
    // the stage is rebuilt: a chip pressed with the keyboard gets its focus back (a mouse click never takes it)
    var el = document.activeElement;
    refocus = el && el.classList && el.classList.contains('dm-chip') ? el.dataset.chip : null;
    sim.set(patch);
  }

  // ── scene ──
  function hostLine(id, s) {
    var bad = s.compromised && id === L.attacker;
    return h('div', { class: 'dm-host' + (bad ? ' dm-bad' : '') },
      h('span', null, t('host_' + id), bad ? [' ', h('span', { class: 'dm-tag' }, t('attackerTag'))] : null),
      data(L.hosts[id].ip));
  }
  function zoneBox(z, s) {
    var hosts = Object.keys(L.hosts).filter(function (id) { return L.hosts[id].zone === z; });
    return h('div', { class: 'dm-zone dm-z-' + z, dataset: { z: z } },
      h('div', null, h('b', null, zn(z)), ' ', h('span', { class: 'dm-sub' }, t('zoneSub_' + z))),
      hosts.map(function (id) { return hostLine(id, s); }));
  }
  function scene(s) {
    return h('div', { class: 'dm-scene' },
      zoneBox('inet', s),
      h('div', { class: 'dm-link dm-link-v dm-link-1' }, h('span', null, t('iface', { n: L.ifaces.inet }))),
      h('div', { class: 'dm-fw' }, h('span', null, t('firewall'))),
      h('div', { class: 'dm-link dm-link-2' }, h('span', null, t('iface', { n: L.ifaces.dmz }))),
      zoneBox('dmz', s),
      h('div', { class: 'dm-link dm-link-v dm-link-3' }, h('span', null, t('iface', { n: L.ifaces.lan }))),
      h('div', { class: 'dm-nolink' }, t('noLink')),
      zoneBox('lan', s));
  }

  // ── matrix ──
  function chip(cell, svc, on, reply) {
    var parts = cell.split('>'), vars = { from: zn(parts[0]), to: zn(parts[1]), svc: svc, port: svc.split('/')[1] };
    var title = reply ? t(on ? 'chipReplyOn' : 'chipReplyOff', vars) : t(on ? 'chipOn' : 'chipOff', vars);
    var isNew = toggled && toggled.cell === cell && toggled.svc === svc && toggled.reply === !!reply;
    return h('button', {
      type: 'button', class: 'dm-chip' + (reply ? ' dm-rep' : '') + (isNew ? ' sd-changed' : ''), dataset: { chip: cell + ' ' + svc + (reply ? ' r' : '') },
      'aria-pressed': on ? 'true' : 'false', title: title, 'aria-label': title, translate: 'no',
      onmousedown: function (e) { e.preventDefault(); },
      onclick: function () { click(cell, svc, reply); }
    }, (on ? '✓' : '') + (reply ? '↩' : '') + svc);
  }
  /** The reply entries a cell offers. Stateless: one for each service the reverse cell opens (every service when it
      lists any), and any it already holds. Stateful: only those it holds (they change nothing, but they exist). */
  function replyOffers(s, cell) {
    var parts = cell.split('>'), back = s.cells[parts[1] + '>' + parts[0]], mine = s.replies[cell];
    return L.services.filter(function (svc) {
      if (svc === L.any) return false;
      if (mine.indexOf(svc) >= 0) return true;
      return !s.stateful && (back.indexOf(L.any) >= 0 || back.indexOf(svc) >= 0);
    });
  }
  function matrix(s) {
    var kids = [h('div', { class: 'dm-corner' }, t('corner'))];
    L.zones.forEach(function (z) { kids.push(h('div', { class: 'dm-colh', dataset: { z: z } }, zn(z))); });
    L.zones.forEach(function (from) {
      kids.push(h('div', { class: 'dm-rowh', dataset: { z: from } }, zn(from)));
      L.zones.forEach(function (to) {
        if (from === to) { kids.push(h('div', { class: 'dm-diag' }, h('span', null, t('diagonal')))); return; }
        var cell = from + '>' + to, on = s.cells[cell];
        var chips = L.services.map(function (svc) { return chip(cell, svc, on.indexOf(svc) >= 0, false); });
        replyOffers(s, cell).forEach(function (svc) { chips.push(chip(cell, svc, s.replies[cell].indexOf(svc) >= 0, true)); });
        kids.push(h('div', {
          class: 'dm-cell' + (toggled && toggled.cell === cell ? ' sd-changed' : ''), dataset: { z: from, label: zn(from) + ' → ' + zn(to) }
        }, chips));
      });
    });
    return h('div', { class: 'dm-mx' },
      h('p', { class: 'dm-h' }, t('matrixTitle'), h('small', null, t('matrixHint'))),
      h('div', { class: 'dm-grid' }, kids));
  }

  // ── tests ──
  function seg(cls, head) {
    var a = { class: 'dm-seg' + (cls ? ' ' + cls : '') };
    if (head) a.dataset = { head: head };
    return h('div', a);
  }
  function card(x, ch) {
    var same = x.reason === 'same-zone';
    var track = [
      h('span', { class: 'dm-zb dm-from', dataset: { z: x.from } }, zn(x.from)),
      h('span', { class: 'dm-zb dm-to', dataset: { z: x.to } }, zn(x.to))
    ];
    var verdicts;
    if (same) {
      track.push(h('div', { class: 'dm-same' }));
      verdicts = [h('span', { class: 'dm-v', dataset: { ok: '1' } }, '✓ ' + t('why_same-zone'))];
    } else {
      track.push(h('div', { class: 'dm-wall' }));
      var pass = x.result === 'pass';
      // request, left to right: through the wall, or stopped at it
      track.push(h('div', { style: { gridColumn: '2', gridRow: '1' } }, seg('')));
      track.push(pass ? h('div', { style: { gridColumn: '4', gridRow: '1' } }, seg('', 'r'))
        : h('div', { style: { gridColumn: '4', gridRow: '1' } }, seg('dm-off')));
      if (!pass) track.push(h('span', { class: 'dm-stop', style: { gridColumn: '3', gridRow: '1' } }, '✕'));
      verdicts = [h('span', { class: 'dm-v', dataset: { ok: pass ? '1' : '0' } }, (pass ? '✓ ' : '✕ ') + t('why_' + x.reason))];
      // reply, right to left, dashed
      if (x.reply) {
        var back = x.reply.result === 'pass';
        track.push(h('div', { style: { gridColumn: '4', gridRow: '2' } }, seg('dm-dash')));
        track.push(back ? h('div', { style: { gridColumn: '2', gridRow: '2' } }, seg('dm-dash', 'l'))
          : h('div', { style: { gridColumn: '2', gridRow: '2' } }, seg('dm-off')));
        if (!back) track.push(h('span', { class: 'dm-stop', style: { gridColumn: '3', gridRow: '2' } }, '✕'));
        verdicts.push(h('span', { class: 'dm-v', dataset: { ok: back ? '1' : '0' } }, '↩ ' + (back ? '✓ ' : '✕ ') + t('reply_' + x.reply.reason)));
      }
    }
    return h('div', {
      class: 'dm-row' + (ch.indexOf(x.id) >= 0 ? ' sd-changed' : ''),
      title: t('testTitle', { id: x.id, src: t('host_' + x.src), dst: t('host_' + x.dst), svc: x.service })
    },
      data(x.id, 'dm-id'),
      h('div', { class: 'dm-who' }, h('span', null, t('host_' + x.src) + ' →'), h('span', null, t('host_' + x.dst))),
      data(x.service, 'dm-svc'),
      h('div', { class: 'dm-track' }, track),
      h('div', { class: 'dm-verdicts' }, verdicts));
  }
  function tests(s) {
    var ch = L.changed(base, s);
    return h('div', { class: 'dm-tests' },
      h('p', { class: 'dm-h' }, t(s.compromised ? 'testsAttack' : 'testsTitle')),
      h('div', { class: 'dm-rows' }, s.tests.map(function (x) { return card(x, ch); })));
  }

  // ── caption ──
  function caption(c) {
    var s = c.state, out = [];
    if (toggled) {
      var parts = toggled.cell.split('>'), vars = { from: zn(parts[0]), to: zn(parts[1]), svc: toggled.svc, port: toggled.svc.split('/')[1] };
      // a chip switched off in a cell that still lists any: any keeps allowing it (SPEC tie-break)
      var stillAny = !toggled.on && toggled.svc !== L.any && s.cells[toggled.cell].indexOf(L.any) >= 0;
      if (toggled.reply) {
        out.push(t(stillAny ? 'capReplyStillAny' : toggled.on ? 'capReplyOn' : 'capReplyOff', vars));
        if (s.stateful) out.push(t('capReplyStateful'));
      } else if (toggled.svc === L.any) out.push(t(toggled.on ? 'capAnyOn' : 'capAnyOff', vars));
      else out.push(t(stillAny ? 'capStillAny' : toggled.on ? 'capOn' : 'capOff', vars));
      var ch = L.changed(base, s);
      out.push(ch.length ? t.n('changedSome', ch.length, { list: list(ch) }) : t('changedNone'));
      return out.join(' ');
    }
    var n = L.tally(s);
    if (s.compromised) {
      out.push(t.n('capAttack', n.total, { k: n.ok, n: n.total }), t('capAttackLan'));
    } else {
      out.push(t.n('capSummary', n.ok, { total: n.total }));
      if (n.denied) out.push(t.n('capDenied', n.denied));
    }
    if (n.sameZone) out.push(t.n('capSameZone', n.sameZone));
    if (!s.compromised || !s.stateful) out.push(t(s.stateful ? 'capStateful' : 'capStateless'));
    if (n.noReply) out.push(t.n('capNoReply', n.noReply));
    return out.join(' ');
  }

  var hidden = function () { return false; };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'stateful', type: 'toggle', label: t('stateful'), hint: t('statefulHint') },
      { key: 'compromised', type: 'toggle', label: t('compromised'), hint: t('compromisedHint') }
    ].concat(L.cells.map(function (cell) {
      // the six cells: set by the chips on the stage, hidden here, kept in the URL so a link or a reload keeps them
      return { key: L.param[cell], type: 'range', label: t('cellParam', { cell: cell }), min: 0, max: L.maxCell, step: 1, visible: hidden };
    })),
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'dm-zone', label: t('legZone') },
      { shape: 'dm-on', label: t('legOn') },
      { shape: 'dm-off', label: t('legOff') },
      { shape: 'dm-reply', label: t('legReply') },
      { shape: 'dm-pass', label: t('legPass') },
      { shape: 'dm-drop', label: t('legDrop') },
      { shape: 'dm-state', label: t('legState') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      track(c);
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'dm' }, matrix(s), scene(s), tests(s)));
      if (refocus) {
        var again = c.stage.querySelector('[data-chip="' + refocus + '"]');
        refocus = null;
        if (again) again.focus();
      }
    },
    caption: caption
  });
  mounted = true;
})();
</script>
</body>
</html>
