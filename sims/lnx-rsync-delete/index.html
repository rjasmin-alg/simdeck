<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var CLIENT = 'democli1', SERVER = '192.168.122.57', USER = 'student';
  var FOLD = { paketi: true, 'vjezba-scp': true };      // dirs no scenario works in: drawn folded, with a count

  /** Data (paths, commands, rsync's output) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function sp(parts) { return [' '].concat(parts); }

  /** Caption parts: t.parts (vars may be nodes; [[terms]] in the kit's style), then *English term* in <em lang="en">
      for terms the glossary lacks. */
  function rich(key, vars, n) {
    var v = Object.assign({}, vars || {});
    if (n !== undefined) v.n = n;
    var out = [];
    t.parts(key, v).forEach(function (p) {
      var text = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (text === null) { out.push(p); return; }
      text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }

  function destPath(dest) { return '~/' + (L.DESTS[dest] ? L.DESTS[dest] + '/' : ''); }

  /** The run command of the step, else the next run's (or the last one's), for the target mark. */
  function shownCmd(c) {
    if (c.state.cmd) return { cmd: c.state.cmd, current: true };
    var o = L.norm(c.params), acts = L.SCRIPTS[o.script].acts;
    for (var i = c.n; i < acts.length; i++) if (acts[i].run) return { cmd: L.cmdFor(acts[i], o), current: false };
    for (var j = c.n - 1; j >= 0; j--) if (acts[j].run) return { cmd: L.cmdFor(acts[j], o), current: false };
    return null;
  }

  // ── stage: the command ──

  function cmdLine(cmd, dim) {
    var flags = [h('span', null, 'rsync -av'), cmd.dryRun ? h('span', { class: 'rs-flag' }, 'n') : null];
    if (cmd.delete) flags.push(' ', h('span', { class: 'rs-flag rs-flag-del' }, '--delete'));
    var slash = h('span', { class: 'rs-slash' + (cmd.slash ? '' : ' rs-noslash') }, cmd.slash ? '/' : '·');
    return h('span', { class: 'rs-line' + (dim ? ' rs-dim' : ''), translate: 'no' },
      h('span', { class: 'rs-prompt' }, '[' + USER + '@' + CLIENT + ' ~]$ '), flags, ' ~/vjezba', slash,
      ' ' + USER + '@' + SERVER + ':' + destPath(cmd.dest));
  }

  function commandBar(c) {
    var s = c.state, ev = s.ev, kids = [];
    if (ev && ev.at) kids.push(data(ev.at, 'rs-time'));
    if (ev && ev.kind === 'rm') {
      kids.push(h('span', { class: 'rs-line', translate: 'no' }, h('span', { class: 'rs-prompt' }, '[' + USER + '@' + CLIENT + ' ~]$ '),
        'rm ~/' + ev.path), h('span', { class: 'rs-hint' }, t('evRm')));
    } else if (ev && ev.kind === 'encrypt') {
      kids.push(h('span', { class: 'rs-line', translate: 'no' }, ev.path.replace('vjezba/', '~/vjezba/') + ' → ' + L.base(ev.to)),
        h('span', { class: 'rs-hint rs-bad' }, '⚠ ' + t('evEncrypt')));
    } else if (ev && ev.kind === 'wait') {
      kids.push(h('span', { class: 'rs-hint' }, t('evWait')));
    } else {
      var sc = shownCmd(c);
      if (sc) {
        kids.push(cmdLine(sc.cmd, !sc.current));
        kids.push(h('span', { class: 'rs-hint' }, (sc.current ? '' : t('nextRun') + ' · ') + t(sc.cmd.slash ? 'slashOn' : 'slashOff')));
      }
    }
    return h('div', { class: 'rs-cmd' }, kids);
  }

  // ── stage: the trees ──

  /** Every entry to draw on one side, with its state for this step. */
  function entriesOf(s, side) {
    var map = {}, dry = s.lastRunDry;
    var add = function (p, e, st) { if (!map[p]) map[p] = { kind: e.kind, size: e.size, data: e.data, st: st }; };
    if (side === 'src') {
      Object.keys(s.src).forEach(function (p) { add(p, s.src[p], s.srcChanged.indexOf(p) >= 0 ? 'now' : 'solid'); });
      Object.keys(s.srcGone).forEach(function (p) { add(p, s.srcGone[p], 'gone'); });
      return map;
    }
    Object.keys(s.dst).forEach(function (p) {
      var st = 'solid';
      if (dry && s.would.del.indexOf(p) >= 0) st = 'del';
      else if (dry && s.would.sent.indexOf(p) >= 0) st = 'would';
      else if (!dry && s.changed.indexOf(p) >= 0) st = 'copied';
      add(p, s.dst[p], st);
    });
    Object.keys(s.gone).forEach(function (p) { add(p, s.gone[p], 'gone'); });
    if (dry) {
      if (s.would.created) add(s.would.created, { kind: 'd', size: null, data: null }, 'would');
      s.would.made.forEach(function (p) { add(p, { kind: 'd', size: null, data: null }, 'would'); });
      s.would.sent.forEach(function (p) { add(p, { kind: 'f', size: null, data: null }, 'would'); });
    }
    return map;
  }

  var MARK = { solid: '', now: '', copied: '→', would: '→', del: '✕', gone: '✕' };
  var CLS = { solid: '', now: 'rs-now', copied: 'rs-copied rs-now', would: 'rs-would', del: 'rs-del', gone: 'rs-gone rs-now' };

  function kidsOf(map, dir) {
    return Object.keys(map).filter(function (p) { return p !== dir && p !== '' && L.parent(p) === dir; }).sort();
  }
  function countBelow(map, dir) { return Object.keys(map).filter(function (p) { return p.indexOf(dir + '/') === 0; }).length; }

  function row(map, p, label, opts) {
    var e = map[p], st = e.st;
    var kids = [h('span', { class: 'rs-mark', 'aria-hidden': 'true' }, MARK[st]),
      h('span', { class: 'rs-name' + (e.kind === 'd' ? ' rs-dir' : '') + (opts.target ? ' rs-target' : ''), translate: 'no' }, label)];
    if (e.kind === 'f' && e.size != null) kids.push(data(e.size + ' B', 'rs-size'));
    if (e.data && String(e.data).indexOf('enc:') === 0) kids.push(h('span', { class: 'rs-bad' }, '⚠ ' + t('ruined')));
    if (opts.folded) kids.push(h('span', { class: 'rs-more' }, t.n('folded', opts.folded)));
    if (opts.extra) kids.push(h('span', { class: 'rs-tag' }, t('levelTag')));
    return h('div', { class: 'rs-row ' + CLS[st] }, kids);
  }

  function tree(map, rootPath, rootLabel, target, extraOf) {
    var walk = function (dir) {
      var out = [];
      kidsOf(map, dir).forEach(function (p) {
        var e = map[p], name = L.base(p) + (e.kind === 'd' ? '/' : '');
        var folded = e.kind === 'd' && FOLD[p] ? countBelow(map, p) : 0;
        var extra = e.kind === 'd' && extraOf(p);
        out.push(row(map, p, name, { target: p === target, folded: folded, extra: extra }));
        if (e.kind === 'd' && !FOLD[p] && kidsOf(map, p).length) out.push(h('div', { class: 'rs-sub' + (extra ? ' rs-extra' : '') }, walk(p)));
      });
      return out;
    };
    var rows = walk(rootPath), n = 0;
    (function count(list) { list.forEach(function (x) { if (x.classList.contains('rs-row')) n++; else count(Array.prototype.slice.call(x.children)); }); })(rows);
    return h('div', { class: 'rs-tree' + (n > 15 ? ' rs-dense' : '') }, row(map, rootPath, rootLabel, { target: rootPath === target }), h('div', { class: 'rs-sub' }, rows));
  }

  function panes(c) {
    var s = c.state, sc = shownCmd(c);
    var target = sc ? L.DESTS[sc.cmd.dest] : null;
    var src = h('div', { class: 'rs-pane' },
      h('h3', null, t('srcTitle'), data(USER + '@' + CLIENT, 'rs-host')),
      tree(entriesOf(s, 'src'), L.SRC, '~/vjezba/', null, function () { return false; }));
    var dstMap = entriesOf(s, 'dst');
    var dst = h('div', { class: 'rs-pane' },
      h('h3', null, t('dstTitle'), data(USER + '@' + SERVER, 'rs-host'),
        s.lastRunDry ? h('span', { class: 'rs-stamp' }, h('b', { translate: 'no' }, 'DRY RUN'), h('span', null, t('dryNote'))) : null),
      tree(dstMap, '', '~/', target, function (p) { return L.base(p) === L.SRC; }));
    return [src, h('div', { class: 'rs-arrow', 'aria-hidden': 'true' }, '→'), dst];
  }

  // ── stage: the output ──

  /** The list to print: this step's run, else the last run before it (drawn dimmed). */
  function lastList(c) {
    if (c.state.list.length) return { list: c.state.list, old: false };
    for (var k = c.n - 1; k >= 1; k--) {
      var st = Simdeck.stateAt(L, c.params, k);
      if (st.list.length) return { list: st.list, old: true };
    }
    return null;
  }

  function output(c) {
    var last = lastList(c), lines = [];
    if (last) last.list.forEach(function (line, i) {
      if (i) lines.push('\n');
      if (/^deleting /.test(line)) lines.push(h('span', { class: 'rs-out-del' }, line));
      else if (/^created directory /.test(line)) lines.push(h('span', { class: 'rs-out-mk' }, line));
      else if (/\(DRY RUN\)$/.test(line)) lines.push(line.replace(/ \(DRY RUN\)$/, ' '), h('span', { class: 'rs-out-dry' }, '(DRY RUN)'));
      else lines.push(line);
    });
    return h('div', { class: 'rs-pane rs-out' },
      h('h3', null, t('outTitle')),
      last && last.old ? h('p', { class: 'rs-none' }, t('noRun') + ' ' + t('prevRun')) : null,
      last ? h('pre', { translate: 'no', class: last.old ? 'rs-dim' : null }, lines) : h('p', { class: 'rs-none' }, t('noRun')));
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'rs' },
      commandBar(c),
      h('div', { class: 'rs-body' }, panes(c), output(c))));
  }

  // ── captions ──

  var START = { 'book-slash': 'capStartBook', 'delete-propagates': 'capStartDelete', 'dry-run-first': 'capStartDry',
    'wrong-destination': 'capStartWrong', 'nightly-mirror': 'capStartNightly' };

  function names(paths, rootPath) {
    return data(paths.map(function (p) { return rootPath ? p.slice(rootPath.length + 1) : p; }).join(', '));
  }

  function caption(c) {
    var s = c.state, ev = s.ev, o = L.norm(c.params);
    if (!ev) return rich(START[o.script]);
    if (ev.kind === 'rm') return rich('capRm', { file: code(L.base(ev.path)) });
    if (ev.kind === 'encrypt') return rich('capEncrypt', { t: data(ev.at), file: code(L.base(ev.path)), locked: code(L.base(ev.to)) });
    if (ev.kind === 'wait') {
      var last = shownCmd(c), root0 = last ? L.DESTS[last.cmd.dest] : '';
      var good = Object.keys(s.dst).some(function (p) {
        return L.base(p) === 'a.txt' && s.dst[p].data === 'a' && (!root0 || p.indexOf(root0 + '/') === 0);
      });
      return rich(good ? 'capWaitSaved' : 'capWait', { t: data(ev.at), file: code('a.txt'), locked: code('a.txt.locked') });
    }
    var cmd = s.cmd, root = L.DESTS[cmd.dest];
    if (ev.dry) {
      if (o.script !== 'wrong-destination') return rich('capDry', {}, ev.del);
      var all = Object.keys(s.dst).filter(function (p) { return p; }).length;
      return cmd.slash ? rich('capWrongSlash', { del: data(s.would.del.length), all: data(all) }) : rich('capWrongNoSlash');
    }
    if (ev.del > 0) {
      var top = s.deleted.filter(function (p) { return !s.gone[L.parent(p)]; });
      var goodGone = s.deleted.filter(function (p) { return L.base(p) === 'a.txt'; });
      if (o.script === 'nightly-mirror' && goodGone.length) {
        var res = rich('capNightly', { t: data(ev.at), file: code('a.txt'), locked: code('a.txt.locked') });
        return ev.del > 1 ? res.concat(sp(rich('capAlso', {}, ev.del - 1))) : res;
      }
      return rich('capDeleted', { file: names(top, root) });
    }
    if (ev.made > 0 && cmd.slash && s.created) return rich('capSlash', { root: code(destPath(cmd.dest)) });
    if (ev.made > 0 && !cmd.slash) return rich('capNoSlash', { path: code(destPath(cmd.dest) + L.SRC + '/') });
    if (ev.sent > 0) return rich('capSent', {}, ev.sent);
    var extra = L.run(s.src, s.dst, Object.assign({}, cmd, { delete: true, dryRun: true }), s.clock).del;
    if (extra.length) return rich('capKept', { file: names(extra, root) });
    return rich('capNothing');
  }

  // ── mount ──

  function fixed(key) {
    return function (p) { return L.fixedFlags(L.norm(p).script).indexOf(key) >= 0 ? t('fixedBy') : false; };
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      // the scenario is chosen with the presets; the select is hidden so the panel fits with three disabled flags
      { key: 'script', type: 'select', label: t('script'), resets: true, visible: function () { return false; }, options: [
        ['book-slash', t('presetSlash')], ['delete-propagates', t('presetDelete')], ['dry-run-first', t('presetDry')],
        ['wrong-destination', t('presetWrong')], ['nightly-mirror', t('presetNightly')]] },
      { key: 'slash', type: 'toggle', label: t('slash'), resets: true, disabled: fixed('slash') },
      { key: 'delete', type: 'toggle', label: t('delete'), resets: true, disabled: fixed('delete') },
      { key: 'dryRun', type: 'toggle', label: t('dryRun'), resets: true, disabled: fixed('dryRun') },
      { key: 'dest', type: 'choice', label: t('dest'), resets: true, disabled: fixed('dest'),
        options: [['rsync', '~/vjezba-rsync/'], ['rsync2', '~/vjezba-rsync2/'], ['home', t('destHome')]] }
    ],

    presets: [
      { id: 'book-slash', label: t('presetSlash'), params: { script: 'book-slash' }, hint: t('presetSlashHint') },
      { id: 'delete-propagates', label: t('presetDelete'), params: { script: 'delete-propagates' }, hint: t('presetDeleteHint') },
      { id: 'dry-run-first', label: t('presetDry'), params: { script: 'dry-run-first', delete: true }, hint: t('presetDryHint') },
      { id: 'wrong-destination', label: t('presetWrong'), params: { script: 'wrong-destination', delete: true, dryRun: true, dest: 'home' }, hint: t('presetWrongHint') },
      { id: 'nightly-mirror', label: t('presetNightly'), params: { script: 'nightly-mirror', delete: true }, hint: t('presetNightlyHint') }
    ],

    legend: [
      { shape: 'hl', label: t('legChanged') },
      { shape: 'rs-solid', label: t('legSolid') },
      { shape: 'rs-copied', label: t('legCopied') },
      { shape: 'rs-dry', label: t('legDry') },
      { shape: 'rs-del', label: t('legDelete') },
      { shape: 'rs-gone', label: t('legGone') },
      { shape: 'rs-level', label: t('legLevel') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
