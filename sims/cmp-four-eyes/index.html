<!-- cmp-four-eyes: a second approval catches a bad request only when the approver is independent and actually looks;
     as the queue grows the time per item falls and approval becomes automatic, so the catch rate drops while the
     record still shows two signatures; reviewing the risky few in depth beats reviewing everything thinly.
     The stage: the record (every request signed twice, the control test passes) beside two bars (the same requests
     and draws reviewed evenly and by risk) and the minutes per request; the approver's hour a day, split over the
     queue; a month of one team's requests, one tile each: shape for the risk, fill for how it was reviewed, ✓ or ✕
     for a bad one rejected or approved.
     Stream, minutes, look and record: approval.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var M = window.SimdeckModels['approval-queue'];
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';

  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function int(x) { return new Intl.NumberFormat(LOCALE).format(x); }
  function pct(x) {
    var v = x * 100;
    return new Intl.NumberFormat(LOCALE, { maximumFractionDigits: v > 0 && v < 10 && v !== Math.round(v) ? 1 : 0 }).format(v) + ' %';
  }
  /** Minutes as words: under a minute in whole seconds, otherwise minutes with at most one decimal. */
  function mins(m) {
    if (m < 1) return t('sec', { s: int(Math.round(m * 60)) });
    return t('min', { m: new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 1 }).format(m) });
  }

  var sim = null;
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = false;                                // after a keyboard press, focus goes back to the button
  function newStream() { sim.set({ seed: L.nextSeed(sim.params.seed) }); }

  // ── the numbers ──

  function bar(on, label, k, total, share) {
    return h('div', { class: 'fe-bar', dataset: { on: String(on) } },
      h('span', { class: 'fe-blabel' }, label),
      h('span', { class: 'fe-track', 'aria-hidden': 'true' },
        h('span', { class: 'fe-fill', style: { width: (k / total * 100) + '%' } }),
        h('span', { class: 'fe-exp', style: { left: Math.min(100, share * 100) + '%' } })),
      h('span', { class: 'fe-btext fe-num' }, b(t('barOf', { k: int(k), b: int(total) })),
        h('small', null, t('barExp', { e: pct(share) }))));
  }

  function numbers(s) {
    var risk = s.p.policy === 'risk';
    return h('div', { class: 'fe-sum' },
      h('div', { class: 'fe-k fe-rec' }, h('span', null, t('kRecord')),
        b(t('recSigned', { k: int(s.record.signed), n: int(s.record.of) })),
        h('span', { class: 'fe-pass' }, t('recTest')),
        h('small', { class: 'fe-num' }, t('recRejected', { k: int(s.record.rejected) }))),
      h('div', { class: 'fe-bars' },
        bar(!risk, t('barEven'), s.even.caught, s.bad, s.even.expected),
        bar(risk, t('barRisk', { d: pct(s.p.deep) }), s.risk.caught, s.bad, s.risk.expected)),
      h('div', { class: 'fe-k' }, h('span', null, t('kTime')),
        b(t('kAvg', { t: mins(s.average) })),
        h('span', { class: 'fe-ap', dataset: { ind: String(s.p.independent) } }, t(s.p.independent ? 'apInd' : 'apDep')),
        h('button', { type: 'button', class: 'fe-b', onmousedown: noFocus, 'aria-keyshortcuts': 'N', dataset: { sel: 'new' },
          onclick: function (e) { refocus = e.detail === 0; newStream(); } },
          t('newStream'), h('kbd', { 'aria-hidden': 'true' }, 'N'))));
  }

  // ── the approver's hour: one slot per request in a day's queue, as wide as its minutes ──

  function day(s) {
    var load = s.p.load, tm = s.times;
    var nDeep = tm.deep === null ? 0 : tm.perDay, nThin = load - nDeep;
    var slots = [], i;
    function kind(m) { return m < M.GLANCE ? 'stamp' : 'look'; }
    var deepR = nDeep && tm.deep < M.GLANCE ? 'stamp' : 'deep';
    for (i = 0; i < nDeep; i++) slots.push(h('span', { class: 'fe-slot', dataset: { r: deepR }, style: { width: (tm.deep / M.BUDGET * 100) + '%' } }));
    for (i = 0; i < nThin; i++) slots.push(h('span', { class: 'fe-slot', dataset: { r: kind(tm.thin) }, style: { width: (tm.thin / M.BUDGET * 100) + '%' } }));
    var labs = [];
    if (nDeep) labs.push(h('span', { class: 'fe-num', dataset: { r: deepR } }, t(deepR === 'stamp' ? 'dayStamp' : 'dayDeep', { n: int(nDeep), t: mins(tm.deep) })));
    labs.push(h('span', { class: 'fe-num', dataset: { r: kind(tm.thin) } },
      t(kind(tm.thin) === 'stamp' ? 'dayStamp' : 'dayThin', { n: int(nThin), t: mins(tm.thin) })));
    return h('div', { class: 'fe-day' },
      h('p', { class: 'fe-head' }, t('headDay', { l: int(load) })),
      h('div', { class: 'fe-hour', role: 'img', 'aria-label': t('dayLabel', { l: int(load) }) }, slots),
      h('div', { class: 'fe-dlab' }, labs));
  }

  // ── the stream: one tile per request ──

  function stream(s) {
    var tiles = s.items.map(function (x) {
      var r = !x.looked ? 'stamp' : x.deep ? 'deep' : 'look';
      var mark = x.bad ? h('span', { class: 'fe-mark', dataset: { c: x.caught ? 'caught' : 'passed' } }, x.caught ? '✓' : '✕') : null;
      return h('span', { class: 'fe-t', dataset: { high: String(x.high), r: r } }, mark);
    });
    return h('div', { class: 'fe-stream' },
      h('p', { class: 'fe-head' }, t('headGrid', { n: int(M.N), b: int(s.bad) })),
      h('div', { class: 'fe-grid', role: 'img', 'aria-label': t('gridLabel', { b: s.bad, k: s.caught, p: s.passed }) }, tiles));
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement);
    c.stage.replaceChildren(h('div', { class: 'fe' }, numbers(s), day(s), stream(s), h('p', { class: 'fe-foot' }, t('foot'))));
    if (refocus || had) {
      var el = c.stage.querySelector('[data-sel="new"]');
      if (el) el.focus();
    }
    refocus = false;
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var out = t.parts(k.key, {
      l: b(t.n('nReq', s.p.load, { c: int(s.p.load) })),
      t: b(mins(s.times.thin)),
      k: b(int(s.caught)), b: b(int(s.bad)), e: b(pct(s.expected)),
      r: b(int(s.record.signed) + ' / ' + int(s.record.of)),
      d: b(int(s.times.perDay)), td: b(s.times.deep === null ? '' : mins(s.times.deep)), tt: b(mins(s.times.thin)),
      k2: b(int(s.even.caught)), b2: b(int(s.bad))
    });
    k.notes.forEach(function (key) { out.push(' '); out = out.concat(t.parts(key, {})); });
    return out;
  }

  var hidden = function () { return false; };
  var even = function (p) { return p.policy === 'all' ? t('noDeep') : false; };
  var labels = { quiet: 'pQuiet', busy: 'pBusy', colleague: 'pColleague', 'by-risk': 'pByRisk', 'too-deep': 'pTooDeep' };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'policy', type: 'choice', label: t('policy'), options: [['all', t('policyAll')], ['risk', t('policyRisk')]] },
      { key: 'deep', type: 'choice', label: t('deep'), disabled: even, options: M.DEEPS.map(function (x) { return [x, pct(x)]; }) },
      { key: 'load', type: 'choice', label: t('load'), options: M.LOADS.map(function (x) { return [x, int(x)]; }) },
      { key: 'independent', type: 'toggle', label: t('independent') },
      { key: 'seed', type: 'range', label: t('seed'), min: 1, max: L.SEED_MAX, step: 1, visible: hidden }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'fe-risk', label: t('legRisk') },
      { shape: 'fe-routine', label: t('legRoutine') },
      { shape: 'fe-deep', label: t('legDeep') },
      { shape: 'fe-stamp', label: t('legStamp') },
      { shape: 'fe-caught', label: t('legCaught') },
      { shape: 'fe-passed', label: t('legPassed') }
    ],
    keys: [
      { key: 'n', label: t('newStream'), run: function () { newStream(); } }
    ],
    render: render,
    caption: caption
  });
})();
</script>
