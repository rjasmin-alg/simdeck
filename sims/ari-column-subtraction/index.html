<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var PRESET_KEY = { 'zero-top': 'pZero', 'lend-borrow': 'pLend', 'many-zeros': 'pMany', 'smaller-mistake': 'pSmaller',
    'base-2': 'pBin', 'base-16': 'pHex' };
  var MISTAKE_KEY = { none: 'mNone', smaller: 'mSmaller', forget: 'mForget', zero: 'mZero' };
  var MISTAKE_TITLE = { smaller: 'mtSmaller', forget: 'mtForget', zero: 'mtZero' };
  var QUICK = [2, 8, 10, 16];

  var AUDS = P.AUDIENCES;
  var audience = 'teacher';
  var notice = null; // a refused action, said once in the caption

  /** t.parts, but a node that fills two placeholders is cloned for the second ("{t} < {d} … {t} postaje {nt}"):
      the kit's t.parts returns the same node twice, and appending it again would move it. */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }

  // ── numbers as text (data, translate="no") ──
  /** A numeral, with the base as a subscript when it is not 10 (child view: never). */
  function num(text, b) {
    return h('span', { class: 'as-num', translate: 'no' }, String(text), b !== 10 && audience !== 'child' ? h('sub', null, String(b)) : null);
  }
  function plain(text) { return h('span', { class: 'as-num', translate: 'no' }, String(text)); }
  /** A digit of the base: "A (10)" when it is not a decimal digit. */
  function dig(d) { return plain(d >= 10 ? L.DIGITS[d] + ' (' + d + ')' : L.DIGITS[d]); }
  /** A quantity in a column (13, or 19 (25) in base 16): its numeral in the base, the decimal value when it differs. */
  function qtyText(v, b) { var n = L.textOf(v, b); return n === String(v) ? n : n + ' (' + v + ')'; }
  function qty(v, b) { return plain(qtyText(v, b)); }
  function pow(b, k) { return Math.pow(b, k); }
  function named(b, k) { return k === 0 || (b === 10 && k <= 8); }
  /** One unit of place k after "uzimam" / "dodajem" (Croatian accusative); k ≥ 1. */
  function oneOf(b, k) { return named(b, k) ? t('one' + k) : t('oneGen', { v: pow(b, k) }); }
  function units(b, k, n) { return named(b, k) ? t.n('u' + k, n) : t.n('uGen', n, { v: pow(b, k) }); }
  function colName(b, k) { return named(b, k) ? t('col' + k) : t('colGen', { v: pow(b, k) }); }
  function headName(b, k) { return named(b, k) ? t('head' + k) : t('headGen', { v: pow(b, k) }); }

  function placeLabels(b, W) {
    var out = [], titles = [];
    for (var k = 0; k < W; k++) {
      if (b === 10 && k <= 8) { out.push(t('place' + k)); titles.push(k <= 3 ? t('placeName' + k) : t('placeName', { v: pow(b, k) })); }
      else { out.push(P.power(b, k)); titles.push(t('placeName', { v: pow(b, k) })); }
    }
    return { labels: out, titles: titles };
  }

  // ── the two papers (kit view K5): the same columns and rows, so their squares line up ──
  function resultRow(s, plan) {
    return { kind: 'result', rule: true, cells: s.res.map(function (d, k) {
      if (d == null || plan.columns[k].lead) return null;
      return { text: L.DIGITS[d], now: s.phase === 'write' && s.col === k };
    }) };
  }
  function bottomCells(plan, b) {
    return plan.B.map(function (d) { return d == null ? null : L.DIGITS[d]; });
  }

  function paperB(c, plan, pl, band) {
    var s = c.state, prev = c.prev, b = c.params.base;
    var fresh = function (k, i) { return c.n > 0 && prev && prev.hist[k].length <= i && s.hist[k].length > i; };
    var row = function (i) {
      return { kind: i > 0 ? 'carry' : null, cells: s.hist.map(function (hk, k) {
        if (hk.length <= i) return null;
        var crossed = hk.length > i + 1;
        var text = L.textOf(hk[i], b);
        return { text: text, x: crossed, now: !crossed && fresh(k, i), label: i > 0 ? t('cellNew', { v: text }) : null };
      }) };
    };
    return P({
      cols: plan.cols, signs: true, big: audience === 'child', label: t('paperB'),
      places: pl.labels, placeTitles: pl.titles, band: band,
      rows: [row(2), row(1), row(0), { cells: bottomCells(plan, b), sign: '−' }, resultRow(s, plan)]
    });
  }

  function paperE(c, plan, pl, band) {
    var s = c.state, prev = c.prev;
    var fresh = function (arr, k) { return c.n > 0 && prev && !prev[arr][k] && s[arr][k]; };
    var top = plan.A.map(function (d, k) {
      var text = L.DIGITS[d];
      return s.eTop[k] ? { text: text, tag: '1', now: fresh('eTop', k), label: t('cellTop', { v: text }) } : text;
    });
    var bottom = plan.B.map(function (d, k) {
      var text = d == null ? ' ' : L.DIGITS[d];
      if (s.eBot[k]) return { text: text, tag: '+1', now: fresh('eBot', k), label: t('cellBot', { v: d == null ? '0' : text }) };
      return d == null ? null : text;
    });
    return P({
      cols: plan.cols, signs: true, big: audience === 'child', label: t('paperE'),
      places: pl.labels, placeTitles: pl.titles, band: band,
      rows: [{ kind: 'carry', cells: [] }, { kind: 'carry', cells: [] }, { cells: top }, { cells: bottom, sign: '−' }, resultRow(s, plan)]
    });
  }

  function methodBox(m, paper) {
    return h('section', { class: 'as-box as-method', dataset: { m: m } },
      h('div', { class: 'as-head' }, h('span', null, t(m === 'b' ? 'methodB' : 'methodE')),
        audience === 'child' ? null : h('span', { class: 'as-small' }, t(m === 'b' ? 'methodBSub' : 'methodESub'))),
      h('div', { class: 'as-paperbox sd-paper-box' }, paper));
  }

  // ── the why box: borrowing keeps the minuend, equal additions grow both numbers by the same ──
  function whyBox(c, plan) {
    var s = c.state, b = c.params.base;
    var tops = s.hist.map(function (hk) { return hk[hk.length - 1]; });
    var terms = [];
    for (var k = tops.length - 1; k >= 0; k--) {
      var place = b === 10 && k <= 8 ? ' ' + t('place' + k) : ' × ' + pow(b, k);
      terms.push(tops[k] + place);
    }
    var kids = [h('div', { class: 'as-head' }, h('span', null, t('whyTitle')), b !== 10 ? h('span', { class: 'as-small' }, t('whyDecimal')) : null)];
    kids.push(h('p', null, tp('whyB', { sum: plain(terms.join(' + ')), a: plain(plan.a) })));
    var add = 0;
    s.eTop.forEach(function (on, k) { if (on) add += pow(b, k + 1); });
    if (add === 0) kids.push(h('p', null, t('whyENone')));
    else {
      var expr = '(' + plan.a + ' + ' + add + ') − (' + plan.b + ' + ' + add + ') = ' + (plan.a + add) + ' − ' + (plan.b + add);
      kids.push(h('p', null, tp('whyE', { add: plain(add), expr: plain(expr) })));
    }
    if (c.last) kids.push(h('p', { class: 'as-both' }, tp('whyBoth', { res: num(L.textOf(plan.diff, b), b) })));
    return h('section', { class: 'as-box as-why' }, kids);
  }

  // ── the typical mistake, teacher view ──
  function mistakeCard(c, plan) {
    var p = c.params, s = c.state, b = p.base;
    var m = L.mistakeOf(p, p.mistake);
    var result = m.cells.map(function (d, k) {
      if (s.res[k] == null || d == null) return null;
      var text = L.DIGITS[d];
      return m.differs[k] ? { text: text, x: 'wrong', label: t('wrongCell', { w: text }) } : text;
    });
    var paper = P({
      cols: plan.cols, label: t('mtHead'),
      rows: [{ cells: plan.A.map(function (d) { return L.DIGITS[d]; }) }, { cells: bottomCells(plan, b), sign: '−' }, { kind: 'result', rule: true, cells: result }]
    });
    var text = [];
    if (c.last && !m.same) {
      text.push(h('p', { class: 'as-mres' }, h('span', { class: 'as-bad' }, num(m.text, b)), ' ', tp('mtInstead', { res: num(m.rightText, b) })));
    }
    var why;
    if (m.same) why = t(m.kind === 'smaller' ? 'sameSmaller' : m.kind === 'forget' ? 'sameForget' : 'sameZero');
    else if (m.kind === 'smaller') {
      var col = plan.columns.filter(function (x) { return x.top < (x.bottom == null ? 0 : x.bottom); })[0];
      why = tp('whySmaller', {
        rev: plain(qtyText(col.bottom, b) + ' − ' + qtyText(col.top, b)),
        right: plain(qtyText(col.top + b, b) + ' − ' + qtyText(col.bottom, b)) });
    } else if (m.kind === 'forget') why = tp('whyForget', { b: plain(b), over: overNode(m.over, b) });
    else why = tp('whyZero', { n: m.zeros, top: dig(b - 1), lender: m.lender == null ? plain('?') : dig(plan.A[m.lender]), col: m.lender == null ? '?' : colName(b, m.lender), over: overNode(m.over, b) });
    text.push(h('p', { class: 'as-mwhy' }, why));
    return h('section', { class: 'as-box as-mc' },
      h('div', { class: 'as-head' }, h('span', null, t('mtHead')), h('span', { class: 'as-small' }, t(MISTAKE_TITLE[m.kind]))),
      h('div', { class: 'as-paperbox sd-paper-box' }, paper),
      h('div', { class: 'as-mtext' }, text));
  }
  function overNode(v, b) { return b === 10 ? plain(v) : h('span', null, num(L.textOf(v, b), b), ' = ', plain(v)); }

  // ── what the stage shows ──
  function render(c) {
    var p = c.params, s = c.state;
    var b = p.base;
    var plan = L.planOf(p);
    var band = s.phase === 'look' || s.phase === 'write' ? [s.col] : [];
    var low = audience === 'child' ? 'none' : audience === 'teacher' && p.mistake !== 'none' ? 'both' : 'why';
    // each paper gets its own place labels: a label for b ≠ 10 is a node, and a node can be in one place only
    var kids = [methodBox('b', paperB(c, plan, placeLabels(b, plan.cols), band)), methodBox('e', paperE(c, plan, placeLabels(b, plan.cols), band))];
    if (low !== 'none') kids.push(whyBox(c, plan));
    if (low === 'both') kids.push(mistakeCard(c, plan));
    c.stage.replaceChildren(h('div', { class: 'as', dataset: { aud: audience, low: low } }, kids));
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var p = c.params, s = c.state, b = p.base;
    var plan = L.planOf(p);
    var X = audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(tp('cRefused', { b: plain(notice.b), why: notice.why })); notice = null; }
    var resText = function () { return num(L.textOf(plan.diff, b), b); };

    if (s.phase === 'start') {
      add(X === 'A' ? tp('cStartA', { b: plain(b) }) : tp('cStart' + X));
      return out;
    }
    var col = plan.columns[s.col];
    var bo = col.borrow, eq = col.equal, k = s.col;
    var eD = eq.plus ? plain(L.DIGITS[eq.d0] + ' + 1 = ' + qtyText(eq.d, b)) : dig(eq.d);
    if (s.phase === 'look') {
      if (X !== 'C') add(h('b', null, headName(b, k) + ':'));
      // borrowing
      var bArgs = { t: dig(bo.t), d: dig(bo.d), nt: qty(bo.nt, b) };
      if (!bo.need) add(tp('bOk' + X, bArgs));
      else {
        var j = bo.lender;
        var lt = s.hist[j][s.hist[j].length - 2];
        // one of the next place (k + 1) is what reaches this column, whoever lends it
        Object.assign(bArgs, { from: colName(b, j), lt: dig(lt), ln: dig(lt - 1), base: plain(qtyText(b, b)), bm: dig(b - 1),
          oneU: oneOf(b, k + 1), baseU: units(b, k, b), tU: units(b, k, bo.t), ntU: units(b, k, bo.nt) });
        add(tp((bo.zeros.length ? 'bZero' : 'bNeed') + X, bArgs));
      }
      // equal additions
      if (X === 'C' && eq.plus) add(tp('writePlusC', { d0: dig(eq.d0), d: plain(eq.d) }));
      var eArgs = { t: dig(eq.t), d: X === 'C' ? plain(eq.d) : eD, nt: qty(eq.nt, b), base: plain(qtyText(b, b)),
        next: colName(b, k + 1), baseU: units(b, k, b), oneU: oneOf(b, k + 1) };
      add(tp((eq.need ? 'eNeed' : 'eOk') + X, eArgs));
    } else if (s.phase === 'write') {
      var bx = plain(qtyText(bo.nt, b) + ' − ' + qtyText(bo.d, b) + ' = ' + qtyText(col.digit, b));
      var ex = plain(qtyText(eq.nt, b) + ' − ' + qtyText(eq.d, b) + ' = ' + qtyText(col.digit, b));
      if (X === 'C') {
        add(tp('writeBC', { bx: bx }));
        // a leading 0 is not written, so the child does not say "Pišem 0"
        add(tp(col.lead ? 'writeELeadC' : eq.need ? 'writeECarryC' : 'writeEC', { d: plain(eq.d), nt: plain(eq.nt), r: dig(col.digit) }));
        if (col.lead) add(tp('writeLeadC'));
      } else {
        add(tp((col.lead ? 'writeLead' : 'write') + X, { head: headName(b, k), bx: bx, ex: ex, r: dig(col.digit) }));
        if (X === 'T' && p.mistake !== 'none') {
          var m = L.mistakeOf(p, p.mistake);
          if (!m.same && m.differs[k]) add(tp('cMNote', { w: plain(L.DIGITS[m.digits[k]]) }));
        }
      }
    }
    if (c.last) {
      if (X === 'C') addHl(tp('cDoneC', { res: resText() }));
      else {
        addHl(tp('cResultT', { expr: h('span', null, num(L.textOf(plan.a, b), b), ' − ', num(L.textOf(plan.b, b), b)), res: resText() }));
        if (b !== 10) add(tp('cDecimal', { expr: plain(plan.a + ' − ' + plan.b), res: plain(plan.diff) }));
        if (X === 'T' && p.mistake !== 'none') {
          var me = L.mistakeOf(p, p.mistake);
          if (!me.same) add(tp('cMEnd', { wrong: num(me.text, b), res: resText() }));
        }
      }
    }
    return out;
  }

  // ── the panel: the numbers field and the quick bases; the header: the audience switch ──
  var field = null, quick = null;
  function fieldText(p) { return L.numbersOf(p).map(function (v) { return L.textOf(v, p.base); }).join(' − '); }
  function buildNumbers() {
    var host = document.querySelector('[data-as-numbers]');
    var label = h('label', { class: 'sd-ctl-label', for: 'as-nums' }, h('span', null, ''));
    var input = h('input', { id: 'as-nums', type: 'text', class: 'as-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', 'aria-describedby': 'as-nums-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'as-nums-msg', role: 'status' }, t('numsHint'));
    var keyOf = { digit: 'errDigit', long: 'errLong', count: 'errCount', empty: 'errEmpty', order: 'errOrder' };
    function clear() { input.removeAttribute('aria-invalid'); msg.textContent = t('numsHint'); msg.className = 'sd-hint'; }
    input.addEventListener('input', function () {
      var r = L.parseList(input.value, sim.params.base);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t(keyOf[r.error], { at: r.at, b: sim.params.base });
        msg.className = 'as-err';
        return;
      }
      clear();
      sim.set(L.paramsFor(r.values));
      sim.first();
    });
    // Enter or Esc hands the keys back to the clicker
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { clear(); sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('numsTitle') },
      h('div', { class: 'as-field' }, label, input, msg)));
    field = { input: input, label: label.firstChild, msg: msg, clear: clear };
  }
  function buildQuick() {
    var wrap = document.querySelector('[data-sd-controls] [data-key="base"]');
    if (!wrap) return;
    quick = QUICK.map(function (qb) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { pickBase(qb); } }, String(qb)));
    });
    wrap.append(h('div', { class: 'sd-seg as-quick', role: 'group', 'aria-label': t('baseQuick'), title: t('baseHint') }, quick));
  }
  function tooLong(nb, p) {
    var a = L.numbersOf(p)[0];
    return L.digitsOf(a, nb).length > L.MAX_DIGITS ? t('baseTooLong', { b: nb, num: L.textOf(a, p.base) }) : null;
  }
  function pickBase(nb) {
    var why = tooLong(nb, sim.params);
    if (why) { notice = { b: nb, why: why }; sim.render(); return; }
    sim.set({ base: nb });
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    AUDS.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints,
      onChange: function (a) { audience = a; enforceChild(); sim.render(); } });
    audience = ctl.value;
  }
  /** The child view works in base 10 only. */
  function enforceChild() {
    if (audience !== 'child' || sim.params.base === 10) return;
    if (L.fitsIn(L.numbersOf(sim.params), 10)) sim.set({ base: 10 });
    else sim.set(Object.assign(L.paramsFor(L.numbersOf(L.defaults)), { base: 10 }));
  }

  function syncPanel(c) {
    var p = c.params;
    if (field) {
      field.label.textContent = t('numsLabel', { b: p.base });
      var shown = L.parseList(field.input.value, p.base);
      var same = !shown.error && shown.values.join(',') === L.numbersOf(p).join(',');
      // typing keeps its text; a preset or a base change under a focused field rewrites it and clears an error
      if (document.activeElement !== field.input || !same) {
        if (document.activeElement !== field.input || !field.input.getAttribute('aria-invalid')) {
          field.input.value = fieldText(p);
          field.clear();
        }
      }
    }
    if (quick) {
      quick.forEach(function (btn, i) {
        var why = tooLong(QUICK[i], p);
        btn.setAttribute('aria-pressed', String(p.base === QUICK[i]));
        btn.setAttribute('aria-disabled', why ? 'true' : 'false');
        btn.title = why || '';
      });
    }
  }

  buildAudience();
  buildNumbers();

  var NAMED = { 2: 'baseName2', 8: 'baseName8', 10: 'baseName10', 16: 'baseName16' };
  var hiddenRange = function (key) {
    return { key: key, type: 'range', label: t('numsTitle'), value: L.defaults[key], min: 0, max: L.MAX_VALUE, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'base', type: 'range', label: t('base'), value: L.defaults.base, min: function (p) { return Math.min(L.MAX_BASE, L.minBase(L.numbersOf(p))); }, max: L.MAX_BASE,
        format: function (v) { return NAMED[v] ? v + ' (' + t(NAMED[v]) + ')' : String(v); },
        visible: function () { return audience !== 'child'; } },
      { key: 'mistake', type: 'select', label: t('mistake'), value: L.defaults.mistake,
        options: L.MISTAKES.map(function (m) { return [m, t(MISTAKE_KEY[m])]; }),
        visible: function () { return audience === 'teacher'; } },
      // the numbers: set from the field above, kept here so the URL and the language switch carry them
      hiddenRange('a'), hiddenRange('b')
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    legend: [
      { shape: 'pc-band', label: t('legCol') },
      { shape: 'as-x', label: t('legX') },
      { shape: 'as-tag', label: t('legTag') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
  buildQuick();
  sim.on(function (c) { if (audience === 'child' && c.params.base !== 10) enforceChild(); });
  enforceChild();
  sim.render();
})();
</script>
</body>
</html>
