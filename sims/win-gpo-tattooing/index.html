<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var GPO = 'Quillmoor Desktop', OU = 'OU=Staff', PC = 'PC07', USER = 'ana';
  var POL = L.ITEMS[0], PREF = L.ITEMS[1];
  var PRESET_WORDS = { unlink: 'presetUnlink', 'remove-flag': 'presetRemove', 'user-edit': 'presetEdit', 'apply-once': 'presetOnce', 'policy-locked': 'presetLocked' };
  var EVENT_WORDS = { logon: 'evLogon', unlink: 'evUnlink', refresh: 'evRefresh', unlinkRefresh: 'evUnlinkRefresh', edit: 'evEdit', 'try': 'evTry' };
  var OUT_WORDS = {
    write: 'outWrite', same: 'outSame', overwrite: 'outOverwrite', once: 'outOnce', remove: 'outRemove', tattoo: 'outTattoo',
    none: 'outNone', waits: 'outWaits', blocked: 'outBlocked', open: 'outOpen', untouched: 'outUntouched', userSet: 'outUserSet'
  };
  var COND_WORDS = { policyKey: 'condPolicyKey', outsideKey: 'condOutside', remove: 'condRemove', onceApplied: 'condOnce' };

  /** Data (names, registry paths and values) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sentence(key, vars) { return [' '].concat(rich(key, vars)); }
  function valueText(item, v) { return item.name + ' = ' + v; }
  /** A registry path that breaks only after a backslash. */
  function keyNode(key) {
    var node = h('span', { translate: 'no', class: 'tt-key' });
    key.split('\\').forEach(function (part, i) {
      if (i) node.append('\\', h('wbr'));
      node.append(part);
    });
    return node;
  }
  function ico(i) { return h('span', { class: 'tt-ico', dataset: { i: i }, 'aria-hidden': 'true' }); }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function eventWord(ev) { return ev.kind === 'edit' || ev.kind === 'try' ? t.parts(EVENT_WORDS[ev.kind], { user: data(USER) }) : t(EVENT_WORDS[ev.kind]); }

  // ── top: the GPO and the event strip ──

  function renderTop(c) {
    var s = c.state, p = c.params;
    var script = L.SCRIPTS[p.script];
    var justUnlinked = s.event && (s.event.kind === 'unlink' || s.event.kind === 'unlinkRefresh');
    var gpo = h('section', { class: 'tt-gpo' + (s.linked ? '' : ' tt-off') + (justUnlinked ? ' sd-changed' + anim(c) : '') },
      h('div', { class: 'tt-head' }, h('span', { class: 'tt-kind' }, t('gpoKind')), data(GPO)),
      h('div', { class: 'tt-line' }, t.parts(s.linked ? 'gpoLinked' : 'gpoUnlinked', { ou: data(OU) }), ' · ',
        t.parts('gpoFor', { user: data(USER), pc: data(PC) })));
    var strip = h('ol', { class: 'tt-strip' });
    script.forEach(function (ev, i) {
      if (i) strip.appendChild(h('li', { class: 'tt-arrow', 'aria-hidden': 'true' }, '→'));
      var st = i + 1 < c.n ? 'done' : i + 1 === c.n ? 'now' : 'next';
      strip.appendChild(h('li', { class: 'tt-ev' + (st === 'now' ? ' sd-changed' + anim(c) : ''), dataset: { st: st } },
        h('b', null, t('evTime', { t: ev.t })), h('span', null, eventWord(ev))));
    });
    return h('div', { class: 'tt-top' }, gpo, strip);
  }

  // ── left: the two items, their registry values, what the user sees ──

  function outcome(item, it) {
    if (!it) return null;
    var vars = {};
    if (it.code === 'overwrite' || it.code === 'userSet') {
      vars = { before: data(it.before == null ? '–' : it.before), after: data(it.after == null ? '–' : it.after), user: data(USER) };
    }
    var quiet = it.code === 'waits' || it.code === 'none' || it.code === 'untouched';
    var word = it.code === 'tattoo'
      ? h('span', { class: 'tt-tattoo' }, ico('drop'), t(OUT_WORDS[it.code]))
      : h('span', null, t.parts(OUT_WORDS[it.code], vars));
    return h('div', { class: 'tt-out', dataset: { quiet: String(quiet) } }, '→ ', word);
  }

  function renderItem(c, item) {
    var s = c.state, isPol = item.kind === 'policy';
    var v = s.registry[L.pathOf(item)];
    var it = s.items ? s.items[item.id] : null;
    var changed = it && it.before !== it.after;
    var card;
    if (isPol) {
      card = h('section', { class: 'tt-item' + (s.linked ? '' : ' tt-off') },
        h('div', { class: 'tt-head' }, ico('lock'), t('kindPolicy')),
        h('div', { class: 'tt-line' }, t('polPath')),
        h('p', { class: 'tt-setting' }, t('polSetting'), ': ', h('span', null, t('polState'))));
    } else {
      var f = s.itemFlags;
      var opt = function (on, key) {
        return h('div', { class: 'tt-opt', dataset: { on: String(on) } }, h('span', { class: 'tt-box', 'aria-hidden': 'true' }, on ? '☑' : '☐'), h('span', null, t(key)));
      };
      card = h('section', { class: 'tt-item' + (s.linked ? '' : ' tt-off') },
        h('div', { class: 'tt-head' }, ico('pencil'), t('kindPref')),
        h('div', { class: 'tt-line' }, t('prefPath')),
        h('p', { class: 'tt-setting' }, data(valueText(item, item.value))),
        h('div', { class: 'tt-line' }, t('prefAction'), ' ', data(L.actionOf(f))),
        opt(f.removeWhenNotApplied, 'optRemove'),
        opt(f.applyOnce, 'optOnce'));
    }
    var tattooed = it && it.code === 'tattoo';
    var slot = h('div', { class: 'tt-slot' + (changed ? ' sd-changed' + anim(c) : ''), dataset: { empty: String(v == null) } },
      v == null ? t('noValue') : data(valueText(item, v)),
      tattooed ? h('span', { class: 'tt-tattoo' }, ico('drop')) : null);
    var reg = h('section', { class: 'tt-reg' }, keyNode(item.key), slot, outcome(item, it));
    var sees, seen = it && (it.code === 'blocked' || changed) ? ' sd-changed' + anim(c) : '';
    if (isPol) {
      var blocked = v === item.value;
      sees = h('div', { class: 'tt-sees' + seen, dataset: { ok: String(!blocked) } }, h('span', { class: 'tt-mk', 'aria-hidden': 'true' }, blocked ? '✕' : '✓'),
        h('span', null, t(blocked ? 'cpBlocked' : 'cpOpen')));
    } else {
      sees = h('div', { class: 'tt-sees' + seen, dataset: { ok: 'true' } }, h('span', { class: 'tt-mk', 'aria-hidden': 'true' }, '✎'),
        h('span', null, v == null ? t('proxyDefault') : t.parts('proxyOn', { v: data(v) })));
    }
    var locked = isPol && v === item.value && L.isPolicyKey(item.key);
    var can = isPol && !locked ? null : h('div', { class: 'tt-can' }, t(locked ? 'cannotChange' : 'canChange'));
    var user = h('section', { class: 'tt-user' }, h('h3', null, t.parts('userSees', { user: data(USER) })), sees, can);
    return h('div', { class: 'tt-col' }, card, h('div', { class: 'tt-down' }, t.parts('writesTo', { pc: data(PC) })), reg, user);
  }

  // ── right: the rule table ──

  var ACT_WORDS = ['actWrite', 'actDeleteDefault', 'actTattoo', 'actDelete', 'actTattoo', 'actKeep', 'actWrite'];

  function renderTable(c) {
    var s = c.state;
    var isPass = !!(s.items && s.items.policy.hits);
    var header = !s.event ? t('markStart') : isPass
      ? t.parts('markPass', { time: h('span', null, t('evTime', { t: s.event.t })), event: eventWord(s.event) })
      : t('markNone');
    return Simdeck.ruleTable({
      dir: c.dir,
      mode: 'first',
      className: 'tt-table',
      stickyMark: true,
      title: t('tableTitle'),
      noLabel: t('colItem'),
      columns: [
        { key: 'applies', label: t('colApplies') },
        { key: 'cond', label: t('colCond'), wrap: true }
      ],
      actionLabel: t('colAct'),
      markLabel: header,
      rows: L.ROWS.map(function (r, i) {
        var isPol = r.kind === 'policy';
        var mark = null;
        if (isPass) {
          var hit = s.items[isPol ? 'policy' : 'pref'].hits[i];
          mark = hit === true ? 'win' : hit === false ? 'no' : 'skip';
        }
        return {
          no: h('span', { class: 'tt-rk', 'aria-label': t(isPol ? 'kindPolicy' : 'kindPref') }, ico(isPol ? 'lock' : 'pencil'), data(i + 1)),
          cells: {
            applies: h('span', null, t(r.applies ? 'yes' : 'no')),
            cond: r.cond ? h('span', null, t(COND_WORDS[r.cond])) : '–'
          },
          action: h('span', null, t(ACT_WORDS[i])),
          hit: null,
          mark: mark
        };
      }),
      at: isPass ? 'all' : -1,
      done: isPass,
      changed: false,
      outcome: function (i) {
        var it = s.items[L.ROWS[i].kind === 'policy' ? 'policy' : 'pref'];
        var vars = { before: data(it.before == null ? '–' : it.before), after: data(it.after == null ? '–' : it.after) };
        return h('b', null, t.parts(OUT_WORDS[it.code], vars));
      },
      words: { win: '', skip: t('markSkip') }
    });
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, p = c.params, ev = s.event;
    var pv = data(valueText(POL, 1)), fv = data(valueText(PREF, 1)), fv0 = data(valueText(PREF, 0));
    if (!ev) return rich('capStart', { gpo: data(GPO), user: data(USER), pc: data(PC) });
    var out;
    if (ev.kind === 'logon') {
      out = rich('capLogon', { t: ev.t, pv: pv, fv: fv, key: data(PREF.key) });
      if (p.removeWhenNotApplied) out = out.concat(sentence('capLogonReplace'));
      if (p.applyOnce) out = out.concat(sentence('capLogonOnce'));
      return out;
    }
    if (ev.kind === 'unlink') return rich('capUnlink', { t: ev.t, pc: data(PC) });
    if (ev.kind === 'edit') return rich('capEdit', { t: ev.t, user: data(USER), fv0: fv0, pv: pv });
    if (ev.kind === 'try') return rich('capTry', { t: ev.t, user: data(USER), fv0: fv0 });
    var joint = ev.kind === 'unlinkRefresh';
    out = joint ? rich('capUnlinkRefresh', { t: ev.t }) : rich('capRefreshAt', { t: ev.t });
    var pref = s.items.pref;
    if (!s.linked) {
      if (!joint) out = out.concat(sentence('capUnlinked'));
      out = out.concat(sentence(pref.code === 'remove' ? 'capRemoved' : 'capTattoo', { fv: fv, name: data(PREF.name) }));
      return out.concat(sentence('capCpBack'));
    }
    if (pref.code === 'once') return out.concat(sentence('capOnce', { name: data(PREF.name) }));
    out = out.concat(sentence('capOverwrite'), sentence('capOverwriteWhy'));
    if (p.removeWhenNotApplied) out = out.concat(sentence('capOverwriteReplace'));
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'script', type: 'select', label: t('script'), resets: true,
        options: [['unlink', t('scrUnlink')], ['unlinkAtRefresh', t('scrUnlinkAtRefresh')], ['edit', t('scrEdit')], ['try', t('scrTry')]] },
      { key: 'removeWhenNotApplied', type: 'toggle', label: t('removeWhenNotApplied'), hint: t('removeHint'), resets: true },
      { key: 'applyOnce', type: 'toggle', label: t('applyOnce'), resets: true }
    ],

    presets: L.presets.map(function (pr) {
      var w = PRESET_WORDS[pr.id];
      return { id: pr.id, label: t(w), params: pr.params, hint: t(w + 'Hint') };
    }),

    legend: [
      { shape: 'tt-lock', label: t('legPolicy') },
      { shape: 'tt-pencil', label: t('legPref') },
      { shape: 'tt-drop', label: t('legTattoo') },
      { shape: 'tt-empty', label: t('legEmpty') },
      { shape: 'rt-win', label: t('legWin') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'tt' }, renderTop(c),
        h('div', { class: 'tt-items' }, renderItem(c, POL), renderItem(c, PREF)), renderTable(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
