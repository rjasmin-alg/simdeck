<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var DAY = L.DAY, HOUR = L.HOUR, MIN = L.MIN;
  var HR = Simdeck.lang === 'hr';
  var LANE_C = { cron: '2', timer: '1' };
  var LANE_SW = { cron: 'var(--c2)', timer: 'var(--c1)' };

  /** Data (unit names, directives, timestamps, fields, commands) never gets translated. */
  function data(text, cls) { return h('span', { class: 'tc-mono' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  /** t.parts with the values in `d` wrapped as data and the others (words, phrases) left as nodes or text. */
  function parts(key, d, w) {
    var out = {};
    Object.keys(d || {}).forEach(function (k) { out[k] = typeof d[k] === 'object' ? d[k] : data(d[k]); });
    Object.keys(w || {}).forEach(function (k) { out[k] = w[k]; });
    return [].concat(t.parts(key, out));
  }
  function has(c, key) { return c.state.changed.indexOf(key) >= 0; }

  // ── times in the page's language ──

  function two(n) { return (n < 10 ? '0' : '') + n; }
  /** 8:00 in Croatian, 08:00 in English; seconds only when there are any. */
  function timeOf(x) {
    var r = ((x % DAY) + DAY) % DAY, hh = Math.floor(r / HOUR), mm = Math.floor(r % HOUR / MIN), ss = r % MIN;
    return (HR ? String(hh) : two(hh)) + ':' + two(mm) + (ss ? ':' + two(ss) : '');
  }
  function civ(x) { return L.civil(L.dayOf(x)); }
  function dateOf(x) { var c = civ(x); return t('dateShort', { d: t('d' + c.dow), dom: c.dom, mon: t('mon_' + c.m) }); }
  function dateTimeOf(x) { return t('dateTime', { date: dateOf(x), time: timeOf(x) }); }
  function onDayAt(x) { return t('onDayAt', { day: t('da' + civ(x).dow), time: timeOf(x) }); }
  function delayText(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m ? t('delayMS', { m: m, s: s }) : t('delayS', { s: s }); }
  function maxDelay(s) { return L.job(s, 'timer').delay / HOUR + ' h'; }

  // ── timeline ──

  function pctOf(s) { return function (x) { return Math.max(0, Math.min(100, (x - s.start) / (s.end - s.start) * 100)) + '%'; }; }

  function axisRow(s, pct) {
    var out = [];
    var d0 = Math.floor(s.start / DAY), d1 = Math.ceil(s.end / DAY);
    var many = d1 - d0 > 10;
    for (var d = d0; d < d1; d++) {
      var a = Math.max(s.start, d * DAY), b = Math.min(s.end, (d + 1) * DAY);
      if (d * DAY > s.start) out.push(h('span', { class: 'tc-midnight', style: { left: pct(d * DAY) } }));
      var c = L.civil(d);
      if (b - a < DAY / 3) continue;
      if (many && c.dow !== 0 && c.dom !== 1) continue;
      var today = L.dayOf(s.now) === d;
      out.push(h('span', { class: 'tc-dlab' + (today ? ' tc-dlab-today' : '') + (!many && (d - d0) % 2 ? ' tc-dlab-alt' : ''),
        style: { left: pct((a + b) / 2) } }, dateOf(d * DAY)));
    }
    return out;
  }

  function midnights(s, pct) {
    var out = [];
    for (var d = Math.floor(s.start / DAY) + 1; d * DAY < s.end; d++) out.push(h('span', { class: 'tc-midnight', style: { left: pct(d * DAY) } }));
    return out;
  }
  function shades(s, pct) {
    return s.power.filter(function (w) { return w.to > s.start && w.from < s.end; }).map(function (w) {
      return h('span', { class: 'tc-shade', style: { left: pct(w.from), width: 'calc(' + pct(Math.min(w.to, s.end)) + ' - ' + pct(Math.max(w.from, s.start)) + ')' } });
    });
  }

  function powerRow(c, pct) {
    var s = c.state, segs = [], a = s.start;
    var cuts = [];
    s.power.forEach(function (w) { cuts.push([Math.max(s.start, w.from), Math.min(s.end, w.to)]); });
    cuts.sort(function (x, y) { return x[0] - y[0]; });
    function seg(x, y, on) {
      if (y <= x) return;
      segs.push(h('span', { class: 'tc-band ' + (on ? 'tc-band-on' : 'tc-band-off'),
        style: { left: pct(x), width: 'calc(' + pct(y) + ' - ' + pct(x) + ')' }, title: t(on ? 'legOn' : 'legOff') }));
    }
    cuts.forEach(function (k) { if (k[1] > k[0]) { seg(a, k[0], true); seg(k[0], k[1], false); a = k[1]; } });
    seg(a, s.end, true);
    return segs;
  }

  function laneRow(c, pct, kind) {
    var s = c.state, j = L.job(s, kind), out = [];
    out.push(h('span', { class: 'tc-axis' }));
    L.ticksIn(j.spec, s.start, s.end).forEach(function (x) {
      out.push(h('span', { class: 'tc-tick' + (x > s.now ? ' tc-tick-future' : ''), style: { left: pct(x) } }));
    });
    var sw = { '--sw': LANE_SW[kind] };
    j.missed.forEach(function (x) {
      if (x < s.start) return;
      out.push(h('span', { class: 'tc-mk tc-mk-miss' + (has(c, kind + ':missed:' + x) ? ' sd-changed' : ''), style: { left: pct(x) },
        title: t('legMissed') + ': ' + dateTimeOf(x), 'aria-label': t('legMissed') }, '×'));
    });
    j.runs.forEach(function (r) {
      var ch = has(c, kind + ':run:' + r.t);
      if (r.delay && !r.catchup) out.push(bracket(pct, r.sched, r.t, r.delay));
      if (r.catchup) {
        if (r.delay) out.push(bracket(pct, r.sched, r.t, r.delay));
        var from = r.covers.length ? Math.max(s.start, r.covers[0]) : r.sched;
        out.push(h('span', { class: 'tc-arc', style: { left: pct(from), width: 'calc(' + pct(r.t) + ' - ' + pct(from) + ')' } },
          r.covers.length > 1 ? h('span', { class: 'tc-arc-n', translate: 'no' }, r.covers.length + ' → 1') : null));
        out.push(h('span', { class: 'tc-mk tc-mk-catch' + (ch ? ' sd-changed' : ''), style: Object.assign({ left: pct(r.t) }, sw),
          title: t('legCatchup') + ': ' + dateTimeOf(r.t), 'aria-label': t('legCatchup') }, '↶'));
      } else {
        out.push(h('span', { class: 'tc-mk tc-mk-run sd-fill' + (ch ? ' sd-changed' : ''), dataset: { c: LANE_C[kind] }, style: { left: pct(r.t) },
          title: t('legRun') + ': ' + dateTimeOf(r.t), 'aria-label': t('legRun') }));
      }
    });
    if (kind === 'timer' && j.pending && s.on) {
      var pd = j.pending;
      if (pd.delay) out.push(bracket(pct, pd.sched, pd.at, pd.delay, true));
      out.push(h('span', { class: 'tc-mk tc-mk-wait' + (has(c, 'timer:pending') ? ' sd-changed' : ''), style: { left: pct(Math.min(pd.at, s.end)) },
        title: t('waitingFor', { at: dateTimeOf(pd.at) }) }, '…'));
    }
    return out;
  }
  function bracket(pct, a, b, delay, open) {
    return h('span', { class: 'tc-br', style: { left: pct(a), width: 'calc(' + pct(b) + ' - ' + pct(a) + ')', borderRightStyle: open ? 'dashed' : 'solid' } },
      h('span', { class: 'tc-br-lab' }, '+' + delayText(delay)));
  }

  function timeline(c) {
    var s = c.state, pct = pctOf(s), cr = L.job(s, 'cron'), tm = L.job(s, 'timer');
    var grid = [];
    function lab(row, title, sub) { grid.push(h('div', { class: 'tc-lab', style: { gridColumn: '1', gridRow: String(row) } }, h('b', null, title), sub ? data(sub) : null)); }
    function row(n, kids, extra) { grid.push(h('div', { class: 'tc-row', style: { gridRow: String(n) } }, extra || null, kids)); }
    lab(2, t('lanePower'));
    lab(3, t('laneCron'), cr.spec.fields.join(' '));
    lab(4, t('laneTimer'), tm.name + '.timer');
    row(1, axisRow(s, pct));
    row(2, powerRow(c, pct));
    row(3, laneRow(c, pct, 'cron'), [midnights(s, pct), shades(s, pct)]);
    row(4, laneRow(c, pct, 'timer'), [midnights(s, pct), shades(s, pct)]);
    grid.push(h('div', { class: 'tc-overlay' }, h('span', { class: 'tc-nowline', style: { left: pct(s.now) } })));
    return h('div', { class: 'tc-box tc-tl' }, grid);
  }

  // ── clock ──

  function clock(c) {
    var s = c.state, moved = !!s.last;
    return h('div', { class: 'tc-clock' },
      h('span', { class: 'tc-now' + (moved ? ' sd-changed' : ''), translate: 'no' }, L.stamp(s.now)),
      h('span', { class: 'tc-pw ' + (s.on ? 'tc-pw-on' : 'tc-pw-off') + (has(c, 'power') ? ' sd-changed' : '') },
        t('lanePower'), ': ', t(s.on ? 'powerOn' : 'powerOff')),
      // an outage picked outside this preset's timeline changes nothing here: say so
      s.power.length && s.power.every(function (w) { return w.to <= s.start || w.from >= s.end; })
        ? h('span', { class: 'tc-badge tc-badge-off' }, t('outsideNote')) : null);
  }

  // ── cron card ──

  function cronCard(c) {
    var s = c.state, cr = L.job(s, 'cron'), sp = cr.spec;
    var both = sp.dom != null && sp.dow != null;
    var names = ['fMin', 'fHour', 'fDom', 'fMon', 'fDow'];
    var fields = sp.fields.map(function (v, i) {
      var or = both && (i === 2 || i === 4);
      return h('div', { class: 'tc-field' + (or ? ' tc-field-or' : '') }, h('b', { translate: 'no' }, v), h('span', null, t(names[i])));
    });
    return h('div', { class: 'tc-box tc-card' },
      h('h3', null, t('cronTitle'),
        s.on ? h('span', { class: 'tc-badge', translate: 'no' }, 'crond: active (running)') : h('span', { class: 'tc-badge tc-badge-off' }, t('machineOff'))),
      h('div', { class: 'tc-fields' }, fields),
      both ? h('div', { class: 'tc-ornote' }, t('orNote')) : null,
      h('div', { class: 'tc-cmd' }, h('span', { class: 'tc-muted', style: { fontFamily: 'var(--sans)' } }, t('fCmd'), ': '), data(sp.cmd)),
      h('div', { class: 'tc-note' }, t('cronMemory')),
      h('div', { class: 'tc-count' }, h('span', null, '● ', t.n('runsCount', cr.runs.length)), h('span', null, '× ', t.n('missedCount', cr.missed.length))));
  }

  // ── timer card ──

  function timerCard(c) {
    var s = c.state, tm = L.job(s, 'timer');
    var lastRun = tm.runs.length ? tm.runs[tm.runs.length - 1] : null;
    var ranNow = lastRun && has(c, 'timer:run:' + lastRun.t);
    var timerBox = h('div', { class: 'tc-unit', style: { '--sw': 'var(--c1)' } },
      h('b', { translate: 'no' }, tm.name + '.timer'),
      s.on ? data('enabled · active (waiting)') : h('span', null, data('enabled'), ' · ', h('span', { class: 'tc-muted' }, t('powerOff'))));
    var svcState = !s.on ? h('span', null, data('static'), ' · ', h('span', { class: 'tc-muted' }, t('powerOff'))) : data('static · inactive (dead)');
    var svcBox = h('div', { class: 'tc-unit' + (ranNow ? ' sd-changed' : '') },
      h('b', { translate: 'no' }, tm.name + '.service'),
      svcState,
      lastRun ? h('span', null, t('ranAt', { at: dateTimeOf(lastRun.t) })) : h('span', { class: 'tc-muted' }, t('neverRan')));
    var unitFile = h('pre', { class: 'tc-pre', translate: 'no' }, '[Timer]\n' + L.timerLines(tm).join('\n'));

    var stampCh = has(c, 'stamp');
    var stamp = h('div', { class: 'tc-stamp' }, h('b', null, t('stampTitle')), ': ',
      tm.persistent
        ? [data('/var/lib/systemd/timers/stamp-' + tm.name + '.timer'), ' → ', h('span', { class: 'tc-mono' + (stampCh ? ' tc-ch' : ''), translate: 'no' }, tm.stamp != null ? L.stamp(tm.stamp) : '-')]
        : h('span', { class: 'tc-muted' }, t('stampNone')));

    var list;
    if (!s.on) list = h('div', { class: 'tc-pre tc-muted', style: { fontFamily: 'var(--sans)' } }, t('machineOff'));
    else {
      var lt = L.listTimers(s);
      var plt = c.prev && c.prev.on ? L.listTimers(c.prev).cells : null;
      var rows = [['NEXT', 'next'], ['LEFT', 'left'], ['LAST', 'last'], ['PASSED', 'passed']].map(function (k) {
        var ch = plt && plt[k[1]] !== lt.cells[k[1]] && (k[1] === 'next' || k[1] === 'last');
        return [h('dt', null, k[0]), h('dd', null, h('span', { class: ch ? 'tc-ch' : '' }, lt.cells[k[1]]))];
      });
      list = h('div', { class: 'tc-pre', translate: 'no' },
        h('div', null, h('span', { class: 'tc-prompt' }, '$ '), 'systemctl list-timers ' + tm.name + '.timer'),
        h('dl', { class: 'tc-kv', style: { margin: 0 } }, rows));
    }
    return h('div', { class: 'tc-box tc-card' },
      h('h3', null, t('timerTitle')),
      h('div', { class: 'tc-tw' },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.35rem', minWidth: 0 } },
          h('div', { class: 'tc-units' }, timerBox, h('span', { class: 'tc-arrow' }, '↓ ', t('unitActivates'), ' ', data('Unit=' + tm.name + '.service')), svcBox),
          unitFile),
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.35rem', minWidth: 0 } },
          stamp,
          h('div', { class: 'tc-sm' }, h('b', null, t('listTitle'))),
          list,
          h('div', { class: 'tc-count' }, h('span', null, '● ', t.n('runsCount', tm.runs.length)), h('span', null, '× ', t.n('missedCount', tm.missed.length))))));
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'tc' }, clock(c), timeline(c), cronCard(c), timerCard(c)));
  }

  // ── captions: what happened at this event, lane by lane ──

  function caption(c) {
    var s = c.state, last = s.last, cr = L.job(s, 'cron'), tm = L.job(s, 'timer');
    var timerN = tm.name + '.timer', serviceN = tm.name + '.service';
    if (!last) {
      var st = parts('cap_start', { crontab: 'crontab', timer: timerN }, { when: dateTimeOf(s.now) });
      return s.on ? st : st.concat([' ', t('cap_startOff')]);
    }
    var out = [];
    function add(x) { if (out.length) out.push(' '); out.push.apply(out, [].concat(x)); }
    var T = last.t;

    if (last.shutdown) {
      add(parts('cap_off', { crond: 'crond' }, { time: timeOf(T) }));
      if (last.lost != null) add(parts('cap_lost', null, { sched: timeOf(last.lost) }));
    }
    if (last.boot) {
      add(parts('cap_boot', null, { time: timeOf(T) }));
      var before = c.prev ? L.job(c.prev, 'timer').stamp : null;
      var cronMissed = last.cronMissedInOutage;
      if (last.timer === 'catchup' || last.timer === 'catchup-wait') {
        var run = last.fired || tm.pending;
        var n = run && run.covers ? run.covers.length : 1;
        var onDay = before != null ? t('da' + civ(before).dow) : '';
        if (last.timer === 'catchup-wait') {
          add(parts('cap_catchupWait', { timer: timerN, persistent: 'Persistent=true', rds: 'RandomizedDelaySec=' }, { onDay: onDay, delay: delayText(tm.pending.delay), at: timeOf(tm.pending.at) }));
        } else if (n <= 1) {
          add(parts('cap_catchup1', { timer: timerN, persistent: 'Persistent=true' }, { onDay: onDay }));
        } else {
          add(parts('cap_catchupN', { timer: timerN, persistent: 'Persistent=true' }, { onDay: onDay }));
          add([t.n('cap_missedN', n), '; ', t('cap_catchupOnce', { n: n })]);
        }
        if (cronMissed) add(parts('cap_cronNoField', { crontab: 'crontab' }));
      } else if (!tm.persistent && last.missedInOutage) {
        var nx = L.nextOf(s);
        add(parts('cap_bootNoPersist', { timer: timerN, directive: 'Persistent=' }));
        add([t.n('cap_lostN', last.missedInOutage)].concat(parts('cap_nextIs', null, { next: nx ? onDayAt(nx.at) : '-' })));
        if (cronMissed) add(parts('cap_cronLostToo', { crontab: 'crontab' }));
      } else {
        add(parts('cap_bootNothing', { timer: timerN }));
        if (cronMissed) add(parts('cap_cronLostOnly', { crontab: 'crontab' }));
      }
    }

    // what the scheduled times at this very second did (also at a boot or a shutdown that falls on one)
    var timerTick = last.absorbed || last.timer === 'missed' || last.timer === 'elapse' || (last.timer === 'run' && !(last.fired && last.fired.delay));
    if (last.cron || timerTick) {
      var head = parts('cap_tick', null, { day: capFirst(t('dn' + civ(T).dow)), time: timeOf(T) });
      var body = [];
      var more = function (x) { if (body.length) body.push(' '); body.push.apply(body, [].concat(x)); };
      if (last.cron === 'run') {
        var sp = cr.spec;
        if (sp.dom != null && sp.dow != null) {
          var cv = civ(T);
          if (sp.dom.indexOf(cv.dom) >= 0) more(parts('cap_orDom', { crond: 'crond' }, { dayNom: t('dn' + cv.dow) }));
          else more(parts('cap_orDow', { crond: 'crond' }));
          more(t('cap_orCount', { n: cr.runs.length }));
        } else more(parts('cap_cronRun', { crond: 'crond', crontab: 'crontab' }));
      } else if (last.cron === 'missed') more(parts('cap_cronMissed', { crond: 'crond' }));

      if (last.absorbed) more(parts(last.fired && last.fired.catchup ? 'cap_absorbedNow' : 'cap_absorbed', { timer: timerN }));
      else if (last.timer === 'run') more(parts('cap_timerRun', { timer: timerN, service: serviceN }));
      else if (last.timer === 'elapse') more(parts('cap_timerElapse', { timer: timerN, service: serviceN, rds: 'RandomizedDelaySec=' + maxDelay(s).replace(' ', '') }, { delay: delayText(last.pending.delay), at: timeOf(last.pending.at) }));
      else if (last.timer === 'missed') {
        more(parts('cap_timerMissed', { timer: timerN }));
        more(tm.persistent ? parts('cap_timerMissedP', { persistent: 'Persistent=true' }) : parts('cap_timerMissedNP', { directive: 'Persistent=' }));
      } else if (!timerTick && last.cron === 'run') {
        if (cr.spec.dom != null && cr.spec.dow != null) {
          if (cr.runs.length > 1 && c.n < c.steps) { add(head.concat([' '], body)); return out; }
          var nx2 = L.nextOf(s);
          more(parts('cap_orTimer', { timer: timerN, cal: 'OnCalendar=' + tm.spec.cal, next: nx2 ? L.stamp(nx2.at) : '-' }));
        } else if (tm.pending && !last.boot) more(parts('cap_waiting', { service: serviceN }, { at: timeOf(tm.pending.at) }));
        else if (!last.boot) more(parts('cap_timerNoDay', { timer: timerN, cal: 'OnCalendar=' + tm.spec.cal }));
      }
      add(head.concat([' '], body));
    } else if (!last.boot && !last.shutdown && last.fired) {
      var f = last.fired;
      if (f.catchup) add(parts('cap_catchupRun', { service: serviceN }, { delay: delayText(f.delay) }));
      else add(parts('cap_timerDelayed', { service: serviceN }, { delay: delayText(f.delay), sched: timeOf(f.sched), max: maxDelay(s) }));
    }
    return out;
  }
  function capFirst(x) { return x.charAt(0).toUpperCase() + x.slice(1); }

  // ── mount ──

  function offLabel(v) { return dateTimeOf(Number(v)); }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'persistent', type: 'toggle', label: t('persistent'), hint: t('persistentHint'), resets: true },
      { key: 'delay', type: 'choice', label: t('delay'), resets: true, options: [[0, t('delayNone')], [HOUR, '1h']] },
      { key: 'offFrom', type: 'select', label: t('offFrom'), resets: true,
        options: [['none', t('offNone')]].concat(L.OFF_OPTIONS.map(function (x) { return [String(x), offLabel(x)]; })) },
      { key: 'offTo', type: 'select', label: t('offTo'), resets: true,
        disabled: function (p) { return p.offFrom === 'none' ? t('offToOff') : false; },
        options: L.OFF_OPTIONS.map(function (x) { return [String(x), offLabel(x)]; }) },
      { key: 'seed', type: 'range', label: t('seed'), min: 1, max: 99, step: 1, resets: true,
        disabled: function (p) { return Number(p.delay) ? false : t('seedOff'); } },
      // the jobs come with the preset; hidden so the panel fits one screen
      { key: 'scene', type: 'select', label: t('scene'), resets: true, visible: function () { return false; },
        options: L.SCENE_IDS.map(function (x) { return [x, x]; }) }
    ],

    presets: L.PRESETS.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), params: x.params, hint: t('preset_' + x.id + '_hint') };
    }),

    legend: [
      { shape: 'tc-on', label: t('legOn') },
      { shape: 'tc-off', label: t('legOff') },
      { shape: 'tc-tick', label: t('legTick') },
      { shape: 'tc-run', label: t('legRun') },
      { shape: 'tc-miss', label: t('legMissed') },
      { shape: 'tc-catch', label: t('legCatchup') },
      { shape: 'tc-delay', label: t('legDelay') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
