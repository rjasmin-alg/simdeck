    var ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
    var c = Math.cos(TILT), sn = Math.sin(TILT);
    var x1 = p[0] + (ux * c + nx * sn) * R, y1 = p[1] + (uy * c + ny * sn) * R;
    var x2 = q[0] - (ux * c - nx * sn) * (R + 3), y2 = q[1] - (uy * c - ny * sn) * (R + 3);

      box.append(h('div', { class: 'mx-who', translate: 'no',
        style: { left: POS[k][0] + '%', top: top ? 'calc(' + (POS[k][1] - 13) + '% - 1.6em)' : 'calc(' + (POS[k][1] + 13) + '% + 0.2em)' } },

    var changed = !!last && last.transitions.some(function (x) { return x.core === k; });
    var full = !canAppend(c);
    function btn(op, label, key) {
      return h('button', { type: 'button', class: 'sd-btn', 'aria-disabled': full ? 'true' : 'false',
        'aria-keyshortcuts': key, title: full ? t('full') : null,
        onmousedown: function (ev) { ev.preventDefault(); },
        onclick: function () { if (!full) doOp(k, op); } },
        h('span', null, label), h('kbd', null, key.toUpperCase()));
    }
    return h('div', { class: 'mx-card' + (changed ? ' sd-changed' : '') + (changed && c.dir === 'forward' ? ' sd-anim-in' : ''),
        dataset: { req: String(req) }, 'aria-label': t('stateLabel', { core: cn(k), st: e.state }) },
      h('div', { class: 'mx-head' }, h('b', { translate: 'no' }, cn(k)),
        req ? h('span', { class: 'mx-op' }, t(last.op === 'R' ? 'reads' : 'writes')) : null),
      h('div', { class: 'mx-letter mx-pat', dataset: { st: e.state } }, h('span', { translate: 'no' }, e.state)),
      e.value === null
        ? h('div', { class: 'mx-val', dataset: { none: 'true' } }, t('noCopy'))
        : h('div', { class: 'mx-val' }, nt('X = ' + e.value), req && last.hit ? h('span', { class: 'mx-hit' }, t('hit')) : null),
      h('div', { class: 'mx-btns' }, btn('R', t('read'), KEYS[k][0]), btn('W', t('write'), KEYS[k][1])));
  }

  function link(c, k) {
    var last = c.state.last;
    if (last && last.core === k && last.bus) {
      return h('div', { class: 'mx-link', dataset: { kind: 'bus' } }, h('span', { class: 'mx-pill' }, busNode(last.bus)));
    }
    if (last && last.flush === k) {
      return h('div', { class: 'mx-link', dataset: { kind: 'wb' } },
        h('span', { class: 'mx-pill', dataset: { kind: 'wb' } }, nt('X = ' + c.state.mem), ' ', t('wb')));
    }
    return h('div', { class: 'mx-link' });
  }

  function strip(c) {
    var ops = L.opsOf(c.params);
    var items = ops.map(function (o, i) {
      var when = i + 1 < c.n ? 'done' : i + 1 === c.n ? 'now' : 'todo';
      return h('span', { class: 'mx-chip', dataset: { when: when },
          'aria-label': t('opLabel', { n: i + 1, core: cn(o[0]), op: t(o[1] === 'R' ? 'reads' : 'writes') }) },
        h('small', { translate: 'no' }, String(i + 1)), h('span', { translate: 'no' }, cn(o[0])), h('span', null, t(o[1] === 'R' ? 'opR' : 'opW')));
    });
    return h('div', { class: 'mx-seq' }, h('span', null, ops.length ? t('seqTitle') : t('seqNone')), items);
  }

  function render(c) {
    var m = c.state, n = m.cores.length, last = m.last;
    var stale = L.isStale(m);
    var wb = !!last && last.flush !== null;
    var ks = []; for (var k = 0; k < n; k++) ks.push(k);
    c.stage.replaceChildren(h('div', { class: 'mx', style: { '--n': String(n) } },
      h('div', { class: 'mx-main' },
        h('div', { class: 'mx-ramrow' },
          h('div', { class: 'mx-ram' + (wb ? ' sd-changed' : ''), dataset: { stale: String(stale) } },
            h('b', null, t('ram')), h('span', { class: 'mx-x', translate: 'no' }, 'X = ', h('s', null, String(m.mem))),
            h('span', { class: 'mx-tag' }, stale ? t('stale') : t('fresh')))),
        wb ? h('div', { class: 'mx-link', dataset: { kind: 'wb' } }) : h('div', { class: 'mx-link' }),
        h('div', { class: 'mx-bus' }, h('span', null, t('bus'))),
        h('div', { class: 'mx-links' }, ks.map(function (k) { return link(c, k); })),
        h('div', { class: 'mx-cards' }, ks.map(function (k) { return card(c, k); })),
        strip(c)),
      h('div', { class: 'mx-side' },
        h('h3', null, t('diagram')),
        diagram(m, last),
        transitions(m),
        h('h3', null, t('counts')),
        counts(m, c.prev))));
  }

  function caption(c) {
    var m = c.state, last = m.last;
    var out;
    if (!c.steps) return t('capNone');
    if (!last) {
      out = t.parts('capStart', { x: 'X', mem: nt(String(m.mem)) });
    } else {
      var core = cn(last.core), before = c.prev.cores[last.core].state;
      var snoop = last.transitions.filter(function (x) { return x.core !== last.core; });
      var inv = snoop.filter(function (x) { return x.to === 'I'; }).map(function (x) { return x.core; });
      var flushV = last.flush !== null ? nt(String(m.mem)) : null;
      var bus = last.bus ? busNode(last.bus) : null;
      var add = function (key, vals) { out.push(' '); out = out.concat(t.parts(key, vals)); };
      if (last.op === 'R') {
        if (last.hit) out = t.parts('capReadHit', { core: core, st: nt(before) });
        else {
          out = t.parts('capReadMiss', { core: core, bus: bus });
          snoop.forEach(function (x) {
            if (x.from === 'M') add('capFlushS', { other: cn(x.core), x: 'X', v: flushV });
            else if (x.from === 'E') add('capDownE', { other: cn(x.core) });
          });
          add(m.cores[last.core].state === 'S' ? 'capGetS' : 'capGetE', { core: cn(last.core) });
        }
      } else if (before === 'M') {
        out = t.parts('capWriteM', { core: core, x: 'X', v: nt(String(last.value)) });
      } else if (before === 'E') {
        out = t.parts('capWriteE', { core: core });
      } else if (before === 'S') {
        out = t.parts('capWriteS', { core: core, bus: bus, inv: t(inv.length > 1 ? 'invMany' : 'invOne', { list: list(inv) }) });
      } else {
        out = t.parts('capWriteMiss', { core: core, bus: bus });
        if (last.flush !== null) add('capFlushI', { other: cn(last.flush), x: 'X', v: flushV });
        if (inv.length) add('capInvalMiss', { inv: t(inv.length > 1 ? 'invManyCap' : 'invOneCap', { list: list(inv) }) });
        else add('capAlone', {});
        add('capNowM', { core: cn(last.core), x: 'X', v: nt(String(last.value)) });
      }
    }
    if (!canAppend(c)) { out.push(' '); out.push(h('span', { class: 'sd-hl' }, t('full'))); }
    return out;
  }

  var params = [
    { key: 'cores', type: 'choice', label: t('cores'), hint: t('coresHint'), options: [[2, '2'], [3, '3'], [4, '4']] }
  ];
  for (var i = 1; i <= L.MAX_OPS; i++) {
    params.push({ key: 'o' + i, type: 'select', label: t('opLabel', { n: i, core: '', op: '' }), visible: function () { return false; },
      options: [['', '–']].concat(L.OPS.map(function (o) { return [o, o]; })) });
  }

  var keys = [];
  KEYS.forEach(function (pair, k) {
    keys.push({ key: pair[0], label: t('keyRead', { k: k }), run: function () { if (k < sim.params.cores) doOp(k, 'R'); } });
    keys.push({ key: pair[1], label: t('keyWrite', { k: k }), run: function () { if (k < sim.params.cores) doOp(k, 'W'); } });
  });

  var labels = { 'classic': ['presetClassic', 'presetClassicHint'], 'silent-upgrade': ['presetSilent', 'presetSilentHint'],
    'ping-pong': ['presetPing', 'presetPingHint'], 'readers-writer': ['presetReaders', 'presetReadersHint'] };

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: L.presets.map(function (p) { return { id: p.id, label: t(labels[p.id][0]), hint: t(labels[p.id][1]), params: p.params }; }),
    legend: [
      { shape: 'mx-st', label: 'M' },
      { shape: 'mx-st', label: 'E' },
      { shape: 'mx-st', label: 'S' },
      { shape: 'mx-st', label: 'I' },
      { shape: 'mx-bus', label: t('legBus') },
      { shape: 'mx-wb', label: t('legWb') },
      { shape: 'hl', label: t('legChanged') }
    ],
    keys: keys,
    render: render,
    caption: caption
  });

  // The state swatches: the kit draws a plain swatch per legend item; give the four state items their pattern,
  // letter and name (M, E, S, I are not language; the names are).
  var names = { M: 'legM', E: 'legE', S: 'legS', I: 'legI' };
  document.querySelectorAll('[data-sd-legend] li').forEach(function (li) {
    var sw = li.querySelector('.sd-swatch[data-shape="mx-st"]');
    if (!sw) return;
    var k = li.textContent.trim();
    sw.classList.add('mx-pat');
    sw.dataset.st = k;
    li.replaceChildren(sw, h('span', null, h('b', { translate: 'no' }, k), ' ', t(names[k])));
  });
})();
</script>
</body>
</html>
