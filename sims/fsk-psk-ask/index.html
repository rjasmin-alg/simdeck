<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var SCH = {
    ask: { c: 1, name: 'nameAsk', kind: 'kindAsk' },
    fsk: { c: 2, name: 'nameFsk', kind: 'kindFsk' },
    psk: { c: 3, name: 'namePsk', kind: 'kindPsk' }
  };
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian; at most d decimals, trailing zeros dropped.
  function num(x, d) {
    var s = String(Number(x.toFixed(d == null ? 2 : d)));
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function nib(bits) { return bits.replace(/(.{4})(?=.)/g, '$1 '); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ── a trace: symbol boundaries, the clean carrier (dashed, under noise), the received samples, phase jumps ──
  function drawTrace(box, st, k) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), nb = st.bits.length, top = k === 'psk' ? 1.0 * r : 0.3 * r, bot = 0.3 * r;
    var ymax = Math.max(1.15, Math.min(3.2, 1.15 + 2.5 * st.sigma));
    var mid = top + (H - top - bot) / 2, half = (H - top - bot) / 2;
    var X = function (tb) { return tb / nb * W; };
    var Y = function (v) { return mid - clamp(v, -ymax, ymax) / ymax * half; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true', 'data-c': SCH[k].c });
    svg.append(s('rect', { class: 'fp-box', x: 0, y: top, width: W, height: H - top - bot }));
    st.errorAt[k].forEach(function (b) { svg.append(s('rect', { class: 'fp-errband', x: X(b), y: top, width: X(1), height: H - top - bot })); });
    svg.append(s('line', { class: 'fp-zero', x1: 0, x2: W, y1: mid, y2: mid }));
    for (var b = 0; b <= nb; b++) svg.append(s('line', { class: 'fp-bound', x1: X(b), x2: X(b), y1: top, y2: H - bot }));
    var path = function (arr) {
      return arr.map(function (v, j) { return (j ? 'L' : 'M') + X(j / L.SPB).toFixed(1) + ' ' + Y(v).toFixed(1); }).join('');
    };
    if (st.sigma > 0) svg.append(s('path', { class: 'fp-clean', d: path(st.clean[k]) }));
    svg.append(s('path', { class: 'fp-wave', d: path(st.samples[k]) }));
    if (k === 'psk') {
      var ar = 0.55 * r;
      st.jumps.forEach(function (j) {
        var x = X(j), y = top - 0.15 * r;
        svg.append(s('path', { class: 'fp-jump', d: 'M' + (x - ar) + ' ' + y + ' A' + ar + ' ' + ar + ' 0 0 1 ' + (x + ar) + ' ' + y }));
      });
    }
    box.replaceChildren(svg);
  }

  // ── a symbol view: ASK and PSK in the I/Q plane, FSK as the strength at f0 against f1; ideal points as crosses ──
  function drawSym(box, st, k) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), size = Math.min(W, H), pad = 0.3 * r, fsk = k === 'fsk';
    var x0 = (W - size) / 2 + pad, y0 = (H - size) / 2 + pad, side = size - 2 * pad;
    var lo = fsk ? -0.25 : -1.6, hi = fsk ? 1.75 : 1.6, unit = side / (hi - lo);
    var X = function (v) { return x0 + (clamp(v, lo, hi) - lo) * unit; };
    var Y = function (v) { return y0 + side - (clamp(v, lo, hi) - lo) * unit; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true', 'data-c': SCH[k].c });
    svg.append(s('rect', { class: 'fp-box', x: x0, y: y0, width: side, height: side }));
    svg.append(s('line', { class: 'fp-axis', x1: x0, x2: x0 + side, y1: Y(0), y2: Y(0) }));
    svg.append(s('line', { class: 'fp-axis', x1: X(0), x2: X(0), y1: y0, y2: y0 + side }));
    svg.append(s('text', { x: x0 + side - 0.3 * r, y: Y(0) - 0.3 * r, 'text-anchor': 'end' }, t(fsk ? 'axisF0' : 'axisI')));
    svg.append(s('text', { x: X(0) + 0.35 * r, y: y0 + 1.1 * r }, t(fsk ? 'axisF1' : 'axisQ')));
    // the receiver's decision boundary
    if (k === 'psk') {
      svg.append(s('circle', { class: 'fp-circle', cx: X(0), cy: Y(0), r: unit }));
      svg.append(s('line', { class: 'fp-decide', x1: X(0), x2: X(0), y1: y0, y2: y0 + side }));
    } else if (k === 'ask') {
      svg.append(s('circle', { class: 'fp-decide', cx: X(0), cy: Y(0), r: (st.a0 + st.a1) / 2 * unit }));
    } else {
      svg.append(s('line', { class: 'fp-decide', x1: X(0), y1: Y(0), x2: X(hi), y2: Y(hi) }));
    }
    var pr = clamp(side / 40, 0.22 * r, 0.4 * r);
    st.points[k].forEach(function (p) {
      if (p.got !== p.sent) svg.append(s('circle', { class: 'fp-halo', cx: X(p.x), cy: Y(p.y), r: 2 * pr }));
    });
    st.points[k].forEach(function (p) {
      svg.append(s('circle', { class: 'fp-pt', 'data-v': p.sent, cx: X(p.x), cy: Y(p.y), r: pr }));
    });
    var arm = 0.4 * r;
    st.ideal[k].forEach(function (q) {
      var x = X(q.x), y = Y(q.y);
      svg.append(s('line', { class: 'fp-cross', x1: x - arm, y1: y - arm, x2: x + arm, y2: y + arm }));
      svg.append(s('line', { class: 'fp-cross', x1: x - arm, y1: y + arm, x2: x + arm, y2: y - arm }));
      var lx = x + (fsk && q.bit === '1' ? 0.7 * r : 0), ly = y + (fsk && q.bit === '1' ? 0.35 * r : -0.75 * r);
      svg.append(s('text', { class: 'fp-ideal-lbl', x: lx, y: ly, 'text-anchor': fsk && q.bit === '1' ? 'start' : 'middle' }, q.bit));
    });
    box.replaceChildren(svg);
  }

  // ── the bit row; the cell flipped by the last click stays marked until another setting changes ──
  var lastKey = null, pending = null, flipped = null;
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key === lastKey) return;
    flipped = pending;
    pending = null;
    lastKey = key;
  }
  function bitRow(st) {
    var cells = [].map.call(st.bits, function (v, i) {
      return h('button', {
        type: 'button', class: 'fp-bit' + (flipped === i ? ' sd-changed' : ''), translate: 'no',
        dataset: { v: v }, 'aria-label': t('bitCell', { k: i + 1, v: v }),
        onclick: function () { pending = i; sim.set({ bits: L.flip(st.bits, i) }); }
      }, v);
    });
    return h('div', { class: 'fp-line fp-head' },
      h('div', { class: 'fp-lab' }, t('bitsRow')),
      h('div', { class: 'fp-bits' }, cells),
      h('div', { class: 'fp-symh' }, t('symbolsHead')));
  }

  function ruleText(st, k) {
    if (k === 'ask') return t('ruleAsk', { a1: num(st.a1), a0: num(st.a0) });
    if (k === 'psk') return t('rulePsk');
    if (st.afsk) return t('ruleAfsk', { us: num(st.afskHz.bitUs, 1) });
    return t('ruleFsk', { f1: num(st.f1), f0: num(st.f0) });
  }

  function schemeRow(st, k) {
    var nb = st.bits.length, bad = st.errors[k] > 0;
    var dec = [].map.call(st.decided[k], function (v, i) {
      var wrong = v !== st.bits[i];
      return h('span', { class: wrong ? 'fp-x' : null, translate: 'no',
        'aria-label': wrong ? t('decWrong', { k: i + 1, sent: st.bits[i], got: v }) : null }, wrong ? v + ' ×' : v);
    });
    var trace = h('div', { class: 'fp-svg' }), sym = h('div', { class: 'fp-sym' });
    var row = h('div', { class: 'fp-line fp-row', dataset: { scheme: k } },
      h('div', { class: 'fp-lab' },
        h('span', { class: 'fp-name' }, t(SCH[k].name)),
        h('span', { class: 'fp-kind' }, t(SCH[k].kind)),
        h('span', { class: 'fp-rule' }, ruleText(st, k)),
        st.sigma > 0 || bad ? h('span', { class: 'fp-wrong' + (bad ? ' fp-bad' : '') }, t('wrong', { k: st.errors[k], n: nb })) : null),
      h('div', { class: 'fp-trace' }, trace, h('div', { class: 'fp-dec' }, dec)),
      sym);
    return { row: row, trace: trace, sym: sym };
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'bits', type: 'select', label: t('bits'), value: L.defaults.bits, options: L.PATTERNS.map(function (p) { return [p, nib(p)]; }) },
      { key: 'scheme', type: 'choice', label: t('scheme'),
        options: [['all', t('schemeAll')], ['ask', t('nameAsk')], ['fsk', t('nameFsk')], ['psk', t('namePsk')]] },
      { key: 'ook', type: 'toggle', label: t('ook') },
      { key: 'afsk', type: 'toggle', label: t('afsk') },
      { key: 'noise', type: 'range', label: t('noise'), min: 0, max: 100, step: 1,
        format: function (v) { return t('pct', { v: v }); } },
      // the seed stays a param (URL, presets); a button steps it, to keep the panel on one screen
      { key: 'seed', type: 'range', label: t('seed'), min: 1, max: 99, step: 1, visible: function () { return false; } },
      { type: 'button', label: t('newNoise'), key: 'n', run: function (sm) { sm.set({ seed: sm.params.seed % 99 + 1 }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'fp-one', label: t('legendOne') },
      { shape: 'hollow', label: t('legendZero') },
      { shape: 'fp-bound', label: t('legendBoundary') },
      { shape: 'fp-err', label: t('legendError') },
      { shape: 'fp-arc', label: t('legendJump') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var st = c.state;
      track(c);
      var ks = st.scheme === 'all' ? L.SCHEMES : [st.scheme];
      var rows = ks.map(function (k) { return schemeRow(st, k); });
      var root = h('div', { class: 'fp' + (ks.length === 1 ? ' fp-one' : ''), style: { '--nb': String(st.bits.length) } },
        bitRow(st), rows.map(function (x) { return x.row; }));
      c.stage.replaceChildren(root);
      rows.forEach(function (x, i) { drawTrace(x.trace, st, ks[i]); drawSym(x.sym, st, ks[i]); });
    },

    caption: function (c) {
      var st = c.state, nb = st.bits.length, b = function (x) { return h('b', { translate: 'no' }, String(x)); };
      if (st.sigma === 0) {
        if (st.scheme === 'all') return t(st.jumps.length ? 'capAll' : 'capAllNone');
        if (st.scheme === 'ask') return t('capAsk', { a1: num(st.a1), a0: num(st.a0) }) + (st.ook ? t('capOok') : '');
        if (st.scheme === 'fsk') return st.afsk ? t('capAfsk') : t('capFsk', { f1: num(st.f1), f0: num(st.f0) });
        return st.jumps.length ? t.n('capPsk', st.jumps.length) : t('capPskNone');
      }
      var pct = t('pct', { v: st.noise }), parts;
      if (st.scheme === 'all') parts = t.parts('capNoiseAll', { pct: b(pct), seed: b(st.seed), ask: b(st.errors.ask), fsk: b(st.errors.fsk), psk: b(st.errors.psk) });
      else parts = [t(SCH[st.scheme].name) + ' · '].concat(t.parts('capNoiseOne', { pct: b(pct), seed: b(st.seed), k: b(st.errors[st.scheme]) }));
      return parts.concat(t.n('ofBits', nb), t('capWhy', { ask: num(st.distance.ask), fsk: num(st.distance.fsk), psk: num(st.distance.psk) }));
    }
  });

  // A flipped bit string is not one of the select's patterns: show the select empty rather than a stale pattern.
  function syncSelect(c) {
    var sel = document.querySelector('[data-sd-controls] select');
    if (sel && L.PATTERNS.indexOf(c.params.bits) < 0) sel.selectedIndex = -1;
  }
  sim.on(syncSelect);
  syncSelect({ params: sim.params });

  // The drawings are in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var lastSize = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== lastSize) { lastSize = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
