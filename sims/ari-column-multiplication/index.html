<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var PRESET_KEY = { 'two-digit': 'pTwo', 'one-digit': 'pOne', 'zero-digit': 'pZero', 'no-shift': 'pNoshift',
    'base-2': 'pBin', 'base-16': 'pHex' };
  var MISTAKE_KEY = { none: 'mNone', noshift: 'mNoshift', carry: 'mCarry', carryfirst: 'mCarryFirst' };
  var MISTAKE_TITLE = { noshift: 'mtNoshift', carry: 'mtCarry', carryfirst: 'mtCarryFirst' };
  var QUICK = [2, 8, 10, 16];

  var AUDS = P.AUDIENCES;
  var audience = 'teacher';
  var notice = null; // a refused action, said once in the caption

  /** t.parts, but a node that fills two placeholders is cloned for the second ("{w} … pamtim {c} … {w}"):
      the kit's t.parts returns the same node twice, and appending it again would move it. */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }

  // ── numbers as text (data, translate="no") ──
  /** A numeral, with the base as a subscript when it is not 10 (child view: never). */
  function num(text, b) {
    return h('span', { class: 'am-num', translate: 'no' }, String(text), b !== 10 && audience !== 'child' ? h('sub', null, String(b)) : null);
  }
  function plain(text) { return h('span', { class: 'am-num', translate: 'no' }, String(text)); }
  /** A digit of the base: "C (12)" when it is not a decimal digit. */
  function dig(d) { return plain(d >= 10 ? L.DIGITS[d] + ' (' + d + ')' : L.DIGITS[d]); }
  /** A quantity (21, or 12 (18) in base 16): its numeral in the base, the decimal value when it differs. */
  function qtyText(v, b) { var n = L.textOf(v, b); return n === String(v) ? n : n + ' (' + v + ')'; }
  function qty(v, b) { return plain(qtyText(v, b)); }
  function pow(b, k) { return Math.pow(b, k); }
  /** n units of place k: "3 desetice" in base 10 (k ≤ 3), "3 jedinice mjesta ×16" otherwise. */
  function units(b, k, n) { return k === 0 || (b === 10 && k <= 3) ? t.n('u' + k, n) : t.n('uGen', n, { v: pow(b, k) }); }
  /** A row of digits (ones first) as a numeral. */
  function rowText(ds) { return ds.slice().reverse().map(function (d) { return L.DIGITS[d]; }).join(''); }

  function placeLabels(b, W) {
    var out = [], titles = [];
    for (var k = 0; k < W; k++) {
      if (b === 10 && k <= 8) { out.push(t('place' + k)); titles.push(k <= 3 ? t('placeName' + k) : t('placeName', { v: pow(b, k) })); }
      else { out.push(P.power(b, k)); titles.push(t('placeName', { v: pow(b, k) })); }
    }
    return { labels: out, titles: titles };
  }

  /** The factors line "457·36": the second factor's ones at place 0, the dot in its own square. */
  function factorCells(plan) {
    var cells = plan.B.map(function (d) { return L.DIGITS[d]; });
    cells.push('·');
    plan.A.forEach(function (d) { cells.push(L.DIGITS[d]); });
    return cells;
  }
  function rowIndex(plan, j) { return (plan.m > 1 ? 2 : 1) + j; }
  /** Is row j fully written in state s? */
  function rowDone(s, plan, j) { return !!s.parts[j] && s.parts[j].length === plan.rows[j].digits.length; }

  // ── the paper (kit view K5) ──
  function paper(c, plan) {
    var s = c.state, prev = c.prev, b = c.params.base;
    var m = plan.m;
    var rows = [{ cells: factorCells(plan) }];
    if (m > 1) {
      rows.push({ kind: 'carry', rule: true, cells: plan.carries.map(function (x, k) {
        if (!s.sum || !x) return null;
        return { text: L.textOf(x, b), now: s.phase === 'sum', label: t('cellSumCarry', { v: L.textOf(x, b) }) };
      }) });
    }
    plan.rows.forEach(function (r, j) {
      var got = s.parts[j] || [];
      var before = c.n > 0 && prev && prev.parts[j] ? prev.parts[j].length : 0;
      var cells = got.map(function (d, i) { return { text: L.DIGITS[d], now: c.n > 0 && i >= before && s.row === j && s.phase !== 'sum' }; });
      if (s.row === j && s.carry > 0) cells.push({ text: ' ', tag: L.textOf(s.carry, b), label: t('cellCarry', { v: L.textOf(s.carry, b) }) });
      var row = { at: r.place, cells: cells };
      if (m === 1) { row.kind = 'result'; row.rule = true; }
      else if (j === m - 1) row.sign = '+';
      rows.push(row);
    });
    if (m > 1) rows.push({ kind: 'result', rule: true, cells: s.sum ? plan.sum.map(function (d) { return { text: L.DIGITS[d], now: s.phase === 'sum' }; }) : [] });
    // the band: the two factor digits being multiplied and the squares written in this step
    var band = [];
    if (s.phase === 'digit' || s.phase === 'row') {
      var r = plan.rows[s.row];
      band.push({ k: r.place, from: 0, to: 0 });
      if (s.phase === 'digit') band.push({ k: m + 1 + s.i, from: 0, to: 0 });
      var ri = rowIndex(plan, s.row);
      var before2 = c.prev && c.prev.parts[s.row] ? c.prev.parts[s.row].length : 0;
      for (var i = before2; i < s.parts[s.row].length; i++) band.push({ k: r.place + i, from: ri, to: ri });
    }
    var pl = placeLabels(b, Math.min(plan.cols, plan.n + plan.m));
    return P({
      cols: plan.cols, signs: m > 1, big: audience === 'child', label: t('paper'),
      // places only over the product's columns (n + m): the first factor's digits on the factors line are not in
      // those places, so the squares above them stay unlabelled where they can be
      places: pl.labels, placeTitles: pl.titles, band: band, rows: rows
    });
  }

  // ── the area model: the first factor split by place across, the second down; each cell a product ──
  function areaBox(c, plan) {
    var p = c.params, s = c.state, b = p.base;
    var ar = L.areaOf(p);
    var n = ar.cols.length;
    var kids = [h('div', { class: 'am-ch' }, '·')];
    ar.cols.forEach(function (col) { kids.push(h('div', { class: 'am-ch', translate: 'no' }, L.textOf(col.value, b))); });
    kids.push(h('div', { class: 'am-ch' }, t('areaRow')));
    ar.rows.forEach(function (row, j) {
      var later = s.phase === 'start' || (!s.sum && s.row < j);
      var reached = !later;
      kids.push(h('div', { class: 'am-rh', translate: 'no' }, L.textOf(row.value, b)));
      ar.cols.forEach(function (col, ci) {
        var i = col.i;
        var cur = (s.phase === 'digit' && s.row === j && s.i === i) || (s.phase === 'row' && s.row === j);
        var done = reached && (s.row !== j || s.phase !== 'digit' || i <= s.i);
        kids.push(h('div', { class: 'am-cell' + (cur ? ' am-cur' : ''), translate: 'no', dataset: done ? {} : { later: '' } },
          L.textOf(ar.cells[j][ci], b)));
      });
      var r = plan.rows[j];
      var rtDone = rowDone(s, plan, j);
      kids.push(h('div', { class: 'am-rt', translate: 'no', dataset: rtDone ? {} : { later: '' } },
        h('span', null, '= ' + L.textOf(ar.rowTotals[j], b)),
        h('small', null, '= ' + L.textOf(r.value, b) + ' · ' + L.textOf(pow(b, r.place), b))));
    });
    var whole = plan.m > 1 ? s.sum : rowDone(s, plan, 0);
    kids.push(h('div', { class: 'am-rh' }, ''));
    kids.push(h('div', { class: 'am-rh', style: { gridColumn: '2 / ' + (n + 2), justifySelf: 'end' } }, t('areaTotal')));
    kids.push(h('div', { class: 'am-rt am-tot' + (whole && c.last ? ' am-cur' : ''), translate: 'no' }, whole ? '= ' + L.textOf(ar.total, b) : '= ?'));
    var grid = h('div', { class: 'am-grid', role: 'img', 'aria-label': t('areaLabel'),
      style: { gridTemplateColumns: 'auto repeat(' + n + ', minmax(0, 1fr)) auto', gridTemplateRows: 'auto repeat(' + ar.rows.length + ', minmax(1.6em, 4em)) auto' } }, kids);
    return h('section', { class: 'am-box am-area' },
      h('div', { class: 'am-head' }, h('span', null, t('areaTitle')),
        h('span', { class: 'am-small' }, b !== 10 ? t('areaInBase', { b: b }) + ', ' + t('areaSub') : t('areaSub'))),
      grid);
  }

  // ── the typical mistake, teacher view ──
  function mistakeCard(c, plan) {
    var p = c.params, s = c.state, b = p.base;
    var m = L.mistakeOf(p, p.mistake);
    var rows = [{ cells: factorCells(plan) }];
    var wide = plan.cols;
    m.rows.forEach(function (r, j) {
      wide = Math.max(wide, r.place + r.digits.length);
      var cells = rowDone(s, plan, j) ? r.digits.map(function (d, i) {
        var text = L.DIGITS[d];
        return r.differs[i] ? { text: text, x: 'wrong', label: t('wrongCell', { w: text }) } : text;
      }) : [];
      var row = { at: r.place, cells: cells };
      if (plan.m === 1) { row.kind = 'result'; row.rule = true; }
      else if (j === plan.m - 1) row.sign = '+';
      rows.push(row);
    });
    if (plan.m > 1) {
      wide = Math.max(wide, m.sum.length);
      rows.push({ kind: 'result', rule: true, cells: s.sum ? m.sum.map(function (d, k) {
        var text = L.DIGITS[d];
        return m.differs[k] ? { text: text, x: 'wrong', label: t('wrongCell', { w: text }) } : text;
      }) : [] });
    } else if (!m.same) {
      // one row: it is the product, so its wrong digits are the product's
      rows[1].cells = rows[1].cells.map(function (x, i) { return m.differs[i] && typeof x === 'string' ? { text: x, x: 'wrong', label: t('wrongCell', { w: x }) } : x; });
    }
    var pap = P({ cols: wide, signs: plan.m > 1, label: t('mtHead'), rows: rows });
    var text = [];
    if (c.last && !m.same) {
      text.push(h('p', { class: 'am-mres' }, h('span', { class: 'am-bad' }, num(m.text, b)), ' ', tp('mtInstead', { res: num(m.rightText, b) })));
    }
    var why;
    if (m.same) why = t(m.kind === 'noshift' ? 'sameNoshift' : 'sameCarry');
    else if (m.kind === 'noshift') {
      var r0 = plan.rows.filter(function (r) { return r.place > 0 && r.d > 0; })[0] || plan.rows[0];
      why = tp('whyNoshift', { d: dig(r0.d), dv: qty(r0.d * pow(b, r0.place), b), a: num(L.textOf(plan.a, b), b) });
    } else {
      var f = m.first;
      why = tp(m.kind === 'carry' ? 'whyCarry' : 'whyCarryFirst', { ad: dig(f.ad), d: dig(f.d), cin: qty(f.cin, b),
        cinU: t.n('carryU', f.cin),
        right: qty(f.right, b), wrong: qty(f.prod, b) });
    }
    text.push(h('p', { class: 'am-mwhy' }, why));
    return h('section', { class: 'am-box am-mc' },
      h('div', { class: 'am-head' }, h('span', null, t('mtHead')), h('span', { class: 'am-small' }, t(MISTAKE_TITLE[m.kind]))),
      h('div', { class: 'am-paperbox sd-paper-box' }, pap),
      h('div', { class: 'am-mtext' }, text));
  }

  // ── what the stage shows ──
  function render(c) {
    var p = c.params;
    var plan = L.planOf(p);
    var showArea = audience !== 'child' && p.area;
    var showMistake = audience === 'teacher' && p.mistake !== 'none';
    var side = [];
    if (showArea) side.push(areaBox(c, plan));
    if (showMistake) side.push(mistakeCard(c, plan));
    var kids = [h('section', { class: 'am-box am-paper' }, h('div', { class: 'am-paperbox sd-paper-box' }, paper(c, plan)))];
    if (side.length) kids.push(h('div', { class: 'am-side' }, side));
    c.stage.replaceChildren(h('div', { class: 'am', dataset: { aud: audience, side: side.length ? 'yes' : 'none' } }, kids));
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var p = c.params, s = c.state, b = p.base;
    var plan = L.planOf(p);
    var X = audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(tp('cRefused', { b: plain(notice.b), why: notice.why })); notice = null; }
    var aNum = function () { return num(L.textOf(plan.a, b), b); };
    var resText = function () { return num(L.textOf(plan.product, b), b); };
    var expr = function () { return h('span', null, aNum(), ' · ', num(L.textOf(plan.b, b), b)); };

    if (s.phase === 'start') {
      if (X === 'A') {
        var parts = plan.rows.map(function (r) { return L.textOf(r.d * pow(b, r.place), b); }).join(' + ');
        add(tp(plan.m === 1 ? 'cStartA1' : 'cStartA', { parts: plain(parts), b: plain(b) }));
      } else add(tp('cStart' + X, { expr: expr() }));
      return out;
    }
    if (s.phase === 'digit' || s.phase === 'row') {
      var r = plan.rows[s.row];
      var d = dig(r.d);
      var rowArgs = function () {
        return { d: dig(r.d), du: units(b, r.place, r.d), a: aNum(), dv: qty(r.d * pow(b, r.place), b),
          pv: qty(pow(b, r.place), b), shift: t.n('shift', r.place) };
      };
      if (s.phase === 'digit') {
        if (s.i === 0) {
          if (X === 'C') add(tp(s.row === 0 ? 'rowFirstC' : 'rowC', { d: d }));
          else add(tp(X === 'A' && r.place === 0 ? 'rowA0' : 'row' + X, rowArgs()));
        }
        var st = r.steps[s.i];
        var key = 'd' + (st.cin ? 'In' : '') + (st.last ? 'Last' : st.cout ? 'Keep' : 'End') + X;
        var w = st.last ? L.textOf(st.prod, b) : L.DIGITS[st.prod % b];
        var adult = X === 'A';
        add(tp(key, { ad: dig(st.ad), d: dig(r.d), p: qty(st.ad * r.d, b), cin: adult ? plain(st.cin) : qty(st.cin, b),
          s: adult ? plain(st.prod) : qty(st.prod, b), w: plain(w), c: adult ? plain(st.cout) : plain(L.textOf(st.cout, b)), B: plain(b),
          wd: plain(st.prod % b) }));
      } else if (r.kind === 'zero') {
        add(tp(X === 'A' && plan.m === 1 ? 'rowZeroA1' : 'rowZero' + X, { du: units(b, r.place, 0), a: aNum(), z: plain(rowText(r.digits)) }));
      } else {
        add(tp(X === 'A' && r.place === 0 ? 'rowOneA0' : 'rowOne' + X, rowArgs()));
      }
      // the typical mistake, when this step finishes the row
      if (X === 'T' && p.mistake !== 'none' && rowDone(s, plan, s.row)) {
        var mk = L.mistakeOf(p, p.mistake);
        if (!mk.same) {
          if (p.mistake === 'noshift' && r.place > 0) add(tp('cMShift'));
          else if (mk.rows[s.row].differs.some(Boolean)) add(tp('cMRow', { w: plain(rowText(mk.rows[s.row].digits)) }));
        }
      }
    } else if (s.phase === 'sum') {
      if (X === 'A') {
        var terms = plan.rows.map(function (r) { return L.textOf(r.value * pow(b, r.place), b); }).join(' + ');
        add(tp('sumA', { terms: plain(terms), res: resText() }));
      } else add(tp('sum' + X));
    }
    if (c.last) {
      if (X === 'C') addHl(tp('cDoneC', { res: resText() }));
      else {
        addHl(tp('cResultT', { expr: expr(), res: resText() }));
        if (b !== 10) add(tp('cDecimal', { expr: plain(plan.a + ' · ' + plan.b), res: plain(plan.product) }));
        if (b === 2) add(tp('cBinary'));
        if (X === 'T' && p.mistake !== 'none') {
          var me = L.mistakeOf(p, p.mistake);
          if (!me.same) add(tp('cMEnd', { wrong: num(me.text, b), res: resText() }));
        }
      }
    }
    return out;
  }

  // ── the panel: the numbers field and the quick bases; the header: the audience switch ──
  var field = null, quick = null;
  function fieldText(p) { return L.numbersOf(p).map(function (v) { return L.textOf(v, p.base); }).join(' · '); }
  function buildNumbers() {
    var host = document.querySelector('[data-am-numbers]');
    var label = h('label', { class: 'sd-ctl-label', for: 'am-nums' }, h('span', null, ''));
    var input = h('input', { id: 'am-nums', type: 'text', class: 'am-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', title: t('numsHint'), 'aria-describedby': 'am-nums-msg' });
    // the hint is the field's tooltip; the line under it shows only a refusal (the panel must fit at 1920×1080)
    var msg = h('small', { class: 'sd-hint', id: 'am-nums-msg', role: 'status' }, '');
    var keyOf = { digit: 'errDigit', long: 'errLong', count: 'errCount', empty: 'errEmpty' };
    function clear() { input.removeAttribute('aria-invalid'); msg.textContent = ''; msg.className = 'sd-hint'; }
    input.addEventListener('input', function () {
      var r = L.parseList(input.value, sim.params.base);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t(keyOf[r.error], { at: r.at, b: sim.params.base });
        msg.className = 'am-err';
        return;
      }
      clear();
      sim.set(L.paramsFor(r.values));
      sim.first();
    });
    // Enter or Esc hands the keys back to the clicker
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { clear(); sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('numsTitle') },
      h('div', { class: 'am-field' }, label, input, msg)));
    field = { input: input, label: label.firstChild, msg: msg, clear: clear };
  }
  function buildQuick() {
    var wrap = document.querySelector('[data-sd-controls] [data-key="base"]');
    if (!wrap) return;
    quick = QUICK.map(function (qb) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { pickBase(qb); } }, String(qb)));
    });
    wrap.append(h('div', { class: 'sd-seg am-quick', role: 'group', 'aria-label': t('baseQuick'), title: t('baseHint') }, quick));
  }
  function tooLong(nb, p) {
    var long = L.numbersOf(p).filter(function (v) { return L.digitsOf(v, nb).length > L.MAX_DIGITS; })[0];
    return long == null ? null : t('baseTooLong', { b: nb, num: L.textOf(long, p.base) });
  }
  function pickBase(nb) {
    var why = tooLong(nb, sim.params);
    if (why) { notice = { b: nb, why: why }; sim.render(); return; }
    sim.set({ base: nb });
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    AUDS.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints,
      onChange: function (a) { audience = a; enforceChild(); sim.render(); } });
    audience = ctl.value;
  }
  /** The child view works in base 10 only. */
  function enforceChild() {
    if (audience !== 'child' || sim.params.base === 10) return;
    if (L.fitsIn(L.numbersOf(sim.params), 10)) sim.set({ base: 10 });
    else sim.set(Object.assign(L.paramsFor(L.numbersOf(L.defaults)), { base: 10 }));
  }

  function syncPanel(c) {
    var p = c.params;
    if (field) {
      field.label.textContent = t('numsLabel', { b: p.base });
      var shown = L.parseList(field.input.value, p.base);
      var same = !shown.error && shown.values.join(',') === L.numbersOf(p).join(',');
      // typing keeps its text; a preset or a base change under a focused field rewrites it and clears an error
      if (document.activeElement !== field.input || !same) {
        if (document.activeElement !== field.input || !field.input.getAttribute('aria-invalid')) {
          field.input.value = fieldText(p);
          field.clear();
        }
      }
    }
    if (quick) {
      quick.forEach(function (btn, i) {
        var why = tooLong(QUICK[i], p);
        btn.setAttribute('aria-pressed', String(p.base === QUICK[i]));
        btn.setAttribute('aria-disabled', why ? 'true' : 'false');
        btn.title = why || '';
      });
    }
  }

  buildAudience();
  buildNumbers();

  var NAMED = { 2: 'baseName2', 8: 'baseName8', 10: 'baseName10', 16: 'baseName16' };
  var hiddenRange = function (key) {
    return { key: key, type: 'range', label: t('numsTitle'), value: L.defaults[key], min: 0, max: L.MAX_VALUE, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'base', type: 'range', label: t('base'), value: L.defaults.base, min: function (p) { return Math.min(L.MAX_BASE, L.minBase(L.numbersOf(p))); }, max: L.MAX_BASE,
        format: function (v) { return NAMED[v] ? v + ' (' + t(NAMED[v]) + ')' : String(v); },
        visible: function () { return audience !== 'child'; } },
      { key: 'area', type: 'toggle', label: t('area'), value: L.defaults.area,
        visible: function () { return audience !== 'child'; } },
      { key: 'mistake', type: 'select', label: t('mistake'), value: L.defaults.mistake,
        options: L.MISTAKES.map(function (m) { return [m, t(MISTAKE_KEY[m])]; }),
        visible: function () { return audience === 'teacher'; } },
      // the numbers: set from the field above, kept here so the URL and the language switch carry them
      hiddenRange('a'), hiddenRange('b')
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    legend: [
      { shape: 'pc-band', label: t('legBand') },
      { shape: 'am-tag', label: t('legTag') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
  buildQuick();
  sim.on(function (c) { if (audience === 'child' && c.params.base !== 10) enforceChild(); });
  enforceChild();
  sim.render();
})();
</script>
</body>
</html>
