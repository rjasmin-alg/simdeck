<!-- quorum-split-brain: a cluster of 2–5 nodes in a ring (and an optional witness) is partitioned. A stepper: cut the
     links (or fail a node), each side counts its votes, each side keeps, starts or stops the service, then the network
     heals. With quorum ignored every side runs the service and takes its own write, and the copies differ. Kit view K2
     draws the nodes and links; the side column holds one card per side. The Windows presets (failover: true) play a
     sequence of events instead (a node fails, the network splits, the witness goes away), recount after each and,
     with dynamic quorum on, adjust the votes. The fencing presets (fence: true) hang the owner A or cut it off, let the
     quorum side fence it through its power switch (or not), move the service, wake A up and show the shared disk's log.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  /** Node positions per node count: [col, row] in a 10-column grid, cards span 2, the witness 4 (SPEC.md "Scene": a ring). */
  var POS = {
    2: { A: [0, 1], B: [8, 1], W: [3, 2] },
    3: { A: [0, 0], B: [8, 0], C: [4, 2], W: [3, 1] },
    4: { A: [0, 0], B: [8, 0], C: [8, 2], D: [0, 2], W: [3, 1] },
    5: { A: [4, 0], B: [8, 1], C: [6, 2], D: [2, 2], E: [0, 1], W: [3, 1] }
  };

  /** Data (node ids, numbers, x = 1) is not language: the word check skips translate="no". */
  function data(text) { return h('b', { translate: 'no' }, String(text)); }
  function mono(text) { return h('span', { translate: 'no' }, String(text)); }
  function join(list) {
    var out = [];
    list.forEach(function (x, i) { if (i) out.push(' '); out = out.concat(x); });
    return out;
  }
  function keyIcon() {
    var s = document.createElementNS(SVG, 'svg');
    s.setAttribute('viewBox', '0 0 24 12');
    s.setAttribute('class', 'qs-key');
    s.setAttribute('aria-hidden', 'true');
    [['circle', { cx: 5, cy: 6, r: 3.6 }], ['path', { d: 'M8.6 6H22.5M18.5 6v4M21.5 6v3' }]].forEach(function (e) {
      var el = document.createElementNS(SVG, e[0]);
      Object.keys(e[1]).forEach(function (k) { el.setAttribute(k, e[1][k]); });
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', 'currentColor');
      el.setAttribute('stroke-width', '2.4');
      s.append(el);
    });
    return s;
  }

  function sceneOf(p) { return p.fence ? 'ha' : p.failover ? 'win' : p.scene === 'win' || p.scene === 'ceph' ? p.scene : 'ha'; }
  /** The Windows failover sequence (presets win-*): events, recounts and vote adjustments (SPEC.md). */
  function seqMode(s) { return s.mode === 'failover'; }
  function votesOf(s, id) { return s.nodes.filter(function (x) { return x.id === id; })[0].votes; }
  function res(p) { return t('res_' + sceneOf(p)); }
  function resA(p) { return t('resA_' + sceneOf(p)); }
  function membersText(sd) { return sd.members.join(''); }
  function upNode(s, id) { return s.nodes.filter(function (x) { return x.id === id; })[0].up; }
  function counted(sd) { return !!sd.counted; }
  function qOf(sd) { return !counted(sd) ? 'pending' : sd.quorum ? 'yes' : 'no'; }

  // ── the drawing (kit view K2) ──

  function renderTopo(c) {
    var s = c.state, p = c.params, prev = c.prev;
    var pos = POS[s.n];
    var single = s.phase === 'start' || s.phase === 'heal';
    var seq = seqMode(s);
    var colourOf = function (id) {
      var i = L.sideOfNode(s.sides, id);
      return String(single ? 1 : i + 1);
    };
    var wasRunning = prev ? prev.resource.runningOn : s.resource.runningOn;
    var lastWrite = s.phase === 'write' ? s.writes[s.writes.length - 1] : null;
    var nodes = s.nodes.map(function (nd) {
      var i = L.sideOfNode(s.sides, nd.id);
      var sd = s.sides[i];
      var runs = s.resource.runningOn.indexOf(nd.id) >= 0;
      var badges = [];
      if (!nd.up) badges.push({ text: t('bDown'), k: 'muted' });
      if (runs) badges.push({ text: [keyIcon(), res(p)], k: 'fill' });
      if (runs && s.writes.length) badges.push({ text: mono('x = ' + (sd.copies ? sd.copies.filter(function (cp) { return cp.node === nd.id; })[0].value : sd.value)), k: 'solid' });
      if (seq) badges.push({ text: t.n('votesN', nd.votes), k: nd.votes ? 'solid' : 'muted' });
      var changed = c.n > 0 && ((runs !== (wasRunning.indexOf(nd.id) >= 0)) || (lastWrite && lastWrite.node === nd.id) ||
        (seq && prev && (votesOf(prev, nd.id) !== nd.votes || upNode(prev, nd.id) !== nd.up)));
      return { id: nd.id, kind: 'host', col: pos[nd.id][0], row: pos[nd.id][1], span: 2, c: colourOf(nd.id),
        name: t('node_' + sceneOf(p)), lines: [!single && nd.up ? { text: t('sideN', { k: i + 1 }), kind: 'role' } : null],
        badges: badges, state: nd.up ? null : 'down', changed: changed, align: 'center' };
    });
    var links = s.links.map(function (l) {
      var dead = !upNode(s, l.a) || !upNode(s, l.b);
      return { id: l.a + l.b, a: l.a, b: l.b, state: l.up ? 'up' : dead ? 'off' : 'down' };
    });
    var packets = [];
    if (s.phase === 'count') s.links.forEach(function (l) { if (l.up) packets.push({ from: l.a, to: l.b, chip: false, c: colourOf(l.a) }); });
    if (s.witness) {
      var w = s.witness;
      var wSide = w.reach ? L.sideOfNode(s.sides, w.reach) : -1;
      var wBadges = [w.reach ? { text: t('bVote', { k: wSide + 1 }), k: 'solid' } : { text: t('bNoVote'), k: 'muted' }];
      // failover sequence: the witness can go away, and dynamic witness can take its vote
      if (seq) wBadges = !w.up ? [{ text: t('bDown'), k: 'muted' }] : w.votes ? wBadges : [{ text: t.n('votesN', 0), k: 'muted' }];
      nodes.push({ id: 'W', kind: 'host', mark: t('wMark'), col: pos.W[0], row: pos.W[1], span: 4, align: 'center',
        c: wSide >= 0 ? String(single ? 1 : wSide + 1) : null, name: seq ? t('wk_' + w.kind) : t('wit_' + sceneOf(p)), lines: [],

    });
    s.fences.forEach(function (a) {
      var v = { by: data(a.by), t: data(a.target), t2: data(a.target), at: data(a.at / 1000) };
      if (a.result === 'ok') out.push(t.parts('fOk', v));
      if (a.result === 'failed') out.push(t.parts('fFail', v));
      if (a.result === 'moot') out.push(t.parts('fMoot', v));
    });
    var oks = s.fences.filter(function (a) { return a.result === 'ok'; });
    if (oks.length >= 2 && oks.every(function (a) { return a.at === oks[0].at && oks.some(function (b) { return b.by === a.target; }); })) out.push(t('fRace'));
    return join(out);
  }

  function capTakeover(s) {
    var out = [];
    var x = function (id) { return data('x = ' + L.valueOf(id)); };
    s.sides.forEach(function (sd) {
      var v = { m: sideName(sd), node: sd.node ? data(sd.node) : '', x: sd.node ? x(sd.node) : '' };
      if (sd.act === 'stop') out.push(t.parts('tkStop', v));
      if (sd.act === 'keep') out.push(t.parts('tkKeep', v));
      if (sd.act === 'blocked') out.push(t.parts('tkBlocked', v));
      if (sd.act === 'start') {
        var gone = s.fences.filter(function (a) { return a.result === 'ok' && a.side === membersText(sd); }).map(function (a) { return a.target; });
        if (gone.length) out.push(t.parts('tkMove', Object.assign(v, { t: data(gone.join(', ')) })));
        else {
          out.push(t.parts('tkStart', v));
          if (s.sides.some(function (o) { return o.hung && o.running; })) out.push(t('tkHolds'));
        }
      }
    });
    if (!s.resource.runningOn.length && !s.sides.some(function (sd) { return sd.act === 'blocked' || sd.act === 'stop'; })) out.push(t('tkNobody'));
    return join(out);
  }

  function capWake(s) {
    return s.late === 'never' ? t('wkNever') : t.parts('wkLate', { x: data('x = ' + L.valueOf('A')) });
  }

  function capResult(s) {
    var after = s.writers;
    if (s.verdict === 'corrupt') {
      if (s.fault === 'hang') return t.parts('rsCorruptHang', { a: data('A'), a2: data('A'), b: data(after.filter(function (id) { return id !== 'A'; })[0]) });
      return t.parts('rsCorrupt', { list: data(after.join(', ')) });
    }
    if (s.verdict === 'one') return t.parts('rsOne', { node: data(after[0]), run: data(s.resource.runningOn.join(', ')) });
    if (s.fenced.length === s.n) return t('rsDownAll');
    return after.length ? t.parts('rsDownFail', { list: data(after.join(', ')) }) : t('rsDownFail0');
  }

  var EV_PARAMS = [2, 3, 4, 5].map(function (n) {
    return { key: 'ev' + n, type: 'select', label: t('pEvents'), resets: true,
      options: L.EVENTS[n].map(function (ev) { return [ev, t('ev:' + ev)]; }),
      visible: function (p) { return !!p.failover && !p.fence && Number(p.nodes) === n; } };
  });

  var SPLIT_PARAMS = [2, 3, 4, 5].map(function (n) {
    return { key: 'split' + n, type: 'choice', label: t('pSplit'), hint: t('pSplitHint'), resets: true,
      options: L.SPLITS[n].map(function (sp) { return [sp, t('sp:' + sp)]; }),
      visible: function (p) { return !p.failover && !p.fence && Number(p.nodes) === n; } };
  });

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [{ key: 'nodes', type: 'range', label: t('pNodes'), min: 2, max: 5, step: 1, resets: true }].concat(SPLIT_PARAMS, EV_PARAMS, [
      { key: 'witness', type: 'toggle', label: t('pWitness'), resets: true, visible: function (p) { return p.scene !== 'ceph' && !p.failover && !p.fence; } },
      { key: 'wkind', type: 'choice', label: t('pWitness'), resets: true,
        options: L.KINDS.map(function (k) { return [k, t('wkShort_' + k)]; }), visible: function (p) { return !!p.failover && !p.fence; } },
      { key: 'witnessAt', type: 'choice', label: t('pWitnessAt'), resets: true, options: [['first', t('wFirst')], ['last', t('wLast')]],
        // the failover flow keeps the witness with A's side (the panel has no room for a seventh row; SPEC.md)
        visible: function (p) { return !p.failover && !p.fence && p.scene !== 'ceph' && p.witness; } },
      { key: 'policy', type: 'choice', label: t('pPolicy'), resets: true, options: [['stop', t('polStop')], ['ignore', t('polIgnore')]],
        visible: function (p) { return p.scene !== 'ceph' && !p.failover && !p.fence; } },
      { key: 'votes', type: 'select', label: t('pVotes'), resets: true, options: L.VOTES.map(function (v) { return [v, t('votes_' + v)]; }),
        visible: function (p) { return !!p.failover && !p.fence; } },
      // fencing (task fencing): the fault, fencing on or off, A's power switch, and the delay on fencing A (two nodes)
      { key: 'fault', type: 'choice', label: t('pFault'), resets: true, options: [['hang', t('fault_hang')], ['cut', t('fault_cut')]],
        visible: function (p) { return !!p.fence; } },
      { key: 'fencing', type: 'toggle', label: t('pFencing'), resets: true, visible: function (p) { return !!p.fence; } },
      { key: 'fenceDev', type: 'choice', label: t('pFenceDev'), resets: true, options: [['ok', t('dev_ok')], ['unreachable', t('dev_unreachable')]],
        visible: function (p) { return !!p.fence && !!p.fencing; } },
      { key: 'delayA', type: 'choice', label: t('pDelayA'), resets: true, options: [['0', t('delay_0')], ['5', t('delay_5')]],
        visible: function (p) { return !!p.fence && !!p.fencing && Number(p.nodes) === 2; } }
    ]),

    presets: [
      { id: 'three-nodes', label: t('prThree'), params: { scene: 'ha', nodes: 3, split3: 'AB|C', witness: false, witnessAt: 'first', policy: 'stop' } },
      { id: 'four-nodes', label: t('prFour'), params: { scene: 'ha', nodes: 4, split4: 'AB|CD', witness: false, witnessAt: 'first', policy: 'stop' } },
      { id: 'two-plus-witness', label: t('prWitness'), params: { scene: 'win', nodes: 2, split2: 'A|B', witness: true, witnessAt: 'first', policy: 'stop' } },
      { id: 'five-three-way', label: t('prFive'), params: { scene: 'ha', nodes: 5, split5: 'AB|CD|E', witness: false, witnessAt: 'first', policy: 'stop' } },
      { id: 'split-brain', label: t('prSplitBrain'), params: { scene: 'ha', nodes: 2, split2: 'A|B', witness: false, witnessAt: 'first', policy: 'ignore' } },
      { id: 'ceph-mons', label: t('prCeph'), hint: t('prCephHint'), params: { scene: 'ceph', nodes: 3, split3: 'A|B|C', witness: false, witnessAt: 'first', policy: 'stop' } },
      // Windows failover cluster (task win-failover-cluster): a sequence of events, static or dynamic votes
      { id: 'win-2node-fsw', label: t('prW2Fsw'), params: { scene: 'win', failover: true, nodes: 2, ev2: '!B', wkind: 'fileshare', witnessAt: 'first', votes: 'static' } },
      { id: 'win-2node-none', label: t('prW2None'), hint: t('prW2NoneHint'), params: { scene: 'win', failover: true, nodes: 2, ev2: 'A|B', wkind: 'none', witnessAt: 'first', votes: 'static' } },
      { id: 'win-4node-split', label: t('prW4Split'), hint: t('prW4SplitHint'), params: { scene: 'win', failover: true, nodes: 4, ev4: 'AB|CD', wkind: 'disk', witnessAt: 'first', votes: 'static' } },
      { id: 'win-dynamic', label: t('prWDynamic'), hint: t('prWDynamicHint'), params: { scene: 'win', failover: true, nodes: 3, ev3: '!C,!B', wkind: 'fileshare', witnessAt: 'first', votes: 'dynamic' } },
      { id: 'win-witness-lost', label: t('prWWitLost'), hint: t('prWWitLostHint'), params: { scene: 'win', failover: true, nodes: 2, ev2: 'W,!B', wkind: 'fileshare', witnessAt: 'first', votes: 'static' } },
      // fencing (task fencing): a hung owner with and without fencing, a fence that fails, and a two-node fence race
      { id: 'no-fencing', label: t('prNoFence'), hint: t('prNoFenceHint'), params: { scene: 'ha', fence: true, nodes: 3, fault: 'hang', fencing: false, fenceDev: 'ok', delayA: '0' } },
      { id: 'fence-then-move', label: t('prFenceMove'), params: { scene: 'ha', fence: true, nodes: 3, fault: 'hang', fencing: true, fenceDev: 'ok', delayA: '0' } },
      { id: 'fence-fails', label: t('prFenceFail'), params: { scene: 'ha', fence: true, nodes: 3, fault: 'hang', fencing: true, fenceDev: 'unreachable', delayA: '0' } },
      { id: 'two-node-race', label: t('prRace'), hint: t('prRaceHint'), params: { scene: 'ha', fence: true, nodes: 2, fault: 'cut', fencing: true, fenceDev: 'ok', delayA: '5' } }
    ],

    legend: [
      { shape: 'round', c: 1, label: t('lgNode') },
      { shape: 'qs-witness', label: t('lgWitness') },
      { shape: 'qs-q', label: t('lgQuorum') },
      { shape: 'qs-nq', label: t('lgNoQuorum') },
      { shape: 'qs-key', label: t('lgRes') },
      { shape: 'qs-two', label: t('lgTwo') },
      { shape: 'qs-f-hung', label: t('lgHung') },
      { shape: 'qs-f-plug', label: t('lgPlug') },
      { shape: 'qs-f-fenced', label: t('lgFenced') },
      { shape: 'qs-f-disk', label: t('lgDisk') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: function (c) {
      // the legend and the examples follow the flow on the stage (CSS on data-qs-mode)
      document.documentElement.setAttribute('data-qs-mode', fenceMode(c.state) ? 'fence' : seqMode(c.state) ? 'win' : 'quorum');
      if (fenceMode(c.state)) {
        c.stage.replaceChildren(h('div', { class: 'qs' },
          h('div', { class: 'qs-draw' }, h('p', { class: 'qs-scene' }, t('scene_ha')), renderFenceTopo(c)),
          h('div', { class: 'qs-sides' }, renderFenceSides(c))));
        return;
      }
      c.stage.replaceChildren(h('div', { class: 'qs' },
        h('div', { class: 'qs-draw' }, h('p', { class: 'qs-scene' }, t('scene_' + sceneOf(c.params))), renderTopo(c)),
        h('div', { class: 'qs-sides' }, renderSides(c))));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      if (fenceMode(s)) {
        switch (s.phase) {
          case 'start': return capFStart(s);
          case 'fault': return capFault(s);
          case 'count': return capFCount(s);
          case 'fence': return capFence(s);
          case 'takeover': return capTakeover(s);
          case 'wake': return capWake(s);
          default: return capResult(s);
        }
      }
      switch (s.phase) {
        case 'start': return seqMode(s) ? capSeqStart(s) : capStart(s, p);
        case 'event': return capEvent(s);
        case 'recount': return capRecount(s);
        case 'adjust': return capAdjustStep(s);
        case 'partition': return capPartition(s);
        case 'count': return capCount(s);
        case 'act': return capAct(s, p);
        case 'write': return capWrite(s);
        default: return capHeal(s, p);
      }
    }
  });
})();
</script>
</body>
