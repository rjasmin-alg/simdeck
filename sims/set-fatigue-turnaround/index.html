     each crew member's travel (− / + in the crew table) and applies the remedies (minimum rest, wrap on time, a shorter
     next day, a room or a driver for those who live far). The stage draws the shown crew member's week, one row per day
     from waking to the next call, on an axis of hours awake counting the sleep owed, so the 16 h and 17 h lines cross
     every row and a row creeps right as the debt grows. Week model: week.js; crew: sim.js; rules: SPEC.md; words:
     strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var MIN_AXIS = 32 * 60;   // the timeline shows at least 32 h

  /** A duration: "45 min", "11 h", "5 h 45". Not language: the same in both. */
  function dur(m) {
    m = Math.round(m);
    if (m < 60) return m + ' min';
    var hh = Math.floor(m / 60), mm = m % 60;
    return mm ? hh + ' h ' + (mm < 10 ? '0' : '') + mm : hh + ' h';
  }
  /** A duration as h:mm, for the phone's narrow badges. */
  function short(m) { return Math.floor(m / 60) + ':' + (m % 60 < 10 ? '0' : '') + (m % 60); }
  function clock(m) {
    var x = ((m % 1440) + 1440) % 1440, hh = Math.floor(x / 60), mm = x % 60;
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }
  /** A clock time on day d's row: "+1" when it falls on a later day. */
  function clockOn(m, d) {
    var off = Math.floor(m / 1440) - d;
    return clock(m) + (off > 0 ? ' +' + off : '');
  }
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function crewOf(s, id) { return s.crew.filter(function (c) { return c.id === id; })[0]; }
  function defOf(id) { return L.CREW.filter(function (c) { return c.id === id; })[0]; }

  // ── "changed": risk levels that differ from the state before the last input (not on a preset load) ──
  var lastState = null, lastKey = null, lastPreset = null, changed = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key === lastKey) return;
    var presetLoad = c.preset && c.preset !== lastPreset;
    changed = lastState && !presetLoad ? L.changedRisk(lastState, c.state) : [];
    lastState = c.state;
    lastKey = key;
    lastPreset = c.preset;
  }
  function isChanged(id, d) { return changed.some(function (x) { return x[0] === id && x[1] === d; }); }

  // ── stage controls: − / + and the crew names keep keyboard focus across a re-render ──
  var refocus = null, curParams = null;
  function bumpBtn(key, dir, what) {
    var patch = L.bump(curParams, key, dir);
    var label = t('stepLabel', { what: what, dir: t(dir < 0 ? 'less' : 'more') });
    return h('button', {
      type: 'button', class: 'ft-pm', dataset: { key: key, dir: String(dir) },
      'aria-label': patch ? label : label + ' (' + t(dir < 0 ? 'atMin' : 'atMax') + ')',
      'aria-disabled': patch ? 'false' : 'true',
      title: patch ? null : t(dir < 0 ? 'atMin' : 'atMax'),
      onmousedown: function (e) { e.preventDefault(); },
      onclick: function (e) {
        var p = L.bump(window.simdeck.params, key, dir);
        if (!p) return;
        refocus = e.currentTarget === document.activeElement ? '[data-key="' + key + '"][data-dir="' + dir + '"]' : null;
        window.simdeck.set(p);
      }
    }, dir < 0 ? '−' : '+');
  }

  function badge(r, atWheel, id) {
    var attrs = { class: 'ft-badge' + (isChanged(id, r.d) ? ' sd-changed' : ''), dataset: { r: r.risk }, role: 'img' };
    if (!atWheel) attrs.dataset.pass = '';
    attrs['aria-label'] = t(atWheel ? 'badgeLabel' : 'badgeLabelPass', { day: t('day' + r.d), eff: dur(r.effective), risk: t('risk_' + r.risk) });
    return h('span', attrs, data(dur(r.effective), 'ft-long'), data(short(r.effective), 'ft-short'));
  }

  // ── the week of one crew member ──

  /** Where row d ends, in minutes from its own origin (the debt block's left edge). */
  function rowEnd(s, c, d) {
    var r = c.days[d];
    if (d + 1 >= c.days.length) return r.debtBefore + r.awake + L.EVENING + 4 * 60;
    var nextCall = s.days[d + 1].call;
    return r.debtBefore + Math.max(c.days[d + 1].ownCall, nextCall) - r.wake;
  }

  function axisSpan(s, c) {
    var m = MIN_AXIS;
    c.days.forEach(function (r, d) { m = Math.max(m, rowEnd(s, c, d)); });
    return Math.ceil(m / 240) * 240;
  }

  function seg(A, from, to, k, attrs, label, minFrac) {
    if (to <= from) return null;
    var a = attrs || {};
    a.class = 'ft-seg' + (a.class ? ' ' + a.class : '');
    a.dataset = Object.assign({ k: k }, a.dataset || {});
    a.style = { left: (100 * from / A) + '%', width: (100 * (to - from) / A) + '%' };
    return h('div', a, label && (to - from) / A >= (minFrac || 0.05) ? label : null);
  }

  function timeline(s, c, d, A) {
    var r = c.days[d], day = s.days[d], def = defOf(c.id), x0 = r.debtBefore;
    function X(m) { return x0 + (m - r.wake); }
    var kids = [];
    kids.push(seg(A, 0, x0, 'debt', null, data('−' + dur(r.debtBefore)), 0.1));
    kids.push(seg(A, X(r.wake), X(r.wake + L.MORNING), 'home'));
    kids.push(seg(A, X(r.wake + L.MORNING), X(r.ownCall), 'travel'));
    if (def.precall) kids.push(seg(A, X(r.ownCall), X(day.call), 'pre', { class: 'sd-soft', dataset: { c: '1' } }));
    var plannedEnd = day.wrap - day.overrun;
    kids.push(seg(A, X(day.call), X(plannedEnd), 'work', { class: 'sd-fill', dataset: { c: '1' } }));
    kids.push(seg(A, X(plannedEnd), X(day.wrap), 'over', { class: 'sd-fill sd-hatch', dataset: { c: '1' } }, data('+' + dur(day.overrun))));
    kids.push(seg(A, X(day.wrap), X(r.release), 'pack', { class: 'sd-soft', dataset: { c: '1' } }));
    var drive = { dataset: { r: r.risk }, 'aria-hidden': 'true' };
    if (!c.atWheel) drive.dataset.pass = '';
    kids.push(seg(A, X(r.release), X(r.home), 'drive', drive, c.atWheel ? { low: '○', raised: '◐', high: '●' }[r.risk] : '▭'));
    if (r.sleep == null) {
      kids.push(seg(A, X(r.home), X(r.home + L.EVENING), 'home'));
      kids.push(h('div', { class: 'ft-end', style: { left: (100 * X(r.home + L.EVENING) / A) + '%' } }, t('weekend')));
    } else {
      var n = c.days[d + 1];
      kids.push(seg(A, X(r.home), X(r.asleep), 'home'));
      kids.push(seg(A, X(r.asleep), X(r.asleep + r.sleep), 'sleep', { class: 'sd-fill', dataset: { c: '4' } }, data(dur(r.sleep)), 0.09));
      kids.push(seg(A, X(n.wake), X(n.ownCall), 'next'));
      var ta = { left: (100 * X(day.wrap) / A) + '%', width: (100 * (s.days[d + 1].call - day.wrap) / A) + '%' };
      kids.push(h('div', { class: 'ft-ta', style: ta, 'aria-hidden': 'true' }));
    }
    kids.push(h('div', { class: 'ft-line', dataset: { at: '16' }, style: { left: (100 * L.RAISED / A) + '%' } }));
    kids.push(h('div', { class: 'ft-line', dataset: { at: '17' }, style: { left: (100 * L.HIGH / A) + '%' } }));
    return h('div', { class: 'ft-track', role: 'img',
      'aria-label': t(c.atWheel ? 'badgeLabel' : 'badgeLabelPass', { day: t('day' + d), eff: dur(r.effective), risk: t('risk_' + r.risk) }) }, kids);
  }

  function dayRow(s, c, d, A) {
    var day = s.days[d], r = c.days[d], key = L.OVERRUN_KEYS[d];
    var what = t('oParam', { day: t('day' + d) });
    var stats = [h('div', null,
      r.sleep == null ? h('span', null, t('weekend')) : h('span', null, t('ta', { d: dur(s.turnaround[d]) })),
      r.sleep == null ? null : h('span', null, t('sleep', { d: dur(r.sleep) })))];
    return h('div', { class: 'ft-row' },
      h('div', { class: 'ft-day' },
        h('span', null, h('span', { class: 'ft-dayname' }, t('day' + d)), ' ', data(clockOn(day.call, d) + '–' + clockOn(day.wrap, d), 'ft-num')),
        h('div', { class: 'ft-step' }, bumpBtn(key, -1, what),
          h('span', null, day.overrun ? t('over', { d: dur(day.overrun) }) : t('overNone')),
          bumpBtn(key, 1, what))),
      timeline(s, c, d, A),
      h('div', { class: 'ft-stats' }, badge(r, c.atWheel, c.id), stats));
  }

  function axisRow(A) {
    var ticks = [];
    for (var m = 0; m <= A; m += 240) {
      if (m === L.RAISED) continue;
      ticks.push(h('span', { class: 'ft-tick', style: { left: (100 * m / A) + '%' }, translate: 'no' }, String(m / 60)));
    }
    ticks.push(h('span', { class: 'ft-tick', style: { left: (100 * L.RAISED / A) + '%' }, translate: 'no' }, '16'));
    ticks.push(h('span', { class: 'ft-flag', style: { left: (100 * L.HIGH / A) + '%' } }, t('line17')));
    return h('div', { class: 'ft-axisrow' },
      h('span', { class: 'ft-axisname' }, t('axis')),
      h('div', { class: 'ft-scale' }, ticks),
      h('span'));
  }

  // ── the crew table ──

  function crewTable(s) {
    var kids = [h('span', { class: 'ft-crewhead' }, t('crewHead'))];
    for (var d = 0; d < L.DAYS; d++) kids.push(h('span', { class: 'ft-colhead' }, t('day' + d)));
    kids.push(h('span', { class: 'ft-colgap' }));
    s.crew.forEach(function (c) {
      var def = defOf(c.id), name = t('crew_' + c.id), shown = s.who === c.id;
      kids.push(h('button', {
        type: 'button', class: 'ft-name', dataset: { who: c.id }, 'aria-pressed': shown ? 'true' : 'false',
        'aria-label': t('showWeek', { who: name }),
        onmousedown: function (e) { e.preventDefault(); },
        onclick: function (e) {
          refocus = e.currentTarget === document.activeElement ? '[data-who="' + c.id + '"]' : null;
          window.simdeck.set({ who: c.id });
        }
      }, name));
      var what = t('tParam', { who: name });
      kids.push(h('div', { class: 'ft-step' }, bumpBtn(def.key, -1, what),
        h('span', null, data(dur(c.travelSet)), c.far ? h('span', { class: 'ft-far' }, ' · ' + t('farMark')) : null),
        bumpBtn(def.key, 1, what)));
      c.days.forEach(function (r) { kids.push(badge(r, c.atWheel, c.id)); });
      kids.push(h('span', { class: 'ft-debt ft-muted' }, c.debtEnd ? t('debtFri', { d: dur(c.debtEnd) }) : t('debtNone')));
    });
    return h('div', { class: 'ft-crew' }, kids);
  }

  // ── caption (SPEC.md "Legend and captions") ──

  function caption(c) {
    var s = c.state, p = c.params, m = crewOf(s, s.who), who = t('crew_' + m.id), out = [];
    if (m.atWheel) {
      var r = m.days[m.worst];
      out.push(r.debtBefore
        ? t('capWorst', { who: who, dayIn: t('dayIn' + r.d), awake: dur(r.awake), debt: dur(r.debtBefore), eff: dur(r.effective) })
        : t('capWorstNoDebt', { who: who, dayIn: t('dayIn' + r.d), eff: dur(r.effective) }));
      out.push(t({ high: 'capHigh', raised: 'capRaised', low: 'capLow' }[r.risk]));
    } else {
      var w = 0;
      m.days.forEach(function (x, d) { if (x.effective > m.days[w].effective) w = d; });
      out.push(t('capDriven', { who: who, eff: dur(m.days[w].effective), dayIn: t('dayIn' + w) }));
    }
    out.push(m.debtEnd ? t('capDebt', { debt: dur(m.debtEnd) }) : t('capNoDebt'));
    var fri = s.days[L.DAYS - 1];
    if (m.roomed) out.push(t('capRoom', { t: dur(m.travel), set: dur(m.travelSet) }));
    else if (p.minRest && s.days.some(function (d) { return d.call > d.base; })) {
      out.push(t(Math.floor(fri.wrap / 1440) > L.DAYS - 1 ? 'capMinRestSat' : 'capMinRest', { clock: clock(fri.wrap) }));
    } else out.push(t('capNight', { ta: dur(s.turnaround[0]), sleep: dur(m.days[0].sleep) }));
    return out.join(' ');
  }

  var hidden = function () { return false; };
  var params = [
    { key: 'length', type: 'range', label: t('length'), hint: t('lengthHint'), min: 480, max: 840, step: 30, format: dur },
    { key: 'minRest', type: 'toggle', label: t('minRest') },
    { key: 'onTime', type: 'toggle', label: t('onTime') },
    { key: 'shorter', type: 'toggle', label: t('shorter') },
    { key: 'far', type: 'choice', label: t('far'), options: L.FAR_MODES.map(function (f) { return [f, t('far_' + f)]; }) },
    { key: 'who', type: 'choice', label: t('who'), options: L.WHO.map(function (w) { return [w, t('crew_' + w)]; }), visible: hidden }
  ].concat(L.OVERRUN_KEYS.map(function (k, d) {
    return { key: k, type: 'range', label: t('oParam', { day: t('day' + d) }), min: 0, max: L.week.MAX_OVERRUN, step: L.OVERRUN_STEP, visible: hidden };
  })).concat(L.CREW.map(function (c) {
    return { key: c.key, type: 'range', label: t('tParam', { who: t('crew_' + c.id) }), min: L.TRAVEL_MIN, max: L.TRAVEL_MAX, step: L.TRAVEL_STEP, visible: hidden };
  }));

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { c: 1, label: t('legWork') },
      { shape: 'ft-over', label: t('legOver') },
      { shape: 'ft-sleep', label: t('legSleep') },
      { shape: 'ft-debt', label: t('legDebt') },
      { shape: 'ft-drive', label: t('legDrive') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      track(c);
      curParams = c.params;
      var s = c.state, m = crewOf(s, s.who), A = axisSpan(s, m);
      var travel = m.roomed ? t('roomedTo', { t: dur(m.travel) }) : t('travelTo', { t: dur(m.travelSet) });
      c.stage.replaceChildren(h('div', { class: 'ft' },
        h('p', { class: 'ft-top' }, h('span', { class: 'ft-who' }, t('weekOf', { who: t('crew_' + m.id) })),
          h('span', { class: 'ft-muted' }, travel)),
        axisRow(A),
        h('div', { class: 'ft-week' }, s.days.map(function (day, d) { return dayRow(s, m, d, A); })),
        crewTable(s),
        h('p', { class: 'ft-foot' }, t('foot'))));
      if (refocus) {
        var b = c.stage.querySelector(refocus);
        if (b) b.focus();
        refocus = null;
      }
    },
    caption: function (c) {
      track(c);
      return caption(c);
    }
  });
})();
</script>
</body>
</html>
