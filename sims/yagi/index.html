<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var CP = L.CP;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var D2R = Math.PI / 180;
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function deg(v) { return t('degVal', { v: num(v, Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1) }); }
  function sdeg(v) { var r = Math.round(v); return t('degVal', { v: (r > 0 ? '+' : '') + num(r, 0) }); }   // a signed phase
  function lam(v) {                                   // lengths as the sliders show them: 0,50 λ, 0,475 λ
    var s = Number(v).toFixed(3);
    if (s.charAt(s.length - 1) === '0') s = s.slice(0, -1);
    return t('lamVal', { v: num(Number(s), s.split('.')[1] ? s.split('.')[1].length : 0) });
  }
  function dbv(v) { return t('dbVal', { v: num(v, 1) }); }
  function sdb(v) { return t('dbVal', { v: (Number(v.toFixed(1)) > 0 ? '+' : '') + num(v, 1) }); }   // a signed change
  function dbi(v) { return t('dbi', { v: num(v, 2) }); }
  function zfmt(z) { return t('zVal', { r: num(z[0], 1), s: z[1] < 0 ? '−' : '+', x: num(Math.abs(z[1]), 1) }); }
  function role(st, i) { var e = st.els[i]; return e.role === 'R' ? t('roleR') : e.role === 'DE' ? t('roleDE') : t('roleD', { k: String(e.k) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function rgbOf(name) {
    var v = (Simdeck.cssVar(name) || '').trim(), m = /^#([0-9a-f]{6})$/i.exec(v);
    if (m) return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
    var c = document.createElement('canvas'); c.width = c.height = 1;
    var g = c.getContext('2d'); g.fillStyle = v || '#808080'; g.fillRect(0, 0, 1, 1);
    var d = g.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  // ── the wave map: the far-field term of each element, summed, seen from above. Complex amplitudes are cached per
  //    layout; each frame takes the real part at ωt. Brightness is evened out with distance (SPEC §5). ──
  var cache = { key: '', re: null, im: null };
  function frameOf(st) {                               // the map's half width (λ, in 0.5 steps) and its centre on the boom
    var x0 = st.els[0].x, x1 = st.els[st.els.length - 1].x;
    return { half: Math.max(2.5, Math.ceil((st.boom / 2 + 1.8) * 2) / 2), xm: (x0 + x1) / 2 };
  }
  function field(st, res, fr) {
    var p = st.p, key = [p.refl, p.dirs, p.lr, p.sr, p.ld, p.sd, res, fr.half].join('|');
    if (cache.key === key) return cache;
    var re = new Float32Array(res * res), im = new Float32Array(res * res), k = 2 * Math.PI, a = 0.5, half = fr.half;
    var els = st.els, I = st.crest, g0 = 1 / Math.sqrt(st.emax2);
    for (var j = 0; j < res; j++) {
      var y = half - (j + 0.5) / res * 2 * half;
      for (var i = 0; i < res; i++) {
        var x = fr.xm + (i + 0.5) / res * 2 * half - half, sr = 0, si = 0;
        for (var m = 0; m < els.length; m++) {
          var dx = x - els[m].x, r = Math.sqrt(dx * dx + y * y);
          if (r < 1e-9) continue;
          var f = CP.elementFactor(els[m].len, y / r) / Math.sqrt(r + a), q = -k * r, c = Math.cos(q), sn = Math.sin(q);
          sr += f * (I[m][0] * c - I[m][1] * sn); si += f * (I[m][0] * sn + I[m][1] * c);
        }
        var g = Math.sqrt(Math.sqrt((x - fr.xm) * (x - fr.xm) + y * y) + a) * g0;
        re[j * res + i] = sr * g; im[j * res + i] = si * g;
      }
    }
    cache = { key: key, re: re, im: im };
    return cache;
  }

  function drawMap(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, top = 1.8 * r0;
    var S = Math.max(40, Math.min(W, H - top)), ox = (W - S) / 2, oy = top + (H - top - S) / 2;
    var fr = frameOf(st), ppl = S / (2 * fr.half);
    var res = Math.max(60, Math.min(300, Math.round(S / 2)));
    var f = field(st, res, fr);
    var cv = document.createElement('canvas');
    cv.width = res; cv.height = res;
    cv.style.left = ox + 'px'; cv.style.top = oy + 'px'; cv.style.width = S + 'px'; cv.style.height = S + 'px';
    var g = cv.getContext('2d'), img = g.createImageData(res, res), data = img.data;
    // diverging: + towards --c1, − towards --c5, 0 (cancelled) is the background; in grayscale both crests darken and
    // a null stays blank
    var bg = rgbOf('--bg'), pos = rgbOf('--c1'), neg = rgbOf('--c5'), wt = p.t * D2R, c = Math.cos(wt), sn = Math.sin(wt);
    for (var i = 0; i < res * res; i++) {
      var v = Math.max(-1, Math.min(1, f.re[i] * c - f.im[i] * sn)), fg = v >= 0 ? pos : neg, u = Math.pow(Math.abs(v), 0.75);
      data[4 * i] = bg[0] + (fg[0] - bg[0]) * u;
      data[4 * i + 1] = bg[1] + (fg[1] - bg[1]) * u;
      data[4 * i + 2] = bg[2] + (fg[2] - bg[2]) * u;
      data[4 * i + 3] = 255;
    }
    g.putImageData(img, 0, 0);

    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'yg-title', x: 0.2 * r0, y: 1.2 * r0 }, t('mapTitle')));
    var cx = ox + S / 2, cy = oy + S / 2;
    function X(x) { return cx + (x - fr.xm) * ppl; }
    svg.append(s('rect', { class: 'yg-frame', x: ox, y: oy, width: S, height: S }));
    // the boom and the elements: the fishbone seen from above, every bar its true length
    if (st.els.length > 1) svg.append(s('line', { class: 'yg-boom', x1: X(st.els[0].x), y1: cy, x2: X(st.els[st.els.length - 1].x), y2: cy }));
    var gap = Math.min.apply(null, st.els.map(function (e, i) { return i ? (e.x - st.els[i - 1].x) * ppl : Infinity; }));
    st.els.forEach(function (e, i) {
      var x = X(e.x), hl = e.len / 2 * ppl;
      svg.append(s('line', { class: 'yg-elHalo', x1: x, y1: cy - hl, x2: x, y2: cy + hl }));
      svg.append(s('line', { class: 'yg-el', x1: x, y1: cy - hl, x2: x, y2: cy + hl }));
      if (i === st.fed) svg.append(s('circle', { class: 'yg-feed', cx: x, cy: cy, r: 0.3 * r0 }));
      // names above the bars; when they are close, every other one below
      var below = gap < 1.9 * r0 && i % 2 === 1;
      svg.append(s('text', { class: 'yg-halo yg-bold', x: x, y: below ? cy + hl + 1.2 * r0 : cy - hl - 0.4 * r0, 'text-anchor': 'middle' }, role(st, i)));
    });
    // forward is to the right
    svg.append(s('text', { class: 'yg-halo yg-mute', x: ox + S - 0.3 * r0, y: cy + 1.6 * r0, 'text-anchor': 'end' }, t('fwdDir') + ' →'));
    // the scale: one wavelength
    var sx = ox + S - ppl - 0.3 * r0, sy = 1.0 * r0;
    svg.append(s('line', { class: 'yg-scaleHalo', x1: sx, y1: sy, x2: sx + ppl, y2: sy }));
    svg.append(s('line', { class: 'yg-scale', x1: sx, y1: sy, x2: sx + ppl, y2: sy }));
    svg.append(s('text', { class: 'yg-halo', x: sx - 0.4 * r0, y: sy + 0.35 * r0, 'text-anchor': 'end' }, t('mapScale')));
    box.replaceChildren(cv, svg);
  }

  // ── the currents: one dial per element in boom order, the phasor of its centre current now (length ∝ size,
  //    angle ωt + phase), its name, size and phase relative to the driven element ──
  function drawCurrents(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, n = st.els.length, svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'yg-mute', x: 0.2 * r0, y: 1.1 * r0 }, t('curTitle')));
    // one row while each dial gets 2.7 rem (its numbers are five characters); two rows otherwise (a phone)
    var rows = W / n >= 2.7 * r0 ? 1 : 2, per = Math.ceil(n / rows), step = W / per;
    var rowH = (H - 1.5 * r0) / rows;
    var R = Math.max(6, Math.min(1.0 * r0, (rowH - 3.6 * r0) / 2, step / 2 - 0.3 * r0));
    var amax = Math.max(1, Math.max.apply(null, st.cur.map(function (c) { return c.amp; })));
    st.cur.forEach(function (c, i) {
      var row = Math.floor(i / per), col = i - row * per;
      var cx = step * (col + 0.5), top = 1.5 * r0 + row * rowH, cy = top + 1.2 * r0 + R;
      var a = (p.t + c.phase) * D2R, len = 0.88 * R * c.amp / amax;
      svg.append(s('text', { class: 'yg-bold', x: cx, y: top + 1.0 * r0, 'text-anchor': 'middle' }, role(st, i)));
      svg.append(s('circle', { class: i === st.fed ? 'yg-dialFed' : 'yg-dial', cx: cx, cy: cy, r: R }));
      svg.append(s('line', { class: 'yg-hand', x1: cx, y1: cy, x2: cx + len * Math.cos(a), y2: cy - len * Math.sin(a) }));
      svg.append(s('circle', { class: 'yg-hub', cx: cx, cy: cy, r: 0.12 * R + 1 }));
      svg.append(s('text', { class: 'yg-mono', x: cx, y: cy + R + 1.1 * r0, 'text-anchor': 'middle' }, step >= 3.4 * r0 ? t('ampVal', { v: num(c.amp, 2) }) : num(c.amp, 2)));
      svg.append(s('text', { class: 'yg-mono', x: cx, y: cy + R + 2.2 * r0, 'text-anchor': 'middle' }, sdeg(c.phase)));
    });
    box.replaceChildren(svg);
  }

  // ── the far field in dBi on a fixed scale: the outer ring st.top, the centre 30 dB below ──
  function drawPolar(box, st, plane) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var side = st.kind === 'side', az = plane === 'H' && side ? st.main : 0;
    svg.append(s('text', { class: 'yg-title', x: 0.2 * r0, y: 1.2 * r0 }, plane === 'E' ? t('ePlane') : side ? t('hPlaneBeam') : t('hPlane')));
    var top = 1.8 * r0, cx = W / 2, cy = top + (H - top) / 2;
    var R = Math.max(10, Math.min(W / 2 - 2.6 * r0, (H - top) / 2 - 1.3 * r0));
    function P(a, rr) { return [cx + rr * R * Math.cos(a * D2R), cy - rr * R * Math.sin(a * D2R)]; }
    function rad(g) { return Math.max(0, Math.min(1, (g - (st.top - 30)) / 30)); }
    function dir(a) { return plane === 'E' ? L.hDir(a) : L.vDir(az, a); }
    [1, 2 / 3, 1 / 3].forEach(function (f, i) { svg.append(s('circle', { class: i ? 'yg-ring' : 'yg-ring0', cx: cx, cy: cy, r: f * R })); });
    [0, 30, 60, 90, 120, 150].forEach(function (a) {
      var p1 = P(a, 1), p2 = P(a + 180, 1);
      svg.append(s('line', { class: 'yg-spoke', x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }));
    });
    // ring labels along the lower left spoke
    [0, 10, 20].forEach(function (dd, i) {
      var q = P(240, 1 - i / 3);
      svg.append(s('text', { class: 'yg-halo yg-mute', x: q[0], y: q[1] + 0.3 * r0, 'text-anchor': 'middle' }, i ? num(st.top - dd, 0) : t('ringDbi', { v: num(st.top, 0) })));
    });
    // a λ/2 dipole for comparison: in the horizontal plane a figure eight (nulls along the wire), in the vertical all round
    var dip = [], pat = [];
    for (var a = 0; a <= 360; a += 0.5) {
      var u = dir(a);
      var fd = CP.elementFactor(0.5, u[1]);
      dip.push(P(a, rad(fd > 0 ? 10 * Math.log10(L.D_DIPOLE * fd * fd) : -Infinity)));
      pat.push(P(a, rad(L.gainAt(st, u))));
    }
    svg.append(s('polygon', { class: 'yg-dip', points: pts(dip) }));
    svg.append(s('polygon', { class: 'yg-pat', points: pts(pat) }));
    // the main lobe and its half-power lines (in the vertical plane: when the beam lies in it)
    var mainA = plane === 'E' ? st.main : side ? 0 : st.main;
    if (!st.single || plane === 'E') {
      var spokes = plane === 'E' && side ? [st.main, -st.main] : [mainA];
      spokes.forEach(function (b) {
        var e = P(b, 1);
        svg.append(s('line', { class: 'yg-main', x1: cx, y1: cy, x2: e[0], y2: e[1] }));
      });
      var hp = plane === 'E' ? (st.bwSides ? [st.main + st.bwSides[0], st.main - st.bwSides[1]] : []) :
        st.bwH === null ? [] : [mainA + st.bwH / 2, mainA - st.bwH / 2];
      if (plane === 'E' && side && st.bwSides) hp = hp.concat([-st.main - st.bwSides[0], -st.main + st.bwSides[1]]);
      hp.forEach(function (b) {
        var e = P(b, 1.03);
        svg.append(s('line', { class: 'yg-hp', x1: cx, y1: cy, x2: e[0], y2: e[1] }));
      });
    }
    var e1 = P(0, 1), e2 = P(180, 1), e3 = P(90, 1);
    svg.append(s('text', { class: 'yg-halo yg-mute', x: e1[0] - 0.2 * r0, y: e1[1] + 1.3 * r0, 'text-anchor': 'end' }, t('fwdDir')));
    svg.append(s('text', { class: 'yg-halo yg-mute', x: e2[0] + 0.2 * r0, y: e2[1] + 1.3 * r0, 'text-anchor': 'start' }, t('backDir')));
    if (plane === 'H') svg.append(s('text', { class: 'yg-halo yg-mute', x: e3[0] + 0.4 * r0, y: e3[1] + 0.9 * r0 }, t('up')));
    box.replaceChildren(svg);
  }

  // ── the gain for 0 … 8 directors, the rest as set: horizontal bars, the present one marked ──
  function drawBars(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'yg-title', x: 0, y: 1.1 * r0 }, t('barsTitle')));
    var n = st.series.length, top0 = 1.6 * r0, rowH = (H - top0) / n;
    var mx = L.plotTop(Math.max.apply(null, st.series)), lx = 1.3 * r0, vx = W - 0.1 * r0, bw = W - lx - 3.4 * r0;
    st.series.forEach(function (g, i) {
      var y = top0 + i * rowH, now = i === st.p.dirs, wv = Math.max(0, g) / mx * bw;
      svg.append(s('text', { class: now ? 'yg-mono yg-bold' : 'yg-mono yg-mute', x: lx - 0.3 * r0, y: y + rowH / 2 + 0.33 * r0, 'text-anchor': 'end' }, String(i)));
      svg.append(s('rect', { class: now ? 'yg-barNow' : 'yg-bar', x: lx, y: y + 0.12 * rowH, width: Math.max(1, wv), height: 0.76 * rowH }));
      svg.append(s('text', { class: now ? 'yg-mono yg-bold' : 'yg-mono', x: vx, y: y + rowH / 2 + 0.33 * r0, 'text-anchor': 'end' }, num(g, 1)));
    });
    svg.append(s('line', { class: 'yg-axis', x1: lx, y1: top0, x2: lx, y2: H }));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'yg-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var mainTxt = st.kind === 'fwd' ? t('mainFwd') : st.kind === 'back' ? t('mainBack') : t('mainSide', { v: deg(st.main) });
    var fb = st.single ? t('none') : st.backNull ? t('fbNull') : dbv(st.fbDb);
    return h('table', { class: 'yg-table' }, h('tbody', null,
      row(t('rowMain'), st.single ? t('none') : mainTxt),
      row(t('rowGain'), dbi(st.dbi), true),
      row(t('rowDbd'), t('dbd', { v: (st.dbd > 0.005 ? '+' : '') + num(st.dbd, 2) })),
      row(t('rowFb'), fb, true),
      row(t('rowBwE'), st.bwE === null ? t('bwAll') : deg(st.bwE)),
      row(t('rowBwH'), st.bwH === null ? t('bwAll') : deg(st.bwH)),
      row(t('rowZ'), zfmt(st.zin), true),
      row(t('rowAlone'), zfmt(st.zAlone)),
      row(t('rowBoom'), st.single ? t('none') : t('lamVal', { v: num(st.boom, 2) }))));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  var lenFmt = function (v) { return lam(v); };
  var spFmt = function (v) { return t('lamVal', { v: num(v, 2) }); };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'refl', type: 'toggle', label: t('refl') },
      { key: 'lr', type: 'range', label: t('lr'), min: 0.4, max: 0.6, step: 0.005, visible: function (p) { return !!p.refl; }, format: lenFmt },
      { key: 'sr', type: 'range', label: t('sr'), min: 0.05, max: 0.4, step: 0.01, visible: function (p) { return !!p.refl; }, format: spFmt },
      { key: 'dirs', type: 'range', label: t('dirs'), min: 0, max: L.MAX_DIRS, step: 1, format: function (v) { return t('nVal', { v: num(v, 0) }); } },
      { key: 'ld', type: 'range', label: t('ld'), min: 0.38, max: 0.55, step: 0.005, visible: function (p) { return p.dirs > 0; }, format: lenFmt },
      { key: 'sd', type: 'range', label: t('sd'), min: 0.05, max: 0.45, step: 0.01, visible: function (p) { return p.dirs > 0; }, format: spFmt },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'yg-wave', label: t('legendWave') },
      { shape: 'yg-pat', label: t('legendPat') },
      { shape: 'yg-dip', label: t('legendDipole') },
      { shape: 'yg-main', label: t('legendMain') },
      { shape: 'yg-bar', label: t('legendBar') }
    ],

    render: function (c) {
      var mp = h('div', { class: 'yg-pic' }), cu = h('div', { class: 'yg-cur' });
      var pe = h('div', { class: 'yg-polar' }), ph = h('div', { class: 'yg-polar' }), bs = h('div', { class: 'yg-bars' });
      c.stage.replaceChildren(h('div', { class: 'yg' },
        h('div', { class: 'yg-col' }, mp, cu),
        h('div', { class: 'yg-col' }, pe, ph),
        h('div', { class: 'yg-col' }, table(c.state), h('p', { class: 'yg-units' }, t('units')), bs)));
      drawMap(mp, c.state);
      drawCurrents(cu, c.state);
      drawPolar(pe, c.state, 'E');
      drawPolar(ph, c.state, 'H');
      drawBars(bs, c.state);
    },

    caption: function (c) {
      var st = c.state, p = st.p, parts = [];
      var b = function (x) { return h('b', null, x); };
      function tune(i) { var x = st.selfX[i]; return x > 2 ? t('tuneLong') : x < -2 ? t('tuneShort') : t('tuneRes'); }
      function rel(i) { var ph = st.cur[i].phase; return ph > 0 ? t('relLead', { v: deg(ph) }) : t('relLag', { v: deg(-ph) }); }
      var ri = p.refl ? 0 : -1, di = st.fed + 1;
      var first = st.series[1] - st.series[0], last = p.dirs >= 2 ? st.series[p.dirs] - st.series[p.dirs - 1] : 0;
      function mk() { return {   // fresh nodes for each sentence: a node can sit in one place only
        le: b(lam(L.DRIVEN)), dbi: b(dbi(st.dbi)), dbd: b(t('dbd', { v: (st.dbd > 0.005 ? '+' : '') + num(st.dbd, 2) })),
        z: b(zfmt(st.zin)), alone: b(zfmt(st.zAlone)), main: b(deg(st.main)), fb: b(st.fbDb === null ? '' : dbv(st.fbDb)),
        len: b(lam(ri >= 0 && p.dirs === 0 ? p.lr : p.ld)), tune: ri >= 0 && p.dirs === 0 ? tune(ri) : tune(Math.min(di, st.els.length - 1)),
        amp: b(num(st.cur[ri >= 0 && p.dirs === 0 ? ri : Math.min(di, st.els.length - 1)].amp, 2)),
        rel: b(rel(ri >= 0 && p.dirs === 0 ? ri : Math.min(di, st.els.length - 1))),
        lenR: b(lam(p.lr)), tuneR: ri >= 0 ? tune(ri) : '', ampR: b(num(ri >= 0 ? st.cur[ri].amp : 0, 2)), relR: b(ri >= 0 ? rel(ri) : ''),
        lenD: b(lam(p.ld)), tuneD: di < st.els.length ? tune(di) : '', ampD: b(num(di < st.els.length ? st.cur[di].amp : 0, 2)),
        relD: b(di < st.els.length ? rel(di) : ''),
        step: b(deg(st.dirStep === null ? 0 : st.dirStep)), free: b(deg(360 * p.sd)), sd: b(t('lamVal', { v: num(p.sd, 2) })),
        first: b(dbv(first)), last: b(dbv(Math.abs(last))), firstS: b(sdb(first)), lastS: b(sdb(last)),
        ind: !p.refl ? (p.dirs === 1 ? t('indD') : t('indMany')) : p.dirs === 0 ? t('indR') : t('indMany')
      }; }
      function say(key) { if (parts.length) parts.push(' '); parts = parts.concat(t.parts(key, mk())); }
      if (st.single) { say('main_single'); return parts; }
      say(st.kind === 'fwd' ? (p.dirs ? 'main_fwd' : 'main_fwdR') : 'main_' + st.kind);
      if (p.dirs >= 2) say(!(st.kind === 'fwd' && st.dirSteady) ? 'cur_dirsMixed' : st.dirStep > 360 * p.sd ? 'cur_dirsSlow' : 'cur_dirsFast');
      else if (p.refl && p.dirs === 1) say('cur_both');
      else if (p.refl) say('cur_refl');
      else say('cur_dir1');
      say(st.backNull ? 'back_null' : st.fbDb >= 20 ? 'back_strong' : st.fbDb >= 10 ? 'back_mid' : 'back_weak');
      say(st.zin[0] < st.zAlone[0] ? 'gain_down' : 'gain_up');
      if (p.dirs >= 2) say(first < 0 ? 'more_dirsSigned' : last >= 0 ? 'more_dirs' : 'more_dirsLoss');
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
