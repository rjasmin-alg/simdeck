<!-- encapsulation: a message goes down the sender's TCP/IP stack (each layer prepends its header; the link layer also
     appends the FCS and pads a short packet), onto the wire (preamble and SFD, not counted), and up the receiver's
     stack (each layer strips its own outermost blocks). A stepper, one layer per step. Two stacks side by side with the
     medium between them; under them the PDU strip: the unit's blocks left to right, one bracket per nested unit.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

[data-sim="encapsulation"] .en-blk[data-gone] b,
[data-sim="encapsulation"] .en-blk[data-gone] .en-sz { text-decoration: line-through; text-decoration-thickness: 0.15rem; }

/* legend: the FCS trailer swatch is hatched */

@media (max-width: 900px), (max-aspect-ratio: 1/1) {

  [data-sim="encapsulation"] .en-col > .en-layer { flex: none; }
  [data-sim="encapsulation"] .en-host[data-side="receiver"] { justify-content: flex-start; }

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Series colour per block kind and per layer (legend: data c1, transport c2, network c3, link c4, tunnel c5). */
  var KIND_C = { data: 1, tcp: 2, udp: 2, ip: 3, eth: 4, fcs: 4, pad: 4, oip: 5, gre: 5, pre: 4 };
  var LAYER_C = { application: 1, transport: 2, network: 3, tunnel: 5, link: 4 };
  var SERIES = { 1: 'var(--c1)', 2: 'var(--c2)', 3: 'var(--c3)', 4: 'var(--c4)', 5: 'var(--c5)' };
  var PROTO = { application: null, transport: null, network: 'k_ip', tunnel: null, link: 'k_eth' };
  /** Minimum column width (rem) per block kind; the rest of the strip is shared in proportion to the octets. */
  var MIN_W = { data: 5.5, pad: 6.5, fcs: 4.5, pre: 9.5 };

  /** t.parts with *word* turned into an English term in italics (term pairs not in the glossary yet). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function span() { return h('span', null, Array.prototype.slice.call(arguments)); }
  function oct(n) { return t.n('octets', n); }
  function octA(n) { return t.n('octetAdj', n); }
  function bold(s) { return h('b', null, s); }
  /** The name key of a unit: the outer IPv4 packet of a tunnel has its own. */
  function unitKey(pdu) { return pdu.length && pdu[0].kind === 'oip' ? 'outer' : L.unitOf(pdu); }
  function unitTerm(pdu) { return span(rich('unitT_' + unitKey(pdu))); }
  function protoKey(p, layer) {
    if (layer === 'transport') return p.proto === 'udp' ? 'k_udp' : 'k_tcp';
    return PROTO[layer];
  }
  function sizeOf(p, layer) {
    if (layer === 'transport') return p.proto === 'udp' ? L.SIZE.udp : L.SIZE.tcp;
    return 0;
  }

  /** Octets each layer added (sender) or removed (receiver), from the replayed states up to step n. */
  function deltas(p, n) {
    var plan = L.plan(p), out = { sender: {}, receiver: {} };
    for (var k = 1; k <= Math.min(n, plan.length); k++) {
      var a = plan[k - 1];
      if (!a.side) continue;
      var before = Simdeck.stateAt(L, p, k - 1), after = Simdeck.stateAt(L, p, k);
      out[a.side][a.layer] = { k: k, d: L.total(after.pdu) - L.total(before.pdu), b: L.total(after.pdu) };
    }
    return out;
  }

  function stack(side, c) {
    var p = c.params, s = c.state, done = deltas(p, c.n)[side];
    return L.layersOf(p).map(function (layer) {
      var d = done[layer];
      var now = s.side === side && s.layer === layer;
      var deltaText = '';
      if (d) {
        if (layer === 'application') deltaText = (side === 'sender' ? t('created') : t('read')) + (p.showSizes ? ' ' + t('bytesShort', { b: d.b }) : '');
        else if (p.showSizes) deltaText = d.d >= 0 ? t('addedBytes', { b: d.d }) : t('removedBytes', { b: -d.d });
      }
      var proto = layer === 'tunnel' ? t('k_gre') + ' + ' + t('k_ip') : protoKey(p, layer) ? t(protoKey(p, layer)) : '';
      return h('div', {
        class: 'en-layer' + (now ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''),
        dataset: { state: now ? 'now' : d ? 'done' : 'idle', layer: layer },
        style: { '--sw': SERIES[LAYER_C[layer]] }
      },
        h('span', { class: 'en-lname' }, t('l_' + layer)),
        proto ? h('span', { class: 'en-proto' }, proto) : null,
        h('span', { class: 'en-delta' }, deltaText));
    });
  }

  /** The blocks to draw: on a strip step the removed ones stay as struck-out ghosts; on the wire the preamble leads. */
  function shown(c) {
    var s = c.state;
    if (s.action === 'strip') {
      var prev = c.prev.pdu, front = 0;
      while (front < prev.length && prev[front].layer === s.layer) front++;
      var back = prev.length;
      while (back > front && prev[back - 1].layer === s.layer) back--;
      return { lead: front, blocks: prev.map(function (b, i) { return { b: b, gone: i < front || i >= back }; }) };
    }
    var blocks = s.pdu.map(function (b) { return { b: b, fresh: (s.action === 'add' || s.action === 'create') && b.layer === s.layer }; });
    if (s.action === 'wire') return { lead: 1, blocks: [{ b: { kind: 'pre', layer: 'physical', bytes: L.PREAMBLE }, fresh: true }].concat(blocks) };
    return { lead: 0, blocks: blocks };
  }

  function strip(c) {
    var p = c.params, s = c.state;
    if (!s.pdu.length && s.action !== 'strip') return h('div', { class: 'en-empty' }, t('nothingYet'));
    var view = shown(c);
    var cols = view.blocks.map(function (x) {
      var min = MIN_W[x.b.kind] || 6;
      return 'minmax(calc(' + min + 'rem * var(--mw)), ' + Math.max(x.b.bytes, 1) + 'fr)';
    }).join(' ');
    var units = L.units(s.pdu);
    var rows = units.length;
    var kids = [];
    units.forEach(function (u, i) {
      var label = [t('u_' + (u.kind === 'oip' ? 'outer' : u.unit))];
      if (p.showSizes) label.push(' · ', bold(oct(u.bytes)));
      kids.push(h('div', {
        class: 'en-br',
        dataset: i === 0 ? { outer: '' } : {},
        style: { gridColumn: (u.from + view.lead + 1) + ' / ' + (u.to + view.lead + 2), gridRow: String(i + 1) }
      }, h('span', null, label)));
    });
    view.blocks.forEach(function (x, i) {
      var b = x.b, k = b.kind;
      var name = t('k_' + k);
      var hollow = k === 'pad' || k === 'pre' || (k === 'data' && b.bytes === 0);
      var cls = 'en-blk' + (hollow || x.gone ? '' : ' sd-fill') + (k === 'fcs' && !x.gone ? ' sd-hatch' : '') +
        (x.fresh || x.gone ? ' sd-changed' : '') + (x.fresh && c.dir === 'forward' ? ' sd-anim-in' : '');
      var ds = { kind: k, c: String(KIND_C[k]) };
      if (x.gone) ds.gone = '';
      if (k === 'data' && b.bytes === 0) ds.empty = '';
      kids.push(h('div', {
        class: cls, dataset: ds, style: { gridColumn: String(i + 1), gridRow: String(rows + 1), '--sw': SERIES[KIND_C[k]] },
        'aria-label': t('blockLabel', { name: name, b: b.bytes })
      },
        h('b', { class: 'en-lab' }, name),
        p.showSizes ? h('span', { class: 'en-sz' }, t('bytesShort', { b: b.bytes }) + (k === 'pre' ? ', ' + t('notCounted') : '')) : null));
    });
    return h('div', { class: 'en-strip', style: { gridTemplateColumns: cols } }, kids);
  }

  function middle(c) {
    var p = c.params, s = c.state;
    var arrow = s.phase === 'down' ? '↓' : s.phase === 'wire' ? '→' : s.phase === 'up' ? '↑' : s.phase === 'done' ? '✓' : '';
    var kids = [h('div', { class: 'en-arrow', 'aria-hidden': 'true' }, arrow || ' ')];
    if (!s.pdu.length) kids.push(h('div', { class: 'en-unit en-muted' }, t('nothingYet')));
    else {
      var name = t('u_' + unitKey(s.pdu));
      kids.push(h('div', { class: 'en-unit' }, p.showSizes ? [name, ' · ', h('span', { class: 'sd-mono' }, oct(L.total(s.pdu)))] : name));
    }
    if (s.phase === 'wire' && p.showSizes) kids.push(h('div', { class: 'en-wire-note' }, t('onWire', { b: L.onWire(s.pdu) })));
    return h('div', { class: 'en-mid' }, kids);
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'proto', type: 'choice', label: t('proto'), options: [['tcp', t('k_tcp')], ['udp', t('k_udp')]] },
      { key: 'payload', type: 'range', label: t('payload'), min: 0, max: L.payloadMax, step: 10, format: function (v) { return t('bytesShort', { b: v }); } },
      { key: 'tunnel', type: 'toggle', label: t('tunnel'), hint: t('tunnelHint'), resets: true },
      { key: 'showSizes', type: 'toggle', label: t('showSizes') }
    ],

    presets: [
      { id: 'http-get', label: t('presetHttp'), hint: t('presetHttpHint'), params: { proto: 'tcp', payload: 300 } },
      { id: 'dns-udp', label: t('presetDns'), hint: t('presetDnsHint'), params: { proto: 'udp', payload: 40 } },
      { id: 'pure-ack', label: t('presetAck'), hint: t('presetAckHint'), params: { proto: 'tcp', payload: 0 } },
      { id: 'full-frame', label: t('presetFull'), hint: t('presetFullHint'), params: { proto: 'tcp', payload: 1460 } },
      { id: 'gre-tunnel', label: t('presetGre'), hint: t('presetGreHint'), params: { proto: 'tcp', payload: 300, tunnel: true } }
    ],

    legend: [
      { c: 1, label: t('legendData') },
      { c: 2, label: t('legendTransport') },
      { c: 3, label: t('legendNetwork') },
      { c: 4, shape: 'trailer', label: t('legendLink') },
      { shape: 'hollow', label: t('legendPad') },
      { c: 5, label: t('legendTunnel') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var host = function (side) {
        return h('div', { class: 'en-host', dataset: { side: side } }, t(side), h('span', null, t(side + 'Sub')));
      };
      var top = [
        h('div', { class: 'en-col' }, host('sender'), stack('sender', c)),
        middle(c),
        h('div', { class: 'en-col' }, host('receiver'), stack('receiver', c))
      ];
      var wire = c.state.phase === 'wire';
      top.push(h('div', { class: 'en-medium' + (wire ? ' sd-changed' : ''), dataset: { state: wire ? 'now' : 'idle' } }, h('span', null, t('medium'))));
      c.stage.replaceChildren(h('div', { class: 'en' },
        h('div', { class: 'en-top' }, top),
        h('div', { class: 'en-stripwrap' }, strip(c))));
    },

    caption: function (c) {
      var p = c.params, s = c.state;
      var total = L.total(s.pdu);
      var protoName = t(p.proto === 'udp' ? 'k_udp' : 'k_tcp');
      var hdr = span(rich(p.proto === 'udp' ? 'hdrT_udp' : 'hdrT_tcp'));
      if (s.action === 'start') {
        if (p.payload > 0) return rich('capStart', { b: bold(oct(p.payload)), proto: t(p.proto === 'udp' ? 'protoGen_udp' : 'protoGen_tcp') });
        return p.proto === 'udp' ? rich('capStartEmptyUdp') : rich('capStartEmpty', { proto: protoName });
      }
      if (s.action === 'create') return p.payload > 0 ? rich('capCreate', { b: bold(oct(p.payload)) }) : rich('capCreateEmpty');
      if (s.action === 'add') {
        var vars = { unit: unitTerm(s.pdu), b: bold(oct(total)) };
        if (s.layer === 'transport') return rich(p.payload > 0 ? 'capTransport' : 'capTransportEmpty', Object.assign(vars, { hdr: hdr, h: oct(sizeOf(p, 'transport')) }));
        if (s.layer === 'network') return rich('capNetwork', Object.assign(vars, { hdr: span(rich('hdrT_ip')), h: oct(L.SIZE.ip), below: span(rich('belowT_' + (p.proto === 'udp' ? 'datagram' : 'segment'))) }));
        if (s.layer === 'tunnel') return rich('capTunnel', vars);
        var out = rich('capLink', vars);
        var pad = s.pdu.filter(function (b) { return b.kind === 'pad'; })[0];
        if (pad) out = out.concat(' ', rich('capLinkPad', { p: oct(L.total(c.prev.pdu)), pad: bold(oct(pad.bytes)) }));
        return out;
      }
      if (s.action === 'wire') return rich('capWire', { w: bold(oct(L.onWire(s.pdu))), b: oct(total) });
      if (s.action === 'strip') {
        var up = { unit: unitTerm(s.pdu), ba: bold(octA(total)), next: t(p.tunnel ? 'next_tunnel' : 'next_network') };
        if (s.layer === 'link') {
          var gone = c.prev.pdu.filter(function (b) { return b.kind === 'pad'; })[0];
          return gone ? rich('capStripLinkPad', Object.assign(up, { pad: oct(gone.bytes) })) : rich('capStripLink', up);
        }
        if (s.layer === 'tunnel') return rich('capStripTunnel', up);
        if (s.layer === 'network') return rich('capStripNetwork', Object.assign(up, { hdr: span(rich('hdrT_ip')) }));
        return p.payload > 0 ? rich('capStripTransport', { hdr: hdr, b: bold(oct(p.payload)) }) : rich('capStripTransportEmpty', { hdr: hdr });
      }
      return p.payload > 0 ? rich('capDeliver', { b: bold(oct(p.payload)) }) : rich('capDeliverEmpty');
    }
  });
})();
</script>
