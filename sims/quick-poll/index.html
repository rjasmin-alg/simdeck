     lives in this page and changes only through the pure functions in sim.js (SPEC.md). No transport is chosen yet

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings); // picks the language; every visible word goes through t
  var KEY = 'simdeck.quick-poll';
  var VOTER_KEY = 'simdeck.quick-poll.voter';
  var STALE_MS = 3 * 60 * 60 * 1000;
  var SERIES = { A: 'var(--c1)', B: 'var(--c2)', C: 'var(--c3)', D: 'var(--c4)' };
  /** The practice class's leanings per kind (weights per letter), so the bars look like a class, not noise. */
  var LEAN = { abcd: [2, 5, 2, 1], yesno: [3, 2], confidence: [2, 4, 3, 1] };
  var SIM_BATCH = 5;

  // ── page state: the poll (model state) and what only the demo needs ──
  var page = load() || fresh();
  var sim;
  var notice = '';       // a one-off addition to the caption (the practice class)

  function fresh() {
    return { poll: L.create('abcd', 1), joinN: randomInt(), simFor: 0, simN: 0, seq: 0, phoneMsg: null, savedAt: 0 };
  }
  function randomInt() {
    try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0]; } catch (e) { return 0; }
  }
  function load() {
    try {
      var x = JSON.parse(sessionStorage.getItem(KEY) || 'null');
      if (!x || typeof x.savedAt !== 'number' || Math.abs(Date.now() - x.savedAt) > STALE_MS) return null;
      var poll = L.sanitize(x.poll);
      if (!poll) return null;
      var n = function (v) { return Number.isInteger(v) && v >= 0 ? v : 0; };
      var m = x.phoneMsg;
      return { poll: poll, joinN: n(x.joinN), simFor: n(x.simFor), simN: n(x.simN), seq: n(x.seq),
        phoneMsg: m && typeof m.code === 'string' && typeof m.option === 'string' && m.pollId === poll.pollId ? m : null };
    } catch (e) { return null; }
  }
  function save() {
    page.savedAt = Date.now();
    try { sessionStorage.setItem(KEY, JSON.stringify(page)); } catch (e) { /* unavailable: a reload starts empty */ }
  }

  // This browser's voter id (rule 4): random, kept per browser, never a name. Without storage it lasts this page load.
  var voterId = (function () {
    var id = null;
    try { id = localStorage.getItem(VOTER_KEY); } catch (e) { /* unavailable */ }
    if (L.isVoterId(id)) return id;
    try {
      var a = new Uint8Array(8);
      crypto.getRandomValues(a);
      id = Array.prototype.map.call(a, function (b) { return (b + 256).toString(16).slice(1); }).join('');
    } catch (e) { return null; }
    try { localStorage.setItem(VOTER_KEY, id); } catch (e) { /* unavailable */ }
    return id;
  })();

  // ── actions: every change of the poll goes through sim.js ──
  function apply(next) {
    if (next !== page.poll && next.pollId !== page.poll.pollId) page.phoneMsg = null;
    page.poll = next;
    save();
    if (sim) sim.render();
  }
  function act(fn) { return function () { notice = ''; apply(fn(page.poll)); }; }
  var toggleOpen = act(function (s) { return s.phase === 'open' ? L.close(s) : L.open(s); });
  var reveal = act(L.reveal);
  var nextQuestion = act(function (s) { return L.reset(s); });
  function advance() { notice = ''; apply(page.poll.phase === 'open' ? L.close(page.poll) : L.reveal(page.poll)); }

  /** The phone mock-up: one ballot from this browser's id, through the same check the transport would use. */
  function phoneVote(option) {
    notice = '';
    var s = page.poll;
    if (!voterId) { page.phoneMsg = { pollId: s.pollId, code: 'no-id', option: option }; save(); sim.render(); return; }
    var b = { pollId: s.pollId, voter: voterId, option: option, at: ++page.seq };
    page.phoneMsg = { pollId: s.pollId, code: L.check(s, b), option: option };
    apply(L.vote(s, b));
  }

  /** The practice class: SIM_BATCH new voters per press, drawn from Simdeck.rng seeded by the poll and the count. */
  function simulate() {
    var s = page.poll;
    if (s.phase !== 'open') { notice = t('captionSimClosed'); sim.render(); return; }
    if (page.simFor !== s.pollId) { page.simFor = s.pollId; page.simN = 0; }
    var lean = LEAN[s.kind];
    var sum = lean.reduce(function (a, w) { return a + w; }, 0);
    for (var i = 0; i < SIM_BATCH; i++) {
      var k = page.simN++;
      var r = Simdeck.rng(s.pollId * 100003 + k)();
      var x = r * sum, o = 0;
      while (o < lean.length - 1 && x >= lean[o]) { x -= lean[o]; o++; }
      var id = 'sim' + s.pollId.toString(36) + 'v' + (100000 + k).toString(36);
      s = L.vote(s, { pollId: s.pollId, voter: id, option: s.options[o], at: ++page.seq });
    }
    notice = t('captionSimAdded', { n: SIM_BATCH });
    apply(s);
  }

  // Space: the next of close → reveal, through the page's own key (the kit gives Space only to steppers). A focused
  // control keeps its own Space, as on a stepper page.
  function spaceKey() {
    var a = document.activeElement;
    var own = a instanceof HTMLElement && a !== document.body ? a.closest('button, a[href], summary, select, input:not([type="range"])') : null;
    if (own) { if (own.tagName !== 'SELECT') own.click(); return; }
    advance();
  }

  // ── option labels: what the lecturer typed, else the kind's own words, else the letter alone ──
  function defaultText(kind, l) {
    if (kind === 'yesno') return t(l === 'A' ? 'yes' : 'no');
    if (kind === 'confidence') return t('conf' + l);
    return '';
  }
  function optionText(s, l) { return s.texts[l] || defaultText(s.kind, l); }
  function typed(s, l) { return !!s.texts[l]; }

  // ── the lecturer's text fields (the kit has no text param): kept in the poll, so the language switch keeps them ──
  var fieldsBox = document.querySelector('.qp-fields');
  var qInput = h('input', { type: 'text', id: 'qp-q', autocomplete: 'off', maxlength: String(L.MAX_QUESTION), placeholder: t('textQuestionPh') });
  var optInputs = {};
  function onText() {
    var texts = {};
    L.LETTERS.forEach(function (l) { texts[l] = optInputs[l].input.value; });
    var next = L.setText(page.poll, qInput.value, texts);
    if (next !== page.poll) { page.poll = next; save(); sim.render(); }
  }
  // The correct answer lives here, collapsed and out of the URL, so the room does not see it before reveal (rule 3).
  var cSelect = h('select', { id: 'qp-c' });
  var cHint = h('small', { class: 'sd-hint', id: 'qp-c-hint' });
  cSelect.setAttribute('aria-describedby', 'qp-c-hint');
  cSelect.addEventListener('change', function () {
    var next = L.setCorrect(page.poll, cSelect.value);
    cSelect.blur(); // the clicker's keys work again at once
    if (next !== page.poll) { page.poll = next; save(); sim.render(); }
  });
  fieldsBox.append(h('div', { class: 'qp-field' }, h('label', { for: 'qp-c' }, t('correct')), cSelect, cHint));
  fieldsBox.append(h('div', { class: 'qp-field' }, h('label', { for: 'qp-q' }, t('textQuestion')), qInput));
  L.LETTERS.forEach(function (l) {
    var input = h('input', { type: 'text', id: 'qp-o' + l, autocomplete: 'off', maxlength: String(L.MAX_TEXT) });
    var wrap = h('div', { class: 'qp-field' }, h('label', { for: 'qp-o' + l }, t('textOption', { o: l })), input);
    optInputs[l] = { input: input, wrap: wrap };
    fieldsBox.append(wrap);
  });
  [qInput].concat(L.LETTERS.map(function (l) { return optInputs[l].input; })).forEach(function (i) {
    i.addEventListener('input', onText);
    // Enter or Escape leaves the field, so the clicker's keys work again at once
    i.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); i.blur(); } });
  });
  var fieldsFor = null; // the pollId and kind the fields were filled for
  function syncCorrect(s) {
    var none = !!L.NO_CORRECT[s.kind];
    var opts = [['none', t('correctNone')]].concat(none ? [] : s.options.map(function (l) {
      var d = defaultText(s.kind, l);
      return [l, d ? l + ' · ' + d : l];
    }));
    var sig = opts.map(function (o) { return o.join('='); }).join('|');
    if (cSelect.dataset.sig !== sig) {
      cSelect.dataset.sig = sig;
      cSelect.replaceChildren.apply(cSelect, opts.map(function (o) { return h('option', { value: o[0] }, o[1]); }));
    }
    cSelect.value = s.correct || 'none';
    cSelect.disabled = none;
    cHint.textContent = none ? t('correctNoneReason') : t('correctHint');
  }
  function syncFields(s) {
    syncCorrect(s);
    var sig = s.pollId + '|' + s.kind;
    if (sig === fieldsFor) return;
    fieldsFor = sig;
    if (document.activeElement !== qInput) qInput.value = s.question;
    L.LETTERS.forEach(function (l) {
      var o = optInputs[l], has = s.options.indexOf(l) >= 0;
      o.wrap.hidden = !has;
      if (document.activeElement !== o.input) o.input.value = has ? s.texts[l] : '';
      o.input.placeholder = defaultText(s.kind, l) || t('textOptionPh');
    });
  }

  // ── transport bar: close / reopen, reveal, new question ──
  function tbtn(cls, key, keyText, onclick, content) {
    return h('button', { type: 'button', class: 'sd-btn ' + cls, 'aria-keyshortcuts': key,
      onmousedown: function (e) { e.preventDefault(); }, onclick: onclick }, content, h('kbd', null, keyText));
  }
  function guarded(b, fn) { return function () { if (b.getAttribute('aria-disabled') !== 'true') fn(); }; }
  var openLabel = h('span', { class: 'sd-btn-label' });
  var bOpen = tbtn('qp-open', 'O', 'O', function () { guarded(bOpen, toggleOpen)(); }, openLabel);
  var bReveal = tbtn('sd-btn--primary qp-reveal', 'V', 'V', function () { guarded(bReveal, reveal)(); }, h('span', { class: 'sd-btn-label' }, t('reveal')));
  var bNext = tbtn('qp-next', 'N', 'N', function () { nextQuestion(); }, h('span', { class: 'sd-btn-label' }, t('next')));

  // ── drawing ──
  function badge(phase) {
    if (phase === 'open') return '● ' + t('phaseOpen');
    if (phase === 'closed') return '■ ' + t('phaseClosed');
    return '✓ ' + t('phaseRevealed');
  }

  function projector(s, v) {
    var code = L.joinCode(page.joinN);
    var q = s.question;
    var rows = v.rows.map(function (r) {
      var text = optionText(s, r.option);
      var hidden = !v.shown;
      return h('li', { class: 'qp-row', dataset: { correct: String(r.correct), top: String(r.top) },
        style: { '--sw': SERIES[r.option] } },
        h('span', { class: 'qp-letter', translate: 'no' }, r.option, r.correct ? h('span', { class: 'qp-tick', 'aria-hidden': 'true' }, '✓') : null),
        h('span', { class: 'qp-mid' },
          text ? h('span', { class: 'qp-text', translate: typed(s, r.option) ? 'no' : null }, text) : null,
          h('span', { class: 'qp-track', dataset: { hidden: String(hidden) }, role: 'img',
            'aria-label': hidden ? r.option + ': ' + t('hidden') : t('barLabel', { o: r.option, n: r.count, pct: r.pct }) },
            hidden ? null : h('span', { class: 'qp-fill', style: { width: r.pct + '%' } }))),
        h('span', { class: 'qp-num', dataset: { hidden: String(hidden) } },
          hidden ? '?' : [r.pct + ' %', ' ', h('small', null, '(' + r.count + ')'), r.top ? ' ▲' : '']));
    });
    var note = v.shown && v.total > 0 && v.sum !== 100 ? t('sumNote', { sum: v.sum }) : '';
    return h('section', { class: 'qp-proj', dataset: { phase: s.phase }, 'aria-label': t('projector') },
      h('div', { class: 'qp-head' },
        q ? h('p', { class: 'qp-q', translate: 'no' }, q) : h('p', { class: 'qp-q', dataset: { empty: 'true' } }, t('questionOnSlide')),
        h('span', { class: 'qp-badge' }, badge(s.phase))),
      h('div', { class: 'qp-body' },
        h('ol', { class: 'qp-rows', dataset: { n: String(rows.length) } }, rows),
        h('div', { class: 'qp-side' },
          h('div', { class: 'qp-join' },
            h('span', { class: 'qp-join-t' }, t('joinTitle')),
            h('span', { class: 'qp-code', translate: 'no' }, code),
            h('small', { class: 'qp-demo' }, t('joinDemo'))),
          h('div', { class: 'qp-count', role: 'status' },
            h('span', { class: 'qp-total' }, String(v.total)),
            h('span', { class: 'qp-count-w' }, t.n('count', v.total))))),
      h('p', { class: 'qp-note' }, note));
  }

  function phoneMessage(s) {
    var m = page.phoneMsg && page.phoneMsg.pollId === s.pollId ? page.phoneMsg : null;
    var mine = voterId && Object.prototype.hasOwnProperty.call(s.votes, voterId) ? s.votes[voterId].option : null;
    if (s.phase !== 'open') {
      if (m && m.code === 'closed') return { tone: 'no', text: t('phoneClosed') };
      if (mine) return { tone: 'no', text: t('phoneClosedMine', { o: mine }) };
      return { tone: 'no', text: t('phoneClosedIdle') };
    }
    if (m) {
      var o = { o: m.option };
      if (m.code === 'recorded') return { tone: 'ok', text: t('phoneRecorded', o) };
      if (m.code === 'changed') return { tone: 'ok', text: t('phoneChanged', o) };
      if (m.code === 'same') return { tone: 'ok', text: t('phoneSame', o) };
      if (m.code === 'stale') return { tone: 'no', text: t('phoneStale') };
      if (m.code === 'invalid-option') return { tone: 'no', text: t('phoneInvalid') };
      if (m.code === 'no-id' || m.code === 'invalid-voter') return { tone: 'no', text: t('phoneNoId') };
      // 'closed' from before a reopen: the poll is open again, so say what stands now
    }
    if (mine) return { tone: 'ok', text: t('phoneYours', { o: mine }) };
    return { tone: '', text: '' };
  }

  function phone(s) {
    var mine = voterId && Object.prototype.hasOwnProperty.call(s.votes, voterId) ? s.votes[voterId].option : null;
    var closed = s.phase !== 'open';
    var msg = phoneMessage(s);
    return h('section', { class: 'qp-phone', 'aria-label': t('phone') },
      h('div', { class: 'qp-screen' },
        h('p', { class: 'qp-ph-head' }, t('pollTitle'), ' · ', h('span', { translate: 'no' }, L.joinCode(page.joinN))),
        s.question ? h('p', { class: 'qp-ph-q', translate: 'no' }, s.question) : null,
        h('p', { class: 'qp-ph-q' }, t('phoneAsk')),
        h('div', { class: 'qp-ph-btns', dataset: { n: String(s.options.length) } }, s.options.map(function (l) {
          var text = optionText(s, l);
          return h('button', { type: 'button', class: 'qp-ph-btn', style: { '--sw': SERIES[l] },
            'aria-pressed': String(mine === l), 'aria-disabled': String(closed),
            onmousedown: function (e) { e.preventDefault(); }, onclick: function () { phoneVote(l); } },
            h('b', { translate: 'no' }, l), text ? h('span', { translate: typed(s, l) ? 'no' : null }, text) : null);
        })),
        h('p', { class: 'qp-ph-msg', role: 'status', dataset: { tone: msg.tone } }, msg.text),
        h('small', { class: 'qp-ph-anon' }, t('phoneAnon'))));
  }

  /** Bring the poll in line with the kit's params: another kind is a new poll. */
  function reconcile(p) {
    var s = L.setKind(page.poll, p.kind);
    if (s !== page.poll) {
      if (s.pollId !== page.poll.pollId) page.phoneMsg = null;
      page.poll = s;
      save();
    }
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'kind', type: 'choice', label: t('kind'), hint: t('kindHint'),
        options: [['abcd', t('kindAbcd')], ['yesno', t('kindYesno')], ['confidence', t('kindConfidence')]] },
      { key: 'view', type: 'choice', label: t('view'),
        options: [['both', t('viewBoth')], ['projector', t('viewProjector')], ['phone', t('viewPhone')]] },
      { type: 'button', label: t('simulate'), hint: t('simulateHint'), key: 'd', run: function () { simulate(); } }
    ],

    presets: [
      { id: 'abcd-blank', label: t('presetBlank'), params: { kind: 'abcd' } },
      { id: 'yes-no', label: t('presetYesNo'), params: { kind: 'yesno' } },
      { id: 'confidence', label: t('presetConfidence'), params: { kind: 'confidence' } }
    ],

    legend: [
      { shape: 'qp-bar', label: t('legendBar') },
      { shape: 'qp-hidden', label: t('legendHidden') },
      { shape: 'qp-correct', label: t('legendCorrect') },
      { shape: 'qp-top', label: t('legendTop') }
    ],

    keys: [
      { key: ' ', label: t('keyAdvance'), run: spaceKey },
      { key: 'o', label: t('keyOpen'), run: function () { guarded(bOpen, toggleOpen)(); } },
      { key: 'v', label: t('keyReveal'), run: function () { guarded(bReveal, reveal)(); } },
      { key: 'n', label: t('keyNext'), run: function () { nextQuestion(); } }
    ],

    render: function (c) {
      reconcile(c.params);
      var s = page.poll;
      var v = L.view(s);
      syncFields(s);
      var view = c.params.view;
      c.stage.replaceChildren(h('div', { class: 'qp', dataset: { view: view } },
        view !== 'phone' ? projector(s, v) : null,
        view !== 'projector' ? phone(s) : null));

      openLabel.textContent = t(s.phase === 'open' ? 'close' : 'reopen');
      bOpen.setAttribute('aria-disabled', String(s.phase === 'revealed'));
      bReveal.setAttribute('aria-disabled', String(s.phase === 'revealed'));
    },

    caption: function () {
      var s = page.poll;
      var v = L.view(s);
      var key = s.phase === 'open' ? 'captionOpen' : s.phase === 'closed' ? 'captionClosed' : 'captionRevealed';
      var out = t(key, { n: v.total });
      if (v.correct) {
        var row = v.rows.filter(function (r) { return r.correct; })[0];
        out += ' ' + t('captionCorrect', { o: v.correct, pct: row.pct });
      }
      return notice ? out + ' ' + notice : out;
    }
  });

  var bar = document.querySelector('[data-sd-transport]');
  if (bar) bar.insertBefore(h('div', { class: 'sd-tgroup qp-tgroup', role: 'group', 'aria-label': t('pollTitle') }, bOpen, bReveal, bNext), bar.firstChild);
  sim.render();
})();
</script>
</body>
</html>
