<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="ui.pageTitle">Domene kvara i minimalni rezni skupovi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="toolbar">
  <a class="sd-back" data-sd-back href="../../index.html" data-t-title="ui.backTitle"><span aria-hidden="true">←</span> <span data-t="ui.back">Popis</span></a>
  <strong class="brand"><span translate="no">faultline</span> <span class="brand-sub" data-t="ui.brandSub">· dizajn grozda</span></strong>
  <select id="sample-picker" data-t-label="ui.scenario"></select>
  <span class="spacer"></span>
  <label class="inline"><input type="checkbox" id="toggle-auth" checked> <span data-t="ui.showAuth">Prikaži ono što nitko nije nacrtao</span></label>
  <label class="inline"><span data-t="ui.searchTo">Traži do veličine</span>
    <select id="max-size"><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
  </label>
  <button id="reset" type="button" data-t="ui.reset">Popravi sve</button>
  <button id="btn-lang" type="button" data-t="ui.lang" data-t-title="ui.langTitle">EN</button>
</header>

<main id="stage">
  <aside id="rail-left">
    <h2 data-t="ui.events">Događaji kvara</h2>
    <p class="hint" data-t="ui.eventsHint">Klikni događaj da ga pokvariš. Sve što počiva na njemu pada s njim.</p>
    <div id="event-list"></div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </section>

  <aside id="rail-right">
    <h2 data-t="ui.cuts">Jedinstvene točke kvara</h2>
    <div id="cutset-panel"></div>
  </aside>
</main>

<footer id="statusbar">
  <span id="verdict">—</span>
  <span class="spacer"></span>
  <span id="searched"></span>
</footer>

<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
