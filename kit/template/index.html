<!doctype html>
<!-- simdeck proto-simulator: the template every native sim starts from (kit/new-sim.sh copies it).
     It uses every common element of the kit on a trivial concept. Rules: docs/sim-ui.md. -->
<html lang="hr" data-sim="proto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binarno brojanje · simdeck</title>
<meta name="description" content="Brojač od nekoliko bitova: prijenos (carry), preljev (overflow) i dvojni komplement.">
<link rel="stylesheet" href="../kit.css">
<script src="../kit.js"></script>
<script src="../glossary.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "proto",
  "class": "stepper",
  "steps": 16,
  "title": { "hr": "Binarno brojanje", "en": "Counting in binary" },
  "concept": { "hr": "Kako brojač od nekoliko bitova broji, prenosi i preljeva se", "en": "How a counter of a few bits counts, carries and overflows" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="proto"]; colours only from kit tokens. */
[data-sim="proto"] .bc {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5cqh;
  height: 100%;
  padding: 3cqh 3cqw;
  --cell: min(calc(80cqw / var(--bits)), 26cqh);
}
[data-sim="proto"] .bc-row { display: flex; gap: max(1.2rem, calc(var(--cell) * 0.14)); }
[data-sim="proto"] .bc-col { display: flex; flex-direction: column; align-items: center; gap: 0.3em; }
[data-sim="proto"] .bc-place { color: var(--muted); font-family: var(--mono); font-size: max(16px, calc(var(--cell) * 0.2)); }
[data-sim="proto"] .bc-bit {
  display: grid;
  place-items: center;
  width: var(--cell);
  height: var(--cell);
  border: 0.35rem solid;
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: calc(var(--cell) * 0.55);
  font-weight: 700;
}
[data-sim="proto"] .bc-bit[data-v="0"] { border-style: dashed; border-color: var(--line); background: var(--bg); color: var(--muted); }
[data-sim="proto"] .bc-prev { color: var(--muted); font-family: var(--mono); font-size: max(16px, calc(var(--cell) * 0.24)); }
[data-sim="proto"] .bc-value { font-size: max(1.5rem, calc(var(--cell) * 0.42)); font-weight: 700; }
[data-sim="proto"] .bc-value .sd-mono { color: var(--c1); }
[data-sim="proto"] .bc-wrap { color: var(--danger); }
</style>
</head>
<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Binarno brojanje</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings); // picks the language; every visible word goes through t
  var seed = 1; // the random-start button draws from Simdeck.rng; the model itself stays deterministic

  function bitString(v, bits) { return L.bitsOf(v, bits).join(''); }
  function read(v, p) { return p.signed ? L.signedOf(v, p.bits) : v; }
  function minus(x) { return String(x).replace('-', '−'); }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'bits', type: 'range', label: t('bits'), min: 3, max: 8 },
      { key: 'start', type: 'range', label: t('start'), min: 0, max: function (p) { return Math.pow(2, p.bits) - 1; }, resets: true },
      { key: 'inc', type: 'choice', label: t('inc'), options: [[1, '+1'], [2, '+2'], [3, '+3']] },
      { key: 'signed', type: 'toggle', label: t('signed'), hint: t('signedHint') },
      { key: 'places', type: 'toggle', label: t('places') },
      { type: 'button', label: t('random'), key: 'n', run: function (sim) {
          var p = sim.params;
          sim.set({ start: Simdeck.rng(seed++).int(Math.pow(2, p.bits)) });
        } }
    ],

    presets: [
      { id: 'count', label: t('presetCount'), params: { start: 0 } },
      { id: 'carry', label: t('presetCarry'), params: { start: 6 }, hint: t('presetCarryHint') },
      { id: 'overflow', label: t('presetOverflow'), params: { start: 13 } },
      { id: 'signed', label: t('presetSigned'), params: { start: 5, signed: true } },
      { id: 'byte', label: t('presetByte'), params: { bits: 8, start: 240, inc: 3 } }
    ],

    legend: [
      { c: 1, label: t('legendOne') },
      { shape: 'hollow', label: t('legendZero') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var p = c.params, s = c.state;
      var bits = L.bitsOf(s.value, p.bits);
      var row = h('div', { class: 'bc-row' }, bits.map(function (b, i) {
        var idx = p.bits - 1 - i;
        var changed = s.flipped.indexOf(idx) >= 0;
        var place = p.signed && idx === p.bits - 1 ? '−' + Math.pow(2, idx) : String(Math.pow(2, idx));
        return h('div', { class: 'bc-col' },
          p.places ? h('span', { class: 'bc-place' }, place) : null,
          h('div', {
            class: 'bc-bit' + (b ? ' sd-fill' : '') + (changed ? ' sd-changed' : '') + (changed && c.dir === 'forward' ? ' sd-anim-in' : ''),
            dataset: { v: String(b), c: '1' }, 'aria-label': t('bitLabel', { i: idx, v: b })
          }, String(b)));
      }));
      c.stage.replaceChildren(h('div', { class: 'bc', style: { '--bits': String(p.bits) } },
        c.prev ? h('div', { class: 'bc-prev' }, t('before', { bits: bitString(c.prev.value, p.bits), added: s.added })) : h('div', { class: 'bc-prev' }, ' '),
        row,
        h('div', { class: 'bc-value' }, '= ', h('span', { class: 'sd-mono' }, minus(read(s.value, p))),
          s.wrapped ? h('span', { class: 'bc-wrap' }, '  ' + t('wrapped')) : null)));
    },

    caption: function (c) {
      var p = c.params, s = c.state;
      var now = bitString(s.value, p.bits) + ' = ' + minus(read(s.value, p));
      if (c.first) return t.parts('captionStart', { now: h('b', null, now) });
      var n = s.flipped.length;
      var parts = t.parts('captionStep', { n: c.n, sum: bitString(c.prev.value, p.bits) + ' + ' + s.added, now: h('b', null, now) });
      parts.push(' ', t.n('flipped', n));
      if (s.wrapped) parts.push(' ', h('span', { class: 'sd-hl' }, t('overflowWord')), t('overflowRest', { bits: t.n('bitsIn', p.bits) }));
      else if (s.added === 1 && n > 2) parts.push(' ', t.n('ripple', n - 1));
      return parts;
    }
  });
})();
</script>
</body>
</html>
