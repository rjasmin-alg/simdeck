<!-- dat-charts: the same data as a tally, a table (rows, columns, cells), a pictogram (one picture can stand for 2, 5
     or 10, and half a picture is half of that) and a bar chart with two axes; a change in the data changes every
     view; the chart answers which is the most and how many more. An explorer: the question on top; below it three
     views of one data set side by side (a table with a tally column and + / − per row, a pictogram with its key, a bar
     chart with two named axes); for the fruit vote, a pile of ballots to count at the bottom. The header's audience
     switch is Simdeck.paperColumns.audience (docs/sim-ui.md §14). Rules: SPEC.md. -->

<style>
/* Page CSS: every selector starts with [data-sim="dat-charts"]; colours only from kit tokens.
   The question on top, the three views below, the ballots at the bottom (fruit). */
[data-sim="dat-charts"] .dc {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 1cqh;
  height: 100%;
  padding: 1cqh 1cqw;
  font-size: max(1rem, min(2.5cqh, 1.25cqw));

}
[data-sim="dat-charts"] .dc-box { min-width: 0; min-height: 0; border: var(--line-w) solid var(--line); border-radius: var(--radius); background: var(--bg); }

/* ── the top box ── */
[data-sim="dat-charts"] .dc-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem 2cqw; padding: 0.4em 0.9em; flex-wrap: wrap; min-height: calc(2 * 1.25em + 2.6em); }

[data-sim="dat-charts"] .dc-say .dc-q { border-bottom: 0.25rem solid var(--c2); }

[data-sim="dat-charts"] .dc-grp > span { color: var(--muted); font-size: max(16px, 0.8em); margin-right: 0.2em; }
[data-sim="dat-charts"] .dc-btn { min-height: 2.2rem; padding: 0 0.6rem; font-size: max(16px, 0.85em); }
[data-sim="dat-charts"] .dc-btn[aria-pressed='true'] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
[data-sim="dat-charts"] .dc-btn[aria-disabled='true'] { opacity: 0.55; border-style: dashed; }

/* table */

/* pictogram */
[data-sim="dat-charts"] .dc-picto { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.35em 0.3em; }
[data-sim="dat-charts"] .dc-prow { display: contents; }
[data-sim="dat-charts"] .dc-prow > * { padding: 0.08em 0.15em; border-radius: var(--radius-sm); }
[data-sim="dat-charts"] .dc-prow.dc-sel > * { background: var(--hl); color: var(--on-hl); }

[data-sim="dat-charts"] .dc-pics { display: flex; flex-wrap: nowrap; gap: 0.08em; min-height: 1.25em; overflow: hidden; container-type: inline-size; }

[data-sim="dat-charts"] .dc-shape { fill: color-mix(in srgb, var(--c2) 40%, var(--bg)); stroke: var(--ink); stroke-width: 0.1rem; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
[data-sim="dat-charts"] .dc-ghost { fill: none; stroke: var(--ink); stroke-width: 0.08rem; stroke-dasharray: 0.2rem 0.15rem; vector-effect: non-scaling-stroke; }
[data-sim="dat-charts"] .dc-key { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3em 0.6em; border-top: var(--line-w) solid var(--line); padding-top: 0.35em; }
[data-sim="dat-charts"] .dc-keyis { display: inline-flex; align-items: center; gap: 0.25em; font-weight: 700; }

/* bar chart */
[data-sim="dat-charts"] .dc-chart { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto auto; height: 100%; min-height: 0; }

[data-sim="dat-charts"] .dc-ylabs { position: relative; width: 1.8em; margin-right: 0.25em; }
[data-sim="dat-charts"] .dc-ylab { position: absolute; right: 0; transform: translateY(50%); font-family: var(--mono); font-size: max(16px, 0.75em); line-height: 1; }
[data-sim="dat-charts"] .dc-plot { position: relative; border-left: 0.2rem solid var(--ink); border-bottom: 0.2rem solid var(--ink); min-height: 0; margin-top: 0.4em; }
[data-sim="dat-charts"] .dc-grid { position: absolute; left: 0; right: 0; border-top: 0.1rem solid var(--line); }

[data-sim="dat-charts"] .dc-bar.dc-sel { background: var(--hl); outline: 0.25rem solid var(--ink); }
[data-sim="dat-charts"] .dc-bar.dc-ans { border-width: 0.3rem; }
[data-sim="dat-charts"] .dc-diff { position: absolute; border: 0.18rem dashed var(--ink); box-sizing: border-box; background-color: var(--bg); }
[data-sim="dat-charts"] .dc-level { position: absolute; border-top: 0.15rem dashed var(--ink); }
[data-sim="dat-charts"] .dc-val { position: absolute; transform: translate(-50%, calc(-100% - 0.2em)); font-family: var(--mono); font-weight: 700; font-size: max(16px, 0.8em); line-height: 1; white-space: nowrap; }
[data-sim="dat-charts"] .dc-dlab { position: absolute; transform: translate(-50%, 50%); border: 0.12rem solid var(--ink); border-radius: var(--radius-sm); font-family: var(--mono); font-weight: 700; font-size: max(16px, 0.8em); line-height: 1; white-space: nowrap; background: var(--bg); padding: 0 0.15em; }
[data-sim="dat-charts"] .dc-xlabs { grid-column: 2; position: relative; height: 1.5em; }
[data-sim="dat-charts"] .dc-xlab { position: absolute; top: 0.2em; transform: translateX(-50%); font-size: max(16px, 0.8em); white-space: nowrap; line-height: 1.1; padding: 0 0.1em; border-radius: var(--radius-sm); }
[data-sim="dat-charts"] .dc-xlab.dc-sel { background: var(--hl); color: var(--on-hl); outline: 0.15rem solid var(--ink); }
[data-sim="dat-charts"] .dc-xtitle { grid-column: 2; text-align: right; font-size: max(16px, 0.8em); color: var(--muted); font-weight: 700; }

/* ballots */
[data-sim="dat-charts"] .dc-ballots { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35em 1em; padding: 0.35em 0.9em; }
[data-sim="dat-charts"] .dc-pile { display: flex; flex-wrap: wrap; gap: 0.25em; align-items: center; flex: 1 1 20em; min-width: 0; }
[data-sim="dat-charts"] .dc-ballot { padding: 0.05em 0.4em; border: 0.12rem solid var(--ink); border-radius: var(--radius-sm); font-size: max(16px, 0.8em); background: var(--bg); }

[data-sim="dat-charts"] .sd-ctl[hidden] { display: none; }
[data-sim="dat-charts"] .sd-legend li:nth-child(1) .sd-swatch { background: var(--c1); }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="dat-charts"] .sd-stage { height: auto; container-type: inline-size; }

  [data-sim="dat-charts"] .dc-say, [data-sim="dat-charts"] .dc[data-aud='child'] .dc-say { font-size: 1.2rem; }
  [data-sim="dat-charts"] .dc-top { min-height: 0; }

  [data-sim="dat-charts"] .dc-pile { flex-basis: auto; }
}
</style>

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // what the last action did (a ballot, + or −, a key, a refusal), kept while the params stay as it left them
  var ev = null;

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function btn(label, title, run, opts) {
    opts = opts || {};
    return noFocus(h('button', { type: 'button', class: 'sd-btn dc-btn', title: title,
      'aria-keyshortcuts': opts.kbd ? opts.kbd.toLowerCase() : null, 'aria-label': opts.aria || null,
      'aria-pressed': opts.pressed == null ? null : String(opts.pressed), 'aria-disabled': opts.disabled ? 'true' : null,
      dataset: opts.main ? { main: '' } : {},
      onclick: function () { run(); } }, label, opts.kbd ? ' ' : '', opts.kbd ? h('kbd', null, opts.kbd) : ''));
  }

  /* ══ words ══ */
  function U(s, n) { return t.n('u_' + s.ds, n); }
  function catName(s, i) { return t('cat_' + s.cats[i]); }
  /** The name in a sentence: the day written out, not the axis's abbreviation. */
  function cn(s, i) { return t('cn_' + s.cats[i]); }
  function list(names) {
    if (names.length < 2) return names.join('');
    return names.slice(0, -1).join(', ') + t('and') + names[names.length - 1];
  }
  function picsText(p) {
    if (p.part === 'none') return p.whole ? t.n('pics', p.whole) : t('picsNone');
    if (p.part === 'half') return p.whole ? t.n('picsHalf', p.whole) : t('picsHalf0');
    return p.whole ? t.n('picsPart', p.whole) : t('picsPart0');
  }
  function tallyText(tl) {
    if (tl.fives && tl.ones) return t('tallyWords', { f: t.n('fives', tl.fives), o: tl.ones });
    if (tl.fives) return t.n('fives', tl.fives);
    return String(tl.ones);
  }
  function questionText(s) {
    var a = s.answer;
    if (s.q === 'more') {
      if (!a || a.kind === 'empty') return t('qb_more');
      if (a.kind === 'equal') return t('qMoreEqual');
      return t('q_more_' + s.ds, { a: t('qn_' + s.cats[a.a]), b: t('qn_' + s.cats[a.b]) });
    }
    return t('q_' + s.q + '_' + s.ds);
  }
  function answerText(s) {
    var a = s.answer;
    if (a.kind === 'empty') return t('aEmpty');
    if (a.kind === 'one') return t('aOne', { c: cn(s, a.idx[0]), v: U(s, a.value) });
    if (a.kind === 'tie') return t('aTie', { c: list(a.idx.map(function (i) { return cn(s, i); })), v: U(s, a.value) });
    if (a.kind === 'all') return t('aAll', { v: U(s, a.value) });
    if (a.kind === 'diff') return t('aDiff', { big: a.big, small: a.small, d: U(s, a.value) });
    if (a.kind === 'equal') return t('aEqual', { v: a.big });
    return t('aTotal', { sum: s.counts.join(' + '), v: U(s, a.value) });
  }
  /** The rows the revealed answer points at. */
  function ansRows(s) {
    var a = s.answer;
    if (!a || s.hide) return [];
    if (a.kind === 'one' || a.kind === 'tie') return a.idx;
    if (a.kind === 'diff') return [a.a, a.b];
    return [];
  }

  /* ══ events ══ */
  function sigOf(p) {
    var out = [p.ds, p.n, p.k, p.q, !!p.hide, p.sel];
    for (var i = 0; i < L.CATS_MAX; i++) out.push(p['c' + i]);
    return JSON.stringify(out);
  }
  function evNow(c) { return ev && ev.sig === sigOf(c.params) ? ev : null; }
  /** Run an action: remember what it did, set the params (or redraw when refused); keep the key fitting (rule 5). */
  function act(e, patch) {
    var next = Object.assign({}, sim.params, patch);
    var ns = L.initial(next);
    if (ns.keyMoved) { patch = Object.assign({}, patch, { k: ns.k }); next.k = ns.k; e.keyFrom = ns.askedK; }
    e.sig = sigOf(next);
    ev = e;
    if (Object.keys(patch).length) sim.set(patch); else sim.render();
  }
  function changeRow(i, d) {
    var r = L.change(sim.params, i, d);
    act({ kind: 'change', i: i, d: d, from: r.from, to: r.to, refused: r.refused }, r.patch);
  }
  function countOne() {
    var r = L.countBallot(sim.params);
    if (r.refused === 'none') return;
    act({ kind: 'ballot', i: r.i, from: r.from, to: r.to, refused: r.refused, d: 1 }, r.patch);
  }
  function countAll() {
    var r = L.countAll(sim.params);
    if (r.refused === 'none') return;
    act({ kind: 'all', refused: r.refused, d: 1 }, r.patch);
  }
  function setKey(k) {
    var s = sim.state, info = s.keys.filter(function (x) { return x.k === k; })[0];
    if (!info.fits) {
      var need = Math.ceil(Math.max.apply(null, s.counts) / k);
      act({ kind: 'key', refused: 'key', k: k, need: need }, {});
      return;
    }
    act({ kind: 'key', k: k }, { k: k });
  }
  function nextKey() {
    var s = sim.state, ok = s.keys.filter(function (x) { return x.fits; }).map(function (x) { return x.k; });
    var i = ok.indexOf(s.k);
    setKey(ok[(i + 1) % ok.length]);
  }
  function ask(q) {
    var s = sim.state;
    ev = null;
    if (s.q === q) { sim.set({ q: 'none', hide: false }); return; }
    sim.set({ q: q, hide: audience === 'teacher' });
  }
  function nextQuestion() {
    var s = sim.state, all = ['none'].concat(s.questions), nxt = all[(all.indexOf(s.q) + 1) % all.length];
    if (nxt === 'none') { ev = null; sim.set({ q: 'none', hide: false }); } else ask(nxt);
  }
  function select(i) { ev = null; sim.set({ sel: sim.state.sel === i ? -1 : i }); }

  /* ══ pictures (drawn in a 20 × 20 box; no text inside, so scaling is fine) ══ */
  function shape(g, kind, cls) {
    if (kind === 'pupil') {
      g.append(svg('circle', { class: cls, cx: 10, cy: 6, r: 4 }));
      g.append(svg('path', { class: cls, d: 'M3,19 C3,12.5 6,11 10,11 C14,11 17,12.5 17,19 Z' }));
    } else if (kind === 'day') {
      g.append(svg('rect', { class: cls, x: 2.5, y: 4, width: 15, height: 14.5, rx: 2 }));

  function caption(c) {

    function putHl(x) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, cap(x))); }
    // 1. a refused action
    if (e && e.refused) {

      else if (e.refused === 'done') put(t('cRefDone'));

    if (e && e.kind === 'all') { put(t('cAll', { v: s.hide ? t('unknown') : U(s, s.total) })); if (e.keyFrom) put(t('cKeyMoved', { a: e.keyFrom, u: U(s, s.k) })); return out; }

  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'v', label: t('revealKey'), run: function (sm) { if (sm.state.q === 'none' && !sm.state.hide) return; ev = null; sm.set({ hide: !sm.params.hide }); } },
      { key: 'p', label: t('keyP'), run: function () { countOne(); } },
      { key: 'a', label: t('keyA'), run: function () { countAll(); } },
      { key: 'q', label: t('keyQ'), run: function () { nextQuestion(); } },
      { key: 'k', label: t('keyK'), run: function () { nextKey(); } }
    ],

    legend: [
      { c: 1, label: t('legBar') },
      { shape: 'hl', label: t('legSel') },
      { c: 2, label: t('legHalf') },
      { shape: 'hollow', label: t('legPart') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows: a data set chosen by hand starts from its own counts; the key that fits
  var lastDs = null;
  /** A link that names a data set but none of its counts (?ds=books): start from the data set's own counts. */
  function urlDsWithoutCounts() {
    var q = new URLSearchParams(location.search);
    if (!q.has('ds')) return false;
    for (var i = 0; i < L.CATS_MAX; i++) if (q.has('c' + i)) return false;
    return true;
  }
  sim.on(function (c) {
    var s = c.state, p = c.params, fix = {};
    if (lastDs !== null && lastDs !== s.ds && !c.preset) { fix = Object.assign(L.startParams(s.ds), { q: 'none', hide: false }); ev = null; }
    else if (lastDs === null && urlDsWithoutCounts()) fix = L.startParams(s.ds);
    else {
      if (Number(p.k) !== s.k) fix.k = s.k;
      if (p.sel !== s.sel) fix.sel = s.sel;
    }
    lastDs = s.ds;
    if (Object.keys(fix).length) sim.set(fix, { preset: sim.preset });
  });

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
