<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var PRESET_LABEL = {
    'book-ro-t': 'pRoT', 'book-root-bin': 'pRootBin', greedy: 'pGreedy', 'leftmost-longest': 'pLongest',
    'anchor-scan': 'pAnchor', explosion: 'pExplosion'
  };
  var KIND = { char: 'k_char', any: 'k_any', set: 'k_set', bol: 'k_bol', eol: 'k_eol', open: 'k_open', close: 'k_close', alt: 'k_alt' };
  var STACK_SHOWN = 6;

  /** Data (pattern tokens, characters, spans) is not language: the word check skips translate="no". */
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function shown(c) { return c === ' ' ? '␣' : c; }
  function put(el, items) {
    var out = [];
    (function walk(x) { if (Array.isArray(x)) x.forEach(walk); else if (x !== null && x !== undefined && x !== false) out.push(x); })(items);
    el.replaceChildren.apply(el, out);
  }

  // ── the stage is built once and updated in place, so the typed fields keep their caret and focus ──
  var ui = null;

  function field(key, label, max, cls) {
    var id = 'rx-' + key;
    var input = h('input', { id: id, type: 'text', class: 'rx-input ' + cls, maxlength: String(max), spellcheck: 'false',
      autocomplete: 'off', autocapitalize: 'off', translate: 'no' });
    input.addEventListener('input', function () {
      var patch = {};
      patch[key] = input.value;
      sim.set(patch);
      sim.first();
    });
    // Enter hands the keys back to the clicker
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    return { input: input, el: h('div', { class: 'rx-field' }, h('label', { for: id }, t(label)), input) };
  }

  function build(stage) {
    var pat = field('pattern', 'patternLabel', L.MAX_PATTERN, 'rx-input-pat');
    var txt = field('text', 'textLabel', L.MAX_TEXT, 'rx-input-text');
    var inputs = h('section', { class: 'rx-box rx-inputs' }, pat.el, txt.el, h('span', { class: 'rx-hint' }, t('inputHint')));
    var tokens = h('div', { class: 'rx-tokens' });
    var err = h('p', { class: 'rx-err', role: 'status' });
    var patBox = h('section', { class: 'rx-box rx-pat' },
      h('div', { class: 'rx-head' }, h('h3', null, t('tokensTitle')), h('p', { class: 'rx-note' }, t('model'))), h('div', { class: 'rx-patrow' }, tokens, err));
    var cells = h('div', { class: 'rx-cells' });
    var lineBox = h('section', { class: 'rx-box rx-line' }, h('h3', null, t('textTitle')), cells);
    var stackList = h('ol');
    var stackBox = h('section', { class: 'rx-box rx-stack' }, h('h3', null, t('stackTitle')), stackList);
    var counters = h('div', { class: 'rx-counters' });
    var rows = h('div', { class: 'rx-rows' });
    var exit = h('div', { class: 'rx-exit' });
    var resBox = h('section', { class: 'rx-box rx-res' }, counters, h('h3', null, t('resultTitle')), rows, exit);
    var root = h('div', { class: 'rx' }, inputs, patBox, lineBox, h('div', { class: 'rx-low' }, stackBox, resBox));
    stage.replaceChildren(root);
    return { root: root, pat: pat.input, txt: txt.input, tokens: tokens, err: err, cells: cells, stack: stackList,
      counters: counters, rows: rows, exit: exit };
  }

  // ── the pattern ──
  /** The tokens of the branch that starts at bti (to the next | or the end of its group, at the same depth). */
  function branchRange(s, bti) {
    var out = [], depth = 0;
    for (var k = bti; k >= 0 && k < s.tokens.length; k++) {
      var tk = s.tokens[k];
      if (depth === 0 && (tk.kind === 'alt' || tk.kind === 'close')) break;
      if (tk.kind === 'open') depth++;
      if (tk.kind === 'close') depth--;
      out.push(k);
    }
    return out;
  }

  function fillTokens(s) {
    var a = s.act;
    var tested = a.k === 'test' || a.k === 'bol' || a.k === 'eol' || a.k === 'more';
    var branch = a.k === 'alt' || a.k === 'back-alt' ? branchRange(s, a.ti) : [];
    if (!s.tokens.length && !s.error) { put(ui.tokens, h('span', { class: 'rx-muted' }, t('noTokens'))); return; }
    put(ui.tokens, s.tokens.map(function (tk, i) {
      var cur = i === a.ti && a.k !== 'start' && a.k !== 'restart' ? true : (a.k === 'start' || a.k === 'restart') && i === a.ti;
      var res = tested && i === a.ti ? (a.ok ? 'ok' : 'no') : null;
      var cls = 'rx-tok' + (cur ? ' rx-cur' : '') + (branch.indexOf(i) >= 0 ? ' rx-branch' : '') +
        (cur && a.k !== 'start' ? ' sd-changed' : '');
      var mark = null;
      if (res) mark = h('span', { class: 'rx-mark', dataset: { v: res } }, (a.k === 'bol' || a.k === 'eol' ? '⚓' : '') + (res === 'ok' ? '✓' : '✕'));
      else if (cur && (a.k === 'back-alt' || a.k === 'back-more')) mark = h('span', { class: 'rx-mark' }, '↶');
      else if (cur && (a.k === 'alt' || a.k === 'more-enter')) mark = h('span', { class: 'rx-mark' }, h('span', { class: 'rx-bm', 'aria-hidden': 'true' }));
      var ds = { kind: tk.kind };
      if (tk.lit) ds.lit = '';
      if (res) ds.res = res;
      return h('div', { class: cls, dataset: ds },
        h('span', { class: 'rx-tok-t', translate: 'no' }, tk.text, tk.q ? h('span', { class: 'rx-q' }, tk.q) : null),
        h('span', { class: 'rx-tok-k' }, t(tk.lit ? 'k_lit' : KIND[tk.kind])),
        mark);
    }));
  }

  // ── the line ──
  function fillCells(s) {
    var a = s.act;
    var n = s.text.length;
    ui.cells.style.setProperty('--n', String(n + 1));
    var tested = a.k === 'test' || a.k === 'more' || a.k === 'bol' || a.k === 'eol';
    var eatenTo = s.done && s.match ? s.match.to : s.pos;
    var eatenFrom = s.done && s.match ? s.match.from : s.start;
    var cols = [];
    for (var i = 0; i <= n; i++) {
      var end = i === n;
      var cur = (tested || a.k === 'start' || a.k === 'restart') && !s.error && i === a.at && !(s.done && a.k !== 'test');
      var res = tested && i === a.at ? (a.ok ? 'ok' : 'no') : null;
      var ds = {};
      if (end) ds.end = '';
      if (!end && i >= eatenFrom && i < eatenTo && !s.error && !(s.done && !s.match)) ds.eaten = '';
      if (res) ds.res = res;
      var mark = null;
      if (res) mark = h('span', { class: 'rx-mark', dataset: { v: res } }, (a.k === 'bol' || a.k === 'eol' ? '⚓' : '') + (res === 'ok' ? '✓' : '✕'));
      var cell = h('div', { class: 'rx-cell' + (cur ? ' rx-cur' : '') + (cur && res ? ' sd-changed' : ''), dataset: ds },
        end ? t('endCell') : h('span', { translate: 'no' }, shown(s.text[i])), mark);
      var col = [];
      if (i === s.start && !s.error) col.push(h('span', { class: 'rx-flag' + (a.k === 'restart' ? ' sd-changed' : '') }, '▼ ' + t('startMark')));
      col.push(cell);
      col.push(h('span', { class: 'rx-idx', dataset: i === s.pos && !s.error ? { pos: '' } : {} }, String(i)));
      if (s.done) {
        var inBt = s.match && i >= s.match.from && i < s.match.to;
        var inPx = s.posix && i >= s.posix.from && i < s.posix.to;
        col.push(h('span', { class: 'rx-bar', dataset: inBt ? { on: 'bt' } : {} }));
        col.push(h('span', { class: 'rx-bar', dataset: inPx ? { on: 'posix' } : {} }));
      }
      cols.push(h('div', { class: 'rx-col' }, col));
    }
    put(ui.cells, cols);
  }

  // ── the stack of choice points ──
  function cpNode(s, cp, cls, taken) {
    var what = cp.kind === 'alt'
      ? [code(groupText(s, cp.ti)), ' ', t.parts('cpAlt', { next: code(L.branchText(s, cp.bti)) })]
      : [code(L.tokText(s, cp.ti)), ' ', t('cpMore', { n: cp.count })];
    return h('li', { class: 'rx-cp' + (cls ? ' ' + cls : ''), dataset: taken ? { taken: '' } : {} },
      taken ? h('span', { class: 'rx-back', 'aria-hidden': 'true' }, '↶') : null,
      h('span', { class: 'rx-bm', 'aria-hidden': 'true' }), what, h('span', { class: 'rx-muted' }, t('cpFrom', { pos: cp.pos })),
      taken ? h('span', { class: 'rx-muted' }, '(' + t('cpTaken') + ')') : null);
  }
  /** An alternation's whole group, e.g. "(root|bin)"; the top-level one is the whole pattern. */
  function groupText(s, ti) {
    if (ti == null || ti < 0) return s.pattern;
    var open = s.tokens[ti];
    return s.pattern.slice(open.from, s.tokens[open.close].from + 1);
  }
  function fillStack(s, prev) {
    var items = [];
    var st = s.stack;
    if (s.popped && prev && prev.stack.length) {
      items.push(cpNode(s, prev.stack[prev.stack.length - 1], 'sd-changed', true));
    }
    for (var k = st.length - 1; k >= 0 && st.length - 1 - k < STACK_SHOWN; k--) {
      var fresh = k === st.length - 1 && s.pushed;
      items.push(cpNode(s, st[k], fresh ? 'sd-changed' : null, false));
    }
    if (st.length > STACK_SHOWN) items.push(h('li', { class: 'rx-muted rx-small' }, t.n('stackOlder', st.length - STACK_SHOWN)));
    if (!items.length) items.push(h('li', { class: 'rx-muted' }, t('stackEmpty')));
    put(ui.stack, items);
  }

  // ── counters and the result ──
  function spanNode(s, m) {
    if (!m) return null;
    var txt = s.text.slice(m.from, m.to);
    return t.parts('resSpan', { span: txt ? code(txt) : t('emptySpan'), from: m.from, to: m.to });
  }
  function fillResult(s, prev) {
    var a = s.act;
    var ch = function (cond) { return cond ? 'sd-changed' : null; };
    put(ui.counters, [
      h('span', null, t('startLabel') + ': ', h('b', { class: ch(a.k === 'restart') }, String(s.start))),
      h('span', null, t('posLabel') + ': ', h('b', null, String(s.pos))),
      h('span', null, t('triesLabel') + ': ', h('b', { class: ch(prev && prev.tries !== s.tries) }, String(s.tries))),
      h('span', null, t('formLabel') + ': ', h('b', null, s.mode), ' ', h('span', { class: 'rx-muted', translate: 'no' }, '(' + t('tool_' + s.mode) + ')'))
    ]);
    var mine = s.mode === 'PCRE' ? 'bt' : 'posix';
    function row(key, name, m, limit) {
      var v = s.error ? 'none' : !s.done ? 'wait' : limit ? 'none' : m ? 'span' : 'none';
      var body = v === 'wait' ? t('resWait') : v === 'span' ? spanNode(s, m) : s.error ? '✕ ' + t(s.error.invalid ? 'resError' : 'resNotCovered')
        : limit ? '✕ ' + t('resLimit') : '✕ ' + t('resNone');
      return h('div', { class: 'rx-row', dataset: Object.assign({ row: key }, key === mine ? { mine: '' } : {}) },
        h('span', { class: 'rx-row-line', 'aria-hidden': 'true' }),
        h('span', { class: 'rx-row-name' }, t(name), key === mine ? h('span', { class: 'rx-mine' }, t('thisForm')) : null),
        h('span', { class: 'rx-row-val' + (s.done && !(prev && prev.done) ? ' sd-changed' : ''), dataset: { v: v } }, body));
    }
    put(ui.rows, [row('bt', 'rowBt', s.match, s.limit), row('posix', 'rowPosix', s.posix, false)]);
    var ex = s.limit ? h('span', null, t('exitLimit')) : h('span', { translate: 'no' }, s.exit == null ? (s.error ? '—' : '…') : String(s.exit));
    put(ui.exit, [t('exitLabel', { tool: t('tool_' + s.mode) }) + ': ', ex]);
  }

  // ── captions: the sentence and its data come from the model (captionOf) ──
  var CODE = { tok: 1, q: 1, alt: 1, next: 1, ch: 1, span: 1 };
  function said(key, raw) {
    var vars = {};
    Object.keys(raw).forEach(function (k) {
      var v = raw[k];
      if (v && typeof v === 'object') vars[k] = t(v.t);
      else if (k === 'span' && v === '') vars[k] = t('emptySpan');
      else if (CODE[k]) vars[k] = code(k === 'ch' ? shown(v) : v);
      else vars[k] = v;
    });
    // a placeholder used twice (the task's greedy sentence names the quantifier twice) needs its own node each time
    var seen = [];
    return [].concat(t.parts(key, vars)).map(function (x) {
      if (!x || typeof x !== 'object' || !x.nodeType) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function caption(c) {
    var cap = L.captionOf(c.state);
    var out = [].concat(said(cap.key, cap.vars));
    cap.extra.forEach(function (x) {
      out.push(' ');
      if (x.vars.n != null) out.push(t.n(x.key, x.vars.n, x.vars));
      else out = out.concat(said(x.key, x.vars));
    });
    return out;
  }

  // ── render ──
  function render(c) {
    var s = c.state;
    if (!ui || !c.stage.contains(ui.root)) ui = build(c.stage);
    // compared with the params, not the cleaned state: while typing they are equal (the caret stays), and a preset or
    // reset changes them even though the field keeps focus (preset buttons never take it)
    var pv = String(c.params.pattern == null ? '' : c.params.pattern), tv = String(c.params.text == null ? '' : c.params.text);
    if (ui.pat.value !== pv) ui.pat.value = pv;
    if (ui.txt.value !== tv) ui.txt.value = tv;
    ui.pat.setAttribute('aria-invalid', s.error ? 'true' : 'false');
    ui.err.textContent = s.error ? t(s.error.invalid ? 'errTitle' : 'notCoveredTitle') + ': ' + t('err_' + s.error.code.replace(/-/g, '_')) : '';
    fillTokens(s);
    fillCells(s);
    fillStack(s, c.prev);
    fillResult(s, c.prev);
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'mode', type: 'choice', label: t('mode'), hint: t('modeHint'), value: L.defaults.mode, resets: true,
        options: L.MODES.map(function (m) { return [m, t('opt' + m)]; }) }
    ],
    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_LABEL[pr.id]), hint: t(PRESET_LABEL[pr.id] + 'Hint'), params: pr.params };
    }),
    legend: [
      { shape: 'rx-try', label: t('legTry') },
      { shape: 'rx-eaten', label: t('legEaten') },
      { shape: 'rx-cp', label: t('legCp') },
      { shape: 'rx-back', label: t('legBack') },
      { shape: 'rx-anchor', label: t('legAnchor') },
      { shape: 'rx-match', label: t('legMatch') },
      { shape: 'rx-none', label: t('legNone') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });

  // ── the typed pattern and line live in the URL too (the kit keeps only its own params there and leaves other keys
  //    alone), so a reload, a copied link and the language switch keep them ──
  var TYPED = ['pattern', 'text'];
  function baseParams() {
    var pr = sim.preset ? L.PRESETS.filter(function (x) { return x.id === sim.preset; })[0] : null;
    return pr ? Object.assign({}, L.defaults, pr.params) : L.defaults;
  }
  function writeTyped() {
    try {
      var u = new URLSearchParams(window.location.search);
      var base = baseParams(), p = sim.params;
      TYPED.forEach(function (k) { if (p[k] !== base[k]) u.set(k, p[k]); else u.delete(k); });
      var qs = u.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    } catch (e) { /* file:// in some browsers */ }
  }
  (function readTyped() {
    var q = new URLSearchParams(window.location.search);
    var patch = {};
    TYPED.forEach(function (k) { if (q.has(k)) patch[k] = q.get(k); });
    if (!Object.keys(patch).length) return;
    sim.set(patch);
    // the kit clamped ?step= to the default walk before the typed pattern was known: apply it again
    var n = parseInt(q.get('step'), 10);
    if (n > 0) sim.go(Math.min(n, sim.steps));
  })();
  sim.on(writeTyped);
})();
</script>
</body>
</html>
