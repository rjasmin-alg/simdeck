<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var NL = window.SimdeckModels['number-line'];
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var notice = null;   // a refused action, said once in the caption
  var frozen = null;   // the main lines' view while a point is dragged, so the scale does not move under the pointer

  var SIGN = { sub: '−', add: '+' };

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node twice). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function num(v) { return h('span', { class: 'cd-num', translate: 'no' }, String(v)); }
  function signed(k) { return k > 0 ? '+' + k : k < 0 ? '−' + (-k) : '0'; }
  function sentence(op, a, b) { return a + ' ' + SIGN[op] + ' ' + b; }
  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  /** A phone or a narrow window: every other tick label, fewer minor ticks. */
  function narrow() { var st = document.querySelector('[data-sd-stage]'); return !!st && st.clientWidth > 0 && st.clientWidth < 760; }

  // ── one number line, drawn in HTML on a percentage scale (text at 1:1; the jump arcs are SVG without text) ──
  /**
   * o: { view, label, maxMinor, points: [{ v, c, shape, ghost, want, handle, text }], bars: [{ from, to, c, hatch,
   *      text, word, ok }], arcs: [{ from, to, text }], wants: [{ v, text }], drag: true }
   */
  function lineEl(o) {
    var v = o.view;
    var kids = [h('div', { class: 'cd-axis' })];
    NL.ticks(v, o.maxMinor).forEach(function (tk) {
      kids.push(h('span', { class: 'cd-tick' + (tk.major ? ' cd-major' : ''), style: { left: pct(NL.pos(tk.v, v)) } }));
    });
    var marked = o.points.filter(function (p) { return p.text != null; }).map(function (p) { return p.v; })
      .concat((o.wants || []).map(function (w) { return w.v; }));
    var every = o.every || 1;
    NL.freeLabels(v, marked, o.below ? (o.every > 1 ? 0.14 : 0.09) : 0.045).forEach(function (x) {
      if (Math.round((x - v.lo) / v.step) % every) return;
      kids.push(h('span', { class: 'cd-tlab', translate: 'no', style: { left: pct(NL.pos(x, v)) } }, String(x)));
    });
    (o.bars || []).forEach(function (b) {
      var x1 = NL.pos(Math.min(b.from, b.to), v), x2 = NL.pos(Math.max(b.from, b.to), v);
      kids.push(h('div', { class: 'cd-bar sd-soft' + (b.hatch ? ' sd-hatch' : ''), dataset: { c: String(b.c), ok: b.ok === false ? 'no' : 'yes' },
        style: { left: pct(x1), width: pct(x2 - x1) } },
        b.text == null ? null : h('span', { class: 'cd-barlab' }, b.word ? h('small', null, b.word) : null, h('span', { translate: 'no' }, b.text))));
    });
    (o.arcs || []).forEach(function (a) {
      if (a.from === a.to) return;
      var x1 = NL.pos(a.from, v), x2 = NL.pos(a.to, v);
      var lo = Math.min(x1, x2), w = Math.abs(x2 - x1);
      var right = a.to > a.from;
      // the arc in a 100 × 40 box stretched over the jump; the head at the landing end
      var path = 'M ' + (right ? 0 : 100) + ' 40 C ' + (right ? 15 : 85) + ' -8, ' + (right ? 85 : 15) + ' -8, ' + (right ? 100 : 0) + ' 40';
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('class', 'cd-arc');
      svg.setAttribute('viewBox', '0 0 100 40');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      svg.style.left = pct(lo);
      svg.style.width = pct(w);
      var p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', path);
      p.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.append(p);
      kids.push(svg);
      kids.push(h('span', { class: 'cd-head', style: { left: pct(x2) } }));
      kids.push(h('span', { class: 'cd-arclab', translate: 'no', style: { left: pct(lo + w / 2) } }, a.text));
    });
    (o.wants || []).forEach(function (w) {
      kids.push(h('span', { class: 'cd-pt cd-want', style: { left: pct(NL.pos(w.v, v)) } }));
    });
    o.points.forEach(function (p) {
      var x = NL.pos(p.v, v);
      kids.push(h('span', { class: 'cd-pt' + (p.ghost ? ' cd-ghost' : '') + (p.handle ? ' cd-handle' : ''),
        dataset: { c: p.c == null ? '' : String(p.c), shape: p.shape || '' }, style: { left: pct(x) } }));
      if (p.text != null) kids.push(h('span', { class: 'cd-plab' + (o.below ? ' cd-below' : ''), translate: 'no', dataset: { c: p.c == null ? '' : String(p.c) }, style: { left: pct(x) } }, p.text));
    });
    var scale = h('div', { class: 'cd-scale' }, kids);
    var el = h('div', { class: 'cd-line' + (o.drag ? ' cd-drag' : ''), role: 'img', 'aria-label': o.label }, scale);
    if (o.drag) attachDrag(scale, o);
    return el;
  }

  // ── dragging a point of the lower line: the nearest point that moves with the shift is taken; both move together ──
  function attachDrag(scale, o) {
    scale.addEventListener('pointerdown', function (e) {
      var s = sim.state, view = o.view;
      var r = scale.getBoundingClientRect();
      if (r.width <= 0) return;
      var at = NL.valueAt((e.clientX - r.left) / r.width, view);
      var grab = null;
      o.handles.forEach(function (hd) {
        if (!hd.c) return;
        if (!grab || Math.abs(hd.v - at) < Math.abs(grab.v - at)) grab = hd;
      });
      if (!grab) return;
      e.preventDefault();
      frozen = view;
      var k0 = s.k, v0 = grab.v, c = grab.c;
      // the listeners sit on window: every move re-renders the stage, which replaces this scale element
      var id = e.pointerId;
      function move(ev) {
        if (ev.pointerId !== id) return;
        var x = NL.valueAt((ev.clientX - r.left) / r.width, view);
        var k = k0 + Math.round((x - v0) / c);
        var range = L.kRange(sim.params);
        k = Math.min(range.hi, Math.max(range.lo, k));
        if (k !== sim.params.k) sim.set({ k: k });
      }
      function up(ev) {
        if (ev && ev.pointerId !== id) return;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        window.removeEventListener('blur', up);
        frozen = null;
        sim.render();
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
      window.addEventListener('blur', up);
      move(e);
    });
  }

  // ── the task: two sentences ──
  function eqBox(s) {
    var child = audience === 'child', ask = s.hide;
    var terms = s.op === 'sub' ? ['tMinuend', 'tSubtrahend', 'tDiff'] : ['tAddend1', 'tAddend2', 'tSum'];
    var cells = [];
    var term = function (k) { return h('span', { class: 'cd-term' }, t(k)); };
    cells.push(term(terms[0]), h('span'), term(terms[1]), h('span'), term(terms[2]));
    var n = function (v, c, moved) { return h('span', { class: 'cd-n' + (moved ? ' cd-moved' : ''), dataset: { c: String(c) }, translate: 'no' }, String(v)); };
    cells.push(n(s.a, 1), h('span', null, SIGN[s.op]), n(s.b, 2), h('span', null, '='), h('span', { class: 'cd-res', translate: 'no' }, String(s.r)));
    var sh = function (c) { return h('span', { class: 'cd-shift', translate: 'no' }, c && s.k ? signed(c * s.k) + ' ↓' : ''); };
    cells.push(sh(s.coef.a), h('span'), sh(s.coef.b), h('span'), h('span'));
    var ok = ask ? 'ask' : s.same ? 'yes' : 'no';
    cells.push(n(s.a2, 1, s.coef.a && s.k), h('span', null, SIGN[s.op]), n(s.b2, 2, s.coef.b && s.k), h('span', null, '='),
      h('span', { class: 'cd-res', translate: 'no', dataset: { ok: ok } }, ask ? '?' : String(s.r2)));
    var side;
    if (ask) {
      side = [h('span', { class: 'cd-ask' }, t('ask')),
        noFocus(h('button', { type: 'button', class: 'sd-btn sd-btn--primary cd-reveal', title: t('revealKey') + ' (V)', 'aria-keyshortcuts': 'v',
          onclick: function () { sim.set({ hide: false }); } }, t('reveal'), ' ', h('kbd', null, 'V')))];
    } else {
      var word = child ? t(s.same ? 'vSameC' : 'vNotC')
        : s.same ? t('vSame_' + s.op) : t((s.delta > 0 ? 'vMore_' : 'vLess_') + s.op, { n: Math.abs(s.delta) });
      side = [h('span', { class: 'cd-verdict', dataset: { ok: s.same ? 'yes' : 'no' } }, h('span', { 'aria-hidden': 'true' }, s.same ? '✓' : '✗'), h('span', null, word))];
      side.push(noFocus(h('button', { type: 'button', class: 'sd-btn cd-round', title: t('roundKey') + ' (O)', 'aria-keyshortcuts': 'o',
        onclick: roundNow }, t('round'), ' ', h('kbd', null, 'O'))));
      // the teacher can hide the result again and ask the class first
      if (audience === 'teacher') {
        side.push(noFocus(h('button', { type: 'button', class: 'sd-btn cd-hide', title: t('hideHint'), 'aria-keyshortcuts': 'v',
          onclick: function () { sim.set({ hide: true }); } }, t('hide'), ' ', h('kbd', null, 'V'))));
      }
    }
    return h('section', { class: 'cd-box cd-eqbox' },
      h('div', { class: 'cd-eq', role: 'group', 'aria-label': t('paperEq') }, cells),
      h('div', { class: 'cd-side' }, side));
  }

  // ── the main lines: before and after, on one scale ──
  function mainLines(s) {
    var view = frozen || s.view, ask = s.hide, child = audience === 'child';
    function spec(a, b, after) {
      var points = [], bars = [], handles = [];
      var r = L.valueOf(s.op, a, b);
      var hideRes = after && ask;
      if (s.op === 'sub') {
        bars.push({ from: b, to: a, c: 3, text: hideRes ? null : String(r), word: child ? null : t('tDiff'), ok: !after || ask || s.same });
        points.push({ v: b, c: 2, shape: 'round', text: String(b), handle: after && !!s.coef.b });
        points.push({ v: a, c: 1, shape: 'square', text: String(a), handle: after && !!s.coef.a });
        handles = [{ v: b, c: s.coef.b }, { v: a, c: s.coef.a }];
      } else {
        bars.push({ from: 0, to: a, c: 1, text: String(a) });
        bars.push({ from: a, to: a + b, c: 2, hatch: true, text: String(b) });
        points.push({ v: a, c: 1, shape: 'square', text: null, handle: after && !!s.coef.a });
        points.push({ v: a + b, shape: 'end', text: hideRes ? '?' : String(a + b), handle: after && !!(s.coef.a + s.coef.b) });
        handles = [{ v: a, c: s.coef.a }, { v: a + b, c: s.coef.a + s.coef.b }];
      }
      if (after && s.k) {
        // where the numbers were: hollow markers
        if (s.op === 'sub') {
          if (s.b2 !== s.b) points.unshift({ v: s.b, c: 2, shape: 'round', ghost: true });
          if (s.a2 !== s.a) points.unshift({ v: s.a, c: 1, shape: 'square', ghost: true });
        } else {
          if (s.a2 !== s.a) points.unshift({ v: s.a, c: 1, shape: 'square', ghost: true });
          if (s.a2 + s.b2 !== s.a + s.b) points.unshift({ v: s.a + s.b, shape: 'end', ghost: true });
        }
      }
      return { view: view, points: points, bars: bars, handles: handles, drag: after, maxMinor: narrow() ? 30 : 60, every: narrow() ? 2 : 1,
        label: t('lineLabel', { line: sentence(s.op, a, b) + ' = ' + (hideRes ? '?' : r) }) };
    }
    function row(key, a, b, after) {
      return h('div', { class: 'cd-row' },
        h('div', { class: 'cd-rowlab' }, h('b', null, t(key)), num(sentence(s.op, a, b)), after && !child ? h('small', { class: 'sd-hint' }, t('dragHint')) : null),
        lineEl(spec(a, b, after)));
    }
    return h('section', { class: 'cd-box cd-lines' }, row('lineBefore', s.a, s.b, false), row('lineAfter', s.a2, s.b2, true));
  }

  // ── the close-ups: each point that moves, with its jump, and where the right move would have put it ──
  function lensBox(s, l) {
    var ask = s.hide;
    var c = l.role === 'b' ? 2 : l.role === 'a' || l.role === 'split' ? 1 : null;
    var shape = l.role === 'b' ? 'round' : l.role === 'end' ? 'end' : 'square';
    var points = [];
    if (l.from !== l.to) points.push({ v: l.from, c: c, shape: shape, ghost: true, text: null });
    points.push({ v: l.to, c: c, shape: shape, text: String(l.to) });
    var wants = !ask && l.wantShown ? [{ v: l.want }] : [];
    var jump = l.jump.size ? [{ from: l.from, to: l.to, text: signed(l.jump.size) }] : [];
    var head = [h('span', null, t('lens_' + l.role)), num(l.from === l.to ? String(l.to) : l.from + ' → ' + l.to)];
    if (l.from === l.to) head.push(h('span', { class: 'sd-hint' }, t('stays')));
    if (!ask) head.push(h('span', { class: 'cd-mark', 'aria-hidden': 'true' }, l.ok ? '✓' : '✗'));
    if (wants.length) head.push(h('span', { class: 'cd-want-t' }, tp('want', { v: num(l.want) })));
    return h('section', { class: 'cd-box cd-lens', dataset: { ok: ask || l.ok ? 'yes' : 'no' } },
      h('div', { class: 'cd-lenshead' }, head),
      lineEl({ view: l.view, points: points, arcs: jump, wants: wants, maxMinor: 40, below: true, every: narrow() ? 2 : 1,
        label: t('lensLabel', { what: t('lens_' + l.role) + ' ' + (l.from === l.to ? l.to : l.from + ' → ' + l.to) }) }));
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'cd', dataset: { aud: audience, op: s.op } },
      eqBox(s), mainLines(s), h('div', { class: 'cd-lenses' }, s.lenses.map(function (l) { return lensBox(s, l); }))));
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, A = audience;
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(notice); notice = null; if (!s.k) return out; }
    var l1 = num(sentence(s.op, s.a, s.b)), l2 = num(sentence(s.op, s.a2, s.b2));
    var n = Math.abs(s.k);
    if (s.hide) { add(A === 'child' ? t('cAskC') : tp('cAsk', { l1: l1, l2: l2 })); return out; }
    if (!s.k && s.kLo === 0 && s.kHi === 0) { add(t('cStuck')); return out; }
    if (!s.k) { add(t(A === 'child' ? 'cZeroC' : 'cZero')); return out; }
    if (s.way === 'right') {
      if (A === 'child') {
        if (s.op === 'sub') add(tp('cRightC_sub', { s: num(signed(s.k)), r: num(s.r) }));
        else add(tp('cRightC_add', { s1: num(signed(s.k)), s2: num(signed(-s.k)), r: num(s.r) }));
        return out;
      }
      if (s.op === 'sub') add(tp('cRight_sub', { l1: l1, l2: l2, r: num(s.r), m: t(s.k > 0 ? 'upPl' : 'downPl'), n: num(n) }));
      else add(tp('cRight_add', { l1: l1, l2: l2, r: num(s.r), m1: t(s.k > 0 ? 'up' : 'down'), m2: t(s.k > 0 ? 'down' : 'up'), n: num(n) }));
      if (s.targetRound) add(tp('cRound_' + s.op, { v: num(s.targetValue), l2: num(sentence(s.op, s.a2, s.b2)) }));
      if (A === 'adult') add(t(s.op === 'sub' ? 'whySub' : 'whyAdd'));
      if (c.preset === 'equal' && s.op === 'sub') add(t('cEqual'));
      return out;
    }
    if (A === 'child') { addHl(tp('cWrongC', { r2: num(s.r2), r: num(s.r) })); return out; }
    var dn = Math.abs(s.delta);
    var chg = t((s.op === 'sub' ? 'chgF_' : 'chgM_') + (s.delta > 0 ? 'more' : 'less'), { n: dn });
    // ≠ in the monospace font: the page font has no glyph for it
    var vars = { l1: l1, l2: l2, chg: chg, r2: num(s.r2), r: num(s.r), n: num(n), ne: h('span', { class: 'cd-ne', translate: 'no' }, '≠') };
    if (s.way === 'one') vars.m = t(s.k > 0 ? 'up' : 'down');
    else if (s.op === 'sub') { vars.m1 = t(s.k > 0 ? 'up' : 'down'); vars.m2 = t(s.k > 0 ? 'down' : 'up'); }
    else vars.m = t(s.k > 0 ? 'upOba' : 'downOba');
    addHl(tp((s.way === 'one' ? 'cOne_' : 'cFlip_') + s.op, vars));
    if (A === 'adult') {
      var right = L.moved(s.op, 'right', s.a, s.b, s.k);
      if (L.fits(s.op, right.a2, right.b2)) add(tp('whyWrong', { fix: num(sentence(s.op, right.a2, right.b2) + ' = ' + s.r) }));
    }
    return out;
  }

  // ── the panel: the task field; the header: the audience switch ──
  var field = null;
  function buildTask() {
    var host = document.querySelector('[data-cd-task]');
    var label = h('label', { class: 'sd-ctl-label', for: 'cd-task' }, h('span', null, t('taskLabel')));
    var input = h('input', { id: 'cd-task', type: 'text', class: 'cd-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', title: t('taskHint'), 'aria-describedby': 'cd-task-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'cd-task-msg', role: 'status' }, '');
    function clear() { input.removeAttribute('aria-invalid'); msg.textContent = ''; msg.className = 'sd-hint'; }
    input.addEventListener('input', function () {
      var r = L.parseTask(input.value);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t('err_' + r.error);
        msg.className = 'cd-err';
        return;
      }
      clear();
      sim.set({ op: r.task.op, a: r.task.a, b: r.task.b });
    });
    // Enter or Esc hands the keys back to the page
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { clear(); sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('taskTitle') },
      h('div', { class: 'cd-field' }, label, input, msg)));
    field = { host: host, input: input, clear: clear };
  }
  function syncPanel(c) {
    if (!field) return;
    field.host.hidden = audience === 'child';
    var tk = L.numbersOf(c.params);
    var shown = L.parseTask(field.input.value);
    var same = !shown.error && shown.task.op === tk.op && shown.task.a === tk.a && shown.task.b === tk.b;
    if (document.activeElement !== field.input && !same) { field.input.value = L.taskText(tk); field.clear(); }
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }

  function roundNow() {
    var r = L.roundShift(sim.params);
    if (!r.fits) { notice = t(r.why === 'cap' ? 'nCap' : 'nOut', { v: r.to, max: L.K_MAX }); sim.render(); return; }
    if (r.k === sim.state.k) { notice = t(r.to === 0 ? 'nZero' : 'nDone', { v: r.to }); sim.render(); return; }
    sim.set({ k: r.k });
  }

  buildAudience();
  buildTask();

  var hidden = function (key) {
    return { key: key, type: 'range', label: t('taskTitle'), value: L.defaults[key], min: 0, max: L.MAX, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'op', type: 'choice', label: t('op'), value: L.defaults.op, options: L.OPS.map(function (o) { return [o, t('op_' + o)]; }) },
      hidden('a'), hidden('b'),
      { key: 'k', type: 'range', label: t('k'), value: L.defaults.k,
        min: function (p) { return L.kRange(p).lo; }, max: function (p) { return L.kRange(p).hi; }, format: signed },
      { key: 'way', type: 'choice', label: t('way'), value: L.defaults.way,
        options: L.WAYS.map(function (w) { return [w, t('way_' + w)]; }), visible: function () { return audience === 'teacher'; } },
      // asking first: the stage's buttons and V open and close it; here so the URL and the presets carry it
      { key: 'hide', type: 'toggle', label: t('hide'), value: L.defaults.hide, visible: function () { return false; } }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'o', label: t('roundKey'), run: roundNow },
      { key: 'v', label: t('revealKey'), run: function (s) { s.set({ hide: !s.params.hide }); } }
    ],

    legend: [
      { c: 1, label: t('legFirst') },
      { c: 2, shape: 'round', label: t('legSecond') },
      { shape: 'hollow', label: t('legBefore') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows: switching to a difference puts the larger number first; a clamped task or
  // shift is written back, so the slider and the URL say what the stage says
  sim.on(function (c) {
    var p = c.params, s = c.state;
    if (p.op === 'sub' && p.b > p.a) { sim.set({ a: p.b, b: p.a }); return; }
    if (p.a !== s.a || p.b !== s.b) { sim.set({ a: s.a, b: s.b }); return; }
    if (p.k !== s.k) sim.set({ k: s.k });
  });
  sim.render();
})();
</script>
</body>
</html>
