<!-- set-radio-discipline: two minutes of handheld-radio traffic on a fictional shooting day. An explorer: the student
     puts the departments' own talk on the main channel or on channels of their own, sets how often and how long people
     talk, and switches three practices on or off (short messages with "copy", a side channel, the agreed emergency
     word). The stage draws every transmission on each channel's lane, the doubled ones, the queue for the main channel
     and the delay from 0:40, when the 1st AD needs to call stop, to the second the stop is heard; the scores compare the
     same traffic with no practice and with all three. Channel: radio.js; scene: sim.js; rules: SPEC.md; words:
     strings.js. -->

<script src="strings.js"></script>
<script src="radio.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LATE = 2 * L.STOP_LEN;                   // the heard tile turns amber past twice the stop's own length (SPEC.md)
  var COLOUR = { ad: '1', camera: '2', electric: '3', grip: '4', art: '5', base: '6' };
  var FAR = {};
  L.STATIONS.forEach(function (s) { FAR[s.id] = s.far; });

  /** m:ss, the clock of the two minutes. Not language: the same in both. */
  function clock(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
  function pc(s) { return (100 * s / L.LEN) + '%'; }
  function sec(n) { return t.n('sec', n); }

  // ── the scores ──
  function scores(s) {
    function tile(k, label, value, attrs) {
      return h('div', Object.assign({ class: 'rd-sc', dataset: { k: k } }, attrs || {}), h('span', { class: 'rd-muted' }, label), h('b', null, value));
    }
    var heard = s.heard === null
      ? tile('never', t('scNever'), t('scNeverVal'))
      : tile('heard', t('scHeard'), sec(s.delay), s.delay > LATE ? { dataset: { k: 'heard', late: '' } } : null);
    function cmp(x) { return x.delay === null ? t('cmpNever') : sec(x.delay); }
    return h('div', { class: 'rd-top' },
      heard,
      tile('doubled', t('scDoubled'), String(s.doubled)),
      tile('lost', t('scLost'), String(s.lost)),
      tile('repeats', t('scRepeats'), String(s.repeats)),
      tile('waiting', t('scWaiting'), String(s.waiting)),
      tile('busy', t('scBusy'), t('busyOf', { s: Math.round(s.busy * L.STOP_AT) })),
      h('div', { class: 'rd-cmp' },
        h('span', null, t('cmpHead')),
        h('span', null, t('cmpNone')), h('b', null, cmp(s.none)),
        h('span', null, t('cmpAll')), h('b', null, cmp(s.all))));
  }

  // ── the timeline ──
  function laneName(ch) {
    if (ch === 'main') return h('div', { class: 'rd-name', dataset: { ch: ch } }, h('b', null, t('ch_main')), h('span', null, t('ch_mainSub')));
    if (ch === 'side') return h('div', { class: 'rd-name', dataset: { ch: ch } }, h('b', null, t('ch_side')), h('span', null, t('ch_sideSub')));
    var id = ch.slice(4);
    return h('div', { class: 'rd-name', dataset: { ch: 'own' } }, h('b', null, t('st_' + id)), h('span', null, t('ch_own')));
  }

  /** Overlapping transmissions on one lane (the doubled ones) get rows of their own: greedy, in start order. */
  function rows(list) {
    var ends = [];
    var out = list.map(function (x) {
      var r = 0;
      while (r < ends.length && ends[r] > x.start) r++;
      ends[r] = x.end;
      return r;
    });
    return { row: out, depth: Math.max(1, ends.length) };
  }

  function bar(x, row, depth) {
    var stop = x.role === 'stop', dur = x.end - x.start;
    var states = [];
    if (x.doubled) states.push(t('is_doubled'));
    if (x.lost) states.push(t('is_lost'));
    if (x.repeat) states.push(t('is_repeat'));
    if (x.cut) states.push(t('is_cut'));
    var what = t('what_' + x.role) + (states.length ? ' (' + states.join(', ') + ')' : '');
    var attrs = {
      class: 'rd-bar' + (stop ? '' : ' sd-fill') + (x.doubled ? ' sd-hatch' : ''),
      dataset: { c: COLOUR[x.st] }, role: 'img',
      'aria-label': t('barLabel', { who: t('st_' + x.st), from: clock(x.start), to: clock(x.end), what: what }),
      style: { left: pc(x.start), width: pc(dur), top: 'calc(' + (100 * row / depth) + '% + 0.15rem)', height: 'calc(' + (100 / depth) + '% - 0.3rem)' }
    };
    if (x.doubled) attrs.dataset.dbl = '';
    if (x.cut) attrs.dataset.cut = '';
    if (stop) attrs.dataset.stop = '';
    // the copy came back only on a transmission that was heard to its end
    var copyW = x.copy && dur > x.copy ? (100 * Math.min(x.copy, dur) / dur) + '%' : null;
    return h('div', attrs,
      h('i', null, stop ? '' : t('letter_' + x.st)),
      x.lost ? h('span', { class: 'rd-mark' }, '✕') : x.repeat ? h('span', { class: 'rd-mark' }, '↻') : null,
      copyW && !x.over && !x.cut && !x.doubled ? h('span', { class: 'rd-copy', style: { width: copyW } }) : null);
  }

  function timeline(s) {
    var kids = [h('span')];   // row 1, column 1: empty (the markers' labels are in column 2)
    kids.push(h('span'));
    // Each lane is as tall as its rows of overlapping bars need, and shares the free height by them.
    var tracks = ['1.7rem'], total = 0;
    s.chans.forEach(function (ch) {
      kids.push(laneName(ch));
      var list = s.tx.filter(function (x) { return x.ch === ch; }), rw = rows(list);
      tracks.push('minmax(' + (1.1 * rw.depth + 1.1) + 'rem, ' + rw.depth + 'fr)');
      total += rw.depth;
      kids.push(h('div', { class: 'rd-lane', dataset: { ch: ch } }, list.map(function (x, i) { return bar(x, rw.row[i], rw.depth); })));
    });
    var qmax = Math.max.apply(null, s.queue.concat([1]));
    kids.push(h('div', { class: 'rd-name' }, h('b', null, t('queue'))));
    kids.push(h('div', { class: 'rd-queue', role: 'img', 'aria-label': t('queueLabel', { n: qmax }) },
      s.queue.map(function (q) { return h('span', { class: 'rd-q', style: { height: (100 * q / Math.max(qmax, 3)) + '%' } }); }),
      h('span', { class: 'rd-qmax' }, t('qMax', { n: qmax }))));
    var ticks = [];
    for (var x = 0; x <= L.LEN; x += 10) {
      ticks.push(h('span', { class: 'rd-tick', dataset: { ph: x % 40 ? '1' : '0' }, style: { left: pc(x) }, translate: 'no' }, clock(x)));
    }
    kids.push(h('span'));
    kids.push(h('div', { class: 'rd-clock' }, ticks));
    // the markers
    var marks = [
      h('div', { class: 'rd-vline', dataset: { k: 'need' }, style: { left: pc(L.STOP_AT) } }),
      h('span', { class: 'rd-mlabel', dataset: { k: 'need' }, style: { left: pc(L.STOP_AT) } }, t('mkNeed'))
    ];
    if (s.heard !== null) {
      marks.push(h('div', { class: 'rd-vline', dataset: { k: 'heard' }, style: { left: pc(s.heard) } }));
      marks.push(h('div', { class: 'rd-span', style: { left: pc(L.STOP_AT), width: pc(s.heard - L.STOP_AT) } }));
      var hd = { k: 'heard' };
      if (s.heard > 95) hd.left = '';
      marks.push(h('span', { class: 'rd-mlabel', dataset: hd, style: { left: pc(s.heard) } },
        t('mkHeard') + ' ' + clock(s.heard) + ' · ' + sec(s.delay)));
    } else {
      marks.push(h('span', { class: 'rd-mlabel', dataset: { k: 'not' }, style: { left: pc(L.STOP_AT) } }, t('mkNot')));
    }
    kids.push(h('div', { class: 'rd-marks', 'aria-hidden': 'true' }, marks));
    tracks.push('minmax(2.6rem, 0.6fr)', 'auto');
    return h('div', { class: 'rd-tl', style: { gridTemplateRows: tracks.join(' '), '--rows': String(total) } }, kids);
  }

  function key() {
    return h('div', { class: 'rd-key' }, L.IDS.map(function (id) {
      var attrs = { class: 'rd-who' };
      if (FAR[id]) attrs.dataset = { far: '' };
      return h('span', attrs,
        h('span', { class: 'rd-letter sd-fill', dataset: { c: COLOUR[id] }, 'aria-hidden': 'true' }, t('letter_' + id)),
        h('span', null, t('st_' + id)),
        FAR[id] ? h('span', { class: 'rd-muted' }, '(' + t('farNote') + ')') : null);
    }));
  }

  // ── caption (SPEC.md "Legend and captions") ──
  function caption(s) {
    var tries = t.n('triesN', s.stopTries);
    var out = [s.heard === null ? t('capNever', { tries: tries }) : t('capHeard', { d: sec(s.delay), tries: tries })];
    var dbl = t.n('doubledN', s.doubled);
    out.push(s.lost ? t('capCounts', { doubled: dbl, lost: t.n('lostN', s.lost) }) : t('capNoLost', { doubled: dbl }));
    out.push(t('why_' + s.reason, { w: s.waited == null ? '' : sec(s.waited) }));
    return out.join(' ');
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'channels', type: 'choice', label: t('channels'), options: [['one', t('channels_one')], ['own', t('channels_own')]] },
      { key: 'rate', type: 'choice', label: t('rate'), options: L.RATES.map(function (r) { return [r, t('rate_' + r)]; }) },
      { key: 'len', type: 'range', label: t('len'), min: L.LEN_MIN, max: L.LEN_MAX, step: L.LEN_STEP,
        format: function (v) { return sec(v); }, disabled: function (p) { return p.short ? t('lenOff') : false; } },
      { key: 'short', type: 'toggle', label: t('short'), hint: t('shortHint') },
      { key: 'side', type: 'toggle', label: t('side'), hint: t('sideHint') },
      { key: 'word', type: 'toggle', label: t('word'), hint: t('wordHint') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'rd-dbl', label: t('legDoubled') },
      { shape: 'rd-lost', label: t('legLost') },
      { shape: 'rd-rep', label: t('legRepeat') },
      { shape: 'rd-copy', label: t('legCopy') },
      { shape: 'rd-stop', label: t('legStop') }
    ],
    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'rd' },
        scores(s),
        timeline(s),
        key(),
        h('p', { class: 'rd-foot' }, t('foot'))));
    },
    caption: function (c) { return caption(c.state); }
  });
})();
</script>
</body>
</html>
