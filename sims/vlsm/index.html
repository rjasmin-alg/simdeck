<head>

     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">

  "id": "vlsm",
  "class": "stepper",
  "steps": 9,
  "title": { "hr": "VLSM: podmreže različite veličine", "en": "VLSM: subnets of different sizes" },
  "concept": { "hr": "Jedan prostor, blokovi po mjeri: najveći prvo, svaki poravnat na svoju veličinu", "en": "One space, blocks cut to size: largest first, each aligned to its own size" }
}

<style>
/* Page CSS: every selector starts with [data-sim="vlsm"]; colours only from kit tokens. */
[data-sim="vlsm"] .vl {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3cqh;
  height: 100%;
  padding: 2cqh 2.5cqw;
}

/* the address space .0–.255 as one bar; every block is placed at start/256 of its width */
[data-sim="vlsm"] .vl-space { display: flex; flex-direction: column; gap: 0.3rem; }
[data-sim="vlsm"] .vl-head { display: flex; justify-content: space-between; font-size: var(--fs-md); font-weight: 700; }
[data-sim="vlsm"] .vl-bar {
  position: relative;
  height: 15cqh;
  min-height: 3rem;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--radius-sm);
  background: var(--bg);
}
[data-sim="vlsm"] .vl-seg {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-right: var(--line-w) solid var(--ink);
  line-height: 1.1;
  white-space: nowrap;
}
[data-sim="vlsm"] .vl-seg b { font-size: var(--fs-stage); }
[data-sim="vlsm"] .vl-seg small { font-size: var(--fs-sm); }
[data-sim="vlsm"] .vl-hole { border-right: var(--line-w) solid var(--ink); font-size: var(--fs-sm); font-weight: 700; color: var(--ink); }
[data-sim="vlsm"] .vl-free {
  border: var(--line-w) dashed var(--muted);
  border-radius: var(--radius-sm);
  inset: 0.3rem 0.3rem 0.3rem auto;
  color: var(--muted);
  font-size: var(--fs-md);
}
[data-sim="vlsm"] .vl-scale { position: relative; height: 1.4rem; font-family: var(--mono); font-size: var(--fs-sm); color: var(--muted); }
[data-sim="vlsm"] .vl-scale span { position: absolute; transform: translateX(-50%); }
[data-sim="vlsm"] .vl-scale span:first-child { transform: none; }
[data-sim="vlsm"] .vl-scale span:last-child { transform: translateX(-100%); }

/* the plan: one row per unit */
[data-sim="vlsm"] .vl-table { width: 100%; border-collapse: collapse; font-size: 1.2rem; }
[data-sim="vlsm"] .vl-table th {
  text-align: left;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--muted);
  border-bottom: var(--line-w) solid var(--ink);
  padding: 0.2rem 0.6rem;
  white-space: nowrap;
}
[data-sim="vlsm"] .vl-table td { padding: 0.45rem 0.6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
[data-sim="vlsm"] .vl-table td.vl-num, [data-sim="vlsm"] .vl-table th.vl-num { text-align: right; }
[data-sim="vlsm"] .vl-mono { font-family: var(--mono); }
[data-sim="vlsm"] .vl-badge {
  display: inline-grid;
  place-items: center;
  min-width: 2rem;
  height: 2rem;
  border-radius: 50%;
  font-weight: 700;
}
[data-sim="vlsm"] .vl-table tr.sd-changed td { background: var(--hl); color: var(--on-hl); }
[data-sim="vlsm"] .vl-table tr.sd-changed td:first-child { box-shadow: inset 0.35rem 0 0 var(--ink); }
[data-sim="vlsm"] .vl-nofit { color: var(--danger); font-weight: 700; border: var(--line-w) dashed var(--danger); border-radius: var(--radius-sm); padding: 0 0.4rem; }
[data-sim="vlsm"] .vl-table tr.sd-changed .vl-nofit { color: var(--on-hl); border-color: var(--on-hl); }
[data-sim="vlsm"] .vl-later { visibility: hidden; }
[data-sim="vlsm"] .vl-total { text-align: center; font-size: var(--fs-stage); font-weight: 700; }
[data-sim="vlsm"] .vl-total.vl-over { color: var(--danger); }
[data-sim="vlsm"] .sd-explain sup { font-size: var(--fs-sm); }
/* six host sliders: name, slider and number on one row, so the panel fits at 1920×1080 */
[data-sim="vlsm"] .sd-ctl:has(> .sd-range) { display: grid; grid-template-columns: 8.2rem minmax(0, 1fr) 2.6rem; align-items: center; column-gap: 0.5rem; }
[data-sim="vlsm"] .sd-ctl:has(> .sd-range) > .sd-ctl-label { display: contents; }
[data-sim="vlsm"] .sd-ctl:has(> .sd-range) > .sd-ctl-label > span { grid-column: 1; grid-row: 1; }
[data-sim="vlsm"] .sd-ctl:has(> .sd-range) > .sd-range { grid-column: 2; grid-row: 1; }
[data-sim="vlsm"] .sd-ctl:has(> .sd-range) output { grid-column: 3; grid-row: 1; text-align: right; }
[data-sim="vlsm"] .sd-seg { flex-wrap: nowrap; }
[data-sim="vlsm"] .sd-seg button { padding: 0 0.3rem; white-space: nowrap; }
[data-sim="vlsm"] .sd-swatch[data-shape='hatch'] {
  background: repeating-linear-gradient(45deg, transparent 0 0.18em, var(--ink) 0.18em 0.3em);
}

/* Phone and portrait: the stage grows with its content; the table drops the columns the bar and caption repeat. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="vlsm"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="vlsm"] .vl { height: auto; gap: 1rem; padding: 0.6rem 0.3rem; }
  [data-sim="vlsm"] .vl-bar { height: 3.4rem; }
  [data-sim="vlsm"] .vl-seg small, [data-sim="vlsm"] .vl-free span { display: none; }
  [data-sim="vlsm"] .vl-seg b { font-size: var(--fs-md); }
  [data-sim="vlsm"] .vl-table { font-size: 14px; }
  [data-sim="vlsm"] .vl-table th, [data-sim="vlsm"] .vl-table td { padding: 0.25rem 0.2rem; font-size: 14px; }
  [data-sim="vlsm"] .vl-table .vl-wide { display: none; }
  [data-sim="vlsm"] .vl-badge { min-width: 1.5rem; height: 1.5rem; }
  [data-sim="vlsm"] .vl-hole { font-size: 0; }
  [data-sim="vlsm"] .vl-scale .vl-odd { display: none; }
}
</style>
</head>
<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">VLSM: podmreže različite veličine</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SPACE = L.space;

  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, text); }
  function bold(text) { return h('b', { translate: 'no' }, text); }
  function dot(offset) { return '.' + offset; }               // the book's short form of 192.168.1.x
  function pct(x) { return (x / SPACE * 100) + '%'; }
  function addrs(n) { return t.n('addrN', n, { count: n }); }
  function hostsOf(n) { return t.n('hostsUnit', n, { count: n }); }

  // Units in the order the table shows them: the list until the order is decided, then the allocation order.
  function rows(s, n) { return n < 2 ? s.units.map(function (u, i) { return i; }) : s.seq; }
  function isPlaced(s, i) { return s.units[i].rank < s.placed; }

  function bar(s, c) {
    var segs = [], end = 0;
    s.units.forEach(function (u, i) {
      if (!isPlaced(s, i) || !u.fits) return;
      end = Math.max(end, u.start + u.size);
      var now = i === s.current;
      segs.push(h('div', {
        class: 'vl-seg sd-fill' + (now ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''),
        dataset: { c: String(i + 1) },
        style: { left: pct(u.start), width: pct(u.size) },
        title: t(u.id) + ' /' + u.prefix
      }, h('b', null, String(u.rank + 1)), u.size >= 16 ? h('small', { translate: 'no' }, '/' + u.prefix) : null));
    });
    s.holes.forEach(function (o) {
      if (!isPlaced(s, o.before)) return;
      segs.push(h('div', { class: 'vl-seg vl-hole sd-hatch', style: { left: pct(o.start), width: pct(o.size) } },
        o.size >= 16 ? t('hole') : null));
    });
    if (end < SPACE) {
      var summary = s.phase === 'summary';
      segs.push(h('div', { class: 'vl-seg vl-free', style: { left: 'calc(' + pct(end) + ' + 0.3rem)' } },
        h('span', null, summary ? t('free') + ' ' : null, (SPACE - end) >= 24 ? data(String(SPACE - end)) : null)));
    }
    var ticks = [];
    for (var x = 0; x <= SPACE; x += 32) ticks.push(h('span', { class: x % 64 ? 'vl-odd' : null, style: { left: pct(x) } }, x === SPACE ? '.255' : dot(x)));
    return h('div', { class: 'vl-space' },
      h('div', { class: 'vl-head' }, data('192.168.1.0/24'), data('256')),
      h('div', { class: 'vl-bar' }, segs),
      h('div', { class: 'vl-scale', translate: 'no', 'aria-hidden': 'true' }, ticks));
  }

  function table(s, n) {
    var later = function (k) { return n < k ? ' vl-later' : ''; };
    var head = h('tr', null,
      h('th', null, ''), h('th', null, t('colUnit')), h('th', { class: 'vl-num' }, t('colHosts')),
      h('th', { class: 'vl-num' }, t('colPrefix')), h('th', { class: 'vl-num vl-wide' }, t('colBlock')),
      h('th', null, t('colNet')), h('th', { class: 'vl-wide' }, t('colBc')), h('th', { class: 'vl-wide' }, t('colRange')));
    var body = rows(s, n).map(function (i) {
      var u = s.units[i], placed = isPlaced(s, i);
      var where;
      if (placed && !u.fits) where = [h('td', { colspan: '3' }, h('span', { class: 'vl-nofit' }, t('noFit')))];
      else where = [
        h('td', { class: 'vl-mono' + (placed ? '' : ' vl-later') }, data(placed ? L.format(u.network) : '0.0.0.0')),
        h('td', { class: 'vl-mono vl-wide' + (placed ? '' : ' vl-later') }, data(placed ? L.format(u.broadcast) : '0.0.0.0')),
        h('td', { class: 'vl-mono vl-wide' + (placed ? '' : ' vl-later') }, data(placed ? dot(u.start + 1) + ' – ' + dot(u.start + u.size - 2) : '.0'))
      ];
      return h('tr', { class: i === s.current ? 'sd-changed' : null },
        h('td', null, h('span', { class: 'vl-badge sd-fill', dataset: { c: String(i + 1) } }, n >= 2 ? String(u.rank + 1) : '')),
        h('td', null, t(u.id)),
        h('td', { class: 'vl-num vl-mono' }, data(String(u.hosts))),
        h('td', { class: 'vl-num vl-mono' + later(1) }, data('/' + u.prefix)),
        h('td', { class: 'vl-num vl-mono vl-wide' + later(1) }, data(String(u.size))),
        where);
    });
    return h('table', { class: 'vl-table' }, h('thead', null, head), h('tbody', null, body));
  }

  function total(s, c) {
    var fixed = c.params.scheme === 'fixed';
    var line = fixed
      ? t.parts('fixedLine', { needed: bold(String(s.needed)), vlsm: bold(String(s.vlsmNeeded)) })
      : t.parts('totalLine', { used: bold(String(s.used)), holes: bold(String(s.holeTotal)), reserve: bold(String(s.reserve)) });
    return h('p', { class: 'vl-total' + (s.phase === 'summary' ? '' : ' vl-later') + (s.unplaced ? ' vl-over' : '') }, line);
  }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: {} },
    { id: 'fixed', label: t('presetFixed'), hint: t('presetFixedHint'), params: { scheme: 'fixed' } },
    { id: 'smallest', label: t('presetSmallest'), hint: t('presetSmallestHint'), params: { scheme: 'smallest' } },
    { id: 'sales-100', label: t('presetSales100'), hint: t('presetSales100Hint'), params: { h0: 100 } },
    { id: 'full', label: t('presetFull'), hint: t('presetFullHint'), params: { h0: 100, h1: 100 } }
  ];

  var params = [
    { key: 'scheme', type: 'choice', label: t('scheme'),
      options: [['largest', t('schemeLargest')], ['smallest', t('schemeSmallest')], ['fixed', t('schemeFixed')]] }
  ].concat(L.keys.map(function (k, i) {
    return { key: k, type: 'range', label: t(L.units[i]), min: L.minHosts, max: L.maxHosts, step: 1, format: String };
  }));

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: presets,

    legend: [
      { shape: 'hatch', label: t('legendHole') },
      { shape: 'hollow', label: t('legendFree') },
      { shape: 'hl', label: t('legendNew') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'vl' }, bar(c.state, c), table(c.state, c.n), total(c.state, c)));
    },

    caption: function (c) {
      var s = c.state, scheme = c.params.scheme;
      switch (s.phase) {
        case 'needs': return t.parts('captionNeeds', { space: bold('192.168.1.0/24') });
        case 'sizes': {
          // the largest need (first of equals) and the smallest (last of equals): Prodaja and the link in the book
          var big = 0, small = 0;
          s.units.forEach(function (u, i) {
            if (u.hosts > s.units[big].hosts) big = i;
            if (u.hosts <= s.units[small].hosts) small = i;
          });
          var B = s.units[big], S = s.units[small];
          var v = {
            big: h('b', null, t(B.id)), bigHosts: hostsOf(B.hosts), bigP: bold('/' + B.prefix), bigSize: addrs(B.size),
            small: h('b', null, t(S.id)), smallHosts: hostsOf(S.hosts), smallP: bold('/' + S.prefix), smallSize: addrs(S.size),
            needed: h('b', null, addrs(s.needed))
          };
          return t.parts(scheme === 'fixed' ? 'captionSizesFixed' : 'captionSizes', v);
        }
        case 'order':
          return t(scheme === 'fixed' ? 'captionOrderFixed' : scheme === 'smallest' ? 'captionOrderSmallest' : 'captionOrderLargest');
        case 'place': {
          var u = s.units[s.current];
          var w = { name: h('b', null, t(u.id)), p: bold('/' + u.prefix), size: addrs(u.size), n: data(String(u.size)) };
          if (!u.fits) return t.parts('captionNoFit', Object.assign(w, { left: h('b', null, addrs(SPACE - s.cursor)) }));
          Object.assign(w, { at: bold(dot(u.start)), start: data(String(u.start)), net: bold(L.format(u.network)), bc: bold(L.format(u.broadcast)) });
          if (u.start === s.cursor) return t.parts('captionPlace', w);
          return t.parts('captionPlaceGap', Object.assign(w, { from: bold(dot(s.cursor)),
            gap: h('span', { class: 'sd-hl' }, t.n('gapN', u.start - s.cursor, { count: u.start - s.cursor })) }));
        }
        default: {
          var x = { needed: h('b', null, addrs(s.needed)), vlsm: h('b', null, addrs(s.vlsmNeeded)), used: h('b', null, addrs(s.used)),
            reserve: h('b', null, addrs(s.reserve)), holes: h('b', null, addrs(s.holeTotal)) };
          if (scheme === 'fixed') {
            if (!s.unplaced) return t.parts('captionSummaryFixedFits', x);
            return t.parts('captionSummaryFixed', Object.assign(x, { count: h('b', null, t.n('noFitN', s.unplaced, { count: s.unplaced })) }));
          }
          if (s.unplaced) {
            var out = t.parts('captionSummaryNoFit', Object.assign(x, { count: h('b', null, t.n('noFitN', s.unplaced, { count: s.unplaced })) }));
            return s.holes.length ? out.concat([' '], t.parts('captionHolesToo', x)) : out;
          }
          if (s.holes.length) return t.parts('captionSummaryHoles', Object.assign(x, { count: t.n('holeN', s.holes.length, { count: s.holes.length }) }));
          return t.parts('captionSummary', x);
        }
      }
    }
  });
})();
</script>
</body>
</html>
