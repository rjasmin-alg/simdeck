<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { STA: '1', AP: '2', AS: '3' };

  /** Data (keys, nonces, MACs, SSIDs, message and field names, numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'wp-mono' : cls || null }, text); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function lock() { return h('span', { class: 'sd-seq-lock', 'aria-hidden': 'true' }); }
  function eye() { return h('span', { class: 'wp-eye', 'aria-hidden': 'true' }); }
  function short(v, n) { return v.length > n ? v.slice(0, n) + '…' : v; }

  // ── numbers: decimal comma in Croatian, powers of ten with superscripts ──
  var SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function sup(n) { return String(n).split('').map(function (d) { return SUP[+d]; }).join(''); }
  function dec(v, digits) {
    var s = v.toFixed(digits);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function group(v) {
    var s = String(Math.round(v));
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '.' : ',');
  }
  /** m × 10^e with one decimal of m. */
  function sci(v) {
    var e = Math.floor(Math.log10(v)), m = v / Math.pow(10, e);
    if (Number(m.toFixed(1)) >= 10) { m /= 10; e += 1; }
    return dec(m, 1) + ' × 10' + sup(e);
  }
  /** Seconds as s, min, h, days, years, or m × 10^e years. */
  function duration(sec) {
    var year = 365.25 * 86400;
    var two = function (v) { return v < 10 ? dec(v, 1) : group(v); };
    if (sec < 60) return t('tS', { v: two(sec) });
    if (sec < 3600) return t('tMin', { v: two(sec / 60) });
    if (sec < 86400) return t('tH', { v: two(sec / 3600) });
    if (sec < year) return t.n('tD', two(sec / 86400));
    if (sec < 1e4 * year) return t.n('tY', two(sec / year));
    return t('tYBig', { v: sci(sec / year) });
  }

  // ── key panels (the body of each lane card) ──
  function keyPanel(run, side, compact) {
    var k = run[side].keys, ch = run.changed || [];
    var n = compact ? 6 : 8;
    var rows = [];
    function row(label, key, value, attrs, installed) {
      var changed = ch.indexOf(side + '.' + key) >= 0 || (installed && ch.indexOf(side + '.installed') >= 0);
      rows.push(h('dt', attrs || null, label),
        h('dd', null, value == null ? h('span', { class: 'wp-none' }, t('kNone'))
          : h('span', { class: 'wp-sec' + (changed ? ' sd-changed' : ''), dataset: installed ? { installed: '' } : {} }, lock(), value)));
    }
    if (k.cred === '*') row(t('kUsers'), 'cred', h('span', null, t('kAllUsers')));
    else if (k.cred) row(t('kCred'), 'cred', data(k.cred + ' ••••', ''));
    else row(t('kPass'), 'pass', k.pass ? data(short(k.pass, compact ? 8 : 12), '') : null);
    row(data('PMK', ''), 'pmk', k.pmk ? data(short(k.pmk, n), '') : null);
    if (side !== 'as') {
      ['kck', 'kek', 'tk'].forEach(function (key) {
        row(data(key.toUpperCase(), ''), key, k[key] ? data(short(k[key], n), '') : null, { dataset: { ptk: '' }, title: 'PTK' }, key === 'tk' && k.installed);
      });
      row(data('GTK', ''), 'gtk', k.gtk ? data(short(k.gtk, n), '') : null);
    }
    return h('dl', { class: 'wp-keys' }, rows);
  }

  function lanes(run, compact) {
    var out = [
      { id: 'STA', c: COLOUR.STA, shape: 'square', name: t('sta'), body: keyPanel(run, 'sta', compact) },
      { id: 'AP', c: COLOUR.AP, name: t('ap'), tags: data(run.ssid, 'wp-muted wp-mono'), body: keyPanel(run, 'ap', compact) }
    ];
    if (run.as) out.push({ id: 'AS', c: COLOUR.AS, name: t('as'), body: keyPanel(run, 'as', compact) });
    return out;
  }

  // ── chart rows ──
  var LABEL = { M1: 'M1', M2: 'M2', M3: 'M3', M4: 'M4', eap: '802.1X/EAP', pmk: 'PMK', saeCommit: 'SAE commit', saeConfirm: 'SAE confirm' };
  function fieldsText(r, compact) {
    if (r.msg === 'M3') return h('span', { translate: 'no', class: 'wp-mono' }, compact ? null : 'ANonce · ',
      h('span', { class: 'wp-enc sd-hatchtext' }, '{GTK}KEK'), compact ? ' · MIC' : ' · MIC · install');
    if (/^M[124]$/.test(r.msg)) return r.fields.map(function (f) { return { anonce: 'ANonce', snonce: 'SNonce', mic: 'MIC' }[f.name]; }).join(' · ');
    return null;
  }
  function seenOf(run, r, compact) {
    if (r.kind === 'note') return h('span', { class: 'wp-muted' }, t('seenLocal'));
    if (!r.air) return h('span', { class: 'wp-muted' }, t('seenWire'));
    var first = run.rows.filter(function (x) { return x.kind === 'msg' && x.air; })[0] === r;
    var bits;
    if (r.msg === 'eap') bits = [t('seenEap')];
    else if (r.msg === 'saeCommit' || r.msg === 'saeConfirm') bits = [data(LABEL[r.msg] + ' ', ''), h('span', null, '(', t('seenOpaque'), ')')];
    else if (r.msg === 'M1') bits = [data('ANonce ' + short(L.ANONCE, 6), '')];
    else if (r.msg === 'M2') bits = [data('SNonce, MIC ' + short(r.fields[1].value, 6), '')];
    else if (r.msg === 'M3') bits = [data('ANonce, MIC, ', ''), h('span', { class: 'sd-hatchtext' }, data('{GTK}KEK', ''), ' ', t('seenEnc'))];
    else if (r.msg === 'M4') bits = [data('MIC ' + short(r.fields[0].value, 6), '')];
    if (first && !compact) bits.push(h('span', null, ' ', t('seenFirst')));
    return h('span', { class: 'wp-seen' }, eye(), bits);
  }
  function noteText(run, r) {
    if (r.what === 'pmk') return run.mode === 'sae' ? t('notePmkSae') : run.mode === 'eap' ? t('notePmkEap') : t('notePmkPsk');
    if (r.what === 'ptk') return t('notePtk');
    return t('noteInstall');
  }
  function chart(c, run, obs, compact) {
    compact = compact || !!run.as;     // three lanes: narrow cards and short labels, like compare
    var cur = c.n > 0 && run.last ? run.last.step : -1;
    var shown = {};
    var rows = run.rows.map(function (r) {
      var changed = r.step === cur;
      var time = shown[r.step] ? null : String(r.step);
      shown[r.step] = true;
      var seen = obs ? seenOf(run, r, compact) : null;
      if (r.kind === 'note') return { kind: 'note', lane: r.lane, text: noteText(run, r), time: time, changed: changed, seen: seen };
      var re = {};
      // receiver words only where the arrow has room beside its label (not on M3, not on narrow lanes)
      if (r.micOk && r.msg !== 'M3' && !compact) re[r.to] = t('reMicOk');
      if (r.msg === 'eap') re.AS = t('reChecks');
      if (r.msg === 'pmk') re.AP = t('reWired');
      return { from: r.from, to: r.to, label: LABEL[r.msg], c: COLOUR[r.from], fields: fieldsText(r, compact), lock: r.lock,
        place: r.msg === 'eap' ? 'mid' : null, re: re, time: time, changed: changed, seen: seen };
    });
    var el = Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(run, compact),
      rows: rows,
      timeWidth: '2.2rem',
      eve: obs ? { title: h('span', null, eye(), t('eveTitle')), width: run.as ? '11rem' : compact ? '10rem' : '14rem' } : null,
      empty: run.last && run.last.did === 'wait' ? t('chartWait') : t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
    return el;
  }

  // ── observer panel and verdict ──
  var ITEM = { apMac: 'AP MAC', staMac: 'STA MAC', ssid: 'SSID', anonce: 'ANonce', snonce: 'SNonce', mic2: 'MIC 2', mic3: 'MIC 3',
    mic4: 'MIC 4', gtkEnc: '{GTK}KEK', eap: 'EAP', saeCommit: 'SAE commit', saeConfirm: 'SAE confirm' };
  function verdict(c, run, prevRun) {
    var v = run.observer.note;
    var changed = !!prevRun && prevRun.observer.note !== v;
    var key = { nothing: 'vNothing', waiting: 'vWaiting', testable: 'vTestable', noShared: 'vNoShared', online: 'vOnline' }[v];
    var how = v === 'testable' ? t('vTestableHow') : v === 'online' ? t('vOnlineHow') : null;
    var mark = { testable: '!', noShared: '✓', online: '✓' }[v] || '…';
    return h('p', { class: 'wp-verdict' + (changed ? ' sd-changed' + (c.dir === 'forward' && !Simdeck.reducedMotion() ? ' sd-anim-in' : '') : ''), dataset: { v: v } },
      h('span', { class: 'wp-vmark', 'aria-hidden': 'true' }, mark),
      h('span', null, t(key), how ? h('span', { class: 'wp-how' }, how) : null));
  }
  function observerPanel(c, run, prevRun) {
    var cur = c.n > 0 && run.last ? run.last.step : -1;
    var cap = run.observer.captured;
    var list = cap.length ? h('dl', { class: 'wp-cap' }, cap.map(function (it) {
      var name = ITEM[it.item] + (it.item === 'saeCommit' || it.item === 'saeConfirm' ? ' ' + it.from : '');
      var val = it.item === 'gtkEnc' ? h('span', { class: 'sd-hatchtext' }, t('obsEnc'))
        : data(/^[0-9a-f]+$/.test(it.value) ? short(it.value, 12) : it.value, '');
      var ds = it.step === cur ? { new: '' } : {};
      return [h('dt', { dataset: ds, translate: 'no' }, name), h('dd', { dataset: ds }, val)];
    })) : h('p', { class: 'wp-muted', style: { margin: 0 } }, t('obsNone'));
    return h('section', { class: 'wp-box wp-obs' },
      h('h2', null, eye(), t('obsTitle')), list, verdict(c, run, prevRun), h('p', { class: 'wp-never' }, t('obsNever')));
  }

  // ── explorer: passphrase space and the time to try it all ──
  function explorer(c) {
    var p = c.params, rows = L.explore(p);
    var max = 33;   // log10 seconds at the right edge: 62^20 at 10^3 /s is about 10^32.8 s
    var body = rows.map(function (r) {
      var you = r.id === p.passClass;
      var lg = Math.max(0, Math.min(max, Math.log10(Math.max(1, r.seconds))));
      return h('tr', { dataset: you ? { you: '' } : {} },
        h('th', null, t('cl_' + r.id), you ? h('span', { class: 'wp-you' }, t('exYou')) : null),
        h('td', null, data(r.alphabet + sup(r.length) + ' ≈ ' + sci(r.space), '')),
        h('td', { class: 'wp-barcell' }, h('div', { class: 'wp-bar', style: { width: (lg / max * 100) + '%' } })),
        h('td', null, h('span', null, duration(r.seconds))));
    });
    return h('section', { class: 'wp-box wp-ex' },
      h('h2', null, h('span', null, t.parts('exTitle', { rate: data('10' + sup(p.guessRate), '') })), h('small', null, t('exNote'))),
      h('table', null, h('tbody', null, body)));
  }

  // ── render ──
  function render(c) {
    var s = c.state, obs = !!c.params.observer;
    if (s.mode === 'compare') {
      var cols = [['a', t('modePsk')], ['b', t('modeSae')]].map(function (x) {
        var run = s[x[0]], prev = c.prev ? c.prev[x[0]] : null;
        var ch = chart(c, run, obs, true);
        return { el: h('div', { class: 'wp-col' }, h('h2', { class: 'wp-coltitle' }, x[1]), ch, obs ? verdict(c, run, prev) : h('span')), chart: ch };
      });
      c.stage.replaceChildren(h('div', { class: 'wp-cmp' }, cols.map(function (x) { return x.el; })));
      cols.forEach(function (x) { x.chart.fit(); });
      return;
    }
    var ex = obs && s.mode === 'psk';
    var el = chart(c, s, obs, false);
    c.stage.replaceChildren(h('div', { class: 'wp', dataset: Object.assign(obs ? { obs: '' } : {}, ex ? { ex: '' } : {}) },
      el, obs ? observerPanel(c, s, c.prev) : null, ex ? explorer(c) : null));
    el.fit();
  }

  // ── captions ──
  var START = { psk: 'capStartPsk', eap: 'capStartEap', sae: 'capStartSae' };
  var OBS = { waiting: 'capObsWaiting', testable: 'capObsTestable', noShared: 'capObsNoShared', online: 'capObsOnline' };
  function caption(c) {
    var s = c.state;
    if (s.mode === 'compare') return rich(c.n === 0 ? 'capStartCmp' : 'cmp' + c.n);
    if (!s.last) return rich(START[s.mode]);
    var noteChanged = c.params.observer && c.prev && c.prev.observer.note !== s.observer.note && OBS[s.observer.note];
    var out;
    switch (s.last.did) {
      case 'pmk': out = s.mode === 'sae' ? rich('capPmkSae') : rich('capPmkPsk', { ssid: data(s.ssid) }); break;
      case 'eap': out = rich('capEap'); break;
      case 'pmkToAp': out = rich('capPmkToAp'); break;
      case 'saeCommit': out = rich('capSaeCommit'); break;
      case 'saeConfirm': out = rich('capSaeConfirm'); break;
      case 'm1': out = rich('capM1'); break;
      case 'staPtk': out = rich('capStaPtk'); break;
      case 'm2': out = rich('capM2'); if (!noteChanged) out = out.concat(' ', rich('capM2Ap')); break;
      case 'm3': out = rich('capM3'); break;
      case 'm4': out = rich('capM4'); break;
      default: out = [];
    }
    if (noteChanged) out = out.concat(' ', rich(OBS[s.observer.note]));
    return out;
  }

  /** The explorer shows (and the guess rate matters) only in WPA2-Personal with the observer on. */
  var explorerShown = function (p) { return p.mode === 'psk' && !!p.observer; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), resets: true,
        options: [['psk', t('modePsk')], ['eap', t('modeEap')], ['sae', t('modeSae')], ['compare', t('modeCmp')]] },
      { key: 'observer', type: 'toggle', label: t('observer'), hint: t('observerHint') },
      { key: 'passClass', type: 'select', label: t('passClass'),
        options: L.CLASSES.map(function (x) { return [x.id, t('cl_' + x.id)]; }),
        disabled: function (p) { return p.mode === 'eap' ? t('passClassOff') : false; } },
      { key: 'guessRate', type: 'range', label: t('guessRate'), min: 3, max: 10, step: 1,
        format: function (v) { return t('rateFmt', { v: '10' + sup(v) }); },
        disabled: function (p) { return explorerShown(p) ? false : t('guessRateOff'); } }
    ],

    presets: [
      { id: 'home', label: t('presetHome'), params: { mode: 'psk', observer: false }, hint: t('presetHomeHint') },
      { id: 'observer', label: t('presetObserver'), params: { mode: 'psk', observer: true }, hint: t('presetObserverHint') },
      { id: 'faculty', label: t('presetFaculty'), params: { mode: 'eap', observer: true }, hint: t('presetFacultyHint') },
      { id: 'wpa3', label: t('presetWpa3'), params: { mode: 'sae', observer: true }, hint: t('presetWpa3Hint') },
      { id: 'compare', label: t('presetCompare'), params: { mode: 'compare', observer: true }, hint: t('presetCompareHint') }
    ],

    legend: [
      { shape: 'line', label: t('legClear') },
      { shape: 'wp-lock', label: t('legProtected') },
      { shape: 'wp-hatch', label: t('legEnc') },
      { shape: 'wp-key', label: t('legSecret') },
      { shape: 'wp-eye', label: t('legSeen') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
