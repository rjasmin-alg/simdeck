<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Skriveni čvor i RTS/CTS</h1>

  </header>

      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>

        <summary></summary>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var COLOR = { A: '1', B: '3', C: '2' };
  var OTHER = { A: 'C', C: 'A' };
  function data(text) { return h('b', { translate: 'no' }, String(text)); }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { rts: false, hear: false } },
    { id: 'rts', label: t('presetRts'), hint: t('presetRtsHint'), params: { rts: true, hear: false } },
    { id: 'hear', label: t('presetHear'), hint: t('presetHearHint'), params: { rts: false, hear: true } },
    { id: 'hear-rts', label: t('presetHearRts'), hint: t('presetHearRtsHint'), params: { rts: true, hear: true } }
  ];

  // a frame cell: A solid, C solid and hatched, B's replies round and tinted
  function frameCell(f, now) {
    var cls = 'hn-cell ' + (f.src === 'B' ? 'hn-reply sd-soft' : 'sd-fill' + (f.src === 'C' ? ' sd-hatch' : ''));
    return h('div', { class: cls + (now ? ' sd-changed sd-anim-in' : ''), dataset: { c: COLOR[f.src] }, translate: 'no' },
      h('span', null, f.kind));
  }

  function status(x, s) {
    var n = s.n, slot = s.slots[n - 1] || null;
    if (x === 'B') {
      if (!slot) return t('stBQuiet');
      if (slot.sends.B) return t('stBSend');
      if (slot.collide) return t('stBCollide');
      return slot.heard.B.length ? t('stBHear') : t('stBQuiet');
    }
    var st = s.sta[x];
    if (st.phase === 'done') return t('stDone');
    if (slot && slot.sends[x]) return t('stSend', { k: slot.sends[x].k });
    if (st.phase === 'await' || st.phase === 'send') return t('stAwait');
    if (st.nav >= n && n > 0) return t('stNav', { until: st.nav });
    if (st.ready > n + 1) return st.attempt > 1 ? t('stBackoff', { ready: st.ready }) : t('stIdle');
    if (s.events.some(function (e) { return e.e === 'defer' && e.who === x; })) return t('stBusy');
    return t('stReady');
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'rts', type: 'toggle', label: t('rts'), hint: t('rtsHint') },
      { key: 'hear', type: 'toggle', label: t('hear'), hint: t('hearHint') }
    ],

    presets: presets,

    legend: [
      { c: 1, label: t('legendA') },
      { c: 2, shape: 'hatch', label: t('legendC') },
      { c: 3, shape: 'round', label: t('legendB') },
      { shape: 'cross', label: t('legendCollide') },
      { shape: 'nav', label: t('legendNav') }
    ],

    render: function (c) {
      var s = c.state, p = c.params, fwd = c.dir === 'forward' && !c.first;
      var slot = s.slots[s.n - 1] || null;

      function node(x) {
        var f = slot && slot.sends[x];
        var x2 = x === 'B' && slot && slot.collide;
        return h('div', { class: 'hn-node' },
          h('div', { class: 'hn-dot' + (f ? ' hn-on' : '') + (x2 ? ' hn-x' : ''), dataset: { c: COLOR[x] }, translate: 'no' }, x),
          x === 'B' ? h('div', { class: 'hn-role' }, h('em', null, t('ap'))) : h('div', { class: 'hn-role' }, t('station')),
          h('div', { class: 'hn-status' }, status(x, s)),
          f ? h('div', { class: 'hn-badge ' + (x === 'B' ? 'sd-soft' : 'sd-fill'), dataset: { c: COLOR[x] }, translate: 'no' }, f.kind)
            : x2 ? h('div', { class: 'hn-badge hn-cell hn-coll', 'aria-hidden': 'true' }, '✕') : h('div', { class: 'hn-badge' }));
      }
      var topo = h('div', { class: 'hn-topo' },
        node('A'), h('div', { class: 'hn-link' }, h('span', null, t('inRange'))),
        node('B'), h('div', { class: 'hn-link' }, h('span', null, t('inRange'))),
        node('C'),
        h('div', { class: 'hn-span' + (p.hear ? '' : ' hn-out') },
          data('A ↔ C'), ': ', p.hear ? t('inRange') : t('outRange')));

      var cells = [h('div', { class: 'hn-rowlabel' }, t('slot'))];
      for (var i = 1; i <= L.steps; i++) {
        cells.push(h('div', { class: 'hn-tick' + (i === s.n ? ' hn-now' : ''), translate: 'no' }, h('span', null, String(i))));
      }
      ['A', 'B', 'C'].forEach(function (x) {
        cells.push(h('div', { class: 'hn-rowlabel', translate: 'no' }, x));
        for (var i = 1; i <= L.steps; i++) {
          var r = s.slots[i - 1], now = fwd && i === s.n;
          if (!r) cells.push(h('div', { class: 'hn-cell hn-future' }));
          else if (r.sends[x]) cells.push(frameCell({ src: x, kind: r.sends[x].kind }, now));
          else if (r.nav[x]) cells.push(h('div', { class: 'hn-cell hn-nav', translate: 'no' }, h('span', null, 'NAV')));
          else cells.push(h('div', { class: 'hn-cell hn-none' }));
        }
      });
      cells.push(h('div', { class: 'hn-rowlabel' }, t('rowAtB')));
      for (i = 1; i <= L.steps; i++) {
        var r = s.slots[i - 1], now = fwd && i === s.n;
        if (!r) cells.push(h('div', { class: 'hn-cell hn-future' }));
        else if (r.sends.B) cells.push(h('div', { class: 'hn-cell hn-deaf', 'aria-hidden': 'true' }, h('span', null, '—')));
        else if (r.collide) cells.push(h('div', { class: 'hn-cell hn-coll' + (now ? ' sd-anim-in' : ''), 'aria-hidden': 'true' }, h('span', null, '✕')));
        else if (r.heard.B.length) {
          var from = r.heard.B[0];
          cells.push(h('div', { class: 'hn-cell sd-soft' + (from === 'C' ? ' sd-hatch' : ''), dataset: { c: COLOR[from] }, translate: 'no' }, h('span', null, from)));
        } else cells.push(h('div', { class: 'hn-cell hn-none' }));
      }

      function delivered(x) { var d = s.sta[x].delivered; return x + (d ? ' ✓ ' + d + '.' : ' –'); }
      var facts = h('div', { class: 'hn-facts' },
        h('div', { class: 'hn-box' }, t('factDelivered'), data(delivered('A')), data(delivered('C'))),
        h('div', { class: 'hn-box' + (s.collisions ? ' hn-bad' : '') }, t('factCollide'), data(s.collisions)),
        h('div', { class: 'hn-box' + (s.lost ? ' hn-bad' : '') }, t('factLost'), data(s.lost)));

      c.stage.replaceChildren(h('div', { class: 'hn' }, topo, h('div', { class: 'hn-time' }, cells), facts));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      if (s.n === 0) {
        return t.parts('captionStart', { hearing: t(p.hear ? 'startHear' : 'startHidden'), rtsState: t(p.rts ? 'rtsOn' : 'rtsOff') });
      }
      var slot = s.slots[s.n - 1], out = [];
      function add(key, vars) { if (out.length) out.push(' '); out = out.concat(t.parts(key, vars)); }
      s.events.forEach(function (e) {
        if (e.e === 'reply') {
          if (e.kind === 'DATA') add('evReplyData', { who: data(e.who) });
          else add(e.kind === 'CTS' ? 'evReplyCts' : 'evReplyAck', { owner: data(e.owner) });
        } else if (e.e === 'defer') {
          add(e.why === 'nav' ? 'evDeferNav' : 'evDeferBusy', { who: data(e.who), until: data(e.until) });
        } else if (e.e === 'start') {
          var o = OTHER[e.who];
          var hidden = slot.sends[o] && !L.hears(p, e.who, o);
          add(hidden ? 'evStartHidden' : 'evStart', { who: data(e.who), other: data(o), kind: data(e.kind), k: data(e.k) });
        } else if (e.e === 'collide') {
          add('evCollide', {});
        } else if (e.e === 'nav') {
          var hid = e.kind === 'CTS' && !L.hears(p, e.who, e.owner);
          add(hid ? 'evNavHidden' : 'evNav', { who: data(e.who), other: data(e.owner), kind: data(e.kind), until: data(e.until) });
        } else if (e.e === 'timeout') {
          add('evTimeout', { who: data(e.who), kind: data(e.kind), wait: t.n('wait', e.wait), ready: data(e.ready) });
        } else if (e.e === 'delivered') {
          add('evDelivered', { who: data(e.who), k: data(e.k) });
        }
      });
      if (!out.length) add('evQuiet', {});
      if (s.n === L.steps) {
        var done = (s.sta.A.delivered ? 1 : 0) + (s.sta.C.delivered ? 1 : 0);
        add('captionEnd', { n: data(s.n), done: data(done), coll: data(s.collisions), lost: data(s.lost) });
      }
      return out;
    }
  });
})();
</script>
