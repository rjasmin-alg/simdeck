<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var NS = 'http://www.w3.org/2000/svg';

  // ── icons: a snail (skipped for a slow link) and a padlock (always applied), drawn in currentColor ──
  var ICONS = {
    snail: ['M3 18h15a3 3 0 0 0 3-3', 'M5 18a6 6 0 1 1 11-3.3', 'M13 15a2.5 2.5 0 1 1-2.5-2.5', 'M18.5 12V8.5', 'M21 12.5 22 9'],
    lock: ['M6 11h12v9H6z', 'M8.5 11V8a3.5 3.5 0 0 1 7 0v3', 'M12 14.5v2.5']
  };
  function icon(name) {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'sl-ico');
    s.setAttribute('aria-hidden', 'true');
    ICONS[name].forEach(function (d) {
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      s.append(p);
    });
    return s;
  }

  // ── numbers: kbit/s, Mbit/s, Gbit/s with the language's decimal separator ──
  function num(v) { return String(Math.round(v * 10) / 10).replace('.', t('decimal')); }
  function speedText(kbps) {
    if (kbps < 1000) return t('unitK', { v: String(kbps) });
    if (kbps < 1000000) return t('unitM', { v: num(kbps / 1000) });
    return t('unitG', { v: num(kbps / 1000000) });
  }
  function thText(th) { return th === 0 ? t('thresholdOff') : t('unitK', { v: String(th) }); }
  function data(text, cls) { return h('span', { class: cls || 'sl-mono', translate: 'no' }, text); }

  // ── the dial: log scale from the first to the last notch ──
  var LO = Math.log10(L.SPEEDS[0]), HI = Math.log10(L.SPEEDS[L.SPEEDS.length - 1]);
  function pos(kbps) { return Math.max(0, Math.min(1, (Math.log10(kbps) - LO) / (HI - LO))); }
  function pct(x) { return (x * 100).toFixed(2) + '%'; }
  function anchor(x) { return x < 0.08 ? 'start' : x > 0.92 ? 'end' : 'mid'; }
  var TICKS = [100, 1000, 10000, 100000, 1000000];

  function dial(s, changed) {
    var x = pos(s.speedKbps), parts = [];
    var bar = h('div', { class: 'sl-bar' });
    if (s.detection) {
      var tx = pos(s.thresholdKbps);
      var slowZone = h('div', { class: 'sl-zone', dataset: { z: 'slow' }, style: 'width:' + pct(tx) }, h('span', null, t('zoneSlow')));
      var fastZone = h('div', { class: 'sl-zone', dataset: { z: 'fast' }, style: 'width:' + pct(1 - tx) }, h('span', null, t('zoneFast')));
      bar.append(slowZone, fastZone);
      parts.push(h('div', { class: 'sl-th', style: 'left:' + pct(tx) }));
      // the threshold label sits under the bar; ticks that would touch it give way after layout (fitLabels)
      parts.push(h('span', { class: 'sl-lab' + (changed.th ? ' sd-changed' : ''), dataset: { k: 'th', anchor: anchor(tx) }, style: 'left:' + pct(tx) }, t('thLabel', { th: thText(s.thresholdKbps) })));
      parts.push(h('span', { class: 'sl-arrow', dataset: { k: 'th' }, style: 'left:' + pct(tx), 'aria-hidden': 'true' }, '▲'));
      TICKS.forEach(function (k) {
        var kx = pos(k);
        parts.push(h('span', { class: 'sl-lab', dataset: { k: 'tick', anchor: anchor(kx) }, style: 'left:' + pct(kx) }, speedText(k)));
      });
    } else {
      bar.append(h('div', { class: 'sl-zone', dataset: { z: 'fast', off: '' }, style: 'width:100%' }, h('span', null, t('zoneNone'))));
      TICKS.forEach(function (k) {
        var kx = pos(k);
        parts.push(h('span', { class: 'sl-lab', dataset: { k: 'tick', anchor: anchor(kx) }, style: 'left:' + pct(kx) }, speedText(k)));
      });
    }
    parts.unshift(bar);
    parts.push(h('div', { class: 'sl-needle', style: 'left:' + pct(x) }));
    parts.push(h('span', { class: 'sl-lab' + (changed.speed ? ' sd-changed' : ''), dataset: { k: 'speed', anchor: anchor(x) }, style: 'left:' + pct(x) }, speedText(s.speedKbps)));
    return h('div', { class: 'sl-dial' }, parts);
  }

  /** After layout: drop the tick labels that touch the threshold label or the tick kept before them. */
  function fitLabels() {
    var dial = root.querySelector('.sl-dial');
    if (!dial) return;
    var box = dial.getBoundingClientRect();
    // a zone word that does not fit its zone is dropped (the verdict above says it anyway)
    var lines = [].slice.call(dial.querySelectorAll('.sl-needle, .sl-th')).map(function (e) { return e.getBoundingClientRect(); });
    dial.querySelectorAll('.sl-zone > span').forEach(function (e) {
      var r = e.getBoundingClientRect();
      var crossed = lines.some(function (l) { return l.right > r.left - 4 && l.left < r.right + 4; });
      if (crossed || e.parentNode.scrollWidth > e.parentNode.clientWidth + 1) e.remove();
    });
    // a centred speed or threshold label that would stick out of the dial starts (or ends) at its line instead
    dial.querySelectorAll('.sl-lab[data-k="th"], .sl-lab[data-k="speed"]').forEach(function (e) {
      var r = e.getBoundingClientRect();
      if (r.left < box.left) e.dataset.anchor = 'start';
      else if (r.right > box.right) e.dataset.anchor = 'end';
    });
    var keep = [].slice.call(dial.querySelectorAll('.sl-lab[data-k="th"], .sl-arrow')).map(function (e) { return e.getBoundingClientRect(); });
    var gap = 8;
    dial.querySelectorAll('.sl-lab[data-k="tick"]').forEach(function (e) {
      var r = e.getBoundingClientRect();
      var hit = r.left < box.left - 2 || r.right > box.right + 2 || keep.some(function (k) {
        return r.left < k.right + gap && k.left < r.right + gap && r.top < k.bottom && k.top < r.bottom;
      });
      if (hit) e.remove(); else keep.push(r);
    });
  }

  function verdict(s) {
    var key = !s.detection ? 'verdictOff' : s.slow ? 'verdictSlow' : s.equal ? 'verdictEqual' : 'verdictFast';
    return h('span', { class: 'sl-verdict', dataset: s.slow ? { slow: '' } : {} }, s.slow ? icon('snail') : h('span', { 'aria-hidden': 'true' }, '✓'), h('span', null, t(key)));
  }

  function scene(s, changed) {
    var pc = h('div', { class: 'sl-host' },
      data('PC07', 'sl-name'), h('span', { class: 'sl-role' }, t('pcRole')),
      h('span', { class: 'sl-pass', dataset: { pass: s.pass } }, h('b', null, t('passHead_' + s.pass)), t('passLine_' + s.pass)));
    var dc = h('div', { class: 'sl-host' }, data('DC01', 'sl-name'), h('span', { class: 'sl-role' }, t('dcRole')));
    var link = h('div', { class: 'sl-link' },
      h('div', { class: 'sl-lhead' }, h('b', null, t('dialHead')), h('span', { class: 'sl-nla' }, t('dialNla')), verdict(s)),
      dial(s, changed));
    return h('div', { class: 'sl-scene' }, pc, link, dc);
  }

  // ── the K4 table ──
  function res(r, lit) {
    var kids = [r === 'skipped' ? icon('snail') : null, t('res_' + r)];
    return h('span', { class: 'sl-res', dataset: Object.assign({ r: r }, lit ? { lit: '' } : {}) }, kids);
  }
  function table(s, flipped) {
    return Simdeck.ruleTable({
      title: t('tableTitle'),
      columns: [{ key: 'cse', label: t('colCse'), wrap: true }],
      actionLabel: t('colSet'),
      extra: [{ key: 'fast', label: t('colFast') }, { key: 'slow', label: t('colSlow') }],
      markLabel: t('markLabel'),
      rows: s.rows.map(function (r, i) {
        var c = L.cse(r.id);
        var mark = r.now === 'ran' ? 'win' : r.now === 'skipped' ? 'no' : 'skip';
        return {
          no: i + 1,
          cells: {
            cse: h('span', { class: 'sl-cse' }, h('span', null, t('cse_' + r.id)), c.pref ? h('span', { class: 'sl-pref' }, t('tagPref')) : null,
              flipped.indexOf(r.id) >= 0 ? h('span', { class: 'sd-rt-tag', dataset: { k: 'hl' } }, t('tagChanged')) : null),
            fast: res(r.fast, !s.slow),
            slow: res(r.slow, s.slow)
          },
          action: h('span', { class: 'sl-set', dataset: { s: r.setting } }, r.setting === 'always' ? icon('lock') : null, t('set_' + r.setting)),
          hit: null,
          mark: mark,
          note: r.now === 'skipped' ? [h('span', { class: 'sl-skipnote' }, icon('snail'), t('noteSkipped'))] : null
        };
      }),
      at: -1,
      words: { win: t('wordWin'), skip: t('wordSkip') },
      stickyMark: true
    });
  }

  // ── captions ──
  function list(ids) {
    // Croatian writes the names in a sentence with a small first letter (oporavak EFS-a); English keeps the capitals
    var names = ids.map(function (id) { var n = t('cse_' + id); return Simdeck.lang === 'hr' ? n.charAt(0).toLocaleLowerCase('hr') + n.slice(1) : n; });
    if (names.length < 2) return names.join('');
    return names.slice(0, -1).join(t('listComma')) + t('listAnd') + names[names.length - 1];
  }
  function caption(s, flipped) {
    var bg = s.pass === 'background';
    var vars = { speed: h('b', null, speedText(s.speedKbps)), th: thText(s.thresholdKbps) };
    var out = [];
    if (!s.detection) out.push(t.parts(bg ? 'capOffBg' : 'capOff', vars));
    else if (s.slow) {
      var skipped = s.rows.filter(function (r) { return r.now === 'skipped'; }).map(function (r) { return r.id; });
      out.push(t.parts('capSlow', Object.assign({ n: skipped.length, list: h('b', null, list(skipped)) }, vars)));
    } else if (s.equal) out.push(t.parts(bg ? 'capEqualBg' : 'capEqual', vars));
    else out.push(t.parts(bg ? 'capFastBg' : 'capFast', vars));
    if (bg) out.push(' ', t('capBg'));
    var allSkipped = s.rows.filter(function (r) { return r.now === 'skipped'; }).map(function (r) { return r.id; }).join();
    ['ran', 'skipped', 'notInPass'].forEach(function (k) {
      var ids = flipped.filter(function (id) { return s.rows.some(function (r) { return r.id === id && r.now === k; }); });
      // the slow-link sentence already names every skipped row: say it again only when just some of them flipped
      if (k === 'skipped' && s.slow && ids.join() === allSkipped) return;
      if (ids.length) out.push(' ', t('capNow_' + k, { list: list(ids) }));
    });
    return h('span', null, out);
  }

  // ── "changed": the state before the last param change ──
  var ready = false, prev = null, cur = null, curKey = null, prevParams = null, curParams = null;
  function keyOf(p) { return JSON.stringify([p.speed, p.thresholdKbps, p.allowScripts, p.pass]); }

  var root = h('div', { class: 'sl' });

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'speed', type: 'range', label: t('speed'), hint: t('speedHint'), min: 0, max: L.SPEEDS.length - 1, step: 1,
        format: function (v) { return speedText(L.SPEEDS[v]); } },
      { key: 'thresholdKbps', type: 'range', label: t('thresholdKbps'), min: 0, max: L.MAX_THRESHOLD, step: L.THRESHOLD_STEP,
        format: thText },
      { key: 'allowScripts', type: 'toggle', label: t('allowScripts') },
      { key: 'pass', type: 'choice', label: t('pass'), options: L.PASSES.map(function (x) { return [x, t('pass_' + x)]; }) }
    ],

    presets: L.presets.map(function (pr) {
      return { id: pr.id, label: t('preset_' + pr.id), hint: t('hint_' + pr.id), params: pr.params };
    }),

    legend: [
      { shape: 'sl-ran', label: t('legRan') },
      { shape: 'sl-skip', label: t('legSkipped') },
      { shape: 'sl-out', label: t('legOut') },
      { shape: 'sl-lock', label: t('legLock') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state, k = keyOf(c.params);
      if (!ready) { prev = null; cur = s; curKey = k; prevParams = null; curParams = Object.assign({}, c.params); }
      else if (k !== curKey) { prev = cur; cur = s; curKey = k; prevParams = curParams; curParams = Object.assign({}, c.params); }
      else cur = s;
      var flipped = L.flipped(prev, s);
      var changed = {
        speed: !!prevParams && prevParams.speed !== c.params.speed,
        th: !!prevParams && prevParams.thresholdKbps !== c.params.thresholdKbps
      };
      root.replaceChildren(scene(s, changed), table(s, flipped),
        h('p', { class: 'sl-tally' }, t('tally', { ran: s.count.ran, all: s.rows.length, skipped: s.count.skipped, out: s.count.notInPass })));
      if (root.parentNode !== c.stage) c.stage.replaceChildren(root);
      fitLabels();
    },

    caption: function (c) { return caption(c.state, L.flipped(prev, c.state)); }
  });
  ready = true;

  // the dial labels are laid out by measuring: lay them out again when the stage changes size
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(function () { if (window.simdeck) window.simdeck.set({}); }, 120);
  });

  // the legend's snail and padlock
  var sw = document.querySelector('.sd-swatch[data-shape="sl-skip"]');
  if (sw) sw.append(icon('snail'));
  sw = document.querySelector('.sd-swatch[data-shape="sl-lock"]');
  if (sw) sw.append(icon('lock'));
})();
</script>
</body>
</html>
