<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  /** Colour and pattern per client ID (the model's IDs are fixed, SPEC.md). */
  var LOOK = {
    '7f3a': [1, 'diag'], a2c4: [3, 'dots'], d91e: [2, 'vert'], '5b07': [4, 'horiz'],
    e3f8: [6, 'check'], '16bd': [7, 'cross'], '9c6b': [5, 'back']
  };

  function two(n) { return (n < 10 ? '0' : '') + n; }
  function hm(m) { return two(Math.floor(m / 60)) + ':' + two(m % 60); }
  function data(text) { return h('span', { class: 'ci-mono', translate: 'no' }, text); }
  function pcB(name) { return h('b', { translate: 'no' }, name); }
  function idChip(id) {
    if (!id) return h('span', { class: 'ci-id', dataset: { none: '' } }, h('i'), t('noId'));
    var look = LOOK[id] || [8, 'solid'];
    return h('span', { class: 'ci-id', dataset: { c: String(look[0]), p: look[1] }, translate: 'no' }, h('i', { 'aria-hidden': 'true' }), id + '…');
  }
  function kb(ok) {
    return h('span', { class: 'ci-kb', dataset: ok ? { ok: '' } : {} }, ok ? '✓' : '✕', ' ', t(ok ? 'kbOk' : 'kbMissing'));
  }
  /** Names in bold, joined "A, B and C". */
  function names(list) {
    var out = h('span');
    list.forEach(function (n, i) {
      if (i) out.append(i === list.length - 1 ? t('and') : ', ');
      out.append(pcB(n));
    });
    return out;
  }
  /** t.parts with *term* turned into <em lang="en">, and a node used twice cloned. */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }

  // ── stage ──
  function renderImage(s) {
    return h('div', { class: 'ci-card ci-image' },
      h('b', null, t('image')), s.image.generalised ? idChip(null) : idChip(s.image.id),
      h('div', { class: 'ci-line ci-sub' }, t('imageFrom'), ' · ', t(s.image.generalised ? 'imageGen' : 'imageKeeps')));
  }
  function renderPc(c, m, i) {
    var s = c.state, ev = s.ev;
    var mine = ev && ev.who === i && !ev.rejected && (ev.kind === 'report' || ev.kind === 'reset');
    var changed = mine || (ev && ev.kind === 'deploy');
    if (!s.deployed) {
      return h('div', { class: 'ci-card ci-pc', dataset: { m: String(i), off: '' } },
        pcB(m.name), h('span', null, t('notDeployed')));
    }
    var row = s.console[m.clientId];
    var shown = m.lastReport !== null && row && row.name !== m.name ? row.name : null;
    return h('div', { class: 'ci-card ci-pc' + (changed ? ' sd-changed' : '') + (changed && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { m: String(i) } },
      h('b', { class: 'ci-mono', translate: 'no' }, m.name), h('span', { class: 'ci-sub ci-mono', translate: 'no' }, m.ip), idChip(m.clientId),
      h('div', { class: 'ci-line' }, kb(m.patched),
        h('span', null, m.lastReport === null ? t('notReported') : t.parts('reportedAt', { t: data(hm(m.lastReport)) })),
        shown ? h('span', { class: 'ci-hidden' }, t.parts('hiddenBy', { pc: pcB(shown) })) : null));
  }
  function renderConsole(c) {
    var s = c.state, ev = s.ev;
    var rows = L.rowsOf(s);
    var body = rows.map(function (r) {
      var now = ev && ev.kind === 'report' && ev.id === r.id;
      var was = now && !ev.created && ev.before.name !== r.name ? ev.before.name : null;
      return h('tr', { class: now ? 'sd-changed' : '', dataset: { row: r.id } },
        h('td', null, idChip(r.id)),
        h('td', { class: 'ci-was' }, was ? h('s', { translate: 'no' }, was) : null, was ? ' → ' : null, pcB(r.name)),
        h('td', null, data(r.ip)),
        h('td', null, data(hm(r.lastReport))),
        h('td', null, h('span', { class: 'ci-kb', dataset: r.status === 'installed' ? { ok: '' } : {} },
          r.status === 'installed' ? '✓ ' : '✕ ', t(r.status === 'installed' ? 'stInstalled' : 'stNeeded'))));
    });
    var table = rows.length
      ? h('table', { class: 'ci-table' },
        h('thead', null, h('tr', null, ['colId', 'colName', 'colIp', 'colLast', 'colKb'].map(function (k) { return h('th', null, t(k)); }))),
        h('tbody', null, body))
      : h('p', { class: 'ci-empty' }, t('empty'));
    var sum = L.summaryOf(s);
    // the console says nothing is needed while a clone that has reported lacks KB-C (the same test as the caption's)
    var lie = sum.rows > 0 && sum.needed === 0 && s.machines.some(function (m) { return m.lastReport !== null && !m.patched; });
    var dl = h('dl', { class: 'ci-sum' },
      h('dt', null, t('sumConsole')), h('dd', null, h('span', null, t.n('sumRows', sum.rows)), h('span', null, t('sumInstalled', { n: sum.installed })),
        h('span', null, t('sumNeeded', { n: sum.needed })), lie ? h('span', { class: 'ci-lie' }, '⚠ ', t('falseGreen')) : null),
      h('dt', null, t('sumTruth')), h('dd', null, h('span', null, t.n('sumMachines', sum.machines)), h('span', null, t('sumMissing', { n: sum.missing }))));
    return h('div', { class: 'ci-console' }, h('h2', { class: 'ci-h' }, t('console')), table, dl);
  }

  /** Arrows from each clone that has reported with its current ID to that ID's row. */
  function drawArrows(c, root) {
    var s = c.state, ev = s.ev;
    var svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('class', 'ci-arrows');
    svg.setAttribute('aria-hidden', 'true');
    root.append(svg);
    if (getComputedStyle(svg).display === 'none') return;
    var box = root.getBoundingClientRect();
    var later = [];
    s.machines.forEach(function (m, i) {
      if (m.reportedId === null || m.reportedId !== m.clientId) return;
      var card = root.querySelector('[data-m="' + i + '"]');
      var row = root.querySelector('tr[data-row="' + m.clientId + '"]');
      if (!card || !row) return;
      var a = card.getBoundingClientRect(), b = row.getBoundingClientRect();
      var x1 = a.right - box.left + 4, y1 = a.top + a.height / 2 - box.top;
      var x2 = b.left - box.left - 6, y2 = b.top + b.height / 2 - box.top;
      var now = ev && ev.kind === 'report' && ev.who === i;
      var dx = (x2 - x1) / 2;
      var d = 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + (x2 - 14) + ',' + y2;
      var g = document.createElementNS(SVG, 'g');
      function add(tag, attrs) {
        var el = document.createElementNS(SVG, tag);
        Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
        g.append(el);
      }
      if (now) add('path', { d: d, class: 'ci-now-halo' });
      add('path', { d: d, class: now ? 'ci-now' : 'ci-old' });
      add('path', { d: 'M' + (x2 - 16) + ',' + (y2 - 9) + ' L' + x2 + ',' + y2 + ' L' + (x2 - 16) + ',' + (y2 + 9) + ' Z', class: now ? 'ci-head' : 'ci-head-old' });
      if (now) later.push(g); else svg.append(g);
    });
    later.forEach(function (g) { svg.append(g); });   // the current arrow on top
  }

  var last = null;
  function render(c) {
    last = c;
    var s = c.state;
    var left = h('div', { class: 'ci-left' }, renderImage(s), h('h2', { class: 'ci-h' }, t('clients')),
      s.machines.map(function (m, i) { return renderPc(c, m, i); }));
    var root = h('div', { class: 'ci' },
      h('div', { class: 'ci-clock' }, h('span', null, t('monday')), h('b', { translate: 'no' }, hm(s.t))),
      left, h('div', { class: 'ci-right' }, renderConsole(c)));

  window.addEventListener('resize', function () {
    if (pending) cancelAnimationFrame(pending);

  });

  // ── caption ──
  function sharing(s, id, except) {
    return s.machines.filter(function (m, i) { return m.clientId === id && i !== except; }).map(function (m) { return m.name; });
  }
  function caption(c) {
    var s = c.state, ev = s.ev;
    if (c.first || !ev) {
      if (s.image.generalised) return rich('capStartGen', { id: idChip(s.image.id) });
      return rich('capStart', { id: idChip(s.image.id) });
    }
    var when = data(hm(ev.t));
    if (ev.kind === 'deploy') {
      var n = t.n('capDeployN', s.machines.length);
      if (s.image.generalised) {
        return rich('capDeployGen', { t: when, n: n, ids: h('span', null, ev.ids.map(function (id, i) { return [i ? ' ' : '', idChip(id)]; })) });
      }
      return rich('capDeploy', { t: when, n: n, id: idChip(ev.ids[0]) });
    }
    if (ev.kind === 'reset') {
      var who = s.machines[ev.who].name;
      if (ev.rejected) return rich('capResetRejected', { t: when, pc: pcB(who) });
      var mine = s.machines[ev.who];
      if (s.console[ev.oldId] && mine.lastReport !== null) {
        return rich('capReset', { t: when, pc: pcB(who), id: idChip(ev.id), old: idChip(ev.oldId) });
      }
      return rich('capResetEarly', { t: when, pc: pcB(mine.name), id: idChip(ev.id) });
    }
    // a report
    var m = s.machines[ev.who], row = s.console[ev.id];
    var out;
    if (ev.created && ev.id === L.RESET_ID) {
      out = rich('capAfterReset', { pc: pcB(m.name), t: when, id: idChip(ev.id) });
      var resetEv = s.log.filter(function (e) { return e.kind === 'reset' && !e.rejected; })[0];
      var old = resetEv && resetEv.oldId;
      var still = old ? sharing(s, old, ev.who) : [];
      if (old && still.length) out = out.concat(' ', rich(still.length > 1 ? 'capStillShare' : 'capStillHas', { pcs: names(still), old: idChip(old) }));
      else if (old && s.console[old] && s.console[old].name === m.name) out = out.concat(' ', rich('capStale', { old: idChip(old), pc: pcB(m.name) }));
    } else if (ev.created) {
      out = rich('capNew', { pc: pcB(m.name), t: when, id: idChip(ev.id) });
    } else {
      var prevPc = s.machines.filter(function (x) { return x.name === ev.before.name; })[0];
      out = prevPc && prevPc.clientId !== ev.id   // the row's last name belongs to a machine whose ID has been reset since
        ? rich('capOverwriteOld', { pc: pcB(m.name), t: when, id: idChip(ev.id), prev: pcB(ev.before.name) })
        : rich('capOverwrite', { pc: pcB(m.name), t: when, prev: pcB(ev.before.name) });
      if (ev.before.status !== row.status) {
        var mark = function (st) { return h('b', null, st === 'installed' ? '✓' : '✕'); };
        out = out.concat(' ', rich('capFlip', { a: mark(ev.before.status), b: mark(row.status) }));
      }
    }
    if (!ev.created || ev.id === L.RESET_ID) {
      // who shares this row and is now hidden behind the reporter
      // clones with this ID that have reported: the row no longer shows them
      var hidden = s.machines.filter(function (x, i) { return i !== ev.who && x.clientId === ev.id && x.lastReport !== null; });
      var missingHidden = hidden.filter(function (x) { return !x.patched; });
      hidden = hidden.map(function (x) { return x.name; });
      var sum = L.summaryOf(s);
      if (row.status === 'installed' && missingHidden.length && sum.needed === 0) {
        out = out.concat(' ', rich('capFalseGreen', { pc: pcB(m.name), miss: names(missingHidden.map(function (x) { return x.name; })) }));
      } else if (hidden.length && !ev.created) {
        out = out.concat(' ', rich(hidden.length > 1 ? 'capHidesN' : 'capHides1', { pcs: names(hidden) }));
      }
    }
    if (ev.created && s.image.generalised && !s.machines.some(function (x) { return x.nextReport !== null; }) && L.rowsOf(s).length === s.machines.length) {
      out = out.concat(' ', t('capAllRows'));
    }
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'clones', type: 'range', label: t('clones'), min: 2, max: 5, step: 1 },
      { key: 'generalised', type: 'toggle', label: t('generalised') },
      { key: 'pc02Missing', type: 'toggle', label: t('pc02Missing') },
      // resetAt (in the model's defaults, no control of its own): the step after which the admin resets PC-02's ID
      { type: 'button', label: t('reset'), hint: t('resetHint'), key: 'i', run: function (sim) { sim.set({ resetAt: sim.n }); } }
    ],

    presets: [
      { id: 'one-row', label: t('presetOneRow'), hint: t('presetOneRowHint'), params: { pc02Missing: false } },
      { id: 'false-green', label: t('presetFalseGreen'), hint: t('presetFalseGreenHint'), params: {} },
      { id: 'reset-one', label: t('presetResetOne'), hint: t('presetResetOneHint'), params: { resetAt: 4 } },
      { id: 'generalised-image', label: t('presetGeneralised'), hint: t('presetGeneralisedHint'), params: { generalised: true } }
    ],

    legend: [
      { shape: 'ci-id', label: t('legendId') },
      { shape: 'line', label: t('legendArrow') },
      { shape: 'dash', label: t('legendOld') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
