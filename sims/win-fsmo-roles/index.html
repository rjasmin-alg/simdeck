<style>
/* Page CSS: every selector starts with [data-sim="win-fsmo-roles"]; colours only from kit tokens.

/* legend swatches the kit lacks */

     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var HOST = { DC01: 'qm-dc01', DC02: 'qm-dc02', DC03: 'brk-dc03' };
  /** Role badge: string key, letter, series colour, shape (SPEC.md "Scene"). */
  var ROLE = {
    schema: { k: 'rSchema', l: 'S', c: 1, shape: 'circle' },
    naming: { k: 'rNaming', l: 'N', c: 2, shape: 'square' },
    rid: { k: 'rRid', l: 'R', c: 3, shape: 'diamond' },
    pdc: { k: 'rPdc', l: 'P', c: 4, shape: 'hex' },
    infra: { k: 'rInfra', l: 'I', c: 5, shape: 'tri' }
  };
  var OP_KEY = { logon: 'opLogon', create: 'opCreate', password: 'opPassword', time: 'opTime', schema: 'opSchema', domain: 'opDomain', xref: 'opXref' };
  var ST_KEY = { ok: 'stOk', degraded: 'stDegraded', fail: 'stFail' };
  var WHY_KEY = { off: 'whyOff', cut: 'whyCut', waiting: 'whyWaiting' };

  /** Data (host names, RIDs, letters) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { class: 'fs-d', translate: 'no' }, String(text)); }
  function host(id) { return data(HOST[id]); }
  function num(n) { return data(String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '.' : ',')); }
  function why(w) { return t(WHY_KEY[w] || 'whyOff'); }
  function roleName(r) { return t(ROLE[r].k); }
  /** Parts of a string with *English term* turned into <em lang="en">; nodes are cloned so vars can be reused. */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p.cloneNode(true)); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function join(list) {
    var out = [];
    list.forEach(function (x) { if (!x || !x.length) return; if (out.length) out.push(' '); out = out.concat(x); });
    return out;
  }
  function changed(c, get) {
    if (!c.prev || c.n === 0) return false;
    return JSON.stringify(get(c.state)) !== JSON.stringify(get(c.prev));
  }

  function badge(role, opts) {
    opts = opts || {};
    var R = ROLE[role];
    return h('span', { class: 'fs-badge' + (opts.small ? ' fs-sm' : ''), dataset: { shape: R.shape, c: String(R.c), hollow: opts.hollow ? 'true' : 'false' },
      role: 'img', 'aria-label': roleName(role) }, h('b', { translate: 'no' }, R.l));
  }

  // ── DC cards ──

  function dcCard(c, id) {
    var s = c.state, dc = s.dcs[id];
    var roles = L.rolesOf(s, id);
    var prevRoles = c.prev ? L.rolesOf(c.prev, id) : roles;
    var two = L.conflicts(s).map(function (x) { return x.role; });
    var acts = dc.on && dc.synced;
    var head = h('div', { class: 'fs-head' },
      h('span', { class: 'fs-name' + (changed(c, function (x) { return x.desk === id; }) ? ' fs-ch' : '') }, host(id)),
      h('span', { class: 'fs-tag' + (changed(c, function (x) { return x.dcs[id].on; }) ? ' fs-ch' : ''), dataset: { k: dc.on ? 'on' : 'off' } }, '⏻ ', t(dc.on ? 'on' : 'off')),
      h('span', { class: 'fs-tag' + (changed(c, function (x) { return x.cut === id; }) ? ' fs-ch' : ''), dataset: { k: s.cut === id ? 'cut' : 'net' } },
        t('net'), ': ', t(s.cut === id ? 'cutOff' : 'connected')));
    var tags = [];
    if (dc.restored) tags.push(h('span', { class: 'fs-tag' }, t('restored')));
    if (dc.on && !dc.synced) tags.push(h('span', { class: 'fs-tag', dataset: { k: 'wait' } }, t('waiting')));
    var slots = roles.map(function (r) {
      var seized = s.seized[r] && s.seized[r] !== id;
      var isNew = c.n > 0 && prevRoles.indexOf(r) < 0;
      return h('span', { class: 'fs-slot' + (isNew ? ' fs-ch' : '') },
        seized ? h('span', { class: 'fs-clamp', 'aria-hidden': 'true' }) : null,
        badge(r, { hollow: !acts }),
        two.indexOf(r) >= 0 ? h('span', { class: 'fs-two' }, t('two')) : null,
        seized ? h('span', { class: 'fs-scope' }, t.parts('seizedFrom', { dc: host(s.seized[r]) })) : null);
    });
    var p = dc.ridPool;
    var poolCh = changed(c, function (x) { return x.dcs[id].ridPool; });
    var pool = h('div', { class: 'fs-pool' },
      h('span', { class: 'fs-lab' }, t('pool')),
      h('div', { class: 'fs-gauge', dataset: { low: p.left <= L.THRESHOLD && !p.next ? 'true' : 'false' }, role: 'img', 'aria-label': t('poolLeft', { n: p.left }) },
        h('span', { style: { width: (p.left / L.POOL * 100) + '%' } })),
      h('span'),
      h('span', { class: 'fs-poolnum' + (poolCh ? ' fs-ch' : '') },
        h('span', null, t.parts('poolLeft', { n: data(p.left) })), data(p.from + '–' + p.to),
        p.next ? h('span', null, t('next'), ' ', data(p.next.from + '–' + p.next.to)) : h('span', { class: 'fs-none' }, t('noNext'))));
    return h('div', { class: 'fs-dc', dataset: { on: String(dc.on), desk: String(s.desk === id) } },
      head,
      h('div', { class: 'fs-roles' }, slots.length ? slots : h('span', { class: 'fs-none' }, t('noRoles'))),
      tags.length ? h('div', { class: 'fs-tags' }, tags) : null,
      pool);
  }

  // ── warnings ──

  function warnings(c) {
    var s = c.state, out = [];
    L.conflicts(s).forEach(function (x) {
      out.push(t.parts(x.conflict ? 'wTwo' : 'wTwoMinor', { role: roleName(x.role), a: host(x.dcs[0]), b: host(x.dcs[1]) }));
      if (x.role === 'rid') out.push(t.parts('wGap', { a: host(x.dcs[0]), x: num(s.dcs[x.dcs[0]].copy.avail), b: host(x.dcs[1]), y: num(s.dcs[x.dcs[1]].copy.avail) }));
    });
    L.duplicatePools(s).forEach(function (pr) {
      out.push(t.parts('wDup', { a: host(s.pools[pr[0]].dc), b: host(s.pools[pr[1]].dc) }));
    });
    return out.map(function (x) { return h('p', { class: 'fs-warn' }, x); });
  }

  // ── the operations panel ──

  function detail(r) {
    if (r.why === 'atOff') return t.parts('dAtOff', { dc: host(r.at) });
    switch (r.op) {
      case 'logon': return [t('dAnyDc')];
      case 'create':
        var out = t.parts('dCreated', { c: data(r.created), n: data(r.n) });
        if (r.request === 'failed') out = out.concat(' · ', t('dNoPool'));
        return out;
      case 'password': return r.status === 'ok' ? t.parts('dPdcOk', { dc: host(r.holder) }) : [t('dNoPdc')];
      case 'time': return [t(r.why === 'external' ? 'dExternal' : r.why === 'ownClock' ? 'dOwnClock' : 'dDrift')];
      case 'xref': return [t('dOneDomain')];
      default: return r.status === 'ok' ? t.parts('dHolder', { dc: host(r.holder) }) : t.parts('dGone', { dc: host(r.holder), why: why(r.holderWhy) });
    }
  }

  function opsPanel(c) {
    var s = c.state, rows = L.panel(s, c.params);
    var prevRows = c.prev && c.n > 0 ? L.panel(c.prev, c.params) : rows;
    var e = s.last, ranOp = e && e.kind === 'op' ? e.op : null;
    var body = rows.map(function (r, i) {
      var ran = r.op === ranOp;
      var shown = ran ? e : r;    // the row the step ran shows its result; the others their live evaluation
      var stCh = ran || prevRows[i].status !== r.status;
      return h('tr', { dataset: { ran: String(ran) } },
        h('td', null, h('span', { class: 'fs-res' + (stCh ? ' fs-ch' : '') }, h('span', { class: 'fs-st', dataset: { k: shown.status }, 'aria-hidden': 'true' }), t(ST_KEY[shown.status]))),
        h('td', null, t(OP_KEY[r.op]), ran ? [' ', h('span', { class: 'fs-ran' }, t('ran'))] : null),
        h('td', null, r.role ? h('span', { class: 'fs-needs' }, badge(r.role, { small: true }), roleName(r.role),
          h('span', { class: 'fs-scope' }, '· ', t(L.FOREST_WIDE[r.role] ? 'scForest' : 'scDomain'))) : h('span', { class: 'fs-none' }, t('noRole'))),
        h('td', { class: 'fs-detail' }, detail(shown)));
    });
    return h('div', { class: 'fs-ops' },
      h('h2', null, t.parts('opsTitle', { dc: host(s.desk) })),
      h('table', { class: 'fs-tab' },
        h('thead', null, h('tr', null, h('th', null, t('thResult')), h('th', null, t('thOp')), h('th', null, t('thNeeds')), h('th'))),
        h('tbody', null, body)));
  }

  // ── captions ──

  function roleList(list) {
    var out = [];
    list.forEach(function (r, i) { if (i) out.push(', '); out.push(roleName(r)); });
    return h('span', null, out);
  }

  function capStart(c) {
    var s = c.state;
    var out = [rich('capStart')];
    var others = L.DCS.filter(function (d) { return d !== 'DC01' && L.rolesOf(s, d).length; });
    if (others.length) {
      var list = [];
      L.DCS.forEach(function (d) {
        var rs = L.rolesOf(s, d);
        if (!rs.length) return;
        if (list.length) list.push('; ');
        list.push(host(d), ': ', roleList(rs));
      });
      out.push(t.parts('capStartPlace', { list: h('span', null, list) }));
    }
    return join(out);
  }

  function capOp(c) {
    var s = c.state, e = s.last;
    var v = { at: host(e.at), holder: e.holder ? host(e.holder) : '', why: why(e.holderWhy) };
    if (e.why === 'atOff') return rich('capAtOff', v);
    switch (e.op) {
      case 'logon': return rich('capLogon', v);
      case 'password': return rich(e.status === 'ok' ? 'capPwOk' : 'capPwNo', v);
      case 'time': return rich(e.why === 'external' ? 'capTimeOk' : e.why === 'ownClock' ? 'capTimeOwn' : 'capTimeDrift', v);
      case 'schema': return rich(e.status === 'ok' ? 'capSchemaOk' : 'capSchemaNo', v);
      case 'domain': return rich(e.status === 'ok' ? 'capDomainOk' : 'capDomainNo', v);
      case 'xref': return rich('capXref', Object.assign(v, { state: s.dcs[e.holder].on ? t('on') : t('off') }));
    }
    // create
    var left = s.dcs[e.at].ridPool.left;
    var cv = Object.assign({}, v, { c: e.created, f: e.failed, left: left });
    if (e.failed) {
      var before = c.prev.dcs[e.at].ridPool;
      return join([rich('capCreateLeft', Object.assign({}, cv, { left: data(before.left + (before.next ? L.POOL : 0)), c: data(e.created), f: data(e.failed) })),
        e.request === 'failed' ? rich('capCreateLeftWhy', v) : null]);
    }
    if (e.request === 'failed') return join([t.parts('capCreateFailed', { c: e.created, at: host(e.at) }), rich('capCreateFailedWhy', Object.assign({}, v, { left: data(left) }))]);
    if (e.request === 'granted') return join([t.parts('capCreateGrant', { c: e.created, at: host(e.at) }),
      rich('capCreateGrantWhy', { by: host(e.granted.by), from: data(e.granted.from), to: data(e.granted.to) })]);
    return t.parts('capCreatePool', { c: e.created, at: host(e.at), left: left });
  }

  function caption(c) {
    var s = c.state, e = s.last;
    if (!e) return capStart(c);
    if (e.kind === 'op') return capOp(c);
    if (e.kind === 'off') {
      if (e.roles.length === L.ROLES.length) return rich('capOffAll');
      if (e.roles.length) return rich('capOffSome', { dc: host(e.dc), roles: roleList(e.roles) });
      return rich('capOffNone', { dc: host(e.dc) });
    }
    if (e.kind === 'cut') return rich('capCut', { dc: host(e.dc) });
    if (e.kind === 'on') {
      var dc = s.dcs[e.dc];
      if (!dc.synced) return rich('capOnWait', { dc: host(e.dc) });
      if (L.conflicts(s).length) {
        var partner = L.islands(s).filter(function (g) { return g.indexOf(e.dc) >= 0; })[0].filter(function (d) { return d !== e.dc; })[0];
        return rich('capOnTwo', { dc: host(e.dc), partner: host(partner) });
      }
      return rich('capOnOk', { dc: host(e.dc) });
    }
    if (e.kind === 'join') {
      var out = [rich('capJoin', { v2: data(s.dcs.DC01.copy.ver.rid), v1: data(c.prev.dcs.DC01.copy.ver.rid) })];
      var two = L.conflicts(c.prev).filter(function (x) { return x.role === 'rid'; })[0];
      if (two) out.push(rich('capJoinPools', { gap: num(Math.abs(c.prev.dcs[two.dcs[0]].copy.avail - c.prev.dcs[two.dcs[1]].copy.avail)) }));
      return join(out);
    }
    // transfer or seize
    var rv = { role: roleName(e.role), to: host(e.to), from: host(e.from) };
    if (e.refused) return rich('capTransferNo', Object.assign(rv, { why: why(e.refused) }));
    if (e.kind === 'transfer') return join([rich('capTransfer', rv), e.role === 'pdc' ? rich('capTransferPdc') : null]);
    if (e.asTransfer) return join([rich('capSeize', rv), rich('capSeizeAs', rv)]);
    var parts = [rich('capSeize', rv)];
    if (e.role === 'rid') parts.push(rich('capSeizeRid', Object.assign({ a: num(e.availFrom), b: num(e.availTo) }, rv)));
    var unaware = L.DCS.filter(function (d) { return d !== e.to && s.dcs[d].on && s.dcs[d].copy.owner[e.role] === e.from; });
    if (unaware.length) parts.push(rich('capSeizeCut', Object.assign({ other: host(unaware[0]) }, rv)));
    return join(parts);
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scenario', type: 'select', label: t('hidden'), options: L.SCENARIOS.map(function (x) { return [x, x]; }), visible: function () { return false; } },
      { key: 'ridLeft', type: 'range', label: t('pRidLeft'), min: 0, max: 500, step: 10 },
      { key: 'usersToCreate', type: 'range', label: t('pUsers'), min: 0, max: 600, step: 10 }
    ],

    presets: [
      { id: 'quillmoor', label: t('prQuillmoor'), params: { scenario: 'quillmoor', ridLeft: 250, usersToCreate: 300 } },
      { id: 'rid-only', label: t('prRidOnly'), params: { scenario: 'rid-only', ridLeft: 250, usersToCreate: 150 } },
      { id: 'transfer', label: t('prTransfer'), params: { scenario: 'transfer', ridLeft: 250, usersToCreate: 300 } },
      { id: 'seize-and-return', label: t('prSeize'), params: { scenario: 'seize-and-return', ridLeft: 250, usersToCreate: 300 } },
      { id: 'infra-single-domain', label: t('prInfra'), params: { scenario: 'infra-single-domain', ridLeft: 250, usersToCreate: 300 } }
    ],

    legend: [
      { shape: 'fs-hollow', label: t('lgHollow') },
      { shape: 'fs-clamp', label: t('lgClamp') },
      { shape: 'fs-ok', label: t('lgOk') },
      { shape: 'fs-deg', label: t('lgDeg') },
      { shape: 'fs-fail', label: t('lgFail') },
      { shape: 'fs-off', label: t('lgOff') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'fs' },
        h('div', { class: 'fs-dcs' }, L.DCS.map(function (id) { return dcCard(c, id); })),
        h('div', { class: 'fs-warns', 'aria-live': 'off' }, warnings(c)),
        opsPanel(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
