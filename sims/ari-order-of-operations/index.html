<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var notice = null; // a refused bracket choice: { text, why }, shown until the next change

  var PRESET_KEY = { brackets: 'pBrackets', 'no-brackets': 'pNoBrackets', 'times-first': 'pTimesFirst', 'same-rank': 'pSameRank',
    'two-brackets': 'pTwoBrackets', everything: 'pEverything' };
  var SVGNS = 'http://www.w3.org/2000/svg';
  var W = { num: 5, op: 2.6, br: 1.3 }; // column widths of the tree, in units

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  /** A number as the page writes it: from 10 000 on in groups of three (hr: a narrow space, en: a comma). */
  function fmt(v) {
    var s = String(v);
    if (v < 10000) return s;
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'en' ? ',' : ' ');
  }
  function num(text) { return h('span', { class: 'oo-num', translate: 'no' }, String(text)); }
  /** Written tokens to text: "543 − (423 + 28)". */
  function lineText(tokens) {
    return tokens.map(function (tk, i) {
      if (tk.t === 'op') return ' ' + L.SIGN[tk.op] + ' ';
      return tk.t === 'num' ? fmt(tk.v) : tk.t;
    }).join('');
  }
  function opText(a, op, b) { return fmt(a) + ' ' + L.SIGN[op] + ' ' + fmt(b); }
  function errText(e) {
    var key = { empty: 'errEmpty', char: 'errChar', long: 'errLong', number: e.at ? 'errNumber' : 'errNumberEnd', sign: 'errSign',
      open: 'errOpen', close: 'errClose', lone: 'errLone', single: 'errSingle', many: 'errMany', negative: 'errNegative',
      notWhole: 'errNotWhole', zero: 'errZero', big: 'errBig' }[e.error];
    return t(key, { at: e.at, ch: e.ch || '', a: e.a != null ? fmt(e.a) : '', b: e.b != null ? fmt(e.b) : '',
      op: e.op ? L.SIGN[e.op] : '', max: fmt(L.MAX_VALUE), n: L.MAX_NUMBERS, d: L.MAX_DIGITS });
  }

  // ── the plan of the current expression, and the tree's geometry ──
  function geometry(plan) {
    var tree = plan.tree, nodes = tree.nodes;
    var xs = [], u = 0;
    tree.tokens.forEach(function (tk) {
      var w = tk.t === 'num' ? W.num : tk.t === 'op' ? W.op : W.br;
      xs.push(u + w / 2);
      u += w;
    });
    var height = {};
    (function rec(id) {
      var n = nodes[id];
      if (n.kind === 'num') { height[id] = 0; return 0; }
      height[id] = 1 + Math.max(rec(n.a), rec(n.b));
      return height[id];
    })(tree.root);
    var parent = {};
    nodes.forEach(function (n) { if (n.kind === 'op') { parent[n.a] = n.id; parent[n.b] = n.id; } });
    return { U: u, R: height[tree.root] + 1, xs: xs, height: height, parent: parent };
  }

  // ── the written form ──
  function written(plan, s) {
    var nodes = plan.tree.nodes, parts = [];
    var total = plan.order.length;
    for (var j = 0; j <= s.k; j++) {
      var last = j === s.k;
      var toks = L.writtenAt(plan, j);
      var cur = last && s.phase === 'pick' ? nodes[s.cur] : null;
      var kids = [], run = null;
      toks.forEach(function (tk) {
        var cls = null;
        if (cur && (tk.node === cur.id || tk.node === cur.a || tk.node === cur.b)) cls = tk.t === '(' || tk.t === ')' ? 'oo-w-goes' : 'oo-w-cur';
        if (last && s.phase === 'do' && tk.t === 'num' && tk.node === s.cur) cls = j === total ? 'oo-w-result sd-changed' : 'oo-w-new sd-changed';
        var text = tk.t === 'op' ? ' ' + L.SIGN[tk.op] + ' ' : tk.t === 'num' ? fmt(tk.v) : tk.t;
        // a, its sign and b of the picked operation: one highlighted run
        if (cls === 'oo-w-cur') {
          if (!run) { run = h('span', { class: cls }); kids.push(run); }
          run.append(text);
          return;
        }
        run = null;
        kids.push(cls ? h('span', { class: cls }, text) : text);
      });
      if (j > 0) parts.push(h('span', { class: 'oo-eq' }, '='));
      parts.push(h('span', { class: 'oo-part', dataset: last ? {} : { old: '' } }, kids));
    }
    return h('div', { class: 'oo-written', translate: 'no', role: 'img',
      'aria-label': t('writtenLabel') + ': ' + parts.map(function (x) { return x.textContent; }).join(' ') }, parts);
  }

  // ── the bracket choices ──
  function chips(p, c) {
    var opts = L.bracketOptions(p.expr);
    // brackets typed or preset beyond one pair (two pairs, nested): the current expression leads the choices
    if (opts.length && !opts.some(function (o) { return o.text === p.expr; })) opts.unshift({ text: p.expr, ok: true, i: -2, same: false });
    var many = L.analyse(p.expr).tree.numbers > L.MAX_BRACKET_NUMBERS;
    if (opts.length < 2 && !many) return h('div', { class: 'oo-chips', hidden: true });
    var kids = [h('span', { class: 'oo-head' }, t('chipsTitle'))];
    if (many) kids.push(h('span', { class: 'oo-small' }, t('chipsMany', { n: L.MAX_BRACKET_NUMBERS })));
    opts.forEach(function (o) {
      var pressed = o.text === p.expr;
      var why = o.ok ? null : errText(o);
      var b = h('button', { type: 'button', class: 'oo-chip', translate: 'no', 'aria-pressed': String(pressed),
        'aria-disabled': why ? 'true' : 'false', title: why ? o.text + ': ' + why : (o.same && o.i >= 0 ? t('chipSame') : ''),
        onclick: function () { pickBrackets(o, why); } }, lineText(L.parse(o.text).tokens));
      kids.push(b);
    });
    if (notice && notice.expr === p.expr) kids.push(h('div', { class: 'oo-notice', role: 'status' }, notice.text + ': ' + notice.why));
    return h('div', { class: 'oo-chips', role: 'group', 'aria-label': t('chipsTitle') }, kids);
  }
  function pickBrackets(o, why) {
    if (why) { notice = { expr: sim.params.expr, text: lineText(L.parse(o.text).tokens), why: why }; sim.render(); return; }
    notice = null;
    if (o.text === sim.params.expr) return;
    var atEnd = sim.n > 0 && sim.n === sim.steps;
    sim.set({ expr: o.text });
    if (atEnd) sim.last(); else sim.first();
  }

  // ── the tree ──
  function treeBox(plan, s, c) {
    var g = geometry(plan), tree = plan.tree, nodes = tree.nodes;
    var done = plan.order.slice(0, s.k).map(function (o) { return o.id; });
    var isDone = function (id) { return done.indexOf(id) >= 0; };
    var cur = s.cur != null ? nodes[s.cur] : null;
    var pick = s.phase === 'pick' ? cur : null;
    var used = function (id) { return g.parent[id] != null && isDone(g.parent[id]); };
    var pos = function (id) {
      var n = nodes[id];
      return { x: g.xs[n.tok], y: g.height[id] + 0.5 };
    };
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'oo-edges');
    svg.setAttribute('viewBox', '0 0 ' + g.U + ' ' + g.R);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    var labels = [];
    nodes.forEach(function (n) {
      if (n.kind !== 'op') return;
      var from = pos(n.id);
      [n.a, n.b].forEach(function (ch) {
        var to = pos(ch);
        var ln = document.createElementNS(SVGNS, 'line');
        ln.setAttribute('x1', from.x); ln.setAttribute('y1', from.y);
        ln.setAttribute('x2', to.x); ln.setAttribute('y2', to.y);
        ln.setAttribute('data-k', pick && pick.id === n.id ? 'cur' : isDone(n.id) ? 'used' : 'wait');
        svg.append(ln);
      });
    });
    var place = function (x, y) { return { left: (x / g.U * 100) + '%', top: (y / g.R * 100) + '%' }; };
    // the top row: the expression as written
    tree.tokens.forEach(function (tk, i) {
      var at = place(g.xs[i], 0.5);
      if (tk.t === 'num') {
        var cls = 'oo-n' + (used(tk.node) ? ' oo-used' : '') + (pick && (pick.a === tk.node || pick.b === tk.node) ? ' oo-operand' : '');
        labels.push(h('span', { class: cls, dataset: { k: 'num' }, style: at, translate: 'no' }, fmt(tk.v)));
      } else if (tk.t === 'op') {
        labels.push(h('span', { class: 'oo-n' + (pick && pick.id === tk.node ? ' oo-on' : ''), dataset: { k: 'sign' }, style: at,
          translate: 'no', 'aria-hidden': 'true' }, L.SIGN[tk.op]));
      } else {
        var gone = isDone(tk.node), on = pick && pick.id === tk.node;
        labels.push(h('span', { class: 'oo-n' + (gone ? ' oo-gone' : '') + (on ? ' oo-on' : ''), dataset: { k: 'br' }, style: at,
          translate: 'no', 'aria-hidden': 'true' }, tk.t));
      }
    });
    // the operations, each under its sign
    nodes.forEach(function (n) {
      if (n.kind !== 'op') return;
      var p0 = pos(n.id), at = place(p0.x, p0.y);
      var d = isDone(n.id);
      var cls = 'oo-n' + (n.id === tree.root ? ' oo-root' : '') + (used(n.id) ? ' oo-used' : '') +
        (pick && (pick.a === n.id || pick.b === n.id) ? ' oo-operand' : '') + (pick && pick.id === n.id ? ' oo-pick' : '') +
        (s.phase === 'do' && s.cur === n.id ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : '');
      var label = d ? t('nodeDone', { s: L.SIGN[n.op], v: fmt(plan.vals[n.id]) }) : t('nodeWait', { s: L.SIGN[n.op] });
      labels.push(h('span', { class: cls, dataset: { k: d ? 'done' : 'wait' }, style: at, translate: 'no', role: 'img', 'aria-label': label },
        d ? fmt(plan.vals[n.id]) : L.SIGN[n.op]));
    });
    var head = audience === 'child' ? null : h('div', { class: 'oo-head' }, h('span', null, t('treeTitle')),
      h('span', { class: 'oo-small' }, t('treeHint')));
    return h('section', { class: 'oo-box oo-treebox' }, head,
      h('div', { class: 'oo-treefill' },
        h('div', { class: 'oo-tree', role: 'group', 'aria-label': t('treeTitle'), style: { '--nu': String(g.U), '--nr': String(g.R) } },
          svg, labels)));
  }

  // ── the rules ──
  function rulesBox(plan, s) {
    var o = s.phase === 'pick' ? plan.order[s.k] : null;
    var child = audience === 'child';
    var rule = function (id, sym, nameKey, subKey, on) {
      return h('li', { class: 'oo-rule', dataset: on ? { on: '' } : {} },
        h('span', { class: 'oo-mark', 'aria-hidden': 'true' }, on ? '▶' : ''),
        h('span', { class: 'oo-sym', translate: 'no', 'aria-hidden': child ? null : 'true', 'aria-label': child ? t(nameKey) : null }, sym),
        child ? null : h('span', { class: 'oo-rtext' }, h('b', null, t(nameKey)), subKey ? h('span', null, t(subKey)) : null));
    };
    var list = h('ol', null,
      rule('br', '( )', 'rBr', 'rBrSub', !!(o && o.group != null)),
      rule('mul', '· :', 'rMul', null, !!(o && o.rank === 'mul')),
      rule('add', '+ −', 'rAdd', null, !!(o && o.rank === 'add')));
    var ltr = child ? h('div', { class: 'oo-ltr', dataset: o && o.ltr ? { on: '' } : {}, translate: 'no', 'aria-label': t('rLtr') }, '→')
      : h('div', { class: 'oo-ltr', dataset: o && o.ltr ? { on: '' } : {} }, (o && o.ltr ? '▶ ' : '') + t('rLtr'));
    return h('section', { class: 'oo-box oo-rules' }, child ? null : h('div', { class: 'oo-head' }, h('span', null, t('rulesTitle'))), list, ltr);
  }

  // ── the typical mistake: strictly left to right ──
  function mistakeCard(plan, s, p) {
    var m = L.mistakeOf(p.expr);
    var total = plan.order.length, end = s.phase === 'do' && s.k === total;
    var upto = Math.min(s.k, m.plan.order.length);
    var lines = [];
    for (var j = 0; j <= upto; j++) {
      if (j) lines.push(h('span', { class: 'oo-eq' }, '='));
      var txt = lineText(L.writtenAt(m.plan, j));
      lines.push(h('span', { class: end && j === upto && !m.same && !m.stuck ? 'oo-bad' : null }, txt));
    }
    var kids = [h('div', { class: 'oo-head' }, h('span', null, t('mtHead'))), h('div', { class: 'oo-mlines', translate: 'no' }, lines)];
    if (m.stuck && s.k > m.plan.order.length) {
      kids.push(h('p', null, h('span', { class: 'oo-mark-no' }, '✗ '), t('mtStuck', { why: errText(m.stuck) })));
    }
    if (!end) kids.push(h('p', { class: 'oo-small' }, t(m.same ? 'mtAskSame' : 'mtAsk')));
    else if (m.same) kids.push(h('p', null, t('mtSame')));
    else {
      if (!m.stuck) kids.push(h('p', null, h('span', { class: 'oo-mark-no' }, '✗ '), tp('mtWrong', { w: num(fmt(m.value)), r: num(fmt(m.right)) })));
      var first = plan.order.filter(function (o) { return o.rank === 'mul' && o.skipped; })[0];
      kids.push(h('p', null, first ? tp('mtWhy', { e: num(opText(first.a, first.op, first.b)) }) : t('mtWhyGen')));
    }
    return h('section', { class: 'oo-box oo-mc' }, kids);
  }

  function render(c) {
    var plan = L.planFor(c.params), s = c.state;
    var side = [rulesBox(plan, s)];
    if (audience === 'teacher' && c.params.mistake) side.push(mistakeCard(plan, s, c.params));
    c.stage.replaceChildren(h('div', { class: 'oo', dataset: { aud: audience } },
      written(plan, s), chips(c.params, c), treeBox(plan, s, c), h('div', { class: 'oo-side' }, side)));
    syncField(c);
  }

  // ── captions ──
  function caption(c) {
    var plan = L.planFor(c.params), s = c.state, p = c.params;
    var X = audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    var total = plan.order.length;
    var expr = num(lineText(plan.tree.tokens));
    var bare = L.withoutBrackets(p.expr);

    if (s.phase === 'start') {
      if (X === 'C') add(t('cStartC'));
      else {
        add(tp('cStart' + X, { e: expr, ops: t.n('ops', total) }));
        if (bare && bare.same) add(t('cSameOrder'));
      }
      return out;
    }

    var o = plan.order[s.phase === 'pick' ? s.k : s.k - 1];
    var e = num(opText(o.a, o.op, o.b));
    if (s.phase === 'pick') {
      if (X === 'C') {
        addHl(tp(o.group != null ? 'cPickBrC' : o.waits ? 'cPickMulC' : 'cPickC', { e: e }));
        return out;
      }
      var first = true;
      if (o.group != null) {
        addHl(tp('cInBr', { e: e }));
        first = false;
        if (o.brackets > 1) add(t('cLeftBr'));
        if (X === 'A' && o.group === o.id) add(t('whyBrA'));
      }
      if (o.waits) {
        if (!first) add(t('cMulIn'));
        else if (o.skipped) addHl(tp('cSkip', { e: e, s: num(skippedOf(plan, s.k, o)) }));
        else addHl(tp('cMulFirst', { e: e }));
        first = false;
        // a repeated sum only where it is one: 2 to 5 addends (0 · 3 and 1 · 3 are not sums)
        if (X === 'A') add(tp(o.op === ':' ? 'whyDivA' : o.a >= 2 ? 'whyMulA' : 'whyMulShortA',
          { a: num(fmt(o.a)), b: num(fmt(o.b)), sum: num(repeated(o.a, o.b)) }));
      }
      if (o.ltr) {
        if (first) addHl(tp('cLtr', { e: e })); else add(t('cLtrIn'));
        first = false;
        var alt = L.otherOrderOf(plan, s.k);
        if (alt) {
          var altText = num(lineText(L.parse(alt.text).tokens));
          var x = num(opText(alt.a, alt.op, alt.b));
          if (!alt.ok) add(tp('cOtherNo', { x: x, alt: altText, why: errText(alt.fail) }));
          else if (alt.value !== lastValue(plan)) add(tp('cOther', { x: x, alt: altText, v: num(fmt(alt.value)) }));
          else add(tp('cOtherSame', { x: x }));
        }
        if (X === 'A') add(t('whyLtrA'));
      }
      if (first) addHl(tp('cOnly', { e: e }));
      return out;
    }

    // do
    var last = s.k === total;
    var res = num(fmt(o.v));
    if (X === 'C') {
      addHl(tp(last ? 'cDoneC' : 'cDoC', { e: e, v: res }));
      return out;
    }
    if (last) addHl(tp('cDoLast', { e: e, v: res }));
    else add(tp('cDo' + X, { e: e, v: res, line: num(lineText(L.writtenAt(plan, s.k))) }));
    if (o.group === o.id) add(t('cBrGone'));
    if (last && bare) {
      var bt = num(lineText(L.parse(bare.text).tokens));
      if (!bare.ok) add(tp('cNoBrNo', { bare: bt, why: errText(bare.fail) }));
      else if (bare.same) add(tp('cNoBrSame', { bare: bt }));
      else add(tp('cNoBr', { bare: bt, v: num(fmt(bare.value)) }));
    }
    if (last && X === 'T' && p.mistake) {
      var m = L.mistakeOf(p.expr);
      if (m.same) add(t('cMistakeSame'));
      else if (m.stuck) add(t('cMistakeStuck', { why: errText(m.stuck) }));
      else add(tp('cMistake', { w: num(fmt(m.value)) }));
    }
    return out;
  }
  function lastValue(plan) { return plan.value; }
  /** The sign of the + or − to the left that the pick passed over: the nearest one in the line as it now stands
      (done brackets are numbers there, so a sign inside one is not counted). */
  function skippedOf(plan, k, o) {
    var line = L.writtenAt(plan, k), at = -1;
    line.forEach(function (tk, i) { if (tk.t === 'op' && tk.node === o.id) at = i; });
    for (var i = at - 1; i >= 0; i--) {
      if (line[i].t === 'op' && L.RANK[line[i].op] === 1) return L.SIGN[line[i].op];
    }
    return '+';
  }
  /** 4 · 3 as 3 + 3 + 3 + 3 (up to 5 addends; longer ones end in …). */
  function repeated(a, b) {
    if (a <= 5) return Array.apply(null, Array(a)).map(function () { return fmt(b); }).join(' + ');
    return [fmt(b), fmt(b), fmt(b), '…'].join(' + ');
  }

  // ── the panel: the expression field; the header: the audience switch ──
  var field = null;
  function buildField() {
    var host = document.querySelector('[data-oo-expr]');
    var label = h('label', { class: 'sd-ctl-label', for: 'oo-expr' }, h('span', null, t('exprLabel')));
    var input = h('input', { id: 'oo-expr', type: 'text', class: 'oo-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', 'aria-describedby': 'oo-expr-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'oo-expr-msg', role: 'status' }, t('exprHint'));
    input.addEventListener('input', function () {
      var r = L.analyse(input.value);
      if (!r.ok) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = errText(r);
        msg.className = 'oo-err';
        return;
      }
      input.removeAttribute('aria-invalid');
      msg.textContent = t('exprHint');
      msg.className = 'sd-hint';
      notice = null;
      // a space or another way of writing a sign changes nothing: the demo stays where it is
      var canon = L.textOf(r.tree.tokens);
      if (canon === sim.params.expr) return;
      sim.set({ expr: canon });
      sim.first();
    });
    // Enter or Esc hands the keys back to the clicker
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { input.removeAttribute('aria-invalid'); msg.textContent = t('exprHint'); msg.className = 'sd-hint'; sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('exprLabel') },
      h('div', { class: 'oo-field' }, label, input, msg)));
    field = { input: input, msg: msg };
  }
  function syncField(c) {
    if (!field) return;
    var shown = L.canonical(field.input.value);
    // typing keeps its text; a preset or a bracket choice under a focused field rewrites it and clears an error
    if (document.activeElement !== field.input || shown !== c.params.expr) {
      if (document.activeElement === field.input && field.input.getAttribute('aria-invalid')) return;
      field.input.value = c.params.expr;
      field.input.removeAttribute('aria-invalid');
      field.msg.textContent = t('exprHint');
      field.msg.className = 'sd-hint';
    }
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }

  // ── the expression in the URL: ?expr= when it is not the preset's or the default ──
  var query = new URLSearchParams(window.location.search);
  var urlExpr = query.get('expr'), urlStep = query.get('step');
  function writeExpr(c) {
    var pr = c.preset ? L.PRESETS.filter(function (x) { return x.id === c.preset; })[0] : null;
    var base = pr && pr.params.expr ? pr.params.expr : L.defaults.expr;
    try {
      var u = new URLSearchParams(window.location.search);
      if (c.params.expr !== base) u.set('expr', c.params.expr); else u.delete('expr');
      var qs = u.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    } catch (e) { /* file:// in some browsers */ }
  }

  buildAudience();
  buildField();
  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mistake', type: 'toggle', label: t('mistake'), hint: t('mistakeHint'), value: L.defaults.mistake,
        visible: function () { return audience === 'teacher'; } }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    legend: [
      { shape: 'oo-wait', label: t('legWait') },
      { shape: 'hl', label: t('legNow') },
      { shape: 'oo-done', label: t('legDone') },
      { shape: 'oo-used', label: t('legUsed') }
    ],

    render: render,
    caption: caption
  });
  if (urlExpr) {
    var A = L.analyse(urlExpr);
    // a hand-typed ?expr=6+4*3 has a + that the query reads as a space: try the raw text
    if (!A.ok) {
      var raw = (window.location.search.match(/[?&]expr=([^&]*)/) || [])[1];
      try { if (raw) A = L.analyse(decodeURIComponent(raw)); } catch (e) { /* a broken escape: keep the default */ }
    }
    if (A.ok) {
      var canon = L.textOf(A.tree.tokens);
      if (canon !== sim.params.expr) sim.set({ expr: canon });
      if (urlStep) sim.go(Math.max(0, Math.min(sim.steps, parseInt(urlStep, 10) || 0)));
    }
  }
  sim.on(writeExpr);
  writeExpr({ params: sim.params, preset: sim.preset });
})();
</script>
</body>
</html>
