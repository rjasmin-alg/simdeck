/* Legend swatches: the same patterns as the bars, so they read in grayscale too. */

<div class="sd-page">

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SUB = { h1: 'sub1', h2: 'sub2', h3: 'sub3' };
  var SETUP = { tcp: 'setupTcp', tls: 'setupTls', quic: 'setupQuic' };
  var MIN_BLOCK = 4.6;   // rem: the done box's three lines

  // ── "changed" marks: compare with the state shown before the last param change (SPEC tie-break 6) ──
  var shownKey = null, shownState = null, base = null;
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== shownKey) { base = shownState; shownKey = key; shownState = c.state; }
  }

  function pct(ms, end) { return (100 * ms / end) + '%'; }

  /** Lane geometry: lane i of n, as top/height in % of the lanes box. */
  function lane(i, n) { return { top: (100 * i / n) + '%', height: 'calc(' + (100 / n) + '% - 0.25rem)' }; }

  function setupBar(r, end, pos) {
    var a = r.setup[0].startMs, b = r.setup[r.setup.length - 1].endMs;
    return h('div', { class: 'hv-bar hv-setup', style: Object.assign({ left: pct(a, end), width: pct(b - a, end) }, pos) },
      r.setup.map(function (s) { return h('span', null, h('span', { class: 'hv-tag', translate: 'no' }, t(SETUP[s.kind]))); }));
  }

  function objectBar(o, end, pos) {
    var solid = o.endMs - o.startMs - o.blockedMs;
    var title = o.blockedMs ? t('objWait', { id: o.id, s: o.startMs, e: o.endMs, w: o.blockedMs }) : t('objTitle', { id: o.id, s: o.startMs, e: o.endMs });
    return h('div', { class: 'hv-bar', title: title, style: Object.assign({ left: pct(o.startMs, end), width: pct(o.endMs - o.startMs, end) }, pos) },
      h('span', { class: 'hv-solid', style: { flex: solid + ' 0 0' } }, String(o.id)),
      o.blockedMs ? h('span', { class: 'hv-wait', style: { flex: o.blockedMs + ' 0 0' } }, h('span', { class: 'hv-tag' }, t('waits'))) : null);
  }

  function block(r, ch, end, ticks, laneRem, rem, trackPx, rtt) {
    var many = r.version === 'h1';
    var n = many ? r.conns : r.objects.length;
    var lanes = h('div', { class: 'hv-lanes' });
    var nums = h('div', { class: 'hv-lanes' });
    var rttPx = trackPx * rtt / end;
    var tight = laneRem < 1.05 || rttPx < 1.6 * rem;     // no room for an object's number
    var narrow = rttPx < 3 * rem;                          // no room for TCP, TLS, QUIC or 'waits'
    ticks.forEach(function (ms) { lanes.appendChild(h('div', { class: 'hv-grid', style: { left: pct(ms, end) } })); });
    if (many) {
      for (var c = 0; c < n; c++) {
        var pos = lane(c, n);
        lanes.appendChild(setupBar(r, end, pos));
        if (!tight) nums.appendChild(h('div', { class: 'hv-num', title: t('connTitle', { n: c + 1 }), style: pos }, String(c + 1)));
      }
    } else {
      lanes.appendChild(setupBar(r, end, { top: '0', height: 'calc(100% - 0.25rem)' }));
    }
    r.objects.forEach(function (o, i) {
      var pos = lane(many ? o.conn - 1 : i, n);
      lanes.appendChild(objectBar(o, end, pos));
      if (o.lost) {
        lanes.appendChild(h('div', { class: 'hv-lost', style: { left: pct(o.endMs - o.blockedMs, end), top: 'calc(' + pos.top + ' + ' + (50 / n) + '% - 0.125rem)' } }, '✕'));
      }
      if (ch.objects.indexOf(o.id) >= 0) lanes.appendChild(h('div', { class: 'hv-end', style: { left: pct(o.endMs, end), top: pos.top, height: pos.height } }));
    });
    lanes.appendChild(h('div', { class: 'hv-doneline', style: { left: pct(r.doneMs, end) } }));
    // A block is at least tall enough for its label and its done box (three lines); its lanes sit in the middle.
    var height = { height: Math.max(n * laneRem + 0.6, MIN_BLOCK) + 'rem' };
    lanes.style.height = nums.style.height = (n * laneRem) + 'rem';
    return h('div', { class: 'hv-block' + (tight ? ' hv-tight' : '') + (narrow ? ' hv-narrow' : ''), dataset: { v: r.version } },
      h('div', { class: 'hv-label', style: height }, h('b', { translate: 'no' }, t(r.version)), h('span', { class: 'hv-sub' }, t.n(SUB[r.version], many ? r.conns : r.objects.length))),
      h('div', { class: 'hv-nums', style: height }, nums),
      h('div', { class: 'hv-track', style: height }, lanes),
      h('div', { class: 'hv-done' + (ch.done ? ' sd-changed' : ''), style: height },
        h('span', null, t('done')), h('b', null, t('ms', { v: r.doneMs })),
        ch.done ? h('span', { class: 'hv-was' }, t('was', { v: ch.was })) : null));
  }

  function axis(ticks, end) {
    return [h('div'), h('div', { class: 'hv-pad2' }),
      h('div', { class: 'hv-axis' }, ticks.map(function (ms) { return h('span', { style: { left: pct(ms, end) } }, String(ms)); })),
      h('div', { class: 'hv-axislbl' }, t('axis'))];
  }

  var root = null, lastCtx = null;
  function draw(c) {
    var st = c.state;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var phone = window.matchMedia('(max-width: 900px), (max-aspect-ratio: 1/1)').matches;
    var lanesTotal = st.rows.reduce(function (s, r) { return s + (r.version === 'h1' ? r.conns : r.objects.length); }, 0);
    // Lanes share the stage height left after the axis and the blocks' padding; at most 2.6rem, at least 0.9rem.
    var avail = c.stage.clientHeight / rem - 1.6 - 3 * 0.6 - 1.4;
    st.rows.forEach(function (r) { var k = r.version === 'h1' ? r.conns : r.objects.length; if (k * 2.6 + 0.6 < MIN_BLOCK) { avail -= MIN_BLOCK; lanesTotal -= k; } });
    var laneRem = phone ? 1.5 : Math.max(0.9, Math.min(2.6, avail / Math.max(lanesTotal, 1)));
    var trackPx = Math.max(150, c.stage.clientWidth - (phone ? 6.8 : 21) * rem);
    var ax = L.ticks(st, c.params.rtt, Math.max(2, Math.floor(trackPx / (3.6 * rem))));
    var end = ax.endMs;
    var ch = L.changed(base, st);
    var out = [];
    st.rows.forEach(function (r) { out.push(block(r, ch[r.version], end, ax.ticks, laneRem, rem, trackPx, c.params.rtt)); });
    root.replaceChildren.apply(root, out.concat(axis(ax.ticks, end)));
  }

  // ── caption ──
  function caption(c) {
    var st = c.state, p = c.params;
    var done = st.rows.map(function (r) { return r.doneMs; });
    var key = L.captionKey(p);
    if (key === 'capLoss') {
      var clean = L.initial(Object.assign({}, p, { loss: false }));
      return t(key, { k: st.lost, all: p.objects === 2 ? t('bothStreams') : t.n('allStreams', p.objects), a: done[1], b: clean.rows[1].doneMs, c: done[2] });
    }
    if (key === 'capSerial') return t(key, { k: L.h1Depth(st), a: done[0], n: p.objects, b: done[1] });
    if (key === 'capLossOne') return t(key);
    return t(key, { a: done[0], b: done[1], c: done[2] });
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'rtt', type: 'range', label: t('rtt'), min: L.RTT_MIN, max: L.RTT_MAX, step: L.RTT_STEP, format: function (v) { return t('ms', { v: v }); } },
      { key: 'objects', type: 'range', label: t('objects'), min: L.OBJ_MIN, max: L.OBJ_MAX, step: 1 },
      { key: 'h1conns', type: 'choice', label: t('h1conns'), hint: t('h1connsHint'), options: L.H1_CONNS.map(function (v) { return [v, String(v)]; }) },
      { key: 'loss', type: 'toggle', label: t('loss'), hint: t('lossHint') },
      { key: 'lostObject', type: 'range', label: t('lostObject'), min: 1, max: function (p) { return p.objects; }, step: 1,
        disabled: function (p) { return p.loss ? false : t('lostOff'); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'hv-setup', label: t('legSetup') },
      { shape: 'hv-obj', label: t('legObject') },
      { shape: 'hv-wait', label: t('legBlocked') },
      { shape: 'hv-lost', label: t('legLost') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      if (!root) {
        root = h('div', { class: 'hv' });
        c.stage.replaceChildren(root);
        var w = 0, hh = 0;
        new ResizeObserver(function () {
          var nw = c.stage.clientWidth, nh = c.stage.clientHeight;
          if (lastCtx && (nw !== w || nh !== hh)) { w = nw; hh = nh; draw(lastCtx); }
        }).observe(c.stage);
      }
      track(c);
      lastCtx = c;
      draw(c);
    },
    caption: caption
  });
})();
</script>
