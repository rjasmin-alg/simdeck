<!-- geo-liquid-volume: pouring water into a narrower or a wider vessel changes how high it stands, not how much there
     is; two vessels are compared by pouring one into the other; measuring with a cup as the unit, then with the litre
     and the decilitre (1 l = 10 dl). An explorer in three modes: the readout on top, below it two vessels to the same
     scale with fill, empty and pour (pour), a big vessel filled one small vessel at a time with the count under it
     (cup), or five litre bottles filled by the decilitre (litre). The header's audience switch is
     Simdeck.paperColumns.audience (docs/sim-ui.md §14). Rules: SPEC.md. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var V = L.vessels;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // what the last action did (a pour, a refused button, a change of unit), kept while the params stay as it left them
  var ev = null;
  // a pour or one more small vessel, drawn over a moment (never under reduced motion)
  var anim = null;
  var stageField = null;

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function dl(n) { return t('fmt', { n: n, u: 'dl' }); }
  function cm(x) { return t('fmt', { n: (Math.round(x * 10) / 10).toLocaleString(Simdeck.lang === 'en' ? 'en' : 'hr'), u: 'cm' }); }
  function vname(id) { return t('v_' + id); }
  function btn(label, title, run, opts) {
    opts = opts || {};
    return noFocus(h('button', { type: 'button', class: 'sd-btn lv-btn', title: title,
      'aria-keyshortcuts': opts.kbd ? opts.kbd.toLowerCase() : null, 'aria-label': opts.aria || null,
      'aria-pressed': opts.pressed == null ? null : String(opts.pressed), 'aria-disabled': opts.disabled ? 'true' : null,
      dataset: opts.main ? { main: '' } : {},
      onclick: function () { run(); } }, label, opts.kbd ? ' ' : '', opts.kbd ? h('kbd', null, opts.kbd) : ''));
  }
  function revealBtn(s) {
    if (s.hide) return btn(t('reveal'), t('revealKey') + ' (V)', function () { sim.set({ hide: false }); }, { kbd: 'V' });
    if (audience === 'teacher') return btn(t('hide'), t('hideHint'), function () { sim.set({ hide: true }); }, { kbd: 'V' });
    return null;
  }
  function sigOf(p) { return JSON.stringify([p.mode, p.a, p.b, p.fa, p.fb, p.big, p.unit, p.k, p.dl]); }
  function setEv(e) { ev = e; }
  function evNow(c) { return ev && ev.sig === sigOf(c.params) ? ev : null; }
  /** Run an action: remember what it did, start the animation, set the params (or redraw when refused). */
  function act(e, patch, from) {
    var next = Object.assign({}, sim.params, patch);
    e.sig = sigOf(next);
    setEv(e);
    if (from && !Simdeck.reducedMotion()) anim = { from: from, t0: null, dur: 650 };
    else anim = null;
    if (Object.keys(patch).length) sim.set(patch); else sim.render();
    if (anim) requestAnimationFrame(frame);
  }
  function frame(ts) {
    if (!anim) return;
    if (anim.t0 === null) anim.t0 = ts;
    anim.k = Math.min(1, (ts - anim.t0) / anim.dur);
    if (stageField && stageField.isConnected) { var f = drawField(sim.state, sim.params); stageField.replaceWith(f); stageField = f; }
    if (anim.k < 1) requestAnimationFrame(frame);
    else { anim = null; sim.render(); }
  }
  /** An amount drawn now: during the animation, between where it was and where it is. */
  function amt(key, v) {
    if (!anim || anim.k == null || !(key in anim.from)) return v;
    var e = 1 - Math.pow(1 - anim.k, 2);
    return anim.from[key] + (v - anim.from[key]) * e;
  }

  /* ══ drawing vessels (cm in the viewBox, labels HTML at 1 : 1) ══ */
  /** The inner outline's points from the bottom left, up, across, down: [[x, y], …], y up from the base. */
  function sidePoints(seg, upTo) {
    var left = [], right = [], y = 0;
    left.push([-seg[0][1] / 2, 0]);
    for (var i = 0; i < seg.length; i++) {
      var s = seg[i];
      if (upTo != null && y + s[0] >= upTo) {
        var w = V.widthAt(seg, upTo);
        left.push([-w / 2, upTo]);
        break;
      }
      y += s[0];
      left.push([-s[2] / 2, y]);
    }
    left.forEach(function (p) { right.unshift([-p[0], p[1]]); });
    return left.concat(right);
  }
  function pts(list, cx, base) { return list.map(function (p) { return (cx + p[0]).toFixed(3) + ',' + (base - p[1]).toFixed(3); }).join(' '); }
  /** One vessel at cx on the table line `base`, with v dl of water; returns its top y. */
  function vessel(g, id, cx, base, v, opts) {
    opts = opts || {};
    var d = L.VESSELS[id], H = V.height(d.seg), outline = sidePoints(d.seg);
    g.append(svg('polygon', { class: 'lv-glass', points: pts(outline, cx, base) }));
    var y = V.level(d.seg, d.cap, v);
    if (y > 0) {
      g.append(svg('polygon', { class: 'lv-water', points: pts(sidePoints(d.seg, y), cx, base) }));
      var w = V.widthAt(d.seg, y);
      g.append(svg('line', { class: 'lv-surface', x1: cx - w / 2, y1: base - y, x2: cx + w / 2, y2: base - y }));
    }
    (opts.lines || []).forEach(function (ln) {
      var wl = V.widthAt(d.seg, ln.y);
      g.append(svg('line', { class: ln.cls, x1: cx - wl / 2 - (ln.out || 0), y1: base - ln.y, x2: cx + wl / 2 + (ln.out || 0), y2: base - ln.y }));
    });
    // the walls: open at the top
    g.append(svg('polyline', { class: 'lv-vessel', points: pts(outline, cx, base) }));
    var topW = d.seg[d.seg.length - 1][2], bw = V.width(d.seg);
    if (id === 'cup' || id === 'jug') {
      var hx = cx + (id === 'jug' ? 11 : 7) / 2 - 0.2, hy = base - H * 0.25, hh = H * 0.5, hw = id === 'jug' ? 3.4 : 2.2;
      g.append(svg('path', { class: 'lv-vessel', d: 'M' + hx + ',' + (hy - hh) + ' c' + hw + ',0 ' + hw + ',' + hh + ' 0,' + hh }));
    }
    if (id === 'pot') {
      [-1, 1].forEach(function (sd) {
        g.append(svg('line', { class: 'lv-vessel', x1: cx + sd * bw / 2, y1: base - H + 0.6, x2: cx + sd * (bw / 2 + 2), y2: base - H + 0.6 }));
      });
    }
    if (id === 'jug') g.append(svg('polyline', { class: 'lv-vessel', points: pts([[-topW / 2, H], [-topW / 2 - 1.6, H + 1.2]], cx, base) }));
    return base - H;
  }
  function field(viewW, viewH, kids, labs, label) {
    var el = svg('svg', { viewBox: '0 0 ' + viewW + ' ' + viewH, 'aria-hidden': 'true' });
    kids(el);
    return h('div', { class: 'lv-field', role: 'img', 'aria-label': label, style: { '--ar': String(viewW / viewH) } }, [el].concat(labs));
  }
  function labAt(viewW, viewH, x, y, kids, data) {
    return h('span', { class: 'lv-lab', dataset: data || {}, style: { left: (x / viewW * 100).toFixed(2) + '%', top: (y / viewH * 100).toFixed(2) + '%' } }, kids);
  }

  /* ══ pour ══ */
  var PW = 46, PH = 32.5, PBASE = 29;
  function amountText(s, v) { return s.hide ? t('unknownDl') : dl(v); }
  function pourField(s, params) {
    var e = evNow({ params: params }), labs = [];
    var fa = amt('fa', s.fa), fb = amt('fb', s.fb);
    var xa = 12.5, xb = 33.5;
    var label = t('pourLabel', { a: vname(s.a), b: vname(s.b), fa: amountText(s, s.fa), fb: amountText(s, s.fb) });
    return field(PW, PH, function (el) {
      el.append(svg('line', { class: 'lv-table', x1: 1, y1: PBASE, x2: PW - 1, y2: PBASE }));
      [['a', xa, fa], ['b', xb, fb]].forEach(function (r) {
        var id = s[r[0]], lines = [];
        // rule 4: the level before the last pour, dashed
        if (e && e.before && !e.refused && audience !== 'child') {
          var vb = e.before[r[0] === 'a' ? 'fa' : 'fb'];
          if (vb > 0) lines.push({ y: V.level(L.VESSELS[id].seg, L.VESSELS[id].cap, vb), cls: 'lv-ghost', out: 1 });
        }
        vessel(el, id, r[1], PBASE, r[2], { lines: lines });
        var c = r[0] === 'a' ? s.capA : s.capB, v = r[0] === 'a' ? s.fa : s.fb;
        var kids = [cap(vname(id)), h('br'), h('b', { translate: 'no' }, amountText(s, v))];
        if (audience === 'teacher' && !s.hide) kids.push(' ', h('span', null, t('holds', { c: dl(c) })));
        labs.push(labAt(PW, PH, r[1], PBASE + 0.6, kids));
      });
    }, labs, label);
  }
  function topPour(s, c) {
    var e = evNow(c), col = [], say;
    if (e && e.verdict) say = verdictText(s, e);
    else if (s.hide) say = t('askPour');
    else say = t('total', { v: dl(s.total) });
    col.push(h('div', { class: 'lv-say' }, h('span', { class: s.hide || (e && e.verdict) ? 'lv-q' : null }, say)));
    if (audience !== 'child') {
      col.push(h('div', { class: 'lv-sub' }, t('subPour', { a: amountText(s, s.fa), b: amountText(s, s.fb), t: s.hide ? t('unknownDl') : dl(s.total) })));
    }
    return [h('div', { class: 'lv-col' }, col), h('div', { class: 'lv-side' }, revealBtn(s))];
  }
  function verdictText(s, e) {
    var x = e.dir === 'ab' ? s.a : s.b, y = e.dir === 'ab' ? s.b : s.a;
    if (e.verdict === 'from') return cap(t('vFrom', { x: vname(x) }));
    if (e.verdict === 'to') return cap(t('vTo', { y: vname(y) }));
    return t('vSame');
  }
  function pourBar(s) {
    function side(k) {
      var c = k === 'a' ? s.capA : s.capB, v = k === 'a' ? s.fa : s.fb, nm = vname(s[k]);
      return h('div', { class: 'lv-grp', role: 'group', 'aria-label': cap(nm) },
        btn(t('fill'), t('fillHint', { x: nm }), function () { act({ kind: 'fill' }, L.fill(sim.params, k), null); }, { disabled: v === c }),
        btn(t('empty'), t('emptyHint', { x: nm }), function () { act({ kind: 'empty' }, L.empty(sim.params, k), null); }, { disabled: v === 0 }));
    }
    function pourBtn(dir) {
      var ab = dir === 'ab';
      var label = ab ? t('pour') + ' →' : '← ' + t('pour');
      var x = ab ? s.a : s.b, y = ab ? s.b : s.a;
      return btn(label, t('pourHint', { x: vname(x), y: vname(y) }) + (ab ? ' (P)' : ' (O)'), function () { doPour(dir); },
        { main: true, kbd: ab ? 'P' : 'O', disabled: (ab ? s.fa : s.fb) === 0 || (ab ? s.fullB : s.fullA) });
    }
    return h('div', { class: 'lv-bar' }, side('a'), h('div', { class: 'lv-grp' }, pourBtn('ab'), pourBtn('ba')), side('b'));
  }
  function doPour(dir) {
    var p = sim.params, r = L.pour(p, dir);
    r.kind = 'pour';
    r.before = { fa: sim.state.fa, fb: sim.state.fb };
    act(r, r.patch, r.refused ? null : { fa: sim.state.fa, fb: sim.state.fb });
  }

  /* ══ cup ══ */
  var CW = 44, CH = 32.5, CBASE = 29;
  function countText(s) {
    if (!s.done) return t.n('u_' + s.unit, s.k);
    return s.exact ? t.n('u_' + s.unit, s.full) : t('andBit', { n: t.n('u_' + s.unit, s.full) });
  }
  function cupField(s) {
    var labs = [], inBig = amt('inBig', s.inBig);
    var bx = 15, ux = 36;
    var d = L.VESSELS[s.big], du = L.VESSELS[s.unit];
    var label = cap(t('cupLabel', { big: vname(s.big), unit: vname(s.unit), n: s.hide && !s.done ? t('unknown') : s.done && !s.exact ? countText(s) : t.n('uacc_' + s.unit, s.done ? s.full : s.k) }));
    return field(CW, CH, function (el) {
      el.append(svg('line', { class: 'lv-table', x1: 1, y1: CBASE, x2: CW - 1, y2: CBASE }));
      // each small vessel poured in makes a layer (dashed), numbered at the side (teacher, adult)
      var lines = [];
      if (audience !== 'child') {
        for (var i = 1; i <= Math.min(s.k, s.full); i++) {
          if (i * s.u >= s.C) break;
          var y = V.level(d.seg, d.cap, i * s.u);
          lines.push({ y: y, cls: 'lv-layer', out: 0 });
        }
      }
      vessel(el, s.big, bx, CBASE, inBig, { lines: lines });
      var bw = V.width(d.seg);
      if (audience !== 'child' && !s.hide) {
        var lastY = -9;
        for (var j = 1; j <= Math.min(s.k, s.full); j++) {
          var yj = V.level(d.seg, d.cap, j * s.u);
          if ((yj - lastY) / CH * 100 < 4.2) continue;
          lastY = yj;
          labs.push(labAt(CW, CH, bx - bw / 2 - 0.4, CBASE - yj, String(j), { side: '' }));
        }
      }
      // the small vessel: full while there is more to pour, keeping what did not fit at the end
      var inUnit = s.done ? s.left : du.cap;
      vessel(el, s.unit, ux, CBASE, inUnit);
      labs.push(labAt(CW, CH, bx, CBASE + 0.6, [cap(vname(s.big)), audience === 'teacher' && !s.hide ? [' ', h('b', { translate: 'no' }, dl(s.C))] : null]));
      labs.push(labAt(CW, CH, ux, CBASE + 0.6, [cap(vname(s.unit)), audience === 'teacher' && !s.hide ? [' ', h('b', { translate: 'no' }, dl(s.u))] : null]));
      if (s.done && s.left) labs.push(labAt(CW, CH, ux, CBASE - V.height(du.seg) - 0.6, t('leftIn'), { up: '' }));
    }, labs, label);
  }
  function tally(s) {
    var marks = [];
    for (var i = 1; i <= s.k; i++) {
      var part = s.done && i === s.k && s.left > 0;
      marks.push(h('span', { class: 'lv-mark', dataset: part ? { part: '' } : {}, title: part ? t('partHint') : '' }, s.hide && !s.done ? '' : String(i)));
    }
    return h('div', { class: 'lv-tally', 'aria-hidden': 'true' }, marks);
  }
  function topCup(s, c) {
    var col = [], side = [];
    var n = s.hide && !s.done ? t('unknown') : s.done ? countText(s) : s.k ? t.n('u_' + s.unit, s.k) : t('zeroU', { u: t('uw_' + s.unit) });
    col.push(h('div', { class: 'lv-say' }, h('span', null, cap(vname(s.big)) + ':'), h('span', { class: 'lv-q', translate: 'no' }, n)));
    if (audience !== 'child') {
      var sub = s.done ? (s.exact ? t('subCupExact', { n: countText(s) })
        : t('subCupPart', { a: String(s.full), b: t.n('u_' + s.unit, s.full + 1) }))
        : t('subCupGo', { u: t('ua_' + s.unit) });
      col.push(h('div', { class: 'lv-sub' }, sub));
    }
    side.push(h('div', { class: 'lv-grp', role: 'group', 'aria-label': t('unitLab') }, h('span', null, t('unitLab')),
      L.UNIT_IDS.map(function (u) {
        return btn(cap(vname(u)), t('unitLab') + ': ' + vname(u), function () { changeUnit(u); }, { pressed: u === s.unit });
      })));
    side.push(revealBtn(s));
    return [h('div', { class: 'lv-col' }, col), h('div', { class: 'lv-side' }, side)];
  }
  function changeUnit(u) {
    var s = sim.state;
    if (u === s.unit) return;
    var e = { kind: 'unit', from: s.unit, fromN: s.done ? countText(s) : null, fromU: s.u, wasDone: s.done };
    act(e, L.setUnit(sim.params, u), null);
  }
  function cupBar(s) {
    return h('div', { class: 'lv-bar' }, h('div', { class: 'lv-grp' },
      btn(t('addU', { u: t('ua_' + s.unit) }), t('addUHint') + ' (P)', addUnit, { main: true, kbd: 'P', disabled: s.done }),
      btn(t('fillUp'), t('fillUpHint'), function () { act({ kind: 'fillup' }, L.fillUp(sim.params), { inBig: sim.state.inBig }); }, { disabled: s.done }),
      btn(t('empty'), t('emptyHint', { x: vname(s.big) }), function () { act({ kind: 'empty' }, { k: 0 }, null); }, { disabled: s.k === 0 })));
  }
  function addUnit() {
    var r = L.addUnit(sim.params);
    act({ kind: 'add', refused: r.refused }, r.patch, r.refused ? null : { inBig: sim.state.inBig });
  }

  /* ══ litre ══ */
  var LW = 60, LH = 32.5, LBASE = 29, BODY = 20, BW = 8;
  function litreReading(s) {
    var out = [];
    if (s.l) out.push(t('fmt', { n: s.l, u: 'l' }));
    if (s.rest || !s.l) out.push(dl(s.rest));
    return out.join(' ');
  }
  function litreField(s) {
    var labs = [];
    var label = t('litreLabel', { n: dl(s.dl), r: s.hide ? t('unknown') : litreReading(s) });
    return field(LW, LH, function (el) {
      el.append(svg('line', { class: 'lv-table', x1: 1, y1: LBASE, x2: LW - 1, y2: LBASE }));
      for (var i = 0; i < L.BOTTLES; i++) {
        var cx = 7 + i * 11.5, fill = amt('dl', s.dl) - 10 * i;
        fill = Math.max(0, Math.min(10, fill));
        var x0 = cx - BW / 2;
        // the body holds 1 l up to the top mark; the shoulder and the neck are left empty
        el.append(svg('rect', { class: 'lv-glass', x: x0, y: LBASE - BODY, width: BW, height: BODY }));
        if (fill > 0) {
          el.append(svg('rect', { class: 'lv-water', x: x0, y: LBASE - BODY * fill / 10, width: BW, height: BODY * fill / 10 }));
          el.append(svg('line', { class: 'lv-surface', x1: x0, y1: LBASE - BODY * fill / 10, x2: x0 + BW, y2: LBASE - BODY * fill / 10 }));
        }
        for (var m = 1; m <= 10; m++) {
          var y = LBASE - BODY * m / 10;
          el.append(svg('line', { class: 'lv-tick', x1: x0, y1: y, x2: x0 + (m === 5 || m === 10 ? 3 : 1.8), y2: y }));
        }
        el.append(svg('polyline', { class: 'lv-vessel', points: [[x0 + 2.75, LBASE - BODY - 5.5], [x0 + 2.75, LBASE - BODY - 2.4], [x0, LBASE - BODY], [x0, LBASE], [x0 + BW, LBASE], [x0 + BW, LBASE - BODY], [x0 + BW - 2.75, LBASE - BODY - 2.4], [x0 + BW - 2.75, LBASE - BODY - 5.5]].map(function (p) { return p.join(','); }).join(' ') }));
        var v = s.bottles[i], txt = s.hide ? '' : v === 10 ? t('fmt', { n: 1, u: 'l' }) : v ? dl(v) : '';
        labs.push(labAt(LW, LH, cx, LBASE + 0.6, h('b', { translate: 'no' }, txt || ' ')));
      }
    }, labs, label);
  }
  function topLitre(s) {
    var col = [];
    var r = s.hide ? t('unknown') : litreReading(s);
    var parts = [h('span', { translate: 'no' }, dl(s.dl) + ' =')];
    // below a litre the reading is the amount itself (no "7 dl = 7 dl")
    if (s.l === 0) parts = [h('span', { translate: 'no' }, dl(s.dl))];
    else parts.push(h('span', { class: 'lv-q', translate: 'no' }, r));
    col.push(h('div', { class: 'lv-say' }, parts));
    if (audience === 'teacher') col.push(h('div', { class: 'lv-sub' }, t('subLitre')));
    else if (audience === 'adult') col.push(h('div', { class: 'lv-sub' }, t('subLitreA')));
    return [h('div', { class: 'lv-col' }, col), h('div', { class: 'lv-side' }, revealBtn(s))];
  }
  function litreBar(s) {
    function b(d, label, opts) {
      var m = s.dl + d;
      return btn(label, t(d > 0 ? 'addHint' : 'subHint', { q: label.replace(/^[+−]/, '') }) + (opts && opts.kbd ? ' (' + opts.kbd + ')' : ''), function () {
        var r = L.addDl(sim.params, d);
        act({ kind: 'dl', d: d, refused: r.refused }, r.patch, r.refused ? null : { dl: sim.state.dl });
      }, Object.assign({ disabled: m < 0 || m > L.DL_MAX }, opts || {}));
    }
    return h('div', { class: 'lv-bar' },
      h('div', { class: 'lv-grp' }, b(1, '+1 dl', { main: true, kbd: 'P' }), b(-1, '−1 dl')),
      h('div', { class: 'lv-grp' }, b(10, '+1 l'), b(-10, '−1 l')),
      h('div', { class: 'lv-grp' }, btn(t('empty'), t('emptyAll'), function () { act({ kind: 'empty' }, { dl: 0 }, null); }, { disabled: s.dl === 0 })));
  }

  function drawField(s, params) {
    return s.mode === 'pour' ? pourField(s, params) : s.mode === 'cup' ? cupField(s) : litreField(s);
  }
  function render(c) {
    var s = c.state, top, bar, extra = null;
    if (s.mode === 'pour') { top = topPour(s, c); bar = pourBar(s); }
    else if (s.mode === 'cup') { top = topCup(s, c); bar = cupBar(s); extra = tally(s); }
    else { top = topLitre(s); bar = litreBar(s); }
    var f = drawField(s, c.params);
    stageField = f;
    c.stage.replaceChildren(h('div', { class: 'lv', dataset: { aud: audience, mode: s.mode } },
      h('section', { class: 'lv-box lv-top' }, top),
      h('section', { class: 'lv-box lv-main' }, h('div', { class: 'lv-wrap' }, f), h('div', null, extra, bar))));
  }

  /* ══ captions (SPEC, Legend and captions) ══ */
  function caption(c) {
    var s = c.state, A = audience, out = [], e = evNow(c);
    // names are lower case; a sentence that starts with one is capitalised here
    function put(x) { if (out.length) out.push(' '); out.push(h('span', null, cap(x))); }
    function putHl(x) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, cap(x))); }
    if (s.mode === 'pour') {
      if (e && e.kind === 'pour' && e.refused) {
        var sideX = e.dir === 'ab' ? 'a' : 'b', sideY = e.dir === 'ab' ? 'b' : 'a';
        put(e.refused === 'empty' ? t('cRefEmpty', { x: vname(s[sideX]) }) : t('cRefFull', { y: vname(s[sideY]) }));
        return out;
      }
      if (e && e.kind === 'pour') {
        var x = vname(e.dir === 'ab' ? s.a : s.b), y = vname(e.dir === 'ab' ? s.b : s.a);
        if (A === 'child') { put(t(e.change === 'same' ? 'cPouredSameC' : 'cPouredC')); if (e.verdict) put(verdictText(s, e)); return out; }
        if (A === 'teacher' && e.change !== 'same') putHl(t('cMistHigh'));
        // only part of the water moved (some stayed, or the other had water): speak of the poured water alone
        var part = e.left > 0 || e.before[e.dir === 'ab' ? 'fb' : 'fa'] > 0;
        var mv = s.hide ? t(e.left > 0 ? 'partW' : 'allW') : dl(e.moved);
        if (e.change === 'same') put(part ? t('cPartSame', { x: x, y: y, m: mv, h: cm(e.hTo) }) : t('cPouredSame', { x: x, y: y, h: cm(e.hTo) }));
        else if (part) put(t(e.change === 'lower' ? 'cPartLower' : 'cPartHigher', { x: x, y: y, m: mv, h1: cm(e.hFrom), h2: cm(e.hTo) }));
        else put(t(e.change === 'lower' ? 'cPouredLower' : 'cPouredHigher', { x: x, y: y, h1: cm(e.hFrom), h2: cm(e.hTo) }));
        if (e.verdict) {
          put(e.verdict === 'from' ? t('cVFrom', { left: s.hide ? t('some') : dl(e.left), x: x }) : e.verdict === 'to' ? t('cVTo', { y: y }) : t('cVSame'));
          // the vessel that holds more is the lower one: height alone does not tell
          var hx = e.dir === 'ab' ? s.heightA : s.heightB, hy = e.dir === 'ab' ? s.heightB : s.heightA;
          if (A === 'teacher' && ((e.verdict === 'to' && hy < hx) || (e.verdict === 'from' && hx < hy))) putHl(t('cMistTall'));
        } else if (A === 'teacher') put(t('cNoVerdict'));
        if (A === 'adult') put(t('whyPour'));
        return out;
      }
      if (s.hide) { put(t(A === 'child' ? 'cAskPourC' : 'cAskPour')); return out; }
      put(t(A === 'child' ? 'cPourC' : 'cPour'));
      if (A === 'adult') put(t('whyPour'));
      return out;
    }
    if (s.mode === 'cup') {
      var big = vname(s.big);
      if (e && e.kind === 'unit' && e.wasDone && s.done) {
        var bigger = s.u > e.fromU;
        if (A === 'child') { put(t(bigger ? 'cUnitBiggerC' : 'cUnitSmallerC')); return out; }
        if (A === 'teacher') putHl(t('cMistUnit'));
        put(t(bigger ? 'cUnitBigger' : 'cUnitSmaller', { u1: vname(e.from), n1: e.fromN, u2: vname(s.unit), n2: countText(s) }));
        if (A === 'adult') put(t('whyCup'));
        return out;
      }
      if (s.k === 0) {
        put(s.hide ? t(A === 'child' ? 'cAskCupC' : 'cAskCup', { u: t('uw_' + s.unit), big: vname(s.big) }) : t(A === 'child' ? 'cCupStartC' : 'cCupStart', { u: t('ua_' + s.unit) }));
        if (A === 'adult') put(t('whyCup'));
        return out;
      }
      if (!s.done) {
        if (A === 'child') { put(s.hide ? t('cCountC') : t('cCupGoC', { n: t.n('u_' + s.unit, s.k) })); return out; }
        put(s.hide ? t('cCupGoHidden') : t('cCupGo', { n: t.n('uacc_' + s.unit, s.k) }));
        return out;
      }
      if (A === 'child') { put(t('cCupDoneC', { big: big, n: countText(s) })); return out; }
      if (s.exact) put(t('cCupExact', { big: big, n: t.n('uacc_' + s.unit, s.full) }));
      else put(t('cCupPart', { u: vname(s.unit), big: vname(s.big), a: String(s.full), b: t.n('u_' + s.unit, s.full + 1) }));
      if (A === 'teacher') {
        if (s.unit === 'dl') put(t('cDlUnit', { big: big, c: dl(s.C) }));
        else put(t('cOtherUnit'));
      }
      if (A === 'adult') put(t('whyCup'));
      return out;
    }
    // litre
    if (e && e.kind === 'dl' && e.refused) { put(t(e.d > 0 ? 'cLimitTop' : 'cLimitZero')); return out; }
    if (s.hide) { put(t(A === 'child' ? 'cAskLC' : 'cAskL')); return out; }
    var r = litreReading(s);
    if (A === 'child') { put(s.dl === 0 ? t('cL0C') : s.l === 0 ? t('cLLessC', { n: dl(s.dl) }) : t('cLC', { n: dl(s.dl), r: r })); return out; }
    if (s.dl === 0) put(t('cL0'));
    else if (s.wholeLitre) {
      if (A === 'teacher') putHl(t('cMistL100'));
      put(t('cLWhole', { n: dl(s.dl), r: r, full: t.n('fullBottles', s.l) }));
    } else if (s.l === 0) put(t('cLLess', { n: dl(s.dl), m: dl(10 - s.dl) }));
    else {
      put(t('cLMixed', { n: dl(s.dl), r: r, full: t.n('fullBottles', s.l), d: dl(s.rest) }));
      if (A === 'teacher' && s.mixed) putHl(t('cMistAdd', { r: r, sum: dl(s.l + s.rest) }));
    }
    if (A === 'adult') put(t('whyL'));
    return out;
  }

  /* ══ the header: the audience switch ══ */
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  function m(mode) { return function (prm) { return prm.mode === mode; }; }
  function pourOpts() { return L.POUR_IDS.map(function (id) { return [id, cap(vname(id))]; }); }
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, options: L.MODES.map(function (x) { return [x, t('mode_' + x)]; }) },
      { key: 'a', type: 'select', label: t('left'), value: L.defaults.a, visible: m('pour'), options: pourOpts() },
      { key: 'b', type: 'select', label: t('right'), value: L.defaults.b, visible: m('pour'), options: pourOpts() },
      { key: 'big', type: 'choice', label: t('bigLab'), value: L.defaults.big, visible: m('cup'),
        options: L.BIG_IDS.map(function (id) { return [id, cap(vname(id))]; }) },
      { key: 'dl', type: 'range', label: t('dlLab'), value: L.defaults.dl, min: 0, max: L.DL_MAX, visible: m('litre'), unit: 'dl' },
      // the stage's buttons and V; here so the URL and the presets carry them
      { key: 'fa', type: 'range', label: t('left'), value: L.defaults.fa, min: 0, max: 30, visible: hidden },
      { key: 'fb', type: 'range', label: t('right'), value: L.defaults.fb, min: 0, max: 30, visible: hidden },
      { key: 'unit', type: 'choice', label: t('unitLab'), value: L.defaults.unit, options: L.UNIT_IDS.map(function (u) { return [u, vname(u)]; }), visible: hidden },
      { key: 'k', type: 'range', label: t('unitLab'), value: L.defaults.k, min: 0, max: 30, visible: hidden },
      { key: 'hide', type: 'toggle', label: t('hide'), hint: t('hideHint'), value: L.defaults.hide, visible: hidden }
    ],

    presets: L.PRESETS.map(function (pr) {
      var k = pr.id.replace('-', '_');
      return { id: pr.id, label: t('p_' + k), hint: t('ph_' + k), params: pr.params };
    }),

    keys: [
      { key: 'v', label: t('revealKey'), run: function (sm) { sm.set({ hide: !sm.params.hide }); } },
      { key: 'p', label: t('keyP'), run: function (sm) {
          var md = sm.state.mode;
          if (md === 'pour') doPour('ab');
          else if (md === 'cup') addUnit();
          else { var r = L.addDl(sm.params, 1); act({ kind: 'dl', d: 1, refused: r.refused }, r.patch, r.refused ? null : { dl: sm.state.dl }); }
        } },
      { key: 'o', label: t('keyO'), run: function (sm) { if (sm.state.mode === 'pour') doPour('ba'); } }
    ],

    legend: [
      { c: 1, label: t('legWater') },
      { shape: 'dash', label: t('legBefore') },
      { c: 2, label: t('legUnit') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows: amounts clamped to the vessels, the count to the big vessel
  var lastBig = null;
  sim.on(function (c) {
    var s = c.state, p = c.params, fix = {};
    if (s.mode === 'pour') { if (p.fa !== s.fa) fix.fa = s.fa; if (p.fb !== s.fb) fix.fb = s.fb; }
    if (s.mode === 'cup' && p.k !== s.k) fix.k = s.k;
    // a new big vessel starts empty (it is not filled without pouring)
    if (s.mode === 'cup' && lastBig !== null && lastBig !== s.big && s.k) fix.k = 0;
    if (s.mode === 'cup') lastBig = s.big;
    if (Object.keys(fix).length) sim.set(fix, { preset: sim.preset });
  });

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
