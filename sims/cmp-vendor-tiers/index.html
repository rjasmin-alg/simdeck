<!-- cmp-vendor-tiers: suppliers are tiered by what they reach (personal data, production access, a critical service)
     and how hard they are to replace; the tier sets the depth of checking (a questionnaire, certification evidence,
     contract clauses with audit rights); with limited hours, one questionnaire for all spreads them thin; a
     subcontractor and a shared provider carry risk too.
     The stage: the two strategies' numbers side by side (hours, risk covered, per hour; a card picks the one shown) and
     the total risk; thirty supplier tiles in three tier columns, each with its check, what it reaches and a bar whose
     length is its risk and whose solid part is the share covered; below, what is behind the suppliers.
     Model: sim.js (+ scoring.js, copied from cmp-risk-register); rules: SPEC.md; words: strings.js. -->

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (88 000 / 88,000). */
  function group(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ','); }
  function dec(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function eur(x) { return t('eur', { n: group(Math.round(x)) }); }
  /** Compact money for tiles: €500, €7.5k, €120k. */
  function compact(x) { return x < 1000 ? eur(x) : t('eurK', { n: dec(Math.round(x / 100) / 10) }); }
  function pct(n) { return t('pct', { n: n }); }
  function hrs(n) { return t('hours', { n: n }); }
  function b(text) { return h('b', { class: 'vt-num' }, String(text)); }
  function nameOf(id) { return t('s_' + id); }

  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // after a keyboard press, focus goes back to the same card

  // ── the numbers ──

  function card(s, view) {
    var x = s[view], on = s.p.view === view;
    var title = view === 'same' ? t('kSame')
      : [t('kTiered'), ' ', h('small', null, '(' + t(s.p.rule === 'spend' ? 'kBySpend' : 'kByReach') + ')')];
    return h('button', {
      type: 'button', class: 'vt-k', 'aria-pressed': String(on), dataset: { sel: 'k-' + view },
      'aria-label': t('kShow', { name: view === 'same' ? t('kSame') : t('kTiered') }) + '. ' +
        t('kCovered', { pct: pct(x.pct) }) + ', ' + t('kHours', { h: x.hours, b: s.p.budget }) + ', ' + t('kPerHour', { eur: eur(x.perHour) }),
      onmousedown: noFocus,
      onclick: function (e) { refocus = e.detail === 0 ? 'k-' + view : null; sim.set({ view: view }); }
    },
      h('span', { class: 'vt-kt' }, title),
      h('span', { class: 'vt-kb' }, h('span', null, t('kCov')), b(pct(x.pct)),
        h('span', { class: 'vt-kbar', 'aria-hidden': 'true' }, h('span', { style: { '--w': x.pct + '%' } })),
        h('span', { class: 'vt-ks' }, t('kHours', { h: x.hours, b: s.p.budget }) + ' · ' + t('kPerHour', { eur: eur(x.perHour) }))));
  }

  function top(s) {
    return h('div', { class: 'vt-top' }, card(s, 'same'), card(s, 'tiered'),
      h('div', { class: 'vt-k' }, h('span', { class: 'vt-kt' }, t('kTotal')),
        h('span', { class: 'vt-kb' }, b(eur(s.total)), h('span', { class: 'vt-ks' }, t('kTotalSub'))),
        h('span', { class: 'vt-ks' }, t('kTier1', { pct: pct(s.tier1.pct) }))));
  }

  // ── the tiers ──

  var FLAGS = [['pd', '●', 'fPd'], ['acc', '■', 'fAcc'], ['crit', '★', 'fCrit'], ['hard', '▲', 'fHard']];
  function maxRisk(s) {
    var m = s.rows.reduce(function (a, x) { return Math.max(a, x.risk); }, 0);
    return s.extra ? Math.max(m, s.extra.sub.risk, s.extra.shared.risk) : m;
  }
  /** A bar whose length is the risk (on the page's common scale) and whose solid part is the share covered. */
  function bar(riskV, coveredV, max) {
    return h('span', { class: 'vt-track', 'aria-hidden': 'true' },
      h('span', { class: 'vt-bar', style: { '--w': (100 * riskV / max).toFixed(2) + '%' } },
        h('span', { style: { '--c': riskV ? (100 * coveredV / riskV).toFixed(2) + '%' : '0%' } })));
  }

  function tile(s, x, max, place) {
    var c = x[s.p.view], d = c.depth || 'none';
    var flags = FLAGS.filter(function (f) { return x[f[0]]; }).map(function (f) {
      return h('span', { class: 'vt-f', dataset: { f: f[0] }, title: t(f[2]) }, f[1]);
    });
    if (s.extra && x.shared) flags.push(h('span', { class: 'vt-f', dataset: { f: 'shared' }, title: t('mShared') }, '⧉'));
    if (s.extra && x.id === s.extra.sub.parent) flags.push(h('span', { class: 'vt-f', dataset: { f: 'sub' }, title: t('mSub') }, '↳'));
    var label = t('tileAria', {
      name: nameOf(x.id), tier: t('tier', { n: x.tier }), eur: eur(x.risk), depth: c.depth ? t('d_' + c.depth) : t('dNone'),
      cov: eur(c.covered)
    }) + ' ' + FLAGS.filter(function (f) { return x[f[0]]; }).map(function (f) { return t(f[2]); }).join(', ');
    return h('div', { class: 'vt-tile', role: 'group', dataset: { depth: d }, 'aria-label': label, style: place },
      h('span', { class: 'vt-l1' },
        h('span', { class: 'vt-badge', dataset: { depth: d }, 'aria-hidden': 'true' }, c.depth ? t('dl_' + c.depth) : t('dlNone')),
        h('span', { class: 'vt-nm' }, nameOf(x.id)),
        h('span', { class: 'vt-flags', 'aria-hidden': 'true' }, flags)),
      h('span', { class: 'vt-l2' }, bar(x.risk, c.covered, max), h('span', { class: 'vt-eur vt-num' }, compact(x.risk))));
  }

  /** Grid places: tier 1 in column 1, tier 2 in columns 2–3 (seven rows each, top to bottom), tier 3 in column 4;
      row 1 holds the headers. */
  var COL = { 1: 1, 2: 2, 3: 4 }, SPAN = { 1: '1', 2: '2 / 4', 3: '4' };
  function columns(s) {
    var max = maxRisk(s), kids = [];
    [1, 2, 3].forEach(function (n) {
      var rows = s.rows.filter(function (x) { return x.tier === n; });
      var d = s.p.view === 'same' ? 'quest' : L.DEPTH_OF_TIER[n];
      var rule = s.p.rule === 'spend' ? t('r' + n + '_spend', { n: rows.length }) : t('r' + n + '_reach');
      kids.push(h('div', { class: 'vt-h', style: { gridColumn: SPAN[n], gridRow: '1' } },
        b(t('tier', { n: n })), h('div', { class: 'vt-hd' }, h('span', { class: 'vt-badge', dataset: { depth: d }, 'aria-hidden': 'true' },
          t('dl_' + d)), ' ', t('colDepth', { depth: t('d_' + d), h: L.DEPTHS[d].hours })),
        h('div', null, rule)));
      rows.forEach(function (x, k) {
        var col = n === 2 ? COL[n] + Math.floor(k / 7) : COL[n], row = n === 2 ? k % 7 : k;
        kids.push(tile(s, x, max, { gridColumn: String(col), gridRow: String(row + 2) }));
      });
    });
    kids.push(behind(s, max));
    return h('div', { class: 'vt-cols' }, kids);
  }

  // ── behind the suppliers ──

  function behind(s, max) {
    var place = { gridColumn: '2 / 4', gridRow: '9 / 11' };
    if (!s.extra) return h('div', { class: 'vt-behind', dataset: { off: 'true' }, style: place }, h('b', null, t('behind')), h('p', null, t('behindOff')));
    var v = s.p.view, sub = s.extra.sub, sh = s.extra.shared;
    function box(name, mark, f, line, more, riskV, cov) {
      return h('div', { class: 'vt-x', role: 'group', 'aria-label': name + ': ' + line + '; ' + more + '. ' + t('riskYear', { eur: eur(riskV) }) },
        h('span', { class: 'vt-l1' }, h('b', { class: 'vt-nm' }, name), h('span', { class: 'vt-flags', 'aria-hidden': 'true' },
          h('span', { class: 'vt-f', dataset: { f: f } }, mark)), h('span', { class: 'vt-eur vt-num' }, compact(riskV))),
        h('span', { class: 'vt-l2' }, bar(riskV, cov, max)),
        h('span', { class: 'vt-ks' }, line));
    }
    return h('div', { class: 'vt-behind', style: place }, h('b', null, t('behind')),
      box(t('subName'), '↳', 'sub', t('subOf', { parent: nameOf(sub.parent) }),
        t(sub[v] > 0 ? 'subCovOn' : 'subCovOff'), sub.risk, sub[v]),
      box(t('sharedName'), '⧉', 'shared', t('sharedOf', { n: sh.ids.length }),
        t('sharedList', { list: sh.ids.map(nameOf).join(', ') }) + '; ' + t('sharedCov'), sh.risk, sh[v]));
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    c.stage.replaceChildren(h('div', { class: 'vt' }, top(s), columns(s), h('p', { class: 'vt-foot' }, t('foot'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, p = s.p, k = L.captionKey(s);
    var me = s[p.view], other = s[p.view === 'same' ? 'tiered' : 'same'];
    var out = t.parts(k.key, { h: b(hrs(me.hours)), b: b(p.budget), pct: b(pct(me.pct)), ph: b(eur(me.perHour)),
      pct2: b(pct(other.pct)), ph2: b(eur(other.perHour)) });
    var byId = {};
    s.rows.forEach(function (x) { byId[x.id] = x; });
    k.notes.forEach(function (key) {
      var v = {};
      if (key === 'nSubOn' || key === 'nSubOff') {
        var sub = s.extra.sub;
        v = { sub: b(t('subName')), parent: b(nameOf(sub.parent)), cov: b(eur(sub[p.view])), risk: b(eur(sub.risk)) };
      } else if (key === 'nShared') {
        v = { risk: b(eur(s.extra.shared.risk)) };
      } else if (key === 'nSpend') {
        var m = L.spendMisfits(s), dn = byId[m.down], up = byId[m.up];
        v = { down: b(nameOf(dn.id)), r1: b(eur(dn.risk)), d1: b(t('d_' + L.DEPTH_OF_TIER[dn.tier])),
          up: b(nameOf(up.id)), r2: b(eur(up.risk)), d2: b(t('d_' + L.DEPTH_OF_TIER[up.tier])) };
      } else if (key === 'nOut') {
        v = { n: me.unchecked.length, pct: b(pct(me.uncheckedPct)) };   // a number: it also picks the plural form
      } else if (key === 'nTopSame' || key === 'nTopTiered') {
        v = { n: b(s.rows.filter(function (x) { return x.tier === 1; }).length), all: b(s.rows.length), pct: b(pct(s.tier1.pct)),
          h: b(hrs(L.DEPTHS.quest.hours)) };
      }
      out.push(' ');
      out = out.concat(t.parts(key, v));
    });
    return out;
  }

  var labels = { same: 'pSame', tiered: 'pTiered', enough: 'pEnough', spend: 'pSpend', reveal: 'pReveal' };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'view', type: 'choice', label: t('view'), options: [['same', t('viewSame')], ['tiered', t('viewTiered')]] },
      { key: 'rule', type: 'choice', label: t('rule'), hint: t('ruleHint'), options: [['reach', t('ruleReach')], ['spend', t('ruleSpend')]] },
      { key: 'budget', type: 'range', label: t('budget'), hint: t('budgetHint'), min: L.BUDGET.min, max: L.BUDGET.max,
        step: L.BUDGET.step, format: hrs },
      { key: 'reveal', type: 'toggle', label: t('reveal') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'vt-pd', label: t('legPd') },
      { shape: 'vt-acc', label: t('legAcc') },
      { shape: 'vt-crit', label: t('legCrit') },
      { shape: 'vt-hard', label: t('legHard') },
      { shape: 'vt-cov', label: t('legCov') },
      { shape: 'vt-open', label: t('legOpen') },
      { shape: 'vt-none', label: t('legNone') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
