<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var D = window.SimdeckModels.discount;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { monthly: '1', upfront: '2' };
  var sim = null;
  var refocus = null;   // the stage button to give focus back to after a render

  // ── numbers in the page's language ──

  function dec(x, d) {
    var s = x.toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 11); minus is U+2212. */
  function money(x) {
    var r = D.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  /** A percentage with d decimals, or with as many as it needs (0 or 1) when d is left out. */
  function pct(v, d) { return t('pct', { n: dec(v, d == null ? (v % 1 ? 1 : 0) : d) }); }
  function rateText(s) { return s.rate === null ? t('rateNone') : pct(100 * s.rate, L.rateDigits(s)); }
  function glyph(w) { return h('span', { class: 'pd-g', dataset: { w: w, c: COLOUR[w] } }); }
  function upfrontName(s) { return t('wayUpfront', { k: t.n('yearsN', s.p.years) }); }
  /** When a low point happens: at signing, or in month n (month 1 is t in [0, 1)). */
  function when(low) { return low.t === 0 ? t('atSigning') : t('inMonth', { n: Math.floor(low.t) + 1 }); }

  // ── the rate tile ──

  function rateTile(s, changed) {
    var p = s.p, r = s.rate === null ? Infinity : 100 * s.rate;
    var top = Math.min(60, Math.max(10, r, p.coc) * 1.15);
    var bar = function (k, v, label, text) {
      var w = Math.min(100, 100 * v / top);
      var inside = k === 'rate' && w > 55; // the hatched bar never carries its label (unreadable on the stripes)
      return [
        h('span', { class: 'pd-bar-l' }, label),
        h('div', { class: 'pd-track' },
          h('div', { class: 'pd-bar', dataset: { k: k }, style: { width: w + '%' } }),
          h('span', Object.assign({ class: 'pd-bar-v', translate: 'no', dataset: { k: k }, style: { left: w + '%' } },
            inside ? { dataset: { k: k, in: 'true' } } : {}), text + (v > top ? ' »' : '')))
      ];
    };
    var vkey = s.verdict > 0 ? 'verdictTake' : s.verdict < 0 ? 'verdictSkip' : 'verdictEven';
    return h('div', { class: 'pd-rate' + (changed ? ' sd-changed' : '') },
      h('span', { class: 'pd-rate-label' }, t('tileRate')),
      h('span', { class: 'pd-rate-sub' }, t('rateSub', { d: pct(p.discount), months: t.n('monthsN', s.n) })),
      h('div', { class: 'pd-bars' },
        bar('rate', r, t('rateLabel'), rateText(s)),
        bar('coc', p.coc, t('cocLabel'), pct(p.coc))),
      h('span', { class: 'pd-verdict', dataset: { v: String(s.verdict) } }, t(vkey)));
  }

  // ── the scoreboard ──

  function board(s) {
    var p = s.p;
    var th = function (k, title, sub) {
      var attrs = { class: 'pd-th', dataset: { k: k } };
      if (k === 'exp' || k === 'low') attrs.dataset.col = k;
      return h('div', attrs, title, sub ? h('span', null, sub) : null);
    };
    var cells = [
      th('way', t('thWay')),
      th('paid', t('thPaid'), t('thPaidSub')),
      th('cost', t('thCost', { rate: pct(p.coc) }), t('thCostSub')),
      th('exp', t('thExpense'), t('thExpenseSub')),
      th('low', t('thLow'), t('thLowSub'))
    ];
    var paidBest = Math.min(s.ways[0].paidR, s.ways[1].paidR);
    var costBest = Math.min(s.ways[0].costR, s.ways[1].costR);
    s.ways.forEach(function (w) {
      var sub = w.id === 'monthly'
        ? t('subMonthly', { m: money(s.monthly) })
        : (s.n < s.months ? t('subUpfrontRest', { a: money(s.upfrontAmount), m: money(s.monthly) })
          : t('subUpfront', { a: money(s.upfrontAmount), d: pct(p.discount) }));
      cells.push(h('div', { class: 'pd-name' }, glyph(w.id),
        h('div', null, h('b', null, w.id === 'monthly' ? t('wayMonthly') : upfrontName(s)), h('span', null, sub))));
      var tie = s.ways[0].paidR === s.ways[1].paidR;
      cells.push(h('div', { class: 'pd-val' + (!tie && w.paidR === paidBest ? ' pd-win' : ''), translate: 'no' }, h('b', null, money(w.paid))));
      var tieC = s.ways[0].costR === s.ways[1].costR;
      cells.push(h('div', { class: 'pd-val' + (!tieC && w.costR === costBest ? ' pd-win' : ''), translate: 'no' }, h('b', null, money(w.cost))));
      cells.push(h('div', { class: 'pd-val', dataset: { k: 'exp', col: 'exp' }, translate: 'no' },
        w.expense.map(function (e) { return group(D.roundMoney(e)); }).join(' · ')));
      cells.push(h('div', { class: 'pd-val' + (w.below ? ' pd-below' : ''), dataset: { col: 'low' } },
        h('b', { translate: 'no' }, money(w.low.bal)),
        h('small', null, w.below ? t('belowMark') : when(w.low))));
    });
    return h('div', { class: 'pd-board' }, cells);
  }

  // ── the stage's own controls: years paid upfront, payment terms ──

  function buttons(label, key, options, current) {
    return h('div', { class: 'pd-tool', role: 'group', 'aria-label': label },
      h('span', { class: 'pd-tool-l' }, label),
      h('div', { class: 'sd-seg' }, options.map(function (o) {
        return h('button', {
          type: 'button', 'aria-pressed': String(o[0] === current), dataset: { key: key + ':' + o[0] },
          onclick: function () {
            var patch = {};
            patch[key] = o[0];
            refocus = key + ':' + o[0];
            sim.set(patch);
          }
        }, o[1]);
      })));
  }

  function tools(s) {
    var years = [], terms = L.TERMS.map(function (d) { return [d, d === 0 ? t('termsNow') : t('termsN', { n: d })]; });
    for (var k = L.LIM.years.min; k <= L.LIM.years.max; k++) years.push([k, t.n('yearsN', k)]);
    return h('div', { class: 'pd-tools' },
      buttons(t('years'), 'years', years, s.p.years),
      buttons(t('terms'), 'terms', terms, s.p.terms));
  }

  // ── the cash buffer, month by month ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step that keeps the axis to about four or five grid lines. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }

  var X_END = 39; // months shown: the 36 of the contract and 90 days of terms after it

  function chart(s) {
    var vals = [s.p.floor, 0];
    s.ways.forEach(function (w) { w.points.forEach(function (q) { vals.push(q.bal); }); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var step = niceStep(Math.max(hi - lo, 10000) / 4);
    var bottom = Math.floor(lo / step) * step, top = Math.ceil(hi / step) * step;
    if (top === bottom) top = bottom + step;
    var yp = function (v) { return (100 * (top - v) / (top - bottom)) + '%'; };
    var yn = function (v) { return (1000 * (top - v) / (top - bottom)).toFixed(1); };
    var xn = function (m) { return (1000 * m / X_END).toFixed(1); };
    var ticks = [], lines = [];
    for (var v = bottom; v <= top + 1e-6; v += step) {
      ticks.push(h('span', { class: 'pd-tick', translate: 'no', style: { top: yp(v) } }, money(v)));
      lines.push(h('div', Object.assign({ class: 'pd-gl', style: { top: yp(v) } }, Math.abs(v) < 1e-6 ? { dataset: { zero: 'true' } } : {})));
    }
    var xt = [];
    for (var m = 0; m <= 36; m += 6) {
      lines.push(h('div', { class: 'pd-vl', style: { left: (100 * m / X_END) + '%' } }));
      xt.push(h('span', { class: 'pd-xtick', style: { left: (100 * m / X_END) + '%' }, dataset: m === 0 ? { first: 'true' } : m % 12 ? { minor: 'true' } : {} },
        m === 0 ? t('startN') : t('monthN', { n: m })));
    }
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    var marks = [];
    s.ways.forEach(function (w) {
      var pts = w.points, d = 'M0,' + yn(pts[0].bal);
      for (var i = 1; i < pts.length; i++) d += ' H' + xn(pts[i].t) + ' V' + yn(pts[i].bal);
      d += ' H' + xn(X_END);
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('class', 'pd-line');
      path.setAttribute('data-w', w.id);
      path.setAttribute('data-c', COLOUR[w.id]);
      path.setAttribute('d', d);
      svg.appendChild(path);
      // the lowest point: a mark for each plan, the amount for the upfront plan (the monthly plan's is in the board)
      marks.push(h('span', { class: 'pd-low', style: { left: (100 * w.low.t / X_END) + '%', top: yp(w.low.bal) } },
        glyph(w.id), w.id === 'upfront' ? h('span', { class: 'pd-low-v', translate: 'no' }, money(w.low.bal)) : null));
    });
    var floorLine = h('div', { class: 'pd-floor', style: { top: yp(s.p.floor) } }, h('span', null, t('floorTag', { x: money(s.p.floor) })));
    return h('div', { class: 'pd-panel' },
      h('p', { class: 'pd-title' }, t('chartTitle'), h('span', null, t('chartNote', { m: money(s.monthly) }))),
      h('div', { class: 'pd-plotgrid' }, h('div', { class: 'pd-axis' }, ticks),
        h('div', { class: 'pd-plot' }, lines, floorLine, svg, marks),
        h('div', { class: 'pd-xaxis' }, xt)));
  }

  // ── render; the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'pd' },
      h('div', { class: 'pd-top' }, rateTile(s, chg.indexOf('verdict') >= 0), board(s)),
      tools(s),
      chart(s),
      h('p', { class: 'pd-foot' }, s.p.terms === 0 ? t('illustrativeNow') : t('illustrative', { n: s.p.terms }))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-key="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, p = s.p;
    var k = L.captionKey(s);
    var b = function (x) { return h('b', { translate: 'no' }, x); };
    var up = s.ways[1];
    var out = t.parts(k.key, {
      d: b(pct(p.discount)), months: b(t.n('monthsN', s.n)), r: b(rateText(s)), c: b(pct(p.coc)),
      s: b(money(Math.abs(s.saving))), p: b(money(s.savingPaper))
    });
    k.notes.forEach(function (key) {
      var vars = {
        nBelowFloor: { low: b(money(up.low.bal)), when: when(up.low), f: b(money(p.floor)) },
        nOverdrawn: { low: b(money(up.low.bal)), when: when(up.low) },
        nTied: { x: b(money(s.tied)), low: b(money(up.low.bal)) },
        nTerms: { n: String(p.terms) }
      }[key];
      out.push(' ');
      out = out.concat(t.parts(key, vars));
    });
    return out;
  }

  var labels = {
    'year-upfront': 'pYearUpfront', 'three-years': 'pThreeYears', 'bigger-discount': 'pBiggerDiscount',
    'two-years': 'pTwoYears', 'long-terms': 'pLongTerms', 'no-discount': 'pNoDiscount'
  };
  var R = L.LIM;
  var never = function () { return false; };
  var euros = function (v) { return money(v); };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'discount', type: 'range', label: t('discount'), min: R.discount.min, max: R.discount.max, step: R.discount.step, format: function (v) { return pct(v); } },
      { key: 'coc', type: 'range', label: t('coc'), min: R.coc.min, max: R.coc.max, step: R.coc.step, format: function (v) { return pct(v); } },
      { key: 'buffer', type: 'range', label: t('buffer'), min: R.buffer.min, max: R.buffer.max, step: R.buffer.step, format: euros },
      { key: 'floor', type: 'range', label: t('floor'), min: R.floor.min, max: R.floor.max, step: R.floor.step, format: euros },
      // set on the stage (the two button groups) or fixed (the price); hidden here, kept in the URL and clamped
      { key: 'years', type: 'range', label: t('years'), min: R.years.min, max: R.years.max, step: R.years.step, visible: never },
      { key: 'terms', type: 'choice', label: t('terms'), options: L.TERMS.map(function (d) { return [d, String(d)]; }), visible: never },
      { key: 'price', type: 'range', label: t('price'), min: R.price.min, max: R.price.max, step: R.price.step, visible: never }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'pd-monthly', label: t('legMonthly') },
      { shape: 'pd-upfront', label: t('legUpfront') },
      { shape: 'pd-floor', label: t('legFloor') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
