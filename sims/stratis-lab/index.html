<style>
/* Page CSS: every selector starts with [data-sim="stratis-lab"]; colours only from kit tokens. */
/* Workaround: kit.css gives .sd-ctl display: flex, which beats the hidden attribute a param's visible() sets
   (shared request in NOTES.md, as in sims/amdahl and sims/lvm-topology). */
[data-sim="stratis-lab"] .sd-ctl[hidden] { display: none; }
/* Thirteen controls and nine presets: a wider panel, presets in three columns and controls in two, so the panel
   fits at 1920×1080 without its own scroll. The source drop-down and the group's title and reset button span both. */
[data-sim="stratis-lab"] { --panel-w: 31rem; }
[data-sim="stratis-lab"] .sd-presets { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.2rem; }
[data-sim="stratis-lab"] .sd-preset { line-height: 1.15; }
[data-sim="stratis-lab"] [data-sd-controls] .sd-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.3rem 1rem; }
[data-sim="stratis-lab"] [data-sd-controls] .sd-group > :not(.sd-ctl),
[data-sim="stratis-lab"] [data-sd-controls] .sd-ctl[data-key="kind"] { grid-column: 1 / -1; }

[data-sim="stratis-lab"] .st {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 1.2cqh;
  height: 100%;
  padding: 1.4cqh 1.4cqw;
  font-size: var(--fs-md);
}
[data-sim="stratis-lab"] .st-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0.8cqw; }
[data-sim="stratis-lab"] .st-kpi {
  display: flex;
  flex-direction: column;
  padding: 0.2rem 0.7rem;
  border: var(--line-w) solid var(--line);
  border-top: 0.3rem solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--panel);
  min-width: 0;
}
[data-sim="stratis-lab"] .st-kpi b { font-family: var(--mono); font-size: 1.45rem; color: var(--accent); line-height: 1.2; }
[data-sim="stratis-lab"] .st-kpi span { font-size: var(--fs-sm); color: var(--muted); line-height: 1.15; }
[data-sim="stratis-lab"] .st-body { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 1.4cqw; min-height: 0; }
[data-sim="stratis-lab"] .st-col { display: flex; flex-direction: column; gap: 0.45rem; min-height: 0; min-width: 0; }
[data-sim="stratis-lab"] .st-h { font-weight: 700; }

/* the layers */
/* Four network LUNs with four paths each do not fit: the layers then scroll inside their column. */
[data-sim="stratis-lab"] .st-topo { display: flex; flex-direction: column; gap: 0.2rem; min-height: 0; overflow-y: auto; }
[data-sim="stratis-lab"] .st-layer { display: grid; grid-template-columns: 8.2em minmax(0, 1fr); gap: 0.6rem; align-items: center; }
[data-sim="stratis-lab"] .st-layer-label { font-size: var(--fs-sm); color: var(--muted); text-align: right; line-height: 1.1; }
[data-sim="stratis-lab"] .st-layer-label::after { content: ' ↓'; }
[data-sim="stratis-lab"] .st-layer:last-child .st-layer-label::after { content: ''; }
[data-sim="stratis-lab"] .st-nodes { display: flex; flex-wrap: wrap; gap: 0.2rem 0.4rem; }
[data-sim="stratis-lab"] .st-node {
  padding: 0.05rem 0.45rem;
  border: var(--line-w) solid var(--sw, var(--line));
  border-left-width: 0.4rem;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--sw, var(--line)) 12%, var(--bg));
  line-height: 1.08;
  min-width: 0;
}
[data-sim="stratis-lab"] .st-node b { display: block; font-family: var(--mono); font-size: var(--fs-sm); overflow-wrap: anywhere; }
[data-sim="stratis-lab"] .st-node small { display: block; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="stratis-lab"] .st-node.st-down { border-style: dashed; border-color: var(--danger); background: transparent; }
[data-sim="stratis-lab"] .st-node.st-down small { color: var(--danger); font-weight: 700; }
/* Parts inside another layer (multipath members, the thin pool, a snapshot): no tint, solid border; dashed is for failed only. */
[data-sim="stratis-lab"] .st-node.st-member { background: transparent; }

/* capacity */
[data-sim="stratis-lab"] .st-cap { display: grid; gap: 0.25rem; }
[data-sim="stratis-lab"] .st-cap-label { font-size: var(--fs-sm); }
[data-sim="stratis-lab"] .st-bar {
  position: relative;
  display: flex;
  height: 1.5rem;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: var(--bg);
}
[data-sim="stratis-lab"] .st-seg { height: 100%; flex: none; }
[data-sim="stratis-lab"] .st-seg.st-meta { background: var(--ink); }
[data-sim="stratis-lab"] .st-seg.st-over {
  background-image: repeating-linear-gradient(45deg, transparent 0 0.35em, var(--danger) 0.35em 0.6em);
}
[data-sim="stratis-lab"] .st-mark { position: absolute; top: 0; bottom: 0; border-left: 0.2rem solid var(--ink); }
[data-sim="stratis-lab"] .st-cap-keys { display: flex; flex-wrap: wrap; gap: 0 0.9rem; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="stratis-lab"] .st-cap-keys i { display: inline-block; width: 0.9em; height: 0.9em; margin-right: 0.25em; vertical-align: -0.1em; border: var(--line-w) solid var(--ink); }
[data-sim="stratis-lab"] .st-cap-keys i.st-meta { background: var(--ink); }
[data-sim="stratis-lab"] .st-cap-keys i.st-free { background: var(--bg); }
[data-sim="stratis-lab"] .st-cap-keys i.st-over {
  background-image: repeating-linear-gradient(45deg, transparent 0 0.2em, var(--danger) 0.2em 0.35em);
}
[data-sim="stratis-lab"] .st-ratio { font-size: var(--fs-sm); }

/* the commands */
[data-sim="stratis-lab"] .st-cmds {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0.4rem 0.6rem;
  overflow: auto;
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  font-family: var(--mono);
  font-size: var(--fs-sm);
  line-height: 1.3;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
[data-sim="stratis-lab"] .st-cmds .st-note { color: var(--muted); }
[data-sim="stratis-lab"] .st-cmds .st-fail { color: var(--danger); font-weight: 700; text-decoration: line-through; }
[data-sim="stratis-lab"] .st-cmds .st-fail-note { color: var(--danger); font-weight: 700; }

/* legend swatch for "failed or not created" */
[data-sim="stratis-lab"] .sd-legend li:nth-child(2) .sd-swatch { border-style: dashed; border-color: var(--danger); }

/* Phone and portrait: the stage grows with its content instead of a fixed height, one column. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="stratis-lab"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="stratis-lab"] .st { height: auto; gap: 0.8rem; padding: 0.8rem; }
  [data-sim="stratis-lab"] .st-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-sim="stratis-lab"] .st-body { grid-template-columns: minmax(0, 1fr); }
  [data-sim="stratis-lab"] .st-layer { grid-template-columns: minmax(0, 1fr); gap: 0.2rem; }
  [data-sim="stratis-lab"] .st-layer-label { text-align: left; }
  [data-sim="stratis-lab"] .st-cmds { flex: none; }
  [data-sim="stratis-lab"] .st-topo { overflow: visible; }
  [data-sim="stratis-lab"] .sd-presets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-sim="stratis-lab"] [data-sd-controls] .sd-group { grid-template-columns: minmax(0, 1fr); }
}
</style>

<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Stratis: topologija</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function dec(x) { return Simdeck.lang === 'hr' ? x.replace('.', ',') : x; }
  /** The original's fmtGiB: GiB below 1 TiB, then TiB with one decimal unless whole. */
  function gib(n) {
    if (n >= 1024) return dec((n / 1024).toFixed(n % 1024 ? 1 : 0)) + ' ' + t('unitTiB');
    return n + ' ' + t('unitGiB');
  }
  function data(tag, text, cls) { return h(tag, { translate: 'no', class: cls || null }, text); }

  var kindKey = {
    'local-hdd': 'kindLocalHdd', 'local-ssd': 'kindLocalSsd', 'local-nvme': 'kindLocalNvme', iscsi: 'kindIscsi',
    fc: 'kindFc', nvmetcp: 'kindNvmetcp', mdraid: 'kindMdraid', lvmlv: 'kindLvmlv', luks: 'kindLuks', mixed: 'kindMixed'
  };
  var encKey = { none: 'encNone', keyring: 'encKeyring', tang: 'encTang', tpm2: 'encTpm2' };
  var encLabel = { none: 'encLabelNone', keyring: 'encLabelKeyring', tang: 'encLabelTang', tpm2: 'encLabelTpm2' };
  var encSrc = { keyring: 'encSrcKeyring', tang: 'encSrcTang', tpm2: 'encSrcTpm2' };
  var labels = {
    local: 'presetLocal', mixed: 'presetMixed', iscsi: 'presetIscsi', fc: 'presetFc', nvmetcp: 'presetNvmetcp',
    encrypted: 'presetEncrypted', cache: 'presetCache', snapshot: 'presetSnapshot', nompath: 'presetNompath'
  };

  var params = [
    { key: 'kind', type: 'select', label: t('kind'),
      options: L.KIND_PARAMS.map(function (k) { return [k, t(kindKey[k])]; }) },
    { key: 'devices', type: 'range', label: t('devices'), min: 1, max: L.MAX_DEVICES, step: 1 },
    { key: 'devSize', type: 'range', label: t('devSize'), min: 100, max: 2000, step: 100, format: gib },
    { key: 'paths', type: 'choice', label: t('paths'), options: L.PATHS.map(function (n) { return [n, String(n)]; }),
      visible: L.hasRemote },
    { key: 'multipath', type: 'toggle', label: t('multipath'), visible: function (p) { return L.hasRemote(p) && p.paths > 1; } },
    { key: 'down', type: 'range', label: t('down'), min: 0, step: 1, max: function (p) { return p.paths; },
      visible: L.hasRemote },
    { key: 'encryption', type: 'select', label: t('encryption'),
      options: L.ENCRYPTION.map(function (e) { return [e, t(encKey[e])]; }) },
    { key: 'cache', type: 'range', label: t('cache'), min: 0, max: 1000, step: 100, format: gib },
    { key: 'logical', type: 'range', label: t('logical'), min: 100, max: 8000, step: 100, format: gib },
    { key: 'used', type: 'range', label: t('used'), min: 0, max: 4000, step: 10, format: gib },
    { key: 'overprov', type: 'toggle', label: t('overprov') },
    { key: 'snapshot', type: 'toggle', label: t('snapshot') },
    { key: 'written', type: 'range', label: t('written'), min: 0, max: 500, step: 10, format: gib,
      visible: function (p) { return p.snapshot; } }
  ];

  // ── the layers ──
  function node(c, title, sub, cls) {
    return h('div', { class: 'st-node' + (cls ? ' ' + cls : ''), dataset: c ? { c: String(c) } : {} },
      data('b', title), sub != null ? h('small', null, sub) : null);
  }
  function layer(label, nodes) {
    if (!nodes.length) return null;
    return h('div', { class: 'st-layer' }, h('div', { class: 'st-layer-label' }, label), h('div', { class: 'st-nodes' }, nodes));
  }
  /** Each data device keeps its own series colour through every layer; the cache device, the pool and the
      filesystems take the next ones. */
  var C_CACHE = 5, C_POOL = 6, C_FS = 7, C_MOUNT = 8;
  function dc(d) { return d.cache ? C_CACHE : d.index + 1; }

  function sourceOf(d) {
    var i = d.index + 1;
    if (d.cache) return t('srcCache');
    if (d.kind === 'iscsi') return t('srcIscsi', { i: i });
    if (d.kind === 'fc') return t('srcArray', { i: i });
    if (d.kind === 'nvmetcp') return t('srcNvme', { i: i });
    if (d.kind === 'mdraid') return t('srcMd', { i: i });
    if (d.kind === 'lvmlv') return t('srcLv', { i: i });
    if (d.kind === 'luks') return t('srcLuks', { i: i });
    return t('srcDisk', { i: i });
  }
  var pathKey = { iscsi: 'pathIscsi', fc: 'pathFc', nvmetcp: 'pathNvmetcp' };

  function topology(st) {
    var all = st.devices.concat(st.cacheDev ? [st.cacheDev] : []);
    var pool = st.pool;
    var layers = [];
    layers.push(layer(t('layerSource'), all.map(function (d) {
      return h('div', { class: 'st-node' + (d.online ? '' : ' st-down'), dataset: { c: String(dc(d)) } },
        h('b', null, sourceOf(d)), h('small', { translate: 'no' }, L.KINDS[d.kind].protocol + ' · ' + gib(d.size)));
    })));

    var paths = [];
    st.devices.forEach(function (d) {
      d.paths.forEach(function (x) {
        paths.push(h('div', { class: 'st-node' + (x.up ? '' : ' st-down'), dataset: { c: String(dc(d)) } },
          h('b', null, t(pathKey[d.kind], { i: x.index + 1 })),
          h('small', null, x.up ? t('pathUp') : t('pathDown'))));
      });
    });
    layers.push(layer(t('layerPath'), paths));

    var blocks = [];
    all.forEach(function (d) {
      if (d.cache) { blocks.push(node(dc(d), d.hostPath, t('blockCache', { size: gib(d.size) }))); return; }
      if (!d.paths.length) { blocks.push(node(dc(d), d.hostPath, t('blockSub', { kind: L.KINDS[d.kind].protocol, size: gib(d.size) }))); return; }
      d.paths.forEach(function (x, k) {
        var down = !x.up;
        var sub = d.duplicate && k > 0 ? t('blockDuplicate', { lun: d.index + 1 })
          : down ? t('pathDown') : d.paths.length > 1 ? t('blockPathOf', { i: k + 1, lun: d.index + 1 })
          : t('blockSub', { kind: L.KINDS[d.kind].protocol, size: gib(d.size) });
        blocks.push(node(dc(d), x.block, sub, down || (d.duplicate && k > 0) ? 'st-down' : (d.multipath ? 'st-member' : null)));
      });
    });
    layers.push(layer(t('layerBlock'), blocks));

    layers.push(layer(t('layerMpath'), st.devices.filter(function (d) { return d.multipath; }).map(function (d) {
      return node(dc(d), d.hostPath, d.online ? t('mpathSub', { up: d.upPaths, n: d.paths.length }) : t('mpathDownSub'),
        d.online ? null : 'st-down');
    })));

    if (pool.ok && pool.encryption !== 'none') {
      layers.push(layer(t('layerCrypt'), all.filter(function (d) { return !d.cache; }).map(function (d) {
        return node(dc(d), t('cryptNode', { i: d.index + 1 }), t(encLabel[pool.encryption]), d.online ? null : 'st-down');
      })));
    }

    var poolNode = !pool.ok ? node(null, pool.name, t('poolFailed'), 'st-down')
      : node(C_POOL, pool.name, pool.online ? t('poolSub', { size: gib(pool.capacity), enc: t(encLabel[pool.encryption]) }) : t('poolDown'),
        pool.online ? null : 'st-down');
    layers.push(layer(t('layerPool'), [poolNode]));

    if (pool.ok) {
      var inside = [];
      if (st.cacheDev) inside.push(node(C_POOL, 'dm-cache', t('cacheNode', { size: gib(pool.cache) }), 'st-member'));
      inside.push(node(C_POOL, 'dm-thin-pool', t('thinNode', { size: gib(pool.used) }), 'st-member'));
      layers.push(layer(t('layerInternal'), inside));
    }

    var fss = [], mounts = [];
    if (st.fs) {
      var fsName = pool.name + '/' + st.fs.name;
      if (!st.fs.ok) fss.push(node(null, fsName, t('fsFailed'), 'st-down'));
      else {
        var off = !pool.online;
        fss.push(node(C_FS, fsName, off ? t('offlineSub') : t('fsSub', { used: gib(st.fs.used), logical: gib(st.fs.logical) }), off ? 'st-down' : null));
        mounts.push(node(C_MOUNT, st.fs.mount, data('span', '/dev/stratis/' + fsName), off ? 'st-down' : null));
        if (st.snap) {
          fss.push(node(C_FS, pool.name + '/' + st.snap.name, off ? t('offlineSub') : t('snapSub', { shared: gib(st.snap.shared), own: gib(st.snap.own) }),
            off ? 'st-down' : 'st-member'));
          mounts.push(node(C_MOUNT, st.snap.mount, data('span', '/dev/stratis/' + pool.name + '/' + st.snap.name), off ? 'st-down' : null));
        }
      }
    }
    layers.push(layer(t('layerFs'), fss));
    layers.push(layer(t('layerMount'), mounts));
    return h('div', { class: 'st-topo' }, layers);
  }

  // ── capacity ──
  function seg(pct, cls, c, title) {
    return h('div', { class: 'st-seg ' + (cls || ''), dataset: c ? { c: String(c) } : {}, title: title || null,
      style: { width: Math.max(0, pct) + '%' } });
  }
  function capacity(st) {
    var cap = st.capacity;
    var out = [h('div', { class: 'st-h' }, t('capTitle'))];
    if (!cap) {
      out.push(h('div', { class: 'st-cap-label' }, t('capPhys', { cap: t('none') })));
      out.push(h('div', { class: 'st-bar' }));
      return h('div', { class: 'st-cap' }, out);
    }
    var meta = L.META_GIB, own = st.snap ? st.snap.own : 0, dataUsed = st.used - meta - own;
    var pc = function (x) { return x / cap * 100; };
    out.push(h('div', { class: 'st-cap-label' }, t('capPhys', { cap: gib(cap) })));
    out.push(h('div', { class: 'st-bar' },
      seg(pc(meta), 'st-meta', null, t('capMeta')),
      seg(pc(dataUsed), 'sd-fill', C_FS, t('capData')),
      own ? seg(pc(own), 'sd-fill sd-hatch', C_FS, t('capSnap')) : null));
    var keys = [h('span', null, h('i', { class: 'st-meta' }), t('capMeta') + ' ' + gib(meta)),
      h('span', null, h('i', { class: 'sd-fill', dataset: { c: String(C_FS) } }), t('capData') + ' ' + gib(dataUsed))];
    if (own) keys.push(h('span', null, h('i', { class: 'sd-fill sd-hatch', dataset: { c: String(C_FS) } }), t('capSnap') + ' ' + gib(own)));
    keys.push(h('span', null, h('i', { class: 'st-free' }), t('capFree', { free: gib(cap - st.used) })));
    out.push(h('div', { class: 'st-cap-keys' }, keys));

    var lg = st.logical, scale = Math.max(cap, lg);
    out.push(h('div', { class: 'st-cap-label' }, t('capLogical')));
    var bar = h('div', { class: 'st-bar' },
      seg(Math.min(lg, cap) / scale * 100, 'sd-soft', C_FS),
      lg > cap ? seg((lg - cap) / scale * 100, 'st-over') : null);
    if (lg > cap) bar.appendChild(h('div', { class: 'st-mark', style: { left: (cap / scale * 100) + '%' } }));
    out.push(bar);
    var lkeys = [h('span', null, h('i', { class: 'sd-soft', dataset: { c: String(C_FS) } }), gib(lg))];
    if (lg > cap) lkeys.push(h('span', null, h('i', { class: 'st-over' }), t('capOver') + ' ' + gib(lg - cap)));
    out.push(h('div', { class: 'st-cap-keys' }, lkeys));
    out.push(h('div', { class: 'st-ratio' },
      t('capRatio', { ratio: st.ratio == null ? t('none') : dec(st.ratio.toFixed(2)) + '×' }) + ' · ' +
      t(st.pool.noOver ? 'capPolicyFull' : 'capPolicyThin')));
    return h('div', { class: 'st-cap' }, out);
  }

  // ── commands ──
  var noteKey = { iscsi: 'noteIscsi', fc: 'noteFc', nvmetcp: 'noteNvmetcp' };
  function commands(st) {
    var lines = [h('span', { class: 'st-note' }, t('cmdNote')), '\n'];
    st.commands.forEach(function (c) {
      if (c.note) {
        lines.push(h('span', { class: 'st-note' }, t(noteKey[c.note], { paths: t.n('nPaths', c.paths), device: c.device }) +
          (c.multipath ? t('noteMpath') : '')), '\n');
      } else if (c.failed) {
        lines.push(h('span', { class: 'st-fail' }, c.cmd), '  ', h('span', { class: 'st-fail-note' }, t('cmdFailed')), '\n');
      } else lines.push(c.cmd, '\n');
    });
    return h('pre', { class: 'st-cmds', translate: 'no' }, lines);
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendDevice') },
      { shape: 'hollow', label: t('legendDown') },
      { c: C_POOL, label: t('legendPool') },
      { c: C_FS, label: t('legendFs') }
    ],

    render: function (c) {
      var st = c.state;
      var kpi = function (v, label) { return h('div', { class: 'st-kpi' }, data('b', v), h('span', null, label)); };
      var root = h('div', { class: 'st' },
        h('div', { class: 'st-kpis' },
          kpi(gib(st.raw), t('kpiRaw')),
          kpi(st.capacity ? gib(st.capacity) : t('none'), t('kpiData')),
          kpi(st.capacity ? gib(st.used) : t('none'), t('kpiUsed')),
          kpi(st.logical ? gib(st.logical) : t('none'), t('kpiLogical')),
          kpi(String(st.activePaths), t('kpiPaths'))),
        h('div', { class: 'st-body' },
          h('div', { class: 'st-col' }, h('div', { class: 'st-h' }, t('topoTitle')), topology(st)),
          h('div', { class: 'st-col' }, capacity(st), h('div', { class: 'st-h' }, t('cmdTitle')), commands(st))));
      c.stage.replaceChildren(root);
    },

    caption: function (c) {
      var st = c.state, p = c.params, pool = st.pool;
      var b = function (x) { return h('b', null, x); };
      var out = [];
      var add = function (parts) { if (out.length) out.push(' '); out = out.concat(parts); };
      if (p.kind === 'mixed' && st.devices.length > 1) add(t.parts('ruleMixed'));
      else {
        var k = st.devices[0].kind;
        if (L.KINDS[k].remote) add(t.parts('ruleRemote', { protocol: L.KINDS[k].protocol }));
        else if (L.KINDS[k].layered) add(t.parts('ruleLayered', { kind: t(kindKey[k]) }));
        else add(t.parts('ruleLocal'));
      }
      var net = st.devices.filter(function (d) { return d.remote; })[0];
      if (net && net.multipath) add(t.parts('mpathOn', { paths: t.n('nPaths', net.paths.length), device: data('span', net.hostPath) }));
      else if (net && net.paths.length === 1 && net.online) add(t.parts('mpathOne'));
      if (!pool.ok) {
        var dd = st.devices[pool.error.device];
        add(t.parts('poolDup', { device: data('span', dd.blocks[0]), paths: t.n('nPaths', pool.error.paths) }));
        return out;
      }
      add(t.parts('poolOk', { pool: data('span', pool.name), cap: b(gib(pool.capacity)) }));
      if (net && net.upPaths < net.paths.length) {
        if (net.online) add(t.parts('pathsDownOk', { down: net.paths.length - net.upPaths, n: net.paths.length, device: data('span', net.hostPath) }));
        else add(t.parts('pathsDownLost', { device: data('span', net.hostPath), pool: data('span', pool.name) }));
      }
      if (pool.encryption !== 'none') add(t.parts('encOn', { source: t(encSrc[pool.encryption]) }));
      if (st.cacheDev) add(t.parts('cacheOn', { size: b(gib(pool.cache)) }));
      var fs = st.fs;
      if (!fs.ok) {
        if (fs.error.code === 'noOver') add(t.parts('fsNoOver', { logical: b(gib(fs.error.logical)), cap: b(gib(fs.error.capacity)) }));
        else add(t.parts('fsNoSpace', { used: b(gib(fs.error.used)), free: b(gib(fs.error.free)) }));
        return out;
      }
      add(t.parts('fsOk', { fs: data('span', fs.name), logical: b(gib(fs.logical)), used: b(gib(fs.used)) }));
      if (st.ratio > 1) add(t.parts('overYes', { ratio: b(dec(st.ratio.toFixed(2)) + '×') }));
      else add(t.parts('overNo'));
      if (st.snap) {
        add(t.parts('snapOn', { snap: data('span', st.snap.name), fs: data('span', fs.name), shared: b(gib(st.snap.shared)), own: b(gib(st.snap.own)) }));
        if (st.snap.written !== st.snap.requested) add(t.parts('snapCapped', { requested: gib(st.snap.requested), written: gib(st.snap.written) }));
      }
      return out;
    }
  });
})();
</script>
</body>
</html>
