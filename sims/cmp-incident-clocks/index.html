     incident notification (72 h), GDPR's breach notification (72 h), and who files (office hours or on call, with the

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var C = window.SimdeckModels.clocks;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function date(hr) { var m = C.moment(hr, L.WEEK0); return t('dateFmt', { wd: t('wd' + m.wd), d: m.d, mon: t('mo' + m.m) }); }
  function time(hr) { var m = C.moment(hr, L.WEEK0); return t('timeFmt', { date: date(hr), hh: pad(m.hour) }); }
  function dur(n) {
    if (n < 24) return t.n('hoursN', n);
    var d = Math.floor(n / 24), r = n - d * 24;
    return r ? t('durDH', { d: t.n('daysN', d), h: t.n('hoursN', r) }) : t.n('daysN', d);
  }
  function b(text) { return h('b', null, text); }
  /** A time inside a stage label: hidden on a phone, where the table below keeps it. */
  function ti(hr) { return h('i', { translate: 'no' }, ' ' + time(hr)); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /** A label beside a mark at x: to the right, or to the left near the right edge. */
  function label(x, text, cls, top) {
    var side = x > 0.62 ? 'l' : 'r';
    return h('span', { class: 'ic-lbl' + (cls ? ' ' + cls : ''), dataset: { side: side }, style: { left: pct(x), top: top } }, text);
  }

  function background(ax, mode) {
    var out = [];
    ax.segs.forEach(function (s) {
      if (s.kind === 'gap') { out.push(h('div', { class: 'ic-gap', style: { left: pct(s.x0), width: pct(s.x1 - s.x0) } })); return; }
      var wd = C.moment(s.from, L.WEEK0).wd;
      out.push(h('div', { class: 'ic-day', dataset: { we: wd >= 5 ? '1' : '' }, style: { left: pct(s.x0), width: pct(s.x1 - s.x0) } }));
    });
    return out;
  }

  function nowLine(s, x) { return x === null ? null : h('div', { class: 'ic-now', style: { left: pct(x) } }); }

  function track(s, kids, x) {
    return h('div', { class: 'ic-track' }, background(s.axis), kids, nowLine(s, x));
  }
  function row(kind, lab, sub, s, kids, x) {
    return h('div', { class: 'ic-row', dataset: { k: kind } },
      h('div', { class: 'ic-lab' }, lab ? b(lab) : null, sub ? h('span', null, sub) : null),
      track(s, kids, x));
  }

  function axisRow(s, x) {
    var kids = s.axis.segs.map(function (g) {
      if (g.kind === 'gap') return h('span', { class: 'ic-dlab', dataset: { gap: '1' }, style: { left: pct(g.x0), width: pct(g.x1 - g.x0) } }, t.n('gapDays', g.days));
      var m = C.moment(g.from, L.WEEK0);
      return h('span', { class: 'ic-dlab', dataset: { we: m.wd >= 5 ? '1' : '' }, translate: 'no', style: { left: pct(g.x0), width: pct(g.x1 - g.x0) } },
        t('wd' + m.wd), h('i', null, ' ' + t('dateFmt', { wd: '', d: m.d, mon: t('mo' + m.m) }).trim()));
    });
    return h('div', { class: 'ic-row', dataset: { k: 'axis' } }, h('div', { class: 'ic-lab' }), h('div', { class: 'ic-track' }, kids));
  }

  function nowRow(x) {
    return h('div', { class: 'ic-row', dataset: { k: 'nowrow' } }, h('div', { class: 'ic-lab' }),
      h('div', { class: 'ic-track' }, x === null ? null : h('span', { class: 'ic-nowlab', style: { left: pct(Math.min(0.96, Math.max(0.04, x))) } }, t('mNow'))));
  }

  function seen(s, stage) { return L.STAGES.indexOf(s.stage) >= L.STAGES.indexOf(stage); }

  function incidentRow(s, x) {
    var ax = s.axis, kids = [];
    if (seen(s, 'attack')) {
      var xa = L.xOf(ax, s.attack);
      kids.push(h('span', { class: 'ic-pin', dataset: { m: 'attack' }, style: { left: pct(xa), top: '0.35rem' } }));
      kids.push(label(xa, t.parts('mAttack', { time: ti(s.attack) }), null, '0.3rem'));
    }
    if (seen(s, 'detect')) {
      var xd = L.xOf(ax, s.detected);
      kids.push(h('span', { class: 'ic-pin', dataset: { m: 'detect' }, style: { left: pct(xd), top: '2.35rem' } }));
      kids.push(label(xd, t.parts('mDetect', { time: ti(s.detected) }), null, '2.3rem'));
    }
    if (seen(s, 'aware')) {
      var x0 = L.xOf(ax, s.detected), x1 = L.xOf(ax, s.aware);
      kids.push(h('span', { class: 'ic-triage', style: { left: pct(x0), width: pct(x1 - x0), top: '4.65rem' } }));
      kids.push(h('span', { class: 'ic-pin', dataset: { m: 'aware' }, style: { left: pct(x1), top: '4.45rem' } }));
      kids.push(label(x1, t.parts('mAware', { time: ti(s.aware) }), null, '4.3rem'));
    }
    return row('inc', t('laneIncident'), null, s, kids, x);
  }

  function ghostRow(s, x) {
    var kids = [];
    if (seen(s, 'detect')) {
      var x0 = L.xOf(s.axis, s.attack), x1 = L.xOf(s.axis, s.ghost.due);
      kids.push(h('span', { class: 'ic-ghost', style: { left: pct(x0), width: pct(x1 - x0) } }, '✗'));
      kids.push(label(x1, t.parts('mGhost', { time: ti(s.ghost.due) }), 'ic-glab'));
    }
    return row('ghost', t('laneGhost'), t('laneGhostSub'), s, kids, x);
  }

  var LANE = { ew: 'Ew', notif: 'Notif', gdpr: 'Gdpr' };
  function clockRow(s, c, x) {
    var ax = s.axis, kids = [], k = LANE[c.id];
    var bc = c.regime === 'nis2' ? 'var(--c1)' : 'var(--c3)';
    if (c.status === 'off' && seen(s, 'aware')) {
      kids.push(h('span', { class: 'ic-offtxt' }, t(c.regime === 'nis2' ? 'mOffNis' : 'mOffGdpr')));
    } else if (c.status !== 'hidden' && c.status !== 'off') {
      var x0 = L.xOf(ax, c.start), x1 = L.xOf(ax, c.due), xn = L.xOf(ax, Math.min(s.now, c.due));
      kids.push(h('div', { class: 'ic-bar', style: { left: pct(x0), width: pct(x1 - x0), '--bc': bc } },
        h('span', { class: 'ic-fill', style: { width: pct(x1 > x0 ? (xn - x0) / (x1 - x0) : 0) } }),
        h('span', { class: 'ic-due', dataset: { on: s.now >= c.due ? '1' : '' } }, t('mDue', { time: time(c.due) }))));
      if (c.status === 'late' || c.status === 'overdue') {
        var xl = L.xOf(ax, Math.min(s.now, c.filed));
        kids.push(h('span', { class: 'ic-latebar', style: { left: pct(x1), width: pct(Math.max(0, xl - x1)) } }));
      }
      if (c.status === 'ok' || c.status === 'late') {
        var xf = L.xOf(ax, c.filed);
        kids.push(h('span', { class: 'ic-tick', style: { left: pct(xf) } }));
        kids.push(label(xf, c.status === 'ok' ? t.parts('mFiled', { time: ti(c.filed) }) : t.parts('mLate', { time: ti(c.filed), h: c.late }), 'ic-flab'));
      } else if (c.status === 'overdue') {
        kids.push(label(x1, t('mOverdue'), 'ic-flab'));
      }
    }
    return row('clock', t('lane' + k), t('lane' + k + 'Sub'), s, kids, x);
  }

  function workRow(s, x) {
    var ax = s.axis, kids = [];
    if (s.params.reporting === 'office') {
      ax.segs.forEach(function (g) {
        if (g.kind !== 'day' || C.moment(g.from, L.WEEK0).wd >= 5) return;
        var a = L.xOf(ax, g.from + C.OFFICE.from), z = L.xOf(ax, g.from + C.OFFICE.to);
        kids.push(h('span', { class: 'ic-off', style: { left: pct(a), width: pct(z - a) } }));
      });
    } else {
      kids.push(h('span', { class: 'ic-off', style: { left: '0', width: '100%' } }));
    }
    if (s.now !== null) {
      s.work.forEach(function (w) {
        if (w.from >= s.now) return;
        var a = L.xOf(ax, w.from), z = L.xOf(ax, Math.min(w.to, s.now));
        kids.push(h('span', { class: 'ic-work', style: { left: pct(a), width: 'max(0.3rem, ' + pct(z - a) + ')' } }));
      });
    }
    return row('work', t('laneWork'), t(s.params.reporting === 'office' ? 'laneWorkOffice' : 'laneWorkOncall'), s, kids, x);
  }

  // ── the table ──

  var NOW_ROWS = { day1: ['ew'], day3: ['notif', 'gdpr'], final: ['final'] };
  function rowNow(s, c) {
    if (s.stage === 'day3' && c.id === 'ew') return c.running && c.inTime === false;
    return (NOW_ROWS[s.stage] || []).indexOf(c.id) >= 0 && c.running;
  }
  function result(s, c) {
    switch (c.status) {
      case 'off': return ['off', t('resOff')];
      case 'hidden': return ['wait', t('resWait')];
      case 'set': return ['set', ['ok', 'late'].indexOf(L.clock(s, 'notif').status) >= 0 ? t('resFinal') : t('resFinalWait')];
      case 'ok': return ['ok', t('resOk', { h: c.spare })];
      case 'late': return ['late', t(c.id === 'gdpr' ? 'resLateGdpr' : 'resLate', { h: c.late })];
      case 'overdue': return ['overdue', t('resOverdue')];
      default: return ['running', t('resRunning')];
    }
  }
  function table(s) {
    var order = ['ew', 'notif', 'final', 'gdpr'];
    var rows = order.map(function (id) {
      var c = L.clock(s, id), k = cap(id), r = result(s, c);
      var shown = c.status !== 'off' && c.status !== 'hidden';
      var ns = L.clock(s, 'notif').status;
      var finalKnown = shown && (ns === 'ok' || ns === 'late');
      var start = !shown ? '–' : id === 'final' ? (finalKnown ? time(c.start) : '–') : time(c.start);
      var due = !shown ? '–' : id === 'final' ? (finalKnown ? time(c.due) : '–') : time(c.due);
      var filed = id === 'final' || !shown ? '–' : (c.status === 'ok' || c.status === 'late') ? time(c.filed) : '–';
      return h('tr', { dataset: { now: rowNow(s, c) ? '1' : '' } },
        h('td', null, b(t('row' + k)), h('span', null, t('row' + k + 'Sub'))),
        h('td', { translate: 'no' }, start), h('td', { translate: 'no' }, due), h('td', { translate: 'no' }, filed),
        h('td', { class: 'ic-res', dataset: { r: r[0] } }, r[1]));
    });
    return h('div', { class: 'ic-tabwrap' }, h('table', { class: 'ic-tab' },
      h('thead', null, h('tr', null, ['thClock', 'thStart', 'thDue', 'thFiled', 'thResult'].map(function (k) { return h('th', null, t(k)); }))),
      h('tbody', null, rows)));
  }

  function render(c) {
    var s = c.state;
    var x = s.now === null || s.now > s.axis.to ? null : L.xOf(s.axis, s.now);
    c.stage.replaceChildren(h('div', { class: 'ic' },
      h('div', { class: 'ic-tl' },
        axisRow(s, x), incidentRow(s, x), ghostRow(s, x),
        s.clocks.filter(function (k) { return k.id !== 'final'; }).map(function (k) { return clockRow(s, k, x); }),
        workRow(s, x), nowRow(x)),
      table(s),
      h('p', { class: 'ic-foot' }, t('foot'))));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state;
    var ew = L.clock(s, 'ew'), no = L.clock(s, 'notif'), fin = L.clock(s, 'final'), gd = L.clock(s, 'gdpr');
    var ewWork = s.work.filter(function (w) { return w.id === 'ew'; })[0];
    var hourly = [ew, no, gd].filter(function (k) { return k.running; });
    var v = {
      attack: b(time(s.attack)), detected: b(time(s.detected)), aware: b(time(s.aware)),
      detectAfter: b(dur(s.detected - s.attack)), triage: b(dur(s.aware - s.detected)),
      ghostDue: b(time(s.ghost.due)), ghostAgo: b(dur(Math.max(0, s.ghost.beforeDetect))),
      met: b(String(s.met)), total: b(String(hourly.length)),
      missed: b(hourly.filter(function (k) { return !k.inTime; }).map(function (k) { return t('name' + cap(k.id)); }).join(', '))
    };
    [ew, no, gd].forEach(function (k) {
      if (!k.running) return;
      v[k.id + 'Due'] = b(time(k.due));
      v[k.id + 'Filed'] = b(time(k.filed));
      v[k.id + 'Late'] = b(t.n('hoursN', k.late));
    });
    if (ewWork) v.ewWork = b(time(ewWork.from));
    v.due72 = b(time(s.aware + 72));
    if (fin.running) { v.finalFrom = b(time(fin.start)); v.finalDue = b(time(fin.due)); }
    var out = [];
    L.captionKeys(s).forEach(function (k, i) {
      if (i) out.push(' ');
      out = out.concat(t.parts(k, v));
    });
    return out;
  }

  // ── controls ──

  var params = [
    { key: 'day', type: 'select', label: t('pDay'), options: [0, 1, 2, 3, 4, 5, 6].map(function (d) { return [d, t('dayL' + d)]; }) },
    { key: 'hour', type: 'range', label: t('pHour'), min: 0, max: 23, step: 1, format: function (v) { return t('clockFmt', { hh: pad(v) }); } },
    { key: 'detect', type: 'range', label: t('pDetect'), min: 0, max: 168, step: 1, format: dur },
    { key: 'triage', type: 'range', label: t('pTriage'), min: 1, max: 24, step: 1, format: dur },
    { key: 'significant', type: 'toggle', label: t('pSignificant') },
    { key: 'personal', type: 'toggle', label: t('pPersonal') },
    { key: 'reporting', type: 'choice', label: t('pReporting'), options: [['office', t('oOffice')], ['oncall', t('oOncall')]] }
  ];

  var labels = { tuesday: 'prTuesday', 'found-late': 'prFoundLate', friday: 'prFriday', 'on-call': 'prOnCall',
    'slow-triage': 'prSlowTriage', 'data-only': 'prDataOnly' };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
      { c: 1, label: t('legNis') },
      { c: 3, label: t('legGdpr') },
      { shape: 'ic-late', label: t('legLate') },
      { shape: 'ic-we', label: t('legWeekend') },
      { shape: 'ic-work', label: t('legWork') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
