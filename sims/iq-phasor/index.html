<style>

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">I/Q kazaljka</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="ph-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // A number with a real minus sign, not a hyphen.
  function sgn(x) { return x < 0 ? '−' + String(-x) : String(x); }
  function pct(x) { return t('pct', { v: sgn(x) }); }
  function deg(x) { return t('deg', { v: sgn(x) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function pts(list) { return list.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }

  var presetKeys = { start: 'presetStart', ionly: 'presetIonly', qonly: 'presetQonly', reverse: 'presetReverse',
    minus45: 'presetMinus45', none: 'presetNone' };
  var axisKeys = { 'i+': 'axisIpos', 'i-': 'axisIneg', 'q+': 'axisQpos', 'q-': 'axisQneg' };

  // An axis line with an arrow head at (x1, y1).
  function axis(svg, x0, y0, x1, y1, d) {
    var len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    svg.append(s('line', { class: 'ph-axis', x1: x0, y1: y0, x2: x1 - ux * d, y2: y1 - uy * d }));
    svg.append(s('path', { class: 'ph-axhead', d: 'M' + x1 + ',' + y1 + 'L' + (x1 - ux * d - uy * d * 0.45) + ',' + (y1 - uy * d + ux * d * 0.45) +
      'L' + (x1 - ux * d + uy * d * 0.45) + ',' + (y1 - uy * d - ux * d * 0.45) + 'Z' }));
  }

  // ── the geometry, from the plot's size: the I/Q plane top left, the Q (sine) strip to its right on the same height,
  //    the I (cosine) strip below it on the same width. Both strips use the plane's scale, so each projection line is
  //    straight; each strip runs one carrier period, 0 … 360° of ωt. ──
  function layout(W, H, rem) {
    var m = 1.2 * rem, g = 2.4 * rem, top = 1.8 * rem, bottom = 1.6 * rem, left = 0.6 * rem;
    var r = Math.min((H - top - bottom - g - 2 * m) / 3.3, (W - left - g - 2 * m) / 4.2);
    r = Math.max(r, 2 * rem);
    var cx = m + left + r, cy = m + top + r;
    return {
      r: r, cx: cx, cy: cy, rem: rem,
      xs: cx + r + g, xe: W - m - 0.6 * rem,                     // the Q strip, left to right
      ys: cy + r + g, ye: H - m - bottom                         // the I strip, top to bottom
    };
  }

  function draw(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return null;
    var rem = remPx(), G = layout(W, H, rem), r = G.r, cx = G.cx, cy = G.cy;
    var P = function (v) { return v / 100 * r; };
    var Xq = function (wt) { return G.xs + wt / 360 * (G.xe - G.xs); };
    var Yi = function (wt) { return G.ys + wt / 360 * (G.ye - G.ys); };
    var tipX = cx + P(st.i), tipY = cy - P(st.q);
    var curX = Xq(st.wt), curY = Yi(st.wt);
    var tr = L.trace(st.a, st.phi);
    var done = tr.filter(function (p) { return p.wt <= st.wt + 1e-9; });
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var ah = 0.7 * rem;

    // the I/Q plane: grid at ±100 %, the 100 % circle, the circle the tip runs on, the axes
    [-100, 100].forEach(function (v) {
      svg.append(s('line', { class: 'ph-grid', x1: cx + P(v), x2: cx + P(v), y1: cy - r, y2: cy + r }));
      svg.append(s('line', { class: 'ph-grid', y1: cy + P(v), y2: cy + P(v), x1: cx - r, x2: cx + r }));
    });
    svg.append(s('circle', { class: 'ph-circle', cx: cx, cy: cy, r: r }));
    if (!st.none && st.a < 100) svg.append(s('circle', { class: 'ph-path', cx: cx, cy: cy, r: P(st.a) }));
    axis(svg, cx - r - 0.5 * rem, cy, cx + r + 1.2 * rem, cy, ah);
    axis(svg, cx, cy + r + 0.5 * rem, cx, cy - r - 1.2 * rem, ah);
    svg.append(s('text', { class: 'ph-title', x: cx + r + 1.2 * rem, y: cy + 1.5 * rem, 'text-anchor': 'middle', translate: 'no' }, 'I'));
    svg.append(s('text', { class: 'ph-title', x: cx - 0.6 * rem, y: cy - r - 0.6 * rem, 'text-anchor': 'end', translate: 'no' }, 'Q'));

    // the Q strip: zero line as the time axis, ±100 % guides, the sine over one period (the part already run bold)
    svg.append(s('line', { class: 'ph-grid', x1: G.xs, x2: G.xe, y1: cy - r, y2: cy - r }));
    svg.append(s('line', { class: 'ph-grid', x1: G.xs, x2: G.xe, y1: cy + r, y2: cy + r }));
    svg.append(s('line', { class: 'ph-axis', x1: G.xs, x2: G.xs, y1: cy - r, y2: cy + r }));
    axis(svg, G.xs, cy, G.xe + 0.6 * rem, cy, ah);
    svg.append(s('text', { class: 'ph-title ph-halo', 'data-row': 'q', x: G.xs + 0.4 * rem, y: cy - r - 0.6 * rem }, t('waveQ')));
    svg.append(s('text', { class: 'ph-halo', x: G.xe + 0.6 * rem, y: cy + r + 1.4 * rem, 'text-anchor': 'end' }, t('timeRight')));
    svg.append(s('text', { class: 'ph-halo', x: G.xs - 0.4 * rem, y: cy - r + 0.4 * rem, 'text-anchor': 'end', translate: 'no' }, pct(100)));

    // the I strip: zero line as the time axis (downwards), ±100 % guides, the cosine over one period
    svg.append(s('line', { class: 'ph-grid', y1: G.ys, y2: G.ye, x1: cx - r, x2: cx - r }));
    svg.append(s('line', { class: 'ph-grid', y1: G.ys, y2: G.ye, x1: cx + r, x2: cx + r }));
    svg.append(s('line', { class: 'ph-axis', y1: G.ys, y2: G.ys, x1: cx - r, x2: cx + r }));
    axis(svg, cx, G.ys, cx, G.ye + 0.6 * rem, ah);
    svg.append(s('text', { class: 'ph-title ph-halo', 'data-row': 'i', x: cx + r + 0.6 * rem, y: G.ys + 0.4 * rem }, t('waveI')));
    svg.append(s('text', { class: 'ph-halo', x: cx + 0.6 * rem, y: G.ye + 0.6 * rem }, t('timeDown')));

    if (!st.none) {
      svg.append(s('polyline', { class: 'ph-wave ph-rest', 'data-row': 'q', points: pts(tr.map(function (p) { return [Xq(p.wt), cy - P(p.q)]; })) }));
      svg.append(s('polyline', { class: 'ph-wave ph-rest', 'data-row': 'i', points: pts(tr.map(function (p) { return [cx + P(p.i), Yi(p.wt)]; })) }));
      if (done.length > 1) {
        svg.append(s('polyline', { class: 'ph-wave', 'data-row': 'q', points: pts(done.map(function (p) { return [Xq(p.wt), cy - P(p.q)]; })) }));
        svg.append(s('polyline', { class: 'ph-wave', 'data-row': 'i', points: pts(done.map(function (p) { return [cx + P(p.i), Yi(p.wt)]; })) }));
      }
    } else {
      svg.append(s('line', { class: 'ph-wave', 'data-row': 'q', x1: G.xs, x2: G.xe, y1: cy, y2: cy }));
      svg.append(s('line', { class: 'ph-wave', 'data-row': 'i', x1: cx, x2: cx, y1: G.ys, y2: G.ye }));
    }

    if (!st.none) {
      // the start position at t = 0 and the angle φ, kept while the phasor turns
      var sx = cx + P(st.i0), sy = cy - P(st.q0);
      if (st.n > 0) svg.append(s('line', { class: 'ph-start', x1: cx, y1: cy, x2: sx, y2: sy }));
      var ar = Math.min(2.4 * rem, 0.45 * P(st.a));
      if (st.phi !== 0 && ar > 0.6 * rem) {
        var a1 = -st.phi * Math.PI / 180;
        svg.append(s('path', { class: 'ph-arc', d: 'M' + (cx + ar) + ',' + cy + 'A' + ar + ',' + ar + ' 0 ' + (Math.abs(st.phi) > 180 ? 1 : 0) + ',' +
          (st.phi > 0 ? 0 : 1) + ' ' + (cx + ar * Math.cos(a1)) + ',' + (cy + ar * Math.sin(a1)) }));
        var am = a1 / 2, lr = ar + 1.1 * rem, side = Math.abs(Math.cos(am)) < 0.3;
        svg.append(s('text', { class: 'ph-halo', x: cx + lr * Math.cos(am) + (side ? 0.3 * rem : 0), y: cy + lr * Math.sin(am) + 0.35 * rem,
          'text-anchor': side ? 'start' : 'middle', translate: 'no' }, 'φ'));
      }
      // the two parts on the axes: I along the horizontal axis, Q along the vertical one
      if (st.i !== 0) svg.append(s('line', { class: 'ph-part', 'data-row': 'i', x1: cx, y1: cy, x2: tipX, y2: cy }));
      if (st.q !== 0) svg.append(s('line', { class: 'ph-part', 'data-row': 'q', x1: cx, y1: cy, x2: cx, y2: tipY }));
      // the projections: from the tip across to the sine and down to the cosine, at the current ωt
      svg.append(s('line', { class: 'ph-proj', 'data-row': 'q', x1: tipX, y1: tipY, x2: curX, y2: tipY }));
      svg.append(s('line', { class: 'ph-proj', 'data-row': 'i', x1: tipX, y1: tipY, x2: tipX, y2: curY }));
      // the phasor
      var len = P(st.a), ux = (tipX - cx) / len, uy = (tipY - cy) / len, hd = Math.min(1 * rem, len / 2);
      svg.append(s('line', { class: 'ph-vec', x1: cx, y1: cy, x2: tipX - ux * hd * 0.8, y2: tipY - uy * hd * 0.8 }));
      svg.append(s('path', { class: 'ph-head', d: 'M' + tipX + ',' + tipY +
        'L' + (tipX - ux * hd - uy * hd * 0.5) + ',' + (tipY - uy * hd + ux * hd * 0.5) +
        'L' + (tipX - ux * hd + uy * hd * 0.5) + ',' + (tipY - uy * hd - ux * hd * 0.5) + 'Z' }));
      if (st.n > 0) svg.append(s('circle', { class: 'ph-startdot', cx: sx, cy: sy, r: 0.4 * rem }));
    }
    // the current values on the two waves
    svg.append(s('circle', { class: 'ph-dot', 'data-row': 'q', cx: curX, cy: tipY, r: 0.45 * rem }));
    svg.append(s('circle', { class: 'ph-dot', 'data-row': 'i', cx: tipX, cy: curY, r: 0.45 * rem }));
    box.replaceChildren(svg);
    return G;
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'a', type: 'range', label: t('a'), hint: t('aHint'), min: L.A_MIN, max: L.A_MAX, step: L.A_STEP, format: pct },
      { key: 'phi', type: 'range', label: t('phi'), hint: t('phiHint'), min: L.PHI_MIN, max: L.PHI_MAX, step: L.PHI_STEP, format: deg }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: 0 }; }),
    legend: [
      { c: 2, label: t('legendPhasor') },
      { c: 1, label: t('legendI') },
      { c: 3, label: t('legendQ') },
      { c: 8, shape: 'hollow', label: t('legendStart') }
    ],

    render: function (c) {
      var st = c.state;
      var plot = h('div', { class: 'ph-plot' });
      var read = h('div', { class: 'ph-read' },
        h('div', null,
          h('h2', null, t('readNow')),
          h('p', { translate: 'no' }, t('readWt', { v: deg(st.wt) })),
          h('p', { translate: 'no' }, t('readI', { v: pct(st.iRound) })),
          h('p', { translate: 'no' }, t('readQ', { v: pct(st.qRound) }))),
        h('div', null,
          h('h2', null, t('readStart')),
          h('p', { translate: 'no' }, t('readA', { v: pct(st.a) })),
          h('p', { translate: 'no' }, t('readPhi', { v: deg(st.phi) })),
          h('p', { translate: 'no' }, t('readI', { v: pct(L.roundPct(st.i0)) })),
          h('p', { translate: 'no' }, t('readQ', { v: pct(L.roundPct(st.q0)) }))));
      c.stage.replaceChildren(h('div', { class: 'ph' }, plot, read));
      var G = draw(plot, st);
      // On a wide stage the readout sits in the free corner, right of the cosine strip, below the sine strip.
      if (G && getComputedStyle(read).position === 'absolute') {
        read.style.left = (G.cx + G.r + 2.4 * G.rem) + 'px';
        read.style.top = (G.ys + 2.2 * G.rem) + 'px';
      }
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      // A node can be placed only once, so a value used twice gets two keys (wt, turn).
      var v = {
        zero: b(pct(0)), a: b(pct(st.a)), phi: b(deg(st.phi)), wt: b(deg(st.wt)), turn: b(deg(st.wt)), angle: b(deg(st.angle)),
        i: b(pct(st.iRound)), q: b(pct(st.qRound))
      };
      if (st.none) return t.parts('captionNone', v);
      var parts = t.parts(st.n === 0 ? 'captionStart' : st.full ? 'captionFull' : 'captionTurn', v);
      return st.axis && !st.full ? [parts, t(axisKeys[st.axis])] : parts;
    }
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
