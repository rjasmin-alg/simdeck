<!-- win-admx-store: two admin machines (left ADM-A with the newer templates, right ADM-B with the older ones), each with
     its local PolicyDefinitions folder (hatched and marked "ignored" once a Central Store exists) and its editor's view of
     one GPO: three rows, each shown by name (✓, with an en-US tag when it fell back), as Extra Registry Settings (?) or
     failing to load (✕). In the middle SYSVOL: the optional Central Store (a cylinder), the GPO's Registry.pol with the
     three values, and a client that applies all three. Below, a card says where a clicked setting's definition came from.
     An explorer: every param recomputes the scene. Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var HR = Simdeck.lang === 'hr';

  var NUM = {};
  L.VALUES.forEach(function (v, i) { NUM[v.id] = i + 1; });

  // ── small builders: data in translate="no", English terms in italics on the Croatian page ──
  function data(text, cls) { return h('span', { class: cls || 'ax-mono', translate: 'no' }, text); }
  function term(text) { return HR ? h('em', { lang: 'en' }, text) : text; }
  var CS = t('csTerm'), ERS = t('extraRow');
  function file(name, ext) { return name + '.' + (ext || 'admx'); }
  function shortKey(v) { var parts = v.key.split('\\'); return v.hive + '\\…\\' + parts[parts.length - 1]; }
  function fullKey(v) { return v.hive + '\\' + v.key; }
  function valueText(v) { return v.name + ' = ' + v.data; }
  function settingName(v, lang) { return t('name_' + v.id + '_' + lang.slice(0, 2)); }
  function chip(kind, text, extra) {
    var c = kind === 'admx' ? '1' : kind === 'adml' ? '3' : '';
    return h('span', Object.assign({ class: 'ax-chip', dataset: Object.assign({ k: kind, c: c }, extra || {}), translate: 'no' }), text);
  }
  function filesOf(set) { return Object.keys(L.SETS[set]); }

  // ── "changed": the state before the last param change, the selection left out ──
  var ready = false, prev = null, cur = null, curKey = null;
  function keyOf(p) { return JSON.stringify([p.store, p.uiLang, p.hrAdml]); }

  // ── a template location: its set, ADMX chips and ADML folders ──
  function setLines(set, langs, isStore) {
    var langChips = L.LANGS.map(function (lang) {
      var s = langs[lang];
      var note = !isStore ? null : !s ? 'storeHrNone' : s !== set ? 'storeHrOld' : null;
      var c = !s ? chip('none', lang) : chip('adml', lang, s !== set ? { stale: '' } : null);
      if (note) c.append(h('span', { class: 'ax-hrnote' }, t(note)));
      return c;
    });
    return [
      h('div', { class: 'ax-files' }, h('span', { class: 'ax-kind', translate: 'no' }, t('admxLabel')),
        filesOf(set).map(function (f) { return chip('admx', f); })),
      h('div', { class: 'ax-files' }, h('span', { class: 'ax-kind', translate: 'no' }, t('admlLabel')), langChips)
    ];
  }

  // ── one admin machine: head, local folder, where the editor reads, the editor ──
  function machine(e, s, changed) {
    var a = L.admin(e.admin);
    var folder = h('div', { class: 'ax-box ax-folder', dataset: e.localIgnored ? { ignored: '' } : {} },
      e.localIgnored ? h('span', { class: 'ax-ignored' }, '✕ ', t('ignored')) : null,
      h('div', { class: 'ax-bhead' }, h('span', null, t('localFolder')), h('span', { class: 'ax-set' }, t('set_' + e.localSet))),
      h('div', { class: 'ax-path' }, data(L.LOCAL_PATH)),
      setLines(e.localSet, { 'en-US': e.localSet, 'hr-HR': e.localSet }));
    var arrow = e.from === 'store' ? (e.admin === 'A' ? '⟶' : '⟵') : '↑';
    var src = h('span', { class: 'ax-src', dataset: { from: e.from } },
      h('span', { class: 'ax-arrow', 'aria-hidden': 'true' }, arrow),
      h('span', null, t('from_' + e.from)));
    var rows = e.rows.map(function (r) { return editorRow(e, r, s, changed); });
    var editorBox = h('div', { class: 'ax-box ax-editor', dataset: { from: e.from } },
      h('div', { class: 'ax-bhead' }, h('span', null, t('editor')), data(s.uiLang, 'ax-muted'), src),
      h('div', { class: 'ax-rows' }, rows));
    return h('div', { class: 'ax-col', dataset: { admin: e.admin } },
      h('div', { class: 'ax-mhead' }, data(a.name, 'ax-mname'), h('span', { class: 'ax-muted' }, t(a.set === 'new' ? 'newer' : 'older'))),
      folder, editorBox);
  }

  function editorRow(e, r, s, changed) {
    var v = L.value(r.id), id = e.admin + ':' + r.id;
    var what, mark, label;
    if (r.show === 'named') {
      mark = '✓';
      label = settingName(v, r.adml.lang);
      what = [h('span', { translate: 'no', lang: r.adml.lang.slice(0, 2) }, label),
        r.adml.fallback ? h('span', { class: 'ax-tag' }, t('fallbackTag'), ' ', data('en-US', '')) : null];
    } else if (r.show === 'extra') {
      mark = '?';
      label = ERS + ' · ' + fullKey(v);
      what = [h('span', { translate: 'no', lang: 'en' }, ERS), h('span', { class: 'ax-key', translate: 'no' }, shortKey(v) + ' · ' + valueText(v))];
    } else {
      mark = '✕';
      label = t('errorRow', { file: file(r.admx) });
      what = [h('span', null, t.parts('errorRow', { file: data(file(r.admx)) }))];
    }
    var cls = 'ax-row' + (changed.indexOf(id) >= 0 ? ' sd-changed' : '');
    return h('button', {
      type: 'button', class: cls, dataset: { pick: id, show: r.show }, 'aria-pressed': s.selected === id ? 'true' : 'false',
      'aria-label': t('rowLabel', { n: NUM[r.id], what: label })
    },
      h('span', { class: 'ax-num', 'aria-hidden': 'true' }, String(NUM[r.id])),
      h('span', { class: 'ax-mark', dataset: { show: r.show }, 'aria-hidden': 'true' }, mark),
      h('span', { class: 'ax-what' }, what));
  }

  // ── SYSVOL: the store, the GPO and the client ──
  function sysvol(s) {
    var st = s.store;
    var storeBox = st
      ? h('div', { class: 'ax-store' },
          h('div', { class: 'ax-bhead' }, h('span', null, t('storeHead')), h('span', { class: 'ax-set' }, t('set_' + st.set))),
          h('div', { class: 'ax-path' }, data(L.STORE_PATH)),
          setLines(st.set, st.langs, true))
      : h('div', { class: 'ax-store', dataset: { none: '' } },
          h('div', { class: 'ax-bhead' }, h('span', null, t('storeHead'))),
          h('div', { class: 'ax-path' }, data(L.STORE_PATH)),
          h('p', { class: 'ax-note' }, t('storeNone')));
    var gpo = h('div', { class: 'ax-box' },
      h('div', { class: 'ax-bhead' }, t('gpoHead')),
      h('div', { class: 'ax-vals' }, L.VALUES.map(function (v) {
        return h('div', { class: 'ax-val' },
          h('span', { class: 'ax-num', 'aria-hidden': 'true' }, String(NUM[v.id])),
          h('span', { class: 'ax-key', translate: 'no' }, shortKey(v) + ' · ' + valueText(v)));
      })),
      h('div', { class: 'ax-client' },
        h('span', { class: 'ax-mark', 'aria-hidden': 'true' }, '✓'),
        h('span', { class: 'ax-cline' }, h('b', null, t('clientHead')), ' ', t.n('clientLine', s.client.length, { total: L.VALUES.length }))));
    return h('div', { class: 'ax-col ax-sysvol' },
      h('div', { class: 'ax-mhead' }, data('SYSVOL', 'ax-mname'), data(L.DOMAIN, 'ax-muted')),
      storeBox, gpo);
  }

  // ── the card: where the clicked setting's definition came from ──
  function card(s) {
    var x = L.selectedRow(s);
    if (!x) return h('div', { class: 'ax-card', dataset: { empty: '' } }, t('cardHint'));
    var e = x.editor, r = x.row, v = x.value, name = L.admin(e.admin).name;
    var admx;
    if (r.show === 'extra') {
      var localHas = e.localIgnored && L.SETS[e.localSet][r.admx] !== undefined;
      admx = [h('span', { class: 'ax-warn' }, t.parts('cardAdmxMissing', { file: data(file(r.admx)), where: t('where_' + e.from) })),
        localHas ? [' · ', h('span', { class: 'ax-muted' }, t('cardLocalIgnored', { admin: name, set: t('set_' + e.localSet) }))] : null];
    } else {
      admx = data(e.path + '\\' + file(r.admx));
    }
    var adml;
    if (!r.adml) adml = h('span', { class: 'ax-muted' }, t('cardNotRead'));
    else if (r.adml.ok) {
      adml = [data(e.path + '\\' + r.adml.lang + '\\' + file(r.admx, 'adml')),
        r.adml.fallback ? [' ', h('span', { class: 'ax-warn' }, '(', t('cardFallback'), ')')] : null];
    } else if (r.adml.reason === 'revision') {
      adml = [data(e.path + '\\' + r.adml.lang + '\\' + file(r.admx, 'adml')), ' ', h('span', { class: 'ax-bad' }, '(', t('cardStale'), ')')];
    } else {
      adml = h('span', { class: 'ax-bad' }, t('cardNoAdml', { lang: s.uiLang }));
    }
    var says = r.show === 'named' ? t('cardNamed') : r.show === 'extra' ? t.parts('cardExtra', { ers: term(ERS) }) : t('cardError');
    return h('dl', { class: 'ax-card' },
      h('div', { class: 'ax-chead' }, h('b', null, t.parts('cardHead', { admin: data(name, ''), n: String(NUM[r.id]) })), ': ', says),
      h('dt', null, t.parts('cardValue', { pol: data((v.hive === 'HKCU' ? 'User' : 'Machine') + '\\Registry.pol', '') })), h('dd', null, data(fullKey(v) + ' · ' + valueText(v))),
      h('dt', { translate: 'no' }, t('cardAdmx')), h('dd', null, admx),
      h('dt', { translate: 'no' }, t('cardAdml')), h('dd', null, adml));
  }

  // ── caption ──
  function caption(s) {
    var x = s.situation;
    var vars = { cs: term(CS), ers: term(ERS) };
    if (x.kind === 'error') return t.parts(x.both ? 'cap_errorBoth' : 'cap_error', Object.assign(vars, { admin: data(L.admin(x.admin).name, ''), file: data(file(x.file)) }));
    if (x.kind === 'disagree' || x.kind === 'storeOld') {
      return t.parts('cap_' + x.kind, Object.assign(vars, { admin: data(L.admin(x.admin).name, ''), nth: h('b', null, t('ord_' + x.value)) }));
    }
    return t.parts('cap_' + x.kind, vars);
  }

  /** Keep keyboard focus on the same row across the re-render. */
  function focusKey() {
    var a = document.activeElement;
    return a && a.dataset && a.dataset.pick ? '[data-pick="' + a.dataset.pick + '"]' : null;
  }

  var root = h('div', { class: 'ax' });
  root.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-pick]');
    if (!b || !window.simdeck) return;
    var id = b.dataset.pick;
    window.simdeck.set({ sel: window.simdeck.params.sel === id ? '' : id });
  });

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'store', type: 'choice', label: t('store'), options: L.STORES.map(function (x) { return [x, t('store_' + x)]; }) },
      { key: 'uiLang', type: 'choice', label: t('uiLang'), options: L.LANGS.map(function (x) { return [x, x]; }) },
      { key: 'hrAdml', type: 'choice', label: t('hrAdml'), options: L.HR_ADML.map(function (x) { return [x, t('hrAdml_' + x)]; }),
        disabled: function (p) { return p.store === 'none' ? t('hrAdmlOff') : false; } },
      { key: 'sel', type: 'select', label: t('hidden'), options: L.selIds().map(function (x) { return [x, x || '-']; }), visible: function () { return false; } }
    ],

    presets: L.presets.map(function (pr) {
      return { id: pr.id, label: t('preset_' + pr.id), hint: t('hint_' + pr.id), params: pr.params };
    }),

    legend: [
      { shape: 'ax-admx', label: t('legendAdmx') },
      { shape: 'ax-adml', label: t('legendAdml') },
      { shape: 'ax-store', label: t('legendStore') },
      { shape: 'ax-named', label: t('legendNamed') },
      { shape: 'ax-extra', label: t('legendExtra') },
      { shape: 'ax-error', label: t('legendError') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var k = keyOf(c.params);
      if (!ready) { prev = null; cur = s; curKey = k; }
      else if (k !== curKey) { prev = cur; cur = s; curKey = k; }
      else cur = s;
      var changed = L.changedRows(prev, s);
      var keep = focusKey();
      root.replaceChildren(machine(s.editors[0], s, changed), sysvol(s), machine(s.editors[1], s, changed), card(s));
      if (root.parentNode !== c.stage) c.stage.replaceChildren(root);
      if (keep) { var el = root.querySelector(keep); if (el) el.focus({ preventScroll: true }); }
    },

    caption: function (c) { return caption(c.state); }
  });
  ready = true;
})();
</script>
</body>
</html>
