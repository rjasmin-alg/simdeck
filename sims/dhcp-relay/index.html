<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var seq = Simdeck.sequence;
  var ZERO = L.ZERO;
  var PLACE_KEY = { branch: 'Branch', sales: 'Sales', admin: 'Admin' };
  var SCOPE_NAME = { branch: 'segBranch', sales: 'segSales', admin: 'segAdmin' };
  // interface lines on the router cards (URM ch12 Primjer 1)
  var IFACES = {
    R2: [['192.168.1.113/28', 'SW2'], ['192.168.1.138/30', 'R1']],
    R1: { branch: [['192.168.1.137/30', 'R2'], ['192.168.1.97/28', 'VLAN 30']], sales: [['192.168.1.1/26', 'VLAN 10'], ['192.168.1.97/28', 'VLAN 30']] }
  };
  // segments between neighbouring lanes: [name key or null, network]
  var SEGS = {
    branch: [['segBranch', '192.168.1.112/28'], [null, '192.168.1.136/30'], ['segAdmin', '192.168.1.96/28']],
    sales: [['segSales', '192.168.1.0/26 · VLAN 10'], ['segAdmin', '192.168.1.96/28 · VLAN 30']],
    admin: [['segAdmin', '192.168.1.96/28 · VLAN 30']]
  };

  /** Data (addresses, ports, message, field and device names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'rl-mono' : cls || null }, text); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function secs(v) { return t('tS', { v: v }); }

  function place(s) { return L.PLACES[s.p.client]; }
  function relayId(s) { var r = place(s).relay; return r ? r.id : null; }
  function colour(s, id) { return id === 'C' ? '1' : id === 'S' ? '2' : id === relayId(s) ? '3' : '4'; }
  /** The message crossed in this step, or null. */
  function current(c) {
    var s = c.state, before = c.prev ? c.prev.msgs.length : 0;
    return s.msgs.length > before ? s.msgs[s.msgs.length - 1] : null;
  }

  // ── lanes (the kit draws the card, its mark and name; the page fills the body) ──
  function clientLane(c, cur) {
    var s = c.state, cl = s.client, pc = c.prev && c.prev.client;
    var ch = !!c.prev && JSON.stringify(pc) !== JSON.stringify(cl);
    function row(k, v) { return [h('dt', null, t(k)), h('dd', { class: ch && v ? 'sd-changed' : null }, v ? data(v, '') : h('span', { class: 'rl-muted' }, t('none')))]; }
    return { id: 'C', c: colour(s, 'C'), shape: 'square', name: t('clientName'), state: cur && cur.to === 'C' || s.last && s.last.did === 'linkLocal' ? 'active' : null,
      body: [h('div', { class: 'rl-head' }, h('span', { class: 'rl-muted' }, t('pl' + PLACE_KEY[s.p.client]), ' ·'), h('span', { class: 'rl-ph' }, t('ph' + s.phase))),
        h('dl', { class: 'rl-kv' }, row('fIp', cl && cl.ip), row('fMask', cl && cl.mask), row('fGw', cl && cl.gw), row('fDns', cl && cl.dns))] };
  }

  function routerLane(c, id, cur) {
    var s = c.state, isRelay = id === relayId(s);
    var ifs = id === 'R2' ? IFACES.R2 : IFACES.R1[s.p.client];
    var acts = !!cur && (cur.from === id || cur.to === id) && !cur.lost;
    var badge, extra;
    if (isRelay) {
      badge = s.p.relay ? h('span', { class: 'rl-badge' + (acts && cur.from === id ? ' sd-fill' : ''), dataset: { c: '3' } }, t('relayBadge'))
        : h('span', { class: 'rl-badge', dataset: { k: 'off' } }, t('relayOffBadge'));
      extra = s.p.relay ? h('div', { class: 'rl-sub' }, t('relayTo'), ' ', data(L.SERVER, '')) : h('div', { class: 'rl-sub' }, t('relayOff'));
    } else {
      var passes = !!cur && (cur.via || []).indexOf(id) >= 0 && !cur.lost;
      badge = passes ? h('span', { class: 'rl-badge sd-fill', dataset: { c: '4' } }, t('routes')) : null;
      extra = h('div', { class: 'rl-sub' }, t('transit'));
    }
    return { id: id, c: colour(s, id), name: null, state: cur && cur.to === id ? 'active' : null, tags: badge,
      body: [h('ul', { class: 'rl-if', translate: 'no' }, ifs.map(function (x) { return h('li', null, h('span', { class: 'rl-mono' }, x[0]), h('span', { class: 'rl-muted' }, x[1])); })), extra] };
  }

  function serverLane(c, cur) {
    var s = c.state, picked = !!c.prev && c.prev.scope !== s.scope;
    var rows = L.SCOPES.map(function (sc) {
      var mine = s.scope === sc.id;
      return h('li', { class: mine && picked ? 'sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : null, dataset: mine ? { pick: '' } : {} },
        t(SCOPE_NAME[sc.id]), ' ', data(sc.net + '/' + sc.prefix, ''));
    });
    return { id: 'S', c: colour(s, 'S'), name: t('serverName'), state: !s.p.server ? 'down' : cur && cur.to === 'S' && !cur.lost ? 'active' : null,
      body: [h('div', { class: 'rl-head' }, h('span', { class: 'rl-muted' }, data(L.SERVER, ''), ' · ', t('segAdmin')),
          h('span', { class: 'rl-badge', dataset: s.p.server ? {} : { k: 'down' } }, s.p.server ? t('up') : t('down'))),
        h('ul', { class: 'rl-scopes', 'aria-label': t('scopes') }, rows)] };
  }

  // ── chart rows ──
  function reaction(s, m) {
    if (m.to === 'C') return m.type === 'OFFER' ? t('reAsks') : t('reDone');
    if (m.to === 'S') {
      if (m.lost) return t('reDown');
      return m.type === 'DISCOVER' ? t('reScope', { scope: t(SCOPE_NAME[L.scopeFor(m.giaddr, L.SERVER).id]) }) : t('reRecord');
    }
    if (m.from === 'C') return m.lost ? t('reNoFwd') : t('reRelay');
    return null;
  }
  function msgRow(c, m, changed) {
    var s = c.state, re = {}, word = reaction(s, m), lanes = place(s).lanes;
    if (word) re[m.to] = word;
    return { from: m.from, to: m.to, label: 'DHCP' + m.type, c: colour(s, m.from), line: m.cast === 'broadcast' ? 'dashed' : null,
      // giaddr beside the chip on the relay–server arrows that span more than one lane (on one lane the chip fills it)
      lost: m.lost ? [m.to] : [], re: re, fields: m.from !== 'C' && m.to !== 'C' && m.giaddr !== ZERO && Math.abs(lanes.indexOf(m.from) - lanes.indexOf(m.to)) > 1 ? 'giaddr ' + m.giaddr : null,
      time: secs(m.t), cause: m.from === 'C' && m.type === 'DISCOVER' && m.attempt > 1 ? t('causeRetry', { n: m.attempt }) : null,
      changed: changed, down: s.p.server ? [] : ['S'] };
  }

  /** The network strip: the segments between neighbouring lanes, the one(s) crossed now, the boundary at the relay. */
  function netStrip(s, lanes, cur) {
    var k = lanes.length, gap = 'var(--sd-seq-gap)';
    var x = function (p) { return seq.css(p, gap, k); };
    var area = h('div', { class: 'rl-net-area' });
    var on = cur ? [lanes.indexOf(cur.from), lanes.indexOf(cur.to)].sort() : null;
    SEGS[s.p.client].forEach(function (sg, i) {
      var a = seq.laneAt(i, k), b = seq.laneAt(i + 1, k);
      var crossed = !!on && i >= on[0] && i < on[1];
      area.append(h('span', { class: 'rl-seg', dataset: crossed ? { on: '' } : {}, style: { left: x(a), width: x(seq.between(a, b)) } },
        h('span', { class: 'rl-seg-lab' }, sg[0] ? [t(sg[0]), ' '] : null, data(sg[1], ''))));
    });
    var r = relayId(s);
    if (r) area.append(h('span', { class: 'rl-bnd', title: t('legBoundary'), style: { left: x(seq.laneAt(lanes.indexOf(r), k)) } }));
    return h('div', { class: 'rl-net' }, h('div', { class: 'rl-net-t' }, t('netLabel')), area);
  }

  function renderChart(c, cur) {
    var s = c.state, lanes = place(s).lanes;
    var before = c.prev ? c.prev.msgs.length : 0;
    var rows = s.msgs.map(function (m, i) { return msgRow(c, m, !!c.prev && i >= before); });
    if (s.phase === 'LINKLOCAL') rows.push({ kind: 'note', lane: 'C', text: t('noteLL'), time: secs(s.t), changed: s.last.did === 'linkLocal', down: s.p.server ? [] : ['S'] });
    var chart = seq({
      dir: c.dir,
      lanes: lanes.map(function (id) { return id === 'C' ? clientLane(c, cur) : id === 'S' ? serverLane(c, cur) : routerLane(c, id, cur); }),
      rows: rows,
      timeWidth: '4.4rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
    chart.insertBefore(netStrip(s, lanes, cur), chart.querySelector('.sd-seq-list'));
    return chart;
  }

  // ── field strip ──
  function renderMsg(c, cur) {
    var s = c.state;
    var box = h('section', { class: 'rl-box rl-msg' }, h('span', { class: 'rl-sub' }, t('msgTitle')));
    if (!cur) {
      box.append(h('span', null, s.phase === 'LINKLOCAL' ? t('msgLL') : t('msgNone')));
      return box;
    }
    var w = cur.wrote || [];
    function f(label, value, key) {
      return h('div', null, h('dt', null, label), h('dd', { class: key && w.indexOf(key) >= 0 ? 'sd-changed' : null }, data(String(value), '')));
    }
    var items = [
      f(t('fSrc'), cur.src), f(t('fDst'), cur.dst),
      h('div', null, h('dt', null, t('fCast')), h('dd', null, h('span', null, rich(cur.cast === 'broadcast' ? 'castB' : 'castU')))),
      f(data('giaddr', ''), cur.giaddr, 'giaddr'), f(data('hops', ''), cur.hops, 'hops'), f(data('yiaddr', ''), cur.yiaddr, 'yiaddr')
    ];
    if (cur.o50) items.push(f(t('fO50'), cur.o50));
    if (cur.type === 'ACK') items.push(f(t('fO1'), cur.opts.mask), f(t('fO3'), cur.opts.router), f(t('fO6'), cur.opts.dns));
    box.append(h('div', { class: 'rl-msg-h' },
      h('b', { class: 'sd-fill' + (c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { c: colour(s, cur.from), b: String(cur.cast === 'broadcast') }, translate: 'no' }, 'DHCP' + cur.type),
      data(cur.from + ' → ' + cur.to, ''),
      cur.lost ? h('span', { class: 'rl-badge' }, t('msgLost')) : null));
    box.append(h('dl', { class: 'rl-fields' }, items));
    return box;
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, r = s.last, pl = place(s);
    if (!r) return rich('capStart' + PLACE_KEY[s.p.client]);
    var D = function (v) { return data(v); }, B = function (v) { return h('b', null, data(v)); };
    var T = function (v) { return data(secs(v), ''); };
    var m = r.msg ? L.msg(s, r.msg) : null;
    var rl = pl.relay;
    var out = [];
    function sent() {                                                      // the client's broadcast (rule 1)
      if (m.type === 'REQUEST') return rich('capRequest', { addr: B(m.o50) });
      if (m.attempt > 1) return rich('capRetry', { type: D('DHCP' + m.type), n: m.attempt, t: T(m.t) });
      return rich('capDiscover', { type: D('DHCP' + m.type), src: D(m.src), dst: D(m.dst) });
    }
    switch (r.did) {
      case 'relayTakes':
        return sent().concat(' ', rich('capTakes', { relay: D(rl.id), ip: D(rl.ip) }));
      case 'noRelay':
        return sent().concat(' ', rich('capNoRelay', { relay: D(rl.id), ip: D(rl.ip) }));
      case 'relayed':
      case 'lostAtServer':
        if (m.attempt > 1) out = rich('capRelayedAgain', { relay: D(rl.id), ip: D(rl.ip), giaddr: D('giaddr') });
        else {
          out = rich('capRelayed', { relay: D(rl.id), ip: B(rl.ip), giaddr: D('giaddr'), hops: D('hops'), type: D('DHCP' + m.type) });
          if (m.via.length) out = out.concat(' ', rich('capVia'));
        }
        if (r.did === 'lostAtServer') return out.concat(' ', rich('capServerDown'));
        if (r.server === 'offer') {
          var sc = L.scopeById(s.scope);
          return out.concat(' ', rich('capScope', { ip: D(m.giaddr), scope: t(SCOPE_NAME[sc.id]), net: B(sc.net + '/' + sc.prefix) }));
        }
        return out.concat(' ', rich('capBind', { addr: B(s.binding.addr) }));
      case 'offer':
        var sc2 = L.scopeById(s.scope);
        return sent().concat(' ', rich('capLocal', { net: D(sc2.net + '/' + sc2.prefix), addr: B(s.pending.reply.yiaddr) }));
      case 'ack':
        return sent().concat(' ', rich('capBindLocal', { addr: B(s.binding.addr) }));
      case 'serverDown':
        return sent().concat(' ', rich('capServerDownLocal'));
      case 'toRelay':
        out = rich('capToRelay', { type: D('DHCP' + m.type), addr: B(m.yiaddr), ip: D(m.giaddr) });
        return m.type === 'ACK' ? out.concat(' ', rich('capAckOpts')) : out;
      case 'offerIn':
        out = rl ? rich('capDeliver', { relay: D(rl.id), type: D('DHCP' + m.type), dst: D(m.dst) }) : rich('capOfferLocal', { addr: D(m.yiaddr), dst: D(m.dst) });
        return out.concat(' ', rich('capOfferTaken', { addr: B(m.yiaddr) }));
      case 'configured':
        var cl = s.client;
        out = rl ? rich('capDeliverAck', { relay: D(rl.id) }).concat(' ') : [];
        out = out.concat(rich('capConfigured', { addr: B(cl.ip), mask: D(cl.mask), gw: D(cl.gw), dns: D(cl.dns) }));
        return rl ? out.concat(' ', rich('capDnsElsewhere')) : out;
      case 'linkLocal':
        return rich('capLinkLocal', { t: T(s.t), ip: B(L.LINK_LOCAL + '/16') });
      default:
        return [];
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'client', type: 'choice', label: t('client'), options: [['branch', t('plBranch')], ['sales', t('plSales')], ['admin', t('plAdmin')]], resets: true },
      { key: 'relay', type: 'toggle', label: t('relay'), resets: true,
        disabled: function (p) { return p.client === 'admin' ? t('relayNA') : false; } },
      { key: 'server', type: 'toggle', label: t('server'), resets: true }
    ],

    presets: [
      { id: 'branch', label: t('presetBranch'), params: { client: 'branch' }, hint: t('presetBranchHint') },
      { id: 'sales-vlan', label: t('presetSales'), params: { client: 'sales' }, hint: t('presetSalesHint') },
      { id: 'same-subnet', label: t('presetSame'), params: { client: 'admin' }, hint: t('presetSameHint') },
      { id: 'no-relay', label: t('presetNoRelay'), params: { relay: false }, hint: t('presetNoRelayHint') },
      { id: 'server-down', label: t('presetDown'), params: { server: false }, hint: t('presetDownHint') }
    ],

    legend: [
      { shape: 'line', label: t('legUnicast') },
      { shape: 'dash', label: t('legBroadcast') },
      { c: 3, label: t('legRelay') },
      { shape: 'none', label: t('legLost') },
      { shape: 'bnd', label: t('legBoundary') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var cur = current(c);
      var chart = renderChart(c, cur);
      c.stage.replaceChildren(h('div', { class: 'rl' }, chart, renderMsg(c, cur)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
