<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** The scene's names: data, not language. */
  var SC = {
    domain: 'quillmoor.example', ou: 'OU=Office', lab: 'OU=Lab', gpo: 'Deploy Viewer', host: 'PC07', user: 'ana',
    share: '\\\\hq-fs01\\pkg$', file: 'report.vwr', ext: '.vwr', cmd: 'gpupdate',
    grpPc: 'Domain Computers', grpUsers: 'Domain Users'
  };
  var DEP_WORDS = { computer: 'Computer', user: 'User', 'user-at-logon': 'UserAtLogon', publish: 'Publish' };
  var PRESET_WORDS = { 'assign-computer': 'presetComputer', 'assign-user': 'presetUser', 'publish-user': 'presetPublish',
    'share-perms': 'presetShare', 'out-of-scope': 'presetScope' };

  /** Data (host, user, GPO, OU, share and file names) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function icon(name) { return h('span', { class: 'si-i', dataset: { i: name }, 'aria-hidden': 'true' }); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }   // a placeholder used twice
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function span(key, vars) { return h('span', null, rich(key, vars)); }
  /** Placeholders every caption may use; each call makes fresh nodes. */
  function V(extra) {
    return Object.assign({ h: data(SC.host), u: data(SC.user), gpo: h('b', null, data(SC.gpo)), pkg: data(L.PACKAGE),
      share: data(SC.share), file: data(SC.file), ext: data(SC.ext), cmd: data(SC.cmd), grp: data(SC.grpPc) }, extra || {});
  }

  // ── left: the GPO ──

  function depCard(id, on) {
    var m = id === 'publish-pc' ? { how: 'publish', part: 'computer' } : L.MODES[id];
    var no = !L.allowed(m.how, m.part);
    var w = id === 'publish-pc' ? 'PublishPc' : DEP_WORDS[id];
    var ds = {};
    if (on) ds.on = '1';
    if (no) ds.no = '1';
    return h('li', { class: 'si-dep', dataset: ds },
      h('span', { class: 'si-icons' }, icon(m.how === 'publish' ? 'shop' : 'pin'), icon(m.part === 'computer' ? 'pc' : 'user')),
      h('span', null, h('b', null, t('dep' + w)), ' ', h('small', null, t('eff' + w))),
      on ? h('span', { class: 'si-tag' }, '✓ ', t('inGpo')) : no ? h('span', { class: 'si-tag' }, '✕') : h('span'));
  }

  function renderGpo(c) {
    var s = c.state;
    return h('section', { class: 'si-col' },
      h('div', { class: 'si-box' },
        h('h2', { class: 'si-head' }, data('GPO'), data(SC.gpo), h('small', null, t.parts('gpoLinked', { ou: data(SC.ou) }))),
        h('div', { class: 'si-pkg' }, icon('box'), h('b', null, data(L.PACKAGE)), h('small', null, t('pkgKind'))),
        h('h3', { style: { marginTop: '0.45rem' } }, t('depTitle')),
        h('ul', { class: 'si-deps' }, L.DEPLOYMENTS.concat(['publish-pc']).map(function (id) { return depCard(id, id === s.deployment); })),
        h('div', { class: 'si-rows' }, h('span', null, t('optRemove')), h('b', null, t(s.removeOnScope ? 'on' : 'off')))),
      h('div', { class: 'si-box' },
        h('h3', null, t.parts('shareTitle', { share: data(SC.share) })),
        h('div', { class: 'si-rows' },
          data(SC.grpUsers), h('b', null, '✓ ', t('permRead')),
          data(SC.grpPc), h('b', null, s.shareReadable.computers ? ['✓ ', t('permRead')] : ['✕ ', t('permNone')]))));
  }

  // ── right: the targets and the events ──

  function moved(s, part) { return s.move && !s.inScope && s.part === part; }

  /** Viewer for PC07 (per machine) or for ana (per user): [icon, word]. */
  function stateOf(s, part) {
    if (part === 'computer') {
      if (s.pc.failed) return ['fail', 'stFailed'];
      if (s.pc.installed) return ['inst', s.move && !s.managed ? 'stUnmanaged' : 'stInstalledPc'];
      if (s.move && s.part === 'computer' && s.siResult === 'removed') return ['none', 'stRemoved'];
      return ['none', 'stNone'];
    }
    var u = s.user;
    if (u.installed) return ['inst', s.move && !s.managed ? 'stUnmanaged' : 'stInstalled'];
    if (u.offered) return ['shop', 'stOffered'];
    if (u.advertised) return ['adv', 'stAdvertised'];
    if (s.move && s.part === 'user' && s.siResult === 'removed') return ['none', 'stRemoved'];
    if (s.pc.installed) return ['inst', 'stFromPc'];
    return ['none', 'stNone'];
  }

  function targetCard(c, part) {
    var s = c.state, ev = s.event, prev = c.prev;
    var changed = ev && (ev.changed.indexOf(part === 'computer' ? 'pc' : 'user') >= 0 || (ev.kind === 'move' && s.part === part));
    var st = stateOf(s, part);
    var flagNew = prev && s.syncNext[part] && !prev.syncNext[part];
    return h('div', { class: 'si-box si-target' + (changed ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : '') },
      h('div', { class: 'si-head' }, icon(part === 'computer' ? 'pc' : 'user'), data(part === 'computer' ? SC.host : SC.user),
        h('small', null, t(part === 'computer' ? 'computer' : 'user'))),
      h('div', { class: 'si-line' }, t.parts('inOu', { ou: data(moved(s, part) ? SC.lab : SC.ou) }),
        moved(s, part) ? [' · ', h('span', { class: 'si-ou-out' }, t('outOfScope'))] : null),
      h('div', { class: 'si-state' }, h('span', null, t('viewer')), icon(st[0]), h('span', null, t(st[1]))),
      h('div', { class: 'si-line' }, t(s.fastLogon ? 'fastOn' : 'fastOff')),
      s.syncNext[part] ? h('div', { class: 'si-line' }, h('span', { class: flagNew ? 'sd-hl' : null }, '⧗ ', t(part === 'computer' ? 'flagStartup' : 'flagLogon'))) : null);
  }

  var SI_RES = { signal: ['wait', 'rSignal'], installed: ['inst', 'rInstalled'], failed: ['fail', 'rFailed'], advertised: ['adv', 'rAdvertised'],
    offered: ['shop', 'rOffered'], removed: ['none', 'rRemoved'], stays: ['inst', 'rStays'] };
  var OUT_RES = { opens: ['inst', 'rOpens'], installedOnUse: ['inst', 'rInstalledOnUse'], noApp: ['none', 'rNoApp'],
    installedFromStore: ['inst', 'rFromStore'], notListed: ['none', 'rHasNot'] };

  function eventRow(c, e) {
    var s = c.state, now = e === s.event;
    var what, pass = 'none', res;
    if (e.kind === 'move') { what = t.parts('evMove', { who: data(s.part === 'computer' ? SC.host : SC.user), ou: data(SC.lab) }); res = [null, 'rMoved']; }
    else if (e.kind === 'gpupdate') {
      what = t.parts('evGpupdate', { u: data(SC.user), cmd: data(SC.cmd) });
      pass = 'bg';
      res = ['wait', e.ask === 'restart' ? 'rAskRestart' : 'rAskLogoff'];
    } else if (e.mode) {
      what = t.parts(e.kind === 'boot' ? 'evBoot' : 'evLogon', { h: data(SC.host), u: data(SC.user) });
      pass = e.mode;
      res = SI_RES[e.si];
    } else if (e.kind === 'logon') {
      what = t.parts('evLogon', { u: data(SC.user) });
      res = e.has ? ['inst', 'rHas'] : ['none', 'rHasNot'];
    } else if (e.kind === 'open') {
      what = t.parts('evOpen', { u: data(SC.user), file: data(SC.file) });
      res = OUT_RES[e.outcome];
    } else {
      what = t.parts('evStore', { u: data(SC.user) });
      res = OUT_RES[e.outcome];
    }
    return h('li', { class: 'si-ev' + (now ? ' si-now' : '') },
      h('span', { class: 'si-no' }, String(e.n)),
      h('span', null, what),
      h('span', { class: 'si-pass', dataset: { p: pass } }, pass === 'none' ? '' : t(pass === 'bg' ? 'passBg' : pass === 'sync' ? 'passSync' : 'passAsync')),
      h('span', { class: 'si-res' + (now ? ' sd-hl' : '') }, res[0] ? icon(res[0]) : null, h('span', null, t(res[1]))));
  }

  function renderRight(c) {
    var s = c.state;
    return h('section', { class: 'si-col' },
      h('div', { class: 'si-targets' }, targetCard(c, 'computer'), targetCard(c, 'user')),
      h('div', { class: 'si-box' },
        h('h3', null, t('tlTitle')),
        h('ol', { class: 'si-tl' },
          h('li', { class: 'si-ev' + (s.event ? '' : ' si-now') }, h('span', { class: 'si-no' }, '0'),
            h('span', { style: { gridColumn: '2 / -1' } }, t(s.move ? 'tlStartMove' : 'tlStart'))),
          s.events.map(function (e) { return eventRow(c, e); }))));
  }

  // ── captions ──

  function how(s) { return span('how' + DEP_WORDS[s.deployment], V()); }
  function who(s) { return span(s.part === 'computer' ? 'whoComputer' : 'whoUser', V()); }

  function captionStart(s) {
    if (s.move) return rich('capStartMove', V({ how: how(s), opt: t(s.removeOnScope ? 'optOn' : 'optOff') }));
    var out = rich('capStart', V({ how: how(s) }));
    if (s.part === 'computer' && !s.shareReadable.computers) out = out.concat(rich('capStartNoRead', V()));
    if (!s.fastLogon) out = out.concat(rich('capStartNoFast', V()));
    return out;
  }

  var RES_KEYS = { failed: 'resFailed', advertised: 'resAdvertised', offered: 'resOffered', removed: 'resRemoved', stays: 'resStays' };

  function captionEvent(c) {
    var s = c.state, e = s.event, n = c.n;
    var tail = rich(s.move ? 'stillThere' : 'nothingYet');
    if (e.kind === 'move') return rich('capMove', V({ n: n, who: who(s), from: data(SC.ou), to: data(SC.lab) }));
    if (e.kind === 'gpupdate') return rich(s.part === 'computer' ? 'capGpupdateComputer' : 'capGpupdateUser', V({ n: n })).concat(tail);
    if (e.mode) {
      if (e.si === 'signal') return rich(s.part === 'computer' ? 'capSignalComputer' : 'capSignalUser', V({ n: n })).concat(tail);
      var prevEv = s.events[s.events.length - 2];
      var why = !e.flagged ? 'whyNoFast' : prevEv && prevEv.kind === 'gpupdate' ? 'whyGpupdate' : e.kind === 'boot' ? 'whySecondBoot' : 'whySecondLogon';
      var head = rich(e.kind === 'boot' ? 'capBoot' : 'capLogon', V({ n: n, why: span(why, V()) }));
      var key = e.si === 'installed' ? (e.part === 'computer' ? 'resInstalledPc' : 'resInstalledUser') : RES_KEYS[e.si];
      return head.concat(rich(key, V({ who: who(s) })));
    }
    if (e.kind === 'logon') {
      if (s.move) return rich(e.has ? 'capLogonStays' : 'capLogonRemoved', V({ n: n }));
      return rich(e.has ? 'capLogonHas' : 'capLogonFailed', V({ n: n }));
    }
    if (e.kind === 'open') {
      var k = e.outcome === 'installedOnUse' ? 'capOpenInstall' : e.outcome === 'noApp' ? 'capOpenNoApp' : s.move ? 'capOpenStays' : 'capOpenOpens';
      return rich(k, V({ n: n }));
    }
    return rich('capStore', V({ n: n }));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'deployment', type: 'choice', label: t('pDeployment'), resets: true,
        options: [['computer', t('optComputer')], ['user', t('optUser')], ['user-at-logon', t('optUserAtLogon')], ['publish', t('optPublish')]] },
      { key: 'computersCanRead', type: 'toggle', label: t('pComputersCanRead'), resets: true,
        visible: function (p) { return p.deployment === 'computer' && !p.move; } },
      { key: 'fastLogon', type: 'toggle', label: t('pFastLogon'), resets: true },
      { key: 'gpupdate', type: 'toggle', label: t('pGpupdate'), resets: true },
      { key: 'move', type: 'toggle', label: t('pMove'), resets: true },
      { key: 'removeOnScope', type: 'toggle', label: t('pRemoveOnScope'), resets: true,
        visible: function (p) { return p.move; } }
    ],

    presets: L.presets.map(function (pr) {
      var w = PRESET_WORDS[pr.id];
      return { id: pr.id, label: t(w), params: pr.params, hint: t(w + 'Hint') };
    }),

    legend: [
      { shape: 'si-box', label: t('legPackage') },
      { shape: 'si-pin', label: t('legAssigned') },
      { shape: 'si-shop', label: t('legPublished') },
      { shape: 'si-adv', label: t('legAdvertised') },
      { shape: 'si-inst', label: t('legInstalled') },
      { shape: 'si-fail', label: t('legFailed') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'si' }, renderGpo(c), renderRight(c)));
    },

    caption: function (c) {
      return c.state.event ? captionEvent(c) : captionStart(c.state);
    }
  });
})();
</script>
</body>
</html>
