<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var N = L.N_MAX;
  var SVGNS = 'http://www.w3.org/2000/svg';

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (3 000 / 3,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '\u00a0' : ',');
  }
  /** Whole euros (rounded), sign dropped. */
  function money(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  /** Euros and cents from cents: 1575 → 15,75 € / €15.75. */
  function cents(c) {
    var a = Math.abs(Math.round(c)), whole = Math.floor(a / 100), cc = a % 100;
    return t('eur', { n: group(whole) + (Simdeck.lang === 'hr' ? ',' : '.') + (cc < 10 ? '0' : '') + cc });
  }
  function users(n) { return t.n('nUsers', n, { n: group(n) }); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function pctX(n) { return (100 * n / N) + '%'; }

  // ── the charts ──

  function svg(children) {
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 1000 1000');
    s.setAttribute('preserveAspectRatio', 'none');
    s.setAttribute('aria-hidden', 'true');
    children.forEach(function (c) { s.appendChild(c); });
    return s;
  }
  function poly(cls, pts) {
    var el = document.createElementNS(SVGNS, 'polyline');
    el.setAttribute('class', cls);
    el.setAttribute('vector-effect', 'non-scaling-stroke');
    el.setAttribute('points', pts.map(function (q) { return q[0].toFixed(2) + ',' + q[1].toFixed(2); }).join(' '));
    return el;
  }
  function yOf(v, top) { return 1000 - 1000 * v / top; }

  /** Click or drag on a chart sets the user count (snapped to the slider's step). */
  function pointer(plot) {
    function at(e) {
      var r = plot.getBoundingClientRect();
      if (!r.width) return;
      var step = L.RANGES.users[2];
      var n = Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * N / step) * step;
      if (n !== sim.params.users) sim.set({ users: n });
    }
    plot.addEventListener('pointerdown', function (e) { e.preventDefault(); plot.setPointerCapture(e.pointerId); at(e); });
    plot.addEventListener('pointermove', function (e) { if (e.buttons & 1) at(e); });
  }

  function ticksY(top, fmt) {
    return [0, 0.5, 1].map(function (f) {
      return h('span', { class: 'fv-tick', translate: 'no', style: { bottom: (100 * f) + '%' } }, fmt(top * f));
    });
  }
  function ticksX() {
    return h('div', { class: 'fv-xs', 'aria-hidden': 'true' }, [0, 250, 500, 750, 1000].map(function (n, i, a) {
      return h('span', { translate: 'no', style: { left: pctX(n) } }, i === a.length - 1 ? group(n) + ' ' + t('axisUsers') : group(n));
    }));
  }
  /** A value tag beside a marker: to its right, or to its left past the middle. */
  function tag(kind, n, bottomPct, text) {
    var right = n > N * 0.6;
    var style = { bottom: 'calc(' + bottomPct + '% + 0.5rem)' };
    style.left = 'calc(' + pctX(n) + (right ? ' - 0.6rem)' : ' + 0.6rem)');
    return h('span', { class: 'fv-tag', translate: 'no', dataset: right ? { k: kind, left: '' } : { k: kind }, style: style }, text);
  }
  function clampPct(v) { return Math.max(0, Math.min(100, v)); }
  /** Bottoms (%) for the in-house and service tags: the higher one above its marker, the lower one below, in the plot. */
  function pair(yIn, ySvc) {
    var inHigh = yIn >= ySvc, hi = Math.max(yIn, ySvc), lo = Math.min(yIn, ySvc);
    var loB = Math.max(lo - 9, 0), hiB = Math.min(Math.max(hi, loB + 8), 88);
    return inHigh ? { in: hiB, svc: loB } : { in: loB, svc: hiB };
  }

  function zone(s) {
    if (s.forGood === null || s.first > N) return [];   // never cheaper: no zone, even where costs touch
    var a = s.first, z = s.forGood === null ? null : Math.min(s.forGood, N);
    var out = [];
    if (z !== null && z > a) {
      out.push(h('div', { class: 'fv-zone', style: { left: pctX(a), width: (100 * (z - a) / N) + '%' } }));
    } else {
      out.push(h('div', { class: 'fv-zone', style: { left: pctX(a), width: '0' } }));
    }
    var label = s.forGood !== null && s.forGood > a ? t('zoneTag', { a: group(a), b: group(s.forGood) }) : t('beTag', { a: group(a) });
    var mid = z !== null ? (a + z) / 2 : a;
    var left = mid > N * 0.6;
    out.push(h('span', {
      class: 'fv-tag', translate: 'no', dataset: left ? { k: 'zone', left: '' } : { k: 'zone' },
      style: { left: left ? 'calc(' + pctX(Math.min(a, z === null ? a : z)) + ' - 0.3rem)' : 'calc(' + pctX(a) + ' + 0.3rem)' }
    }, label));
    return out;
  }

  function costChart(s) {
    var top = s.chart.top, n = s.p.users;
    var stairs = s.chart.stairs.map(function (q) { return [q[0] * 1000 / N, yOf(q[1], top)]; });
    var svcLine = [[0, 1000], [1000, yOf(s.p.price * N, top)]];
    var yIn = 100 * s.inhouse.total / top, ySvc = 100 * s.service / top, at = pair(yIn, ySvc);
    var plot = h('div', { class: 'fv-plot' },
      zone(s),
      h('div', { class: 'fv-fix', style: { bottom: (100 * s.p.fixed / top) + '%' } }),
      svg([poly('fv-svc', svcLine), poly('fv-in', stairs)]),
      h('div', { class: 'fv-now', style: { left: pctX(n) } }),
      h('div', { class: 'fv-dot', dataset: { k: 'svc' }, style: { left: pctX(n), bottom: ySvc + '%' } }),
      h('div', { class: 'fv-dot', dataset: { k: 'in' }, style: { left: pctX(n), bottom: yIn + '%' } }),
      tag('in', n, at.in, money(s.inhouse.total)),
      tag('svc', n, at.svc, money(s.service)));
    pointer(plot);
    return h('div', { class: 'fv-chart' },
      h('p', { class: 'fv-head' }, t('headCost')),
      h('div', { class: 'fv-axis', 'aria-hidden': 'true' }, ticksY(top, money)),
      plot,
      ticksX());
  }

  function avgChart(s) {
    var top = L.AVG_TOP, n = s.p.users;
    var curve = s.chart.avg.map(function (q) { return [q[0] * 1000 / N, Math.max(-50, yOf(q[1], top))]; });
    var svcY = yOf(s.p.price, top);
    var edges = s.chart.edges.map(function (e) {
      return h('div', { class: 'fv-edge', style: { left: pctX(e) }, dataset: e === n ? { on: '' } : {} });
    });
    var parts = [
      h('div', { class: 'fv-marg', style: { bottom: (100 * L.PER_USER / top) + '%' } }),
      svg([poly('fv-svc', [[0, svcY], [1000, svcY]]), poly('fv-in', curve)])
    ].concat(edges);
    parts.push(h('div', { class: 'fv-now', style: { left: pctX(n) } }));
    var ySvc = 100 * s.p.price / top;
    var yA = s.avg ? clampPct(s.avg.total / top) : 0, at = pair(yA, ySvc);
    parts.push(h('div', { class: 'fv-dot', dataset: { k: 'svc' }, style: { left: pctX(n), bottom: ySvc + '%' } }));
    if (s.avg) {
      parts.push(h('div', { class: 'fv-dot', dataset: { k: 'in' }, style: { left: pctX(n), bottom: (yA >= 100 ? 97 : yA) + '%' } }));
      var txt = s.avg.total > 100 * top ? t('offTop', { v: cents(s.avg.total) }) : cents(s.avg.total);
      parts.push(tag('in', n, at.in, txt));
    }
    parts.push(tag('svc', n, at.svc, cents(100 * s.p.price)));
    if (s.opens) {
      var right = n > N * 0.6;
      parts.push(h('span', {
        class: 'fv-tag', translate: 'no', dataset: right ? { k: 'edge', left: '' } : { k: 'edge' },
        style: { left: 'calc(' + pctX(n) + (right ? ' - 0.6rem)' : ' + 0.6rem)') }
      }, t('edgeTag', { s: money(L.STEP) })));
    }
    var plot = h('div', { class: 'fv-plot' }, parts);
    pointer(plot);
    return h('div', { class: 'fv-chart' },
      h('p', { class: 'fv-head' }, t('headAvg')),
      h('div', { class: 'fv-axis', 'aria-hidden': 'true' }, ticksY(top, money)),
      plot,
      ticksX());
  }

  // ── the cards ──

  function line(text, data) { return h('span', { class: 'fv-line', dataset: data || {} }, text); }
  function card(kind, head, big, lines) {
    return h('div', { class: 'fv-card', dataset: { k: kind } }, h('h3', null, head), h('span', { class: 'fv-big', translate: 'no' }, big), lines);
  }

  function cards(s) {
    var i = s.inhouse, n = s.p.users;
    var inLines = [
      line(t('lineFixed', { v: money(i.fixed) })),
      line(t('lineSteps', { b: t.n('nBlocks', i.blocks, { n: group(i.blocks) }), s: money(L.STEP), v: money(i.steps) })),
      line(t('lineVar', { n: users(n), v: money(L.PER_USER), t: money(i.variable) })),
      line(t('lineIdle', { p: t.n('nPlaces', s.spare.places, { n: group(s.spare.places) }), v: money(s.spare.cost) }))
    ];
    if (s.p.util >= 90) inLines.push(line(t('lineHot'), { hot: '' }));
    var avgBig = s.avg ? t('avgBig', { v: cents(s.avg.total) }) : t('avgNone');
    var avgLines = [];
    if (s.avg) avgLines.push(line(t('avgParts', { f: cents(s.avg.fixed), s: cents(s.avg.steps), v: cents(s.avg.variable) })));
    avgLines.push(s.opens
      ? line(t('nextEdge', { m: money(s.marginal), k: i.blocks + 1 }), { edge: '' })
      : line(t('nextPlain', { m: money(s.marginal) })));

    var beBig, beLines = [];
    if (s.forGood === null) {
      beBig = t('beNever');
      beLines.push(line(t('beNo', { c: cents(s.unitCents), p: cents(100 * s.p.price) })));
    } else if (s.first < s.forGood) {
      beBig = t('beRange', { a: group(s.first), b: group(s.forGood) });
      beLines.push(line(t('beFirst', { a: group(s.first), b: group(s.forGood) })));
    } else {
      beBig = users(s.forGood);
      beLines.push(line(t('beOne', { a: group(s.forGood) })));
    }
    var marginCents = 100 * s.p.price - s.unitCents;
    if (s.textbook === null) {
      beLines.push(line(t('beTextbookNone', { m: (marginCents < 0 ? '−' : '') + cents(marginCents) })));
    } else {
      // "=" only when the shown margin is exact in cents and the result a whole number; else "≈"
      var exact = (100 * L.STEP) % s.cap === 0 && Math.abs(s.textbook - Math.round(s.textbook)) < 1e-9;
      beLines.push(line(t(exact ? 'beTextbook' : 'beTextbookApprox',
        { f: money(s.p.fixed), m: cents(marginCents), n: group(Math.round(s.textbook)) })));
    }
    return h('div', { class: 'fv-cards' },
      card('in', t('cardIn'), t('perMonth', { v: money(i.total) }), inLines),
      card('svc', t('cardSvc'), t('perMonth', { v: money(s.service) }), [line(t('lineSvc', { n: users(n), p: money(s.p.price) }))]),
      card('avg', t('cardAvg'), avgBig, avgLines),
      card('be', t('cardBe'), beBig, beLines));
  }

  function result(s, chg) {
    var o = s.outcome;
    var key = { inhouse: 'resIn', service: 'resSvc', even: 'resEven', none: s.p.fixed ? 'resNone' : 'resNoneFree' }[o];
    return h('p', { class: 'fv-result' + (chg.indexOf('outcome') >= 0 ? ' sd-changed' : ''), dataset: { o: o } },
      t(key, { d: money(s.diff) }));
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'fv' },
      h('div', { class: 'fv-charts' }, costChart(s), avgChart(s)),
      cards(s),
      h('div', { class: 'fv-bottom' },
        result(s, chg),
        h('p', { class: 'fv-foot' }, t('foot', { s: money(L.STEP), k: L.SIZE, v: money(L.PER_USER) }), ' ', t('illustrative')))));
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var out = t.parts(k.key, {
      n: b(users(s.p.users)), f: b(money(s.p.fixed)), c: b(money(s.inhouse.total)), s: b(money(s.service)),
      a: b(s.avg ? cents(s.avg.total) : ''), p: b(cents(100 * s.p.price)), d: b(money(s.diff))
    });
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, {
        k: b(s.inhouse.blocks + 1), m: b(money(s.marginal)), a: b(s.avg ? cents(s.avg.total) : ''),
        e: b(group(s.first === null ? 0 : s.first)), b: b(group(s.forGood === null ? 0 : s.forGood)), u: b(t('pct', { n: s.p.util })),
        c: b(cents(s.unitCents)), p: b(cents(100 * s.p.price))
      }));
    });
    return out;
  }

  var labels = { 'few-users': 'pFewUsers', 'step-edge': 'pStepEdge', grown: 'pGrown', headroom: 'pHeadroom', 'run-hot': 'pRunHot' };
  var R = L.RANGES;
  function range(key, fmt) {
    return { key: key, type: 'range', label: t(key), min: R[key][0], max: R[key][1], step: R[key][2], format: fmt };
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      range('users', function (v) { return users(v); }),
      range('util', function (v) { return t('pct', { n: v }); }),
      range('fixed', function (v) { return t('perMonth', { v: money(v) }); }),
      range('price', function (v) { return t('perMonth', { v: money(v) }); })
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'fv-in', label: t('legIn') },
      { shape: 'fv-svc', label: t('legSvc') },
      { shape: 'fv-fix', label: t('legFixed') },
      { shape: 'fv-marg', label: t('legMarg') },
      { shape: 'fv-zone', label: t('legZone') },
      { shape: 'fv-now', label: t('legNow') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
