  var t = Simdeck.useStrings(window.SimStrings);
  var ROOT = L.ROOT;
  var STAGE_KEY = { 'link-down': 'st_linkDown', 'no-route': 'st_noRoute', 'no-arp': 'st_noArp', 'not-forwarded': 'st_notForwarded', 'no-return': 'st_noReturn' };

  // ── small pieces ──

  /** Data (names, addresses, MACs) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { class: 'nv-mono', translate: 'no' }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function has(s, k) { return s.changed.indexOf(k) >= 0; }
  function chg(on, c) { return on ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''; }

  /** Caption parts: t.parts with every node placeholder cloned where it lands, *word* as <em lang="en"> and `x` as code. */
  var MARK = '\u0001';
  function rich(k, vars) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (n) {
      var v = vars[n];
      if (v && typeof v === 'object' && v.nodeType) { flat[n] = MARK + nodes.length + MARK; nodes.push(v); } else flat[n] = v;
    });
    var out = [];
    t.parts(k, flat).forEach(function (p) {
      var str = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (str === null) { out.push(p); return; }
      str.split(/(\*[^*]+\*|`[^`]+`)/).forEach(function (bit) {
        if (!bit) return;
        if (/^\*[^*]+\*$/.test(bit)) { out.push(h('em', { lang: 'en' }, bit.slice(1, -1))); return; }
        if (/^`[^`]+`$/.test(bit)) { out.push(code(bit.slice(1, -1))); return; }
        bit.split(MARK).forEach(function (piece, j) {
          if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
          else if (piece) out.push(piece);
        });
      });
    });
    return out;
  }
  function sp(parts) { return [' '].concat(parts); }

  // ── per-preset memo: the most lines the strip prints, the namespaces the preset makes ──

  var memo = {};
  function presetInfo(p) {
    if (!memo[p.scene]) {
      var n = 1, names = [];
      for (var i = 0; i <= L.steps(p); i++) {
        var s = Simdeck.stateAt(L, p, i);
        // an engine step lists its commands and may be taller; the scene is smallest then (no pings, no tables yet)
        var lines = !s.cmd ? 2 : s.cmd.op === 'engine' ? 1 : L.cmdLines(s.cmd).length + Math.max(1, s.out.length);
        n = Math.max(n, lines);
        s.order.forEach(function (id) { if (id !== ROOT && names.indexOf(id) < 0) names.push(id); });
      }
      memo[p.scene] = { lines: n, names: names };
    }
    return memo[p.scene];
  }

  // ── the command strip ──

  function shell(s, p) {
    var c = s.cmd;
    var info = presetInfo(p);
    var side = !c ? h('span') : c.op === 'engine' ? h('span', { class: 'nv-side nv-engine' }, t('sideEngine')) : h('span', { class: 'nv-side' }, t('sideHost'));
    var cmd, out;
    if (!c) {
      cmd = h('span', { class: 'nv-hint' }, t('before'));
      out = [];
    } else if (c.op === 'engine') {
      cmd = h('span', { class: 'nv-words' }, c.what === 'start' ? t('engineStart') : t.parts('engineRun', { ns: data(c.ns) }), ' · ',
        h('span', { class: 'nv-hint' }, t('engineSame')));
      out = L.cmdLines(c).map(function (l) { return h('span', { class: 'nv-line', translate: 'no' }, l); });
    } else {
      cmd = L.cmdLines(c).map(function (l) { return h('span', null, h('span', { class: 'nv-prompt', translate: 'no' }, '# '), h('span', { translate: 'no' }, l)); });
      out = s.out.length ? s.out.map(function (l) { return h('span', { class: s.lastError ? 'nv-err' : null, translate: 'no' }, l + '\n'); })
        : [h('span', { class: 'nv-none' }, t('noOutput'))];
    }
    var cmdLinesN = c && c.op !== 'engine' ? L.cmdLines(c).length : 1;
    var engine = !!(c && c.op === 'engine');
    return h('div', { class: 'nv-shell' }, side, h('div', { class: 'nv-cmd' }, cmd),
      h('pre', { class: 'nv-out' + (engine ? ' nv-two' : ''), style: { '--lines': String(engine ? 1 : Math.max(1, info.lines - cmdLinesN)) } }, out));
  }

  // ── the scene ──

  /** This step's ping: the keys on its path, and the stop point. */
  function pingMarks(s) {
    var pg = s.ping;
    return { trail: pg ? pg.trail : [], at: pg ? pg.at : null, ping: pg };
  }
  function stopBadge(pg) {
    if (pg.ok) return h('span', { class: 'nv-stop nv-ok' }, h('span', { class: 'nv-sym', 'aria-hidden': 'true' }, '✓'), t('pingOk'));
    return h('span', { class: 'nv-stop' }, h('span', { class: 'nv-sym', 'aria-hidden': 'true' }, '✗'), t(STAGE_KEY[pg.stage]));
  }

  /** One interface: port dot (solid up / hollow down), name, addresses; marked changed, on the path, where it stopped. */
  function iface(c, nsId, l, pm) {
    var s = c.state, k = L.key(nsId, l.name);
    var cls = 'nv-if' + (l.up ? '' : ' nv-isdown') + (pm.trail.indexOf(k) >= 0 ? ' nv-trail' : '') + chg(has(s, nsId + ':link:' + l.name), c);
    return h('span', { class: cls },
      h('span', { class: 'nv-dot' + (l.up ? '' : ' nv-hollow'), 'aria-hidden': 'true' }),
      h('span', { class: 'nv-name', translate: 'no' }, l.name),
      l.addrs.length ? h('span', { class: 'nv-addr', translate: 'no' }, l.addrs.join(' ')) : null,
      l.up ? null : h('span', { class: 'nv-state' }, t('down')),
      pm.at === k ? stopBadge(pm.ping) : null);
  }
  function ghost(g) {
    return h('span', { class: 'nv-if nv-gone' }, h('span', { class: 'nv-name', translate: 'no' }, g.name), h('span', { class: 'nv-state' }, t.parts('goneTo', { ns: data(g.to) })));
  }
  function routeRows(c, nsId) {
    var s = c.state, rs = L.routes(s, nsId, false);
    if (!rs.length) return [h('li', { class: 'nv-row nv-empty' }, t('noRoutes'))];
    return rs.map(function (r) {
      return h('li', { class: 'nv-row' + chg(has(s, nsId + ':route:' + r.dst + ' ' + r.dev), c), translate: 'no' },
        r.dst, r.via ? ' → ' + r.via : '', h('span', { class: 'nv-muted' }, ' dev ' + r.dev + (r.linkdown ? ' linkdown' : '')));
    });
  }
  function arpRows(c, nsId) {
    var s = c.state, a = L.ns(s, nsId).arp;
    if (!a.length) return [h('li', { class: 'nv-row nv-empty' }, t('arpEmpty'))];
    return a.map(function (e) {
      return h('li', { class: 'nv-row' + chg(has(s, nsId + ':arp:' + e.ip), c) }, h('span', { translate: 'no' }, e.ip + ' '),
        e.mac ? h('span', { translate: 'no' }, '→ ' + e.mac) : h('b', null, t('arpFailed')));
    });
  }
  function section(title, rows) { return h('div', { class: 'nv-sec' }, h('h4', null, title), h('ul', { class: 'nv-rows' }, rows)); }

  /** veth pairs in creation order (the a end, as named in ip link add, and its peer), wherever their ends are now. */
  function pairs(s) {
    var out = [];
    s.order.forEach(function (id) {
      s.netns[id].links.forEach(function (l) {
        if (l.kind === 'veth' && l.end === 'a') out.push({ a: { ns: id, l: l }, b: { ns: l.peer.ns, l: L.peerOf(s, l) }, idx: Math.min(l.idx, L.peerOf(s, l).idx) });
      });
    });
    return out.sort(function (x, y) { return x.idx - y.idx; });
  }

  function nsBox(c, nsId, name, pm) {
    var s = c.state, p = c.params;
    if (!nsId) return h('div', { class: 'nv-ns nv-missing' }, h('div', { class: 'nv-nshead' }, name ? h('b', { translate: 'no' }, name) : null, h('span', { class: 'nv-kind' }, t('nsMissing'))));
    var links = L.ns(s, nsId).links;
    var ports = links.filter(function (l) { return l.kind !== 'lo'; });
    var lo = links.filter(function (l) { return l.kind === 'lo'; });
    return h('div', { class: 'nv-ns' },
      h('div', { class: 'nv-nshead' + chg(has(s, 'ns:' + nsId), c) }, h('b', { translate: 'no' }, nsId), h('span', { class: 'nv-kind' }, t('nsKind')),
        pm.at === nsId + ':' ? stopBadge(pm.ping) : null),
      ports.length ? h('div', { class: 'nv-ports' }, ports.map(function (l) { return iface(c, nsId, l, pm); })) : null,
      h('div', { class: 'nv-ports' }, lo.map(function (l) { return iface(c, nsId, l, pm); })),
      section(t('secRoutes'), routeRows(c, nsId)),
      p.showArp ? section(t('secArp'), arpRows(c, nsId)) : null);
  }

  function bridgeBar(c, cols, pm) {
    var s = c.state, p = c.params;
    var br = L.ns(s, ROOT).links.filter(function (l) { return l.kind === 'bridge'; })[0];
    if (!br) return h('div', { class: 'nv-bridge nv-none' }, t('noBridge'));
    var k = L.key(ROOT, br.name);
    return h('div', { class: 'nv-bridge' + (br.up ? '' : ' nv-down') + (pm.trail.indexOf(k) >= 0 ? ' nv-trail' : '') + chg(has(s, ROOT + ':link:' + br.name), c) },
      h('span', { class: 'nv-dot' + (br.up ? '' : ' nv-hollow'), 'aria-hidden': 'true' }),
      h('span', { class: 'nv-name', translate: 'no' }, br.name), h('span', null, t('bridgeKind')),
      br.addrs.length ? h('span', { class: 'nv-addr', translate: 'no' }, br.addrs.join(' ')) : null,
      h('span', { class: 'nv-muted' }, t(br.up ? 'up' : 'down')),
      pm.at === k ? stopBadge(pm.ping) : null,
      p.showArp ? h('span', { class: 'nv-fdb' }, h('b', null, t('fdbTitle')), br.fdb.length ? br.fdb.map(function (f) {
        return h('span', { class: 'nv-row' + chg(has(s, ROOT + ':fdb:' + br.name + ':' + f.mac), c), translate: 'no' }, f.mac + ' → ' + f.port);
      }) : h('span', { class: 'nv-muted' }, t('fdbEmpty'))) : null);
  }

  function column(c, i, nsId, pair, name, pm) {
    var s = c.state;
    var ends = [], inner = null;
    if (pair) [pair.a, pair.b].forEach(function (e) { if (e.ns === ROOT) ends.push(e); else inner = e; });
    // host ends first in a pair still wholly on the host, the a end (veth1) on the left
    var hostEnd = ends.filter(function (e) { return e.l.peer.ns !== ROOT; })[0] || ends[0];
    var gone = (s.gone[ROOT] || []).filter(function (g) { return pair && (g.name === pair.a.l.name || g.name === pair.b.l.name); });
    var zone = [];
    if (ends.length === 2) zone = [iface(c, ROOT, ends[0].l, pm), h('span', { class: 'nv-wire', 'aria-hidden': 'true' }), iface(c, ROOT, ends[1].l, pm)];
    else if (ends.length === 1) zone = [iface(c, ROOT, ends[0].l, pm)];
    gone.forEach(function (g) { zone.push(' ', ghost(g)); });
    var master = hostEnd && ends.length === 1 ? hostEnd.l.master : null;
    if (ends.length === 1) zone.push(h('span', { class: 'nv-tag' }, master ? t.parts('portTag', { br: data(master) }) : t('looseTag')));
    var stubKey = master ? L.key(ROOT, hostEnd.l.name) : null;
    var onPath = function (k) { return pm.trail.indexOf(k) >= 0; };
    var cableOn = !!(inner && ends.length === 1 && inner.ns === nsId);
    return h('div', { class: 'nv-col', style: { gridColumn: String(i + 1) } },
      h('span', { class: 'nv-stub' + (master ? ' nv-on' : '') + (master && onPath(stubKey) && onPath(L.key(ROOT, master)) ? ' nv-trail' : ''), 'aria-hidden': 'true' }),
      h('div', { class: 'nv-zone' + (ends.length === 2 ? ' nv-both' : '') }, zone),
      h('span', { class: 'nv-cable' + (cableOn ? ' nv-on' : '') + (cableOn && onPath(L.key(inner.ns, inner.l.name)) && onPath(L.key(ROOT, ends[0].l.name)) ? ' nv-trail' : ''), 'aria-hidden': 'true' }),
      nsBox(c, nsId, name, pm));
  }

  function hostSide(c, pm) {
    var s = c.state, p = c.params;
    var lo = L.link(s, ROOT, 'lo');
    var nat = s.nat[0];
    return h('div', { class: 'nv-hside' },
      h('div', { class: 'nv-chips' }, iface(c, ROOT, lo, pm)),
      h('div', { class: 'nv-chips' },
        h('span', { class: 'nv-chip' + (s.ipForward ? ' nv-on' : '') + chg(has(s, 'sys:forward'), c), translate: 'no' }, 'ip_forward = ' + (s.ipForward ? 1 : 0)),
        h('span', { class: 'nv-chip' + (nat ? ' nv-on' : '') + chg(has(s, 'sys:nat'), c) }, nat ? t.parts('natOn', { src: data(nat.src) }) : t('natNone'))),
      section(t('secRoutes'), routeRows(c, ROOT)),
      p.showArp ? section(t('secArp'), arpRows(c, ROOT)) : null,
      pm.at === ROOT + ':' ? stopBadge(pm.ping) : null);
  }

  function world(c) {
    var s = c.state, p = c.params, pm = pingMarks(s);
    var info = presetInfo(p);
    var others = s.order.filter(function (id) { return id !== ROOT; });
    var ps = pairs(s);
    var cols = Math.max(2, others.length, ps.length);
    var wan = L.link(s, ROOT, 'enp1s0');
    var columns = [];
    for (var i = 0; i < cols; i++) columns.push(column(c, i, others[i] || null, ps[i] || null, info.names[i] || null, pm));
    return h('div', { class: 'nv-world' },
      h('div', { class: 'nv-host' },
        h('div', { class: 'nv-hhead' }, h('h3', null, t('hostTitle')), h('span', { class: 'nv-kind' }, t('hostKind')),
          h('span', { class: 'nv-wan' }, iface(c, ROOT, wan, pm))),
        h('div', { class: 'nv-grid', style: { '--cols': String(cols) } }, bridgeBar(c, cols, pm), columns, hostSide(c, pm))),
      h('div', { class: 'nv-gw' + (pm.trail.indexOf('gateway') >= 0 ? ' nv-trail' : '') },
        h('b', null, t('gwTitle')), h('span', { class: 'nv-ip', translate: 'no' }, L.GATEWAY.ip), h('div', { class: 'nv-muted' }, t('gwNote')),
        pm.at === 'gateway' ? stopBadge(pm.ping) : null));
  }

  function atLabel(at) {
    if (at === 'gateway') return t('atGateway');
    var i = at.indexOf(':'), n = at.slice(0, i), dev = at.slice(i + 1);
    if (!dev) return t.parts('atNs', { ns: data(n) });
    return [data(dev), ' (', data(n), ')'];
  }
  function pingLine(c) {
    var s = c.state, pg = s.ping || s.lastPing;
    if (!pg) return h('div', { class: 'nv-ping nv-old' }, h('span', { class: 'nv-muted' }, t('pingNone')));
    var now = !!s.ping;
    return h('div', { class: 'nv-ping' + (now ? '' : ' nv-old') },
      now ? null : h('span', { class: 'nv-muted' }, t('pingEarlier')),
      h('span', { class: 'nv-who', translate: 'no' }, 'ping ' + pg.from + ' → ' + pg.to),
      stopBadge(pg), pg.ok ? null : h('span', null, t.parts('pingAt', { at: h('span', null, atLabel(pg.at)) })));
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'nv' }, shell(c.state, c.params), world(c), pingLine(c)));
  }

  // ── captions ──

  /** How many commands of this op the script ran before step n (first mention or a repeat). */
  function earlier(s, n, op) { return L.SCENES[s.scene].script.slice(0, n - 1).filter(function (x) { return x.op === op; }).length; }

  function pingCaption(c) {
    var s = c.state, pg = s.ping;
    var i = pg.at.indexOf(':'), atNs = pg.at.slice(0, i), atDev = pg.at.slice(i + 1);
    if (pg.ok) {
      if (pg.at === 'gateway') return rich('capPingOkOut');
      var direct = L.lookup(s, pg.from, pg.to, false);
      if (direct && !direct.via) return rich('capPingOkL2', { from: data(pg.from), to: data(atNs) });
      return rich('capPingOk');
    }
    switch (pg.stage) {
      case 'link-down':
        if (atNs === pg.from) return rich('capPingLinkDownSelf', { dev: data(atDev), ns: data(atNs) });
        return rich('capPingLinkDown', { dev: data(atDev), from: data(pg.from),
          where: h('span', null, atNs === ROOT ? t('whereHost') : t.parts('whereNs', { ns: data(atNs) })) });
      case 'no-route': {
        var out = rich('capPingNoRoute', { ns: data(pg.from), dst: data(pg.to) });
        if (s.scene === 'to-the-world' && c.n === 1) out = out.concat(sp(rich('capWorldNote')));
        return out;
      }
      case 'no-arp':
        if (atNs === ROOT && atDev !== 'br0') return rich('capPingNoArp', { from: data(pg.from), dst: data(pg.to), at: data(atDev) });
        return rich('capPingNoArpOther', { dst: data(pg.to) });
      case 'not-forwarded': return rich('capPingNotFwd');
      case 'no-return': return rich('capPingNoReturn', { src: data(L.lookup(s, pg.from, pg.to, false).src) });
    }
    return rich('capErr');
  }

  function caption(c) {
    var s = c.state, cmd = s.cmd, ev = s.event;
    if (c.n === 0) return rich('capStart').concat(sp(rich('capGoal_' + s.scene)));
    if (s.lastError) return rich('capErr');
    switch (cmd.op) {
      case 'netns-add': return rich(earlier(s, c.n, 'netns-add') ? 'capNetnsAdd2' : 'capNetnsAdd', { ns: data(cmd.ns) });
      case 'veth-add': return rich(earlier(s, c.n, 'veth-add') ? 'capVethAdd2' : 'capVethAdd', { a: data(cmd.a), b: data(cmd.b) });
      case 'link-netns': {
        if (!earlier(s, c.n, 'link-netns')) return rich('capMove', { dev: data(cmd.dev), ns: data(cmd.to) });
        var moved = L.link(s, cmd.to, cmd.dev);
        return rich('capMove2', { dev: data(cmd.dev), ns: data(cmd.to), peer: data(moved.peer.name) });
      }
      case 'addr-add': {
        var la = L.link(s, cmd.ns || ROOT, cmd.dev);
        if (la.kind === 'bridge') return rich('capAddrBridge', { addr: data(cmd.addr) });
        return rich('capAddr', { ns: data(cmd.ns || ROOT), addr: data(cmd.addr), dev: data(cmd.dev), net: data(L.prefixOf(cmd.addr)) });
      }
      case 'link-up': {
        var l = L.link(s, cmd.ns || ROOT, cmd.dev);
        if (l.kind === 'bridge') return rich('capUpBridge');
        var peer = L.peerOf(s, l);
        if (peer && !peer.up && l.addrs.length) return rich('capUpNoPeer', { dev: data(l.name), ns: data(cmd.ns || ROOT), peer: data(peer.name), net: data(L.prefixOf(l.addrs[0])) });
        if (l.master) return rich('capUpPortFix', { dev: data(l.name) });
        return rich('capUpBoth', { dev: data(l.name) });
      }
      case 'bridge-add': return rich('capBridgeAdd');
      case 'link-master': {
        var br = L.link(s, ROOT, cmd.master);
        if (!br.up && L.portsOf(s, ROOT, cmd.master).length >= 2) return rich('capMasterDown', { dev: data(cmd.dev), br: data(cmd.master) });
        return rich('capMaster', { dev: data(cmd.dev), br: data(cmd.master) });
      }
      case 'route-add': return rich('capRoute');
      case 'sysctl': return cmd.value == null ? rich('capFwdRead', { v: data(s.ipForward ? 1 : 0) }) : rich('capFwdOn');
      case 'nat': return cmd.oif ? rich('capNat', { src: data(cmd.src), oif: data(cmd.oif) }) : rich('capNatEngine', { src: data(cmd.src) });
      case 'show-links': return rich('capShowLinks');
      case 'show-routes': return rich('capShowRoutes');
      case 'engine':
        if (cmd.what === 'start') return rich('capEngineStart');
        return rich('capEngineRun', { ns: data(cmd.ns), addr: data(cmd.cmds.filter(function (x) { return x.op === 'addr-add'; })[0].addr) });
      case 'ping': return pingCaption(c);
    }
    return rich('capErr');
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'select', label: t('scene'), resets: true,
        options: [['by-hand', t('pByHand')], ['to-the-world', t('pWorld')], ['forgot-up', t('pForgotUp')], ['forgot-forward', t('pForgotFwd')], ['container-view', t('pEngine')]],
        visible: function () { return false; } },
      { key: 'showArp', type: 'toggle', label: t('showArp'), hint: t('showArpHint') }
    ],

    presets: [
      { id: 'by-hand', label: t('pByHand'), params: { scene: 'by-hand' }, hint: t('pByHandHint') },
      { id: 'to-the-world', label: t('pWorld'), params: { scene: 'to-the-world' }, hint: t('pWorldHint') },
      { id: 'forgot-up', label: t('pForgotUp'), params: { scene: 'forgot-up' }, hint: t('pForgotUpHint') },
      { id: 'forgot-forward', label: t('pForgotFwd'), params: { scene: 'forgot-forward' }, hint: t('pForgotFwdHint') },
      { id: 'container-view', label: t('pEngine'), params: { scene: 'container-view' }, hint: t('pEngineHint') }
    ],

    legend: [
      { shape: 'nv-ns', label: t('legNs') },
      { shape: 'nv-up', label: t('legUp') },
      { shape: 'nv-down', label: t('legDown') },
      { shape: 'nv-cable', label: t('legCable') },
      { shape: 'nv-bridge', label: t('legBridge') },
      { shape: 'nv-route', label: t('legRoute') },
      { shape: 'nv-path', label: t('legPath') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
