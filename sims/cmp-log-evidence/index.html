     lines the surviving records up by their timestamps; the table answers the investigation's five questions and the

     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>

<script src="logs.js"></script>
<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SC = L.SCENARIO;
  var M = window.SimdeckModels.logs;
  var IP = '203.0.113.45';

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  /** Minutes from day 0 as a time of day (the night's records all fall on day 0). */
  function hm(m) { var d = ((m % 1440) + 1440) % 1440; return pad(Math.floor(d / 60)) + ':' + pad(d % 60); }
  function b(text) { return h('b', null, text); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  var HOST = { gw: 'Gw', idm: 'Idm', fs: 'Fs' };
  var HUE = { gw: 'var(--c1)', idm: 'var(--c3)', fs: 'var(--c5)' };
  var ACT = { login: 'Login', change: 'Change', export: 'Export' };

  function badge(host) {
    return h('span', { class: 'le-badge', style: { '--hc': HUE[host] } }, t('badge' + HOST[host]));
  }
  function action(s, id) { return s.inv.actions.filter(function (a) { return a.id === id; })[0]; }
  function seen(s, stage) { return L.STAGES.indexOf(s.stage) >= L.STAGES.indexOf(stage); }
  var STATUS = { wiped: 'sWiped', aged: 'sAged' };
  /** Changed in this step: written now, deleted by the wipe now, or aged out at the found step. */
  function fresh(s, at, st) {
    return s.now === at || (st === 'wiped' && s.now === SC.wipe.at) || (st === 'aged' && s.stage === 'found');
  }

  /** One record row: status, time stamp, optional host badge, text. */
  function rec(st, time, host, text, isNew) {
    return h('li', { class: 'le-rec', dataset: { st: st, new: isNew ? '1' : '' } },
      time ? h('span', { class: 'le-t', translate: 'no' }, time) : null,
      host ? badge(host) : null,
      h('span', { class: 'le-txt' }, text),
      STATUS[st] ? h('span', { class: 'le-st', title: t(STATUS[st] + 'L'), 'aria-label': t(STATUS[st] + 'L') }, t(STATUS[st])) : null);
  }

  function hostCard(s, host) {
    var q = s.params, rows = [];
    var a = s.inv.actions.filter(function (x) { return x.host === host; })[0];
    if (a && a.copies.length) {
      var loc = a.copies[0];
      if (loc.status === 'unlogged') rows.push(rec('unlogged', null, null, t('rUnlogged'), fresh(s, a.at, 'unlogged')));
      else rows.push(rec(loc.status, hm(a.stamp), null, t('r' + ACT[a.id]), fresh(s, a.at, loc.status)));
    }
    var w = SC.wipe;
    if (s.now >= w.at && w.hosts.indexOf(host) >= 0) {
      var aged = M.isAged(w.at, s.now, q.keep);
      var gapAt = M.stamp({ host: host, at: w.at }, L.setupOf(q));
      rows.push(rec(aged ? 'aged' : 'gap', null, null, t('rGap', { time: hm(gapAt) }), fresh(s, w.at, aged ? 'aged' : 'gap')));
    }
    var reach = w.hosts.indexOf(host) >= 0;
    var slow = host === 'fs' && q.drift > 0;
    return h('section', { class: 'le-card', dataset: { k: host } },
      h('div', { class: 'le-head' }, badge(host), b(t('host' + HOST[host]))),
      h('div', { class: 'le-sub', dataset: { bad: reach ? '1' : '' } }, t(reach ? 'rightsYes' : 'rightsNo')),
      h('div', { class: 'le-sub', dataset: { bad: slow ? '1' : '' } }, slow ? t('clockSlow', { d: q.drift }) : t('clockOk')),
      h('ul', { class: 'le-recs' }, rows));
  }

  function storeCard(s) {
    var central = s.params.store === 'central', rows = [];
    if (central) {
      s.inv.actions.forEach(function (a) {
        var c = a.copies.filter(function (x) { return x.where === 'central'; })[0];
        if (c) rows.push(rec(c.status, hm(a.stamp), a.host, t('a' + ACT[a.id]), fresh(s, a.at, c.status)));
      });
      s.inv.wipes.forEach(function (w) { rows.push(rec(w.status, hm(w.stamp), w.host, t('rWipe'), fresh(s, w.at, w.status))); });
    }
    return h('section', { class: 'le-card', dataset: { k: 'store', off: central ? '' : '1' } },
      h('div', { class: 'le-head' }, b(t('hostStore'))),
      h('div', { class: 'le-sub' }, t(central ? 'storeOn' : 'storeOff')),
      central ? h('ul', { class: 'le-recs' }, rows) : null);
  }

  function keepStrip(s) {
    var q = s.params, kids = [h('div', { class: 'le-axis' })], sub = [h('span', null, t.n('daysN', q.keep))];
    if (seen(s, 'found')) {
      var max = Math.max(q.found, q.keep) * 1.04;
      var from = Math.max(0, q.found - q.keep);
      var x0 = from / max, x1 = q.found / max;
      kids.push(h('div', { class: 'le-win', style: { left: pct(x0), width: pct(x1 - x0) } }));
      kids.push(h('span', { class: 'le-mark', dataset: { m: 'night' }, style: { left: '0' } }));
      kids.push(h('span', { class: 'le-mark', dataset: { m: 'found' }, style: { left: pct(x1) } }));
      kids.push(h('span', { class: 'le-ml', dataset: { row: 'top' }, style: { left: '0' } }, t('mNight')));
      kids.push(h('span', { class: 'le-ml', dataset: { row: 'bot', side: x1 > 0.6 ? 'l' : '' }, style: { left: pct(x1) } }, t('mFound', { d: q.found })));
      sub.push(h('span', null, t('mWindow', { from: from, to: q.found })));
    }
    return h('div', { class: 'le-strip', dataset: { k: 'keep' } },
      h('div', { class: 'le-lab' }, b(t('laneKeep')), sub),
      h('div', { class: 'le-track' }, kids));
  }

  function orderStrip(s) {
    var kids = [];
    if (seen(s, 'timeline')) {
      var list = s.order.list;
      list.forEach(function (x, i) {
        if (i) {
          var tie = list[i - 1].stamp === x.stamp;
          kids.push(h('span', { class: 'le-sep', dataset: { tie: tie ? '1' : '' } }, tie ? t('orderTie') : '→'));
        }
        var bad = i > 0 && x.seq < list[i - 1].seq || i < list.length - 1 && list[i + 1].seq < x.seq;
        kids.push(h('span', { class: 'le-chip', dataset: { bad: bad && x.id === 'export' ? '1' : '' } },
          h('span', { class: 'le-seq', translate: 'no' }, String(x.seq + 1)),
          h('span', { class: 'le-t', translate: 'no' }, hm(x.stamp)), badge(x.host), t('a' + ACT[x.id])));
      });
      if (list.length < 2) kids.push(h('span', { class: 'le-offtxt' }, t('orderNone')));
    }
    return h('div', { class: 'le-strip', dataset: { k: 'order' } },
      h('div', { class: 'le-lab' }, b(t('laneOrder')), h('span', null, t('laneOrderSub'))),
      h('div', { class: 'le-chips' }, kids));
  }

  var WHY = { unlogged: 'whyUnlogged', wiped: 'whyWiped', aged: 'whyAged' };
  var ORDER_WHY = { gaps: 'whyOrderGaps', drift: 'whyOrderDrift', tie: 'whyOrderTie', wrong: 'whyOrderWrong' };
  var ANS = { yes: 'ansYes', partly: 'ansPartly', no: 'ansNo', ok: 'ansOk', bad: 'ansBad', wait: 'ansWait' };

  function why(s, x) {
    var q = s.params, v = { keep: t.n('daysN', q.keep), found: q.found, d: q.drift, n: s.order.list.length };
    if (x.status === 'yes') return t('y' + cap(x.id));
    if (x.id === 'order') return x.status === 'no' && x.reason === 'gaps' ? t('whyOrderNone') : t(ORDER_WHY[x.reason], v);
    if (x.id === 'tamper') return t(x.reason === 'gap' ? 'whyTamperGap' : 'whyTamperAged');
    return t(WHY[x.reason], v);
  }

  function table(s) {
    var done = s.stage === 'answers';
    var rows = s.questions.map(function (x) {
      var a = done ? x.status : 'wait';
      return h('tr', { dataset: { k: x.id } },
        h('td', null, t('q' + cap(x.id))),
        h('td', { class: 'le-ans', dataset: { a: a } }, t(ANS[a])),
        h('td', null, done ? why(s, x) : ''));
    });
    var acc = done ? (s.access.ok ? 'ok' : 'bad') : 'wait';
    rows.push(h('tr', { dataset: { k: 'access' } },
      h('td', null, t('qAccess')),
      h('td', { class: 'le-ans', dataset: { a: acc } }, t(ANS[acc])),
      h('td', null, done ? t('access' + cap(s.access.who), { keep: t.n('daysN', s.params.keep) }) : t('waitAnswer'))));
    return h('div', { class: 'le-tabwrap' }, h('table', { class: 'le-tab' },
      h('thead', null, h('tr', null, ['thQuestion', 'thAnswer', 'thWhy'].map(function (k) { return h('th', null, t(k)); }))),
      h('tbody', null, rows)));
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'le' },
      h('div', { class: 'le-hosts' }, SC.hosts.map(function (x) { return hostCard(s, x); }), storeCard(s)),
      keepStrip(s), orderStrip(s), table(s),
      h('p', { class: 'le-foot' }, t('foot'))));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, q = s.params;
    var list = s.order.list, ix = list.map(function (x) { return x.id; }).indexOf('export');
    var other = null;
    if (ix >= 0) {
      if (s.order.reason === 'tie') other = list.filter(function (x) { return x.id !== 'export' && x.stamp === list[ix].stamp; })[0];
      else if (s.order.reason === 'wrong') other = list[ix + 1];
    }
    var ex = action(s, 'export');
    var times = { login: SC.actions[0].at, change: SC.actions[1].at, export: SC.actions[2].at, cover: SC.wipe.at };
    var v = {
      time: b(times[s.stage] !== undefined ? hm(times[s.stage]) : ''),
      ip: h('b', { translate: 'no' }, IP),
      drift: b(t('minN', { n: q.drift })),
      stamp: b(hm(ex ? ex.stamp : SC.actions[2].at - q.drift)),
      found: b(String(q.found)),
      keep: b(t.n('daysN', q.keep)),
      expired: b(String(q.keep + 1)),
      n: b(String(list.length)),
      other: b(other ? t('ox' + ACT[other.id]) : ''),
      yes: b(String(s.yes)),
      partly: b(String(s.partly))
    };
    var out = [];
    L.captionKeys(s).forEach(function (k, i) {
      if (i) out.push(' ');
      out = out.concat(t.parts(k, v));
    });
    return out;
  }

  // ── controls ──

  var params = [
    { key: 'store', type: 'choice', label: t('pStore'), options: [['local', t('oLocal')], ['central', t('oCentral')]] },
    { key: 'drift', type: 'range', label: t('pDrift'), min: 0, max: 30, step: 1, format: function (v) { return t('minN', { n: v }); } },
    { key: 'keep', type: 'choice', label: t('pKeep'), options: L.KEEPS.map(function (n) { return [n, t.n('daysN', n)]; }) },
    { key: 'found', type: 'range', label: t('pFound'), min: 1, max: 365, step: 1, format: function (v) { return t.n('daysN', v); } },
    { key: 'fileReads', type: 'toggle', label: t('pFileReads') },
    { key: 'readers', type: 'choice', label: t('pReaders'), options: [['admins', t('oAdmins')], ['named', t('oNamed')]],
      visible: function (p) { return p.store === 'central'; } }
  ];

  var labels = { local: 'prLocal', central: 'prCentral', drift: 'prDrift', 'short-keep': 'prShortKeep',
    'not-logged': 'prNotLogged', 'open-store': 'prOpenStore' };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
      { shape: 'le-kept', label: t('legKept') },
      { shape: 'le-wiped', label: t('legWiped') },
      { shape: 'le-aged', label: t('legAged') },
      { shape: 'le-win', label: t('legWindow') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
