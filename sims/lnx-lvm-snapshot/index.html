     Each step is one write (to the origin or the snapshot) or one read of the snapshot. Model: sim.js; rules: SPEC.md;
     words: strings.js. -->

}
[data-sim="lnx-lvm-snapshot"] .ls .sd-bg-grid { --bg-row-gap: 1.3rem; }

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">

    <div class="sd-titles">

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var C_ORIGIN = 1;     // series colour of the origin's chunks
  var C_SNAP = 2;       // series colour of what the snapshot holds (saved: hatched; its own: solid)

  /** Data (LV names, chunk labels, lvs output) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function sp(parts) { return [' '].concat(parts); }
  function label(chunk, ver) { return chunk + ver; }
  /** A percentage for a caption: whole numbers bare, else two decimals with the language's decimal mark. */
  function pct(v) {
    var r = Math.round(v * 100) / 100;
    var s = r === Math.round(r) ? String(Math.round(r)) : r.toFixed(2).replace('.', t('dec'));
    return t('pct', { p: s });
  }

  /** Caption parts from t(key) or, with n, t.n(key, n): node placeholders are put back where they land (cloned, so a
      node may appear twice), and *English term* becomes <em lang="en"> (the Croatian term rule, for terms the glossary
      lacks). */
  var MARK = '\u0001';
  function rich(key, vars, n) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var text = n === undefined ? t(key, flat) : t.n(key, n, flat);
    var out = [];
    text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
      if (!bit) return;
      bit.split(MARK).forEach(function (piece, j) {
        if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
        else if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }
  function term(key) { return h('span', null, rich(key)); }
  function idx(chunk) { return L.CHUNKS.indexOf(chunk); }

  // ── stage ──

  function render(c) {
    var s = c.state, p = c.params, o = L.norm(p), ev = s.ev, prev = c.prev;
    var writeOrigin = ev && ev.op === 'write' && ev.target === 'origin';
    var newSlots = prev && s.cap > prev.cap ? { from: prev.cap, to: s.cap } : null;

    var origin = s.origin.map(function (x) {
      return { text: label(x.id, x.ver), kind: 'fill', c: C_ORIGIN, now: !!(writeOrigin && ev.chunk === x.id) };
    });

    var cow = [];
    for (var k = 0; k < s.cap; k++) {
      var slot = s.cow[k];
      var now = !!(ev && ev.slot === k) || !!(newSlots && k >= newSlots.from);
      if (!s.valid) cow.push(slot ? { text: label(slot.chunk, slot.ver), kind: 'dead', now: !!(ev && ev.invalidated) } : { kind: 'dead', now: !!(ev && ev.invalidated) });
      else if (slot) cow.push({ text: label(slot.chunk, slot.ver), kind: slot.src === 'origin' ? 'soft' : 'fill', c: C_SNAP, now: now });
      else cow.push({ now: now });
    }

    var reader = L.CHUNKS.split('').map(function (id) {
      var r = L.readSnap(s, id);
      var isRead = !!(ev && ev.op === 'read' && ev.chunk === id);
      if (r.from === 'lost') return { kind: 'bad', now: isRead || !!(ev && ev.invalidated) };
      if (r.from === 'cow') return { text: label(id, r.ver), kind: r.src === 'origin' ? 'soft' : 'fill', c: C_SNAP, sub: '#' + (r.slot + 1), now: isRead || !!(ev && ev.slot === r.slot) };
      return { text: label(id, r.ver), kind: 'ghost', sub: '↑', now: isRead };
    });

    var vg = [];
    for (var v = 0; v < s.vgFree; v++) vg.push({});
    if (!vg.length) vg.push(null);

    var used = s.cow.length;
    var rows = [
      { id: 'origin', label: L.ORIGIN, aside: h('span', { class: 'ls-role' }, t('roleOrigin')), cells: origin },
      { id: 'cow', label: L.SNAP, cells: cow,
        aside: s.valid ? h('span', { class: 'ls-role' }, t('roleCow', { used: used, cap: s.cap })) : h('span', { class: 'ls-bad' }, '✕ ' + t('roleCowLost')) },
      { id: 'reader', label: h('span', null, t('rowReader')), cells: reader,
        aside: s.valid ? h('span', { class: 'ls-role' }, t('roleReader')) : h('span', { class: 'ls-bad' }, '✕ ' + t('roleReaderLost')) },
      { id: 'vg', label: h('span', null, t('rowVg')), cells: vg,
        aside: h('span', { class: 'ls-role' }, s.vgFree ? t.n('roleVg', s.vgFree) : t('roleVgNone')) }
    ];

    var links = [];
    if (ev && writeOrigin && ev.saved !== null) links.push({ from: { row: 'origin', cell: idx(ev.chunk) }, to: { row: 'cow', cell: ev.slot }, now: true });
    if (ev && ev.op === 'read' && ev.read.from === 'cow') links.push({ from: { row: 'cow', cell: ev.read.slot }, to: { row: 'reader', cell: idx(ev.chunk) }, now: true });
    if (ev && ev.op === 'read' && ev.read.from === 'origin') links.push({ from: { row: 'origin', cell: idx(ev.chunk) }, to: { row: 'reader', cell: idx(ev.chunk) }, now: true });
    if (ev && ev.op === 'read' && ev.read.from === 'lost') links.push({ from: { row: 'cow' }, to: { row: 'reader', cell: idx(ev.chunk) }, broken: true });

    var changedPct = !prev || L.pctText(L.dataPct(prev)) !== L.pctText(L.dataPct(s)) || prev.valid !== s.valid;
    var grid = Simdeck.blockGrid({
      dir: c.dir,
      title: h('span', null, t('gridTitle'), ' ', data(L.VG)),
      meta: [t.n('chunksOf', L.CHUNKS.length), t('slotNote')],
      count: { text: h('span', { translate: 'no' }, 'Data% ' + L.pctText(L.dataPct(s))), hl: !!(prev && changedPct) },
      cols: L.CHUNKS.length,
      cellHeight: '3rem',
      rows: rows, links: links,
      foot: [foot(c, changedPct)]
    });
    c.stage.replaceChildren(h('div', { class: 'ls' }, grid));
  }

  function foot(c, changedPct) {
    var s = c.state, p = c.params, o = L.norm(p), prev = c.prev;
    var col = function (x, n) { x = String(x); while (x.length < n) x += ' '; return x; };
    var attr = L.snapAttr(s), dp = L.pctText(L.dataPct(s));
    var attrNow = prev && L.snapAttr(prev) !== attr;
    var lvs = h('pre', { class: 'ls-lvs', translate: 'no' },
      h('span', { class: 'ls-head' }, '  ' + col('LV', 8) + col('VG', 7) + col('Attr', 11) + col('Origin', 8) + 'Data%'), '\n',
      '  ' + col(L.ORIGIN, 8) + col(L.VG, 7) + col(L.originAttr(), 11), '\n',
      '  ' + col(L.SNAP, 8) + col(L.VG, 7),
      h('span', { class: (s.valid ? '' : 'ls-inv ') + (attrNow ? 'ls-now' : '') }, attr), ' ' + col(L.ORIGIN, 8),
      h('span', { class: prev && changedPct ? 'ls-now' : null }, dp));
    var parts = [];
    if (s.valid) {
      var own = s.cow.filter(function (x) { return x.src === 'snap'; }).length;
      parts = [{ n: s.cow.length - own, kind: 'soft', c: C_SNAP }, { n: own, kind: 'fill', c: C_SNAP }];
    } else parts = [{ n: s.cap, kind: 'dead' }];
    var meter = Simdeck.blockGrid.meter({
      total: s.cap, parts: parts, label: t('meterLabel'),
      mark: o.autoextend ? { at: s.cap * o.threshold / 100, label: t('meterTick', { p: pct(o.threshold) }) } : undefined,
      text: h('span', { translate: 'no' }, dp)
    });
    var sc = L.script(p), nx = sc[c.n];
    var next = h('div', { class: 'ls-next' }, h('b', null, t('next')),
      nx ? (nx.op === 'read' ? rich('ioRead', { c: data(nx.chunk), lv: data(L.SNAP) })
        : rich('ioWrite', { c: data(nx.chunk), lv: data(nx.target === 'snap' ? L.SNAP : L.ORIGIN) })) : t('nextNone'));
    var side = h('div', { class: 'ls-side' }, meter, next,
      o.autoextend ? h('div', { class: 'ls-note' }, t('ioAuto', { th: o.threshold, pc: o.percent })) : null);
    return h('div', { class: 'ls-foot' }, h('div', null, lvs, h('div', { class: 'ls-note' }, t('lvsNote'))), side);
  }

  // ── captions ──

  function capWrite(c) {
    var s = c.state, prev = c.prev, ev = s.ev, o = L.norm(c.params);
    var C = data(ev.chunk);
    var nowOrigin = data(label(ev.chunk, L.originOf(s, ev.chunk).ver));
    var used = s.cow.length;
    var base = { c: C, used: used, cap: prev.cap, pct: pct(ev.after) };
    var out;
    if (ev.failed) return rich('capAfterSnap', { c: C });
    if (!prev.valid) return rich('capAfterOrigin', { c: C, now: nowOrigin });
    if (ev.invalidated) {
      out = rich('capInvalid', { c: C, k: prev.cap + 1, cap: prev.cap, invalid: t('termInvalid'), attr: data(L.snapAttr(s)) });
      return out.concat(sp(ev.target === 'origin' ? rich('capInvalidOrigin', { now: nowOrigin }) : rich('capInvalidSnap')));
    }
    var slot = s.cow[L.slotOf(s, ev.chunk)];
    if (ev.target === 'origin') {
      if (!ev.had) out = rich('capFirst', Object.assign({ old: data(label(ev.chunk, ev.saved)) }, base));
      else if (slot.src === 'origin') out = rich('capAgain', Object.assign({ now: nowOrigin, old: data(label(ev.chunk, slot.ver)) }, base));
      else out = rich('capOwnAgain', Object.assign({ now: nowOrigin, old: data(label(ev.chunk, slot.ver)) }, base));
    } else {
      if (!ev.had) out = rich('capSnapNew', Object.assign({ new: data(label(ev.chunk, slot.ver)), orig: nowOrigin }, base));
      else out = rich('capSnapAgain', base);
    }
    if (ev.grew) out = out.concat(sp(rich('capGrew', { was: pct(ev.after), th: o.threshold, g: t.n('capSlots', ev.grew), cap: t.n('capSlots', s.cap), pct: pct(ev.final), vg: t.n('capSlots', s.vgFree) })));
    else if (ev.short) out = out.concat(sp(rich('capShort', { was: pct(ev.after), th: o.threshold, vg: t.n('capSlots', s.vgFree), want: t.n('capSlots', ev.want) })));
    if (s.valid && used === s.cap) out = out.concat(sp(rich('capFull')));
    return out;
  }

  function capRead(c) {
    var s = c.state, ev = s.ev, r = ev.read, C = data(ev.chunk);
    if (r.from === 'lost') return rich('capReadLost', { c: C });
    if (r.from === 'origin') return rich('capReadOrigin', { c: C, ver: data(label(ev.chunk, r.ver)) });
    if (r.src === 'snap') return rich('capReadOwn', { c: C, ver: data(label(ev.chunk, r.ver)) });
    return rich('capReadCow', { c: C, ver: data(label(ev.chunk, r.ver)), now: data(label(ev.chunk, L.originOf(s, ev.chunk).ver)) });
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'select', label: t('scene'), resets: true,
        options: [['fill-up', t('presetFill')], ['same-chunks', t('presetSame')], ['autoextend', t('presetAuto')],
          ['snapshot-write', t('presetSnapWrite')], ['backup-window', t('presetBackup')]],
        visible: function () { return false; } },
      { key: 'cap', type: 'range', label: t('cap'), min: 2, max: 8, resets: true },
      { key: 'vgFree', type: 'range', label: t('vgFree'), min: 0, max: 8, resets: true },
      { key: 'autoextend', type: 'toggle', label: t('autoextend'), resets: true },
      { key: 'threshold', type: 'range', label: t('threshold'), min: 50, max: 95, step: 5, resets: true,
        visible: function (p) { return p.autoextend === true; } },
      { key: 'percent', type: 'range', label: t('percent'), min: 10, max: 100, step: 10, resets: true,
        visible: function (p) { return p.autoextend === true; } }
    ],

    presets: [
      { id: 'fill-up', label: t('presetFill'), params: { scene: 'fill-up', cap: 4, vgFree: 4, autoextend: false }, hint: t('presetFillHint') },
      { id: 'same-chunks', label: t('presetSame'), params: { scene: 'same-chunks', cap: 4, vgFree: 4, autoextend: false }, hint: t('presetSameHint') },
      { id: 'autoextend', label: t('presetAuto'), params: { scene: 'autoextend', cap: 4, vgFree: 6, autoextend: true, threshold: 70, percent: 50 }, hint: t('presetAutoHint') },
      { id: 'snapshot-write', label: t('presetSnapWrite'), params: { scene: 'snapshot-write', cap: 4, vgFree: 4, autoextend: false }, hint: t('presetSnapWriteHint') },
      { id: 'backup-window', label: t('presetBackup'), params: { scene: 'backup-window', cap: 3, vgFree: 4, autoextend: false }, hint: t('presetBackupHint') }
    ],

    legend: [
      { shape: 'hl', label: t('legChanged') },
      { shape: 'bg-fill', c: C_ORIGIN, label: t('legOrigin') },
      { shape: 'bg-soft', c: C_SNAP, label: t('legSaved') },
      { shape: 'bg-fill', c: C_SNAP, label: t('legOwn') },
      { shape: 'slot', label: t('legFree') },
      { shape: 'bg-ghost', label: t('legThrough') },
      { shape: 'bg-dead', label: t('legDead') },
      { shape: 'bg-link', label: t('legLink') }
    ],

    render: render,

    caption: function (c) {
      var s = c.state;
      if (!s.ev) return rich('capStart', { snap: term('termSnap'), snap0: data(L.SNAP), lv: data(L.ORIGIN),
        cow: term('termCow'), n: t.n('capSlots', s.cap), pct: pct(0) });
      return s.ev.op === 'read' ? capRead(c) : capWrite(c);
    }
  });

  // A slider at its end changes nothing on a click: the kit blurs a slider only on 'change', and the clicker's → would
  // then move the slider instead of stepping. Release it after any pointer click (as lnx-cow-filesystem).
  document.querySelector('[data-sd-controls]').addEventListener('click', function (e) {
    var el = e.target;
    if (el.matches && el.matches('input[type="range"]') && e.detail > 0) el.blur();
  });
})();
</script>
</body>
