<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var SEED = 2;          // the trace's seed: fixed, so the same params always draw the same picture
  var DOT_CAP = 60;      // at most this many dots inside; above it one dot stands for k items

  // ── per system: string keys for names, units and nouns ──
  var SYS = {
    'shop': { name: 'sShop', rate: 'perMin', w: 'min', items: 'shopItems', places: 'shopPlaces', rateN: 'shopRate', where: 'whereShop', each: 'eachShop', time: 'timeShop', perW: 'perMin', unit: 'unitMin' },
    'server': { name: 'sServer', rate: 'perS', w: 'ms', items: 'serverItems', places: 'serverPlaces', rateN: 'serverRate', where: 'whereServer', each: 'eachServer', time: 'timeServer', convW: true },
    'build-farm': { name: 'sFarm', rate: 'perH', w: 'min', items: 'farmItems', places: 'farmPlaces', rateN: 'farmRate', where: 'whereFarm', each: 'eachFarm', time: 'timeFarm', perW: 'perMin', unit: 'unitMin' }
  };
  var cur = L.defaults;   // params of the last render (the sliders' value formats read the system from it)
  var sysOf = function (p) { return SYS[p.system] || SYS.shop; };

  // ── numbers in the page's language ──
  /** Three significant digits, trailing zeros dropped (0.2, 10, 1000); a dash for no value. */
  function num(v) {
    if (v == null || !isFinite(v)) return t('noValue');
    var s = Math.abs(v) >= 1000 ? String(Math.round(v)) : String(parseFloat(v.toPrecision(3)));
    return s.replace('.', t('dec'));
  }
  function rate(sys, v) { return t(sys.rate, { v: num(v) }); }
  function wtime(sys, v) { return t(sys.w, { v: num(v) }); }
  function items(sys, v) { return t.n(sys.items, v, { v: num(v) }); }
  function places(sys, v) { return t.n(sys.places, v, { v: num(v) }); }
  function pct(v) { return t('pct', { v: String(Math.round(v * 100)) }); }
  function b(x) { return h('b', null, x); }

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  /** About n round tick values from 0 to max. */
  function ticks(max, n) {
    var raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = mag;
    [1, 2, 2.5, 5, 10].some(function (m) { st = m * mag; return st >= raw; });
    var out = [];
    for (var v = 0; v <= max + 1e-9; v += st) out.push(Math.round(v * 1e6) / 1e6);
    return out;
  }

  // ── the three fields ──
  /** One field; `computed` marks the solved quantity, `bad` replaces its value with "not stable" (rule 4). */
  function field(q, label, sym, val, sub, computed, bad) {
    var attrs = { class: 'll-f', dataset: { q: q } };
    if (computed && !bad) attrs['data-computed'] = '';
    if (bad) attrs['data-bad'] = '';
    return h('div', attrs,
      computed ? h('span', { class: 'll-tag' }, t('equals') + ' ' + t('computed')) : null,
      h('div', { class: 'll-f-label' }, label),
      h('div', { class: 'll-f-val' }, bad ? t('unstable') : [h('i', null, sym), ' ' + t('equals') + ' ', val]),
      h('div', { class: 'll-f-sub' }, sub));
  }
  function fields(st, p) {
    var sys = sysOf(p);
    // Rule 2: one of the two is shown in the other's time unit (the build farm's λ per minute, the server's W in s).
    var lamSub = st.div !== 1 && !sys.convW && st.lambdaPerW != null ? t('perWUnit', { v: num(st.lambdaPerW), u: t(sys.unit) }) : '';
    var wSub = sys.convW && st.W != null ? t('wInS', { v: num(st.W / st.div) }) : '';
    if (st.fromQueue) wSub = (wSub && st.stable ? wSub + ' · ' : '') + t('fromQueueSub', { rho: num(st.rho) });
    // Computed: the solved quantity, and from the queue W as well (rule 5). Not stable: every computed field says so,
    // by hand with the demand λ × W against the places beside it; the set quantities keep their values.
    var comp = { L: st.solveFor === 'L', lambda: st.solveFor === 'lambda', W: st.solveFor === 'W' || st.fromQueue };
    var sub = { L: '', lambda: lamSub, W: wSub };
    if (!st.stable) {
      var why = st.fromQueue ? t('unbounded') : t('demand', { v: num(st.L), p: places(sys, p.places) });
      Object.keys(comp).forEach(function (q) { if (comp[q]) sub[q] = q === 'W' && st.fromQueue ? wSub : why; });
    }
    var bad = function (q) { return !st.stable && comp[q]; };
    return [
      field('L', t('fL'), 'L', st.L == null ? t('noValue') : num(st.L), sub.L, comp.L, bad('L')),
      h('span', { class: 'll-op', 'aria-hidden': 'true' }, t('equals')),
      field('lambda', t('fLambda'), 'λ', st.lambda == null ? t('noValue') : rate(sys, st.lambda), sub.lambda, comp.lambda, bad('lambda')),
      h('span', { class: 'll-op', 'aria-hidden': 'true' }, t('times')),
      field('W', t('fW'), 'W', st.W == null ? t('noValue') : wtime(sys, st.W), sub.W, comp.W, bad('W'))
    ];
  }

  // ── the scene: a box with an entrance and an exit, dots on a conveyor through it ──
  var anim = { raf: 0, dots: [], T: 6, t0: 0 };
  function stopAnim() { if (anim.raf) cancelAnimationFrame(anim.raf); anim.raf = 0; }

  function drawScene(box, st, p) {
    stopAnim();
    var Wd = box.clientWidth, Hd = box.clientHeight;
    if (!Wd || !Hd) return;
    var rem = remPx(), fs = Math.max(16, 0.8 * rem), sys = sysOf(p);
    var svg = s('svg', { width: Wd, height: Hd, role: 'img', 'aria-label': t('scene') });
    box.replaceChildren(svg);
    var side = Math.min(10 * rem, 0.14 * Wd);
    var bx = side, bw = Wd - 2 * side, by = 2.2 * fs, bh = Hd - by - 1.8 * fs;
    var doorY = by + bh / 2, door = Math.min(3.2 * rem, bh * 0.4);
    var bad = !st.stable;
    svg.append(s('rect', { class: 'll-box', x: bx, y: by, width: bw, height: bh, rx: 12, 'data-bad': bad ? '' : null }));
    svg.append(s('line', { class: 'll-door', x1: bx, x2: bx, y1: doorY - door / 2, y2: doorY + door / 2 }));
    svg.append(s('line', { class: 'll-door', x1: bx + bw, x2: bx + bw, y1: doorY - door / 2, y2: doorY + door / 2 }));

    // labels: name and places above the box, doors beside it, the average inside under it
    var head = st.fromQueue
      ? t('sQueue', { c: rate(sys, p.capacity), rho: pct(Math.min(st.rho, 1)) })
      : t('sPlaces', { p: places(sys, p.places), rho: pct(Math.min(st.rho || 0, 1)) });
    svg.append(s('text', { x: bx, y: by - 0.6 * fs, class: 'll-big' }, t(sys.name) + ' · ' + head));
    svg.append(s('text', { x: bx - 0.5 * rem, y: doorY - door / 2 - 0.5 * fs, 'text-anchor': 'end', class: 'll-muted' }, t('sIn')));
    svg.append(s('text', { x: bx + bw + 0.5 * rem, y: doorY - door / 2 - 0.5 * fs, class: 'll-muted' }, t('sOut')));
    if (st.lambda != null) svg.append(s('text', { x: bx - 0.5 * rem, y: doorY + door / 2 + 1.3 * fs, 'text-anchor': 'end', class: 'll-big' }, 'λ ' + rate(sys, st.lambda)));
    if (st.stable && st.lambda != null) svg.append(s('text', { x: bx + bw + 0.5 * rem, y: doorY + door / 2 + 1.3 * fs, class: 'll-big' }, 'λ ' + rate(sys, st.lambda)));

    // how many dots inside, and how many items one dot stands for
    var Lshow = st.stable ? st.L : (st.fromQueue ? DOT_CAP : Math.min(p.places, DOT_CAP));
    var k = Math.max(1, Math.ceil(Lshow / DOT_CAP));
    var N = Math.max(0, Math.round(Lshow / k));
    var foot = st.stable ? t('sInside', { v: items(sys, st.L) }) : t('sWaiting');
    if (k > 1) foot += ' · ' + t('sDot', { k: items(sys, k) });
    svg.append(s('text', { x: bx + bw, y: by + bh + 1.4 * fs, 'text-anchor': 'end', class: st.stable ? 'll-big' : 'll-bad' }, foot));

    // arrows through the doors
    function arrow(x0, x1) {
      svg.append(s('line', { class: 'll-arrow', x1: x0, x2: x1 - 10, y1: doorY, y2: doorY }));
      svg.append(s('path', { class: 'll-arrowhead', d: 'M' + (x1 - 12) + ' ' + (doorY - 7) + ' L' + x1 + ' ' + doorY + ' L' + (x1 - 12) + ' ' + (doorY + 7) + ' Z' }));
    }
    arrow(0.15 * side, bx - 0.2 * side);
    arrow(bx + bw + 0.2 * side, Wd - 0.1 * side);

    // dot size from the room inside
    var pad = 1.2 * rem;
    var r = Math.max(5, Math.min(0.7 * rem, Math.sqrt((bw - 2 * pad) * (bh - 2 * pad) / Math.max(1, N) / 14)));

    // not stable: a queue that only grows, at the entrance
    if (bad) {
      var qn = Math.max(3, Math.floor((side - r) / (2.6 * r)));
      for (var q = 0; q < qn; q++) {
        var qx = bx - 1.6 * r - q * 2.6 * r, qy = doorY - 1.4 * fs - r;
        svg.append(s('circle', { class: 'll-dot-wait', cx: qx, cy: qy, r: r }));
      }
      svg.append(s('text', { x: bx - 0.5 * rem, y: doorY - door / 2 - 1.7 * fs - 2 * r, 'text-anchor': 'end', class: 'll-bad' }, t('unstable')));
    }

    // the conveyor: dots spaced 1/N apart in phase; phase 0–1 is inside, below 0 entering, above 1 leaving
    var outside = (side * 0.75) / bw;
    var period = 1 + 2 * outside;
    var M = N > 0 ? Math.round(N * period) : 0;
    var lanes = function (i) { return by + pad + ((i * 0.6180339887) % 1) * (bh - 2 * pad); };
    var CIRC = 'M' + (-r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0 a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0';
    var DIAM = 'M0 ' + (-1.2 * r) + ' L' + (1.2 * r) + ' 0 L0 ' + (1.2 * r) + ' L' + (-1.2 * r) + ' 0 Z';
    var dots = [];
    for (var i = 0; i < M; i++) {
      var el = s('path', {});
      svg.append(el);
      dots.push({ el: el, i: i, lane: lanes(i), cls: null });
    }
    function place(tau) {
      dots.forEach(function (d) {
        var u = ((d.i / M) * period + tau) % period - outside;     // −outside … 1 + outside
        var cls = u < 0 ? 'll-dot-in' : u > 1 ? 'll-dot-out' : 'll-dot-inside';
        // At most three dots wait at each door (the queue stands in for arrivals when not stable).
        if ((bad && u < 0) || -u * N > 3 || (u - 1) * N > 3) { d.el.setAttribute('visibility', 'hidden'); return; }
        d.el.removeAttribute('visibility');
        if (cls !== d.cls) { d.cls = cls; d.el.setAttribute('class', cls); d.el.setAttribute('d', cls === 'll-dot-out' ? DIAM : CIRC); }
        var x = bx + u * bw, y;
        var e = 0.08;
        if (u < 0 || u > 1) y = doorY;
        else if (u < e) y = doorY + (d.lane - doorY) * (u / e);
        else if (u > 1 - e) y = doorY + (d.lane - doorY) * ((1 - u) / e);
        else y = d.lane;
        d.el.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
      });
    }
    // A stay of W crosses the box in 4–12 s on screen, longer W slower (decorative; the numbers are the model's).
    var range = L.SYSTEMS[p.system].W;
    var wv = st.W == null ? range[0] : Math.min(range[1], Math.max(range[0], st.W));
    anim.T = 4 + 8 * (wv - range[0]) / (range[1] - range[0]);
    place(0);
    if (!Simdeck.reducedMotion() && M > 0) {
      anim.t0 = 0;
      var frame = function (ts) {
        if (!anim.t0) anim.t0 = ts;
        place(((ts - anim.t0) / 1000 / anim.T) % period);
        anim.raf = requestAnimationFrame(frame);
      };
      anim.raf = requestAnimationFrame(frame);
    }
  }

  // ── the time series of L ──
  function drawPlot(box, st, p) {
    var Wd = box.clientWidth, Hd = box.clientHeight;
    if (!Wd || !Hd) return;
    var rem = remPx(), fs = Math.max(16, 0.8 * rem), sys = sysOf(p);
    var svg = s('svg', { width: Wd, height: Hd, role: 'img', 'aria-label': t('plot') });
    box.replaceChildren(svg);
    var tr = L.trace(p, Simdeck.rng(SEED));
    if (!tr.samples.length) return;
    var target = st.stable ? st.L : null;
    var capLine = !st.stable && !st.fromQueue ? p.places : null;
    var ymax = Math.max(tr.max, target || 0, capLine || 0, 1) * 1.08;

    // key above the plot, left to right, wrapping on narrow screens: L(t), running average, λ × W (or the places)
    var keys = [['ll-trace', t('pL')], ['ll-mean', t('pMean')]];
    if (target != null) keys.push(['ll-target', t('pTarget', { v: num(target) })]);
    if (capLine != null) keys.push(['ll-cap', t('pPlaces', { v: num(capLine) }), 'll-bad']);
    if (!st.stable) keys.push([null, t('unbounded'), 'll-bad']);
    else if (st.fromQueue && st.rho >= 0.95) keys.push([null, t('pSlow'), 'll-muted']);
    var kx = 3.6 * rem, row = 0, laid = [];
    keys.forEach(function (k) {
      var el = s('text', { class: k[2] || null }, k[1]);
      svg.append(el);
      var w = (k[0] ? 2.6 * rem : 0) + el.getComputedTextLength();
      if (kx + w > Wd && kx > 3.6 * rem) { row++; kx = 3.6 * rem; }
      laid.push({ cls: k[0], el: el, x: kx, row: row });
      kx += w + 1.4 * rem;
    });
    var m = { l: 3.6 * rem, r: 1 * rem, t: (row + 2.2) * 1.3 * fs, b: 2.6 * fs };
    laid.forEach(function (k) {
      var ky = (k.row + 1) * 1.3 * fs;
      if (k.cls) svg.append(s('line', { class: k.cls, x1: k.x, x2: k.x + 2.2 * rem, y1: ky - 0.3 * fs, y2: ky - 0.3 * fs }));
      k.el.setAttribute('x', k.x + (k.cls ? 2.6 * rem : 0));
      k.el.setAttribute('y', ky);
    });
    var pw = Wd - m.l - m.r, ph = Hd - m.t - m.b;
    // A long server trace (from the queue) is labelled in seconds instead of hundreds of thousands of ms.
    var xs = sys.convW && tr.T >= 20000 ? st.div : 1;
    var X = function (x) { return m.l + x / tr.T * pw; };
    var Y = function (y) { return m.t + ph - y / ymax * ph; };
    var yt = ticks(ymax, Math.max(2, Math.min(5, Math.floor(ph / (2.2 * fs)))));
    yt.forEach(function (v) {
      if (v > ymax) return;
      svg.append(s('line', { class: 'll-grid', x1: m.l, x2: m.l + pw, y1: Y(v), y2: Y(v) }));
      svg.append(s('text', { x: m.l - 0.4 * rem, y: Y(v) + 0.35 * fs, 'text-anchor': 'end' }, num(v)));
    });
    var xt = ticks(tr.T / xs, Math.max(2, Math.min(8, Math.floor(pw / (7 * rem)))));
    xt.forEach(function (v) {
      svg.append(s('line', { class: 'll-tick', x1: X(v * xs), x2: X(v * xs), y1: m.t + ph, y2: m.t + ph + 0.35 * fs }));
      svg.append(s('text', { x: X(v * xs), y: m.t + ph + 1.4 * fs, 'text-anchor': 'middle' }, num(v)));
    });
    svg.append(s('line', { class: 'll-axis', x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph }));
    svg.append(s('line', { class: 'll-axis', x1: m.l, x2: m.l, y1: m.t, y2: m.t + ph }));
    svg.append(s('text', { x: m.l + pw, y: m.t + ph + 2.5 * fs, 'text-anchor': 'end', class: 'll-muted' }, t(xs > 1 ? 'timeS' : sys.time)));

    var path = function (idx) {
      return 'M' + tr.samples.map(function (q) { return X(q[0]).toFixed(1) + ' ' + Y(q[idx]).toFixed(1); }).join(' L');
    };
    svg.append(s('path', { class: 'll-trace', d: 'M' + X(0) + ' ' + Y(tr.samples[0][1]).toFixed(1) + ' L' + path(1).slice(1) }));
    if (target != null) svg.append(s('line', { class: 'll-target', x1: m.l, x2: m.l + pw, y1: Y(target), y2: Y(target) }));
    if (capLine != null) svg.append(s('line', { class: 'll-cap', x1: m.l, x2: m.l + pw, y1: Y(capLine), y2: Y(capLine) }));
    svg.append(s('path', { class: 'll-mean', d: path(2) }));
  }

  // ── captions: the one thing the current picture shows ──
  var lastKey = null, lastP = null, prevP = null;
  function track(p) {
    var key = JSON.stringify(p);
    if (key === lastKey) return;            // a redraw of the same state keeps the last change
    prevP = lastP; lastP = p; lastKey = key;
  }
  function caption(c) {
    track(c.params);
    var st = c.state, p = c.params, sys = sysOf(p);
    var common = {
      l: rate(sys, st.lambda), w: wtime(sys, st.W), L: b(num(st.L)), items: items(sys, st.L),
      where: t(sys.where), each: t(sys.each)
    };
    switch (L.captionKey(st, p, prevP)) {
      case 'queueUnstable': return t.parts('cQueueUnstable', { l: rate(sys, st.lambda), c: rate(sys, p.capacity) });
      case 'queue': return t.parts('cQueue', { c: rate(sys, p.capacity), l: rate(sys, st.lambda), rho: num(st.rho), w: b(wtime(sys, st.W)), L: b(num(st.L)) });
      case 'unstable': return t.parts('cUnstable', { rate: t.n(sys.rateN, st.lambda, { v: num(st.lambda) }), each: t(sys.each), w: wtime(sys, st.W), L: b(num(st.L)), places: places(sys, p.places) });
      case 'changeW': {
        var w0 = L.compute(prevP);
        return t.parts(st.W > w0.W ? 'cChangeW' : 'cChangeWDown', { l: rate(sys, st.lambda), w0: wtime(sys, w0.W), w1: b(wtime(sys, st.W)), L0: num(w0.L), L1: b(num(st.L)), k: num(st.L / w0.L), each: t(sys.each) });
      }
      case 'changeLambda': {
        var l0 = L.compute(prevP);
        return t.parts('cChangeLambda', { w: wtime(sys, st.W), l0: rate(sys, l0.lambda), l1: b(rate(sys, st.lambda)), L0: num(l0.L), L1: b(num(st.L)), k: num(st.L / l0.L) });
      }
      case 'solveW': return t.parts('cSolveW', Object.assign(common, { w: b(wtime(sys, st.W)) }));
      case 'solveLambda': return t.parts('cSolveLambda', Object.assign(common, { l: b(rate(sys, st.lambda)) }));
      default:
        if (sys.convW) return t.parts('cSolveLConvW', Object.assign(common, { ws: t('sec', { v: num(st.W / st.div) }) }));
        if (st.div !== 1) return t.parts('cSolveLConv', Object.assign(common, { lw: t(sys.perW, { v: num(st.lambdaPerW) }) }));
        return t.parts('cSolveL', common);
    }
  }

  var labels = { 'shop': 'presetShop', 'server': 'presetServer', 'build-farm': 'presetFarm', 'measure-w': 'presetMeasure', 'from-queue': 'presetQueue' };
  var range = function (key, top) {
    return {
      min: function (p) { return L.SYSTEMS[p.system][key][0]; },
      max: function (p) { var hi = L.SYSTEMS[p.system][key][1]; return top ? top(p, hi) : hi; }
    };
  };
  var eqBox = null, sceneBox = null, plotBox = null, last = null;

  var sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'system', type: 'choice', label: t('system'), options: [['shop', t('sysShop')], ['server', t('sysServer')], ['build-farm', t('sysFarm')]] },
      { key: 'solveFor', type: 'choice', label: t('solveFor'), options: [['L', t('solveL')], ['W', t('solveW')], ['lambda', t('solveLambda')]],
        disabled: function (p) { return p.fromQueue ? t('solveForOff') : false; } },
      Object.assign({ key: 'lambda', type: 'range', label: t('lambda'), step: 1, format: function (v) { return rate(sysOf(cur), v); },
        visible: function (p) { return p.fromQueue || p.solveFor !== 'lambda'; } },
        range('lambda', function (p, hi) { return p.fromQueue ? L.queueTop(p.capacity) : hi; })),
      Object.assign({ key: 'W', type: 'range', label: t('W'), step: 1, format: function (v) { return wtime(sysOf(cur), v); },
        visible: function (p) { return !p.fromQueue && p.solveFor !== 'W'; } }, range('W')),
      Object.assign({ key: 'L', type: 'range', label: t('L'), step: 1, format: function (v) { return num(v); },
        visible: function (p) { return !p.fromQueue && p.solveFor !== 'L'; } }, range('L')),
      Object.assign({ key: 'places', type: 'range', label: t('places'), step: 1, format: function (v) { return places(sysOf(cur), v); },
        visible: function (p) { return !p.fromQueue; } }, range('places')),
      { key: 'fromQueue', type: 'toggle', label: t('fromQueue'), hint: t('fromQueueHint') },
      Object.assign({ key: 'capacity', type: 'range', label: t('capacity'), step: 1, format: function (v) { return rate(sysOf(cur), v); },
        visible: function (p) { return p.fromQueue; } }, range('capacity'))
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'll-in', label: t('legendIn') },
      { shape: 'll-inside', label: t('legendInside') },
      { shape: 'll-out', label: t('legendOut') },
      { shape: 'll-comp', label: t('legendComputed') },
      { shape: 'll-bad', label: t('legendUnstable') }
    ],
    render: function (c) {
      cur = c.params;
      if (!eqBox) {
        eqBox = h('div', { class: 'll-eq' });
        sceneBox = h('div', { class: 'll-scene' });
        plotBox = h('div', { class: 'll-plot' });
        c.stage.replaceChildren(h('div', { class: 'll' }, eqBox, sceneBox, plotBox));
        var redraw = function () { if (last) { drawScene(sceneBox, last.state, last.params); drawPlot(plotBox, last.state, last.params); } };
        new ResizeObserver(redraw).observe(sceneBox);
      }
      track(c.params);
      last = { state: c.state, params: c.params };
      eqBox.replaceChildren.apply(eqBox, fields(c.state, c.params));
      drawScene(sceneBox, c.state, c.params);
      drawPlot(plotBox, c.state, c.params);
    },
    caption: caption
  });

  // A system picked by hand loads that system's own values (its units and ranges differ); presets bring their own.
  // Turning "W from the queue" on by hand keeps λ (the kit would clamp it to the old C's slider top) and picks the C
  // that puts ρ near 0.8.
  var before = sim.params;
  sim.on(function (c) {
    var was = before;
    before = c.params;
    if (c.preset) return;
    if (was.system !== c.params.system) {
      lastKey = null; lastP = null; prevP = null;
      sim.set(L.SYSTEMS[c.params.system].start);
    } else if (!was.fromQueue && c.params.fromQueue) {
      sim.set({ capacity: L.queueCapacity(was.lambda, c.params.system), lambda: was.lambda });
    }
  });
})();
</script>
</body>
</html>
