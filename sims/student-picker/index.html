<!-- Random student picker: adopted from single-page-labs/random-student-picker.html into the simdeck kit
     (docs/sim-ui.md). A tool (lecturer-only): no steps; the page keeps the list, the model is in sim.js, the words in
     strings.js. The list is kept in sessionStorage so a language switch (which reloads the page) keeps it. -->
<html lang="hr" data-sim="student-picker">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slučajni odabir studenta · simdeck</title>
<meta name="description" content="Nasumični odabir polaznika bez ponavljanja, dok svi ne dođu na red.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "student-picker",
  "class": "tool",
  "title": { "hr": "Slučajni odabir studenta", "en": "Random student picker" },
  "concept": { "hr": "Izvlačenje imena bez ponavljanja, dok svi ne dođu na red", "en": "Drawing names without repeats until everyone has had a turn" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="student-picker"]; colours only from kit tokens. */
[data-sim="student-picker"] .sp {
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  gap: 2.2cqh;
  height: 100%;
  padding: 2.4cqh 2cqw;
}
[data-sim="student-picker"] .sp-result {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  min-height: 24cqh;
  padding: 1rem 1.5rem;
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  text-align: center;
}
[data-sim="student-picker"] .sp-result[data-state="picked"] { border: 0.35rem solid var(--ink); background: var(--hl); color: var(--on-hl); }
[data-sim="student-picker"] .sp-name {
  font-size: max(2.2rem, min(11cqh, 6.5cqw));
  font-weight: 700;
  line-height: 1.1;
  overflow-wrap: anywhere;
}
[data-sim="student-picker"] .sp-result[data-state="rolling"] .sp-name { color: var(--muted); }
[data-sim="student-picker"] .sp-result[data-state="empty"] .sp-name,
[data-sim="student-picker"] .sp-result[data-state="ready"] .sp-name,
[data-sim="student-picker"] .sp-result[data-state="done"] .sp-name { font-size: var(--fs-lg); font-weight: 400; color: var(--muted); }
[data-sim="student-picker"] .sp-hint { font-size: var(--fs-lg); }
[data-sim="student-picker"] .sp-row { display: flex; flex-wrap: wrap; align-items: stretch; gap: 1rem; }
[data-sim="student-picker"] .sp-pick { min-width: 12rem; font-size: var(--fs-lg); }
[data-sim="student-picker"] .sp-stat {
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
  min-width: 7rem;
  padding: 0.3rem 1rem;
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
}
[data-sim="student-picker"] .sp-stat-label { font-size: var(--fs-sm); color: var(--muted); }
[data-sim="student-picker"] .sp-stat-val { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--accent); }
[data-sim="student-picker"] .sp-list {
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 0.6rem;
  min-height: 0;
  overflow: auto;
}
[data-sim="student-picker"] .sp-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  min-height: var(--hit);
  padding: 0.15rem 0.3rem 0.15rem 0.8rem;
  border: var(--line-w) dashed var(--line);
  border-radius: var(--radius-sm);
}
[data-sim="student-picker"] .sp-tag:not(.sd-fill) { background: var(--bg); color: var(--ink); }
[data-sim="student-picker"] .sp-tag.sd-fill { border-style: solid; border-color: var(--c1); }
[data-sim="student-picker"] .sp-tag.sd-changed { border-style: solid; }
[data-sim="student-picker"] .sp-order { font-family: var(--mono); font-weight: 700; }
[data-sim="student-picker"] .sp-x {
  display: grid;
  place-items: center;
  width: 2rem;
  height: 2rem;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
}
[data-sim="student-picker"] .sp-x:hover { outline: var(--line-w) solid currentColor; }
[data-sim="student-picker"] .sp-form { display: flex; flex-direction: column; gap: 0.45rem; }
[data-sim="student-picker"] .sp-form label { font-weight: 700; }
[data-sim="student-picker"] .sp-form textarea,
[data-sim="student-picker"] .sp-form input {
  width: 100%;
  min-height: var(--hit);
  padding: 0.3rem 0.5rem;
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--ink);
  font: inherit;
}
[data-sim="student-picker"] .sp-form textarea { min-height: 5.5rem; resize: vertical; }
[data-sim="student-picker"] .sp-form ::placeholder { color: var(--muted); opacity: 1; }
[data-sim="student-picker"] .sp-inline { display: flex; gap: 0.5rem; }
[data-sim="student-picker"] .sp-inline input { flex: 1; min-width: 0; }
[data-sim="student-picker"] .sp-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
/* Phone and portrait: the kit gives the stage a fixed height; let the list grow with the page instead of a tiny scroll. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="student-picker"] .sd-stage { height: auto; min-height: min(55vh, 26rem); container-type: inline-size; }
  [data-sim="student-picker"] .sp { height: auto; grid-template-rows: auto auto auto; }
  [data-sim="student-picker"] .sp-list { overflow: visible; }
}
</style>
</head>
<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Slučajni odabir studenta</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div class="sd-group sp-form" role="group" aria-labelledby="sp-list-title">
        <h2 class="sd-group-title" id="sp-list-title" data-t="listTitle"></h2>
        <label for="sp-bulk" data-t="bulkLabel"></label>
        <textarea id="sp-bulk" rows="3"></textarea>
        <div class="sp-actions"><button type="button" class="sd-btn" id="sp-import" data-t="bulkButton"></button></div>
        <label for="sp-name" data-t="nameLabel"></label>
        <div class="sp-inline">
          <input type="text" id="sp-name" autocomplete="off">
          <button type="button" class="sd-btn" id="sp-add" data-t="addButton"></button>
        </div>
        <div class="sp-actions">
          <button type="button" class="sd-btn" id="sp-round" data-t="newRound"></button>
          <button type="button" class="sd-btn" id="sp-clear" data-t="clearAll"></button>
        </div>
      </div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings); // picks the language; every visible word goes through t
  var KEY = 'simdeck.student-picker';

  // The list lives in the page, not in the kit's params (it is text, not a setting). sessionStorage keeps it across
  // the reload a language switch does; it may be unavailable, and the page then simply starts empty.
  function load() {
    try { var raw = sessionStorage.getItem(KEY); if (raw) return L.sanitize(JSON.parse(raw)); } catch (e) { /* unavailable */ }
    return L.empty();
  }
  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* unavailable */ } }

  var state = load();
  var note = null;       // what the last action did, for the caption: [key, vars] pairs
  var rolling = null;    // the name shown while the draw spins, or null
  var timer = null;
  var sim;

  var fresh = false;     // the result box pops in once, right after a draw

  function update(next, msg, pop) { state = next; note = msg || null; save(); fresh = !!pop; sim.render(); fresh = false; }

  // A uniform number in [0, 1) for the draw; Math.random only where crypto is missing. The model stays pure.
  function uniform() {
    try { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; } catch (e) { return Math.random(); }
  }

  function addNames(list) {
    var r = L.add(state, list);
    var msg = [];
    if (r.added) msg.push(['captionAdded', r.added]);
    if (r.duplicate) msg.push(['captionDuplicate', r.duplicate]);
    if (r.full) msg.push(['captionFull', r.full]);
    if (!msg.length) msg.push(['captionNothing']);
    update(r.state, msg);
    return r.added > 0;
  }

  function pickNext() {
    if (rolling !== null || state.names.length === 0) return;
    var next = L.pick(state, uniform());
    if (next.last === null) { update(next, [['allPicked']]); return; }
    var spin = sim.params.roll && !Simdeck.reducedMotion();
    if (!spin) { update(next, null, true); return; }
    // The original's roll: 14–21 ticks of 80 ms showing random names from the whole list, then the winner.
    var ticks = 0, max = 14 + Math.floor(uniform() * 8), all = state.names.slice();
    rolling = all[0];
    timer = setInterval(function () {
      ticks++;
      rolling = all[Math.floor(uniform() * all.length)];
      sim.render();
      if (ticks >= max) { clearInterval(timer); timer = null; rolling = null; update(next, null, true); }
    }, 80);
    sim.render();
  }

  function stopRoll() { if (timer) { clearInterval(timer); timer = null; } rolling = null; }

  var bulk = document.getElementById('sp-bulk');
  var name = document.getElementById('sp-name');
  bulk.placeholder = t('bulkPlaceholder');
  name.placeholder = t('namePlaceholder');
  name.maxLength = L.MAX_LEN;

  document.getElementById('sp-import').addEventListener('click', function () {
    if (rolling !== null) return;
    addNames(L.splitBulk(bulk.value));
    bulk.value = '';
    bulk.blur(); // the list is in: P (and the clicker keys) belong to the page again, not to the text field
  });
  function addOne() {
    if (rolling !== null) return;
    if (addNames([name.value])) name.value = '';
    name.focus();
  }
  document.getElementById('sp-add').addEventListener('click', addOne);
  name.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addOne(); } });
  document.getElementById('sp-round').addEventListener('click', function () { stopRoll(); update(L.newRound(state), [['captionRound']]); });
  document.getElementById('sp-clear').addEventListener('click', function () { stopRoll(); update(L.clear(), [['captionCleared']]); });
  // Buttons never keep focus on click, as the kit's own (docs/sim-ui.md §3), so a key press after a click is a shortcut.
  Array.prototype.forEach.call(document.querySelectorAll('.sp-form .sd-btn'), function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  function stat(label, value) {
    return h('div', { class: 'sp-stat' }, h('span', { class: 'sp-stat-label' }, t(label)), h('span', { class: 'sp-stat-val' }, String(value)));
  }

  function resultBox() {
    var left = L.pool(state).length;
    if (rolling !== null) {
      return h('div', { class: 'sp-result', dataset: { state: 'rolling' } },
        h('div', { class: 'sp-name', translate: 'no' }, rolling), h('div', { class: 'sp-hint' }, t('rolling')));
    }
    if (state.names.length === 0) return h('div', { class: 'sp-result', dataset: { state: 'empty' } }, h('div', { class: 'sp-name' }, t('emptyList')));
    if (state.last !== null) {
      return h('div', { class: 'sp-result' + (fresh ? ' sd-anim-in' : ''), dataset: { state: 'picked' } },
        h('div', { class: 'sp-name', translate: 'no' }, state.last),
        h('div', { class: 'sp-hint' }, left > 0 ? t.n('remain', left) : t('captionDone')));
    }
    if (left === 0) return h('div', { class: 'sp-result', dataset: { state: 'done' } }, h('div', { class: 'sp-name' }, t('allPicked')));
    return h('div', { class: 'sp-result', dataset: { state: 'ready' } }, h('div', { class: 'sp-name' }, t('ready')));
  }

  function tag(n, i) {
    var order = state.picked.indexOf(n);
    var cls = 'sp-tag' + (order >= 0 ? ' sd-fill' : '') + (n === state.last && rolling === null ? ' sd-changed' : '');
    return h('div', { class: cls, dataset: { c: '1' } },
      order >= 0 ? h('span', { class: 'sp-order', 'aria-hidden': 'true' }, '✓' + (order + 1)) : null,
      h('span', { translate: 'no' }, n),
      h('button', { type: 'button', class: 'sp-x', 'aria-label': t('remove', { name: n }), title: t('remove', { name: n }),
        onmousedown: function (e) { e.preventDefault(); },
        onclick: function () { if (rolling !== null) return; update(L.remove(state, i), [['captionRemoved', null, { name: n }]]); } }, '✕'));
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'roll', type: 'toggle', label: t('roll'), hint: t('rollHint') }
    ],

    legend: [
      { shape: 'hollow', label: t('legendLeft') },
      { c: 1, label: t('legendPicked') },
      { shape: 'hl', label: t('legendLast') }
    ],

    keys: [{ key: 'p', label: t('keyPick'), run: pickNext }],

    render: function (c) {
      var busy = rolling !== null || state.names.length === 0;
      var pick = h('button', { type: 'button', class: 'sd-btn sd-btn--primary sp-pick', 'aria-keyshortcuts': 'p',
        'aria-disabled': busy ? 'true' : 'false', onmousedown: function (e) { e.preventDefault(); }, onclick: pickNext },
        h('span', null, '▶ ' + t('pick')), h('kbd', null, 'P'));
      c.stage.replaceChildren(h('div', { class: 'sp' },
        resultBox(),
        h('div', { class: 'sp-row' }, pick,
          stat('statTotal', state.names.length), stat('statPicked', state.picked.length), stat('statRemain', L.pool(state).length),
          h('div', { class: 'sp-stat' }, h('span', { class: 'sp-stat-label' }, t('listTitle')),
            h('span', { class: 'sp-stat-val' }, t('count', { n: state.names.length, max: L.MAX })))),
        h('div', { class: 'sp-list' }, state.names.map(tag))));
    },

    caption: function () {
      if (rolling !== null) return t('rolling');
      var who = function (n) { return h('b', { translate: 'no' }, n); };
      var out = [];
      if (note) {
        note.forEach(function (m) {
          if (out.length) out.push(' ');
          if (m[0] === 'captionFull') out.push(t.n(m[0], m[1], { max: L.MAX }));
          else if (m[1] != null) out.push(t.n(m[0], m[1]));
          else if (m[2]) out = out.concat(t.parts(m[0], { name: who(m[2].name) }));
          else out.push(t(m[0]));
        });
        return out;
      }
      if (state.names.length === 0) return t('captionEmpty');
      var left = L.pool(state).length;
      if (state.last !== null) return t.parts('captionPicked', { name: who(state.last) }).concat(' ', left > 0 ? t.n('remain', left) : t('captionDone'));
      if (left === 0) return t('captionDone');
      return t.n('captionReady', state.names.length);
    }
  });
})();
</script>
</body>
</html>
