<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PRESET_KEY = { erre: 'pErre', 'erre-pipefail': 'pErrePf', nightly: 'pNightly', 'and-or': 'pAndOr' };
  var SCRIPT_KEY = { erre: 'sErre', 'erre-pipefail': 'sErrePf', nightly: 'sNightly', 'and-or': 'sAndOr' };
  var EX_KEY = { cond: 'exCond', notlast: 'exNotLast', member: 'exMember', bang: 'exBang' };

  function code(s) { return h('code', { translate: 'no' }, s); }
  function fmt(st) { return st === L.NZ ? '≠0' : String(st); }
  /** A status badge: 0 filled with a check, non-zero hollow with the number, null (did not run) dashed. */
  function badge(st, lit) {
    var attrs = { class: 'es-st' + (lit ? ' sd-changed' : ''), translate: 'no' };
    if (st === null || st === undefined) { attrs.dataset = { none: '' }; return h('span', attrs, '–'); }
    if (st !== 0) { attrs.dataset = { fail: '' }; if (st === L.NZ) attrs.title = t('unknownNz'); return h('span', attrs, fmt(st)); }
    return h('span', attrs, h('span', { 'aria-hidden': 'true' }, '✓'), '0');
  }
  function fdBadge(fd) { return h('span', { class: 'es-n', dataset: { fd: String(fd) }, 'aria-label': t(fd === 2 ? 'fd2' : 'fd1') }, String(fd)); }
  function size(bytes) {
    var lang = document.documentElement.lang === 'en' ? 'en' : 'hr';
    var nf = new Intl.NumberFormat(lang === 'en' ? 'en-GB' : 'hr-HR', { maximumFractionDigits: 1, minimumFractionDigits: 1 });
    return bytes >= 1e9 ? t('gb', { n: nf.format(bytes / 1e9) }) : t('mb', { n: nf.format(bytes / 1e6) });
  }
  /** '= 1', or '≠ 0' when the exact status is unknown. */
  function eq(st) { return st === L.NZ ? '≠ 0' : '= ' + st; }
  function onOff(v) { return t(v ? 'on' : 'off'); }
  function scriptHasMail(p) { return L.scriptOf(p).lines.some(function (ln) { return /\bmail\b/.test(ln.src); }); }

  // ── captions ──

  function memberText(m) { return code(m.text); }

  function caption(c) {
    var p = c.params, s = c.state, ev = s.lastEvent;
    if (ev.code === 'start') return t.parts('cStart', { file: code(s.file), e: onOff(s.opts.errexit), pf: onOff(s.opts.pipefail) });
    if (ev.code === 'end') {
      var res = t.parts(ev.stopped ? 'cEndStop' : s.exited !== null && c.prev && c.prev.lastEvent.code === 'exit' ? 'cEndExit' : 'cEnd',
        { st: code(eq(s.exited)), line: String(ev.line) });
      var day = s.files[L.CKP_DAY];
      if (day) {
        var ck = { file: code(L.CKP_DAY.split('/').pop()), size: size(day.bytes), prev: size(s.files[L.CKP_PREV].bytes) };
        res.push(' ', h('span', { class: 'sd-hl' }, t.parts(s.mail.length ? 'cEndNightly' : 'cEndNoMail', ck)));
      }
      return res;
    }
    var v = s.view, no = String(v.line);
    var out = [];
    function add(parts) { if (out.length) out.push(' '); out.push.apply(out, parts); }

    if (ev.code === 'cond') {
      var cm = v.pipes[0].members[0];
      add(t.parts('cCond', { no: no, cmd: memberText(cm), st: code(fmt(ev.condStatus)) }));
      if (/date \+%u/.test(cm.text)) add([t('cSunday')]);
      if (ev.taken) add([t('cCondThen')]);
      else add(t.parts('cCondNone', { st: code(fmt(ev.condStatus)) }));
      if (s.opts.errexit && ev.condStatus !== 0) add([t('cExCond')]);
      return out;
    }

    // the pipelines and the operators between them
    var first = v.pipes[0];
    function describePipe(pl, k) {
      if (pl.members.length === 1) {
        if (k === 0) return t.parts(v.pipes.length > 1 ? 'cListHead' : 'cCmd', { no: no, cmd: memberText(pl.members[0]), st: code(fmt(pl.status)) });
        return null;
      }
      var sts = code(pl.statuses.map(fmt).join(' '));
      var anyFail = pl.statuses.some(function (x) { return x !== 0; });
      var key = s.opts.pipefail ? (anyFail ? 'cPipePf' : 'cPipePfNone') : 'cPipe';
      return t.parts(key, { no: no, sts: sts, st: code(fmt(pl.status)) });
    }
    // a failure the pipeline hides (task caption 1), and a stop by pipefail (task caption 2), replace the generic sentence
    var hidden = null;
    v.pipes.forEach(function (pl) {
      if (!pl.ran || pl.members.length < 2 || pl.status !== 0) return;
      pl.members.forEach(function (m) { if (m.exempt === 'member' && !hidden) hidden = { a: m, last: pl.members[pl.members.length - 1] }; });
    });
    var pfStop = ev.code === 'stop' && s.opts.pipefail && v.pipes[v.lastRan].members.length > 1;
    if ((hidden || pfStop) && v.pipes.length === 1) add(t.parts('cMembers', { no: no, sts: code(first.statuses.map(fmt).join(' ')), st: code(fmt(first.status)) }));
    else add(describePipe(first, 0));
    v.ops.forEach(function (o, k) {
      var nxt = v.pipes[k + 1];
      var cmdText = code(nxt.members.map(function (m) { return m.text; }).join(' | '));
      if (o.run) add(t.parts('cOpRun', { op: code(o.op), st: code(fmt(o.looked)), cmd: cmdText, st2: code(fmt(nxt.status)) }));
      else add(t.parts('cOpSkip', { op: code(o.op), st: code(fmt(o.looked)), cmd: cmdText }));
    });
    if (v.ops.length) add(t.parts('cListSt', { st: code(fmt(v.status)) }));
    if (v.ops.length >= 2 && v.ops[0].op === '&&' && v.ops[0].looked === 0 && v.ops[1].op === '||' && v.ops[1].run) add([h('span', { class: 'sd-hl' }, t('cNotIfElse'))]);

    if (hidden) add([h('span', { class: 'sd-hl' }, t.parts(s.opts.errexit ? 'cPipeHides' : 'cPipeHidesNoE',
      { a: memberText(hidden.a), st: code(fmt(hidden.a.status)), last: memberText(hidden.last) }))]);
    else if (v.pipes.some(function (pl) { return pl.members.some(function (m) { return m.stderr; }); }) && v.status === 0) add([t('cStderrNote')]);

    if (s.opts.errexit && !ev.code.match(/stop/)) {
      v.pipes.forEach(function (pl) {
        if (!pl.ran) return;
        pl.members.forEach(function (m) { if (m.exempt === 'notlast') add(t.parts('cExNotLast', { cmd: memberText(m) })); });
      });
    }
    // files and mail written on this line
    if (c.prev) Object.keys(s.files).forEach(function (f) {
      if (!c.prev.files[f] || c.prev.files[f].bytes !== s.files[f].bytes) add(t.parts('cFile', { file: code(f.split('/').pop()), size: size(s.files[f].bytes) }));
    });
    if (c.prev && s.mail.length > c.prev.mail.length) add([t('cMail', { subj: s.mail[s.mail.length - 1] })]);

    if (ev.code === 'exit') add(t.parts('cExit', { st: code(fmt(s.exited)) }));
    else if (ev.code === 'stop') {
      if (pfStop) add([h('span', { class: 'sd-hl' }, t.parts(scriptHasMail(p) ? 'cPfStopMail' : 'cPfStop', { st: code(fmt(v.status)) }))]);
      else add(t.parts('cStop', { st: code(fmt(v.status)) }));
    } else if (!s.opts.errexit && v.status !== 0) add([t('cGoesOn')]);
    return out;
  }

  // ── the stage ──

  function render(c) {
    var p = c.params, s = c.state;
    var rows = L.listing(p);
    var curLine = s.view ? s.view.line : null;
    var nextNo = s.next === null ? null : s.next + 1;

    var listing = h('div', { class: 'es-box es-listing' },
      h('div', { class: 'es-head' }, h('span', null, t.parts('listing', { file: code(s.file) }))),
      h('div', { class: 'es-lines' }, rows.map(function (r) {
        var ran = r.no !== null && s.badges[String(r.no)] !== undefined;
        var lit = r.no !== null && r.no === curLine;
        var ptr = lit ? '▶' : r.no !== null && r.no === nextNo ? '›' : '';
        return h('div', { class: 'es-ln' + (lit ? ' sd-changed' : ''), dataset: Object.assign({ kind: r.kind },
            ran ? { ran: '' } : {}, r.off ? { off: '' } : {}, r.added ? { added: '' } : {}) },
          h('span', { class: 'es-ptr', 'aria-label': lit ? t('lineNow', { no: r.no }) : ptr ? t('nextLine') : null }, ptr),
          h('span', { class: 'es-no' }, r.no === null ? '+' : String(r.no)),
          h('span', { class: 'es-src' }, h('span', { translate: 'no' }, r.src),
            r.off ? h('span', { class: 'es-tag' }, ' — ', t('offBySwitch')) : null,
            r.added ? h('span', { class: 'es-tag' }, ' — ', t('addedBySwitch')) : null),
          ran ? badge(s.badges[String(r.no)], lit) : h('span'));
      })));

    // the line of this step
    var now;
    if (!s.view) {
      now = h('div', { class: 'es-box es-now' },
        h('div', { class: 'es-head' }, h('span', null, t(s.lastEvent.code === 'end' ? 'endLine' : 'noLine'))),
        s.lastEvent.code === 'end' ? h('div', { class: 'es-verdict' },
          h('span', { class: 'es-reg-name', translate: 'no' }, s.file), h('span', { 'aria-hidden': 'true' }, '→'),
          h('span', { class: 'es-reg-name', translate: 'no' }, '$?'), badge(s.exited, true)) : h('div', { class: 'es-empty' }));
    } else {
      var v = s.view;
      var flow = [];
      v.pipes.forEach(function (pl, k) {
        if (k > 0) {
          var o = v.ops[k - 1];
          flow.push(h('div', { class: 'es-gate', dataset: o.run ? {} : { skip: '' } },
            h('span', { class: 'es-op', translate: 'no' }, o.op),
            h('span', { class: 'es-looked' }, badge(o.looked, true), h('span', { 'aria-hidden': 'true' }, '⇒'), t(o.run ? 'lookedRun' : 'lookedSkip'))));
        }
        var members = [];
        pl.members.forEach(function (m, i) {
          if (i > 0) {
            var piped = pl.piped[i - 1] || [];
            members.push(h('span', { class: 'es-pipe', translate: 'no' }, '|',
              piped.length ? h('span', { class: 'es-in' }, piped.map(function (x) { return x.text || t('dumpData'); }).join(' ')) : null));
          }
          var ex = m.exempt && s.opts.errexit && m.status !== 0;
          members.push(h('div', { class: 'es-cmd' + (ex ? ' sd-hatch' : ''), dataset: Object.assign({}, m.ran ? {} : { skip: '' }, ex ? { ex: '' } : {}) },
            h('span', { class: 'es-txt', translate: 'no' }, (i === 0 && pl.bang ? '! ' : '') + m.text + (m.redirect ? ' ' + m.redirect.op + ' ' + m.redirect.file.split('/').pop() : '')),
            m.ran ? badge(m.status, pl.members.length === 1 && pl.source === i && isDecider(v, k)) : h('span', { class: 'es-why' }, t('skipped')),
            m.stderr ? h('span', { class: 'es-err' }, fdBadge(2), h('span', { 'aria-hidden': 'true' }, '→'), t('toTerminal')) : null,
            ex ? h('span', { class: 'es-why' }, t(EX_KEY[m.exempt])) : null));
        });
        var multi = pl.members.length > 1;
        flow.push(h('div', { class: 'es-pl', dataset: multi ? { multi: '' } : {} },
          h('div', { class: 'es-members' }, members),
          multi && pl.ran ? h('div', { class: 'es-plst' }, t('pipeStatus'), h('span', { 'aria-hidden': 'true' }, '→'), badge(pl.status, isDecider(v, k))) : null));
      });
      var verdict;
      var ev = s.lastEvent;
      if (ev.code === 'exit') verdict = h('span', { class: 'es-e', dataset: { stop: '' } }, t('exitCmd'));
      else if (v.inCond) verdict = h('span', { class: 'es-e', dataset: { off: '' } }, t(s.opts.errexit ? 'eIgnored' : 'eOff'));
      else if (!s.opts.errexit) verdict = h('span', { class: 'es-e', dataset: { off: '' } }, t('eOff'));
      else verdict = h('span', { class: 'es-e' + (v.stop ? ' sd-changed' : ''), dataset: v.stop ? { stop: '' } : {} }, t(v.stop ? 'eStop' : 'eGo'));
      now = h('div', { class: 'es-box es-now' },
        h('div', { class: 'es-head' }, h('span', null, t(v.part === 'cond' ? 'lineCond' : v.part === 'then' ? 'lineThen' : 'lineNow', { no: v.line }))),
        h('div', { class: 'es-flow' }, flow),
        h('div', { class: 'es-verdict' }, h('span', { class: 'es-reg-name', translate: 'no' }, '$?'), badge(s.lastStatus, false), verdict));
    }

    // registers and switches
    var regs = h('div', { class: 'es-box' },
      h('div', { class: 'es-regs' },
        h('div', { class: 'es-reg' }, h('span', { class: 'es-reg-name es-big', translate: 'no' }, '$?'), h('span', { class: 'es-big' }, badge(s.lastStatus, s.view !== null && c.prev && c.prev.lastStatus !== s.lastStatus))),
        h('div', { class: 'es-small' }, t('registerLabel')),
        h('div', { class: 'es-reg' }, h('span', { class: 'es-reg-name', translate: 'no' }, 'PIPESTATUS')),
        h('div', { class: 'es-ps' }, s.pipeStatus ? s.pipeStatus.map(function (x) { return badge(x, false); }) : badge(null), h('span', { class: 'es-small' }, '(', t('bashOnly'), ')')),
        h('div', { class: 'es-lamps', 'aria-label': t('switches') },
          lamp('set -e', s.opts.errexit), lamp('pipefail', s.opts.pipefail))));
    function lamp(name, on) {
      return h('span', { class: 'es-lamp', dataset: on ? { on: '' } : {} }, h('i', { 'aria-hidden': 'true' }), h('b', { translate: 'no' }, name), h('span', null, onOff(on)));
    }

    // the terminal: the caller's command line, the script's output, and at the end what the caller prints
    var newFrom = c.prev ? c.prev.out.length : s.out.length;
    var tl = [h('div', { class: 'es-tl', dataset: { prompt: '' } }, h('span', { translate: 'no' }, '$ ' + s.file + '; echo "' + t('callerSays') + ': $?"'))];
    s.out.forEach(function (o, i) {
      tl.push(h('div', { class: 'es-tl' + (i >= newFrom ? ' sd-changed' : '') }, fdBadge(o.fd), h('span', { translate: 'no' }, o.text)));
    });
    if (s.lastEvent.code === 'end') tl.push(h('div', { class: 'es-tl sd-changed' }, h('span', { translate: 'no' }, t('callerSays') + ': ' + fmt(s.exited)),
      s.exited === L.NZ ? h('span', { class: 'es-tag' }, '(', t('unknownNz'), ')') : null));
    var term = h('div', { class: 'es-box es-term' }, h('div', { class: 'es-head' }, h('span', null, t('terminal'))), h('div', { class: 'es-tlines' }, tl));

    var side = [regs, term];
    var names = Object.keys(s.files);
    if (scriptHasMail(p) || names.length) {
      var mailNew = c.prev && s.mail.length > c.prev.mail.length;
      var mail = h('div', { class: 'es-box' }, h('div', { class: 'es-head' }, h('span', null, t('mailbox'))),
        s.mail.length ? s.mail.map(function (m) { return h('div', { class: 'es-item' + (mailNew ? ' sd-changed' : '') }, h('span', { class: 'es-mono', translate: 'no' }, '✉ ' + m)); })
          : h('div', { class: 'es-item es-small' }, t('mailNone')));
      var all = names.slice();
      if (all.indexOf(L.CKP_DAY) < 0 && p.script === 'nightly') all.push(L.CKP_DAY);
      all.sort();
      var files = h('div', { class: 'es-box' }, h('div', { class: 'es-head' }, h('span', null, t('files'))),
        all.map(function (f) {
          var fl = s.files[f];
          var changed = fl && c.prev && (!c.prev.files[f] || c.prev.files[f].bytes !== fl.bytes);
          return h('div', { class: 'es-item' + (changed ? ' sd-changed' : '') },
            h('span', { class: 'es-mono', translate: 'no' }, f.split('/').pop()),
            h('span', { class: 'es-small' }, fl ? [size(fl.bytes), ' · ', t(fl.before ? 'weekBefore' : 'newFile')] : t('notYet')));
        }));
      side.push(h('div', { class: 'es-extra' }, mail, files));
    }

    c.stage.replaceChildren(h('div', { class: 'es' }, listing, now, h('div', { class: 'es-side' }, side)));
  }

  /** The status that decided this step: the one set -e looked at (the list's last pipeline that ran). */
  function isDecider(v, k) { return !v.inCond && k === v.lastRan; }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'script', type: 'choice', label: t('script'), resets: true,
        options: L.SCRIPT_IDS.map(function (id) { return [id, t(SCRIPT_KEY[id])]; }) },
      { key: 'errexit', type: 'toggle', label: t('errexit'), hint: t('errexitHint') },
      { key: 'pipefail', type: 'toggle', label: t('pipefail'), hint: t('pipefailHint') }
    ],

    presets: L.SCRIPT_IDS.map(function (id) {
      var o = L.SCRIPTS[id].opts;
      return { id: id, label: t(PRESET_KEY[id]), params: { script: id, errexit: o.errexit, pipefail: o.pipefail } };
    }),

    legend: [
      { shape: 'es-ok', label: t('legendOk') },
      { shape: 'es-fail', label: t('legendFail') },
      { shape: 'es-skip', label: t('legendSkip') },
      { shape: 'es-ex', label: t('legendEx') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
