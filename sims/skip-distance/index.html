}

<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="skip-distance"]; colours only from kit tokens. */
[data-sim="skip-distance"] .sk { height: 100%; padding: 1cqh 1.6cqw; display: flex; flex-direction: column; gap: 0.6rem; }
[data-sim="skip-distance"] .sk-box { position: relative; min-height: 8rem; }
[data-sim="skip-distance"] .sk-scene { flex: 1; }
[data-sim="skip-distance"] .sk-scene svg { overflow: hidden; }
[data-sim="skip-distance"] .sk-plotbox { flex: 1; }
[data-sim="skip-distance"] .sk-box svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="skip-distance"] .sk-box text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="skip-distance"] .sk-box text.sk-title { fill: var(--ink); font-size: var(--fs-md); font-weight: 600; }
[data-sim="skip-distance"] .sk-box text.sk-label { fill: var(--ink); font-size: var(--fs-md); font-weight: 600; }
[data-sim="skip-distance"] .sk-box text.sk-halo { stroke: var(--bg); stroke-width: 6; paint-order: stroke; }
[data-sim="skip-distance"] .sk-box text.sk-on-earth { fill: var(--ink); }
/* the scene */
[data-sim="skip-distance"] .sk-earth { fill: var(--c6); fill-opacity: 0.22; stroke: var(--ink); stroke-width: 2; }
[data-sim="skip-distance"] .sk-tick { stroke: var(--ink); stroke-width: 2; }
[data-sim="skip-distance"] .sk-layer { fill: none; stroke: var(--c2); stroke-width: 4; stroke-dasharray: 14 9; }
[data-sim="skip-distance"] .sk-band { fill: var(--c2); fill-opacity: 0.12; stroke: none; }
[data-sim="skip-distance"] .sk-horizon { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
[data-sim="skip-distance"] .sk-ray { fill: none; stroke: var(--c1); stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
[data-sim="skip-distance"] .sk-hop { fill: none; stroke: var(--c1); stroke-width: 9; stroke-opacity: 0.45; stroke-linecap: round; }
[data-sim="skip-distance"] .sk-arc { fill: none; stroke: var(--ink); stroke-width: 2; }
[data-sim="skip-distance"] .sk-mast { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
[data-sim="skip-distance"] .sk-tx { fill: var(--ink); }
[data-sim="skip-distance"] .sk-rx { fill: var(--bg); stroke: var(--c1); stroke-width: 4; }

/* the plot */
[data-sim="skip-distance"] .sk-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }

[data-sim="skip-distance"] .sk-guide { stroke: var(--c3); stroke-width: 1.5; stroke-dasharray: 6 5; }

[data-sim="skip-distance"] .sk-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="skip-distance"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="skip-distance"] .sk { height: auto; padding: 0.6rem; }
  [data-sim="skip-distance"] .sk-box { flex: none; width: 100%; height: 13rem; }
  [data-sim="skip-distance"] .sk-credit { text-align: left; }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Skok-udaljenost</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="sk-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a thin space between thousands, as both languages' style guides allow.
  function num(x) { return String(Math.round(x)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function km(x) { return t('km', { v: num(x) }); }
  function deg(x) { return t('deg', { v: x }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }

  var labels = { original: 'presetOriginal', flatF2: 'presetFlatF2', mediumF2: 'presetMediumF2', steepF2: 'presetSteepF2',
    vertical: 'presetVertical', flatE: 'presetFlatE' };

  // ── the scene: a slice of the Earth and the ionosphere to one scale, the same for every state, so hops compare ──
  // A point is (θ, z): the angle at the Earth's centre from the transmitter (rad) and the height above ground (km).
  var TH0 = -0.035, TH1 = 0.75;                       // shown slice: a little behind the transmitter to ~4780 km
  var THC = (TH0 + TH1) / 2;                          // the slice's middle points straight up on screen
  var ZTOP = L.H_MAX + 40;
  function drawScene(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), R = L.R;
    var half = Math.max(THC - TH0, TH1 - THC);
    // world: Earth centre at the origin, the slice's middle up
    var xMax = (R + ZTOP) * Math.sin(half), yMin = R * Math.cos(half), yMax = R + ZTOP;
    var pad = { l: 0.5 * rem, r: 0.5 * rem, t: 2.2 * rem, b: 2.4 * rem };
    var k = Math.min((W - pad.l - pad.r) / (2 * xMax), (H - pad.t - pad.b) / (yMax - yMin));
    var ox = W / 2, oy = pad.t + (yMax) * k;
    function P(th, z) { var r = R + z; return [ox + r * Math.sin(th - THC) * k, oy - r * Math.cos(th - THC) * k]; }
    function arcPts(z, a, b, n) { var o = []; for (var i = 0; i <= n; i++) o.push(P(a + (b - a) * i / n, z)); return o; }
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var roomy = W >= 40 * rem;                         // on a phone: no tick labels and no α label (the slider says it)

    // the Earth, filled down to the bottom of the box
    var X0 = TH0 - 0.15, X1 = TH1 + 0.15;            // drawn past both edges, so the slice has no ends on screen
    var ground = arcPts(0, X0, X1, 160);
    var earth = ground.concat([[ground[ground.length - 1][0], H + 2], [ground[0][0], H + 2]]);
    svg.append(s('polygon', { class: 'sk-earth', points: pts(earth) }));
    // distance ticks along the ground, every 1000 km
    for (var d = 1000; d / R < TH1 - 0.02; d += 1000) {
      var a = P(d / R, 0), b = P(d / R, -45), c = P(d / R, -160);
      svg.append(s('line', { class: 'sk-tick', x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
      if (roomy) svg.append(s('text', { class: 'sk-on-earth', x: c[0], y: c[1], 'text-anchor': 'middle' }, km(d)));
    }
    // the refracting region: a faint band below the line where the model turns the ray back
    var band = arcPts(st.height, X0, X1, 160).concat(arcPts(Math.max(0, st.height - 40), X1, X0, 160));
    svg.append(s('polygon', { class: 'sk-band', points: pts(band) }));
    svg.append(s('polyline', { class: 'sk-layer', points: pts(arcPts(st.height, X0, X1, 160)) }));
    // named in the top left corner, with a piece of its dashed line, clear of every ray
    svg.append(s('line', { class: 'sk-layer', x1: pad.l + 0.5 * rem, x2: pad.l + 3.5 * rem, y1: 1.3 * rem, y2: 1.3 * rem }));
    svg.append(s('text', { class: 'sk-label sk-halo', x: pad.l + 4.2 * rem, y: 1.3 * rem + 0.4 * rem, 'text-anchor': 'start' }, t('layer', { h: km(st.height) })));

    // the hop along the ground, the ray, the turning point
    var tx = P(0, 0), turn = P(st.beta, st.height), land = P(2 * st.beta, 0);
    if (st.beta > 0) svg.append(s('polyline', { class: 'sk-hop', points: pts(arcPts(0, 0, 2 * st.beta, 60)) }));
    // the horizon at the transmitter (dashed both ways, as the original) and the angle α between it and the ray
    var hx = Math.cos(THC), hy = -Math.sin(THC);      // screen direction of the local horizon, toward the hop
    var L1 = 7 * rem;
    svg.append(s('line', { class: 'sk-horizon', x1: tx[0] - hx * 2.5 * rem, y1: tx[1] - hy * 2.5 * rem, x2: tx[0] + hx * L1, y2: tx[1] + hy * L1 }));
    svg.append(s('polyline', { class: 'sk-ray', points: pts([tx, turn, land]) }));
    var ar = 3 * rem, aH = Math.atan2(hy, hx), aR = Math.atan2(turn[1] - tx[1], turn[0] - tx[0]);
    if (st.angle > 0) {
      var a0 = [tx[0] + ar * Math.cos(aH), tx[1] + ar * Math.sin(aH)], a1 = [tx[0] + ar * Math.cos(aR), tx[1] + ar * Math.sin(aR)];
      svg.append(s('path', { class: 'sk-arc', d: 'M' + a0[0].toFixed(1) + ',' + a0[1].toFixed(1) + ' A' + ar + ',' + ar + ' 0 0 0 ' + a1[0].toFixed(1) + ',' + a1[1].toFixed(1) }));
    }
    // α named just above the ray, clear of the ground
    var am = aR - 0.3, la = [tx[0] + (ar + 1.2 * rem) * Math.cos(am), tx[1] + (ar + 1.2 * rem) * Math.sin(am)];
    if (roomy) svg.append(s('text', { class: 'sk-label sk-halo', x: la[0], y: la[1] + 0.4 * rem, 'text-anchor': 'middle' }, 'α = ' + deg(st.angle)));
    svg.append(s('circle', { class: 'sk-turn', cx: turn[0], cy: turn[1], r: 0.45 * rem }));
    // the transmitter: a mast with a triangle at its foot; where the ray lands: a hollow ring
    var up = [Math.sin(-THC), -Math.cos(THC)];
    svg.append(s('line', { class: 'sk-mast', x1: tx[0], y1: tx[1], x2: tx[0] + up[0] * 1.6 * rem, y2: tx[1] + up[1] * 1.6 * rem }));
    svg.append(s('polygon', { class: 'sk-tx', points: pts([[tx[0] - 0.55 * rem, tx[1] + 0.2 * rem], [tx[0] + 0.55 * rem, tx[1] + 0.2 * rem], [tx[0], tx[1] - 0.9 * rem]]) }));
    var txl = P(0, -110);
    svg.append(s('text', { class: 'sk-on-earth', x: txl[0] + 0.2 * rem, y: txl[1] + 0.4 * rem, 'text-anchor': 'start' }, t('tx')));
    if (st.beta > 0) {
      svg.append(s('circle', { class: 'sk-rx', cx: land[0], cy: land[1], r: 0.6 * rem }));
      // the hop's length above where it lands (for a short hop, to the right of the ray)
      var hl = P(2 * st.beta, 0), right = st.km < 900;
      svg.append(s('text', { class: 'sk-label sk-halo', x: hl[0] + (right ? 1.0 * rem : 0), y: hl[1] - (right ? 0.6 : 1.1) * rem, 'text-anchor': right ? 'start' : 'middle' },
        t('hopLabel', { d: km(st.km) })));
    }
    svg.append(s('text', { x: W - pad.r, y: H - 0.5 * rem, 'text-anchor': 'end', class: 'sk-on-earth' }, t('scale')));
    box.replaceChildren(svg);
  }

  // ── the plot: hop distance against the radiation angle, for this height, with the E and F2 heights to compare ──
  var YMAX = 4500;
  function drawPlot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var pad = { l: 5.6 * rem, r: 1.0 * rem, t: 2.0 * rem, b: 1.6 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    function X(a) { return pad.l + (a / 90) * cw; }
    function Y(v) { return pad.t + ch * (1 - v / YMAX); }
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'sk-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    var wide = cw >= 30 * rem;
    for (var v = 0; v <= 4000; v += 1000) {
      svg.append(s('line', { class: 'sk-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) }));
      if (wide || v % 2000 === 0) svg.append(s('text', { x: pad.l - 0.4 * rem, y: Y(v) + 0.35 * rem, 'text-anchor': 'end' }, km(v)));
    }
    for (var a = 0; a <= 90; a += (wide ? 10 : 30)) {
      svg.append(s('line', { class: 'sk-grid', x1: X(a), x2: X(a), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(a), y: H - 0.2 * rem, 'text-anchor': a === 0 ? 'start' : a === 90 ? 'end' : 'middle' }, deg(a)));
    }
    function line(list, cls) { return s('polyline', { class: cls, points: pts(list.map(function (q) { return [X(q.angle), Y(q.km)]; })) }); }
    [[L.E_KM, 'refE'], [L.F2_KM, 'refF2']].forEach(function (r) {
      svg.append(line(L.curve(r[0], 180), 'sk-ref'));
      // named where the curve passes 6°, right of it
      var y = Y(L.hopKm(6, r[0]));
      if (wide) svg.append(s('text', { class: 'sk-halo', x: X(6) + 0.6 * rem, y: y - 0.5 * rem, 'text-anchor': 'start' }, t(r[1])));
    });
    svg.append(line(L.curve(st.height, 180), 'sk-curve'));
    svg.append(s('line', { class: 'sk-guide', x1: X(st.angle), x2: X(st.angle), y1: pad.t + ch, y2: Y(st.exact) }));
    svg.append(s('circle', { class: 'sk-now', cx: X(st.angle), cy: Y(st.exact), r: 0.55 * rem }));
    svg.append(s('text', { class: 'sk-title', x: wide ? pad.l : 0, y: pad.t - 0.5 * rem }, t('plotTitle')));
    if (wide) svg.append(s('text', { class: 'sk-label', x: pad.l + cw, y: pad.t - 0.5 * rem, 'text-anchor': 'end' },
      'α = ' + deg(st.angle) + ' · ' + km(st.km)));
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'angle', type: 'range', label: t('angle'), hint: t('angleHint'), min: 0, max: 90, step: 1,
        format: function (v) { return deg(v); } },
      { key: 'height', type: 'range', label: t('height'), hint: t('heightHint'), min: L.H_MIN, max: L.H_MAX, step: L.H_STEP,
        format: function (v) { return km(v); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendRay') },
      { c: 2, shape: 'hollow', label: t('legendLayer') },
      { c: 3, label: t('legendCurve') },
      { shape: 'hollow', label: t('legendRefs') }
    ],

    render: function (c) {
      var a = h('div', { class: 'sk-box sk-scene' }), b = h('div', { class: 'sk-box sk-plotbox' });
      c.stage.replaceChildren(h('div', { class: 'sk' }, a, b));
      drawScene(a, c.state);
      drawPlot(b, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      return t.parts('cap_' + st.kind, { angle: b(deg(st.angle)), height: b(km(st.height)), km: b(km(st.km)), max: b(km(st.maxKm)) });
    }
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
