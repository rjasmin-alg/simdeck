<!-- cmp-sod-toxic: some pairs of duties in one person let them make an error or a fraud and hide it; a conflict matrix
     checked against the assignments finds them; a small team cannot always separate, so a compensating control (an
     independent review of a log the person cannot edit) takes the place of separation.
     The stage: the numbers and the audit verdict; who holds which duty (people by department, click a cell to give or
     take a duty, the other department's duties hatched); the conflict matrix on the same rows (holders on the
     diagonal, people holding both duties below it, the four toxic pairs outlined and filled by their worst conflict);
     the list of conflicts with split, control and accept.
     Duties and conflicts: sod.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

    <div class="sd-titles">

      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>

      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>

<script src="strings.js"></script>
<script src="sod.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var D = window.SimdeckModels.sod;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var GLYPH = { open: '⚠', detected: '◎', accepted: '✎' };
  var MAX_ROWS = 6;                                 // more would squeeze the grid at 1920×1080

  function who(i) { return t('n_' + i); }
  function duty(d) { return t('d_' + d); }
  function pair(k) { return t('p_' + k); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function oText(c) { return c.res === 'control' && !c.ctl.ok ? t('o_bad') : t('o_' + c.outcome); }

  // ── a message about the last action, shown until the params change ──
  var msg = null;                                     // { text, key }
  function say(text) { msg = { text: text, key: null }; }

  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // the control to give focus back to after a render (keyboard)
  function btn(cls, attrs, sel, apply, children) {
    return h('button', Object.assign({
      type: 'button', class: cls, onmousedown: noFocus,
      onclick: function (e) { e.stopPropagation(); refocus = e.detail === 0 ? sel : null; apply(); }
    }, attrs, { dataset: Object.assign({ sel: sel }, attrs.dataset || {}) }), children);
  }

  // ── actions (they set params; the model does the rest) ──

  /** Every mask, the team's from the state in use and the rest kept from the params. */
  function allMasks(s) {
    var p = sim.params, out = {};
    for (var i = 0; i < L.MAX_TEAM; i++) out['m' + i] = i < s.p.team ? s.masks[i] : p['m' + i];
    return out;
  }
  function toggle(s, person, d) {
    var dept = D.deptOf(person);
    if (!D.eligible(dept, d)) {
      say(t(dept === D.OFFICE ? 'rejOffice' : 'rejIT', { who: who(person) }));
      msg.key = JSON.stringify(sim.params);
      sim.render();
      return;
    }
    var patch = allMasks(s);
    patch['m' + person] = s.masks[person] ^ (1 << d);
    patch.edit = true;
    patch['r' + person] = L.withRes(sim.params['r' + person], d >> 1, 'open');
    msg = null;
    sim.set(patch);
  }
  function resolve(c, res) {
    var patch = {};
    patch['r' + c.person] = L.withRes(sim.params['r' + c.person], c.pair, c.res === res ? 'open' : res);
    msg = null;
    sim.set(patch);
  }
  function splitIt(s, c) {
    var depts = s.people.map(function (x) { return x.dept; });
    var out = D.split(s.masks, c.person, c.pair, depts);
    if (!out) {
      say(t('rejSplit', { who: who(c.person), pair: pair(c.pair) }));
      msg.key = JSON.stringify(sim.params);
      sim.render();
      return;
    }
    var patch = allMasks(s);
    out.masks.forEach(function (m, i) { patch['m' + i] = m; });
    patch.edit = true;
    patch['r' + c.person] = L.withRes(sim.params['r' + c.person], c.pair, 'open');
    say(t('msgMove', { duty: duty(out.duty), from: who(c.person), to: who(out.to) }));
    sim.set(patch);
  }
  function shareOut(api) {
    var patch = { edit: false };
    for (var i = 0; i < L.MAX_TEAM; i++) { patch['m' + i] = 0; patch['r' + i] = 0; }
    say(t('msgShare'));
    api.set(patch);
  }

  // ── the stage ──

  function numbers(s) {
    function k(label, v, bad) {
      return h('div', { class: 'sx-k', dataset: { bad: String(!!bad) } }, h('span', null, label), b(v));
    }
    var shortN = s.short.reduce(function (a, x) { return a + x.need - x.have; }, 0);
    return h('div', { class: 'sx-sum' },
      k(t('kConf'), s.counts.conflicts, false),
      k(t('kMin'), s.min, false),
      k(t('kOpen'), s.counts.open, s.counts.open > 0),
      k(t('kDet'), s.counts.detected, false),
      k(t('kAcc'), s.counts.accepted, false),
      k(t('kShort'), shortN, shortN > 0),
      h('div', { class: 'sx-verdict', dataset: { v: s.verdict } }, t('v_' + s.verdict)));
  }

  function grid(s) {
    var cols = L.columns(s.people), n = cols.length;
    var byPair = {};
    s.conflicts.forEach(function (c) { byPair[c.person + ':' + c.pair] = c; });
    var first = 2, matCol = n + 3;              // grid columns: 1 labels, 2… people, gap, then 8 matrix columns
    var kids = [h('p', { class: 'sx-head sx-title' }, t('headPeople'))];
    var office = cols.filter(function (x) { return x.dept === D.OFFICE; }).length;
    kids.push(h('div', { class: 'sx-ghead', style: { gridColumn: first + ' / span ' + office } }, t('gOffice')));
    kids.push(h('div', { class: 'sx-ghead', style: { gridColumn: (first + office) + ' / span ' + (n - office) } }, t('gIT')));
    kids.push(h('p', { class: 'sx-head sx-mtitle', style: { gridColumn: matCol + ' / span 8' } }, t('headMatrix')));
    cols.forEach(function (x, j) {
      kids.push(h('div', { class: 'sx-name', translate: 'no', style: { gridColumn: String(first + j) } }, who(x.id)));
    });
    for (var m = 0; m < D.DUTIES; m++) {
      kids.push(h('div', { class: 'sx-mnum sx-num', translate: 'no', style: { gridColumn: String(matCol + m) } }, String(m + 1)));
    }
    for (var d = 0; d < D.DUTIES; d++) (function (d) {
      var row = String(3 + d), k = d >> 1, top = String(d % 2 === 0 && d > 0);
      var isShort = s.holders[d] < s.need;
      kids.push(h('div', { class: 'sx-label', dataset: { top: top, short: String(isShort) }, style: { gridRow: row } },
        h('span', { class: 'sx-badge sd-fill', dataset: { c: String(k + 1) }, translate: 'no' }, String(d + 1)),
        h('span', { class: 'sx-dname' }, duty(d))));
      cols.forEach(function (x, j) {
        var i = x.id, held = D.has(s.masks[i], d), ok = D.eligible(x.dept, d);
        var c = byPair[i + ':' + k];
        var st = !ok ? 'not' : !held ? 'free' : c ? 'conf' : 'held';
        var label = st === 'not' ? 'cellNot' : st === 'free' ? 'cellFree' : st === 'conf' ? 'cellConf' : 'cellHeld';
        var attrs = {
          class: 'sx-cell' + (st === 'held' || st === 'conf' ? ' sd-fill' : '') + (st === 'not' ? ' sd-hatch' : ''),
          dataset: { s: st, c: String(k + 1), o: c ? c.outcome : '' },
          'aria-pressed': String(held),
          'aria-label': t(label, { who: who(i), duty: duty(d), o: c ? oText(c) : '' })
        };
        if (st === 'not') attrs['aria-disabled'] = 'true';
        kids.push(h('div', { class: 'sx-cellwrap', dataset: { top: top }, style: { gridRow: row, gridColumn: String(first + j) } },
          btn('sx-cell', attrs, 'cell-' + i + '-' + d, function () { toggle(s, i, d); },
            h('span', { 'aria-hidden': 'true' }, st === 'conf' ? GLYPH[c.outcome] : st === 'held' ? '✓' : ''))));
      });
      for (var e = 0; e <= d; e++) {
        var kk = D.pairOf(d, e), cnt = s.matrix[d][e], cell;
        if (e === d) {
          cell = h('div', { class: 'sx-mx sx-num', dataset: { k: 'diag', short: String(isShort) }, translate: 'no',
            title: t('mxDiag', { a: duty(d), h: cnt, r: s.need }), 'aria-label': t('mxDiag', { a: duty(d), h: cnt, r: s.need }) },
            t('holdersOf', { h: cnt, r: s.need }));
        } else if (kk >= 0) {
          var o = s.pairState[kk] || 'separated';
          var lab = t('mxForbid', { a: duty(d), b: duty(e), n: cnt, o: o === 'separated' ? t('mxSep') : t('o_' + o) });
          cell = h('div', { class: 'sx-mx sx-num', dataset: { k: 'forbid', o: o }, translate: 'no', title: lab, 'aria-label': lab },
            o === 'separated' ? '✓' : GLYPH[o] + ' ' + cnt);
        } else {
          cell = h('div', { class: 'sx-mx sx-num', dataset: { k: 'low' }, translate: 'no',
            title: t('mxCell', { a: duty(d), b: duty(e), n: cnt }) }, cnt ? String(cnt) : '');
        }
        cell.style.gridRow = row;
        cell.style.gridColumn = String(matCol + e);
        kids.push(cell);
      }
    })(d);
    return h('div', { class: 'sx-mid' }, h('div', { class: 'sx-grid', style: { '--n': String(n) } }, kids));
  }

  function list(s) {
    var rows = s.conflicts.slice(0, MAX_ROWS).map(function (c) {
      var bad = c.res === 'control' && !c.ctl.ok;
      var sub = bad ? t('o_bad')
        : c.outcome === 'detected' ? t('byReviewer', { r: who(c.ctl.reviewer) }) : t('o_' + c.outcome);
      return h('div', { class: 'sx-cf', dataset: { o: c.outcome },
        'aria-label': t('rowLabel', { who: who(c.person), pair: pair(c.pair), abuse: t('a_' + c.pair), o: oText(c) }) },
        h('span', { class: 'sx-glyph', 'aria-hidden': 'true' }, GLYPH[c.outcome]),
        h('span', { class: 'sx-cftext', title: t('a_' + c.pair) },
          h('b', null, t('rowText', { who: who(c.person), pair: pair(c.pair) })),
          h('span', { class: 'sx-sub', dataset: { bad: String(bad) } }, sub)),
        h('span', { class: 'sx-bs' },
          btn('sx-b', { 'aria-disabled': String(!c.canSplit), 'aria-label': t('bSplitLabel', { who: who(c.person), pair: pair(c.pair) }) },
            'split-' + c.person + '-' + c.pair, function () { splitIt(s, c); }, t('bSplit')),
          btn('sx-b', { 'aria-pressed': String(c.res === 'control'), 'aria-label': t('bControlLabel', { who: who(c.person), pair: pair(c.pair) }) },
            'ctl-' + c.person + '-' + c.pair, function () { resolve(c, 'control'); }, t('bControl')),
          btn('sx-b', { 'aria-pressed': String(c.res === 'accept'), 'aria-label': t('bAcceptLabel', { who: who(c.person), pair: pair(c.pair) }) },
            'acc-' + c.person + '-' + c.pair, function () { resolve(c, 'accept'); }, t('bAccept'))));
    });
    var more = s.conflicts.length - MAX_ROWS;
    return h('div', { class: 'sx-list' },
      h('div', { class: 'sx-lhead' },
        h('p', { class: 'sx-head' }, t('headList'), more > 0 ? ' · ' + t('listMore', { k: more }) : ''),
        h('span', { class: 'sx-foot' }, t('foot'))),
      rows.length ? h('div', { class: 'sx-rows' }, rows) : h('p', { class: 'sx-none' }, '✓ ' + t('listNone')));
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'sx' }, numbers(s), grid(s), list(s)));
    if (refocus !== null) {
      // after a split the row is gone: keyboard focus moves to the first button left in the list
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]') || c.stage.querySelector('.sx-b');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, key = JSON.stringify(c.params), out = [];
    if (msg && msg.key === null) msg.key = key;
    if (msg && msg.key === key) out.push(msg.text, ' ');
    else msg = null;
    var k = L.captionKey(s);
    var comb = t.n('nComb', s.counts.conflicts, { n: s.counts.conflicts });
    out = out.concat(t.parts(k.key, {
      need: t(s.p.deputies ? 'needTwo' : 'needOne'), c: b(comb), o: b(s.counts.open), d: b(s.counts.detected), a: b(s.counts.accepted)
    }));
    k.notes.forEach(function (key) {
      var vars;
      if (key === 'nShort') {
        vars = { list: b(s.short.map(function (x) { return t('shortItem', { duty: duty(x.duty), h: x.have, r: x.need }); }).join(', ')) };
      } else if (key === 'nLogs') {
        var names = [];
        s.conflicts.forEach(function (x) {
          if (x.res === 'control' && x.ctl.why === 'logs' && names.indexOf(who(x.person)) < 0) names.push(who(x.person));
        });
        vars = { who: b(names.join(', ')) };
      } else if (key === 'nForced') {
        vars = { n: b(s.p.team), o: b(s.office), i: b(s.it), m: b(s.min) };
        if (s.p.deputies) key = 'nForcedDep';
      } else {
        vars = { k: b(s.avoidable) };
      }
      out.push(' ');
      out = out.concat(t.parts(key, vars));
    });
    return out;
  }

  var hidden = function () { return false; };
  var personParams = [];
  for (var i = 0; i < L.MAX_TEAM; i++) {
    personParams.push(
      { key: 'm' + i, type: 'range', label: who(i), min: 0, max: D.ALL, step: 1, visible: hidden },
      { key: 'r' + i, type: 'range', label: who(i), min: 0, max: L.RES_MAX, step: 1, visible: hidden });
  }
  var labels = { mixed: 'pMixed', separated: 'pSeparated', cover: 'pCover', three: 'pThree', 'own-log': 'pOwnLog', eight: 'pEight' };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'team', type: 'range', label: t('team'), hint: t('teamHint'), min: D.MIN_TEAM, max: D.MAX_TEAM, step: 1 },
      { key: 'deputies', type: 'toggle', label: t('deputies'), hint: t('deputiesHint') },
      { type: 'button', label: t('share'), hint: t('shareHint'), key: 's', run: shareOut },
      { key: 'edit', type: 'toggle', label: t('share'), visible: hidden }
    ].concat(personParams),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'sx-held', label: t('legHeld') },
      { shape: 'sx-open', label: t('legOpen') },
      { shape: 'sx-det', label: t('legDet') },
      { shape: 'sx-acc', label: t('legAcc') },
      { shape: 'sx-not', label: t('legNot') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
