     which link carries each flow and the rates at once. The stage is link-aggregation's (copied): left S's flow list

     hatched) and SW with its config badge; above the bond's label and rule, below the warnings and the totals.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SLOTS = 9;          // flow list: header + up to 8 flows
  var LBL = 8;            // lane label band, % of the fabric's height
  var GAP = 3;            // gap under each pipe, %
  var BAND_LABEL = 4.5;   // a band shows its label from this height (% of the fabric) up
  var SVG_NS = 'http://www.w3.org/2000/svg';

  /** Data (addresses, ports, ids, member and mode names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function eth(id) { return 'eth' + id; }
  function colourOf(fid) { return String(((Number(fid.slice(1)) - 1) % 8) + 1); }
  /** Mbit/s → Gbit/s, at most 3 decimals, decimal comma in Croatian. */
  function G(mbit) {
    var s = String(Math.round(mbit) / 1000);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  /** "eth0", "eth0 i eth2", "eth0, eth1 i eth2" as data. */
  function list(ids) {
    var names = ids.map(eth);
    if (names.length < 2) return data(names.join(''));
    return data(names.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + names[names.length - 1]);
  }
  function rowY(i) { return (i + 0.5) * 100 / SLOTS; }
  function lane(p, id) {
    var slot = 100 / p.members, top = id * slot;
    return { top: top, pipeTop: top + LBL, pipeH: slot - LBL - GAP };
  }
  /** Where each flow's band sits in each pipe: { memberId: { flowId: { top, h } } }, in % of the fabric. */
  function bands(s, p) {
    var out = {}, n = s.up.length;
    s.members.forEach(function (m) {
      var g = lane(p, m.id), cum = 0;
      out[m.id] = {};
      s.perMember[m.id].forEach(function (fid) {
        var r = s.how === 'rr' ? s.rate[fid] / n : s.rate[fid];
        out[m.id][fid] = { top: g.pipeTop + g.pipeH * cum / L.CAPACITY, h: g.pipeH * r / L.CAPACITY };
        cum += r;
      });
    });
    return out;
  }

  // ── "changed": against the state before the last input (SPEC.md "Changed") ──
  var lastParams = null, lastState = null, delta = { moved: [], star: false };
  function sameParams(a, b) { return Object.keys(L.defaults).every(function (k) { return a[k] === b[k]; }); }
  function track(c) {
    if (lastParams && sameParams(lastParams, c.params)) return;
    delta = { moved: L.changed(lastState, c.state), star: L.activeChanged(lastState, c.state) };
    lastParams = Object.assign({}, c.params);
    lastState = c.state;
  }
  function isMoved(fid) { return delta.moved.indexOf(fid) >= 0; }

  // ── stage ──

  function head(s, p) {
    var kids = [data('bond0', 'bm-pill'), data(p.mode, 'bm-pill bm-mode'), data(t('modeNo', { n: L.MODE_NO[p.mode] }), 'bm-no')];
    if (s.how === 'active') kids.push(h('span', { class: 'bm-f' }, t('rule_active-backup')), data(t('primary'), 'bm-note'));
    else if (s.how === 'rr') kids.push(h('span', { class: 'bm-f' }, t.parts('rule_balance-rr', { list: list(s.up) })));
    else if (s.how === 'single') kids.push(h('span', { class: 'bm-f' }, t('rule_single')));
    else {
      kids.push(h('span', { class: 'bm-f' }, t('formula_' + p.policy)), h('span', { class: 'bm-note' }, t('simplified')),
        h('span', { class: 'bm-f' }, t.parts('rule_hash', { m: s.up.length, list: list(s.up) })));
    }
    return h('p', { class: 'bm-head' }, kids);
  }

  function table(s, p) {
    var used = s.how === 'hash' ? L.INPUTS[p.policy] : [];
    var off = function (k) { return used.indexOf(k) < 0 ? ' bm-off' : ''; };
    var m = s.up.length;
    var rows = [h('div', { class: 'bm-row bm-th', style: { top: rowY(0) + '%' } },
      h('span', null, t('thFlow')), h('span', { class: 'bm-x' + off('mac') }, t('thMac')), h('span', { class: 'bm-x' + off('ip') }, t('thIp')),
      h('span', { class: 'bm-x' + off('port') }, t('thPort')),
      h('span', { class: 'bm-x' + (s.how === 'hash' ? '' : ' bm-off') }, s.how === 'hash' ? t('thHash', { m: m }) : t('thHashOff')),
      h('span', null, t('thLink')))];
    s.flows.forEach(function (f, i) {
      var link = s.assignment[f.id];
      rows.push(h('div', { class: 'bm-row' + (isMoved(f.id) ? ' sd-changed' : ''), style: { top: rowY(i + 1) + '%' } },
        h('span', { class: 'bm-fl' },
          h('span', { class: 'bm-fchip sd-fill', dataset: { c: colourOf(f.id) }, translate: 'no' }, f.id),
          data(f.client, 'bm-cl')),
        data('…' + f.dstMac.slice(-2), 'bm-x' + off('mac')),
        data('.' + L.lastOctet(f.dstIp), 'bm-x' + off('ip')),
        data(f.dstPort, 'bm-x' + off('port')),
        s.how === 'hash' ? data(s.hash[f.id] + ' mod ' + m + ' = ' + s.index[f.id], 'bm-x') : data('—', 'bm-x bm-off'),
        link === 'all' ? h('span', { class: 'bm-lk', dataset: { all: '' } }, t('cellAll')) : data(eth(link), 'bm-lk')));
    });
    return h('div', { class: 'bm-col bm-tbl', 'aria-label': t('server') }, rows);
  }

  /** A zigzag from (0, y1) to (100, y2): the strand of a flow whose frames are spread and reordered (balance-rr). */
  function zigzag(y1, y2) {
    var d = 'M0,' + y1, n = 12;
    for (var k = 1; k <= n; k++) {
      var x = k * 100 / n, y = y1 + (y2 - y1) * k / n + (k < n ? (k % 2 ? -1.2 : 1.2) : 0);
      d += ' L' + x + ',' + y;
    }
    return d;
  }

  function strands(s, p, b) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('class', 'bm-svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    function path(d, cls, colour) {
      var e = document.createElementNS(SVG_NS, 'path');
      e.setAttribute('d', d);
      e.setAttribute('vector-effect', 'non-scaling-stroke');
      if (cls) e.setAttribute('class', cls);
      if (colour) e.setAttribute('data-c', colour);
      svg.appendChild(e);
    }
    s.flows.forEach(function (f, i) {
      var y1 = rowY(i + 1);
      var targets = s.assignment[f.id] === 'all' ? s.up : [s.assignment[f.id]];
      targets.forEach(function (id) {
        var x = b[id] && b[id][f.id];
        if (!x) return;
        var y2 = x.top + x.h / 2;
        var d = s.how === 'rr' && s.up.length > 1 ? zigzag(y1, y2) : 'M0,' + y1 + ' C55,' + y1 + ' 45,' + y2 + ' 100,' + y2;
        if (isMoved(f.id)) path(d, 'bm-under');
        path(d, s.how === 'rr' && s.up.length > 1 ? 'bm-zig' : null, colourOf(f.id));
      });
    });
    return h('div', { class: 'bm-col' }, svg);
  }

  function lanes(s, p, b) {
    var kids = [], zig = s.warnings.indexOf('reorder') >= 0;
    s.members.forEach(function (m) {
      var g = lane(p, m.id), ids = s.perMember[m.id];
      var lbl = [data(eth(m.id), 'bm-lk')];
      if (s.active === m.id) lbl.push(h('span', { class: 'bm-star' + (delta.star ? ' sd-changed' : '') }, '★', h('span', { class: 'bm-star-t' }, ' ' + t('laneActive'))));
      if (!m.up) lbl.push(h('span', { class: 'bm-state', dataset: { k: 'down' } }, t('laneFailed')));
      else {
        lbl.push(h('span', { class: 'bm-load' }, t('gbit', { v: G(s.memberLoad[m.id]) + ' / 1' })));
        if (ids.length > 5) lbl.push(h('span', { class: 'bm-ids' }, t.n('nFlows', ids.length)));
        else if (ids.length) lbl.push(data(ids.join(' '), 'bm-ids'));
        else lbl.push(h('span', { class: 'bm-state' }, t(s.how === 'active' ? 'laneBackup' : 'laneIdle')));
      }
      kids.push(h('div', { class: 'bm-lbl', style: { top: g.top + '%', height: LBL + '%' } }, lbl));
      var ds = !m.up ? { down: '' } : ids.length ? {} : { idle: '' };
      kids.push(h('div', { class: 'bm-pipe' + (m.up ? ' sd-hatch' : ''), style: { top: g.pipeTop + '%', height: g.pipeH + '%' }, dataset: ds }));
      ids.forEach(function (fid) {
        var x = b[m.id][fid];
        kids.push(h('div', {
          class: 'bm-band sd-fill' + (isMoved(fid) ? ' sd-changed' : ''), dataset: zig ? { c: colourOf(fid), zig: '' } : { c: colourOf(fid) },
          style: { top: x.top + '%', height: x.h + '%' }, translate: 'no'
        }, x.h >= BAND_LABEL ? (zig ? fid : fid + ' · ' + G(s.rate[fid])) : ''));
      });
    });
    return h('div', { class: 'bm-col bm-lanes' }, kids);
  }

  function sw(s, p) {
    var need = s.switchNeeds;
    var k = need === null ? 'na' : s.switchOk ? 'ok' : 'bad';
    var verdict = k === 'na' ? t('badgeNotNeeded') : k === 'ok' ? '✓ ' + t('badgeOk') : '⚠ ' + t('badgeNeeds_' + need);
    return h('div', { class: 'bm-col' }, h('div', { class: 'bm-box' },
      h('b', { translate: 'no' }, 'SW'), h('span', { class: 'bm-sub' }, t('sw')),
      h('span', { class: 'bm-badge', dataset: { k: k } }, h('b', null, t('badge_' + p.switchCfg)), h('span', { class: 'bm-sub' }, verdict)),
      h('span', { class: 'bm-to' }, p.gateway ? t('toGateway') : t.n('toClients', s.flows.length))));
  }

  function warnings(s) {
    if (!s.warnings.length) return h('p', { class: 'bm-warn' }, h('span', { class: 'bm-w', dataset: { k: 'none' } }, t('warnNone')));
    return h('p', { class: 'bm-warn' }, s.warnings.map(function (w) { return h('span', { class: 'bm-w', dataset: { k: w } }, t('warn_' + w)); }));
  }

  function totals(s) {
    var item = function (key, v, extra) {
      return h('span', extra ? { dataset: { unreliable: '' } } : null, t.parts(key, { v: h('b', null, t('gbit', { v: v })) }),
        extra ? h('span', { class: 'bm-unrel' }, t('unreliable')) : null);
    };
    return h('p', { class: 'bm-sum' },
      h('span', { class: 'bm-cap' }, t('sumCapacity', { n: s.up.length })),
      item('sumDelivered', G(s.delivered), s.unreliable), item('sumFastest', G(s.fastest), s.unreliable));
  }

  // ── caption ──

  function movedText(fo) {
    var out = fo.moved.length ? t.n('moved', fo.moved.length) : t('movedNone');
    if (fo.fromHealthy.length) out += ' (' + t.n('movedHealthy', fo.fromHealthy.length) + ')';
    return out;
  }

  function modeCaption(s, p) {
    var failed = s.failover ? s.failover.failed[0] : null;
    var out = [];
    if (s.how === 'active') {
      if (s.failover && s.failover.activeMoved) out = t.parts('capABFail', { failed: data(eth(failed)), active: data(eth(s.active)), d: G(s.delivered) });
      else if (s.failover) out = t.parts('capABBackup', { failed: data(eth(failed)), active: data(eth(s.active)) });
      else {
        var waiting = s.up.filter(function (id) { return id !== s.active; });
        out = t.parts('capAB', { active: data(eth(s.active)), active2: data(eth(s.active)), next: data(eth(L.firstUp(waiting))),
            waits: h('span', null, t.parts('waits', { n: waiting.length, list: list(waiting) })) });
      }
      if (p.switchCfg !== 'none') out = out.concat(' ', t('capABSwitch'));
      return out;
    }
    if (s.how === 'single') return t.parts('capNoPartner', { k: data(eth(s.single)), d: G(s.delivered) });
    if (s.how === 'rr') {
      if (s.failover) out = t.parts('capRRFail', { failed: data(eth(failed)) }).concat(' ');
      out = out.concat(s.up.length === 1
        ? t.parts('capRROne', { k: data(eth(s.up[0])), d: G(s.delivered) })
        : t.parts('capRR', { n: s.flows.length, list: list(s.up), r: G(s.fastest), d: G(s.delivered) }));
    } else {
      var prefix = t(p.mode === '802.3ad' ? 'capLacp' : 'capXor');
      var hashes = s.flows.map(function (f) { return s.hash[f.id]; });
      var sameHash = s.flows.length > 1 && s.up.length > 1 && hashes.every(function (x) { return x === hashes[0]; });
      if (s.failover) {
        out = [prefix].concat(t.parts('capRehash', { failed: data(eth(failed)), list: list(s.up), m: s.up.length, moved: movedText(s.failover) }));
      } else if (sameHash) {
        out = t.parts('capHashSame', { lacp: prefix, k: data(eth(s.used[0])), policy: data(p.policy), inputs: t('inputs_' + p.policy) });
      } else {
        out = t.parts('capHash', { lacp: prefix, m: s.up.length, f: G(s.fastest), d: G(s.delivered), cap: G(s.capacity) });
      }
    }
    if (s.unreliable) out = out.concat(' ', t.parts('capFlap', { cfg: t('badge_' + p.switchCfg) }));
    return out;
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: L.MODES.map(function (x) { return [x, t('mode_' + x)]; }) },
      { key: 'members', type: 'range', label: t('members'), min: L.RANGES.members[0], max: L.RANGES.members[1], step: 1 },
      { key: 'fail', type: 'choice', label: t('fail'), options: L.FAILS.map(function (x) { return [x, t('fail_' + x)]; }) },
      { key: 'policy', type: 'choice', label: t('policy'), options: L.POLICIES.map(function (x) { return [x, t('pol_' + x)]; }),
        visible: function (p) { return p.mode === 'balance-xor' || p.mode === '802.3ad'; } },
      { key: 'switchCfg', type: 'choice', label: t('switchCfg'), options: L.SWITCH.map(function (x) { return [x, t('sw_' + x)]; }) },
      { key: 'flows', type: 'range', label: t('flows'), min: L.RANGES.flows[0], max: L.RANGES.flows[1], step: 1 },
      { key: 'gateway', type: 'toggle', label: t('gateway') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'bm-lane', label: t('legLane') },
      { shape: 'bm-backup', label: t('legBackup') },
      { shape: 'bm-down', label: t('legFailed') },
      { shape: 'bm-star', label: t('legActive') },
      { shape: 'bm-zig', label: t('legReorder') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      track(c);
      var s = c.state, p = c.params, b = bands(s, p);
      c.stage.replaceChildren(h('div', { class: 'bm' },
        head(s, p),
        h('div', { class: 'bm-fab' }, table(s, p), strands(s, p, b), lanes(s, p, b), sw(s, p)),
        warnings(s),
        totals(s)));
    },
    caption: function (c) {
      track(c);
      var s = c.state, p = c.params, out = [];
      if (delta.moved.length && !s.failover) out.push(t.n('capMoved', delta.moved.length), ' ');
      return out.concat(modeCaption(s, p));
    }
  });
})();
</script>
</body>
</html>
