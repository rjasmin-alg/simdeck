     the ± buttons negate an operand (~x + 1).

<script>
(function () {

  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVGNS = 'http://www.w3.org/2000/svg';

  // ── formatting (data, not language: shown in translate="no" elements) ──

  var SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };

  /** Bits as text in groups of four: 1001 0110. */
  function bitText(bits) {

  var neg = null;   // { which, x, n, key }: the ± click whose result the caption explains while params stay put

  /** The boxes every row shares: the label, the carry-out column, then n bit columns (k = 0 is the top bit). */
  function rowNode(cls, label, out, cells, n) {
    var cols = [h('div', { class: 'tc-col' }, out)];
    for (var k = 0; k < n; k++) cols.push(h('div', { class: 'tc-col' + (k && k % 4 === 0 ? ' tc-nib' : '') }, cells(k)));

        var o = {}; o[which] = r.value;

    if (showsSigned(view)) items.push(h('span', null, h('span', { class: 'tc-read-k' }, t('readSigned')), ' ', b(s.signed[which])));

    if (showsSigned(view)) items.push(h('span', null, h('span', { class: 'tc-read-k' }, t('readSigned')), ' ', b(s.trueSum.signed), ' ', fitBadge(!s.flags.V), ' ', num(s.range.min + ' … ' + s.range.max)));
    return h('div', { class: 'tc-read' }, items);
  }

    var n = s.n;
    var weights = rowNode('', h('span', { class: 'tc-lbl-small' }, t('weight')), null, function (k) {
      return h('span', { class: 'tc-w' + (k === 0 ? ' tc-sign' : ''), translate: 'no' }, weightNodes(n - 1 - k, n));
    }, n);
    var carries = rowNode('', h('span', { class: 'tc-lbl-small' }, t('carryRow')),
      s.carryOut ? h('span', { class: 'tc-carry', 'data-top': '', translate: 'no', title: t('carryOutLabel', { v: 1 }) }, '1') : null,
      function (k) {
        if (!s.carries[k]) return null;
        var attrs = { class: 'tc-carry', translate: 'no', title: t('carryLabel', { i: n - 1 - k }) };
        if (k === 0) attrs['data-top'] = '';
        return h('span', attrs, '1');
      }, n);
    var aRow = rowNode('', [negButton('a', s), h('span', { class: 'tc-name', translate: 'no' }, t('rowA'))], null, function (k) {
      return bitCell('a', s.aBits, k, n, ch.a, true, 'a', s.a);
    }, n);
    var bRow = rowNode('', [negButton('b', s), h('span', { class: 'tc-name', translate: 'no' }, t('plus') + ' ' + t('rowB'))], null, function (k) {
      return bitCell('b', s.bBits, k, n, ch.b, true, 'b', s.b);
    }, n);
    var rRow = rowNode('tc-sum', h('span', { class: 'tc-name', translate: 'no' }, '= ' + t('rowR')),
      s.carryOut ? h('span', { class: 'tc-bit tc-ghost', dataset: { v: '1' }, translate: 'no', title: t('carryOutLabel', { v: 1 }), 'aria-label': t('carryOutLabel', { v: 1 }) }, '1') : null,
      function (k) { return bitCell('r', s.sumBits, k, n, ch.r, false); }, n);
    return h('div', { class: 'tc-rows', dataset: { n: String(n) }, style: { '--n': String(n), '--nibs': String(Math.max(0, n / 4 - 1)) } },
      weights, carries, aRow, readNode(s, 'a', view), bRow, readNode(s, 'b', view), rRow, readNode(s, 'r', view), exactNode(s, view));
  }

  function flagsNode(s, ch) {
    var n = s.n, top = sub(n - 1), out = sub(n);
    var ev = {
      N: 'r' + top + ' = ' + s.sumBits[0],
      Z: 'r = 0x' + s.hex.r,
      C: 'c' + out + ' = ' + s.carryOut,
      V: 'c' + top + ' = ' + s.carries[0] + (s.flags.V ? ' ≠ ' : ', ') + 'c' + out + ' = ' + s.carryOut
    };
    var cells = [h('div', { class: 'tc-flags-title' }, t('flags'))];
    ['N', 'Z', 'C', 'V'].forEach(function (f) {
      var v = s.flags[f];
      cells.push(
        h('span', { class: 'tc-flag' + (ch.flags.indexOf(f) >= 0 ? ' sd-changed' : ''), dataset: { v: String(v) },
          'aria-label': t('flag' + f) + ' = ' + v + ', ' + t(v ? 'flagOn' : 'flagOff') }, t('flag' + f)),
        h('span', { class: 'tc-flag-name' }, h('span', { class: 'tc-num', translate: 'no' }, '= ' + v), ' ', t('name' + f)),
        h('span', { class: 'tc-flag-rule' }, t('rule' + f)),
        h('span', { class: 'tc-flag-ev', translate: 'no' }, ev[f]));
    });
    return h('div', { class: 'tc-flags' }, cells);
  }

  // ── the wheel: 0 at the top, clockwise; viewBox −50 … 50, so one unit is 1 % of the box ──
  var R = 33, RO = 38.5, RI = 27.5, LO = 45.5, LI = 19.5, RS = 47.5;
  function polar(r, deg) { var a = deg * Math.PI / 180; return [r * Math.sin(a), -r * Math.cos(a)]; }
  function svg(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }
  function fmt(x) { return String(Math.round(x * 100) / 100); }
  /** An arc on radius r from angle `from` turning `turn` degrees (positive: clockwise). */
  function arcPath(r, from, turn) {
    var p1 = polar(r, from), p2 = polar(r, from + turn);
    return 'M' + fmt(p1[0]) + ' ' + fmt(p1[1]) + ' A' + r + ' ' + r + ' 0 ' + (Math.abs(turn) > 180 ? 1 : 0) + ' ' + (turn > 0 ? 1 : 0) + ' ' + fmt(p2[0]) + ' ' + fmt(p2[1]);
  }
  /** A filled arrowhead at the end of an arc (drawn, not an SVG marker, so its colour is a class). */
  function head(r, deg, turn, cls) {
    var dir = turn > 0 ? 1 : -1, tip = polar(r, deg), back = deg - dir * 3.2;
    var b1 = polar(r + 2.2, back), b2 = polar(r - 2.2, back);
    return svg('path', { class: cls, d: 'M' + fmt(tip[0]) + ' ' + fmt(tip[1]) + ' L' + fmt(b1[0]) + ' ' + fmt(b1[1]) + ' L' + fmt(b2[0]) + ' ' + fmt(b2[1]) + ' Z' });
  }
  function at(el, r, deg) {
    var p = polar(r, deg);
    el.style.left = (50 + p[0]) + '%';
    el.style.top = (50 + p[1]) + '%';
    return el;
  }

  function wheelNode(s, view) {
    var n = s.n, m = Math.pow(2, n), deg = function (u) { return u / m * 360; };
    var g = svg('svg', { viewBox: '-50 -50 100 100', 'aria-hidden': 'true', focusable: 'false' });
    g.appendChild(svg('circle', { class: 'tc-ring', cx: 0, cy: 0, r: R }));
    var tickStep = n === 4 ? 1 : m / 32, major = n === 4 ? 1 : m / 8;
    for (var u = 0; u < m; u += tickStep) {
      var big = u % major === 0, p1 = polar(R - (big ? 2.4 : 1.2), deg(u)), p2 = polar(R + (big ? 2.4 : 1.2), deg(u));
      g.appendChild(svg('line', { class: 'tc-tick' + (big ? ' tc-tick-major' : ''), x1: fmt(p1[0]), y1: fmt(p1[1]), x2: fmt(p2[0]), y2: fmt(p2[1]) }));
    }
    // the seams: between 2^n − 1 and 0 (top, unsigned wraps: C) and between 2^(n−1) − 1 and −2^(n−1) (bottom: V)
    var half = 0.5 * 360 / m;
    var seams = [];
    if (showsUnsigned(view)) seams.push({ f: 'C', deg: -half });
    if (showsSigned(view)) seams.push({ f: 'V', deg: 180 - half });
    seams.forEach(function (sm) {
      var a = polar(LI + 3, sm.deg), z = polar(RS - 3, sm.deg);
      g.appendChild(svg('line', { class: 'tc-seam', x1: fmt(a[0]), y1: fmt(a[1]), x2: fmt(z[0]), y2: fmt(z[1]) }));
    });
    // the arrows: unsigned outside (clockwise by b's unsigned value), signed inside (by b's signed value)
    var from = deg(s.unsigned.a);
    if (showsUnsigned(view) && s.unsigned.b) {
      var tu = deg(s.unsigned.b);
      g.appendChild(svg('path', { class: 'tc-arc tc-arc-u', d: arcPath(RO, from, tu - (tu > 4 ? 2.5 : 0)) }));
      g.appendChild(head(RO, from + tu, tu, 'tc-head-u'));
    }
    if (showsSigned(view) && s.signed.b) {
      var ts = s.signed.b / m * 360;
      var back = Math.abs(ts) > 4 ? (ts > 0 ? 2.5 : -2.5) : 0;
      g.appendChild(svg('path', { class: 'tc-arc tc-arc-s', d: arcPath(RI, from, ts - back) }));
      g.appendChild(head(RI, from + ts, ts, 'tc-head-s'));
    }

    var labels = [];
    var lstep = n === 4 ? 1 : m / 8;
    for (var v = 0; v < m; v += lstep) {
      if (showsUnsigned(view)) labels.push(at(h('span', { class: 'tc-wl tc-wl-out', translate: 'no' }, String(v)), LO, deg(v)));
      if (showsSigned(view)) labels.push(at(h('span', { class: 'tc-wl tc-wl-in', translate: 'no' }, minus(L.signedOf(v, n))), LI, deg(v)));
    }
    seams.forEach(function (sm) {
      var on = s.flags[sm.f];
      labels.push(at(h('span', { class: 'tc-wl tc-seamlbl', dataset: { on: String(on) }, translate: 'no', title: t(sm.f === 'C' ? 'seamC' : 'seamV') },
        sm.f), RS, sm.deg + (n === 4 ? 0 : sm.f === 'C' ? -9 : 9)));   // 4 bits: the seam is half a step off the 0 label, room enough
    });
    // a and r sit on the ring; when they are close (b small) a moves inwards and r outwards so both stay readable
    var gap = Math.abs(deg(s.unsigned.a) - deg(s.unsigned.r)), close = Math.min(gap, 360 - gap) < 12;
    labels.push(at(h('span', { class: 'tc-wl tc-mark', dataset: { c: '1' }, translate: 'no' }, t('markA')), close ? R - 5 : R, deg(s.unsigned.a)));
    labels.push(at(h('span', { class: 'tc-wl tc-mark', dataset: { c: '3' }, translate: 'no' }, t('markR')), close ? R + 5 : R, deg(s.unsigned.r)));

    var keyItems = [];
    if (showsUnsigned(view)) keyItems.push(h('span', { class: 'tc-wkey-u' }, '— ' + t('wheelOuter')));
    if (showsSigned(view)) keyItems.push(h('span', { class: 'tc-wkey-s' }, '- - ' + t('wheelInner')));
    return [
      h('div', { class: 'tc-wheel', role: 'img', 'aria-label': t('wheel', { m: m }) }, g, labels),
      h('div', { class: 'tc-wkey' }, keyItems)
    ];
  }

  // ── captions ──
  /** t.parts with a node used twice puts it in the second place only; give each later use a copy. */
  function fresh(parts) {
    var seen = [];
    return parts.map(function (x) {
      if (!x || typeof x !== 'object' || !x.cloneNode) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function caption(s, p) {
    var n = s.n, out = [];
    var bitsS = t.n('bitsSigned', n), bitsU = t.n('bitsN', n);
    if (neg && neg.key !== keyOf(p)) neg = null;   // any other change ends the negation's caption
    if (neg) {
      var r = L.negate(neg.x, n);
      var nv = {
        x: b(neg.x < 0 ? '(' + neg.x + ')' : neg.x), xbits: b(bitText(r.bits)), inv: b(bitText(r.inverted)), rbits: b(bitText(r.resultBits)), v: b(r.value),
        abs: b(Math.abs(neg.x)), bits: bitsS
      };
      out = out.concat(t.parts(r.overflow ? 'capNegMin' : 'capNeg', nv), [' ']);
    }
    var A = b(s.a), B = b(s.b < 0 ? '(' + s.b + ')' : s.b);   // 5 + (−3), as the task writes it
    var u = { ua: b(s.unsigned.a), ub: b(s.unsigned.b), usum: b(s.trueSum.unsigned), ur: b(s.unsigned.r), ubits: bitsU };
    if (s.flags.V) {
      var vars = { a: A, b: B, sum: b(s.trueSum.signed), bits: bitsS, rbits: b(bitText(s.sumBits)), r: b(s.signed.r) };
      out = out.concat(t.parts(s.a >= 0 ? 'capVPos' : 'capVNeg', vars));
      if (s.flags.C) out = out.concat([' '], t.parts('capAlsoC', u));
    } else if (s.flags.C) {
      out = out.concat(t.parts('capC', Object.assign({ a: A, b: B, r: b(s.signed.r) }, u)));
      // capSub names a, b and −b twice each: a node can be placed once, so every placeholder gets a fresh copy
      if (s.b < 0 && s.b > s.range.min) out = out.concat([' '], fresh(t.parts('capSub', { a: b(s.a), b: b(s.b), nb: b(-s.b) })));
    } else {
      out = out.concat(t.parts('capNone', Object.assign({ a: A, b: B, r: b(s.signed.r), bits: bitsS }, u)));
    }
    if (s.flags.Z) out = out.concat([' '], t.parts('capZero'));
    return fresh(out);
  }

  var presetList = L.presets.map(function (pr) {
    return { id: pr.id, label: t('preset_' + pr.id), hint: t('hint_' + pr.id), params: pr.params };
  });
  var root = h('div', { class: 'tc' });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'width', type: 'choice', label: t('width'), options: L.WIDTHS.map(function (w) { return [w, t.n('bitsN', w)]; }) },
      { key: 'a', type: 'range', label: t('a'), step: 1, format: minus, value: L.defaults.a,
        min: function (p) { return L.rangeOf(L.widthOf(p.width)).min; }, max: function (p) { return L.rangeOf(L.widthOf(p.width)).max; } },
      { key: 'b', type: 'range', label: t('b'), step: 1, format: minus, value: L.defaults.b,
        min: function (p) { return L.rangeOf(L.widthOf(p.width)).min; }, max: function (p) { return L.rangeOf(L.widthOf(p.width)).max; } },
      { key: 'view', type: 'choice', label: t('view'), options: L.VIEWS.map(function (v) { return [v, t('view_' + v)]; }) }
    ],

    presets: presetList,

    legend: [
      { c: 8, label: t('legendOne') },
      { shape: 'hollow', label: t('legendZero') },
      { shape: 'tc-sign', label: t('legendSign') },
      { shape: 'tc-carry', label: t('legendCarry') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      // "changed" compares with the state before the last input; loading the page (defaults, then the URL) is no input
      if (!ready) { prev = null; cur = s; }
      else if (!cur || keyOf({ width: s.n, a: s.a, b: s.b }) !== keyOf({ width: cur.n, a: cur.a, b: cur.b })) { prev = cur; cur = s; }
      var ch = {
        a: prev ? L.changedBits(prev.aBits, s.aBits) : [],
        b: prev ? L.changedBits(prev.bBits, s.bBits) : [],
        r: prev ? L.changedBits(prev.sumBits, s.sumBits) : [],
        flags: prev && prev.n === s.n ? L.changedFlags(prev.flags, s.flags) : []   // a width change is a new number, not a change
      };
      root.dataset.n = String(s.n);
      root.replaceChildren(
        h('div', { class: 'tc-left' }, rowsNode(s, s.view, ch), flagsNode(s, ch)),
        h('div', { class: 'tc-right' }, wheelNode(s, s.view)));
      if (root.parentNode !== c.stage) c.stage.replaceChildren(root);
    },

    caption: function (c) { return caption(c.state, c.params); }
  });
  ready = true;
})();
</script>
</body>
