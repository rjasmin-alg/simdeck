<!-- fin-chargeback: a shared IT cost allocated to departments by a key; the key decides who pays; under chargeback a
     department whose bill passes its outside offer leaves, the fixed cost stays with the rest, and the next one leaves
     (the spiral). The stage: one row per department (its units of the key, −/+ usage, leave/come back, its bill as a
     bar against its own variable cost and its outside offer), and beside them the company's total round by round
     (the shared cost and what the departments that left spend outside, against everyone in).
     Sums: allocation.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

      <div data-sd-presets></div>
      <div data-sd-controls></div>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  // ── words and numbers in the page's language ──

  var CAP = { users: 'Users', vms: 'Vms', tb: 'Tb', tickets: 'Tickets' };
  var DNAME = { sales: 'dSales', acct: 'dAcct', dev: 'dDev', sup: 'dSup', mkt: 'dMkt' };
  function dname(id) { return t(DNAME[id]); }

  /** A whole number with thousands grouped (3 000 / 3,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Whole euros (rounded), sign dropped. */
  function money(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  /** Euros and cents from cents: 15919 → 159,19 € / €159.19. */
  function cents(c) {
    var a = Math.abs(Math.round(c)), whole = Math.floor(a / 100), cc = a % 100;
    return t('eur', { n: group(whole) + (Simdeck.lang === 'hr' ? ',' : '.') + (cc < 10 ? '0' : '') + cc });
  }
  function unitsOf(key, n) {
    var k = 'n' + CAP[key];
    return Array.isArray(window.SimStrings[Simdeck.lang][k]) ? t.n(k, n, { n: group(n) }) : t(k, { n: group(n) });
  }
  function perUnit(key, c) { return c === null ? '' : t('per' + CAP[key], { v: cents(c) }); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function pct(x, top) { return Math.min(100, 100 * x / top) + '%'; }
  function term(key) { var s = h('span'); s.innerHTML = t.html(key); return s; }

  // ── the department rows ──

  /** Stage buttons keep keyboard focus across re-renders (found again by data-act after a render). */
  function button(act, label, aria, disabled, run, pressed) {
    var attrs = {
      class: 'cb-btn', type: 'button', 'aria-label': aria, 'aria-disabled': disabled ? 'true' : 'false',
      dataset: { act: act },
      onmousedown: function (e) { e.preventDefault(); },
      onclick: function () { if (!disabled) run(); }
    };
    if (pressed !== undefined) attrs['aria-pressed'] = pressed ? 'true' : 'false';
    return h('button', attrs, label);
  }

  function row(s, x, chg) {
    var U = L.RANGES['use_' + x.id];
    var use = x.use, name = dname(x.id);
    var out = x.status === 'forced';
    var units = unitsOf(s.key, x.units) + (use !== 100 ? ' · ' + t('pct', { n: use }) : '');
    var st = { in: t('stIn'), over: t('stOver'), left: t('stLeft', { r: x.round + 1 }), forced: t('stForced') }[x.status];
    var track = [];
    if (x.status === 'left') {
      track.push(h('div', { class: 'cb-bar', dataset: { k: 'was' }, style: { width: pct(x.bill, s.scale) } }));
    }
    if (x.status === 'left' || out) {
      track.push(h('div', { class: 'cb-bar', dataset: { k: 'outside' }, style: { width: pct(x.quote, s.scale) } }));
    } else {
      track.push(h('div', { class: 'cb-bar', dataset: { k: s.p.mode === 'charge' ? 'charged' : 'shown' }, style: { width: pct(x.bill, s.scale) } }));
    }
    track.push(h('div', { class: 'cb-own', style: { left: pct(x.variable, s.scale) } }));
    track.push(h('div', { class: 'cb-offer', style: { left: pct(x.quote, s.scale) } }));
    var nums = [];
    if (x.bill !== null) {
      var bk = x.status === 'left' ? 'billLeft' : s.p.mode === 'charge' ? 'billCharged' : 'billShown';
      nums.push(t(bk, { b: money(x.bill) }), ' · ');
    }
    nums.push(t('offer', { q: money(x.quote) }), ' · ', t('own', { v: money(x.variable) }));
    return h('div', { class: 'cb-row', dataset: { st: x.status } },
      h('div', { class: 'cb-top' },
        h('span', { class: 'cb-name' }, name),
        h('span', { class: 'cb-units', translate: 'no' }, units),
        h('span', { class: 'cb-btns' },
          button(x.id + '-less', '−', t('less') + ': ' + name, use <= U[0] || out, function () { setUse(x.id, use - U[2]); }),
          button(x.id + '-more', '+', t('more') + ': ' + name, use >= U[1] || out, function () { setUse(x.id, use + U[2]); }),
          button(x.id + '-out', out ? t('back') : t('leave'), (out ? t('back') : t('leave')) + ': ' + name, false,
            function () { var p = {}; p['out_' + x.id] = !out; sim.set(p); }, out)),
        h('span', { class: 'cb-st' }, h('span', { class: chg.indexOf(x.id) >= 0 ? 'sd-changed' : null }, st))),
      h('div', { class: 'cb-track', 'aria-hidden': 'true' }, track),
      h('div', { class: 'cb-nums', translate: 'no' }, nums));
  }
  function setUse(id, v) { var p = {}; p['use_' + id] = v; sim.set(p); }

  // ── the company, round by round ──

  function rounds(s) {
    var r0 = s.rounds[0];
    var out = [
      h('p', { class: 'cb-head' }, t('headRounds')),
      h('p', { class: 'cb-sum', translate: 'no' }, t('sharedLine', { t: money(r0.total), f: money(s.p.fixed), v: money(r0.total - s.p.fixed) })),
      h('p', { class: 'cb-sum', translate: 'no' }, t('baseLine', { c: money(s.baseline) }))
    ];
    var list = s.rounds.map(function (r, i) {
      var note, go = false;
      if (!r.in.length) note = t('roundEmpty');
      else if (r.leaves) { note = t('roundLeaves', { d: dname(r.leaves) }); go = true; }
      else note = s.p.mode === 'show' ? t('roundShow') : t('roundStays');
      return h('div', { class: 'cb-round' },
        h('div', { class: 'cb-rtop', translate: 'no' },
          h('b', null, t('round', { r: i + 1 })),
          h('span', null, perUnit(s.key, r.unit)),
          h('b', null, money(r.company))),
        h('div', { class: 'cb-rtrack', 'aria-hidden': 'true' },
          h('div', { class: 'cb-bar', dataset: { k: 'charged' }, style: { width: pct(r.total, s.cscale) } }),
          h('div', { class: 'cb-bar', dataset: { k: 'outside' }, style: { left: pct(r.total, s.cscale), width: pct(r.company - r.total, s.cscale) } }),
          h('div', { class: 'cb-base', style: { left: pct(s.baseline, s.cscale) } })),
        h('div', { class: 'cb-rnote', dataset: go ? { go: '' } : {} }, note));
    });
    out.push(h('div', { class: 'cb-rounds' }, list));
    return out;
  }

  function result(s, chg) {
    var o = s.outcome, text;
    if (o === 'show') text = s.firstOver ? t('resShowOver', { d: dname(s.firstOver) }) : t(s.forced.ids.length ? 'resShowOut' : 'resShow');
    else if (o === 'stable') text = s.forced.ids.length ? t('resStableOut', { c: money(s.company - s.baseline) }) : t('resStable');
    else if (o === 'spiral') text = t.n('resSpiral', s.departed.length, { c: money(s.company - s.baseline) });
    else if (o === 'collapse') text = t('resCollapse');
    else text = t(s.p.fixed ? 'resEmpty' : 'resEmptyFree');
    return h('p', { class: 'cb-result' + (chg.indexOf('result') >= 0 ? ' sd-changed' : ''), dataset: { o: o } }, text);
  }

  function render(c) {
    track(c);
    var s = c.state;
    var focus = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.act : null;
    c.stage.replaceChildren(h('div', { class: 'cb' },
      h('div', { class: 'cb-col' }, h('p', { class: 'cb-head' }, t('headDepts')), s.rows.map(function (x) { return row(s, x, chg); })),
      h('div', { class: 'cb-col' }, rounds(s)),
      h('div', { class: 'cb-bottom' },
        result(s, chg),
        h('p', { class: 'cb-foot' },
          t('foot', { u: money(L.RATE.users), m: money(L.RATE.vms), t: money(L.RATE.tb), k: money(L.RATE.tickets) }), ' ',
          t('illustrative')))));
    if (focus) {
      var el = c.stage.querySelector('[data-act="' + focus + '"]');
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s), v = captionVars(s), main = v.main, note = v.note;
    var out = [];
    k.before.concat([k.key], k.notes).forEach(function (key, i) {
      if (i) out.push(' ');
      out = out.concat(t.parts(key, key === k.key ? main : note(key)));
    });
    return out;
  }
  function captionVars(s) {
    var r0 = s.rounds[0], last = s.rounds[s.rounds.length - 1];
    var row0 = function (id) { return s.rows.filter(function (x) { return x.id === id; })[0]; };
    var lead = s.departed[0] || s.firstOver;
    var outside = s.rows.reduce(function (a, x) { return a + (x.status === 'forced' ? x.quote : 0); }, 0);
    var f = s.forced;
    var main = {
      s: term(s.p.mode === 'charge' ? 'termCharge' : 'termShow'),
      k: t('by' + CAP[s.key]),
      t: b(money(r0.total)), u: b(perUnit(s.key, r0.unit)), f: b(money(s.p.fixed)),
      d: b(lead ? dname(lead) : ''), b: b(lead ? money(r0.bills[lead]) : ''), q: b(lead ? money(row0(lead).quote) : ''),
      u0: b(perUnit(s.key, r0.unit)), u1: b(perUnit(s.key, last.unit)),
      m: b(t.n('nMore', s.departed.length, { n: s.departed.length })), o: b(money(outside))
    };
    return {
      main: main,
      note: function (key) {
        return {
          d: b(key === 'nWould' ? dname(s.firstOver) : f.ids.length ? dname(f.ids[0]) : ''),
          b: b(key === 'nWould' ? money(r0.bills[s.firstOver]) : money(f.bill)),
          q: b(s.firstOver ? money(row0(s.firstOver).quote) : ''),
          v: b(money(f.variable)), r: b(money(Math.abs(f.shifted))),
          c: b(money(s.company)), c0: b(money(s.baseline))
        };
      }
    };
  }

  var labels = {
    'by-users': 'pByUsers', 'by-vms': 'pByVms', 'dev-grows': 'pDevGrows', charged: 'pCharged',
    'one-leaves': 'pOneLeaves', spiral: 'pSpiral'
  };
  var R = L.RANGES;
  var hidden = function () { return false; };
  var specs = [
    { key: 'key', type: 'choice', label: t('key'), options: L.KEYS.map(function (k) { return [k, t('k' + CAP[k])]; }) },
    { key: 'mode', type: 'choice', label: t('mode'), options: [['show', t('mShow')], ['charge', t('mCharge')]] },
    { key: 'fixed', type: 'range', label: t('fixed'), min: R.fixed[0], max: R.fixed[1], step: R.fixed[2],
      format: function (v) { return t('perMonth', { v: money(v) }); } }
  ];
  // per-department usage and "out": set from the stage's buttons; hidden controls keep them in the URL
  L.IDS.forEach(function (id) {
    var u = R['use_' + id];
    specs.push({ key: 'use_' + id, type: 'range', label: t('use', { d: dname(id) }), min: u[0], max: u[1], step: u[2],
      visible: hidden, format: function (v) { return t('pct', { n: v }); } });
    specs.push({ key: 'out_' + id, type: 'toggle', label: t('out', { d: dname(id) }), visible: hidden });
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: specs,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cb-charged', label: t('legCharged') },
      { shape: 'cb-shown', label: t('legShown') },
      { shape: 'cb-own', label: t('legOwn') },
      { shape: 'cb-offer', label: t('legOffer') },
      { shape: 'cb-out', label: t('legOut') },
      { shape: 'cb-base', label: t('legBase') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
