<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var DB_TOP = -20, DB_BOT = -140;          // the spectrum's dB axis
  var WF_LO = -125, WF_HI = -45;            // the waterfall's colour scale
  var cur = L.defaults;                     // the params of the last render (the zoom label reads fs from here)

  // ── numbers in the page's language: a decimal comma, a true minus sign, grouped thousands ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    var neg = v.charAt(0) === '-';
    if (neg) v = v.slice(1);
    var parts = v.split('.');
    if (parts[0].length > 4) parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    v = parts.join(Simdeck.lang === 'hr' ? ',' : '.');
    return (neg ? '−' : '') + v;
  }
  /** Three significant digits, trailing zeros dropped (76.3, 610, 2.44, 12.5, 0.25). */
  function sig(x) {
    var a = Math.abs(x), d = a >= 99.95 ? 0 : a >= 9.995 ? 1 : a >= 0.9995 ? 2 : 3;
    var v = num(x, d);
    if (d > 0) v = v.replace(/[.,]?0+$/, '');
    return v;
  }
  function width(hz) {
    if (hz >= 1e6) return t('mhz', { v: sig(hz / 1e6) });
    if (hz >= 1e3) return t('khz', { v: sig(hz / 1e3) });
    return t('hz', { v: sig(hz) });
  }
  function time(sec) {
    if (sec < 1e-3) return t('us', { v: sig(sec * 1e6) });
    if (sec < 1) return t('ms', { v: sig(sec * 1e3) });
    return t('sec', { v: sig(sec) });
  }
  function mhz(hz, d) { return t('mhz', { v: num(hz / 1e6, d == null ? 3 : d) }); }
  function msps(v) { return t('msps', { v: sig(v) }); }
  function points(n) { return num(n, 0); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function clampDb(v) { return Math.max(DB_BOT, Math.min(DB_TOP, v)); }

  /** The shared frequency axis: the plot's left and right padding are the same in both plots. */
  function frame(W, r0) { return W < 30 * r0 ? { l: 4.4 * r0, r: 0.5 * r0 } : { l: 4.8 * r0, r: 0.9 * r0 }; }
  /** A plot's title, on two lines (cut after the colon) where one would not fit; returns the lines used. */
  function title(svg, text, W, r0, room) {
    var cut = text.indexOf(': '), lines = text.length * 0.6 * r0 > room && cut > 0 ? [text.slice(0, cut + 1), text.slice(cut + 2)] : [text];
    lines.forEach(function (line, i) { svg.append(s('text', { class: 'fw-title', x: 0.2 * r0, y: (1.25 + 1.3 * i) * r0 }, line)); });
    return lines.length;
  }
  function xMap(st, l, cw) { return function (off) { return l + (off - st.view.lo) / st.view.width * cw; }; }

  /** Frequency ticks: a 1-2-5 step giving at most one label per 7 rem. */
  function ticks(st, cw, r0) {
    var most = Math.max(2, Math.floor(cw / (7.5 * r0))), step = 1;
    var ladder = [1, 2, 5];
    for (var e = 0; e < 9; e++) {
      for (var i = 0; i < 3; i++) {
        step = ladder[i] * Math.pow(10, e);
        if (st.view.width / step <= most) return list(step);
      }
    }
    return list(step);
    function list(stp) {
      var out = [], a = Math.ceil((st.centre + st.view.lo) / stp - 1e-9) * stp;
      for (var f = a; f <= st.centre + st.view.hi + 1e-6; f += stp) out.push(f);
      var d = Math.max(3, Math.min(6, Math.ceil(-Math.log10(stp / 1e6) - 1e-9)));
      return out.map(function (f) { return { off: f - st.centre, label: num(f / 1e6, d) }; });
    }
  }

  // ── the amplitude spectrum of the newest block ──
  function drawSpectrum(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), fr = frame(W, r0), wide = W >= 30 * r0, pad = { l: fr.l, r: fr.r, t: 3.0 * r0, b: 1.7 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b, X = xMap(st, pad.l, cw);
    function Y(v) { return pad.t + (DB_TOP - clampDb(v)) / (DB_TOP - DB_BOT) * ch; }
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    pad.t += 1.3 * r0 * (title(svg, t('specTitle'), W, r0, wide ? W - 24 * r0 : W) - 1);
    ch = H - pad.t - pad.b;
    var clip = 'fw-clip-s';
    svg.append(s('defs', null,
      s('clipPath', { id: clip }, s('rect', { x: pad.l, y: pad.t, width: cw, height: ch })),
      s('pattern', { id: 'fw-hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
        s('line', { class: 'fw-hatchline', x1: 0, y1: 0, x2: 0, y2: 8 }))));
    // dB grid and labels
    for (var v = DB_BOT; v <= DB_TOP; v += 20) {
      svg.append(s('line', { class: 'fw-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) }));
      svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(v) + 0.35 * r0, 'text-anchor': 'end' }, num(v, 0)));
    }
    svg.append(s('text', { class: 'fw-mute', x: pad.l - 0.3 * r0, y: pad.t - 0.7 * r0, 'text-anchor': 'end' }, t('dbfs')));
    var g = s('g', { 'clip-path': 'url(#' + clip + ')' });
    svg.append(g);
    var bin = st.binHz;
    // the DC guard, hatched, at least 0.5 rem wide; the tuned frequency
    if (st.guard.hi >= st.view.lo && st.guard.lo <= st.view.hi) {
      var gx0 = X(st.guard.lo), gx1 = X(st.guard.hi), gw = Math.max(0.5 * r0, gx1 - gx0), gm = (gx0 + gx1) / 2;
      g.append(s('rect', { class: 'fw-guard', x: gm - gw / 2, y: pad.t, width: gw, height: ch }));
      svg.append(s('text', { class: 'fw-halo fw-mute', x: gm, y: pad.t + ch - 0.4 * r0, 'text-anchor': 'middle' }, t('dc')));
    }
    // bin edges when there are few bins in the view
    if (st.edges) {
      st.cols.concat([[st.cols[st.cols.length - 1][0] + 1]]).forEach(function (c) {
        var x = X((c[0] - 0.5) * bin);
        g.append(s('line', { class: 'fw-binline', x1: x, x2: x, y1: pad.t, y2: pad.t + ch }));
        g.append(s('line', { class: 'fw-bintick', x1: x, x2: x, y1: pad.t + ch - 0.55 * r0, y2: pad.t + ch }));
      });
    }
    // the mean noise per bin, dashed
    g.append(s('line', { class: 'fw-noise', x1: pad.l, x2: pad.l + cw, y1: Y(st.noiseDb), y2: Y(st.noiseDb) }));
    // the trace: steps one bin wide, or a line through grouped columns
    var d = '';
    st.cols.forEach(function (c, i) {
      var y = Y(st.spectrum[i]).toFixed(1);
      if (st.group === 1) {
        var x0 = X((c[0] - 0.5) * bin).toFixed(1), x1 = X((c[0] + 0.5) * bin).toFixed(1);
        d += (i ? 'L' : 'M') + x0 + ',' + y + 'L' + x1 + ',' + y;
      } else {
        d += (i ? 'L' : 'M') + X((c[0] + c[1]) / 2 * bin).toFixed(1) + ',' + y;
      }
    });
    g.append(s('path', { class: 'fw-trace', d: d }));
    // aliases in the newest block: a dashed outline round the folded copy and its label
    st.signals.forEach(function (x) {
      if (!x.alias || x.id === 'pair2') return;
      if (x.id === 'burst' && st.burstRows.indexOf(0) < 0) return;
      var half = x.kind === 'fm' ? L.FM_HALF : (x.id === 'pair' ? L.PAIR_GAP : 0) / 2 + 2 * bin;
      var c0 = x.at + (x.id === 'pair' ? L.PAIR_GAP / 2 : 0);
      if (c0 + half < st.view.lo || c0 - half > st.view.hi) return;
      var top = -Infinity;
      st.cols.forEach(function (c, i) {
        if ((c[1] + 0.5) * bin >= c0 - half && (c[0] - 0.5) * bin <= c0 + half) top = Math.max(top, st.spectrum[i]);
      });
      var xa = X(c0 - half), xb = X(c0 + half), wd = Math.max(1.2 * r0, xb - xa), xm = (xa + xb) / 2;
      var yt = Math.max(pad.t + 1.6 * r0, Y(top) - 0.5 * r0);
      g.append(s('rect', { class: 'fw-alias', x: xm - wd / 2, y: yt, width: wd, height: pad.t + ch - yt - 1 }));
      svg.append(s('text', { class: 'fw-halo fw-aliastext', x: Math.min(Math.max(xm, pad.l + 1.6 * r0), pad.l + cw - 1.6 * r0), y: yt - 0.35 * r0, 'text-anchor': 'middle' }, t('alias')));
    });
    svg.append(s('rect', { class: 'fw-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    // the frequency axis
    var tk = ticks(st, cw, r0);
    tk.forEach(function (q, i) {
      var x = X(q.off);
      svg.append(s('line', { class: 'fw-tick', x1: x, x2: x, y1: pad.t + ch, y2: pad.t + ch + 0.3 * r0 }));
      var anchor = x < pad.l + 2.5 * r0 ? 'start' : x > pad.l + cw - 2.5 * r0 ? 'end' : 'middle';
      svg.append(s('text', { x: x, y: pad.t + ch + 1.3 * r0, 'text-anchor': anchor }, q.label));
    });
    svg.append(s('text', { class: 'fw-mute', x: pad.l - 0.3 * r0, y: pad.t + ch + 1.3 * r0, 'text-anchor': 'end' }, t('mhzAxis')));

    if (st.view.missing && !st.view.full) svg.append(s('text', { class: 'fw-halo fw-bold', x: pad.l + cw / 2, y: pad.t + 2.4 * r0, 'text-anchor': 'middle' }, t('missing')));

    svg.append(s('text', { class: 'fw-halo', x: pad.l + 0.3 * r0, y: Y(st.noiseDb) - 0.35 * r0 }, t('noise')));
    box.replaceChildren(svg);
  }

  // ── the waterfall: 40 rows of blocks, newest at the top; colours from the theme's tokens ──
  var ramp = null, rampKey = '';
  function rgbOf(token) {
    var c = document.createElement('canvas').getContext('2d');
    c.fillStyle = '#808080';
    c.fillStyle = Simdeck.cssVar(token) || '#808080';
    var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(c.fillStyle);
    if (m) return [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)];
    var n = String(c.fillStyle).match(/[\d.]+/g) || [128, 128, 128];
    return [Number(n[0]), Number(n[1]), Number(n[2])];
  }
  function colours() {
    var key = ['--bg', '--c1', '--ink'].map(function (k) { return Simdeck.cssVar(k); }).join();

    return out;
  }
  function drawWaterfall(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), fr = frame(W, r0), pad = { l: fr.l, r: fr.r, t: 2.0 * r0, b: 0.4 * r0 };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    pad.t += 1.3 * r0 * (title(svg, t('wfTitle'), W, r0, W) - 1);
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b, X = xMap(st, pad.l, cw), bin = st.binHz;
    var dpr = window.devicePixelRatio || 1;
    var cv = h('canvas', { width: Math.round(W * dpr), height: Math.round(H * dpr), style: { width: W + 'px', height: H + 'px' }, 'aria-hidden': 'true' });
    var ctx = cv.getContext('2d'), cols = colours(), rows = st.waterfall.length, rh = ch / rows;
    ctx.scale(dpr, dpr);
    ctx.save();
    ctx.beginPath(); ctx.rect(pad.l, pad.t, cw, ch); ctx.clip();
    st.waterfall.forEach(function (row, r) {
      var y0 = Math.round((pad.t + r * rh) * dpr) / dpr, y1 = Math.round((pad.t + (r + 1) * rh) * dpr) / dpr;
      st.cols.forEach(function (c, i) {
        var x0 = X((c[0] - 0.5) * bin), x1 = X((c[1] + 0.5) * bin);
        var v = Math.max(0, Math.min(1, (row[i] - WF_LO) / (WF_HI - WF_LO)));
        ctx.fillStyle = cols[Math.round(v * 64)];
        ctx.fillRect(Math.floor(x0 * dpr) / dpr, y0, Math.max(1 / dpr, Math.ceil(x1 * dpr) / dpr - Math.floor(x0 * dpr) / dpr), y1 - y0);
      });
    });
    ctx.restore();
    // bin edges, as in the spectrum
    if (st.edges) st.cols.concat([[st.cols[st.cols.length - 1][0] + 1]]).forEach(function (c) {
      var x = X((c[0] - 0.5) * bin);
      if (x > pad.l && x < pad.l + cw) svg.append(s('line', { class: 'fw-binline', x1: x, x2: x, y1: pad.t, y2: pad.t + ch }));
    });
    // the tuned frequency, dotted
    if (0 >= st.view.lo && 0 <= st.view.hi) svg.append(s('line', { class: 'fw-centre', x1: X(0), x2: X(0), y1: pad.t, y2: pad.t + ch }));
    svg.append(s('rect', { class: 'fw-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    // the time axis: now at the top, then every 10 rows
    var T = st.blockMs / 1000;
    for (var r = 0; r <= rows; r += 10) {
      var y = pad.t + r * rh;
      svg.append(s('line', { class: 'fw-tick', x1: pad.l - 0.3 * r0, x2: pad.l, y1: y, y2: y }));
      var lab = r === 0 ? t('now') : '−' + time(r * T);
      svg.append(s('text', { x: pad.l - 0.45 * r0, y: r === 0 ? y + 0.9 * r0 : r === rows ? y - 0.15 * r0 : y + 0.35 * r0, 'text-anchor': 'end' }, lab));
    }
    if (W >= 30 * r0) svg.append(s('text', { class: 'fw-mute', x: pad.l - 0.45 * r0, y: pad.t + 2.1 * r0, 'text-anchor': 'end' }, t('timeDown')));
    box.replaceChildren(cv, svg);
  }

  // ── the card: what fs and N give, the changed rows marked ──
  var lastSig = null, lastVals = null, changed = {};
  function cardValues(st) {
    var p = st.peak;
    return [
      ['rowSpan', t('spanCell', { w: width(st.span), lo: num(st.spanLo / 1e6, 3), hi: mhz(st.spanHi) }), true],
      ['rowBin', width(st.binHz), true],
      ['rowBlock', time(st.blockMs / 1000), true],
      ['rowRate', t('perSec', { v: st.rowsPerSec >= 99.5 ? num(st.rowsPerSec, 0) : num(st.rowsPerSec, 1) })],
      ['rowHistory', time(st.historyS)],
      ['rowChannel', num(st.binsPerChannel, 1)],
      ['rowPair', t(!pairShown(st) ? 'pairOff' : st.resolved ? 'pairTwo' : 'pairOne', { b: num(st.pairBins, 2) })],
      ['rowPeak', !p ? t('peakNone') : t(p.alias ? 'peakAlias' : 'peakCell', { f: mhz(p.f), d: num(p.db, 0) })]
    ];
  }
  function pairShown(st) { return st.signals.filter(function (x) { return x.id === 'pair'; })[0].shown; }
  function card(st, params) {
    var vals = cardValues(st), sigKey = JSON.stringify(params);
    if (sigKey !== lastSig) {
      changed = {};
      if (lastVals) vals.forEach(function (v, i) { if (lastVals[i][1] !== v[1]) changed[v[0]] = true; });
      lastSig = sigKey; lastVals = vals;
    }
    var rows = [];
    vals.forEach(function (v) {
      var cls = (v[2] ? 'fw-key' : '') + (changed[v[0]] ? ' fw-changed' : '');
      rows.push(h('tr', { class: cls || null }, h('th', { scope: 'row', colspan: '1' }, t(v[0]))));
      rows.push(h('tr', { class: cls || null }, h('td', null, v[1])));
    });
    var labels = [WF_LO, (WF_LO + WF_HI) / 2, WF_HI].map(function (x) { return h('span', null, num(x, 0)); });
    return h('div', { class: 'fw-card' },
      h('h3', null, t('cardTitle')),
      h('table', { class: 'fw-table' }, h('tbody', null, rows)),
      h('p', { class: 'fw-note' }, h('i', null), t('cardChanged')),
      h('div', { class: 'fw-scale' }, h('h3', null, t('scale') + ', ' + t('dbfs')), h('div', { class: 'fw-bar' }), h('div', { class: 'fw-barlabels' }, labels)));
  }

  var sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'fs', type: 'choice', label: t('fs'), options: L.FS.map(function (v) { return [v, msps(v)]; }) },
      { key: 'N', type: 'choice', label: t('N'), options: L.NS.map(function (v) { return [v, points(v)]; }) },
      // the band is switched on the stage, beside the spectrum's title (the tuning of the receiver); in the URL like any param
      { key: 'band', type: 'choice', label: t('band'), options: [['2m', t('band2m')], ['70cm', t('band70cm')]], visible: function () { return false; } },
      { key: 'filter', type: 'toggle', label: t('filter') },
      { key: 'zoom', type: 'range', label: t('zoom'), min: 0, max: L.LADDER.length - 1, step: 1,
        format: function (v) {
          var w = L.LADDER[v], fs = cur.fs * 1e6;
          return w >= fs ? t('zoomFull', { w: width(fs) }) : t('zoomVal', { w: width(w) });
        } },
      { key: 'focus', type: 'choice', label: t('focus'),
        disabled: function (p) { return L.LADDER[p.zoom] >= p.fs * 1e6 ? t('focusOff') : false; },
        options: L.FOCI.map(function (f) { return [f, t('focus_' + f)]; }) }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'fw-trace', label: t('legendTrace') },
      { shape: 'dash', label: t('legendNoise') },
      { shape: 'fw-bins', label: t('legendBins') },
      { shape: 'fw-guard', label: t('legendGuard') },
      { shape: 'fw-alias', label: t('legendAlias') }
    ],

    render: function (c) {
      cur = c.params;
      var sp = h('div', { class: 'fw-pic fw-spec' }), wf = h('div', { class: 'fw-pic fw-wf' });
      var had = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.band : null;
      var tune = h('div', { class: 'fw-tune', role: 'group', 'aria-label': t('band') },
        h('span', null, t('band')),
        h('div', { class: 'sd-seg' }, [['2m', 'band2m', 145], ['70cm', 'band70cm', 435]].map(function (o) {
          return h('button', { type: 'button', 'aria-pressed': String(c.params.band === o[0]), dataset: { band: o[0] },
            onclick: function () { sim.set({ band: o[0] }); } }, t(o[1]) + ' · ' + mhz(o[2] * 1e6));
        })));
      c.stage.replaceChildren(h('div', { class: 'fw' }, h('div', { class: 'fw-plots' }, h('div', { class: 'fw-specwrap' }, sp, tune), wf), card(c.state, c.params)));
      if (had) { var again = c.stage.querySelector('[data-band="' + had + '"]'); if (again) again.focus(); }
      drawSpectrum(sp, c.state);
      drawWaterfall(wf, c.state);
    },

    caption: function (c) {
      var st = c.state, p = c.params;
      var b = function (x) { return h('b', null, x); };
      var parts = t.parts('cap_base', { fs: b(msps(p.fs)), n: b(points(p.N)), term: h('em', null, 'bin'), bin: b(width(st.binHz)), block: b(time(st.blockMs / 1000)) });
      parts.push(' ', t(p.N < L.NS[L.NS.length - 1] ? 'cap_double' : 'cap_halve'));
      function say(key, vars) { parts.push(' '); parts = parts.concat(t.parts(key, vars)); }
      var zoomed = !st.view.full;
      var al = st.aliases.filter(function (a) { return a.id === 'strong'; })[0] || st.aliases[0];
      if (al) say('cap_alias', { half: width(st.span / 2), f: b(mhz(al.f)), to: b(mhz(al.foldedTo)) });
      else if (zoomed && st.view.missing) say('cap_narrow', { span: b(width(st.span)) });   // a focus is missing only when filtered out
      else if (p.focus === 'pair' && zoomed) say(st.resolved ? 'cap_pairTwo' : 'cap_pairOne', { b: b(num(st.pairBins, 2)), block: b(time(st.blockMs / 1000)) });
      else if (p.focus === 'burst' && zoomed) {
        var n = st.burstRows.length;
        if (!n) say('cap_burstGone', { hist: b(time(st.historyS)) });
        else if (st.burstRows[n - 1] === L.ROWS - 1 && 0.055 > st.historyS) say('cap_burstCut', { hist: b(time(st.historyS)) });
        else { parts.push(' '); parts = parts.concat(t.parts(n >= 5 ? 'cap_burstSharp' : 'cap_burstSmear', { n: n, block: b(time(st.blockMs / 1000)) })); }
      } else if (st.filtered.length) say('cap_narrow', { span: b(width(st.span)) });
      return parts;
    }
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
