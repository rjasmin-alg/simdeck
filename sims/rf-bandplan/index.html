<style>
/* Page CSS: every selector starts with [data-sim="rf-bandplan"]; colours only from kit tokens. */
/* Workaround: kit.css gives .sd-ctl display: flex, which beats the hidden attribute a param's visible() sets
   (shared request in NOTES.md, as in sims/amdahl, sims/lvm-topology and sims/stratis-lab). */
[data-sim="rf-bandplan"] .sd-ctl[hidden] { display: none; }
/* Twelve controls and eight presets: presets and the nine category switches in two columns, so the panel fits at
   1920×1080 without its own scroll. Zoom, centre and the plan switch span both. */
[data-sim="rf-bandplan"] { --panel-w: 27rem; }
[data-sim="rf-bandplan"] .sd-presets { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.2rem; }
[data-sim="rf-bandplan"] .sd-preset { line-height: 1.15; }
[data-sim="rf-bandplan"] [data-sd-controls] .sd-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.2rem 0.8rem; }
[data-sim="rf-bandplan"] [data-sd-controls] .sd-group > :not(.sd-ctl),
[data-sim="rf-bandplan"] [data-sd-controls] .sd-ctl:is([data-key="zoom"], [data-key="center"], [data-key="plan"]) { grid-column: 1 / -1; }

/* The switch state text of the nine category switches does not fit two columns; the knob position shows the state
   (the text is aria-hidden in the kit, the switch keeps aria-checked). */
[data-sim="rf-bandplan"] .sd-ctl[data-key^="cat-"] .sd-switch-state { display: none; }
[data-sim="rf-bandplan"] .sd-stage { touch-action: pan-y; user-select: none; cursor: grab; }
[data-sim="rf-bandplan"] .sd-stage.rf-dragging { cursor: grabbing; }
[data-sim="rf-bandplan"] .rf {
  --gut: 10.5rem;
  --lane: 2.1rem;
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 0.5rem 1rem 0.2rem 0.6rem;
  font-size: var(--fs-sm);
  line-height: 1.1;
  overflow: hidden;
}
[data-sim="rf-bandplan"] .rf-grid { position: relative; display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
/* A row: the label in the gutter, then its lanes. Rows share the height by their lane count, up to --lane a lane. */
[data-sim="rf-bandplan"] .rf-row {
  display: grid;
  grid-template-columns: var(--gut) minmax(0, 1fr);
  flex: var(--n) 1 0;
  max-height: calc(var(--n) * var(--lane));
  min-height: 0;
  border-top: var(--line-w) solid var(--line);
}
[data-sim="rf-bandplan"] .rf-row.rf-itu { flex: none; height: 1.5rem; max-height: none; border-top: 0; }
[data-sim="rf-bandplan"] .rf-row.rf-plan { border-top: 0; }
[data-sim="rf-bandplan"] .rf-row.rf-axis { flex: none; height: 2.6rem; max-height: none; border-top: var(--line-w) solid var(--ink); }
[data-sim="rf-bandplan"] .rf-label {
  display: flex;
  align-items: center;
  padding-right: 0.5rem;
  font-weight: 700;
  color: var(--sw, var(--muted));
  overflow: hidden;
}
[data-sim="rf-bandplan"] .rf-label::before {
  content: '';
  flex: none;
  width: 0.3rem;
  align-self: stretch;
  margin: 0.1rem 0.4rem 0.1rem 0;
  background: var(--sw, transparent);
}
[data-sim="rf-bandplan"] .rf-lanes { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
[data-sim="rf-bandplan"] .rf-lane { position: relative; flex: 1 1 0; min-height: 0; }

[data-sim="rf-bandplan"] .rf-bar {
  position: absolute;
  top: 8%;
  bottom: 8%;
  min-width: 4px;
  padding: 0;
  border: var(--line-w) solid transparent;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
  cursor: pointer;
}
[data-sim="rf-bandplan"] .rf-bar.rf-named { padding: 0 0.25rem; }
[data-sim="rf-bandplan"] .rf-bar.rf-gov { background: transparent; border: var(--line-w) dashed var(--ink); color: var(--ink); }
[data-sim="rf-bandplan"] .rf-point {
  position: absolute;
  top: 50%;
  width: 0.8rem;
  height: 0.8rem;
  margin: -0.4rem 0 0 -0.4rem;
  border-radius: 50%;
  border: var(--line-w) solid var(--ink);
  cursor: pointer;
}
[data-sim="rf-bandplan"] .rf-out {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  padding-left: 0.3rem;
  white-space: nowrap;
  color: var(--ink);
  pointer-events: none;
}
[data-sim="rf-bandplan"] .rf-rel { outline: max(3px, 0.18rem) dashed var(--ink); outline-offset: 1px; }
[data-sim="rf-bandplan"] .sd-changed { z-index: 2; }

/* ITU decades */
[data-sim="rf-bandplan"] .rf-decade {
  position: absolute;
  top: 0;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: var(--line-w) solid var(--line);
  font-family: var(--mono);
  font-weight: 700;
  color: var(--muted);
  overflow: hidden;
}
[data-sim="rf-bandplan"] .rf-decade:nth-child(even) { background: var(--panel); }

/* grid lines at the ticks, across every row */
[data-sim="rf-bandplan"] .rf-gridlines { position: absolute; top: 0; bottom: 0; left: var(--gut); right: 0; pointer-events: none; }
[data-sim="rf-bandplan"] .rf-gridline { position: absolute; top: 0; bottom: 0; border-left: 1px dotted var(--line); }

/* the axis */
[data-sim="rf-bandplan"] .rf-ticks { position: relative; }
[data-sim="rf-bandplan"] .rf-tick { position: absolute; top: 0; transform: translateX(-50%); padding-top: 0.45rem; font-family: var(--mono); white-space: nowrap; }
[data-sim="rf-bandplan"] .rf-tick::before { content: ''; position: absolute; top: 0; left: 50%; height: 0.35rem; border-left: var(--line-w) solid var(--ink); }
[data-sim="rf-bandplan"] .rf-tick.rf-first { transform: none; }
[data-sim="rf-bandplan"] .rf-tick.rf-first::before { left: 0; }
[data-sim="rf-bandplan"] .rf-tick.rf-last { transform: translateX(-100%); }
[data-sim="rf-bandplan"] .rf-tick.rf-last::before { left: auto; right: 0; }
[data-sim="rf-bandplan"] .rf-axis .rf-label { color: var(--muted); font-weight: 400; line-height: 1.05; }
[data-sim="rf-bandplan"] .rf-axis .rf-label::before { display: none; }

/* Phone and portrait: the stage grows with its content, a narrower gutter. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="rf-bandplan"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="rf-bandplan"] .rf { height: auto; --gut: 5.6rem; --lane: 1.5rem; padding: 0.4rem; }
  [data-sim="rf-bandplan"] [data-sd-controls] .sd-group { grid-template-columns: minmax(0, 1fr); }
  [data-sim="rf-bandplan"] .rf-row { flex: none; height: calc(var(--n) * var(--lane)); }
  [data-sim="rf-bandplan"] .rf-label { overflow-wrap: anywhere; hyphens: auto; }
  [data-sim="rf-bandplan"] .sd-presets { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Radiofrekvencijski spektar: plan namjene EU/HR</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function dec(x) { return Simdeck.lang === 'hr' ? String(x).replace('.', ',') : String(x); }
  var unitKey = { kHz: 'unitKHz', MHz: 'unitMHz', GHz: 'unitGHz' };
  function freq(f, digits) { var x = L.formatFreq(f, digits); return dec(x.num) + ' ' + t(unitKey[x.unit]); }
  /** A range as one string: the unit once when both ends share it. */
  function range(x) {
    if (x.fMin === x.fMax) return freq(x.fMin);
    var a = L.formatFreq(x.fMin), b = L.formatFreq(x.fMax);
    if (a.unit === b.unit) return dec(a.num) + '–' + dec(b.num) + ' ' + t(unitKey[b.unit]);
    return freq(x.fMin) + ' – ' + freq(x.fMax);
  }
  /** Three significant digits, for the centre slider and the view caption. */
  function freq3(f) { var x = L.formatFreq(f, 6); var v = Number(x.num); return dec(String(Number(v.toPrecision(3)))) + ' ' + t(unitKey[x.unit]); }
  function factor(z) { var f = Math.pow(2, z / 10); return dec(f < 10 ? f.toFixed(1) : String(Math.round(f))); }
  function data(tag, text, cls) { return h(tag, { translate: 'no', class: cls || null }, text); }

  var labels = {
    all: 'presetAll', hf: 'presetHf', vhf: 'presetVhf', uhf: 'presetUhf', lband: 'presetLband',
    ism24: 'presetIsm24', cband: 'presetCband', mmwave: 'presetMmwave'
  };

  var allIds = L.TECHS.map(function (x) { return x.id; }).concat(L.BANDPLAN.map(function (x) { return x.id; }));
  var params = [
    { key: 'zoom', type: 'range', label: t('zoom'), min: 0, max: L.ZOOM_MAX, step: 1, format: function (v) { return '×' + factor(v); } },
    { key: 'center', type: 'range', label: t('center'), step: 1,
      min: function (p) { return L.centerBounds(p.zoom)[0]; }, max: function (p) { return L.centerBounds(p.zoom)[1]; },
      format: function (v) { return freq3(Math.pow(10, v / 100)); } },
    { key: 'plan', type: 'toggle', label: t('plan') }
  ].concat(L.CATEGORIES.map(function (c) { return { key: 'cat-' + c.id, type: 'toggle', label: t('cat_' + c.id) }; }))
   .concat([{ key: 'sel', type: 'select', label: t('legendSel'), visible: function () { return false; },
     options: [['', '']].concat(allIds.map(function (id) { return [id, t('n_' + id)]; })) }]);

  // ── label widths, measured once per font ──
  var measure = document.createElement('canvas').getContext('2d');
  var widthCache = {};
  function labelWidth(text, font) {
    var k = font + '|' + text;
    if (!(k in widthCache)) { measure.font = font; widthCache[k] = measure.measureText(text).width; }
    return widthCache[k];
  }

  function colourOf(id) {
    var x = L.BY_ID[id];
    if (x.service) return L.SERVICES[x.service];
    var c = L.CATEGORIES.filter(function (k) { return k.id === x.cat; })[0];
    return { c: c.c, hatch: c.hatch };
  }

  /** One row: label, lanes, bars. Labels are placed after layout (they need the pixel width). */
  function row(cls, label, c, lanes, bars, st) {
    var laneEls = [];
    for (var i = 0; i < lanes; i++) laneEls.push(h('div', { class: 'rf-lane' }));
    bars.forEach(function (b) {
      var col = colourOf(b.id);
      var cls = (b.point ? 'rf-point' : 'rf-bar') + (col.c ? ' sd-fill' : ' rf-gov') + (col.hatch ? ' sd-hatch' : '') +
        (st.sel === b.id ? ' sd-changed' : '') + (st.related.indexOf(b.id) >= 0 ? ' rf-rel' : '');
      var style = b.point ? { left: (b.x * 100) + '%' } : { left: (b.x * 100) + '%', width: (b.w * 100) + '%' };
      laneEls[b.lane].appendChild(h('div', { class: cls, dataset: { id: b.id, c: col.c ? String(col.c) : '' }, style: style,
        title: t('n_' + b.id) }));
    });
    return h('div', { class: 'rf-row ' + cls, style: { '--n': String(lanes) } },
      h('div', { class: 'rf-label', dataset: c ? { c: String(c) } : {} }, label),
      h('div', { class: 'rf-lanes' }, laneEls));
  }

  /** Put each bar's name inside it, to its right, or nowhere (labelModes in sim.js). */
  function placeLabels(rowEl, bars) {
    var lanes = rowEl.querySelector('.rf-lanes');
    var w = lanes.clientWidth;
    if (!w) return;
    var cs = getComputedStyle(lanes);
    var font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    var widths = {};
    bars.forEach(function (b) { widths[b.id] = labelWidth(t('n_' + b.id), font); });
    var px = parseFloat(cs.fontSize);
    var modes = L.labelModes(bars.map(function (b) { return b.point ? Object.assign({}, b, { x: b.x - 0.4 * px / w, w: 0.8 * px / w }) : b; }),
      w, widths, { pad: 0.6 * px, minPx: 4 });
    var laneEls = lanes.children;
    bars.forEach(function (b) {
      var el = lanes.querySelector('[data-id="' + b.id + '"]');
      if (modes[b.id] === 'in' && !b.point) {
        el.textContent = t('n_' + b.id);
        el.classList.add('rf-named');
        // a bar that starts left of the view shows its name from the view's edge
        if (b.x < 0) el.style.paddingLeft = (-b.x * w + 0.25 * px) + 'px';
      }
      else if (modes[b.id] === 'right' || (modes[b.id] === 'in' && b.point)) {
        var right = b.point ? b.x * w + 0.4 * px : Math.min((b.x + b.w) * w, w);
        laneEls[b.lane].appendChild(h('span', { class: 'rf-out', style: { left: right + 'px' } }, t('n_' + b.id)));
      }
    });
  }

  var sim;
  function render(c) {
    var st = c.state, v = st.view;
    var rows = [];
    var itu = h('div', { class: 'rf-row rf-itu' }, h('div', { class: 'rf-label' }, t('ituRow')),
      h('div', { class: 'rf-lanes' }, st.itu.map(function (b) {
        var a = Math.max(b.x, 0), e = Math.min(b.x + b.w, 1);
        return h('div', { class: 'rf-decade', translate: 'no',
          style: { left: (a * 100) + '%', width: ((e - a) * 100) + '%' } }, (e - a) > 0.04 ? b.id : '');
      })));
    rows.push(itu);
    var planRow = null;
    if (st.plan) { planRow = row('rf-plan', t('planRow'), null, st.plan.lanes, st.plan.bars, st); rows.push(planRow); }
    var catRows = st.rows.map(function (r) {
      var cat = L.CATEGORIES.filter(function (k) { return k.id === r.id; })[0];
      return { el: row('rf-cat', t('cat_' + r.id), cat.c, r.lanes, r.bars, st), bars: r.bars };
    });
    catRows.forEach(function (r) { rows.push(r.el); });

    var tickRow = h('div', { class: 'rf-row rf-axis' }, h('div', { class: 'rf-label' }, t('axis')), h('div', { class: 'rf-ticks' }));
    rows.push(tickRow);
    var grid = h('div', { class: 'rf-grid' }, rows, h('div', { class: 'rf-gridlines' }));
    c.stage.replaceChildren(h('div', { class: 'rf' }, grid));

    // after layout: labels, ticks and grid lines need the plot width
    if (planRow) placeLabels(planRow, st.plan.bars);
    catRows.forEach(function (r) { placeLabels(r.el, r.bars); });
    var ticksEl = tickRow.querySelector('.rf-ticks');
    var w = ticksEl.clientWidth || 1;
    var px = parseFloat(getComputedStyle(ticksEl).fontSize) || 16;
    var shown = L.thinTicks(st.ticks, v, 6.5 * px / w);
    var lines = grid.querySelector('.rf-gridlines');
    shown.forEach(function (f, i) {
      var x = L.fracOf(f, v);
      var edge = x * w < 3.5 * px ? ' rf-first' : (1 - x) * w < 3.5 * px ? ' rf-last' : '';
      ticksEl.appendChild(h('span', { class: 'rf-tick' + edge, translate: 'no', style: { left: (x * 100) + '%' } }, freq(f, 3)));
      lines.appendChild(h('span', { class: 'rf-gridline', style: { left: (x * 100) + '%' } }));
    });
  }

  // ── pointer: drag pans, wheel and double click zoom, a click selects ──
  function plotFrac(stage, clientX) {
    var lanes = stage.querySelector('.rf-ticks');
    if (!lanes) return { frac: 0.5, width: 1 };
    var r = lanes.getBoundingClientRect();
    return { frac: (clientX - r.left) / (r.width || 1), width: r.width || 1 };
  }
  function wire(stage) {
    var drag = null;
    stage.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      drag = { x: e.clientX, p: sim.params, moved: false, id: e.pointerId, target: e.target };
    });
    stage.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x;
      if (!drag.moved && Math.abs(dx) < 5) return;
      if (!drag.moved) { drag.moved = true; stage.classList.add('rf-dragging'); try { stage.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
      sim.set(L.panBy(drag.p, -dx / plotFrac(stage, e.clientX).width));
    });
    function end(e) {
      if (!drag || e.pointerId !== drag.id) return;
      var d = drag; drag = null;
      stage.classList.remove('rf-dragging');
      if (d.moved || e.type === 'pointercancel') return;
      var hit = d.target instanceof Element ? d.target.closest('[data-id]') : null;
      var id = hit ? hit.dataset.id : '';
      sim.set({ sel: id && id !== sim.params.sel ? id : '' });
    }
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
    stage.addEventListener('wheel', function (e) {
      e.preventDefault();
      sim.set(L.zoomAt(sim.params, e.deltaY < 0 ? L.ZOOM_STEP : -L.ZOOM_STEP, plotFrac(stage, e.clientX).frac));
    }, { passive: false });
    stage.addEventListener('dblclick', function (e) {
      sim.set(L.zoomAt(sim.params, 2 * L.ZOOM_STEP, plotFrac(stage, e.clientX).frac));
    });
  }

  function names(ids) { return ids.map(function (id) { return t('n_' + id); }).join(', '); }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 2, label: t('legendBand') },
      { c: 4, shape: 'round', label: t('legendPoint') },
      { shape: 'hollow', label: t('legendGov') },
      { shape: 'hl', label: t('legendSel') }
    ],
    keys: [
      { key: '+', label: t('keyZoomIn'), run: function (s) { s.set(L.zoomAt(s.params, L.ZOOM_STEP, 0.5)); } },
      { key: '-', label: t('keyZoomOut'), run: function (s) { s.set(L.zoomAt(s.params, -L.ZOOM_STEP, 0.5)); } },
      { key: '[', label: t('keyLeft'), run: function (s) { s.set(L.panBy(s.params, -0.25)); } },
      { key: ']', label: t('keyRight'), run: function (s) { s.set(L.panBy(s.params, 0.25)); } },
      { key: 'P', label: t('keyPlan'), run: function (s) { s.set({ plan: !s.params.plan }); } }
    ],

    render: render,

    caption: function (c) {
      var st = c.state, v = st.view;
      var b = function (x) { return h('b', null, x); };
      if (st.selKind === 'tech') {
        var x = L.BY_ID[st.sel];
        var out = t.parts('capTech', { name: b(t('n_' + x.id)), range: data('span', range(x)), cat: t('cat_' + x.cat), note: t('d_' + x.id) });
        return out.concat([' '], st.related.length ? t.parts('capTechBands', { bands: names(st.related) }) : t.parts('capTechNoBand'));
      }
      if (st.selKind === 'band') {
        var y = L.BY_ID[st.sel];
        var head = t.parts('capBand', { name: b(t('n_' + y.id)), range: data('span', range(y)), service: t('svc_' + y.service), note: t('d_' + y.id) });
        if (!st.related.length) return head.concat([' '], t.parts('capBandNone'));
        var list = names(st.related.slice(0, 6));
        if (st.related.length > 6) list += ' ' + t.n('capMore', st.related.length - 6);
        return head.concat([' '], t.parts('capBandTechs', { list: list }));
      }
      var bands = st.itu.filter(function (k) { return k.w > 0; }).map(function (k) { return k.id; }).join(', ');
      return t.parts('capView', { lo: data('span', freq3(Math.pow(10, v.lo))), hi: data('span', freq3(Math.pow(10, v.hi))),
        decades: dec(v.span.toFixed(v.span < 1 ? 2 : 1)), factor: factor(c.params.zoom) })
        .concat([' '], t.parts('capItu', { bands: data('span', bands) }), [' '], t.parts('capHint'));
    }
  });
  wire(document.querySelector('[data-sd-stage]'));
})();
</script>
