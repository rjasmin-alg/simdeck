<!-- ari-times-ten: multiplying and dividing by 10, 100 and 1000 as moves in the place-value table. A stepper: step 0
     shows the number and the question, each step is one move (every digit one place left and a 0 in the ones, or one
     place right and the 0 of the ones leaves), the last step writes the result outside the table. The table is kit view
     K5 (Simdeck.paperColumns, docs/sim-ui.md §14), one row per move as a staircase; the operation buttons, the why box,
     the decimal values and the mistake card are this page's. Any base 2–16 (10 is b written in base b).
     Rules: SPEC.md. -->

  [data-sim="ari-times-ten"] .tt-op { min-width: 3.6em; padding: 0.1em 0.4em; }

  [data-sim="ari-times-ten"] .tt-table .sd-paper { --pc-cell: max(1.7rem, min(calc(92cqw / (var(--pc-w) + var(--pc-xw))), var(--pc-max-phone))); }
  [data-sim="ari-times-ten"] .tt-foot { flex-direction: column; gap: 0.7rem; }
  [data-sim="ari-times-ten"] .tt-foot > *, [data-sim="ari-times-ten"] .tt > * { flex: none; min-width: 0; max-width: 100%; }

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';

  var PRESET_KEY = { ten: 'pTen', hundred: 'pHundred', thousand: 'pThousand', divide: 'pDivide', 'two-zeros': 'pTwoZeros',
    'base-2': 'pBase2' };
  var MISTAKE_KEY = { none: 'mNone', few: 'mFew', middle: 'mMiddle' };
  var NAMED = { 2: 'baseName2', 8: 'baseName8', 10: 'baseName10', 16: 'baseName16' };
  var QUICK = [2, 8, 10, 16];
  var SEP = Simdeck.lang === 'en' ? ',' : '\u00a0';   // thousands separator: 205 000, 205,000 (not a word)

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  /** A click on a page button keeps the clicker keys (the kit does the same for its own buttons). */
  function noFocus(btn) { btn.addEventListener('mousedown', function (e) { e.preventDefault(); }); return btn; }

  // ── numbers as data ──
  /** A base-10 numeral in groups of three from 10 000 up (205 000; English 205,000). */
  function group(s) {
    if (s.length < 5) return s;
    var out = '';
    for (var i = 0; i < s.length; i++) { if (i > 0 && (s.length - i) % 3 === 0) out += SEP; out += s[i]; }
    return out;
  }
  function numeral(v, b) { return b === 10 ? group(L.textOf(v, 10)) : L.textOf(v, b); }
  function dec(v) { return group(String(v)); }
  /** v in base b as data; the base as a subscript when it is not 10. */
  function numNode(v, b, cls) {
    return h('span', { class: 'tt-num' + (cls ? ' ' + cls : ''), translate: 'no' }, numeral(v, b), b !== 10 ? h('sub', null, String(b)) : null);
  }
  function plain(text) { return h('span', { class: 'tt-num', translate: 'no' }, String(text)); }
  /** · 10ᵏ or : 10ᵏ written in base b: always 1 and k zeros (bᵏ in base b). */
  function opText(kind, k) { return (kind === 'mul' ? '· ' : ': ') + '1' + '000'.slice(0, k); }
  function byText(k) { return '1' + '000'.slice(0, k); }
  function byNode(k, b) { return h('span', { class: 'tt-num', translate: 'no' }, byText(k), b !== 10 ? h('sub', null, String(b)) : null); }
  function opNode(kind, k, b) { return h('span', { class: 'tt-num', translate: 'no' }, opText(kind, k), b !== 10 ? h('sub', null, String(b)) : null); }
  function expr(D) { return h('span', { class: 'tt-num' }, numNode(D.n, D.b), ' ', opNode(D.kind, D.k, D.b)); }

  /** A place's label: J, D, S … in base 10 (words), bᵏ otherwise (data). */
  function placeLabel(k, b) { return b === 10 ? t('place' + k) : P.power(b, k); }
  function placeTitle(k, b) { return b === 10 ? t('placeName' + k) : null; }
  /** A digit on its place: "4 D" in base 10, "1 · 2³" otherwise. */
  function dp(d, k, b) {
    if (b === 10) return h('span', { class: 'tt-dp' }, plain(L.DIGITS[d]), ' ', placeLabel(k, b));
    return h('span', { class: 'tt-dp', translate: 'no' }, L.DIGITS[d] + ' · ', P.power(b, k));
  }

  // ── the sentence ──
  function sentence(D, s) {
    var done = s.phase === 'done';
    var kids = [h('span', { class: 'tt-eq' }, expr(D), ' = ', done ? numNode(D.result, D.b, 'sd-hl') : h('span', { class: 'tt-q', translate: 'no' }, '?'))];
    if (D.b !== 10 && audience !== 'child') {
      var by = Math.pow(D.b, D.k);
      kids.push(h('span', { class: 'tt-dec tt-num', translate: 'no' },
        '(' + dec(D.n) + (D.kind === 'mul' ? ' · ' : ' : ') + dec(by) + ' = ' + (done ? dec(D.result) : '?') + ')'));
    }
    if (s.phase === 'over') kids.push(h('span', { class: 'tt-fail' }, t('overWord')));
    if (s.phase === 'stop') kids.push(h('span', { class: 'tt-fail' }, t('stopWord')));
    return h('div', { class: 'tt-sent' }, kids);
  }

  // ── the operation buttons and "go on" ──
  function operations(D, s) {
    var btns = L.OPS.map(function (op, i) {
      var kind = op[0] === 'm' ? 'mul' : 'div', k = Number(op[1]);
      var st = L.statusOf(D.n, D.b, op);
      var tip = st === 'over' ? t('tipOver') : st === 'stop' ? t('tipStop', { n: numeral(D.n, D.b) }) : null;
      var kids = [h('span', { class: 'tt-opl', translate: 'no' }, opText(kind, k),
        st !== 'ok' ? h('span', { class: 'tt-opx', 'aria-hidden': 'true' }, '✗') : null)];
      if (D.b !== 10) kids.push(h('span', { class: 'tt-opd', translate: 'no' }, t('opIs', { op: (kind === 'mul' ? '· ' : ': ') + Math.pow(D.b, k) })));
      var btn = h('button', { type: 'button', class: 'sd-btn tt-op', 'aria-pressed': String(op === D.op), dataset: { st: st, op: op },
        title: tip, 'aria-label': opText(kind, k) + (tip ? ' — ' + tip : ''),
        onclick: function () { if (op === D.op) sim.first(); else sim.set({ op: op }); } }, kids);
      return noFocus(btn);
    });
    btns.splice(3, 0, h('span', { class: 'tt-gap', 'aria-hidden': 'true' }));
    var go = noFocus(h('button', { type: 'button', class: 'sd-btn tt-go', title: t('goOnHint'), 'aria-keyshortcuts': 'd',
      hidden: s.phase !== 'done' || null, onclick: goOn }, s.phase === 'done' ? t('goOn', { r: numeral(D.result, D.b) }) : t('goOn', { r: '' })));
    btns.push(h('span', { class: 'tt-gap', 'aria-hidden': 'true' }), go);
    return h('div', { class: 'tt-ops', role: 'group', 'aria-label': t('opsLabel') }, btns);
  }
  function goOn() {
    var D = L.demoOf(sim.params);
    if (sim.state.phase !== 'done') return;
    sim.set({ n: D.result });
  }

  // ── the place-value table: one row per move ──
  function rowsShown(D, s) { return D.rows.slice(0, s.phase === 'over' ? 1 : s.i + 1); }
  function table(D, s) {
    var b = D.b, cols = L.colsOf(D), shown = rowsShown(D, s);
    var places = [], titles = [];
    for (var k = 0; k < cols; k++) { places.push(placeLabel(k, b)); titles.push(placeTitle(k, b)); }
    var rows = shown.map(function (r, j) {
      var fresh = j === s.i && j > 0 && (s.phase === 'move' || s.phase === 'stop');
      var ds = L.digitsOf(r.value, b);
      var cells = r.out != null && r.value === 0 ? [] : ds.map(function (d) { return L.DIGITS[d]; });
      if (D.kind === 'mul' && fresh) cells[0] = { text: '0', now: true };
      var row = { cells: cells };
      if (r.out != null) {
        var o = L.DIGITS[r.out];
        row.at = -1;
        row.cells = [{ text: o, x: r.out === 0 ? true : 'wrong', now: fresh, label: t(r.out === 0 ? 'outLabel' : 'outWrong', { d: o }) }].concat(cells);
      }
      if (j > 0) row.aside = opText(D.kind, 1);
      if (s.phase === 'done' && j === shown.length - 1) row.kind = 'result';
      return row;
    });
    // the rows still to come stay empty, so the table keeps its size from step 0 and nothing jumps
    for (var e = shown.length; e < D.rows.length; e++) rows.push({ cells: [] });
    var band = (s.phase === 'move' || s.phase === 'stop') && s.i > 0 ? [{ k: s.phase === 'stop' ? -1 : 0, from: s.i, to: s.i }] : [];
    var paper = P({
      cols: cols, right: D.kind === 'div' ? 1 : 0, big: audience === 'child', places: places, placeTitles: titles,
      band: band, rows: rows,
      label: t('paperLabel', { rows: shown.map(function (r) { return numeral(r.value, b); }).join(', ') })
    });
    return h('section', { class: 'tt-table sd-paper-box' }, paper);
  }

  /** The digits of the new row slide in from where they stood in the row above (not the 0 written in the ones). */
  function slide(c, D) {
    var s = c.state;
    if (c.dir !== 'forward' || Simdeck.reducedMotion() || !(s.phase === 'move' || s.phase === 'stop')) return;
    var paper = c.stage.querySelector('.tt-table .sd-paper');
    if (!paper || !paper.animate) return;
    var line = String(s.i + 2);
    var dx = D.kind === 'mul' ? '100%' : '-100%';
    paper.querySelectorAll('.sd-pc-c').forEach(function (el) {
      if (el.style.gridRow !== line || el.classList.contains('sd-pc-pl') || (D.kind === 'mul' && el.classList.contains('sd-changed'))) return;
      el.animate([{ transform: 'translate(' + dx + ', -100%)', opacity: 0.35 }, { transform: 'none', opacity: 1 }],
        { duration: 550, easing: 'ease-out' });
    });
  }

  // ── where each digit goes ──
  function whyBox(D, s, p) {
    var started = s.i > 0 || s.phase === 'done';
    var lines = L.movesOf(p).map(function (m) {
      var to = !started ? h('span', { class: 'tt-q', translate: 'no' }, '?')
        : m.to < 0 ? h('span', { class: 'tt-bad', translate: 'no' }, '✗') : dp(m.d, m.to, D.b);
      return h('span', { class: 'tt-line' }, dp(m.d, m.from, D.b), h('span', { class: 'tt-arrow', translate: 'no' }, ' → '), to);
    });
    var kids = [h('div', { class: 'tt-head' }, t('whyTitle'), ' ', opNode(D.kind, D.k, D.b)), h('div', { class: 'tt-lines' }, lines)];
    if (!started) kids.push(h('div', { class: 'tt-small' }, t('whyLater')));
    else if (D.kind === 'mul') kids.push(h('div', { class: 'tt-small' }, t(D.k === 1 ? 'whyZero' : 'whyZeros')));
    return h('section', { class: 'tt-box tt-why' }, kids);
  }

  // ── the same numbers in decimal (base ≠ 10) ──
  function decBox(D, s) {
    var chain = [];
    rowsShown(D, s).forEach(function (r, j) {
      if (j > 0) chain.push(h('span', { class: 'tt-arrow' }, (D.kind === 'mul' ? '·' : ':') + D.b + '→'));
      chain.push(h('span', { class: r.out ? 'tt-bad' : null }, dec(r.value)));
    });
    var kids = [h('div', { class: 'tt-head' }, t('decTitle')), h('div', { class: 'tt-chain', translate: 'no' }, chain),
      h('div', { class: 'tt-small' }, t(D.kind === 'mul' ? 'decMul' : 'decDiv', { b: D.b }))];
    if (D.b === 2 && D.kind === 'mul') kids.push(h('div', { class: 'tt-small' }, t('decBin')));
    return h('section', { class: 'tt-box tt-decbox' }, kids);
  }

  // ── the typical mistake ──
  function mistakeCard(D, s, p) {
    var m = L.mistakeOf(p);
    var kids = [h('div', { class: 'tt-head' }, t('mcHead'))];
    if (!m.applies) {
      var na = { mul: 'mcNaMul', same: 'mcNaSame', stop: 'mcNaStop', over: 'mcNaOver' }[m.reason];
      kids.push(h('p', { class: 'tt-small' }, t(na, { preset: t('pDivide') })));
      return h('section', { class: 'tt-box tt-mc' }, kids);
    }
    kids.push(h('p', null, t('mcWrote'), ' ', h('b', null, expr(D), ' = ', numNode(m.wrong, D.b, 'tt-wrong'))));
    if (s.phase !== 'done') {
      kids.push(h('p', { class: 'tt-small' }, t('mcAsk')));
      return h('section', { class: 'tt-box tt-mc' }, kids);
    }
    var right = L.digitsOf(D.result, D.b), wrong = L.digitsOf(m.wrong, D.b);
    var cols = Math.max(right.length, wrong.length);
    var places = [];
    for (var k = 0; k < cols; k++) places.push(placeLabel(k, D.b));
    var paper = P({ cols: cols, places: places, label: t('mcHead'), rows: [
      { cells: right.map(function (d) { return L.DIGITS[d]; }), aside: '✓' },
      { cells: wrong.map(function (d, k) { return m.diff.indexOf(k) >= 0 ? { text: L.DIGITS[d], x: 'wrong' } : L.DIGITS[d]; }), aside: '✗' }] });
    kids.push(h('div', { class: 'sd-paper-box' }, paper));
    var one = D.k === 1 ? '1' : '';
    if (m.kind === 'few') {
      kids.push(h('p', { class: 'tt-small' }, tp((D.kind === 'mul' ? 'mcWhyFewMul' : 'mcWhyFewDiv') + one,
        one ? { by: byNode(D.k, D.b) } : { wrong: t('places' + (D.k - 1)), right: t('places' + D.k), byW: byNode(D.k - 1, D.b), by: byNode(D.k, D.b) })));
    } else {
      kids.push(h('p', { class: 'tt-small' }, tp('mcWhyMiddle' + one, { right: numNode(D.result, D.b) })));
    }
    return h('section', { class: 'tt-box tt-mc' }, kids);
  }

  function render(c) {
    var D = L.demoOf(c.params), s = c.state;
    var parts = [sentence(D, s), operations(D, s), table(D, s)];
    if (audience !== 'child') {
      var foot = [];
      if (s.phase !== 'over') foot.push(whyBox(D, s, c.params));
      if (D.b !== 10) foot.push(decBox(D, s));
      if (audience === 'teacher' && c.params.mistake !== 'none') foot.push(mistakeCard(D, s, c.params));
      if (foot.length) parts.push(h('div', { class: 'tt-foot' }, foot));
    }
    c.stage.replaceChildren(h('div', { class: 'tt', dataset: { aud: audience } }, parts));
    slide(c, D);
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var D = L.demoOf(c.params), s = c.state, b = D.b, k = D.k;
    var X = audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C';
    var K = D.kind === 'mul' ? 'Mul' : 'Div';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    var inBase = b !== 10 && X !== 'C' ? t('inBase', { b: b }) : null;

    if (s.phase === 'start') {
      add(tp('cStart' + K + X, { e: expr(D), by: byNode(k, b), places: t('places' + k), end: t('end' + k) }));
      if (inBase) add(inBase);
    } else if (s.phase === 'move') {
      var prev = L.digitsOf(D.rows[s.i - 1].value, b), step = D.kind === 'mul' ? 1 : -1, ex = [];
      for (var p = prev.length - 1; p >= 0; p--) {
        if (prev[p] === 0 || p + step < 0) continue;
        if (ex.length) ex.push(', ');
        ex.push(dp(prev[p], p, b), h('span', { class: 'tt-arrow', translate: 'no' }, ' → '), dp(prev[p], p + step, b));
      }
      if (X === 'T') {
        add(k > 1 ? t('moveNo', { i: s.i, k: k }) : t('moveOne'));
        add(tp('cMove' + K + 'T', { op: opNode(D.kind, 1, b), v: numNode(D.rows[s.i].value, b) }));
        if (inBase) add(inBase);
      } else if (X === 'A') {
        add(tp('cMove' + K + 'A', { b: plain(b), ex: h('span', null, ex) }));
      } else add(t('cMove' + K + 'C'));
    } else if (s.phase === 'done') {
      var e = h('span', null, expr(D), ' = ', numNode(D.result, b));
      if (X === 'T') {
        addHl(tp('cDone' + K + 'T', { e: e, moves: t.n('moves', k), zeros: t.n('zeros', k) }));
        if (b !== 10) add(tp('cDoneDec', { chk: plain(dec(D.n) + (D.kind === 'mul' ? ' · ' : ' : ') + dec(Math.pow(b, k)) + ' = ' + dec(D.result)) }));
      } else if (X === 'A') {
        var ds = L.digitsOf(D.result, b), worths = [];
        for (var q = ds.length - 1; q >= 0; q--) if (ds[q]) worths.push(dec(ds[q] * Math.pow(b, q)));
        add(tp('cDone' + K + 'A', { e: e, by: byNode(k, b), sum: plain(worths.join(' + ') + (worths.length > 1 || b !== 10 ? ' = ' + dec(D.result) : '')) }));
      } else addHl(tp('cDone' + K + 'C', { e: e }));
    } else if (s.phase === 'over') {
      add(tp('cOver' + X, { e: expr(D), r: numNode(D.n * Math.pow(b, k), b) }));
    } else if (s.phase === 'stop') {
      var d = plain(L.DIGITS[D.rows[s.i].out]), bk = Math.pow(b, k);
      if (X === 'T') {
        add(tp('cStopT', { d: d, by: byNode(k, b), end: t('end' + k), n: numNode(D.n, b),
          q: numNode(Math.floor(D.n / bk), b), r: numNode(D.n % bk, b) }));
      } else if (X === 'A') add(tp('cStopA', { b: plain(b), d: d, end: t('end' + k) }));
      else add(tp('cStopC', { d: d }));
    }
    return out;
  }

  // ── the panel: the number field and the quick bases; the header: the audience switch ──
  var field = null, quick = null;
  function resetMsg() { field.input.removeAttribute('aria-invalid'); field.msg.textContent = t('numHint'); field.msg.className = 'sd-hint'; }
  function buildNumber() {
    var host = document.querySelector('[data-tt-number]');
    var label = h('label', { class: 'sd-ctl-label', for: 'tt-num' }, h('span', null, ''));
    var input = h('input', { id: 'tt-num', type: 'text', class: 'tt-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', inputmode: 'text', 'aria-describedby': 'tt-num-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'tt-num-msg', role: 'status' }, t('numHint'));
    field = { input: input, label: label.firstChild, msg: msg };
    input.addEventListener('input', function () {
      var r = L.parseNumber(input.value, sim.params.base);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t({ digit: 'errDigit', max: 'errMax', empty: 'errEmpty', zero: 'errZero' }[r.error], { at: r.at, b: sim.params.base });
        msg.className = 'tt-err';
        return;
      }
      resetMsg();
      if (r.value !== sim.params.n) sim.set({ n: r.value });
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { resetMsg(); sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('numsTitle') },
      h('div', { class: 'tt-field' }, label, input, msg)));
  }
  function buildQuick() {
    var wrap = document.querySelector('[data-sd-controls] [data-key="base"]');
    if (!wrap) return;
    quick = QUICK.map(function (qb) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { sim.set({ base: qb }); } }, String(qb)));
    });
    wrap.append(h('div', { class: 'sd-seg tt-quick', role: 'group', 'aria-label': t('baseQuick'), title: t('baseHint') }, quick));
  }
  function syncPanel(c) {
    var p = c.params, b = L.numbersOf(p).b;
    if (field) {
      field.label.textContent = b === 10 ? t('numLabel10') : t('numLabel', { b: b });
      var r = L.parseNumber(field.input.value, b);
      var typing = document.activeElement === field.input;
      if (!typing || (!r.error && r.value !== L.numbersOf(p).n)) { field.input.value = L.textOf(L.numbersOf(p).n, b); resetMsg(); }
    }
    if (quick) quick.forEach(function (btn, i) { btn.setAttribute('aria-pressed', String(b === QUICK[i])); });
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints,
      onChange: function (a) { audience = a; if (!enforceChild()) sim.render(); } });
    audience = ctl.value;
  }
  /** The child view hides the presets in other bases (it works in base 10). */
  function syncChildPresets() {
    var btns = document.querySelectorAll('[data-sd-presets] .sd-preset');
    L.PRESETS.forEach(function (pr, i) { if (btns[i]) btns[i].hidden = audience === 'child' && pr.params.base !== 10; });
  }
  /** The child view works in base 10 only; the number stays. Returns true when it changed the base. */
  function enforceChild() {
    if (audience !== 'child' || L.numbersOf(sim.params).b === 10) return false;
    sim.set({ base: 10 });
    return true;
  }

  buildAudience();
  buildNumber();

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'base', type: 'range', label: t('base'), value: L.defaults.base, min: L.MIN_BASE, max: L.MAX_BASE, resets: true,
        format: function (v) { return NAMED[v] ? v + ' (' + t(NAMED[v]) + ')' : String(v); },
        visible: function () { return audience !== 'child'; } },
      { key: 'mistake', type: 'choice', label: t('mistake'), value: L.defaults.mistake,
        options: L.MISTAKES.map(function (m) { return [m, t(MISTAKE_KEY[m])]; }),
        visible: function () { return audience === 'teacher'; } },
      // the number and the operation: set from the field and the stage's buttons, kept here for the URL and the L switch
      { key: 'n', type: 'range', label: t('numsTitle'), value: L.defaults.n, min: 1, max: L.MAX_VALUE, resets: true,
        visible: function () { return false; } },
      { key: 'op', type: 'select', label: t('opsLabel'), value: L.defaults.op, resets: true,
        options: L.OPS.map(function (op) { return [op, opText(op[0] === 'm' ? 'mul' : 'div', Number(op[1]))]; }),
        visible: function () { return false; } }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    keys: [{ key: 'd', label: t('goOnHint'), run: function () { goOn(); } }],

    legend: [
      { shape: 'pc-band', label: t('legBand') },
      { shape: 'hl', label: t('legNew') },
      { shape: 'tt-out', label: t('legOut') }
    ],

    render: render,
    caption: caption
  });
  buildQuick();
  sim.on(function (c) {
    if (audience === 'child' && L.numbersOf(c.params).b !== 10) { enforceChild(); return; }
    syncChildPresets();
  });
  enforceChild();
  sim.render();
})();
</script>
</body>
</html>
