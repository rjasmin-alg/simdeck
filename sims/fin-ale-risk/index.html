<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (88 000 / 88,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '\u00a0' : ',');   // no break inside a number
  }
  function money(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  function pct(n) { return t('pct', { n: String(n) }); }
  function dec(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  /** A frequency for the select: "0,05 (jednom u 20 godina)" / "4 times a year". */
  function freqLong(f) {
    if (f < 1) { var n = Math.round(1 / f); return t.n('freqRare', n, { f: dec(f), n: n }); }
    return t.n('freqOften', f, { n: f });
  }
  function freqShort(f) { return t('perYr', { f: dec(f) }); }
  /** A ratio in tenths: "6,7 puta" / "6.7 times". */
  function times(tenths) { return t('times', { n: dec(tenths / 10) }); }
  function riskName(id) { return t('r_' + id); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }

  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // the control to give focus back to after a render (keyboard)
  function btn(cls, attrs, sel, apply, children) {
    return h('button', Object.assign({
      type: 'button', class: cls, dataset: { sel: sel }, onmousedown: noFocus,
      onclick: function (e) { refocus = e.detail === 0 ? sel : null; apply(); }
    }, attrs), children);
  }

  // ── the register ──

  function detail(x, ded) {
    var c = money(x.cost), rm = money(x.removed);
    switch (x.t) {
      case 'off': return t('rowOff');
      case 'accept': return t('rowAccept', { a: money(x.ale) });
      case 'reduce':
        return t(x.kind === 'aro' ? 'rowReduceAro' : 'rowReduceSle',
          { ctrl: t('ctrl_' + x.id), e: pct(x.eff), c: c, rm: rm });
      case 'transfer':
        return x.belowDed ? t('rowBelowDed', { d: money(ded) }) : t('rowTransfer', { c: c, d: money(x.keep), rm: rm });
      default: return t('rowAvoid', { avoid: t('avoid_' + x.id), c: c, rm: rm });
    }
  }
  function verdict(x) {
    if (x.verdict === 'none') return null;
    var key = { worth: 'vWorth', even: 'vEven', not: 'vNot' }[x.verdict];
    return h('span', { class: 'ar-v', dataset: { v: x.verdict } }, t(key, { n: money(x.net) }));
  }

  function register(s) {
    var rows = s.risks.map(function (x) {
      var p = s.p, id = x.id, on = id === p.risk;
      var ale = x.t === 'off' ? t('rowOffAle')
        : t('rowAle', { l: money(x.sle), f: freqShort(p[id + 'F']), a: money(x.ale) });
      return h('div', { class: 'ar-row', dataset: { on: String(on), t: x.t } },
        btn('ar-name', { 'aria-pressed': String(on), title: riskName(id),
          'aria-label': t('rowLabel', { risk: riskName(id), a: money(x.ale) }) },
          'risk-' + id, function () { sim.set({ risk: id }); }, riskName(id)),
        h('span', { class: 'ar-ale ar-num', translate: 'no' }, ale),
        h('span', { class: 'ar-treat', role: 'group', 'aria-label': t('treatGroup', { risk: riskName(id) }) },
          L.TREAT.map(function (tr) {
            var off = x.t === 'off';
            return btn('ar-tb', {
              'aria-pressed': String(p[id + 'T'] === tr && !off), 'aria-disabled': String(off),
              'aria-label': t('treatLabel', { risk: riskName(id), t: t('t_' + tr) })
            }, 'treat-' + id + '-' + tr, function () {
              var patch = { risk: id };
              if (!off) patch[id + 'T'] = tr;
              sim.set(patch);
            }, t('t_' + tr));
          })),
        h('div', { class: 'ar-detail' }, h('span', null, detail(x, p.ded)), verdict(x)));
    });
    return h('div', { class: 'ar-reg' },
      h('div', { class: 'ar-hrow ar-head', 'aria-hidden': 'true' },
        h('span', null, t('headRisk')), h('span', null, t('headAle')), h('span', null, t('headTreat'))),
      rows);
  }

  // ── the simulated years ──

  function chart(s) {
    var hi = s.axis.hi, y = s.years, fixed = y.fixed, n = y.u.length;
    var pc = function (v) { return (100 * v / hi) + '%'; };
    var cols = y.u.map(function (u, i) {
      var k = y.k[i];
      return h('div', { class: 'ar-yr' },
        u ? h('div', { class: 'ar-u', style: { height: pc(u) } }) : null,
        s.none ? null : h('div', { class: 'ar-k', style: { height: pc(fixed + k) } },
          fixed ? h('div', { dataset: { k: 'fixed' }, style: { height: (100 * fixed / (fixed + k)) + '%' } }) : null,
          k ? h('div', { dataset: { k: 'kept' }, style: { height: (100 * k / (fixed + k)) + '%' } }) : null));
    });
    function line(k, v, text, left) {
      return h('div', { class: 'ar-line', dataset: { k: k, left: String(!!left) }, style: { bottom: pc(v) } },
        h('span', { class: 'ar-tag', translate: 'no' }, text));
    }
    function worst(k, sum, text) {
      var x = 100 * (sum.at + 0.5) / n;
      return h('div', { class: 'ar-worst', dataset: { k: k }, style: { left: x + '%', bottom: pc(sum.worst) } },
        h('span', { class: 'ar-tag', translate: 'no', dataset: { side: x > 55 ? 'l' : 'r' } }, text));
    }
    // two lines close together: the ALE's tag moves to the left end, so the tags never cover each other
    var close = !s.none && Math.abs(s.tot.ale - s.tot.exp) < hi / 12;
    var marks = [line('ale', s.tot.ale, t('tagAle', { v: money(s.tot.ale) }), close)];
    if (!s.none) marks.push(line('exp', s.tot.exp, t('tagExp', { v: money(s.tot.exp) }), false));
    // the worst year of each column; one tag when both are the same year and amount (or nothing is treated)
    var same = s.none || (s.after.at === s.before.at && s.after.worst === s.before.worst);
    if (same) { if (s.before.worst > 0) marks.push(worst('u', s.before, t('tagWorst', { v: money(s.before.worst) }))); }
    else {
      if (s.before.worst > 0) marks.push(worst('u', s.before, t('tagWorst0', { v: money(s.before.worst) })));
      if (s.after.worst > 0) marks.push(worst('k', s.after, t('tagWorst1', { v: money(s.after.worst) })));
    }
    return h('div', { class: 'ar-chart' },
      h('p', { class: 'ar-head' }, t('headYears', { n: t.n('nYears', n, { n: group(n) }) })),
      h('div', { class: 'ar-yaxis', 'aria-hidden': 'true' }, s.axis.ticks.map(function (v) {
        return h('span', { translate: 'no', style: { bottom: pc(v) } }, money(v));
      })),
      h('div', { class: 'ar-plot', 'aria-hidden': 'true' },
        h('div', { class: 'ar-cols', dataset: { many: String(n > 200) } }, cols),
        marks));
  }

  function table(s) {
    var rows = [
      ['rowExp', s.tot.ale, s.tot.exp],
      ['rowAvg', s.before.avg, s.after.avg],
      ['rowWorst', s.before.worst, s.after.worst]
    ];
    var cells = [h('p', { class: 'ar-head' }, t('headTable')),
      h('span'), h('span', { class: 'ar-th' }, t('colBefore')), h('span', { class: 'ar-th' }, t('colAfter'))];
    rows.forEach(function (r) {
      cells.push(h('span', { class: 'ar-tl' }, t(r[0])),
        h('span', { class: 'ar-td ar-num', translate: 'no', dataset: { k: 'u' } }, money(r[1])),
        h('span', { class: 'ar-td ar-num', translate: 'no' }, money(r[2])));
    });
    cells.push(h('span', { class: 'ar-tl' }, t('rowHit')),
      h('span', { class: 'ar-td ar-num', translate: 'no', dataset: { k: 'u' } }, group(s.before.hit)),
      h('span', { class: 'ar-td ar-num', translate: 'no' }, group(s.after.hit)));
    return h('div', { class: 'ar-table' }, cells);
  }

  function result(s, chg) {
    var o = s.outcome, text;
    var removed = s.tot.ale - s.tot.res;
    if (s.empty) text = t('capEmpty');
    else if (o === 'none') text = t('resultNone', { ale: money(s.tot.ale), n: group(s.p.years), w: money(s.before.worst) });
    else {
      var v = { c: money(s.tot.cost), rm: money(removed), s: money(s.tot.save), w0: money(s.before.worst), w1: money(s.after.worst) };
      text = t(o === 'even' ? 'resultEven' : o === 'save' ? 'resultSave' : 'resultCost', v);
    }
    return h('p', { class: 'ar-result' + (chg.indexOf('outcome') >= 0 ? ' sd-changed' : ''), dataset: { o: o } }, text);
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'ar' },
      register(s),
      h('div', { class: 'ar-mid' }, chart(s),
        h('div', { class: 'ar-side' }, table(s), result(s, chg),
          h('p', { class: 'ar-foot' }, t('foot'), ' ', t('illustrative'))))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state;
    var k = L.captionKey(s);
    var n = group(s.p.years);
    var out = t.parts(k.key, {
      ale: b(money(s.tot.ale)), res: b(money(s.tot.res)), c: b(money(s.tot.cost)), s: b(money(s.tot.save)),
      avg: b(money(s.before.avg)), w: b(money(s.before.worst)), x: b(times(s.times || 0)),
      w0: b(money(s.before.worst)), w1: b(money(s.after.worst)), n: b(n)
    });
    var not = s.risks.filter(function (x) { return x.t === 'reduce' && x.verdict !== 'worth'; })
      .map(function (x) { return t('ctrl_' + x.id); }).join(', ');
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, { list: b(not), q: b(group(s.quiet)), n: b(n) }));
    });
    return out;
  }

  var labels = { register: 'pRegister', controls: 'pControls', insure: 'pInsure', rare: 'pRare', 'break-even': 'pBreakEven' };
  var R = L.RANGES;
  function range(key, label, fmt, show) {
    return { key: key, type: 'range', label: label, min: R[key][0], max: R[key][1], step: R[key][2], format: fmt, visible: show };
  }
  var riskParams = [];
  L.RISKS.forEach(function (id) {
    var name = riskName(id);
    var sel = function (p) { return p.risk === id; };
    var tr = function (v) { return function (p) { return p.risk === id && p[id + 'T'] === v && p[id + 'L'] > 0; }; };
    riskParams.push(
      { key: id + 'L', type: 'select', label: t('lossOf', { risk: name }), visible: sel,
        options: L.LOSS.map(function (v) { return [v, v ? money(v) : t('lossOff')]; }) },
      { key: id + 'F', type: 'select', label: t('freqOf', { risk: name }), visible: sel,
        options: L.FREQ.map(function (f) { return [f, freqLong(f)]; }) },
      { key: id + 'T', type: 'choice', label: t('treatOf', { risk: name }), visible: sel,
        options: L.TREAT.map(function (v) { return [v, t('t_' + v)]; }) },
      range(id + 'C', t('costOf', { risk: name }), money, tr('reduce')),
      range(id + 'E', t(L.KIND[id] === 'aro' ? 'effOfAro' : 'effOfSle', { risk: name }), pct, tr('reduce')),
      range(id + 'A', t('avoidOf', { risk: name }), money, tr('avoid')));
  });
  function insured(p) { return p[p.risk + 'T'] === 'transfer' && p[p.risk + 'L'] > 0; }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      // the risk is chosen on the stage (the names in the register); this hidden param keeps it in the URL and checks it
      { key: 'risk', type: 'choice', label: t('risk'), options: L.RISKS.map(function (id) { return [id, riskName(id)]; }),
        visible: function () { return false; } },
      // the seed: "Run again" adds 1; hidden, kept in the URL
      { key: 'seed', type: 'range', label: t('runAgain'), min: 1, max: L.SEED_MAX, step: 1, visible: function () { return false; } }
    ].concat(riskParams, [
      range('ded', t('ded'), money, insured),
      range('load', t('load'), pct, insured),
      { key: 'years', type: 'choice', label: t('years'), options: L.YEARS.map(function (n) { return [n, group(n)]; }) },
      { type: 'button', label: t('runAgain'), key: 'n', run: function (api) {
        api.set({ seed: L.nextSeed(api.params.seed) });
      } }
    ]),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'ar-u', label: t('legBefore') },
      { shape: 'ar-fixed', label: t('legFixed') },
      { shape: 'ar-kept', label: t('legKept') },
      { shape: 'ar-ale', label: t('legAle') },
      { shape: 'ar-exp', label: t('legExp') },
      { shape: 'ar-worst', label: t('legWorst') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
