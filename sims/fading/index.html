     strength and phase sliders drive the drawing live, and the D button lets the phase drift as the ionosphere
     moves; the model is in sim.js, the words in strings.js. The original's jQuery and Chart.js are gone: the plots
     are SVG. -->
<html lang="hr" data-sim="fading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feding · simdeck</title>
<meta name="description" content="Prizemni i prostorni val zbrajaju se u prijamniku; dok se ionosfera pomiče, mijenja se fazna razlika i jakost signala koleba.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "fading",
  "class": "explorer",
  "title": { "hr": "Feding (QSB)", "en": "Fading (QSB)" },
  "concept": { "hr": "Prizemni i prostorni val se zbrajaju; dok se faza mijenja, signal jača i slabi", "en": "Ground and sky wave add up; as their phase drifts, the signal swells and fades" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="fading"]; colours only from kit tokens. */
[data-sim="fading"] .fd { height: 100%; padding: 1cqh 1.6cqw; display: flex; flex-direction: column; gap: 0.4rem; }
[data-sim="fading"] .fd-plot { position: relative; flex: 1; min-height: 8rem; }
[data-sim="fading"] .fd-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="fading"] .fd-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="fading"] .fd-plot text.fd-title { fill: var(--ink); font-size: var(--fs-md); font-weight: 600; }
[data-sim="fading"] .fd-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="fading"] .fd-grid { stroke: var(--line); stroke-width: 1; opacity: 0.8; }
[data-sim="fading"] .fd-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="fading"] .fd-sky { fill: none; stroke: var(--c1); stroke-width: 4; stroke-linejoin: round; }
[data-sim="fading"] .fd-ground { fill: none; stroke: var(--c2); stroke-width: 4; stroke-dasharray: 12 8; stroke-linejoin: round; }
[data-sim="fading"] .fd-sum { fill: none; stroke: var(--c3); stroke-width: 5; stroke-linejoin: round; }
[data-sim="fading"] .fd-env { stroke: var(--c3); stroke-width: 2; stroke-dasharray: 4 6; }
[data-sim="fading"] .fd-strength { fill: none; stroke: var(--c4); stroke-width: 4; stroke-linejoin: round; }
[data-sim="fading"] .fd-area { fill: var(--c4); opacity: 0.15; stroke: none; }
[data-sim="fading"] .fd-range { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
[data-sim="fading"] .fd-now { fill: var(--c4); stroke: var(--bg); stroke-width: 2.5; }
[data-sim="fading"] .fd-plot text.fd-label { fill: var(--ink); font-size: var(--fs-md); font-weight: 600; }
[data-sim="fading"] .fd-plot text.fd-halo { stroke: var(--panel); stroke-width: 6; paint-order: stroke; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="fading"] .fd-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="fading"] .fd-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="fading"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="fading"] .fd { height: auto; padding: 0.6rem; }
  [data-sim="fading"] .fd-plot { flex: none; width: 100%; height: 13rem; }
  [data-sim="fading"] .fd-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="fading"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Feding (QSB)</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="fd-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma and a true minus sign.
  function num(x) {
    var s = String(x).replace('-', '−');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function pct(x) { return t('pct', { v: num(Math.round(x)) }); }
  function db(x) { return x === null ? t('db', { v: '∞' }) : t('db', { v: num(x.toFixed(1)) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }

  var labels = { original: 'presetOriginal', inPhase: 'presetInPhase', falling: 'presetFalling', dropout: 'presetDropout',
    weakGround: 'presetWeakGround', skyOnly: 'presetSkyOnly' };

  // ── the drift: the phase grows by L.DRIFT °/s while it runs. Page state, not model state: a link opens still. ──
  var drifting = false, acc = 0, lastT = 0;
  function every() { return Simdeck.reducedMotion() ? 1000 : 100; }   // ms between updates; in jumps under reduced motion
  function frame(now) {
    if (!drifting) return;
    if (now - lastT >= every()) {
      acc = L.drift(acc, (now - lastT) / 1000);
      lastT = now;
      var phase = Math.round(acc) % 360;
      if (phase !== sim.params.phase) { ownSet = true; sim.set({ phase: phase }); ownSet = false; }
    }
    requestAnimationFrame(frame);
  }
  function startDrift() {
    drifting = true; acc = sim.params.phase % 360; lastT = performance.now();
    driftLabel(); sim.render(); requestAnimationFrame(frame);
  }
  function stopDrift() { if (!drifting) return; drifting = false; driftLabel(); sim.render(); }
  function toggleDrift() { if (drifting) stopDrift(); else startDrift(); }
  var ownSet = false;
  function driftLabel() {
    var b = document.querySelector('[data-sd-controls] button[aria-keyshortcuts="d"] span');
    if (b) b.textContent = drifting ? t('driftStop') : t('drift');
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stopDrift(); });

  // One plot frame: x from x0 … x1, y from y0 … y1, ticks in %, a title row above.
  function plotFrame(box, x0, x1, y0, y1, ticks, title, axis) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return null;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 4.2 * rem, r: 1.0 * rem, t: 2.0 * rem, b: axis ? 1.5 * rem : 0.4 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var p = {
      rem: rem, pad: pad, cw: cw, ch: ch, H: H,
      X: function (x) { return pad.l + ((x - x0) / (x1 - x0)) * cw; },
      Y: function (y) { return pad.t + ch * (1 - (y - y0) / (y1 - y0)); },
      svg: s('svg', { width: W, height: H, 'aria-hidden': 'true' })
    };
    p.svg.append(s('rect', { class: 'fd-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    ticks.forEach(function (v) {
      p.svg.append(s('line', { class: v === 0 ? 'fd-zero' : 'fd-grid', x1: pad.l, x2: pad.l + cw, y1: p.Y(v), y2: p.Y(v) }));
      p.svg.append(s('text', { x: pad.l - 0.4 * rem, y: p.Y(v) + 0.3 * rem, 'text-anchor': 'end' }, pct(v * 100)));
    });
    p.svg.append(s('text', { class: 'fd-title', x: pad.l, y: pad.t - 0.5 * rem }, title));
    return p;
  }

  function line(p, pts, xk, yk, cls) {
    return s('polyline', { class: cls, points: pts.map(function (q) { return p.X(q[xk]).toFixed(1) + ',' + p.Y(q[yk]).toFixed(1); }).join(' ') });
  }
  function periodGrid(p) {
    for (var g = 0.5; g < L.PERIODS; g += 0.5) p.svg.append(s('line', { class: 'fd-grid', x1: p.X(g), x2: p.X(g), y1: p.pad.t, y2: p.pad.t + p.ch }));
  }

  // ── top: the sky wave (reference) and the ground wave, shifted by φ and a times as strong ──
  function drawWaves(box, st, pts) {
    var p = plotFrame(box, 0, L.PERIODS, -1.2, 1.2, [-1, 0, 1], t('plotWaves'), false);
    if (!p) return;
    periodGrid(p);
    p.svg.append(line(p, pts, 't', 'sky', 'fd-sky'));
    p.svg.append(line(p, pts, 't', 'ground', 'fd-ground'));
    box.replaceChildren(p.svg);
  }

  // ── middle: their sum, with its amplitude A marked by dashed lines ──
  function drawSum(box, st, pts) {
    var p = plotFrame(box, 0, L.PERIODS, -2.3, 2.3, [-2, -1, 0, 1, 2], t('plotSum'), false);
    if (!p) return;
    periodGrid(p);
    var rem = p.rem;
    if (st.A > 1e-9) {
      p.svg.append(s('line', { class: 'fd-env', x1: p.pad.l, x2: p.pad.l + p.cw, y1: p.Y(st.A), y2: p.Y(st.A) }));
      p.svg.append(s('line', { class: 'fd-env', x1: p.pad.l, x2: p.pad.l + p.cw, y1: p.Y(-st.A), y2: p.Y(-st.A) }));
    }
    p.svg.append(line(p, pts, 't', 's', 'fd-sum'));
    p.svg.append(s('text', { class: 'fd-label', x: p.pad.l + p.cw, y: p.pad.t - 0.5 * rem, 'text-anchor': 'end' }, t('sumLabel', { v: pct(st.A * 100) })));
    box.replaceChildren(p.svg);
  }

  // ── bottom: the sum's strength over the last minute, as φ drifted to its value now ──
  function drawStrength(box, st) {
    var title = t('plotStrength') + (drifting ? ' · ' + t('plotDrifting') : '');
    var p = plotFrame(box, -L.WINDOW, 0, 0, 2.2, [0, 1, 2], title, true);
    if (!p) return;
    var rem = p.rem, svg = p.svg, pts = L.history(st, 480), x0 = p.pad.l, x1 = p.pad.l + p.cw;
    for (var g = -50; g < 0; g += 10) svg.append(s('line', { class: 'fd-grid', x1: p.X(g), x2: p.X(g), y1: p.pad.t, y2: p.pad.t + p.ch }));
    [-60, -40, -20].forEach(function (v) {
      svg.append(s('text', { x: p.X(v), y: p.H - 0.2 * rem, 'text-anchor': v === -60 ? 'start' : 'middle' }, t('sec', { v: num(v) })));
    });
    svg.append(s('text', { x: x1, y: p.H - 0.2 * rem, 'text-anchor': 'end' }, t('now')));
    // the band the strength swings through, dashed; its edges are named in the title row (the caption names them on a phone)
    var wide = p.cw >= 36 * rem;
    if (st.a > 0) {
      svg.append(s('line', { class: 'fd-range', x1: x0, x2: x1, y1: p.Y(st.max), y2: p.Y(st.max) }));
      svg.append(s('line', { class: 'fd-range', x1: x0, x2: x1, y1: p.Y(st.min), y2: p.Y(st.min) }));
    }
    var area = pts.map(function (q) { return p.X(q.t).toFixed(1) + ',' + p.Y(q.A).toFixed(1); });
    area.push(x1.toFixed(1) + ',' + p.Y(0).toFixed(1), x0.toFixed(1) + ',' + p.Y(0).toFixed(1));
    svg.append(s('polygon', { class: 'fd-area', points: area.join(' ') }));
    svg.append(line(p, pts, 't', 'A', 'fd-strength'));
    svg.append(s('circle', { class: 'fd-now', cx: x1, cy: p.Y(st.A), r: 0.5 * rem }));
    if (st.a > 0 && wide) {
      svg.append(s('text', { class: 'fd-label', x: x1, y: p.pad.t - 0.5 * rem, 'text-anchor': 'end' },
        t('minLabel', { v: pct(st.min * 100) }) + ' · ' + t('maxLabel', { v: pct(st.max * 100) })));
    }
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'amp', type: 'range', label: t('amp'), hint: t('ampHint'), min: 0, max: 100, step: 1,
        format: function (v) { return pct(v); } },
      { key: 'phase', type: 'range', label: t('phase'), hint: t('phaseHint'), min: 0, max: 360, step: 1,
        format: function (v) { return t('deg', { v: v }); } },
      { key: 'drift', type: 'button', label: t('drift'), key: 'd', run: toggleDrift }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendSky') },
      { c: 2, shape: 'hollow', label: t('legendGround') },
      { c: 3, label: t('legendSum') },
      { c: 4, label: t('legendStrength') }
    ],

    render: function (c) {
      var a = h('div', { class: 'fd-plot' }), b = h('div', { class: 'fd-plot' }), d = h('div', { class: 'fd-plot' });
      c.stage.replaceChildren(h('div', { class: 'fd' }, a, b, d));
      var pts = L.curve(c.state, 400);
      drawWaves(a, c.state, pts);
      drawSum(b, c.state, pts);
      drawStrength(d, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var vars = {
        amp: b(pct(st.amp)), phi: b(t('deg', { v: st.phase })), sum: b(pct(st.A * 100)),
        trend: st.trend === 'steady' || st.trend === 'dropout' ? '' : t('trend_' + st.trend), min: b(pct(st.min * 100)), max: b(pct(st.max * 100)), depth: b(db(st.depth))
      };
      if (st.trend === 'steady') return t.parts('cap_steady', vars);
      if (st.trend === 'dropout') return t.parts('cap_dropout', vars);
      return t.parts(st.depth === null ? 'caption_inf' : 'caption', vars);
    }
  });

  // The button's title says what the drift does; a hand change of the phase while drifting carries on from there.
  (function () {
    var b = document.querySelector('[data-sd-controls] button[aria-keyshortcuts="d"]');
    if (b) b.title = t('driftHint') + ' (D)';
  })();
  sim.on(function () { if (drifting && !ownSet) acc = sim.params.phase % 360; });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
