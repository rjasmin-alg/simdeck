<style>
/* Page CSS: every selector starts with [data-sim="chirp-2"]; colours only from kit tokens. */
[data-sim="chirp-2"] .ch { height: 100%; padding: 0.6rem 0.8rem; box-sizing: border-box; display: flex; flex-direction: column; gap: 0.5rem; }
[data-sim="chirp-2"] .ch-text { display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 0.8rem; row-gap: 0.2rem; margin: 0; }
[data-sim="chirp-2"] .ch-label { color: var(--muted); font-size: var(--fs-md); display: flex; align-items: center; gap: 0.4rem; }
[data-sim="chirp-2"] .ch-mark { display: inline-block; width: 0.8rem; height: 0.8rem; }
[data-sim="chirp-2"] .ch-mark.a { background: var(--c1); border-radius: 50%; }
[data-sim="chirp-2"] .ch-mark.b { background: var(--c4); }
[data-sim="chirp-2"] .ch-msg { font-family: var(--mono, ui-monospace, monospace); font-size: var(--fs-xl); font-weight: 700; color: var(--ink); letter-spacing: 0.08em; min-height: 1.3em; overflow-wrap: anywhere; }
[data-sim="chirp-2"] .ch-msg.now { text-decoration: underline; text-decoration-color: var(--c3); text-decoration-thickness: 3px; text-underline-offset: 0.25em; }
[data-sim="chirp-2"] .ch-figs { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 3fr 2fr; gap: 1.2rem; }
[data-sim="chirp-2"] .ch-fig { min-height: 0; display: flex; flex-direction: column; }
[data-sim="chirp-2"] .ch-fig h2 { margin: 0 0 0.2rem; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
[data-sim="chirp-2"] .ch-plot { position: relative; flex: 1 1 auto; min-height: 0; }
[data-sim="chirp-2"] .ch-strip { position: relative; flex: none; height: 3.2rem; cursor: pointer; }
[data-sim="chirp-2"] .ch-plot svg, [data-sim="chirp-2"] .ch-strip svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="chirp-2"] svg text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="chirp-2"] svg text.ch-halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }

[data-sim="chirp-2"] .ch-axis { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="chirp-2"] .ch-grid { stroke: var(--line); stroke-width: 1; }
[data-sim="chirp-2"] .ch-tick { stroke: var(--muted); stroke-width: 1.5; }

[data-sim="chirp-2"] .ch-pitch { fill: none; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }

[data-sim="chirp-2"] .ch-page { fill: none; stroke: var(--ink); stroke-width: 2.5; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */

/* Phone and portrait: the stage grows with its content; the plots stack and get a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="chirp-2"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="chirp-2"] .ch { height: auto; padding: 0.4rem 0.3rem 0.6rem; }
  [data-sim="chirp-2"] .ch-msg { font-size: var(--fs-lg); }
  [data-sim="chirp-2"] .ch-figs { grid-template-columns: 1fr; }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Chirp u QSO-u</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="ch-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="recording.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var REC = window.Chirp2Recording;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var PASS = ['a', 'b'];
  var sim = null;

  function dec(str) { return String(str).replace('.', t('dec')); }
  function secs(v) { return t('s', { v: dec(v.toFixed(1)) }); }
  function hzSigned(v) { return (v > 0 ? '+' : v < 0 ? '−' : '') + t('hz', { v: String(Math.abs(v)) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function text(svg, x, y, str, cls, attrs) {
    svg.append(s('text', Object.assign({ class: 'ch-halo' + (cls ? ' ' + cls : ''), x: x, y: y, translate: 'no' }, attrs || {}), str));
  }
  // a pass's marker: a round dot for the first, a square for the second (colour is not the only carrier)
  function marker(svg, pass, x, y, r) {
    if (pass === 0) svg.append(s('circle', { class: 'ch-dot a', cx: x, cy: y, r: r }));
    else svg.append(s('rect', { class: 'ch-dot b', x: x - r, y: y - r, width: 2 * r, height: 2 * r }));
  }

  // ── playback: the recording through an <audio>. Not part of the state. ──
  var playing = false, head = null, audio = null, playT = null;
  function every() { return Simdeck.reducedMotion() ? 500 : 100; }   // ms between cursor redraws

  function stop(keepT) {
    if (!playing) return;
    playing = false; head = null;
    audio.pause();
    if (keepT !== false) sim.set({ t: L.snapT(audio.currentTime) });
    sim.render();
  }

  function play() {
    if (!audio) {
      audio = new Audio(REC.audio);
      audio.preload = 'auto';
      audio.addEventListener('ended', function () { if (playing) { stop(false); sim.set({ t: L.REC_MAX }); } });
    }
    var p = sim.params, from = p.t >= L.REC_MAX ? 0 : p.t;
    audio.currentTime = from;
    playing = true; head = from; playT = from;
    if (from !== p.t) sim.set({ t: from });
    var started = audio.play();
    if (started && started.catch) started.catch(function () { stop(); });
    var last = 0;
    (function frame(now) {
      if (!playing) return;
      if (now - last >= every()) { last = now; head = audio.currentTime; sim.render(); }
      requestAnimationFrame(frame);
    })(0);
  }

  function toggle() { if (playing) stop(); else play(); }

  // the recording's elements: [station, on, off, first sample, [f every 10 ms]] → { pass, on, off, t0, f, dt }
  var els = REC.track.map(function (e) { return { pass: e[0], on: e[1], off: e[2], t0: e[3], f: e[4], dt: 0.01 }; });

  // ── drawing: pitch over time with key-down bars and the cursor ──
  function pitchPlot(box, o) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 3.6 * rem, right = 3.6 * rem, top = 2.2 * rem, bottom = 3.4 * rem;
    var fLo = 240, fHi = 440, fStep = 50;
    var X = function (sec) { return left + (sec - o.from) / (o.to - o.from) * (W - left - right); };
    var Y = function (f) { return top + (fHi - f) / (fHi - fLo) * (H - top - bottom); };
    var yBase = H - bottom, keyY = yBase + 0.5 * rem, keyH = 0.7 * rem;
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    for (var f = fLo; f <= fHi + 1e-9; f += fStep) {
      svg.append(s('line', { class: 'ch-grid', x1: left, x2: W - right, y1: Y(f), y2: Y(f) }));
      text(svg, left - 0.4 * rem, Y(f) + 0.35 * rem, String(f), null, { 'text-anchor': 'end' });
    }
    text(svg, left - 0.4 * rem, top - 1.1 * rem, t('axisF'), null, { 'text-anchor': 'end' });
    svg.append(s('line', { class: 'ch-axis', x1: left, x2: W - right, y1: yBase, y2: yBase }));
    var halfRoom = X(o.from + 0.5) - X(o.from) >= 3 * rem;
    for (var k = Math.ceil(o.from * 2 - 1e-9); k / 2 <= o.to + 1e-9; k++) {
      var x = X(k / 2);
      svg.append(s('line', { class: 'ch-tick', x1: x, x2: x, y1: yBase, y2: yBase + 0.3 * rem }));
      if (k % 2 === 0 || halfRoom) text(svg, x, yBase + 2.5 * rem, dec(String(k / 2)), null, { 'text-anchor': 'middle' });
    }
    var labelled = [false, false];
    els.forEach(function (e) {
      if (e.off < o.from || e.on > o.to) return;
      var a = Math.max(e.on, o.from), b = Math.min(e.off, o.to);
      svg.append(s('rect', { class: 'ch-key', x: X(a), y: keyY, width: Math.max(1, X(b) - X(a)), height: keyH }));
      var pts = [];
      e.f.forEach(function (fv, i) {
        var ts = e.t0 + i * e.dt;
        if (ts < o.from || ts > o.to) return;
        pts.push([X(ts), Y(Math.max(fLo, Math.min(fHi, fv)))]);
      });
      if (pts.length > 1) svg.append(s('polyline', { class: 'ch-pitch ' + PASS[e.pass], points: pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') }));
      if (pts.length && e.t0 >= o.from) marker(svg, e.pass, pts[0][0], pts[0][1], 0.3 * rem);
      if (pts.length && !labelled[e.pass]) {
        labelled[e.pass] = true;
        text(svg, pts[0][0], pts[0][1] - 1.1 * rem, t(e.pass ? 'passB' : 'passA'), 'ch-ink');
      }
    });
    if (o.head != null && o.head >= o.from && o.head <= o.to) {
      var xh = X(o.head);
      svg.append(s('line', { class: 'ch-head', x1: xh, x2: xh, y1: top, y2: keyY + keyH }));
      svg.append(s('path', { class: 'ch-headtip', d: 'M' + (xh - 0.45 * rem) + ',' + (top - 0.6 * rem) + 'L' + (xh + 0.45 * rem) + ',' + (top - 0.6 * rem) + 'L' + xh + ',' + (top + 0.2 * rem) + 'Z' }));
    }
    text(svg, W - 0.2 * rem, yBase + 2.5 * rem, t('axisT'), null, { 'text-anchor': 'end' });
    box.replaceChildren(svg);
  }

  // every dah heard by pos, from its key-down, as the change of pitch since it began; the latest one drawn bold
  function risePlot(box, pos) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 3.6 * rem, right = 1.2 * rem, top = 2.2 * rem, bottom = 3.4 * rem;
    var msHi = 400, dLo = -20, dHi = 60;
    var X = function (ms) { return left + ms / msHi * (W - left - right); };
    var Y = function (d) { return top + (dHi - d) / (dHi - dLo) * (H - top - bottom); };
    var yBase = H - bottom;
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    for (var d = dLo; d <= dHi; d += 20) {
      svg.append(s('line', { class: d === 0 ? 'ch-zero' : 'ch-grid', x1: left, x2: W - right, y1: Y(d), y2: Y(d) }));
      text(svg, left - 0.4 * rem, Y(d) + 0.35 * rem, d > 0 ? '+' + d : d < 0 ? '−' + (-d) : '0', null, { 'text-anchor': 'end' });
    }
    text(svg, left - 0.4 * rem, top - 1.1 * rem, t('axisDf'), null, { 'text-anchor': 'end' });
    svg.append(s('line', { class: 'ch-axis', x1: left, x2: W - right, y1: yBase, y2: yBase }));
    for (var ms = 0; ms <= msHi; ms += 100) {
      svg.append(s('line', { class: 'ch-tick', x1: X(ms), x2: X(ms), y1: yBase, y2: yBase + 0.3 * rem }));
      text(svg, X(ms), yBase + 1.5 * rem, String(ms), null, { 'text-anchor': ms === 0 ? 'start' : 'middle' });
    }
    text(svg, W - right, yBase + 2.9 * rem, t('axisMs'), null, { 'text-anchor': 'end' });
    var heard = els.filter(function (e) { return e.f.length >= L.DAH_SAMPLES && e.t0 <= pos + 1e-9; });
    if (!heard.length) text(svg, (left + W - right) / 2, Y(30), t('riseEmpty'), 'ch-ink', { 'text-anchor': 'middle' });
    heard.forEach(function (e, n) {
      var last = n === heard.length - 1;
      var f0 = L.median(e.f.slice(0, L.EDGE)), pts = [];
      e.f.forEach(function (fv, i) {
        var ts = e.t0 + i * e.dt, msi = (ts - e.on) * 1000;
        if (ts > pos + 1e-9 || msi > msHi) return;
        pts.push([X(msi), Y(Math.max(dLo, Math.min(dHi, fv - f0)))]);
      });
      if (pts.length > 1) svg.append(s('polyline', { class: 'ch-pitch ' + PASS[e.pass] + (last ? '' : ' thin'), points: pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') }));
      var p1 = pts[pts.length - 1];
      if (p1 && (last || e.t0 + (e.f.length - 1) * e.dt <= pos)) marker(svg, e.pass, p1[0], p1[1], (last ? 0.32 : 0.22) * rem);
    });
    box.replaceChildren(svg);
  }
  // the whole recording: key-down bars, the page on show, the cursor. Clicking jumps.
  function overview(box, pos, page) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 3.6 * rem, right = 3.6 * rem;
    var X = function (sec) { return left + sec / REC.duration * (W - left - right); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    els.forEach(function (e) {
      svg.append(s('rect', { class: 'ch-key', x: X(e.on), y: 0.9 * rem, width: Math.max(1, X(e.off) - X(e.on)), height: 0.9 * rem }));
    });
    svg.append(s('rect', { class: 'ch-page', x: X(page.from), y: 0.5 * rem, width: X(page.to) - X(page.from), height: 1.7 * rem, rx: 4 }));
    var xh = X(pos);
    svg.append(s('line', { class: 'ch-head', x1: xh, x2: xh, y1: 0.3 * rem, y2: 2.4 * rem }));
    text(svg, left, 3.1 * rem, t('whole'), null);
    text(svg, W - right, 3.1 * rem, secs(REC.duration), null, { 'text-anchor': 'end' });
    box.replaceChildren(svg);
    box.onclick = function (ev) {
      var r = box.getBoundingClientRect(), sec = (ev.clientX - r.left - left) / (W - left - right) * REC.duration;
      sim.set({ t: L.snapT(sec) });
    };
  }

  var presetKeys = { first: 'presetFirst', second: 'presetSecond', whole: 'presetWhole' };
  var stats = [L.passRise(REC.track, 0), L.passRise(REC.track, 1)];

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { type: 'button', label: t('play'), key: 'p', run: function () { toggle(); } },
      { key: 't', type: 'range', label: t('t'), hint: t('tHint'), min: 0, max: L.REC_MAX, step: 0.1, format: function (v) { return secs(L.snapT(v)); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: 0 }; }),
    legend: [
      { c: 1, shape: 'round', label: t('legendA') },
      { c: 4, label: t('legendB') },
      { c: 2, label: t('legendKey') },
      { c: 3, label: t('legendHead') }
    ],

    render: function (c) {
      var st = c.state;
      var pos = head != null ? head : st.t, page = L.recPage(pos), now = L.sender(REC.events, pos);
      var lines = [0, 1].map(function (b) {
        return [
          h('span', { class: 'ch-label' }, h('span', { class: 'ch-mark ' + PASS[b] }), t(b ? 'passB' : 'passA')),
          h('span', { class: 'ch-msg' + (now === b ? ' now' : ''), translate: 'no' }, L.transcript(REC.events, pos, b))
        ];
      });
      var plot = h('div', { class: 'ch-plot' }), strip = h('div', { class: 'ch-strip' }), rplot = h('div', { class: 'ch-plot' });
      c.stage.replaceChildren(h('div', { class: 'ch' },
        h('p', { class: 'ch-text' }, lines),
        h('div', { class: 'ch-figs' },
          h('div', { class: 'ch-fig' }, h('h2', null, t('plotTime')), plot, strip),
          h('div', { class: 'ch-fig' }, h('h2', null, t('plotRise')), rplot))));
      pitchPlot(plot, { from: page.from, to: page.to, head: pos > 0 || playing ? pos : null });
      overview(strip, pos, page);
      risePlot(rplot, pos);
    },

    caption: function (c) {
      var st = c.state, now = L.sender(REC.events, st.t);
      var b = function (x) { return h('b', { translate: 'no' }, x); };
      return [
        t.parts('captionPos', { t: b(secs(st.t)), d: b(secs(L.REC_DURATION)) }),
        t(now === 0 ? 'nowA' : now === 1 ? 'nowB' : 'nowNone'),
        t.parts('captionRise', { r0: b(hzSigned(stats[0].mean)), r1: b(hzSigned(stats[1].mean)) }),
        t('captionNote')
      ];
    }
  });

  // After each render: moving the position while the recording plays seeks.
  sim.on(function (c) {
    if (playing && c.state.t !== playT) { playT = c.state.t; audio.currentTime = c.state.t; head = c.state.t; }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
