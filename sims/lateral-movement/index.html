     Drawn with kit view K2 (topology, kit/topology.js) over three tier bands of the page's own.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

}

[data-sim="lateral-movement"] .lm-held .lm-head { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }

[data-sim="lateral-movement"] .sd-swatch[data-shape="lm-t2"]::after { content: '●'; }

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var TIER_C = { 0: 5, 1: 2, 2: 1, 3: 8 };
  var POS = { DC1: [3, 0], FS1: [0, 1], APP1: [6, 1], WS1: [3, 2], WS2: [6, 2] };
  var ROLE = { dc: 'roleDc', app: 'roleApp', fs: 'roleFs', ws: 'roleWs' };
  var KIND = { dc: 'server', app: 'server', fs: 'server', ws: 'host' };
  var ORDER = L.NODES.map(function (n) { return n.id; });   // DC1, APP1, FS1, WS1, WS2: by tier, then id

  /** Data (machine and account names, hashes) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function q(text) { return h('b', { translate: 'no' }, String(text)); }
  /** t.parts, with a node that fills two placeholders cloned (a DOM node can stand in one place only). */
  function P(key, vars, n) {
    var seen = [];
    var parts = n == null ? t.parts(key, vars) : t.parts(key, Object.assign({ n: n }, vars), n);
    return parts.map(function (p) {
      if (typeof p === 'string' || p.nodeType === 3) return p;
      var dup = seen.indexOf(p) >= 0;
      seen.push(p);
      return dup ? p.cloneNode(true) : p;
    });
  }
  /** Parts with *term* turned into <em lang="en">. */
  function rich(key, vars) {
    var out = [];
    P(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function label(c) { return c.local ? 'Administrator #' + c.hash : c.who; }
  /** A credential's name in a caption: the account, or "local Administrator (WS1)" in words. */
  function nameOf(c) { return c.local ? h('b', null, P('localAdminName', { node: data(c.local) })) : q(c.who); }
  function heldOf(s, key) { return s.attacker.held.filter(function (c) { return L.keyOf(c) === key; })[0]; }

  /** A credential chip: shape and colour by tier; hatched when the attacker holds it. */
  function chip(c, o) {
    o = o || {};
    var cls = 'lm-cred' + (o.stolen ? ' lm-stolen' : '') + (o.refused ? ' lm-refused' : '') + (o.changed ? ' sd-changed' : '');
    var kids = [h('b', { translate: 'no' }, label(c))];
    if (c.leaver) kids.push(h('span', { class: 'lm-small' }, '(' + t('leaverTag') + ')'));
    return h('span', { class: cls, dataset: { tier: String(c.tier) }, 'aria-label': o.refused ? t('refusedLabel', { who: c.who }) : null }, kids);
  }

  // ── the machines ──
  function cardOf(c, n) {
    var s = c.state, a = s.attacker, e = c.n > 0 ? s.last : null;
    var dumpedNow = e && (e.kind === 'dump' || e.kind === 'compromised') && e.node === n.id;
    var line;
    if (n.localAdminHash === null) line = { text: t('dcLine'), kind: 'role' };
    else line = { text: h('span', { class: 'lm-la' }, t('laLabel'), ' ', data('#' + n.localAdminHash, 'lm-mono'),
      n.role === 'ws' && s.lapsOnWorkstations ? h('span', { class: 'lm-tag' }, t('lapsTag')) : null), kind: 'role' };
    var mem = n.cachedCreds.map(function (cr) {
      var k = L.keyOf(cr);
      return chip(cr, { changed: dumpedNow && e.gained && e.gained.indexOf(k) >= 0 });
    }).concat(n.refused.map(function (cr) { return chip(cr, { refused: true }); }));
    var badges = [];
    if (a.at === n.id) badges.push({ text: P('badgeAttacker', { priv: a.priv === 'system' ? data('SYSTEM') : t('privUser') }), k: 'fill' });
    else if (a.visited.indexOf(n.id) >= 0) badges.push({ text: t('badgeOwned'), k: 'solid' });
    return {
      id: n.id, kind: KIND[n.role], col: POS[n.id][0], span: 2, row: POS[n.id][1], c: TIER_C[n.tier],
      name: t(ROLE[n.role]), lines: [line], badges: badges,
      extra: h('div', { class: 'lm-mem' }, h('span', { class: 'lm-mem-label' }, t('memory')), mem.length ? mem : h('span', { class: 'lm-mem-label' }, t('memoryEmpty'))),
      state: a.at === n.id ? 'active' : null,
      changed: !!e && e.kind === 'move' && e.to === n.id
    };
  }

  function linksOf(s) {
    var a = s.attacker, out = [], seen = {};
    function add(l) {
      var k = [l.a, l.b].sort().join('|');
      if (seen[k]) return;
      seen[k] = true;
      l.id = 'l-' + k;
      out.push(l);
    }
    for (var i = 1; i < a.path.length; i++) add({ a: a.path[i - 1], b: a.path[i], active: true });
    a.tried.forEach(function (x) { add({ a: x.from, b: x.to, state: 'down' }); });
    if (a.priv === 'system' && !s.done) L.edges(s).forEach(function (x) { add({ a: a.at, b: x.to, state: x.ok ? 'up' : 'down' }); });
    return out;
  }

  function packetsOf(s, e) {
    if (!e || (e.kind !== 'move' && e.kind !== 'refused')) return [];
    var c = heldOf(s, e.via);
    return [{ from: e.from, to: e.to, label: c.local ? '#' + c.hash : c.who, c: TIER_C[c.tier], drop: e.kind === 'refused', at: 0.5 }];
  }

  function renderGraph(c) {
    var s = c.state;
    var bands = h('div', { class: 'lm-bands', 'aria-hidden': 'true' }, [0, 1, 2].map(function (k) {
      return h('div', { class: 'lm-band', dataset: { tier: String(k), c: String(TIER_C[k]) } }, h('b', null, t('tier' + k)));
    }));
    var topo = Simdeck.topology({
      className: 'lm-topo', cols: 8, gap: '0.9rem', rows: ['1fr', '1fr', '1fr'], dir: c.dir,
      nodes: ORDER.map(function (id) { return cardOf(c, L.nodeOf(s, id)); }),
      links: linksOf(s),
      packets: packetsOf(s, c.n > 0 ? s.last : null)
    });
    return h('div', { class: 'lm-graph' }, bands, topo);
  }

  // ── the attacker panel ──
  function opensOf(s, cr) {
    if (cr.all) return h('span', { class: 'lm-none' }, t('everyAccount'));
    var doors = s.nodes.filter(function (n) { return L.works(cr, n) || L.expects(cr, n); });
    if (!doors.length) return h('span', { class: 'lm-none' }, t('opensNothing'));
    return [h('span', { class: 'lm-none' }, t('opens'))].concat(doors.map(function (n) {
      var ok = L.works(cr, n);
      return h('span', { class: 'lm-door', translate: 'no', dataset: { ok: String(ok) } }, n.id);
    }));
  }
  function renderSide(c) {
    var s = c.state, a = s.attacker, e = c.n > 0 ? s.last : null;
    var gained = e && e.gained ? e.gained : [];
    var where = a.at === null ? t('notIn')
      : P('atLine', { node: q(a.at), priv: a.priv === 'system' ? q('SYSTEM') : h('b', null, t('privUser')) });
    var held = a.held.slice().sort(function (x, y) { return x.tier - y.tier || (x.local ? 1 : 0) - (y.local ? 1 : 0) || (L.keyOf(x) < L.keyOf(y) ? -1 : 1); });
    var list = held.length ? h('ul', { class: 'lm-held' }, held.map(function (cr) {
      return h('li', null,
        h('div', { class: 'lm-head' }, chip(cr, { stolen: true, changed: gained.indexOf(L.keyOf(cr)) >= 0 }),
          h('span', { class: 'lm-kind' }, t(cr.kind === 'password' ? 'kindPassword' : 'kindHash'))),
        h('div', { class: 'lm-opens' }, opensOf(s, cr)));
    })) : h('p', { class: 'lm-none' }, t('heldNone'));
    var kids = [h('h2', null, t('sideTitle')), h('div', { class: 'lm-where' }, where)];
    if (a.path.length > 1) kids.push(h('div', { class: 'lm-path' }, t('pathLabel'), ' ', h('span', { translate: 'no' }, a.path.join(' → '))));
    kids.push(h('h3', null, t('heldTitle')), list);
    if (s.done) {
      var worst = e && e.kind === 'stalled' ? e.tier : 0;
      kids.push(h('div', { class: 'lm-outcome', dataset: { outcome: s.outcome } },
        s.outcome === 'compromised' ? t('outcomeCompromised') : t('outcomeContained', { tier: worst })));
    }
    return h('section', { class: 'lm-side' }, kids);
  }

  // ── captions ──
  function listOf(s, keys) {
    var out = [];
    keys.forEach(function (k, i) {
      if (i) out.push(', ');
      var cr = heldOf(s, k);
      out.push(nameOf(cr));
    });
    return out;
  }
  function eventCaption(c) {
    var s = c.state, e = s.last, p = c.params;
    switch (e.kind) {
      case 'foothold': return P('capFoothold', { who: q(e.who), node: q(e.node) });
      case 'escalate': return rich('capEscalate', { node: q(e.node) });
      case 'dump': {
        var out = e.gained.length ? P('capDump', { node: q(e.node), list: h('span', null, listOf(s, e.gained)) }, e.gained.length)
          : P('capDumpNone', { node: q(e.node) });
        var got = e.gained.map(function (k) { return heldOf(s, k); });
        var node = L.nodeOf(s, e.node);
        got.forEach(function (cr) {
          if (cr.tier === 0 && cr.leaver) out = out.concat([' '], P('noteLeaver', { who: q(cr.who), node: q(e.node) }));
          else if (cr.tier === 0) out = out.concat([' '], P('noteDaOnWs', { node: q(e.node) }));
          else if (cr.tier === 1 && !cr.local && node.tier === 2) out = out.concat([' '], P('noteServerAdmin', {}));
        });
        var la = got.filter(function (cr) { return cr.local && cr.tier === 2; })[0];
        if (la && !got.some(function (cr) { return cr.tier < 2; })) {
          var shared = s.nodes.some(function (n) { return n.id !== e.node && n.localAdminHash === la.hash; });
          out = out.concat([' '], shared ? P('noteImage', {}) : P(s.lapsOnWorkstations ? 'noteLaps' : 'noteUnique', { node: q(e.node) }));
        }
        return out;
      }
      case 'move': {
        var cr = heldOf(s, e.via);
        return cr.kind === 'password' ? P('capMovePassword', { to: q(e.to), who: nameOf(cr) })
          : rich('capMoveHash', { to: q(e.to), who: nameOf(cr) });
      }
      case 'refused':
        return P(s.lapsOnWorkstations ? 'capRefusedLaps' : 'capRefusedUnique', { from: q(e.from), to: q(e.to) });
      case 'compromised': return P('capCompromised', {});
      case 'stalled': {
        var st = P('capStalled', { tier: e.tier });
        // credit tiering only where it kept a Tier 0 credential off a workstation
        var kept = s.nodes.some(function (n) { return n.tier === 2 && n.refused.some(function (cr) { return cr.tier === 0; }); });
        if (kept) st = st.concat([' '], P('noteTiering', {}));
        return st;
      }
    }
    return [];
  }
  function caption(c) {
    if (c.first) return P('capStart', {});
    return P('capStep', { n: c.n }).concat([' '], eventCaption(c));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'tiering', type: 'toggle', label: t('tiering'), hint: t('tieringHint') },
      { key: 'lapsOnWorkstations', type: 'toggle', label: t('laps'), hint: t('lapsHint') },
      { key: 'daLogsOnWS', type: 'toggle', label: t('daLogsOnWS'), hint: t('daLogsOnWSHint'),
        disabled: function (p) { return p.tiering ? t('daRefused') : false; } },
      { key: 'sharedLocalAdmin', type: 'toggle', label: t('sharedLocalAdmin'), hint: t('sharedHint'),
        disabled: function (p) { return p.lapsOnWorkstations ? t('sharedLaps') : false; } },
      { key: 'leaverAdmin', type: 'toggle', label: t('leaverAdmin'), hint: t('leaverHint') }
    ],

    presets: [
      { id: 'flat', label: t('presetFlat'), hint: t('presetFlatHint'), params: {} },
      { id: 'laps', label: t('presetLaps'), hint: t('presetLapsHint'), params: { lapsOnWorkstations: true } },
      { id: 'tiered', label: t('presetTiered'), hint: t('presetTieredHint'), params: { tiering: true } },
      { id: 'both', label: t('presetBoth'), hint: t('presetBothHint'), params: { tiering: true, lapsOnWorkstations: true } },
      { id: 'chain', label: t('presetChain'), hint: t('presetChainHint'), params: { daLogsOnWS: false } }
    ],

    legend: [
      { c: 5, shape: 'lm-t0', label: t('legendT0') },
      { c: 2, shape: 'lm-t1', label: t('legendT1') },
      { c: 1, shape: 'lm-t2', label: t('legendT2') },
      { c: 8, shape: 'lm-user', label: t('legendUser') },
      { shape: 'lm-stolen', label: t('legendStolen') },
      { shape: 'line', label: t('legendUsable') },
      { shape: 'lm-cut', label: t('legendCut') },
      { shape: 'lm-refused', label: t('legendRefused') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'lm' }, renderGraph(c), renderSide(c)));
    },

    caption: caption
  });
})();
</script>
</body>
