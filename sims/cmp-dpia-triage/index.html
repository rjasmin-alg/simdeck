<!-- cmp-dpia-triage: processing likely to result in a high risk to people needs a data protection impact assessment
     before it starts; screening criteria add up, and two usually mean an assessment; measures lower the risk that
     remains, and if it stays high the supervisory authority is consulted first.
     The stage: the plan (six activities and a group-wide roll-out, as buttons); the screening (six criteria as lamps,
     the count against the mark at two, the recommendation); the risk to people on the 5 × 5 likelihood × severity
     matrix, each activity before (ring) and after (disc) the measures, with the four measures as buttons under it.
     Model: sim.js (+ scoring.js, copied from cmp-risk-register); rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;
  var last = null;                                    // the state drawn last, for the changed marks (SPEC rule 11)
  var P = {};                                         // the params of the state being drawn

  function int(x) { return new Intl.NumberFormat(LOCALE).format(x); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function actName(id) { return t('as_' + id); }
  function nBadge(n, extra) { return h('span', Object.assign({ class: 'dp-n', dataset: { c: String(n) }, translate: 'no' }, extra || {}), String(n)); }
  /** "A, b and c": the first keeps its capital, the rest in lower case. */
  function list(names) {
    var xs = names.map(function (x, k) { return k ? x.charAt(0).toLowerCase() + x.slice(1) : x; });
    return xs.length < 2 ? xs.join('') : xs.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + xs[xs.length - 1];
  }

  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to the same button
  function toggle(key, cls, label, kids) {
    var on = P[key] === true;
    return h('button', {
      type: 'button', class: 'dp-b' + (cls ? ' ' + cls : ''), onmousedown: noFocus, 'aria-pressed': String(on), 'aria-label': label,
      dataset: { sel: key },
      onclick: function (e) { refocus = e.detail === 0 ? key : null; var o = {}; o[key] = !on; sim.set(o); }
    }, kids);
  }

  // ── the plan ──

  function plan(s) {
    var acts = s.acts.map(function (x) {
      var chips = x.on && !x.active
        ? [h('span', { class: 'dp-chip', dataset: { warn: 'true' } }, t('noSourceTag'))]
        : x.crit.map(function (c) { return h('span', { class: 'dp-chip' }, t('cs_' + c)); });
      return toggle(x.id, null, t('a_' + x.id), [
        h('span', { class: 'dp-box', 'aria-hidden': 'true' }),
        nBadge(x.n),
        h('span', { class: 'dp-btext' }, h('span', { class: 'dp-bname' }, t('a_' + x.id)), h('span', { class: 'dp-chips' }, chips))
      ]);
    });
    var grp = toggle('group', 'dp-group', t('groupBtn'), [
      h('span', { class: 'dp-box', 'aria-hidden': 'true' }),
      h('span', { class: 'dp-btext' },
        h('span', { class: 'dp-bname' }, t('groupBtn')),
        h('span', { class: 'dp-chips' },
          h('span', { class: 'dp-bsub' }, t('groupSub', { g: int(L.PEOPLE.group), f: int(L.PEOPLE.firm) })),
          h('span', { class: 'dp-chip' }, t('cs_large'))))
    ]);
    return h('div', { class: 'dp-col' }, h('p', { class: 'dp-head' }, t('headPlan')), h('div', { class: 'dp-acts' }, acts), grp);
  }

  // ── the screening ──

  function screening(s, ch) {
    var rows = s.crit.map(function (c) {
      var byNodes = c.by.map(function (id) {
        if (id === 'group') return h('span', { class: 'dp-chip' }, t('byGroup'));
        var x = s.acts.find(function (a) { return a.id === id; });
        return nBadge(x.n, { title: actName(id) });
      });
      var byText = c.by.map(function (id) { return id === 'group' ? t('byGroup') : actName(id); }).join(', ');
      return h('div', {
        class: 'dp-c' + (ch.crit.indexOf(c.id) >= 0 ? ' sd-changed' : ''), dataset: { lit: String(c.lit) }, role: 'group',
        'aria-label': c.lit ? t('litLabel', { crit: t('c_' + c.id), by: byText }) : t('unlitLabel', { crit: t('c_' + c.id) })
      },
        h('span', { class: 'dp-lamp', 'aria-hidden': 'true' }),
        h('span', { class: 'dp-ctext' }, h('span', { class: 'dp-cname' }, t('c_' + c.id)), c.lit ? h('span', { class: 'dp-by' }, byNodes) : null));
    });
    var pips = L.CRITERIA.map(function (c, k) { return h('span', { class: 'dp-pip', dataset: { on: String(k < s.count) } }); });
    var icon = { empty: '·', record: '○', consult: '!', proceed: '✓' }[s.verdict];
    return h('div', { class: 'dp-col' },
      h('p', { class: 'dp-head' }, t('headScreen')),
      h('div', { class: 'dp-crit' }, rows),
      h('p', { class: 'dp-head' }, t('countHead')),
      h('div', { class: 'dp-count' },
        h('span', { class: 'dp-cbig dp-num', translate: 'no' }, s.count + ' / ' + L.CRITERIA.length),
        h('div', { class: 'dp-track', 'aria-hidden': 'true' }, pips, h('span', { class: 'dp-mark' }, t('countMark')))),
      h('p', { class: 'dp-head' }, t('headVerdict')),
      h('div', { class: 'dp-v' + (ch.verdict ? ' sd-changed' : ''), dataset: { v: s.verdict } },
        h('span', { class: 'dp-vicon', 'aria-hidden': 'true' }, icon),
        h('span', null, h('span', { class: 'dp-vword' }, t('v_' + s.verdict)), h('span', { class: 'dp-vdo' }, t('vd_' + s.verdict)))));
  }

  // ── the matrix ──

  /** Markers per cell: a hollow ring before measures and a filled disc after them, one disc when they coincide;
      activity order. Returns [{ id, n, k: 'in' | 'res' | 'same', l, s, slot, cols }]. */
  function markers(s) {
    var byCell = {}, out = [];
    function add(m) { var key = m.l + ':' + m.s; (byCell[key] = byCell[key] || []).push(m); out.push(m); }
    s.acts.forEach(function (x) {
      if (!x.active) return;
      if (!x.moved) add({ id: x.id, n: x.n, k: 'same', l: x.l0, s: x.s0, v: x.score0 });
      else {
        add({ id: x.id, n: x.n, k: 'in', l: x.l0, s: x.s0, v: x.score0 });
        add({ id: x.id, n: x.n, k: 'res', l: x.l1, s: x.s1, v: x.score1 });
      }
    });
    Object.keys(byCell).forEach(function (key) {
      var ms = byCell[key], cols = ms.length > 4 ? 3 : 2;
      ms.forEach(function (m, k) { m.slot = k; m.cols = cols; });
    });
    return out;
  }
  /** A marker's centre in % of the matrix (severity to the right, likelihood upwards). */
  function centre(m) {
    var row = Math.floor(m.slot / m.cols), col = m.slot % m.cols;
    return { x: 20 * (m.s - 1 + (col + 0.5) / m.cols), y: 20 * (5 - m.l + (row + 0.5) / m.cols), r: Math.min(0.36 * 20 / m.cols, 4.2) };
  }

  function arrows(s, pos) {
    var svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('class', 'dp-arrows');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('aria-hidden', 'true');
    var defs = document.createElementNS(SVG, 'defs');
    var mk = document.createElementNS(SVG, 'marker');
    mk.setAttribute('id', 'dp-head');
    mk.setAttribute('viewBox', '0 0 10 10');
    mk.setAttribute('refX', '9');
    mk.setAttribute('refY', '5');
    mk.setAttribute('markerWidth', '4');
    mk.setAttribute('markerHeight', '4');
    mk.setAttribute('orient', 'auto');
    var p = document.createElementNS(SVG, 'path');
    p.setAttribute('d', 'M0,0 L10,5 L0,10 z');
    mk.appendChild(p);
    defs.appendChild(mk);
    svg.appendChild(defs);
    s.acts.forEach(function (x) {
      var a = pos[x.id + ':in'], c = pos[x.id + ':res'];
      if (!a || !c) return;
      var dx = c.x - a.x, dy = c.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d <= a.r + c.r) return;
      var ln = document.createElementNS(SVG, 'line');
      ln.setAttribute('x1', a.x + dx * a.r / d);
      ln.setAttribute('y1', a.y + dy * a.r / d);
      ln.setAttribute('x2', c.x - dx * (c.r + 0.4) / d);
      ln.setAttribute('y2', c.y - dy * (c.r + 0.4) / d);
      ln.setAttribute('marker-end', 'url(#dp-head)');
      svg.appendChild(ln);
    });
    return svg;
  }

  function matrix(s) {
    var cells = s.cells.map(function (c) {
      return h('div', { class: 'dp-cell', dataset: { high: String(c.high), el: String(c.edgeL), eb: String(c.edgeB) } },
        h('span', { class: 'dp-cv dp-num', translate: 'no' }, String(c.score)));
    });
    var ms = markers(s), pos = {};
    ms.forEach(function (m) { pos[m.id + ':' + m.k] = centre(m); });
    var marks = ms.map(function (m) {
      var c = pos[m.id + ':' + m.k];
      var key = m.k === 'in' ? 'markIn' : m.k === 'res' ? 'markRes' : 'markSame';
      return h('span', {
        class: 'dp-mk', role: 'img', dataset: { k: m.k, c: String(m.n) },
        'aria-label': t(key, { act: actName(m.id), l: m.l, s: m.s, v: m.v }), title: actName(m.id),
        style: { left: c.x + '%', top: c.y + '%', width: (2 * c.r) + '%', height: (2 * c.r) + '%' }
      }, h('span', { translate: 'no' }, String(m.n)));
    });
    return h('div', { class: 'dp-matbox' }, h('div', { class: 'dp-matgrid' },
      h('div', { class: 'dp-yaxis', 'aria-hidden': 'true' }, [5, 4, 3, 2, 1].map(function (l) { return h('span', { translate: 'no' }, String(l)); })),
      h('div', { class: 'dp-mat' }, h('div', { class: 'dp-cells', 'aria-hidden': 'true' }, cells), arrows(s, pos), h('div', { class: 'dp-marks' }, marks)),
      h('div', { class: 'dp-xaxis', 'aria-hidden': 'true' }, [1, 2, 3, 4, 5].map(function (i) { return h('span', { translate: 'no' }, String(i)); }))));
  }

  function risk(s) {
    var meas = L.MEASURES.map(function (m) {
      return toggle(m, null, t('m_' + m), [
        h('span', { class: 'dp-box', 'aria-hidden': 'true' }),
        h('span', { class: 'dp-btext' }, h('span', { class: 'dp-bname' }, t('m_' + m)), h('span', { class: 'dp-bsub' }, t('mh_' + m)))
      ]);
    });
    var top = s.top1
      ? t.parts('topLine', { after: b(s.top1.score), act: actName(s.top1.id), before: b(s.top0.score), act0: actName(s.top0.id) })
      : [t('topNone')];
    return h('div', { class: 'dp-col' },
      h('p', { class: 'dp-head' }, t('headRisk')),
      h('div', { class: 'dp-rhead' },
        h('p', { class: 'dp-head' }, '↑ ', t('axisL'), ' · ', t('axisS'), ' →'),
        h('p', { class: 'dp-head dp-hl' }, t('highLine'))),
      matrix(s),
      h('p', { class: 'dp-top' }, top),
      h('p', { class: 'dp-head' }, t('headMeasures')),
      h('div', { class: 'dp-meas' }, meas));
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    var ch = L.flipped(last, s);
    last = s;
    P = s.p;
    c.stage.replaceChildren(h('div', { class: 'dp' },
      plan(s), screening(s, ch), risk(s), h('p', { class: 'dp-foot' }, t('foot'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var lit = s.crit.filter(function (x) { return x.lit; }).map(function (x) { var w = t('c_' + x.id); return w.charAt(0).toLowerCase() + w.slice(1); });
    var out = t.parts(k.key, {
      n: t.n('nMet', s.count, { c: int(s.count) }),
      crit: lit.join(', '),
      score: b(s.top1 ? s.top1.score : ''),
      act: s.top1 ? actName(s.top1.id) : ''
    });
    k.notes.forEach(function (key) {
      out.push(' ');
      if (key === 'nIdle') out = out.concat(t.n('nIdle', s.idle.length, { list: list(s.idle.map(function (m) { return t('m_' + m); })) }));
      else out = out.concat(t.parts(key, { c: b(int(s.count)) }));
    });
    return out;
  }

  var hidden = function () { return false; };
  var labels = { badge: 'pBadge', camera: 'pCamera', 'camera-measures': 'pCameraMeasures', join: 'pJoin', package: 'pPackage', 'face-group': 'pFaceGroup' };
  var params = L.ACTIVITIES.map(function (id) { return { key: id, type: 'toggle', label: t('a_' + id), visible: hidden }; })
    .concat([{ key: 'group', type: 'toggle', label: t('groupBtn'), visible: hidden }])
    .concat(L.MEASURES.map(function (m) { return { key: m, type: 'toggle', label: t('m_' + m), visible: hidden }; }));

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'dp-in', label: t('legIn') },
      { shape: 'dp-res', label: t('legRes') },
      { shape: 'dp-arrow', label: t('legArrow') },
      { shape: 'dp-high', label: t('legHigh') },
      { shape: 'dp-lit', label: t('legLit') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
