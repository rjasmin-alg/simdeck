     bars, the book value at each year end as a line, the residual as a dashed level and the sale as a vertical line

     beneath. Asset model: asset.js (promotable); ledger: ledger.js (copied from fin-capex-opex); page model: sim.js;

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var As = window.SimdeckModels.asset;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVGNS = 'http://www.w3.org/2000/svg';

  // ── numbers and words in the page's language ──

  /** A whole number with thousands grouped (30 000 / 30,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '\u00a0' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 6). Minus is U+2212. */
  function money(x) {
    var r = As.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  function pct(x) {
    var v = Math.round(x * 1000) / 10;
    var s = String(v);
    return (Simdeck.lang === 'hr' ? s.replace('.', ',') + '\u00a0%' : s + '%');
  }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  /** depreciation (equipment) or amortisation (licence), lower case and capitalised. */
  function words(p) {
    var lic = p.kind === 'licence';
    return { dep: t(lic ? 'wAmort' : 'wDep'), Dep: t(lic ? 'wAmortCap' : 'wDepCap') };
  }

  // ── the chart ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step at or above x. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }

  function svg(tag, attrs) {
    var el = document.createElementNS(SVGNS, tag);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  function chart(s, m, dom) {
    var p = s.p, n = p.sell, Lf = p.life, d = s[m];
    var pctY = function (v) { return (100 * (1 - v / dom.top)) + '%'; };
    var pctX = function (k) { return (100 * k / Lf) + '%'; };
    var X = function (k) { return 1000 * k / Lf; };
    var Y = function (v) { return 1000 * (1 - v / dom.top); };

    var ticks = [], grid = [];
    for (var v = 0; v <= dom.top + 1e-6; v += dom.step) {
      ticks.push(h('span', { class: 'dp-tick', translate: 'no', style: { top: pctY(v) } }, money(v)));
      if (v > 0) grid.push(h('div', { class: 'dp-gl', style: { top: pctY(v) } }));
    }

    // the yearly bars, their amounts, and the year labels
    var bars = [], years = [];
    for (var k = 1; k <= Lf; k++) {
      var plan = k > n ? ' dp-plan' : '';
      var hgt = (100 * d.dep[k] / dom.top) + '%';
      bars.push(h('div', { class: 'dp-bar' + plan, dataset: { c: '1' }, style: { left: (100 * (k - 0.78) / Lf) + '%', width: (100 * 0.56 / Lf) + '%', height: hgt } }));
      bars.push(h('span', { class: 'dp-barval' + plan, translate: 'no', style: { left: pctX(k - 0.5), top: pctY(d.dep[k]) } }, group(d.dep[k])));   // € is on the axis
      years.push(h('span', { class: 'dp-year', style: { left: pctX(k - 0.5) } },
        h('span', { class: 'dp-ylong' }, t('yearN', { n: k })), h('span', { class: 'dp-yshort', translate: 'no' }, String(k))));
    }

    // the book value: strong up to the sale, faded (the plan) after
    var pts = function (from, to) {
      var s2 = '';
      for (var k2 = from; k2 <= to; k2++) s2 += (k2 === from ? 'M' : 'L') + X(k2).toFixed(2) + ' ' + Y(d.book[k2]).toFixed(2);
      return s2;
    };
    var g = svg('svg', { class: 'dp-svg', viewBox: '0 0 1000 1000', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    if (n < Lf) g.appendChild(svg('path', { class: 'dp-plan', 'data-c': '3', d: pts(n, Lf) }));
    g.appendChild(svg('path', { 'data-c': '3', d: pts(0, n) }));
    var dots = [];
    for (var j = 0; j <= Lf; j++) {
      dots.push(h('span', { class: 'dp-pt' + (j > n ? ' dp-plan' : ''), dataset: { c: '3' }, style: { left: pctX(j), top: pctY(d.book[j]) } }));
    }

    // the sale: line, label, proceeds, and the bracket from the book value to the proceeds
    var sale = d.sale, x = pctX(n);
    var leftSide = n > Lf / 2;
    var labelKey = sale.outcome === 'loss' ? 'chLoss' : sale.outcome === 'gain' ? 'chGain' : 'chNone';
    var marks = [
      h('div', { class: 'dp-sale', style: { left: x } }),
      h('div', { class: 'dp-saletag', 'data-end': n === Lf ? '' : null, style: { left: x } },
        h('span', { class: 'dp-salelabel' }, t(p.proceeds > 0 ? 'chSold' : 'chScrapped')),
        h('span', { class: 'dp-gaplabel', dataset: { o: sale.outcome } }, t(labelKey, { x: money(Math.abs(sale.gain)) }))),
      h('span', { class: 'dp-proceeds', style: { left: x, top: pctY(sale.proceeds) } })
    ];
    var hi = Math.max(sale.book, sale.proceeds), lo = Math.min(sale.book, sale.proceeds);
    if (sale.outcome !== 'none') {
      marks.push(h('div', { class: 'dp-gap', dataset: { o: sale.outcome, side: leftSide ? 'left' : 'right' }, style: { left: x, top: pctY(hi), height: (100 * (hi - lo) / dom.top) + '%' } }));
    }

    return h('div', { class: 'dp-chart' },
      h('div', { class: 'dp-axis' }, ticks),
      h('div', { class: 'dp-plot' }, grid,
        h('div', { class: 'dp-res', style: { top: pctY(p.residual) } }),
        bars, g, dots, marks),
      h('div', { class: 'dp-years' }, years));
  }

  // ── one panel ──

  function rows(s, m, chg) {
    var p = s.p, sale = s[m].sale, w = words(p);
    var row = function (k, label, value, changed) {
      var cls = changed ? 'sd-changed' : null;
      return [h('dt', { class: cls, dataset: { k: k } }, label), h('dd', { class: cls, translate: 'no', dataset: { k: k } }, value)];
    };
    var glKey = sale.outcome === 'gain' ? 'rowGain' : sale.outcome === 'none' ? 'rowNone' : p.proceeds > 0 ? 'rowLoss' : 'rowWriteOff';
    var glVal = (sale.outcome === 'gain' ? '▲ ' : sale.outcome === 'loss' ? '▼ ' : '') + money(Math.abs(sale.gain));
    return h('dl', { class: 'dp-rows' },
      row('dep', p.sell === 1 ? t('rowDep1', w) : t('rowDepN', Object.assign({ n: p.sell }, w)), money(sale.depSoFar)),
      row('book', t('rowBook', { n: p.sell }), money(sale.book)),
      row('proceeds', t('rowProceeds'), money(sale.proceeds)),
      row('gl', t(glKey), glVal, chg.indexOf(m) >= 0),
      row('total', t('rowTotal'), money(sale.total)));
  }

  function panel(s, m, dom, chg) {
    var p = s.p, head;
    var kind = h('span', { class: 'dp-kind' }, '· ', words(p).dep);
    if (m === 'sl') {
      head = h('div', { class: 'dp-head' },
        h('h2', { class: 'dp-title' }, t('slTitle'), ' ', kind),
        h('p', { class: 'dp-line' }, t.parts('slLine', {
          x: b((Number.isInteger(s.perYearSl) ? '' : '≈\u00a0') + money(s.perYearSl)), cost: data(money(p.cost)), res: data(money(p.residual)), life: data(p.life)
        })));
    } else {
      var sw = s.db.switchYear;
      head = h('div', { class: 'dp-head' },
        h('h2', { class: 'dp-title' }, t('dbTitle'), ' ', kind),
        h('p', { class: 'dp-line' }, sw ? t.parts('dbLineSw', { pct: b(pct(Math.min(1, s.rate))), k: data(sw) })
          : t.parts('dbLine', { pct: b(pct(Math.min(1, s.rate))) })));
    }
    return h('section', { class: 'dp-panel', dataset: { m: m } }, head, chart(s, m, dom), rows(s, m, chg));
  }

  // ── render; the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function render(c) {
    track(c);
    var s = c.state;
    var step = niceStep(s.p.cost / 4);
    var dom = { step: step, top: Math.max(step, Math.ceil(s.p.cost / step) * step) };   // one scale for both panels
    var kindBtn = function (k, key) {
      return h('button', { type: 'button', 'aria-pressed': String(s.p.kind === k), onclick: function () { sim.set({ kind: k }); } }, t(key));
    };
    c.stage.replaceChildren(h('div', { class: 'dp' },
      h('div', { class: 'dp-panels' }, panel(s, 'sl', dom, chg), panel(s, 'db', dom, chg)),
      h('div', { class: 'dp-foot' },
        h('div', { class: 'dp-kindsw', role: 'group', 'aria-label': t('kind') },
          h('span', null, t('kind')), kindBtn('equipment', 'kindEquipment'), kindBtn('licence', 'kindLicence')),
        h('p', null, t('illustrative'), s.p.kind === 'licence' ? ' ' + t('footLicence') : ''))));
  }

  function caption(c) {
    var s = c.state, p = s.p;
    var k = L.captionKey(s);
    var out = t.parts(k.lead, { n: data(p.sell), life: data(t.n('nYears', p.life)), p: b(money(p.proceeds)) });
    k.out.forEach(function (key) {
      var sale = key.indexOf('db') === 0 ? s.db.sale : s.sl.sale;
      out.push(' ');
      out = out.concat(t.parts(key, { b: b(money(sale.book)), x: b(money(Math.abs(sale.gain))) }));
    });
    out.push(' ');
    out = out.concat(t.parts(k.note, { t: b(money(s.sl.sale.total)), a: b(money(s.db.dep[1])), b: b(money(s.sl.dep[1])) }));
    return out;
  }

  var labels = {
    'server': 'pServer', 'sold-early': 'pSoldEarly', 'scrapped': 'pScrapped', 'licence': 'pLicence'
  };

  var never = function () { return false; };
  // The kind is switched on the stage (the panel has no room); this hidden param keeps it in the URL and the presets.
  var sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'sell', type: 'range', label: t('sell'), min: 1, max: function (p) { return p.life; }, step: 1,
        format: function (v) { return t('sellFmt', { n: v }); } },
      { key: 'proceeds', type: 'range', label: t('proceeds'), hint: t('proceedsHint'), min: 0, max: function (p) { return p.cost; }, step: L.STEP, format: money },
      { key: 'cost', type: 'range', label: t('cost'), min: L.COST_MIN, max: L.COST_MAX, step: L.STEP, format: money },
      { key: 'life', type: 'range', label: t('life'), min: L.LIFE_MIN, max: L.LIFE_MAX, step: 1, format: function (v) { return t.n('nYears', v); } },
      { key: 'residual', type: 'range', label: t('residual'), min: 0, max: function (p) { return L.residualMax(p.cost); }, step: L.STEP, format: money },
      { key: 'kind', type: 'choice', label: t('kind'), options: [['equipment', t('kindEquipment')], ['licence', t('kindLicence')]], visible: never }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'dp-bar', c: 1, label: t('legDep') },
      { shape: 'dp-book', c: 3, label: t('legBook') },
      { shape: 'dp-res', label: t('legResidual') },
      { shape: 'dp-sale', label: t('legSale') },
      { shape: 'dp-loss', label: t('legLoss') },
      { shape: 'dp-gain', label: t('legGain') },
      { shape: 'dp-plan', c: 1, label: t('legPlan') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
