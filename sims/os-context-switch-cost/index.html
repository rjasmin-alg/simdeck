     goes and switches per second, a chart of the useful share against the quantum on a log axis, and a card of what is

  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var NS = 'http://www.w3.org/2000/svg';

  function dec(x, d, min) { return new Intl.NumberFormat(LOCALE, { maximumFractionDigits: d, minimumFractionDigits: min || 0 }).format(x); }
  /** a time in µs: "50 µs", "2,5 µs", "1 ms", "6,012 ms" */
  function time(us) { return us >= 1000 ? t('ms', { v: dec(us / 1000, 3) }) : t('us', { v: dec(us, 1) }); }
  function pct(v, d) { return t('pct', { v: dec(v, d == null ? 1 : d, d == null ? 1 : 0) }); }

    }));
    function seg(k, len, proc) {

      var show = len / W > (k === 'D' ? 0.012 : 0.02);

  function px(Q) { return (Math.log10(Q) - X0) / (X1 - X0) * VW; }

  function list(items) {

      return h('li', { dataset: { st: x.status } },
        h('span', { class: 'cs-mk', 'aria-hidden': 'true' }, MARK[x.status]),
        h('span', null, t('item_' + x.id)),
        h('span', { class: 'cs-st' }, t('st_' + x.status)));
    }));
  }
  function card(s) {
    return h('div', { class: 'cs-col cs-card' },
      h('p', { class: 'cs-head' }, t('kSaved')), list(s.saved),
      h('p', { class: 'cs-head' }, t('kCold')), list(s.cold),
      h('p', { class: 'cs-note' }, t('note')));
  }

  function render(c) {
    var s = c.state;
    var cross = crossed(lastBand, s.band);
    lastBand = s.band;
    c.stage.replaceChildren(h('div', { class: 'cs' }, timeline(s), gauge(s, cross), chart(s), card(s)));
  }

  function caption(c) {
    var s = c.state, out;
    if (s.regime === 'nowarm') out = t.parts('cap_nowarm', { Q: b(time(s.Q)), D: b(time(s.direct)) });
    else if (s.regime === 'thrash') out = t.parts('cap_thrash', { Q: b(time(s.Q)), W: b(time(s.warm.total)), r: b(pct(s.rate * 100, 0)) });
    else {
      out = t.parts('cap_warm', { Q: b(time(s.Q)), D: b(time(s.direct)), W: b(time(s.warm.total)),
        fill: t(s.kind === 'process' ? 'fill_both' : 'fill_cache') });
    }
    out.push(' ');
    out = out.concat(t.parts(s.band === 'high' ? 'cap_high' : 'cap_low', { p: h('b', { class: s.band === 'high' ? null : 'sd-hl', translate: 'no' }, pct(s.pct1)) }));
    var n = Math.round(s.switchesPerSec);
    out.push(' ', t('cap_rate', { n: n, s: dec(n, 0) }));
    if (s.perQuantum.warm >= 2 * s.direct) {
      out.push(' ');
      out = out.concat(t.parts('cap_more', { x: b(dec(s.perQuantum.warm / s.direct, 1)) }));
    }
    return out;
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'q', type: 'range', label: t('q'), min: 0, max: L.Q_STEPS.length - 1, step: 1, format: function (v) { return time(L.Q_STEPS[v]); } },
      { key: 'kind', type: 'choice', label: t('kind'), hint: t('kindHint'), options: L.KINDS.map(function (k) { return [k, t('kind_' + k)]; }) },
      { key: 'direct', type: 'range', label: t('direct'), min: 0.5, max: 10, step: 0.5, format: time },
      { key: 'wCache', type: 'range', label: t('wCache'), min: 0, max: 200, step: 5, format: time },
      { key: 'wTlb', type: 'range', label: t('wTlb'), min: 0, max: 50, step: 5, format: time,
        disabled: function (p) { return p.kind !== 'process' ? t('wTlbOff') : false; } },
      { key: 'rate', type: 'range', label: t('rate'), min: 0.1, max: 0.9, step: 0.05, format: function (v) { return pct(Math.round(v * 100), 0); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'cs-d', label: t('legD') },
      { shape: 'cs-w', label: t('legW') },
      { shape: 'cs-u', label: t('legU') },
      { shape: 'cs-ab', label: t('legAB') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
