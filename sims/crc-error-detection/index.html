/* Hamming(15,11) mode (gen = hamming15, preset task fec-hamming). One grid: a label column, the 15 positions,
   a result column. Parity bits are squares with a double border, data bits circles; a bit flipped on the line is
   hatched with a --danger border and a ⚡. The four check rows are the 50ohm "crossword" bands: covered positions are
   tinted cells holding the bit, the rest is empty. Checks pass ✓ or fail ✕; the syndrome is a ↓ over the position it
   names; the corrected bit is outlined in ink. */
[data-sim="crc-error-detection"] .hm {
  height: 100%;
  padding: 1cqh 1.2cqw;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.6cqh;
  container-type: size;
  /* 15 cells + label (4.4) + result (6) and gaps across; 13.5 cell rows down */

[data-sim="crc-error-detection"] .hm-hint { color: var(--muted); font-size: var(--fs-sm); text-align: center; }

  [data-sim="crc-error-detection"] .hm { height: auto; padding: 0.5rem 0; container-type: normal; --cell: 2.6rem; }
  [data-sim="crc-error-detection"] .hm-scroll { overflow-x: auto; }
  [data-sim="crc-error-detection"] .hm-grid { justify-content: start; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">CRC i paritet</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var N = L.N;
  var MAX = Math.pow(2, N) - 1;
  var seed = 1; // the random message draws from Simdeck.rng; the model itself stays deterministic
  var sim = null;
  var POLY = { '10011': 'x⁴ + x + 1', '1011': 'x³ + x + 1', '100000111': 'x⁸ + x² + x + 1' };
  var ICON = { ok: '✓', detected: '⚑', missed: '✕' };

  function str(bits) { return bits.join(''); }
  function binary(v) { return L.bitsOf(v, N).join(''); }
  function data(s) { return h('b', { class: 'sd-mono', translate: 'no' }, s); }
  function weight(i) { return Math.pow(2, N - 1 - i); }
  /** Buttons on the stage never take focus on click, like the kit's, so → and Space keep driving the demo. */
  function noFocus(el) { el.addEventListener('mousedown', function (e) { e.preventDefault(); }); return el; }

  /** One bit cell. o: { v, kind: data|check|ghost, flip: yes|plan|'', changed, click, label } */
  function bit(o) {
    var attrs = {
      class: 'ce-bit' + (o.changed ? ' sd-changed' : '') + (o.changed && o.forward ? ' sd-anim-in' : ''),
      dataset: { k: o.kind, flip: o.flip ? 'yes' : 'no', c: o.kind === 'check' ? '2' : '1' },
      'aria-label': o.label
    };
    var kids = [o.kind === 'ghost' ? ' ' : String(o.v), o.flip ? h('span', { class: 'ce-x', 'aria-hidden': 'true' }, '✕') : null];
    if (o.click) {
      attrs.type = 'button';
      attrs.onclick = o.click;
      return noFocus(h('button', attrs, kids));
    }
    return h('span', attrs, kids);
  }

  function verdict(v, changed) {
    return h('span', { class: 'ce-verdict' + (changed ? ' sd-changed' : ''), dataset: { v: v } },
      h('span', { 'aria-hidden': 'true' }, ICON[v]), t(v));
  }

  // ── left: the frames ──

  function senderFrames(s, c) {
    var p = c.params;
    var sent = s.phase !== 'start' && s.phase !== 'divide';
    var editBits = function (checkBits, kindChanged) {
      return s.data.map(function (b, i) {
        return bit({ v: b, kind: 'data', label: t('editLabel', { i: i, v: b }),
          click: function () { sim.set({ data: p.data ^ weight(i) }); } });
      }).concat([h('span', { class: 'ce-gap' })], checkBits);
    };
    var pBit = [bit({ v: s.parity, kind: 'check', label: t('bitLabel', { i: 'P', v: s.parity }), changed: c.first })];
    var fcs = [];
    for (var j = 0; j < s.r; j++) {
      fcs.push(sent
        ? bit({ v: s.fcs[j], kind: 'check', label: t('bitLabel', { i: N + j, v: s.fcs[j] }), changed: s.phase === 'sent', forward: c.dir === 'forward' })
        : bit({ v: 0, kind: 'ghost', label: t('bitLabel', { i: N + j, v: '?' }) }));
    }
    var k = L.ones(s.data);
    return h('div', { class: 'ce-side' },
      h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-side-name' }, t('sender')), h('span', { class: 'ce-note' }, t('editHint'))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameParity')),
          h('span', { class: 'ce-note' }, t.n('onesP', k, { p: s.parity }))),
        h('div', { class: 'ce-strip', translate: 'no' }, editBits(pBit))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameCrc')),
          sent ? h('span', { class: 'ce-note' }, t('fcsIs')) : null),
        h('div', { class: 'ce-strip', translate: 'no' }, editBits(fcs))));
  }

  function lineBar(s, c) {
    var n = s.flipped.length;
    var text = s.received ? (n ? h('b', null, t.n('lineFlips', n)) : t('lineClean'))
      : s.planned.length ? t.n('planned', s.planned.length) : null;
    return h('div', { class: 'ce-line' }, h('span', null, '↓ ', t('line')), text);
  }

  function receiverFrames(s, c) {
    var p = c.params;
    var arrived = !!s.received;
    var nowLine = s.phase === 'line';
    function rx(frame, checkBits) {
      return s.data.map(function (b, i) {
        var planned = s.planned.indexOf(i) >= 0;
        var flipped = s.flipped.indexOf(i) >= 0;
        return bit({
          v: arrived ? frame[i] : b, kind: arrived ? 'data' : 'ghost', flip: arrived ? flipped : planned,
          changed: nowLine && flipped, forward: c.dir === 'forward',
          label: t('flipLabel', { i: i, state: t(planned ? 'flipOn' : 'flipOff') }),
          click: function () { sim.set({ flip: p.flip ^ weight(i) }); }
        });
      }).concat([h('span', { class: 'ce-gap' })], checkBits);
    }
    var pRx = arrived ? s.receivedParity[N] : 0;
    var pCells = [bit({ v: pRx, kind: arrived ? 'check' : 'ghost', label: t('bitLabel', { i: 'P', v: arrived ? pRx : '?' }) })];
    var fcsCells = [];
    for (var j = 0; j < s.r; j++) {
      var v = arrived ? s.received[N + j] : 0;
      fcsCells.push(bit({ v: v, kind: arrived ? 'check' : 'ghost', label: t('bitLabel', { i: N + j, v: arrived ? v : '?' }) }));
    }
    var pc = s.parityCheck, cc = s.crcCheck;
    var pNote = pc ? [h('span', { class: 'ce-note' }, t.n('ones', pc.ones), ', ', t(pc.ones % 2 ? 'odd' : 'even'), ' '), verdict(pc.verdict, s.phase === 'parity')]
      : !arrived ? h('span', { class: 'ce-note' }, t('waiting')) : null;
    var cNote = cc ? [h('span', { class: 'ce-note' }, t('remainder'), ' ', h('b', { translate: 'no' }, str(cc.remainder)), ' '), verdict(cc.verdict, s.phase === 'crc')]
      : !arrived ? h('span', { class: 'ce-note' }, t('waiting')) : null;
    return h('div', { class: 'ce-side' },
      h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-side-name' }, t('receiver')), h('span', { class: 'ce-note' }, t('flipHint'))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameParity')), h('span', null, pNote)),
        h('div', { class: 'ce-strip', translate: 'no' }, rx(s.receivedParity, pCells))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameCrc')), h('span', null, cNote)),
        h('div', { class: 'ce-strip', translate: 'no' }, rx(s.received, fcsCells))));
  }

  // ── right: the long division ──

  /**
   * The rows of a division as grid lines: the dividend, then per XOR row the generator under its window (⊕) and the
   * register it leaves, from the window on. cur = index of the row done in this step (or -1); remHl marks the
   * remainder of the last line; flips marks bits of a received dividend.
   */
  function divisionGrid(dividend, rows, gen, o) {
    var cols = dividend.length, r = gen.length - 1, cells = [], lines = 1 + 2 * rows.length;
    function g(text, kind, extra) {
      var a = { class: 'ce-g' + (extra && extra.cls ? ' ' + extra.cls : ''), dataset: { k: kind } };
      if (extra && extra.flip) a.dataset.flip = 'yes';
      return h('span', a, text);
    }
    function blank() { return h('span', { class: 'ce-g' }, ''); }
    function regLine(reg, from, opts) {
      cells.push(g(opts.op || '', 'op'));
      for (var i = 0; i < cols; i++) {
        if (i < from) { cells.push(blank()); continue; }
        var kind = opts.dividend ? (i < cols - r ? 'data' : 'pad') : 'rest';
        var firstOne = reg.indexOf(1, from);
        if (!opts.dividend && (firstOne < 0 ? i < cols - r : i < firstOne) && i < cols - r) kind = 'lead';
        var cls = '';
        if (opts.win && i >= opts.win[0] && i <= opts.win[1]) cls = 'ce-win';
        if (opts.rem && i >= cols - r) { kind = 'rem'; if (opts.remHl) cls = 'ce-remhl'; }
        cells.push(g(String(reg[i]), kind, { cls: cls, flip: opts.flips && opts.flips.indexOf(i) >= 0 }));
      }
      cells.push(g(opts.mark || '', 'mark'));
    }
    var lastIdx = rows.length - 1;
    var curWin = o.cur >= 0 ? [rows[o.cur].at, rows[o.cur].at + r] : null;
    regLine(dividend, 0, { dividend: true, flips: o.flips, win: o.cur === 0 ? curWin : null, rem: rows.length === 0 && o.showRem, remHl: o.remHl });
    rows.forEach(function (row, j) {
      var win = j === o.cur ? curWin : null;
      cells.push(g('⊕', 'op'));
      for (var i = 0; i < cols; i++) {
        if (i < row.at || i > row.at + r) cells.push(blank());
        else cells.push(g(String(gen[i - row.at]), 'gen', { cls: win ? 'ce-win' : '' }));
      }
      cells.push(g(t('rowMark', { n: j + 1 }), 'mark'));
      var isLast = j === lastIdx;
      var nextWin = o.cur === j + 1 ? [rows[j + 1].at, rows[j + 1].at + r] : null;
      regLine(row.after, row.at + 1, { win: win || nextWin, rem: isLast && o.showRem, remHl: isLast && o.remHl });
    });
    return h('div', { class: 'ce-grid', translate: 'no', style: { '--cols': String(cols), '--lines': String(lines) } }, cells);
  }

  function division(s, c) {
    var rx = s.phase === 'crc';
    var dividend = rx ? s.received : s.dividend;
    var rows = rx ? s.crcCheck.rows : s.rows;
    var cur = s.phase === 'divide' ? s.rows.length - 1 : -1;
    var showRem = rx || (s.phase !== 'start' && s.phase !== 'divide');
    var grid = divisionGrid(dividend, rows, s.gen, {
      cur: cur, showRem: showRem, remHl: s.phase === 'sent' || rx, flips: rx ? s.flipped : null
    });
    return h('div', { class: 'ce-div' },
      h('div', { class: 'ce-div-head' },
        h('span', { class: 'ce-div-title' }, t(rx ? 'divReceiver' : 'divSender')),
        h('span', { class: 'ce-genbox' }, h('span', null, t('genBox')), h('span', { class: 'sd-mono', translate: 'no' }, str(s.gen)),
          h('span', { class: 'ce-poly', translate: 'no' }, POLY[str(s.gen)]))),
      h('div', { class: 'ce-work' }, grid));
  }

  // ── Hamming(15,11) mode ──

  var HMAX = Math.pow(2, L.H) - 1, DMAX = Math.pow(2, L.HK) - 1;
  var HNAME = {};
  L.PPOS.forEach(function (pos, j) { HNAME[pos] = 'p' + (j + 1); });
  L.DPOS.forEach(function (pos, k) { HNAME[pos] = 'abcdefghijk'.charAt(k); });
  function isHam(p) { return p.gen === L.HAMMING; }
  function isPar(pos) { return L.PPOS.indexOf(pos) >= 0; }
  function hbinary(v) { return L.bitsOf(v, L.H).join(''); }
  function dbinary(v) { return L.bitsOf(v, L.HK).join(''); }
  function bin4(v) { return L.bitsOf(v, 4).join(''); }
  function hweight(pos) { return Math.pow(2, L.H - pos); }
  function dweight(k) { return Math.pow(2, L.HK - 1 - k); }
  function covered(pos, j) { return Math.floor(pos / Math.pow(2, j - 1)) % 2 === 1; }
  function positions() { var a = []; for (var i = 1; i <= L.H; i++) a.push(i); return a; }
  /** "p1 and p2", "p1, p2 and p3": names as data, the "and" in the page's language. */
  function andList(items) {
    var out = [];
    items.forEach(function (it, i) {
      if (i > 0) out.push(i === items.length - 1 ? ' ' + t('and') + ' ' : ', ');
      out.push(data(it));
    });
    return h('span', null, out);
  }

  /** One Hamming bit: square for parity, circle for data; ghost when not known yet; ⚡ when flipped (or planned). */
  function hbit(o) {
    var attrs = {
      class: 'hm-bit' + (o.changed ? ' sd-changed' : '') + (o.changed && o.forward ? ' sd-anim-in' : '') + (o.fix ? ' hm-fix' : ''),
      dataset: { k: o.par ? 'par' : 'data', c: o.par ? '2' : '1', ghost: o.v == null ? 'yes' : 'no', flip: o.flip ? 'yes' : 'no' },
      'aria-label': o.label
    };
    var kids = [o.v == null ? ' ' : String(o.v), o.flip ? h('span', { class: 'hm-bolt', 'aria-hidden': 'true' }, '⚡') : null];
    if (o.click) { attrs.type = 'button'; attrs.onclick = o.click; return noFocus(h('button', attrs, kids)); }
    return h('span', attrs, kids);
  }

  function chip(v, word, icon, changed) {
    return h('span', { class: 'ce-verdict' + (changed ? ' sd-changed' : ''), dataset: { v: v } }, h('span', { 'aria-hidden': 'true' }, icon), word);
  }

  function hamming(s, c) {
    var p = c.params, cells = [], fwd = c.dir === 'forward', n = c.n;
    var sentWord = L.hammingEncode(s.data);
    var all = positions();
    function row(label, now) { cells.push(h('span', { class: 'hm-lab' + (now ? ' hm-now' : '') }, label)); }
    function res(kids) { cells.push(h('span', { class: 'hm-res' }, kids)); }
    function cell(kid) { cells.push(h('span', { class: 'hm-c' }, kid)); }
    var jNow = s.j;

    // position and its binary index; in a parity or check step the index bit of p_j is lit on the covered positions
    row(t('hPos'));
    all.forEach(function (pos) {
      var b = bin4(pos).split('').map(function (d, k) {
        return h('span', { class: jNow && 3 - k === jNow - 1 && covered(pos, jNow) ? 'hm-on' : '' }, d);
      });
      cell(h('span', { class: 'hm-pos' }, h('b', null, String(pos)), h('span', { class: 'hm-bin' }, b)));
    });
    res(null);

    row(t('hName'));
    all.forEach(function (pos) { cell(h('span', { class: 'hm-name', dataset: { k: isPar(pos) ? 'par' : 'data' } }, HNAME[pos])); });
    res(null);

    // the sender's word; data bits are clickable (they change the data)
    row(t('hSent'), n <= 6);
    all.forEach(function (pos) {
      var v = s.word[pos - 1], par = isPar(pos), k = L.DPOS.indexOf(pos);
      var changed = (s.phase === 'place' && !par) || (s.phase === 'parity' && pos === L.PPOS[s.j - 1]);
      cell(hbit({ v: v, par: par, changed: changed, forward: fwd,
        label: t('hBitLabel', { name: HNAME[pos], i: pos, v: v == null ? '?' : v }),
        click: par ? null : function () { sim.set({ hdata: p.hdata ^ dweight(k) }); } }));
    });
    res(null);

    // the line
    row('↓ ' + t('line'));
    cells.push(h('span', { class: 'hm-line', 'aria-hidden': 'true' }));
    var nf = s.flipped.length;
    res(s.received ? (nf ? h('strong', null, t.n('lineFlips', nf)) : t('lineClean')) : s.planned.length ? t.n('planned', s.planned.length) : null);

    // the receiver's word; every bit is clickable (an error on the line)
    row(t('hRecv'), n === 7);
    all.forEach(function (pos) {
      var planned = s.planned.indexOf(pos) >= 0, flipped = s.flipped.indexOf(pos) >= 0;
      var v = s.received ? s.received[pos - 1] : null;
      cell(hbit({ v: v, par: isPar(pos), flip: s.received ? flipped : planned, changed: s.phase === 'line' && flipped, forward: fwd,
        label: t('hFlipLabel', { name: HNAME[pos], state: t(planned ? 'flipOn' : 'flipOff') }),
        click: function () { sim.set({ hflip: p.hflip ^ hweight(pos) }); } }));
    });
    res(null);

    // the four check rows (the crossword bands): before the line they read the sent word, after it the received one
    [1, 2, 3, 4].forEach(function (j) {
      var ppos = L.PPOS[j - 1];
      var now = (s.phase === 'parity' || s.phase === 'check') && s.j === j;
      row(t('hCheck', { p: 'p' + j }), now);
      var src = s.received || s.word;
      all.forEach(function (pos) {
        if (!covered(pos, j)) { cell(null); return; }
        var v = src[pos - 1];
        cell(h('span', { class: 'hm-band' + (now ? ' hm-now' : ''),
          dataset: { band: String(j), k: pos === ppos ? 'par' : 'data', ghost: v == null ? 'yes' : 'no', flip: s.received && s.flipped.indexOf(pos) >= 0 ? 'yes' : 'no' } },
          v == null ? '·' : String(v)));
      });
      var chk = s.checks[j - 1];
      if (chk) {
        res([chip(chk.result, t(chk.result), chk.result === 'pass' ? '✓' : '✕', now), t.n('ones', chk.ones)]);
      } else if (s.word[ppos - 1] != null && !s.received) {
        var without = L.covers(j).reduce(function (a, pos) { return a + (pos === ppos ? 0 : sentWord[pos - 1]); }, 0);
        res(h('span', { class: now ? 'sd-changed' : '' }, t.n('hOnesP', without, { p: 'p' + j, v: s.word[ppos - 1] })));
      } else res(null);
    });

    // the syndrome: ↓ over the position it names
    var syn = s.syndrome;
    row(t('hSyndrome'), s.phase === 'syndrome');
    all.forEach(function (pos) { cell(syn != null && syn === pos ? h('span', { class: 'hm-arrow', 'aria-hidden': 'true' }, '↓') : null); });
    res(syn != null ? h('span', { class: s.phase === 'syndrome' ? 'sd-changed' : '' }, h('b', { translate: 'no' }, bin4(syn)), ' = ', h('b', { translate: 'no' }, String(syn))) : null);

    // the corrected word; at the end, bits that still differ from the sent word are marked
    row(t('hFixed'), s.phase === 'syndrome');
    all.forEach(function (pos) {
      var v = s.fixed ? s.fixed[pos - 1] : null;
      var bad = s.decoded && v !== sentWord[pos - 1];
      cell(hbit({ v: v, par: isPar(pos), fix: s.fixed && pos === s.corrected, flip: bad, changed: s.phase === 'syndrome' && pos === s.corrected,
        forward: fwd, label: t('hBitLabel', { name: HNAME[pos], i: pos, v: v == null ? '?' : v }) }));
    });
    res(s.decoded ? t.n('hWrongBits', s.wrong) : null);

    // the decoded data bits, compared with the original
    row(t('hDecoded'), s.phase === 'compare');
    all.forEach(function (pos) {
      if (isPar(pos)) { cell(null); return; }
      var k = L.DPOS.indexOf(pos), v = s.decoded ? s.decoded[k] : null;
      cell(hbit({ v: v, par: false, flip: s.decoded && v !== s.data[k], changed: s.phase === 'compare', forward: fwd,
        label: t('hBitLabel', { name: HNAME[pos], i: pos, v: v == null ? '?' : v }) }));
    });
    var V = { ok: ['✓', t('hOk')], corrected: ['↺', t('corrected')], wrong: ['✕', t('wrong')] };
    res(s.verdict ? chip(s.verdict, V[s.verdict][1], V[s.verdict][0], s.phase === 'compare') : null);

    return h('div', { class: 'hm' },
      h('div', { class: 'hm-scroll' }, h('div', { class: 'hm-grid', translate: 'no' }, cells)),
      h('p', { class: 'hm-hint' }, t('hEditHint')));
  }

  function hammingCaption(s, c) {
    var parts, n = s.flipped.length;
    if (s.phase === 'start') return t.parts('hCapStart', { data: data(str(s.data)) });
    if (s.phase === 'place') return t('hCapPlace');
    if (s.phase === 'parity') {
      var j = s.j, ppos = L.PPOS[j - 1], w = L.hammingEncode(s.data);
      var without = L.covers(j).reduce(function (a, pos) { return a + (pos === ppos ? 0 : w[pos - 1]); }, 0);
      return t.parts('hCapParity', { p: data('p' + j), p2: data('p' + j), b: String(j), list: data(L.covers(j).join(', ')),
        ones: t.n('ones', without), v: data(String(w[ppos - 1])) });
    }
    if (s.phase === 'sent') {
      parts = t.parts('hCapSent', { word: data(str(s.word)) });
      parts.push(' ', s.planned.length ? t('captionSentFlip') : t('hCapSentClean'));
      return parts;
    }
    if (s.phase === 'line') {
      if (!n) return t('hCapLine0');
      parts = t.parts(n === 1 ? 'hCapLine1' : 'hCapLine', { flips: t.n('lineFlips', n), list: data(s.flipped.join(', ')),
        names: data(s.flipped.map(function (pos) { return HNAME[pos]; }).join(', ')) });
      parts.push(' ', t('hCapLineNext'));
      return parts;
    }
    if (s.phase === 'check') {
      var chk = s.checks[s.j - 1];
      return t.parts(chk.result === 'pass' ? 'hCapCheckPass' : 'hCapCheckFail', { p: data('p' + s.j), p2: data('p' + s.j), ones: t.n('ones', chk.ones) });
    }
    if (s.phase === 'syndrome') {
      if (!s.syndrome) return t.parts('hCapSyn0', {});
      var fails = s.checks.map(function (ch, j) { return ch.result === 'fail' ? 'p' + (j + 1) : null; }).filter(Boolean);
      return t.parts(fails.length === 1 ? 'hCapSyn1' : 'hCapSyn', { fails: andList(fails), bin: data(bin4(s.syndrome)),
        s: data(String(s.syndrome)), pos: data(String(s.syndrome)), name: data(HNAME[s.syndrome]) });
    }
    var dec = data(str(s.decoded));
    if (s.verdict === 'ok') return t.parts('hCapOk', { dec: dec });
    if (s.verdict === 'corrected') {
      parts = t.parts('hCapCorrected', { dec: dec });
      if (isPar(s.corrected)) parts.push(' ', t('hCapCorrectedParity'));
      return parts;
    }
    if (n === 2) return t.parts('hCapWrong2', { dec: dec, orig: data(str(s.data)), wrong: t.n('hWrongBits', s.wrong) });
    return t.parts('hCapWrongMany', { dec: dec, orig: data(str(s.data)), flips: t.n('lineFlips', n) });
  }

  // ── captions ──

  function listOf(idx) { return idx.join(', '); }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      // the code: a CRC generator, or Hamming(15,11) (correction, the fec-hamming presets 5-8)
      { key: 'gen', type: 'choice', label: t('gen'), hint: t('genHint'), resets: true,
        options: [['10011', t('gen4')], ['1011', t('gen3')], ['100000111', t('gen8')], [L.HAMMING, t('genHam')]] },
      // The message and the error pattern: sliders over every 10-bit value, shown as bits; clicking a bit on the stage
      // is the quicker way to change one.
      { key: 'data', type: 'range', label: t('message'), hint: t('messageHint'), min: 0, max: MAX, resets: true, format: binary,
        visible: function (p) { return !isHam(p); } },
      { key: 'flip', type: 'range', label: t('pattern'), hint: t('patternHint'), min: 0, max: MAX, format: binary,
        visible: function (p) { return !isHam(p); } },
      // Hamming: the 11 data bits a…k and a mask of the 15 code word positions the line flips
      { key: 'hdata', type: 'range', label: t('hdata'), hint: t('hdataHint'), min: 0, max: DMAX, resets: true, format: dbinary,
        visible: isHam },
      { key: 'hflip', type: 'range', label: t('pattern'), hint: t('hpatternHint'), min: 0, max: HMAX, format: hbinary, visible: isHam },
      { type: 'button', label: t('random'), key: 'n', run: function (sm) {
        sm.set(isHam(sm.params) ? { hdata: Simdeck.rng(seed++).int(DMAX + 1) } : { data: Simdeck.rng(seed++).int(MAX + 1) });
      } },
      { type: 'button', label: t('clear'), key: 'x', run: function (sm) { sm.set(isHam(sm.params) ? { hflip: 0 } : { flip: 0 }); } }
    ],

    presets: [
      { id: 'crc-build', label: t('presetBuild'), hint: t('presetBuildHint'), params: { flip: 0 } },
      { id: 'crc-catches-burst', label: t('presetBurst'), hint: t('presetBurstHint'), params: { flip: 120 }, step: 6 },
      { id: 'parity-catches', label: t('presetSingle'), hint: t('presetSingleHint'), params: { flip: 64 }, step: 6 },
      { id: 'crc-blind-spot', label: t('presetBlind'), hint: t('presetBlindHint'), params: { flip: 152 }, step: 6 },
      // fec-hamming: data 10110011101, code word 111101100011101; the first walks through the encoding, the others open
      // at the sent word (step 6), so the error, the checks and the correction follow at once
      { id: 'hamming-k', label: t('presetHamK'), hint: t('presetHamKHint'), params: { gen: 'hamming15', hflip: 1 } },
      { id: 'hamming-a', label: t('presetHamA'), hint: t('presetHamAHint'), params: { gen: 'hamming15', hflip: 4096 }, step: 6 },
      { id: 'hamming-p1', label: t('presetHamP1'), hint: t('presetHamP1Hint'), params: { gen: 'hamming15', hflip: 16384 }, step: 6 },
      { id: 'hamming-two', label: t('presetHamTwo'), hint: t('presetHamTwoHint'), params: { gen: 'hamming15', hflip: 5120 }, step: 6 }
    ],

    legend: [
      { shape: 'data', label: t('legendData') },
      { shape: 'check', label: t('legendCheck') },
      { shape: 'flip', label: t('legendFlip') },
      { shape: 'h-par', label: t('legendHPar') },
      { shape: 'h-data', label: t('legendHData') },
      { shape: 'h-flip', label: t('legendHFlip') },
      { shape: 'h-arrow', label: t('legendHArrow') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      document.documentElement.dataset.ceMode = isHam(c.params) ? 'ham' : 'crc';
      if (isHam(c.params)) { c.stage.replaceChildren(hamming(s, c)); return; }
      c.stage.replaceChildren(h('div', { class: 'ce' },
        h('div', { class: 'ce-frames', style: { '--n': String(L.N + s.r) } }, senderFrames(s, c), lineBar(s, c), receiverFrames(s, c)),
        division(s, c)));
    },

    caption: function (c) {
      if (isHam(c.params)) return hammingCaption(c.state, c);
      var s = c.state, gen = str(s.gen);
      var parts;
      if (s.phase === 'start') {
        parts = t.parts('captionStart', { data: data(str(s.data)), p: data(String(s.parity)), zeros: t.n('zeros', s.r), gen: data(gen) });
        if (!s.rows.length && c.steps === 1) parts.push(' ', t('captionNoRow'));
        return parts;
      }
      if (s.phase === 'divide') {
        var j = s.rows.length - 1, row = s.rows[j];
        var prevAt = j > 0 ? s.rows[j - 1].at : -1;
        // leading zeros between the previous window's lead and this one are only brought down (rule 7)
        var skipped = row.at - prevAt - 1;
        parts = t.parts('captionRow', { n: j + 1, at: row.at, gen: data(gen) });
        if (skipped > 0) parts.push(' ', t.n('skipped', skipped));
        return parts;
      }
      if (s.phase === 'sent') {
        parts = s.rows.length ? t.parts('captionSent', { fcs: data(str(s.fcs)), codeword: data(str(s.codeword)) })
          : [t('captionNoRow'), ' '].concat(t.parts('captionSent', { fcs: data(str(s.fcs)), codeword: data(str(s.codeword)) }));
        parts.push(' ', s.planned.length ? t('captionSentFlip') : t('captionSentClean'));
        return parts;
      }
      var n = s.flipped.length;
      if (s.phase === 'line') {
        parts = t.parts(n === 1 ? 'captionLine1' : 'captionLine', { flips: t.n('lineFlips', n), list: data(listOf(s.flipped)) });
        if (n > 1) parts.push(' ', t.n('burst', s.flipped[n - 1] - s.flipped[0] + 1));
        return parts;
      }
      if (s.phase === 'parity') {
        return t.parts(s.parityCheck.verdict === 'missed' ? 'captionParityMissed' : 'captionParityDetected',
          { ones: t.n('ones', s.parityCheck.ones) });
      }
      parts = t.parts(s.crcCheck.verdict === 'missed' ? 'captionCrcMissed' : 'captionCrcDetected', { rem: data(str(s.crcCheck.remainder)) });
      parts.push(' ', s.parityCheck.verdict === 'missed' ? t.n('recapParityMissed', n)
        : t(s.crcCheck.verdict === 'missed' ? 'recapParityOnly' : 'recapParityDetected'));
      return parts;
    }
  });
})();
</script>
</body>
</html>
