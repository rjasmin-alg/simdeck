<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Drawing: grid place, card kind and series colour per node; hosts from the estate's forest (student side). */
  var POS = { loom: [4, 0], DC01: [4, 2], DC02: [0, 4], DC03: [8, 4], 'PC-A': [0, 6], 'PC-B': [8, 6] };
  var KIND = { loom: 'router', DC01: 'server', DC02: 'server', DC03: 'server', 'PC-A': 'host', 'PC-B': 'host' };
  var COLOUR = { loom: 7, DC01: 1, DC02: 2, DC03: 3, 'PC-A': 4, 'PC-B': 5 };
  var HOST = { loom: '10.40.1.5', DC01: 'qm-dc01', DC02: 'qm-dc02', DC03: 'brk-dc03', 'PC-A': null, 'PC-B': null };
  /** The tree as drawn when nothing is moved: parent, child. */
  var EDGES = [['loom', 'DC01'], ['DC01', 'DC02'], ['DC01', 'DC03'], ['DC02', 'PC-A'], ['DC03', 'PC-B']];

  /** Data (names, addresses, offsets) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { class: 'th-d' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  function signed(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v) + ' s'; }
  /** A distance between two clocks, in seconds. */
  function dur(v) { return Math.abs(v) + ' s'; }
  /** The same in words when it is whole minutes ("10 minutes"), for the whole domain against true time. */
  function mins(v) { v = Math.abs(v); return v >= 60 && v % 60 === 0 ? t.n('minutes', v / 60) : data(v + ' s'); }
  /** Parts of a string with *English term* turned into <em lang="en"> (the Croatian term rule). Nodes are cloned, so
      one vars object may serve several sentences. */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p.cloneNode(true)); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function join(list) {
    var out = [];
    list.forEach(function (x, i) { if (i) out.push(' '); out = out.concat(x); });
    return out;
  }
  function dirOf(v) { return t(v >= 0 ? 'dirAhead' : 'dirBehind'); }

  // ── the tree ──

  function badges(c, id) {
    var s = c.state, x = s.nodes[id], out = [];
    if (x.pdc) out.push({ text: t('bPdc'), k: 'fill', anim: false });
    if (s.events.some(function (e) { return e.code === 'noSource' && e.node === id; })) out.push({ text: t('bE12'), k: 'dashed', anim: false });
    if (!x.syncs && id !== 'loom') out.push({ text: t('bStopped'), k: 'dashed', anim: false });
    if (c.n > 0 && x.corrected) out.push({ text: t('bCorrected', { d: signed(x.corrected) }), k: 'muted', anim: false });
    return out;
  }

  function cfgLine(id, x) {
    var word = id === 'loom' ? t('cfgLocal') : x.config === 'manual' ? t.parts('cfgManual', { peer: data('loom') })
      : !x.syncs ? t('cfgStopped') : x.source ? t.parts('cfgDomhier', { src: data(x.source) }) : t('cfgTop');
    return word;
  }

  function node(c, id) {
    var s = c.state, x = s.nodes[id];
    var lines = [{ text: signed(x.offset), kind: 'addr' }, HOST[id] ? { text: HOST[id], kind: 'sub' } : null,
      { text: h('span', null, cfgLine(id, x)), kind: 'role' }];
    if (id !== 'loom') lines.push({ text: h('span', null, t.parts('drift', { d: data(signed(x.driftPerRound)) })), kind: 'role' });
    return {
      id: id, kind: KIND[id], col: POS[id][0], row: POS[id][1], span: 4, c: COLOUR[id], mark: id,
      lines: lines, badges: id === 'loom' ? null : badges(c, id), changed: c.n > 0 && s.changed.indexOf(id) >= 0
    };
  }

  function tree(c) {
    var s = c.state;
    var links = [], packets = [];
    function linked(a, b) { return s.nodes[b].source === a || s.nodes[a].source === b; }
    EDGES.forEach(function (e) {
      var a = e[0], b = e[1];
      var up = linked(a, b);
      // a sync that should be there and is not: the child's service is stopped
      var broken = !up && !s.nodes[b].syncs && b !== 'loom';
      links.push({ id: a + '~' + b, a: a, b: b, state: up ? 'up' : broken ? 'down' : 'off', active: up });
    });
    L.IDS.forEach(function (id) {
      var src = s.nodes[id].source;
      if (!src) return;
      var known = EDGES.some(function (e) { return (e[0] === src && e[1] === id) || (e[1] === src && e[0] === id); });
      if (!known) links.push({ id: src + '~' + id, a: src, b: id, state: 'up', active: true });
      if (c.n > 0) packets.push({ from: src, to: id, label: signed(s.nodes[src].offset), c: COLOUR[src], at: 0.55 });
    });
    return Simdeck.topology({
      cols: 12, rows: ['auto', 'minmax(0.5rem, 1.4rem)', 'auto', 'minmax(0.5rem, 1.4rem)', 'auto', 'minmax(0.5rem, 1.4rem)', 'auto'],
      dir: c.dir, gap: '1cqw',
      nodes: L.IDS.map(function (id) { return node(c, id); }), links: links, packets: packets
    });
  }

  // ── the side column ──

  function side(c) {
    var s = c.state;
    var steps = L.steps(c.params);
    var krb = s.krb.map(function (k, i) {
      var was = c.prev && c.n > 0 ? c.prev.krb[i] : null;
      var hit = was && was.skew !== k.skew;
      return h('li', { dataset: { ok: k.ok ? 'yes' : 'no' } },
        h('span', { class: 'th-mk', 'aria-hidden': 'true' }, k.ok ? '✓' : '✕'),
        h('span', { class: 'th-pair' }, data(k.a + ' ↔ ' + k.b, 'th-nw')),
        data(k.skew + ' s', 'th-skew' + (hit ? ' th-ch' : '')),
        h('span', { class: 'th-kind' }, t(k.kind === 'logon' ? 'kLogon' : 'kDc')),
        h('span', { class: 'th-word' }, t(k.ok ? 'kOk' : 'kFail')));
    });
    var log = s.events.map(function (e) {
      var text = e.code === 'noSource' ? t.parts('logE12', { node: data(e.node) })
        : t.parts(e.code === 'krbFail' ? 'logFail' : 'logOk', { a: data(e.node), b: data(e.peer) });
      return h('li', { dataset: { k: e.code === 'krbFail' ? 'fail' : 'info' }, class: e.round === c.n ? 'th-ch' : null },
        h('span', { class: 'th-r' }, t('logRound', { n: e.round })), text);
    });
    if (!log.length) log.push(h('li', { dataset: { k: 'none' } }, t('logEmpty')));
    return h('div', { class: 'th-side' },
      h('div', { class: 'th-round' }, c.n === 0 ? t('roundStart') : t('round', { n: c.n, of: steps })),
      h('div', { class: 'th-box' }, h('b', null, t('krbHead')), h('ul', { class: 'th-krb' }, krb)),
      h('div', { class: 'th-box' }, h('b', null, t('logHead')), h('ul', { class: 'th-log' }, log)));
  }

  // ── captions ──

  /** "loom → DC01; DC01 → DC02, DC03; DC02 → PC-A; DC03 → PC-B": each source and who follows it, in rule 7's order. */
  function orderText(s) {
    var out = [];
    s.order.forEach(function (id) {
      var kids = s.order.filter(function (x) { return s.nodes[x].source === id; });
      if (kids.length) out.push(id + ' → ' + kids.join(', '));
    });
    return out.join('; ');
  }

  function capStart(c) {
    var e = L.eff(c.params);
    var vars = { pdc: data(e.pdcOn), peer: data('loom'), addr: data(HOST.loom) };
    var out = [rich('capStart')];
    if (e.pdcOn === 'DC01') out.push(rich(e.pdcSource === 'external' ? 'startExt' : 'startNone', vars));
    else out.push(rich(e.pdcSource === 'external' ? 'startMoved' : 'startMovedNone', vars));
    out.push(rich(e.pdcOn !== 'DC01' && e.pdcSource === 'external' ? 'startTreeMoved' : 'startTree'));
    if (e.memberStopped) out.push(rich('startStopped'));
    out.push(rich('startGo'));
    return join(out);
  }

  function capRound(c) {
    var s = c.state, n = c.n;
    var out = [];
    var lone = L.lonePdc(c.params);
    var pulledPdc = false;
    if (n === 1) out.push(rich('capMech', { n: n, order: data(orderText(s)) }));
    if (lone) {
      var d = s.nodes[lone].driftPerRound;
      if (s.events.some(function (e) { return e.code === 'noSource' && e.round === n; })) {
        out.push(rich('capE12', { pdc: data(lone) }));
      } else if (d) out.push(rich('capFree', { pdc: data(lone), d: data(signed(d)), off: data(signed(s.nodes[lone].offset)) }));
      else out.push(rich('capFreeZero', { pdc: data(lone) }));
    } else {
      // the PDC syncs from loom: its own drift is set back every round
      var pdc = L.DCS.filter(function (id) { return s.nodes[id].pdc; })[0];
      var pd = s.nodes[pdc].driftPerRound;
      if (pd && s.nodes[pdc].source === 'loom') {
        out.push(rich('capPdcPulled', { pdc: data(pdc), d: data(signed(pd)), peer: data('loom') }));
        pulledPdc = true;
      }
      else if (n > 1) out.push(rich('capPulled', { peer: data('loom') }));
    }

    // the strip: new failures first, then failures that stand, then a pair back in time
    var fresh = s.events.filter(function (e) { return e.round === n && e.code === 'krbFail'; });
    var said = false;
    s.krb.forEach(function (k, i) {
      var v = s.nodes[k.a].offset - s.nodes[k.b].offset;
      var vars = { a: data(k.a), b: data(k.b), d: data(dur(v)), dir: dirOf(v) };
      if (fresh.some(function (e) { return e.node === k.a && e.peer === k.b; })) {
        // two DC pairs failing together read as one sentence about the first
        if (k.kind === 'dc' && said) return;
        out.push(rich(k.kind === 'logon' ? 'capFailLogon' : 'capFailDc', vars));
        if (k.kind === 'dc') said = true;
      } else if (!k.ok && i === s.krb.indexOf(s.krb.filter(function (x) { return !x.ok; })[0])) {
        if (!fresh.length) out.push(rich('capStillFail', vars));
      } else if (k.ok && c.prev && !c.prev.krb[i].ok) out.push(rich('capOkAgain', vars));
    });

    var allOk = s.krb.every(function (k) { return k.ok; });
    var dom = L.domainOffset(s);
    var pcb = s.nodes['PC-B'];
    // round 1 with a lone or corrected PDC already says a lot: the stopped member and the old PDC wait for round 2
    var busy = n === 1 && (lone || pulledPdc);
    if (!busy && !pcb.syncs && s.krb[1].ok && pcb.offset !== s.nodes.DC03.offset) {
      var v = pcb.offset - s.nodes.DC03.offset;
      out.push(rich('capStopped', { a: data('PC-B'), b: data('DC03'), d: data(dur(v)), dir: dirOf(v) }));
      busy = true;
    }
    if (allOk && dom !== null && Math.abs(dom) >= 300) out.push(rich(dom > 0 ? 'capAgreeAhead' : 'capAgreeBehind', { d: mins(dom) }));
    if (lone && lone !== 'DC01' && s.nodes.DC01.source === 'loom') {
      if (n === 2) out.push(rich('capOldPdc', { peer: data('loom') }));
      else if (n > 2 && !busy && s.krb[2].ok && s.krb[2].skew) out.push(rich('capSplit', { d: data(dur(s.krb[2].skew)) }));
    }
    return join(out);
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'pdcSource', type: 'choice', label: t('pPdcSource'), resets: true,
        options: [['external', t('srcExternal')], ['none', t('srcNone')]] },
      { key: 'pdcOn', type: 'choice', label: t('pPdcOn'), resets: true, options: [['DC01', 'DC01'], ['DC02', 'DC02']] },
      { key: 'pdcDrift', type: 'range', label: t('pPdcDrift'), min: -60, max: 60, step: 5, resets: true,
        format: function (v) { return t('perRound', { d: signed(v) }); } },
      { key: 'memberStopped', type: 'toggle', label: t('pStopped'), resets: true },
      { key: 'pcbDrift', type: 'range', label: t('pPcbDrift'), min: 0, max: 120, step: 5, resets: true,
        format: function (v) { return t('perRound', { d: signed(v) }); } },
      { key: 'rounds', type: 'range', label: t('pRounds'), min: 1, max: 10, step: 1, resets: true }
    ],

    presets: [
      { id: 'healthy', label: t('prHealthy'), params: { pdcSource: 'external', pdcDrift: 0, memberStopped: false, pcbDrift: 40, pdcOn: 'DC01', rounds: 4 } },
      { id: 'pdc-no-source', label: t('prNoSource'), params: { pdcSource: 'none', pdcDrift: 60, memberStopped: false, pcbDrift: 40, pdcOn: 'DC01', rounds: 10 } },
      { id: 'member-stopped', label: t('prStopped'), params: { pdcSource: 'external', pdcDrift: 0, memberStopped: true, pcbDrift: 40, pdcOn: 'DC01', rounds: 9 } },
      { id: 'move-pdc', label: t('prMove'), params: { pdcSource: 'external', pdcDrift: 30, memberStopped: false, pcbDrift: 40, pdcOn: 'DC02', rounds: 6 } },
      { id: 'quillmoor', label: t('prQuillmoor'), params: { pdcSource: 'external', pdcDrift: 15, memberStopped: false, pcbDrift: 40, pdcOn: 'DC01', rounds: 3 } }
    ],

    legend: [
      { shape: 'line', label: t('lgSync') },
      { shape: 'dash', label: t('lgBroken') },
      { shape: 'th-pdc', label: t('lgPdc') },
      { shape: 'th-off', label: t('lgOffset') },
      { shape: 'th-krb', label: t('lgKrb') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'th' }, tree(c), side(c)));
    },

    caption: function (c) {
      return c.n === 0 ? capStart(c) : capRound(c);
    }
  });
})();
</script>
</body>
</html>
