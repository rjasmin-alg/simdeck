<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function field(x) { var a = Math.abs(x); if (a < 5e-5) return num(0, 3); return num(x, a < 0.0095 ? 4 : 3); }
  function ns(x) { return t('ns', { v: num(x, Number.isInteger(x) ? 0 : 1) }); }
  function metres(x) { return t('m', { v: num(x, 1) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    (function add(list) {
      for (var i = 0; i < list.length; i++) {
        if (Array.isArray(list[i])) add(list[i]);
        else if (list[i] != null) e.append(list[i]);
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  // "E_θ" → E with a subscript, in SVG (tspans) or HTML
  function subSvg(str) {
    var m = /^(.*?)E_(θ|r)(.*)$/.exec(str);
    if (!m) return [str];
    return [m[1], s('tspan', { 'font-style': 'italic' }, 'E'), s('tspan', { 'baseline-shift': 'sub' }, m[2]), m[3]];
  }
  function subHtml(str) {
    var m = /^(.*?)E_(θ|r)(.*)$/.exec(str);
    if (!m) return [str];
    return [m[1], h('i', null, 'E'), h('sub', null, m[2]), m[3]];
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }

  // ── the probe series for the plots depend on everything but t: keep the last one ──
  var seriesKey = '', seriesData = null;
  function seriesOf(p) {
    var k = [p.motion, p.c, p.beta, p.tau].join('|');
    if (k !== seriesKey) { seriesKey = k; seriesData = L.series(p); }
    return seriesData;
  }

  // ── the picture: wire, charge, shells, field lines, probes ──
  function arrow(g, x, y, ux, uy, len) {
    var x2 = x + ux * len, y2 = y + uy * len, hw = 0.32 * len, hl = 0.38 * len;
    g.append(s('line', { class: 'ac-arrow', x1: x, y1: y, x2: x2 - ux * hl * 0.6, y2: y2 - uy * hl * 0.6 }));
    g.append(s('polygon', { class: 'ac-head', points: [
      [x2, y2], [x2 - ux * hl - uy * hw * 0.5, y2 - uy * hl + ux * hw * 0.5], [x2 - ux * hl + uy * hw * 0.5, y2 - uy * hl - ux * hw * 0.5]
    ].map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') }));
  }

  function drawPicture(box, c) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = c.params, st = c.state;
    var sc = Math.min(H / 12.4, W / 13);                  // px per metre: ±6.2 m tall, ≥ 13 m wide
    var x1 = 10.2, x0 = x1 - W / sc, zTop = H / (2 * sc), zBot = -zTop;
    var X = function (x) { return (x - x0) * sc; }, Y = function (z) { return (zTop - z) * sc; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var defs = s('defs', null,
      s('pattern', { id: 'ac-hatch', width: 10, height: 10, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
        s('line', { class: 'ac-hatch', x1: 0, y1: 0, x2: 0, y2: 10 })));
    svg.append(defs);

    // shells: the news of each push, hatched between its two fronts, the outer front dashed
    st.fronts.forEach(function (f) {
      var cx = X(0), cy = Y(f.z), ro = f.outer * sc, ri = f.inner * sc;
      if (ro > 0.5) {
        var d = 'M' + (cx - ro) + ',' + cy + 'a' + ro + ',' + ro + ' 0 1,0 ' + 2 * ro + ',0a' + ro + ',' + ro + ' 0 1,0 ' + -2 * ro + ',0Z';
        if (ri > 0.5) d += 'M' + (cx - ri) + ',' + cy + 'a' + ri + ',' + ri + ' 0 1,0 ' + 2 * ri + ',0a' + ri + ',' + ri + ' 0 1,0 ' + -2 * ri + ',0Z';
        svg.append(s('path', { class: 'ac-shell', d: d, 'fill-rule': 'evenodd', fill: 'url(#ac-hatch)' }));
        svg.append(s('circle', { class: 'ac-front', cx: cx, cy: cy, r: ro }));
      }
    });

    // the wire
    svg.append(s('line', { class: 'ac-wire', x1: X(0), x2: X(0), y1: Y(zTop - 0.3), y2: Y(zBot + 0.3) }));

    // field lines, traced from the model
    var lines = L.fieldLines(p, p.t, [x0, zBot, x1, zTop]);
    lines.forEach(function (ln) {
      svg.append(s('polyline', { class: 'ac-line', points: ln.map(function (q) { return X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1); }).join(' ') }));
    });

    // the charge
    var cr = Math.max(0.75 * r0, 0.28 * sc);
    svg.append(s('circle', { class: 'ac-charge', cx: X(0), cy: Y(st.z), r: cr }));
    svg.append(s('text', { class: 'ac-plus', x: X(0), y: Y(st.z) + 0.36 * r0, 'text-anchor': 'middle' }, '+'));

    // front labels, at the first angle (from the top-right down) where the label fits in the picture
    st.fronts.forEach(function (f) {
      if (f.outer < 1) return;
      var a = [62, 50, 38, 26, 14].map(function (d) { return d * Math.PI / 180; }).filter(function (an) {
        var x = f.outer * Math.cos(an), z = f.z + f.outer * Math.sin(an);
        return x < x1 - 3.2 && z < zTop - 0.6;
      })[0];
      if (a === undefined) return;
      var lx = X(f.outer * Math.cos(a)) + 0.4 * r0, ly = Y(f.z + f.outer * Math.sin(a)) - 0.3 * r0;
      svg.append(s('text', { class: 'ac-halo', x: lx, y: ly }, t('front', { r: metres(f.outer) })));
    });

    // probes: P1 a diamond, P2 a square, each with the direction of E as an arrow
    st.probes.forEach(function (q, i) {
      var px = X(q.r), py = Y(0), k = 0.62 * r0;
      var shape = i === 0
        ? s('polygon', { class: 'ac-p1', points: [[px, py - k * 1.25], [px + k * 1.25, py], [px, py + k * 1.25], [px - k * 1.25, py]].map(function (v) { return v.join(','); }).join(' ') })
        : s('rect', { class: 'ac-p2', x: px - k, y: py - k, width: 2 * k, height: 2 * k });
      var E = L.fieldAt(p, [q.r, 0], p.t), m = Math.hypot(E.x, E.z), uy = m > 0 ? -E.z / m : 0;
      if (m > 0) arrow(svg, px, py, E.x / m, uy, 2.8 * r0);
      svg.append(shape);
      // the label on the side the arrow does not point to
      var below = uy < -0.2;
      svg.append(s('text', { class: 'ac-halo ac-title', x: px - (Math.abs(uy) > 0.2 ? 0.9 * r0 : 0), y: below ? py + 2.1 * r0 : py - 1.3 * r0, 'text-anchor': 'middle' }, 'P' + (i + 1)));
    });

    // c infinite badge, scale bar
    if (st.inf) svg.append(s('text', { class: 'ac-big ac-halo', x: 0.6 * r0, y: 1.6 * r0 }, t('cInf')));
    var sx = 0.6 * r0, sy = H - 0.8 * r0;
    svg.append(s('line', { class: 'ac-scale', x1: sx, x2: sx + 2 * sc, y1: sy, y2: sy }));
    svg.append(s('text', { class: 'ac-halo', x: sx + sc, y: sy - 0.4 * r0, 'text-anchor': 'middle' }, t('scale')));

    box.replaceChildren(svg);
  }

  // ── a plot of one component at both probes over 0 … T_END, with the time now ──
  function drawPlot(box, data, key, title, now, symmetric) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem();
    var max = 0;
    data.forEach(function (d) { max = Math.max(max, Math.abs(d[key][0]), Math.abs(d[key][1])); });
    if (max === 0) max = 1;
    max *= 1.12;
    var y0 = symmetric ? -max : 0, y1 = max;
    var pad = { l: 3.6 * r0, r: 0.6 * r0, t: 2.2 * r0, b: 1.4 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (v) { return pad.l + (v / L.T_END) * cw; }, Y = function (v) { return pad.t + ch * (1 - (v - y0) / (y1 - y0)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'ac-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [0, 10, 20, 30, 40].forEach(function (v) {
      if (v) svg.append(s('line', { class: 'ac-grid', x1: X(v), x2: X(v), y1: pad.t, y2: pad.t + ch }));
      if (v < 40) svg.append(s('text', { x: X(v), y: H - 0.15 * r0, 'text-anchor': 'middle' }, num(v, 0)));
    });
    svg.append(s('text', { x: pad.l + cw, y: H - 0.15 * r0, 'text-anchor': 'end' }, t('plotT')));
    var top = max / 1.12;
    [y0 === 0 ? 0 : -top, symmetric ? 0 : null, top].forEach(function (v) {
      if (v === null) return;
      if (v === 0) svg.append(s('line', { class: 'ac-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
      else svg.append(s('line', { class: 'ac-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) }));
      svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(v) + 0.32 * r0, 'text-anchor': 'end' }, field(v)));
    });
    svg.append(s('text', { class: 'ac-title', x: pad.l, y: pad.t - 0.95 * r0 }, subSvg(title)));
    [1, 0].forEach(function (i) {
      svg.append(s('polyline', { class: i ? 'ac-s2' : 'ac-s1', points: data.map(function (d) { return X(d.t).toFixed(1) + ',' + Y(d[key][i]).toFixed(1); }).join(' ') }));
    });
    svg.append(s('line', { class: 'ac-now', x1: X(now), x2: X(now), y1: pad.t, y2: pad.t + ch }));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    var a = st.probes[0], b = st.probes[1];
    var osc = st.motion === 'osc';
    function row(label, va, vb, ratio, key) {
      return h('tr', { class: key ? 'ac-key' : null }, h('th', { scope: 'row' }, subHtml(label)),
        h('td', null, field(va)), h('td', null, field(vb)), h('td', { class: 'ac-ratio' }, ratio == null ? '' : ratio));
    }
    var ratioPeak = st.ratioPeak == null ? t('dash') : num(st.ratioPeak, 2);
    return h('table', { class: 'ac-table' },
      h('thead', null, h('tr', null, h('th', null, ''),
        h('th', null, h('span', { class: 'ac-mk ac-mk1' }), t('colP1')),
        h('th', null, h('span', { class: 'ac-mk ac-mk2' }), t('colP2')),
        h('th', null, t('colRatio')))),
      h('tbody', null,
        row(t('rowEr'), a.Er, b.Er, num(st.ratioEr, 2), true),
        row(t('rowEt'), a.Et, b.Et, null),
        row(t('rowCB'), a.cB, b.cB, null),
        row(t(osc ? 'rowPeakOsc' : 'rowPeak'), a.peak, b.peak, ratioPeak, true)));
  }

  // ── play: time runs. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false, playT = 0;
  var RATE = 5;                                                        // ns of model time per second
  function every() { return Simdeck.reducedMotion() ? 1000 : 50; }    // ms between frames; jumps under reduced motion
  function setT(v) {
    v = Math.max(0, Math.min(L.T_END, Math.round(v / L.TIME_STEP) * L.TIME_STEP));
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      var dt = Simdeck.reducedMotion() ? 2 : ((now - lastT) / 1000) * RATE;
      lastT = now;
      if (sim.params.t >= L.T_END) { stop(); return; }
      playT = Math.min(L.T_END, playT + dt);
      setT(playT);
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() {
    if (sim.params.t >= L.T_END) setT(0);
    playing = true; playT = sim.params.t; lastT = performance.now(); playLabel(); requestAnimationFrame(frame);
  }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'motion', type: 'choice', label: t('motion'),
        options: [['start', t('m_start')], ['stop', t('m_stop')], ['move', t('m_move')], ['osc', t('m_osc')]] },
      { key: 'c', type: 'choice', label: t('c'), options: [['finite', t('c_finite')], ['inf', t('c_inf')]] },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: L.T_END, step: L.TIME_STEP, visible: function () { return false; } },
      { key: 'beta', type: 'range', label: t('beta'), min: 0.1, max: 0.4, step: 0.05,
        format: function (v) { return t('betaVal', { v: num(v, 2) }); } },
      { key: 'tau', type: 'range', label: t('tau'), min: 1, max: 6, step: 0.5, format: function (v) { return ns(v); },
        disabled: function (q) { return q.motion === 'osc' ? t('tauOff') : false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'ac-line', label: t('legendLine') },
      { shape: 'ac-charge', label: t('legendCharge') },
      { shape: 'ac-shell', label: t('legendShell') },
      { shape: 'ac-p1', label: t('legendP1') },
      { shape: 'ac-p2', label: t('legendP2') }
    ],

    render: function (c) {
      var pic = h('div', { class: 'ac-pic' }), pEt = h('div', { class: 'ac-plot' }), pEr = h('div', { class: 'ac-plot' });
      c.stage.replaceChildren(h('div', { class: 'ac' }, pic,
        h('div', { class: 'ac-side' }, table(c.state), h('p', { class: 'ac-units' }, t('units')), pEt, pEr)));
      drawPicture(pic, c);
      var data = seriesOf(c.params);
      drawPlot(pEt, data, 'Et', t('plotEt'), c.params.t, true);
      drawPlot(pEr, data, 'Er', t('plotEr'), c.params.t, false);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var a1 = st.arrivals[0][0], a2 = st.arrivals[1][0];
      var vars = {
        t: b(ns(st.t)), ratio: b(st.ratioPeak == null ? t('dash') : num(st.ratioPeak, 2)), ratioR: b(num(st.ratioEr, 2)),
        A: b(metres(st.amplitude || 0)), lambda: b(metres(st.wavelength)), v: b(t('betaVal', { v: num(st.beta, 2) }))
      };
      if (st.inf) return t.parts(st.motion === 'osc' ? 'cap_inf_osc' : 'cap_inf_push', vars);
      if (st.motion === 'osc') return t.parts('cap_osc', vars);
      if (st.fronts.length === 0) {
        vars.dt = b(ns(L.T0 - st.t));
        vars.d = b(metres(st.distance || 0));
        return t.parts('cap_before_' + st.motion, vars);
      }
      var parts, latest = st.fronts[st.fronts.length - 1];
      if (!latest.done) {                       // a push is on: the whole disc is the shell, no inside yet
        return t.parts('cap_push', Object.assign(vars, { what: t('w_' + latest.what), r: b(metres(latest.outer)) }));
      }
      if (st.motion === 'move' && st.fronts.length === 2) {
        vars.r1 = b(metres(st.fronts[0].outer)); vars.r2 = b(metres(st.fronts[1].outer));
        parts = t.parts('cap_move', vars);
      } else {
        var f = st.fronts[st.fronts.length - 1];
        vars.what = t('w_' + f.what); vars.r = b(metres(f.outer));
        parts = t.parts('cap_travel', vars);
      }
      var s1 = st.probes[0].stage, s2 = st.probes[1].stage, key;
      if (s1 === 'inside') { key = 'p_in1'; vars.et = b(field(st.probes[0].Et)); vars.er = b(field(st.probes[0].Er)); }
      else if (s2 === 'inside') { key = 'p_in2'; vars.et = b(field(st.probes[1].Et)); vars.er = b(field(st.probes[1].Er)); }
      else if (st.ratioPeak != null) key = 'p_done';
      else if (s1 === 'before') key = 'p_wait';
      else key = st.motion === 'move' ? 'p_mid_move' : 'p_mid';
      vars.a1 = b(ns(Math.round(a1.begin * 10) / 10)); vars.a2 = b(ns(Math.round(a2.begin * 10) / 10));
      return parts.concat([' '], t.parts(key, vars));
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: L.T_END, step: L.TIME_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 1) }));
    count.textContent = t('tNow', { v: num(v, 1) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A hand change while playing carries on from there; a preset stops the clock.
  sim.on(function () {
    if (playing && !ownSet && sim.preset) stop();
    else if (playing && !ownSet) playT = sim.params.t;
  });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by one step here,
  // Home and End to its ends (arrows stay with a focused slider or choice; PgDn and PgUp always step, as on a clicker).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(L.T_END); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.TIME_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
