<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVGNS = 'http://www.w3.org/2000/svg';
  var CLIENT = 'demosrv1', SERVER = '161.53.78.71';

  /** Data (numbers, names, timestamps) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'ns-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text, '')); }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  /** t.parts, with a placeholder node used twice cloned (appending the same node twice would move it). */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (p) {
      if (typeof p === 'string' || p.nodeType === 3) return p;
      var out = seen.indexOf(p) >= 0 ? p.cloneNode(true) : p;
      seen.push(p);
      return out;
    });
  }
  function svg(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) e.appendChild(arguments[i]);
    return e;
  }

  // ── numbers: exact, from µs; decimal comma in Croatian ──

  function dec(s) { return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  /** Seconds from µs: three decimals, more only when the value needs them. sign: '+' on positive values. */
  function sec(us, sign) {
    var a = Math.abs(us), d = a % 1000 === 0 ? 3 : a % 100 === 0 ? 4 : a % 10 === 0 ? 5 : 6;
    var s = dec((a / 1e6).toFixed(d));
    return (us < 0 ? '−' : sign && us > 0 ? '+' : '') + s;
  }
  /** Milliseconds from µs (one decimal when needed). */
  function ms(us) { var a = Math.abs(us); return (us < 0 ? '−' : '') + dec(a % 1000 === 0 ? String(a / 1000) : (a / 1000).toFixed(1)); }
  /** A duration from µs: "200 s", "2 h 46 min 40 s". */
  function dur(us) {
    var s = Math.round(us / 1e6);
    if (s < 600) return s + ' s';
    var hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    return [hh ? hh + ' h' : '', mm ? mm + ' min' : '', ss ? ss + ' s' : ''].filter(Boolean).join(' ');
  }
  /** A value inside a formula: negative ones in parentheses, so "− (−1,990)" reads right. */
  function term(us) { return us < 0 ? '(' + sec(us) + ')' : sec(us); }
  function calcText(T) { return '((' + term(T.T2) + ' − ' + term(T.T1) + ') + (' + term(T.T3) + ' − ' + term(T.T4) + ')) / 2'; }
  function delayText(T) { return '(' + term(T.T4) + ' − ' + term(T.T1) + ') − (' + term(T.T3) + ' − ' + term(T.T2) + ')'; }

  /** A clock face: the hand shows the fraction of the second (one turn = 1 s). */
  function dial(us) {
    var f = ((us % 1e6) + 1e6) % 1e6 / 1e6, a = f * 2 * Math.PI;
    var ticks = [0, 1, 2, 3].map(function (k) {
      var b = k * Math.PI / 2;
      return svg('line', { class: 'ns-tick', x1: 20 + 13 * Math.sin(b), y1: 20 - 13 * Math.cos(b), x2: 20 + 16 * Math.sin(b), y2: 20 - 16 * Math.cos(b) });
    });
    var e = svg('svg', { class: 'ns-dial', viewBox: '0 0 40 40', 'aria-hidden': 'true' }, svg('circle', { cx: 20, cy: 20, r: 17.5 }));
    ticks.forEach(function (x) { e.appendChild(x); });
    e.appendChild(svg('line', { class: 'ns-hand', x1: 20, y1: 20, x2: (20 + 13 * Math.sin(a)).toFixed(2), y2: (20 - 13 * Math.cos(a)).toFixed(2) }));
    return e;
  }

  // ── exchange mode: the chart (K1) ──

  function exchangeOf(s) { return s.phase === 'next' ? s.next : s.planned; }

  function clientCard(c) {
    var s = c.state, k = s.clock, changedClock = s.phase === 'correct' && k.mode === 'step';
    var st = s.stratum.client;
    var stLine = h('p', { class: s.phase === 'correct' && s.stratum.was !== st ? 'sd-changed' + anim(c) : null },
      data('stratum ' + st, ''), st === L.UNSYNC ? [' · ', t('unsync')] : null);
    var mode = null;
    if (k.mode === 'step') mode = h('p', null, t('cardStep'), ' ', data(sec(s.planned.offset, true) + ' s'));
    else if (k.mode === 'slew') mode = h('p', null, t('cardSlewFor', { took: dur(k.took) }));
    return h('div', { class: 'ns-card' },
      h('div', { class: 'ns-clock' + (changedClock ? ' sd-changed' + anim(c) : '') }, dial(k.value), data(sec(k.value) + ' s', 'ns-read')),
      stLine, mode);
  }
  function serverCard(c) {
    var s = c.state;
    return h('div', { class: 'ns-card' },
      h('div', { class: 'ns-clock' }, dial(s.clock.server), data(sec(s.clock.server) + ' s', 'ns-read')),
      h('p', null, data('stratum 1', ''), ' · ', t('refClock')));
  }

  function exchangeRows(c) {
    var s = c.state, n = s.n, rows = [];
    var x = s.planned, T = x.t;
    // the chip names the message and the timestamps it carries; the receiver's word is the timestamp it takes

      { key: 'next', type: 'toggle', label: t('pNext'), visible: isEx },
      { key: 'down', type: 'choice', label: t('pDown'), visible: isChain,
        options: [['none', t('downNone')], ['one', data('.71', '')], ['both', t('downBoth')], ['all', t('downAll')]] }
    ],

    presets: [
      { id: 'symmetric', label: t('presetSym'), hint: t('presetSymHint'), params: { mode: 'exchange' } },
      { id: 'asymmetric', label: t('presetAsym'), hint: t('presetAsymHint'), params: { mode: 'exchange', dOut: 30 } },
      { id: 'boot-step', label: t('presetBoot'), hint: t('presetBootHint'), params: { mode: 'exchange', trueOffset: 5000, next: true } },
      { id: 'late-slew', label: t('presetLate'), hint: t('presetLateHint'), params: { mode: 'exchange', trueOffset: 5000, updateNo: 10, next: true } },
      { id: 'stratum-chain', label: t('presetChain'), hint: t('presetChainHint'), params: { mode: 'chain' } }
    ],

    legend: [
      { shape: 'line', label: t('legArrow') },
      { shape: 'stamp-c', label: t('legStampC') },
      { shape: 'stamp-s', label: t('legStampS') },
      { shape: 'jump', label: t('legJump') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state, chart, root;
      if (s.mode === 'chain') {
        chart = renderChainChart(c);
        root = h('div', { class: 'ns', dataset: { mode: 'chain' } },
          h('div', { class: 'ns-col' }, chart),
          h('div', { class: 'ns-col' }, renderSources(c), renderChain(c)));
      } else {
        chart = renderExchangeChart(c);
        root = h('div', { class: 'ns', dataset: { mode: 'exchange' } },
          h('div', { class: 'ns-col' }, chart),
          h('div', { class: 'ns-col' }, renderScale(c)),
          h('div', { class: 'ns-col' }, renderCalc(c), renderCorr(c)));
      }
      c.stage.replaceChildren(root);
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
