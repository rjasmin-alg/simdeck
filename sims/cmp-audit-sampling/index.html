<!-- cmp-audit-sampling: an auditor tests a sample of a control's occurrences; the chance of finding at least one
     failure is 1 − (1 − rate)ⁿ, so 25 misses a 2 % failure rate about 60 % of the time; how often a control runs sets
     the usual sample; one exception means a larger sample or a finding; "no exceptions" is not "no failures".
     The stage: the population grid (failed items hatched, the last sample filled, exceptions highlighted), beside it
     the last sample's conclusion against the truth, the tally of every sample drawn against the exact chance, the
     numbers (formula, exact, size for 95 %, the bound) and the usual sample by frequency.
     Sampling: sampling.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (1 000 / 1,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  function pct(n) { return t('pct', { n: String(n) }); }
  /** A rate in tenths of a percent: 20 → "2 %", 83 → "8,3 %". */
  function rate10(x) {
    var s = x % 10 === 0 ? String(x / 10) : (x / 10).toFixed(1);
    return pct(Simdeck.lang === 'hr' ? s.replace('.', ',') : s);
  }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function items(freq, n) { return t.n('item_' + freq, n, { n: group(n) }); }
  function usual(f) { var u = L.USUAL[f]; return u[0] === u[1] ? String(u[0]) : u[0] + '–' + u[1]; }

  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // the row to give focus back to after a render (keyboard)

  // ── the population grid ──

  var COLS = { quarterly: 2, monthly: 4, weekly: 8, daily: 16, multi: 32 };   // ⌈√N⌉: a square grid

  function grid(s, anim) {
    var cols = COLS[s.p.freq], rows = Math.ceil(s.N / cols);
    var bad = new Set(s.failed), inS = new Set(s.last ? s.last.idx : []);
    var cells = [];
    for (var i = 0; i < s.N; i++) {
      var sampled = inS.has(i), failed = bad.has(i);
      var k = sampled ? (failed ? 'exc' : 'ok') : (failed ? 'bad' : 'not');
      cells.push(h('span', {
        class: 'as-cell' + (sampled && anim ? ' sd-anim-in' : ''), dataset: { k: k }, 'aria-hidden': 'true'
      }));
    }
    var head = [h('span', null, t('gridHead', { pop: items(s.p.freq, s.N) })), ' · ',
      s.k ? h('span', { class: 'as-failed' }, t('failedN', { k: group(s.k), r: rate10(s.rate10) })) : h('span', null, t('failedNone'))];
    return h('div', { class: 'as-pop' },
      h('p', { class: 'as-pophead', translate: 'no' }, head),
      h('div', { class: 'as-gridbox' },
        h('div', { class: 'as-grid', dataset: { dense: String(s.N > 400), n: String(s.N) },
          style: { '--cols': String(cols), '--rows': String(rows) } }, cells)));
  }

  // ── the side ──

  function lastCard(s) {
    var kids = [h('p', { class: 'as-head' }, t('lastHead'))];
    if (!s.last) kids.push(h('p', { class: 'as-muted' }, t('noSample')));
    else {
      var x = s.last;
      kids.push(
        h('p', { translate: 'no' }, t('lastChecked', { n: group(s.n), N: group(s.N), x: t.n('exc', x.x, { n: x.x }) })),
        h('p', { class: 'as-concl', dataset: { v: x.verdict } }, t(x.verdict === 'extend' && s.all ? 'c_extendAll' : 'c_' + x.verdict)),
        h('p', { class: 'as-truth' },
          h('span', { translate: 'no' }, t('truthLine', { failed: s.k ? t('failedN', { k: group(s.k), r: rate10(s.rate10) }) : t('failedNone') })),
          h('span', { class: 'as-out', dataset: { o: x.outcome } }, t('o_' + x.outcome))));
    }
    return h('div', { class: 'as-card' }, kids);
  }

  function tallyCard(s) {
    var kids = [h('p', { class: 'as-head' }, t('allHead', { n: group(s.draws) }))];
    if (s.draws < 2) kids.push(h('p', { class: 'as-muted' }, t('noDraws')));
    else {
      kids.push(h('p', { translate: 'no' }, t('foundLine', { f: group(s.found), fp: pct(s.foundPct), ep: pct(s.expPct.found) })));
      var exp = [s.expPct.p0, s.expPct.p1, s.expPct.p2];
      var rows = [];
      [0, 1, 2].forEach(function (i) {
        var p = s.histPct[i], what = t('b' + i);
        rows.push(
          h('span', { class: 'as-bl' }, what),
          h('span', { class: 'as-track', role: 'img',
            'aria-label': t('barLabel', { what: what, c: group(s.hist[i]), p: pct(p), e: pct(exp[i]) }) },
            h('span', { class: 'as-fill', dataset: { b: String(i) }, style: { width: (100 * s.hist[i] / s.draws) + '%' } }),
            h('span', { class: 'as-tick', style: { left: (100 * [s.exact.p0, s.exact.p1, s.exact.p2][i]) + '%' } })),
          h('span', { class: 'as-bv as-num', translate: 'no' }, group(s.hist[i]) + ' · ' + pct(p)));
      });
      kids.push(h('div', { class: 'as-bars' }, rows));
    }
    return h('div', { class: 'as-card' }, kids);
  }

  function numbersCard(s) {
    var kids = [h('p', { class: 'as-head' }, t('numHead'))];
    if (s.k) {
      kids.push(
        h('p', { translate: 'no' }, t.parts('formulaLine', { r: rate10(s.rate10), n: h('sup', null, String(s.n)), p: b(pct(s.formula)) })),
        h('p', { translate: 'no' }, t.parts('exactLine', { N: group(s.N), p: b(pct(s.expPct.found)) })),
        h('p', { translate: 'no' }, t.parts('needLine', { m: b(group(s.need)) })));
    } else kids.push(h('p', null, t('needNone')));
    // the bound is the large-population one; when every item is tested there is nothing left to bound
    if (!s.all) kids.push(h('p', { translate: 'no' }, t.parts('boundLine', { n: group(s.n), b: b(pct(s.bound)) })));
    return h('div', { class: 'as-card' }, kids);
  }

  function table(s) {
    var rows = [h('div', { class: 'as-tr as-th', 'aria-hidden': 'true' },
      h('span', null, t('colFreq')), h('span', null, t('colPop')), h('span', null, t('colUsual')), h('span'))];
    L.FREQS.forEach(function (f) {
      var on = f === s.p.freq, sel = 'freq-' + f;
      rows.push(h('button', {
        type: 'button', class: 'as-tr', 'aria-pressed': String(on), dataset: { sel: sel }, onmousedown: noFocus,
        'aria-label': t('rowLabel', { f: t('f_' + f), pop: items(f, L.POP[f]) }),
        onclick: function (e) { refocus = e.detail === 0 ? sel : null; sim.set({ freq: f }); }
      },
        h('span', null, t('f_' + f)),
        h('span', { class: 'as-num', translate: 'no' }, group(L.POP[f])),
        h('span', { class: 'as-num', translate: 'no' }, usual(f)),
        on ? h('span', { class: 'as-band as-num', dataset: { band: s.band } }, t('band_' + s.band, { n: group(s.n) })) : h('span')));
    });
    return h('div', { class: 'as-table' }, h('p', { class: 'as-head' }, t('tabHead')), rows);
  }

  // ── render and caption ──

  var lastKey = null;
  function render(c) {
    var s = c.state;
    var key = JSON.stringify(c.params);
    var anim = lastKey !== null && key !== lastKey;
    lastKey = key;
    c.stage.replaceChildren(h('div', { class: 'as' },
      grid(s, anim),
      h('div', { class: 'as-side' }, lastCard(s), tallyCard(s), numbersCard(s), table(s),
        h('p', { class: 'as-foot' }, t('foot')))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state;
    var k = L.captionKey(s);
    var out = t.parts(k.key, {
      pop: items(s.p.freq, s.N), k: b(group(s.k)), r: b(rate10(s.rate10)), n: b(group(s.n)), N: b(group(s.N)),
      x: b(s.last ? s.last.x : 0), d: b(group(s.draws)), f: b(group(s.found)), fp: b(pct(s.foundPct || 0)),
      ep: b(pct(s.expPct.found)), fm: b(pct(s.formula)), m: b(group(s.draws - s.found))
    });
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, { u: b(usual(s.p.freq)), f: t('f_' + s.p.freq), m: b(group(s.draws - s.found)), k: b(group(s.k)) }));
    });
    return out;
  }

  var labels = { 'one-sample': 'pOneSample', many: 'pMany', clean: 'pClean', 'bad-control': 'pBadControl', sure: 'pSure', monthly: 'pMonthly' };
  var R = L.RANGES;
  function full(p) { return p.draws >= L.DRAWS_MAX ? t('drawsFull') : false; }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'freq', type: 'choice', label: t('freq'), options: L.FREQS.map(function (f) { return [f, group(L.POP[f])]; }) },
      { key: 'rate', type: 'range', label: t('rate'), min: R.rate[0], max: R.rate[1], step: 1, format: pct },
      { key: 'n', type: 'range', label: t('n'), min: 1, max: function (p) { return L.nMax(p.freq); }, step: 1, format: group },
      { key: 'draws', type: 'range', label: t('draws'), min: R.draws[0], max: R.draws[1], step: 1, format: group },
      // the seed: "New population" adds 1; hidden, kept in the URL
      { key: 'seed', type: 'range', label: t('newPop'), min: R.seed[0], max: R.seed[1], step: 1, visible: function () { return false; } },
      { type: 'button', label: t('drawOne'), key: 'd', disabled: full, run: function (api) {
        api.set({ draws: L.more(api.params.draws, 1) });
      } },
      { type: 'button', label: t('drawMany'), key: 'm', disabled: full, run: function (api) {
        api.set({ draws: L.more(api.params.draws, 100) });
      } },
      { type: 'button', label: t('newPop'), key: 'n', run: function (api) {
        api.set({ seed: L.nextSeed(api.params.seed) });
      } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'as-not', label: t('legNot') },
      { shape: 'as-bad', label: t('legFailed') },
      { shape: 'as-ok', label: t('legOk') },
      { shape: 'as-exc', label: t('legExc') },
      { shape: 'as-tick', label: t('legExp') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
