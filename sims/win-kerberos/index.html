<!-- win-kerberos: ana on PC07 opens \\fs01\projects. AS exchange (pre-authentication, a TGT locked with the krbtgt
     key), TGS exchange (a service ticket locked with FS01$'s key), AP exchange (FS01 opens the ticket itself). Every
     request carries the client's time; more than 5 minutes off the receiver's clock fails with KRB_AP_ERR_SKEW.
     A stepper, one message or one check per step. Drawn with kit view K1 (message sequence chart, kit/sequence.js):
     three lanes whose cards hold each party's clock and keys. Beside the chart the message card (each ticket as a box
     with a padlock naming the key that locks it, each authenticator as a small clock card) and PC07's ticket cache.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { pc: '1', kdc: '2', fs: '3' };
  var MARK = { pc: 'P', kdc: 'K', fs: 'F' };

  /** Data (names, SPNs, times, codes) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'kb-mono' : cls || null }, String(text)); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function two(v) { return (v < 10 ? '0' : '') + v; }
  /** Seconds since midnight of the logon day → "HH:MM:SS", with "+N d" past midnight. */
  function clock(sec) {
    var d = Math.floor(sec / 86400), r = sec - d * 86400;
    var s = two(Math.floor(r / 3600)) + ':' + two(Math.floor(r % 3600 / 60)) + ':' + two(r % 60);
    return d ? s + ' ' + t('plusDays', { d: d }) : s;
  }
  /** A skew in seconds → "+4 min", "−7 min", "0 min". */
  function skewText(sec) {
    var m = Math.round(sec / 60);
    return t('min', { v: (m > 0 ? '+' : m < 0 ? '−' : '') + Math.abs(m) });
  }
  function q(text) { return h('b', { translate: 'no' }, text); }

  // ── keys ──
  var SESSION = { skTgs: 'skTgs', skFs: 'skFs' };
  function keyLabel(k) { return SESSION[k] ? t(k) : data(k, ''); }
  function lock(k) { return h('span', { class: 'kb-lock' }, h('span', { class: 'sd-seq-lock', 'aria-hidden': 'true' }), keyLabel(k)); }
  /** Who can open something locked with key k. */
  var OPENS = { krbtgt: 'whoKdc', ana: 'whoPcKdc', 'FS01$': 'whoFsKdc', skTgs: 'whoPcKdc', skFs: 'whoPcFs' };
  function keysLine(c, lane) {
    var s = c.state, e = c.n > 0 ? s.log[s.log.length - 1] : null;
    var used = (e && e.used && e.used[lane]) || [], added = (e && e.added && e.added[lane]) || [];
    return h('div', { class: 'kb-line' }, s.keys[lane].map(function (k) {
      var ds = {};
      if (SESSION[k]) ds.session = '';
      if (used.indexOf(k) >= 0) ds.used = '';
      var isNew = added.indexOf(k) >= 0;
      return h('span', { class: 'kb-key' + (isNew ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''), dataset: ds },
        keyLabel(k), k === 'ana' && lane === 'pc' ? h('span', { class: 'kb-sub' }, t('fromPassword')) : null);
    }));
  }

  // ── lanes ──
  function lanes(c) {
    var s = c.state, e = c.n > 0 ? s.log[s.log.length - 1] : null;
    return L.LANES.map(function (id) {
      var role = { pc: 'rolePc', kdc: 'roleKdc', fs: 'roleFs' }[id];
      var name = { pc: 'lanePc', kdc: 'laneKdc', fs: 'laneFs' }[id];
      var active = e && (e.kind === 'check' ? e.at === id : e.from === id || e.to === id);
      var roleLine = [h('span', { class: 'kb-sub' }, t(role))];
      if (id === 'kdc') {
        ['as', 'tgs'].forEach(function (half) {
          roleLine.push(h('span', { class: 'kb-half', dataset: e && e.half === half && active ? { on: '' } : {} }, t(half === 'as' ? 'halfAs' : 'halfTgs')));
        });
      }
      var clockLine = [h('span', { class: 'kb-sub' }, t('clock')), data(clock(s.clocks[id]), 'kb-clock')];
      if (id === 'pc') {
        var sk = s.clocks.pc - s.clocks.kdc;
        clockLine.push(h('span', { class: 'kb-skew', translate: 'no', dataset: L.skewOk(s.clocks.pc, s.clocks.kdc) ? {} : { bad: '' } }, skewText(sk)));
      }
      return { id: id, mark: MARK[id], c: COLOUR[id], shape: id === 'pc' ? 'square' : null, name: t(name), state: active ? 'active' : null,
        body: [h('div', { class: 'kb-line' }, roleLine), h('div', { class: 'kb-line' }, clockLine), keysLine(c, id)] };
    });
  }

  // ── chart rows ──
  function fieldsOf(e) {
    // the error's number only: the name is in the message card and the caption (a long name runs over the lanes)
    if (e.name === 'KRB-ERROR') return data(String(e.code), '');
    if (e.name === 'AS-REQ') return h('span', null, data('ana', ''), ' ', h('span', { class: 'kb-face', 'aria-hidden': 'true' }));
    if (e.name === 'TGS-REQ') return h('span', null, lock('krbtgt'), ' ', data('+ SPN', ''));
    if (e.name === 'AP-REP') return h('span', null, t('fAccess'));
    var tk = e.carries && e.carries.filter(function (x) { return x.type === 'ticket'; })[0];
    return tk ? lock(tk.lock) : null;
  }
  function timeOf(s, e) {
    var lane = e.kind === 'check' ? e.at : e.from;
    return clock(s.clocks[lane]);
  }
  function rows(c) {
    var s = c.state, out = [];
    s.log.forEach(function (e) {
      var changed = e.n === c.n;
      if (e.kind === 'check') {
        var text = [h('span', { class: 'kb-dia', dataset: e.ok ? { ok: '' } : {}, 'aria-hidden': 'true' }),
          t.parts(e.at === 'fs' && e.ok ? 'noteFsOk' : e.ok ? 'noteCheckOk' : 'noteCheckBad', { skew: data(skewText(e.skew), '') })];
        out.push({ kind: 'note', lane: e.at, text: h('span', null, text), k: e.ok ? 'solid' : 'fill', time: timeOf(s, e), changed: changed });
        return;
      }
      out.push({ from: e.from, to: e.to, label: e.name, c: COLOUR[e.from], fields: fieldsOf(e), line: e.name === 'KRB-ERROR' ? 'dashed' : null,
        time: timeOf(s, e), changed: changed });
      if (e.ntlm) out.push({ kind: 'note', lane: 'pc', text: t('noteNtlm'), k: 'solid', time: timeOf(s, e), changed: changed });
    });
    return out;
  }
  function renderChart(c) {
    var chart = Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(c),
      rows: rows(c),
      timeWidth: '6.4rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
    return chart;
  }

  // ── message card ──
  function ticketBox(x, changed) {
    var title = x.type === 'part' ? t('part') : t(x.what === 'tgt' ? 'tgt' : 'st');
    var items = [];
    (x.holds || []).forEach(function (k) {
      items.push(h('li', null, t({ skTgs: 'holdsSkTgs', skFs: 'holdsSkFs', pac: 'holdsPac', time: 'holdsTime' }[k])));
    });
    if (x.spn && x.type === 'ticket') items.push(h('li', null, data(x.spn, '')));
    if (x.expires !== undefined) items.push(h('li', null, t.parts('validTo', { t: data(clock(x.expires), '') })));
    if (x.renewTill !== undefined) items.push(h('li', null, t.parts('renewTo', { t: data(clock(x.renewTill), '') })));
    return h('div', { class: 'kb-ticket' + (changed ? ' sd-changed' : ''), dataset: { what: x.type } },
      h('div', { class: 'kb-thead' }, h('b', null, title), lock(x.lock)),
      items.length ? h('ul', null, items) : null,
      h('div', { class: 'kb-sub' }, t('opens', { who: t(OPENS[x.lock]) })));
  }
  function authCard(x) {
    return h('div', { class: 'kb-auth' }, h('b', null, t('auth')),
      h('span', null, h('span', { class: 'kb-face', 'aria-hidden': 'true' }), ' ', data(clock(x.time), '')), lock(x.lock));
  }
  function checkList(e) {
    var li = [];
    function row(ok, content) {
      li.push(h('li', { dataset: ok ? {} : { bad: '' } }, h('span', { class: 'kb-dia', dataset: ok ? { ok: '' } : {}, 'aria-hidden': 'true' }), h('span', null, content)));
    }
    var skewOk = e.error !== 'KRB_AP_ERR_SKEW' && (e.at !== 'kdc' || e.ok);
    var skewLine = t.parts(skewOk ? 'checkSkewOk' : 'checkSkewBad', { skew: data(skewText(e.skew), '') });
    row(true, t.parts(e.at === 'kdc' ? 'checkOpenTime' : 'checkOpenTicket', { key: lock(e.at === 'kdc' ? 'ana' : 'FS01$') }));
    row(skewOk, skewLine);
    if (e.at === 'fs') {
      if (e.error !== 'KRB_AP_ERR_SKEW') { row(!e.error, t('checkReplay')); row(true, t('checkToken')); }
    }
    return h('ul', { class: 'kb-checks' }, li);
  }
  function renderMsg(c) {
    var s = c.state, e = s.log[s.log.length - 1];
    var box = h('section', { class: 'kb-box kb-msg' });
    if (!e) { box.append(h('h2', null, t('msgNone'))); return box; }
    var fresh = c.n === e.n;
    var head = e.kind === 'check' ? h('b', { class: 'kb-chip sd-fill', dataset: { c: COLOUR[e.at] } }, t('msgCheck'))
      : h('b', { class: 'kb-chip sd-fill' + (fresh && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { c: COLOUR[e.from] }, translate: 'no' }, e.name);
    box.append(h('h2', null, t('msgTitle', { n: e.n }), ' ', head,
      e.kind === 'check' ? h('span', { class: 'kb-verdict', dataset: e.ok ? {} : { bad: '' } }, t(e.ok ? 'checkOk' : 'checkBad')) : null));
    var items = h('div', { class: 'kb-items' });
    if (e.kind === 'check') items.append(checkList(e));
    if (e.name === 'AS-REQ') items.append(h('dl', { class: 'kb-kv' }, h('dt', null, t('user')), h('dd', null, data('ana@QUILLMOOR.EXAMPLE', ''))));
    (e.carries || []).forEach(function (x) {
      if (x.type === 'ticket' || x.type === 'part') items.append(ticketBox(x, fresh && x.fresh));
      else if (x.type === 'auth') items.append(authCard(x));
      else if (x.type === 'spn') items.append(h('dl', { class: 'kb-kv' }, h('dt', null, t('spn')), h('dd', null, data(x.spn, ''))));
    });
    if (e.name === 'KRB-ERROR') {
      items.append(h('dl', { class: 'kb-kv' }, h('dt', null, t('errCode')), h('dd', null, data(e.error + ' (' + e.code + ')', ''))));
      if (e.ntlm) items.append(h('p', { class: 'kb-note' }, t('noteNtlm')));
    }
    if (e.fromCache) items.append(h('p', { class: 'kb-note' }, t('fromCache')));
    box.append(items);
    return box;
  }

  // ── PC07's ticket cache ──
  function renderCache(c) {
    var s = c.state, now = s.clocks.kdc, e = c.n > 0 ? s.log[s.log.length - 1] : null;
    var box = h('section', { class: 'kb-box kb-cache' },
      h('h2', null, t('cacheTitle'), h('span', { class: 'kb-muted' }, t.parts('cacheAt', { t: data(clock(now), '') }))));
    var list = h('ul', { class: 'kb-rows' });
    var rowsOut = [];
    if (s.cache.tgt) rowsOut.push({ name: 'krbtgt/QUILLMOOR.EXAMPLE', lock: 'krbtgt', tk: s.cache.tgt, label: t('tgt'), isNew: e && e.issued === 'tgt' });
    Object.keys(s.cache.st).sort().forEach(function (spn) {
      rowsOut.push({ name: spn, lock: 'FS01$', tk: s.cache.st[spn], label: t('st'), isNew: e && e.issued === 'st' && e.spn === spn });
    });
    if (!rowsOut.length) list.append(h('li', { class: 'kb-sub' }, t('cacheNone')));
    rowsOut.forEach(function (r) {
      var expired = !L.valid(r.tk, now);
      list.append(h('li', { class: 'kb-row' + (r.isNew ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''), dataset: expired ? { expired: '' } : {} },
        h('span', { class: 'kb-row-name' }, data(r.name, '')),
        h('span', { class: 'kb-row-exp' }, expired ? t('cacheExpired') : data(clock(r.tk.expires), '')),
        h('span', { class: 'kb-row-data' }, r.label, ' · ', lock(r.lock))));
    });
    box.append(list);
    return box;
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = c.params, n = c.n;
    if (c.first) {
      var parts;
      if (s.start === 'as-req') {
        parts = s.cache.tgt ? t.parts(p.cached ? 'capStartRenewAll' : 'capStartRenewTgt', { unc: q(s.unc), h: t('hours', { v: p.hoursLater }) })
          : t.parts('capStartAs', { unc: q(s.unc) });
      } else if (s.start === 'tgs-req') parts = t.parts('capStartTgs', { unc: q(s.unc), h: t('hours', { v: p.hoursLater }) });
      else parts = t.parts('capStartAp', { unc: q(s.unc), spn: q(s.spn), exp: q(clock(s.cache.st[s.spn].expires)) });
      return parts;
    }
    var e = s.log[s.log.length - 1];
    var m = Math.abs(Math.round(e.skew / 60));
    switch (e.name || e.at) {
      case 'AS-REQ': return rich('capAsReq', { n: n, time: q(clock(s.clocks.pc)) });
      case 'kdc':
        if (e.ok) return t.parts('capAsOk', { n: n, skew: q(skewText(e.skew)) });
        return t.parts(e.skew > 0 ? 'capAsBadAhead' : 'capAsBadBehind', { n: n, m: q(String(m)) });
      case 'AS-REP': return rich('capAsRep', { n: n });
      case 'TGS-REQ': return rich('capTgsReq', { n: n, time: q(clock(s.clocks.pc)), spn: q(s.spn) });
      case 'TGS-REP': {
        var st = e.carries[0], out = t.parts('capTgsRep', { n: n, skew: q(skewText(e.skew)), spn: q(s.spn), exp: q(clock(st.expires)) });
        if (st.expires < s.clocks.kdc + L.POLICY.stLife) out.push(t('capTgsCapped'));
        return out;
      }
      case 'AP-REQ': {
        var a = rich('capApReq', { n: n, time: q(clock(s.clocks.pc)) });
        if (e.fromCache) a.push(t('capApCached'));
        return a;
      }
      case 'fs':
        if (e.ok) return t.parts('capApOk', { n: n, skew: q(skewText(e.skew)) });
        return t.parts('capApBad', { n: n, m: q(String(m)) });
      case 'AP-REP': return t.parts('capApRep', { n: n, unc: q(s.unc) });
      case 'KRB-ERROR': {
        var prev = s.log[s.log.length - 2];
        if (prev && prev.name === 'TGS-REQ') {
          if (e.error === 'KRB_AP_ERR_SKEW') return t.parts('capTgsSkew', { n: n, m: q(String(m)) });
          return rich('capTgsUnknown', { n: n, spn: q(s.spn) });
        }
        var key = e.from === 'fs' ? 'capErrFs' : s.cache.tgt ? 'capErrAsRenew' : 'capErrAs';
        return t.parts(key, { n: n, code: q(e.error) });
      }
      default: return '';
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'skewMin', type: 'range', label: t('skewMin'), min: -10, max: 10, step: 1, format: function (v) { return skewText(v * 60); } },
      { key: 'byName', type: 'toggle', label: t('byName') },
      { key: 'cached', type: 'toggle', label: t('cached') },
      { key: 'hoursLater', type: 'range', label: t('hoursLater'), min: 0, max: 12, step: 1, format: function (v) { return t('hours', { v: v }); } }
    ],

    presets: [
      { id: 'open-share', label: t('presetOpen'), hint: t('presetOpenHint'), params: {} },
      { id: 'skew-7', label: t('presetSkew7'), hint: t('presetSkew7Hint'), params: { skewMin: 7 } },
      { id: 'skew-4', label: t('presetSkew4'), hint: t('presetSkew4Hint'), params: { skewMin: 4 } },
      { id: 'cached', label: t('presetCached'), hint: t('presetCachedHint'), params: { cached: true, hoursLater: 2 } },
      { id: 'by-ip', label: t('presetByIp'), hint: t('presetByIpHint'), params: { byName: false } }
    ],

    legend: [
      { shape: 'line', label: t('legendMsg') },
      { shape: 'dash', label: t('legendErr') },
      { shape: 'ticket', label: t('legendTicket') },
      { shape: 'auth', label: t('legendAuth') },
      { shape: 'check', label: t('legendCheck') },
      { shape: 'key', label: t('legendKey') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'kb' }, chart, renderMsg(c), renderCache(c)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
