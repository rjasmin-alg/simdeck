(function () {

    lastParams = Object.assign({}, c.params);
    lastState = c.state;

  // ── floor plan ──

  var VIEW = { row3: { x: -8, y: -6, w: 76, h: 34 }, square4: { x: -26, y: -5, w: 92, h: 50 } };
  var SIDE = { row3: { A: 'below', B: 'below', C: 'below' }, square4: { A: 'left', B: 'right', C: 'left', D: 'right' } };

  /** Points along the pair's line; it bows out when another AP sits on the straight line between them. */
  function pairPath(s, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    var blocked = s.aps.some(function (c) {
      if (c === a || c === b) return false;
      var cross = (c.x - a.x) * dy - (c.y - a.y) * dx, dot = (c.x - a.x) * dx + (c.y - a.y) * dy;

    var n = Math.max(2, Math.round(len / 1.6)), pts = [];

    s.aps.forEach(function (a) {
      g.append(svg('circle', { cx: a.x, cy: a.y, r: s.range, class: 'wc-cover', 'data-c': colourOf(a.id) }));
    });
    s.pairs.forEach(function (q) {
      if (q.kind === 'none') return;
      var pts = pairPath(s, apById(s, q.a), apById(s, q.b));
      if (delta.pairs.indexOf(q.a + q.b) >= 0) g.append(svg('polyline', { points: polyline(pts, false), class: 'wc-halo' }));
      g.append(svg('polyline', { points: polyline(pts, q.kind === 'overlap'), class: q.kind === 'cci' ? 'wc-cci' : 'wc-ovl' }));
    });
    // a 10 m scale bar under the building's left corner
    var sy = s.floor.h + (v.y + v.h - s.floor.h) / 2 + 0.6;
    g.append(svg('line', { x1: 0, y1: sy, x2: 10, y2: sy, class: 'wc-scale' }));
    var kids = [g, h('span', { class: 'wc-scalelab', style: pct(11, sy) }, t('scale', { m: 10 }))];
    s.aps.forEach(function (a) {

      var air = s.airtime[a.id];
      kids.push(h('div', { class: 'wc-ap wc-ap-' + SIDE[s.layout][a.id], style: pct(a.x, a.y) },
        h('span', { class: 'wc-dot sd-fill', dataset: { c: c }, translate: 'no',
          'aria-label': t('apAria', { ap: a.id, ch: a.label, lo: num(a.lo), hi: num(a.hi) }) }, a.id),
        h('div', { class: 'wc-info' + (ch ? ' sd-changed' : ''), dataset: { c: c } },
          h('b', null, t.parts('apChannel', { ch: data(a.label) })),
          h('span', { class: 'wc-air' },
            t('airtime'),
            h('span', { class: 'wc-bar', 'aria-hidden': 'true' }, h('span', { class: 'sd-fill', dataset: { c: c }, style: { width: (air * 100) + '%' } })),
            bold(share(s, a.id))),
          s.warned[a.id] ? h('span', { class: 'wc-warn' }, t('corrupt')) : null)));
    });
    var list = h('ul', { class: 'wc-aplist' }, s.aps.map(function (a) {
      return h('li', null, h('span', { class: 'wc-dotsm sd-fill', dataset: { c: colourOf(a.id) }, translate: 'no' }, a.id),
        t.parts('apChannel', { ch: data(a.label) }), ' · ', t('airtime'), ' ', bold(share(s, a.id)),
        s.warned[a.id] ? h('span', { class: 'wc-warn' }, '⚠') : null);
    }));
    return h('section', { class: 'wc-floorcol' },
      h('div', { class: 'wc-h' }, h('span', null, t('floorTitle'))),
      h('div', { class: 'wc-floor', style: { '--ratio': String(v.w / v.h) } }, kids), list);
  }

  function pairsView(s) {
    return h('section', { class: 'wc-pairs' },
      h('div', { class: 'wc-h' }, h('span', null, t('pairsTitle'))),
      h('table', { class: 'wc-table' },
        h('thead', null, h('tr', null, h('th', null, t('colPair')), h('th', null, t('colDist')), h('th', null, t('colHear')), h('th', null, t('colKind')))),
        h('tbody', null, s.pairs.map(function (q) {
          var a = apById(s, q.a), b = apById(s, q.b);
          var kind;
          if (q.kind === 'cci') kind = h('span', { class: 'wc-kind wc-kind-cci' }, t('kindCci'));
          else if (q.kind === 'overlap') kind = h('span', { class: 'wc-kind wc-kind-overlap' }, t('kindOverlap', { mhz: num(q.overlap) }));
          else kind = !q.inRange && L.kindOf(a, b, true) !== 'none' ? t('kindFar') : t('kindNone');
          return h('tr', { class: (q.inRange ? '' : 'wc-far') + (delta.pairs.indexOf(q.a + q.b) >= 0 ? ' sd-changed' : '') },
            h('td', null,
              h('span', { class: 'wc-dotsm sd-fill', dataset: { c: colourOf(q.a) }, translate: 'no' }, q.a), ' ',
              h('span', { class: 'wc-dotsm sd-fill', dataset: { c: colourOf(q.b) }, translate: 'no' }, q.b)),
            h('td', { class: 'wc-num' }, t.parts('dist', { d: data(num(q.dist)) })),
            h('td', null, q.inRange ? t('yes') : t('no')),
            h('td', null, kind));
        }))));
  }

  // ── spectrum ──

  /** Ticks under the strip: the band's 20 MHz channel numbers, then MHz at the edges (and sub-band edges at 5 GHz). */
  var MHZ = { '2.4': [2400, 2420, 2440, 2460, 2483.5], '5': [5150, 5250, 5350, 5470, 5725] };

  function specView(s) {
    var span = s.span, wid = span.hi - span.lo;
    var at = function (f) { return ((f - span.lo) / wid * 100) + '%'; };
    var w = function (lo, hi) { return ((hi - lo) / wid * 100) + '%'; };
    var back = [], labels = [];
    if (s.band === '5') {
      L.SUBBANDS.forEach(function (sb, i) {
        back.push(h('div', { class: 'wc-sub' + (sb.kind === 'dfs' ? ' wc-sub-dfs' : sb.kind === 'closed' ? ' wc-sub-closed' : '') + (i ? ' wc-sub-edge' : ''),
          style: { left: at(sb.lo), width: w(sb.lo, sb.hi) } }));
        var word = sb.kind === 'dfs' ? t('subDfs') : sb.kind === 'closed' ? t('subClosed') : t('subIndoor');
        labels.push(h('span', { class: 'wc-sublab' + (sb.kind === 'dfs' ? '' : ' wc-quiet'), style: { left: at((sb.lo + sb.hi) / 2) } }, word));
      });
    }
    var lanes = [];
    for (var i = 0; i < s.aps.length; i++) lanes.push(h('div', { class: 'wc-lane' }));
    // narrow blocks (5 GHz at 20 MHz) show the letter only; the channel number is on the axis under them
    var narrow = (s.width / wid) < 0.06;
    s.aps.forEach(function (a) {
      var ch = delta.aps.indexOf(a.id) >= 0;
      lanes[a.lane].append(h('div', {
        class: 'wc-block sd-fill' + (ch ? ' sd-changed' : ''), dataset: { c: colourOf(a.id) },
        style: { left: at(a.lo), width: w(a.lo, a.hi) },
        'aria-label': t('blockAria', { ap: a.id, ch: a.label, lo: num(a.lo), hi: num(a.hi) })
      }, data(a.id), narrow ? null : h('small', { translate: 'no' }, a.label)));
    });
    var ovl = s.pairs.filter(function (q) { return q.kind === 'overlap'; });
    var over = ovl.map(function (q) { return h('div', { class: 'wc-ovcol', style: { left: at(q.from), width: w(q.from, q.to) } }); });
    var segs = ovl.map(function (q) { return h('div', { class: 'wc-ovseg', style: { left: at(q.from), width: w(q.from, q.to) } }); });
    var chans = L.channels(s.band, 20);
    var axis = chans.map(function (c, i) {
      // every channel number; on a phone every other one
      return h('span', { translate: 'no', class: i % 2 ? 'wc-thin' : null, style: { left: at(c.centre) } }, String(c.ch));
    });
    var mhz = MHZ[s.band].map(function (f, i, all) {
      return h('span', { translate: 'no', class: i === 0 ? 'wc-l' : i === all.length - 1 ? 'wc-r' : i % 2 ? 'wc-thin' : null, style: { left: at(f) } }, num(f));
    });
    return h('section', { class: 'wc-spec' },
      h('div', { class: 'wc-h' }, h('span', null, t('specTitle', { band: s.band === '5' ? t('band5') : t('band24') })),
        h('small', null, t.parts('specRange', { lo: data(num(span.lo)), hi: data(num(span.hi)), w: data(s.width) }))),
      h('div', { class: 'wc-sgrid' },
        h('span'), h('div', { class: 'wc-row' }, labels),
        h('span'), h('div', { class: 'wc-row wc-lanes', style: { position: 'relative' } }, back, lanes, over),
        h('span', { class: 'wc-gut wc-warn', 'aria-hidden': 'true' }, s.band === '5' ? '' : '⚠'), h('div', { class: 'wc-row' }, segs),
        h('span', { class: 'wc-gut' }, t('axisCh')), h('div', { class: 'wc-row wc-axis' }, axis),
        h('span', { class: 'wc-gut' }, 'MHz'), h('div', { class: 'wc-row wc-axis wc-mhz' }, mhz)));
  }

  // ── params and presets ──

  function chSlider(id) {
    return {
      key: L.CH_KEYS[id], type: 'range', label: t('chLabel', { ap: id }), min: 0, step: 1,
      max: function (p) { return L.listFor(p).length - 1; },
      format: function (v) {
        var c = L.listFor(cur)[v];
        return c ? t('chValue', { ch: c.label }) : String(v);
      },
      visible: id === 'D' ? function (p) { return p.layout === 'square4'; } : null
    };
  }

  // ── a change of width or band keeps the plan: back to a band/width left unedited, its old channels come back;
  // otherwise, within one band, every AP moves to the channel holding its old primary (L.remap). The kit has already
  // clamped the channel indices by then, so the listener puts the right ones in with one more set(). ──
  var CHS = ['chA', 'chB', 'chC', 'chD'];
  var memory = {}, arrived = {}, prev = null;
  function planOf(p) { var o = {}; CHS.forEach(function (k) { o[k] = p[k]; }); return o; }
  function untouched(at, p) { return !!at && Object.keys(at).every(function (k) { return at[k] === p[k]; }); }
  function bandKey(s) { return s.band + '/' + s.width; }
  /** Only band and width changed (the channels at most clamped by the kit): not a preset, a reset or a slider. */
  function isSwitch(a, b) {
    var max = L.listFor(b).length - 1, moved = false;
    for (var k in L.defaults) {
      if (CHS.indexOf(k) >= 0) { if (b[k] !== Math.min(a[k], max)) return false; }
      else if (a[k] !== b[k]) { if (['band', 'width24', 'width5'].indexOf(k) < 0) return false; moved = true; }
    }
    return moved;
  }
  function keepPlan(sim, c) {
    var key = bandKey(c.state);
    if (prev && !c.preset && isSwitch(prev.params, c.params)) {
      var from = bandKey(prev.state), target = null;
      var sameBand = prev.state.band === c.state.band;
      if (memory[key] && (!sameBand || untouched(arrived[from], prev.params))) target = memory[key];
      else if (sameBand) target = L.remap(prev.state.aps, c.state.band, c.state.width);
      if (target && from !== key) {
        memory[from] = planOf(prev.params);
        arrived[key] = target;
        lastParams = prev.params; // "changed" compares with the plan before the switch, not the clamped one
        lastState = prev.state;
        prev = null;
        sim.set(target);
        return;
      }
    }
    memory[key] = planOf(c.params);
    prev = { params: Object.assign({}, c.params), state: c.state };
  }

  var sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'band', type: 'choice', label: t('band'), options: [['2.4', t('band24')], ['5', t('band5')]] },
      { key: 'width24', type: 'choice', label: t('width'), options: [[20, '20'], [22, t('w22')], [40, '40']],
        visible: function (p) { return p.band !== '5'; } },
      { key: 'width5', type: 'choice', label: t('width'), options: [[20, '20'], [40, '40'], [80, '80'], [160, '160']],
        visible: function (p) { return p.band === '5'; } },
      { key: 'layout', type: 'choice', label: t('layout'), options: [['row3', t('layoutRow')], ['square4', t('layoutSquare')]] },
      { key: 'range', type: 'range', label: t('range'), min: 10, max: 60, step: 5, unit: 'm' },
      chSlider('A'), chSlider('B'), chSlider('C'), chSlider('D')
    ],

    presets: L.presets.map(function (p) {
      return { id: p.id, label: t('preset_' + p.id), hint: t('presetHint_' + p.id), params: p.params };
    }),

    legend: [
      { c: 1, label: t('legendAp') },
      { shape: 'line', label: t('legendCci') },
      { shape: 'ovl', label: t('legendOverlap') },
      { shape: 'dfs', label: t('legendDfs') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      cur = c.params;
      track(c);
      c.stage.replaceChildren(h('div', { class: 'wc' },
        h('div', { class: 'wc-top' }, floorView(s), pairsView(s)),
        specView(s)));
    },

    caption: function (c) {
      var s = c.state;
      var ap = function (id) { return bold(id); };
      var out = [];
      var ovl = s.pairs.filter(function (q) { return q.kind === 'overlap'; });
      var cci = s.pairs.filter(function (q) { return q.kind === 'cci'; });
      if (ovl.length) {
        var o = ovl[0], oa = apById(s, o.a), ob = apById(s, o.b);
        out = out.concat(t.parts('capOverlap', { cha: bold(oa.label), chb: bold(ob.label), a: ap(o.a), b: ap(o.b), mhz: bold(num(o.overlap)) }));
        if (ovl.length > 1) out.push(t.n('capMoreOverlap', ovl.length - 1, { n: ovl.length - 1 }));
        cci.slice(0, 2).forEach(function (c2) {
          out = out.concat(t.parts('capCciAlso', { a: ap(c2.a), b: ap(c2.b), ch: bold(apById(s, c2.a).label) }));
        });
        if (s.band === '2.4') out.push(s.width === 40 ? t('capUse40') : t('capUse1611'));
        return out;
      }
      if (cci.length) {
        var q = cci[0], vars = { a: ap(q.a), b: ap(q.b), ch: bold(apById(s, q.a).label) };
        if (cci.length === 1) return t.parts('capHalf', vars);
        // the APs that share each channel, in channel order of first appearance
        var groups = [];
        s.aps.forEach(function (a) {
          if (!s.sharers[a.id]) return;
          var g = groups.filter(function (x) { return x.label === a.label; })[0];
          if (!g) groups.push(g = { label: a.label, ids: [] });
          g.ids.push(a.id);
        });
        out = [];
        groups.forEach(function (g, i) {
          out = out.concat(t.parts(i ? 'capShareMore' : 'capShareFirst', { aps: listOf(g.ids.map(ap)), ch: bold(g.label) }));
        });
        var shared = s.aps.filter(function (a) { return s.sharers[a.id] > 0; });
        return out.concat(t.parts('capShareEnd', {}), t.parts('capAirtime', {
          list: h('span', null, shared.map(function (a, i) { return [i ? ', ' : '', ap(a.id), ' ', bold(share(s, a.id))]; }))
        }));
      }
      out = s.pairs.some(function (p) { return p.inRange; }) ? [t('capClean')] : t.parts('capAlone', { m: bold(s.range) });
      var dfs = [];
      s.aps.forEach(function (a) { if (a.dfs && dfs.indexOf(a.label) < 0) dfs.push(a.label); });
      if (dfs.length) out = out.concat(t.parts('capDfs', { list: listOf(dfs.map(bold)), n: dfs.length }));
      return out;
    }
  });
  prev = { params: sim.params, state: sim.state };
  sim.on(function (c) { keepPlan(sim, c); });
})();
</script>
</body>
</html>
