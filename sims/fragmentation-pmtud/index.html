<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PKT_C = '1', ICMP_C = '5', HDR_C = '3', DATA_C = '1', TUN_C = '4';
  var MAX_BLOCKS = 4;

  /** Data (ids, protocol names) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function hex(n) { return '0x' + n.toString(16); }
  function B(v) { return t('bytes', { v: v }); }
  /** "0, 60 i 120", or "0, 185, …, 1071" for many. */
  function offsetList(fr) {
    var o = fr.map(function (f) { return String(f.offset); });
    if (o.length > 4) return o.slice(0, 2).join(', ') + ', …, ' + o[o.length - 1];
    return o.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + o[o.length - 1];
  }

  // ── "changed": against the state before the last input (SPEC.md "Changed") ──
  var lastParams = null, lastState = null, marks = { blocks: [], rows: [] };
  function sameParams(a, b) { return Object.keys(L.defaults).every(function (k) { return a[k] === b[k]; }); }
  function track(c) {
    if (lastParams && sameParams(lastParams, c.params)) return;
    marks = L.changed(lastState, c.state);
    lastParams = Object.assign({}, c.params);
    lastState = c.state;
  }

  // ── packet view ──

  /** One packet or fragment on the wire: [tunnel][IP header][data], cut marks inside the data. */
  function wire(s, b, tunnel, cuts) {
    var segs = [];
    if (tunnel) segs.push(h('span', { class: 'fp-seg fp-tun sd-hatch', dataset: { c: TUN_C } }, String(s.overhead)));
    segs.push(h('span', { class: 'fp-seg fp-hdr sd-fill', dataset: { c: HDR_C } }, String(s.hdr)));
    var d = h('span', { class: 'fp-seg fp-data sd-soft', dataset: { c: DATA_C } }, h('span', { class: 'fp-dtxt' }, B(b.data)));
    (cuts || []).forEach(function (x) { d.append(h('span', { class: 'fp-cut', style: { left: (100 * x) + '%' } })); });
    segs.push(d);
    return h('div', { class: 'fp-wire' }, segs);
  }

  function blockEl(s, b, i, opts) {
    var lbl = [h('b', null, B(b.len))];
    if (opts.frag) {
      lbl.push(h('span', null, t('blkOff', { o: b.offset, b: b.start })), h('span', null, t('blkMf', { m: b.mf ? 1 : 0 })));
    }
    if (opts.tag) lbl.push(h('span', { class: 'fp-tag' }, opts.tag));
    return h('div', { class: 'fp-blk' + (marks.blocks.indexOf(i) >= 0 ? ' sd-changed' : ''), style: { '--w': String(b.len + (opts.tunnel ? s.overhead : 0)) } },
      wire(s, b, opts.tunnel), h('div', { class: 'fp-lbl' }, lbl));
  }

  function packetView(c) {
    var s = c.state, p = c.params;
    var box = h('section', { class: 'fp-box fp-pkts' });
    var calc = [h('span', null, s.overhead
      ? t.parts('calcEffOvh', { mtu: h('b', null, String(p.mtuB)), ovh: h('b', null, String(s.overhead)), eff: h('b', null, String(s.effMtu)) })
      : t.parts('calcEff', { eff: h('b', null, String(s.effMtu)) }))];
    if (s.outcome === 'fragment') {
      calc.push(h('span', null, t.parts('calcPer', { eff: h('b', null, String(s.effMtu)), hdr: h('b', null, String(s.hdr)), per: h('b', null, String(s.per)) })));
      calc.push(h('span', null, t.parts('idLine', { id: h('b', { translate: 'no' }, hex(s.id)) })));
    } else if (s.outcome !== 'refused') {
      calc.push(h('span', null, t.parts('idOne', { id: h('b', { translate: 'no' }, hex(s.id)) })));
    }
    box.append(h('div', { class: 'fp-calc' }, calc));

    // as sent: the data cut where R2 will split it
    var cuts = s.fragments.slice(1).map(function (f) { return f.start / s.sent.data; });
    var sentLbl = [h('b', null, B(s.sent.len))];
    if (!s.v6) sentLbl.push(data(s.tcp ? 'DF = 1' : 'DF = 0'));
    box.append(h('div', { class: 'fp-row' }, h('span', { class: 'fp-rlbl' }, t('fvSent')),
      h('div', { class: 'fp-blocks' }, h('div', { class: 'fp-blk', style: { '--w': '1' } }, wire(s, s.sent, false, cuts), h('div', { class: 'fp-lbl' }, sentLbl)))));

    // on link B
    var row;
    if (s.outcome === 'refused') {
      row = h('div', { class: 'fp-none' }, t('noteRefused', { min: s.min }));
    } else if (!s.onB.length) {
      row = h('div', { class: 'fp-none' }, t(s.outcome === 'blackHole' ? 'noteBlack' : 'noteDropped'));
    } else {
      var frag = s.outcome === 'fragment';
      var tag = s.outcome === 'pmtud' ? t('resentTag') : null;
      var kids = L.visibleBlocks(s.onB.length, MAX_BLOCKS).map(function (i) {
        if (i < 0) return h('div', { class: 'fp-gap' }, '… ' + t.n('gapMore', s.onB.length - 4) + ' …');
        return blockEl(s, s.onB[i], i, { frag: frag, tunnel: s.overhead > 0, tag: tag });
      });
      row = h('div', { class: 'fp-blocks' }, kids);
      // a single block is drawn at its share of the sent packet's width
      if (s.onB.length === 1) row.style.width = Math.max(30, Math.min(100, 100 * (s.onB[0].len + s.overhead) / s.sent.len)) + '%';
    }
    box.append(h('div', { class: 'fp-row' }, h('span', { class: 'fp-rlbl' }, t('fvOnB')), row));
    if (s.v6 && s.outcome !== 'pass' && s.outcome !== 'refused') box.append(h('p', { class: 'fp-note' }, t('noteV6')));
    return box;
  }

  // ── path (kit view K2) ──

  function pathView(c) {
    var s = c.state, p = c.params, o = s.outcome;
    var badges = { H1: [], R1: [], R2: [], H2: [] };
    if (o === 'pmtud') badges.H1.push({ text: t('bPmtu', { v: s.pmtu }), k: 'fill' });
    if (o === 'blackHole') badges.H1.push({ text: t('bWaits'), k: 'dashed' });
    if (p.icmpBlocked) badges.R1.push({ text: t('bFw'), k: 'solid' });
    if (o === 'pass') badges.R2.push({ text: t('bForwards'), k: 'muted' });
    if (o === 'fragment') badges.R2.push({ text: t('bSplits'), k: 'solid' });
    if (o === 'pmtud' || o === 'blackHole' || o === 'refused') badges.R2.push({ text: t('bDrops'), k: 'solid' });
    if (o === 'pass' || o === 'pmtud') badges.H2.push({ text: t('bGets'), k: 'muted' });
    if (o === 'fragment') badges.H2.push({ text: t('bReassembles'), k: 'solid' });
    var node = function (id, kind, col, cc, name, extra) {
      return { id: id, kind: kind, col: col, span: 2, row: 0, c: cc, name: name,
        lines: extra || [], badges: badges[id].map(function (b) { return { text: b.text, k: b.k }; }),
        state: (id === 'R2' && o !== 'pass') || (id === 'R1' && o === 'blackHole') ? 'active' : null };
    };
    var nodes = [
      node('H1', 'host', 0, '1', t('sender')),
      node('R1', 'router', 3, '2', null, [{ text: t('router'), kind: 'role' }]),
      { id: 'linkA', kind: 'cloud', col: 4, span: 3, row: 1, name: t('linkLbl', { k: 'A', v: s.linkA }), align: 'center' },
      node('R2', 'router', 6, '6', null, [{ text: t('router'), kind: 'role' }]),
      { id: 'linkB', kind: 'cloud', col: 8, span: 3, row: 1, align: 'center', state: 'active',
        name: s.overhead ? t('linkLblEff', { k: 'B', v: p.mtuB, o: s.overhead, eff: s.effMtu }) : t('linkLbl', { k: 'B', v: p.mtuB }) },
      node('H2', 'host', 11, '5', t('receiver'))
    ];
    if (s.overhead) {
      var pipeName = h('span', null, t.parts('pipe', { name: data(s.tunnel), n: s.overhead }));
      nodes.splice(5, 0, { id: 'pipe', kind: 'cloud', col: 8, span: 3, row: 0, name: pipeName, align: 'center' });
    }
    var links = [
      { id: 'lan', a: 'H1', b: 'R1', active: o !== 'refused' },
      { id: 'a', a: 'R1', b: 'R2', active: o !== 'refused' },
      { id: 'b', a: 'R2', b: 'H2', active: s.onB.length > 0, state: o === 'refused' ? 'down' : 'up' }
    ];
    var packets = [];
    var first = s.tcp && !s.v6 ? t('chipPktDf', { v: s.sent.len }) : t('chipPkt', { v: s.sent.len });
    var icmpChip = s.icmp ? t(s.icmp.v6 ? 'chipIcmp6' : 'chipIcmp', { v: s.icmp.nextHopMtu }) : null;
    if (o !== 'refused') {
      packets.push({ from: 'H1', to: 'R1', label: first, c: PKT_C, move: false });
      packets.push({ from: 'R1', to: 'R2', chip: false, c: PKT_C, move: false, drop: !!s.icmp });
    }
    var atB = s.overhead ? 0.8 : 0.6;     // clear of the tunnel's label
    if (o === 'pass') packets.push({ from: 'R2', to: 'H2', label: t('chipPkt', { v: s.sent.len }), c: PKT_C, move: false, at: atB });
    if (o === 'fragment') packets.push({ from: 'R2', to: 'H2', label: t.n('chipFrags', s.fragments.length), c: PKT_C, move: false, at: atB });
    if (o === 'pmtud') {
      packets.push({ from: 'R2', to: 'R1', label: icmpChip, c: ICMP_C, move: false });
      packets.push({ from: 'R1', to: 'H1', chip: false, c: ICMP_C, move: false });
      packets.push({ from: 'R2', to: 'H2', label: t('chipResend', { v: s.pmtu }), c: PKT_C, move: false, at: atB });
    }
    if (o === 'blackHole') packets.push({ from: 'R2', to: 'R1', label: icmpChip, c: ICMP_C, move: false, drop: true });
    return Simdeck.topology({ cols: 13, rows: ['auto', 'auto'], dir: c.dir, nodes: nodes, links: links, packets: packets });
  }

  // ── outcome timeline ──

  var MARK = { ok: '✓', drop: '✕', icmp: '↩', silence: '…', info: '→', stall: '⟳' };
  function rowText(r, s) {
    var v = r.v;
    switch (r.k) {
      case 'handshake': return t('tl_handshake', { n: v.n });
      case 'send': return v.v6 ? t('tl_sendV6', { size: v.size }) : t(v.df ? 'tl_sendDf' : 'tl_send', { size: v.size });
      case 'forward': return t('tl_forward', { size: v.size, eff: v.eff });
      case 'receive': return t('tl_receive', { size: v.size });
      case 'fragment': return t('tl_fragment', { frags: t.n('chipFrags', v.n), eff: v.eff });
      case 'reassemble': return t('tl_reassemble', { frags: t.n('chipFrags', v.n), size: v.size });
      case 'noIcmp': return t('tl_noIcmp');
      case 'dropIcmp': return t(v.v6 ? 'tl_dropIcmp6' : 'tl_dropIcmp', { size: v.size, eff: v.eff });
      case 'icmpLost': return t(v.v6 ? 'tl_icmpLost6' : 'tl_icmpLost');
      case 'pmtu': return t('tl_pmtu', { pmtu: v.pmtu, mss: v.mss });
      case 'resend': return t('tl_resend', { size: v.size, eff: v.eff });
      case 'retry': return t('tl_retry', { size: v.size, times: v.times });
      case 'refused': return t('tl_refused', { eff: v.eff, min: v.min });
    }
    return '';
  }
  function timeline(c) {
    var s = c.state;
    return h('section', { class: 'fp-box fp-tl' }, h('h2', null, t('tlTitle')),
      h('ol', null, s.timeline.map(function (r, i) {
        return h('li', { class: marks.rows.indexOf(i) >= 0 ? 'sd-changed' : null },
          h('span', { class: 'fp-num' }, String(i + 1)),
          h('span', { class: 'fp-who' }, t('who_' + r.who)),
          h('span', { class: 'fp-mark', dataset: { m: r.mark }, 'aria-hidden': 'true' }, MARK[r.mark]),
          h('span', { class: 'fp-txt' }, rowText(r, s)));
      })));
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'size', type: 'range', label: t('size'), min: L.RANGES.size[0], max: L.RANGES.size[1], step: L.RANGES.size[2], format: B },
      { key: 'mtuB', type: 'range', label: t('mtuB'), min: L.RANGES.mtuB[0], max: L.RANGES.mtuB[1], step: L.RANGES.mtuB[2], format: B },
      { key: 'overhead', type: 'select', label: t('overhead'), options: L.OVERHEADS.map(function (x) { return [x[0], t('ovh_' + x[0])]; }) },
      { key: 'proto', type: 'choice', label: t('proto'), options: [['ipv4', t('ipv4')], ['ipv6', t('ipv6')]] },
      { key: 'df', type: 'toggle', label: t('df'), hint: t('dfHint'), disabled: function (p) { return p.proto === 'ipv6' ? t('dfV6') : false; } },
      { key: 'icmpBlocked', type: 'toggle', label: t('icmpBlocked'), hint: t('icmpBlockedHint') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { c: 3, label: t('legHdr') },
      { shape: 'fp-data', label: t('legData') },
      { shape: 'fp-cut', label: t('legCut') },
      { shape: 'fp-tun', label: t('legTunnel') },
      { shape: 'fp-icmp', label: t('legIcmp') },
      { shape: 'fp-x', label: t('legDrop') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      track(c);
      c.stage.replaceChildren(h('div', { class: 'fp' }, packetView(c), pathView(c), timeline(c)));
    },
    caption: function (c) {
      var s = c.state, p = c.params;
      var out;
      switch (s.outcome) {
        case 'refused': out = t.parts('capRefused', { eff: s.effMtu, min: s.min, ver: data(s.v6 ? 'IPv6' : 'IPv4') }); break;
        case 'pass': out = t.parts('capPass', { size: p.size, eff: s.effMtu }); break;
        case 'fragment': out = t.parts('capFragment', { size: p.size, eff: s.effMtu, frags: t.n('chipFrags', s.fragments.length), offs: offsetList(s.fragments) }); break;
        case 'pmtud': out = t.parts(s.v6 ? 'capPmtud6' : 'capPmtud', { size: p.size, eff: s.effMtu, mss: s.mss }); break;
        case 'blackHole': out = t.parts(s.v6 ? 'capBlack6' : 'capBlack', { size: p.size }); break;
      }
      if (p.icmpBlocked && !s.icmp && s.outcome !== 'refused') out = out.concat(t('capNoIcmp'));
      return out;
    }
  });
})();
</script>
</body>
</html>
