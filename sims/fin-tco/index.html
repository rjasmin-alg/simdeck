<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var LINE = {};
  L.LINES.forEach(function (l) { LINE[l.key] = l; });
  var LETTER = { a: 'A', b: 'B', tie: '=' };

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (30 000 / 30,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '\u00a0' : ',');
  }
  /** Whole euros (every amount here is whole). Minus is U+2212. */
  function money(x) { return (x < 0 ? '−' : '') + t('eur', { n: group(Math.abs(Math.round(x))) }); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function upper(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  /** A line's own amount: € once, € a year, or hours a year. */
  function amountText(r, side) {
    var v = r[side];
    if (r.staff) return t('hoursYear', { n: group(v) });
    return r.when === 'year' ? t('perYear', { x: money(v) }) : money(v);
  }

  /** 1, 2, 2.5, 5 × 10^k: the smallest step at or above x. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }
  function topOf(max) { var st = niceStep(Math.max(max, 1000) / 4); return Math.ceil(Math.max(max, 1000) / st) * st; }

  // ── editing a line: drag the bar or use the keys; the amounts are hidden params ──

  var drag = null;      // { side, key, rect, top } while a bar is dragged; the scale stays frozen meanwhile
  var refocus = null;   // the bar to give focus back to after a render (keyboard changes)

  function setAmount(side, key, v) {
    var l = LINE[key];
    var x = Math.max(0, Math.min(l.max, Math.round(v / l.step) * l.step));
    var patch = {};
    patch[side + '_' + key] = x;
    sim.set(patch);
  }
  /** The amount whose bar reaches the pointer: over the horizon ÷ (hours × rate) ÷ years. */
  function amountAt(clientX) {
    var l = LINE[drag.key];
    var over = (clientX - drag.rect.left) / drag.rect.width * drag.top;
    return over / ((l.unit || 1) * (l.when === 'year' ? sim.params.horizon : 1));
  }
  function onMove(e) { if (drag) setAmount(drag.side, drag.key, amountAt(e.clientX)); }
  function onUp() {
    if (!drag) return;
    drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    sim.render();
  }
  function startDrag(e, side, key, top) {
    if (e.button !== 0) return;
    e.preventDefault();
    drag = { side: side, key: key, rect: e.currentTarget.getBoundingClientRect(), top: top };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    setAmount(side, key, amountAt(e.clientX));
  }
  function onKey(e, side, key, v) {
    var l = LINE[key], by = (e.shiftKey ? 10 : 1) * l.step, to = null;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') to = v + by;
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') to = v - by;
    else if (e.key === 'PageUp') to = v + 10 * l.step;
    else if (e.key === 'PageDown') to = v - 10 * l.step;
    else if (e.key === 'Home') to = 0;
    else if (e.key === 'End') to = l.max;
    if (to === null) return;
    e.preventDefault();
    refocus = side + '_' + key;
    setAmount(side, key, to);
  }
  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)

  // ── the stage ──

  function cell(s, r, side, top, over) {
    var l = LINE[r.key], v = r[side], ov = r[side + 'Over'];
    var name = t('line_' + r.key);
    var vt = t('barValue', { amount: amountText(r, side), over: over, total: money(ov) });
    return h('div', { class: 'tc-cell', dataset: r.on ? { g: r.group } : { g: r.group, off: '' } },
      h('div', {
        class: 'tc-track', role: 'slider', tabindex: '0', dataset: { k: side + '_' + r.key },
        'aria-label': t('barLabel', { line: name, opt: LETTER[side] }),
        'aria-valuemin': '0', 'aria-valuemax': String(l.max), 'aria-valuenow': String(v), 'aria-valuetext': vt, title: vt,
        onpointerdown: function (e) { startDrag(e, side, r.key, top); },
        onkeydown: function (e) { onKey(e, side, r.key, v); }
      },
        h('div', { class: 'tc-bar tc-fill', dataset: { g: r.group }, style: { width: Math.min(100, 100 * ov / top) + '%' } }),
        h('span', { class: 'tc-grip', style: { left: Math.min(100, 100 * ov / top) + '%' } })),
      h('div', { class: 'tc-val', translate: 'no' },
        r.when === 'year' ? h('span', { class: 'tc-per' }, amountText(r, side)) : null,
        h('span', { class: 'tc-over' }, money(ov))));
  }

  function totals(s, side, top, chg) {
    var g = s.groups[side], tot = s.total[side];
    var seg = function (k) {
      return g[k] > 0 ? h('div', { class: 'tc-seg tc-fill', dataset: { g: k }, style: { width: (100 * g[k] / top) + '%' } }) : null;
    };
    var badge = s.winner === side ? h('span', { class: 'tc-badge', dataset: { w: 'win' } }, t('cheaperBadge'))
      : s.winner === 'tie' ? h('span', { class: 'tc-badge', dataset: { w: 'tie' } }, t('tieBadge')) : null;
    var share = s.share[side];
    return h('div', { class: 'tc-tot' + (chg.indexOf('winner') >= 0 ? ' sd-changed' : ''), dataset: { side: side } },
      h('div', { class: 'tc-stack' }, seg('price'), seg('once'), seg('running')),
      h('div', { class: 'tc-totline' },
        h('span', { class: 'tc-sum', translate: 'no' }, money(tot)), badge,
        h('span', { class: 'tc-share' }, share === null ? t('noShare') : t.parts('shareOf', { p: data(t('pct', { n: share })) }))));
  }

  function render(c) {
    track(c);
    var s = c.state, p = s.p, H = p.horizon;
    var over = t.n('overYears', H);
    var rowTop = drag ? drag.top : topOf(Math.max.apply(null, s.rows.map(function (r) { return Math.max(r.aOver, r.bOver); })));
    var totTop = topOf(Math.max(s.total.a, s.total.b));

    var cells = [
      h('span', null),
      h('h2', { class: 'tc-opt' }, h('span', { class: 'tc-letter', translate: 'no' }, 'A'), h('span', { class: 'tc-optname' }, t('pair_' + p.pair + 'A'))),
      h('h2', { class: 'tc-opt' }, h('span', { class: 'tc-letter', translate: 'no' }, 'B'), h('span', { class: 'tc-optname' }, t('pair_' + p.pair + 'B')))
    ];
    s.rows.forEach(function (r) {
      var name = t('line_' + r.key);
      cells.push(
        h('button', {
          type: 'button', class: 'tc-switch', role: 'switch', 'aria-checked': String(r.on), dataset: { k: 'on_' + r.key },
          'aria-label': t('switchLabel', { line: name }), onmousedown: noFocus,
          onclick: function () { var patch = {}; patch['on_' + r.key] = !r.on; sim.set(patch); }
        },
          h('span', { class: 'tc-box', 'aria-hidden': 'true' }, r.on ? '✓' : ''),
          h('span', { class: 'tc-name' }, name),
          h('span', { class: 'tc-when' }, t('when_' + r.when))),
        cell(s, r, 'a', rowTop, over),
        cell(s, r, 'b', rowTop, over));
    });
    cells.push(h('div', { class: 'tc-totlabel' }, t('rowTotal', { over: over })), totals(s, 'a', totTop, chg), totals(s, 'b', totTop, chg));

    var chips = [];
    s.strip.forEach(function (w, i) {
      var n = i + 1;
      chips.push(h('button', {
        type: 'button', class: 'tc-chip', 'aria-pressed': String(n === H), dataset: { w: w },
        'aria-label': t.n('nYears', n) + ': ' + (w === 'tie' ? t('stripTie') : LETTER[w]), onmousedown: noFocus,
        onclick: function () { sim.set({ horizon: n }); }
      }, data(t('stripChip', { n: n, w: LETTER[w] }))));
    });

    c.stage.replaceChildren(h('div', { class: 'tc' },
      h('div', { class: 'tc-table' }, cells),
      h('div', { class: 'tc-below' },
        h('p', { class: 'tc-quote' }, s.quote === 'tie' ? t('quoteTie')
          : t.parts('quoteCheaper', { w: b(LETTER[s.quote]), d: b(money(s.quoteDiff)) })),
        h('p', { class: 'tc-strip' }, h('span', null, t('stripLabel')), chips)),
      h('p', { class: 'tc-foot' }, t('dragHint'), ' ', t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('.tc-track[data-k="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state, H = s.p.horizon;
    var k = L.captionKey(s);
    if (k.key === 'capNothing') return t(k.key);
    var out = t.parts(k.key, {
      over: upper(t.n('overYears', H)), a: b(money(s.total.a)), b: b(money(s.total.b)),
      w: b(LETTER[s.winner]), d: b(money(s.diff))
    });
    k.notes.forEach(function (key) {
      out.push(' ');
      if (key === 'nFlip') out = out.concat(t.parts(key, { q: b(LETTER[s.quote]) }));
      else {
        var x = s.crossing;
        out = out.concat(t.parts(key, {
          early: b(LETTER[x.early]), upTo: t.n('upToYears', x.upTo), late: b(LETTER[x.late]), from: t.n('fromYears', x.from)
        }));
      }
    });
    return out;
  }

  var labels = {
    'cheaper-purchase': 'pCheaperPurchase', 'short-horizon': 'pShortHorizon', 'price-only': 'pPriceOnly',
    'build-vs-buy': 'pBuildVsBuy', 'staff-free': 'pStaffFree', 'exit-cost': 'pExitCost'
  };
  var never = function () { return false; };

  // The amounts and switches are set on the stage; these hidden params keep them in the URL and clamp them.
  var hidden = [{ key: 'pair', type: 'choice', label: t('stage'), visible: never,
    options: L.PAIRS.map(function (x) { return [x, t('pair_' + x + 'A')]; }) }];
  L.LINES.forEach(function (l) {
    ['a', 'b'].forEach(function (side) {
      hidden.push({ key: side + '_' + l.key, type: 'range', label: t('barLabel', { line: t('line_' + l.key), opt: LETTER[side] }),
        min: 0, max: l.max, step: l.step, visible: never });
    });
    hidden.push({ key: 'on_' + l.key, type: 'toggle', label: t('switchLabel', { line: t('line_' + l.key) }), visible: never });
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'horizon', type: 'range', label: t('horizon'), hint: t('horizonHint'), min: L.H_MIN, max: L.H_MAX, step: 1,
        format: function (v) { return t.n('nYears', v); } },
      { type: 'button', label: t('allOn'), key: 'a', run: function (api) {
        var patch = {};
        L.KEYS.forEach(function (k) { patch['on_' + k] = true; });
        api.set(patch);
      } }
    ].concat(hidden),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'tc-price', label: t('legPrice') },
      { shape: 'tc-once', label: t('legOnce') },
      { shape: 'tc-running', label: t('legRunning') },
      { shape: 'tc-off', label: t('legOff') },
      { shape: 'tc-star', label: t('legCheaper') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
