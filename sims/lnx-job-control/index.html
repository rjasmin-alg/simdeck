<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (PIDs, signal names, commands, what bash prints) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }

  /** Caption parts: t.parts ([[terms]] in the kit's style), then *English term* in <em lang="en"> for terms the
      glossary lacks (from sims/lnx-signals/index.html). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars || {}).forEach(function (p) {
      var text = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (text === null) { out.push(p); return; }
      text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }

  var PROMPT = '[student@' + L.HOST + ' ~]$ ';
  var SHAPE = { S: '○', R: '●', T: '■', gone: '✕' };
  var ACT = { terminated: 'actTerminated', stopped: 'actStopped', continued: 'actContinued', ignored: 'actIgnored',
    nothing: 'actNothing', caught: 'actCaught', pending: 'actPending', released: 'actReleased' };

  function changed(s, key) { return s.changed.indexOf(key) >= 0; }

  // ── stage: the signals of this step ──

  function delivery(d, k) {
    var from = d.from === 'terminal' ? t('fromTerminal') : t('fromShell') + ' ' + L.SHELL.pid;
    var to = d.kind === 'group' ? t('toGroup', { pgid: d.target }) : t('toPid', { pid: d.target });
    var res = d.reached.length ? d.reached.map(function (r) {
      return h('span', { class: 'jc-r jc-r-' + r.act }, h('b', { translate: 'no' }, String(r.pid)),
        r.act === 'released' ? t.parts('actReleased', { sig: data('SIG' + r.sig) }) : t(ACT[r.act]));
    }) : [h('span', { class: 'jc-r jc-r-ignored' }, t('reachedNone'))];
    return h('div', { class: 'jc-del' },
      h('span', { class: 'jc-no', translate: 'no' }, String(k + 1)),
      h('span', { class: 'jc-env' }, h('span', { 'aria-hidden': 'true' }, '✉'), data('SIG' + d.sig + ' ' + d.num, 'jc-env-sig')),
      h('span', { class: 'jc-route' }, h('b', null, from), h('span', { 'aria-hidden': 'true' }, ' → '), to),
      h('span', { class: 'jc-res' }, res));
  }

  function signals(s) {
    if (!s.deliveries.length) return h('div', { class: 'jc-sigs' }, h('p', { class: 'jc-none' }, t('sigNone')));
    return h('div', { class: 'jc-sigs' }, s.deliveries.map(delivery));
  }

  // ── stage: the terminal and its keys ──

  var MAX_LINES = 14;

  function terminal(s, c) {
    var now = {};
    s.out.forEach(function (i) { now[i] = true; });
    var rows = s.term.map(function (l, i) {
      var cls = 'jc-ln' + (now[i] ? ' jc-ln-now' : '');
      if (l.kind === 'sep') {
        var key = l.text === 'closed' ? 'termClosed' : l.text === 'exited' ? 'termExited' : 'newTerm';
        return h('div', { class: cls + ' jc-sep' }, '— ' + t(key) + ' —');
      }
      if (l.kind === 'cmd') return h('div', { class: cls + ' jc-ln-cmd', translate: 'no' }, h('span', { class: 'jc-prompt' }, PROMPT), l.text);
      return h('div', { class: cls + (l.kind === 'err' ? ' jc-ln-err' : l.kind === 'key' ? ' jc-ln-key' : ''), translate: 'no' }, l.text || ' ');
    });
    var waiting = (s.shell.alive && s.terminal.open && s.terminal.fgPgid === s.shell.pid) || s.newTerm;
    if (waiting) rows.push(h('div', { class: 'jc-ln', translate: 'no' }, h('span', { class: 'jc-prompt' }, PROMPT), h('span', { class: 'jc-cursor', 'aria-hidden': 'true' }, '▌')));
    rows = rows.slice(Math.max(0, rows.length - MAX_LINES));
    var closed = !s.terminal.open && !s.newTerm;
    var a = c.n ? L.action(c.params, c.n) : null;
    var pressed = a ? (a.op === 'key' ? a.key : a.op === 'close' ? 'X' : null) : null;
    function key(id, label, cls) { return h('span', { class: 'jc-key' + (cls ? ' ' + cls : '') + (pressed === id ? ' sd-changed' : '') }, label); }
    return [
      h('div', { class: 'jc-term' + (closed ? ' jc-term-closed' : '') },
        h('div', { class: 'jc-term-bar' }, t('termTitle'), data('student@' + L.HOST)),
        h('div', { class: 'jc-lines' }, rows)),
      h('div', { class: 'jc-keys', role: 'group', 'aria-label': t('keysLabel') },
        key('C', data('Ctrl-C')), key('Z', data('Ctrl-Z')), key('X', ['✕ ', t('keyClose')], 'jc-key-close'))
    ];
  }

  // ── stage: processes in their groups ──

  function sigsTo(s, pgid, pid) {
    return s.deliveries.filter(function (d) { return d.kind === 'group' ? d.target === pgid : d.target === pid; })
      .map(function (d) { return h('span', { class: 'jc-sigb' }, h('span', { 'aria-hidden': 'true' }, '✉'), 'SIG' + d.sig); });
  }
  function fgBadge() { return h('span', { class: 'jc-fgb' }, h('span', { 'aria-hidden': 'true' }, '⌨'), t('fgBadge')); }

  function procChip(s, p) {
    var gone = p.state === 'gone';
    return h('span', { class: 'jc-proc' + (gone ? ' jc-gone' : '') + (changed(s, p.pid) ? ' sd-changed' : '') },
      h('span', { class: 'jc-shape', 'aria-hidden': 'true' }, SHAPE[p.state]),
      data(p.cmd, 'jc-cmd'),
      data(gone ? p.pid + (p.sig ? ' · SIG' + p.sig : '') : p.pid + ' · ' + L.stat(s, p), 'jc-pid jc-muted'),
      p.pending && p.pending.length ? h('span', { class: 'jc-pend' }, t('pendingTag'), ' ', data(p.pending.map(function (x) { return 'SIG' + x; }).join(' '))) : null);
  }

  /** A job ended with its processes is still named in its step; one the shell lost (hang-up, exit) is not. */
  function p0gone(ps) { return ps.every(function (p) { return p.state === 'gone'; }); }

  function groups(s, kids) {
    var order = [], by = {};
    kids.forEach(function (p) { if (!by[p.pgid]) { by[p.pgid] = []; order.push(p.pgid); } by[p.pgid].push(p); });
    return order.map(function (pgid) {
      var ps = by[pgid];
      var job = s.jobs.filter(function (j) { return j.pgid === pgid && (j.state !== 'gone' || p0gone(ps)); })[0];
      var fg = s.terminal.open && s.terminal.fgPgid === pgid && ps.some(function (p) { return p.state !== 'gone'; });
      return h('div', { class: 'jc-group' + (fg ? ' jc-group-fg' : '') },
        h('div', { class: 'jc-group-head' }, t('groupOf', { pgid: pgid }),
          job ? h('span', null, t('jobTag'), ' ', data('%' + job.n)) : null, fg ? fgBadge() : null, sigsTo(s, pgid)),
        h('div', { class: 'jc-procs' }, ps.map(function (p) { return procChip(s, p); })));
    });
  }

  function tree(s) {
    var sh = L.find(s, s.shell.pid);
    var shGone = sh.state === 'gone';
    var shFg = s.terminal.open && s.terminal.fgPgid === sh.pid;
    var mine = s.procs.filter(function (p) { return p.ppid === sh.pid; });
    var orphans = s.procs.filter(function (p) { return p.ppid === 1; });
    var out = [h('div', { class: 'jc-parent' + (shGone ? ' jc-gone' : '') },
      h('div', { class: 'jc-parent-head' + (changed(s, sh.pid) ? ' sd-changed' : '') },
        h('span', { class: 'jc-shape', 'aria-hidden': 'true' }, SHAPE[sh.state]),
        data('bash', 'jc-cmd'), h('span', { class: 'jc-tag' }, t('shellTag')),
        data(shGone ? 'PID ' + sh.pid + ' · PPID ' + sh.ppid + (sh.sig ? ' · SIG' + sh.sig : '') : 'PID ' + sh.pid + ' · PPID ' + sh.ppid + ' · ' + L.stat(s, sh), 'jc-pid jc-muted'),
        shFg ? fgBadge() : null, sigsTo(s, -1, sh.pid)),
      mine.length ? h('div', { class: 'jc-kids' }, groups(s, mine)) : null)];
    if (orphans.length) {
      out.push(h('div', { class: 'jc-parent' },
        h('div', { class: 'jc-parent-head' }, h('b', null, t('initTitle'))),
        h('div', { class: 'jc-kids' }, groups(s, orphans))));
    }
    return h('div', { class: 'jc-tree' }, h('h3', null, t('treeTitle')), out);
  }

  // ── stage: the job table and ps ──

  function jobsTable(s) {
    var body;
    if (!s.shell.alive) body = h('p', { class: 'jc-empty' }, t('jobsNoShell'));
    else if (!s.jobs.length) body = h('p', { class: 'jc-empty' }, t('jobsEmpty'));
    else {
      var m = L.marks(s);
      body = h('table', null, h('tbody', null, s.jobs.map(function (j) {
        var gone = j.state === 'gone';
        var word = gone ? j.word || '' : j.state === 'stopped' ? 'Stopped' : 'Running';
        return h('tr', { class: (changed(s, 'job:' + j.n) ? 'sd-changed' : '') + (gone ? ' jc-row-gone' : '') },
          h('td', { translate: 'no' }, '[' + j.n + ']' + (gone ? ' ' : m[j.n] || ' ')),
          h('td', { translate: 'no' }, word),
          h('td', { translate: 'no' }, j.cmd + (j.state === 'running' && !j.fg ? ' &' : '')),
          h('td', null, j.fg && !gone ? h('span', { class: 'jc-fgtag' }, '⌨ ', t('fgTag')) : null));
      })));
    }
    return h('div', { class: 'jc-box' }, h('h3', null, t('jobsTitle')), body);
  }

  function psTable(s) {
    var rows = s.procs.filter(function (p) { return p.state !== 'gone' || changed(s, p.pid); });
    var cols = ['PID', 'PPID', 'PGID', 'STAT', 'CMD'];
    return h('div', { class: 'jc-box' }, h('h3', null, t('psTitle')),
      h('table', { translate: 'no' },
        h('thead', null, h('tr', null, cols.map(function (c) { return h('th', null, c); }))),
        h('tbody', null, rows.map(function (p) {
          var gone = p.state === 'gone';
          return h('tr', { class: (changed(s, p.pid) ? 'sd-changed' : '') + (gone ? ' jc-row-gone' : '') },
            h('td', null, String(p.pid)), h('td', null, String(p.ppid)), h('td', null, String(p.pgid)),
            h('td', null, gone ? '✕' : L.stat(s, p)), h('td', null, p.cmd));
        }))));
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'jc' },
      signals(s),
      h('div', { class: 'jc-body' },
        h('div', { class: 'jc-left' }, terminal(s, c)),
        h('div', { class: 'jc-right' }, tree(s), h('div', { class: 'jc-tables' }, jobsTable(s), psTable(s))))));
  }

  // ── captions ──

  var CODE = { primjer1: 'P1', 'ctrl-z': 'Cz', 'zatvori-prozor': 'Zp', 'exit-ili-zatvori': 'Ez', cjevovod: 'Cj' };

  function caption(c) {
    var o = L.norm(c.params), key = 'cap' + CODE[o.script] + '_' + c.n;
    if (o.script === 'zatvori-prozor' && !o.nohup && c.n >= 2) key += 'off';
    if (o.script === 'exit-ili-zatvori' && o.login && o.huponexit && c.n >= 5) key += 'hup';
    return rich(key);
  }

  // ── mount ──

  function unused(key, reason) {
    return function (p) { return L.uses(L.norm(p).script, key) ? false : t(reason); };
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      // the scenario is chosen with the presets; the select stays hidden so the panel fits
      { key: 'script', type: 'select', label: t('script'), resets: true, visible: function () { return false; }, options: [
        ['primjer1', t('presetP1')], ['ctrl-z', t('presetCz')], ['zatvori-prozor', t('presetZp')],
        ['exit-ili-zatvori', t('presetEz')], ['cjevovod', t('presetCj')]] },
      { key: 'nohup', type: 'toggle', label: t('nohup'), disabled: unused('nohup', 'notUsedNohup') },
      { key: 'login', type: 'toggle', label: t('login'), disabled: unused('login', 'notUsedExit') },
      { key: 'huponexit', type: 'toggle', label: t('huponexit'), disabled: unused('huponexit', 'notUsedExit') }
    ],

    presets: [
      { id: 'primjer1', label: t('presetP1'), params: { script: 'primjer1' }, hint: t('presetP1Hint') },
      { id: 'ctrl-z', label: t('presetCz'), params: { script: 'ctrl-z' }, hint: t('presetCzHint') },
      { id: 'zatvori-prozor', label: t('presetZp'), params: { script: 'zatvori-prozor', nohup: true }, hint: t('presetZpHint') },
      { id: 'exit-ili-zatvori', label: t('presetEz'), params: { script: 'exit-ili-zatvori', login: false, huponexit: false }, hint: t('presetEzHint') },
      { id: 'cjevovod', label: t('presetCj'), params: { script: 'cjevovod' }, hint: t('presetCjHint') }
    ],

    legend: [
      { shape: 'hl', label: t('legChanged') },
      { shape: 'jc-group', label: t('legGroup') },
      { shape: 'jc-fg', label: t('legFg') },
      { shape: 'jc-s', label: t('legSleep') },
      { shape: 'jc-t', label: t('legStopped') },
      { shape: 'jc-gone', label: t('legGone') },
      { shape: 'jc-sig', label: t('legSignal') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
