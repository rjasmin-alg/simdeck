<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Series colour of a requested partition: the same partition has the same colour in both tables. */
  function colour(req) { return String((req - 1) % 8 + 1); }

  // ── numbers ──

  /** Sector numbers grouped by three with a narrow no-break space. */
  function grp(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function range(a, b) { return a === b ? grp(a) : grp(a) + '–\u200b' + grp(b); }
  var compact = L.compact, human = L.human;
  function dec(x) { var s = x.toFixed(1).replace(/\.0$/, ''); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  /** A rounded decimal size for prose: ≈ 1,8 TB. */
  function approx(b) { return b >= 1e12 ? '≈ ' + dec(b / 1e12) + ' TB' : '≈ ' + dec(b / 1e9) + ' GB'; }
  function tib(b) { return (b / Math.pow(2, 40)) + ' TiB'; }
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function diskLabel(s) { return { '2GiB': '2 GiB', '1TB': '1 TB', '4TB': '4 TB' }[s.disk]; }

  // ── the changed marks follow param changes ──

  var lastKey = null, lastState = null, chg = { mbr: [], gpt: [] };
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = lastState ? L.changedRegions(lastState, c.state) : { mbr: [], gpt: [] };
      lastKey = key;
      lastState = c.state;
    }
  }
  function mark(w, key) { return chg[w].indexOf(key) >= 0 ? ' sd-changed' : ''; }

  // ── the insets ──

  function cell(kind, lba, label, extra) {
    var o = extra || {};
    return h('div', { class: 'dp-cell' + (o.cls ? ' ' + o.cls : ''), dataset: Object.assign({ kind: kind }, o.c ? { c: o.c } : {}) },
      lba != null ? data(lba, 'dp-lba') : null,
      label != null ? h('span', null, label) : null,
      o.more || null);
  }

  function slotsOf(slots, w, damaged) {
    return h('div', { class: 'dp-slots' }, slots.map(function (s, i) {
      var k = damaged ? 'lost' : s.type;
      var txt = damaged ? t('lUnknown') : s.type === 'empty' ? '–' : s.type === 'ee' ? 'ee' : String(s.num);
      var ds = { k: k };
      if (!damaged && s.type === 'primary') ds.c = colour(s.req);
      return h('span', { class: 'dp-slot' + mark(w, 'slot-' + (i + 1)), dataset: ds, translate: 'no', title: s.name || '' }, txt);
    }));
  }

  function mbrStart(s) {
    var m = s.mbr, first = m.parts[0];
    var slots = m.slots.map(function (x) {
      if (x.type === 'primary') { var p = m.parts.filter(function (q) { return q.num === x.num; })[0]; return Object.assign({ req: p ? p.req : 1 }, x); }
      return x;
    });
    var gapEnd = first ? first.start - 1 : s.perMiB - 1;
    var c0 = cell('meta', null, null, {
      cls: (m.damaged ? 'dp-x' : '') + mark('mbr', 'mbr-0'),
      more: [h('span', { class: 'dp-row' }, data('0', 'dp-lba'), m.damaged ? h('b', null, t('lMbr'), ' · ', t('lDamaged')) : h('span', null, t('lMbr'))),
        slotsOf(slots, 'mbr', m.damaged)]
    });
    var cells = [c0, cell('free', range(1, gapEnd), t('lFree'))];
    if (first) cells.push(partCell(first, m.readable, 'mbr', true));
    return cells;
  }

  function partCell(p, readable, w, atStart) {
    if (!readable) return cell('lost', atStart ? grp(p.start) + ' →' : '← ' + grp(p.end), t('lLost'));
    var label = h('span', { class: 'dp-dev' }, data(p.name));
    return cell('part', atStart ? grp(p.start) + ' →' : '← ' + grp(p.end), label, { c: colour(p.req), cls: mark(w, 'part-' + p.req).trim() });
  }

  function mbrEnd(s) {
    var m = s.mbr, cells = [];
    var last = m.parts.slice().sort(function (a, b) { return b.end - a.end; })[0];
    if (last) cells.push(partCell(last, m.readable, 'mbr', false));
    var endAt = last ? last.end : 0;
    if (endAt < m.lastUsable) cells.push(cell('free', range(endAt + 1, m.lastUsable), t('lFree')));
    if (m.unreachable) {
      cells.push(cell('unreach', range(m.unreachable.start, m.unreachable.end),
        h('b', null, t('lUnreach'), ' ', data(approx(m.unreachable.bytes))),
        { cls: 'sd-hatch' + mark('mbr', 'unreach') }));
    }
    return cells;
  }

  function gptStart(s) {
    var g = s.gpt;
    var pslots = [{ type: 'ee', name: 'ee' }, { type: 'empty' }, { type: 'empty' }, { type: 'empty' }];
    var grid = [];
    for (var i = 0; i < g.entryCount; i++) {
      var e = g.entries[i];
      grid.push(h('i', e ? { dataset: { c: colour(e.req) } } : null));
    }
    var cells = [
      cell('meta', null, null, { cls: mark('gpt', 'ee').trim(),
        more: [h('span', { class: 'dp-row' }, data('0', 'dp-lba'), h('span', null, t('lPmbr'))), slotsOf(pslots, 'gpt', false)] }),
      cell('meta', '1', g.primaryOk ? t('lHeader') : h('b', null, t('lHeader'), h('br'), t('lDamaged')), { cls: (g.primaryOk ? '' : 'dp-x') + mark('gpt', 'hdr') }),
      cell('meta', null, null, { cls: mark('gpt', 'ent').trim(),
        more: h('span', { class: 'dp-row' },
          h('span', null, data(range(2, g.firstUsable - 1), 'dp-lba'), h('br'), t('lEntries', { n: g.entryCount })),
          h('div', { class: 'dp-entries', 'aria-hidden': 'true' }, grid)) }),
      cell('free', range(g.firstUsable, g.entries[0].start - 1), t('lFree'))
    ];
    cells.push(partCell(g.entries[0], true, 'gpt', true));
    return cells;
  }

  function gptEnd(s) {
    var g = s.gpt, cells = [];
    var last = g.entries[g.entries.length - 1];
    cells.push(partCell(last, true, 'gpt', false));
    if (last.end < g.lastUsable) cells.push(cell('free', range(last.end + 1, g.lastUsable), t('lFree')));
    cells.push(cell('meta', range(g.backupEntriesAt, g.backupAt - 1), t('lBackupEntries'), { cls: 'dp-shrink' }));
    var read = g.readFrom === 'backup';
    cells.push(cell(read ? 'read' : 'meta', grp(g.backupAt), read ? h('b', null, t('lBackupHeader'), ' · ', t('lReadHere')) : t('lBackupHeader'),
      { cls: 'dp-shrink' + mark('gpt', 'bhdr') }));
    return cells;
  }

  function insets(s, w) {
    var start = w === 'mbr' ? mbrStart(s) : gptStart(s);
    var end = w === 'mbr' ? mbrEnd(s) : gptEnd(s);
    return h('div', { class: 'dp-insets' },
      h('div', { class: 'dp-inset', dataset: { at: 'start' } },
        h('span', { class: 'dp-inset-title' }, '↙ ', t('startInset'), ' · ', t('sectorWord'), ' 0 …'),
        h('div', { class: 'dp-cells' }, start)),
      h('div', { class: 'dp-inset', dataset: { at: 'end' } },
        h('span', { class: 'dp-inset-title' }, t('endInset'), ' · … ', t('lLastSector'), ' ', data(grp(s.sectors - 1), 'dp-mono'), ' ↘'),
        h('div', { class: 'dp-cells' }, end)));
  }

  // ── the bar, to scale ──

  function bar(s, w) {
    var S = s.sectors;
    function pos(a, b) { return { left: (a / S * 100) + '%', width: ((b - a + 1) / S * 100) + '%' }; }
    function share(a, b) { return (b - a + 1) / S * 100; }
    var kids = [];
    var regs = L.regions(s, w);
    regs.forEach(function (r) {
      var style = pos(r.start, r.end);
      var cls = 'dp-r' + mark(w, r.key);
      var text = null, ds = { kind: r.kind };
      if (r.key.indexOf('slot-') === 0) return;
      if (r.kind === 'primary' || r.kind === 'logical' || r.kind === 'part') {
        ds.kind = 'part';
        var p = (w === 'mbr' ? s.mbr.parts : s.gpt.entries).filter(function (q) { return 'part-' + q.req === r.key; })[0];
        ds.c = colour(p.req);
        if (share(r.start, r.end) > 4.5) text = data(r.name + (share(r.start, r.end) > 9 ? ' · ' + human((r.end - r.start + 1) * s.sectorSize) : ''));
      } else if (r.kind === 'lost') {
        if (share(r.start, r.end) > 3) text = t('lUnknown');
      } else if (r.kind === 'extended') {
        text = null;
      } else if (r.kind === 'unreachable') {
        ds.kind = 'unreach';
        cls += ' sd-hatch';
        text = h('span', null, t('lUnreach'), ' ', data(approx(s.mbr.unreachable.bytes)));
      } else if (r.kind === 'protective') {
        ds.kind = 'ee';
        text = h('span', null, t('lEe'));
      } else if (r.kind === 'damaged' || r.kind === 'read') {
        ds.kind = 'meta';
        if (r.kind === 'damaged') cls += ' dp-x';
      } else if (r.kind === 'ebr') {
        ds.kind = 'ebr';
      } else ds.kind = 'meta';
      // metadata at the end of the disk sits flush right
      if (ds.kind === 'meta' && r.start > S / 2) { style = { right: '0', width: ((r.end - r.start + 1) / S * 100) + '%' }; }
      kids.push(h('div', { class: cls, dataset: ds, style: style }, text));
    });
    if (w === 'gpt' && s.gpt.oldTool && s.gpt.protectiveShort) {
      kids.push(h('div', { class: 'dp-r sd-hatch', dataset: { kind: 'beyond' }, style: pos(s.gpt.protective.end + 1, S - 1) },
        h('span', null, t('lBeyond'))));
    }
    var limitAt = L.MBR_FIELD;
    if (S > limitAt && (w === 'mbr' || s.gpt.oldTool)) kids.push(h('div', { class: 'dp-tick', style: { left: (limitAt / S * 100) + '%' } }));
    return h('div', { class: 'dp-bar' }, kids);
  }

  function axis(s, w) {
    var S = s.sectors, out = [h('span', { style: { left: '0' } }, '0 · ↑ ', t('toScale'))];
    if (S > L.MBR_FIELD && (w === 'mbr' || s.gpt.oldTool)) {
      out.push(h('span', { class: 'dp-axis-limit', style: { left: (L.MBR_FIELD / S * 100) + '%' } },
        data('2³² · ' + tib(L.MBR_FIELD * s.sectorSize))));
    }
    out.push(h('span', { style: { right: '0' } }, data(diskLabel(s) + ' · ' + compact(s.bytes))));
    return h('div', { class: 'dp-axis' }, out);
  }

  function strip(s, w) {
    var title = w === 'mbr' ? t('mbrTitle') : t('gptTitle');
    var facts = w === 'mbr' ? t('mbrFacts', { limit: tib(s.mbrLimitBytes) }) : t('gptFacts', { used: s.gpt.entries.length, n: s.gpt.entryCount });
    return h('section', { class: 'dp-strip', dataset: { w: w } },
      h('div', { class: 'dp-head' }, h('h2', null, title), h('span', { class: 'dp-facts' }, facts)),
      insets(s, w),
      bar(s, w),
      axis(s, w));
  }

  // ── the tables ──

  function row(w, key, kind, cells) {
    return h('tr', { class: mark(w, key) ? 'dp-chg' : null, dataset: { kind: kind } }, cells.map(function (c, i) {
      return h('td', { class: i > 0 && i < 5 ? 'dp-num' : null }, c);
    }));
  }
  function devCell(name, k, req) {
    var ds = { k: k };
    if (req) ds.c = colour(req);
    return h('span', { class: 'dp-dev' }, h('i', { dataset: ds }), data(name));
  }
  function pos3(s, a, b) {
    var ss = s.sectorSize;
    return [data(compact(a * ss)), data(compact((b + 1) * ss - 1)), data(compact((b - a + 1) * ss))];
  }

  function mbrTable(s) {
    var m = s.mbr;
    var head = h('h3', null, t('mbrTitle'), h('small', null, t.parts('tableHead', { label: data('msdos'), disk: data(compact(s.bytes)), ss: s.sectorSize })));
    if (m.damaged) return h('div', { class: 'dp-table' }, head, h('p', { class: 'dp-msg' }, t('tUnrecognised')));
    var rows = [];
    var all = m.parts.slice();
    if (m.extended) all.push({ name: m.extended.name, num: m.extended.num, type: 'extended', start: m.extended.start, end: m.extended.end });
    all.sort(function (a, b) { return a.num - b.num; });
    all.forEach(function (p) {
      var type = t(p.type === 'primary' ? 'tPrimary' : p.type === 'extended' ? 'tExtended' : 'tLogical');
      if (m.clipped.indexOf(p.req) >= 0) type = [type, ' · ', t('rowClipped')];
      rows.push(row('mbr', p.type === 'extended' ? 'ext' : 'part-' + p.req, p.type,
        [devCell(p.name, p.type, p.type === 'extended' ? null : p.req), data(p.num)].concat(pos3(s, p.start, p.end), [type])));
    });
    if (m.missing.length) {
      rows.push(h('tr', { dataset: { kind: 'missing' } }, h('td', null, '✕'),
        h('td', { colspan: '5' }, t.n('rowMissing', m.missing.length))));
    }
    return h('div', { class: 'dp-table' }, head, h('table', null,
      h('thead', null, h('tr', null, ['colDev', 'colNum', 'colStart', 'colEnd', 'colSize', 'colType'].map(function (k) { return h('th', null, t(k)); }))),
      h('tbody', null, rows)));
  }

  function gptTable(s) {
    var g = s.gpt;
    var note = [g.oldTool ? h('span', { class: 'dp-note' }, t('tOld')) : null,
      g.readFrom === 'backup' && !g.oldTool ? h('span', { class: 'dp-note' }, t('tFromBackup')) : null];
    var head = h('h3', null, t('gptTitle'), h('small', null, t.parts('tableHead', { label: data(g.oldTool ? 'msdos' : 'gpt'), disk: data(compact(s.bytes)), ss: s.sectorSize })), note);
    var rows, cols;
    if (g.oldTool) {
      var pe = g.protective;
      cols = ['colDev', 'colNum', 'colStart', 'colEnd', 'colSize', 'colType'];
      rows = [row('gpt', 'ee', 'ee', [devCell(s.dev + '1', 'ee', null), data(1)].concat(pos3(s, pe.start, pe.end), [[data('ee'), ' · ', t('tEe')]]))];
    } else {
      cols = ['colDev', 'colNum', 'colStart', 'colEnd', 'colSize', 'colName'];
      rows = g.entries.map(function (e) {
        return row('gpt', 'part-' + e.req, 'part', [devCell(e.name, 'primary', e.req), data(e.num)].concat(pos3(s, e.start, e.end), [data(e.label)]));
      });
    }
    return h('div', { class: 'dp-table' }, head, h('table', null,
      h('thead', null, h('tr', null, cols.map(function (k) { return h('th', null, t(k)); }))),
      h('tbody', null, rows)));
  }

  // ── render and caption ──

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'dp' },
      strip(s, 'mbr'), strip(s, 'gpt'),
      h('div', { class: 'dp-tables' }, mbrTable(s), gptTable(s))));
  }

  function caption(c) {
    var s = c.state;
    var k = L.captionKey(s);
    var limit = tib(s.mbrLimitBytes);
    var g = s.gpt, m = s.mbr;
    var gLast = g.entries[g.entries.length - 1];
    var mLast = m.parts.slice().sort(function (a, b) { return b.end - a.end; })[0];
    var back = g.entrySectors + 1;
    var vars = {
      disk: diskLabel(s), limit: limit, n: g.entries.length,
      gEnd: data(compact((gLast.end + 1) * s.sectorSize - 1)),
      mEnd: data(mLast ? compact((mLast.end + 1) * s.sectorSize - 1) : ''),
      gap: t.n('gapSectors', s.sectors - 1 - gLast.end, { k: grp(s.sectors - 1 - gLast.end) }),   // plural from the raw count
      back: t.n('backSectors', back, { k: back }),
      ext: data(m.extended ? m.extended.name : ''),
      g: data(g.entries[3] ? g.entries[3].name : ''),
      m: data(m.logical[0] ? m.logical[0].name : '')
    };
    var out = t.parts(k.key, vars);
    k.notes.forEach(function (nt) {
      out.push(' ', nt.key === 'nMissing' ? t.n('nMissing', nt.n, { n: nt.n, limit: limit }) : t(nt.key, { limit: limit }));
    });
    return out;
  }

  var labels = { 'book-vdb': 'pBook', 'four-tb': 'pFour', 'five-parts': 'pFive', 'old-tool': 'pOld', 'damaged-header': 'pDamaged' };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'disk', type: 'choice', value: L.defaults.disk, label: t('disk'), options: [['2GiB', t('d2g')], ['1TB', t('d1t')], ['4TB', t('d4t')]] },
      { key: 'sector', type: 'choice', value: L.defaults.sector, label: t('sector'), options: [[512, t('s512')], [4096, t('s4k')]] },
      { key: 'parts', type: 'range', value: L.defaults.parts, label: t('parts'), min: 1, max: L.MAX_PARTS, step: 1 },
      { key: 'oldTool', type: 'toggle', label: t('oldTool') },
      { key: 'damageHeader', type: 'toggle', label: t('damageHeader'), hint: t('damageHint') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'dp-meta', label: t('legMeta') },
      { shape: 'bg-fill', c: 1, label: t('legPart') },
      { shape: 'dp-ext', label: t('legExt') },
      { shape: 'dp-unreach', label: t('legUnreach') },
      { shape: 'dp-ee', label: t('legProt') },
      { shape: 'dp-x', label: t('legDamaged') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
