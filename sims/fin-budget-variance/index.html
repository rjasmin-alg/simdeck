     budget said and what the report booked: twelve month columns with a stacked bar of the booked actuals (cloud,
     licences), the budget mark across each column, a dashed box where service was used but not yet invoiced, and
     hatched run-rate bars for the months still to come. Beneath: the variance to date by part, and the year-end

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var Lg = window.SimdeckModels.ledger;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var Y = L.YEAR;

  // ── numbers and months in the page's language ──

  /** A whole number with thousands grouped (12 000 / 12,000), the Croatian space non-breaking. */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '\u00a0' : ',');
  }
  /** Euros, rounded to the euro. Minus is U+2212. */
  function money(x) {
    var r = Lg.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  /** A variance with its sign: +€1,500, −€11,500, €0. */
  function signed(x) {
    var r = Lg.roundMoney(x);
    return (r > 0 ? '+' : r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  function short(x) {
    var r = Lg.roundMoney(x);
    return (r > 0 ? '+' : r < 0 ? '−' : '') + group(Math.abs(r));
  }
  function sideOf(x) { return x > 0 ? 'over' : x < 0 ? 'under' : 'on'; }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  var SHORT = t('monthsShort').split('|'), LONG = t('monthsLong').split('|'), LOC = t('monthsLoc').split('|');
  function cal(m, fy) { return L.calMonth(m, fy) - 1; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /** 1, 2, 2.5, 5 × 10^k: the smallest step at or above x. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }

  /** Scales that stay put while stepping: from the whole year under these params. */
  var scaleKey = null, scale = null;
  function scales(params) {
    var key = JSON.stringify(L.normalise(params));
    if (key === scaleKey) return scale;
    var all = [];
    for (var n = 0; n <= Y; n++) all.push(L.compute(n, params));
    var s12 = all[Y];
    var monthMax = 0;
    for (var m = 1; m <= Y; m++) monthMax = Math.max(monthMax, s12.month.booked[m], s12.month.expense[m], s12.month.budget[m]);
    var step = niceStep(monthMax / 4);
    var partMax = 1000, fcMax = s12.budgetYear;
    all.forEach(function (s) {
      partMax = Math.max(partMax, Math.abs(s.ytd.vol), Math.abs(s.ytd.price), Math.abs(s.ytd.timing), Math.abs(s.ytd.variance));
      fcMax = Math.max(fcMax, s.forecast);
    });
    scaleKey = key;
    scale = { top: Math.max(step, Math.ceil(monthMax / step) * step), step: step, part: partMax, fc: fcMax * 1.04 };
    return scale;
  }

  function pct(v, top) { return (100 * v / top) + '%'; }
  function when(m, n) { return m < n ? 'past' : m === n ? 'now' : 'future'; }
  function place(el, c, r) { el.style.gridColumn = String(c); if (r) el.style.gridRow = String(r); return el; }

  // ── the month chart ──

  function chart(s, sc) {
    var top = sc.top, n = s.n;
    var ticks = [], grid = [];
    for (var v = 0; v <= top + 1e-6; v += sc.step) {
      ticks.push(h('span', { class: 'bv-tick', translate: 'no', style: { top: (100 - 100 * v / top) + '%' } }, money(v)));
      if (v > 0) grid.push(h('div', { class: 'bv-gl', style: { bottom: pct(v, top) } }));
    }
    var out = [
      h('p', { class: 'bv-h' }, t('chartTitle')),
      h('div', { class: 'bv-axis', 'aria-hidden': 'true' }, ticks),
      h('div', { class: 'bv-plot' }, grid)
    ];
    var cloud = s.lines[0], lic = s.lines[1];
    for (var m = 1; m <= Y; m++) {
      var w = when(m, n), c = m + 1, kids = [];
      out.push(place(h('div', { class: 'bv-colbg', dataset: { when: w } }), c));
      if (m <= n) {
        var cb = cloud.booked[m], acc = Math.max(0, cloud.accrual[m]);
        kids.push(h('div', { class: 'bv-seg', dataset: { k: 'cloud', c: '1' }, style: { bottom: '0', height: pct(cb, top) } }));
        if (acc > 0) kids.push(h('div', { class: 'bv-acc', dataset: { c: '1' }, style: { bottom: pct(cb - acc, top), height: pct(acc, top) } }));
        kids.push(h('div', { class: 'bv-seg', dataset: { k: 'lic', c: '2' }, style: { bottom: pct(cb, top), height: pct(lic.booked[m], top) } }));
        var booked = s.month.booked[m], used = s.month.expense[m];
        if (used > booked) kids.push(h('div', { class: 'bv-miss', style: { bottom: pct(booked, top), height: pct(used - booked, top) } }, '?'));
      } else if (n > 0) {
        kids.push(h('div', { class: 'bv-fc', style: { height: pct(s.runRate, top) } }));
      }
      kids.push(h('div', { class: 'bv-bud', style: { bottom: pct(s.month.budget[m], top) } }));
      out.push(place(h('div', { class: 'bv-col' }, kids), c));
      out.push(place(h('div', { class: 'bv-mname' },
        h('span', { class: 'bv-mshort' }, SHORT[cal(m, s.fy)]), h('span', { class: 'bv-mnum', translate: 'no' }, String(m))), c));
      var mv = m <= n ? s.month.booked[m] - s.month.budget[m] : null;
      out.push(place(h('div', { class: 'bv-mvar', translate: 'no', dataset: { s: mv === null ? 'none' : sideOf(mv) } },
        mv === null ? '' : short(mv)), c));
    }
    return h('div', { class: 'bv-chart' }, out);
  }

  // ── the variance to date ──

  function partRow(name, sub, value, c, max, extra) {
    var w = 50 * Math.min(1, Math.abs(value) / max);
    var side = sideOf(value);
    var bar = value === 0 ? null : h('span', { class: 'bv-pbar', dataset: { c: c, s: side },
      style: side === 'over' ? { left: '50%', width: w + '%' } : { right: '50%', width: w + '%' } });
    var cls = extra ? ' ' + extra : '';
    return [
      h('div', { class: 'bv-pname' + cls }, h('b', null, name), sub ? [' ', h('span', null, sub)] : null),
      h('div', { class: 'bv-track' + cls, 'aria-hidden': 'true' }, bar),
      h('div', { class: 'bv-pval' + cls, translate: 'no' }, signed(value))
    ];
  }

  function bridge(s, sc) {
    var d = s.ytd;
    return h('section', { class: 'bv-box' },
      h('p', { class: 'bv-h' }, t('bridgeTitle')),
      h('p', { class: 'bv-from' }, t.parts('fromTo', { bud: b(money(d.budget)), act: b(money(d.booked)) })),
      h('div', { class: 'bv-parts' },
        partRow(t('bVol'), t('bVolSub'), d.vol, '3', sc.part),
        partRow(t('bPrice'), t('bPriceSub'), d.price, '4', sc.part),
        partRow(t('bTiming'), t('bTimingSub'), d.timing, '6', sc.part),
        partRow(t('bTotal'), null, d.variance, '8', sc.part, 'bv-total'),
        h('span'), h('div', { class: 'bv-ends' }, h('span', null, '◀ ' + t('wUnder')), h('span', null, t('wOver') + ' ▶')), h('span')));
  }

  // ── the forecast ──

  function forecast(s, sc) {
    var max = sc.fc, n = s.n;
    var budgetLine = h('span', { class: 'bv-fline', style: { left: pct(s.budgetYear, max) } });
    var fcKids = [];
    if (n === 0) fcKids.push(h('span', { class: 'bv-fseg', dataset: { k: 'rest' }, style: { width: pct(s.forecast, max) } }));
    else {
      fcKids.push(h('span', { class: 'bv-fseg', dataset: { k: 'rest' }, style: { width: pct(s.forecast, max) } }));
      fcKids.push(h('span', { class: 'bv-fseg', dataset: { k: 'done' }, style: { width: pct(s.ytd.booked, max) } }));
    }
    fcKids.push(budgetLine);
    var rule = n === 0 ? t('fcNone') : n === Y ? t('fcFinal')
      : t.parts('fcRule', { done: money(s.ytd.booked), rate: money(s.runRate), k: t.n('nMonths', s.left) });
    var side = sideOf(s.fcVariance);
    return h('section', { class: 'bv-box' },
      h('p', { class: 'bv-h' }, t('fcTitle')),
      h('div', { class: 'bv-fcrows' },
        h('span', null, t('fcBudget')),
        h('div', { class: 'bv-ftrack', 'aria-hidden': 'true' }, h('span', { class: 'bv-fseg', dataset: { k: 'budget' }, style: { width: pct(s.budgetYear, max) } })),
        h('span', { class: 'bv-fval', translate: 'no' }, money(s.budgetYear)),
        h('span', null, t('fcForecast')),
        h('div', { class: 'bv-ftrack', 'aria-hidden': 'true' }, fcKids),
        h('span', { class: 'bv-fval', translate: 'no' }, money(s.forecast))),
      h('p', { class: 'bv-rule' }, rule),
      h('p', { class: 'bv-verdict' }, side === 'on' ? t('wOn') : [signed(s.fcVariance), ' ', t(side === 'over' ? 'wOver' : 'wUnder')]));
  }

  function render(c) {
    var s = c.state, sc = scales(c.params);
    c.stage.replaceChildren(h('div', { class: 'bv' },
      chart(s, sc),
      h('div', { class: 'bv-low' }, bridge(s, sc), forecast(s, sc)),
      h('p', { class: 'bv-foot' }, t('illustrative'))));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var cloud = s.lines[0], lic = s.lines[1], n = s.n;
    var x = 0;
    if (k.lead === 'cVolume') x = L.VOLUME.add * cloud.budgetPrice;
    else if (k.lead === 'cPrice') x = (L.PRICE.to - lic.budgetPrice) * lic.qty[L.PRICE.from];
    else if (n === Y) x = Math.abs(s.ytd.variance);
    else x = Math.abs(s.now.variance);
    var vars = {
      month: h('b', null, n > 0 ? cap(LONG[cal(n, s.fy)]) : ''),
      x: b(money(x)),
      d: b(money(Math.abs(s.ytd.variance))),
      qty: b(group(cloud.qty[L.VOLUME.from])),
      price: b(money(L.PRICE.to)),
      bp: b(money(lic.budgetPrice)),
      fc: b(money(s.forecast)),
      miss: b(money(cloud.expense[L.LATE.month])),
      rate: b(money(s.runRate)),
      s: b(money(s.spent)),
      m10: LOC[cal(L.SPEND.looked, s.fy)],
      act: b(money(s.ytd.booked)),
      bud: b(money(s.ytd.budget)),
      vol: b(signed(s.ytd.vol)),
      prc: b(signed(s.ytd.price)),
      tim: b(signed(s.ytd.timing)),
      mb: b(money(s.month.budget[1])),
      yb: b(money(s.budgetYear))
    };
    var out = t.parts(k.lead, vars);
    if (k.gap) out.push(' ', t.parts(k.gap, vars));
    return out;
  }

  var labels = { all: 'prAll', real: 'prReal', late: 'prLate', 'use-it': 'prUseIt', accrued: 'prAccrued' };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'volume', type: 'toggle', label: t('pVolume') },
      { key: 'price', type: 'toggle', label: t('pPrice') },
      { key: 'late', type: 'toggle', label: t('pLate') },
      { key: 'accrue', type: 'toggle', label: t('pAccrue') },
      { key: 'spend', type: 'toggle', label: t('pSpend') },
      { key: 'fy', type: 'select', label: t('fy'),
        options: LONG.map(function (name, i) { return [i + 1, cap(name)]; }) }
    ],
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
      { c: 1, label: t('legCloud') },
      { shape: 'bv-lic', c: 2, label: t('legLic') },
      { shape: 'bv-bud', label: t('legBudget') },
      { shape: 'bv-miss', label: t('legMissing') },
      { shape: 'bv-acc', c: 1, label: t('legAccrual') },
      { shape: 'bv-fc', label: t('legForecast') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
