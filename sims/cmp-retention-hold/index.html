<!-- cmp-retention-hold: each record class is kept for a period counted from a trigger, and deleting it afterwards is
     an obligation too (storage limitation); a legal hold suspends deletion for the records a dispute touches; deleted
     data lives on in backups until they age out.
     The stage: four numbers (kept too long, deleted on time, deleted during the dispute, erased but still in the
     backups); the dispute's and the backups' steppers; a timeline 2020–2031, one row per record in three lanes (one per
     class, with its retention stepper), each record a bar: in use, within retention, needed by the dispute, kept too
     long, then its deletion mark and its life in the backups; the dispute as a band behind the rows, the chosen year
     as a line. Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';

  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function int(x) { return new Intl.NumberFormat(LOCALE).format(Math.round(x)); }
  function at(m) { return (m / L.MONTHS * 100) + '%'; }
  function month(m) { var y = L.Y0 + Math.floor(m / 12), mm = m % 12 + 1; return (mm < 10 ? '0' : '') + mm + '/' + y; }
  /** A period in months: whole years as years, else months. */
  function period(n) { return n % 12 === 0 ? t.n('years', n / 12, { n: int(n / 12) }) : t.n('months', n, { n: int(n) }); }
  function recName(x) { return t('rec_' + x.cls, { name: x.name }); }
  function rowName(x) { return x.cls === 'app' ? t('appName', { y: x.name }) : x.name; }

  var sim = null;
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to the same button
  function btn(sel, attrs, run, kids) {
    return h('button', Object.assign({ type: 'button', class: 'rh-b', onmousedown: noFocus, dataset: { sel: sel },
      onclick: function (e) {
        if (this.getAttribute('aria-disabled') === 'true') return;
        refocus = e.detail === 0 ? sel : null; run();
      } }, attrs), kids);
  }
  /** A − value + stepper over a list of values (or a range when list is null). */
  function stepper(sel, key, list, lo, hi, value, shown, down, up) {
    function move(dir) {
      return function () {
        var o = {}, cur = sim.params[key];
        o[key] = list ? L.stepList(list, cur, dir) : Math.min(hi, Math.max(lo, cur + dir));
        sim.set(o);
      };
    }
    var atLo = list ? value <= list[0] : value <= lo, atHi = list ? value >= list[list.length - 1] : value >= hi;
    return h('span', { class: 'rh-step' },
      btn(sel + '-', { 'aria-label': down, 'aria-disabled': String(atLo) }, move(-1), '−'),
      h('span', { class: 'rh-sv rh-num' }, shown),
      btn(sel + '+', { 'aria-label': up, 'aria-disabled': String(atHi) }, move(1), '+'));
  }

  // ── the four numbers ──

  function tile(kind, label, value, sub) {
    return h('div', { class: 'rh-k', dataset: { kind: kind } }, h('span', null, label),
      h('b', { class: 'rh-num', translate: 'no' }, value), sub);
  }

  function tiles(s) {
    var m = s.m, c = m.counts;
    return h('div', { class: 'rh-tiles' },
      tile(m.overRecords > 0 ? 'bad' : 'plain', t('kTooLong'), int(m.overRecords),
        h('small', null, t.n('kTooLongSub', m.over, { m: int(m.over) }))),
      tile(m.deleted > 0 && c.late === 0 && c.underHold === 0 ? 'good' : 'plain', t('kOnTime'), int(c.onTime),
        h('small', null, t('kOnTimeSub', { d: int(m.deleted), l: int(c.late) }))),
      tile(c.underHold > 0 ? 'bad' : 'plain', t('kUnderHold'), int(c.underHold),
        h('small', null, s.span ? t('kUnderHoldSub') : t('kUnderHoldNone'))),
      tile(m.inBackup > 0 ? 'backup' : 'plain', t('kBackup'), int(m.inBackup),
        h('small', null, m.inBackup > 0 ? t('kBackupSub', { date: month(m.lastBackup) }) : t('kBackupNone'))));
  }

  // ── the dispute's and the backups' steppers ──

  function controls(s) {
    var p = s.p;
    var dispute = s.span
      ? [stepper('from', 'from', null, L.FROM_MIN, L.FROM_MAX, p.from, t('ctlFrom', { y: p.from }), t('fromDown'), t('fromUp')),
        stepper('len', 'years', null, L.LEN_MIN, L.LEN_MAX, p.years, t.n('years', p.years, { n: int(p.years) }), t('lenDown'), t('lenUp'))]
      : [h('span', { class: 'rh-sv' }, t('ctlNone'))];
    return h('div', { class: 'rh-ctl' },
      h('span', { class: 'rh-grp' }, h('span', { class: 'rh-head' }, t('ctlNow')),
        stepper('now', 'now', null, L.Y0, L.Y0 + L.YEARS - 1, p.now, String(p.now), t('nowDown'), t('nowUp'))),
      h('span', { class: 'rh-grp' }, h('span', { class: 'rh-head' }, t('ctlDispute')), dispute),
      h('span', { class: 'rh-grp' }, h('span', { class: 'rh-head' }, t('ctlBackup')),
        stepper('backup', 'backup', L.BACKUP_STEPS, 0, 0, p.backup, period(p.backup), t('backupDown'), t('backupUp'))));
  }

  // ── the timeline ──

  function row(x, first, gridRow) {
    var kids = x.segs.map(function (g) {
      return h('span', { class: 'rh-seg', dataset: { k: g.k }, style: { left: at(g.a), width: at(g.b - g.a) } });
    });
    if (x.del !== null) {
      var glyph = x.status === 'onTime' ? '✓' : x.status === 'late' ? '!' : '✕';
      kids.push(h('span', { class: 'rh-mark', dataset: { k: x.status }, style: { left: at(x.del) } }, glyph));
    }
    return h('div', { class: 'rh-row', role: 'img', dataset: { first: String(first) }, style: { gridRow: String(gridRow) },
      'aria-label': t('rowLabel', { name: x.cls === 'app' ? t('appName', { y: x.name }) : recName(x), status: t('st_' + x.status) }) }, kids);
  }

  function timeline(s) {
    // grid row 1: the labels above the rows; then per lane a header row (used on a phone only, empty and 0 high on
    // the projector, where the header spans its records' rows at the left) and one row per record
    var p = s.p, kids = [], r = 2, heads = [];
    var first = r;
    L.CLASSES.forEach(function (cls) {
      var recs = s.recs.filter(function (x) { return x.cls === cls; });
      if (!recs.length) return;
      var key = L.RET_KEYS[cls], what = t('cls_' + cls);
      heads.push(r);
      r++;
      kids.push(h('div', { class: 'rh-lane', style: { '--span': r + ' / span ' + recs.length, '--hrow': String(r - 1) } },
        h('b', null, what), h('small', null, t('trig_' + cls)),
        stepper('ret-' + cls, key, L.RET_STEPS[cls], 0, 0, p[key], period(p[key]),
          t('retDown', { what: what }), t('retUp', { what: what }))));
      recs.forEach(function (x, i) {
        kids.push(h('div', { class: 'rh-name', dataset: { first: String(i === 0) }, style: { gridRow: String(r) } },
          h('span', { translate: x.cls === 'app' ? null : 'no' }, rowName(x)),
          x.touched ? h('span', { class: 'rh-tag' }, t('touched')) : null));
        kids.push(row(x, i === 0, r));
        r++;
      });
    });
    var last = r;                                     // rows first … last − 1: lane header rows and records

    // behind the rows: year lines, the dispute band (and the hold after it), the future, the chosen year
    var over = [];
    for (var y = 0; y <= L.YEARS; y++) over.push(h('span', { class: 'rh-yr', style: { left: at(y * 12) } }));
    var labels = [];
    var end = s.now + 1;
    if (s.span && s.span.from < end) {
      var a = s.span.from, z = Math.min(s.span.to, end);
      over.push(h('span', { class: 'rh-band', style: { left: at(a), width: at(z - a) } }));
      if (p.hold === 'forgotten' && s.span.to < end)
        over.push(h('span', { class: 'rh-band', dataset: { k: 'forgotten' }, style: { left: at(s.span.to), width: at(end - s.span.to) } }));
      var holdKey = { paper: 'bandPaper', held: 'bandHeld', all: 'bandAll', forgotten: 'bandHeld' }[p.hold];
      var text = (p.years === 1 ? t('bandDispute1', { a: p.from }) : t('bandDispute', { a: p.from, b: p.from + p.years - 1 })) + ' · ' +
        t(p.hold === 'forgotten' && s.span.to < end ? 'bandForgotten' : holdKey);
      labels.push(h('span', { dataset: { flip: String(a / L.MONTHS > 0.55) }, style: { left: a / L.MONTHS > 0.55 ? at(z) : at(a) } }, text));
    }
    if (end < L.MONTHS) over.push(h('span', { class: 'rh-future', style: { left: at(end) } }));
    over.push(h('span', { class: 'rh-now', style: { left: at(end) } }));
    if (!labels.length) labels.push(h('span', { dataset: { flip: String(end / L.MONTHS > 0.5) }, style: { left: at(end) } },
      t('nowLabel', { y: p.now })));

    var ticks = [];
    for (var k = 0; k < L.YEARS; k++) ticks.push(h('span', { class: 'rh-tick rh-num', style: { left: at(k * 12 + 6) } }, String(L.Y0 + k)));

    var rows = ['auto'];
    for (var i = first; i < last; i++) rows.push(heads.indexOf(i) >= 0 ? 'auto' : 'minmax(0, 1fr)');
    rows.push('auto');
    return h('div', { class: 'rh-tl', style: { gridTemplateRows: rows.join(' ') } },
      h('div', { class: 'rh-labels', style: { gridRow: '1' } }, labels),
      h('div', { class: 'rh-over', 'aria-hidden': 'true', style: { gridRow: first + ' / ' + last } }, over),
      kids,
      h('div', { class: 'rh-axis', 'aria-hidden': 'true', style: { gridRow: String(last) } }, ticks));
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    c.stage.replaceChildren(h('div', { class: 'rh' }, tiles(s), controls(s), timeline(s), h('p', { class: 'rh-foot' }, t('foot'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, m = s.m, k = L.captionKey(s), x = L.touchedRecord(s);
    var out = t.parts(k.key, {
      y: b(s.p.now), kept: b(int(m.counts.active + m.counts.kept + m.counts.held)), tooLong: b(int(m.overRecords)),
      del: b(int(m.deleted)), ok: b(int(m.counts.onTime))
    });
    var n = {
      nForgotten: function () { return period(L.overFrom(x, s.span.to)); },
      nAll: function () { return int(L.allDelayed(s)); },
      nBackup: function () { return int(m.inBackup); }
    };
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, {
        rec: b(x ? recName(x) : ''),
        date: b(x && x.del !== null ? month(x.del) : ''),
        end: b(s.span ? month(s.span.to - 1) : ''),
        n: b(n[key] ? n[key]() : ''),
        max: b(period(m.waitMax)),
        until: b(m.lastBackup !== null ? month(m.lastBackup) : '')
      }));
    });
    return out;
  }

  var noDispute = function (p) { return p.dispute === 'none' ? t('noDispute') : false; };
  var hidden = function () { return false; };
  var labels = { none: 'pNone', routine: 'pRoutine', paper: 'pPaper', held: 'pHeld', forgotten: 'pForgotten', archive: 'pArchive' };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'now', type: 'range', label: t('ctlNow'), min: L.Y0, max: L.Y0 + L.YEARS - 1, step: 1, visible: hidden },
      { key: 'purge', type: 'choice', label: t('purge'),
        options: [['none', t('purgeNone')], ['yearly', t('purgeYearly')], ['monthly', t('purgeMonthly')]] },
      { key: 'dispute', type: 'choice', label: t('dispute'),
        options: [['none', t('disputeNone')], ['customer', t('disputeCustomer')], ['employee', t('disputeEmployee')]] },
      { key: 'hold', type: 'choice', label: t('hold'), disabled: noDispute,
        options: [['paper', t('holdPaper')], ['held', t('holdHeld')], ['forgotten', t('holdForgotten')], ['all', t('holdAll')]] },
      { key: 'from', type: 'range', label: t('fromUp'), min: L.FROM_MIN, max: L.FROM_MAX, step: 1, visible: hidden },
      { key: 'years', type: 'range', label: t('lenUp'), min: L.LEN_MIN, max: L.LEN_MAX, step: 1, visible: hidden },
      { key: 'retApp', type: 'range', label: t('cls_app'), min: 3, max: 60, step: 1, visible: hidden },
      { key: 'retContract', type: 'range', label: t('cls_contract'), min: 12, max: 120, step: 1, visible: hidden },
      { key: 'retStaff', type: 'range', label: t('cls_staff'), min: 12, max: 120, step: 1, visible: hidden },
      { key: 'backup', type: 'range', label: t('ctlBackup'), min: 1, max: 120, step: 1, visible: hidden }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'rh-use', label: t('legUse') },
      { shape: 'rh-keep', label: t('legKeep') },
      { shape: 'rh-need', label: t('legNeed') },
      { shape: 'rh-over', label: t('legOver') },
      { shape: 'rh-onTime', label: t('legDel') },
      { shape: 'rh-late', label: t('legLate') },
      { shape: 'rh-underHold', label: t('legUnder') },
      { shape: 'rh-backup', label: t('legBackup') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
