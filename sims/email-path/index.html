<!-- email-path: the path of one e-mail. A stepper, one hand-over per step (submission, MX lookup, relay, delivery,
     fetch, read). Left: the hand-overs as kit view K1 (kit/sequence.js), one lane per role: the sender's MUA, the
     sending server (MSA, then MTA), DNS, the receiving MTA, the delivery agent with the mailbox, the recipient's MUA
     with two devices. Right: the message as an envelope (MAIL FROM, RCPT TO) around a letter (trace lines, header,
     body), and the log line each server wrote. Model: sim.js; rules: SPEC.md; words: strings.js. -->

/* the port badge on a chip, and the read dots */

  [data-sim="email-path"] .ep-mid { grid-column: auto; }

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (addresses, host names, ports, header lines) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'ep-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text)); }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function ch(on, c) { return on ? 'sd-changed' + anim(c) : null; }
  function port(n) { return h('span', { class: 'ep-port', translate: 'no' }, String(n)); }
  function dot(seen) { return h('span', { class: 'ep-dot', dataset: { seen: String(!!seen) }, 'aria-hidden': 'true' }); }
  function devName(id) { return t(id === 'phone' ? 'devPhoneName' : 'devComputerName'); }
  function devCap(id) { return t(id === 'phone' ? 'devPhone' : 'devComputer'); }
  var COLOR = { A: 1, P: 2, D: 8, M: 4, S: 3, I: 6 };
  var CAUSE = { smtp: null, reply: 'cRefuse', 'dns-q': null, 'dns-a': null, 'note-local': 'cLocal', deliver: 'cDeliver',
    imap: 'cFetch', pop3: 'cFetch', 'imap-seen': 'cRead', 'note-read': 'cRead' };

  // ── the chart (K1) ──

  function rowSpec(r, s, changed) {
    var c = COLOR[r.from], o = { from: r.from, to: r.to, c: c, changed: changed, time: String(r.n) };
    var cause = CAUSE[r.kind];
    switch (r.kind) {
      case 'smtp':
        o.label = h('span', null, data('SMTP', ''), port(r.port));
        if (r.port === L.PORT.submission) { cause = 'cSubmit'; if (r.auth === false) o.fields = h('span', null, t('noAuth')); }
        else { cause = 'cRelay'; }
        break;
      case 'reply':
        o.label = r.code + ' ' + r.enh; o.fields = h('span', null, t('refused')); o.line = 'dashed';
        break;
      case 'dns-q':
        o.label = 'MX?'; o.fields = r.domain; o.line = 'dotted'; cause = null; o.time = String(r.n);
        o.cause = data('MX', '');
        break;
      case 'dns-a':
        o.label = r.pref + ' ' + r.host; o.place = 'mid'; o.line = 'dotted'; o.time = '';
        break;
      case 'note-local':
        return { kind: 'note', lane: r.from, text: t('noteLocal'), k: 'solid', time: String(r.n), cause: t('cLocal'), changed: changed };
      case 'note-read':
        return { kind: 'note', lane: r.from, text: t('noteRead'), k: 'solid', time: String(r.n), cause: t('cRead'), changed: changed };
      case 'deliver':
        o.label = 'LMTP';
        break;
      case 'imap': case 'pop3':
        o.label = h('span', null, data(r.kind.toUpperCase(), ''), port(r.port)); o.fields = h('span', null, devName(r.device));
        if (r.removed) o.re = { S: h('span', null, t('removedQuit')) };
        else if (!r.count) o.re = { S: h('span', null, t('rowNone')) };
        break;
      case 'imap-seen':
        o.label = h('span', null, data('IMAP', ''), port(r.port)); o.fields = '\\Seen';
        break;
    }
    if (cause && !o.cause) o.cause = t(cause);
    return o;
  }

  function renderChart(c) {
    var s = c.state, n = s.n;
    var rows = s.rows.map(function (r) { return rowSpec(r, s, r.n === n && c.n > 0); });
    var lanes = L.SCENES[s.scene].lanes.map(function (id) { return lane(id, c); });
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '5.8rem',
      lanes: lanes,
      rows: rows,
      empty: t('chartEmpty'),
      earlier: function (k) { return t.n('earlier', k); }
    });
  }

  /** The role words each server writes in its own log (UL ch20, figure put-poruke). In the grafo scene the sending
      server delivers itself and never carries the message on. */
  var LOGS = { P: ['logReceive', 'logSend'], M: ['logReceive'], S: ['logDeliver'] };
  var ABBR = { A: 'MUA', P: 'MSA · MTA', D: 'DNS', M: 'MTA', S: 'MDA', I: 'MUA' };

  function lane(id, c) {
    var s = c.state, sc = L.SCENES[s.scene];
    var held = s.at === id;
    var wasHere = c.prev && c.prev.at === id;
    var host = id === 'A' || id === 'I' || id === 'D' ? null : sc.host[id];
    var body = [h('p', { class: 'ep-muted' }, t('role' + id))];
    if (host) body.push(h('p', null, data(host, '')));
    if (id === 'A') body.push(h('p', null, data(sc.from, '')));
    if (id === 'I') body.push(h('p', null, data(sc.to, '')));
    if (id === 'D') body.push(dnsBody(c));
    if (id === 'S') body.push(storeBody(c));
    var logs = id === 'P' && s.scene === 'grafo' ? ['logReceive'] : LOGS[id];
    if (logs) body.push(h('p', { class: 'ep-logrole' }, t('logIn'), ' ', logs.map(function (k) { return t(k); }).join(', ')));
    if (id === 'I') body.push(devicesBody(c));
    if (held && id !== 'S') body.push(h('p', { class: 'ep-has ' + (ch(!wasHere, c) || '') }, '✉ ', id === 'A' && s.refused ? t('outbox') : t('hasMsg')));
    return {
      id: id, mark: null, c: COLOR[id], shape: id === 'A' || id === 'I' ? 'square' : undefined,
      name: data(ABBR[id], ''), tags: id === 'D' ? data(L.domainOf(sc.to), '') : null, state: held ? 'active' : null,
      body: h('div', { class: 'ep-card' }, body)
    };
  }

  function dnsBody(c) {
    var s = c.state, sc = L.SCENES[s.scene];
    var recs = sc.dns[L.domainOf(sc.to)] || [];
    var picked = s.mx && s.mx.host;
    return h('div', null,
      recs.map(function (r) {
        var pick = picked === r.host;
        return h('p', { class: ch(pick && s.hop === 'mx', c) }, h('span', { class: 'ep-mx', dataset: { st: pick ? 'pick' : 'other' }, translate: 'no' }, r.pref + ' ' + r.host));
      }));
  }

  function storeBody(c) {
    var s = c.state, sc = L.SCENES[s.scene];
    var prev = c.prev ? c.prev.store.messages : [];
    var lines = s.store.messages.map(function (m) {
      var before = prev.filter(function (k) { return k.id === m.id; })[0];
      var changed = !before || before.seen !== m.seen || before.deleted !== m.deleted;
      var what = t('msgN', { n: m.id });
      return h('p', { class: ch(changed && c.n > 0, c) }, m.deleted
        ? [h('s', null, dot(m.seen), what), ' ', t('removedQuit')]
        : [dot(m.seen), what]);
    });
    return h('div', null, lines.length ? lines : h('p', { class: 'ep-muted' }, t('mailboxEmpty')));
  }

  function devicesBody(c) {
    var s = c.state;
    return h('div', null, s.devices.map(function (d) {
      var p = c.prev && c.prev.devices.filter(function (k) { return k.id === d.id; })[0];
      var changed = c.n > 0 && p && JSON.stringify(p) !== JSON.stringify(d);
      var what = !d.synced ? h('span', { class: 'ep-muted' }, t('notSynced'))
        : d.sees.length ? d.sees.map(function (m) { return h('span', null, dot(m.seen), t('msgN', { n: m.id })); })
        : h('span', null, t('mailboxEmpty'));
      return h('p', { class: ch(changed, c) }, h('b', null, devName(d.id)), ': ', what);
    }));
  }

  // ── right: the message, envelope around letter ──

  function line(k, text, changed, c) { return h('span', { class: 'ep-line' + (changed ? ' sd-changed' + anim(c) : ''), dataset: { k: k }, translate: 'no' }, text); }
  function kv(name, value) { return [h('b', null, name), ' ' + value]; }

  function renderMessage(c) {
    var s = c.state, m = s.msg, pm = c.prev ? c.prev.msg : null;
    var newTrace = pm ? m.received.length - pm.received.length : 0;
    var env = h('div', { class: 'ep-env' },
      h('span', { class: 'ep-cap' }, t('envTitle')),
      h('div', { class: 'ep-row' }, line('env', kv('MAIL FROM:', '<' + m.envelope.mailFrom + '>'), false, c),
        m.envelope.rcptTo.map(function (r) {
          // a session refused at MAIL never gets to RCPT TO
          var unsent = s.hop === 'try' || s.hop === 'refuse';
          return line('env', kv('RCPT TO:', '<' + r + '>').concat(unsent ? [' ', h('span', { class: 'ep-muted ep-note', translate: 'yes' }, '(', t('notSent'), ')')] : []), false, c);
        })));
    var letter = h('div', { class: 'ep-letter' }, h('span', { class: 'ep-cap' }, t('letterTitle'), ' · ', t('traceNote')));
    if (m.returnPath) letter.append(line('trace', kv('Return-Path:', '<' + m.returnPath + '>'), !(pm && pm.returnPath), c));
    m.received.forEach(function (r, i) {
      letter.append(line('trace', kv('Received:', 'from ' + r.from + ' by ' + r.by + ' with ' + r.with), i < newTrace, c));
    });
    letter.append(
      h('div', { class: 'ep-row' }, line('hdr', kv('From:', m.header.from), false, c),
        m.header.from !== m.envelope.mailFrom ? h('span', { class: 'ep-differs' }, '≠ ', data('MAIL FROM', ''), ' ', t('fromDiffers')) : null,
        line('hdr', kv('To:', m.header.to), false, c),
        line('hdr', kv('Subject:', m.header.subject), false, c)),
      line('body', m.body, false, c));
    env.append(letter);
    return h('section', { class: 'ep-box ep-msg', 'aria-label': t('msgTitle') }, env);
  }

  function renderLog(c) {
    var s = c.state;
    var ROLE = { receive: 'logReceive', send: 'logSend', deliver: 'logDeliver' };
    var items = s.log.map(function (l) {
      // receiving side: who sent it (the envelope's MAIL FROM) and the port; sending side and delivery: the recipient
      var bits = [];
      if (l.role === 'receive') bits.push('from=<' + l.from + '>', 'port=' + l.port);
      else bits.push('to=<' + l.to + '>');
      if (l.relay) bits.push('relay=' + l.relay + ':' + l.port);
      if (l.auth) bits.push('auth=' + l.auth);
      if (l.status === 'reject') bits.push('reject ' + l.code);
      else if (l.status !== 'accepted') bits.push('status=' + l.status);
      return h('li', { class: ch(l.n === s.n && c.n > 0, c), dataset: { st: l.status } },
        h('b', null, data(l.host, '')), ' · ', t(ROLE[l.role]), h('br'), data(bits.join(' ')));
    });
    return h('section', { class: 'ep-box' }, h('h2', null, t('logTitle')),
      items.length ? h('ul', { class: 'ep-log' }, items) : h('p', { class: 'ep-muted ep-sm' }, t('logEmpty')));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, ev = s.ev, sc = L.SCENES[s.scene], m = s.msg, out;
    var env = m.envelope.mailFrom, hdr = m.header.from, diff = env !== hdr;
    switch (ev.kind) {
      case 'start':
        out = s.scene === 'grafo'
          ? t.parts('capStartUrm', { from: B(sc.from), to: B(sc.to), srv: B(sc.host.P.replace(/[[\]]/g, '')) })
          : t.parts('capStart', { from: B(sc.from), to: B(sc.to) });
        break;
      case 'try': out = t.parts('capTry', { from: B(env) }); break;
      case 'refuse': out = t.parts('capRefuse', {}); break;
      case 'submit':
        out = t.parts('capSubmit', { from: B(env), to: B(m.envelope.rcptTo[0]) });
        if (diff) out = out.concat(' ', t.parts('capSubmitDiff', { hdr: B(hdr), env: B(env) }));
        break;
      case 'local': out = t.parts('capLocal', { domain: B(ev.domain) }); break;
      case 'mx': out = t.parts('capMx', { domain: B(ev.domain), count: B(ev.count), host: B(ev.host), pref: B(ev.pref) }); break;
      case 'relay': out = t.parts('capRelay', { from: B(sc.host.P), to: B(ev.to) }); break;
      case 'deliver':
        out = t.parts('capDeliver', { to: B(m.envelope.rcptTo[0]), from: B(env) });
        if (diff) out = out.concat(' ', t.parts('capDeliverDiff', { env: B(env), hdr: B(hdr) }));
        break;
      case 'fetch':
        if (!ev.count) out = t.parts('capFetchNone', { device: devCap(ev.device) });
        else if (ev.proto === 'pop3') out = t.parts('capFetchPop', { device: devCap(ev.device) });
        else out = t.parts('capFetchImap', { device: devCap(ev.device), state: h('b', null, t(ev.seen ? 'stRead' : 'stUnread')) });
        if (ev.count && diff) out = out.concat(' ', t.parts('capFetchHdr', { hdr: B(hdr), env: B(env) }));
        break;
      case 'read':
        out = t.parts(ev.onServer ? 'capReadImap' : 'capReadPop', { device: devName(ev.device) });
        break;
      default: out = [];
    }
    if (c.last && s.scene === 'lab' && s.msg.received.length === 3 && s.log.length === 4 && c.preset === 'two-domains') out = out.concat(' ', t('capEndTwo'));
    return out;
  }

  var never = function () { return false; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'script', type: 'choice', label: t('script'), visible: never, resets: true,
        options: [['two-domains', '1'], ['urm-two-devices', '2'], ['envelope-vs-header', '3'], ['no-auth-submission', '4']] },
      { key: 'fetch', type: 'choice', label: t('fetch'), options: [['imap', data('IMAP', '')], ['pop3', t('fetchPop3')]] },
      { key: 'headerFromDiffers', type: 'toggle', label: t('headerFromDiffers') },
      { key: 'authenticated', type: 'toggle', label: t('authenticated') }
    ],

    presets: [
      { id: 'two-domains', label: t('presetTwo'), hint: t('presetTwoHint'), params: { script: 'two-domains' } },
      { id: 'urm-two-devices', label: t('presetUrm'), hint: t('presetUrmHint'), params: { script: 'urm-two-devices' } },
      { id: 'envelope-vs-header', label: t('presetEnv'), hint: t('presetEnvHint'), params: { script: 'envelope-vs-header', headerFromDiffers: true } },
      { id: 'no-auth-submission', label: t('presetNoAuth'), hint: t('presetNoAuthHint'), params: { script: 'no-auth-submission', authenticated: false } }
    ],

    legend: [
      { shape: 'env', label: t('legEnvelope') },
      { shape: 'letter', label: t('legLetter') },
      { shape: 'port', label: t('legPort') },
      { shape: 'dots', label: t('legDot') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'ep' }, h('div', { class: 'ep-mid' }, chart), renderMessage(c), renderLog(c)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
