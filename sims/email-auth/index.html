<style>
/* Page CSS: every selector starts with [data-sim="email-auth"]; colours only from kit tokens.
   A check's result is a symbol, a word and a border: ✓ pass (solid --ok), ✕ fail (double --danger), ○ none, neutral
   or not counted (dashed). Alignment is a wire between two domain chips: solid = aligned, broken = not, dotted and
   muted = not counted. The numbers 1–5 tie each box to its step and to the message lines it reads. */
[data-sim="email-auth"] .ea {
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(0, 2fr);

}

[data-sim="email-auth"] .ea-col { display: flex; flex-direction: column; gap: 1.2cqh; min-width: 0; min-height: 0; }
[data-sim="email-auth"] .ea-box {
  min-width: 0;
  padding: 0.4rem 0.6rem 0.5rem;
  border: var(--line-w) solid var(--line);

}

[data-sim="email-auth"] .ea-muted { color: var(--muted); }

}

/* small items take a compact changed mark (the kit's ring would cover their neighbours) */
[data-sim="email-auth"] .ea .sd-changed { --muted: var(--on-hl); background: var(--hl); color: var(--on-hl); outline: 0.15rem solid var(--on-hl); outline-offset: 0; box-shadow: none; border-radius: var(--radius-sm); }

/* ── the message ── */
[data-sim="email-auth"] .ea-msg { display: flex; flex-direction: column; gap: 0.35rem; }
[data-sim="email-auth"] .ea-conn { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.4rem; font-size: var(--fs-sm); }
[data-sim="email-auth"] .ea-via { font-size: var(--fs-sm); padding: 0 0.3rem; border: 0.14rem dashed var(--ink); border-radius: var(--radius-sm); align-self: flex-start; }

}
[data-sim="email-auth"] .ea-env::before {
  content: ''; position: absolute; top: 0; left: 94%; width: 1.4rem; height: 1.4rem;

/* ── verdict ── */

[data-sim="email-auth"] .ea-verdict[data-v='pass'] { border-color: var(--ok); }

[data-sim="email-auth"] .ea-big { font-size: 1.2em; font-weight: 700; padding: 0 0.3rem; }

/* legend swatches */

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (addresses, names, records, header names, result tokens) is not language: the word check skips translate="no". */
  function data(s, cls) { return h('span', { translate: 'no', class: cls || null }, String(s)); }
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  /** A DNS name that may break only after a dot. */
  function name(s) { var out = []; String(s).split('.').forEach(function (x, i) { if (i) out.push('.', h('wbr')); out.push(x); }); return h('span', { translate: 'no', class: 'ea-name' }, out); }
  function has(s, mark) { return s.changed.indexOf(mark) >= 0; }
  function mark(on, c) { return on ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''; }
  /** The step number of a check, on its box, on the message lines it reads and on its DNS rows. */
  function num(n, on, label) {
    return h('span', { class: 'ea-no', dataset: on ? { on: '' } : {}, title: label || null, 'aria-label': label || null, 'aria-hidden': label ? null : 'true' }, String(n));
  }
  /** pass / fail / none as the box's border and the result's symbol. */
  function kind(result) { return result === 'pass' ? 'pass' : result === 'none' || result === 'neutral' ? 'none' : 'fail'; }
  var SYM = { pass: '✓', fail: '✕', none: '○' };
  function result(r, by, on, c) {
    var k = kind(r);
    return h('div', { class: 'ea-v' + mark(on, c), dataset: { v: k } },
      h('span', { class: 'ea-sym', 'aria-hidden': 'true' }, SYM[k]), ' ', data(r), by ? h('span', { class: 'ea-by' }, ' · ', by) : null);
  }
  function waiting() { return h('div', { class: 'ea-v', dataset: { v: 'idle' } }, h('span', { class: 'ea-sym', 'aria-hidden': 'true' }, '…'), ' ', t('notYet')); }

  // ── left: the message ──
  function line(key, value, opts) {
    opts = opts || {};
    return h('div', { class: 'ea-line' + mark(opts.on, opts.c), dataset: opts.dim ? { dim: '' } : {} },
      h('b', { translate: 'no' }, key), value, opts.n ? num(opts.n, false, t('readBy', { n: opts.n })) : null);
  }
  function messageBox(s, c) {
    var m = s.msg;
    var env = h('div', { class: 'ea-env' }, h('span', { class: 'ea-cap' }, t('envTitle')),
      line('HELO', data(m.helo), { dim: true }),
      line('MAIL FROM:', data('<' + m.mailFrom + '>'), { n: 1, on: has(s, 'id:mailFrom'), c: c }),
      line('RCPT TO:', data('<' + m.rcptTo + '>'), { dim: true }));
    var sig = m.dkim ? line('DKIM-Signature:', data('v=1; a=' + m.dkim.a + '; d=' + m.dkim.d + '; s=' + m.dkim.s + '; h=from:to:subject; b=…'),
      { n: 2, on: has(s, 'id:dkim'), c: c }) : null;
    var subj = m.tagged
      ? h('span', null, h('span', { translate: 'no', class: 'ea-tag' }, m.subject.slice(0, m.subject.indexOf(']') + 1)),
          data(m.subject.slice(m.subject.indexOf(']') + 1)), ' ', h('span', { class: 'ea-tagnote' }, t('tagNote')))
      : data(m.subject);
    var letter = h('div', { class: 'ea-letter' }, h('span', { class: 'ea-cap' }, t('letterTitle')),
      sig,
      line('From:', data(m.from), { n: 3, on: has(s, 'id:from'), c: c }),
      line('To:', data(m.to), { dim: true }),
      line('Subject:', subj));
    return h('section', { class: 'ea-box ea-msg' },
      h('h3', null, h('span', null, t.parts('msgTitle', { host: data(s.receiver) }))),
      h('div', { class: 'ea-conn' }, t('connFrom'), ' ', data(m.ip, 'ea-chip' + mark(has(s, 'id:ip'), c)), num(1, false, t('readBy', { n: 1 }))),
      m.list ? h('div', { class: 'ea-via' }, t.parts('viaList', { list: data(m.list) })) : null,
      env, letter);
  }

  // ── left: the DNS lookups ──
  /** A public key is cut after a few characters, as the book cuts it (`dig … | cut -c1-72`); the rest is not read here. */
  function shortKey(txt) { return !/^v=DKIM1/.test(txt) ? txt : String(txt).replace(/(; p=[A-Za-z0-9+\/]{8})[A-Za-z0-9+\/=]*…?/, '$1…'); }
  function dnsBox(s, c) {
    var rows = s.lookups.map(function (q) {
      var main = q.type === 'TXT';
      var ans = q.answer.length ? data(q.answer.map(function (a) { return main ? '"' + shortKey(a) + '"' : a; }).join(' · ')) : h('span', { class: 'ea-muted' }, t('noRecord'));
      return h('li', { class: q.step === s.n ? mark(true, c).trim() : null, dataset: main ? {} : { sub: '' } },
        num(q.step, false, t('stepN', { n: q.step })),
        h('span', { class: 'ea-qtext' }, data(q.name + ' ' + q.type, 'ea-qname'), ' → ', ans));
    });
    return h('section', { class: 'ea-box ea-dns' }, h('h3', null, t('dnsTitle')),
      rows.length ? h('ol', { class: 'ea-qs' }, rows) : h('p', { class: 'ea-empty' }, t('dnsEmpty')));
  }

  // ── right: the three checks ──
  function gate(n, title, q, v, now, body) {
    return h('section', { class: 'ea-box ea-gate', dataset: { v: v } },
      h('h3', null, num(n, now), title), h('div', { class: 'ea-q' }, q), body);
  }
  function spfBox(s, c) {
    var r = s.spf;
    if (!r) return gate(1, t('gSpf'), t('qSpf'), 'idle', false, waiting());
    var body = [];
    if (r.record) {
      body.push(h('div', { class: 'ea-detail' }, t.parts('spfRecordOf', { domain: data(r.domain) })));
      body.push(h('div', { class: 'ea-terms', translate: 'no' }, h('span', { class: 'ea-term', dataset: { st: 'head' } }, 'v=spf1'),
        r.terms.map(function (x) {
          var w = t({ match: 'termMatch', nomatch: 'termNo', unread: 'termUnread', skip: 'termSkip', limit: 'termLimit', error: 'termError' }[x.state]);
          return h('span', { class: 'ea-term', dataset: { st: x.state }, title: w, 'aria-label': x.text + ': ' + w }, x.text);
        })));
      body.push(h('div', { class: 'ea-detail ea-muted' }, t('spfDnsTerms', { n: r.dnsTerms, max: L.LIMIT })));
    } else {
      body.push(h('div', { class: 'ea-detail' }, data(r.domain), ': ', t(r.why === 'multiple' ? 'spfMultiple' : 'spfNoRecord')));
    }
    var by = r.decided >= 0 ? data(r.terms[r.decided].text) : null;
    body.push(result(r.result, by, has(s, 'spf'), c));
    return gate(1, t('gSpf'), t('qSpf'), kind(r.result), s.phase === 'spf', body);
  }
  function dkimBox(s, c) {
    var d = s.dkim;
    if (!d) return gate(2, t('gDkim'), t('qDkim'), 'idle', false, waiting());
    var body = [];
    if (d.result === 'none') body.push(h('div', { class: 'ea-detail' }, t.parts('dkimNone', { h: data('DKIM-Signature', 'ea-nowrap') })));
    else {
      body.push(h('div', { class: 'ea-detail' }, t('dkimSigned'), ' ', h('b', { translate: 'no' }, 'd=' + d.domain), ' ', data('s=' + d.selector)));
      body.push(h('div', { class: 'ea-detail' }, t('dkimKeyAt'), ' ', name(d.keyName), ' · ', d.key ? t('dkimKeyFound') : t('dkimNoKey')));
      if (d.key) body.push(h('div', { class: 'ea-detail' }, d.result === 'pass' ? t('dkimOk') : t('dkimChanged')));
    }
    body.push(result(d.result, d.domain ? data('d=' + d.domain) : null, has(s, 'dkim'), c));
    return gate(2, t('gDkim'), t('qDkim'), kind(d.result), s.phase === 'dkim', body);
  }
  function dmarcBox(s, c) {
    if (!s.author) return gate(3, t('gDmarc'), t('qDmarc'), 'idle', false, waiting());
    var r = s.dmarc;
    var body = [h('div', { class: 'ea-detail' }, t('dmarcAuthor'), ' ', h('b', { translate: 'no' }, s.author)),
      h('div', { class: 'ea-detail' }, t('dmarcRecordAt'), ' ', name('_dmarc.' + s.author))];
    if (!r) body.push(h('div', { class: 'ea-detail' }, t('dmarcNoRecord')));
    else {
      body.push(h('div', { class: 'ea-chips' + mark(has(s, 'dmarc'), c), translate: 'no' },
        h('span', { class: 'ea-chip', dataset: { big: '' } }, 'p=' + r.p),
        // only the tags the record carries; the defaults are said in words below
        /;\s*aspf=/.test(r.text) ? h('span', { class: 'ea-chip' }, 'aspf=' + r.aspf.charAt(0)) : null,
        /;\s*adkim=/.test(r.text) ? h('span', { class: 'ea-chip' }, 'adkim=' + r.adkim.charAt(0)) : null));
      body.push(h('div', { class: 'ea-detail ea-muted' }, data('aspf:'), ' ', t(r.aspf === 'strict' ? 'modeStrict' : 'modeRelaxed'),
        ' · ', data('adkim:'), ' ', t(r.adkim === 'strict' ? 'modeStrict' : 'modeRelaxed')));
      if (!r.pGiven) body.push(h('div', { class: 'ea-detail' }, t('dmarcPDefault')));
    }
    return gate(3, t('gDmarc'), t('qDmarc'), r ? 'done' : 'none', s.phase === 'dmarc', body);
  }
  function arrow() { return h('span', { class: 'ea-arrow', 'aria-hidden': 'true' }, '→'); }

  // ── right: alignment ──
  function how(x) { return x.identical ? 'alSame' : x.sameOrg ? (x.mode === 'strict' ? 'alStrictDiff' : 'alSameOrg') : 'alDiffOrg'; }
  function alRow(label, x, s) {
    var head = h('span', { class: 'ea-al-k', translate: 'no' }, label);
    var from = h('span', { class: 'ea-chip', translate: 'no' }, s.author);
    if (!x) return h('div', { class: 'ea-al' }, head, h('span', { class: 'ea-chip', translate: 'no', dataset: { off: '' } }, '—'),
      h('span', { class: 'ea-wire', dataset: { st: 'off' } }, h('span', null, t('alNoSig'))), from, h('span', { class: 'ea-al-v', dataset: { st: 'off' } }, '○ ', t('alOff')));
    var st = !x.passed ? 'off' : x.aligned ? 'yes' : 'no';
    var wireText = !x.passed ? t('alNotCounted') : t(how(x));
    var word = st === 'yes' ? ['✓ ', t('alAligned')] : st === 'no' ? ['✕ ', t('alNot')] : ['○ ', t('alOff')];
    return h('div', { class: 'ea-al' }, head,
      h('span', { class: 'ea-chip', translate: 'no', dataset: x.passed ? {} : { off: '' } }, x.domain),
      h('span', { class: 'ea-wire', dataset: { st: st } }, h('span', null, wireText)),
      from, h('span', { class: 'ea-al-v', dataset: { st: st } }, word));
  }
  function alignBox(s, c) {
    var a = s.aligned;
    var head = h('h3', null, num(4, s.phase === 'align'), h('span', null, t('gAlign'), s.author ? [' ', data(s.author)] : null));
    if (!a) return h('section', { class: 'ea-box ea-align', dataset: { v: 'idle' } }, head, waiting());
    return h('section', { class: 'ea-box ea-align', dataset: { v: 'done' } }, head,
      h('div', { class: mark(has(s, 'align'), c).trim() || null }, alRow('SPF', a.spf, s), alRow('DKIM', a.dkim, s)));
  }

  // ── right: verdict ──
  var ACT = { deliver: 'actDeliver', report: 'actReport', quarantine: 'actQuarantine', reject: 'actReject' };
  function verdictBox(s, c) {
    var head = h('h3', null, num(5, s.phase === 'verdict'), t('gVerdict'));
    if (!s.verdict) return h('section', { class: 'ea-box ea-verdict', dataset: { v: 'idle' } }, head, h('div', { class: 'ea-q' }, t('qVerdict')), waiting());
    var k = kind(s.verdict);
    var big = h('span', { class: 'ea-big' + mark(has(s, 'verdict'), c), dataset: { v: k } }, h('span', { 'aria-hidden': 'true' }, SYM[k] + ' '),
      t(s.verdict === 'pass' ? 'vPass' : s.verdict === 'fail' ? 'vFail' : 'vNone'));
    var pol = s.dmarc ? h('span', null, t('policyIs'), ' ', h('b', { translate: 'no' }, 'p=' + s.dmarc.p)) : null;
    return h('section', { class: 'ea-box ea-verdict', dataset: { v: k } }, head,
      h('div', { class: 'ea-vrow' }, big, pol, h('span', { class: 'ea-act' }, t(ACT[s.action])),
        h('span', { class: 'ea-reply', dataset: { code: String(s.reply.code) }, translate: 'no' }, s.reply.code + ' ' + s.reply.text)),
      s.unsubscribed ? h('div', { class: 'ea-unsub' }, t.parts('unsub', { who: data(s.unsubscribed) })) : null);
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'ea' },
      h('div', { class: 'ea-col' }, messageBox(s, c), dnsBox(s, c)),
      h('div', { class: 'ea-right' },
        h('div', { class: 'ea-checks' }, spfBox(s, c), arrow(), dkimBox(s, c), arrow(), dmarcBox(s, c)),
        alignBox(s, c), verdictBox(s, c))));
  }

  // ── captions ──
  function hostMatched(r) {
    var term = r.terms[r.decided], q = (term.queries || []).filter(function (x) { return x.type === 'A/AAAA' && x.answer.indexOf(r.ip) >= 0; })[0];
    return q ? q.name : '';
  }
  function howKey(x) { return x.identical ? 'howSame' : x.sameOrg ? (x.mode === 'strict' ? 'howStrict' : 'howSameOrg') : 'howDiffOrg'; }
  function alPart(k, x, author) {
    if (!x.passed) return [t('cAl' + k + 'Failed')];
    return t.parts(x.aligned ? 'cAl' + k + 'Yes' : 'cAl' + k + 'No', { d: code(x.domain), author: code(author), how: t(howKey(x)) });
  }
  function caption(c) {
    var s = c.state, m = s.msg;
    switch (s.phase) {
      case 'arrive':
        return m.list ? t.parts('cArriveList', { list: code(m.list), ip: code(m.ip), mailFrom: code(m.mailFrom) })
          : t.parts('cArrive', { ip: code(m.ip), host: code(s.receiver) });
      case 'spf': {
        var r = s.spf, v = { domain: code(r.domain), ip: code(r.ip), result: code(r.result) };
        if (r.why !== 'match') return t.parts('cSpfOther', v);
        var term = r.terms[r.decided].text, isAll = /^[-~?+]?all$/.test(term);
        v.term = code(term);
        v.all = code(term);
        var out = t.parts(isAll ? 'cSpfAll' : 'cSpfMatch', v);
        if (/^[+]?mx(:|$)/.test(term)) out = out.concat(' ', t.parts('cSpfMx', { host: code(hostMatched(r)) }));
        if (m.list) out = out.concat(' ', t('cSpfList'));
        return out;
      }
      case 'dkim': {
        var d = s.dkim;
        if (d.result === 'none') return t.parts('cDkimNone', { result: code('none') });
        var kv = { d: code(d.domain), signer: code(d.domain), s: code(d.selector), key: code(d.keyName), result: code(d.result) };
        return t.parts(d.result === 'pass' ? 'cDkimPass' : d.result === 'fail' ? 'cDkimFail' : 'cDkimNoKey', kv);
      }
      case 'dmarc': {
        var name = code('_dmarc.' + s.author);
        if (!s.dmarc) return t.parts('cDmarcNone', { domain: code(s.author), name: name });
        var o = t.parts('cDmarc', { domain: code(s.author), name: name, p: code(s.dmarc.p) });
        return s.dmarc.pGiven ? o : o.concat(' ', t('cDmarcNoP'));
      }
      case 'align': {
        var a = s.aligned;
        if (a.dkim && a.spf.passed && a.dkim.passed && !a.spf.aligned && !a.dkim.aligned && a.spf.domain === a.dkim.domain)
          return t.parts('cAlSpoof', { d: code(a.spf.domain), author: code(s.author) });
        return alPart('Spf', a.spf, s.author).concat(' ', a.dkim ? alPart('Dkim', a.dkim, s.author) : t('cAlDkimNone'));
      }
      default: {
        if (s.verdict === 'none') return t('cNoDmarc');
        if (s.verdict === 'pass') return t.parts('cPass', { author: code(s.author) });
        if (s.action === 'report') return t.parts('cReport', {});
        if (s.action === 'quarantine') return t.parts('cQuarantine', {});
        var rj = t.parts('cReject', { reply: code(s.reply.code + ' ' + s.reply.text) });
        return s.unsubscribed ? rj.concat(' ', t.parts('cUnsub', { who: code(s.unsubscribed) })) : rj;
      }
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scenario', type: 'choice', label: t('scenario'), resets: true,
        options: [['legit', t('sLegit')], ['list', t('sList')], ['spoof', t('sSpoof')], ['subdomain', t('sSub')]] },
      { key: 'policy', type: 'choice', label: t('policy'), options: [['none', 'p=none'], ['quarantine', 'p=quarantine'], ['reject', 'p=reject']] },
      { key: 'aspf', type: 'choice', label: t('aspf'), options: [['relaxed', t('modeRelaxed')], ['strict', t('modeStrict')]] },
      { key: 'signed', type: 'toggle', label: t('signed') },
      { key: 'listModifiesSubject', type: 'toggle', label: t('listModifiesSubject'), hint: t('listModifiesSubjectHint'),
        disabled: function (p) { return p.scenario !== 'list' ? t('listOnly') : false; } }
    ],

    presets: [
      { id: 'legit', label: t('pLegit'), params: { scenario: 'legit' } },
      { id: 'mailing-list-signed', label: t('pListSigned'), params: { scenario: 'list', policy: 'reject' } },
      { id: 'mailing-list-unsigned', label: t('pListUnsigned'), params: { scenario: 'list', policy: 'reject', signed: false } },
      { id: 'spoof-own-domain', label: t('pSpoof'), params: { scenario: 'spoof' } },
      { id: 'subdomain-alignment', label: t('pSub'), hint: t('pSubHint'), params: { scenario: 'subdomain', signed: false } }
    ],

    legend: [
      { shape: 'ea-pass', label: t('legPass') },
      { shape: 'ea-fail', label: t('legFail') },
      { shape: 'ea-none', label: t('legNone') },
      { shape: 'line', label: t('legAligned') },
      { shape: 'dash', label: t('legNotAligned') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
