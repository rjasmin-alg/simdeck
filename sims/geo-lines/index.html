<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var G = window.SimdeckModels['squared-paper'];
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';

  function tp(key, vars) {
    return t.parts(key, vars).map(function (x) { return x instanceof Node ? x.cloneNode(true) : x; });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function name(s) { return h('span', { class: 'gl-name', translate: 'no' }, s); }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function fx(r) { return r[0] / r[1]; }
  function ptOf(e) { return [fx(e.x), fx(e.y)]; }
  function norm(v) { var l = Math.hypot(v[0], v[1]); return [v[0] / l, v[1] / l]; }
  function add(a, v, s) { return [a[0] + v[0] * s, a[1] + v[1] * s]; }
  /** The unit normal of a direction that points up (or left, for a horizontal line… up): where a name goes. */
  function upNormal(u) {
    var n = norm([-u[1], u[0]]);
    return n[1] < 0 || (n[1] === 0 && n[0] > 0) ? [-n[0], -n[1]] : n;
  }

  // ── the paper: view coordinates (y up) to the SVG (y down) and to % for the HTML labels ──
  function Paper(view) {
    var w = view.x1 - view.x0, hh = view.y1 - view.y0;
    var el = svg('svg', { viewBox: view.x0 + ' ' + (-view.y1) + ' ' + w + ' ' + hh, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var labs = [];
    var z = view.z;
    var api = {
      el: el, labs: labs, z: z, view: view,
      line: function (a, b, cls, extra) {
        var ln = svg('line', Object.assign({ class: cls, x1: a[0], y1: -a[1], x2: b[0], y2: -b[1] }, extra || {}));
        el.append(ln);
        return ln;
      },
      poly: function (pts, cls) {
        el.append(svg('polygon', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      path: function (pts, cls) {
        el.append(svg('polyline', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      dot: function (p, attrs) {
        var c = svg('circle', { class: 'gl-pt', cx: p[0], cy: -p[1], r: 0.24 * z });
        Object.keys(attrs || {}).forEach(function (k) { c.setAttribute(k, attrs[k]); });
        el.append(c);
      },
      /** An HTML label at a point of the paper, shifted by (dx, dy) in rem (y down). */
      lab: function (p, text, dx, dy, data) {
        // kept a little inside the paper, so a name near the edge is not cut off
        var left = Math.min(97, Math.max(3, (p[0] - view.x0) / w * 100)), top = Math.min(96, Math.max(4, (view.y1 - p[1]) / hh * 100));
        labs.push(h('span', { class: 'gl-lab', translate: 'no', dataset: data || {},
          style: { left: 'calc(' + left.toFixed(3) + '% + ' + (dx || 0) + 'rem)', top: 'calc(' + top.toFixed(3) + '% + ' + (dy || 0) + 'rem)' } }, text));
      },
      /** The whole line through a with direction u, inside the view: its two ends, or null. */
      across: function (a, u) {
        var c = G.clip(a, u, view);
        return c ? [add(a, u, c[0]), add(a, u, c[1])] : null;
      },
      /** A label just inside the view at the far end of a line (the larger end of the clip), off its side. */
      lineLabel: function (a, u, text, data, end) {
        var c = G.clip(a, u, view);
        if (!c) return;
        var s = end === 0 ? c[0] + 1.6 * z / Math.hypot(u[0], u[1]) : c[1] - 1.6 * z / Math.hypot(u[0], u[1]);
        var p = add(a, u, s), n = norm([-u[1], u[0]]);
        api.lab(add(p, n, 0.7 * z), text, 0, 0, Object.assign({ big: '' }, data || {}));
      },
      rightAngle: function (at, d1, d2) {
        var a = 0.7 * z, e1 = norm(d1), e2 = norm(d2);
        api.path([add(at, e1, a), add(add(at, e1, a), e2, a), add(at, e2, a)], 'gl-rt');
      }
    };
    // the squares: every corner of the view; the school sheet (the paper at zoom 1) outlined when the view is bigger
    for (var x = Math.ceil(view.x0); x <= view.x1; x++) api.line([x, view.y0], [x, view.y1], 'gl-grid');
    for (var y = Math.ceil(view.y0); y <= view.y1; y++) api.line([view.x0, y], [view.x1, y], 'gl-grid');
    if (z > 1) el.append(svg('rect', { class: 'gl-sheet', x: 0, y: -L.H, width: L.W, height: L.H }));
    return api;
  }

  // ── the top box ──
  function figName(s, dat) { return t((dat ? 'dat_' : 'fig_') + s.kind); }
  function verdict(ok, text) {
    return h('span', { class: 'gl-verdict', dataset: { ok: ok ? 'yes' : 'no' } }, h('span', { 'aria-hidden': 'true' }, ok ? '✓' : '✗'), h('span', null, text));
  }
  /** The answer itself: neither right nor wrong, so no ✓ / ✗ and no red. */
  function answer(text) { return h('span', { class: 'gl-verdict', dataset: { ok: 'ans' } }, text); }
  function hideBtn() {
    return noFocus(h('button', { type: 'button', class: 'sd-btn gl-sidebtn', title: t('hideHint'), 'aria-keyshortcuts': 'v',
      onclick: function () { sim.set({ hide: true, guess: '' }); } }, t('hide'), ' ', h('kbd', null, 'V')));
  }
  function revealBtn() {
    return noFocus(h('button', { type: 'button', class: 'sd-btn gl-sidebtn', title: t('revealKey') + ' (V)', 'aria-keyshortcuts': 'v',
      onclick: function () { sim.set({ hide: false }); } }, t('reveal'), ' ', h('kbd', null, 'V')));
  }
  function guessBtn(g, label) {
    return noFocus(h('button', { type: 'button', class: 'sd-btn sd-btn--primary gl-guess', onclick: function () { sim.set({ guess: g, hide: false }); } }, label));
  }
  function guessLine(s, label, ok) {
    if (!s.guess) return null;
    return h('span', { class: 'gl-verdict', dataset: { ok: ok ? 'yes' : 'no' } }, h('span', { 'aria-hidden': 'true' }, ok ? '✓' : '✗'),
      h('span', null, t('guessWas', { g: label }) + ' · ' + t(ok ? 'gRight' : 'gWrong')));
  }
  var GUESS_LABEL = { par: function () { return 'p ∥ q ' + t('g_par'); }, perp: function () { return 'p ⊥ q ' + t('g_perp'); }, cross: function () { return t('g_cross'); } };

  function topParts(s) {
    var say, sub, side = [];
    if (s.hide) {
      say = t('askT', { dat: figName(s, true) });
      sub = t('ends_' + s.kind);
      side.push(guessBtn('on', t('gOn')), guessBtn('off', t('gOff')), revealBtn());
    } else {
      say = t(s.on ? 'vOn' : 'vOff', { dat: figName(s, true) });
      sub = t('ends_' + s.kind);
      side.push(guessLine(s, s.guess === 'on' ? t('gOn') : t('gOff'), s.right));
      side.push(answer(s.on ? t('gOn') : t('gOff')));
      if (audience === 'teacher') side.push(hideBtn());
    }
    return [h('div', { class: 'gl-col' }, h('div', { class: 'gl-say' }, say), h('div', { class: 'gl-sub' }, t('endsLab') + ' ' + sub)), h('div', { class: 'gl-side' }, side)];
  }
  function relText(s) {
    if (s.rel === 'parallel') return [h('span', { class: 'gl-sign', translate: 'no' }, 'p ∥ q'), cap(t('relParallel'))];
    if (s.rel === 'perp') return [h('span', { class: 'gl-sign', translate: 'no' }, 'p ⊥ q'), cap(t('relPerp'))];
    if (s.rel === 'same') return [t('relSame')];
    return [t('relCross')];
  }
  function topTwo(s) {
    var col = [], side = [];
    if (s.hide) {
      col.push(h('div', { class: 'gl-say' }, t('askTwo')));
      ['par', 'perp', 'cross'].forEach(function (g) { side.push(guessBtn(g, GUESS_LABEL[g]())); });
      side.push(revealBtn());
    } else {
      col.push(h('div', { class: 'gl-say' }, relText(s)));
      if (s.at && !s.inPaper) {
        var sub = t(s.zoomNeeded ? 'sOff' : 'sFar');
        if (s.zoomNeeded && s.zoomNeeded > s.view.z) sub += ' · ' + t('sZoom', { z: s.zoomNeeded });
        col.push(h('div', { class: 'gl-sub' }, sub));
      }
      if (s.guess) side.push(guessLine(s, GUESS_LABEL[s.guess](), s.right !== 'no'));
      if (audience === 'teacher') side.push(hideBtn());
    }
    return [h('div', { class: 'gl-col' }, col), h('div', { class: 'gl-side' }, side)];
  }
  function topSlide(s) {
    // past T or T on p: the step stays the instruction; the caption says what is wrong
    var stepKey = s.done && !s.onP ? 's3' : s.j === 0 ? 's1_' + s.tool : 's2_' + s.tool;
    var col = [h('div', { class: 'gl-say' }, t('slideTitle_' + s.tool)), h('div', { class: 'gl-sub' }, t(stepKey))];
    var side = [];
    if (s.done && !s.onP) side.push(verdict(true, s.tool === 'par' ? 'q ∥ p' : 'q ⊥ p'));
    return [h('div', { class: 'gl-col' }, col), h('div', { class: 'gl-side' }, side)];
  }

  // ── the paper, per mode ──
  function drawParts(s, pp) {
    var a = s.a, b = s.b, u = s.u, z = pp.z, view = s.view;
    var clip = G.clip(a, u, view) || [0, 0];
    var lo = Math.max(s.from, clip[0]), hi = Math.min(s.to, clip[1]);
    var tailLen = 1.4 * z / Math.hypot(u[0], u[1]); // the "goes on" hint, about 1.4 squares on screen
    var reveal = !s.hide;
    // what the drawing hides: the line through A and B, when the answer is shown and the point is not on the drawing
    if (reveal && (s.where === 'outside' || s.where === 'off')) {
      var all = pp.across(a, u);
      if (all) pp.line(all[0], all[1], 'gl-ghost');
    }
    // the open ends go on: a dotted tail, or (shown, T beyond) the dashed line up to the edge of the view
    var openHi = s.kind !== 'segment', openLo = s.kind === 'line';
    var toEdge = reveal && s.where === 'beyond';
    if (openHi && hi < clip[1]) pp.line(add(a, u, hi), add(a, u, toEdge && s.k > s.to ? clip[1] : Math.min(clip[1], hi + tailLen)), 'gl-tail');
    if (openLo && lo > clip[0]) pp.line(add(a, u, lo), add(a, u, toEdge && s.k < s.from ? clip[0] : Math.max(clip[0], lo - tailLen)), 'gl-tail');
    if (hi > lo) pp.line(add(a, u, lo), add(a, u, hi), 'gl-drawn');
    // how far T misses the line (shown, off the line, a small miss)
    if (reveal && s.where === 'off' && s.miss && s.miss.by <= 3) {
      var foot = s.miss.axis === 'y' ? [s.t[0], a[1] + (s.t[0] - a[0]) * u[1] / u[0]] : [a[0] + (s.t[1] - a[1]) * u[0] / u[1], s.t[1]];
      pp.line(s.t, foot, 'gl-miss');
    }
    pp.dot(a);
    pp.dot(b);
    pp.dot(s.t, { 'data-t': '' });
    // A and B named on the side of the line that faces up (or left), T above right; p beside the drawn end
    var nn = upNormal(u);
    pp.lab(a, 'A', nn[0] * 1.1, -nn[1] * 1.1);
    pp.lab(b, 'B', nn[0] * 1.1, -nn[1] * 1.1);
    pp.lab(s.t, 'T', -nn[0] * 1.1, nn[1] * 1.1, { c: '2' });
    if (s.kind === 'line') pp.lab(add(a, u, hi), 'p', -nn[0] * 1.1, nn[1] * 1.1, { c: '1', big: '' });
    return { edge: s.kind !== 'segment' && (!openHi || hi >= clip[1] - 1e-9) && (!openLo || lo <= clip[0] + 1e-9) };
  }

  function drawTwo(s, pp) {
    var z = pp.z, view = s.view;
    var lp = pp.across(s.a, s.u), lq = pp.across(s.t, s.v);
    if (lp) pp.line(lp[0], lp[1], 'gl-drawn');
    if (lq) pp.line(lq[0], lq[1], 'gl-drawn', { 'data-q': '' });
    pp.lineLabel(s.a, s.u, 'p', { c: '1' }, 1);
    pp.lineLabel(s.t, s.v, 'q', { c: '2' }, s.v[1] < 0 ? 1 : 0);
    pp.dot(s.a);
    pp.dot(s.t, { 'data-t': '' });
    var np = upNormal(s.u), nq = upNormal(s.v);
    pp.lab(s.a, 'A', -np[0] * 1.1, np[1] * 1.1);
    pp.lab(s.t, 'T', nq[0] * 1.1, -nq[1] * 1.1, { c: '2' });
    if (s.hide || !s.at) return;
    var S = ptOf(s.at);
    if (s.inView) {
      if (s.rel === 'perp') pp.rightAngle(S, s.u, s.v);
      pp.dot(S, { 'data-s': '' });
      // S named in the angle opposite the right-angle mark (or between the lines anyway)
      var e1 = norm(s.u), e2 = norm(s.v), bis = norm([-(e1[0] + e2[0]), -(e1[1] + e2[1])]);
      pp.lab(S, 'S', bis[0] * 1.2, -bis[1] * 1.2, { big: '' });
      return;
    }
    // S is off the view: an arrow at the edge, on the way from the centre to S
    var cx = (view.x0 + view.x1) / 2, cy = (view.y0 + view.y1) / 2;
    var d = [S[0] - cx, S[1] - cy];
    var m = 1.2 * z;
    var k = Math.min(d[0] ? ((d[0] > 0 ? view.x1 - m : view.x0 + m) - cx) / d[0] : Infinity, d[1] ? ((d[1] > 0 ? view.y1 - m : view.y0 + m) - cy) / d[1] : Infinity);
    var tip = [cx + d[0] * k, cy + d[1] * k], e = norm(d), n = [-e[1], e[0]], sz = 0.8 * z;
    pp.poly([add(tip, e, sz * 0.6), add(add(tip, e, -sz * 0.6), n, sz * 0.5), add(add(tip, e, -sz * 0.6), n, -sz * 0.5)], 'gl-arrow');
    pp.lab(add(tip, e, -1.8 * z), 'S', 0, 0, { big: '' });
  }

  function drawSlide(s, pp) {
    var z = pp.z, a = s.a, u = s.u, un = norm(u), nn = norm([-u[1], u[0]]);
    var V = ptOf(s.corner);
    var sg = s.target > 0 ? 1 : s.target < 0 ? -1 : 1;
    // the drawing leg points towards T (legSign); the other leg lies on the ruler, pointing back (away from T's side)
    var eDraw = s.tool === 'par' ? [un[0] * s.legSign, un[1] * s.legSign] : [nn[0] * s.legSign, nn[1] * s.legSign];
    var eRule = s.tool === 'par' ? [nn[0] * -sg, nn[1] * -sg] : [un[0] * -sg, un[1] * -sg];
    var L1 = 7, L2 = 4; // a school set square, the same size wherever T is
    // the ruler: along the ruler line (through A across p for 'par'; on p for 'perp'), on the side away from the set square
    var rBase = a, rDir = s.tool === 'par' ? nn : un;
    var rc = G.clip(rBase, rDir, s.view);
    var side = [-eDraw[0] * 1.1, -eDraw[1] * 1.1];
    var lp = pp.across(a, u);
    if (lp) pp.line(lp[0], lp[1], 'gl-drawn');
    if (rc) {
      var r0 = add(rBase, rDir, rc[0] - 2), r1 = add(rBase, rDir, rc[1] + 2);
      pp.poly([r0, r1, add(r1, side, 1), add(r0, side, 1)], 'gl-ruler');
      for (var i = Math.ceil(rc[0]); i <= rc[1]; i++) {
        var tk = add(rBase, rDir, i);
        pp.line(tk, add(tk, side, i % 5 === 0 ? 0.45 : 0.25), 'gl-tick');
      }
      // the ruler's name where it is farthest from A, T and the set square's corner
      var best = null, bestD = -1;
      [0.2, 0.5, 0.8].forEach(function (f) {
        var c = add(add(rBase, rDir, rc[0] + f * (rc[1] - rc[0])), side, 0.5);
        var d = Math.min(Math.hypot(c[0] - a[0], c[1] - a[1]), Math.hypot(c[0] - s.t[0], c[1] - s.t[1]), Math.hypot(c[0] - V[0], c[1] - V[1]));
        if (d > bestD) { bestD = d; best = c; }
      });
      pp.lab(best, t('ruler'), 0, 0, { word: '' });
    }
    // the drawing leg's line, faint: does it pass through T?
    var ge = pp.across(V, eDraw);
    if (ge && !s.done) pp.line(ge[0], ge[1], 'gl-guide');
    // the set square
    var P1 = add(V, eDraw, L1), P2 = add(V, eRule, L2);
    pp.poly([V, P1, P2], 'gl-sq');
    pp.line(V, P1, 'gl-edge');
    pp.rightAngle(V, eDraw, eRule);
    pp.lab([(V[0] + P1[0] + P2[0]) / 3, (V[1] + P1[1] + P2[1]) / 3], t('square'), 0, 0, { word: '' });
    // done: q through T
    if (s.done && !s.onP) {
      var lq = pp.across(s.t, s.edge);
      if (lq) pp.line(lq[0], lq[1], 'gl-drawn', { 'data-q': '' });
      pp.lineLabel(s.t, s.edge, 'q', { c: '2' }, s.edge[1] < 0 ? 0 : 1);
    }
    pp.lineLabel(a, u, 'p', { c: '1' }, 1);
    pp.dot(a);
    pp.dot(s.t, { 'data-t': '' });
    var np = upNormal(u), ne = upNormal(s.edge);
    pp.lab(a, 'A', np[0] * 1.1, -np[1] * 1.1);
    pp.lab(s.t, 'T', -ne[0] * 1.1, ne[1] * 1.1, { c: '2' });
  }

  var lastEdge = false; // the drawing has reached the edge of the paper on every open side
  function render(c) {
    var s = c.state;
    var pp = Paper(s.view);
    var top, label;
    if (s.mode === 'parts') {
      lastEdge = drawParts(s, pp).edge;
      top = topParts(s);
      label = t('partsLabel', { fig: figName(s), verdict: s.hide ? '?' : t(s.on ? 'vOn' : 'vOff', { dat: figName(s, true) }) });
    } else if (s.mode === 'two') {
      drawTwo(s, pp);
      top = topTwo(s);
      label = t('twoLabel', { rel: s.hide ? '?' : s.rel === 'parallel' ? t('relParallel') : s.rel === 'perp' ? t('relPerp') : s.rel === 'same' ? t('relSame') : t('relCross') });
    } else {
      drawSlide(s, pp);
      top = topSlide(s);
      label = t('slideLabel');
    }
    var field = h('div', { class: 'gl-field', role: 'img', title: t('dragHint'), 'aria-label': label }, [pp.el].concat(pp.labs));
    c.stage.replaceChildren(h('div', { class: 'gl', dataset: { aud: audience, mode: s.mode } },
      h('section', { class: 'gl-box gl-top' }, top),
      h('section', { class: 'gl-box gl-paperbox' }, h('div', { class: 'gl-wrap' }, field))));
  }

  // ── captions (SPEC, Captions) ──
  function bySquares(by) {
    if (by === Math.round(by)) return t.n('sqN', by);
    return by < 1 ? t('sqLess') : t.n('sqAbout', Math.round(by));
  }
  function caption(c) {
    var s = c.state, A = audience;
    var out = [];
    function put(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function putHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (s.mode === 'parts') {
      var dat = figName(s, true);
      if (s.hide) { put(t(A === 'child' ? 'cAskTC' : 'cAskT', { dat: dat })); return out; }
      if (A === 'child') {
        put(t(s.on ? 'cOnC' : 'cOffC', { dat: dat }));
        if (s.where === 'beyond' && s.kind === 'line') put(t('cBeyondC'));
        return out;
      }
      if (s.right === false && s.where === 'beyond') putHl(t('cGuessNoBeyond'));
      if (s.right === false && s.where === 'off') putHl(t('cGuessNoNear'));
      if (s.right === false && s.where === 'outside' && s.kind === 'segment') putHl(t('cGuessNoSeg'));
      if (s.where === 'drawn') put(t('cDrawn', { dat: dat }));
      else if (s.where === 'beyond') put(t(s.kind === 'ray' ? 'cBeyondRay' : 'cBeyondLine'));
      else if (s.where === 'outside') put(s.kind === 'segment' ? t(s.k > s.m ? 'cOutSegB' : 'cOutSegA') : t('cOutRay'));
      else put(t('cOff', { by: bySquares(s.miss.by), dat: dat }));
      if (lastEdge && s.kind !== 'segment') put(t('cEdge', { fig: s.kind === 'ray' ? t('kind_ray').toLowerCase() : t('kind_line').toLowerCase() }));
      if (s.bMoved) put(t('cBMoved'));
      if (A === 'adult') put(t('why_' + s.kind));
      return out;
    }
    if (s.mode === 'two') {
      if (s.hide) { put(t(A === 'child' ? 'cAskTwoC' : 'cAskTwo')); return out; }
      if (A === 'child') {
        put(t(s.rel === 'same' ? 'cSame' : s.rel === 'parallel' ? 'cParallelC' : s.rel === 'perp' ? 'cPerpC' : s.inView ? 'cCrossC' : 'cCrossOffC'));
        return out;
      }
      if (s.right === 'no' && s.guess === 'par' && s.rel === 'cross' && !s.inPaper) putHl(t('cGuessNoFar'));
      if (s.right === 'no' && s.rel === 'perp') putHl(t('cGuessNoPerp'));
      if (s.right === 'more') putHl(t('cGuessMore'));
      if (s.rel === 'same') put(t('cSame'));
      else if (s.rel === 'parallel') put(t('cParallel'));
      else if (s.rel === 'perp') { if (s.right !== 'more') put(t('cPerp')); put(t('cCross')); }
      else if (s.inPaper) { put(t('cCross')); put(t('cTurn')); }
      else {
        put(t('cCrossOff'));
        if (!s.inView && s.zoomNeeded) put(t('cCrossOffZoom', { z: s.zoomNeeded }));
        put(t('cTurn'));
      }
      if (A === 'adult') put(t('whyTwo'));
      return out;
    }
    // slide
    if (A === 'child') { put(t(s.done && !s.onP ? 'cDoneC' : 'cSlideC')); return out; }
    if (s.onP) put(t('sOnP'));
    else if (s.done) put(t('cS3_' + s.tool));
    else if (s.past) put(t('sPast'));
    else if (s.j === 0) put(t('cS1'));
    else put(t('cS2', { how: t('how_' + s.tool) }));
    if (A === 'adult' && !s.onP) put(t(s.tool === 'par' ? 'whyPar' : 'whyPerp'));
    return out;
  }

  // ── the header: the audience switch ──
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  function stateOf(prm) { return L.initial(prm); }
  function arrowsOf(v) {
    var out = [];
    if (v[0]) out.push((v[0] > 0 ? '→' : '←') + Math.abs(v[0]));
    if (v[1]) out.push((v[1] > 0 ? '↑' : '↓') + Math.abs(v[1]));
    return out.join(' ');
  }
  var hidden = function () { return false; };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      // the points and p's direction: dragged on the paper or set by the presets; here so the URL carries them
      { key: 'ax', type: 'range', label: 'A x', value: L.defaults.ax, min: 0, max: L.W, visible: hidden },
      { key: 'ay', type: 'range', label: 'A y', value: L.defaults.ay, min: 0, max: L.H, visible: hidden },
      { key: 'bx', type: 'range', label: 'B x', value: L.defaults.bx, min: 0, max: L.W, visible: hidden },
      { key: 'by', type: 'range', label: 'B y', value: L.defaults.by, min: 0, max: L.H, visible: hidden },
      { key: 'tx', type: 'range', label: 'T x', value: L.defaults.tx, min: 0, max: L.W, visible: hidden },
      { key: 'ty', type: 'range', label: 'T y', value: L.defaults.ty, min: 0, max: L.H, visible: hidden },
      { key: 'pdx', type: 'range', label: 'p x', value: L.defaults.pdx, min: -L.DIR_MAX, max: L.DIR_MAX, visible: hidden },
      { key: 'pdy', type: 'range', label: 'p y', value: L.defaults.pdy, min: -L.DIR_MAX, max: L.DIR_MAX, visible: hidden },
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, options: L.MODES.map(function (m) { return [m, t('mode_' + m)]; }) },
      { key: 'kind', type: 'choice', label: t('kind'), value: L.defaults.kind, options: L.KINDS.map(function (k) { return [k, t('kind_' + k)]; }),
        visible: function (prm) { return prm.mode === 'parts'; } },
      { key: 'reach', type: 'range', label: t('reach'), value: L.defaults.reach, min: 0,
        max: function (prm) { return prm.mode === 'parts' ? Math.max(1, stateOf(prm).reachMax) : 1; },
        format: function (v) { return t.n('reachFmt', v); },
        visible: function (prm) { return prm.mode === 'parts' && prm.kind !== 'segment' && stateOf(prm).reachMax > 0; } },
      { key: 'turn', type: 'range', label: t('turn'), value: L.defaults.turn, min: 0, max: L.DIRS.length - 1,
        format: function (v) { return arrowsOf(L.DIRS[v] || L.DIRS[0]); },
        visible: function (prm) { return prm.mode === 'two'; } },
      { key: 'tool', type: 'choice', label: t('tool'), value: L.defaults.tool, options: L.TOOLS.map(function (k) { return [k, t('tool_' + k)]; }),
        visible: function (prm) { return prm.mode === 'slide'; } },
      { key: 'j', type: 'range', label: t('j'), value: L.defaults.j,
        min: function (prm) { return prm.mode === 'slide' ? stateOf(prm).jLo : 0; },
        max: function (prm) { return prm.mode === 'slide' ? stateOf(prm).jHi : 1; },
        format: function () { return ''; },
        visible: function (prm) { return prm.mode === 'slide'; } },
      { key: 'zoom', type: 'choice', label: t('zoom'), value: L.defaults.zoom, options: L.ZOOMS.map(function (z) { return [String(z), t('zoom_' + z)]; }),
        visible: function (prm) { return prm.mode === 'two' && audience !== 'child'; } },
      // asking first: the stage's buttons and V open and close it; here so the URL and the presets carry it
      { key: 'hide', type: 'toggle', label: t('hide'), value: L.defaults.hide, visible: hidden },
      { key: 'guess', type: 'select', label: t('guessWas', { g: '' }), value: L.defaults.guess, visible: hidden,
        options: [['', '–'], ['on', t('gOn')], ['off', t('gOff')], ['par', t('g_par')], ['perp', t('g_perp')], ['cross', t('g_cross')]] }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'v', label: t('revealKey'), run: function (sm) {
        if (sm.state.mode === 'slide') return; // nothing is asked in the construction
        sm.set(sm.params.hide ? { hide: false } : { hide: true, guess: '' });
      } }
    ],

    legend: [
      { c: 1, shape: 'line', label: t('legDrawn') },
      { c: 1, shape: 'dash', label: t('legOn') },
      { shape: 'round', label: t('legPt') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows (clamped values written back), and forget the class's answer when the
  // picture changes under it
  var POS = ['mode', 'kind', 'reach', 'ax', 'ay', 'bx', 'by', 'tx', 'ty', 'pdx', 'pdy', 'turn', 'tool', 'j'];
  var sig = null;
  sim.on(function (c) {
    var s = c.state, p = c.params, fix = {};
    // (B on A is not written back: the model moves B and the caption says so, rule 1)
    if (s.mode === 'parts' && p.reach !== s.reach) fix.reach = s.reach;
    if (s.mode === 'slide' && p.j !== s.j) fix.j = s.j;
    var now = POS.map(function (k) { return String(p[k]); }).join('|');
    if (sig !== null && now !== sig && p.guess) fix.guess = '';
    sig = now;
    if (Object.keys(fix).length) sim.set(fix);
  });

  // ── dragging the points; a click on empty paper moves T ──
  var drag = null;
  function paperXY(e) {
    var f = document.querySelector('[data-sim="geo-lines"] .gl-field');
    if (!f) return null;
    var r = f.getBoundingClientRect(), v = sim.state.view;
    return [v.x0 + (e.clientX - r.left) / r.width * (v.x1 - v.x0), v.y1 - (e.clientY - r.top) / r.height * (v.y1 - v.y0)];
  }
  function handles(s) {
    var hs = [['T', s.t], ['A', s.a]];
    if (s.mode === 'parts') hs.push(['B', s.b]);
    return hs;
  }
  function moveTo(key, xy) {
    var c = L.cornerAt(xy[0], xy[1]), patch = {};
    var k = key.toLowerCase();
    if (sim.params[k + 'x'] === c[0] && sim.params[k + 'y'] === c[1]) return;
    patch[k + 'x'] = c[0]; patch[k + 'y'] = c[1];
    sim.set(patch);
  }
  var stage = document.querySelector('[data-sd-stage]');
  stage.addEventListener('pointerdown', function (e) {
    if (!e.target.closest || !e.target.closest('.gl-field')) return;
    var xy = paperXY(e);
    if (!xy) return;
    var s = sim.state, best = null, bd = 0.9 * s.view.z;
    handles(s).forEach(function (hd) {
      var d = Math.hypot(hd[1][0] - xy[0], hd[1][1] - xy[1]);
      if (d <= bd) { bd = d; best = hd[0]; }
    });
    drag = best || 'T';
    moveTo(drag, xy);
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    e.preventDefault();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var xy = paperXY(e);
    if (xy) moveTo(drag, xy);
  });
  function end() { drag = null; }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
