<style>
/* Page CSS: every selector starts with [data-sim="lambda-f"]; colours only from kit tokens. */
[data-sim="lambda-f"] .lf { height: 100%; padding: 1.6cqh 1.6cqw; display: flex; }
[data-sim="lambda-f"] .lf-plot { position: relative; flex: 1; min-height: 12rem; }
[data-sim="lambda-f"] .lf-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="lambda-f"] .lf-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="lambda-f"] .lf-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="lambda-f"] .lf-grid { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
[data-sim="lambda-f"] .lf-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="lambda-f"] .lf-wave { fill: none; stroke: var(--c1); stroke-width: 4; stroke-linejoin: round; }
[data-sim="lambda-f"] .lf-crest { fill: var(--c2); stroke: var(--bg); stroke-width: 2; }
[data-sim="lambda-f"] .lf-dim { stroke: var(--c3); stroke-width: 3; fill: none; }
[data-sim="lambda-f"] .lf-ext { stroke: var(--c3); stroke-width: 2; stroke-dasharray: 6 5; }
[data-sim="lambda-f"] .lf-plot text.lf-dimlabel { fill: var(--ink); font-size: var(--fs-md); font-weight: 600; }
[data-sim="lambda-f"] .lf-axis { font-style: italic; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="lambda-f"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="lambda-f"] .lf { height: auto; padding: 0.6rem; }
  [data-sim="lambda-f"] .lf-plot { flex: none; width: 100%; height: 16rem; }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Valna duljina i frekvencija</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="lf-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function metres(x) { return t('m', { v: num(x.toFixed(2)) }); }
  function mhz(x) { return t('mhz', { v: num(x.toFixed(2)) }); }
  // How many wavelengths fit in the window: up to two decimals, trailing zeros dropped (5, 1,25, 3,33).
  function count(x) { return num(parseFloat(x.toFixed(2))); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }

  var labels = { m8: 'presetM8', m4: 'presetM4', m2: 'presetM2', m1: 'presetM1', cm50: 'presetCm50', m3: 'presetM3', m10: 'presetM10' };

  // ── the stage: a snapshot of the wave over 0 … 10 m, one wavelength marked above it ──
  function drawPlot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 1.2 * rem, r: 1.6 * rem, t: 3.4 * rem, b: 1.9 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var yMax = 1.15;
    var X = function (x) { return pad.l + (x / L.WINDOW) * cw; };
    var Y = function (y) { return pad.t + ch * (1 - (y + yMax) / (2 * yMax)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'lf-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    for (var g = 1; g < L.WINDOW; g++) svg.append(s('line', { class: 'lf-grid', x1: X(g), x2: X(g), y1: pad.t, y2: pad.t + ch }));
    svg.append(s('line', { class: 'lf-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    // distance ticks every metre, every second metre when narrow; the axis name sits before the last label
    var every = cw / L.WINDOW < 4.2 * rem ? 2 : 1;
    for (var x = 0; x <= L.WINDOW; x += every) {
      var anchor = x === 0 ? 'start' : x === L.WINDOW ? 'end' : 'middle';
      svg.append(s('text', { x: X(x), y: H - 0.25 * rem, 'text-anchor': anchor }, t('m', { v: x })));
    }
    svg.append(s('polyline', { class: 'lf-wave',
      points: L.curve(st.lambda, 48, 400).map(function (p) { return X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ') }));
    // crest dots only where they stay apart (not at 50 cm on a phone); the marker still shows one wavelength
    if (st.lambda / L.WINDOW * cw >= 1.2 * rem) st.crests.forEach(function (c) { svg.append(s('circle', { class: 'lf-crest', cx: X(c), cy: Y(1), r: 0.42 * rem })); });
    // the dimension line: two dashed extension lines from the marked points up to an arrowed line labelled λ = …
    var m = st.marker, x1 = X(m.x1), x2 = X(m.x2), yd = pad.t - 1.0 * rem, a = Math.min(0.5 * rem, (x2 - x1) / 4);
    var y0 = m.kind === 'crest' ? Y(1) : Y(0);
    svg.append(s('line', { class: 'lf-ext', x1: x1, x2: x1, y1: y0, y2: yd - 0.4 * rem }));
    svg.append(s('line', { class: 'lf-ext', x1: x2, x2: x2, y1: y0, y2: yd - 0.4 * rem }));
    svg.append(s('line', { class: 'lf-dim', x1: x1, x2: x2, y1: yd, y2: yd }));
    svg.append(s('polyline', { class: 'lf-dim', points: (x1 + a) + ',' + (yd - a / 1.6) + ' ' + x1 + ',' + yd + ' ' + (x1 + a) + ',' + (yd + a / 1.6) }));
    svg.append(s('polyline', { class: 'lf-dim', points: (x2 - a) + ',' + (yd - a / 1.6) + ' ' + x2 + ',' + yd + ' ' + (x2 - a) + ',' + (yd + a / 1.6) }));
    var label = s('text', { class: 'lf-dimlabel', x: (x1 + x2) / 2, y: yd - 0.55 * rem, 'text-anchor': 'middle' }, t('marker', { v: metres(st.lambda) }));
    svg.append(label);
    box.replaceChildren(svg);
    // keep the label inside the plot when the marked wavelength is short and near an edge
    var bb = label.getBBox ? label.getBBox() : null;
    if (bb && bb.width) {
      var cx = Math.min(Math.max((x1 + x2) / 2, pad.l + bb.width / 2), pad.l + cw - bb.width / 2);
      label.setAttribute('x', cx);
    }
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'cm', type: 'range', label: t('lambda'), hint: t('lambdaHint'), min: L.CM_MIN, max: L.CM_MAX, step: 1,
        format: function (v) { return metres(v / 100); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendWave') },
      { c: 2, shape: 'round', label: t('legendCrests') },
      { c: 3, label: t('legendLambda') }
    ],

    render: function (c) {
      var plot = h('div', { class: 'lf-plot' });
      c.stage.replaceChildren(h('div', { class: 'lf' }, plot));
      drawPlot(plot, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      return t.parts('caption', {
        lambda: b(metres(st.lambda)), lambdaAgain: b(metres(st.lambda)), f: b(mhz(st.f)), rule: b(mhz(st.fRule)), periods: b(count(st.periods))
      });
    }
  });

  // The plot is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
