<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var DAY = L.DAY;
  var sim = null;
  var WD = t('wd').split('|'), MON = t('monthsShort').split('|'), MONTH = t('months').split('|');

  // ── words for numbers and moments ──
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function dur(min) {
    var p = L.parts(min), out = [];
    if (p.d) out.push(t.n('days', p.d));
    if (p.h && p.m) out.push(t('hm', { h: p.h, m: p.m }));
    else if (p.h) out.push(t('hOnly', { h: p.h }));
    else if (p.m || !p.d) out.push(t('mOnly', { m: p.m }));
    return out.join(' ');
  }
  /** Short form for slider values: 45 min, 4 h, 5:40 h. */
  function short(min) { var hh = Math.floor(min / 60), mm = min % 60; return hh ? (mm ? hh + ':' + pad2(mm) + ' h' : hh + ' h') : mm + ' min'; }
  function clock(m) { return pad2(m.h) + ':' + pad2(m.min); }
  function when(x, wk) {
    var m = L.moment(x, wk);
    return t('dayShort', { wd: WD[m.wd], d: m.d, m: MON[m.m - 1] }) + ' ' + clock(m);
  }
  function weekTime(v) { var m = L.moment(v, 4); return WD[m.wd] + ' ' + clock(m); }
  function dayLabel(x, wk) { var m = L.moment(x, wk); return t('dayShort', { wd: WD[m.wd], d: m.d, m: MON[m.m - 1] }); }
  function dateLong(x, wk) { var m = L.moment(x, wk); return t('dayLong', { d: m.d, month: MONTH[m.m - 1] }) + ', ' + clock(m); }
  function hours(v) { return dur(v * 60); }
  var STATE = { good: 'stGood', failed: 'stFailed', unfinished: 'stUnfinished', damaged: 'stDamaged' };

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }

  // ── "changed": a bracket whose verdict flipped with the last change ──
  var lastVerdict = null, flipped = { rpo: false, rto: false };
  function trackChanges(st) {
    var v = { rpo: st.rpoMet, rto: st.rtoMet };
    if (lastVerdict) flipped = { rpo: v.rpo !== lastVerdict.rpo, rto: v.rto !== lastVerdict.rto };
    lastVerdict = v;
  }

  // ── the time axis: one piece, or two with a break when the last good point is far back ──
  function axisPieces(st, p, W, gapPx) {
    var I = st.incident;
    var Z = Math.max(st.back, I + p.rtoH * 60, I + 60);
    var right = Z - I;
    var Cs = Math.min(I - p.rpoH * 60, st.damageStart, I - Math.max(60, 0.35 * right));
    var span0 = Z - Cs;
    var padR = Math.max(20, 0.04 * span0);
    Z += padR;
    var lg = st.lastGood;
    if (lg >= Cs - 0.6 * span0) {
      var A = Math.min(lg, Cs), padL = Math.max(20, 0.05 * (Z - A));
      return [{ from: A - padL, to: Z }];
    }
    var X = Z - Cs, half = 0.09 * X;
    var p1 = { from: lg - half, to: lg + half }, p2 = { from: Cs - 0.04 * X, to: Z };
    return [p1, p2];
  }
  function makeScale(pieces, x0, W, gapPx) {
    var total = pieces.reduce(function (a, pc) { return a + pc.to - pc.from; }, 0);
    var k = (W - (pieces.length - 1) * gapPx) / total, x = x0;
    pieces.forEach(function (pc) { pc.x = x; pc.w = (pc.to - pc.from) * k; x += pc.w + gapPx; });
    function X(tm) {
      for (var i = 0; i < pieces.length; i++) {
        var pc = pieces[i];
        if (tm <= pc.to || i === pieces.length - 1) return pc.x + (Math.max(tm, pc.from) - pc.from) * k;
        if (tm < pieces[i + 1].from) return pc.x + pc.w + gapPx / 2;  // inside the break
      }
    }
    X.k = k;
    X.visible = function (tm) { return pieces.some(function (pc) { return tm >= pc.from && tm <= pc.to; }); };
    return X;
  }
  function tickStep(k, rem) {
    var steps = [15, 30, 60, 120, 180, 360, 720, DAY, 2 * DAY, 7 * DAY];
    for (var i = 0; i < steps.length; i++) if (steps[i] * k >= 3.6 * rem) return steps[i];
    return 14 * DAY;
  }

  // ── the timeline ──
  function draw(box, st, p) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var fs = Math.max(16, 0.8 * rem), big = rem;
    var narrow = W < 40 * rem;
    var gapPx = 8 * rem;
    var padX = 0.6 * rem;
    var pieces = drag && drag.pieces ? drag.pieces : axisPieces(st, p, W, gapPx);
    if (drag && !drag.pieces) drag.pieces = pieces;
    var reserve = narrow ? 0 : 12 * rem;
    var X = makeScale(pieces, padX, W - 2 * padX - reserve, gapPx);
    var I = st.incident, xI = X(I);

    // rows, top to bottom
    // On the phone each verdict takes two lines, so the brackets move in by one line.
    var two = narrow ? 1.15 * big : 0;
    var y = {
      rpoLabel: 1.1 * big, rpoBr: 1.1 * big + 1.0 * fs + two, replica: 0.3 * H + two, glyph: 0.39 * H + two, axis: 0.46 * H + two,
      rtoBr: H - 1.2 * big - 1.3 * fs - two, rtoLabel: H - 0.35 * big - two
    };
    y.phaseTop = y.axis + 3.4 * fs;
    y.phaseBot = y.phaseTop + Math.max(1.6 * fs, 0.09 * H);
    y.phaseLab = y.phaseBot + 1.1 * fs;
    var svg = s('svg', { width: W, height: H, role: 'img', 'aria-label': t('stage') });
    box.replaceChildren(svg);
    svg.append(s('defs', null,
      s('pattern', { id: 'rr-dots', patternUnits: 'userSpaceOnUse', width: 10, height: 10 }, s('circle', { class: 'rr-dot', cx: 5, cy: 5, r: 2.2 })),
      s('pattern', { id: 'rr-hatch', patternUnits: 'userSpaceOnUse', width: 10, height: 10, patternTransform: 'rotate(45)' },
        s('line', { class: 'rr-hatch-line', x1: 0, y1: 0, x2: 0, y2: 10 }))));

    // damage before the incident: a band from its real start
    if (st.damageStart < I) {
      var xS = X(st.damageStart);
      svg.append(s('rect', { class: 'rr-damage-band', x: xS, y: y.replica - 0.8 * fs, width: Math.max(2, xI - xS), height: y.axis - y.replica + 0.8 * fs }));
      svg.append(s('line', { class: 'rr-damage', x1: xS, x2: xS, y1: y.replica - 1.2 * fs, y2: y.axis }));
      svg.append(s('text', { class: 'rr-bad', x: xS - 0.3 * rem, y: y.replica - 1.3 * fs, 'text-anchor': 'end' }, t('damageLabel')));
    }

    // axis pieces, ticks, day labels, the break
    var step = tickStep(X.k, rem);
    var xB = X(st.back);
    var blocked = [[xI - 0.9 * rem, xI + 0.9 * rem], [xB - 0.3 * rem, xB + 0.3 * rem]];
    function dayText(x, label, limit) {
      var el = s('text', { x: x + 0.2 * rem, y: y.axis + 1.35 * fs, class: 'rr-muted' }, label);
      var w = textW(svg, el), x1 = x + 0.2 * rem;
      blocked.forEach(function (b) { if (x1 < b[1] && x1 + w > b[0]) x1 = b[1] + 0.2 * rem; });
      if (x1 + w > limit) { el.remove(); return false; }
      el.setAttribute('x', x1);
      return true;
    }
    pieces.forEach(function (pc, i) {
      var last = i === pieces.length - 1;
      svg.append(s('line', { class: 'rr-axis', x1: pc.x, x2: pc.x + pc.w + (last ? reserve : 0), y1: y.axis, y2: y.axis }));
      var first = Math.ceil(pc.from / step) * step, lastDayX = -1e9;
      for (var tm = first; tm <= pc.to; tm += step) {
        var x = X(tm), midnight = ((tm % DAY) + DAY) % DAY === 0;
        svg.append(s('line', { class: midnight ? 'rr-tick' : 'rr-minor', x1: x, x2: x, y1: y.axis - (midnight ? 0.5 : 0.3) * fs, y2: y.axis + (midnight ? 0.5 : 0.3) * fs }));
        if (midnight && x - lastDayX > 7 * rem && x > pc.x + 1) {
          if (dayText(x, dayLabel(tm, p.week), pc.x + pc.w + (last ? reserve : 0))) lastDayX = x;
        } else if (!midnight && step < DAY && !narrow) {
          var m = L.moment(tm, p.week);
          svg.append(s('text', { x: x, y: y.axis + 2.55 * fs, 'text-anchor': 'middle', class: 'rr-muted' }, clock(m)));
        }
      }
      if (i > 0) {
        var gx = pc.x - gapPx, zig = 0.45 * fs;
        [gx + 0.15 * rem, pc.x - 0.15 * rem].forEach(function (bx) {
          svg.append(s('path', { class: 'rr-break', d: 'M' + (bx - zig / 2) + ' ' + (y.axis + zig) + ' L' + (bx + zig / 2) + ' ' + (y.axis - zig) }));
        });
        var left = pieces[i - 1].to, right = pc.from;
        var bad = st.points.filter(function (q) { return q.t > left && q.t < right && q.state !== 'good'; }).length;
        var cx = gx + gapPx / 2;
        svg.append(s('text', { x: cx, y: y.axis + 1.35 * fs, 'text-anchor': 'middle', class: 'rr-muted' }, t('gap', { d: dur(Math.round(right - left)) })));
        if (bad) svg.append(s('text', { x: cx, y: y.axis + 2.55 * fs, 'text-anchor': 'middle', class: 'rr-bad' }, t.n('gapBad', bad)));
      }
    });

    // the replica: a bar kept in step up to its position
    if (st.replica) {
      var rx = X(st.replica.t), rGood = st.replica.state === 'good';
      svg.append(s('line', { class: 'rr-replica', x1: pieces[0].x, x2: rx, y1: y.replica, y2: y.replica }));
      svg.append(s('text', { x: pieces[0].x, y: y.replica - 0.55 * fs, class: 'rr-muted' }, t('replicaLabel')));
      svg.append(glyph(rx, y.replica, rGood, 0.62 * fs, t('replicaPoint', { when: when(st.replica.t, p.week), state: t(STATE[st.replica.state]) })));
    }

    // recovery points: a stem down to the axis and a glyph, ✓ in a disc or ✗
    var r = Math.max(3, Math.min(0.62 * fs, 0.42 * p.interval * X.k));
    st.points.forEach(function (q) {
      if (!X.visible(q.t)) return;
      var x = X(q.t), good = q.state === 'good';
      svg.append(s('line', { class: 'rr-stem', x1: x, x2: x, y1: y.glyph, y2: y.axis }));
      svg.append(glyph(x, y.glyph, good, r, t('pointLabel', { when: when(q.t, p.week), state: t(STATE[q.state]) })));
    });
    var xG = X(st.lastGood), yG = st.lastGoodKind === 'replica' ? y.replica : y.glyph;
    svg.append(s('circle', { class: 'rr-lastgood', cx: xG, cy: yG, r: Math.max(r, 0.62 * fs) + 5 }));

    // targets: dashed lines at incident − RPO target and incident + RTO target
    var xRpoT = X(I - p.rpoH * 60), xRtoT = X(I + p.rtoH * 60);
    svg.append(s('line', { class: 'rr-target', x1: xRpoT, x2: xRpoT, y1: y.rpoBr - 0.6 * fs, y2: y.axis }));
    var rpoTEl = s('text', { x: xRpoT - 0.3 * rem, y: y.rpoBr + 1.3 * fs, 'text-anchor': 'end', class: 'rr-muted' }, t('rpoTargetLine'));
    if (xRpoT - 0.3 * rem - textW(svg, rpoTEl) < 2) { rpoTEl.setAttribute('x', xRpoT + 0.3 * rem); rpoTEl.setAttribute('text-anchor', 'start'); }
    svg.append(s('line', { class: 'rr-target', x1: xRtoT, x2: xRtoT, y1: y.axis, y2: y.rtoBr + 0.6 * fs }));
    var rtoTEl = s('text', { x: xRtoT + 0.3 * rem, y: y.rtoBr - 0.6 * fs, class: 'rr-muted' }, t('rtoTargetLine'));
    if (xRtoT + 0.3 * rem + textW(svg, rtoTEl) > W - 2) { rtoTEl.setAttribute('x', xRtoT - 0.3 * rem); rtoTEl.setAttribute('text-anchor', 'end'); }

    // phases: consecutive bars from the incident, labels below on as many rows as they need
    var shown = st.phases.filter(function (ph) { return ph.to > ph.from; });
    shown.forEach(function (ph, i) {
      var x1 = X(ph.from), x2 = X(ph.to), row = shown.length - 1 - i;
      svg.append(s('rect', { class: 'rr-phase', 'data-p': ph.id, x: x1, y: y.phaseTop, width: Math.max(2, x2 - x1), height: y.phaseBot - y.phaseTop }));
      var lx = Math.min(x1, x2 - 2) + 2, ly = y.phaseLab + row * 1.3 * fs;
      svg.append(s('line', { class: 'rr-leader', x1: lx, x2: lx, y1: y.phaseBot, y2: ly + 0.25 * fs }));
      var el = s('text', { x: lx + 0.3 * rem, y: ly }, t(ph.id) + ' ' + dur(ph.to - ph.from));
      var w = textW(svg, el);
      if (lx + 0.3 * rem + w > W - 2) {
        if (narrow) el.setAttribute('x', Math.max(2, W - 2 - w));
        else { el.setAttribute('x', lx - 0.3 * rem); el.setAttribute('text-anchor', 'end'); }
      }
    });

    // service back
    svg.append(s('line', { class: 'rr-back', x1: xB, x2: xB, y1: y.axis - 3.2 * fs, y2: y.rtoBr }));
    var backEl = s('text', { x: xB + 0.4 * rem, y: y.axis - 2.0 * fs, class: 'rr-big' },
      s('tspan', null, t('backLabel')), s('tspan', { x: xB + 0.4 * rem, dy: 1.15 * big }, when(st.back, p.week)));
    var bw = textW(svg, backEl);
    if (narrow && xB + 0.4 * rem + bw > W - 2) {
      backEl.setAttribute('y', y.rtoBr - 2.4 * fs);
      [backEl, backEl.lastChild].forEach(function (e) { e.setAttribute('x', Math.max(2, W - 2 - bw)); });
    } else if (xB + 0.4 * rem + bw > W - 2) {
      backEl.setAttribute('text-anchor', 'end');
      [backEl, backEl.lastChild].forEach(function (e) { e.setAttribute('x', xB - 0.4 * rem); });
    }

    // brackets: data lost above (last good → incident), time down below (incident → service back)
    svg.append(bracket(xG, xI, y.rpoBr, 1, st.rpoMet));
    svg.append(s('line', { class: 'rr-stem', x1: xG, x2: xG, y1: y.rpoBr, y2: yG - Math.max(r, 0.62 * fs) - 5 }));
    svg.append(bracket(xI, xB, y.rtoBr, -1, st.rtoMet));
    var rpoText = [t('dataLost') + ': ' + dur(st.lossM), t('targetIs', { v: hours(p.rpoH) }), t(st.rpoMet ? 'met' : 'missed')];
    var sum = st.phases.map(function (ph) { return dur(ph.to - ph.from); }).join(' + ');
    var rtoText = [t('timeDown') + ': ' + t('rtoSum', { sum: sum, v: dur(st.downM) }), t('targetIs', { v: hours(p.rtoH) }), t(st.rtoMet ? 'met' : 'missed')];
    verdictLabel(svg, rpoText, st.rpoMet, flipped.rpo, narrow ? 4 : xI - 0.5 * rem, y.rpoLabel, narrow ? 'start' : 'end', W, narrow);
    verdictLabel(svg, rtoText, st.rtoMet, flipped.rto, narrow ? 4 : xI + 0.5 * rem, y.rtoLabel, 'start', W, narrow);

    // the incident: a red line over everything, its label and a handle to drag it
    svg.append(s('line', { class: 'rr-incident', x1: xI, x2: xI, y1: y.rpoBr - 0.6 * fs, y2: y.rtoBr }));
    var incEl = s('text', { x: xI + 0.5 * rem, y: y.rpoBr + 1.6 * big, class: 'rr-big rr-bad' }, t('incidentLabel') + ' ' + when(I, p.week));
    var iw = textW(svg, incEl);
    if (narrow && xI + 0.5 * rem + iw > W - 2) incEl.setAttribute('x', Math.max(2, W - 2 - iw));
    else if (xI + 0.5 * rem + iw > W - 2) { incEl.setAttribute('x', xI - 0.5 * rem); incEl.setAttribute('text-anchor', 'end'); }
    var handle = s('g', { 'aria-hidden': 'true' },
      s('rect', { class: 'rr-grab', x: xI - 1.2 * rem, y: y.rpoBr, width: 2.4 * rem, height: y.phaseTop - y.rpoBr }),
      s('circle', { class: 'rr-handle', cx: xI, cy: y.axis, r: 0.75 * rem }),
      s('title', null, t('dragHint')));
    handle.addEventListener('pointerdown', function (ev) { startDrag(ev, X.k); });
    svg.append(handle);
  }

  /** Appends a text element and returns its measured width (the svg is in the page already). */
  function textW(svg, el) { svg.append(el); return el.getComputedTextLength(); }

  function glyph(x, yy, good, r, label) {
    var g = s('g', { role: 'img', 'aria-label': label });
    if (good) {
      g.append(s('circle', { class: 'rr-good', cx: x, cy: yy, r: r }));
      if (r >= 7) g.append(s('path', { class: 'rr-check', d: 'M' + (x - 0.45 * r) + ' ' + yy + ' l' + 0.32 * r + ' ' + 0.36 * r + ' l' + 0.62 * r + ' ' + -0.72 * r }));
    } else {
      var d = 'M' + (x - r) + ' ' + (yy - r) + ' L' + (x + r) + ' ' + (yy + r) + ' M' + (x + r) + ' ' + (yy - r) + ' L' + (x - r) + ' ' + (yy + r);
      g.append(s('path', { class: 'rr-cross-under', d: d }), s('path', { class: 'rr-cross', d: d }));
    }
    return g;
  }
  function bracket(x1, x2, yy, dir, ok) {
    var tip = 0.6 * dir * 16;
    if (x2 - x1 < 2) x2 = x1 + 2;
    return s('path', { class: 'rr-bracket', 'data-ok': ok ? '1' : '0', d: 'M' + x1 + ' ' + (yy + tip) + ' V' + yy + ' H' + x2 + ' V' + (yy + tip) });
  }
  function verdictLabel(svg, parts, ok, changed, x, yy, anchor, W, twoLines) {
    var verdict = s('tspan', { class: changed ? 'rr-on-hl' : ok ? 'rr-ok' : 'rr-bad' }, parts[2]);
    var txt = twoLines
      ? s('text', { x: x, y: yy, class: 'rr-big' }, s('tspan', null, parts[0]),
        s('tspan', { class: 'rr-muted', x: x, dy: 1.15 * parseFloat(getComputedStyle(document.documentElement).fontSize) }, parts[1] + ' '), verdict)
      : s('text', { x: x, y: yy, 'text-anchor': anchor, class: 'rr-big' },
        s('tspan', null, parts[0]), s('tspan', { class: 'rr-muted' }, ' · ' + parts[1] + ' '), verdict);
    var w = textW(svg, txt);
    if (twoLines) w = 0;  // each line starts at the left edge
    if (anchor === 'end' && x - w < 4) { txt.setAttribute('text-anchor', 'start'); txt.setAttribute('x', 4); }
    if (anchor === 'start' && x + w > W - 4) { txt.setAttribute('text-anchor', 'end'); txt.setAttribute('x', W - 4); }
    if (changed) {
      var bb = txt.getBBox(), vw = verdict.getComputedTextLength(), lh = twoLines ? bb.height / 2 : bb.height;
      var vx = verdict.getStartPositionOfChar ? verdict.getStartPositionOfChar(0).x : bb.x + bb.width - vw;
      svg.insertBefore(s('rect', { class: 'rr-changed', x: vx - 3, y: bb.y + bb.height - lh - 3, width: vw + 9, height: lh + 6, rx: 4 }), txt);
    }
  }

  // ── dragging the incident along the line (the slider does the same) ──
  var drag = null;  // while dragging: { pieces } keeps the axis still, so the marker follows the pointer
  function startDrag(ev, k) {
    ev.preventDefault();
    var x0 = ev.clientX, t0 = sim.params.incidentAt;
    drag = {};
    function move(e) {
      var v = Math.round((t0 + (e.clientX - x0) / k) / 5) * 5;
      v = Math.max(0, Math.min(L.WEEK - 5, v));
      if (v !== sim.params.incidentAt) sim.set({ incidentAt: v });
    }
    function up() {
      drag = null;
      if (last) draw(plot, last.state, last.params);
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }

  // ── captions: the one thing the current picture shows ──
  function caption(c) {
    var st = c.state, p = c.params;
    var b = function (x) { return h('b', null, x); };
    var em = function (x) { return h('em', { lang: 'en' }, x); };
    var lossB = b(dur(st.lossM)), date = dateLong(st.lastGood, p.week);
    switch (L.captionKey(st, p)) {
      case 'replica': return t.parts('cReplica', { date: date, loss: lossB });
      case 'replicaAndCopies': return t.parts('cReplicaCopies', { n: st.skipped.damaged, start: when(st.damageStart, p.week), date: date, loss: lossB });
      case 'failed': return t.parts('cFailed', { every: t('every' + p.interval), date: b(date), loss: lossB });
      case 'detect': return t.parts('cDetect', { rpoTerm: em('RPO'), rtoTerm: em('RTO'), d: b(dur(p.detect)), rto: hours(p.rtoH) });
      case 'damaged': return t.parts('cDamaged', { n: st.skipped.damaged, start: when(st.damageStart, p.week), date: date, loss: lossB });
      case 'unfinished': {
        var u = st.points.filter(function (q) { return q.state === 'unfinished'; });
        return t.parts('cUnfinished', { n: u.length, when: when(u[u.length - 1].t, p.week), date: date, loss: lossB });
      }
      case 'replicaGood': return t.parts('cReplicaGood', { loss: lossB });
      default: return t.parts('cBoth', { loss: lossB, rpo: hours(p.rpoH), rpoV: t(st.rpoMet ? 'met' : 'missed'),
        down: b(dur(st.downM)), rto: hours(p.rtoH), rtoV: t(st.rtoMet ? 'met' : 'missed') });
    }
  }

  var labels = {
    'nightly-backup': 'presetNightly', 'failing-backups': 'presetFailing', 'found-on-monday': 'presetMonday',
    'ransomware': 'presetRansom', 'replica-not-backup': 'presetReplica'
  };
  var plot = null, sched = null, last = null;

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'interval', type: 'choice', label: t('interval'), options: [[15, t('iv15')], [60, t('iv60')], [DAY, t('iv1440')], [7 * DAY, t('iv10080')]] },
      { key: 'kind', type: 'choice', label: t('kind'), options: [['loss', t('kindLoss')], ['damage', t('kindDamage')]] },
      { key: 'incidentAt', type: 'range', label: t('incidentAt'), min: 0, max: L.WEEK - 5, step: 5, format: weekTime },
      { key: 'damageBefore', type: 'range', label: t('damageBefore'), min: 0, max: 72 * 60, step: 10, format: short },
      { key: 'detect', type: 'range', label: t('detect'), min: 0, max: 48 * 60, step: 10, format: short },
      { key: 'decide', type: 'range', label: t('decide'), min: 0, max: 24 * 60, step: 30, format: short },
      { key: 'restore', type: 'range', label: t('restore'), min: 0, max: 72 * 60, step: 30, format: short },
      { key: 'verify', type: 'range', label: t('verify'), min: 0, max: 8 * 60, step: 30, format: short },
      { key: 'rpoH', type: 'range', label: t('rpoH'), min: 0, max: 168, step: 1, format: hours },
      { key: 'rtoH', type: 'range', label: t('rtoH'), min: 0, max: 72, step: 1, format: hours },
      { key: 'jobMin', type: 'range', label: t('jobMin'), min: 0, max: 120, step: 2, format: short },
      { key: 'failedRuns', type: 'range', label: t('failedRuns'), min: 0, max: 60, step: 1 },
      { key: 'replica', type: 'toggle', label: t('replica') },
      { key: 'week', type: 'range', label: t('weekLabel'), min: 4, max: 99999, step: 7, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'rr-good', label: t('legendGood') },
      { shape: 'rr-bad', label: t('legendBad') },
      { shape: 'rr-replica', label: t('legendReplica') },
      { shape: 'rr-incident', label: t('legendIncident') },
      { shape: 'rr-detect', label: t('legendDetect') },
      { shape: 'rr-decide', label: t('legendDecide') },
      { shape: 'rr-restore', label: t('legendRestore') },
      { shape: 'rr-verify', label: t('legendVerify') },
      { shape: 'rr-target', label: t('legendTarget') },
      { shape: 'hl', label: t('legendChanged') }
    ],
    render: function (c) {
      if (!plot) {
        plot = h('div', { class: 'rr-plot' });
        sched = h('p', { class: 'rr-sched' });
        c.stage.replaceChildren(h('div', { class: 'rr' }, plot, sched));
        new ResizeObserver(function () { if (last) draw(plot, last.state, last.params); }).observe(plot);
      }
      trackChanges(c.state);
      last = { state: c.state, params: c.params };
      var p = c.params;
      sched.replaceChildren.apply(sched, t.parts('schedule', { iv: t('iv' + p.interval), job: dur(p.jobMin),
        worst: h('b', null, dur(c.state.worstM)), avg: h('b', null, dur(c.state.avgM)) }));
      draw(plot, c.state, p);
    },
    caption: caption
  });
})();
</script>
</body>
</html>
