<div class="sd-page">

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian; up to `d` decimals, trailing zeros dropped.
  function num(x, d) { var s = String(parseFloat(x.toFixed(d || 0))); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function secs(x) { return t('s', { v: num(x, 2) }); }
  function pct(x) { return t('pct', { v: num(x) }); }
  function hz(x) { return t('hz', { v: num(x, 3) }); }
  // A negative number with a real minus sign, not a hyphen.
  function signed(x) { return x < 0 ? '−' + pct(-x) : pct(x); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function arrowHead(x, y, dx, dy, a) {
    // an open arrow head at (x, y) pointing along (dx, dy), a unit vector; legs `a` long
    var px = -dy, py = dx;
    return (x - dx * a + px * a / 1.6) + ',' + (y - dy * a + py * a / 1.6) + ' ' + x + ',' + y + ' ' +
      (x - dx * a - px * a / 1.6) + ',' + (y - dy * a - py * a / 1.6);
  }

  var labels = {
    start: 'presetStart', t2: 'presetT2', t4: 'presetT4', t8: 'presetT8',
    full: 'presetFull', quarter: 'presetQuarter', zero: 'presetZero'
  };

  // ── the stage: the oscillogram over 0 … 24 s, one period marked above it, the amplitude at its right edge ──
  function drawPlot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    // On a narrow plot (a phone) the amplitude label moves from the right margin to the top right corner.
    var narrow = W < 32 * rem;
    var pad = { l: 4.4 * rem, r: (narrow ? 1.8 : 6.2) * rem, t: 3.4 * rem, b: 1.9 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var yMax = 112;
    var X = function (x) { return pad.l + (x / L.WINDOW) * cw; };
    var Y = function (y) { return pad.t + ch * (1 - (y + yMax) / (2 * yMax)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'sa-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    for (var g = 1; g < L.WINDOW; g++) svg.append(s('line', { class: 'sa-grid', x1: X(g), x2: X(g), y1: pad.t, y2: pad.t + ch }));
    [-100, -50, 50, 100].forEach(function (v) { svg.append(s('line', { class: 'sa-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) })); });
    svg.append(s('line', { class: 'sa-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    // ticks: time every 1, 2, 3, 4, 6 or 12 s, whichever leaves room for the label; voltage every 50 %
    var ticks = s('g', { translate: 'no' });
    var every = [1, 2, 3, 4, 6, 12].filter(function (e) { return e * cw / L.WINDOW >= 3 * rem; })[0] || 12;
    for (var x = 0; x <= L.WINDOW; x += every) {
      ticks.append(s('text', { x: X(x), y: H - 0.25 * rem, 'text-anchor': 'middle' }, secs(x)));
    }
    [-100, -50, 0, 50, 100].forEach(function (v) {
      ticks.append(s('text', { x: pad.l - 0.5 * rem, y: Y(v) + 0.35 * rem, 'text-anchor': 'end' }, signed(v)));
    });
    svg.append(ticks);

    // the two half-waves of the first period, shaded under the curve and signed + and −
    st.halves.forEach(function (hw) {
      var pts = [X(hw.t1).toFixed(1) + ',' + Y(0).toFixed(1)];
      for (var i = 0; i <= 48; i++) {
        var tt = hw.t1 + (i / 48) * (hw.t2 - hw.t1);
        pts.push(X(tt).toFixed(1) + ',' + Y(L.value(tt, st.a, st.T)).toFixed(1));
      }
      pts.push(X(hw.t2).toFixed(1) + ',' + Y(0).toFixed(1));
      svg.append(s('polygon', { class: 'sa-half', 'data-sign': hw.sign, points: pts.join(' ') }));
      var lobeW = X(hw.t2) - X(hw.t1), lobeH = Math.abs(Y(st.a) - Y(0));
      if (lobeW >= 1.2 * rem && lobeH >= 2 * rem) {
        svg.append(s('text', { class: 'sa-sign', x: X((hw.t1 + hw.t2) / 2), y: Y(hw.sign * st.a * 0.45) + 0.4 * rem,
          'text-anchor': 'middle' }, t(hw.sign > 0 ? 'halfPos' : 'halfNeg')));
      }
    });

    svg.append(s('polyline', { class: 'sa-wave',
      points: L.curve(st.a, st.T).map(function (p) { return X(p.t).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ') }));

    // the amplitude: the first crest as a dot, a dotted level line from it to the right edge (every crest touches it),
    // and an arrowed line from the zero line up to it in the right margin, labelled a = …
    if (st.crest) {
      var cx = X(st.crest.t), cy = Y(st.crest.y), xa = pad.l + cw + 1.0 * rem, aa = Math.min(0.5 * rem, (Y(0) - cy) / 3);
      svg.append(s('line', { class: 'sa-guideA', x1: cx, x2: xa + 0.4 * rem, y1: cy, y2: cy }));
      svg.append(s('line', { class: 'sa-guideA', x1: pad.l + cw, x2: xa + 0.4 * rem, y1: Y(0), y2: Y(0) }));
      svg.append(s('line', { class: 'sa-dimA', x1: xa, x2: xa, y1: Y(0), y2: cy }));
      if (aa > 2) {
        svg.append(s('polyline', { class: 'sa-dimA', points: arrowHead(xa, cy, 0, -1, aa) }));
        svg.append(s('polyline', { class: 'sa-dimA', points: arrowHead(xa, Y(0), 0, 1, aa) }));
      }
      svg.append(s('circle', { class: 'sa-crest', cx: cx, cy: cy, r: 0.42 * rem }));
      svg.append(narrow
        ? s('text', { class: 'sa-dimlabel', x: W, y: pad.t - 1.55 * rem, 'text-anchor': 'end' }, t('markerA', { v: pct(st.a) }))
        : s('text', { class: 'sa-dimlabel', x: xa + 0.5 * rem, y: Math.min((Y(0) + cy) / 2, Y(0) - 0.6 * rem) + 0.4 * rem },
          t('markerA', { v: pct(st.a) })));
    }

    // the period: two dashed extension lines from the zero line at 0 and T, an arrowed line between them, T = …
    if (!st.flat) {
      var x1 = X(st.period.t1), x2 = X(st.period.t2), yd = pad.t - 1.0 * rem, a = Math.min(0.5 * rem, (x2 - x1) / 4);
      svg.append(s('line', { class: 'sa-extT', x1: x1, x2: x1, y1: Y(0), y2: yd - 0.4 * rem }));
      svg.append(s('line', { class: 'sa-extT', x1: x2, x2: x2, y1: Y(0), y2: yd - 0.4 * rem }));
      svg.append(s('line', { class: 'sa-dimT', x1: x1, x2: x2, y1: yd, y2: yd }));
      svg.append(s('polyline', { class: 'sa-dimT', points: arrowHead(x1, yd, -1, 0, a) }));
      svg.append(s('polyline', { class: 'sa-dimT', points: arrowHead(x2, yd, 1, 0, a) }));
      var label = s('text', { class: 'sa-dimlabel', x: (x1 + x2) / 2, y: yd - 0.55 * rem, 'text-anchor': 'middle' }, t('markerT', { v: secs(st.T) }));
      svg.append(label);
      box.replaceChildren(svg);
      // keep the label inside the plot when the period is short and starts at the left edge
      var bb = label.getBBox ? label.getBBox() : null;
      if (bb && bb.width) label.setAttribute('x', Math.max((x1 + x2) / 2, pad.l + bb.width / 2 - 0.4 * rem));
      return;
    }
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'a', type: 'range', label: t('a'), hint: t('aHint'), min: L.A_MIN, max: L.A_MAX, step: L.A_STEP, format: pct },
      { key: 'T', type: 'range', label: t('T'), hint: t('THint'), min: L.T_MIN, max: L.T_MAX, step: L.T_STEP, format: secs }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendWave') },
      { c: 2, shape: 'round', label: t('legendA') },
      { c: 3, label: t('legendT') },
      { c: 4, label: t('legendHalves') }
    ],

    render: function (c) {
      var plot = h('div', { class: 'sa-plot' });
      c.stage.replaceChildren(h('div', { class: 'sa' },
        h('div', { class: 'sa-head' }, h('span', { class: 'sa-label' }, t('scope')), h('span', { class: 'sa-note' }, t('scopeNote'))),
        plot));
      drawPlot(plot, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var v = { a: b(pct(st.a)), T: b(secs(st.T)), f: b(hz(st.f)), p: b(num(st.periods, 2)) };
      if (st.flat) return t.parts('captionZero', v);
      return t.parts(st.T === 1 ? 'captionOne' : 'captionMany', v);
    }
  });

  // The plot is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
