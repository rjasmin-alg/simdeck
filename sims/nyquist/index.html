     An explorer: the sampling rate drives the drawing live; the model is in sim.js, the words in strings.js. -->
<html lang="hr" data-sim="nyquist">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teorem uzorkovanja i aliasing · simdeck</title>
<meta name="description" content="Sinus od 1 kHz uzorkuje se i rekonstruira iz uzoraka: Nyquistov uvjet fs > 2f i aliasing.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "nyquist",
  "class": "explorer",
  "title": { "hr": "Teorem uzorkovanja i aliasing", "en": "The sampling theorem and aliasing" },
  "concept": { "hr": "Signal se iz uzoraka može rekonstruirati samo ako je fs > 2f", "en": "A signal can be rebuilt from its samples only if fs > 2f" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="nyquist"]; colours only from kit tokens. */
[data-sim="nyquist"] .nq {
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 1.6cqh;
  height: 100%;
  padding: 1.6cqh 1.6cqw;
}
[data-sim="nyquist"] .nq-panel { display: flex; flex-direction: column; min-height: 0; gap: 0.2rem; }
[data-sim="nyquist"] .nq-head { display: flex; align-items: baseline; gap: 0.6rem 1.4rem; flex-wrap: wrap; }
[data-sim="nyquist"] .nq-label { font-weight: 700; }
[data-sim="nyquist"] .nq-note { font-size: var(--fs-sm); color: var(--muted); }
[data-sim="nyquist"] .nq-verdict {
  margin-left: auto;
  padding: 0 0.6rem;
  border: var(--line-w) solid currentColor;
  border-radius: var(--radius-sm);
  font-weight: 700;
}
[data-sim="nyquist"] .nq-verdict[data-v="ok"] { color: var(--ok); }
[data-sim="nyquist"] .nq-verdict[data-v="boundary"] { color: var(--warn); border-style: dashed; }
[data-sim="nyquist"] .nq-verdict[data-v="alias"] { color: var(--danger); border-width: 0.25rem; }
[data-sim="nyquist"] .nq-plot { position: relative; flex: 1; min-height: 6rem; }
[data-sim="nyquist"] .nq-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="nyquist"] .nq-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="nyquist"] .nq-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="nyquist"] .nq-grid { stroke: var(--line); stroke-width: 1; opacity: 0.5; }
[data-sim="nyquist"] .nq-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="nyquist"] .nq-line { fill: none; stroke-linejoin: round; }
[data-sim="nyquist"] .nq-line[data-line="signal"] { stroke: var(--c1); stroke-width: 3.5; }
[data-sim="nyquist"] .nq-line[data-line="faint"] { stroke: var(--c1); stroke-width: 2; opacity: 0.55; }
[data-sim="nyquist"] .nq-line[data-line="ref"] { stroke: var(--c1); stroke-width: 2; stroke-dasharray: 8 7; }
[data-sim="nyquist"] .nq-line[data-line="recon"] { stroke: var(--c3); stroke-width: 4.5; }
[data-sim="nyquist"] .nq-stem { stroke: var(--c2); stroke-width: 2.5; }
[data-sim="nyquist"] .nq-dot { fill: var(--c2); stroke: var(--bg); stroke-width: 2; }
[data-sim="nyquist"] .nq-sym { font-style: italic; white-space: nowrap; }
/* The browser shrinks <sub> to "smaller" (13 px on a phone); the subscripts stay above the text floor. */
[data-sim="nyquist"] sub { font-size: 0.9em; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="nyquist"] .nq-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="nyquist"] .nq-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="nyquist"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="nyquist"] .nq { height: auto; grid-template-rows: none; gap: 0.8rem; padding: 0.6rem; }
  [data-sim="nyquist"] .nq-plot { flex: none; height: 10rem; }
  [data-sim="nyquist"] .nq-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="nyquist"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Teorem uzorkovanja i aliasing</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="nq-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var POINTS = 600;
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x, d) { var s = x.toFixed(d); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  // kHz with two decimals, three where the 25 Hz slider grid needs them (1,975 kHz, not 1,98).
  function khz(x) { return t('khz', { v: num(x, Math.round(x * 1000) % 10 === 0 ? 2 : 3) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  // f with a subscript s: a symbol, not a word.
  function fsSym() { return h('span', { class: 'nq-sym', translate: 'no' }, 'f', h('sub', null, 's')); }
  // t.parts puts a node placeholder in as the same node each time; a caption naming {fs} twice needs a copy.
  function once(parts) {
    var seen = [];
    return parts.map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }

  var labels = {
    oversampled: 'presetOversampled', above: 'presetAbove', 'just-above': 'presetJustAbove', boundary: 'presetBoundary',
    alias: 'presetAlias', 'slow-alias': 'presetSlowAlias', equal: 'presetEqual'
  };

  // ── the stage: three plots over the same 3 ms window ──
  function drawPlot(box, layers, xLabels) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 3 * rem, r: 0.6 * rem, t: 0.4 * rem, b: xLabels ? 1.5 * rem : 0.4 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var yMax = 1.3;
    var X = function (tm) { return pad.l + (tm / L.T_SHOW) * cw; };
    var Y = function (y) { return pad.t + ch * (1 - (y + yMax) / (2 * yMax)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'nq-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [-1, 1].forEach(function (v) { svg.append(s('line', { class: 'nq-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) })); });
    for (var k = 1; k < L.T_SHOW; k++) svg.append(s('line', { class: 'nq-grid', x1: X(k), x2: X(k), y1: pad.t, y2: pad.t + ch }));
    svg.append(s('line', { class: 'nq-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    [-1, 0, 1].forEach(function (v) {
      svg.append(s('text', { x: pad.l - 0.8 * rem, y: Y(v) + 0.35 * rem, 'text-anchor': 'end' }, v < 0 ? '−1' : String(v)));
    });
    if (xLabels) for (var m = 0; m <= L.T_SHOW; m++) {
      var anchor = m === 0 ? 'start' : m === L.T_SHOW ? 'end' : 'middle';
      svg.append(s('text', { x: X(m), y: H - 0.2 * rem, 'text-anchor': anchor }, t('ms', { v: m })));
    }
    var line = function (kind, pts) {
      return s('polyline', { class: 'nq-line', 'data-line': kind,
        points: pts.map(function (p) { return X(p.t).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ') });
    };
    layers.forEach(function (ly) {
      if (ly.kind === 'samples') {
        ly.pts.forEach(function (p) { svg.append(s('line', { class: 'nq-stem', x1: X(p.t), x2: X(p.t), y1: Y(0), y2: Y(p.y) })); });
        ly.pts.forEach(function (p) { svg.append(s('circle', { class: 'nq-dot', cx: X(p.t), cy: Y(p.y), r: 0.42 * rem })); });
      } else svg.append(line(ly.kind, ly.pts));
    });
    box.replaceChildren(svg);
  }

  function panel(label, note, extra) {
    var plot = h('div', { class: 'nq-plot' });
    return { plot: plot, el: h('div', { class: 'nq-panel' },
      h('div', { class: 'nq-head' }, h('span', { class: 'nq-label' }, label), note ? h('span', { class: 'nq-note' }, note) : null, extra || null),
      plot) };
  }

  function verdict(st) {
    var text = st.condition === 'ok' ? t('verdictOk') : st.condition === 'boundary' ? t('verdictBoundary') : t('verdictAlias', { f: khz(st.shown) });
    return h('span', { class: 'nq-verdict', dataset: { v: st.condition } }, text);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'fs', type: 'range', label: t('fs'), hint: t('fsHint'), min: L.FS_MIN, max: L.FS_MAX, step: L.FS_STEP,
        format: function (v) { return khz(v / 1000); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendSignal') },
      { c: 2, shape: 'round', label: t('legendSamples') },
      { c: 3, label: t('legendRecon') }
    ],

    render: function (c) {
      var st = c.state;
      var analog = L.curve(POINTS);
      var a = panel(t('panelOriginal'));
      var b = panel(t('panelSampled'), t('perPeriod', { v: num(st.perPeriod, 2) }));
      var r = panel(t('panelRecon'), t('panelReconRef'), verdict(st));
      c.stage.replaceChildren(h('div', { class: 'nq' }, a.el, b.el, r.el));
      drawPlot(a.plot, [{ kind: 'signal', pts: analog }], false);
      drawPlot(b.plot, [{ kind: 'faint', pts: analog }, { kind: 'samples', pts: st.samples }], false);
      drawPlot(r.plot, [{ kind: 'ref', pts: analog }, { kind: 'recon', pts: L.reconstruction(st.fs, POINTS) }], true);
    },

    caption: function (c) {
      var st = c.state;
      var v = h('b', null, khz(st.fs));
      if (st.condition === 'ok') return t.parts('captionOk', { fs: fsSym(), v: v });
      if (st.condition === 'boundary') return once(t.parts('captionBoundary', { fs: fsSym(), v: v }));
      if (st.shown < 1e-9) return once(t.parts('captionDc', { fs: fsSym(), v: v }));
      return once(t.parts('captionAlias', { fs: fsSym(), v: v, alias: h('b', null, khz(st.shown)) }));
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
