     beneath (a coin where an invoice is paid, a hatched bar where the service is used, each contract's balance on the

     strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var Lg = window.SimdeckModels.ledger;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVGNS = 'http://www.w3.org/2000/svg';
  var M = L.MONTHS, Y = L.YEAR;

  // ── numbers and months in the page's language ──

  /** A whole number with thousands grouped (12 000 / 12,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro. Minus is U+2212. */
  function money(x) {
    var r = Lg.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  var SHORT = t('monthsShort').split('|'), LONG = t('monthsLong').split('|'), LOC = t('monthsLoc').split('|');
  function cal(m, fy) { return L.calMonth(m, fy) - 1; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  var NAME = { support: 'iSupport', colo: 'iColo', link: 'iLink', late: 'iLate' };

  function sub(it, fy) {
    switch (it.id) {
      case 'support': return t('sSupport', { x: money(it.fee * Y), k: t.n('nMonths', Y) });
      case 'colo': return t('sColo', { fee: money(it.fee) });
      case 'link': return t('sLink', { fee: money(it.fee) });
      default: return t('sLate', { x: money(it.fee), last: LOC[cal(Y, fy)], first: LOC[cal(M, fy)] });
    }
  }

  // ── the chart ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step at or above x. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }
  function svg(tag, attrs) {
    var el = document.createElementNS(SVGNS, tag);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  function chart(s) {
    var n = s.n, lines = s.lines;
    var max = Math.max(lines.cash[M], lines.expense[M]) || 10000;   // nothing on: an empty but round scale
    var step = niceStep(max / 4);
    var top = Math.max(step, Math.ceil(max / step) * step);
    var X = function (k) { return 1000 * k / M; };
    var Yp = function (v) { return 1000 * (1 - v / top); };
    var pct = function (v) { return (100 * (1 - v / top)) + '%'; };
    var pts = function (arr, from, to, rev) {
      var d = '', ks = [];
      for (var k = from; k <= to; k++) ks.push(k);
      if (rev) ks.reverse();
      ks.forEach(function (k, i) { d += (i === 0 ? 'M' : 'L') + X(k).toFixed(2) + ' ' + Yp(arr[k]).toFixed(2); });
      return d;
    };

    var ticks = [], grid = [];
    for (var v = 0; v <= top + 1e-6; v += step) {
      ticks.push(h('span', { class: 'ac-tick', translate: 'no', style: { top: pct(v) } }, money(v)));
      if (v > 0) grid.push(h('div', { class: 'ac-gl', style: { top: pct(v) } }));
    }
    grid.push(h('div', { class: 'ac-ye', style: { left: (100 * Y / M) + '%' } }));

    var g = svg('svg', { class: 'ac-svg', viewBox: '0 0 1000 1000', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    if (n > 0) g.appendChild(svg('path', { class: 'ac-gap', d: pts(lines.cash, 0, n) + pts(lines.expense, 0, n, true).replace(/^M/, 'L') + 'Z' }));
    [['cash', '1'], ['expense', '2']].forEach(function (kc) {
      var k = kc[0];
      g.appendChild(svg('path', { class: 'ac-l ac-future', 'data-k': k, 'data-c': kc[1], d: pts(lines[k], 0, M) }));
      if (n > 0) g.appendChild(svg('path', { class: 'ac-l', 'data-k': k, 'data-c': kc[1], d: pts(lines[k], 0, n) }));
    });
    var left = (100 * n / M) + '%';
    var dots = [['cash', '1'], ['expense', '2']].map(function (kc) {
      return h('span', { class: 'ac-dot', dataset: { k: kc[0], c: kc[1] }, style: { left: left, top: pct(lines[kc[0]][n]) } });
    });

    var val = function (k, c, mark, label, value) {
      return h('div', { class: 'ac-val' },
        h('dt', null, h('span', { class: 'ac-mark', dataset: { k: k, c: c } }, mark), h('span', { class: 'ac-vlabel' }, label)),
        h('dd', { translate: 'no' }, value));
    };
    return [
      at(h('div', { class: 'ac-axis', 'aria-hidden': 'true' }, ticks), 1, 2, 1, 2),
      at(h('div', { class: 'ac-plot' }, grid, g, h('div', { class: 'ac-cursor', style: { left: left } }), dots), '2 / span 13', 2, '1 / -1', 2),
      at(h('dl', { class: 'ac-vals' },
        val('cash', '1', null, t('vCash'), money(s.cash)),
        val('expense', '2', null, t('vExpense'), money(s.expense)),
        val('prepaid', '3', '▲', t('vPrepaid'), money(s.prepaid)),
        val('accrued', '4', '▼', t('vAccrued'), money(s.accrued))), 15, 2, '1 / -1', 3)
    ];
  }

  // ── the contracts ──

  /** Grid position: column and row on the projector, then on a phone (CSS picks one set). */
  function at(el, c, r, pc, pr) {
    el.style.setProperty('--c', String(c));
    el.style.setProperty('--r', String(r));
    el.style.setProperty('--pc', String(pc));
    el.style.setProperty('--pr', String(pr));
    return el;
  }

  function when(m, n) { return m < n ? 'past' : m === n ? 'now' : 'future'; }

  function header(s) {
    var out = [at(h('div', { class: 'ac-head', dataset: { side: 'l' } }, t('colContract')), 1, 3, 1, 4)];
    for (var m = 1; m <= M; m++) {
      out.push(at(h('div', { class: 'ac-head', dataset: { m: String(m), when: when(m, s.n) } },
        h('span', { class: 'ac-mname' }, SHORT[cal(m, s.fy)]), h('span', { class: 'ac-mnum', translate: 'no' }, String(m))), m + 1, 3, m, 4));
    }
    out.push(at(h('div', { class: 'ac-head', dataset: { side: 'r' } }, t('colBalance')), 15, 3, 1, 4));
    return out;
  }

  function balance(it) {
    var k = it.bal > 0 ? 'prepaid' : it.bal < 0 ? 'accrued' : (it.paid === 0 && it.used === 0) ? 'waiting' : 'settled';
    var sign = { prepaid: '▲ ', accrued: '▼ ', settled: '= ', waiting: '' }[k];
    var word = { prepaid: 'bPrepaid', accrued: 'bAccrued', settled: 'bSettled', waiting: 'bWaiting' }[k];
    return h('div', { class: 'ac-bal', dataset: { k: k } },
      k === 'waiting' ? null : b(sign + money(Math.abs(it.bal))), h('span', null, t(word)));
  }

  function row(it, i, s) {
    var r = 4 + i, pr = 5 + 2 * i;
    var out = [at(h('div', { class: 'ac-label' }, h('span', { class: 'ac-name' }, t(NAME[it.id])), h('span', { class: 'ac-sub' }, sub(it, s.fy))), 1, r, '1 / span 8', pr)];
    for (var m = 1; m <= M; m++) {
      var w = when(m, s.n), kids = [];
      if (it.pay[m] > 0) {
        kids.push(h('span', { class: 'ac-coin' + (w === 'now' ? ' sd-changed' : ''), dataset: { c: '1' }, translate: 'no',
          'aria-label': money(it.pay[m]) }, h('span', { class: 'ac-coin-amt' }, group(it.pay[m]))));
      }
      if (it.use[m] > 0) {
        var attrs = { class: 'ac-use', dataset: { c: '2' } };
        if (!(it.use[m - 1] > 0)) attrs.dataset.start = '';
        if (!(it.use[m + 1] > 0)) attrs.dataset.end = '';
        kids.push(h('span', attrs));
      }
      out.push(at(h('div', { class: 'ac-cell', dataset: { m: String(m), when: w } }, kids), m + 1, r, m, pr + 1));
    }
    out.push(at(balance(it), 15, r, '9 / -1', pr));
    return out;
  }

  function render(c) {
    var s = c.state;
    var body = [
      at(h('div', { class: 'ac-year', dataset: { y: 'this' } }, t('yearThis')), '2 / span 12', 1, '1 / span 12', 1),
      at(h('div', { class: 'ac-year', dataset: { y: 'next' } },
        h('span', { class: 'ac-ylong' }, t('yearNext')), h('span', { class: 'ac-yshort', translate: 'no' }, '+1')), 14, 1, 13, 1)
    ].concat(chart(s), header(s));
    if (s.items.length === 0) body.push(at(h('p', { class: 'ac-empty' }, t('noContract')), '1 / -1', 4, '1 / -1', 5));
    s.items.forEach(function (it, i) { body = body.concat(row(it, i, s)); });
    c.stage.replaceChildren(h('div', { class: 'ac' },
      h('div', { class: 'ac-grid' }, body),
      h('p', { class: 'ac-foot' }, t('illustrative'))));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var it = s.items.filter(function (x) { return x.id === k.item; })[0];
    var month = s.n > 0 ? cap(LONG[cal(s.n, s.fy)]) : '';
    var vars = {
      month: h('b', null, month),
      item: it ? t(NAME[it.id]) : '',
      x: b(money(it ? it.payNow : s.cashNow)),
      now: b(money(it ? it.useNow : 0)),
      rest: b(money(it ? Math.abs(it.bal) : 0)),
      k: t.n('nMonths', it ? it.use.filter(function (u, m) { return u > 0 && m >= s.n; }).length : 0),
      q: b(L.quarterOf(s.n)),
      exp: b(money(s.expense)),
      cash: b(money(s.cash)),
      acc: b(money(s.accrued)),
      pre: b(money(s.prepaid))
    };
    if (s.n === M) vars.x = b(money(s.cashNow));
    if (s.n === Y) vars.cash = b(money(s.yearCash));
    var out = t.parts(k.lead, vars);
    if (k.gap) out.push(' ', t.parts(k.gap, vars));
    return out;
  }

  var labels = { 'year': 'prYear', 'prepaid': 'prPrepaid', 'arrears': 'prArrears', 'late': 'prLate', 'year-end': 'prYearEnd' };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'support', type: 'toggle', label: t('pSupport') },
      { key: 'colo', type: 'toggle', label: t('pColo') },
      { key: 'link', type: 'toggle', label: t('pLink') },
      { key: 'late', type: 'toggle', label: t('pLate') },
      { key: 'fy', type: 'select', label: t('fy'), hint: t('fyHint'),
        options: LONG.map(function (name, i) { return [i + 1, cap(name)]; }) }
    ],
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
      { shape: 'ac-lcash', c: 1, label: t('legCash') },
      { shape: 'ac-lexp', c: 2, label: t('legExpense') },
      { shape: 'ac-coin', c: 1, label: t('legPay') },
      { shape: 'ac-use', c: 2, label: t('legUse') },
      { shape: 'ac-now', label: t('legNow') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
