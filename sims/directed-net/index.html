<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // ── small helpers ──

  /** Data that is not language (letters, call signs): kept out of the word check. */
  function nt(x, cls) { return h('span', { translate: 'no', class: cls || null }, String(x)); }
  function station(Ln, id) { return Ln.stations.filter(function (x) { return x.id === id; })[0]; }
  /** "A, B, C, D i E" as one node: the letters are data, the joining word is language. */
  function listNode(ids) {
    var kids = [];
    ids.forEach(function (id, i) {
      if (i > 0) kids.push(i === ids.length - 1 ? t('listAnd') : ', ');
      kids.push(nt(id));
    });
    return h('span', null, kids);
  }
  function callNode(Ln, id) { return nt(station(Ln, id).call, 'dn-mono'); }
  function stNode(Ln, id) { return nt(id + ' (' + station(Ln, id).call + ')'); }
  function chips(ids, fresh) {
    if (!ids.length) return t('listNone');
    return ids.map(function (id) { return h('span', { class: 'dn-chip' + (fresh.indexOf(id) >= 0 ? ' sd-changed' : ''), translate: 'no' }, id); });
  }

  // ── stage parts ──

  function stats(Ln, prevL, n) {
    var k = Ln.counts, N = Ln.stations.length;
    var more = prevL && k.delivered > prevL.counts.delivered;
    function item(label, value, changed) {
      return h('div', null, h('dt', null, t(label)), h('dd', { class: changed ? 'sd-changed' : null }, value));
    }
    return h('dl', { class: 'dn-stats' },
      item('delivered', k.delivered + '/' + N, more),
      item('slotsUsed', String(Ln.done || n)),
      item('doubledSlots', String(k.doubled)),
      item('idleSlots', String(k.idle)));
  }

  function ncsCard(Ln, prevL) {
    var c = Ln.ncs, pc = prevL ? prevL.ncs : c;
    var done = Ln.stations.filter(function (x) { return x.deliveredAt !== null; })
      .sort(function (a, b) { return a.deliveredAt - b.deliveredAt; }).map(function (x) { return x.id; });
    var pdone = prevL ? prevL.stations.filter(function (x) { return x.deliveredAt !== null; }).map(function (x) { return x.id; }) : done;
    var fresh = function (now, before) { return now.filter(function (x) { return before.indexOf(x) < 0; }); };
    var called = c.calling ? [c.calling] : [], sent = c.ackDue ? [c.ackDue] : [];
    return h('div', { class: 'dn-box dn-ncs' },
      h('div', { class: 'dn-st-head' }, h('span', { class: 'dn-badge' }, t('ncsName')), h('span', { class: 'dn-k', 'data-wide': '' }, t('ncsRole'))),
      h('dl', { class: 'dn-list' },
        h('dt', null, t('listWaiting')), h('dd', null, chips(c.queue, [])),
        h('dt', null, t('listCalled')), h('dd', null, chips(called, fresh(called, pc.calling ? [pc.calling] : []))),
        h('dt', null, t('listSent')), h('dd', null, chips(sent, fresh(sent, pc.ackDue ? [pc.ackDue] : []))),
        h('dt', null, t('listDone')), h('dd', null, chips(done, fresh(done, pdone)))));
  }

  function stationCard(Ln, x, n) {
    var dir = Ln.mode === 'directed', ch = n ? Ln.channel[n - 1] : null, line;
    if (dir) {
      if (x.deliveredAt !== null) line = h('span', { class: 'dn-line dn-good' }, t('stAcked', { n: x.deliveredAt }));
      else if (Ln.ncs.calling === x.id) line = h('span', { class: 'dn-line' }, t('stCalled'));
      else if (Ln.ncs.ackDue === x.id) line = h('span', { class: 'dn-line' }, t('stSent'));
      else line = h('span', { class: 'dn-line dn-k' }, t('stWaitCall'));
    } else {
      if (x.deliveredAt !== null) line = h('span', { class: 'dn-line dn-good' }, t('stHeard', { n: x.deliveredAt }));
      else if (ch && ch.outcome === 'doubled' && ch.tx.indexOf(x.id) >= 0) line = h('span', { class: 'dn-line dn-bad' }, t('stDoubled', { k: x.nextTry }));
      else line = h('span', { class: 'dn-line' }, t('stNextTry', { k: Math.max(x.nextTry, n + 1) }));
    }
    var changed = n > 0 && (x.deliveredAt === n || (ch && ch.tx.indexOf(x.id) >= 0));
    return h('div', { class: 'dn-box dn-st' + (changed ? ' sd-changed' : ''), dataset: { v: x.deliveredAt !== null ? 'done' : 'wait' } },
      h('div', { class: 'dn-st-head' }, h('span', { class: 'dn-letter', translate: 'no' }, x.id), nt(x.call, 'dn-call')),
      h('div', { class: 'dn-tags', 'data-wide': '' },
        h('span', { class: 'dn-tag' }, t('priority')),
        dir ? null : h('span', { class: 'dn-tag', dataset: { k: 'bo' } }, t('backoffOf', { b: x.backoff }))),
      line);
  }

  /** One slot cell of the strip. */
  function cell(ch, dir) {
    if (!ch) return h('div', { class: 'dn-cell', dataset: { k: 'future' } });
    if (ch.outcome === 'idle') return h('div', { class: 'dn-cell', dataset: { k: 'idle' } }, h('span', null, '—'));
    if (ch.outcome === 'doubled') {
      return h('div', { class: 'dn-cell', dataset: { k: 'doubled' } }, h('b', null, '×'),
        h('span', { class: 'dn-who', translate: 'no' }, ch.tx.map(function (id) { return h('span', null, id); })));
    }
    var a = ch.acts[0];
    if (a.kind === 'msg') {
      return h('div', { class: 'dn-cell', dataset: { k: 'heard' } }, h('b', { translate: 'no' }, a.who),
        dir ? h('span', { 'data-wide': '' }, t('cellMsg')) : null);
    }
    var body = [h('b', null, t('ncsName'))];
    if (a.kind === 'open') body.push(h('span', { 'data-wide': '' }, t('cellOpen')));
    if (a.kind === 'call') body.push(h('span', { translate: 'no' }, '→ ' + a.target));
    if (a.ack) body.push(h('span', { class: 'dn-ack', translate: 'no' }, '✓ ' + a.ack));
    if (a.kind === 'close') body.push(h('span', { 'data-wide': '' }, t('cellClose')));
    return h('div', { class: 'dn-cell', dataset: { k: 'ncs' } }, body);
  }

  function strip(c, Ln) {
    var N = c.steps, n = c.n, cols = [];
    for (var i = 1; i <= N; i++) {
      var cl = cell(Ln.channel[i - 1] || null, Ln.mode === 'directed');
      if (i === n) cl.classList.add('sd-changed');
      if (i === n && c.dir === 'forward') cl.classList.add('sd-anim-in');
      cols.push(h('div', { class: 'dn-col', 'aria-label': t('slotLabel', { n: i }) },
        cl, h('div', { class: 'dn-num', dataset: { now: i === n ? '1' : '0' } }, String(i))));
    }
    return h('div', { class: 'dn-strip' },
      h('span', { class: 'dn-k' }, t('channel')),
      h('div', { class: 'dn-grid dn-cells', style: { '--n': String(N) }, dataset: { dense: N > 14 ? '1' : '0' } }, cols));
  }

  function lane(c, i) {
    var s = c.state, Ln = s.lanes[i], prevL = c.prev ? c.prev.lanes[i] : null, dir = Ln.mode === 'directed';
    var many = Ln.stations.length > 6;
    var cols = (dir ? 'minmax(0, ' + (Ln.stations.length > 5 ? 2.4 : 1.5) + 'fr) ' : '') + 'repeat(' + Ln.stations.length + ', minmax(0, 1fr))';
    return h('div', { class: 'dn-lane', dataset: { mode: Ln.mode, many: many ? '1' : '0' } },
      h('div', { class: 'dn-head' },
        h('b', { class: 'dn-lane-name' }, t(dir ? 'laneDirected' : 'laneFree')),
        h('span', { class: 'dn-k' }, t(dir ? 'ackExplicit' : 'ackImplicit')),
        stats(Ln, prevL, c.n)),
      h('div', { class: 'dn-row', style: { gridTemplateColumns: cols } },
        dir ? ncsCard(Ln, prevL) : null,
        Ln.stations.map(function (x) { return stationCard(Ln, x, c.n); })),
      strip(c, Ln));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, p = c.params, n = c.n, N = s.lanes[0].stations.length;
    if (c.first) {
      if (s.mode === 'both') return t('capBothStart');
      return s.mode === 'directed' ? t('capDirStart') : t('capFreeStart', { n: N });
    }
    var out = [t('capSlot', { n: n })];
    function add(key, vars) {
      out.push(' ');
      var seen = [];   // a node used twice gets its own copy (a node lives in one place)
      out.push.apply(out, t.parts(key, vars).map(function (x) {
        if (!(x instanceof Node)) return x;
        if (seen.indexOf(x) >= 0) return x.cloneNode(true);
        seen.push(x);
        return x;
      }));
    }
    function freeLine(Ln, short) {
      var ch = Ln.channel[n - 1];
      if (ch.outcome === 'doubled') {
        if (short) return add('shortDoubled', { list: listNode(ch.tx) });
        var first = !Ln.channel.slice(0, n - 1).some(function (x) { return x.outcome === 'doubled'; });
        var allTwo = ch.tx.every(function (id) { return station(Ln, id).backoff === 2; }) && p.backoff === 'same';
        return add(first ? 'capDoubledFirst' : allTwo ? 'capDoubledSame' : 'capDoubledAgain', { list: listNode(ch.tx) });
      }
      if (ch.outcome === 'heard') return add(short ? 'shortHeard' : 'capHeard', { st: short ? nt(ch.tx[0]) : stNode(Ln, ch.tx[0]) });
      if (short) return add(Ln.done && Ln.done < n ? 'shortDone' : 'shortIdle');
      add('capIdle');
    }
    function dirLine(Ln, short) {
      var ch = Ln.channel[n - 1];
      if (ch.outcome === 'idle') return add('shortDone');
      var a = ch.acts[0];
      if (a.kind === 'open') return add(short ? 'shortOpen' : 'capOpen');
      if (a.kind === 'msg') return add(short ? 'shortMsg' : 'capMsg', { st: nt(a.who) });
      if (a.kind === 'close') return add(short ? 'shortClose' : 'capClose', { ack: nt(a.ack) });
      if (short) return add(a.ack ? 'shortCallAck' : 'shortCall', { st: nt(a.target), ack: a.ack ? nt(a.ack) : '' });
      if (a.ack) return add('capCallAck', { ack: nt(a.ack), call: callNode(Ln, a.target) });
      add('capCall', { call: callNode(Ln, a.target) });
    }
    function failNote(Ln) { if (!Ln.done) add(p.backoff === 'same' ? 'capEndSame' : 'capEndPairs'); }

    if (s.mode === 'both') {
      out.push(' ', h('b', null, t('capLaneFree')));
      freeLine(s.lanes[0], true);
      out.push(' ', h('b', null, t('capLaneDir')));
      dirLine(s.lanes[1], true);
      if (c.last) {
        add('capEndBoth', { k: n, a: s.lanes[0].counts.delivered, b: s.lanes[1].counts.delivered, n: N });
        failNote(s.lanes[0]);
      }
      return out;
    }
    var Ln = s.lanes[0];
    if (Ln.mode === 'directed') {
      dirLine(Ln, false);
      if (c.last) add('capEndDir', { n: N, k: n });
    } else {
      freeLine(Ln, false);
      if (c.last) {
        if (Ln.done) add('capEndFreeAll', { n: N, k: n });
        else { add('capEndFree', { k: n, d: Ln.counts.delivered, n: N }); failNote(Ln); }
      }
    }
    return out;
  }

  // ── mount ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: [['free', t('modeFree')], ['directed', t('modeDirected')], ['both', t('modeBoth')]] },
      { key: 'stations', type: 'range', label: t('stations'), min: 3, max: 8 },
      { key: 'backoff', type: 'choice', label: t('backoff'), visible: function (p) { return p.mode !== 'directed'; },
        options: [['same', t('backoffSame')], ['mixed', t('backoffMixed')], ['spread', t('backoffSpread')]] }
    ],

    presets: [
      { id: 'everyone-waits-2', label: t('presetSame'), hint: t('presetSameHint'), params: {} },
      { id: 'mixed-backoff', label: t('presetMixed'), hint: t('presetMixedHint'), params: { backoff: 'mixed' } },
      { id: 'lucky', label: t('presetLucky'), hint: t('presetLuckyHint'), params: { backoff: 'spread' } },
      { id: 'directed', label: t('presetDirected'), hint: t('presetDirectedHint'), params: { mode: 'directed' } },
      { id: 'side-by-side', label: t('presetBoth'), hint: t('presetBothHint'), params: { mode: 'both' } }
    ],

    legend: [
      { shape: 'dn-heard', label: t('legendHeard') },
      { shape: 'dn-doubled', label: t('legendDoubled') },
      { shape: 'hollow', label: t('legendIdle') },
      { shape: 'dn-ncs', label: t('legendNcs') },
      { shape: 'dn-ack', label: t('legendAck') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'dn dn-lanes' + s.lanes.length },
        s.lanes.map(function (Ln, i) { return lane(c, i); })));
    },

    caption: caption
  });

  // the legend's symbol swatches (the kit draws empty swatches with data-shape; the page fills them)
  var fill = { 'dn-doubled': '×', 'dn-ack': '✓' };
  document.querySelectorAll('[data-sd-legend] .sd-swatch').forEach(function (sw) {
    var f = fill[sw.dataset.shape];
    if (f) sw.textContent = f;
  });
})();
</script>
</body>
</html>
