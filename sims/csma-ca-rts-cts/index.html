<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var COLOR = { A: '1', B: '3', C: '2' };
  var OTHER = { A: 'C', C: 'A' };
  function data(text) { return h('b', { translate: 'no' }, String(text)); }

  // grid placement: slot n is column n + 1 (column 1 holds the row labels)
  function at(row, n, span) { return { gridRow: String(row), gridColumn: (n + 1) + ' / span ' + (span || 1) }; }

  function frameEl(f, row, t0, fresh) {
    var len = Math.min(f.end, t0) - f.start + 1;
    var cls = 'cc-cell ' + (f.src === 'B' ? 'cc-reply sd-soft' : 'sd-fill' + (f.src === 'C' ? ' sd-hatch' : ''));
    if (f.ok === false && f.dst === 'B') cls += ' cc-lost';
    if (fresh) cls += ' sd-changed sd-anim-in';
    return h('div', { class: cls, style: at(row, f.start, len), dataset: { c: COLOR[f.src] }, translate: 'no' },
      h('span', null, f.kind + (f.ok === false && f.dst === 'B' && len > 1 ? ' ✕' : '')));
  }

  function stationStatus(x, s) {
    var st = s.sta[x];
    var slot = s.slots[s.t - 1];
    if (st.phase === 'done') return t('stDone');
    if (slot && slot.sends[x]) return t('stSend');
    if (st.phase === 'go') return t('stGo');
    if (st.phase === 'tx') return t('stTx');
    if (st.phase === 'await') return t('stAwait');
    if (st.nav > s.t) return t('stNav');
    var c = slot && slot.cells[x];
    if (c && (c.k === 'freeze' || c.k === 'wait')) return t('stFrozen');
    if (st.phase === 'backoff') return t('stCount');
    return t('stDifs');
  }

  function bStatus(s) {
    var slot = s.slots[s.t - 1];
    if (!slot) return t('stBQuiet');
    if (slot.sends.B) return t('stBSend');
    if (slot.garbled.B) return t('stBGarbage');
    return slot.heard.B.length ? t('stBHear') : t('stBQuiet');
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'rtscts', type: 'toggle', label: t('rtscts') },
      { key: 'hidden', type: 'toggle', label: t('hidden') },
      { key: 'threshold', type: 'range', label: t('threshold'), min: 0, max: 6, visible: function (p) { return p.rtscts; } },
      { key: 'seed', type: 'range', label: t('seed'), min: 1, max: 99 },
      { key: 'dataA', type: 'range', label: t('dataA'), min: 2, max: 6 },
      { key: 'dataC', type: 'range', label: t('dataC'), min: 2, max: 6 },
      { key: 'backoffA', type: 'range', label: t('backoffA'), min: 0, max: 15 },
      { key: 'backoffC', type: 'range', label: t('backoffC'), min: 0, max: 15 }
    ],

    presets: [
      { id: 'hidden-no-rts', label: t('presetHiddenNoRts'), hint: t('presetHiddenNoRtsHint'), params: {} },
      { id: 'hidden-rts', label: t('presetHiddenRts'), hint: t('presetHiddenRtsHint'), params: { rtscts: true, backoffC: 5 } },
      { id: 'not-hidden', label: t('presetNotHidden'), hint: t('presetNotHiddenHint'), params: { hidden: false, backoffA: 3, backoffC: 5 } },
      { id: 'rts-collision', label: t('presetRtsCollision'), hint: t('presetRtsCollisionHint'), params: { rtscts: true } },
      { id: 'threshold', label: t('presetThreshold'), hint: t('presetThresholdHint'), params: { rtscts: true, threshold: 3, dataA: 2, dataC: 5, backoffC: 5 } }
    ],

    legend: [
      { c: 1, label: t('legendA') },
      { c: 2, shape: 'hatch', label: t('legendC') },
      { c: 3, shape: 'round', label: t('legendB') },
      { shape: 'cross', label: t('legendGarbage') },
      { shape: 'nav', label: t('legendNav') },
      { shape: 'frozen', label: t('legendFrozen') }
    ],

    render: function (c) {
      var s = c.state, p = c.params, fwd = c.dir === 'forward' && !c.first;
      var slot = s.slots[s.t - 1] || null;
      var prevSta = c.prev ? c.prev.sta : null;

      function node(x) {
        var f = slot && slot.sends[x];
        var garbage = x === 'B' && slot && slot.garbled.B;
        var badges = [];
        if (x !== 'B') {
          var st = s.sta[x];
          var ch = function (k) { return fwd && prevSta && prevSta[x][k] !== st[k] ? ' sd-changed' : ''; };
          if (st.phase !== 'done') {
            badges.push(h('span', { class: 'cc-chip' + ch('bo') }, t('counter'), ' ', data(st.bo)));
            badges.push(h('span', { class: 'cc-chip' + ch('cw') }, h('b', { translate: 'no' }, 'CW'), ' ', data(st.cw)));
            if (st.k > 1) badges.push(h('span', { class: 'cc-chip' + ch('k') }, t('attempt', { k: st.k })));
          }
          if (st.nav > s.t) badges.push(h('span', { class: 'cc-chip cc-navchip' + ch('nav') }, t('navUntil', { until: st.nav })));
        } else if (f) {
          badges.push(h('span', { class: 'cc-chip sd-soft', dataset: { c: COLOR.B } }, data(f.kind)));
        } else if (garbage) {
          badges.push(h('span', { class: 'cc-chip cc-cell cc-garbage', 'aria-hidden': 'true' }, '✕'));
        }
        return h('div', { class: 'cc-node' },
          h('div', { class: 'cc-dot' + (f ? ' cc-on' : '') + (garbage ? ' cc-x' : ''), dataset: { c: COLOR[x] }, translate: 'no' }, x),
          h('div', { class: 'cc-role' }, x === 'B' ? h('em', null, t('ap')) : t('station')),
          h('div', { class: 'cc-status' }, x === 'B' ? bStatus(s) : stationStatus(x, s)),
          h('div', { class: 'cc-badges' }, badges));
      }
      var topo = h('div', { class: 'cc-topo' },
        h('div', { class: 'cc-range cc-ra' + (p.hidden ? '' : ' cc-wide'), dataset: { c: COLOR.A }, 'aria-hidden': 'true' }),
        h('div', { class: 'cc-range cc-rc' + (p.hidden ? '' : ' cc-wide'), dataset: { c: COLOR.C }, 'aria-hidden': 'true' }),
        node('A'), node('B'), node('C'),
        h('div', { class: 'cc-span' + (p.hidden ? ' cc-out' : '') }, p.hidden ? t('outRange') : t('inRange')));

      // timeline
      var total = Math.max(s.total, 12);
      var cells = [h('div', { class: 'cc-rowlabel', style: { gridRow: '1', gridColumn: '1' } }, t('slot'))];
      for (var i = 1; i <= total; i++) {
        var nowTick = i > s.from && i <= s.t;
        cells.push(h('div', { class: 'cc-tick' + (nowTick ? ' cc-now' : '') + (i === s.t || (i === 1 && s.t > 3) ? ' cc-mark' : ''), style: at(1, i), translate: 'no' },
          h('span', null, String(i))));
      }
      var rows = { A: 2, B: 3, C: 4 };
      ['A', 'B', 'C'].forEach(function (x) {
        var r = rows[x];
        cells.push(h('div', { class: 'cc-rowlabel', style: { gridRow: String(r), gridColumn: '1' }, translate: 'no' }, x));
        var covered = {};
        s.frames.filter(function (f) { return f.src === x; }).forEach(function (f) {
          for (var k = f.start; k <= Math.min(f.end, s.t); k++) covered[k] = true;
          cells.push(frameEl(f, r, s.t, fwd && f.start > s.from));
        });
        if (x !== 'B') {
          // NAV runs as one dotted bar each
          var n = 1;
          while (n <= s.t) {
            if (!covered[n] && s.slots[n - 1].cells[x] && s.slots[n - 1].cells[x].nav) {
              var m = n;
              while (m + 1 <= s.t && !covered[m + 1] && s.slots[m].cells[x] && s.slots[m].cells[x].nav) m++;
              cells.push(h('div', { class: 'cc-cell cc-nav', style: at(r, n, m - n + 1), translate: 'no' }, h('span', null, 'NAV')));
              for (var k = n; k <= m; k++) covered[k] = true;
              n = m + 1;
            } else n++;
          }
        }
        for (var j = 1; j <= total; j++) {
          if (covered[j]) continue;
          if (j > s.t) { cells.push(h('div', { class: 'cc-cell cc-future', style: at(r, j) })); continue; }
          var cell = x === 'B' ? null : s.slots[j - 1].cells[x];
          var k2 = cell ? cell.k : 'none';
          if (k2 === 'difs') cells.push(h('div', { class: 'cc-cell cc-difs', style: at(r, j), translate: 'no' }, h('span', null, 'DIFS')));
          else if (k2 === 'count') cells.push(h('div', { class: 'cc-cell cc-count', style: at(r, j), translate: 'no' }, h('span', null, String(cell.bo))));
          else if (k2 === 'freeze' || k2 === 'wait') cells.push(h('div', { class: 'cc-cell cc-frozen', style: at(r, j), translate: 'no' }, h('span', null, '‖' + cell.bo)));
          else if (k2 === 'await' || k2 === 'tx') cells.push(h('div', { class: 'cc-cell cc-quiet', style: at(r, j), 'aria-hidden': 'true' }, h('span', null, '…')));
          else if ((k2 === 'done' || k2 === 'navdone') && s.sta[x].delivered === j) cells.push(h('div', { class: 'cc-cell cc-quiet', style: at(r, j), 'aria-hidden': 'true' }, h('span', null, '✓')));
          else cells.push(h('div', { class: 'cc-cell cc-none', style: at(r, j) }));
        }
      });
      cells.push(h('div', { class: 'cc-rowlabel', style: { gridRow: '5', gridColumn: '1' } }, t('rowAtB')));
      for (i = 1; i <= total; i++) {
        var sl = s.slots[i - 1];
        if (i > s.t || !sl) cells.push(h('div', { class: 'cc-cell cc-future', style: at(5, i) }));
        else if (sl.sends.B) cells.push(h('div', { class: 'cc-cell cc-quiet', style: at(5, i), 'aria-hidden': 'true' }, h('span', null, '—')));
        else if (sl.garbled.B) cells.push(h('div', { class: 'cc-cell cc-garbage' + (fwd && i > s.from ? ' sd-anim-in' : ''), style: at(5, i), 'aria-hidden': 'true' }, h('span', null, '✕')));
        else if (sl.heard.B.length) {
          var from = sl.heard.B[0];
          cells.push(h('div', { class: 'cc-cell sd-soft' + (from === 'C' ? ' sd-hatch' : ''), style: at(5, i), dataset: { c: COLOR[from] }, translate: 'no' }, h('span', null, from)));
        } else cells.push(h('div', { class: 'cc-cell cc-none', style: at(5, i) }));
      }

      function delivered(x) { var d = s.sta[x].delivered; return x + (d ? ' ✓ ' + d + '.' : ' –'); }
      var facts = h('div', { class: 'cc-facts' },
        h('div', { class: 'cc-box' }, t('factSlots'), data(s.t + ' / ' + s.total)),
        h('div', { class: 'cc-box' }, t('factDelivered'), data(delivered('A')), data(delivered('C'))),
        h('div', { class: 'cc-box' + (s.lostSlots ? ' cc-bad' : '') }, t('factGarbage'), data(s.lostSlots)));

      c.stage.replaceChildren(h('div', { class: 'cc' }, topo,
        h('div', { class: 'cc-time', style: { '--slots': String(total) } }, cells), facts));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      if (s.step === 0) {
        var rtsState = !p.rtscts ? t('rtsOff') : p.threshold > 0 ? t('rtsThreshold', { th: p.threshold }) : t('rtsOn');
        return t.parts('captionStart', { hearing: t(p.hidden ? 'startHidden' : 'startHear'), rtsState: rtsState, a: data(p.backoffA), c: data(p.backoffC) });
      }
      var out = [];
      function add(key, vars) { if (out.length) out.push(' '); out = out.concat(t.parts(key, vars || {})); }
      var said = {};
      s.events.forEach(function (e) {
        if (e.e === 'difs') {
          if (e.resume) add('evResume', { who: data(e.who), bo: data(e.bo) });
          else if (e.n === 1 && !said.first) {
            said.first = true;
            var firsts = s.events.filter(function (x) { return x.e === 'difs' && x.n === 1; });
            if (firsts.length > 1) add('evFirst');
            else add('evDifsStart', { who: data(e.who), bo: data(e.bo) });
          }
        } else if (e.e === 'zero') {
          if (e.after === 'difs') add('evZeroDifs', { who: data(e.who) });
        } else if (e.e === 'start') {
          var same = s.events.filter(function (x) { return x.e === 'start' && x.n === e.n; });
          if (same.length > 1) {
            if (!said['both' + e.n]) {
              said['both' + e.n] = true;
              var kindOf = function (w) { return same.filter(function (x) { return x.who === w; })[0].kind; };
              add('evStartBoth', { ka: data(kindOf('A')), kc: data(kindOf('C')) });
            }
          } else if (e.kind === 'RTS') add('evStartRts', { who: data(e.who), dur: data(e.dur) });
          else add('evStart', { who: data(e.who), kind: data(e.kind), k: data(e.k) });
          if (e.kind === 'DATA' && p.rtscts) add('evNoRts', { who: data(e.who) });
        } else if (e.e === 'unheard') {
          add('evUnheard', { who: data(e.who), other: data(e.other) });
        } else if (e.e === 'collide') {
          add('evCollide');
        } else if (e.e === 'reply') {
          if (e.kind === 'CTS') add('evReplyCts', { dur: data(e.dur) });
          else if (e.kind === 'DATA') add('evReplyData', { who: data(e.who) });
          else add('evReplyAck', { owner: data(e.owner) });
        } else if (e.e === 'nav') {
          if (e.kind === 'CTS' && !L.hears(p, e.who, e.owner)) add('evNavHidden', { who: data(e.who), who2: data(e.who), other: data(e.owner), dur: data(e.dur), until: data(e.until) });
          else add('evNav', { who: data(e.who), kind: data(e.kind), from: data(e.from), until: data(e.until) });
        } else if (e.e === 'freeze') {
          add('evFreeze', { who: data(e.who), bo: data(e.bo) });
        } else if (e.e === 'timeout') {
          add('evTimeout', { who: data(e.who), kind: data(e.kind), cw: data(e.cw), bo: data(e.bo) });
        } else if (e.e === 'delivered') {
          add('evDelivered', { who: data(e.who) });
        }
      });
      if (!out.length) add('evQuiet');
      if (s.last) {
        if (s.finished) add('captionEnd', { n: data(s.t), lost: t.n('slots', s.lostSlots) });
        else add('captionCut', { n: data(s.t) });
      }
      return out;
    }
  });
})();
</script>
