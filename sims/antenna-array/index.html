<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var CP = L.CP, AF = L.AF;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var D2R = Math.PI / 180;
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function deg(v) { return t('degVal', { v: num(v, Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1) }); }
  function lam(v) { return t('dVal', { v: num(v, 2) }); }                 // as the slider shows it
  function dbv(v) { return t('dbVal', { v: num(v, v !== 0 && Math.abs(v) < 0.05 ? 2 : 1) }); }   // −0.01 dB, not 0.0
  function degList(list) {                                                // angles in a list, all to one decimal
    return list.slice().sort(function (a, b) { return a - b; }).map(function (a) { return t('degVal', { v: num(a, 1) }); }).join(', ');
  }
  function dbi(v) { return t('dbi', { v: num(v, 2) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function rgbOf(name) {
    var v = (Simdeck.cssVar(name) || '').trim(), m = /^#([0-9a-f]{6})$/i.exec(v);
    if (m) return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
    var c = document.createElement('canvas'); c.width = c.height = 1;
    var g = c.getContext('2d'); g.fillStyle = v || '#808080'; g.fillRect(0, 0, 1, 1);
    var d = g.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  // ── the wave map: the far-field term of each element, summed, seen from above. Complex amplitudes are cached per
  //    geometry; each frame takes the real part at ωt. Brightness is evened out with distance (SPEC §5). ──
  var cache = { key: '', re: null, im: null };
  function halfWidth(p) { return Math.max(3, (p.n - 1) * p.d / 2 + 2.5); }
  function field(p, res, half) {
    var key = [p.n, p.d, p.lag, res, half].join('|');
    if (cache.key === key) return cache;
    var re = new Float32Array(res * res), im = new Float32Array(res * res), k = 2 * Math.PI, a = 0.5;
    var xs = [], ph = [];
    for (var m = 0; m < p.n; m++) { xs.push((m - (p.n - 1) / 2) * p.d); ph.push(-m * p.lag * D2R); }
    for (var j = 0; j < res; j++) {
      var y = half - (j + 0.5) / res * 2 * half;
      for (var i = 0; i < res; i++) {
        var x = (i + 0.5) / res * 2 * half - half, sr = 0, si = 0;
        for (m = 0; m < p.n; m++) {
          var dx = x - xs[m], r = Math.sqrt(dx * dx + y * y), w = 1 / Math.sqrt(r + a), q = ph[m] - k * r;
          sr += w * Math.cos(q); si += w * Math.sin(q);
        }
        var g = Math.sqrt(Math.sqrt(x * x + y * y) + a) / p.n;
        re[j * res + i] = sr * g; im[j * res + i] = si * g;
      }
    }
    cache = { key: key, re: re, im: im };
    return cache;
  }

  function drawMap(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, top = 1.8 * r0;
    var S = Math.max(40, Math.min(W, H - top)), ox = (W - S) / 2, oy = top + (H - top - S) / 2;
    var half = halfWidth(p), ppl = S / (2 * half);
    var res = Math.max(60, Math.min(320, Math.round(S / 2)));
    var f = field(p, res, half);
    var cv = document.createElement('canvas');
    cv.width = res; cv.height = res;
    cv.style.left = ox + 'px'; cv.style.top = oy + 'px'; cv.style.width = S + 'px'; cv.style.height = S + 'px';
    var g = cv.getContext('2d'), img = g.createImageData(res, res), data = img.data;
    // diverging: + towards --c1, − towards --c5, 0 (cancelled) is the background; in grayscale both crests darken and
    // a null stays blank
    var bg = rgbOf('--bg'), pos = rgbOf('--c1'), neg = rgbOf('--c5'), wt = p.t * D2R, c = Math.cos(wt), sn = Math.sin(wt);
    for (var i = 0; i < res * res; i++) {
      var v = Math.max(-1, Math.min(1, f.re[i] * c - f.im[i] * sn)), fg = v >= 0 ? pos : neg, u = Math.pow(Math.abs(v), 0.75);
      data[4 * i] = bg[0] + (fg[0] - bg[0]) * u;
      data[4 * i + 1] = bg[1] + (fg[1] - bg[1]) * u;
      data[4 * i + 2] = bg[2] + (fg[2] - bg[2]) * u;
      data[4 * i + 3] = 255;
    }
    g.putImageData(img, 0, 0);

    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'aa-title', x: 0.2 * r0, y: 1.2 * r0 }, t('mapTitle')));
    var cx = ox + S / 2, cy = oy + S / 2;
    svg.append(s('rect', { class: 'aa-frame', x: ox, y: oy, width: S, height: S }));
    // the beams from the centre: the main one solid, grating lobes dotted (both sides of the line)
    function ray(phi, cls) {
      [phi, -phi].forEach(function (a) {
        var ux = Math.cos(a * D2R), uy = -Math.sin(a * D2R);
        var L2 = Math.min(Math.abs(ux) > 1e-9 ? (S / 2) / Math.abs(ux) : Infinity, Math.abs(uy) > 1e-9 ? (S / 2) / Math.abs(uy) : Infinity);
        // a short mark at the frame's edge, so the line does not hide the beam it points at
        var x1 = cx + ux * (L2 - 2.2 * r0), y1 = cy + uy * (L2 - 2.2 * r0), x2 = cx + ux * L2, y2 = cy + uy * L2;
        if (cls === 'aa-main') svg.append(s('line', { class: 'aa-mainHalo', x1: x1, y1: y1, x2: x2, y2: y2 }));
        svg.append(s('line', { class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }));
      });
    }
    if (!st.single) {
      (st.gratingAt || []).forEach(function (a) { ray(a, 'aa-grat'); });
      ray(st.main, 'aa-main');
    }
    // the elements, numbered when there is room
    var room = p.d * ppl >= 1.5 * r0;
    for (var m = 0; m < p.n; m++) {
      var ex = cx + (m - (p.n - 1) / 2) * p.d * ppl;
      svg.append(s('circle', { class: 'aa-el', cx: ex, cy: cy, r: Math.max(4, Math.min(0.32 * r0, p.d * ppl * 0.4 || 0.32 * r0)) }));
      if (room || p.n === 1) svg.append(s('text', { class: 'aa-halo', x: ex, y: cy + 1.5 * r0, 'text-anchor': 'middle' }, String(m + 1)));
    }
    // the scale: one wavelength
    var sx = ox + S - ppl - 0.3 * r0, sy = 1.0 * r0;            // above the map's top right corner, clear of every ray
    svg.append(s('line', { class: 'aa-scaleHalo', x1: sx, y1: sy, x2: sx + ppl, y2: sy }));
    svg.append(s('line', { class: 'aa-scale', x1: sx, y1: sy, x2: sx + ppl, y2: sy }));
    svg.append(s('text', { class: 'aa-halo', x: sx - 0.4 * r0, y: sy + 0.35 * r0, 'text-anchor': 'end' }, t('mapScale')));
    box.replaceChildren(cv, svg);
  }

  // ── the feeds: one dial per element, its current's phasor now (ωt − m·lag), and how much it lags element 1 ──
  function drawFeeds(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'aa-mute', x: 0.2 * r0, y: 1.1 * r0 }, t('feedTitle')));
    var R = Math.min(1.05 * r0, (H - 3.4 * r0) / 2), step = W / p.n, cy = 1.7 * r0 + R;
    for (var m = 0; m < p.n; m++) {
      var cx = step * (m + 0.5), a = (p.t - m * p.lag) * D2R;
      svg.append(s('circle', { class: 'aa-dial', cx: cx, cy: cy, r: R }));
      svg.append(s('line', { class: 'aa-hand', x1: cx, y1: cy, x2: cx + 0.82 * R * Math.cos(a), y2: cy - 0.82 * R * Math.sin(a) }));
      svg.append(s('circle', { class: 'aa-hub', cx: cx, cy: cy, r: 0.12 * R + 1 }));
      svg.append(s('text', { class: 'aa-mono', x: cx, y: cy + R + 1.1 * r0, 'text-anchor': 'middle' }, t('degVal', { v: num(m * p.lag, 0) })));
    }
    box.replaceChildren(svg);
  }

  // ── the far field in the horizontal plane, as field strength over one dipole fed the same power ──
  function drawPolar(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'aa-title', x: 0.2 * r0, y: 1.2 * r0 }, t('polarTitle')));
    var top = 2.0 * r0, cx = W / 2, cy = top + (H - top) / 2;
    var R = Math.max(10, Math.min(W / 2 - 2.6 * r0, (H - top) / 2 - 1.4 * r0));
    function P(a, rr) { return [cx + rr * R * Math.cos(a * D2R), cy - rr * R * Math.sin(a * D2R)]; }
    var k = st.fieldRatio / st.mainAf / st.top;          // AF → radius
    function rad(a) { return st.single ? 1 / st.top : AF.arrayFactor(p.n, p.d, p.lag, Math.cos(a * D2R)) * k; }
    svg.append(s('circle', { class: 'aa-ring', cx: cx, cy: cy, r: R }));
    [0, 30, 60, 90, 120, 150].forEach(function (a) {
      var p1 = P(a, 1), p2 = P(a + 180, 1);
      svg.append(s('line', { class: 'aa-spoke', x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }));
    });
    var lr = P(250, 1);
    svg.append(s('text', { class: 'aa-halo aa-mute', x: lr[0], y: lr[1] + 1.2 * r0, 'text-anchor': 'middle' }, t('ringX', { v: num(st.top, 1).replace(/[.,]0$/, '') })));
    // the line of elements, along 0° … 180°
    var e1 = P(0, 1), e2 = P(180, 1);
    svg.append(s('line', { class: 'aa-axis', x1: e1[0], y1: e1[1], x2: e2[0], y2: e2[1] }));
    function near(a) { return !st.single && Math.abs(st.main - a) < 12; }   // the main beam's own label sits there
    if (!near(0)) svg.append(s('text', { class: 'aa-halo aa-mute', x: e1[0] + 0.3 * r0, y: e1[1] - 0.4 * r0, 'text-anchor': 'start' }, '0°'));
    if (!near(180)) svg.append(s('text', { class: 'aa-halo aa-mute', x: e2[0] - 0.3 * r0, y: e2[1] - 0.4 * r0, 'text-anchor': 'end' }, '180°'));
    var u90 = P(90, 1);
    if (!near(90)) svg.append(s('text', { class: 'aa-halo aa-mute', x: u90[0] + 0.3 * r0, y: u90[1] - 0.3 * r0 }, '90°'));
    // one dipole, the same power: a circle
    svg.append(s('circle', { class: 'aa-dip', cx: cx, cy: cy, r: R / st.top }));
    var curve = [];
    for (var a = 0; a <= 360; a += 0.25) curve.push(P(a, rad(a)));
    svg.append(s('polygon', { class: 'aa-pat', points: pts(curve) }));
    if (!st.single) {
      // half-power lines of the main lobe (and its mirror), the main beam, grating lobes, the strongest side lobe
      if (st.hp) {
        [[st.main + st.hp[0], 1], [st.main - st.hp[1], 1]].forEach(function (q) {
          [q[0], -q[0]].forEach(function (b) {
            var e = P(b, 1.03);
            svg.append(s('line', { class: 'aa-hp', x1: cx, y1: cy, x2: e[0], y2: e[1] }));
          });
        });
      }
      [st.main, -st.main].forEach(function (b, i) {
        var e = P(b, 1);
        svg.append(s('line', { class: 'aa-main', x1: cx, y1: cy, x2: e[0], y2: e[1] }));
        if (i === 0 || Math.abs(Math.sin(st.main * D2R)) > 1e-6) {
          var lq = P(b, 1.0);
          var anc = Math.cos(b * D2R) > 0.3 ? 'start' : Math.cos(b * D2R) < -0.3 ? 'end' : 'middle';
          var dy = Math.sin(b * D2R) > 0.3 ? -0.5 * r0 : Math.sin(b * D2R) < -0.3 ? 1.3 * r0 : -0.5 * r0;
          if (i === 0) svg.append(s('text', { class: 'aa-halo aa-title', x: lq[0] + (anc === 'start' ? 0.4 : anc === 'end' ? -0.4 : 0) * r0, y: lq[1] + dy, 'text-anchor': anc }, deg(st.main)));
        }
      });
      (st.gratingAt || []).forEach(function (b) {
        [b, -b].forEach(function (c) {
          var e = P(c, rad(c));
          svg.append(s('rect', { class: 'aa-gmark', x: e[0] - 0.3 * r0, y: e[1] - 0.3 * r0, width: 0.6 * r0, height: 0.6 * r0, transform: 'rotate(45 ' + e[0] + ' ' + e[1] + ')' }));
        });
      });
      if (st.side) {
        var sr = rad(st.side.at);
        if (sr > 0.3) {                         // clear of the centre; the table always has it
          var sq = P(st.side.at, sr);
          svg.append(s('circle', { class: 'aa-mark', cx: sq[0], cy: sq[1], r: 0.25 * r0 }));
          svg.append(s('text', { class: 'aa-halo', x: sq[0] + 0.4 * r0, y: sq[1] - 0.4 * r0 }, dbv(st.side.db)));
        }
      }
    }
    box.replaceChildren(svg);
  }

  // ── the vertical plane through the main beam: the dipole × the array factor = the array (relative field) ──
  function drawVert(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'aa-title', x: 0.2 * r0, y: 1.2 * r0 }, t('vertTitle')));
    svg.append(s('text', { class: 'aa-mute', x: 0.2 * r0, y: 2.3 * r0 }, t('vertSub')));
    var top = 2.8 * r0, cx = W / 2, cy = top + (H - top) / 2;
    var R = Math.max(10, Math.min(W / 2 - 3.2 * r0, (H - top) / 2 - 1.0 * r0));
    function P(a, rr) { return [cx + rr * R * Math.cos(a * D2R), cy - rr * R * Math.sin(a * D2R)]; }
    var az = st.single ? 90 : st.main, ca = Math.cos(az * D2R);
    function el(a) { return CP.elementFactor(0.5, Math.sin(a * D2R)); }
    function af(a) { return st.single ? 1 : AF.arrayFactor(p.n, p.d, p.lag, Math.cos(a * D2R) * ca) / p.n; }
    svg.append(s('circle', { class: 'aa-ring', cx: cx, cy: cy, r: R }));
    var h1 = P(0, 1), h2 = P(180, 1), v1 = P(90, 1), v2 = P(270, 1);
    svg.append(s('line', { class: 'aa-spoke', x1: h1[0], y1: h1[1], x2: h2[0], y2: h2[1] }));
    svg.append(s('line', { class: 'aa-spoke', x1: v1[0], y1: v1[1], x2: v2[0], y2: v2[1] }));
    function curve(fn) { var out = []; for (var a = 0; a <= 360; a += 0.5) out.push(P(a, Math.min(1, Math.abs(fn(a))))); return out; }
    svg.append(s('polygon', { class: 'aa-af', points: pts(curve(af)) }));
    svg.append(s('polygon', { class: 'aa-dip', points: pts(curve(el)) }));
    svg.append(s('polygon', { class: 'aa-pat', points: pts(curve(function (a) { return el(a) * af(a); })) }));
    if (!st.single) {                         // one element has no beam to face
      svg.append(s('text', { class: 'aa-halo aa-mute', x: h1[0] + 0.3 * r0, y: h1[1] + 1.3 * r0, 'text-anchor': 'end' }, t('front')));
      svg.append(s('text', { class: 'aa-halo aa-mute', x: h2[0] - 0.3 * r0, y: h2[1] + 1.3 * r0, 'text-anchor': 'start' }, t('backDir')));
    }
    svg.append(s('text', { class: 'aa-halo aa-mute', x: v1[0] + 0.4 * r0, y: v1[1] + 0.9 * r0 }, t('up')));
    svg.append(s('line', { class: 'aa-axis', x1: cx, y1: cy - 0.9 * r0, x2: cx, y2: cy + 0.9 * r0 }));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'aa-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var mainTxt = st.single ? t('mainAll') : st.over ? t('mainOver', { v: deg(st.main), db: dbv(st.mainDb) }) : deg(st.main);
    var gr = st.gratingAt ? t('gratingSome', { k: String(st.grating), list: degList(st.gratingAt) }) : t('gratingNone');
    var fb = st.single ? t('none') : st.kind === 'broadside' ? t('fbBoth') : st.backNull ? t('fbNull') : dbv(-st.backDb);
    return h('table', { class: 'aa-table' }, h('tbody', null,
      row(t('rowMain'), mainTxt, true),
      row(t('rowBw'), st.bw === null ? t('bwAll') : deg(st.bw)),
      row(t('rowGrating'), st.single ? t('none') : gr),
      row(t('rowSide'), st.side ? dbv(st.side.db) : t('none')),
      row(t('rowFb'), fb),
      row(t('rowD'), dbi(st.dbi), true),
      row(t('rowOver'), t('overCell', { v: num(st.overDipole, 2) }))));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  var many = function (p) { return p.n > 1; };   // one element: spacing and phase change nothing (SPEC tie-break 3)
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'n', type: 'range', label: t('n'), min: 1, max: 8, step: 1, format: function (v) { return t('nVal', { v: num(v, 0) }); } },
      { key: 'd', type: 'range', label: t('d'), min: 0.05, max: 2, step: 0.05, visible: many, format: function (v) { return t('dVal', { v: num(v, 2) }); } },
      { key: 'lag', type: 'range', label: t('lag'), min: -180, max: 180, step: 5, visible: many, format: function (v) { return t('degVal', { v: num(v, 0) }); } },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'aa-wave', label: t('legendWave') },
      { shape: 'aa-pat', label: t('legendArray') },
      { shape: 'aa-dip', label: t('legendDipole') },
      { shape: 'aa-af', label: t('legendAf') },
      { shape: 'aa-main', label: t('legendMain') },
      { shape: 'aa-grat', label: t('legendGrating') }
    ],

    render: function (c) {
      var mp = h('div', { class: 'aa-pic' }), fd = h('div', { class: 'aa-feed' }), pp = h('div', { class: 'aa-pic' }), vp = h('div', { class: 'aa-vert' });
      c.stage.replaceChildren(h('div', { class: 'aa' },
        h('div', { class: 'aa-col' }, mp, fd),
        h('div', { class: 'aa-col' }, pp),
        h('div', { class: 'aa-col' }, table(c.state), h('p', { class: 'aa-units' }, t('units')), vp)));
      drawMap(mp, c.state);
      drawFeeds(fd, c.state);
      drawPolar(pp, c.state);
      drawVert(vp, c.state);
    },

    caption: function (c) {
      var st = c.state, p = st.p, parts = [];
      var b = function (x) { return h('b', null, x); };
      // the back (φ0 + 180°, which is 180° − φ0 in the half-plane): a full-size lobe there is a twin or a grating lobe
      var backAt = st.single ? null : 180 - st.main;
      var backFull = !st.over && (st.gratingAt || []).some(function (a) { return Math.abs(a - backAt) < 1e-6; });
      var rest = (st.gratingAt || []).filter(function (a) { return !(backFull && Math.abs(a - backAt) < 1e-6); });
      function mk() { return {   // fresh nodes for each sentence: a node can sit in one place only
        lag: b(deg(Math.abs(p.lag))), main: b(deg(st.main === null ? 0 : st.main)), path: b(lam(Math.abs(st.pathDiff || 0))),
        mirror: b(deg(st.main === null ? 0 : -st.main)), n: b(String(p.n)),
        span: b(t('degVal', { v: num(360 * p.d, 0) })), db: b(dbv(-st.mainDb)), fb: b(dbv(st.backDb === null ? 0 : -st.backDb)),
        d: b(lam(p.d)), k: b(t.n('gratingCount', rest.length)), list: b(degList(rest)),
        side: b(st.side ? dbv(st.side.db) : ''), bw: b(st.bw === null ? '' : deg(st.bw)), dbi: b(dbi(st.dbi)), od: b(dbv(st.overDipole))
      }; }
      function say(key) { if (parts.length) parts.push(' '); parts = parts.concat(t.parts(key, mk())); }
      if (st.single) { say('main_single'); say('dir_single'); return parts; }
      say('main_' + st.kind);
      // a line cannot tell its two sides apart: a beam off the line has a mirror image
      if (st.kind !== 'broadside' && st.main > 1e-6 && st.main < 180 - 1e-6) say('side_mirror');
      if (st.kind === 'broadside') say('back_both');
      else if (st.backNull) say(p.n === 2 ? 'back_null' : 'back_nullMany');
      else if (backFull) say(st.kind === 'endfire' ? 'back_twin' : 'back_grating');
      else if (st.backDb !== null && st.backDb > -0.005) say('back_mirror');
      else say('back_some');
      if (rest.length > 0) say('grating_some');
      else if (st.side && st.side.db > -6 && (st.side.at === 0 || st.side.at === 180)) say('grating_soon');
      say(st.bw === null ? 'dir_lineAll' : 'dir_line');
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
