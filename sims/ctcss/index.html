<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var NS = 'http://www.w3.org/2000/svg';
  var Y_TOP = 50, Y_BOT = -15;            // the chart's dB range over the median

  // ── small helpers ──

  /** Numbers in the page's language: a decimal comma in Croatian. */
  function num(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function f1(x) { return num(Number(x).toFixed(1)); }
  function f2(x) { return num(Number(x).toFixed(2)); }
  /** Seconds and hertz without trailing zeros (0.5, 1.5, 3). */
  function ft(x) { return num(String(Math.round(Number(x) * 100) / 100)); }
  function hz(f) { return t('hz', { f: f1(f) }); }
  /** Data that is not language (station letters): kept out of the word check. */
  function nt(x) { return h('span', { translate: 'no' }, String(x)); }
  function svg(tag, attrs, kids) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    (kids || []).forEach(function (k) { el.append(k); });
    return el;
  }
  /** Loudspeaker icon: open (waves) or muted (crossed). */
  function speaker(open) {
    var d = ['M3 9v6h4l5 4V5L7 9H3z'].concat(open ? ['M15.5 9a4 4 0 0 1 0 6', 'M18.5 6.5a7.5 7.5 0 0 1 0 11'] : ['M16 9.5l5 5', 'M21 9.5l-5 5']);
    return svg('svg', { class: 'ct-ico', viewBox: '0 0 24 24', 'aria-hidden': 'true' }, d.map(function (x) { return svg('path', { d: x }); }));
  }
  function letter(id) { return h('span', { class: 'ct-letter', translate: 'no', dataset: { st: id } }, id); }
  function station(s, id) { return s.stations.filter(function (x) { return x.id === id; })[0]; }
  function has(ev, code) { return ev.indexOf(code) >= 0; }

  // ── stage parts ──

  function stationCard(c, x) {
    var ev = c.state.events, changed = c.n > 0 && (has(ev, 'key.up:' + x.id) || has(ev, 'key.down:' + x.id));
    var lines = [h('span', { class: 'ct-chip', dataset: { v: x.on ? 'on' : 'off' } }, t(x.on ? 'keyedOn' : 'keyedOff')),
      h('span', null, x.tone === null ? t('sendsNone') : t('sends', { f: f1(x.tone) }))];
    if (x.level === 'weak') lines.push(h('span', { class: 'ct-chip', dataset: { v: 'weak' } }, t('weakTag')));
    return h('div', { class: 'ct-box ct-st' + (changed ? ' sd-changed' : ''), dataset: { on: x.on ? '1' : '0', st: x.id } },
      h('div', { class: 'ct-st-head' }, letter(x.id), t.parts('stationName', { id: nt(x.id) })),
      h('div', { class: 'ct-line' }, lines));
  }

  function rCard(c) {
    var s = c.state, cur = s.slots[c.n - 1] || null, ev = s.events;
    var toneMode = s.squelch === 'tone';
    var v = 'muted', main = t('spkMuted'), sub = [];
    if (cur && cur.speaker === 'open') {
      if (cur.doubled) { v = 'double'; main = t('spkOpen'); sub.push(h('span', null, t.parts('hearingDouble', { a: nt(cur.received[0]), b: nt(cur.received[1]) }))); }
      else { v = 'open'; main = t('spkOpen'); sub.push(h('span', null, t.parts('hearing', { st: nt(cur.received[0]) }))); }
      // rule 5: the tone never reaches the loudspeaker, in either squelch mode
      if (cur.received.some(function (id) { return station(s, id).tone !== null; })) sub.push(h('span', { class: 'ct-k' }, t('filtered')));
    } else {
      var why = !s.carrier ? 'mutedNoise' : s.detector.locked ? 'mutedNext'

      sub.push(h('span', { class: 'ct-k' }, t(why)));
    }
    var changed = c.n > 0 && (has(ev, 'speaker.open') || has(ev, 'speaker.mute'));
    return h('div', { class: 'ct-box ct-r' },
      h('div', { class: 'ct-r-head' },
        h('span', { class: 'ct-badge', translate: 'no' }, 'R'),
        h('span', { class: 'ct-k' }, t('rRole')),
        h('span', { class: 'ct-mode', dataset: { v: s.squelch } }, toneMode ? t('modeTone', { f: f1(s.rxTone) }) : t('modeCarrier'))),
      h('div', { class: 'ct-carrier' },
        h('span', { class: 'ct-bars', dataset: { on: s.carrier ? '1' : '0' } }, [0.4, 0.7, 1].map(function (k) { return h('i', { style: { height: (k * 100) + '%' } }); })),
        h('span', null, t(s.carrier ? 'carrierYes' : 'carrierNo'))),
      h('div', { class: 'ct-spk' + (changed ? ' sd-changed' : ''), dataset: { v: v } },
        speaker(v !== 'muted'),
        h('div', { class: 'ct-spk-t' }, h('b', null, main), sub)));
  }

  /** The 49 tone powers, dB over the median, with the median and the +12 dB line. */
  function chart(d, rx) {
    var box = h('div', { class: 'ct-chart', role: 'img', 'aria-label': t('chartLabel') });
    var W = L.TONES.length * 10, H = 100;
    function y(v) { return (Y_TOP - Math.max(Y_BOT, Math.min(Y_TOP, v))) / (Y_TOP - Y_BOT) * H; }
    var kids = [svg('rect', { class: 'ct-frame', x: 0, y: 0, width: W, height: H })];
    var bi = d.powers ? L.TONES.indexOf(d.bestTone) : -1;
    if (d.powers) {
      d.powers.forEach(function (v, i) {
        var top = y(v);
        kids.push(svg('rect', { class: 'ct-bar', 'data-best': i === bi ? '1' : '0', 'data-set': L.TONES[i] === rx ? '1' : '0', x: i * 10 + 1.5, y: top, width: 7, height: Math.max(0.5, H - top) }));
      });
    }
    kids.push(svg('line', { class: 'ct-axis', x1: 0, x2: W, y1: y(0), y2: y(0) }));
    kids.push(svg('line', { class: 'ct-thr', x1: 0, x2: W, y1: y(L.THRESHOLD_DB), y2: y(L.THRESHOLD_DB) }));
    box.append(svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', 'aria-hidden': 'true' }, kids));
    function pct(v) { return (y(v) / H * 100) + '%'; }
    box.append(h('span', { class: 'ct-lab', dataset: { side: 'r' }, style: { top: pct(0) } }, t('axisMedian')));
    box.append(h('span', { class: 'ct-lab ct-thr-l', dataset: { side: 'r' }, style: { top: pct(L.THRESHOLD_DB) } }, t('axisThr')));
    box.append(h('span', { class: 'ct-lab ct-k', dataset: { side: 'b0' } }, hz(L.TONES[0])));
    box.append(h('span', { class: 'ct-lab ct-k', dataset: { side: 'b1' } }, hz(L.TONES[L.TONES.length - 1])));
    var ri = L.TONES.indexOf(rx);
    if (ri >= 0) box.append(h('span', { class: 'ct-lab ct-set', dataset: { side: 't' }, style: { left: ((ri + 0.5) / L.TONES.length * 100) + '%' } }, '▲ ' + t('axisSet')));
    if (bi >= 0) box.append(h('span', { class: 'ct-mark', style: { left: ((bi + 0.5) / L.TONES.length * 100) + '%', top: pct(d.powers[bi]) } }, '●'));
    if (!d.powers) box.append(h('span', { class: 'ct-empty ct-k' }, t('decWait')));
    return box;
  }

  function detCard(c) {
    var s = c.state, d = s.detector, ev = s.events, cur = s.slots[c.n - 1] || null;
    if (s.squelch !== 'tone') {
      return h('div', { class: 'ct-box ct-det', dataset: { off: '1' } }, h('b', null, t('detName')), h('span', null, t('detOff')));
    }
    var col = cur ? cur.collected : 0;
    var dv, dl;
    if (!s.carrier) { dv = 'idle'; dl = t('decIdle'); }
    else if (cur && cur.det === 'found') { dv = d.decided === s.rxTone ? 'set' : 'other'; dl = (dv === 'set' ? '✓ ' : '≠ ') + t(dv === 'set' ? 'decSet' : 'decOther', { f: f1(d.decided) }); }
    else if (cur && cur.det === 'none') { dv = 'none'; dl = '∅ ' + t('decNone'); }
    else { dv = 'wait'; dl = '○ ' + t('decWait'); }
    var prevDet = c.n > 1 ? s.slots[c.n - 2] : null;
    var changed = c.n > 0 && (has(ev, 'det.lock') || has(ev, 'det.lost') || !prevDet || prevDet.det !== (cur && cur.det) || prevDet.tone !== (cur && cur.tone));
    var rows = [
      h('div', { class: 'ct-det-row' }, h('b', null, t('detName')),
        h('span', { class: 'ct-k' }, t('collected')),
        h('span', { class: 'ct-fill' }, h('i', { style: { width: (col / L.WINDOW_SLOTS * 100) + '%' } })),
        h('span', { class: 'ct-mono' }, t('ofHalf', { x: ft(col * L.SLOT_S) }))),
      chart(d, s.rxTone),
      h('div', { class: 'ct-det-row' },
        d.bestTone !== null ? [h('span', { class: 'ct-k' }, t('best')), h('b', null, hz(d.bestTone)),
          h('span', null, t('over', { m: f1(d.marginDb) })), h('span', { class: 'ct-k' }, '(' + t('need') + ')')] : h('span', { class: 'ct-k' }, ' ')),
      h('div', { class: 'ct-det-row' },
        h('span', { class: 'ct-dec' + (changed ? ' sd-changed' : ''), dataset: { v: dv } }, dl),
        d.check ? h('span', { class: 'ct-k' }, d.check.ok ? t('checkOk', { f: f1(s.rxTone) }) : t('checkLost')) : null)
    ];
    return h('div', { class: 'ct-box ct-det' }, rows);
  }

  function strip(c) {
    var s = c.state, N = c.steps, n = c.n, cells = [];
    cells.push(h('span', null));
    for (var i = 1; i <= N; i++) {
      cells.push(h('span', { class: 'ct-time', dataset: { now: i === n ? '1' : '0', tick: (i - 1) % 4 === 0 ? '1' : '0' } }, num((i - 1) * L.SLOT_S)));
    }
    L.IDS.forEach(function (id) {
      var x = station(s, id);
      cells.push(h('span', { class: 'ct-rowlab', dataset: { st: id } }, letter(id)));
      for (var i = 1; i <= N; i++) {
        var sl = s.slots[i - 1];
        if (!sl) { cells.push(h('span', { class: 'ct-c', dataset: { k: 'future' } })); continue; }
        var on = sl.keyed.indexOf(id) >= 0;
        var k = !on ? 'quiet' : x.level === 'weak' ? 'weak' : 'keyed';
        cells.push(h('span', { class: 'ct-c', dataset: { k: k, st: id, now: i === n ? '1' : '0' } },
          on && x.tone !== null ? h('span', null, '~', h('span', { 'data-wide': '' }, f1(x.tone))) : null));
      }
    });
    // detector row
    cells.push(h('span', { class: 'ct-rowlab' }, h('span', { 'data-wide': '' }, t('rowDet')), h('span', { class: 'ct-k', 'aria-hidden': 'true' }, '◎')));
    for (var j = 1; j <= N; j++) {
      var sl2 = s.slots[j - 1];
      if (!sl2) { cells.push(h('span', { class: 'ct-c', dataset: { k: 'future' } })); continue; }
      var v, body;
      if (sl2.det === 'off') { v = 'off'; body = '–'; }
      else if (sl2.det === 'idle') { v = 'idle'; body = null; }
      else if (sl2.det === 'listening') { v = 'listening'; body = [h('b', null, '○'), h('span', { 'data-wide': '' }, f2(sl2.collected * L.SLOT_S))]; }
      else if (sl2.det === 'lost') { v = 'lost'; body = [h('b', null, '○'), h('span', { 'data-wide': '' }, t('cellLost'))]; }
      else if (sl2.det === 'none') { v = 'none'; body = [h('b', null, '∅'), h('span', { 'data-wide': '' }, t('cellNone'))]; }
      else { v = sl2.tone === s.rxTone ? 'set' : 'other'; body = [h('b', null, v === 'set' ? '✓' : '≠'), h('span', { 'data-wide': '' }, f1(sl2.tone))]; }
      cells.push(h('span', { class: 'ct-c', dataset: { k: 'det', v: v, now: j === n ? '1' : '0' } }, body));
    }
    // loudspeaker row
    cells.push(h('span', { class: 'ct-rowlab' }, h('span', { 'data-wide': '' }, t('rowSpk')), h('span', { class: 'ct-k', 'aria-hidden': 'true' }, '♪')));
    for (var m = 1; m <= N; m++) {
      var sl3 = s.slots[m - 1];
      if (!sl3) { cells.push(h('span', { class: 'ct-c', dataset: { k: 'future' } })); continue; }
      var before = m > 1 ? s.slots[m - 2].speaker : 'muted';
      var open = sl3.speaker === 'open';
      var who = open && !sl3.doubled ? h('span', { translate: 'no', 'data-wide': '' }, sl3.received[0]) : null;
      var cell = h('span', { class: 'ct-c', dataset: { k: 'spk', v: sl3.speaker, dbl: sl3.doubled ? '1' : '0', now: m === n ? '1' : '0' } },
        speaker(open), who, sl3.doubled ? h('span', { class: 'ct-x' }, '×') : null);
      if (m === n && before !== sl3.speaker) cell.classList.add('sd-changed');
      cells.push(cell);
    }
    return h('div', { class: 'ct-strip', style: { '--n': String(N) } }, cells);
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, n = c.n;
    if (c.first) return s.squelch === 'tone' ? t('capStartTone', { f: f1(s.rxTone) }) : t('capStartCarrier');
    var cur = s.slots[n - 1], prev = n > 1 ? s.slots[n - 2] : null, ev = s.events, d = s.detector, toneMode = s.squelch === 'tone';
    var out = [t('capTime', { a: f2((n - 1) * L.SLOT_S), b: f2(n * L.SLOT_S) })];
    function add(key, vars) {
      var v = {};
      Object.keys(vars || {}).forEach(function (k) {
        var isId = /^[A-C]$/.test(String(vars[k]));     // station letters are data, numbers are text
        v[k] = isId ? nt(vars[k]) : vars[k];
      });
      out.push(' ');
      var seen = [];   // a placeholder used twice gets its own copy of the node (a node lives in one place)
      out.push.apply(out, t.parts(key, v).map(function (x) {
        if (!(x instanceof Node)) return x;
        if (seen.indexOf(x) >= 0) return x.cloneNode(true);
        seen.push(x);
        return x;
      }));
    }
    var opens = has(ev, 'speaker.open'), mutes = has(ev, 'speaker.mute');
    /** What the loudspeaker did in this slot, when the sentence before did not say it. */
    function speakerNow() { add(mutes ? 'capMutes' : opens ? 'capOpens' : cur.speaker === 'open' ? 'capStaysOpen' : 'capStaysMuted'); }
    // (1) keying
    ev.forEach(function (e) {
      if (e.indexOf('key.up:') === 0) {
        var x = station(s, e.slice(7));
        if (x.level === 'weak') add('capKeyWeak', { st: x.id });
        else if (x.tone === null) add('capKeyNoTone', { st: x.id });
        else add('capKeyTone', { st: x.id, f: f1(x.tone) });
      }
      if (e.indexOf('key.down:') === 0) add('capRelease', { st: e.slice(9) });
    });
    var rx = cur.received;
    if (!s.carrier) {
      add(mutes ? (toneMode ? 'capToneOff' : 'capCarrierOff') : 'capNoise');
    } else if (!toneMode) {
      if (cur.doubled) add('capDoubleCarrier', { a: rx[0], b: rx[1] });
      else {
        add(opens ? 'capCarrierOpen' : 'capCarrierStay', { st: rx[0] });
        var tx = station(s, rx[0]);
        if (opens && tx.tone !== null) add('capFiltered', { f: f1(tx.tone) });
      }
    } else {
      // (2) the detector and the loudspeaker
      if (cur.det === 'listening') { add('capListen'); speakerNow(); }
      else if (cur.det === 'lost') {
        if (cur.doubled) add('capLostMix', { f: f1(s.rxTone) });      // still sent, but no longer the strongest
        else {
          add('capLost', { f: f1(s.rxTone) });
          rx.forEach(function (id) { if (station(s, id).tone !== s.rxTone) add('capLostStill', { st: id }); });
        }
      } else if (cur.det === 'none') {
        add('capNone', { b: f1(d.bestTone), m: f1(d.marginDb) });
        speakerNow();
        // the way out, once, while nothing has been heard or doubled yet
        if ((!prev || prev.det !== 'none') && !s.heard.length && !s.doubled.length) add('capTryCarrier');
      } else if (d.decided !== s.rxTone) {
        add('capWrong', { b: f1(d.decided), f: f1(s.rxTone), m: f1(d.marginDb) });
        speakerNow();
        var ri = L.TONES.indexOf(s.rxTone), again = prev && prev.det === 'found' && prev.tone === d.decided;
        if (!again && !cur.doubled && ri >= 0 && d.powers[ri] >= L.THRESHOLD_DB && Math.abs(d.decided - s.rxTone) <= 5) add('capWrongSpill', { f: f1(s.rxTone), b: f1(d.decided), d: ft(Math.abs(d.decided - s.rxTone)) });
      } else if (has(ev, 'det.lock')) {
        add('capLock', { f: f1(d.decided), m: f1(d.marginDb) });
        if (!cur.doubled && !s.heard.length) {
          // speech lost so far: the slots since the carrier came up
          var k = n; while (k > 1 && s.slots[k - 2].carrier) k--;
          add('capLockClipped', { x: ft((n - k + 1) * L.SLOT_S) });
        }
      } else if (cur.doubled) {
        if (opens) add('capOpensGarble');
      } else if (opens) add('capOpen', { st: rx[0], f: f1(s.rxTone) });
      else add('capHold', { m: f1(d.marginDb), st: rx[0] });
      // (3) doubling
      if (cur.doubled) {
        var firstDouble = !prev || !prev.doubled;
        var joiner = rx.filter(function (id) { return ev.indexOf('key.up:' + id) >= 0; })[0] || rx[1];
        var other = rx.filter(function (id) { return id !== joiner; })[0];
        if (cur.speaker === 'open') {
          if (firstDouble && station(s, joiner).tone !== s.rxTone) add('capDoubleStart', { a: other, b: joiner });
          else if (firstDouble) add('capDoubleBoth', { a: other, b: joiner });
          else add('capDoubleOn', { a: rx[0], b: rx[1] });
        } else add('capDoubleMuted');
      }
    }
    if (c.last) {
      // the hidden user: on the air, never heard readable, and it doubled someone who was heard
      var hidden = null, victim = null, from = null;
      if (toneMode && s.doubled.length) {
        var dz = s.slots[s.doubled[0] - 1];
        dz.received.forEach(function (id) {
          if (L.heardSeconds(s, id) === 0 && !hidden) hidden = id;
        });
        victim = dz.received.filter(function (id) { return id !== hidden && L.heardSeconds(s, id) > 0; })[0] || null;
        from = (s.doubled[0] - 1) * L.SLOT_S;
      }
      if (hidden && victim) add('capEndHidden', { b: hidden, a: victim, t: ft(from) });
      else {
        add('capEndAll');
        L.IDS.forEach(function (id) {
          var k2 = s.slots.filter(function (z) { return z.received.indexOf(id) >= 0; }).length;
          if (k2) add('capEndOne', { st: id, h: ft(L.heardSeconds(s, id)), k: ft(k2 * L.SLOT_S) });
        });
      }
    }
    return out;
  }

  // ── mount ──

  var toneOpts = L.TONES.map(function (f) { return [f.toFixed(1), hz(f)]; });
  function inSchedule(id) { return function (p) { return !!L.SCHEDULES[p.schedule][id]; }; }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'squelch', type: 'choice', label: t('squelch'), options: [['tone', t('sqTone')], ['carrier', t('sqCarrier')]] },
      { key: 'rxTone', type: 'select', label: t('rxTone'), options: toneOpts, visible: function (p) { return p.squelch === 'tone'; } },
      { key: 'schedule', type: 'choice', label: t('schedule'), hint: t('scheduleHint'), options: [['A', t('schA')], ['B', t('schB')], ['C', t('schC')], ['AB', t('schAB')]] },
      { key: 'toneA', type: 'select', label: t('toneA'), options: [['none', t('noTone')]].concat(toneOpts), visible: inSchedule('A') },
      { key: 'toneB', type: 'select', label: t('toneB'), options: [['none', t('noTone')]].concat(toneOpts), visible: inSchedule('B') },
      { key: 'toneC', type: 'select', label: t('toneC'), options: [['none', t('noTone')]].concat(toneOpts), visible: inSchedule('C') },
      { key: 'weak', type: 'choice', label: t('weak'), options: [['none', t('weakNone')], ['A', 'A'], ['B', 'B'], ['C', 'C']] }
    ],

    presets: [
      { id: 'right-tone', label: t('presetRight'), hint: t('presetRightHint'), params: {} },
      { id: 'no-tone', label: t('presetNo'), hint: t('presetNoHint'), params: { schedule: 'B' } },
      { id: 'wrong-tone', label: t('presetWrong'), hint: t('presetWrongHint'), params: { schedule: 'C' } },
      { id: 'hidden-user', label: t('presetHidden'), hint: t('presetHiddenHint'), params: { schedule: 'AB' } }
    ],

    legend: [
      { shape: 'ct-keyed', label: t('legendKeyed') },
      { shape: 'ct-tone', label: t('legendTone') },
      { shape: 'ct-listen', label: t('legendListen') },
      { shape: 'ct-found', label: t('legendFound') },
      { shape: 'ct-open', label: t('legendOpen') },
      { shape: 'ct-muted', label: t('legendMuted') },
      { shape: 'ct-double', label: t('legendDouble') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'ct' },
        h('div', { class: 'ct-top' },
          h('div', { class: 'ct-stations' }, s.stations.map(function (x) { return stationCard(c, x); })),
          rCard(c),
          detCard(c)),
        strip(c)));
    },

    caption: caption
  });

  // the legend's symbol swatches (the kit draws empty swatches with data-shape; the page fills them)
  var fill = {
    'ct-tone': function () { return document.createTextNode('~'); },
    'ct-listen': function () { return document.createTextNode('○'); },
    'ct-found': function () { return document.createTextNode('✓'); },
    'ct-open': function () { return speaker(true); },
    'ct-muted': function () { return speaker(false); },
    'ct-double': function () { return document.createTextNode('×'); }
  };
  document.querySelectorAll('[data-sd-legend] .sd-swatch').forEach(function (sw) {
    var f = fill[sw.dataset.shape];
    if (f) sw.replaceChildren(f());
  });
})();
</script>
</body>
</html>
