<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-t="ui.pageTitle">Crtač mrežne topologije</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='8' width='20' height='11' rx='3' fill='none' stroke='%230ea5e9' stroke-width='2'/></svg>">
</head>
<body>

<header class="toolbar" id="toolbar">
  <div class="tb-group brand">
    <a class="sd-back" data-sd-back href="../../index.html" data-t-title="ui.backTitle"><span aria-hidden="true">←</span> <span data-t="ui.back">Popis</span></a>
    <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true">
      <circle cx="5" cy="6" r="2.6"/><circle cx="19" cy="6" r="2.6"/>
      <circle cx="12" cy="18" r="2.6"/>
      <path d="M5 8.6 12 15.4M19 8.6 12 15.4M7.5 6h9"/>
    </svg>
    <input id="doc-title" class="doc-title" value="" spellcheck="false"
           data-t-label="ui.docTitle">
  </div>

  <div class="tb-group">
    <button data-act="new" data-t-title="ui.newTitle" data-t="ui.new">Novi</button>
    <button data-act="open" data-t-title="ui.openTitle" data-t="ui.open">Otvori</button>
    <button data-act="save" data-t-title="ui.saveTitle" data-t="ui.save">Spremi</button>
    <details class="menu"><summary data-t="ui.samples">Primjeri</summary>
      <div class="menu-body" id="samples-menu"></div>
    </details>
    <details class="menu"><summary data-t="ui.export">Izvoz</summary>
      <div class="menu-body">
        <button data-act="png2" data-t="ui.png2">PNG — 2× (slajdovi)</button>
        <button data-act="png3" data-t="ui.png3">PNG — 3× (ispis)</button>
        <button data-act="pngT" data-t="ui.pngT">PNG — prozirna pozadina</button>
        <button data-act="svg" data-t="ui.svg">SVG — vektorski</button>
        <button data-act="copy" data-t="ui.copy">Kopiraj sliku u međuspremnik</button>
      </div>
    </details>
  </div>

  <div class="tb-group">
    <button data-act="undo" id="btn-undo" data-t-title="ui.undo" class="icon">↶</button>
    <button data-act="redo" id="btn-redo" data-t-title="ui.redo" class="icon">↷</button>
  </div>

  <div class="tb-group tools" role="group" data-t-label="ui.tools">
    <button data-tool="select" class="icon on" data-t-title="ui.toolSelect">⌖</button>
    <button data-tool="link" class="icon" data-t-title="ui.toolLink">⁄</button>
    <button data-tool="zone" class="icon" data-t-title="ui.toolZone">▭</button>
    <button data-tool="note" class="icon" data-t-title="ui.toolNote">T</button>
    <select id="link-kind" data-t-title="ui.linkKind"></select>
  </div>

  <div class="tb-group">
    <button data-act="snap" id="btn-snap" data-t-title="ui.snapTitle" data-t="ui.snap" class="toggle on">Privuci</button>
    <button data-act="grid" id="btn-grid" data-t-title="ui.gridTitle" data-t="ui.grid" class="toggle on">Mreža</button>
    <button data-act="routing" id="btn-routing" data-t-title="ui.routingTitle" class="toggle on">Kutno</button>
    <button data-act="theme" id="btn-theme" data-t-title="ui.themeTitle" class="toggle">Svijetlo</button>
  </div>

  <div class="tb-group zoom">
    <button data-act="zoom-out" class="icon" data-t-title="ui.zoomOut">−</button>
    <button data-act="zoom-reset" id="zoom-level" data-t-title="ui.zoomReset" translate="no">100%</button>
    <button data-act="zoom-in" class="icon" data-t-title="ui.zoomIn">+</button>
    <button data-act="fit" data-t-title="ui.fitTitle" data-t="ui.fit">Sve</button>
  </div>

  <div class="tb-group right">
    <button data-act="lang" class="lang" data-t-title="ui.langTitle" data-t="ui.lang">EN</button>
    <button data-act="present" class="primary" data-t-title="ui.presentTitle" data-t="ui.present">Prezentacija</button>
  </div>
</header>

<main class="workspace">
  <aside class="rail left" id="palette" data-t-label="ui.palette"></aside>

  <div class="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="canvas-hint" id="placing-hint" hidden></div>
  </div>

  <aside class="rail right" id="inspector" data-t-label="ui.inspector"></aside>
</main>

<footer class="statusbar">
  <span id="status-left" data-t="ui.ready">Spremno</span>
  <span id="status-right"></span>
</footer>

<div class="present-bar" id="present-bar" hidden>
  <button data-act="step-prev" data-t-title="ui.stepPrev">←</button>
  <span id="step-label"></span>
  <button data-act="step-next" data-t-title="ui.stepNext">→</button>
  <span class="sep"></span>
  <button data-act="clear-focus" data-t="ui.clearFocus">Ukloni isticanje</button>
  <button data-act="exit-present" class="primary" data-t="ui.exitPresent">Izlaz (Esc)</button>
</div>

<div class="toast" id="toast" hidden></div>

<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
