<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var N = L.N;
  var MAX = Math.pow(2, N) - 1;
  var seed = 1; // the random message draws from Simdeck.rng; the model itself stays deterministic
  var sim = null;
  var POLY = { '10011': 'x⁴ + x + 1', '1011': 'x³ + x + 1', '100000111': 'x⁸ + x² + x + 1' };
  var ICON = { ok: '✓', detected: '⚑', missed: '✕' };

  function str(bits) { return bits.join(''); }
  function binary(v) { return L.bitsOf(v, N).join(''); }
  function data(s) { return h('b', { class: 'sd-mono', translate: 'no' }, s); }
  function weight(i) { return Math.pow(2, N - 1 - i); }
  /** Buttons on the stage never take focus on click, like the kit's, so → and Space keep driving the demo. */
  function noFocus(el) { el.addEventListener('mousedown', function (e) { e.preventDefault(); }); return el; }

  /** One bit cell. o: { v, kind: data|check|ghost, flip: yes|plan|'', changed, click, label } */
  function bit(o) {
    var attrs = {
      class: 'ce-bit' + (o.changed ? ' sd-changed' : '') + (o.changed && o.forward ? ' sd-anim-in' : ''),
      dataset: { k: o.kind, flip: o.flip ? 'yes' : 'no', c: o.kind === 'check' ? '2' : '1' },
      'aria-label': o.label
    };
    var kids = [o.kind === 'ghost' ? ' ' : String(o.v), o.flip ? h('span', { class: 'ce-x', 'aria-hidden': 'true' }, '✕') : null];
    if (o.click) {
      attrs.type = 'button';
      attrs.onclick = o.click;
      return noFocus(h('button', attrs, kids));
    }
    return h('span', attrs, kids);
  }

  function verdict(v, changed) {
    return h('span', { class: 'ce-verdict' + (changed ? ' sd-changed' : ''), dataset: { v: v } },
      h('span', { 'aria-hidden': 'true' }, ICON[v]), t(v));
  }

  // ── left: the frames ──

  function senderFrames(s, c) {
    var p = c.params;
    var sent = s.phase !== 'start' && s.phase !== 'divide';
    var editBits = function (checkBits, kindChanged) {
      return s.data.map(function (b, i) {
        return bit({ v: b, kind: 'data', label: t('editLabel', { i: i, v: b }),
          click: function () { sim.set({ data: p.data ^ weight(i) }); } });
      }).concat([h('span', { class: 'ce-gap' })], checkBits);
    };
    var pBit = [bit({ v: s.parity, kind: 'check', label: t('bitLabel', { i: 'P', v: s.parity }), changed: c.first })];
    var fcs = [];
    for (var j = 0; j < s.r; j++) {
      fcs.push(sent
        ? bit({ v: s.fcs[j], kind: 'check', label: t('bitLabel', { i: N + j, v: s.fcs[j] }), changed: s.phase === 'sent', forward: c.dir === 'forward' })
        : bit({ v: 0, kind: 'ghost', label: t('bitLabel', { i: N + j, v: '?' }) }));
    }
    var k = L.ones(s.data);
    return h('div', { class: 'ce-side' },
      h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-side-name' }, t('sender')), h('span', { class: 'ce-note' }, t('editHint'))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameParity')),
          h('span', { class: 'ce-note' }, t.n('onesP', k, { p: s.parity }))),
        h('div', { class: 'ce-strip', translate: 'no' }, editBits(pBit))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameCrc')),
          sent ? h('span', { class: 'ce-note' }, t('fcsIs')) : null),
        h('div', { class: 'ce-strip', translate: 'no' }, editBits(fcs))));
  }

  function lineBar(s, c) {
    var n = s.flipped.length;
    var text = s.received ? (n ? h('b', null, t.n('lineFlips', n)) : t('lineClean'))
      : s.planned.length ? t.n('planned', s.planned.length) : null;
    return h('div', { class: 'ce-line' }, h('span', null, '↓ ', t('line')), text);
  }

  function receiverFrames(s, c) {
    var p = c.params;
    var arrived = !!s.received;
    var nowLine = s.phase === 'line';
    function rx(frame, checkBits) {
      return s.data.map(function (b, i) {
        var planned = s.planned.indexOf(i) >= 0;
        var flipped = s.flipped.indexOf(i) >= 0;
        return bit({
          v: arrived ? frame[i] : b, kind: arrived ? 'data' : 'ghost', flip: arrived ? flipped : planned,
          changed: nowLine && flipped, forward: c.dir === 'forward',
          label: t('flipLabel', { i: i, state: t(planned ? 'flipOn' : 'flipOff') }),
          click: function () { sim.set({ flip: p.flip ^ weight(i) }); }
        });
      }).concat([h('span', { class: 'ce-gap' })], checkBits);
    }
    var pRx = arrived ? s.receivedParity[N] : 0;
    var pCells = [bit({ v: pRx, kind: arrived ? 'check' : 'ghost', label: t('bitLabel', { i: 'P', v: arrived ? pRx : '?' }) })];
    var fcsCells = [];
    for (var j = 0; j < s.r; j++) {
      var v = arrived ? s.received[N + j] : 0;
      fcsCells.push(bit({ v: v, kind: arrived ? 'check' : 'ghost', label: t('bitLabel', { i: N + j, v: arrived ? v : '?' }) }));
    }
    var pc = s.parityCheck, cc = s.crcCheck;
    var pNote = pc ? [h('span', { class: 'ce-note' }, t.n('ones', pc.ones), ', ', t(pc.ones % 2 ? 'odd' : 'even'), ' '), verdict(pc.verdict, s.phase === 'parity')]
      : !arrived ? h('span', { class: 'ce-note' }, t('waiting')) : null;
    var cNote = cc ? [h('span', { class: 'ce-note' }, t('remainder'), ' ', h('b', { translate: 'no' }, str(cc.remainder)), ' '), verdict(cc.verdict, s.phase === 'crc')]
      : !arrived ? h('span', { class: 'ce-note' }, t('waiting')) : null;
    return h('div', { class: 'ce-side' },
      h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-side-name' }, t('receiver')), h('span', { class: 'ce-note' }, t('flipHint'))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameParity')), h('span', null, pNote)),
        h('div', { class: 'ce-strip', translate: 'no' }, rx(s.receivedParity, pCells))),
      h('div', { class: 'ce-frame' },
        h('div', { class: 'ce-frame-head' }, h('span', { class: 'ce-frame-name' }, t('frameCrc')), h('span', null, cNote)),
        h('div', { class: 'ce-strip', translate: 'no' }, rx(s.received, fcsCells))));
  }

  // ── right: the long division ──

  /**
   * The rows of a division as grid lines: the dividend, then per XOR row the generator under its window (⊕) and the
   * register it leaves, from the window on. cur = index of the row done in this step (or -1); remHl marks the
   * remainder of the last line; flips marks bits of a received dividend.
   */
  function divisionGrid(dividend, rows, gen, o) {
    var cols = dividend.length, r = gen.length - 1, cells = [], lines = 1 + 2 * rows.length;
    function g(text, kind, extra) {
      var a = { class: 'ce-g' + (extra && extra.cls ? ' ' + extra.cls : ''), dataset: { k: kind } };
      if (extra && extra.flip) a.dataset.flip = 'yes';
      return h('span', a, text);
    }
    function blank() { return h('span', { class: 'ce-g' }, ''); }
    function regLine(reg, from, opts) {
      cells.push(g(opts.op || '', 'op'));
      for (var i = 0; i < cols; i++) {
        if (i < from) { cells.push(blank()); continue; }
        var kind = opts.dividend ? (i < cols - r ? 'data' : 'pad') : 'rest';
        var firstOne = reg.indexOf(1, from);
        if (!opts.dividend && (firstOne < 0 ? i < cols - r : i < firstOne) && i < cols - r) kind = 'lead';
        var cls = '';
        if (opts.win && i >= opts.win[0] && i <= opts.win[1]) cls = 'ce-win';
        if (opts.rem && i >= cols - r) { kind = 'rem'; if (opts.remHl) cls = 'ce-remhl'; }
        cells.push(g(String(reg[i]), kind, { cls: cls, flip: opts.flips && opts.flips.indexOf(i) >= 0 }));
      }
      cells.push(g(opts.mark || '', 'mark'));
    }
    var lastIdx = rows.length - 1;
    var curWin = o.cur >= 0 ? [rows[o.cur].at, rows[o.cur].at + r] : null;
    regLine(dividend, 0, { dividend: true, flips: o.flips, win: o.cur === 0 ? curWin : null, rem: rows.length === 0 && o.showRem, remHl: o.remHl });
    rows.forEach(function (row, j) {
      var win = j === o.cur ? curWin : null;
      cells.push(g('⊕', 'op'));
      for (var i = 0; i < cols; i++) {
        if (i < row.at || i > row.at + r) cells.push(blank());
        else cells.push(g(String(gen[i - row.at]), 'gen', { cls: win ? 'ce-win' : '' }));
      }
      cells.push(g(t('rowMark', { n: j + 1 }), 'mark'));
      var isLast = j === lastIdx;
      var nextWin = o.cur === j + 1 ? [rows[j + 1].at, rows[j + 1].at + r] : null;
      regLine(row.after, row.at + 1, { win: win || nextWin, rem: isLast && o.showRem, remHl: isLast && o.remHl });
    });
    return h('div', { class: 'ce-grid', translate: 'no', style: { '--cols': String(cols), '--lines': String(lines) } }, cells);
  }

  function division(s, c) {
    var rx = s.phase === 'crc';
    var dividend = rx ? s.received : s.dividend;
    var rows = rx ? s.crcCheck.rows : s.rows;
    var cur = s.phase === 'divide' ? s.rows.length - 1 : -1;
    var showRem = rx || (s.phase !== 'start' && s.phase !== 'divide');
    var grid = divisionGrid(dividend, rows, s.gen, {
      cur: cur, showRem: showRem, remHl: s.phase === 'sent' || rx, flips: rx ? s.flipped : null
    });
    return h('div', { class: 'ce-div' },
      h('div', { class: 'ce-div-head' },
        h('span', { class: 'ce-div-title' }, t(rx ? 'divReceiver' : 'divSender')),
        h('span', { class: 'ce-genbox' }, h('span', null, t('genBox')), h('span', { class: 'sd-mono', translate: 'no' }, str(s.gen)),
          h('span', { class: 'ce-poly', translate: 'no' }, POLY[str(s.gen)]))),
      h('div', { class: 'ce-work' }, grid));
  }

  // ── captions ──

  function listOf(idx) { return idx.join(', '); }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'gen', type: 'choice', label: t('gen'), hint: t('genHint'), resets: true,
        options: [['10011', t('gen4')], ['1011', t('gen3')], ['100000111', t('gen8')]] },
      // The message and the error pattern: sliders over every 10-bit value, shown as bits; clicking a bit on the stage
      // is the quicker way to change one.
      { key: 'data', type: 'range', label: t('message'), hint: t('messageHint'), min: 0, max: MAX, resets: true, format: binary },
      { key: 'flip', type: 'range', label: t('pattern'), hint: t('patternHint'), min: 0, max: MAX, format: binary },
      { type: 'button', label: t('random'), key: 'n', run: function (sm) { sm.set({ data: Simdeck.rng(seed++).int(MAX + 1) }); } },
      { type: 'button', label: t('clear'), key: 'x', run: function (sm) { sm.set({ flip: 0 }); } }
    ],

    presets: [
      { id: 'crc-build', label: t('presetBuild'), hint: t('presetBuildHint'), params: { flip: 0 } },
      { id: 'crc-catches-burst', label: t('presetBurst'), hint: t('presetBurstHint'), params: { flip: 120 }, step: 6 },
      { id: 'parity-catches', label: t('presetSingle'), hint: t('presetSingleHint'), params: { flip: 64 }, step: 6 },
      { id: 'crc-blind-spot', label: t('presetBlind'), hint: t('presetBlindHint'), params: { flip: 152 }, step: 6 }
    ],

    legend: [
      { shape: 'data', label: t('legendData') },
      { shape: 'check', label: t('legendCheck') },
      { shape: 'flip', label: t('legendFlip') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'ce' },
        h('div', { class: 'ce-frames', style: { '--n': String(L.N + s.r) } }, senderFrames(s, c), lineBar(s, c), receiverFrames(s, c)),
        division(s, c)));
    },

    caption: function (c) {
      var s = c.state, gen = str(s.gen);
      var parts;
      if (s.phase === 'start') {
        parts = t.parts('captionStart', { data: data(str(s.data)), p: data(String(s.parity)), zeros: t.n('zeros', s.r), gen: data(gen) });
        if (!s.rows.length && c.steps === 1) parts.push(' ', t('captionNoRow'));
        return parts;
      }
      if (s.phase === 'divide') {
        var j = s.rows.length - 1, row = s.rows[j];
        var prevAt = j > 0 ? s.rows[j - 1].at : -1;
        // leading zeros between the previous window's lead and this one are only brought down (rule 7)
        var skipped = row.at - prevAt - 1;
        parts = t.parts('captionRow', { n: j + 1, at: row.at, gen: data(gen) });
        if (skipped > 0) parts.push(' ', t.n('skipped', skipped));
        return parts;
      }
      if (s.phase === 'sent') {
        parts = s.rows.length ? t.parts('captionSent', { fcs: data(str(s.fcs)), codeword: data(str(s.codeword)) })
          : [t('captionNoRow'), ' '].concat(t.parts('captionSent', { fcs: data(str(s.fcs)), codeword: data(str(s.codeword)) }));
        parts.push(' ', s.planned.length ? t('captionSentFlip') : t('captionSentClean'));
        return parts;
      }
      var n = s.flipped.length;
      if (s.phase === 'line') {
        parts = t.parts(n === 1 ? 'captionLine1' : 'captionLine', { flips: t.n('lineFlips', n), list: data(listOf(s.flipped)) });
        if (n > 1) parts.push(' ', t.n('burst', s.flipped[n - 1] - s.flipped[0] + 1));
        return parts;
      }
      if (s.phase === 'parity') {
        return t.parts(s.parityCheck.verdict === 'missed' ? 'captionParityMissed' : 'captionParityDetected',
          { ones: t.n('ones', s.parityCheck.ones) });
      }
      parts = t.parts(s.crcCheck.verdict === 'missed' ? 'captionCrcMissed' : 'captionCrcDetected', { rem: data(str(s.crcCheck.remainder)) });
      parts.push(' ', s.parityCheck.verdict === 'missed' ? t.n('recapParityMissed', n)
        : t(s.crcCheck.verdict === 'missed' ? 'recapParityOnly' : 'recapParityDetected'));
      return parts;
    }
  });
})();
</script>
</body>
</html>
