<style>
/* Page CSS: every selector starts with [data-sim="ari-checking"]; colours only from kit tokens.
   The task across the top; below it the estimate (left) and the check (right), each closed until opened. */
[data-sim="ari-checking"] .ck {
  display: grid;
  grid-template-rows: 25cqh minmax(0, 1fr);
  gap: 1.4cqh 1.2cqw;
  height: 100%;
  padding: 1.4cqh 1.2cqw;
  font-size: max(1rem, min(2.5cqh, 1.15cqw));
  line-height: 1.3;
}
[data-sim="ari-checking"] .ck[data-aud='child'] { grid-template-rows: 30cqh minmax(0, 1fr); }
[data-sim="ari-checking"] .ck-cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.2cqw; min-height: 0; }
[data-sim="ari-checking"] .ck-box { display: flex; flex-direction: column; gap: 0.3em; min-width: 0; min-height: 0; padding: 0.45em 0.7em; border: var(--line-w) solid var(--line); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
[data-sim="ari-checking"] .ck-box > * { flex: none; margin: 0; }
[data-sim="ari-checking"] .ck-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.2em 0.6em; font-weight: 700; }
[data-sim="ari-checking"] .ck-small { color: var(--muted); font-size: max(16px, 0.8em); font-weight: 400; }
[data-sim="ari-checking"] .ck-num { font-family: var(--mono); white-space: nowrap; }
[data-sim="ari-checking"] .ck-num sub { font-size: max(16px, 0.62em); }
[data-sim="ari-checking"] .sd-caption .ck-num { font-family: inherit; }
[data-sim="ari-checking"] .ck-paperbox { flex: 1 1 0; min-height: 0; }

/* ── the task ── */
[data-sim="ari-checking"] .ck-taskrow { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0.6em 1.2em; }
[data-sim="ari-checking"] .ck-taskrow .ck-paperbox { width: 100%; height: 100%; }
[data-sim="ari-checking"] .ck-task .sd-paper { --pc-max: 5.5rem; --pc-fill-h: 90cqh; }
[data-sim="ari-checking"] .ck[data-aud='child'] .ck-task .sd-paper { --pc-max: 8rem; }
[data-sim="ari-checking"] .ck-side { display: flex; flex-direction: column; align-items: flex-start; gap: 0.25em; min-width: 0; }
[data-sim="ari-checking"] .ck-rem { font-size: 1.3em; font-weight: 700; }
[data-sim="ari-checking"] .ck-bad { color: var(--danger); text-decoration: line-through 0.12em; }
[data-sim="ari-checking"] .ck-verdict { display: inline-block; white-space: nowrap; padding: 0.05em 0.5em; border: 0.2rem solid var(--ink); border-radius: var(--radius); font-size: 1.4em; font-weight: 700; }
[data-sim="ari-checking"] .ck-verdict[data-ok='no'] { border-color: var(--danger); border-style: dashed; color: var(--danger); }
[data-sim="ari-checking"] .ck-q { font-size: 1.15em; }

/* ── the cards ── */
[data-sim="ari-checking"] .ck-closed { justify-content: center; align-items: center; gap: 0.8em; text-align: center; border-style: dashed; }
[data-sim="ari-checking"] .ck-closed .ck-head { font-size: 1.3em; }
[data-sim="ari-checking"] .ck-open { min-height: 3rem; padding: 0 1.4rem; font-size: 1.15em; }
[data-sim="ari-checking"] .ck-card .ck-head .ck-small { margin-right: auto; }
[data-sim="ari-checking"] .ck-hide { min-height: 2.2rem; padding: 0 0.6rem; font-size: 1rem; font-weight: 400; }
[data-sim="ari-checking"] .ck-chips { display: flex; flex-wrap: wrap; gap: 0.2em 0.9em; font-family: var(--mono); font-size: 1.1em; }
[data-sim="ari-checking"] .ck-chips > span { white-space: nowrap; }
[data-sim="ari-checking"] .ck-line { font-family: var(--mono); font-size: 1.25em; font-weight: 700; }
[data-sim="ari-checking"] .ck-card .sd-paper { --pc-max: 4.6rem; --pc-fill-h: 94cqh; }
[data-sim="ari-checking"] .ck-card .sd-paper-box { min-height: 3rem; }
[data-sim="ari-checking"] .ck-v { display: flex; gap: 0.4em; align-items: baseline; font-weight: 700; }
[data-sim="ari-checking"] .ck-v .ck-mark { flex: none; display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border: 0.18rem solid var(--ink); border-radius: 50%; line-height: 1; }
[data-sim="ari-checking"] .ck-v[data-v='far'] .ck-mark, [data-sim="ari-checking"] .ck-v[data-v='bad'] .ck-mark { border-color: var(--danger); color: var(--danger); border-style: dashed; }
[data-sim="ari-checking"] .ck-rule { font-style: italic; }
/* the comparison beside the check's result (= 846, ≠ 846, < 3) is what the check is for: ink, bold */
[data-sim="ari-checking"] .ck-chk .sd-pc-aside:not(.sd-pc-pl) { color: var(--ink); font-weight: 700; }
[data-sim="ari-checking"] .ck-cause { padding-top: 0.25em; border-top: var(--line-w) solid var(--line); }
[data-sim="ari-checking"] .ck-cause b { color: var(--danger); }

/* ── panel: the task field, the given result, quick bases ── */
[data-sim="ari-checking"] .ck-field { display: grid; gap: 0.3rem; }
[data-sim="ari-checking"] .ck-field .sd-hint:empty { display: none; }
[data-sim="ari-checking"] .ck-input {
  width: 100%; min-height: var(--hit); padding: 0 0.6rem;
  border: var(--line-w) solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--ink); font: inherit; font-family: var(--mono); font-size: 1.15rem;
}
[data-sim="ari-checking"] .ck-input:focus-visible { outline: 0.25rem solid var(--focus); outline-offset: 0.1rem; }
[data-sim="ari-checking"] .ck-input[aria-invalid='true'] { border-color: var(--danger); border-style: dashed; border-width: 0.2rem; }
[data-sim="ari-checking"] .ck-err { color: var(--danger); font-size: var(--fs-sm); font-weight: 700; }
[data-sim="ari-checking"] .ck-given button { min-height: 2.4rem; font-size: 1rem; }
[data-sim="ari-checking"] .ck-given button[aria-disabled='true'] { opacity: 0.45; text-decoration: line-through; }
[data-sim="ari-checking"] .ck-quick { margin-top: 0.35rem; }
[data-sim="ari-checking"] .ck-quick button { min-height: 2.4rem; font-family: var(--mono); }
[data-sim="ari-checking"] .ck-quick button[aria-disabled='true'] { opacity: 0.45; text-decoration: line-through; }
[data-sim="ari-checking"] [data-ck-given][hidden],

/* legend swatch: a wrong digit, struck in --danger (as the kit's x: 'wrong') */
[data-sim="ari-checking"] .sd-swatch[data-shape='ck-wrong'] { background: linear-gradient(145deg, transparent 42%, var(--danger) 42% 58%, transparent 58%), var(--bg); }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ari-checking"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="ari-checking"] .ck, [data-sim="ari-checking"] .ck[data-aud='child'] { display: flex; flex-direction: column; height: auto; font-size: 1rem; gap: 0.8rem; padding: 0.7rem; }
  [data-sim="ari-checking"] .ck-cards { display: flex; flex-direction: column; gap: 0.8rem; }
  [data-sim="ari-checking"] .ck-taskrow { flex: none; display: flex; flex-direction: column; align-items: flex-start; }
  [data-sim="ari-checking"] .ck-paperbox, [data-sim="ari-checking"] .ck-taskrow .ck-paperbox { flex: none; width: 100%; height: auto; container-type: inline-size; padding: 0.3rem 0; overflow-x: auto; place-items: center start; }
  /* a long line (up to 21 squares) keeps digits of at least 16 px and scrolls sideways in its box */
  [data-sim="ari-checking"] .ck-paperbox .sd-paper { --pc-cell: max(1.8rem, min(calc(92cqw / (var(--pc-w) + var(--pc-xw))), var(--pc-max-phone))); }
  /* the task line: 1.68rem squares keep 16 px digits (0.6 of the square) and fit 11 squares (846−378=478) in 298 px */
  [data-sim="ari-checking"] .ck-taskrow .ck-paperbox .sd-paper { --pc-cell: max(1.68rem, min(calc(98cqw / var(--pc-w)), var(--pc-max-phone))); }
  [data-sim="ari-checking"] .ck-closed { padding: 1rem; }
  [data-sim="ari-checking"] .ck-box { overflow: visible; }
  [data-sim="ari-checking"] .ck > *, [data-sim="ari-checking"] .ck-cards > * { min-width: 0; max-width: 100%; }
}
</style>

<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Je li točno? Provjera rezultata</h1>
      <p class="sd-subtitle"></p>
    </div>

  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>

    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-ck-task></div>
      <div data-ck-given></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>

    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var PRESET_KEY = { borrow: 'pBorrow', sum: 'pSum', shift: 'pShift', zero: 'pZero', remainder: 'pRem', 'base-2': 'pBin' };
  var QUICK = [2, 8, 10, 16];
  var NAMED = { 2: 'baseName2', 8: 'baseName8', 10: 'baseName10', 16: 'baseName16' };
  var CHECK_SIGN = { add: '−', sub: '+' };

  var audience = 'teacher';
  var notice = null; // a refused action, said once in the caption

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node twice). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function X() { return audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C'; }

  // ── numbers as text (data, translate="no") ──
  /** A numeral, with the base as a subscript when it is not 10 (child view: never). */
  function num(text, b) {
    return h('span', { class: 'ck-num', translate: 'no' }, String(text), b !== 10 && audience !== 'child' ? h('sub', null, String(b)) : null);
  }
  function plain(text) { return h('span', { class: 'ck-num', translate: 'no' }, String(text)); }
  /** A quantity in the base, as a numeral with the base. */
  function N(v, b) { return num(L.textOf(v, b), b); }
  function T(v, b) { return L.textOf(v, b); }
  function pow(b, k) { return Math.pow(b, k); }
  /** Digits by place, ones first, as cell texts. */
  function cellsOf(v, b) { return L.digitsOf(v, b).map(function (d) { return L.DIGITS[d]; }); }
  /** The column of place k: "desetica" in base 10, "mjesta 16" otherwise. */
  function col(b, k) { return k === 0 || (b === 10 && k <= 6) ? t('col' + k) : t('colGen', { v: pow(b, k) }); }
  function placeLabels(b, W) {
    var out = [], titles = [];
    for (var k = 0; k < W; k++) {
      if (b === 10 && k <= 7) { out.push(t('place' + k)); titles.push(t('placeName' + k)); }
      else { out.push(P.power(b, k)); titles.push(t('placeName', { v: pow(b, k) })); }
    }
    return { labels: out, titles: titles };
  }
  /** "846 − 378 = 478" in the base. */
  function taskLine(s, b) { return T(s.a, b) + ' ' + L.SIGN[s.op] + ' ' + T(s.b, b) + ' = ' + T(s.g, b); }
  /** A result with its remainder when the division has one ("282", "505, ostatak 3"). */
  function result(s, v, rem) {
    var b = s.base;
    return s.op === 'div' && rem ? h('span', null, tp('withRest', { q: N(v, b), r: N(rem, b) })) : N(v, b);
  }
  /** The check as one line: "478 + 378 = 856", "4113 : 36 = 114", "281 · 3 + 3 = 846". */
  function checkLine(s) {
    var b = s.base, K = s.check;
    if (s.op === 'add') return T(s.g, b) + ' − ' + T(s.b, b) + ' = ' + T(K.value, b);
    if (s.op === 'sub') return T(s.g, b) + ' + ' + T(s.b, b) + ' = ' + T(K.value, b);
    if (s.op === 'mul') return T(s.g, b) + ' : ' + T(s.b, b) + ' = ' + T(K.value, b);
    return T(s.g, b) + ' · ' + T(s.b, b) + ' + ' + T(s.r, b) + ' = ' + T(K.value, b);
  }
  /** "jedno mjesto", "2 mjesta". */
  function placesText(n) { return n === 1 ? t('placesOne') : t.n('places', n); }
  function paperBox(paper) { return h('div', { class: 'ck-paperbox sd-paper-box' }, paper); }

  // ── the task ──
  function taskBox(s, p) {
    var b = s.base, chk = p.chk, child = audience === 'child';
    var left = (T(s.a, b) + L.SIGN[s.op] + T(s.b, b) + '=').split('').reverse();
    var cells = L.digitsOf(s.g, b).map(function (d, k) {
      var tx = L.DIGITS[d];
      return chk && s.wrongDigits.indexOf(k) >= 0 ? { text: tx, x: 'wrong', label: t('wrongCell', { w: tx }) } : tx;
    }).concat(left);
    var paper = P({ cols: cells.length, big: child, label: t('paperTask'), rows: [{ cells: cells }] });
    var side = [];
    // a remainder is written when there is one, given or right (a forgotten one shows as "ostatak 0", struck)
    if (s.op === 'div' && (s.r || s.rightRem)) {
      side.push(h('span', { class: 'ck-rem' + (chk && s.r !== s.rightRem ? ' ck-bad' : '') }, tp('remainder', { r: N(s.r, b) })));
    }
    if (chk) {
      side.push(h('span', { class: 'ck-verdict', dataset: { ok: s.correct ? 'yes' : 'no' } }, (s.correct ? '✓ ' : '✗ ') + t(s.correct ? 'vRight' : 'vWrong')));
      if (!s.correct && !child) side.push(h('span', null, tp('rightIs', { res: result(s, s.right, s.rightRem) })));
    } else side.push(h('span', { class: 'ck-q' }, t('taskQ')));
    var box = paperBox(paper);
    return h('section', { class: 'ck-box ck-task' },
      h('div', { class: 'ck-head' }, h('span', null, t('taskHead')), h('span', { class: 'ck-small' }, t('op_' + s.op))),
      h('div', { class: 'ck-taskrow' }, box, h('div', { class: 'ck-side' }, side)));
  }

  function closedCard(cls, head, prompt, label, key, run) {
    return h('section', { class: 'ck-box ck-card ck-closed ' + cls },
      h('div', { class: 'ck-head' }, h('span', null, head)),
      h('p', null, prompt),
      noFocus(h('button', { type: 'button', class: 'sd-btn sd-btn--primary ck-open', title: label + ' (' + key + ')', 'aria-keyshortcuts': key.toLowerCase(),
        onclick: run }, label, ' ', h('kbd', null, key))));
  }
  /** An open card's head: its title, a small note and a button that closes it again. */
  function cardHead(title, note, key, param) {
    return h('div', { class: 'ck-head' }, h('span', null, title), note ? h('span', { class: 'ck-small' }, note) : null,
      noFocus(h('button', { type: 'button', class: 'sd-btn ck-hide', title: t('hide') + ' (' + key + ')', 'aria-keyshortcuts': key.toLowerCase(),
        onclick: function () { toggle(param); } }, t('hide'), ' ', h('kbd', null, key))));
  }
  function verdictLine(kind, mark, nodes) {
    return h('p', { class: 'ck-v', dataset: { v: kind } }, h('span', { class: 'ck-mark', 'aria-hidden': 'true' }, mark), h('span', null, nodes));
  }
  function toggle(key) { var patch = {}; patch[key] = !sim.params[key]; sim.set(patch); }

  // ── the estimate ──
  function estBox(s, p) {
    var b = s.base, E = s.est, child = audience === 'child';
    if (!p.est) return closedCard('ck-est', t('estHead'), t(child ? 'estPromptC' : 'estPrompt'), t('estOpen'), 'E', function () { toggle('est'); });
    var kids = [cardHead(t('estHead'), child ? null : t('estSub'), 'E', 'est')];
    var chip = function (v, r) { return h('span', { translate: 'no' }, T(v, b) + ' ≈ ' + T(r, b)); };
    kids.push(h('div', { class: 'ck-chips' }, s.op === 'div' ? [chip(s.a, E.ra), chip(s.b, E.rb)] : [chip(s.a, E.ra), chip(s.b, E.rb)]));
    if (!child && E.place != null) kids.push(h('p', { class: 'ck-small' }, t('estAgain', { col: col(b, E.place) })));
    if (!child && s.op === 'div' && E.ra !== s.a) kids.push(h('p', { class: 'ck-small' }, tp('estEasy', { a: N(E.ra, b), d: N(E.rb, b) })));
    kids.push(h('div', { class: 'ck-line', translate: 'no' }, T(E.ra, b) + ' ' + L.SIGN[s.op] + ' ' + T(E.rb, b) + ' = ' + T(E.value, b)));
    // the estimate over the given result, lined up by place; a place one has and the other has not is banded
    var ed = cellsOf(E.value, b), gd = cellsOf(s.g, b);
    var W = Math.max(ed.length, gd.length);
    var band = [];
    if (s.verdict === 'far') {
      for (var k = Math.min(ed.length, gd.length); k < W; k++) band.push({ k: k, from: 0, to: 1 });
    }
    var pl = placeLabels(b, W);
    kids.push(paperBox(P({ cols: W, big: child, label: t('paperEst'), places: pl.labels, placeTitles: pl.titles, band: band,
      rows: [{ cells: ed, sign: '≈' }, { kind: 'result', cells: gd, sign: '?' }] })));
    if (!child) kids.push(h('p', { class: 'ck-small' }, t('estRows')));
    var g = N(s.g, b), e = N(E.value, b);
    if (s.verdict === 'rough') kids.push(verdictLine('rough', '?', t(child ? 'estRoughC' : 'estRough')));
    else if (s.verdict === 'near') kids.push(verdictLine('near', '≈', tp(child ? 'estNearC' : 'estNear', { g: g, e: e })));
    else {
      // "a place missed" only when the digits say so; otherwise "too far from the estimate"
      var key = child ? 'estFarC' : s.size.zero ? 'estFarZero' : s.places > 0 ? 'estFarMore' : s.places < 0 ? 'estFarLess' : 'estFarSize';
      kids.push(verdictLine('far', '✗', tp(key, { g: g, e: e, places: placesText(Math.abs(s.places)) })));
    }
    if (!child && s.op === 'div') kids.push(h('p', { class: 'ck-small' }, t('estQuot')));
    if (audience === 'adult') kids.push(h('p', { class: 'ck-small' }, tp('estWhyA', { b: plain(b) })));
    return h('section', { class: 'ck-box ck-card ck-est' }, kids);
  }

  // ── the check, by the inverse operation ──
  function checkPaper(s) {
    var b = s.base, K = s.check, child = audience === 'child';
    var aside = function () { return (K.eq ? '= ' : '≠ ') + T(s.a, b); };
    var W, rows, band = [], right = 0, places;
    if (s.op === 'add' || s.op === 'sub') {
      var vd = K.value == null ? [' '] : cellsOf(K.value, b);
      W = Math.max(L.digitsOf(s.g, b).length, L.digitsOf(s.b, b).length, vd.length, L.digitsOf(s.a, b).length);
      rows = [{ cells: cellsOf(s.g, b) }, { cells: cellsOf(s.b, b), sign: CHECK_SIGN[s.op] },
        { kind: 'result', rule: true, cells: vd, aside: K.value == null ? '?' : aside() }];
      s.checkDigits.forEach(function (k) { if (k < W) band.push({ k: k, from: 2, to: 2 }); });
    } else if (s.op === 'mul') {
      // the division line "g:b=q": the dividend's ones at place 0, the quotient right of it; the remainder under it
      var bt = T(s.b, b), qt = T(K.value, b);
      right = 2 + bt.length + qt.length;
      W = L.digitsOf(s.g, b).length;
      rows = [{ at: -right, cells: (T(s.g, b) + ':' + bt + '=' + qt).split('').reverse(), aside: aside() }];
      if (K.rem) rows.push({ kind: 'result', cells: cellsOf(K.rem, b) });
      s.checkDigits.forEach(function (k) { if (k < qt.length) band.push({ k: k - right, from: 0, to: 0 }); });
      if (K.rem) cellsOf(K.rem, b).forEach(function (x, k) { band.push({ k: k, from: 1, to: 1 }); });
    } else {
      // "q·b", the product, + the remainder (< b?), the sum against the dividend
      var bd = T(s.b, b);
      right = 1 + bd.length;
      W = Math.max(L.digitsOf(s.g, b).length, L.digitsOf(K.prod, b).length, L.digitsOf(s.r, b).length,
        L.digitsOf(K.value, b).length, L.digitsOf(s.a, b).length);
      rows = [{ at: -right, cells: (T(s.g, b) + '·' + bd).split('').reverse() },
        { cells: cellsOf(K.prod, b) },
        { cells: cellsOf(s.r, b), sign: '+', aside: (K.remOk ? '< ' : '≥ ') + bd },
        { kind: 'result', rule: { from: W - 1, to: 0 }, cells: cellsOf(K.value, b), aside: aside() }];
      s.checkDigits.forEach(function (k) { if (k < W) band.push({ k: k, from: 3, to: 3 }); });
      if (!K.remOk) cellsOf(s.r, b).forEach(function (x, k) { band.push({ k: k, from: 2, to: 2 }); });
    }
    places = placeLabels(b, W);
    // the division line of a product's check needs no place row: it is read as a line
    return P({ cols: W, right: right, big: child, label: t('paperChk'), places: s.op === 'mul' ? null : places.labels,
      placeTitles: s.op === 'mul' ? null : places.titles, band: band, rows: rows });
  }
  function checkVerdict(s) {
    var b = s.base, K = s.check, child = audience === 'child';
    var a = N(s.a, b), v = K.value == null ? null : N(K.value, b);
    var ok = s.correct;
    var key, vars;
    if (s.op === 'add' && K.less) { key = child ? 'chkLessC' : 'chkLess'; vars = { g: N(s.g, b), b: N(s.b, b) }; }
    else if (s.op === 'div' && K.eq && !K.remOk) { key = child ? 'chkRemC' : 'chkDivRem'; vars = { r: N(s.r, b), b: N(s.b, b) }; }
    else if (child && s.op === 'mul' && K.rem) { key = 'chkMulRemC'; vars = { r: N(K.rem, b) }; }
    else if (child) { key = ok ? 'chkOkC' : 'chkBadC'; vars = { v: v, a: a }; }
    else if (s.op === 'mul') {
      key = ok ? 'chkMulOk' : K.rem ? 'chkMulRem' : 'chkBad';
      vars = { g: N(s.g, b), b: N(s.b, b), q: N(K.value, b), r: N(K.rem, b), a: a, v: v };
    } else { key = ok ? 'chkOk' : 'chkBad'; vars = { v: v, a: a }; }
    return verdictLine(ok ? 'ok' : 'bad', ok ? '✓' : '✗', tp(key, vars));
  }
  function causeLine(s) {
    var b = s.base, w = s.at;
    var vars = {};
    if (s.op === 'add' && s.kind === 'carry') vars = { col: col(b, w.k), s: plain(T(w.sum, b)), d: plain(L.DIGITS[w.sum % b]), c: plain(T(Math.floor(w.sum / b), b)) };
    else if (s.op === 'add' && s.kind === 'lastCarry') vars = { col: col(b, w.k - 1), b: plain(b) };
    else if (s.op === 'sub' && s.kind === 'borrow') vars = { col: col(b, w.k) };
    else if (s.op === 'sub' && s.kind === 'align') vars = { n: N(s.b, b), m: N(w.moved, b) };
    else if (s.op === 'mul' && s.kind === 'carry') {
      vars = { x: plain(L.DIGITS[L.digitsOf(s.a, b)[w.i]]), y: plain(L.DIGITS[L.digitsOf(s.b, b)[w.j]]), p: plain(T(w.prod, b)),
        d: plain(L.DIGITS[w.prod % b]), c: plain(T(w.carry, b)) };
    } else if (s.op === 'div' && s.kind === 'rest') vars = { w: plain(L.DIGITS[w.q - 1]), q: plain(L.DIGITS[w.q]) };
    return h('p', { class: 'ck-cause' }, h('b', null, t('causeHead') + ': '), h('span', null, tp('cause_' + s.op + '_' + s.kind, vars)));
  }
  function chkBox(s, p) {
    var child = audience === 'child';
    if (!p.chk) return closedCard('ck-chk', t('chkHead'), t(child ? 'chkPromptC' : 'chkPrompt_' + s.op), t('chkOpen'), 'V', function () { toggle('chk'); });
    var kids = [cardHead(t('chkHead'), child ? null : t('chkSub_' + s.op), 'V', 'chk')];
    if (!child) kids.push(h('p', { class: 'ck-rule' }, t('chkRule_' + s.op)));
    kids.push(paperBox(checkPaper(s)));
    kids.push(checkVerdict(s));
    if (!child && s.op === 'mul') kids.push(h('p', { class: 'ck-small' }, t('chkWork')));
    if (audience === 'adult') kids.push(h('p', { class: 'ck-small' }, t('chkWhy_' + s.op)));
    if (audience === 'teacher' && s.at) kids.push(causeLine(s));
    return h('section', { class: 'ck-box ck-card ck-chk' }, kids);
  }

  // ── what the stage shows ──
  function render(c) {
    var s = c.state, p = c.params;
    c.stage.replaceChildren(h('div', { class: 'ck', dataset: { aud: audience } },
      taskBox(s, p), h('div', { class: 'ck-cards' }, estBox(s, p), chkBox(s, p))));
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = c.params, b = s.base, A = X();
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(tp('cRefused', { why: notice })); notice = null; }
    if (!p.est && !p.chk) {
      if (A === 'T') add(tp('cIdleT', { task: num(taskLine(s, b), b) }));
      else add(t('cIdle' + A));
    }
    if (p.est) {
      var ev = s.verdict === 'near' ? 'cEstNear' : s.verdict === 'rough' ? 'cEstRough' : s.places && !s.size.zero ? 'cEstPlace' : 'cEstFar';
      if (A === 'C' && ev === 'cEstPlace') ev = 'cEstFar';
      add(tp(ev + (A === 'C' ? 'C' : 'T'), { e: N(s.est.value, b), g: N(s.g, b), places: placesText(Math.abs(s.places)),
        dir: t(s.places > 0 ? 'dirMore' : 'dirLess') }));
    }
    if (p.chk) {
      var K = s.check;
      if (A === 'C') addHl(t(s.correct ? 'cChkOkC' : 'cChkBadC'));
      else {
        var line = plain(checkLine(s));
        if (s.op === 'add' && K.less) addHl(tp('cChkLessT', { g: N(s.g, b), b: N(s.b, b) }));
        else if (s.correct) addHl(tp('cChkOkT', { line: plain(checkLine(s)) }));
        else if (s.op === 'div' && K.eq && !K.remOk) addHl(tp('cChkRemT', { line: line, r: N(s.r, b), b: N(s.b, b) }));
        else if (s.op === 'mul' && K.rem) addHl(tp('cChkMulT', { line: line, r: N(K.rem, b), a: N(s.a, b) }));
        else addHl(tp('cChkBadT', { line: line, a: N(s.a, b) }));
        if (!s.correct) {
          if (p.est && s.verdict !== 'rough') add(t(s.verdict === 'far' ? 'cCaught' : 'cMissed'));
          add(tp('cRightIs', { res: result(s, s.right, s.rightRem) }));
        }
        if (b === 2 && s.op === 'mul' && s.kind === 'shift') add(t('cBinary'));
      }
    }
    if (b !== 10 && A !== 'C' && (p.est || p.chk)) {
      var dl = s.a + ' ' + L.SIGN[s.op] + ' ' + s.b + ' = ' + s.g + (s.op === 'div' && s.r ? ', ' + s.r : '');
      add(tp('cDecimal', { line: plain(dl) }));
    }
    return out;
  }

  // ── the panel: the task field, the given result, the quick bases; the header: the audience switch ──
  var field = null, given = null, quick = null;
  function buildTask() {
    var host = document.querySelector('[data-ck-task]');
    var label = h('label', { class: 'sd-ctl-label', for: 'ck-task' }, h('span', null, ''));
    var input = h('input', { id: 'ck-task', type: 'text', class: 'ck-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', title: t('taskHint'), 'aria-describedby': 'ck-task-msg' });
    // the hint is the field's tooltip; the line under it shows only a refusal (the panel must fit at 1920×1080)
    var msg = h('small', { class: 'sd-hint', id: 'ck-task-msg', role: 'status' }, '');
    var keyOf = { empty: 'errEmpty', gap: 'errGap', op: 'errOp', digit: 'errDigit', long: 'errLong', neg: 'errNeg', zero: 'errZero', rest: 'errRest', count: 'errCount' };
    function clear() { input.removeAttribute('aria-invalid'); msg.textContent = ''; msg.className = 'sd-hint'; }
    input.addEventListener('input', function () {
      var r = L.parseTask(input.value, sim.params.base);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t(keyOf[r.error], { at: r.at, b: sim.params.base });
        msg.className = 'ck-err';
        return;
      }
      clear();
      sim.set(L.paramsFor(r.task));
    });
    // Enter or Esc hands the keys back to the page
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { clear(); sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('taskTitle') },
      h('div', { class: 'ck-field' }, label, input, msg)));
    field = { input: input, label: label.firstChild, clear: clear };
  }
  function buildGiven() {
    var host = document.querySelector('[data-ck-given]');
    var btns = [0, 1, 2].map(function (i) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { pickGiven(i); } }, ''));
    });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('given') },
      h('div', { class: 'ck-field' }, h('span', { class: 'sd-ctl-label', title: t('givenHint') }, t('given')),
        h('div', { class: 'sd-seg ck-given', title: t('givenHint') }, btns))));
    given = { host: host, btns: btns };
  }
  /** The three choices of the given result: right, then the operation's two typical wrong ones. */
  function givenChoices(p) {
    var tk = L.numbersOf(p), b = p.base;
    var right = L.rightOf(tk.op, tk.a, tk.b);
    var out = [{ kind: 'right', g: right.value, r: right.rem || 0 }];
    L.WRONGS[tk.op].forEach(function (k) {
      var w = L.wrongOf(tk.op, tk.a, tk.b, b, k);
      out.push(w ? { kind: k, g: w.g, r: w.r || 0 } : { kind: k, na: true });
    });
    return out;
  }
  function pickGiven(i) {
    var ch = givenChoices(sim.params)[i];
    if (ch.na) { notice = t('gNa'); sim.render(); return; }
    var tk = L.numbersOf(sim.params);
    if (!L.fitsIn({ op: tk.op, a: tk.a, b: tk.b, g: ch.g, r: ch.r }, sim.params.base)) { notice = t('baseTooLong', { b: sim.params.base, num: T(ch.g, sim.params.base) }); sim.render(); return; }
    sim.set({ g: ch.g, r: ch.r });
  }
  function buildQuick() {
    var wrap = document.querySelector('[data-sd-controls] [data-key="base"]');
    if (!wrap) return;
    quick = QUICK.map(function (qb) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { pickBase(qb); } }, String(qb)));
    });
    wrap.append(h('div', { class: 'sd-seg ck-quick', role: 'group', 'aria-label': t('baseQuick'), title: t('baseHint') }, quick));
  }
  function tooLong(nb, p) {
    var tk = L.numbersOf(p);
    if (L.fitsIn(tk, nb)) return null;
    var lim = L.LIMITS[tk.op];
    var bad = L.digitsOf(tk.a, nb).length > lim[0] ? tk.a : L.digitsOf(tk.b, nb).length > lim[1] ? tk.b
      : L.digitsOf(tk.g, nb).length > L.MAX_G ? tk.g : tk.r;
    return t('baseTooLong', { b: nb, num: T(bad, p.base) });
  }
  function pickBase(nb) {
    var why = tooLong(nb, sim.params);
    if (why) { notice = why; sim.render(); return; }
    sim.set({ base: nb });
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints,
      onChange: function (a) { audience = a; enforceChild(); sim.render(); } });
    audience = ctl.value;
  }
  /** The child view works in base 10 only. */
  function enforceChild() {
    if (audience !== 'child' || sim.params.base === 10) return;
    if (L.fitsIn(L.numbersOf(sim.params), 10)) sim.set({ base: 10 });
    else sim.set(Object.assign(L.paramsFor(L.numbersOf(L.defaults)), { base: 10 }));
  }
  /** The child view hides the presets in other bases. */
  function syncChildPresets() {
    var btns = document.querySelectorAll('[data-sd-presets] .sd-preset');
    L.PRESETS.forEach(function (pr, i) { if (btns[i]) btns[i].hidden = audience === 'child' && (pr.params.base || 10) !== 10; });
  }

  function syncPanel(c) {
    var p = c.params, s = c.state;
    if (field) {
      field.label.textContent = t('taskLabel', { b: p.base });
      var shown = L.parseTask(field.input.value, p.base);
      var tk = L.numbersOf(p);
      var same = !shown.error && ['op', 'a', 'b', 'g', 'r'].every(function (k) { return shown.task[k] === tk[k]; });
      // typing keeps its text; a preset or a base change under a focused field rewrites it and clears an error
      if (document.activeElement !== field.input || !same) {
        if (document.activeElement !== field.input || !field.input.getAttribute('aria-invalid')) {
          field.input.value = L.taskText(tk, p.base);
          field.clear();
        }
      }
    }
    if (given) {
      given.host.hidden = audience !== 'teacher';
      givenChoices(p).forEach(function (ch, i) {
        var btn = given.btns[i];
        btn.textContent = t(ch.kind === 'right' ? 'gRight' : 'g_' + s.op + '_' + ch.kind);
        btn.setAttribute('aria-pressed', String(s.kind === ch.kind));
        btn.setAttribute('aria-disabled', ch.na ? 'true' : 'false');
        btn.title = ch.na ? t('gNa') : '';
      });
    }
    if (quick) {
      quick.forEach(function (btn, i) {
        var why = tooLong(QUICK[i], p);
        btn.setAttribute('aria-pressed', String(p.base === QUICK[i]));
        btn.setAttribute('aria-disabled', why ? 'true' : 'false');
        btn.title = why || '';
      });
    }
    syncChildPresets();
  }

  buildAudience();
  buildTask();
  buildGiven();

  var hiddenRange = function (key, max) {
    return { key: key, type: 'range', label: t('taskTitle'), value: L.defaults[key], min: 0, max: max, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      // the cards: opened and closed on the stage (buttons) and with E and V; here so the URL carries them
      { key: 'est', type: 'toggle', label: t('est'), value: L.defaults.est, visible: function () { return false; } },
      { key: 'chk', type: 'toggle', label: t('chk'), value: L.defaults.chk, visible: function () { return false; } },
      { key: 'base', type: 'range', label: t('base'), value: L.defaults.base, min: function (p) { return Math.min(L.MAX_BASE, L.minBase(L.numbersOf(p))); }, max: L.MAX_BASE,
        format: function (v) { return NAMED[v] ? v + ' (' + t(NAMED[v]) + ')' : String(v); },
        visible: function () { return audience !== 'child'; } },
      // the task: set from the field and the given-result buttons, kept here so the URL and the language switch carry it
      { key: 'op', type: 'choice', label: t('taskTitle'), value: L.defaults.op, options: L.OPS.map(function (o) { return [o, t('op_' + o)]; }),
        visible: function () { return false; } },
      hiddenRange('a', L.MAX_V), hiddenRange('b', L.MAX_V), hiddenRange('g', L.MAX_GV), hiddenRange('r', L.MAX_RV)
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t('pHint_' + pr.params.op), params: pr.params };
    }),

    keys: [
      { key: 'e', label: t('estKey'), run: function () { toggle('est'); } },
      { key: 'v', label: t('chkKey'), run: function () { toggle('chk'); } }
    ],

    legend: [
      { shape: 'pc-band', label: t('legBand') },
      { shape: 'ck-wrong', label: t('legWrong') }
    ],

    render: render,
    caption: caption
  });
  buildQuick();
  // a URL value the kit clamped to the range may not fit the base or the operation: keep the task the page shows
  var tk0 = L.numbersOf(sim.params), p0 = sim.params;
  if (['a', 'b', 'g', 'r'].some(function (k) { return tk0[k] !== p0[k]; }) || tk0.op !== p0.op) sim.set(L.paramsFor(tk0));
  sim.on(function (c) { if (audience === 'child' && c.params.base !== 10) enforceChild(); });
  enforceChild();
  sim.render();
})();
</script>
</body>
</html>
