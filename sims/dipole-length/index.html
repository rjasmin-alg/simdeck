<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var CP = L.CP;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var D2R = Math.PI / 180;
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function pct(v) { var q = Math.abs(v * 100); return num(q, q > 0 && q < 9.95 ? 1 : 0) + ' %'; }
  function deg(v) { return t('deg', { v: num(v, Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1) }); }
  function ohm(v) {
    if (v === null) return t('ohmInf');
    if (v > L.RIN_CAP) return t('ohmHuge');
    if (v >= 999.5) return t('kohm', { v: num(v / 1000, 2) });
    return t('ohm', { v: num(v, v >= 99.95 ? 0 : v >= 9.995 ? 1 : 2) });
  }
  function lenTxt(v) { return t('lenCell', { v: num(v, 2) }); }
  function dbi(v) { return t('dbi', { v: num(v, 2) }); }
  function dbDown(v) { return num(-v, 1) + ' dB'; }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    (function add(list) {
      for (var i = 0; i < list.length; i++) {
        if (Array.isArray(list[i])) add(list[i]);
        else if (list[i] != null) e.append(list[i]);
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function arrowHead(x, y, ux, uy, size, cls) {
    var hw = 0.55 * size;
    return s('polygon', { class: cls, points: pts([
      [x, y], [x - ux * size - uy * hw, y - uy * size + ux * hw], [x - ux * size + uy * hw, y - uy * size - ux * hw]]) });
  }

  // ── the wire and its current: the wire vertical, the feed in the middle, a fixed scale (2 λ and λ/4 past each end) ──
  function drawWire(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var defs = s('defs', null, s('pattern', { id: 'dl-hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
      s('line', { class: 'dl-hatchline', x1: 0, y1: 0, x2: 0, y2: 8 })));
    svg.append(defs);
    svg.append(s('text', { class: 'dl-title', x: 0.2 * r0, y: 1.2 * r0 }, t('wireTitle')));
    var top = 2.4 * r0, bottom = H - 1.4 * r0, cy = (top + bottom) / 2, sc = (bottom - top) / 2.5;
    var cx = W / 2, A = Math.min(W * 0.34, 9 * r0);
    var half = st.len / 2;
    function Y(sv) { return cy - sv * sc; }
    function wave(sv) { return Math.sin(2 * Math.PI * (half - Math.abs(sv))); }   // the standing wave, also past the ends

    // the standing wave's envelope ±|I|: on the wire and faint for λ/4 past each end, where the next crest would be
    [[-half - 0.25, -half, 'dl-ghost'], [-half, half, 'dl-env'], [half, half + 0.25, 'dl-ghost']].forEach(function (seg) {
      [1, -1].forEach(function (side) {
        var line = [];
        for (var k = 0; k <= 60; k++) { var sv = seg[0] + (seg[1] - seg[0]) * k / 60; line.push([cx + side * Math.abs(wave(sv)) * A, Y(sv)]); }
        svg.append(s('polyline', { class: seg[2], points: pts(line) }));
      });
    });

    // the current now, I(s)·cos ωt: one filled shape per segment of one sign (end segments solid, reversed hatched)
    var cut = [0];
    st.reversed.forEach(function (r) { if (r[0] > 0) cut.push(r[0]); cut.push(r[1]); });
    cut.push(half);
    cut = cut.filter(function (v, i, a) { return i === 0 || v > a[i - 1] + 1e-9; });
    function isRev(m) { return st.reversed.some(function (r) { return m > r[0] && m < r[1]; }); }
    var cosT = st.cosT;
    for (var sgn = -1; sgn <= 1; sgn += 2) {
      for (var i = 0; i + 1 < cut.length; i++) {
        var a = cut[i], b = cut[i + 1], rev = isRev((a + b) / 2), poly = [];
        for (var k = 0; k <= 40; k++) {
          var sv = sgn * (a + (b - a) * k / 40);
          poly.push([cx + CP.current(st.len, sv) * cosT * A, Y(sv)]);
        }
        poly.push([cx, Y(sgn * b)]); poly.push([cx, Y(sgn * a)]);
        svg.append(s('polygon', rev ? { class: 'dl-rev', fill: 'url(#dl-hatch)', points: pts(poly) } : { class: 'dl-cur', points: pts(poly) }));
        // an arrow on the wire at the segment's middle: up for current flowing up now, down for down
        var mid = sgn * (a + b) / 2, now = CP.current(st.len, mid) * cosT;
        if (Math.abs(now) > 0.08 && Math.abs(b - a) * sc > 1.6 * r0) {
          var dir = now > 0 ? -1 : 1;
          svg.append(arrowHead(cx, Y(mid) + dir * 0.55 * r0, 0, dir, 1.1 * r0, rev ? 'dl-headrev' : 'dl-head'));
        }
      }
    }

    // the wire with its feed gap and generator
    svg.append(s('line', { class: 'dl-wire', x1: cx, y1: Y(half), x2: cx, y2: Y(0.012) }));
    svg.append(s('line', { class: 'dl-wire', x1: cx, y1: Y(-0.012), x2: cx, y2: Y(-half) }));
    svg.append(s('circle', { class: 'dl-feed', cx: cx, cy: cy, r: 0.32 * r0 }));

    // labels: the zeros at the ends, the feed current, the crest, the reversed segment, a λ/2 scale bar
    svg.append(s('text', { class: 'dl-halo', x: cx, y: Y(half) - 0.5 * r0, 'text-anchor': 'middle' }, t('endZero')));
    svg.append(s('text', { class: 'dl-halo', x: cx, y: Y(-half) + 1.3 * r0, 'text-anchor': 'middle' }, t('endZero')));
    svg.append(s('text', { class: 'dl-halo dl-title', x: 0.2 * r0, y: cy + 0.35 * r0 },
      st.feedOpen ? t('feedZero') : t('feedLabel', { p: pct(st.feedPct) })));
    if (st.len >= 0.5) {
      var cs = half - 0.25, cyy = Y(cs), cxx = cx + Math.abs(wave(cs)) * A;
      svg.append(s('circle', { class: 'dl-crest', cx: cxx, cy: cyy, r: 0.28 * r0 }));
      svg.append(s('text', { class: 'dl-halo dl-mute', x: cxx + 0.5 * r0, y: cyy + 0.35 * r0 }, t('crestLabel')));
    }
    if (st.hasReversed) {
      var rv = st.reversed[0], ry = Y((rv[0] + rv[1]) / 2);
      if (Math.abs(ry - cy) < 1.2 * r0) ry = cy - 1.3 * r0;
      svg.append(s('text', { class: 'dl-halo', x: W - 0.2 * r0, y: ry + 0.35 * r0, 'text-anchor': 'end' }, t('revLabel')));
    }
    var bx = W - 1.0 * r0, by1 = bottom, by0 = bottom - 0.5 * sc;
    svg.append(s('line', { class: 'dl-scale', x1: bx, y1: by0, x2: bx, y2: by1 }));
    svg.append(s('line', { class: 'dl-scale', x1: bx - 0.4 * r0, y1: by0, x2: bx + 0.4 * r0, y2: by0 }));
    svg.append(s('line', { class: 'dl-scale', x1: bx - 0.4 * r0, y1: by1, x2: bx + 0.4 * r0, y2: by1 }));
    svg.append(s('text', { class: 'dl-halo', x: bx - 0.6 * r0, y: (by0 + by1) / 2 + 0.35 * r0, 'text-anchor': 'end' }, t('scaleHalf')));
    box.replaceChildren(svg);
  }

  // ── the pattern in the plane through the wire: field over an isotropic radiator of the same power, wire vertical ──
  var R_MAX = 1.85;                                   // √D at its largest over the slider (1.81 at 1.25 λ) fits
  function drawPattern(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'dl-title', x: 0.2 * r0, y: 1.2 * r0 }, t('patTitle')));
    var top = 2.2 * r0, cx = W / 2, cy = top + (H - top) / 2, Rp = Math.min(W / 2 - 1.2 * r0, (H - top) / 2 - 1.4 * r0) / R_MAX;
    function P(th, r) { return [cx + r * Rp * Math.sin(th * D2R), cy - r * Rp * Math.cos(th * D2R)]; }
    function curve(fn) { var out = []; for (var th = 0; th <= 360; th += 1) out.push(P(th, fn(th))); return out; }
    [0.5, 1.5].forEach(function (r) { svg.append(s('circle', { class: 'dl-ring', cx: cx, cy: cy, r: r * Rp })); });
    svg.append(s('line', { class: 'dl-axis', x1: cx, y1: cy - R_MAX * Rp, x2: cx, y2: cy + R_MAX * Rp }));
    svg.append(s('text', { class: 'dl-halo dl-mute', x: cx + 0.4 * r0, y: cy - R_MAX * Rp + 0.9 * r0 }, t('patAxis')));
    svg.append(s('circle', { class: 'dl-iso', cx: cx, cy: cy, r: Rp }));
    var li = P(225, 1);
    svg.append(s('text', { class: 'dl-halo dl-mute', x: li[0] - 0.3 * r0, y: li[1] + 1.2 * r0, 'text-anchor': 'end' }, t('patIso')));
    svg.append(s('polyline', { class: 'dl-shortref', points: pts(curve(L.shortRef)) }));
    var pat = L.patternPolar(st.len, 1);
    svg.append(s('polygon', { class: 'dl-pattern', points: pts(pat.map(function (q) { return P(q.theta, q.r); })) }));
    // the main lobe (upper right quadrant) and its half-power lines
    var peak = Math.sqrt(st.d), m = st.main;
    [m - st.beamwidth / 2, m + st.beamwidth / 2].forEach(function (th) {
      var q = P(th, R_MAX * 0.98);
      svg.append(s('line', { class: 'dl-hp', x1: cx, y1: cy, x2: q[0], y2: q[1] }));
    });
    var pk = P(m, peak);
    svg.append(s('line', { class: 'dl-mainline', x1: cx, y1: cy, x2: pk[0], y2: pk[1] }));
    // its angle above the outer end of the main-lobe direction, ending inside the panel
    var lab = P(m, R_MAX * 0.98), wide = m > 60;
    svg.append(s('text', { class: 'dl-halo dl-title', x: Math.min(lab[0] + (wide ? 0 : 1.5 * r0), W - 0.3 * r0), y: lab[1] - 0.6 * r0,
      'text-anchor': 'end' }, t('patMain', { v: deg(m) })));
    // the wire itself at the centre, short and vertical
    svg.append(s('line', { class: 'dl-wire', x1: cx, y1: cy - 1.1 * r0, x2: cx, y2: cy + 1.1 * r0 }));
    svg.append(s('circle', { class: 'dl-feed', cx: cx, cy: cy, r: 0.3 * r0 }));
    box.replaceChildren(svg);
  }

  // ── plot: R_rad and the feed resistance against L, log scale 1 Ω … 10 kΩ ──
  var SWEEP = null;
  function drawPlot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem();
    if (!SWEEP) SWEEP = L.sweep(0.01);
    var pad = { l: 3.6 * r0, r: 0.8 * r0, t: 1.9 * r0, b: 1.5 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (len) { return pad.l + (len - L.LEN_MIN) / (L.LEN_MAX - L.LEN_MIN) * cw; };
    var Y = function (r) { return pad.t + ch * (1 - Math.log10(Math.max(1, Math.min(1e4, r))) / 4); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'dl-title', x: 0.2 * r0, y: 1.2 * r0 }, t('plotTitle')));
    svg.append(s('rect', { class: 'dl-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [0.5, 1, 1.5, 2].forEach(function (x) {
      if (x < 2) svg.append(s('line', { class: 'dl-grid', x1: X(x), x2: X(x), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(x), y: H - 0.15 * r0, 'text-anchor': x === 2 ? 'end' : 'middle' }, t('tickLen', { v: num(x, x % 1 ? 1 : 0) })));
    });
    [[1, t('ohm', { v: '1' })], [10, t('ohm', { v: '10' })], [100, t('ohm', { v: '100' })], [1000, t('kohm', { v: '1' })], [10000, t('kohm', { v: '10' })]].forEach(function (yv) {
      if (yv[0] > 1 && yv[0] < 1e4) svg.append(s('line', { class: 'dl-grid', x1: pad.l, x2: pad.l + cw, y1: Y(yv[0]), y2: Y(yv[0]) }));
      svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(yv[0]) + 0.32 * r0, 'text-anchor': 'end' }, yv[1]));
    });
    function series(key, cls) {
      var run = [], above = null;                    // above: the x of the last sample clipped at the top edge
      function flush() { if (run.length > 1) svg.append(s('polyline', { class: cls, points: pts(run) })); run = []; }
      SWEEP.forEach(function (q) {
        var v = q[key];
        if (v === null || v > 1e4) { if (v !== null) run.push([X(q.len), Y(1e4)]); flush(); above = v === null ? null : X(q.len); return; }
        if (!run.length && above !== null) run.push([above, Y(1e4)]);   // coming down from above the top edge
        above = null;
        run.push([X(q.len), Y(v)]);
      });
      flush();
    }
    series('rShort', 'dl-sShort');
    series('rIn', 'dl-sIn');
    series('rRad', 'dl-sRad');
    svg.append(s('line', { class: 'dl-now', x1: X(st.len), x2: X(st.len), y1: pad.t, y2: pad.t + ch }));
    svg.append(s('circle', { class: 'dl-nowdot', cx: X(st.len), cy: Y(st.rRad), r: 0.32 * r0 }));
    if (st.rIn !== null && st.rIn <= 1e4 && Math.abs(st.rIn - st.rRad) > 1e-6) {
      svg.append(s('rect', { class: 'dl-nowdot', x: X(st.len) - 0.3 * r0, y: Y(st.rIn) - 0.3 * r0, width: 0.6 * r0, height: 0.6 * r0 }));
    }
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'dl-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var feed = st.feedOpen ? '0 %' : pct(st.feedPct);
    if (st.feedReversed) feed = t('pctRev', { p: feed });
    return h('table', { class: 'dl-table' }, h('tbody', null,
      row(t('rowLen'), lenTxt(st.len), true),
      row(t('rowMetres'), t('metres', { v: num(st.metres, 2) })),
      row(t('rowFeed'), feed),
      row(t('rowRrad'), ohm(st.rRad), true),
      row(t('rowRin'), ohm(st.rIn), true),
      row(t('rowD'), t('dCell', { d: num(st.d, 2), b: dbi(st.dbi) })),
      row(t('rowMain'), deg(st.main)),
      row(t('rowBw'), deg(st.beamwidth))));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'len', type: 'range', label: t('len'), min: L.LEN_MIN, max: L.LEN_MAX, step: L.LEN_STEP, format: function (v) { return t('lenVal', { v: num(v, 2) }); } },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'dl-cur', label: t('legendNow') },
      { shape: 'dl-rev', label: t('legendRev') },
      { shape: 'dl-env', label: t('legendEnv') },
      { shape: 'dl-pattern', label: t('legendPattern') },
      { shape: 'dl-iso', label: t('legendIso') },
      { shape: 'dl-short', label: t('legendShort') }
    ],

    render: function (c) {
      var wp = h('div', { class: 'dl-pic dl-wirepic' }), pp = h('div', { class: 'dl-pic dl-patpic' }), pl = h('div', { class: 'dl-box' });
      var keys = h('p', { class: 'dl-keys' },
        h('span', null, h('span', { class: 'dl-key-rad' }), t('seriesRad')),
        h('span', null, h('span', { class: 'dl-key-in' }), t('seriesIn')),
        h('span', null, h('span', { class: 'dl-key-short' }), t('seriesShort')));
      c.stage.replaceChildren(h('div', { class: 'dl' }, wp, pp,
        h('div', { class: 'dl-side' }, table(c.state), h('p', { class: 'dl-units' }, t('units')), keys, pl)));
      drawWire(wp, c.state);
      drawPattern(pp, c.state);
      drawPlot(pl, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var w = st.hasReversed ? 2 * (st.reversed[0][1] - st.reversed[0][0]) : 0;
      var vars = {
        feed: b(pct(st.feedPct)), w: b(lenTxt(w)),
        dbi: b(dbi(st.dbi)), bw: b(deg(st.beamwidth)), main: b(deg(st.main)),
        side: b(st.sideDb === null ? '' : dbDown(st.sideDb)), bs: b(st.broadDb === null ? '' : dbDown(st.broadDb)),
        r: b(ohm(st.rRad)), rin: b(ohm(st.rIn)), rs: b(ohm(st.rShort)), pct: b(st.pctHalf === null ? '' : pct(st.pctHalf))
      };
      var len = st.len, parts = [];
      function say(key) { if (parts.length) parts.push(' '); parts = parts.concat(t.parts(key, vars)); }
      // the current
      if (len < 0.5) say('cur_short');
      else if (len === 0.5) say('cur_half');
      else if (len < 1) say('cur_mid');
      else if (len === 1) say('cur_full');
      else { say('cur_rev'); say(st.feedOpen ? 'cur_revZero' : 'cur_revFeed'); }
      // the pattern
      if (!st.broadside) say(st.broadDb === null ? 'pat_null' : 'pat_split');
      else if (st.sideDb !== null && st.sideDb > -20) say('pat_side');
      else say(len <= 0.3 ? 'pat_short' : len <= 0.5 ? 'pat_one' : 'pat_narrow');
      // the resistance
      if (len <= 0.3) { say('res_short'); if (len <= 0.25) say('res_loss'); }
      else if (len < 0.5) say('res_mid');
      else if (len === 0.5) say('res_half');
      else if (st.feedHuge) say('res_open');
      else if (st.feedHigh) say('res_high');
      else if (st.atCrest) say('res_crest');
      else say('res_long');
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
