   responses take the colour of their status class (2xx c3, 3xx c4, 4xx c2, 5xx c5) and always its badge. */
[data-sim="http-exchange"] .hx {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 30rem);
  gap: 1.2cqw;

  padding: 1.4cqh 1cqw;
  font-size: 0.9rem;
}
[data-sim="http-exchange"] .hx-col { display: flex; flex-direction: column; gap: 1.2cqh; min-height: 0; }
[data-sim="http-exchange"] .hx-mid > .sd-seq { flex: 1 1 0; min-height: 0; }
[data-sim="http-exchange"] .hx-box {
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 0.45rem 0.7rem 0.55rem;
}
[data-sim="http-exchange"] .hx-box h2 { margin: 0 0 0.35rem; font-size: 1rem; font-weight: 700; }

[data-sim="http-exchange"] .hx-bands > dt {

  border-left: 0.3rem solid var(--line);
}

[data-sim="http-exchange"] .hx-bands > dt[data-band="headers"] { border-left-style: double; border-left-width: 0.4rem; }

/* changed marks here are a yellow fill with a thin ink outline: the kit's halo would cover the neighbouring lines */
[data-sim="http-exchange"] .hx-line.sd-changed, [data-sim="http-exchange"] .hx-card .sd-changed {
  --ink: var(--on-hl); --muted: var(--on-hl); --bg: var(--hl);

}

/* the status class badge: the class text always, the colour on top */

  font-family: var(--mono); font-weight: 700; line-height: 1.35; white-space: nowrap;
}
[data-sim="http-exchange"] [data-cls="1"] { --cls: var(--c6); }

[data-sim="http-exchange"] .hx-tab td:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }

[data-sim="http-exchange"] .hx-tab td.hx-wrap { white-space: normal; overflow-wrap: anywhere; }

[data-sim="http-exchange"] .hx-tab tr[data-st="hit"] > td:first-child { border-left: 0.18rem solid var(--ink); }

[data-sim="http-exchange"] .hx-tab tr.sd-changed { outline: none; box-shadow: none; }
[data-sim="http-exchange"] .hx-tab tr.sd-changed > td { --ink: var(--on-hl); --muted: var(--on-hl); background: var(--hl); color: var(--on-hl); }

/* lane cards */
[data-sim="http-exchange"] .hx-card { margin: 0.1rem 0 0; font-size: var(--fs-sm); line-height: 1.3; }
[data-sim="http-exchange"] .hx-card p { margin: 0; overflow-wrap: anywhere; }
[data-sim="http-exchange"] .hx-card p + p { margin-top: 0.25rem; }

/* The kit sets [hidden] on a control whose visible() is false, but .sd-ctl's display wins (NOTES.md, Shared requests). */

/* legend swatches (the kit has line, dash and hl) */

  [data-sim="http-exchange"] .hx { height: auto; grid-template-columns: minmax(0, 1fr); padding: 0.4rem; gap: 0.7rem; font-size: 1rem; }
  [data-sim="http-exchange"] .hx-col { gap: 0.7rem; }
  [data-sim="http-exchange"] .hx-mid > .sd-seq { flex: none; }
  [data-sim="http-exchange"] .hx-mid .sd-seq-list { padding-bottom: 1.5rem; }
  [data-sim="http-exchange"] .hx-bands { grid-template-columns: minmax(0, 1fr); }

<div class="sd-page">

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (message text, paths, names, numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'hx-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text)); }
  /** t.parts, with a placeholder node used twice cloned (appending the same node twice would move it). */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (p) {
      if (typeof p === 'string' || p.nodeType === 3) return p;
      var out = seen.indexOf(p) >= 0 ? p.cloneNode(true) : p;
      seen.push(p);
      return out;
    });
  }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function heading(body) { return String(body || '').replace(/<[^>]*>/g, ''); }
  function clsBadge(code) { var k = L.statusClass(code); return h('span', { class: 'hx-cls', dataset: { cls: String(k) }, translate: 'no' }, k + 'xx'); }
  var CLASS_C = { 1: 6, 2: 3, 3: 4, 4: 2, 5: 5 };

  /** The request the settings compose (sent with S). */
  function composed(p) {
    var g = L.sceneOf(p) === 'grafo';
    return [p.method, g ? p.pathG : p.pathL, g ? p.hostG : p.hostL];
  }
  function urlOf(req, scene) { return 'http://' + (req.host || L.SCENES[scene].server) + req.target; }
  function reqLine(m) { return L.startLine(m); }

  // ── the chart (K1) ──

  function renderChart(c) {
    var s = c.state, fresh = c.prev ? c.prev.messages.length : 0, k = 0;
    var rows = s.messages.map(function (m, i) {
      var changed = i >= fresh;
      if (m.dir === 'req') {
        k++;
        var host = L.fieldValues(m.headers, 'Host');
        return { from: 'C', to: 'S', c: 1, label: m.method + ' ' + m.target, changed: changed, time: String(k),
          fields: host.length ? 'Host: ' + host.join(', ') : h('span', null, t('noHost')),
          cause: m.via === 'redirect' ? data('Location', '') : undefined };
      }
      return { from: 'S', to: 'C', c: CLASS_C[L.statusClass(m.code)], label: m.code + ' ' + m.reason, place: 'mid', changed: changed,
        time: String(k), cause: clsBadge(m.code) };
    });
    var lanes = [
      { id: 'C', mark: 'K', c: 1, shape: 'square', name: t('laneClient'), body: clientCard(c) },
      { id: 'S', mark: 'P', c: 6, name: t('laneServer'), tags: data(s.server.name, 'hx-mono hx-sm'), body: serverCard(c) }
    ];
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '4.4rem',
      lanes: lanes,
      rows: rows,
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  function clientCard(c) {
    var s = c.state, p = c.params, got = s.shown;
    var next = s.pending
      ? h('span', null, data(s.pending.method + ' ' + s.pending.target), ' ', data(s.pending.host ? 'Host: ' + s.pending.host : '', 'hx-mono hx-muted'))
      : c.last && !L.canSend(p, composed(p)) ? t('cardFull') : t('cardNone');
    var gotText = !got ? '—' : got.method === 'HEAD' ? [data(got.code, ''), ' · ', t('cardHeadersOnly')]
      : got.body ? [data(got.code, ''), ' · ', data(heading(got.body), '')] : [data(got.code, ''), ' · ', t('cardEmpty')];
    var pendChanged = c.prev && JSON.stringify(c.prev.pending) !== JSON.stringify(s.pending) && s.pending;
    return h('div', { class: 'hx-card' },
      h('p', { class: 'hx-muted' }, t(L.SCENES[s.scene].client === 'browser' ? 'cliBrowser' : 'cliCli')),
      h('p', { class: pendChanged ? 'sd-changed' + anim(c) : null }, h('span', { class: 'hx-muted' }, t('cardNext'), ' '), next),
      h('p', { class: c.state.phase === 'response' ? 'sd-changed' + anim(c) : null }, h('span', { class: 'hx-muted' }, t('cardGot'), ' '), gotText));
  }

  function serverCard(c) {
    var s = c.state, d = s.decision;
    var lines;
    if (s.phase === 'request') lines = [h('p', null, t('srvReads'))];
    else if (!d) lines = [h('p', null, t('srvWaits'))];
    else if (!d.vhost) lines = [h('p', { class: 'sd-changed' + anim(c) }, t(d.hosts ? 'srvTwoHosts' : 'srvNoHost'))];
    else lines = [
      h('p', { class: 'sd-changed' + anim(c) }, data('Host: ' + d.host + ' → ' + d.vhost), d.byDefault ? [' ', t('srvDefault')] : null),
      h('p', null, data(d.path + ' → ' + s.messages[s.messages.length - 1].code))
    ];
    return h('div', { class: 'hx-card' }, h('p', { class: 'hx-muted' }, t('srvKind')), lines);
  }

  // ── right: the message as text ──

  function line(text, marked, c) {
    return h('span', { class: 'hx-line' + (marked ? ' sd-changed' + anim(c) : ''), translate: 'no' }, text, h('span', { class: 'hx-crlf', 'aria-hidden': 'true' }, '↵'));
  }

  function renderMessage(c) {
    var s = c.state, m, st, title;
    if (s.phase === 'start' || !s.messages.length) {
      m = s.pending; st = 'pending'; title = t('msgPending');
    } else {
      m = s.messages[s.messages.length - 1];
      st = m.dir;
      var k = s.messages.filter(function (x) { return x.dir === 'req'; }).length;
      title = t(m.dir === 'req' ? 'msgReq' : 'msgResp', { n: k });
    }
    var box = h('section', { class: 'hx-box hx-msg', dataset: { st: st } }, h('h2', null, title));
    if (!m) return box;
    var isReq = m.dir === 'req';
    var marks = (m.marks || []).map(function (x) { return x.toLowerCase(); });
    var follow = isReq && m.via === 'redirect' && st !== 'pending';
    var dl = h('dl', { class: 'hx-bands' },
      h('dt', { dataset: { band: 'start' } }, t(isReq ? 'bandReqLine' : 'bandStatusLine')),
      h('dd', null, line(L.startLine(m), follow, c)),
      h('dt', { dataset: { band: 'headers' } }, t('bandHeaders')),
      h('dd', null, m.headers.length ? m.headers.map(function (f) { return line(f[0] + ': ' + f[1], marks.indexOf(f[0].toLowerCase()) >= 0, c); })
        : h('span', { class: 'hx-muted' }, t('noHeaders'))),
      h('dt', { dataset: { band: 'empty' } }, t('bandEmpty')),
      h('dd', null, line('', false, c)),
      h('dt', { dataset: { band: 'body' } }, t('bandBody')),
      h('dd', null, m.body ? h('span', { class: 'hx-line', translate: 'no' }, m.body) : h('span', { class: 'hx-muted' }, t('noBody'))));
    box.append(dl);
    if (!isReq) {
      var k5 = L.statusClass(m.code);
      box.append(h('p', { class: 'hx-reads' }, t('reads'), clsBadge(m.code), h('b', null, t('cls' + k5)),
        h('span', { class: 'hx-sm hx-muted' }, '(', data(m.reason, ''), ': ', t('reasonIgnored'), ')')));
    }
    return box;
  }

  // ── right: the server's virtual hosts and the resource table ──

  function renderServer(c) {
    var s = c.state, srv = s.server, d = s.decision;
    var vh = d && d.vhost ? d.vhost : srv.vhosts[0].name;
    var hitVh = d && d.vhost, isNew = s.phase === 'response';
    var box = h('section', { class: 'hx-box' });
    box.append(h('h2', null, t.parts('vhTitle', { srv: data(srv.name, '') })));
    box.append(h('table', { class: 'hx-tab' },
      h('thead', null, h('tr', null, h('th', null, t('colName')), h('th', null, t('colRoot')))),
      h('tbody', null, srv.vhosts.map(function (v) {
        var hit = hitVh && v.name === vh;
        return h('tr', { class: hit && isNew ? 'sd-changed' + anim(c) : null, dataset: { st: hit ? 'hit' : 'other' } },
          h('td', null, data(v.name), v.default ? [' ', h('span', { class: 'hx-sm' }, t('srvDefault'))] : null),
          h('td', null, data(v.root)));
      }))));
    var root = srv.vhosts.filter(function (v) { return v.name === vh; })[0].root;
    var KIND = { redirect: 'kindRedirect', form: 'kindForm', broken: 'kindBroken', unreadable: 'kindUnreadable', hidden: 'kindHidden', none: 'kindNone' };
    var rows = Object.keys(srv.resources).map(function (key) { return srv.resources[key]; }).filter(function (r) { return r.vhost === vh; });
    box.append(h('h3', null, t.parts('resTitle', { root: data(root, '') })));
    box.append(h('table', { class: 'hx-tab' },
      h('thead', null, h('tr', null, h('th', null, t('colPath')), h('th', null, t('colStatus')), h('th', null, t('colContent')))),
      h('tbody', null, rows.map(function (r) {
        var hit = hitVh && d.path === r.path;
        var what = r.kind === 'file' ? data(heading(r.body), '')
          : r.kind === 'redirect' ? [t(KIND[r.kind]), ' → ', data(r.location)] : t(KIND[r.kind]);
        return h('tr', { class: hit && isNew ? 'sd-changed' + anim(c) : null, dataset: { st: hit ? 'hit' : 'other' } },
          h('td', null, data(r.path)), h('td', null, clsBadge(r.status), ' ', data(r.status, '')), h('td', { class: 'hx-wrap' }, what));
      }))));
    return box;
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, ev = s.ev, out;
    var last = s.messages[s.messages.length - 1];
    switch (ev.kind) {
      case 'start': {
        var r = s.pending;
        out = r ? parts('capStart', { client: t(L.SCENES[s.scene].client === 'browser' ? 'cliBrowser' : 'cliCli'), url: B(urlOf(r, s.scene)) }) : [];
        break;
      }
      case 'request': {
        var host = L.fieldValues(last.headers, 'Host');
        if (last.via === 'redirect') {
          out = parts('capReqFollow', { line: B(reqLine(last)) });
          var orig = s.messages[s.messages.length - 3];
          if (orig && orig.method === 'POST') out = out.concat(' ', t('capReqFollowPost'));
        } else if (!host.length) out = parts('capReqNoHost', { line: B(reqLine(last)) });
        else out = parts(last.method === 'POST' ? 'capReqPost' : 'capReq', { line: B(reqLine(last)), host: B(host[0]) });
        if (last.via !== 'redirect') out = out.concat(' ', last.method === 'POST'
          ? parts('capBodyPost', { len: B(L.utf8Length(last.body)) }) : parts('capBodyNone', { method: B(last.method) }));
        break;
      }
      case 'response': {
        var d = s.decision, req = s.messages[s.messages.length - 2];
        var len = L.fieldValues(last.headers, 'Content-Length')[0];
        var v = { path: B(d.path), vh: B(d.vhost || ''), host: B(d.host || ''), len: B(len), method: B(req.method),
          loc: B(L.fieldValues(last.headers, 'Location')[0] || '') };
        if (ev.code === 301) out = parts('capResp301', v);
        else if (ev.code === 400) out = t.parts(d.hosts ? 'capResp400Two' : 'capResp400', v);
        else if (ev.code === 403) out = parts('capResp403', v);
        else if (ev.code === 404) out = t.parts(ev.why === 'hidden' ? 'capResp404Hidden' : 'capResp404', v);
        else if (ev.code === 405) out = parts('capResp405', v);
        else if (ev.code === 500) out = parts('capResp500', v);
        else if (req.method === 'HEAD') out = parts('capRespHead', v);
        else if (ev.why === 'processed') out = parts('capRespPost', v);
        else if (req.via === 'redirect') out = [t.n('capResp200Follow', ev.hops)];
        else if (ev.byDefault) {
          // the second request of `host-missing`: the same request as the one just refused, now with Host
          var before = s.messages[s.messages.length - 3];
          out = parts(before && before.code === 400 && /^[\d.]+$/.test(d.host) ? 'capResp200Ip' : 'capResp200Default', v);
        }
        else out = parts('capResp200', v);
        break;
      }
      default: out = [];
    }
    if (c.last) out = out.concat(' ', t(L.canSend(c.params, composed(c.params)) ? 'capMore' : 'capFull'));
    return out;
  }

  // ── controls: the request the user composes ──

  function isScene(sc) { return function (p) { return L.sceneOf(p) === sc; }; }
  function hostOpts(sc) { return L.SCENES[sc].hosts.map(function (x) { return [x, x || t('hostNone')]; }); }
  function pathOpts(sc) { return L.pathsOf(sc).map(function (x) { return [x, x]; }); }
  var never = function () { return false; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'script', type: 'choice', label: t('presetRedirect'), visible: never, resets: true,
        options: [['redirect', '1'], ['host-missing', '2'], ['wrong-vhost', '3'], ['head-vs-get', '4'], ['not-found-vs-forbidden', '5']] },
      // `sent` (the requests queued with S) is a model param without a control: the kit keeps only controls in the URL,
      // and a hidden range would trip the page check's slider test (NOTES.md, Shared requests).
      { key: 'method', type: 'choice', label: t('method'), options: L.METHODS.map(function (m) { return [m, data(m, '')]; }) },
      { key: 'pathG', type: 'select', label: t('path'), visible: isScene('grafo'), options: pathOpts('grafo') },
      { key: 'pathL', type: 'select', label: t('path'), visible: isScene('lab'), options: pathOpts('lab') },
      { key: 'hostG', type: 'select', label: t('host'), visible: isScene('grafo'), options: hostOpts('grafo') },
      { key: 'hostL', type: 'select', label: t('host'), visible: isScene('lab'), options: hostOpts('lab') },
      { type: 'button', label: t('send'), key: 's', run: function (sim) {
          var p = sim.params, r = composed(p);
          if (!L.canSend(p, r)) { sim.render(); return; }
          sim.set({ sent: L.pushSent(L.sceneOf(p), p.sent, r) });
        } }
    ],

    presets: [
      { id: 'redirect', label: t('presetRedirect'), hint: t('presetRedirectHint'), params: { script: 'redirect' } },
      { id: 'host-missing', label: t('presetHost'), hint: t('presetHostHint'), params: { script: 'host-missing' } },
      { id: 'wrong-vhost', label: t('presetVhost'), hint: t('presetVhostHint'), params: { script: 'wrong-vhost', hostL: 'www2.lab.example' } },
      { id: 'head-vs-get', label: t('presetHead'), hint: t('presetHeadHint'), params: { script: 'head-vs-get', pathG: '/proizvodi', method: 'HEAD' } },
      { id: 'not-found-vs-forbidden', label: t('presetNotFound'), hint: t('presetNotFoundHint'), params: { script: 'not-found-vs-forbidden', pathL: '/skriveno' } }
    ],

    legend: [
      { shape: 'line', label: t('legReq') },
      { shape: 'line', label: t('legResp') },
      { shape: 'badge', label: t('legBadge') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'hx' },
        h('div', { class: 'hx-col hx-mid' }, chart),
        h('div', { class: 'hx-col' }, renderMessage(c), renderServer(c))));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
