<!-- set-who-touches-what: twelve small problems on the set of one fictional production. An explorer: the student picks
     a problem (a tile), then who sorts it out (one of ten departments, the 1st AD, or "I'll fix it myself"), and reads
     what follows: the owner's fix, a pass to the owner, or the harm an outsider's fix does that could not be seen.
     Every tile keeps its outcome in view, and the scoreboard adds the minutes now and later against the three plain
     strategies. Models: crew.js (the shared crew), departments.js (who owns what), sim.js; rules: SPEC.md; words:
     strings.js. -->

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Odjeli: tko smije dirati što</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="crew.js"></script>
<script src="departments.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var MARK = { fixed: '✓', own: '✓', routed: '✓', passed: '↪', harm: '✕' };

  // ── stage controls keep keyboard focus across a re-render ──
  var refocus = null;
  function act(patch, sel) {
    return function (e) {
      refocus = e.currentTarget === document.activeElement ? sel : null;
      window.simdeck.set(patch);
    };
  }
  function noFocus(e) { e.preventDefault(); }

  function choiceName(c) {
    if (c === 'self') return t('choice_self');
    if (c === 'ad') return t('choice_ad');
    return t('dept_' + c);
  }
  function outWord(r) { return r.kind === 'harm' ? t('out_harm') + ': ' + t('harmk_' + r.harm) : t('out_' + r.kind); }
  function minutes(r) {
    if (r.kind === 'open') return '';
    return r.kind === 'harm' ? t('tileHarm', { n: r.now, later: r.later }) : t('tileNow', { n: r.now });
  }

  // ── the twelve tiles ──
  function tiles(s) {
    return h('div', { class: 'wt-tiles' }, s.rows.map(function (r, i) {
      return h('button', {
        type: 'button', class: 'wt-btn wt-tile', dataset: { p: r.id, k: r.kind }, 'aria-pressed': r.id === s.sel ? 'true' : 'false',
        'aria-label': t('tileLabel', { n: i + 1, problem: t('short_' + r.id), outcome: outWord(r) }),
        onmousedown: noFocus, onclick: act({ sel: r.id }, '[data-p="' + r.id + '"]')
      },
      h('span', { class: 'wt-mark', 'aria-hidden': 'true' }, r.kind === 'open' ? String(i + 1) : MARK[r.kind]),
      h('b', null, (i + 1) + '. ' + t('short_' + r.id)),
      h('span', { class: 'wt-out' }, r.kind === 'harm' ? t('harmk_' + r.harm) : t('out_' + r.kind)),
      h('span', { class: 'wt-num wt-min' }, minutes(r)));
    }));
  }

  // ── the selected problem: what you see, who sorts it out, what follows ──
  function picker(r) {
    return h('div', { class: 'wt-pick', role: 'group', 'aria-label': t('pickFor') }, L.CHOICES.map(function (c) {
      var patch = {}; patch[L.key(r.id)] = c;
      return h('button', {
        type: 'button', class: 'wt-btn wt-choice', dataset: { c: c }, 'aria-pressed': r.choice === c ? 'true' : 'false',
        'aria-label': t('choiceLabel', { problem: t('short_' + r.id), choice: choiceName(c) }),
        onmousedown: noFocus, onclick: act(patch, '.wt-choice[data-c="' + c + '"]')
      }, choiceName(c));
    }));
  }
  function result(r) {
    if (r.kind === 'open') return h('div', { class: 'wt-result', dataset: { k: 'open' } }, h('p', null, t('notYet')));
    var out = [h('p', { class: 'wt-owner' }, MARK[r.kind] + ' ' + outWord(r) + ' · ' + t('ownerLabel', { dept: t('dept_' + r.owner), head: t('head_' + r.owner) }))];
    out.push(h('p', null, h('b', null, t('hiddenLabel')), ' ', t('hidden_' + r.id)));
    out.push(h('p', null, r.kind === 'harm' ? t('harm_' + r.id) : t('fix_' + r.id)));
    return h('div', { class: 'wt-result', dataset: { k: r.kind } }, out);
  }
  function detail(s) {
    var i = L.IDS.indexOf(s.sel), r = s.rows[i];
    return h('div', null,
      h('p', { class: 'wt-see' }, h('b', null, (i + 1) + '. ' + t('short_' + r.id) + '.'), t('see_' + r.id)),
      h('p', { class: 'wt-h' }, t('pickFor')),
      picker(r),
      result(r));
  }

  // ── the scoreboard ──
  function cmpRow(label, x, max) {
    return [h('span', null, label + ': ', h('span', { class: 'wt-num' }, x.later ? t('tileHarm', { n: x.now, later: x.later }) : t('minN', { n: x.now }))),
      h('div', { class: 'wt-track' },
        h('div', { class: 'wt-bar', dataset: { k: 'now' }, style: { width: (100 * x.now / max) + '%' } }),
        x.later ? h('div', { class: 'wt-bar', dataset: { k: 'later' }, style: { left: (100 * x.now / max) + '%', width: (100 * x.later / max) + '%' } }) : null)];
  }
  function score(s) {
    var T = s.totals, c = s.compare;
    var max = Math.max(c.self.total, c.ad.total, c.owner.total, T.total, 1);
    var counts = [
      h('span', null, h('b', null, String(T.fixed + T.own + T.routed)), ' ', t('cntFixed')),
      h('span', null, h('b', null, String(T.passed)), ' ', t('cntPassed')),
      h('span', null, h('b', null, String(T.harm)), ' ', t('cntHarm')),
      h('span', null, h('b', null, String(T.open)), ' ', t('cntOpen'))
    ];
    if (T.injury) counts.push(h('b', null, t.n('cntInjury', T.injury)));
    return h('div', { class: 'wt-score' },
      h('div', { class: 'wt-big' },
        h('span', { class: 'wt-num' }, t('minN', { n: T.now })), h('span', null, t('thNow')),
        h('span', { class: 'wt-num' }, t('minN', { n: T.later })), h('span', null, t('thLater')),
        h('span', { class: 'wt-num' }, t('minN', { n: T.total })), h('b', null, t('thTotal'))),
      h('div', { class: 'wt-counts' }, counts),
      h('p', { class: 'wt-h' }, t('compareHead') + ' ' + t('you_' + s.you)),
      h('div', { class: 'wt-cmp' },
        cmpRow(t('cmpOwner'), c.owner, max),
        cmpRow(t('cmpAd'), c.ad, max),
        cmpRow(t('cmpSelf'), c.self, max)));
  }

  // ── caption (SPEC.md "Captions") ──
  function caption(s) {
    var i = L.IDS.indexOf(s.sel), r = s.rows[i];
    var v = { n: i + 1, problem: t('short_' + r.id), now: r.now, later: r.later, dept: t('dept_' + r.owner), head: t('head_' + r.owner) };
    var first;
    if (r.kind === 'open') first = t('capOpen', v);
    else if (r.kind === 'fixed') first = t('capFixed', Object.assign(v, { fix: t('fix_' + r.id) }));
    else if (r.kind === 'own') first = t('capOwn', Object.assign(v, { fix: t('fix_' + r.id) }));
    else if (r.kind === 'routed') first = t('capRouted', Object.assign(v, { fix: t('fix_' + r.id) }));
    else if (r.kind === 'passed') first = t('capPassed', Object.assign(v, { via: t('dept_' + r.via) }));
    else first = t('capHarm', Object.assign(v, { harm: t('harm_' + r.id) }));
    if (s.totals.open === L.IDS.length) return first;
    return first + ' ' + t('capTotals', { now: s.totals.now, later: s.totals.later });
  }

  var hidden = function () { return false; };
  var choiceOptions = [['', '—']].concat(L.CHOICES.map(function (c) { return [c, choiceName(c)]; }));
  var params = [
    { key: 'you', type: 'choice', label: t('you'), hint: t('youHint'),
      options: L.YOU.map(function (y) { return [y, t('you_' + y)]; }) },
    { key: 'sel', type: 'select', label: t('selParam'), visible: hidden,
      options: L.IDS.map(function (id) { return [id, t('short_' + id)]; }) }
  ];
  L.IDS.forEach(function (id) {
    params.push({ key: L.key(id), type: 'select', label: t('choiceParam', { problem: t('short_' + id) }), visible: hidden, options: choiceOptions });
  });

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'wt-fixed', label: '✓ ' + t('legFixed') },
      { shape: 'wt-passed', label: '↪ ' + t('legPassed') },
      { shape: 'wt-harm', label: '✕ ' + t('legHarm') },
      { shape: 'wt-open', label: t('legOpen') }
    ],
    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'wt' },
        tiles(s),
        h('div', { class: 'wt-main' }, detail(s), score(s)),
        h('p', { class: 'wt-foot' }, t('foot'))));
      if (refocus) {
        var b = c.stage.querySelector(refocus);
        if (b) b.focus();
        refocus = null;
      }
    },
    caption: function (c) { return caption(c.state); }
  });
})();
</script>
