<!-- win-dhcp-dns-update: a DHCP server registers DNS records for its clients. A client gets a lease (DISCOVER/OFFER,
     REQUEST/ACK with option 81), then the server and the client send the DNS updates the server's DNS settings call
     for to DC1 (zones corp.example and 10.0.10.in-addr.arpa, both Secure only), which checks prerequisites (Name
     Protection) and each name's owner. Events: DHCP1 down with DHCP2 answering, and a lease expiring.
     Left: the two zones as record tables with owner chips, the DHCP server's DNS settings and leases, and the message
     card. Right: kit view K1 (message sequence chart, kit/sequence.js) with lanes for the client, DHCP1, DHCP2 (failover
     only) and DC1. Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { client: '1', DHCP1: '2', DHCP2: '3', dc: '4' };
  var OPT = { off: 'optOff', onRequest: 'optOnRequest', always: 'optAlways' };
  var OS = { windows: 'osWindows', other: 'osOther', printer: 'osPrinter' };
  var CLIENT_KEY = { windows: 'cWindows', other: 'cOther', printer: 'cPrinter', clash: 'cClash' };

  /** Data (names, addresses, accounts, codes, times) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'dd-mono' : cls || null }, String(text)); }
  function q(text) { return h('b', { translate: 'no' }, String(text)); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule); repeated nodes are cloned. */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function two(v) { return (v < 10 ? '0' : '') + v; }
  function hms(sec) { var r = sec % 86400; return two(Math.floor(r / 3600)) + ':' + two(Math.floor(r % 3600 / 60)) + ':' + two(r % 60); }
  function hm(sec) { var r = sec % 86400; return two(Math.floor(r / 3600)) + ':' + two(Math.floor(r % 3600 / 60)); }
  function stamp(sec) { return t('dayAt', { d: Math.floor(sec / 86400), t: hm(sec) }); }
  function lock() { return h('span', { class: 'dd-lock', 'aria-hidden': 'true' }, h('span', { class: 'sd-seq-lock' })); }
  function sym(k) { return h('span', { class: 'dd-sym', dataset: { k: k }, 'aria-hidden': 'true', translate: 'no' }, { ok: '✓', no: '✕', add: '+', del: '−', to: '→' }[k]); }
  function last(c) { return c.n > 0 ? c.state.msgs[c.state.msgs.length - 1] : null; }
  function srvOf(s, id) { return s.dhcp.filter(function (d) { return d.id === id; })[0]; }
  function fqdn(host) { return host + '.' + L.FWD; }

  /** Owner chip: a server mark for the DHCP servers' accounts, a computer mark for others, an open lock for nobody. */
  function isServerAcc(acc) { return acc === L.SVC || /^DHCP\d\$$/.test(acc); }
  function ownerChip(acc) {
    if (acc === null) return h('span', { class: 'dd-owner', dataset: { k: 'open' } }, h('span', { class: 'dd-open', 'aria-hidden': 'true' }, h('span', { class: 'sd-seq-lock' })), t('ownerNone'));
    return h('span', { class: 'dd-owner' }, h('span', { class: isServerAcc(acc) ? 'dd-srv' : 'dd-pc', 'aria-hidden': 'true' }), data(acc, ''));
  }
  /** "prn-3 A", "62 PTR" as data for lists in captions and cards. */
  function rrList(items) {
    var out = [];
    items.forEach(function (x, i) { if (i) out.push(', '); out.push(data(x, '')); });
    return h('b', null, out);
  }

  // ── zones ──
  function zoneMarks(c, zk) {
    var e = last(c), marks = {};

          : rich('capOkDel', { n: n, list: rrList(e.removed), owner: q(e.items[0].owner) });
        var out;
        var item = e.items[0];
        // the server rewrites a name it owns for the laptop (only while fs1 still led to the file server)
        if (cl.id === 'clash' && e.by !== 'client' && pu.adds[0].type === 'A' && item.exists && item.owner !== null && before && before.data === L.FS1.ip) {
          out = rich('capHijack', { n: n, name: q(nm), owner: q(item.owner), data: q(now.data) });
        } else if (!item.exists) {
          out = now.owner === null ? rich('capOkNewOpen', { n: n, name: q(nm), acc: q(e.principal) }) : rich('capOkNew', { n: n, name: q(nm), owner: q(now.owner) });
        } else if (item.owner === null) {
          out = rich('capOkOpen', { n: n, name: q(nm), data: q(now.data) });
          if (now.owner !== null) out = out.concat(rich('capOkTake', { owner: q(now.owner) }));
        } else {
          out = rich('capOkOwn', { n: n, name: q(nm), owner: q(item.owner), data: q(now.data) });
        }
        // in the failover event the last step leaves DHCP1's old PTR behind
        if (s.event === 'failover' && c.last) {
          var oldPtr = L.find(s.zones.rev.records, L.ptrName(cl.ip), 'PTR');
          // only a PTR the down server wrote (or nobody owns) waits for DHCP1; the client's own PTR is the client's
          if (oldPtr && oldPtr.data === fqdn(cl.host) && (oldPtr.owner === null || isServerAcc(oldPtr.owner))) out = out.concat(rich('capStaleTail', { ptr: q(L.ptrName(cl.ip)) }));
        }
        return out;
      }
      default: return '';
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'client', type: 'select', label: t('pClient'),
        options: L.CLIENT_IDS.map(function (k) { return [k, t(CLIENT_KEY[k])]; }) },
      { key: 'event', type: 'select', label: t('pEvent'),
        options: [['lease', t('evLease')], ['failover', t('evFailover')], ['expiry', t('evExpiry')]] },
      { key: 'mode', type: 'choice', label: t('pMode'),
        options: [['off', t('optOff')], ['onRequest', t('optOnRequest')], ['always', t('optAlways')]] },
      { key: 'legacy', type: 'toggle', label: t('pLegacy'), disabled: function (p) { return L.matters(p).legacy ? false : t('pLegacyOff'); } },
      { key: 'nameProtection', type: 'toggle', label: t('pNp'), disabled: function (p) { return L.matters(p).nameProtection ? false : t('pNpOff'); } },
      { key: 'discard', type: 'toggle', label: t('pDiscard') },
      { key: 'creds', type: 'select', label: t('pCreds'),
        options: [['computer', t('credsComputer')], ['proxy', t('credsProxy')], ['dedicated', t('credsDedicated')]] }
    ],

    presets: [
      { id: 'windows-default', label: t('presetWindows'), hint: t('presetWindowsHint'), params: {} },
      { id: 'failover-refused', label: t('presetFailover'), hint: t('presetFailoverHint'), params: { client: 'printer', legacy: true, event: 'failover' } },
      { id: 'printer-none', label: t('presetPrinter'), hint: t('presetPrinterHint'), params: { client: 'printer' } },
      { id: 'lease-expiry', label: t('presetExpiry'), hint: t('presetExpiryHint'), params: { client: 'other', legacy: true, event: 'expiry' } },
      { id: 'name-protection', label: t('presetNp'), hint: t('presetNpHint'), params: { client: 'clash', nameProtection: true } }
    ],

    legend: [
      { shape: 'dash', label: t('legDhcp') },
      { shape: 'signed', label: t('legSigned') },
      { shape: 'server', label: t('legServer') },
      { shape: 'client', label: t('legClient') },
      { shape: 'open', label: t('legOpen') },
      { shape: 'ok', label: t('legOk') },
      { shape: 'no', label: t('legNo') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'dd' },
        h('div', { class: 'dd-left' }, renderZones(c), h('div', { class: 'dd-row2' }, renderDhcp(c), renderMsg(c))), chart));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
