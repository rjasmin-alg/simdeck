     An explorer: the student picks a scene (tabs), switches its controls on and off on the ladder, and reads the risk
     (likelihood × severity) without controls, on paper and on the day, with the lower controls sometimes forgotten;
     under it 200 seeded runs of the scene with their injuries and the runs where something was forgotten. The tabs
     keep every scene's numbers in view. Model: sim.js; rules: SPEC.md; words: strings.js. -->

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Prvo ukloniti opasnost: redoslijed mjera zaštite</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var MAX = 25;   // the bars' scale: the highest score on a 5 × 5 matrix

  /** A number with `dp` decimals and the page language's decimal mark. */
  function num(x, dp) { return String(x.toFixed(dp)).replace('.', t('dec')); }
  /** An expected value: one decimal, or a whole number when it is one (16, not 16.0). */
  function day(x) { return Math.abs(x - Math.round(x)) < 1e-9 ? String(Math.round(x)) : num(x, 1); }
  function pct(x) { return String(Math.round(100 * x)); }

  // ── stage controls keep keyboard focus across a re-render ──
  var refocus = null;
  function act(patchFn, sel) {
    return function (e) {
      var p = patchFn(window.simdeck.params);
      if (!p) return;
      refocus = e.currentTarget === document.activeElement ? sel : null;
      window.simdeck.set(p);
    };
  }
  function noFocus(e) { e.preventDefault(); }

  // ── the scene tabs ──
  function tabs(s) {
    return h('div', { class: 'rc-tabs' }, s.scenes.map(function (x, k) {
      return h('button', {
        type: 'button', class: 'rc-btn rc-tab', dataset: { scene: x.id }, 'aria-pressed': k === s.scene ? 'true' : 'false',
        onmousedown: noFocus, onclick: act(function () { return { scene: x.id }; }, '[data-scene="' + x.id + '"]')
      },
      h('b', null, t('scene_' + x.id)),
      h('span', { class: 'rc-tabrow' },
        h('span', { class: 'rc-num' }, t('tabKept', { s0: x.s0, d: day(x.day) })),
        h('span', null, t.n('tabHurt', x.hurt))));
    }));
  }

  // ── the ladder ──
  function effects(sc, lv) {
    if (lv === 'remove') return [h('b', null, t('effGone'))];
    var d = L.SCENES[L.SCENE_IDS.indexOf(sc.id)].c[lv], out = [];
    if (d[0]) out.push(h('b', null, t('effL', { n: d[0] })));
    if (d[1]) out.push(h('b', null, t('effI', { n: d[1] })));
    if (!out.length) out.push(h('span', { dataset: { none: '' } }, t('effNone')));
    return out;
  }
  function ladder(sc) {
    return h('div', { class: 'rc-ladder' }, L.LEVEL_IDS.map(function (lv, k) {
      var on = sc.chosen.indexOf(lv) >= 0;
      return h('button', {
        type: 'button', class: 'rc-btn rc-ctl', dataset: { k: String(k), lv: lv }, 'aria-pressed': on ? 'true' : 'false',
        'aria-label': t('ctlLabel', { level: t('level_' + lv), control: t('c_' + sc.id + '_' + lv) }),
        onmousedown: noFocus, onclick: act(function (q) { return L.toggle(q, sc.id, lv); }, '[data-lv="' + lv + '"]')
      },
      h('span', { class: 'rc-box', 'aria-hidden': 'true' }, String(k + 1)),
      h('span', { class: 'rc-lvl' }, t('level_' + lv)),
      h('span', { class: 'rc-what' }, t('c_' + sc.id + '_' + lv)),
      h('span', { class: 'rc-eff' }, effects(sc, lv), h('span', null, t('fail_' + lv))));
    }));
  }

  // ── the risk bars ──
  function bar(k, v) { return h('div', { class: 'rc-track' }, h('div', { class: 'rc-bar', dataset: { k: k }, style: { width: (100 * v / MAX) + '%' } })); }
  function barRow(label, track, value) {
    return h('div', { class: 'rc-barrow' }, h('span', { class: 'rc-blabel' }, label), track, h('span', { class: 'rc-num rc-bval' }, value));
  }
  function risk(sc) {
    var paper = sc.removed ? t('removed') : t('scoreLI', { l: sc.l1, i: sc.i1, s: sc.s1 });
    var lines = sc.removed ? null : h('p', { class: 'rc-lines' },
      t('lik', { l: sc.l1, p: Math.round(100 * L.P_RUN[sc.l1]) }) + ' · ' + t('sev', { i: sc.i1, name: t('sev_' + sc.i1) }));
    return h('div', null,
      h('p', { class: 'rc-h' }, t('head_risk')),
      h('div', { class: 'rc-bars' },
        barRow(t('row_inh'), bar('inh', sc.s0), t('scoreLI', { l: sc.l0, i: sc.i0, s: sc.s0 })),
        barRow(t('row_paper'), bar('paper', sc.s1), paper),
        barRow(t('row_day'), bar('day', sc.day), t('dayVal', { s: day(sc.day) }))),
      lines,
      h('p', { class: 'rc-kept' }, t('kept', { p: pct(sc.kept) })));
  }

  // ── the runs ──
  function runs(s, sc) {
    var cells = sc.runs.map(function (r) {
      var a = { class: 'rc-cell', dataset: {} };
      if (r.miss.length) a.dataset.miss = '';
      if (r.sev) a.dataset.sev = String(r.sev);
      if (r.sev >= L.SERIOUS) a.dataset.serious = '';
      return h('span', a, r.sev ? String(r.sev) : null);
    });
    var hurt = t.n('hurtN', sc.hurt), serious = t.n('seriousN', sc.serious);
    return h('div', { class: 'rc-runs' },
      h('p', { class: 'rc-h' }, t('head_runs', { n: L.RUNS, seed: s.seed })),
      h('div', { class: 'rc-grid', role: 'img', 'aria-label': t('gridLabel', { n: L.RUNS, hurt: hurt, serious: serious }) }, cells),
      h('div', { class: 'rc-count' },
        h('b', null, hurt), h('span', null, serious),
        sc.forgot ? h('span', null, t.n('forgotN', sc.forgot)) : null,
        h('span', { class: 'rc-muted' }, t('expect', { e: day(sc.eHurt), e0: day(sc.eHurt0) }))));
  }

  // ── caption (SPEC.md "Captions") ──
  function caption(s) {
    var sc = s.scenes[s.scene];
    var v = {
      scene: t('long_' + sc.id), runs: L.RUNS, l: sc.l0, i: sc.i0, s: sc.s0, s1: sc.s1, day: day(sc.day), kept: pct(sc.kept),
      hurt: t.n('hurtN', sc.hurt), serious: t.n('seriousN', sc.serious), forgot: t.n('forgotN', sc.forgot)
    };
    if (sc.removed) return t('capRemoved', v);
    if (!sc.top) return t('capNone', v);
    var out = [];
    if (sc.top === 'organise' || sc.top === 'protect') out.push(t('capLower', v));
    else { v.top = t('level_' + sc.top); out.push(t('capUpper', v)); }
    var d = L.SCENES[L.SCENE_IDS.indexOf(sc.id)].c;
    sc.chosen.forEach(function (lv) {
      if (d[lv] && !d[lv][0] && !d[lv][1]) out.push(t('capNoEffect', { control: t('c_' + sc.id + '_' + lv) }));
    });
    return out.join(' ');
  }

  var hidden = function () { return false; };
  var params = [
    { key: 'scene', type: 'choice', label: t('scene'), hint: t('sceneHint'),
      options: L.SCENE_IDS.map(function (id) { return [id, t('scene_' + id)]; }) },
    { key: 'seed', type: 'range', label: t('seedParam'), min: 1, max: L.SEEDS, step: 1, visible: hidden },
    { type: 'button', label: t('newSeries'), hint: t('newSeriesHint'), key: 'n', run: function (sim) { sim.set(L.nextSeed(sim.params)); } }
  ];
  L.SCENE_IDS.forEach(function (id) {
    L.LEVEL_IDS.forEach(function (lv) {
      params.push({ key: L.key(id, lv), type: 'toggle', label: t('ctlParam', { scene: t('scene_' + id), level: t('level_' + lv) }), visible: hidden });
    });
  });

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'rc-paper', label: t('legPaper') },
      { shape: 'rc-day', label: t('legDay') },
      { shape: 'rc-hurt', label: t('legHurt') },
      { shape: 'rc-serious', label: t('legSerious') },
      { shape: 'rc-miss', label: t('legMiss') }
    ],
    render: function (c) {
      var s = c.state, sc = s.scenes[s.scene];
      c.stage.replaceChildren(h('div', { class: 'rc' },
        tabs(s),
        h('div', { class: 'rc-main' },
          h('div', null,
            h('p', { class: 'rc-scene' }, t('long_' + sc.id)),
            h('p', { class: 'rc-h' }, t('head_ladder')),
            ladder(sc)),
          h('div', null, risk(sc), runs(s, sc))),
        h('p', { class: 'rc-foot' }, t('foot'))));
      if (refocus) {
        var b = c.stage.querySelector(refocus);
        if (b) b.focus();
        refocus = null;
      }
    },
    caption: function (c) { return caption(c.state); }
  });
})();
</script>
</body>
