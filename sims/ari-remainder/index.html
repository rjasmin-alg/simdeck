<!-- ari-remainder: division with a remainder as dealing sweets round by round. A stepper: each step deals one round
     (every child one sweet, d out of the bowl), then the round that fails (fewer than d left: the remainder), then the
     check q · d + r = n and r < d. The bowl, the children and their plates are drawn here in HTML and plain SVG (no
     K5 paper, catalogue §4.17); the header's audience switch is Simdeck.paperColumns.audience (docs/sim-ui.md §14).
     Rules: SPEC.md. -->

<style>
/* Page CSS: every selector starts with [data-sim="ari-remainder"]; colours only from kit tokens.
   The sentence on top; the bowl (left) and the children (right); the rounds, the check and the mistake card below. */
[data-sim="ari-remainder"] .rm {
  display: grid;
  grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.4fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 1.4cqh 1.2cqw;
  height: 100%;
  padding: 1.4cqh 1.2cqw;
  font-size: max(1.25rem, min(2.7cqh, 1.3cqw));
  line-height: 1.3;
}
/* a control the audience hides keeps its wrapper hidden (the kit's .sd-ctl display wins over [hidden]) */
[data-sim="ari-remainder"] .sd-ctl[hidden] { display: none; }
[data-sim="ari-remainder"] .rm-box { min-width: 0; min-height: 0; padding: 0.4em 0.7em; border: var(--line-w) solid var(--line); border-radius: var(--radius); background: var(--bg); }
[data-sim="ari-remainder"] .rm-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.1em 0.6em; font-weight: 700; }
[data-sim="ari-remainder"] .rm-small { color: var(--muted); font-size: max(16px, 0.8em); font-weight: 400; }
[data-sim="ari-remainder"] .rm-num { white-space: nowrap; font-variant-numeric: tabular-nums; }
[data-sim="ari-remainder"] .rm-sent .rm-num { font-family: var(--mono); }

/* ── the sentence: 23 : 4 = 5, ostatak 3, the names under the numbers ── */
[data-sim="ari-remainder"] .rm-sent { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 0 0.35em; font-size: max(1.6rem, min(6cqh, 3.2cqw)); font-weight: 700; }
[data-sim="ari-remainder"] .rm[data-aud='child'] .rm-sent { font-size: max(1.8rem, min(10cqh, 5cqw)); }
[data-sim="ari-remainder"] .rm-term { display: inline-flex; flex-direction: column; align-items: center; }
[data-sim="ari-remainder"] .rm-term > .rm-num { padding: 0 0.12em; border-radius: var(--radius-sm); }
[data-sim="ari-remainder"] .rm-name { color: var(--muted); font-size: max(16px, 0.34em); font-weight: 400; line-height: 1.1; }
[data-sim="ari-remainder"] .rm-unknown { color: var(--muted); }
[data-sim="ari-remainder"] .rm-restgrp { display: inline-flex; align-items: flex-start; gap: 0 0.35em; margin-left: -0.35em; white-space: nowrap; }
[data-sim="ari-remainder"] .rm-word { font-size: 0.7em; align-self: center; }

/* ── a sweet: a disc with the two twists of its wrapper; plain shapes, kit colours ── */
[data-sim="ari-remainder"] .rm-sw { --sw: var(--c1); position: relative; width: var(--s); height: var(--s); border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, var(--sw) 0 30%, transparent 31%); }
[data-sim="ari-remainder"] .rm-sw::before, [data-sim="ari-remainder"] .rm-sw::after {
  content: ''; position: absolute; top: 34%; width: 17%; height: 32%; background: var(--sw); }
[data-sim="ari-remainder"] .rm-sw::before { left: 5%; clip-path: polygon(0 0, 100% 50%, 0 100%); }
[data-sim="ari-remainder"] .rm-sw::after { right: 5%; clip-path: polygon(100% 0, 0 50%, 100% 100%); }
/* the remainder: another colour and a ring through the disc (shape, not colour alone) */
[data-sim="ari-remainder"] .rm-sw[data-k='rest'] { --sw: var(--c2);
  background: radial-gradient(circle at 50% 50%, var(--sw) 0 13%, var(--bg) 14% 19%, var(--sw) 20% 30%, transparent 31%); }
/* taken from the bowl: a hollow dashed place */
[data-sim="ari-remainder"] .rm-sw[data-k='taken'] { background: none; }
[data-sim="ari-remainder"] .rm-sw[data-k='taken']::before { inset: 22%; width: auto; height: auto; left: 22%; top: 22%; border: max(2px, 0.1em) dashed var(--line); border-radius: 50%; background: none; clip-path: none; }
[data-sim="ari-remainder"] .rm-sw[data-k='taken']::after { display: none; }
/* the round that fails: a dashed sweet for the first r children, an empty place with ✗ for the others */
[data-sim="ari-remainder"] .rm-sw[data-k='yes'] { --sw: var(--c2); opacity: 0.55; outline: max(2px, 0.12rem) dashed var(--ink); outline-offset: -2px; }
[data-sim="ari-remainder"] .rm-sw[data-k='no'] { outline: max(2px, 0.12rem) dashed var(--danger); outline-offset: -2px;
  background: linear-gradient(45deg, transparent 44%, var(--danger) 44% 56%, transparent 56%) center / 50% 50% no-repeat,
    linear-gradient(-45deg, transparent 44%, var(--danger) 44% 56%, transparent 56%) center / 50% 50% no-repeat; }
[data-sim="ari-remainder"] .rm-sw[data-k='no']::before, [data-sim="ari-remainder"] .rm-sw[data-k='no']::after { display: none; }
[data-sim="ari-remainder"] .rm-sw.sd-changed { outline-offset: 0; }
[data-sim="ari-remainder"] .sd-swatch[data-shape='rm-rest'] { border-radius: 50%; background: radial-gradient(circle, var(--c2) 0 30%, var(--bg) 31% 45%, var(--c2) 46%); }

/* ── the bowl ── */
[data-sim="ari-remainder"] .rm-bowl { display: flex; flex-direction: column; gap: 0.3em; }
[data-sim="ari-remainder"] .rm-fill { flex: 1 1 0; min-height: 0; container-type: size; display: grid; place-items: center; }
[data-sim="ari-remainder"] .rm-grid { --s: min(calc(96cqw / (var(--cols) * 1.1)), calc((96cqh - 2.6rem) / (var(--rows) * 1.1)), 4.4rem);
  display: grid; grid-template-columns: repeat(var(--cols), var(--s)); gap: calc(var(--s) * 0.1); }
[data-sim="ari-remainder"] .rm-bowlcol { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3em; }
[data-sim="ari-remainder"] .rm-restlab { margin-left: 0.1em; padding: 0 0.4em; border: max(2px, 0.12rem) solid var(--c2); border-radius: var(--radius-sm); font-weight: 700; }
[data-sim="ari-remainder"] .rm-restlab[hidden] { display: block; visibility: hidden; }

/* ── the children ── */
[data-sim="ari-remainder"] .rm-kids { display: flex; flex-direction: column; }
[data-sim="ari-remainder"] .rm-kidsfill { flex: 1 1 0; min-height: 0; container-type: size; display: grid; }
[data-sim="ari-remainder"] .rm-kidrow {
  --k: min(calc(92cqw / (var(--d) * (var(--pc) * 1.1 + 0.6))), calc((96cqh - var(--fig) - 3.6rem) / (var(--pr) * 1.1)), 4rem);
  --fig: min(22cqh, calc(70cqw / var(--d)), 6rem);
  display: grid; grid-template-columns: repeat(var(--d), minmax(0, 1fr)); gap: 0 0.6cqw; align-items: start; align-self: center; }
[data-sim="ari-remainder"] .rm-kid { display: flex; flex-direction: column; align-items: center; gap: 0.15em; min-width: 0; }
[data-sim="ari-remainder"] .rm-fig { width: var(--fig); height: var(--fig); }
[data-sim="ari-remainder"] .rm-fig path, [data-sim="ari-remainder"] .rm-fig circle { fill: var(--panel); stroke: var(--ink); stroke-width: 2.4; }
[data-sim="ari-remainder"] .rm-figbox { position: relative; display: block; width: var(--fig); height: var(--fig); }
[data-sim="ari-remainder"] .rm-kidno { position: absolute; left: 0; right: 0; bottom: 4%; text-align: center; font-weight: 700; line-height: 1; font-size: max(16px, calc(var(--fig) * 0.3)); }
[data-sim="ari-remainder"] .rm-plate { --s: var(--k); display: grid; grid-template-columns: repeat(var(--pc), var(--s)); grid-auto-rows: var(--s);
  min-height: calc(var(--pr) * var(--s) * 1.1 + 0.5em); align-content: start; gap: calc(var(--s) * 0.1);
  padding: 0.3em; border: var(--line-w) solid var(--line); border-radius: 1.2em; background: var(--panel); }
[data-sim="ari-remainder"] .rm-count { font-family: var(--mono); font-weight: 700; font-size: 1.15em; }
[data-sim="ari-remainder"] .rm[data-aud='child'] .rm-count { font-size: 1.6em; }

/* ── under the drawing: the rounds, the check, the mistake card ── */
[data-sim="ari-remainder"] .rm-foot { grid-column: 1 / -1; display: flex; gap: 1.2cqw; min-height: 0; }
[data-sim="ari-remainder"] .rm-foot > * { flex: 1 1 0; }
[data-sim="ari-remainder"] .rm-rounds { flex-grow: 1.3; }
[data-sim="ari-remainder"] .rm-chain { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.25em; font-family: var(--mono); }
[data-sim="ari-remainder"] .rm-arrow { color: var(--muted); font-size: max(16px, 0.8em); white-space: nowrap; }
[data-sim="ari-remainder"] .rm-stop { color: var(--danger); font-weight: 700; white-space: nowrap; }
[data-sim="ari-remainder"] .rm-stop > :first-child { color: var(--ink); font-weight: 400; }
[data-sim="ari-remainder"] .rm-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5em; }
[data-sim="ari-remainder"] .rm-line .rm-num { font-weight: 700; }
[data-sim="ari-remainder"] .rm-mark { font-weight: 700; white-space: nowrap; }
[data-sim="ari-remainder"] .rm-mark[data-ok='yes'] { color: var(--ok); }
[data-sim="ari-remainder"] .rm-mark[data-ok='no'] { color: var(--danger); }
[data-sim="ari-remainder"] .rm-pending .rm-num { color: var(--muted); font-weight: 400; }
[data-sim="ari-remainder"] .rm-done { outline: max(3px, 0.2rem) solid var(--ink); background: color-mix(in srgb, var(--c3) 14%, var(--bg)); }
[data-sim="ari-remainder"] .rm-mc { border-style: dashed; border-color: var(--danger); border-width: 0.18rem; }
[data-sim="ari-remainder"] .rm-mc p { margin: 0; }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ari-remainder"] .sd-stagecol { grid-template-rows: auto auto; }
  [data-sim="ari-remainder"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="ari-remainder"] .rm { display: flex; flex-direction: column; height: auto; gap: 0.7rem; padding: 0.6rem; font-size: 1.1rem; }
  [data-sim="ari-remainder"] .rm-sent, [data-sim="ari-remainder"] .rm[data-aud='child'] .rm-sent { font-size: 1.7rem; }
  [data-sim="ari-remainder"] .rm-fill { flex: none; container-type: inline-size; }
  [data-sim="ari-remainder"] .rm-grid { --s: min(calc(92cqw / 10.4), 2.4rem); }
  [data-sim="ari-remainder"] .rm-kidsfill { flex: none; container-type: inline-size; }
  [data-sim="ari-remainder"] .rm-kidrow { grid-template-columns: repeat(min(var(--d), 5), minmax(0, 1fr)); gap: 0.6rem 0.3rem;
    --k: min(calc(88cqw / (min(var(--d), 5) * (var(--pc) * 1.1 + 0.6))), 2.2rem); --fig: 3rem; }
  [data-sim="ari-remainder"] .rm-foot { flex-direction: column; gap: 0.7rem; }
  [data-sim="ari-remainder"] .rm-foot > *, [data-sim="ari-remainder"] .rm > * { flex: none; }
}
</style>

<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Dijeljenje s ostatkom: krug po krug</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div data-pc-audience></div>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';

  var PRESET_KEY = { sweets: 'pSweets', exact: 'pExact', fewer: 'pFewer', largest: 'pLargest', 'too-big': 'pTooBig',
    hundred: 'pHundred' };
  var SVGNS = 'http://www.w3.org/2000/svg';

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function num(text) { return h('span', { class: 'rm-num', translate: 'no' }, String(text)); }
  function kids(d) { return t('kids' + d); }
  function mark(ok) {
    return h('span', { class: 'rm-mark', dataset: { ok: ok ? 'yes' : 'no' }, 'aria-label': ok ? t('yes') : t('no') }, ok ? '✓' : '✗');
  }
  /** "23 : 4 = 5, ostatak 3" as caption parts. */
  function answer(D, q, r) { return h('span', null, num(D.n + ' : ' + D.d + ' = ' + q), ', ' + t('rest') + ' ', num(r)); }
  function qr(q, r) { return h('span', null, num(q), ', ' + t('rest') + ' ', num(r)); }

  function sweet(kind, extra) {
    return h('span', Object.assign({ class: 'rm-sw' + (extra || ''), dataset: { k: kind } }, kind === 'no' ? { 'aria-hidden': 'true' } : {}),
      null);
  }

  /** A child: a plain figure, its number in HTML over the body (SVG text would scale below 16 px). */
  function figure(i) {
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 40 44');
    svg.setAttribute('class', 'rm-fig');
    svg.setAttribute('aria-hidden', 'true');
    var head = document.createElementNS(SVGNS, 'circle');
    head.setAttribute('cx', '20'); head.setAttribute('cy', '11'); head.setAttribute('r', '8.5');
    var body = document.createElementNS(SVGNS, 'path');
    body.setAttribute('d', 'M5 42.5 C5 29 11 22.5 20 22.5 C29 22.5 35 29 35 42.5 Z');
    svg.append(head, body);
    return h('span', { class: 'rm-figbox' }, svg, h('span', { class: 'rm-kidno', translate: 'no' }, String(i)));
  }

  // ── the sentence ──
  function sentence(D, s) {
    var known = s.phase === 'short' || s.phase === 'check';
    var names = audience !== 'child';
    var term = function (text, nameKey, cls) {
      return h('span', { class: 'rm-term' }, h('span', { class: 'rm-num' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)),
        names ? h('span', { class: 'rm-name' }, t(nameKey)) : null);
    };
    var hl = s.phase === 'check' ? 'sd-hl' : '';
    var kids = [term(D.n, 'nameN'), h('span', { translate: 'no' }, ':'), term(D.d, 'nameD'), h('span', { translate: 'no' }, '=')];
    if (!known) kids.push(term('?', 'nameQ', 'rm-unknown'));
    else kids.push(term(D.q, 'nameQ', hl), h('span', { class: 'rm-restgrp' }, h('span', { class: 'rm-word' }, ', ' + t('rest')), term(D.r, 'nameR', hl)));
    return h('div', { class: 'rm-sent' }, kids);
  }

  // ── the bowl: n places, the first `pile` full; from the failed round on, those are the remainder ──
  function bowl(D, s, c) {
    var rest = s.phase === 'short' || s.phase === 'check';
    var prevPile = c.prev ? c.prev.pile : D.n;
    var cells = [];
    for (var i = 0; i < D.n; i++) {
      // sweets are taken from the front, so what is still in the bowl is its last cells, right above the label
      var left = D.n - i; // 1 for the last cell
      var kind = left <= s.pile ? (rest ? 'rest' : 'full') : 'taken';
      var now = c.dir !== 'jump' && s.phase === 'round' && left > s.pile && left <= prevPile;
      cells.push(sweet(kind, now ? ' sd-anim-in' : ''));
    }
    var cols = Math.min(10, D.n);
    var grid = h('div', { class: 'rm-grid', role: 'img', 'aria-label': t('bowlLabel', { v: s.pile, n: D.n }),
      style: { '--cols': String(cols), '--rows': String(Math.ceil(D.n / 10)) } }, cells);
    var lab = h('div', { class: 'rm-restlab', hidden: !rest || null }, t('restLabel', { r: D.r }));
    return h('section', { class: 'rm-box rm-bowl' },
      h('div', { class: 'rm-head' }, h('span', null, t('bowl')), h('span', null, t('inBowl', { v: s.pile }))),
      h('div', { class: 'rm-fill' }, h('div', { class: 'rm-bowlcol' }, grid, lab)));
  }

  // ── the children and their plates ──
  /** Sweets per plate row: the count (rounds and the failed one) laid out as big as the kids' box allows, measured
      from the stage (a phone, whose stage grows with its content, takes 5 or fewer). */
  function plateCols(D, stage) {
    var count = D.q + 1, W = stage.clientWidth, H = stage.clientHeight;
    var phone = window.matchMedia('(max-width: 900px), (max-aspect-ratio: 1/1)').matches;
    if (phone || !W || !H) return Math.min(count, D.d > 5 ? 3 : 5);
    if (count <= 5) return count;
    var colW = W * 0.55 / D.d, plateH = H * 0.42;
    var best = 5, bestS = 0;
    for (var pc = 2; pc <= 5; pc++) {
      var size = Math.min(colW / (pc * 1.1 + 0.6), plateH / (Math.ceil(count / pc) * 1.1));
      if (size > bestS + 0.5) { best = pc; bestS = size; }
    }
    return best;
  }
  function children(D, s, c) {
    var pc = plateCols(D, c.stage);
    var pr = Math.max(1, Math.ceil((D.q + 1) / pc)); // room for every round and the failed one, from step 0
    var row = [];
    for (var i = 1; i <= D.d; i++) {
      var got = [];
      for (var k = 1; k <= s.k; k++) {
        var isNew = s.phase === 'round' && k === s.k;
        got.push(sweet('full', isNew ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''));
      }
      var slotLabel = null;
      if (s.phase === 'short') {
        var yes = i <= s.pile;
        got.push(sweet(yes ? 'yes' : 'no'));
        slotLabel = t(yes ? 'slotYes' : 'slotNo');
      }
      row.push(h('div', { class: 'rm-kid', role: 'img',
        'aria-label': t('kidLabel', { i: i, s: t.n('sweets', s.k) }) + (slotLabel ? '; ' + slotLabel : '') },
        figure(i),
        h('div', { class: 'rm-plate' }, got),
        h('span', { class: 'rm-count', translate: 'no' }, String(s.k))));
    }
    return h('section', { class: 'rm-box rm-kids' },
      h('div', { class: 'rm-kidsfill' },
        h('div', { class: 'rm-kidrow', style: { '--d': String(D.d), '--pc': String(pc), '--pr': String(pr) } }, row)));
  }

  // ── the rounds as a repeated subtraction ──
  function rounds(D, s) {
    var chain = [];
    var stopped = s.phase === 'short' || s.phase === 'check';
    for (var k = 0; k <= s.k; k++) {
      if (k > 0) chain.push(h('span', { class: 'rm-arrow', translate: 'no' }, '−' + D.d + '→'));
      var pile = h('span', { class: k === s.k && s.phase === 'round' ? 'sd-hl' : null, translate: 'no' }, String(D.piles[k]));
      // the last number and the stop stay on one line
      if (k === s.k && stopped) chain.push(h('span', { class: 'rm-stop' }, pile, h('span', { translate: 'no' }, ' < ' + D.d + ' '), t('roundsStop')));
      else chain.push(pile);
    }
    return h('section', { class: 'rm-box rm-rounds' },
      h('div', { class: 'rm-head' }, h('span', null, t('roundsTitle', { d: D.d }))),
      h('div', { class: 'rm-chain' }, chain),
      h('div', { class: 'rm-small' }, tp('roundsGiven', { e: num(s.k + ' · ' + D.d + ' = ' + s.k * D.d) })));
  }

  // ── the check: both parts ──
  function checkBox(D, s) {
    var done = s.phase === 'check';
    var C = L.checkOf(D.n, D.d, D.q, D.r);
    var eq = done ? D.q + ' · ' + D.d + ' + ' + D.r + ' = ' + D.n : '? · ' + D.d + ' + ? = ' + D.n;
    var less = done ? D.r + ' < ' + D.d : '? < ' + D.d;
    return h('section', { class: 'rm-box rm-check' + (done ? '' : ' rm-pending') },
      h('div', { class: 'rm-head' }, h('span', null, t('checkTitle')), done ? null : h('span', { class: 'rm-small' }, t('checkLater'))),
      h('div', { class: 'rm-line' }, num(eq), done ? mark(C.equal) : null, h('span', { class: 'rm-small' }, t('checkEq'))),
      h('div', { class: 'rm-line' }, num(less), done ? mark(C.less) : null, h('span', { class: 'rm-small' }, t('checkLess'))));
  }

  // ── the typical mistake: stopped one round early ──
  function mistakeCard(D, s) {
    var m = L.mistakeOf({ n: D.n, d: D.d });
    var done = s.phase === 'check';
    var kids = [h('div', { class: 'rm-head' }, h('span', null, t('mtHead'))),
      h('p', null, t('mtWrote'), ' ', h('b', null, answer(D, m.q, m.r)))];
    if (!done) kids.push(h('p', { class: 'rm-small' }, t('mtAsk')));
    else {
      kids.push(h('div', { class: 'rm-line' }, num(m.q + ' · ' + D.d + ' + ' + m.r + ' = ' + m.check.back), mark(m.check.equal),
        h('span', { class: 'rm-small' }, t('mtEqOk'))));
      kids.push(h('div', { class: 'rm-line' }, num(m.r + ' < ' + D.d), mark(m.check.less), h('span', { class: 'rm-small' }, t('mtLessNo'))));
      kids.push(h('p', null, tp('mtWhy', { r: num(m.r), d: num(D.d), o: num(m.oneMore) })));
    }
    return h('section', { class: 'rm-box rm-mc' }, kids);
  }

  function render(c) {
    var D = L.dealOf(c.params), s = c.state;
    var parts = [sentence(D, s), bowl(D, s, c), children(D, s, c)];
    if (audience === 'child') {
      if (s.phase === 'check') parts.push(h('div', { class: 'rm-foot' }, checkBox(D, s)));
    } else {
      var foot = [rounds(D, s), checkBox(D, s)];
      if (audience === 'teacher' && c.params.mistake && L.mistakeOf(c.params)) foot.push(mistakeCard(D, s));
      parts.push(h('div', { class: 'rm-foot' }, foot));
    }
    c.stage.replaceChildren(h('div', { class: 'rm', dataset: { aud: audience } }, parts));
    var chk = c.stage.querySelector('.rm-check');
    if (chk && s.phase === 'check') chk.classList.add('rm-done');
  }

  // ── captions ──
  function caption(c) {
    var D = L.dealOf(c.params), s = c.state, p = c.params;
    var X = audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    var m = X === 'T' && p.mistake ? L.mistakeOf(p) : null;

    if (s.phase === 'start') {
      add(tp('cStart' + X, { n: num(t.n('sweets', D.n)), kids: kids(D.d), d: num(D.d) }));
    } else if (s.phase === 'round') {
      var prev = D.piles[s.k - 1];
      add(tp('cRound' + X, { k: num(s.k), prev: num(prev), d: num(D.d), pile: num(s.pile), g: num(s.k * D.d),
        each: num(t.n('sweets', s.k)) }));
    } else if (s.phase === 'short') {
      var v = D.q === 0 ? 'None' : D.r === 0 ? '0' : '';
      add(tp('cShort' + v + X, { r: num(D.r), d: num(D.d) }));
    } else {
      var eq = num(D.q + ' · ' + D.d + ' + ' + D.r + ' = ' + D.n), less = num(D.r + ' < ' + D.d);
      if (X === 'A') add(tp('cCheckA', { rounds: num(t.n('rounds', D.q)), d: num(D.d), g: num(D.q * D.d), r: num(D.r), n: num(D.n) }));
      else addHl(tp('cCheck' + X, { expr: answer(D, D.q, D.r), eq: eq, less: less, q: num(D.q) }));
      if (m) add(tp('cMistakeT', { w: qr(m.q, m.r), eq: num(m.q + ' · ' + D.d + ' + ' + m.r + ' = ' + D.n), wr: num(m.r), d: num(D.d) }));
    }
    // the moment the typical mistake happens: the bowl holds r + d, one round before the last
    if (m && (s.phase === 'start' || s.phase === 'round') && s.k === D.q - 1) {
      add(tp('cHereT', { q: num(m.q), r: num(m.r), d: num(D.d) }));
    }
    return out;
  }

  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }

  buildAudience();
  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'n', type: 'range', label: t('nLabel'), hint: t('nHint'), value: L.defaults.n, min: 1, resets: true,
        max: function (p) { return L.maxN(L.numbersOf(p).d); } },
      { key: 'd', type: 'range', label: t('dLabel'), value: L.defaults.d, min: L.MIN_D, max: L.MAX_D, resets: true },
      { key: 'mistake', type: 'toggle', label: t('mistake'), hint: t('mistakeHint'), value: L.defaults.mistake,
        visible: function () { return audience === 'teacher'; },
        disabled: function (p) { return L.mistakeOf(p) ? false : t('mistakeNone'); } }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    legend: [
      { c: 1, shape: 'round', label: t('legSweet') },
      { shape: 'hollow', label: t('legTaken') },
      { shape: 'hl', label: t('legNew') },
      { c: 2, shape: 'rm-rest', label: t('legRest') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
