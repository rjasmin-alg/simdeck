<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>faultline — spike</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="toolbar">
  <strong class="brand">faultline</strong>
  <select id="sample-picker" aria-label="Scenario"></select>
  <span class="spacer"></span>
  <label class="inline"><input type="checkbox" id="toggle-auth" checked> Show what was never drawn</label>
  <label class="inline">Search to
    <select id="max-size"><option>1</option><option>2</option><option selected>3</option><option>4</option></select>
  </label>
  <button id="reset" type="button">Repair all</button>
</header>

<main id="stage">
  <aside id="rail-left">
    <h2>Failure events</h2>
    <p class="hint">Click one to break it. Everything that rests on it follows.</p>
    <div id="event-list"></div>
  </aside>

  <section id="canvas-wrap">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  </section>

  <aside id="rail-right">
    <h2>Single points of failure</h2>
    <div id="cutset-panel"></div>
  </aside>
</main>

<footer id="statusbar">
  <span id="verdict">—</span>
  <span class="spacer"></span>
  <span id="searched"></span>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
