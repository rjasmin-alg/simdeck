<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var Q_KEY = { 'big-files': 'qBig', 'by-size': 'qSize', 'by-extension': 'qExt' };
  var FMT_KEY = { FormatStartData: 'fmtStart', GroupStartData: 'fmtGroupStart', FormatEntryData: 'fmtEntry', GroupEndData: 'fmtGroupEnd', FormatEndData: 'fmtEnd' };
  var READS = { where: 'Length', 'sort-object': 'Length' };

  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function data(s) { return h('span', { translate: 'no' }, String(s)); }
  function join(nodes, sep) { var out = []; nodes.forEach(function (n, i) { if (i) out.push(sep); out.push(n); }); return out; }
  function laneLabel(name) { return h('b', { translate: 'no' }, name + ': '); }
  function isFormat(o) { return !!FMT_KEY[o.type]; }
  /** The properties a FileInfo card shows: the three the task uses. */
  function fileProps(task) { return task === 'by-extension' ? ['Name', 'Extension', 'Length'] : ['Name', 'Length', 'LastWriteTime']; }
  function countOf(lane, out) { return lane === 'bash' ? t.n('linesN', out.length) : t.n('objectsN', out.length); }

  // ── field markers on lines of text ──

  /** How the next reader splits a line: awk and sort -k5 at the blanks, awk -F. at the dots; which fields it uses. */
  function markerMode(s, lane, i) {
    if (lane !== 'bash') return null;
    var st = s.bash.stages;
    var cur = st[i] && st[i].kind;
    var next = st[i + 1] && st[i + 1].kind;
    if (next === 'awk-filter') return { sep: 'blank', keys: [5, 9] };
    if (next === 'sort-k5' || next === 'sort-k5n' || cur === 'sort-k5' || cur === 'sort-k5n') return { sep: 'blank', keys: [5] };
    if (next === 'awk-ext') return { sep: 'dot', keys: ['NF'] };
    return null;
  }
  function markedLine(text, mode) {
    var parts = [];
    if (mode.sep === 'dot') {
      var fs = text.split('.');
      fs.forEach(function (f, k) {
        if (k) parts.push('.');
        var key = k === fs.length - 1 && fs.length > 1;
        parts.push(h('span', { class: 'po-f', dataset: key ? { key: '' } : {}, translate: 'no' }, f));
        if (key) parts.push(h('span', { class: 'po-fn', 'aria-label': t('fieldOf', { n: 'NF' }) }, '$NF'));
      });
      return parts;
    }
    var fields = L.fields(text);
    var pos = 0;
    fields.forEach(function (f, k) {
      var n = k + 1;
      if (f.start > pos) parts.push(text.slice(pos, f.start));
      var key = mode.keys.indexOf(n) >= 0;
      var warn = n > 9 && mode.keys.indexOf(9) >= 0;
      var ds = {};
      if (key) ds.key = '';
      if (warn) ds.warn = '';
      parts.push(h('span', { class: 'po-f', dataset: ds, translate: 'no' }, f.text));
      if (key || warn) parts.push(h('span', { class: 'po-fn', dataset: warn ? { warn: '' } : {}, 'aria-label': t('fieldOf', { n: n }) }, '$' + n));
      pos = f.end;
    });
    if (pos < text.length) parts.push(text.slice(pos));
    return parts;
  }

  // ── inspector bodies ──

  function bashBody(s, i, st) {
    var mode = markerMode(s, 'bash', i);
    var bad = {};
    if (st.issue && st.issue.code === 'field-shift') st.issue.items.forEach(function (x) { bad[x.src] = true; });
    if (st.issue && st.issue.code === 'text-order') { bad[st.issue.a] = true; bad[st.issue.b] = true; }
    if (!st.out.length) return h('div', { class: 'po-empty' }, t('inspEmpty'));
    return h('div', { class: 'po-lines' }, st.out.map(function (line, k) {
      var src = st.src ? st.src[k] : null;
      var isBad = src !== null && src !== undefined && !Array.isArray(src) && bad[src];
      return h('div', { class: 'po-tl' + (isBad ? ' po-bad' : '') },
        mode ? h('span', null, markedLine(line, mode)) : data(line),
        isBad ? h('span', { class: 'po-x', 'aria-hidden': 'true' }, '✕') : null);
    }));
  }

  function card(o, task, read) {
    if (isFormat(o)) {
      return h('div', { class: 'po-card', dataset: { format: '' } },
        h('div', { class: 'po-type', translate: 'no' }, o.type),
        o.row ? h('div', { class: 'po-row-text', translate: 'no' }, o.row) : h('div', { class: 'po-desc' }, t(FMT_KEY[o.type])));
    }
    var keys = o.type === 'FileInfo' ? fileProps(task) : Object.keys(o.props);
    return h('div', { class: 'po-card' },
      h('div', { class: 'po-type', translate: 'no' }, o.type),
      h('dl', { class: 'po-props', translate: 'no' }, keys.map(function (k) {
        var v = o.props[k];
        if (Array.isArray(v)) v = '{' + v.join(', ') + '}';
        var cls = k === read ? 'po-read' : '';
        return [h('dt', { class: cls }, k), h('dd', { class: cls }, v === null ? '' : String(v))];
      })));
  }

  function psBody(s, i, st) {
    if (!st.out.length) return h('div', { class: 'po-empty' }, t('inspEmpty'));
    var read = st.now ? READS[st.kind] : null;
    return h('div', { class: 'po-cards' }, st.out.map(function (o) { return card(o, s.task, read); }));
  }

  function dirTable(s) {
    return h('table', { class: 'po-dir' },
      h('tr', null, h('th', null, t('colName')), h('th', null, t('colSize')), h('th', { class: 'po-time' }, t('colTime'))),
      s.data.map(function (f) {
        return h('tr', null, h('td', { translate: 'no' }, f.name), h('td', { class: 'po-num', translate: 'no' }, String(f.size)),
          h('td', { class: 'po-time', translate: 'no' }, f.mtime.replace('T', ' ')));
      }));
  }

  /** The inspector of one lane: the folder (step 0), the pipe after this step's stage, or the terminal. */
  function inspector(c, lane, verdict) {
    var s = c.state, ln = s[lane];
    var title, body, lit = false, note = null;
    if (s.terminal) {
      title = h('b', null, t('inspTerminal'));
      body = h('div', { class: 'po-screen', translate: 'no' }, ln.terminal.map(function (l) { return h('div', null, l); }));
      lit = true;
    } else if (s.at === 0) {
      title = h('b', null, t('inspStart'));
      body = dirTable(s);
    } else {
      var i = s.at - 1;
      var idle = i >= ln.stages.length;
      if (idle) i = ln.stages.length - 1;
      var st = ln.stages[i];
      var last = i === ln.stages.length - 1;
      title = h('b', null, t.parts(last ? 'inspLast' : 'inspAfter', { cmd: code(st.cmd) }));
      lit = !idle;
      if (idle) note = t('inspIdle');
      else if (i > 0 && (st.kind === 'awk-filter' || st.kind === 'where')) note = t('keptOf', { k: st.out.length, n: ln.stages[i - 1].out.length });
      else if (st.issue && st.issue.code === 'no-property') note = h('span', { class: 'po-nolen' }, '✕ ', t('noLength'));
      body = lane === 'bash' ? bashBody(s, i, st) : psBody(s, i, st);
      title = [title, ' · ', countOf(lane, st.out)];
    }
    return h('div', { class: 'po-insp' },
      h('div', { class: 'po-ititle' }, h('span', { class: lit ? 'sd-hl' : '' }, title), note ? h('span', null, note) : null, verdict || null),
      h('div', { class: 'po-ibody' + (lit && c.dir === 'forward' ? ' sd-anim-in' : '') }, body));
  }

  // ── the pipeline row ──

  function box(st, lane, i) {
    var state = !st.ran ? 'pending' : st.now ? 'now' : 'ran';
    var ds = { state: state };
    if (st.issue) ds.broken = '';
    return h('div', { class: 'po-box' + (st.now ? ' sd-changed' : ''), dataset: ds },
      h('div', { class: 'po-cmd', translate: 'no' }, st.cmd),
      (lane === 'bash' || st.collects) ? h('div', { class: 'po-meta' },
        lane === 'bash' ? h('span', null, t('procN', { n: i + 1 })) : null,
        st.collects ? h('span', null, '⧗ ', t('collects')) : null) : null,
      st.issue ? h('span', { class: 'po-cross', 'aria-label': t('legendBroken') }, '✕') : null);
  }
  function pipe(st, lane) {
    if (!st.ran) return h('span', { class: 'po-pipe', dataset: { empty: '' }, 'aria-label': t('legendPipe') }, '|');
    var n = countOf(lane, st.out);
    return h('span', { class: 'po-pipe' + (st.now ? ' sd-changed' : ''), title: n, 'aria-label': t('legendPipe') + ': ' + n }, String(st.out.length));
  }

  function row(c, lane) {
    var s = c.state, ln = s[lane];
    var items = [];
    ln.stages.forEach(function (st, i) {
      items.push(box(st, lane, i));
      if (i < ln.stages.length - 1) items.push(pipe(st, lane));
    });
    var lastSt = ln.stages[ln.stages.length - 1];
    var tail = [];
    if (lastSt.ran) tail.push(h('span', { class: 'po-pipe' + (lastSt.now ? ' sd-changed' : ''), title: countOf(lane, lastSt.out), 'aria-label': countOf(lane, lastSt.out) }, String(lastSt.out.length), ' →'));
    else tail.push(h('span', { class: 'po-arrow', 'aria-hidden': 'true' }, '→'));
    if (lane === 'ps') {
      tail.push(h('div', { class: 'po-box' + (s.terminal ? ' sd-changed' : ''), dataset: { state: s.terminal ? 'now' : 'pending', implicit: '' } },
        h('div', { class: 'po-cmd', translate: 'no' }, 'Out-Default'), h('div', { class: 'po-meta' }, t('implicit'))));
      tail.push(h('span', { class: 'po-arrow', 'aria-hidden': 'true' }, '→'));
    }
    tail.push(h('div', { class: 'po-term' + (s.terminal ? ' sd-changed' : '') }, t('terminal')));
    if (lane === 'ps') return h('div', { class: 'po-row' }, h('div', { class: 'po-proc' }, h('span', { class: 'po-proc-name' }, t('oneProcess')), items, tail.slice(0, 2)), tail.slice(2));
    return h('div', { class: 'po-row' }, items, tail);
  }

  function laneEl(c, lane) {
    var s = c.state, ln = s[lane];
    var verdict = s.terminal ? h('div', { class: 'po-verdict', dataset: { ok: String(ln.correct) } }, ln.correct ? '✓ ' : '✕ ', t(ln.correct ? 'correct' : 'wrong')) : null;
    return h('section', { class: 'po-lane', dataset: { lane: lane } },
      h('div', { class: 'po-top' }, h('div', { class: 'po-head' },
        h('div', { class: 'po-name', translate: 'no' }, lane === 'bash' ? 'bash' : 'PowerShell'),
        h('div', { class: 'po-sub' }, t(lane === 'bash' ? 'bashSub' : 'psSub'))),
      row(c, lane)),
      inspector(c, lane, verdict));
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'po' }, laneEl(c, 'bash'), laneEl(c, 'ps')));
  }

  // ── captions ──

  function fileOf(s, src) { return s.data[src]; }
  function firstDiff(a, b) { for (var k = 0; k < Math.min(a.length, b.length); k++) if (a[k] !== b[k]) return k; return 0; }

  function bashPart(s, st, psSt) {
    if (!st) return [t(psSt && psSt.kind === 'format-table' ? 'bIdleFmt' : 'bIdle')];
    var cmd = code(st.cmd);
    switch (st.kind) {
      case 'ls-l': return t.parts('bLsL', { cmd: cmd });
      case 'ls': return t.parts('bLs', { cmd: cmd });
      case 'awk-filter': {
        var out = t.parts('bAwk', { awk: code('awk') });
        if (st.issue) {
          var f = fileOf(s, st.issue.items[0].src);
          out.push(' ', h('span', { class: 'sd-hl' }, t.parts('bShift', { name: code(f.name), f9: code(f.name.split(' ')[0]) })));
        }
        return out;
      }
      case 'sort-k5': {
        var res;
        if (st.issue) {
          var a = String(fileOf(s, st.issue.a).size), b = String(fileOf(s, st.issue.b).size);
          var k = firstDiff(a, b);
          res = t.parts('bSortText', { cmd: cmd, a: code(a), b: code(b), da: code(a[k]), db: code(b[k]) }).concat(' ', t('bSortLocale'));
        } else res = t.parts('bSortNum', { cmd: cmd });
        return res.concat(' ', t('bCollects'));
      }
      case 'sort-k5n': return t.parts('bSortNum', { cmd: cmd }).concat(' ', t('bCollects'));
      case 'awk-ext': return t.parts('bAwkExt', { cmd: cmd });
      case 'sort': return t.parts('bSort', { cmd: cmd }).concat(' ', t('bCollects'));
      case 'uniq-c': return t.parts('bUniq', { cmd: cmd });
    }
    return [];
  }

  function psPart(s, st, last) {
    if (!st) return [t('pIdle')];
    var cmd = code(st.cmd);
    switch (st.kind) {
      case 'gci': return t.parts('pGci', { cmd: cmd, type: code('FileInfo'), props: h('span', null, join(fileProps(s.task).map(code), ', ')) });
      case 'where': return t.parts('pWhere', { cmd: cmd });
      case 'select': return t.parts('pSelect', { cmd: cmd });
      case 'sort-object':
        if (st.issue) return [h('span', { class: 'sd-hl' }, t.parts('pSortBroken', { cmd: cmd }))];
        return t.parts('pSort', { cmd: cmd }).concat(' ', t('pCollects'));
      case 'format-table': {
        var out = t.parts('pFt', { cmd: cmd });
        if (last) out.push(' ', t('pFtLast'));
        return out;
      }
      case 'group-object': return t.parts('pGroup', { cmd: cmd });
    }
    return [];
  }

  function terminalNote(s) {
    var notes = [];
    var bIssue = null, pIssue = null;
    s.bash.stages.forEach(function (st) { if (st.issue && !bIssue) bIssue = st.issue; });
    s.ps.stages.forEach(function (st) { if (st.issue && !pIssue) pIssue = st.issue; });
    if (s.bash.correct && s.ps.correct) return [t('nSame')];
    if (!s.bash.correct && bIssue && bIssue.code === 'field-shift') {
      var f = fileOf(s, bIssue.items[0].src);
      notes = notes.concat(t.parts('nShift', { f9: code(f.name.split(' ')[0]), name: code(f.name) }));
    }
    if (!s.bash.correct && bIssue && bIssue.code === 'text-order') {
      notes = notes.concat(t.parts('nText', { a: code(fileOf(s, bIssue.a).size), b: code(fileOf(s, bIssue.b).size), fix: code('sort -k5 -n') }));
    }
    if (!s.ps.correct) { if (notes.length) notes.push(' '); notes.push(t('nFmt')); }
    if (s.bash.correct && !s.ps.correct) notes.push(' ', t('nOkBash'));
    else if (!s.bash.correct && s.ps.correct) notes.push(' ', t('nOkPs'));
    return notes;
  }

  function caption(c) {
    var s = c.state;
    if (s.at === 0) return t.parts('c0', { q: t(Q_KEY[s.task]) });
    if (s.terminal) {
      var lastPs = s.ps.stages[s.ps.stages.length - 1];
      var fmt = lastPs.out.length && isFormat(lastPs.out[0]);
      return [laneLabel('bash'), t('tBash'), ' ', laneLabel('PowerShell'), t(fmt ? 'tPsFmt' : 'tPs'), ' ',
        h('span', { class: 'sd-hl' }, terminalNote(s))];
    }
    var i = s.at - 1;
    var b = s.bash.stages[i], p = s.ps.stages[i];
    return [laneLabel('bash')].concat(bashPart(s, b, p), ' ', laneLabel('PowerShell'), psPart(s, p, i === s.ps.stages.length - 1));
  }

  var onlySize = function (p) { return p.task !== 'by-size' ? t('onlySize') : false; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'task', type: 'choice', label: t('task'), resets: true,
        options: [['big-files', t('taskBig')], ['by-size', t('taskSize')], ['by-extension', t('taskExt')]] },
      { key: 'nameWithSpace', type: 'toggle', label: t('nameWithSpace'), hint: t('nameWithSpaceHint') },
      { key: 'numeric', type: 'toggle', label: t('numeric'), hint: t('numericHint'), disabled: onlySize },
      { key: 'formatEarly', type: 'toggle', label: t('formatEarly'), hint: t('formatEarlyHint'), disabled: onlySize }
    ],

    presets: [
      { id: 'big-files', label: t('pBig'), params: { task: 'big-files' } },
      { id: 'space-in-name', label: t('pSpace'), params: { task: 'big-files', nameWithSpace: true } },
      { id: 'sort-text', label: t('pSortText'), params: { task: 'by-size' } },
      { id: 'format-early', label: t('pFormatEarly'), params: { task: 'by-size', formatEarly: true, numeric: true } },
      { id: 'by-extension', label: t('pExt'), params: { task: 'by-extension' } }
    ],

    legend: [
      { shape: 'po-line', label: t('legendLine') },
      { shape: 'po-card', label: t('legendCard') },
      { shape: 'po-pipe', label: t('legendPipe') },
      { shape: 'po-field', label: t('legendField') },
      { shape: 'po-collects', label: t('legendCollects') },
      { shape: 'po-broken', label: t('legendBroken') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
