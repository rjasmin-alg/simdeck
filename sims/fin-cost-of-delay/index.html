<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (88 000 / 88,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');   // no break inside a number
  }
  function money(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  function name(id) { return t('p_' + id); }
  function colour(id) { return String(L.PROJECTS.indexOf(id) + 1); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }

  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // the control to give focus back to after a render (keyboard)
  function btn(cls, attrs, sel, apply, children) {
    return h('button', Object.assign({
      type: 'button', class: cls, dataset: { sel: sel }, onmousedown: noFocus,
      onclick: function (e) { refocus = e.detail === 0 ? sel : null; apply(); }
    }, attrs), children);
  }

  // ── the queue ──

  function queue(s) {
    var last = s.rows.length - 1;
    var rows = s.rows.map(function (r, k) {
      var id = r.id, on = id === s.p.proj, nm = name(id);
      function mv(dir, glyph) {
        var off = dir < 0 ? k === 0 : k === last;
        var label = off ? t(dir < 0 ? 'upFirst' : 'downLast', { p: nm }) : t(dir < 0 ? 'upLabel' : 'downLabel', { p: nm });
        return btn('cd-mv', { 'aria-disabled': String(off), 'aria-label': label, title: label },
          (dir < 0 ? 'up-' : 'down-') + id,
          function () {
            if (off) { refocus = null; return; }   // nothing renders, so nothing to give focus back to
            sim.set({ order: L.move(s.p, id, dir), proj: id });
          }, glyph);
      }
      return h('div', { class: 'cd-row', dataset: { on: String(on), c: colour(id) } },
        h('span', { class: 'cd-ctl' }, h('span', { class: 'cd-pos', translate: 'no' }, String(k + 1)), mv(-1, '▲'), mv(1, '▼')),
        btn('cd-name', { 'aria-pressed': String(on), 'aria-label': t('selLabel', { p: nm }), title: nm },
          'sel-' + id, function () { sim.set({ proj: id }); },
          [h('span', { class: 'cd-sw', 'aria-hidden': 'true' }), h('span', null, nm)]),
        h('span', { class: 'cd-ask' }, t('asks', { who: t('ask_' + id), how: t('v' + r.v) })),
        h('span', { class: 'cd-num cd-cd', translate: 'no' }, group(r.cd)),
        h('span', { class: 'cd-num cd-d', translate: 'no' }, String(r.d)),
        h('span', { class: 'cd-num cd-ratio', translate: 'no' }, group(r.ratio)),
        h('span', { class: 'cd-num cd-done', translate: 'no' }, String(r.done)),
        h('span', { class: 'cd-num cd-lost', translate: 'no' }, money(r.lost)));
    });
    return h('div', { class: 'cd-queue' },
      h('div', { class: 'cd-hrow cd-head', 'aria-hidden': 'true' },
        h('span', null, '#'), h('span', null, t('headQueue')), h('span', null, t('colAsk')), h('span', null, t('colCd')),
        h('span', null, t('colD')), h('span', null, t('colRatio')), h('span', null, t('colDone')), h('span', null, t('colLost'))),
      rows);
  }

  // ── the staircase: € a week still being lost, one band per project ──

  function chart(s) {
    var yhi = s.yAxis.hi, xhi = s.xAxis.hi;
    var px = function (w) { return (100 * w / xhi) + '%'; };
    var py = function (v) { return (100 * v / yhi) + '%'; };
    var bands = s.rows.map(function (r) {
      return h('div', { class: 'cd-band', dataset: { c: colour(r.id) },
        style: { width: px(r.done), bottom: py(r.lo), height: py(r.cd) } },
        r.start ? h('div', { class: 'cd-wait', style: { width: (100 * r.start / r.done) + '%' } }) : null,
        h('div', { class: 'cd-build' }));
    });
    var labels = s.rows.map(function (r) {
      return h('span', { class: 'cd-blabel', translate: 'no', style: { left: px(r.done), bottom: py(r.lo + r.cd / 2) } },
        t('bandLabel', { p: name(r.id), v: money(r.lost) }));
    });
    var best = null;
    if (s.outcome !== 'best') {
      var pts = s.stairs.map(function (q) { return (1000 * q[0] / xhi) + ',' + (1000 - 1000 * q[1] / yhi); }).join(' ');
      var pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('points', pts);
      best = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      best.setAttribute('class', 'cd-best');
      best.setAttribute('viewBox', '0 0 1000 1000');
      best.setAttribute('preserveAspectRatio', 'none');
      best.setAttribute('aria-hidden', 'true');
      best.appendChild(pl);
    }
    return h('div', { class: 'cd-chart' },
      h('p', { class: 'cd-head' }, t('headChart')),
      h('div', { class: 'cd-yaxis', 'aria-hidden': 'true' }, s.yAxis.ticks.map(function (v) {
        return h('span', { translate: 'no', style: { bottom: py(v) } }, money(v));
      })),
      h('div', { class: 'cd-plotwrap', 'aria-hidden': 'true' },
        h('div', { class: 'cd-plot' }, bands, best, labels)),
      h('div', { class: 'cd-xaxis', 'aria-hidden': 'true' }, s.xAxis.ticks.map(function (w, i) {
        var unit = i === s.xAxis.ticks.length - 1 ? h('span', { class: 'cd-xu' }, t('xUnit') + ' ') : null;
        return h('span', { translate: 'no', style: { left: px(w) } }, unit, String(w));
      })));
  }

  // ── the same projects under each rule ──

  function rules(s, chg) {
    var top = s.worst || 1;
    function bar(v) { return h('span', { class: 'cd-rbar', 'aria-hidden': 'true', style: { width: (100 * v / top) + '%' } }); }
    function extra(r) { return r.best ? t('bestMark') : t('extra', { v: money(r.extra) }); }
    var match = s.rules.filter(function (r) { return r.mine; })[0];
    var mine = h('div', { class: 'cd-rule' + (chg.indexOf('outcome') >= 0 ? ' sd-changed' : ''),
      dataset: { k: 'mine', mine: 'true', best: String(s.outcome === 'best') } },
      h('span', { class: 'cd-rname' }, t('r_mine'), match ? h('span', { class: 'cd-rx' }, ' ' + t('sameAs', { r: t('r_' + match.id) })) : null),
      h('span', { class: 'cd-num cd-rval', translate: 'no' }, money(s.total),
        h('span', { class: 'cd-rx' }, ' ' + extra({ best: s.outcome === 'best', extra: s.extra }))),
      bar(s.total));
    var list = s.rules.map(function (r) {
      return btn('cd-rule', { dataset: { k: r.id, best: String(r.best), sel: 'rule-' + r.id },
        'aria-label': t('ruleLabel', { r: t('r_' + r.id), v: money(r.total) }) + ', ' + extra(r) },
        'rule-' + r.id, function () { sim.set({ order: L.ruleOrder(s.p, r.id) }); },
        [h('span', { class: 'cd-rname' }, t('r_' + r.id)),
          h('span', { class: 'cd-num cd-rval', translate: 'no' }, money(r.total), h('span', { class: 'cd-rx' }, ' ' + extra(r))),
          bar(r.total)]);
    });
    return h('div', { class: 'cd-rules' }, h('p', { class: 'cd-head' }, t('headRules')), mine, list);
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'cd' },
      queue(s),
      h('div', { class: 'cd-mid' }, chart(s), rules(s, chg)),
      h('p', { class: 'cd-foot' }, t('foot', { b: money(s.build), w: money(s.wait) }), ' ', t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state;
    var k = L.captionKey(s);
    var out = t.parts(k.key, { total: b(money(s.total)), best: b(money(s.best)), extra: b(money(s.extra)) });
    k.notes.forEach(function (key) {
      var v = key === 'nSwap'
        ? { a: b(name(s.swap.a)), b: b(name(s.swap.b)), s: b(money(s.swap.save)) }
        : { a: b(name(s.tie[0])), b: b(name(s.tie[1])) };
      out.push(' ');
      out = out.concat(t.parts(key, v));
    });
    return out;
  }

  var labels = { loud: 'pLoud', big: 'pBig', quick: 'pQuick', ratio: 'pRatio', 'same-value': 'pSameValue', 'same-size': 'pSameSize' };
  var R = L.RANGES;
  var projParams = [];
  L.PROJECTS.forEach(function (id, i) {
    var sel = function (p) { return L.normalise(p).proj === id; };   // a project not in play falls back as in the model
    projParams.push(
      { key: id + 'C', type: 'range', label: t('cdOf', { p: name(id) }), min: R[id + 'C'][0], max: R[id + 'C'][1],
        step: R[id + 'C'][2], format: money, visible: sel },
      { key: id + 'D', type: 'range', label: t('dOf'), min: R[id + 'D'][0], max: R[id + 'D'][1], step: R[id + 'D'][2],
        format: function (v) { return t.n('weeks', v, { n: v }); }, visible: sel },
      { key: id + 'V', type: 'choice', label: t('vOf'), visible: sel,
        options: L.LOUD.map(function (v) { return [v, t('v' + v)]; }) });
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'n', type: 'choice', label: t('n'), options: L.COUNTS.map(function (n) { return [n, String(n)]; }) },
      // the project is chosen on the stage (the names in the queue); hidden here, kept in the URL and checked
      { key: 'proj', type: 'choice', label: t('proj'), options: L.PROJECTS.map(function (id) { return [id, name(id)]; }),
        visible: function () { return false; } },
      // the queue order, set by the arrows and the rules on the stage; hidden here, kept in the URL
      { key: 'order', type: 'select', label: t('order'), options: L.ORDERS.map(function (o) { return [o, o]; }),
        visible: function () { return false; } }
    ].concat(projParams, [
      { type: 'button', label: t('sortBtn'), key: 's', run: function (api) {
        api.set({ order: L.ruleOrder(api.params, 'ratio') });
      } }
    ]),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cd-wait', label: t('legWait') },
      { shape: 'cd-build', label: t('legBuild') },
      { shape: 'cd-best', label: t('legBest') },
      { shape: 'cd-mine', label: t('legMine') },
      { shape: 'cd-star', label: t('legStar') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
