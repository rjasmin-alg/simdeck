<!-- fin-lease-vs-buy: the same server bought for cash, bought on a loan or leased. On top, the scoreboard: per way what
     it pays, the cash paid in total (nominal), what it still owns at the end, the NPV at the cost of capital, and the
     balance sheet (asset, liability) at the end of the chosen year; the cheapest in each comparison is ticked. Below
     left, the cash paid so far month by month; below right, each year's expense split into depreciation, interest and
     rent. Ledger: financing.js (promotable); discounting: discount.js (copied from fin-npv-discounting); model:
     sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var D = window.SimdeckModels.discount;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { cash: '1', loan: '2', lease: '3' };
  var NAME = { cash: 'wayCash', loan: 'wayLoan', lease: 'wayLease' };
  var LOWER = { cash: 'nameCash', loan: 'nameLoan', lease: 'nameLease' };
  var sim = null;
  var refocus = null;   // the stage button to give focus back to after a render

  // ── numbers in the page's language ──

  function dec(x, d) {
    var s = x.toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 11); minus is U+2212. */
  function money(x) {
    var r = D.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  /** A percentage with d decimals, or with as many as it needs (0 or 1) when d is left out. */
  function pct(v, d) { return t('pct', { n: dec(v, d == null ? (v % 1 ? 1 : 0) : d) }); }
  function data(text, tag) { return h(tag || 'span', { translate: 'no' }, String(text)); }
  function glyph(w) { return h('span', { class: 'lb-g', dataset: { w: w, c: COLOUR[w] } }); }

  // ── the scoreboard ──

  function subOf(s, w) {
    var p = s.p;
    if (w === 'cash') return t('subCash', { price: money(p.price) });
    if (w === 'loan') return t('subLoan', { n: s.n, a: money(s.instalment), rate: pct(p.loanRate) });
    var key = p.end === 'buyout' ? 'subLeaseBuyout' : p.end === 'extend' ? 'subLeaseExtend' : 'subLeaseReturn';
    return t(key, { n: s.nL, q: money(s.rental), r: money(s.residual) });
  }

  function board(s, chg) {
    var y = s.p.year;
    var th = function (k, title, sub, extra) {
      return h('div', Object.assign({ class: 'lb-th', dataset: { k: k } }, extra || {}), title, sub ? h('span', null, sub) : null);
    };
    var cells = [
      th('way', t('thWay'), null, { class: 'lb-th lb-top', style: { gridRow: 'span 2' } }),
      th('paid', t('thPaid'), t('thPaidSub'), { class: 'lb-th lb-top', style: { gridRow: 'span 2' } }),
      th('owns', t('thOwns'), t('thOwnsSub'), { class: 'lb-th lb-top', style: { gridRow: 'span 2' }, dataset: { k: 'owns', col: 'owns' } }),
      th('npv', t('thNpv', { rate: pct(s.p.coc) }), t('thNpvSub'), { class: 'lb-th lb-top', style: { gridRow: 'span 2' } }),
      th('sheet', y === 0 ? t('thSheetDay') : t('thSheet', { y: y }), null, { class: 'lb-th lb-top', style: { gridColumn: 'span 2' }, dataset: { k: 'sheet', col: 'sheet' } }),
      th('asset', t('thAsset'), null, { dataset: { k: 'asset', sheet: 'true', col: 'sheet' } }),
      th('liab', t('thLiab'), null, { dataset: { k: 'liab', col: 'sheet' } })
    ];
    s.ways.forEach(function (w) {
      var nom = s.picks.nominal.indexOf(w.id) >= 0, val = s.picks.value.indexOf(w.id) >= 0;
      var cell = function (text, win, changed, extra) {
        return h('div', Object.assign({
          class: 'lb-val' + (win ? ' lb-win' : '') + (win && changed ? ' sd-changed' : ''), translate: 'no'
        }, extra || {}), text);
      };
      cells.push(h('div', { class: 'lb-name' }, glyph(w.id),
        h('div', null, h('b', null, t(NAME[w.id])), h('span', null, subOf(s, w.id)))));
      cells.push(cell(money(w.paid), nom, chg.indexOf('nominal') >= 0));
      cells.push(w.owns > 0 ? cell(money(w.owns), false, false, { dataset: { col: 'owns' } }) : h('div', { class: 'lb-val', dataset: { soft: 'true', col: 'owns' } }, t('nothing')));
      cells.push(cell(money(w.npv), val, chg.indexOf('value') >= 0));
      cells.push(cell(money(w.asset), false, false, { dataset: { soft: 'true', sheet: 'true', col: 'sheet' } }));
      cells.push(cell(money(w.liability), false, false, { dataset: { soft: 'true', col: 'sheet' } }));
    });
    return h('div', { class: 'lb-boardwrap' }, h('div', { class: 'lb-board' }, cells));
  }

  // ── scales ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step that keeps the axis to about four grid lines. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }
  function domainOf(max) {
    var step = niceStep(Math.max(max, 1000) / 4);
    return { top: Math.max(step, Math.ceil(max / step) * step), step: step };
  }
  function yOf(dom) { return function (v) { return (100 * (dom.top - v) / dom.top) + '%'; }; }
  function axis(dom, y) {
    var ticks = [], lines = [];
    for (var v = 0; v <= dom.top + 1e-6; v += dom.step) {
      ticks.push(h('span', { class: 'lb-tick', translate: 'no', style: { top: y(v) } }, money(v)));
      if (v > 0) lines.push(h('div', { class: 'lb-gl', style: { top: y(v) } }));
    }
    return { ticks: h('div', { class: 'lb-axis' }, ticks), lines: lines };
  }

  // ── cash paid so far, month by month ──

  function cashChart(s) {
    var M = s.months;
    var dom = domainOf(Math.max.apply(null, s.ways.map(function (w) { return w.paid; })));
    var y = yOf(dom);
    var ax = axis(dom, y);
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    var yNum = function (v) { return (1000 * (dom.top - v) / dom.top).toFixed(1); };
    var marks = [];
    s.ways.forEach(function (w) {
      var pts = ['0,' + yNum(0)].concat(w.series.map(function (v, m) { return (1000 * m / M).toFixed(1) + ',' + yNum(v); }));
      var pl = document.createElementNS(NS, 'polyline');
      pl.setAttribute('class', 'lb-line');
      pl.setAttribute('data-w', w.id);
      pl.setAttribute('data-c', COLOUR[w.id]);
      pl.setAttribute('points', pts.join(' '));
      svg.appendChild(pl);
      marks.push(h('span', { class: 'lb-endmark', style: { left: '100%', top: y(w.paid) } }, glyph(w.id)));
    });
    var xt = [];
    for (var k = 1; k <= s.H; k++) {
      xt.push(h('span', { class: 'lb-xtick', style: { left: (100 * (k - 0.5) / s.H) + '%' } }, t('yearN', { n: k })));
    }
    var yr = s.p.year;
    var now = h('div', Object.assign({ class: 'lb-now', style: { left: (100 * yr / s.H) + '%' } }, yr > s.H / 2 ? { dataset: { end: 'true' } } : {}),
      h('span', { class: 'lb-now-label' }, yr === 0 ? t('dayOne') : t('endOfYear', { n: yr })));
    return h('div', { class: 'lb-panel' },
      h('p', { class: 'lb-title' }, t('cashTitle')),
      h('div', { class: 'lb-plotgrid' }, ax.ticks,
        h('div', { class: 'lb-plot' }, ax.lines, svg, now, marks),
        h('div', { class: 'lb-xaxis' }, xt)));
  }

  // ── expense in each year ──

  var KINDS = [['dep', 'kDep'], ['interest', 'kInt'], ['rent', 'kRent']];

  function expenseChart(s) {
    var max = 0;
    s.ways.forEach(function (w) { w.yearly.forEach(function (e) { max = Math.max(max, e.total); }); });
    var dom = domainOf(max);
    var y = yOf(dom);
    var ax = axis(dom, y);
    var years = [], labels = [];
    for (var k = 0; k < s.H; k++) {
      var now = s.p.year === k + 1 ? { now: 'true' } : {};
      years.push(h('div', { class: 'lb-year', dataset: now }, s.ways.map(function (w) {
        var e = w.yearly[k];
        var segs = KINDS.filter(function (kd) { return e[kd[0]] > 0.5; }).map(function (kd) {
          return h('div', { class: 'lb-seg', dataset: { k: kd[0] }, style: { height: (100 * e[kd[0]] / e.total) + '%' } });
        });
        var title = t(NAME[w.id]) + ', ' + t('yearN', { n: k + 1 }) + ': ' + money(e.total);
        return h('div', { class: 'lb-barcol', title: title },
          e.total > 0.5 ? h('div', { class: 'lb-stack', dataset: { c: COLOUR[w.id] }, style: { height: (100 * e.total / dom.top) + '%' } }, segs, glyph(w.id)) : null);
      })));
      labels.push(h('span', { dataset: now }, t('yearN', { n: k + 1 })));
    }
    var key = KINDS.map(function (kd) { return h('span', { class: 'lb-key' }, h('i', { dataset: { k: kd[0] } }), t(kd[1])); });
    return h('div', { class: 'lb-panel' },
      h('p', { class: 'lb-title' }, h('span', null, t('expTitle')), key),
      h('div', { class: 'lb-plotgrid' }, ax.ticks,
        h('div', { class: 'lb-plot' }, ax.lines, h('div', { class: 'lb-years' }, years)),
        h('div', { class: 'lb-xaxis' }, h('div', { class: 'lb-xlabels' }, labels))));
  }

  // ── render; the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  // ── the stage's own controls: end of the term, the lease in the books, the balance-sheet date ──

  function buttons(label, key, options, current) {
    return h('div', { class: 'lb-tool', role: 'group', 'aria-label': label },
      h('span', { class: 'lb-tool-l' }, label),
      h('div', { class: 'sd-seg' }, options.map(function (o) {
        return h('button', {
          type: 'button', 'aria-pressed': String(o[0] === current), dataset: { key: key + ':' + o[0] },
          onclick: function () {
            var patch = {};
            patch[key] = o[0];
            refocus = key + ':' + o[0];
            sim.set(patch);
          }
        }, o[1]);
      })));
  }

  function tools(s) {
    var years = [[0, t('dayOne')]], terms = [];
    for (var y = 1; y <= s.H; y++) years.push([y, String(y)]);
    for (var k = L.LIM.term.min; k <= L.LIM.term.max; k++) terms.push([k, t.n('termN', k)]);
    return h('div', { class: 'lb-tools' },
      buttons(t('term'), 'term', terms, s.p.term),
      buttons(t('end'), 'end', ENDS, s.p.end),
      buttons(t('books'), 'books', BOOKS, s.p.books),
      buttons(t('year'), 'year', years, s.p.year));
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'lb' }, board(s, chg), tools(s),
      h('div', { class: 'lb-charts' }, cashChart(s), expenseChart(s)),
      h('p', { class: 'lb-foot' }, t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-key="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function names(ids) {
    if (ids.length === 3) return t('all3');
    var n = ids.map(function (id) { return t(LOWER[id]); });
    return n.length === 2 ? t('and2', { a: n[0], b: n[1] }) : n[0];
  }

  function caption(c) {
    var s = c.state, p = s.p;
    var k = L.captionKey(s);
    var b = function (x) { return h('b', { translate: 'no' }, x); };
    var bw = function (x) { return h('b', null, x); };
    var by = {};
    s.ways.forEach(function (w) { by[w.id] = w; });
    var out = k.key === 'capSame'
      ? t.parts('capSame', { who: bw(names(s.picks.value)), rate: b(pct(p.coc)) })
      : t.parts('capDiffer', { nom: bw(names(s.picks.nominal)), val: bw(names(s.picks.value)), rate: b(pct(p.coc)) });
    var yearRent = 12 * s.rental;
    k.notes.forEach(function (key) {
      var vars = {
        nBuyout: { r: b(money(s.residual)), v: b(money(s.residual)) },
        nExtend: { x: b(money(yearRent)), v: b(money(s.endValue)) },
        nLoanCoc: { loan: b(pct(p.loanRate)) },
        nLoanCheap: { loan: b(pct(p.loanRate)), coc: b(pct(p.coc)), i: b(money(by.loan.interest)) },
        nRou: { y: b(s.leaseYearN), x: b(money(s.leaseYear.total)), r: b(money(yearRent)) },
        nRouDay: { l: b(money(s.rightOfUse)) },
        nRent: { r: b(money(yearRent)) }
      }[key];
      out.push(' ');
      out = out.concat(t.parts(key, vars));
    });
    return out;
  }

  var labels = {
    'three-ways': 'pThreeWays', 'loan-at-coc': 'pLoanAtCoc', 'dear-money': 'pDearMoney',
    'buy-out': 'pBuyOut', 'extend': 'pExtend', 'as-rent': 'pAsRent'
  };
  var R = L.LIM;
  var never = function () { return false; };
  var ENDS = [['return', t('endReturn')], ['buyout', t('endBuyout')], ['extend', t('endExtend')]];
  var BOOKS = [['rou', t('booksRou')], ['rent', t('booksRent')]];

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'lease', type: 'range', label: t('lease'), min: R.lease.min, max: R.lease.max, step: R.lease.step, format: function (v) { return pct(v, 2); } },
      { key: 'residual', type: 'range', label: t('residual'), min: R.residual.min, max: R.residual.max, step: R.residual.step, format: function (v) { return pct(v); } },
      { key: 'loanRate', type: 'range', label: t('loanRate'), min: R.loanRate.min, max: R.loanRate.max, step: R.loanRate.step, format: function (v) { return pct(v); } },
      { key: 'coc', type: 'range', label: t('coc'), min: R.coc.min, max: R.coc.max, step: R.coc.step, format: function (v) { return pct(v); } },
      // set on the stage (the four button groups) or fixed (the price); hidden here, kept in the URL and clamped
      { key: 'term', type: 'range', label: t('term'), min: R.term.min, max: R.term.max, step: R.term.step, visible: never },
      { key: 'price', type: 'range', label: t('price'), min: R.price.min, max: R.price.max, step: R.price.step, visible: never },
      { key: 'end', type: 'choice', label: t('end'), options: ENDS, visible: never },
      { key: 'books', type: 'choice', label: t('books'), options: BOOKS, visible: never },
      { key: 'year', type: 'range', label: t('year'), min: 0, max: function (p) { return L.horizon(L.normalise(p)); }, step: 1, visible: never }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'lb-cash', c: 1, label: t('legCash') },
      { shape: 'lb-loan', c: 2, label: t('legLoan') },
      { shape: 'lb-lease', c: 3, label: t('legLease') },
      { shape: 'lb-best', label: t('legBest') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
