<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var HOST = L.HOST;
  var TERMINAL = { h1: 1, h2: 2 };

  // ── small pieces ──

  /** Data (PIDs, names, paths) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function has(s, key) { return s.changed.indexOf(key) >= 0; }
  function chg(on, c) { return on ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''; }
  function isC(ns) { return ns !== HOST; }
  function badge() { return h('span', { class: 'ns-badge', translate: 'no' }, 'C'); }
  /** The name of a namespace as a view label: the host's, or the container's (hatched, C). */
  function nsName(ns) { return isC(ns) ? h('span', null, badge(), ' ', t('nsC')) : t('nsHost'); }

  /** Caption parts: t.parts with every node placeholder cloned where it lands, *word* as <em lang="en"> and `x` as code. */
  var MARK = '\u0001';
  function rich(key, vars) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var out = [];
    t.parts(key, flat).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/(\*[^*]+\*|`[^`]+`)/).forEach(function (bit) {
        if (!bit) return;
        if (/^\*[^*]+\*$/.test(bit)) { out.push(h('em', { lang: 'en' }, bit.slice(1, -1))); return; }
        if (/^`[^`]+`$/.test(bit)) { out.push(code(bit.slice(1, -1))); return; }
        bit.split(MARK).forEach(function (piece, j) {
          if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
          else if (piece) out.push(piece);
        });
      });
    });
    return out;
  }
  function sp(parts) { return [' '].concat(parts); }

  // ── the command strip ──

  var FLAGS = [['pid', '--pid'], ['fork', '--fork'], ['mountProc', '--mount-proc'], ['net', '--net'], ['mount', '--mount']];
  function cmdText(c) {
    switch (c.op) {
      case 'unshare': return 'unshare ' + FLAGS.filter(function (f) { return c.flags[f[0]]; }).map(function (f) { return f[1]; }).join(' ') + ' bash' + (c.norc ? ' --norc' : '');
      case 'echo': return 'echo $$';
      case 'ps': return 'ps -eo pid,comm';
      case 'ip': return 'ip -br link';
      case 'mount': return 'mount -t ' + c.fstype + ' ' + c.src + ' ' + c.target;
      case 'findmnt': return 'findmnt ' + c.target;
      case 'ls': return 'ls';
      case 'bg': return c.name + ' 1000 &';
      case 'kill': return 'kill ' + (c.flag ? c.flag + ' ' : '') + c.pid;
      case 'exit': return 'exit';
    }
    return '';
  }
  /** Output lines a preset ever prints at once: the strip keeps that height, so the panels do not jump. */
  var linesMemo = {};
  function maxLines(p) {
    if (linesMemo[p.scene] == null) {
      var n = 1;
      for (var i = 0; i <= L.steps(p); i++) n = Math.max(n, Simdeck.stateAt(L, p, i).out.length);
      linesMemo[p.scene] = n;
    }
    return linesMemo[p.scene];
  }
  function shell(s, p) {
    var c = s.cmd;
    var side = !c ? null : c.on === 'c' ? h('span', { class: 'ns-side ns-c' }, badge(), ' ', t('sideC'))
      : h('span', { class: 'ns-side' }, t('sideHost', { n: TERMINAL[c.on] }));
    var out = !c ? [] : s.out.length ? s.out.map(function (l) { return h('span', { class: s.lastError ? 'ns-err' : null }, l + '\n'); })
      : [h('span', { class: 'ns-none' }, t('noOutput'))];
    return h('div', { class: 'ns-shell' }, side || h('span'),
      h('div', { class: 'ns-cmd' }, c ? [h('span', { class: 'ns-prompt', translate: 'no' }, '# '), h('span', { translate: 'no' }, cmdText(c))]
        : h('span', { class: 'ns-hint' }, t('before'))),
      h('pre', { class: 'ns-out', translate: c && s.out.length ? 'no' : null, style: { '--lines': String(maxLines(p)) } }, out));
  }

  // ── the two views ──

  /** Depth of a process in the tree its view can see: parents outside the view make a root. */
  function depths(rows) {
    var byId = {}, out = {};
    rows.forEach(function (r) { byId[r.id] = r; });
    function d(r) { if (out[r.id] != null) return out[r.id]; var p = byId[r.parent]; out[r.id] = p && p !== r ? d(p) + 1 : 0; return out[r.id]; }
    rows.forEach(d);
    return out;
  }
  function procRow(c, side, r, depth, gone) {
    var s = c.state;
    var pid = side === HOST && r.inner != null ? [String(r.pid), h('span', { class: 'ns-inner' }, ' / ' + r.inner)] : String(r.pid);
    var extra = [];
    if (side === HOST && !isC(r.nsPid) && !gone) {                 // a host process inside the container's net or mount (unshare)
      if (isC(r.nsNet)) extra.push(h('span', { class: 'ns-chip ns-c' }, t('kindNet'), badge()));
      if (isC(r.nsMnt)) extra.push(h('span', { class: 'ns-chip ns-c' }, t('kindMnt'), badge()));
      if (r.forChildren) extra.push(h('span', { class: 'ns-chip ns-c' }, t.parts('tagNext', { ns: badge() })));
    }
    if (isC(r.nsPid)) extra.unshift(badge());
    if (r.ran) extra.push(h('span', { class: 'ns-tag' }, t('tagRan')));
    if (gone) extra.push(h('span', { class: 'ns-tag' }, t('tagGone')));
    return h('li', { class: 'ns-row' + (isC(r.nsPid) ? ' ns-c' : '') + (r.ran ? ' ns-ran' : '') + (gone ? ' ns-gone' : '') + chg(!gone && has(s, side + ':proc:' + r.id), c) },
      h('span', { class: 'ns-pid', translate: 'no' }, pid),
      depth ? h('span', { class: 'ns-tree', translate: 'no' }, new Array(depth).join('  ') + '└ ') : null,
      h('span', { class: 'ns-main', translate: 'no' }, r.name), extra);
  }
  function ifaceRow(c, side, net, i, gone) {
    var s = c.state;
    return h('li', { class: 'ns-row' + (isC(net) ? ' ns-c' : '') + (gone ? ' ns-gone' : '') + chg(!gone && has(s, side + ':iface:' + i.name), c) },
      h('span', { class: 'ns-main', translate: 'no' }, i.name),
      h('span', { class: 'ns-state' }, (i.up ? '● ' : '○ ') + t(i.up ? 'up' : 'down')),
      gone ? h('span', { class: 'ns-tag' }, t('tagGone')) : null);
  }
  function mountRow(c, side, mnt, m, gone) {
    var s = c.state;
    return h('li', { class: 'ns-row ns-mcols' + (isC(mnt) ? ' ns-c' : '') + (gone ? ' ns-gone' : '') + chg(!gone && has(s, side + ':mnt:' + m.target), c) },
      h('span', { class: 'ns-main', translate: 'no' }, m.target),
      h('span', { class: 'ns-mono', translate: 'no' }, m.src + ' · ' + m.fstype),
      m.pidns ? h('span', { class: 'ns-tag' }, t.parts('pidsOf', { ns: nsName(m.pidns) })) : gone ? h('span', { class: 'ns-tag' }, t('tagGone')) : h('span'));
  }
  function section(title, note, rows) {
    return h('div', { class: 'ns-sec' }, h('h4', null, h('b', null, title), note), h('ul', { class: 'ns-rows' }, rows));
  }
  function nsHead(ns) {
    return [['kindPid', ns.pid], ['kindNet', ns.net], ['kindMnt', ns.mnt]].map(function (k) {
      return h('span', { class: 'ns-chip' + (isC(k[1]) ? ' ns-c' : '') }, h('b', null, t(k[0])), isC(k[1]) ? badge() : h('span', null, t('nsHost')));
    });
  }

  function panel(c, side) {
    var s = c.state, v = L.view(s, side);
    var title = h('h3', null, t(side === HOST ? 'panelHost' : 'panelC'));
    var lost = s.gone[side];
    var goneProcs = lost.filter(function (r) { return r.pid != null; });
    var goneIfaces = lost.filter(function (r) { return r.mac != null; });
    var goneMounts = lost.filter(function (r) { return r.target != null; });
    // no container (yet, or any more): its rows left the view, but the host's processes did not end, so none is struck
    if (!v) return h('div', { class: 'ns-panel', dataset: { side: side } }, h('div', { class: 'ns-phead' }, title),
      h('p', { class: 'ns-empty' + chg(lost.length > 0, c) }, t(lost.length ? 'containerGone' : 'noContainer')));
    var all = v.procs.map(function (r) { return { r: r, gone: false }; }).concat(goneProcs.map(function (r) { return { r: r, gone: true }; }));
    all.sort(function (a, b) { return a.r.pid - b.r.pid || (a.r.id < b.r.id ? -1 : 1); });
    var dep = depths(all.map(function (x) { return x.r; }));
    var shared = side !== HOST;
    return h('div', { class: 'ns-panel', dataset: { side: side } },
      h('div', { class: 'ns-phead' }, title, side === HOST ? null : nsHead(v.ns)),
      section(t('secProcs'), [h('span', null, t.parts('procFrom', { ns: nsName(v.procFrom) })),
        v.self ? h('span', null, t.parts('self', { pid: data(v.self.pid) })) : null],
        all.map(function (x) { return procRow(c, side, x.r, dep[x.r.id], x.gone); })),
      section(t('secIfaces'), shared && !isC(v.ns.net) ? h('span', null, t('shared')) : null,
        v.ifaces.map(function (i) { return ifaceRow(c, side, v.ns.net, i, false); }).concat(goneIfaces.map(function (i) { return ifaceRow(c, side, v.ns.net, i, true); }))),
      section(t('secMounts'), shared && !isC(v.ns.mnt) ? h('span', null, t('shared')) : null,
        v.mounts.map(function (m) { return mountRow(c, side, v.ns.mnt, m, false); }).concat(goneMounts.map(function (m) { return mountRow(c, side, v.ns.mnt, m, true); }))));
  }

  // ── the kernel bar ──

  function kernel(c) {
    var s = c.state;
    var kinds = [['pid', 'kindPid'], ['net', 'kindNet'], ['mnt', 'kindMnt']];
    return h('div', { class: 'ns-kernel' }, h('h3', null, t('kernel')),
      kinds.map(function (k) {
        var now = s.ns[k[0]], before = c.prev ? c.prev.ns[k[0]] : [];
        var chips = now.map(function (n) {
          var note = null;
          if (k[0] === 'pid' && isC(n.id)) {
            if (n.dead) note = t('nsClosed');
            else if (!n.init) note = t('nsNoProc');
            else note = t.parts('nsInit', { name: data(L.proc(s, n.init).name) });
          }
          return h('span', { class: 'ns-chip' + (isC(n.id) ? ' ns-c' : '') + (n.dead ? ' ns-closed' : '') + chg(has(s, 'ns:' + k[0] + ':' + n.id), c) },
            isC(n.id) ? [badge(), ' ', t('nsC')] : t('nsHost'), note ? h('span', { class: 'ns-muted' }, '· ', note) : null);
        });
        before.forEach(function (n) {
          if (!now.some(function (x) { return x.id === n.id; })) chips.push(h('span', { class: 'ns-chip ns-gone' }, badge(), ' ', h('s', null, t('nsC')), ' · ', t('nsGone')));
        });
        return h('span', { class: 'ns-kind' }, h('b', null, t(k[1])), chips);
      }));
  }

  function render(c) {
    var s = c.state, p = c.params;
    c.stage.replaceChildren(h('div', { class: 'ns' }, shell(s, p),
      h('div', { class: 'ns-views', dataset: p.view === 'host' || p.view === 'container' ? { view: p.view } : {} }, panel(c, HOST), panel(c, 'container')),
      kernel(c)));
  }

  // ── captions ──

  function hostPid(s, id) { var q = L.proc(s, id); return q ? q.pidByNs[HOST] : null; }

  function caption(c) {
    var s = c.state, ev = s.event, cmd = s.cmd, prev = c.prev;
    if (c.n === 0) return rich('capStart').concat(sp(rich('capGoal_' + s.scene)));
    switch (cmd.op) {
      case 'unshare': {
        var f = cmd.flags, sh = L.proc(s, s.container);
        if (!f.fork) return rich('capUnshareNoFork', { pid: data(sh.pidByNs[HOST]) });
        if (f.mountProc && !f.net) return rich('capUnshareProc');
        var out = rich('capUnshare', { host: data(sh.pidByNs[HOST]) });
        if (c.n > 1) out = rich('capAgain').concat(sp(out));             // the second run of a comparison
        if (f.net) out = out.concat(sp(rich('capUnshareNet')));
        out = out.concat(sp(rich(f.mountProc ? 'capUnshareMnt' : 'capUnshareNoProc')));
        return out;
      }
      case 'echo':
        return ev.pid === 1 ? rich('capEchoInit') : rich('capEchoHost', { pid: data(ev.pid) });
      case 'ps': {
        if (s.lastError) return rich('capForkFail');
        if (ev.procFrom === HOST) return rich('capPsHost', { host: data(hostPid(s, s.container)) });
        var ps = L.proc(s, ev.ran), mine = ps.pidByNs[ps.nsPid];
        if (L.pidNs(s, ps.nsPid).killed) return rich('capPsAfter', { pid: data(mine) });
        return rich('capPsOwn', { host: data(ps.pidByNs[HOST]) });
      }
      case 'ip':
        return rich(cmd.on === 'c' ? 'capIpC' : 'capIpH');
      case 'mount':
        return rich('capMount');
      case 'findmnt':
        return rich(ev.found ? 'capFindC' : 'capFindH');
      case 'ls': {
        if (s.lastError) return rich('capForkFail');
        if (ev.init) return rich('capLsInit', { host: data(hostPid(s, ev.ran)) });
        return [code(s.out.join(' '))];
      }
      case 'bg': {
        var bg = L.proc(s, ev.started);
        return rich('capBg', { inner: data(bg.pidByNs[bg.nsPid]), host: data(bg.pidByNs[HOST]) });
      }
      case 'kill': {
        var k = ev.kill;
        var kc = code(cmdText(cmd));
        if (k.result === 'ESRCH') return rich(cmd.on === 'c' ? 'capKillNoSuchC' : 'capKillNoSuchH', { cmd: kc, pid: data(cmd.pid) });
        if (k.result === 'ignored') return rich('capKillIgnored');
        if (k.result === 'dropped') {
          if (k.inside) return rich(cmd.sig === 'KILL' ? 'capKillKill' : 'capKillUsr');
          return rich('capKillDropped');
        }
        if (ev.zapped || (prev && prev.container === k.target)) return rich('capKillInit', { host: data(cmd.pid) });
        if (cmd.on !== 'c') {
          var tg = L.proc(prev, k.target);
          return rich('capKillHost', { cmd: kc, inner: data(tg.pidByNs[tg.nsPid]) });
        }
        return rich('capKilled');
      }
      case 'exit': {
        var kinds = [['pid', 'kindsPid'], ['net', 'kindsNet'], ['mnt', 'kindsMnt']].filter(function (k) {
          return prev.ns[k[0]].some(function (n) { return isC(n.id) && has(s, 'ns:' + k[0] + ':' + n.id); });
        }).map(function (k) { return t(k[1]); });
        var waited = (ev.ended || []).some(function (e) { return L.proc(prev, e.id) && L.proc(prev, e.id).name === 'unshare'; });
        if (!waited) return rich('capExitNoFork');
        return kinds.length > 1 ? rich('capExitInit', { kinds: kinds.join(', ') }) : rich('capExitInitPid');
      }
    }
    return rich('capErr');
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'select', label: t('scene'), resets: true,
        options: [['full', t('pFull')], ['no-mount-proc', t('pNoProc')], ['no-fork', t('pNoFork')], ['kill-init', t('pKillInit')], ['one-way', t('pOneWay')]],
        visible: function () { return false; } },
      { key: 'view', type: 'choice', label: t('view'), hint: t('viewHint'),
        options: [['both', t('viewBoth')], ['host', t('viewHost')], ['container', t('viewContainer')]] }
    ],

    presets: [
      { id: 'full', label: t('pFull'), params: { scene: 'full' }, hint: t('pFullHint') },
      { id: 'no-mount-proc', label: t('pNoProc'), params: { scene: 'no-mount-proc' }, hint: t('pNoProcHint') },
      { id: 'no-fork', label: t('pNoFork'), params: { scene: 'no-fork' }, hint: t('pNoForkHint') },
      { id: 'kill-init', label: t('pKillInit'), params: { scene: 'kill-init' }, hint: t('pKillInitHint') },
      { id: 'one-way', label: t('pOneWay'), params: { scene: 'one-way' }, hint: t('pOneWayHint') }
    ],

    legend: [
      { shape: 'ns-host', label: t('legHost') },
      { shape: 'ns-c', label: t('legC') },
      { shape: 'ns-pair', label: t('legPair') },
      { shape: 'ns-ran', label: t('legRan') },
      { shape: 'ns-gone', label: t('legGone') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
