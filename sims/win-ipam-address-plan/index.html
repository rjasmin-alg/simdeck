<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var PRESET_KEY = { 'grafo': 'presetGrafo', 'add-nabava': 'presetNabava', 'double-growth': 'presetDouble', 'as-listed': 'presetListed', 'two-sites': 'presetTwo' };
  var GRAFO_C = { sales: 1, production: 2, management: 3, branch: 4, guests: 5, link: 6, purchasing: 7 };
  var ALL_IDS = L.GRAFO.concat([L.NABAVA], L.TWO_SITES).map(function (n) { return n.id; });

  // ── words and data ──
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  /** 63 616: a thin space between thousands from five digits up (four-digit numbers stay whole). */
  function grouped(n) { return n >= 10000 ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(n); }
  /** A count for t.parts: the kit picks the plural form from its number (Number(n)) and writes its text (String(n)),
      so large counts keep their thin-space grouping. */
  function count(n) { return { valueOf: function () { return n; }, toString: function () { return grouped(n); } }; }
  function isTwo(r) { return /^(zg|st)\d+$/.test(r.id); }
  function nameText(r) { return isTwo(r) ? r.id.slice(0, 2).toUpperCase() + '-' + r.id.slice(2) : t('n_' + r.id); }
  function nameNode(r) { return isTwo(r) ? data(nameText(r)) : h('span', null, nameText(r)); }
  function colourOf(r) { return isTwo(r) ? (r.site === 'zagreb' ? 1 : 2) : GRAFO_C[r.id] || 8; }
  function siteNode(r) {
    var site = r.site === 'zagreb' ? data('Zagreb') : r.site === 'split' ? data('Split') : h('span', null, t('s_' + r.site));
    var vlan = r.vlan != null ? h('span', null, ', ', t('vlan', { v: '' }), data(r.vlan)) : r.id === 'purchasing' ? h('span', null, ', ', t('vlanOpen')) : null;
    return h('span', null, site, vlan);
  }
  /** An address in captions: the last octet (".140") in a /24, the whole address in a larger block. */
  function addr(s, off) { var v = s.block.base + off; return s.block.prefix >= 24 ? '.' + (v & 255) : L.format(v); }
  /** A tick under the bar: the last octet in a /24, the last two in a /16 (".7.128"). */
  function tickText(s, off) { var v = s.block.base + off; return s.block.prefix >= 24 ? '.' + (v & 255) : '.' + ((v >>> 8) & 255) + '.' + (v & 255); }
  function rangeById(s, id) { for (var i = 0; i < s.ranges.length; i++) if (s.ranges[i].id === id) return s.ranges[i]; return null; }

  // ── "changed by the last param": page memory, not model state ──
  var memo = null;
  function changedSet(c) {
    var p = Object.assign({}, c.params); delete p.sel;
    var key = JSON.stringify(p);
    if (memo && memo.key === key) return memo.changed;
    var now = {};
    c.state.ranges.forEach(function (r) { now[r.id] = [r.placed, r.start, r.prefix].join(); });
    var changed = {};
    if (memo) Object.keys(now).forEach(function (id) { if (memo.ranges[id] !== now[id]) changed[id] = true; });
    memo = { key: key, ranges: now, changed: changed };
    return changed;
  }

  // ── the bar ──
  function viewOf(s) {
    if (s.block.size <= 256 || !s.fits) return s.block.size;
    var v = 256;
    while (v < s.end) v *= 2;
    return v * 4 > s.block.size ? s.block.size : v;
  }

  function bar(s, changed) {
    var view = viewOf(s);
    var over = s.order.map(function (id) { return rangeById(s, id); }).filter(function (r) { return !r.placed; });
    var overSum = over.reduce(function (a, r) { return a + r.total; }, 0);
    var scale = view + overSum;
    function pct(x) { return (100 * x / scale).toFixed(3) + '%'; }
    var segs = [], calls = [], ticks = [];

    function seg(cls, from, len, lab, sub, callText, extra) {
      var el = h('div', Object.assign({ class: 'ip-seg ' + cls, style: { left: pct(from), width: pct(len) } }, extra || {}),
        h('span', { class: 'ip-lab' }, lab, sub != null ? h('small', null, sub) : null));
      var call = h('span', { class: 'ip-call' + (cls.indexOf('ip-over') >= 0 ? ' ip-callover' : '') + (cls.indexOf('sd-changed') >= 0 ? ' sd-changed' : '') }, callText);
      segs.push(el);
      calls.push({ seg: el, call: call, stem: h('span', { class: 'ip-stem' }), centre: (from + len / 2) / scale });
    }

    s.order.forEach(function (id) {
      var r = rangeById(s, id);
      if (!r.placed || r.start >= view) return;
      var ch = changed[r.id] ? ' sd-changed' : '';
      seg('sd-fill' + ch, r.start, r.total, nameNode(r), data('/' + r.prefix), [nameNode(r), ' ', data('/' + r.prefix)],
        { dataset: { c: String(colourOf(r)) } });
      ticks.push({ at: r.start, text: tickText(s, r.start) });
    });
    s.free.forEach(function (f) {
      if (f.from >= view) return;
      var len = Math.min(f.to, view - 1) - f.from + 1;
      seg(f.gap ? 'ip-gap' : 'ip-free', f.from, len, data(grouped(f.size) + (f.to >= view ? ' →' : '')), null,
        data(grouped(f.size)), null);
      ticks.push({ at: f.from, text: tickText(s, f.from) });
    });
    var pos = view;
    over.forEach(function (r) {
      var first = r.id === s.firstUnplaced;
      seg('ip-over' + (first ? ' ip-firstover' : ''), pos, r.total, [h('span', { class: 'ip-x' }, '✕ '), nameNode(r)], data('/' + r.prefix),
        [h('span', { class: 'ip-x' }, '✕ '), nameNode(r), ' ', data('/' + r.prefix)]);
      pos += r.total;
    });
    ticks.push({ at: view, end: true, text: view === s.block.size ? tickText(s, view - 1) : tickText(s, view - 1) + ' →' });

    var frame = h('div', { class: 'ip-blockframe', style: { width: pct(view) } });
    var lane = h('div', { class: 'ip-lane' }, calls.map(function (x) { return [x.stem, x.call]; }));
    var barEl = h('div', { class: 'ip-bar' }, segs, frame);
    var tickEls = ticks.map(function (k) {
      return { at: k.at / scale, el: h('div', { class: 'ip-tick' + (k.end ? ' ip-end' : '') }, h('span', { translate: 'no' }, k.text)) };
    });
    var tickRow = h('div', { class: 'ip-ticks' }, tickEls.map(function (k) { return k.el; }));
    var inner = h('div', { class: 'ip-barin' }, lane, barEl, tickRow);
    inner.layout = function () { layoutBar(lane, barEl, calls, tickRow, tickEls); };
    return inner;
  }

  /** Greedy lanes: each item (x = its centre in px, w = its width) goes into the first lane where it clears the
      previous one; items are clamped inside [0, W]. */
  function place(items, W, lanes) {
    var ends = [];
    for (var k = 0; k < lanes; k++) ends.push(-Infinity);
    items.sort(function (a, b) { return a.x - b.x; });
    items.forEach(function (it) {
      var left = Math.max(0, Math.min(W - it.w, it.x - it.w / 2));
      var lane = -1;
      for (var k = 0; k < lanes; k++) if (left >= ends[k] + 6) { lane = k; break; }
      if (lane < 0) { lane = ends.indexOf(Math.min.apply(null, ends)); left = Math.min(W - it.w, ends[lane] + 6); }
      ends[lane] = left + it.w;
      it.left = left; it.lane = lane;
    });
  }

  function layoutBar(lane, barEl, calls, tickRow, ticks) {
    var W = barEl.clientWidth;
    if (!W) return;
    var out = [];
    calls.forEach(function (x) {
      var lab = x.seg.firstChild;
      x.seg.classList.remove('ip-out');
      x.call.classList.remove('ip-on'); x.stem.classList.remove('ip-on');
      var fits = lab.scrollWidth <= x.seg.clientWidth - 2 && lab.scrollHeight <= x.seg.clientHeight;
      if (!fits) out.push(x);
    });
    out.forEach(function (x) { x.seg.classList.add('ip-out'); x.call.classList.add('ip-on'); });
    var items = out.map(function (x) { return { x: x.centre * W, w: x.call.offsetWidth, ref: x }; });
    place(items, W, 2);
    var used = items.reduce(function (m, it) { return Math.max(m, it.lane + 1); }, 0);
    lane.dataset.lanes = String(used);            // the lane band is as tall as the callouts need
    var lh = used ? lane.clientHeight / used : 0;
    items.forEach(function (it) {
      var top = (used - 1 - it.lane) * lh;         // lane 0 sits next to the bar
      it.ref.call.style.left = it.left + 'px';
      it.ref.call.style.top = top + 'px';
      it.ref.stem.style.left = it.x + 'px';
      it.ref.stem.style.top = (top + it.ref.call.offsetHeight) + 'px';
      it.ref.stem.style.height = Math.max(0, lane.clientHeight - top - it.ref.call.offsetHeight) + 'px';
      it.ref.stem.classList.add('ip-on');
    });
    var tItems = ticks.map(function (k) { return { x: k.at * W, w: k.el.firstChild.offsetWidth, ref: k }; });
    place(tItems, W, 2);
    var th = tickRow.clientHeight / 2;
    tItems.forEach(function (it) {
      it.ref.el.style.left = it.left + 'px';
      it.ref.el.style.top = (it.lane * th) + 'px';
      it.ref.el.style.setProperty('--x', (it.x - it.left) + 'px');
    });
  }

  function overview(s, view) {
    if (view >= s.block.size) return null;
    var w = (100 * view / s.block.size).toFixed(3) + '%';
    return h('div', { class: 'ip-overview' },
      h('span', null, t('wholeBlock'), ' ', data(s.block.name)),
      h('span', { class: 'ip-ovbar', 'aria-hidden': 'true' }, h('span', { class: 'ip-ovwin', style: { width: w } })));
  }

  // ── the IPAM table ──
  function table(s, p, changed) {
    var sel = p.sel && rangeById(s, p.sel) ? p.sel : s.order[0];
    var rows = [];
    rows.push(h('tr', { class: 'ip-blockrow' },
      h('td', null, ''),
      h('td', { colspan: '2' }, data(s.block.name), ' ', h('span', { class: 'ip-note' }, t('blockKind'))),
      h('td', { class: 'ip-num' }, ''),
      h('td', null, data(L.format(s.block.base) + '/' + s.block.prefix)),
      h('td', null, data(L.format(L.mask(s.block.prefix)))),
      h('td', { class: 'ip-num' }, data(grouped(s.block.size))),
      h('td', { colspan: '2' }, h('span', { class: 'ip-note' }, t('blockUsed', { used: grouped(s.used), free: grouped(s.freeTotal) }))),
      h('td', null, '')));
    s.order.forEach(function (id) {
      var r = rangeById(s, id);
      var ch = !!changed[r.id];
      var isFirst = p.first === r.id;
      var name = h('button', {
        type: 'button', class: 'ip-name' + (sel === r.id ? ' ip-sel' : '') + (ch ? ' sd-changed' : ''), 'aria-pressed': sel === r.id ? 'true' : 'false',
        dataset: { sel: r.id }
      }, h('span', { class: 'ip-sw', dataset: { c: String(colourOf(r)) } }),
        r.placed ? null : h('span', { class: 'ip-x' }, '✕ '), nameNode(r));
      var top = h('button', { type: 'button', class: 'ip-top', 'aria-pressed': isFirst ? 'true' : 'false', 'aria-label': t('toTop', { name: nameText(r) }), title: t('toTop', { name: nameText(r) }), dataset: { top: r.id } }, '↑');
      rows.push(h('tr', { class: r.placed ? '' : 'ip-unplaced' },
        h('td', null, top),
        h('td', null, name),
        h('td', null, siteNode(r)),
        h('td', { class: 'ip-num' }, data(r.hosts), ' ', h('span', { class: 'ip-grow' + (r.needed > r.hosts ? ' ip-up' : '') }, data('→ ' + r.needed))),
        h('td', null, r.placed ? data(L.format(r.network) + '/' + r.prefix) : [h('span', { class: 'ip-x' }, '✕ '), data('/' + r.prefix), ' ', t('notPlaced')]),
        h('td', null, data(L.format(r.mask))),
        h('td', { class: 'ip-num' }, data(grouped(r.total))),
        h('td', { class: 'ip-num' }, data(grouped(r.usable))),
        h('td', null, t(r.managedBy === 'ipam' ? 'm_ipam' : 'm_dhcp')),
        h('td', { class: 'ip-num' }, data(r.util + ' %'), r.full ? h('span', { class: 'ip-badge' }, t('full')) : null)));
      if (sel === r.id && r.placed) {
        rows.push(h('tr', { class: 'ip-addr' }, h('td', { colspan: '10' }, h('div', { class: 'ip-addrs' },
          h('span', null, t('addrTitle', { name: nameText(r) })),
          h('span', null, h('b', null, t('aNet')), ' ', data(L.format(r.network))),
          h('span', null, h('b', null, t('aFirst')), ' ', data(L.format(r.first))),
          h('span', null, data('…')),
          h('span', null, h('b', null, t('aLast')), ' ', data(L.format(r.last))),
          h('span', null, h('b', null, t('aBcast')), ' ', data(L.format(r.broadcast)))))));
      }
    });
    rows.push(h('tr', { class: 'ip-sum' + (s.sum > s.block.size ? ' ip-over' : '') }, h('td', { colspan: '10' },
      t('sumRow', { sum: grouped(s.sum), space: grouped(s.block.size) }))));
    return h('table', null,
      h('caption', null, t('ipamTitle')),
      h('thead', null, h('tr', null,
        h('th', { 'aria-label': t('thTop') }, '↑'), h('th', null, t('thRange')), h('th', null, t('thSite')), h('th', { class: 'ip-num' }, t('thHosts'), ' → ', t('thNeeded')),
        h('th', null, t('thNetwork')), h('th', null, t('thMask')), h('th', { class: 'ip-num' }, t('thTotal')), h('th', { class: 'ip-num' }, t('thUsable')),
        h('th', null, t('thManaged')), h('th', { class: 'ip-num' }, t('thUtil')))),
      h('tbody', null, rows));
  }

  // ── stage clicks: select a range, move a need to the top of the list ──
  function wire(stage) {
    if (stage.dataset.wired) return;
    stage.dataset.wired = '1';
    stage.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
    stage.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b || !window.simdeck) return;
      var p = window.simdeck.params;
      if (b.dataset.sel) window.simdeck.set({ sel: b.dataset.sel });
      else if (b.dataset.top) window.simdeck.set({ first: p.first === b.dataset.top ? '' : b.dataset.top });
    });
  }

  var observer = null, current = null;
  function hiddenSelect(key) {
    return { key: key, type: 'select', label: t('hidden'), options: [''].concat(ALL_IDS).map(function (v) { return [v, v || '-']; }), visible: function () { return false; } };
  }

  // ── captions ──
  function B(node) { return h('b', null, node); }
  function freeSentence(s) {
    if (!s.freeTotal) return [t('capFreeNone')];
    if (s.free.length === 1) {
      var f = s.free[0];
      return t.parts('capFree', { n: count(f.size), from: data(addr(s, f.from)), to: data(addr(s, f.to)) });
    }
    var big = s.free.reduce(function (m, x) { return x.size > m.size ? x : m; });
    return t.parts('capFreeMany', { n: data(grouped(s.freeTotal)), big: data(grouped(big.size)), from: data(addr(s, big.from)), to: data(addr(s, big.to)) });
  }
  function from(s, r) { return t.parts('capFrom', { name: B(nameNode(r)), prefix: data('/' + r.prefix), at: data(addr(s, r.start)) }); }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'block', type: 'choice', label: t('block'), options: L.blocks.map(function (b) { return [b, b]; }) },
      { key: 'growth', type: 'range', label: t('growth'), min: 0, max: 200, step: 25, format: function (v) { return v + ' %'; } },
      { key: 'twoSites', type: 'toggle', label: t('setTwo') },
      { key: 'nabava', type: 'choice', label: t('nabava'), options: [['off', t('nabavaOff')], ['add', t('nabavaAdd')], ['plan', t('nabavaPlan')]],
        disabled: function (p) { return p.twoSites ? t('nabavaOnlyGrafo') : false; } },
      { key: 'strategy', type: 'choice', label: t('strategy'), options: [['largest', t('stLargest')], ['listed', t('stListed')]] },
      hiddenSelect('first'),
      hiddenSelect('sel')
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(PRESET_KEY[x.id]), hint: t(PRESET_KEY[x.id] + 'Hint'), params: x.params };
    }),

    legend: [
      { c: 1, label: t('legRange') },
      { shape: 'ip-free', label: t('legFree') },
      { shape: 'ip-gap', label: t('legGap') },
      { shape: 'ip-over', label: t('legNoFit') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var changed = changedSet(c);
      var view = viewOf(s);
      var b = bar(s, changed);
      var head = h('div', { class: 'ip-head' },
        h('h2', null, t('barTitle'), ' ', data(s.block.name)),
        view < s.block.size ? h('span', { class: 'ip-note' }, t('windowNote', { n: grouped(view), net: L.format(s.block.base) + '/' + (32 - Math.log2(view)), total: grouped(s.block.size) })) : null);
      // keep keyboard focus on the button that was pressed: the stage is rebuilt on every change
      var a = document.activeElement, keep = null;
      if (a && c.stage.contains(a) && a.dataset) keep = a.dataset.sel ? '[data-sel="' + a.dataset.sel + '"]' : a.dataset.top ? '[data-top="' + a.dataset.top + '"]' : null;
      c.stage.replaceChildren(h('div', { class: 'ip' },
        h('div', { class: 'ip-barbox' }, head, overview(s, view), b),
        h('div', { class: 'ip-tablebox' }, table(s, c.params, changed))));
      wire(c.stage);
      if (keep) { var el = c.stage.querySelector(keep); if (el) el.focus({ preventScroll: true }); }
      current = b;
      b.layout();
      if (!observer && typeof ResizeObserver === 'function') {
        observer = new ResizeObserver(function () { if (current && current.isConnected) current.layout(); });
        observer.observe(c.stage);
      }
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (current === b) b.layout(); });
    },

    caption: function (c) {
      var s = c.state;
      if (!s.fits) {
        var u = rangeById(s, s.firstUnplaced);
        var v = { sum: data(grouped(s.sum)), space: data(grouped(s.block.size)), name: B(nameNode(u)), prefix: data('/' + u.prefix) };
        if (s.sum > s.block.size) return t.parts(s.growth ? 'capNoFitSum' : 'capNoFitSumNoGrowth', v);
        var out = t.parts('capNoFitAlign', v);
        if (s.strategy === 'listed') out.push(' ', t('capTryLargest'));
        return out;
      }
      var added = s.ranges.filter(function (r) { return r.added && r.placed; })[0];
      if (added) {
        var av = { name: B(nameNode(added)), prefix: data('/' + added.prefix), at: data(addr(s, added.start)), cursor: data(addr(s, added.cursor)), size: data(added.total), end: data(addr(s, added.end)) };
        var first;
        if (added.start > added.cursor) first = t.parts('capAdd', Object.assign({ n: count(added.start - added.cursor) }, av));
        else if (added.start === added.cursor) first = t.parts('capAddAligned', av);
        else first = t.parts('capAddReuse', av);
        return first.concat([' '], freeSentence(s));
      }
      var seq = s.placeOrder.map(function (id) { return rangeById(s, id); });
      var parts = [t(s.strategy === 'listed' ? 'capListed' : 'capLargest')].concat(from(s, seq[0]));
      var gaps = s.free.filter(function (f) { return f.gap; });
      if (gaps.length) {
        // as listed: the first range, then the largest hole and the range that had to wait behind it
        var g = gaps.reduce(function (m, x) { return x.size > m.size ? x : m; });
        var after = s.ranges.filter(function (r) { return r.placed && r.start === g.to + 1; })[0];
        parts.push('. ');
        parts = parts.concat(t.parts('capGap', { n: count(g.size), name: B(nameNode(after)), prefix: data('/' + after.prefix), at: data(addr(s, after.start)) }), [' ']);
        return parts.concat(freeSentence(s));
      }
      if (seq.length > 1) parts = parts.concat([', '], from(s, seq[1]));
      parts.push(seq.length > 2 ? t('capMore') : '. ');
      return parts.concat(freeSentence(s));
    }
  });
})();
</script>
</body>
