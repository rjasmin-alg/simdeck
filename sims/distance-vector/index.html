<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var note = null;   // a rejected button press: said once in the next caption

  // Where each scene's nodes sit in the grid: [col, row]; every card spans three columns, one empty column between.
  var LAYOUT = {
    line: { cols: 11, rows: ['auto', 'minmax(3rem, 7rem)', 'auto'], pos: { A: [0, 0], B: [4, 0], C: [8, 0], N: [8, 2] } },
    ring: { cols: 11, rows: ['auto', 'minmax(5rem, 1fr)', 'auto'], pos: { A: [0, 0], B: [4, 0], D: [0, 2], C: [4, 2], N: [8, 2] } },
    triangle: { cols: 11, rows: ['auto', 'minmax(2rem, 1fr)', 'auto', 'minmax(2rem, 1fr)', 'auto'],
      pos: { A: [0, 0], B: [0, 4], C: [4, 2], D: [8, 2], N: [8, 4] } }
  };
  var CUT_KEY = { line: 'cutLine', ring: 'cutRing', triangle: 'cutTri' };

  function data(x) { return h('b', { translate: 'no' }, String(x)); }
  function dash(id) { return id.replace('-', '–'); }
  function list(names) {
    var out = [];
    names.forEach(function (r, i) {
      if (i > 0) out.push(i === names.length - 1 ? t('and') : t('listSep'));
      out.push(data(r));
    });
    return h('span', null, out);
  }
  function term(key) { return h('i', null, t(key)); }
  /** t.parts, with a fresh copy of a node that a string uses twice ("{r} … {r}"): a node can stand in one place only. */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function homeOf(s) { return s.nets.N.at; }
  function entry(s, r) { return s && s.tables[r] ? s.tables[r].N : undefined; }
  function same(a, b) { return JSON.stringify(a || null) === JSON.stringify(b || null); }
  function selected(p) { return p[CUT_KEY[p.topo] || 'cutLine']; }
  function linkOptions(scene) { return scene.links.map(function (l) { var id = L.linkId(l[0], l[1]); return [id, dash(id)]; }); }
  function modeWord(m) { return t(m === 'split' ? 'modeSplit' : m === 'poison' ? 'modePoison' : 'modePlain'); }

  // ── stage ──

  function tableEl(r, s, prev) {
    var e = entry(s, r);
    var kids = [h('span', { class: 'dv-th' }, t('colDest')), h('span', { class: 'dv-th' }, t('colMetric')), h('span', { class: 'dv-th' }, t('colVia'))];
    if (!e) kids.push(h('span', { class: 'dv-empty' }, t('empty')));
    else {
      var changed = !!prev && !same(e, entry(prev, r));
      kids.push(h('div', { class: 'dv-row' + (changed ? ' dv-chg' : ''), dataset: e.via ? {} : { direct: '' } },
        h('span', { class: 'dv-dest', translate: 'no' }, 'N'),
        h('span', { class: e.metric >= L.INF ? 'dv-inf' : null, translate: 'no' }, String(e.metric)),
        e.via ? h('span', { translate: 'no' }, e.via) : h('span', { class: 'dv-word' }, t('direct'))));
    }
    return h('div', { class: 'dv-tab', role: 'group', 'aria-label': t('router', { r: r }) }, kids);
  }

  function adChip(ad, prev) {
    var shown = ad.sent === 'suppressed' ? entry(prev, ad.from).metric : ad.metric;
    var ds = { sent: ad.sent };
    if (shown >= L.INF && ad.sent !== 'suppressed') ds.inf = '';
    if (ad.used) ds.used = '';
    return h('span', { class: 'dv-ad', dataset: ds, translate: 'no' }, 'N:', h('span', { class: 'dv-m' }, String(shown)));
  }

  function statusEl(c) {
    var s = c.state, p = c.params;
    var what = s.kind === 'start' ? t('stStart') : s.kind === 'round' ? t('stRound', { k: s.round }) :
      s.kind === 'down' ? t('stDown') : [t('stCut'), ' ', data(dash(s.ev.link))];
    return h('div', { class: 'dv-status' }, h('b', null, what), h('span', { class: 'dv-mode' }, modeWord(p.mode)),
      s.end ? h('span', { class: 'dv-done' }, t('stDone')) : null);
  }

  function drawEl(c) {
    var s = c.state, p = c.params, prev = c.prev;
    var scene = L.sceneOf(p), lay = LAYOUT[p.topo] || LAYOUT.line;
    var sel = selected(p);
    var nodes = scene.routers.map(function (r) {
      return { id: r, kind: 'router', col: lay.pos[r][0], row: lay.pos[r][1], span: 3, mark: r, c: 8, name: t('routerWord'),
        extra: tableEl(r, s, prev) };
    });
    nodes.push({ id: 'N', kind: 'cloud', col: lay.pos.N[0] + 1, row: lay.pos.N[1], span: 1, name: t('netName'),
      state: s.nets.N.up ? null : 'down' });
    var links = s.links.map(function (l) {
      return { id: l.id, a: l.a, b: l.b, state: l.up ? 'up' : 'down', active: l.up && l.id === sel };
    });
    links.push({ id: 'net', a: homeOf(s), b: 'N', state: s.nets.N.up ? 'up' : 'down' });
    var packets = s.kind === 'round' ? s.ads.map(function (ad) {
      return { from: ad.from, to: ad.to, label: adChip(ad, prev), c: 1, at: 0.3, cast: ad.sent === 'suppressed' ? 'broadcast' : null };
    }) : [];
    return h('div', { class: 'dv-draw', dataset: { topo: p.topo } },
      Simdeck.topology({ cols: lay.cols, rows: lay.rows, dir: c.dir, nodes: nodes, links: links, packets: packets }));
  }

  // ── caption ──

  /** Changes of one step grouped by what happened, in order of first appearance. */
  function groups(changes) {
    var out = [], idx = {};
    changes.forEach(function (ch) {
      var k = [ch.why, ch.by, ch.from ? ch.from.metric : '-', ch.to.metric, ch['false']].join('|');
      if (idx[k] == null) { idx[k] = out.length; out.push({ ch: ch, rs: [] }); }
      out[idx[k]].rs.push(ch.r);
    });
    return out;
  }

  function sentence(g, s, prev) {
    var ch = g.ch, v = { n: g.rs.length, rs: list(g.rs), s: data(ch.by), m: data(ch.to.metric), old: data(ch.from ? ch.from.metric : '–') };
    if (ch['false']) {
      var key = ch.why === 'nexthop' ? 'capFalseNext' : ch.why === 'better' ? 'capFalseBetter' : 'capFalseNew';
      v.hops = t.n('hops', entry(prev, ch.by).metric);
      return parts(key, v).concat([t(s.nets.N.up ? 'falseCut' : 'falseGone')]);
    }
    if (ch.why === 'new') return parts('capNew', v);
    if (ch.why === 'better') return parts('capBetter', v);
    return parts(ch.to.metric >= L.INF ? 'capNextInf' : 'capNextUp', v);
  }

  /** Held-back (or poisoned) entries that would have brought a false route back: the receiver had nothing better. */
  function horizonNote(s, prev, mode, falseRoute) {
    var held = s.ads.filter(function (ad) {
      var mine = entry(prev, ad.from), theirs = entry(prev, ad.to);
      return ad.sent !== 'full' && mine && mine.metric + 1 < L.INF && (!theirs || theirs.metric >= L.INF);
    });
    if (!held.length) return null;
    var poison = mode === 'poison', end = t(falseRoute ? 'horizonFails' : 'horizonHelps');
    if (held.length === 1) {
      return parts(poison ? 'capPoisonOne' : 'capSplitOne', { term: term(poison ? 'termPoisonLower' : 'termSplitLower'), s: data(held[0].from), r: data(held[0].to) }).concat([end]);
    }
    var pairs = [];
    held.forEach(function (ad, i) { if (i) pairs.push(i === held.length - 1 ? t('and') : t('listSep')); pairs.push(data(ad.from + '→' + ad.to)); });
    return parts(poison ? 'capPoisonMany' : 'capSplitMany', { term: term(poison ? 'termPoison' : 'termSplit'), pairs: h('span', null, pairs) }).concat([end]);
  }

  function capFor(c) {
    var s = c.state, p = c.params, prev = c.prev, out = [];
    var push = function (parts) { if (!parts) return; if (out.length) out.push(' '); out.push.apply(out, parts); };
    if (s.kind === 'start') {
      push(p.start === 'converged' ? [t('capStartConv')] : parts('capStartCold', { r: data(homeOf(s)) }));
    } else if (s.kind === 'down') {
      push(s.noop ? [t('capDownNoop')] : parts('capDown', { r: data(homeOf(s)) }));
    } else if (s.kind === 'cut') {
      var l = data(dash(s.ev.link));
      if (s.noop) push(parts('capCutNoop', { l: l }));
      else {
        push(parts('capCut', { l: l }));
        push(s.changes.length ? parts('capCutLost', { n: s.changes.length, rs: list(s.changes.map(function (x) { return x.r; })) }) : [t('capCutNone')]);
      }
    } else {
      out.push(t('capRound', { k: s.round }), ' ');
      if (s.quiet) out.push(t('capQuiet'));
      else groups(s.changes).forEach(function (g, i) { if (i) out.push(' '); out.push.apply(out, sentence(g, s, prev)); });
      var falseRoute = s.changes.some(function (x) { return x['false']; });
      if (falseRoute) push(parts('capCti', { term: term('termCti') }));
      push(horizonNote(s, prev, p.mode, falseRoute));
    }
    if (s.end === 'quiet') push(parts('capEndQuiet', { term: term('termConv') }));
    else if (s.end === 'unreachable') push(parts('capEndUnreach', { rounds: t.n('rounds', s.since) }));
    else if (s.end === 'limit') push([t('capLimit')]);
    return out;
  }

  // ── buttons: an event at the next step; the steps after it are rewritten ──

  function addEvent(sim, ev) {
    var at = sim.n + 1, p = sim.params;
    if (at > L.MAX_STEPS) { note = t('noteLate'); sim.render(); return; }
    var all = L.eventsOf(p), kept = {};
    Object.keys(all).forEach(function (n) { if (Number(n) <= sim.n) kept[n] = all[n]; });
    kept[at] = ev;
    sim.set({ events: L.encode(kept, p) }, { preset: sim.preset });
    sim.next();
  }

  /** The hidden events choice: the kit reads a URL value only when it is one of the options, so the options are the
      presets' codes plus the code in this page's URL (a run the buttons made). Any other value is set by the buttons. */
  function eventOptions() {
    var codes = [0, L.code('line', '1:down'), L.code('ring', '3:cut:B-C'), L.code('triangle', '1:cut:C-D'), L.code('ring', '1:down')];
    var raw = new URLSearchParams(window.location.search).get('events'), v = Number(raw);
    if (raw && /^\d+$/.test(raw) && v <= L.MAX_CODE && codes.indexOf(v) < 0) codes.push(v);
    return codes.map(function (c) { return [c, String(c)]; });
  }

  var cutParam = function (key, topo) {
    return { key: key, type: 'choice', label: t('pCut'), options: linkOptions(L.SCENES[topo]),
      visible: function (p) { return p.topo === topo; } };
  };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('pMode'), options: [['plain', t('modePlain')], ['split', t('modeSplit')], ['poison', t('modePoison')]] },
      cutParam('cutLine', 'line'),
      cutParam('cutRing', 'ring'),
      cutParam('cutTri', 'triangle'),
      { type: 'button', label: t('bCut'), key: 'x', run: function (sim) {
          var id = selected(sim.params);
          var l = sim.state.links.filter(function (x) { return x.id === id; })[0];
          if (!l || !l.up) { note = t('noteCutAgain', { l: dash(id) }); sim.render(); return; }
          addEvent(sim, { kind: 'cut', link: id });
        } },
      { type: 'button', label: t('bDown'), key: 'd', run: function (sim) {
          if (!sim.state.nets.N.up) { note = t('noteDownAgain'); sim.render(); return; }
          addEvent(sim, { kind: 'down', dest: 'N' });
        } },
      // the scene, the start and the events (set by presets and the buttons): hidden, but kept in the URL so a link,
      // a reload or L keeps a run the buttons made; events is a number (sim.js eventsOf, eventOptions above)
      { key: 'topo', type: 'choice', label: t('pTopo'), visible: function () { return false; },
        options: Object.keys(L.SCENES).map(function (k) { return [k, k]; }) },
      { key: 'start', type: 'choice', label: t('pStart'), visible: function () { return false; }, options: [['cold', 'cold'], ['converged', 'converged']] },
      { key: 'events', type: 'choice', label: t('pEvents'), visible: function () { return false; }, options: eventOptions() }
    ],

    presets: [
      { id: 'cold-start', label: t('prCold'), hint: t('prColdHint'), params: { topo: 'line', start: 'cold', mode: 'plain', events: 0 } },
      { id: 'count-to-infinity', label: t('prCti'), hint: t('prCtiHint'), params: { topo: 'line', start: 'converged', mode: 'plain', events: L.code('line', '1:down') } },
      { id: 'split-horizon', label: t('prSplit'), hint: t('prSplitHint'), params: { topo: 'line', start: 'converged', mode: 'split', events: L.code('line', '1:down') } },
      { id: 'ring-reroute', label: t('prRing'), hint: t('prRingHint'), params: { topo: 'ring', start: 'cold', mode: 'split', events: L.code('ring', '3:cut:B-C'), cutRing: 'B-C' } },
      { id: 'triangle-plain', label: t('prTri'), hint: t('prTriHint'), params: { topo: 'triangle', start: 'converged', mode: 'plain', events: L.code('triangle', '1:cut:C-D'), cutTri: 'C-D' } },
      { id: 'ring-split', label: t('prRingSplit'), hint: t('prRingSplitHint'), params: { topo: 'ring', start: 'converged', mode: 'split', events: L.code('ring', '1:down') } }
    ],

    legend: [
      { shape: 'dv-via', label: t('legVia') },
      { shape: 'dv-direct', label: t('legDirect') },
      { shape: 'dv-inf', label: t('legInf') },
      { shape: 'dv-supp', label: t('legSupp') },
      { shape: 'dv-sel', label: t('legSel') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'dv' }, statusEl(c), drawEl(c)));
    },

    caption: function (c) {
      var said = note;
      note = null;
      var cap = capFor(c);
      return said ? [said, ' '].concat(cap) : cap;
    }
  });
})();
</script>
</body>
</html>
