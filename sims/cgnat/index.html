     address space 100.64.0.0/10 between them. Outbound the packet is translated twice and the reply twice back;
     inbound a packet nobody asked for dies at the CGN, so a port forward on the home router is never read. A stepper;

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  /** Series colours: subscribers and their home routers 5, 6, 7; the CGN 8; the server and the client 4. */
  var SUB_C = { A: '5', B: '6', C: '7' };
  /** Grid rows: one per subscriber, at least two (the server and the CGN beside A, the client in the last row). */
  function rowCount(n) { return Math.max(2, n); }

  function epText(e) { return e.ip + ':' + e.port; }
  /** An address chip: the space (private, shared, public) as border and pattern. Data, not language. */
  function addr(e) {
    var text = typeof e === 'string' ? e : epText(e), ip = typeof e === 'string' ? e : e.ip;
    return h('span', { class: 'cg-a', translate: 'no', dataset: { sp: L.addressSpace(ip) } }, text);
  }
  function data(text) { return h('span', { translate: 'no', class: 'sd-mono' }, String(text)); }
  function hl(key) { return h('span', { class: 'sd-hl' }, t(key)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). A placeholder used twice
      gets a copy of its node. */
  function rich(key, vars) {
    var out = [], used = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) {
        out.push(used.indexOf(p) >= 0 ? p.cloneNode(true) : p);
        used.push(p);
        return;
      }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }

  // ── top: the packet on the wire, what the internet sees ──

  function field(label, value, was) {
    var v = addr(value);
    return h('span', { class: 'cg-field' },
      h('span', { class: 'cg-label' }, t(label)),
      was ? h('span', { class: 'cg-chg' }, v) : v,
      was ? h('span', { class: 'cg-was' }, t('before'), ' ', h('s', { translate: 'no' }, epText(was))) : null);
  }

  function chipKey(s) {
    if (s.phase === 'probe' || s.phase === 'arrive' || s.phase === 'direct') return 'chipIn';
    return s.phase === 'reply' || s.phase === 'back2' || s.phase === 'back1' ? 'chipBack' : 'chipOut';
  }

  function renderWire(c) {
    var s = c.state, pk = s.packet;
    var row = h('div', { class: 'cg-wire' }, h('h2', null, t('wireTitle')));
    if (!pk) {
      row.append(h('span', { class: 'cg-none' }, t('wireNone')));
    } else {
      var who = s.who ? SUB_C[s.who] : '4';
      row.append(
        h('span', { class: 'cg-kind sd-fill', dataset: { c: who } }, t(chipKey(s))),
        field('src', pk.src, pk.was && pk.was.field === 'src' ? pk.was.ep : null),
        field('dst', pk.dst, pk.was && pk.was.field === 'dst' ? pk.was.ep : null));
      if (pk.drop) row.append(h('span', { class: 'cg-dropped' }, t('dropped', { where: t(pk.to === 'cgn' ? 'dropCgn' : 'dropNet') })));
    }
    return h('section', { class: 'cg-box' }, row);
  }

  /** Under the server: the source of every packet it has received, all it knows of the subscribers. */
  function renderSeen(c) {
    var s = c.state;
    if (c.params.direction === 'inbound') return null;
    var items = s.seen.map(function (e) { return h('li', null, addr(e)); });
    if (!items.length) items.push(h('li', { class: 'cg-none' }, t('seenEmpty')));
    return h('div', { class: 'cg-extra cg-seen' }, h('span', { class: 'cg-label' }, t('seenTitle')), h('ul', null, items));
  }

  // ── topology ──

  function badge(key, k) { return { text: t(key), k: k || 'solid', anim: true }; }

  function lookupMark(s, box, i, kind) {
    var l = s.lookup;
    if (!l || l.box !== box || l.row !== i) return null;
    if (kind === 'fwd') return l.result === 'forward' ? 'hit' : null;
    return l.result === 'new' ? 'new' : l.result === 'hit' || l.result === 'reuse' ? 'hit' : null;
  }

  function homeTable(c, i) {
    var s = c.state, home = s.homes[i], box = 'h' + home.id, fwd = c.dir === 'forward' ? 'forward' : null;
    var inbound = c.params.direction === 'inbound' && c.n >= 2;
    var rows = home.forwards.map(function (f) {
      return { cells: [h('span', null, addr(f.outside), '→'), h('span', null, addr(f.inside))], note: t(inbound ? 'noteUnread' : 'noteForward'),
        c: SUB_C[home.id], mark: inbound ? 'refreshed' : lookupMark(s, box, 0, 'fwd') };
    }).concat(home.table.map(function (r, k) {
      var mark = lookupMark(s, box, k, 'map');
      return { cells: [h('span', null, addr(r.inside), '↔'), h('span', null, addr(r.outside))], note: mark === 'new' ? t('noteNew') : mark === 'hit' ? t('noteHit') : null,
        c: SUB_C[home.id], mark: mark };
    }));
    return Simdeck.topology.table({ title: null, rows: rows, empty: t('tableEmpty') }, fwd);
  }

  function cgnTable(c) {
    var s = c.state, fwd = c.dir === 'forward' ? 'forward' : null;
    var rows = s.cgn.map(function (r, k) {
      var mark = lookupMark(s, 'cgn', k, 'map');
      var owner = L.subs.filter(function (x) { return x.cpe === r.inside.ip; })[0];
      return { cells: [h('span', null, addr(r.inside), '↔'), h('span', null, addr(r.outside))], note: mark === 'new' ? t('noteNew') : mark === 'hit' ? t('noteHit') : null,
        c: owner ? SUB_C[owner.id] : null, mark: mark };
    });
    return Simdeck.topology.table({ title: null, rows: rows, empty: t('tableEmpty') }, fwd);
  }

  /** A card's own address, as a kit line (beside the mark, under the name), drawn as an address chip by the CSS. */
  function addrLine(e) {
    return { text: typeof e === 'string' ? e : epText(e), kind: 'addr' };
  }

  function renderTopo(c) {
    var s = c.state, ph = s.phase, n = s.homes.length, nr = rowCount(n);
    var badges = { cgn: [], net: [], server: [], client: [] }, active = null;
    s.homes.forEach(function (x) { badges[x.id] = []; badges['h' + x.id] = []; });
    var who = s.who, hw = who ? 'h' + who : null;
    switch (ph) {
      case 'send': badges[who].push(badge('bSends', 'fill')); active = who; break;
      case 'nat1': badges[hw].push(badge('bTranslates', 'fill')); active = hw; break;
      case 'nat2': badges.cgn.push(badge('bTranslates', 'fill')); badges.server.push(badge('bReceives')); active = 'cgn'; break;
      case 'reply': badges.server.push(badge('bReplies', 'fill')); active = 'server'; break;
      case 'back2': badges.cgn.push(badge('bReverses', 'fill')); active = 'cgn'; break;
      case 'back1': badges.hA.push(badge('bReverses', 'fill')); badges.A.push(badge('bReceives')); active = 'hA'; break;
      case 'probe': badges.client.push(badge('bSends', 'fill')); active = 'client'; break;
      case 'arrive': badges.cgn.push(badge('bMiss', 'fill')); active = 'cgn'; break;
      case 'after':
        s.homes.forEach(function (x) { badges['h' + x.id].push(badge('bNever', 'muted')); });
        badges.client.push(badge('bNoAnswer', 'muted'));
        badges.cgn.push(badge('bDropped', 'muted'));
        break;
      // the cloud is too narrow for a badge: the cross, the wire box and the caption say it
      case 'direct': badges.client.push(badge('bSends', 'fill')); active = 'net'; break;
    }
    function st(id) { return active === id ? 'active' : null; }
    var nodes = [];
    s.homes.forEach(function (x, i) {
      var sub = L.subs[i], r = i, hid = 'h' + x.id;
      nodes.push({ id: x.id, kind: 'host', col: 0, span: 4, row: r, mark: x.id, c: SUB_C[x.id], name: t('host', { id: x.id }),
        lines: [addrLine(sub.host)], badges: badges[x.id], state: st(x.id) });
      nodes.push({ id: hid, kind: 'router', col: 5, span: 6, row: r, mark: 'NAT', c: SUB_C[x.id], name: t('home', { id: x.id }),
        lines: [addrLine(sub.cpe)], badges: badges[hid], state: st(hid), extra: h('div', { class: 'cg-extra' }, homeTable(c, i)) });
    });
    nodes.push(
      { id: 'cgn', kind: 'router', col: 12, span: 6, row: 0, mark: 'CGN', c: '8', name: t('cgn'),
        lines: [addrLine(L.cgnPublic)], badges: badges.cgn, state: st('cgn'), extra: h('div', { class: 'cg-extra' }, cgnTable(c)) },
      { id: 'net', kind: 'cloud', col: 19, span: 2, row: 0, name: t('internet'), badges: badges.net, state: st('net') },
      { id: 'server', kind: 'server', col: 22, span: 5, row: 0, mark: 'S', c: '4', name: t('server'),
        lines: [addrLine(L.server)], badges: badges.server, state: st('server'), extra: renderSeen(c) },
      { id: 'client', kind: 'host', col: 22, span: 5, row: nr - 1, mark: 'X', c: '4', name: t('client'),
        lines: [addrLine(L.client)], badges: badges.client, state: st('client') });

    var hops = [];
    var lbl = t(chipKey(s)), pc = who ? SUB_C[who] : '4';
    switch (ph) {
      case 'send': hops = [[who, hw, true]]; break;
      case 'nat1': hops = [[hw, 'cgn', true]]; break;
      case 'nat2': hops = [['cgn', 'net', true], ['net', 'server', false]]; break;
      case 'reply': hops = [['server', 'net', true], ['net', 'cgn', false]]; break;
      case 'back2': hops = [['cgn', 'hA', true]]; break;
      case 'back1': hops = [['hA', 'A', true]]; break;
      case 'probe': hops = [['client', 'net', true]]; break;
      case 'arrive': hops = [['net', 'cgn', false, true]]; break; // no chip: the short link keeps the cross visible
      case 'direct': hops = [['client', 'net', true, true]]; break;
    }
    var packets = hops.map(function (x) { return { from: x[0], to: x[1], label: lbl, chip: x[2], c: pc, drop: !!x[3] }; });
    var on = function (a, b) { return hops.some(function (x) { return (x[0] === a && x[1] === b) || (x[0] === b && x[1] === a); }); };
    var links = [];
    s.homes.forEach(function (x) {
      links.push({ id: 'l' + x.id, a: x.id, b: 'h' + x.id, active: on(x.id, 'h' + x.id) });
      links.push({ id: 'c' + x.id, a: 'h' + x.id, b: 'cgn', active: on('h' + x.id, 'cgn') });
    });
    links.push({ id: 'cn', a: 'cgn', b: 'net', active: on('cgn', 'net') },
      { id: 'ns', a: 'net', b: 'server', active: on('net', 'server') },
      { id: 'nc', a: 'net', b: 'client', active: on('net', 'client') });
    return Simdeck.topology({ cols: 27, rows: Array(nr).fill('auto'), gap: '0.5cqw', dir: c.dir, nodes: nodes, links: links, packets: packets });
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, p = c.params, pk = s.packet, who = s.who;
    var pub = data(L.cgnPublic), S = addr(L.server);
    switch (s.phase) {
      case 'start':
        if (p.direction === 'inbound') {
          return p.portForward
            ? rich('capStartFwd', { fwd: addr(L.forward.outside), inside: addr(L.forward.inside), c: addr(L.client), pub: pub, port: data(L.probePort(p)) })
            : rich('capStartIn', { c: addr(L.client), pub: pub, port: data(L.probePort(p)) });
        }
        return p.senders === 'all'
          ? rich('capStartAll', { s: S, a: addr(L.subs[0].host), pub: pub })
          : rich('capStart', { a: addr({ ip: L.subs[0].host, port: L.srcPort }), s: S, pub: pub });
      case 'send':
        return rich(who === 'A' ? 'capSend' : 'capSendSame', { who: data(who), src: addr(pk.src) });
      case 'nat1':
        return rich('capNat1', { who: data(who), from: addr(pk.was.ep), to: addr(pk.src), rec: hl('recWord') });
      case 'nat2': {
        if (p.senders === 'all' && who !== 'A') {
          var ids = L.subs.map(function (x) { return x.id; }), prev = h('span');
          ids.slice(0, ids.indexOf(who)).forEach(function (id, k) { prev.append(k ? t('listAnd') : '', data(id)); });
          return rich('capNat2Shared', { who: data(who), prev: prev, from: addr(pk.was.ep), to: addr(pk.src) });
        }
        return rich('capNat2', { from: addr(pk.was.ep), to: addr(pk.src), rec: hl('recWord') });
      }
      case 'reply': return rich('capReply', { dst: addr(pk.dst) });
      case 'back2': return rich('capBack2', { from: addr(pk.was.ep), to: addr(pk.dst) });
      case 'back1': return rich('capBack1', { to: addr(pk.dst) });
      case 'probe': return rich('capProbe', { dst: addr(pk.dst), pub: pub });
      case 'arrive': return rich(p.portForward ? 'capArriveFwd' : 'capArrive', { dst: addr(pk.dst), drop: hl('dropWord') });
      case 'after': return rich(p.portForward ? 'capAfterFwd' : 'capAfter');
      default: return rich('capDirect', { dst: addr(pk.dst), drop: hl('dropWordNet') });
    }
  }

  Simdeck.mount({
    steps: L.stepsFor,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'direction', type: 'choice', label: t('direction'), resets: true, options: [['outbound', t('dirOut')], ['inbound', t('dirIn')]] },
      { key: 'senders', type: 'choice', label: t('senders'), resets: true, options: [['one', t('sendersOne')], ['all', t('sendersAll')]],
        visible: function (p) { return p.direction === 'outbound'; } },
      { key: 'portForward', type: 'toggle', label: t('portForward'), hint: t('portForwardHint') },
      { key: 'subscribers', type: 'range', label: t('subscribers'), min: 1, max: L.maxSubscribers, step: 1 }
    ],

    presets: [
      { id: 'outbound-works', label: t('presetWorks'), params: { direction: 'outbound', senders: 'one', portForward: false, subscribers: 2 }, hint: t('presetWorksHint') },
      { id: 'inbound-dropped', label: t('presetDropped'), params: { direction: 'inbound', portForward: false }, hint: t('presetDroppedHint') },
      { id: 'port-forward-fails', label: t('presetForward'), params: { direction: 'inbound', portForward: true }, hint: t('presetForwardHint') },
      { id: 'shared-address', label: t('presetShared'), params: { direction: 'outbound', senders: 'all', subscribers: 2 }, hint: t('presetSharedHint') }
    ],

    legend: [
      { shape: 'private', label: t('legPrivate') },
      { shape: 'shared', label: t('legShared') },
      { shape: 'public', label: t('legPublic') },
      { shape: 'nat', label: t('legNat') },
      { shape: 'x', label: t('legDrop') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'cg' }, renderWire(c), renderTopo(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
