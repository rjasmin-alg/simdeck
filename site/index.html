<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <h1 class="brand">{{TITLE}}</h1>
    <label class="search">
      <span class="sr-only">Traži</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Traži simulator… ( / )" autofocus>
    </label>
    <p id="count" class="count" aria-live="polite"></p>
  </div>
  <div class="filters" role="group" aria-label="Filtri">
    <div class="seg" role="radiogroup" aria-label="Grupiraj">
      <span class="seg-label">Grupiraj:</span>
      <button type="button" data-group="topic" role="radio">tema</button>
      <button type="button" data-group="course" role="radio">kolegij</button>
      <button type="button" data-group="none" role="radio">bez</button>
    </div>
    <div class="seg" role="radiogroup" aria-label="Prikaz">
      <span class="seg-label">Prikaz:</span>
      <button type="button" data-view="cards" role="radio">kartice</button>
      <button type="button" data-view="list" role="radio">popis</button>
    </div>
    <label>Kolegij <select id="f-course"><option value="">svi</option></select></label>
    <label>Razina <select id="f-level"><option value="">sve</option></select></label>
    <label>Vrsta <select id="f-cls"><option value="">sve</option></select></label>
    <label>Jezik <select id="f-lang"><option value="">svi</option><option value="hr">HR</option><option value="en">EN</option></select></label>
    <button type="button" id="reset" class="link">poništi filtre</button>
  </div>
  <div id="tags" class="tags" role="group" aria-label="Oznake"></div>
</header>
<main id="results"></main>
<aside id="tray" class="tray" hidden aria-label="Izroček">
  <span id="tray-count"></span>
  <label class="tray-title"><span class="sr-only">Naslov izročka</span><input id="tray-title" type="text" placeholder="Naslov izročka"></label>
  <button type="button" id="tray-open">Otvori izroček</button>
  <button type="button" id="tray-json">Kopiraj kao kolegij (JSON)</button>
  <button type="button" id="tray-clear" class="link">očisti</button>
</aside>
<footer class="bottom">
  <p id="courses-list"></p>
  <p class="keys"><kbd>/</kbd> traži · <kbd>↑</kbd><kbd>↓</kbd> odabir · <kbd>Enter</kbd> otvori · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> nova kartica · <kbd>+</kbd> u izroček · <kbd>Esc</kbd> očisti</p>
</footer>
<script type="application/json" id="simdeck-data">{{DATA}}</script>
<script type="module">{{SCRIPT}}</script>
</body>
</html>
