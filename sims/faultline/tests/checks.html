<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>faultline — checks</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
         margin: 0; padding: 24px 28px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  #summary { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       color: #64748b; margin: 22px 0 8px; }
  ol { margin: 0; padding-left: 22px; }
  li { margin-bottom: 5px; line-height: 1.45; }
  li.pass::marker { color: #22c55e; }
  li.fail { color: #f87171; font-weight: 600; }
  li.fail::marker { color: #f87171; }
  code { color: #94a3b8; font-weight: 400; font-size: 12px; }
</style>
</head>
<body>
<h1>faultline — checks</h1>
<div id="summary">running…</div>
<div id="results"></div>

<script type="module">
// wiring-checks.mjs is deliberately absent: it reads source files off disk.
import { results as engine } from './engine-checks.js';
import { results as view } from './view-checks.js';

const groups = [['engine', engine], ['view', view]];
const out = [];
let failed = 0, total = 0;

for (const [title, list] of groups) {
  out.push(`<h2>${title}</h2><ol>`);
  for (const r of list) {
    total++;
    if (!r.pass) failed++;
    const detail = r.detail ? ` <code>${String(r.detail).replace(/</g, '&lt;')}</code>` : '';
    out.push(`<li class="${r.pass ? 'pass' : 'fail'}">${r.name}${detail}</li>`);
  }
  out.push('</ol>');
}

document.getElementById('results').innerHTML = out.join('');
document.getElementById('summary').textContent =
  `${total - failed}/${total} passed` + (failed ? `, ${failed} failed` : '');
document.title = failed ? `FAIL (${failed})` : 'PASS';
</script>
</body>
</html>
