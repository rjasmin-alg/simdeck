<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var A = L.angle;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // the sheet with a margin of 0.6 × 0.3 (keeps 2 : 1)
  var VIEW = { x0: -0.6, y0: -0.3, x1: L.W + 0.6, y1: L.H + 0.3 };
  var FAR = 60; // beyond every edge of the paper: the angle goes on
  var TAU = 2 * Math.PI;

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function norm(v) { var l = Math.hypot(v[0], v[1]); return l ? [v[0] / l, v[1] / l] : [1, 0]; }
  function add(a, v, s) { return [a[0] + v[0] * s, a[1] + v[1] * s]; }
  function polar(c, r, a) { return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)]; }
  function cm(n) { return t('cmFmt', { n: n }); }

  /** The angles (radians) of the two rays, the second one further anticlockwise: a1 − a0 in (0, π). */
  function rays(s) {
    var a0 = Math.atan2(s.u[1], s.u[0]), a1 = Math.atan2(s.w[1], s.w[0]);
    while (a1 <= a0) a1 += TAU;
    return { a0: a0, a1: a1, ea: norm(s.u), eb: norm(s.w) };
  }
  /** The arms' ends: where the drawn arms stop (dragged to turn and lengthen them). */
  function ends(s) {
    var r = rays(s);
    return { a: add(s.v, r.ea, s.la), b: add(s.v, r.eb, s.lb) };
  }

  // ── the paper: paper coordinates (y up) to the SVG (y down) and to % for the HTML labels ──
  function Paper() {
    var view = VIEW, w = view.x1 - view.x0, hh = view.y1 - view.y0;
    var el = svg('svg', { viewBox: view.x0 + ' ' + (-view.y1) + ' ' + w + ' ' + hh, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    // the hatching of part 2 (mode name): lines one square apart, slanting
    var defs = svg('defs'), pat = svg('pattern', { id: 'ga-hatch', patternUnits: 'userSpaceOnUse', width: 0.7, height: 0.7, patternTransform: 'rotate(45)' });
    pat.append(svg('line', { class: 'ga-hatchline', x1: 0, y1: 0, x2: 0, y2: 0.7 }));
    // the angle goes on past the sheet, but the drawing stops at its edge
    var clip = svg('clipPath', { id: 'ga-sheet' });
    clip.append(svg('rect', { x: 0, y: -L.H, width: L.W, height: L.H }));
    defs.append(pat, clip);
    el.append(defs);
    var labs = [];
    var api = {
      el: el, labs: labs,
      line: function (a, b, cls, clipped) {
        var l = svg('line', { class: cls, x1: a[0], y1: -a[1], x2: b[0], y2: -b[1] });
        if (clipped) l.setAttribute('clip-path', 'url(#ga-sheet)');
        el.append(l);
      },
      poly: function (pts, cls, attrs) {
        var p = svg('polygon', { class: cls, 'clip-path': 'url(#ga-sheet)', points: pts.map(function (q) { return q[0] + ',' + (-q[1]); }).join(' ') });
        Object.keys(attrs || {}).forEach(function (k) { p.setAttribute(k, attrs[k]); });
        el.append(p);
      },
      path: function (pts, cls) {
        el.append(svg('polyline', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      /** The part of the plane from angle a0 to a1 (anticlockwise), out to beyond the paper: a fan. */
      wedge: function (c, a0, a1, cls, attrs) {
        var pts = [c], n = Math.max(2, Math.ceil((a1 - a0) / 0.2));
        for (var i = 0; i <= n; i++) pts.push(polar(c, FAR, a0 + (a1 - a0) * i / n));
        api.poly(pts, cls, attrs);
      },
      /** An arc of the circle (c, r) from angle a0 to a1 (radians, anticlockwise on the paper). */
      arc: function (c, r, a0, a1, cls) {
        var p0 = polar(c, r, a0), p1 = polar(c, r, a1);
        var large = a1 - a0 > Math.PI ? 1 : 0;
        // y is flipped, so anticlockwise on the paper is sweep-flag 0 in the SVG
        el.append(svg('path', { class: cls, d: 'M' + p0[0] + ' ' + (-p0[1]) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p1[0] + ' ' + (-p1[1]) }));
      },
      dot: function (p, attrs, size, cls) {
        var c = svg('circle', { class: cls || 'ga-pt', cx: p[0], cy: -p[1], r: size || 0.24 });
        Object.keys(attrs || {}).forEach(function (k) { c.setAttribute(k, attrs[k]); });
        el.append(c);
      },
      /** An HTML label at a point of the paper, shifted by (dx, dy) in rem (y down). */
      lab: function (p, text, dx, dy, data) {
        var left = Math.min(97, Math.max(3, (p[0] - view.x0) / w * 100)), top = Math.min(95, Math.max(5, (view.y1 - p[1]) / hh * 100));
        labs.push(h('span', { class: 'ga-lab', translate: 'no', dataset: data || {},
          style: { left: 'calc(' + left.toFixed(3) + '% + ' + (dx || 0) + 'rem)', top: 'calc(' + top.toFixed(3) + '% + ' + (dy || 0) + 'rem)' } }, text));
      }
    };
    for (var x = 0; x <= L.W; x++) api.line([x, 0], [x, L.H], 'ga-grid');
    for (var y = 0; y <= L.H; y++) api.line([0, y], [L.W, y], 'ga-grid');
    return api;
  }

  /** A place for a label in the part a0…a1: on the bisector at distance d from the vertex, or nearer, or turned
      towards an arm, the first that is on the paper and not too close to V; else on the bisector at d. */
  function onBisector(v, a0, a1, d) {
    var fr = [0.5, 0.4, 0.6, 0.3, 0.7, 0.2, 0.8];
    for (var k = d; k >= 2; k -= 0.5) {
      for (var i = 0; i < fr.length; i++) {
        var p = polar(v, k, a0 + (a1 - a0) * fr[i]);
        if (p[0] > 0.9 && p[0] < L.W - 0.9 && p[1] > 0.9 && p[1] < L.H - 0.9) return p;
      }
    }
    return polar(v, d, (a0 + a1) / 2);
  }

  /** The vertex, the arms (and, revealed in mode point, the rays going on), their names, the arc. */
  function drawAngle(s, pp, r, opts) {
    var e = ends(s);
    if (opts.rays) { pp.line(e.a, add(s.v, r.ea, FAR), 'ga-ray', true); pp.line(e.b, add(s.v, r.eb, FAR), 'ga-ray', true); }
    pp.line(s.v, e.a, 'ga-arm');
    pp.line(s.v, e.b, 'ga-arm');
    if (opts.arc) {
      var ar = s.arc; // the model's: rule 5 compares |VT| with it
      pp.arc(s.v, ar, r.a0, r.a1, 'ga-arc');
      // a right angle: an arc with a dot (SPEC, Legend; check)
      if (s.kind === 'right' && !opts.hideKind) pp.dot(polar(s.v, ar * 0.55, (r.a0 + r.a1) / 2), {}, 0.13);
    }
    // the arms' ends are handles: a small ring
    pp.dot(e.a, {}, 0.2, 'ga-end');
    pp.dot(e.b, {}, 0.2, 'ga-end');
    var na = s.swap ? 'b' : 'a', nb = s.swap ? 'a' : 'b';
    pp.lab(add(e.a, r.ea, 0.8), na, 0, 0, { big: '' });
    pp.lab(add(e.b, r.eb, 0.8), nb, 0, 0, { big: '' });
    pp.dot(s.v);
    // V outside the angle, on the far side of the bisector
    pp.lab(polar(s.v, 0.9, (r.a0 + r.a1) / 2 + Math.PI), 'V', 0, 0, { big: '' });
  }

  /** The set square: its right-angle corner in V, one leg on arm a, the other a quarter turn on. */
  function drawSquare(s, pp, r) {
    var n = [-r.ea[1], r.ea[0]], len = 4;
    pp.poly([s.v, add(s.v, r.ea, len), add(s.v, n, len)], 'ga-sq');
    var q = 0.5;
    pp.path([add(s.v, r.ea, q), add(add(s.v, r.ea, q), n, q), add(s.v, n, q)], 'ga-rt');
    // its name inside it, past the arc
    pp.lab(add(add(s.v, r.ea, len * 0.7), n, len * 0.15), t('wSquare'), 0, 0, { word: '' });
  }

  // ── the top box ──
  function verdict(ok, text) {
    return h('span', { class: 'ga-verdict', dataset: { ok: ok ? 'yes' : 'no' } }, h('span', { 'aria-hidden': 'true' }, ok ? '✓' : '✗'), h('span', null, text));
  }
  function sideBtn(label, title, run, kbd, pressed) {
    return noFocus(h('button', { type: 'button', class: 'sd-btn ga-sidebtn', title: title, 'aria-keyshortcuts': kbd ? kbd.toLowerCase() : null,
      'aria-pressed': pressed == null ? null : String(pressed), onclick: run }, label, kbd ? ' ' : '', kbd ? h('kbd', null, kbd) : ''));
  }
  function guessBtn(g, label) {
    return noFocus(h('button', { type: 'button', class: 'sd-btn sd-btn--primary ga-guess', onclick: function () { sim.set({ guess: g, hide: false }); } }, label));
  }
  var GUESS_LABEL = { acute: 'gAcute', right: 'gRight', obtuse: 'gObtuse', yes: 'gYes', no: 'gNo', one: 'gOne', two: 'gTwo' };

  function sayOf(s) {
    if (s.mode === 'kind') return t('kSay', { kind: t('k_' + s.kind) });
    if (s.mode === 'point') return t(s.where === 'in' ? 'ptIn' : s.where === 'vertex' ? 'ptVertex' : s.where === 'armA' ? 'ptArmA' : s.where === 'armB' ? 'ptArmB' : 'ptOut');
    return t('nmSay', { n: s.named });
  }
  function subOf(s) {
    if (s.mode === 'kind') return s.square ? t('kSub_' + s.kind) : t('kSubPlain');
    if (s.mode === 'point') return t(s.inAngle ? 'ptYes' : 'ptNo');
    return t('nmSub', { kind: t('k_' + s.namedKind) });
  }
  function top(s) {
    var col, side = [];
    if (s.hide) {
      col = [h('div', { class: 'ga-say' }, t('ask_' + s.mode)), h('div', { class: 'ga-sub' }, s.mode === 'kind' ? t('kSubPlain') : '\u00a0')];
      L.GUESSES[s.mode].forEach(function (g) { side.push(guessBtn(g, t(GUESS_LABEL[g]))); });
      side.push(sideBtn(t('reveal'), t('revealKey') + ' (V)', function () { sim.set({ hide: false }); }, 'V'));
    } else {
      col = [h('div', { class: 'ga-say' }, sayOf(s)), h('div', { class: 'ga-sub' }, subOf(s))];
      if (s.guess) side.push(verdict(s.right, t('guessWas', { g: t(GUESS_LABEL[s.guess]) }) + ' · ' + t(s.right ? 'gOk' : 'gBad')));
      if (audience === 'teacher') side.push(sideBtn(t('hide'), t('hideHint'), function () { sim.set({ hide: true, guess: '' }); }, 'V'));
    }
    if (s.mode !== 'name' && !s.hide) {
      var arms = function (d) {
        return function () { var p = sim.params; sim.set({ la: Math.min(L.L_MAX, Math.max(L.L_MIN, p.la + d)), lb: Math.min(L.L_MAX, Math.max(L.L_MIN, p.lb + d)) }); };
      };
      side.push(sideBtn('− ' + t('shorter'), t('shorter'), arms(-2)), sideBtn('+ ' + t('longer'), t('longer'), arms(2)));
    }
    if (s.mode === 'kind' && !s.hide) {
      side.push(sideBtn((s.square ? '☑ ' : '☐ ') + t('square'), t('squareHint'),
        function () { sim.set({ square: !s.square }); }, null, s.square));
    }
    if (s.mode === 'name') side.push(sideBtn('⇄ ' + t('swap'), t('swap'), function () { sim.set({ swap: !sim.params.swap, guess: '' }); }, null, s.swap));
    return [h('div', { class: 'ga-col' }, col), h('div', { class: 'ga-side' }, side)];
  }

  // ── the paper, per mode ──
  function drawKind(s, pp) {
    var r = rays(s);
    // the angle is the whole part between the arms: coloured out to the paper's edge
    pp.wedge(s.v, r.a0, r.a1, 'ga-wedge');
    if (s.square) drawSquare(s, pp, r);
    drawAngle(s, pp, r, { arc: true, hideKind: s.hide });
    // the name past the set square (its legs are 4 cm)
    if (audience !== 'child') pp.lab(onBisector(s.v, r.a0, r.a1, 5.5), t('wAngle'), 0, 0, { name: '' });
  }

  function drawPoint(s, pp) {
    var r = rays(s);
    // asked: the angle as the book draws it, arms and an arc; revealed: the whole part, and the arms going on
    if (!s.hide) pp.wedge(s.v, r.a0, r.a1, 'ga-wedge');
    drawAngle(s, pp, r, { arc: true, rays: !s.hide });
    if (!s.hide && audience !== 'child') pp.lab(onBisector(s.v, r.a0, r.a1, 3.4), t('wAngle'), 0, 0, { name: '' });
    pp.dot(s.t, { 'data-t': '' }, 0.26);
    pp.lab(s.t, 'T', 0.9, -0.9, { c: '2', big: '' });
  }

  function drawName(s, pp) {
    var r = rays(s);
    // part 1: the smaller one, coloured; part 2: the rest, hatched. Revealed, the named part is coloured stronger.
    var named1 = !s.hide && s.named === 1, named2 = !s.hide && s.named === 2;
    pp.wedge(s.v, r.a0, r.a1, 'ga-wedge', named1 ? { 'data-named': '' } : null);
    pp.wedge(s.v, r.a1, r.a0 + TAU, 'ga-hatch');
    if (named2) pp.wedge(s.v, r.a1, r.a0 + TAU, 'ga-wedge', { 'data-named': '' });
    drawAngle(s, pp, r, { arc: false });
    // each part's number, and (revealed) its name just under it
    var p1 = onBisector(s.v, r.a0, r.a1, 4.6), p2 = onBisector(s.v, r.a1, r.a0 + TAU, 4.6);
    pp.lab(p1, '1', 0, 0, { part: '' });
    pp.lab(p2, '2', 0, 0, { part: '' });
    if (!s.hide) {
      // the turn from a to b, anticlockwise, with its arrowhead
      var from = s.swap ? r.a1 : r.a0, to = s.swap ? r.a0 + TAU : r.a1, rad = 2;
      pp.arc(s.v, rad, from + 0.06, to - 0.06, 'ga-turn');
      var tip = polar(s.v, rad, to - 0.06), tg = [-Math.sin(to), Math.cos(to)], nn = [Math.cos(to), Math.sin(to)];
      pp.path([add(add(tip, tg, -0.5), nn, 0.3), tip, add(add(tip, tg, -0.5), nn, -0.3)], 'ga-turn');
      if (audience !== 'child') {
        // under the number, or over it in the lower half of the paper (it stays on the paper)
        var dy = function (p) { return p[1] < L.H / 2 ? -1.6 : 1.6; };
        var pn = s.named === 1 ? p1 : p2, po = s.named === 1 ? p2 : p1;
        pp.lab(pn, t('wAngle'), 0, dy(pn), { name: '' });
        pp.lab(po, t('wOther'), 0, dy(po), { word: '' });
      }
    }
  }

  function render(c) {
    var s = c.state;
    var pp = Paper();
    var label;
    if (s.mode === 'kind') { drawKind(s, pp); label = t('kLabel', { verdict: s.hide ? '?' : sayOf(s) }); }
    else if (s.mode === 'point') { drawPoint(s, pp); label = t('ptLabel', { verdict: s.hide ? '?' : sayOf(s) + ' ' + subOf(s) }); }
    else { drawName(s, pp); label = t('nmLabel', { verdict: s.hide ? '?' : sayOf(s) }); }
    var field = h('div', { class: 'ga-field', role: 'img', title: t('dragHint'), 'aria-label': label }, [pp.el].concat(pp.labs));
    c.stage.replaceChildren(h('div', { class: 'ga', dataset: { aud: audience, mode: s.mode } },
      h('section', { class: 'ga-box ga-top' }, top(s)),
      h('section', { class: 'ga-box ga-paperbox' }, h('div', { class: 'ga-wrap' }, field))));
  }

  // ── captions (SPEC, Legend and captions) ──
  function caption(c) {
    var s = c.state, AU = audience;
    var out = [];
    function put(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function putHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (s.hide) { put(t(AU === 'child' ? 'cAskC' : 'cAsk_' + s.mode)); return out; }
    if (AU === 'child') {
      put(t(s.mode === 'kind' ? 'cKC_' + s.kind : s.mode === 'point' ? (s.inAngle ? 'cPC_yes' : 'cPC_no') : 'cNC'));
      return out;
    }
    if (s.mistake) putHl(t('cMist_' + s.mistake));
    if (s.mode === 'kind') {
      put(t((s.square ? 'cK_' : 'cKp_') + s.kind));
      put(t('cKArms'));
      if (AU === 'adult') put(t('whyKind'));
    } else if (s.mode === 'point') {
      if (s.where === 'in') { put(t('cP_in')); if (s.pastArc) put(t('cP_inFar')); }
      else if (s.where === 'vertex') put(t('cP_vertex'));
      else if (s.where === 'out') put(t('cP_out'));
      else { put(t('cP_arm')); if (s.pastEnd) put(t('cP_armFar')); }
      if (AU === 'adult') put(t('whyPoint'));
    } else {
      put(t(s.named === 1 ? 'cN_one' : 'cN_two'));
      if (AU === 'adult') put(t('whyName'));
    }
    return out;
  }

  // ── the header: the audience switch ──
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      // the vertex, arm a's direction and T: dragged on the paper or set by the presets; here so the URL carries them
      { key: 'vx', type: 'range', label: 'V x', value: L.defaults.vx, min: 1, max: L.W - 1, visible: hidden },
      { key: 'vy', type: 'range', label: 'V y', value: L.defaults.vy, min: 1, max: L.H - 1, visible: hidden },
      { key: 'da', type: 'range', label: 'a', value: L.defaults.da, min: 0, max: L.N - 1, visible: hidden },
      { key: 'tx', type: 'range', label: 'T x', value: L.defaults.tx, min: 0, max: L.W, visible: hidden },
      { key: 'ty', type: 'range', label: 'T y', value: L.defaults.ty, min: 0, max: L.H, visible: hidden },
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, options: L.MODES.map(function (m) { return [m, t('mode_' + m)]; }) },
      // hidden while the class is asked about the kind: the thumb's place (the middle is right) would tell
      { key: 'kb', type: 'range', label: t('kb'), value: L.defaults.kb, min: 1, max: L.HALF - 1, format: function () { return ''; },
        visible: function (prm) { return !(prm.hide === true && prm.mode === 'kind'); } },
      // the arms' lengths: the stage's Shorter / Longer buttons and the drags; here so the URL and the presets carry them
      { key: 'la', type: 'range', label: t('la'), value: L.defaults.la, min: L.L_MIN, max: L.L_MAX, format: cm, visible: hidden },
      { key: 'lb', type: 'range', label: t('lb'), value: L.defaults.lb, min: L.L_MIN, max: L.L_MAX, format: cm, visible: hidden },
      // the set square and the swap: the stage's buttons; here so the URL and the presets carry them
      { key: 'square', type: 'toggle', label: t('square'), value: L.defaults.square, visible: hidden },
      { key: 'swap', type: 'toggle', label: t('swap'), value: L.defaults.swap, visible: hidden },
      // asking first: the stage's buttons and V open and close it; here so the URL and the presets carry it
      { key: 'hide', type: 'toggle', label: t('hide'), value: L.defaults.hide, visible: hidden },
      { key: 'guess', type: 'select', label: t('guessWas', { g: '' }), value: L.defaults.guess, visible: hidden,
        options: [['', '–']].concat(Object.keys(GUESS_LABEL).map(function (g) { return [g, t(GUESS_LABEL[g])]; })) }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'v', label: t('revealKey'), run: function (sm) {
        sm.set(sm.params.hide ? { hide: false } : { hide: true, guess: '' });
      } }
    ],

    legend: [
      { shape: 'line', label: t('legArms') },
      { c: 1, shape: 'round', label: t('legAngle') },
      { shape: 'hollow', label: t('legArc') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows (clamped values written back), and forget the class's answer when the
  // picture changes under it (the arms' lengths do not change the answer, so they keep it)
  var POS = ['mode', 'vx', 'vy', 'da', 'kb', 'tx', 'ty', 'swap'];
  var sig = null;
  sim.on(function (c) {
    var s = c.state, p = c.params, fix = {};
    if (p.vx !== s.v[0] || p.vy !== s.v[1]) { fix.vx = s.v[0]; fix.vy = s.v[1]; }
    if (p.da !== s.da) fix.da = s.da;
    if (p.kb !== s.kb) fix.kb = s.kb;
    var now = POS.map(function (k) { return String(p[k]); }).join('|');
    if (sig !== null && now !== sig && p.guess) fix.guess = '';
    sig = now;
    if (Object.keys(fix).length) sim.set(fix);
  });

  // ── dragging V, the arms' ends and T; a click on empty paper moves T (mode point) ──
  var drag = null;
  function paperXY(e) {
    var f = document.querySelector('[data-sim="geo-angles"] .ga-field');
    if (!f) return null;
    var r = f.getBoundingClientRect();
    return [VIEW.x0 + (e.clientX - r.left) / r.width * (VIEW.x1 - VIEW.x0), VIEW.y1 - (e.clientY - r.top) / r.height * (VIEW.y1 - VIEW.y0)];
  }
  function handles(s) {
    var e = ends(s), out = [];
    if (s.mode === 'point') out.push(['T', s.t]);
    out.push(['A', e.a], ['B', e.b], ['V', s.v]);
    return out;
  }
  function moveTo(key, xy) {
    var s = sim.state, p = sim.params, patch = {};
    var dx = xy[0] - s.v[0], dy = xy[1] - s.v[1];
    if (key === 'A') {
      // arm a turns; b stays where it is (SPEC rule 9)
      var da = A.dirAt(dx, dy);
      patch.da = da; patch.kb = A.turnTo(da, s.db); patch.la = A.lenAt(dx, dy);
    } else if (key === 'B') {
      patch.kb = A.turnTo(s.da, A.dirAt(dx, dy)); patch.lb = A.lenAt(dx, dy);
    } else {
      var c = L.cornerAt(xy[0], xy[1]), k = key.toLowerCase();
      patch[k + 'x'] = c[0]; patch[k + 'y'] = c[1];
    }
    if (Object.keys(patch).every(function (k) { return p[k] === patch[k]; })) return;
    sim.set(patch);
  }
  var stage = document.querySelector('[data-sd-stage]');
  stage.addEventListener('pointerdown', function (e) {
    if (!e.target.closest || !e.target.closest('.ga-field')) return;
    var s = sim.state;
    var xy = paperXY(e);
    if (!xy) return;
    var best = null, bd = 0.9;
    handles(s).forEach(function (hd) {
      var d = Math.hypot(hd[1][0] - xy[0], hd[1][1] - xy[1]);
      if (d < bd) { bd = d; best = hd[0]; } // T is listed first, so it wins when T is on a handle
    });
    drag = best || (s.mode === 'point' ? 'T' : null);
    if (!drag) return;
    moveTo(drag, xy);
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    e.preventDefault();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var xy = paperXY(e);
    if (xy) moveTo(drag, xy);
  });
  function end() { drag = null; }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
