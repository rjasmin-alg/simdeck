<script src="strings.js"></script>
<script src="load.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { electric: '1', camera: '2', makeup: '4' };
  var ANGLE = { L1: 90, L2: -30, L3: 210 }; // degrees: the diagram's arrow for each phase (SPEC.md "Legend")

  /** Numbers in the page's language: a decimal comma in Croatian. */
  function num(x, d) {
    var s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function A(x) { return num(x, 1); }
  function kW(w) { return num(w / 1000, 1); }
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function joinAnd(words) {
    if (words.length < 2) return words.join('');
    return words.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + words[words.length - 1];
  }
  function phaseOf(s, id) { return s.phases.filter(function (x) { return x.id === id; })[0]; }
  function plugAt(s, slot) { return s.plugs.filter(function (x) { return x.slot === slot; })[0] || null; }
  function defOf(id) { return L.PHASES.filter(function (x) { return x.id === id; })[0]; }

  // ── "changed": against the params and state before the last input (SPEC.md rule 8) ──
  var lastParams = null, lastState = null, lastPreset = null, prevParams = null;
  var delta = { slots: [], trips: [], fresh: true };
  function sameParams(a, b) { return Object.keys(L.defaults).every(function (k) { return a[k] === b[k]; }); }
  function track(c) {
    if (lastParams && sameParams(lastParams, c.params)) return;
    prevParams = lastParams;
    var presetLoad = c.preset && c.preset !== lastPreset;
    delta = lastParams && !presetLoad
      ? { slots: L.changedSlots(lastParams, c.params), trips: L.changedTrips(lastState, c.state), fresh: false }
      : { slots: [], trips: [], fresh: true };
    lastParams = Object.assign({}, c.params);
    lastState = c.state;
    lastPreset = c.preset;
  }

  // ── stage ──

  var focusSlot = null;
  function press(slot) {
    var sim = window.simdeck;
    focusSlot = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.slot === slot ? slot : null;
    sim.set(L.click(sim.params, slot));
  }

  function socket(s, p, slot) {
    var x = plugAt(s, slot), changed = delta.slots.indexOf(slot) >= 0;
    var attrs = {
      type: 'button', class: 'pb-sock' + (x ? ' sd-fill' : '') + (changed ? ' sd-changed' : ''), dataset: { slot: slot },
      onmousedown: function (e) { e.preventDefault(); }, onclick: function () { press(slot); }
    };
    if (!x) {
      attrs.dataset.empty = '';
      attrs['aria-label'] = t('plugEmptyLabel', { id: slot, dev: t('dev_' + p.hand) });
      return h('button', attrs, h('b', null, '+ ' + t('hand_' + p.hand)), h('span', null, t('planIs', { dev: t('plan_' + L.PLAN[slot]) })));
    }
    attrs.dataset.c = COLOUR[x.dept];
    if (!x.live) attrs.dataset.dark = '';
    attrs['aria-label'] = t('plugLabel', { id: slot, dev: t('dev_' + x.device), w: x.w, a: A(x.amps) });
    return h('button', attrs,
      h('b', { class: x.live ? null : 'pb-dark' }, t('dev_' + x.device)),
      h('span', { class: 'pb-num' }, x.w + ' W · ' + A(x.amps) + ' A'),
      x.offPlan ? h('span', { class: 'pb-off' }, t('offPlan')) : null);
  }

  function fixedChip(x) {
    return h('div', { class: 'pb-chip sd-fill', dataset: x.live ? { c: COLOUR[x.dept] } : { c: COLOUR[x.dept], dark: '' } },
      h('b', { class: x.live ? null : 'pb-dark' }, t('dev_' + x.device)),
      h('span', null, h('span', { class: 'pb-num' }, x.w + ' W · ' + A(x.amps) + ' A'), ' · ', t('fixed')));
  }

  function meter(s, ph) {
    var scale = Math.max(1.5 * ph.limitW, ph.watts), left = 0;
    var segs = s.plugs.filter(function (x) { return x.phase === ph.id; }).map(function (x) {
      var w = 100 * x.w / scale, seg = h('div', {
        class: 'pb-seg sd-fill' + (x.live ? '' : ' sd-hatch'), dataset: { c: COLOUR[x.dept] },
        style: { left: left + '%', width: w + '%' }
      });
      left += w;
      return seg;
    });
    var lim = 100 * ph.limitW / scale;
    if (ph.watts > ph.limitW) segs.push(h('div', { class: 'pb-over sd-hatch', style: { left: lim + '%', width: (100 * ph.watts / scale - lim) + '%' } }));
    segs.push(h('div', { class: 'pb-limit', style: { left: lim + '%' } }));
    return h('div', { class: 'pb-meter', role: 'img', 'aria-label': t('ofRating', { a: A(ph.amps), r: ph.rating }) }, segs);
  }

  function phaseCard(s, p, ph) {
    var def = defOf(ph.id), kids = [];
    s.plugs.filter(function (x) { return x.phase === ph.id && x.fixed; }).forEach(function (x) { kids.push(fixedChip(x)); });
    def.slots.forEach(function (slot) { kids.push(socket(s, p, slot)); });
    var tripChanged = delta.trips.indexOf(ph.id) >= 0;
    return h('section', { class: 'pb-card pb-phase', dataset: ph.tripped ? { tripped: '' } : {}, 'aria-label': t('phase', { id: ph.id }) },
      h('div', { class: 'pb-head' },
        h('span', { class: 'pb-name' }, t('phase', { id: ph.id })),
        h('span', { class: 'pb-brk' + (ph.tripped ? ' pb-trip' : '') + (tripChanged ? ' sd-changed' : '') },
          ph.tripped ? '✕ ' + t('tripped') : t('breaker', { a: ph.rating }))),
      h('div', { class: 'pb-socks' }, kids),
      meter(s, ph),
      h('p', { class: 'pb-read' },
        h('span', { class: 'pb-a' }, t('ofRating', { a: A(ph.amps), r: ph.rating })),
        h('span', { class: 'pb-w' }, t('wattsOf', { w: ph.watts, lim: ph.limitW }))));
  }

  /** The arrow diagram: each phase's live current as an arrow at its angle, the neutral as their dashed sum. */
  function diagram(s) {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    var R = 40 / L.RATING; // 32 A reaches the dashed ring
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('aria-hidden', 'true');
    function el(name, attrs) {
      var e = document.createElementNS(ns, name);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
      svg.appendChild(e);
      return e;
    }
    el('circle', { cx: 50, cy: 50, r: 40, class: 'pb-ring' });
    var sx = 0, sy = 0;
    s.phases.forEach(function (ph) {
      var a = ANGLE[ph.id] * Math.PI / 180, i = ph.tripped ? 0 : ph.amps;
      var x = Math.cos(a) * i * R, y = -Math.sin(a) * i * R;
      sx += x; sy += y;
      var arm = el('line', { x1: 50, y1: 50, x2: 50 + x, y2: 50 + y, class: 'pb-arm' });
      if (ph.tripped) arm.setAttribute('data-off', '');
      if (i > 0) el('circle', { cx: 50 + x, cy: 50 + y, r: 2.6, class: 'pb-tip' });
    });
    if (Math.hypot(sx, sy) > 0.5) {
      el('line', { x1: 50, y1: 50, x2: 50 + sx, y2: 50 + sy, class: 'pb-sum' });
      el('circle', { cx: 50 + sx, cy: 50 + sy, r: 3.2, class: 'pb-sumtip' });
    }
    var labs = L.PHASES.map(function (ph) {
      var a = ANGLE[ph.id] * Math.PI / 180;
      return h('span', { class: 'pb-lab', translate: 'no', style: { left: (50 + Math.cos(a) * 50) + '%', top: (50 - Math.sin(a) * 50) + '%' } }, ph.id);
    });
    return h('div', { class: 'pb-dia' }, svg, labs);
  }

  function neutralCard(s) {
    var n = s.neutral, scale = 1.5 * n.rating;
    return h('section', { class: 'pb-card pb-neutral', 'aria-label': t('neutralTitle') },
      h('div', { class: 'pb-head' }, h('span', { class: 'pb-name' }, t('neutralTitle')),
        h('span', { class: 'pb-a pb-num' }, A(n.amps) + ' A')),
      diagram(s),
      h('div', { class: 'pb-meter', role: 'img', 'aria-label': t('ofRating', { a: A(n.amps), r: n.rating }) },
        h('div', { class: 'pb-nfill', style: { width: Math.min(100, 100 * n.amps / scale) + '%' } }),
        h('div', { class: 'pb-limit', style: { left: (100 * n.rating / scale) + '%' } })),
      h('span', { class: 'pb-small' }, t('neutralNote')),
      h('span', { class: 'pb-small' }, t('diagramKey')));
  }

  function box(s) {
    return h('section', { class: 'pb-card pb-box', 'aria-label': t('box') },
      h('span', { class: 'pb-name pb-lock' }, t('box')),
      h('ul', null, s.phases.map(function (ph) {
        return h('li', null, h('span', { class: 'pb-sw', dataset: ph.tripped ? { off: '' } : { on: '' } }, ph.tripped ? '✕' : '▮'),
          h('span', null, data(ph.id + ' ' + ph.rating + ' A'), ' ', ph.tripped ? t('boxOff') : t('boxOn')));
      })),
      h('span', { class: 'pb-small' }, t('boxNote')));
  }

  // ── caption (SPEC.md "Legend and captions") ──

  function caption(c) {
    var s = c.state, out = [], trip = null;
    var student = s.plugs.some(function (x) { return !x.fixed; });
    if (s.tripped.length) {
      var hit = delta.slots.length === 1 ? L.SLOT_PHASE[delta.slots[0]] : null;
      trip = phaseOf(s, s.tripped.indexOf(hit) >= 0 ? hit : s.tripped[0]);
    }
    if (delta.slots.length === 1) {
      var slot = delta.slots[0], pid = L.SLOT_PHASE[slot], ph = phaseOf(s, pid), x = plugAt(s, slot);
      var dev = prevParams ? prevParams[slot] : null;
      if (x) out.push(t('capDev', { dev: t('dev_' + x.device), w: x.w, a: A(x.amps) }));
      else if (dev && L.PLUGGABLE.indexOf(dev) >= 0) out.push(t('capUnplug', { dev: t('dev_' + dev) }));
      if (!(trip && trip.id === pid)) out.push(t('capPhase', { ph: pid, sum: A(ph.amps), r: ph.rating }));
    } else if (delta.slots.length > 1 && !student) out.push(t('capUnplugAll'));
    delta.trips.forEach(function (id) {
      if (!phaseOf(s, id).tripped) out.push(t('capReset', { ph: id }));
    });
    if (!student && !out.length) return t('capStart');

    if (trip) {
      out.push(t('capTrip', { ph: trip.id, sum: A(trip.amps), r: trip.rating,
        depts: joinAnd(trip.dark.map(function (d) { return t('dept_' + d); })) }));
      if (trip.dark.indexOf('camera') >= 0) out.push(t('capCamera'));
      else out.push(t('capSupply', { kw: kW(s.supply.liveW), lim: kW(s.supply.limitW) }));
    }
    if (student) {
      out.push(t('capNeutral', { n: A(s.neutral.amps), a1: A(s.phases[0].tripped ? 0 : s.phases[0].amps),
        a2: A(s.phases[1].tripped ? 0 : s.phases[1].amps), a3: A(s.phases[2].tripped ? 0 : s.phases[2].amps) }));
      if (s.offPlan.length) out.push(t.n('capOffPlanN', s.offPlan.length));
      else if (s.asPlanned) out.push(t('capAsPlanned'));
      else if (!trip) {
        var least = L.leastSpare(s);
        out.push(t('capSpare', { ph: least.id, spare: least.headroomW }));
      }
    }
    return out.join(' ');
  }

  var hidden = function () { return false; };
  var slotOptions = [['', t('empty')]].concat(L.PLUGGABLE.map(function (d) { return [d, t('dev_' + d)]; }));
  var params = [
    { key: 'hand', type: 'choice', label: t('hand'), hint: t('handHint'), options: L.PLUGGABLE.map(function (d) { return [d, t('hand_' + d)]; }) },
    { type: 'button', label: t('unplugAll'), key: 'u', run: function (sim) {
        var patch = {};
        L.SLOTS.forEach(function (id) { patch[id] = ''; });
        sim.set(patch);
      } }
  ].concat(L.SLOTS.map(function (id) {
    return { key: id, type: 'select', label: t('slotParam', { id: id }), options: slotOptions, visible: hidden };
  }));

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { c: 1, label: t('legLamp') },
      { c: 4, label: t('legMakeup') },
      { shape: 'pb-camera', label: t('legCamera') },
      { shape: 'pb-off', label: t('legOffPlan') },
      { shape: 'pb-trip', label: t('legTripped') },
      { shape: 'pb-neutral', label: t('legNeutral') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      track(c);
      var s = c.state, p = c.params;
      c.stage.replaceChildren(h('div', { class: 'pb' },
        h('p', { class: 'pb-top' }, data(t('formula'), 'pb-formula'),
          h('span', null, t.parts('supply', { kw: h('b', null, kW(s.supply.liveW)), lim: h('b', null, kW(s.supply.limitW)) }))),
        h('div', { class: 'pb-body' },
          h('div', { class: 'pb-phases' }, s.phases.map(function (ph) { return phaseCard(s, p, ph); })),
          h('div', { class: 'pb-side' }, neutralCard(s), box(s))),
        h('p', { class: 'pb-foot' }, t('foot'))));
      if (focusSlot) {
        var b = c.stage.querySelector('[data-slot="' + focusSlot + '"]');
        if (b) b.focus();
        focusSlot = null;
      }
    },
    caption: function (c) {
      track(c);
      return caption(c);
    }
  });
})();
</script>
</body>
</html>
