(function () {

  var t = Simdeck.useStrings(window.SimStrings);

  // ── small helpers ──

  function svg(tag, attrs, kids) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });

  function ctlName(k) { return t({ ncs: 'ctlNcs', none: 'ctlNone', backup: 'ctlBackup', both: 'ctlBoth' }[k]); }

  // ── stage parts ──

  function ncsCard(c) {
    var s = c.state, p = c.params, prev = c.prev || s;
    var secs = s.ncs.silence * L.SLOT_S, lim = p.wait * L.SLOT_S;
    var st = !s.ncs.alive ? ['bad', 'silent'] : s.ncs.silentSince === null && s.events.some(function (e) { return e.code === 'ncs.return'; }) ? ['ok', 'back'] : ['ok', 'onAir'];
    var changed = prev.ncs.alive !== s.ncs.alive;
    var target = L.nextTarget(s.ncs.log);
    return h('div', { class: 'bn-box bn-ctl', dataset: { off: s.ncs.alive ? '0' : '1' } },
      h('div', { class: 'bn-head' },
        h('span', { class: 'bn-badge', dataset: { who: 'ncs' } }, t('ncsName')),
        h('span', { class: 'bn-k' }, t('ncsRole')),
        h('span', { class: 'bn-status' + (changed ? ' sd-changed' : ''), dataset: { v: st[0] } }, t(st[1]))),
      h('div', { class: 'bn-ring', dataset: { full: secs >= lim ? '1' : '0' } },

        h('span', null, h('span', { class: 'bn-k' }, t('silence') + ' '), h('b', null, String(secs)), ' s ', h('span', { class: 'bn-k' }, t('of60', { w: lim })))),
      h('div', { class: 'bn-row' }, h('span', { class: 'bn-k' }, t('log') + ':'), chips(s.ncs.log, added(s.ncs.log, prev.ncs.log)),

  }

  function bncsCard(c) {
    var s = c.state, p = c.params, prev = c.prev || s, b = s.backup;
    if (!b.designated) {

        h('div', { class: 'bn-head' },
          h('span', { class: 'bn-badge', dataset: { who: 'bncs' } }, t('bncsName')),
          h('span', { class: 'bn-k' }, t('bncsRole')),
          h('span', { class: 'bn-status', dataset: { v: 'off' } }, t('notNamed'))));
    }
    var status = b.handback ? ['warn', 'handingBack'] : b.active ? ['ok', 'inControl'] : p.logging ? ['ok', 'listening'] : ['warn', 'listeningNoLog'];
    var changed = prev.backup.active !== b.active || prev.backup.handback !== b.handback;
    var target = b.active && !s.checkin ? L.nextTarget(b.log) : null;
    var extra = [];
    if (b.takeoverUtc) extra.push(h('span', { class: 'bn-entry' + (b.announced === s.slot ? ' sd-changed' : '') }, t('takeoverEntry', { utc: b.takeoverUtc })));
    if (s.checkin) extra.push(h('span', { class: 'bn-k' }, t.parts('checkinLeft', { list: nt(s.checkin.join(' ')) })));
    return h('div', { class: 'bn-box bn-ctl' },
      h('div', { class: 'bn-head' },
        h('span', { class: 'bn-badge', dataset: { who: 'bncs' } }, t('bncsName')),
        icon(b.active ? 'mega' : 'ear'),
        h('span', { class: 'bn-k' }, t('bncsRole')),
        h('span', { class: 'bn-status' + (changed ? ' sd-changed' : ''), dataset: { v: status[0] } }, t(status[1]))),
      h('div', { class: 'bn-row' }, extra.length ? extra : h('span', { class: 'bn-k' }, ' ')),
      h('div', { class: 'bn-row' }, h('span', { class: 'bn-k' }, t('log') + ':'), chips(b.log, added(b.log, prev.backup.log)),
        b.active ? [h('span', { class: 'bn-k' }, ' ' + t('next') + ':'), h('b', { translate: 'no' }, target || t('nextNone'))] : null));
  }

  function whoCard(c) {
    var s = c.state, n = c.n;
    var cur = n ? s.channel[n - 1].controller : 'ncs';
    var before = n > 1 ? s.channel[n - 2].controller : cur;
    var k = L.counts(s);
    return h('div', { class: 'bn-box bn-who' },
      h('span', { class: 'bn-k' }, t('control')),
      h('span', { class: 'bn-who-v' + (n && cur !== before ? ' sd-changed' : '') }, h('span', { class: 'bn-sw', dataset: { ctl: cur } }), ctlName(cur)),
      h('span', { class: 'bn-k bn-mono' }, n ? t('utcNow', { n: n, utc: L.utc(n) }) : t('utcStart', { utc: L.utc(1) })),
      h('dl', { class: 'bn-stats' },
        h('dt', null, t('delivered')), h('dd', null, L.delivered(s) + '/5'),
        h('dt', null, t('idleSlots')), h('dd', null, String(k.idle)),
        h('dt', null, t('doubledSlots')), h('dd', null, String(k.doubled))));
  }

  function stationCard(c, x) {
    var s = c.state, prev = c.prev ? c.prev.stations.filter(function (y) { return y.id === x.id; })[0] : x;
    var calledNow = s.called === x.id;
    var lines = [];
    if (x.deliveredAt !== null) {
      lines.push(h('span', { class: 'bn-line bn-good' }, t('sentAt', { n: x.deliveredAt })));
      // the ACK is owed by a controller on the air that heard it: it comes with that controller's next call
      var owed = (s.ncs.alive && s.ncs.ackDue === x.id) || (s.backup.active && s.backup.ackDue === x.id);
      lines.push(h('span', { class: 'bn-line' + (x.ackedAt === null ? ' bn-k' : '') },
        x.ackedAt !== null ? t('ackAt', { n: x.ackedAt }) : owed ? t('ackNext') : t('noAck')));
    } else if (calledNow) {
      lines.push(h('span', { class: 'bn-line' }, t('called')));
    } else {
      var lost = s.channel.filter(function (ch) { return ch.kind === 'answer' && ch.tx[0] === x.id && ch.outcome === 'heard'; })[0];
      lines.push(h('span', { class: 'bn-line' + (lost ? ' bn-bad' : '') }, lost ? t('lostAt', { n: lost.slot }) : t('waiting')));
    }
    if (x.checkedIn !== null) lines.push(h('span', { class: 'bn-line' }, x.hadTraffic ? t('checkinTraffic') : t('checkinNone')));
    var changed = c.n > 0 && (calledNow || JSON.stringify(prev) !== JSON.stringify(x));
    return h('div', { class: 'bn-box bn-st' + (changed ? ' sd-changed' : ''), dataset: { v: x.deliveredAt !== null ? 'done' : 'wait' } },
      h('div', { class: 'bn-st-head' }, h('span', { class: 'bn-letter', translate: 'no' }, x.id), t.parts('stationName', { id: nt(x.id) })),
      lines);
  }

  /** One slot cell of the strip. */
  function cell(ch) {
    if (!ch) return h('div', { class: 'bn-cell', dataset: { k: 'future' } });
    if (ch.outcome === 'idle') return h('div', { class: 'bn-cell', dataset: { k: 'idle' } }, h('span', null, t('cellIdle')));
    if (ch.outcome === 'doubled') {
      return h('div', { class: 'bn-cell', dataset: { k: 'double' } }, h('b', null, '×'),
        ch.acts.map(function (a) { return h('span', null, whoName(a.who)); }), h('span', { 'data-wide': '' }, t('cellDouble')));
    }
    var a = ch.acts[0];
    if (a.kind === 'answer') return h('div', { class: 'bn-cell', dataset: { k: 'station' } }, h('b', { translate: 'no' }, a.who), h('span', { 'data-wide': '' }, t('cellAnswer')));
    if (a.kind === 'checkin') return h('div', { class: 'bn-cell', dataset: { k: 'checkin' } }, h('b', { translate: 'no' }, a.who), h('span', null, t('cellCheckin')));
    var k = a.who === 'ncs' ? 'ncs' : 'bncs';
    var body = [h('b', null, whoName(a.who))];
    if (a.kind === 'call') body.push(h('span', { translate: 'no' }, '→ ' + a.target), a.ack ? h('span', { translate: 'no' }, '✓ ' + a.ack) : null);
    if (a.kind === 'announce') body.unshift(icon('mega')), body.push(h('span', { 'data-wide': '' }, t('cellAnnounce')));
    if (a.kind === 'handback') body.push(h('span', null, t('cellHandback')));
    return h('div', { class: 'bn-cell', dataset: { k: k } }, body);
  }

  function strip(c) {
    var s = c.state, N = c.steps, n = c.n;
    // runs of the same controller over the resolved slots, for the band's labels
    var runs = [];
    s.channel.forEach(function (ch) {
      var last = runs[runs.length - 1];
      if (last && last.ctl === ch.controller) last.len++;
      else runs.push({ ctl: ch.controller, from: ch.slot, len: 1 });
    });
    var before = n > 1 ? s.channel[n - 2].controller : null;
    var runRow = h('div', { class: 'bn-grid bn-runs', style: { '--n': String(N) } }, runs.map(function (r) {
      var isNow = n >= r.from && n < r.from + r.len;
      return h('div', { class: 'bn-run' + (isNow && before !== null && before !== r.ctl && r.from === n ? ' sd-hl' : ''),
        style: { gridColumn: r.from + ' / span ' + r.len } }, ctlName(r.ctl));
    }));
    var cols = [];
    for (var i = 1; i <= N; i++) {
      var ch = s.channel[i - 1] || null;
      var cl = cell(ch);
      if (i === n) cl.classList.add('sd-changed');
      if (i === n && c.dir === 'forward') cl.classList.add('sd-anim-in');
      cols.push(h('div', { class: 'bn-col', 'aria-label': t('slotLabel', { n: i }) },
        h('div', { class: 'bn-band', dataset: { ctl: ch ? ch.controller : 'future' } }),
        cl,
        h('div', { class: 'bn-num', dataset: { now: i === n ? '1' : '0' } }, String(i))));
    }
    return h('div', { class: 'bn-strip' },
      h('div', { class: 'bn-strip-head' },
        h('b', null, t('channel')),
        ['ncs', 'none', 'backup', 'both'].map(function (k) {
          return h('span', { class: 'bn-key' }, h('span', { class: 'bn-sw', dataset: { ctl: k } }), ctlName(k));
        })),
      runRow,
      h('div', { class: 'bn-grid bn-cells', style: { '--n': String(N) }, dataset: { dense: N > 15 ? '1' : '0' } }, cols));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, p = c.params, n = c.n;
    if (c.first) return t(!p.backup ? 'capStartNoB' : !p.logging ? 'capStartNoLog' : 'capStart');
    var prev = c.prev, ch = s.channel[n - 1], ev = L.eventsAt(s, n), out = [t('capSlot', { n: n })];
    function add(key, vars) {
      var v = {};
      Object.keys(vars || {}).forEach(function (k) { v[k] = k === 'st' || k === 'ack' ? nt(vars[k]) : vars[k]; });
      out.push(' ');
      var seen = [];   // a placeholder used twice gets its own copy of the node (a node lives in one place)
      out.push.apply(out, t.parts(key, v).map(function (x) {
        if (!(x instanceof Node)) return x;
        if (seen.indexOf(x) >= 0) return x.cloneNode(true);
        seen.push(x);
        return x;
      }));
    }
    var has = function (code) { return ev.indexOf(code) >= 0; };
    var secs = s.ncs.silence * L.SLOT_S, prevSecs = prev.ncs.silence * L.SLOT_S;
    if (has('ncs.return')) {
      if (prev.backup.active) add('capReturn');
      else add(p.backup ? 'capReturnResume' : 'capReturnResumeNoB', { s: prevSecs });
    }
    if (has('ncs.silent') && ch.outcome !== 'idle') add('capSilentFirst');
    if (ch.kind === 'answer') {
      var x = ch.tx[0], stx = s.stations.filter(function (y) { return y.id === x; })[0];
      var bLogs = s.backup.designated && (s.backup.logging || s.backup.active);
      if (stx.deliveredAt !== n) add('capAnswerLost', { st: x });
      else if (s.ncs.alive && bLogs) add('capAnswer', { st: x });
      else if (s.ncs.alive) add('capAnswerNcs', { st: x });
      else add('capAnswerB', { st: x });
    } else if (ch.kind === 'checkin') {
      var y = s.stations.filter(function (z) { return z.id === ch.tx[0]; })[0];
      add(y.pending ? 'capCheckinTraffic' : 'capCheckinNone', { st: y.id });
    } else if (ch.outcome === 'doubled') {
      // say what each controller actually sent: an announcement against a call, two calls to one or two stations
      var calls = ch.acts.filter(function (a) { return a.kind === 'call'; });
      var ncsAct = ch.acts.filter(function (a) { return a.who === 'ncs'; })[0];
      if (ch.acts.some(function (a) { return a.kind === 'announce'; })) add('capDoubleAnnounce', { st: ncsAct && ncsAct.target ? ncsAct.target : '' });
      else if (calls.length === 2 && calls[0].target !== calls[1].target) add('capDoubleTwo', { st: calls[0].target, ack: calls[1].target });
      else add('capDouble', { st: calls[0].target });
    } else if (ch.outcome === 'heard') {
      var a = ch.acts[0], who = whoName(a.who);
      if (a.kind === 'call') {
        if (a.ack) add('capCallAck', { who: who, ack: a.ack, st: a.target });
        else add('capCall', { who: who, st: a.target });
      }
      if (a.kind === 'handback') add('capHandback');
      if (a.kind === 'announce') {
        if (p.wait * L.SLOT_S < 60) {
          add('capTakeoverEarly', { s: prevSecs });
          if (!p.logging) add('capNoLogAsk');
        }
        else if (!p.logging) add('capTakeoverNoLog', { s: prevSecs });
        else add('capTakeover', { st: L.nextTarget(s.backup.log) });
        add('capAnnounce', { utc: s.backup.takeoverUtc });
      }
    } else if (!s.ncs.alive) {
      if (has('ncs.silent')) add('capSilentFirst');
      if (has('net.dead')) add(p.ncsReturns ? 'capDeadUntil' : 'capDead', { s: secs });
      else if (!p.backup) {
        if (s.ncs.silence > L.DEAD_AFTER) add('capDeadIdle');
        else add('capSilentNoB', { s: secs });
      } else add('capSilent', { s: secs, w: p.wait * L.SLOT_S });
    }
    if (c.last) {
      add('capEnd', { n: n, d: L.delivered(s) });
      if (L.counts(s).doubled && p.wait * L.SLOT_S < 60 && p.ncsReturns) {
        // only when the patient run really is clean: the NCS back before any takeover, no doubling
        var q = Object.assign({}, p, { wait: 4 }), k = L.steps(q), w = Simdeck.stateAt(L, q, k);
        if (k < n && L.counts(w).doubled === 0 && w.backup.takeoverUtc === null) add('capCompare', { k: k });
      }
    }
    return out;
  }

  // ── mount ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'failAt', type: 'range', label: t('failAt'), min: 3, max: 10 },
      { key: 'backup', type: 'toggle', label: t('backup') },
      { key: 'logging', type: 'toggle', label: t('logging'), visible: function (p) { return p.backup; } },
      { key: 'wait', type: 'choice', label: t('wait'), visible: function (p) { return p.backup; }, options: [[1, t('wait1')], [4, t('wait4')]] },
      { key: 'ncsReturns', type: 'toggle', label: t('ncsReturns') },
      { key: 'returnAt', type: 'range', label: t('returnAt'), min: function (p) { return p.failAt + 1; }, max: 20, visible: function (p) { return p.ncsReturns; } }
    ],

    presets: [
      { id: 'takeover', label: t('presetTakeover'), hint: t('presetTakeoverHint'), params: {} },
      { id: 'no-backup', label: t('presetNoBackup'), hint: t('presetNoBackupHint'), params: { backup: false } },
      { id: 'too-early', label: t('presetEarly'), hint: t('presetEarlyHint'), params: { wait: 1, ncsReturns: true, returnAt: 7 } },
      { id: 'no-log', label: t('presetNoLog'), hint: t('presetNoLogHint'), params: { logging: false } }
    ],

    legend: [
      { shape: 'bn-ncs', label: t('legendNcs') },
      { shape: 'bn-bncs', label: t('legendBncs') },
      { shape: 'bn-ear', label: t('legendEar') },
      { shape: 'bn-ring', label: t('legendRing') },
      { shape: 'bn-mega', label: t('legendMega') },
      { shape: 'bn-double', label: t('legendDouble') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'bn' },
        h('div', { class: 'bn-top' }, ncsCard(c), bncsCard(c), whoCard(c)),
        h('div', { class: 'bn-stations' }, s.stations.map(function (x) { return stationCard(c, x); })),
        strip(c)));
    },

    caption: caption
  });

  // the legend's icon swatches (the kit draws empty swatches with data-shape; the page fills them)
  var fill = {
    'bn-ear': function () { return icon('ear'); },
    'bn-mega': function () { return icon('mega'); },
    'bn-ring': function () { return ring(0.75); },
    'bn-double': function () { return document.createTextNode('×'); }
  };
  document.querySelectorAll('[data-sd-legend] .sd-swatch').forEach(function (sw) {
    var f = fill[sw.dataset.shape];
    if (f) sw.replaceChildren(f());
  });
})();
</script>
</body>
</html>
