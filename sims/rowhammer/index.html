<!-- Rowhammer: adopted from single-page-labs/rowhammer.html into the simdeck kit (docs/sim-ui.md). An explorer: the
     params (activations per aggressor row in one refresh window, the weakest cell's threshold, single- or double-sided,
     a mitigation) drive the DRAM bank live. The model is in sim.js, the words in strings.js. -->
<html lang="hr" data-sim="rowhammer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rowhammer · simdeck</title>
<meta name="description" content="Rowhammer: česte aktivacije jednog DRAM retka mijenjaju bitove u susjednim retcima; jednostrano, dvostrano i zaštite.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "rowhammer",
  "class": "explorer",
  "title": { "hr": "Rowhammer: smetnja među DRAM retcima", "en": "Rowhammer: disturbance between DRAM rows" },
  "concept": { "hr": "Česte aktivacije jednog retka prazne ćelije susjednih redaka prije osvježavanja", "en": "Frequent activations of one row drain the cells next to it before a refresh" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="rowhammer"]; colours only from kit tokens. */
[data-sim="rowhammer"] .sd-presets { grid-template-columns: 1fr 1fr; }
[data-sim="rowhammer"] .sd-preset { line-height: 1.15; }
[data-sim="rowhammer"] .rh {
  display: flex;
  flex-direction: column;
  gap: 1.2cqh;
  height: 100%;
  padding: 1.4cqh 1.4cqw;
  font-size: var(--fs-md);
}
[data-sim="rowhammer"] .rh-data { font-family: var(--mono); white-space: nowrap; }

/* top: phase indicator and stats */
[data-sim="rowhammer"] .rh-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr); gap: 1.4cqw; align-items: stretch; }
[data-sim="rowhammer"] .rh-phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.3rem; align-content: center; }
[data-sim="rowhammer"] .rh-phase {
  padding: 0.3rem 0.2rem;
  text-align: center;
  font-size: var(--fs-sm);
  font-weight: 700;
  border: var(--line-w) dashed var(--line);
  border-radius: var(--radius-sm);
  color: var(--muted);
}
[data-sim="rowhammer"] .rh-phase.rh-done { border-style: solid; border-color: var(--muted); color: var(--ink); }
[data-sim="rowhammer"] .rh-phase.rh-done::before { content: '✓ '; }
[data-sim="rowhammer"] .rh-phase.rh-now { border: max(3px, 0.2rem) solid var(--ink); background: var(--hl); color: var(--on-hl); }
[data-sim="rowhammer"] .rh-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.6cqw; }
[data-sim="rowhammer"] .rh-stat {
  padding: 0.2rem 0.6rem;
  border: var(--line-w) solid var(--line);
  border-top: 0.3rem solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--panel);
}
[data-sim="rowhammer"] .rh-val { font-family: var(--mono); font-weight: 700; font-size: var(--fs-lg); color: var(--accent); }
[data-sim="rowhammer"] .rh-lbl { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; line-height: 1.15; }

/* the bank */
[data-sim="rowhammer"] .rh-bank { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 0.3cqh; }
[data-sim="rowhammer"] .rh-head, [data-sim="rowhammer"] .rh-row {
  display: grid;
  grid-template-columns: 8.5rem minmax(0, 1fr) 14rem;
  gap: 1cqw;
  align-items: center;
}
[data-sim="rowhammer"] .rh-head { font-size: var(--fs-sm); font-weight: 700; color: var(--muted); }
[data-sim="rowhammer"] .rh-head > :last-child { text-align: right; }
[data-sim="rowhammer"] .rh-row {
  flex: 1 1 0;
  min-height: 0;
  max-height: 4.2rem;
  padding: 0 0.4rem;
  border-left: 0.4rem solid transparent;
  border-radius: var(--radius-sm);
}
[data-sim="rowhammer"] .rh-row.rh-agg { border-left-color: var(--c2); background: color-mix(in srgb, var(--c2) 16%, transparent); }
[data-sim="rowhammer"] .rh-row.rh-vic { border-left: 0.4rem dashed var(--c4); background: color-mix(in srgb, var(--c4) 10%, transparent); }
[data-sim="rowhammer"] .rh-name { font-weight: 700; white-space: nowrap; font-size: var(--fs-sm); }
[data-sim="rowhammer"] .rh-agg .rh-name { color: var(--c2); }
[data-sim="rowhammer"] .rh-vic .rh-name { color: var(--c4); }
[data-sim="rowhammer"] .rh-cells { display: flex; gap: 0.6cqw; height: 100%; padding: 0.3cqh 0; min-width: 0; }
[data-sim="rowhammer"] .rh-word {
  flex: 1 1 0;
  min-width: 0;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  gap: 0.2cqw;
  position: relative;
  border-radius: var(--radius-sm);
}
[data-sim="rowhammer"] .rh-word[data-w]::after {
  position: absolute;
  right: -0.15rem;
  top: -0.55rem;
  z-index: 1;
  padding: 0 0.2rem;
  font-size: var(--fs-sm);
  font-weight: 700;
  line-height: 1.1;
  background: var(--bg);
  border: 2px solid var(--ink);
  border-radius: var(--radius-sm);
}
[data-sim="rowhammer"] .rh-word[data-w='corrected']::after { content: '✓'; color: var(--ok); }
[data-sim="rowhammer"] .rh-word[data-w='detected']::after { content: '!'; color: var(--warn); }
[data-sim="rowhammer"] .rh-word[data-w='beyond']::after,
[data-sim="rowhammer"] .rh-word[data-w='wrong']::after { content: '✗'; color: var(--danger); }
[data-sim="rowhammer"] .rh-cell {
  display: grid;
  place-items: center;
  min-width: 0;
  font-family: var(--mono);
  font-weight: 700;
  font-size: var(--fs-sm);
  border: 2px solid var(--c1);
  border-radius: 3px;
}
[data-sim="rowhammer"] .rh-cell.rh-one { background: var(--c1); color: var(--on-series); }
[data-sim="rowhammer"] .rh-cell.rh-zero { border-style: dashed; border-color: var(--muted); color: var(--muted); background: var(--bg); }
[data-sim="rowhammer"] .rh-cell.rh-flip { background: var(--hl); color: var(--on-hl); border: max(3px, 0.2rem) solid var(--ink); }

/* disturbance bar: scaled to the strongest cell's threshold, the weakest cell's marked */
[data-sim="rowhammer"] .rh-dist { display: grid; grid-template-columns: minmax(0, 1fr) 5.2rem; gap: 0.5rem; align-items: center; }
[data-sim="rowhammer"] .rh-track { position: relative; height: 1.1rem; border: 2px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); }
[data-sim="rowhammer"] .rh-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c4); }
[data-sim="rowhammer"] .rh-fill.rh-over { background: var(--danger); }
[data-sim="rowhammer"] .rh-thr { position: absolute; top: -0.3rem; bottom: -0.3rem; border-left: 3px dashed var(--ink); }
[data-sim="rowhammer"] .rh-num { text-align: right; font-family: var(--mono); font-weight: 700; font-size: var(--fs-sm); }

[data-sim="rowhammer"] .rh-key { display: flex; flex-wrap: wrap; gap: 0.3rem 1.4rem; font-size: var(--fs-sm); font-weight: 700; align-items: center; }
[data-sim="rowhammer"] .rh-key .rh-sym { display: inline-block; padding: 0 0.25rem; margin-right: 0.3rem; border: 2px solid var(--ink); border-radius: var(--radius-sm); }
[data-sim="rowhammer"] .rh-key .rh-thrkey { display: inline-block; width: 0; height: 1.1rem; margin: 0 0.5rem -0.2rem 0; border-left: 3px dashed var(--ink); }

@media (prefers-reduced-motion: no-preference) {
  [data-sim="rowhammer"]:not([data-motion='reduce']) .rh-fill { transition: width 0.25s ease; }
}

/* Phone and portrait: the stage grows with its content; everything stacks, cells drop their digits. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="rowhammer"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="rowhammer"] .rh { height: auto; gap: 0.6rem; padding: 0.5rem 0.4rem; }
  [data-sim="rowhammer"] .rh-top { grid-template-columns: 1fr; }
  [data-sim="rowhammer"] .rh-stats { grid-template-columns: 1fr 1fr; gap: 0.4rem; }
  [data-sim="rowhammer"] .rh-bank { flex: none; gap: 0.4rem; }
  [data-sim="rowhammer"] .rh-head { display: none; }
  [data-sim="rowhammer"] .rh-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: 'name dist' 'cells cells'; flex: none; height: auto; max-height: none; padding: 0.2rem 0.3rem; gap: 0.2rem 0.5rem; }
  [data-sim="rowhammer"] .rh-name { grid-area: name; }
  [data-sim="rowhammer"] .rh-dist { grid-area: dist; grid-template-columns: minmax(0, 1fr) auto; }
  [data-sim="rowhammer"] .rh-cells { grid-area: cells; height: 1.4rem; gap: 0.3rem; }
  [data-sim="rowhammer"] .rh-cell span { display: none; }
}
</style>
</head>
<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Rowhammer: smetnja među DRAM retcima</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Thousands as digits in groups of three (data, not language). */
  function count(k) {
    var str = String(Math.round(k * 1000));
    return str.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
  function data(text) { return h('span', { translate: 'no', class: 'rh-data' }, text); }
  function bold(text) { return h('b', { translate: 'no' }, String(text)); }

  var PHASES = ['idle', 'activate', 'disturb', 'flip'];
  var PHASE_KEY = { idle: 'phaseIdle', activate: 'phaseActivate', disturb: 'phaseDisturb', flip: 'phaseFlip' };

  function phases(st) {
    var at = PHASES.indexOf(st.phase);
    return h('div', { class: 'rh-phases' }, PHASES.map(function (ph, i) {
      return h('div', { class: 'rh-phase' + (i === at ? ' rh-now' : i < at ? ' rh-done' : '') }, t(PHASE_KEY[ph]));
    }));
  }

  function stat(value, label) {
    return h('div', { class: 'rh-stat' }, h('div', { class: 'rh-val', translate: 'no' }, value), h('div', { class: 'rh-lbl' }, label));
  }

  function rowEl(row, p, st) {
    var kind = row.kind === 'aggressor' ? ' rh-agg' : row.kind === 'victim' ? ' rh-vic' : '';
    var name = t(row.kind === 'aggressor' ? 'rowAgg' : row.kind === 'victim' ? 'rowVic' : 'rowFar', { r: row.r });
    var words = row.words.map(function (w, wi) {
      var cells = row.cells.slice(wi * L.WORD, (wi + 1) * L.WORD).map(function (c) {
        var cls = c.flipped ? 'rh-flip' : c.now ? 'rh-one' : 'rh-zero';
        return h('div', { class: 'rh-cell ' + cls }, h('span', { translate: 'no' }, String(c.now)));
      });
      return h('div', { class: 'rh-word', dataset: w.status === 'clean' ? {} : { w: w.status } }, cells);
    });
    var full = p.thresh * (1 + L.SPREAD);
    var dist = h('div', { class: 'rh-dist' },
      h('div', { class: 'rh-track', 'aria-hidden': 'true' },
        h('div', { class: 'rh-fill' + (row.dist >= p.thresh ? ' rh-over' : ''), style: { width: Math.min(100, row.dist / full * 100) + '%' } }),
        h('div', { class: 'rh-thr', style: { left: (100 / (1 + L.SPREAD)) + '%' } })),
      h('span', { class: 'rh-num', translate: 'no' }, row.kind === 'aggressor' ? '—' : count(row.dist)));
    return h('div', { class: 'rh-row' + kind }, h('span', { class: 'rh-name' }, name), h('div', { class: 'rh-cells' }, words), dist);
  }

  function key(p) {
    var items = [h('span', null, h('span', { class: 'rh-thrkey', 'aria-hidden': 'true' }), t('threshMark') + ' · ', data(count(p.thresh)))];
    if (p.mitigation === 'ecc') {
      items.push(h('span', null, t('wordKey')));
      items.push(h('span', null, h('span', { class: 'rh-sym' }, '✓'), t('wordCorrected')));
      items.push(h('span', null, h('span', { class: 'rh-sym' }, '!'), t('wordDetected')));
      items.push(h('span', null, h('span', { class: 'rh-sym' }, '✗'), t('wordBeyond')));
    } else {
      items.push(h('span', null, h('span', { class: 'rh-sym' }, '✗'), t('wordWrong')));
    }
    return h('div', { class: 'rh-key' }, items);
  }

  var labels = {
    single: 'presetSingle', double: 'presetDouble', refresh2x: 'presetRefresh', trr: 'presetTrr',
    'trr-weak': 'presetTrrWeak', ecc: 'presetEcc', 'ecc-heavy': 'presetEccHeavy'
  };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'acts', type: 'range', label: t('acts'), min: 0, max: 120, step: 5, format: count },
      { key: 'thresh', type: 'range', label: t('thresh'), min: 4, max: 50, step: 1, format: count },
      { key: 'pattern', type: 'choice', label: t('pattern'), options: [['single', t('patternSingle')], ['double', t('patternDouble')]] },
      { key: 'mitigation', type: 'choice', label: t('mitigation'), options: [['none', t('mitNone')], ['refresh2x', t('mitRefresh')], ['trr', t('mitTrr')], ['ecc', t('mitEcc')]] },
      { key: 'size', type: 'choice', label: t('size'), options: Object.keys(L.SIZES).map(function (k) { return [k, L.SIZES[k][0] + ' × ' + L.SIZES[k][1]]; }) }
    ],

    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),

    legend: [
      { c: 2, label: t('legendAggressor') },
      { c: 4, shape: 'hollow', label: t('legendVictim') },
      { c: 1, label: t('legendOne') },
      { shape: 'hollow', label: t('legendZero') },
      { shape: 'hl', label: t('legendFlipped') }
    ],

    render: function (c) {
      var p = c.params, st = c.state;
      var ratio = Math.round(st.maxDist / p.thresh * 100);
      c.stage.replaceChildren(h('div', { class: 'rh' },
        h('div', { class: 'rh-top' },
          phases(st),
          h('div', { class: 'rh-stats' },
            stat(count(p.acts), t('statActs')),
            stat(String(st.flips), t('statFlips')),
            stat(count(st.rate / 1000), t('statRate')),
            stat(ratio + ' %', t('statDist')))),
        h('div', { class: 'rh-bank' },
          h('div', { class: 'rh-head', 'aria-hidden': 'true' }, h('span'), h('span'), h('span', null, t('distHead'))),
          st.rows.map(function (r) { return rowEl(r, p, st); })),
        key(p)));
    },

    caption: function (c) {
      var p = c.params, st = c.state;
      if (p.acts === 0) return t('captionIdle');
      var out = [];
      var add = function (parts) { if (out.length) out.push(' '); out = out.concat(parts); };
      var a = st.aggressors;
      if (p.pattern === 'single') add(t.parts('captionSingle', { a: bold(a[0]), acts: bold(count(p.acts)), rate: bold(count(st.rate / 1000)) }));
      else add(t.parts('captionDouble', { a: bold(a[0]), b: bold(a[1]), acts: bold(count(p.acts)), rate: bold(count(st.rate / 1000)) }));
      if (p.mitigation === 'refresh2x') add(t.parts('captionRefresh', { per: bold(count(st.per)) }));
      if (p.mitigation === 'trr') add(t.parts(p.acts > L.TRR_LIMIT ? 'captionTrr' : 'captionTrrIdle', { limit: bold(count(L.TRR_LIMIT)) }));
      // The most disturbed row; ties go to the lowest row number.
      var v = st.rows.reduce(function (b, r) { return r.dist > b.dist ? r : b; }, st.rows[0]);
      add(t.parts('captionDist', { v: bold(v.r), d: bold(count(v.dist)) }));
      if (!st.flips) { add([t('captionNone')]); return out; }
      add([h('span', { class: 'sd-hl' }, t.n('captionFlips', st.flips))]);
      if (st.words) add(t.parts('captionEcc', { c: bold(st.words.corrected), d: bold(st.words.detected), x: bold(st.words.beyond) }));
      else add([t.n('captionWrong', st.wrongWords)]);
      return out;
    }
  });
})();
</script>
</body>
</html>
