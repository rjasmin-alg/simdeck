     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>

        <summary></summary>

<script src="strings.js"></script>
<script src="placement.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  /** Series colours: racks 1–3 (copies and rack frames), clean and degraded PGs (as ceph-min-size). */
  var C_RACK = [1, 2, 4], C_CLEAN = 3, C_DEG = 7;
  var RACK_VAR = ['var(--c1)', 'var(--c2)', 'var(--c4)'];                // the frames, in the colours of C_RACK

  function icon(g) {
    if (g === 'clean') return h('span', { class: 'cf-ic', translate: 'no' }, '✓');
    if (g === 'stale') return h('span', { class: 'cf-ic', translate: 'no' }, '∅');
    return h('span', { class: 'cf-ic cf-ic-' + g, 'aria-hidden': 'true' });
  }
  /** Data (pool, host and PG names, numbers, rule text) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, t('thsep')); }
  function pct(n, all) { return (Math.round(1000 * n / all) / 10).toFixed(1).replace('.', t('dec')) + (t('dec') === ',' ? ' %' : '%'); }
  function stopped(c) { return c.inactive + c.stale; }
  function P(s) { return L.POOLS[s.pool]; }
  function hostLabel(i) { return L.hostName(i).slice(5); }                 // ceph-r1-3 → r1-3 in the cells

  /** Caption parts from t(key) or t.n(key, n): node placeholders are put back where they land (cloned); *English term*
      becomes <em lang="en"> (the Croatian term rule, for terms the glossary lacks); `rule text` becomes <code>. */
  var MARK = '\u0001';
  function rich(key, vars, n) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var text = n === undefined ? t(key, flat) : t.n(key, n, flat);
    var out = [];
    text.split(/(\*[^*]+\*|`[^`]+`)/).forEach(function (bit) {
      if (!bit) return;
      if (bit[0] === '`') { out.push(h('code', { translate: 'no' }, bit.slice(1, -1))); return; }
      var em = bit[0] === '*';
      if (em) bit = bit.slice(1, -1);
      bit.split(MARK).forEach(function (piece, j) {
        if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
        else if (piece) out.push(em ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }

  // ── stage ──

  function head(c) {
    var s = c.state, p = P(s), prev = c.prev;
    var setting = p.type === 'erasure' ? 'EC ' + p.k + '+' + p.m + ' · min_size ' + p.minSize
      : 'size ' + p.width + ' · min_size ' + p.minSize;
    return h('div', { class: 'cf-head' },
      h('span', null, t('poolWord'), ' ', h('b', { translate: 'no' }, p.name)),
      h('span', { class: 'cf-badge', translate: 'no' }, setting),
      h('span', null, t.n('pgCount', p.pgNum, { c: num(p.pgNum) })),
      s.health ? h('span', { class: 'cf-health' + (prev && prev.health && prev.health !== s.health ? ' cf-now' : ''),
        dataset: { h: s.health === 'HEALTH_OK' ? 'ok' : 'warn' }, translate: 'no' }, (s.health === 'HEALTH_OK' ? '✓ ' : '⚠ ') + s.health) : null);
  }

  function rule(c) {
    var s = c.state, p = P(s);
    var changed = !!(s.ev && s.ev.switched);
    var name = p.type === 'erasure' ? 'ec_rule' : 'replicated_rule';
    return h('pre', { class: 'cf-rule', translate: 'no', 'aria-label': t('ruleTitle') },
        'rule ' + name + ' {\n    type ' + p.type + '\n    step take default\n    step chooseleaf ' + L.ruleMode(s.pool) + ' 0 type ',
        h('span', { class: 'cf-word' + (changed ? ' cf-now' : '') }, s.rule),
        '\n    step emit\n}');
  }

  function tree(c) {
    var s = c.state;
    var racks = [];
    for (var r = 1; r <= L.RACKS; r++) {
      var hosts = [];
      for (var k = 0; k < L.HOSTS_PER_RACK; k++) hosts.push(h('div', { class: 'cf-host', translate: 'no' }, L.hostName((r - 1) * L.HOSTS_PER_RACK + k)));
      var lost = s.lostRack === r;
      var lostNow = lost && s.ev && s.ev.kind === 'lose';
      racks.push(h('div', { class: 'cf-rack', dataset: lost ? { lost: 'true' } : null, style: { '--rc': RACK_VAR[r - 1] } },
        h('div', { class: 'cf-rack-h' }, h('b', { translate: 'no' }, 'rack' + r),
          lost ? h('span', { class: 'cf-lostword' + (lostNow ? ' cf-now' : '') }, t('rackLost')) : null),
        hosts));
    }
    return h('div', { class: 'cf-col' },
      h('p', { class: 'cf-sub' }, h('b', null, t('treeTitle')), ' · ', h('span', { translate: 'no' }, 'root → rack → host'), ' · ', t('hostOsds')),
      h('div', { class: 'cf-tree' }, h('div', { class: 'cf-root', translate: 'no' }, 'root default'), h('div', { class: 'cf-racks' }, racks)));
  }

  function totalsCard(c) {
    var s = c.state, p = P(s), prev = c.prev;
    if (s.ev && s.ev.kind === 'totals') return cmpCard(c);
    var kids = [h('h3', null, t('totalsTitle'))];
    if (!s.placed) { kids.push(h('div', { class: 'cf-muted' }, t('notPlaced'))); return h('div', { class: 'cf-card' }, kids); }
    kids.push(h('div', { class: 'cf-counts' }, L.GROUPS.map(function (g) {
      var moved = !!(prev && prev.counts) && prev.counts[g] !== s.counts[g];
      return h('span', { class: 'cf-st cf-st-' + g + (moved ? ' cf-now' : '') }, icon(g), ' ', t.n('cnt_' + g, s.counts[g], { c: num(s.counts[g]) }));
    })));
    if (s.risk) {
      kids.push(h('div', { class: (s.risky ? 'cf-riskline' : 'cf-st cf-st-clean') + (s.ev && s.ev.kind === 'risk' ? ' cf-now' : '') },
        s.risky ? t(s.pool === 'ec' ? 'riskLineEc' : 'riskLine', { n: num(s.risky), all: num(p.pgNum) }) : t(s.pool === 'ec' ? 'riskNoneEc' : 'riskNone')));
    } else kids.push(h('div', { class: 'cf-muted' }, t('riskUnknown')));
    if (s.holes) kids.push(h('div', { class: 'cf-st cf-st-inactive' }, t('holesLine', { n: num(s.holes), all: num(p.pgNum) })));
    return h('div', { class: 'cf-card' }, kids);
  }

  function cmpCard(c) {
    var s = c.state, ev = s.ev, lost = ev.lost;
    var headRow = [h('th', null, t('totRule')), h('th', null, t('totRisk')), h('th', null, t('totBefore'))];
    if (lost) headRow.push(h('th', null, t('totStop')), h('th', null, t('totDegraded')), h('th', null, t('totClean')));
    var rows = ev.totals.map(function (r) {
      var cur = r.rule === s.rule;
      var tds = [
        h('td', null, h('code', { translate: 'no' }, 'type ' + r.rule), cur ? h('span', { class: 'cf-muted' }, ' · ' + t('totNow')) : null),
        h('td', { class: r.risky ? 'cf-bad' : null, translate: 'no' }, num(r.risky)),
        h('td', { class: r.health === 'HEALTH_OK' ? null : 'cf-bad', translate: 'no' }, r.health)
      ];
      if (lost) {
        tds.push(h('td', { class: stopped(r.after) ? 'cf-bad' : null, translate: 'no' }, num(stopped(r.after))),
          h('td', { translate: 'no' }, num(r.after.degraded)), h('td', { translate: 'no' }, num(r.after.clean)));
      }
      return h('tr', { class: cur ? 'cf-cur' : null }, tds);
    });
    return h('div', { class: 'cf-card' },
      h('h3', null, t(lost ? 'totTitle' : 'totTitleNone')),
      lost ? h('div', { class: 'cf-muted' }, t('totAfter', { r: lost })) : null,
      h('table', { class: 'cf-cmp' }, h('thead', null, h('tr', null, headRow)), h('tbody', null, rows)));
  }

  /** The copies of the twelve sample PGs: a row per PG, a cell per copy (its host, coloured by rack), grouped by rack;
      a rack holding too many of them outlined (a span) with "!" in the aside; copies in the lost rack crossed; holes
      dashed. The aside gives the state after a loss. */
  function strip(c) {
    var s = c.state, p = P(s), ev = s.ev;
    var riskNow = !!(ev && (ev.kind === 'risk' || (ev.kind === 'totals' && !ev.lost)));
    var rows = s.sample.map(function (pg) {
      var id = L.pgId(s.pool, pg);
      if (!s.placed) {
        var empty = [];
        for (var k = 0; k < p.width; k++) empty.push({ kind: 'ghost' });
        return { id: 'pg' + pg, label: id, cells: empty, aside: '' };
      }
      var order = L.drawOrder(s.pool, s.rule, pg);
      var cells = order.map(function (x) {
        if (!x) return { kind: 'ghost', text: 'NONE' };
        var down = s.down.indexOf(x.osd) >= 0;
        return { text: hostLabel(x.host), kind: down ? 'dead' : 'fill', c: C_RACK[x.rack - 1] };
      });
      var spans = [], risky = s.risk ? L.riskRacks(s.pool, s.rule, pg) : [];
      risky.forEach(function (r) {
        var from = -1, len = 0;
        order.forEach(function (x, k) { if (x && x.rack === r) { if (from < 0) from = k; len += 1; } });
        spans.push({ from: from, len: len, now: riskNow });
      });
      var g = L.groupOf(s, pg);
      var showState = s.lostRack !== null || g !== 'clean';
      var changed = !!(ev && ev.kind === 'lose' && ev.changed.indexOf(pg) >= 0);
      var aside = h('span', null,
        risky.length ? h('span', { class: 'cf-bang', translate: 'no' }, '! rack' + risky.join(',')) : null,
        showState ? h('span', { class: 'cf-st cf-st-' + g + (changed ? ' cf-now' : '') }, icon(g), ' ', t('g_' + g)) : null);
      return { id: 'pg' + pg, label: id, cells: cells, spans: spans, aside: aside };
    });
    return Simdeck.blockGrid({
      dir: c.dir,
      className: 'cf-strip',
      title: t(s.pool === 'ec' ? 'stripTitleEc' : 'stripTitle', { k: s.sample.length }),
      meta: [t(s.pool === 'ec' ? 'stripMetaEc' : 'stripMeta')],
      cols: p.width,
      cellHeight: '1.4rem',
      rows: rows
    });
  }

  /** Every PG of the pool as one small square by state, drawn in the page (K3 is made for a few rows of up to ~40
      cells; NOTES.md "Shared requests"): clean solid, degraded hatched, inactive a hollow --danger frame, no copy grey
      with a diagonal; before a loss, a PG one rack can stop has an ink bar under it once the risk is shown. */
  function allGrid(c) {
    var s = c.state, p = P(s);
    var perRow = p.pgNum > 1024 ? 64 : 32;
    var px = [];
    for (var pg = 0; pg < p.pgNum; pg++) {
      var ds = s.placed ? { g: s.pgs[pg] } : {};
      if (s.placed && s.risk && s.lostRack === null && L.riskRacks(s.pool, s.rule, pg).length) ds.risk = 'true';   // after a loss the frames say it
      px.push(h('i', { class: 'cf-px', dataset: ds }));
    }
    return h('div', { class: 'sd-bg cf-allbox' },
      h('div', { class: 'cf-allhead' }, h('b', null, t('allTitle', { n: num(p.pgNum) })), ' ', h('span', { class: 'cf-muted' }, t('allMeta'))),
      h('div', { class: 'cf-map', style: { '--per': String(perRow) }, role: 'img', 'aria-label': t('allTitle', { n: num(p.pgNum) }) }, px),
      s.counts ? h('div', { class: 'cf-counts' }, L.GROUPS.map(function (g) {
        return h('span', { class: 'cf-st cf-st-' + g }, h('i', { class: 'cf-px cf-px-key', dataset: { g: g[0] } }), ' ', t.n('cnt_' + g, s.counts[g], { c: num(s.counts[g]) }));
      })) : null);
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'cf' },
      h('div', { class: 'cf-col' }, head(c), rule(c), tree(c), totalsCard(c)),
      h('div', { class: 'cf-col' }, c.params.showAll ? allGrid(c) : strip(c))));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, ev = s.ev, p = P(s), o = L.norm(c.params);
    var N = data(num(p.pgNum)), out = [];
    var add = function (parts) { out = out.concat(out.length ? [' '].concat(parts) : parts); };
    if (!ev) return rich(s.pool === 'ec' ? 'capStartEc' : 'capStart', { pool: data(p.name), n: N });

    function placeCap() {
      if (ev.switched) add(rich(ev.back ? 'capSwitchBack' : 'capSwitch', { a: c.prev.rule, b: s.rule, r: data(ev.back) }));
      add(rich(s.pool === 'ec' ? (s.rule === 'host' ? 'capPlaceEcHost' : 'capPlaceEcRack') : (s.rule === 'host' ? 'capPlaceHost' : 'capPlaceRack')));
    }
    function riskCap() {
      var v = { n: data(num(s.risky)), all: N, p: data(pct(s.risky, p.pgNum)) };
      add(rich(s.pool === 'ec' ? (s.rule === 'host' ? 'capRiskEcHost' : 'capRiskEcRack') : (s.rule === 'host' ? 'capRiskHost' : 'capRiskRack'), v));
    }

    if (ev.kind === 'place') {
      placeCap();
      if (s.health === 'HEALTH_OK') add(rich('capHealthOk', { n: N }));
      return out;
    }
    if (ev.kind === 'risk') {
      if (ev.placedNow) placeCap();
      riskCap();
      return out;
    }
    if (ev.kind === 'lose') {
      var R = data(ev.rack), before = c.prev.counts;
      add(rich('capLose', { r: R, c: data(num(ev.hit)) }, ev.hit));
      if (stopped(before) === p.pgNum) { add(rich('capLoseWasDown')); return out; }
      var stop = stopped(s.counts);
      if (stop) add(rich('capLoseStop', { c: data(num(stop)), m: data(p.minSize) }, stop));
      if (s.counts.stale) add(rich('capLoseStale', { c: data(num(s.counts.stale)), r: R }, s.counts.stale));
      if (s.counts.degraded) add(rich('capLoseDegraded', { c: data(num(s.counts.degraded)) }, s.counts.degraded));
      if (s.counts.clean) add(rich('capLoseClean', { c: data(num(s.counts.clean)) }, s.counts.clean));
      if (ev.alt) add(rich('capLoseEcAlt', { m: data(ev.alt.minSize), n: data(num(ev.alt.inactive)) }));
      else if (s.rule === 'host') add(rich('capLoseHost'));
      else add(rich(o.compare && o.rule === 'host' ? 'capLoseRack' : 'capLoseRackPlain'));   // "one word changed" only after the host run
      return out;
    }
    // totals
    var host = ev.totals[0], rack = ev.totals[1];
    if (ev.lost) {
      add(rich('capTotals', { a: data(num(stopped(host.after))), b: data(num(stopped(rack.after))) }));
      if (host.health === 'HEALTH_OK' && rack.health === 'HEALTH_OK') add(rich('capTotalsOk'));
      else if (stopped(rack.before) === p.pgNum) add(rich('capTotalsEcRack'));
    } else if (s.pool === 'ec') add(rich('capTotalsNoneEc', { n: N, a: data(num(host.risky)) }));
    else add(rich('capTotalsNone', { n: N, a: data(num(host.risky)), b: data(num(rack.risky)) }));
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'pool', type: 'choice', label: t('pool'), options: [['rbd', t('poolRbd')], ['ec', t('poolEc')]], resets: true },
      { key: 'rule', type: 'choice', label: t('rule'), options: [['host', 'host'], ['rack', 'rack']], resets: true },
      { key: 'lostRack', type: 'choice', label: t('lostRack'), options: [['none', t('lostNone')], [1, '1'], [2, '2'], [3, '3']], resets: true },
      { key: 'compare', type: 'toggle', label: t('compare'), resets: true },
      { key: 'showAll', type: 'toggle', label: t('showAll') }
    ],

    presets: [
      { id: 'by-host-lose-rack', label: t('pHost'), params: { lostRack: 1 }, hint: t('pHostHint') },
      { id: 'by-rack-lose-rack', label: t('pRack'), params: { rule: 'rack', lostRack: 1 }, hint: t('pRackHint') },
      { id: 'before-the-loss', label: t('pBefore'), params: { compare: true }, hint: t('pBeforeHint') },
      { id: 'ec-by-host', label: t('pEc'), params: { pool: 'ec', lostRack: 1 }, hint: t('pEcHint') },
      { id: 'host-then-rack', label: t('pBoth'), params: { compare: true, lostRack: 1 }, hint: t('pBothHint') }
    ],

    legend: [
      { shape: 'hl', label: t('legChanged') },
      { shape: 'bg-fill', c: C_RACK[0], label: t('legCopy') },
      { shape: 'bg-span', label: t('legRisk') },
      { shape: 'bg-dead', label: t('legLostCopy') },
      { shape: 'bg-ghost', label: t('legHole') },
      { shape: 'bg-fill', c: C_CLEAN, label: t('legClean') },
      { shape: 'bg-soft', c: C_DEG, label: t('legDegraded') },
      { shape: 'bg-bad', label: t('legInactive') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
