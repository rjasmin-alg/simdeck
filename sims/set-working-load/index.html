<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var NS = 'http://www.w3.org/2000/svg';
  var G = L.rigging.G;
  var VW = 600, VH = 560;   // the side view's viewBox
  var PIPE = 46;            // the pipe's centre, y
  var FLOOR = 520;          // the floor, y
  var LEN = 250;            // a line's drawn length (about 1.2 m)
  var CM = 2.2;             // SVG units per centimetre of drop
  var CX = 300;             // the lamp's x

  /** Numbers in the page's language: a decimal comma in Croatian; trailing zeros dropped when trim. */
  function num(x, d, trim) {
    var s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
    if (trim && s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  /** A force as kilograms of pull: one decimal under 100 kg, whole above. */
  function kgf(n) { var k = n / G; return num(k, k < 100 ? 1 : 0, true); }
  function times(x) { return num(x, x < 10 ? 1 : 0, true); }
  function pieceName(id) { return t('piece_' + id); }

  function el(parent, name, attrs) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    parent.appendChild(e);
    return e;
  }
  function tag(x, y, text, cls, state) {
    var a = { class: 'wl-tag' + (cls ? ' ' + cls : ''), style: { left: (100 * x / VW) + '%', top: (100 * y / VH) + '%' } };
    if (state) a.dataset = { state: state };
    return h('span', a, text);
  }

  // ── the side view ──

  /** Where each line runs: from its anchor on the pipe to the hook on top of the lamp. */
  function geometry(s) {
    var a = s.angle * Math.PI / 360;
    var hookY = PIPE + LEN * Math.cos(a);
    var dx = Math.max(LEN * Math.sin(a), 10);   // two lines at 0° drawn just apart, so both show
    var anchors = s.n > 1 ? [CX - dx, CX + dx] : [CX];
    return { hookY: hookY, anchors: anchors };
  }

  /** Where a broken line is cut, as a share of its length from the pipe: at its weakest piece (the clamp at the top,
   *  the sling halfway, the shackle or hook at the lamp). */
  function cutAt(l) { return [0.08, 0.45, 0.9][l.weakest]; }

  function drawLamp(g, x, y) {
    el(g, 'path', { d: 'M' + (x - 16) + ' ' + (y + 22) + 'Q' + x + ' ' + (y - 6) + ' ' + (x + 16) + ' ' + (y + 22), class: 'sv-bail' });
    el(g, 'rect', { x: x - 34, y: y + 20, width: 68, height: 52, rx: 7, class: 'sv-lamp' });
    el(g, 'circle', { cx: x, cy: y + 62, r: 12, class: 'sv-lens' });
  }

  function sideView(s, geo) {
    var v = document.createElementNS(NS, 'svg');
    v.setAttribute('viewBox', '0 0 ' + VW + ' ' + VH);
    v.setAttribute('aria-hidden', 'true');
    // the pipe of the grid
    el(v, 'rect', { x: 10, y: PIPE - 10, width: VW - 20, height: 20, rx: 10, class: 'sv-pipe' });
    // the floor and the zone below the lamp
    el(v, 'rect', { x: CX - 120, y: FLOOR - 26, width: 240, height: 26, class: 'sv-zone' });
    el(v, 'line', { x1: 0, y1: FLOOR, x2: VW, y2: FLOOR, class: 'sv-floor' });
    for (var x = 10; x < VW; x += 26) el(v, 'line', { x1: x, y1: FLOOR + 4, x2: x - 14, y2: FLOOR + 20, class: 'sv-hatch' });
    // a crew member walking around the zone
    var px = CX + 200, py = FLOOR - 4;
    el(v, 'circle', { cx: px, cy: py - 96, r: 11, class: 'sv-personhead' });
    el(v, 'path', { d: 'M' + px + ' ' + (py - 84) + 'v44 M' + px + ' ' + (py - 40) + 'l-14 40 M' + px + ' ' + (py - 40) + 'l14 40 M' + px + ' ' + (py - 72) + 'l-16 22 M' + px + ' ' + (py - 72) + 'l16 22', class: 'sv-person' });
    el(v, 'path', { d: 'M' + (px - 30) + ' ' + (FLOOR - 112) + 'Q' + CX + ' ' + (FLOOR - 190) + ' ' + (CX - 170) + ' ' + (FLOOR - 70), class: 'sv-path' });
    el(v, 'path', { d: 'M' + (CX - 176) + ' ' + (FLOOR - 52) + 'l-6 -26 22 10z', class: 'sv-pathtip' });

    var hook = geo.hookY, drop = s.params.drop;
    // the lamp's outline where it was before it dropped, and the arrow of the drop
    if (drop > 0 && !s.falls) {
      var gy = hook - drop * CM;
      drawLamp(el(v, 'g', { class: 'sv-ghost' }), CX, gy);
      el(v, 'line', { x1: CX - 62, y1: gy + 30, x2: CX - 62, y2: hook + 22, class: 'sv-droparrow' });
      el(v, 'path', { d: 'M' + (CX - 62) + ' ' + (hook + 36) + 'l-9 -16h18z', class: 'sv-droptip' });
    }
    // the lines, a clamp at the pipe and a shackle at the hook; the weakest piece of each line outlined
    s.lines.forEach(function (l, i) {
      var ax = geo.anchors[i];
      var g = el(v, 'g', {});
      if (l.state === 'breaks') {
        // cut halfway: the top half hangs from the clamp, the rest is gone with the lamp
        var cut = cutAt(l), mx = ax + (CX - ax) * cut, my = PIPE + (hook - PIPE) * cut;
        el(g, 'line', { x1: ax, y1: PIPE, x2: mx, y2: my, class: 'sv-line', 'data-state': 'breaks' });
      } else if (s.falls) {
        el(g, 'line', { x1: ax, y1: PIPE, x2: ax, y2: PIPE + LEN * 0.55, class: 'sv-line' });
      } else {
        el(g, 'line', { x1: ax, y1: PIPE, x2: CX, y2: hook, class: 'sv-line', 'data-state': l.state });
      }
      el(g, 'rect', { x: ax - 15, y: PIPE - 18, width: 30, height: 36, rx: 5, class: 'sv-clamp' });
      var sx = s.falls ? (l.state === 'breaks' ? null : ax) : CX + (ax - CX) * 0.1;
      var sy = s.falls ? PIPE + LEN * 0.55 : hook - (hook - PIPE) * 0.1;
      if (sx !== null) el(g, 'ellipse', { cx: sx, cy: sy, rx: 7, ry: 11, class: 'sv-shackle' });
      // the weakest piece: a dashed ring around it
      var wid = l.pieces[l.weakest].id;
      if (wid === 'clamp') el(g, 'rect', { x: ax - 23, y: PIPE - 26, width: 46, height: 52, rx: 8, class: 'sv-weak' });
      else if (wid === 'sling' || wid === 'wornSling') {
        var cx = ax + (CX - ax) * 0.3, cy = PIPE + (hook - PIPE) * 0.3;
        if (!s.falls || l.state === 'breaks') el(g, 'circle', { cx: cx, cy: cy, r: 18, class: 'sv-weak' });
      } else if (sx !== null) el(g, 'circle', { cx: sx, cy: sy, r: 19, class: 'sv-weak' });
      else el(g, 'circle', { cx: ax + (CX - ax) * cutAt(l), cy: PIPE + (hook - PIPE) * cutAt(l), r: 19, class: 'sv-weak' });
    });
    // the lamp: hanging, or on the floor in the zone, tipped over
    if (s.falls) {
      var fl = el(v, 'g', { transform: 'rotate(-24 ' + CX + ' ' + (FLOOR - 40) + ')' });
      drawLamp(fl, CX, FLOOR - 76);
    } else drawLamp(el(v, 'g', {}), CX, hook);
    return v;
  }

  function stageFigure(s) {
    var geo = geometry(s), kids = [sideView(s, geo)];
    s.lines.forEach(function (l, i) {
      var ax = geo.anchors[i];
      var mx = ax + (CX - ax) * 0.55, my = PIPE + (geo.hookY - PIPE) * 0.55;
      if (s.n > 1) { mx += (i === 0 ? -1 : 1) * 55; my += 32; }
      else mx += 100;
      if (s.falls && l.state !== 'breaks') return;   // what the other line takes after one breaks is not modelled
      kids.push(tag(Math.max(60, Math.min(VW - 60, mx)), my, (s.n > 1 ? l.id + ' · ' : '') + t('kg', { v: kgf(l.force) }), null, l.state));
    });
    if (s.params.drop > 0 && !s.falls) kids.push(tag(CX - 112, geo.hookY - s.params.drop * CM / 2 + 26, t('dropMark', { d: s.params.drop }), 'wl-plain'));
    kids.push(tag(CX, FLOOR + 20, t('zone'), 'wl-zonetag'));
    kids.push(tag(CX + 200, FLOOR - 130, t('around'), 'wl-plain'));
    return h('div', { class: 'wl-stagebox' }, h('div', { class: 'wl-fig' }, kids));
  }

  // ── one card per line ──

  function lineCard(s, l, scaleKg) {
    var pct = function (n) { return Math.min(100, 100 * (n / G) / scaleKg) + '%'; };
    var over = l.state !== 'ok';
    var kids = [h('div', { class: 'wl-fill sd-fill' + (over ? ' sd-hatch' : ''), dataset: { c: over ? '5' : '1' }, style: { width: pct(l.force) } })];
    if (l.wll !== null) {
      kids.push(h('div', { class: 'wl-wll', style: { left: pct(l.wll) } }));
      var low = (l.wll / G) / scaleKg < 0.15;   // too near the start for the label to sit left of its mark
      kids.push(h('span', { class: 'wl-tick wl-at-wll' + (low ? ' wl-flip' : ''), style: { left: pct(l.wll) } }, t('barWll', { v: kgf(l.wll) })));
    }
    kids.push(h('div', { class: 'wl-brk', style: { left: pct(l.breaking) } }));
    var flip = (l.breaking / G) / scaleKg > 0.7;
    kids.push(h('span', { class: 'wl-tick wl-at-brk' + (flip ? ' wl-flip' : ''), style: { left: pct(l.breaking) } }, t('barBreaks', { v: kgf(l.breaking) })));
    var chain = l.pieces.map(function (p, i) {
      var weak = i === l.weakest;
      return h('li', weak ? { dataset: { weak: '' } } : null,
        h('span', null, pieceName(p.id)),
        h('span', null, p.wll === null ? t('pieceNoWll') : t('pieceWll', { v: kgf(p.wll) })),
        h('span', null, t('pieceBreaks', { v: kgf(p.breaking) })),
        h('span', { class: 'wl-weakmark' }, weak ? '◀ ' + t('weakest') : ''));
    });
    var share = l.share === null ? t('shareNone') : t('share', { pct: num(100 * l.share, 0) });
    var margin = l.state === 'breaks' ? t('marginGone') : t('margin', { x: times(l.margin) });
    return h('section', { class: 'wl-card', 'aria-label': t('lineName', { id: l.id }) },
      h('div', { class: 'wl-row' },
        h('span', { class: 'wl-name' }, t('lineName', { id: l.id })),
        h('span', { class: 'wl-num wl-big' }, t('kgN', { kg: kgf(l.force), n: num(l.force, 0) })),
        h('span', { class: 'wl-chip', dataset: { state: l.state } }, t('state_' + l.state))),
      h('div', { class: 'wl-row wl-small' }, h('span', null, share), h('span', null, margin)),
      h('div', { class: 'wl-bar', role: 'img', 'aria-label': t('kgN', { kg: kgf(l.force), n: num(l.force, 0) }) + ', ' + share }, kids),
      h('ul', { class: 'wl-chain' }, chain));
  }

  function readouts(s) {
    var d = s.params.drop;
    return h('section', { class: 'wl-card wl-reads' },
      h('div', { class: 'wl-read' }, h('span', null, t('readLamp')), h('span', { class: 'wl-num' }, t('kgN', { kg: num(s.lamp.m, 0), n: num(s.w, 0) }))),
      h('div', { class: 'wl-read' }, h('span', null, t('readRest')), h('span', { class: 'wl-num' }, t('kg', { v: kgf(s.tStatic) }))),
      h('div', { class: 'wl-read' }, h('span', null, t('readCatch')),
        h('span', { class: 'wl-num' }, t('readFactor', { f: d > 0 ? num(s.factor, 1) : '1' })),
        h('span', { class: 'wl-small' }, d > 0 ? t('readCatchDrop', { d: d, mm: num(s.stopIn * 1000, 0) }) : t('readCatchRest', { mm: num(s.stretch * 1000, 1) }))));
  }

  // ── caption (SPEC.md "Legend and captions") ──

  function angleNote(s) {
    var w = num(s.lamp.m, 0);
    if (s.angle === 0) return t('capAngleStraight', { w: w });
    if (s.angle < 120) return t('capAngleHalf', { a: s.angle, w: w });
    if (s.angle === 120) return t('capAngle120');
    return t('capAngleMore', { a: s.angle, w: w });
  }

  function caption(s) {
    var p = s.params, out = [], A = s.lines[0];
    var drop = function () { return t('capCauseDrop', { d: p.drop, mm: num(s.stopIn * 1000, 0), x: num(s.factor, 1) }); };
    if (s.falls) {
      var l = s.lines.filter(function (x) { return x.state === 'breaks'; })[0];
      var wid = l.pieces[l.weakest].id;
      out.push(t('capBreaks', { id: l.id, f: kgf(l.force), piece: pieceName(wid), b: kgf(l.breaking) }));
      if (wid === 'wornSling') out.push(t('capCauseWorn'));
      else if (wid === 'smallShackle') out.push(t('capCauseSmall'));
      else if (wid === 'hook') out.push(t('capCauseHook'));
      else if (p.drop > 0) out.push(drop());
      else if (s.n > 1) out.push(angleNote(s));
    } else if (A.state === 'unrated') {
      out.push(t('capUnrated', { f: kgf(A.force), b: kgf(A.breaking) }));
      if (p.drop > 0) out.push(drop());
    } else if (A.state === 'over') {
      out.push(t('capOver', { f: kgf(A.force), wll: kgf(A.wll), pct: num(100 * A.share, 0) }));
      if (p.drop > 0) out.push(drop());
      else if (s.n > 1) out.push(angleNote(s));
      out.push(t(p.drop > 0 ? 'capOverHeld' : 'capOverHeldPull', { b: kgf(A.breaking) }));
    } else {
      out.push(t(s.n > 1 ? 'capOkTwo' : 'capOk', { f: kgf(A.force), pct: num(100 * A.share, 0), b: kgf(A.breaking), m: times(A.margin) }));
      if (p.drop > 0) out.push(drop());
      else if (s.n > 1) out.push(angleNote(s));
    }
    return out.join(' ');
  }

  var params = [
    { key: 'lamp', type: 'select', label: t('lamp'), options: L.LAMP_IDS.map(function (x) { return [x, t('lamp_' + x)]; }) },
    { key: 'lines', type: 'choice', label: t('lines'), options: [['one', t('lines_one')], ['two', t('lines_two')]] },
    { key: 'angle', type: 'range', label: t('angle'), min: L.RANGES.angle.min, max: L.RANGES.angle.max, step: L.RANGES.angle.step,
      format: function (v) { return v + '°'; }, visible: function (p) { return p.lines === 'two'; } },
    { key: 'drop', type: 'range', label: t('drop'), min: L.RANGES.drop.min, max: L.RANGES.drop.max, step: L.RANGES.drop.step,
      format: function (v) { return v + ' cm'; } },
    { key: 'link', type: 'select', label: t('link'), options: L.LINK_IDS.map(function (x) { return [x, t('link_' + x)]; }) }
  ];

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'wl-line', label: t('legLine') },
      { shape: 'wl-weak', label: t('legWeak') },
      { shape: 'wl-wll', label: t('legWll') },
      { shape: 'wl-brk', label: t('legBreak') },
      { shape: 'wl-over', label: t('legOver') },
      { shape: 'wl-broken', label: t('legBroken') },
      { shape: 'wl-drop', label: t('legDrop') },
      { shape: 'wl-zone', label: t('legZone') }
    ],
    render: function (c) {
      var s = c.state;
      var worst = s.falls ? 'breaks' : s.lines.some(function (l) { return l.state === 'unrated'; }) ? 'unrated'
        : s.lines.some(function (l) { return l.state === 'over'; }) ? 'over' : 'ok';
      var scaleKg = 1.08 * Math.max(500, s.tPeak / G);
      c.stage.replaceChildren(h('div', { class: 'wl' },
        h('p', { class: 'wl-top' }, h('span', { class: 'wl-formula', translate: 'no' }, t('formula'))),
        h('div', { class: 'wl-body' },
          h('div', { class: 'wl-side' },
            h('div', { class: 'wl-sidehead' },
              h('span', { class: 'wl-small' }, t('view')),
              h('span', { class: 'wl-verdict', dataset: { state: worst } }, t('state_' + worst))),
            stageFigure(s)),
          h('div', { class: 'wl-right' },
            s.lines.map(function (l) { return lineCard(s, l, scaleKg); }),
            readouts(s))),
        h('p', { class: 'wl-foot' }, t('foot'))));
    },
    caption: function (c) { return caption(c.state); }
  });
})();
</script>
</body>
</html>
