<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var N = L.nodes, NET = L.net;

  /** Series colour per node: the packet's chip and the table's subject take the opener's colour. */
  var COLOUR = { A: 1, B: 2, S: 3, R: 8, K: 5, W: 6 };

  function sock(e) { return e.ip + ':' + e.port; }
  function data(text) { return h('span', { translate: 'no', class: 'pf-addr' }, text); }
  function bold(text) { return h('b', { translate: 'no' }, text); }
  function proto(p) { return p.toUpperCase(); }
  function fwdText(f) { return proto(f.proto) + ' ' + f.extPort + ' → ' + sock(f.to); }

  var presets = [
    { id: 'book-no-forward', label: t('presetBook'), hint: t('presetBookHint'), params: { scene: 'book', forward: false, proto: 'tcp', extPort: '61050', hairpin: false } },
    { id: 'add-forward', label: t('presetAdd'), hint: t('presetAddHint'), params: { scene: 'outside', forward: true, proto: 'tcp', extPort: '8080', hairpin: false } },
    { id: 'reply-vs-forward', label: t('presetMixed'), hint: t('presetMixedHint'), params: { scene: 'mixed', forward: true, proto: 'tcp', extPort: '8080', hairpin: false } },
    { id: 'wrong-proto', label: t('presetProto'), hint: t('presetProtoHint'), params: { scene: 'outside', forward: true, proto: 'udp', extPort: '8080', hairpin: false } },
    { id: 'hairpin', label: t('presetHairpin'), hint: t('presetHairpinHint'), params: { scene: 'inside', forward: true, proto: 'tcp', extPort: '8080', hairpin: false } }
  ];

  /** The opener of the packet R is deciding on: whoever handed it to R. */
  function subjectOf(hop) { return hop.drop === 'R' ? hop.from : hop.came; }

  /** The network: A, B and S on the LAN bus with R; K and W on their own links to R. Five columns with wide gaps
      (room for the chip between R and K), so the packet card and the forwards table fit under the LAN, left of the
      link to W. */
  function drawing(c) {
    var s = c.state, hop = s.hop;
    function badges(id) {
      if (!hop) return [];
      if (hop.drop === id) return [{ text: t('badgeDrop'), k: 'dashed' }];
      if (hop.from === id) return [{ text: id === 'R' ? t('badgeTranslate') : t('badgeSend'), k: 'fill' }];
      if (hop.to === id) return [{ text: t('badgeRecv'), k: 'solid' }];
      return [];
    }
    function node(id, col, row, kind, name, lines) {
      return { id: id, kind: kind, col: col, row: row, c: COLOUR[id], name: name, lines: lines, badges: badges(id),
        state: hop && (hop.from === id || hop.drop === id) ? 'active' : null };
    }
    var r = node('R', 3, 0, 'router', t('router'), []);
    r.extra = h('div', { class: 'pf-r' },
      h('span', null, t('rIn')), data(N.R.ip),
      h('span', null, t('rOut')), data(NET.outside));
    var packets = [];
    if (hop) {
      packets.push({ from: hop.from, to: hop.to, label: proto(hop.pkt.proto), c: COLOUR[hop.opener], drop: !!hop.drop, at: 0.5 });
    }
    var topo = Simdeck.topology({
      cols: 5, rows: ['auto', '3.4rem', 'auto'], dir: c.dir, gap: '5.5cqw',
      nodes: [
        node('A', 0, 0, 'host', t('host'), [N.A.ip]),
        node('B', 1, 0, 'host', t('host'), [N.B.ip]),
        node('S', 2, 0, 'host', t('server'), [N.S.ip, { text: ':80', kind: 'sub' }]),
        r,
        node('K', 4, 0, 'host', t('client'), [N.K.ip]),
        node('W', 4, 2, 'host', t('web'), [N.W.ip, { text: ':' + L.web.port, kind: 'sub' }])
      ],
      links: [{ id: 'lan', bus: ['A', 'B', 'S', 'R'], row: 1 }, { id: 'rk', a: 'R', b: 'K' }, { id: 'rw', a: 'R', b: 'W' }],
      packets: packets
    });
    topo.append(h('div', { class: 'pf-slot' }, packetCard(c), forwardsTable(c)));
    return topo;
  }

  /** The packet on the wire in this step: protocol, source, destination; a field R rewrote keeps its old value. */
  function packetCard(c) {
    var s = c.state, hop = s.hop, kids = [h('h2', null, t('hdrTitle'))];
    if (!hop) kids.push(h('p', { class: 'pf-none' }, t('hdrNone')));
    else {
      var field = function (k) {
        var now = sock(hop.pkt[k]), was = hop.was ? sock(hop.was[k]) : now;
        if (was === now) return [now, null];
        return [h('span', null, data(now), h('span', { class: 'pf-was' }, t('was'), ' ', h('s', { translate: 'no' }, was))), { changed: true }];
      };
      var src = field('src'), dst = field('dst');
      kids.push(Simdeck.topology.headers([{ title: t('hdrLayer', { proto: proto(hop.pkt.proto) }), c: COLOUR[hop.opener],
        fields: [[t('fSrc'), src[0], src[1]], [t('fDst'), dst[0], dst[1]]] }], c.dir));
    }
    kids.push(h('div', { class: 'pf-side' },
      hop && hop.drop ? h('span', { class: 'pf-drop' }, t('hdrDropped')) : null,
      h('p', { class: 'pf-next' }, s.next ? t.parts('nextHop', { from: bold(s.next.from), to: bold(s.next.to) }) : t('lastHop'))));
    return h('section', { class: 'pf-box pf-pkt' }, kids);
  }

  function marker(k) { return h('span', { class: 'pf-mk', dataset: { k: k }, 'aria-hidden': 'true' }); }

  /** R's two tables as K4 rule tables, read in order: rows of known connections, then forwards, then drop. */
  function subjectChip(hop) { return hop && hop.decision ? { mark: subjectOf(hop), c: COLOUR[subjectOf(hop)] } : null; }

  function translationTable(c) {
    var s = c.state, hop = s.hop, d = hop && hop.decision;
    var inbound = d ? (hop.was || hop.pkt).dst.ip === NET.outside : true;
    var subject = subjectChip(hop);

    var trRows = s.table.map(function (r, i) {
      var v = L.viewOf(r), cmp = d && d.compare[i];
      var isNew = d && (d.rule === 'new' || d.rule === 'forward') && i === d.row;
      return {
        no: [String(i + 1), marker(r.by === 'out' ? 'out' : 'fwd')],
        cells: {
          proto: proto(r.proto),
          inside: sock(v.inside),
          outside: sock(v.outside),
          remote: v.as ? h('span', null, data(sock(v.remote)), h('span', { class: 'pf-as' }, t('asNote', { as: '' }), data(sock(v.as)))) : sock(v.remote)
        },
        action: '',
        hit: cmp ? cmp.hit : null,
        miss: cmp && !cmp.hit ? cmp.miss : [],
        tags: isNew ? [{ k: 'hl', text: t('tagNew') }] : null
      };
    });
    var trAt = -1, trOut = null;
    if (d) {
      if (d.rule === 'row') { trAt = d.row; trOut = Simdeck.ruleTable.verdict(true, t('outRow')); }
      else { trAt = trRows.length; trOut = d.rule === 'new' ? Simdeck.ruleTable.verdict(true, t('outNew')) : h('span', null, t('outNext')); }
    }
    return Simdeck.ruleTable({
      dir: c.dir, mode: 'first', title: h('span', null, t('tableTr'), ' · ', t('rNext'), data(String(s.nextPort))), stickyMark: true,
      columns: [{ key: 'proto', label: t('colProto') }, { key: 'inside', label: t('colInside') }, { key: 'outside', label: t('colOutside') }, { key: 'remote', label: t('colRemote') }],
      actionLabel: '', markLabel: t('colMark'),
      rows: trRows,
      implicit: { text: t('impTr'), action: h('span', null, t(inbound ? 'impTrIn' : 'impTrOut')) },
      at: trAt, subject: subject, done: !!d, outcome: function () { return trOut; },
      words: { skip: t('markSkip') }
    });
  }

  function forwardsTable(c) {
    var s = c.state, hop = s.hop, d = hop && hop.decision;
    var read = d && d.fwdCompare;
    var fwRows = s.forwards.map(function (f, i) {
      var cmp = read && d.fwdCompare[i];
      return {
        no: [String(i + 1), marker('fwd')],
        cells: { proto: proto(f.proto), extPort: String(f.extPort) },
        action: sock(f.to),
        hit: cmp ? cmp.hit : null,
        miss: cmp && !cmp.hit ? cmp.miss : [],
        mark: d && !read ? 'skip' : null
      };
    });
    var fwAt = -1;
    if (read) fwAt = d.rule === 'forward' ? d.fwd : fwRows.length;
    return Simdeck.ruleTable({
      dir: c.dir, mode: 'first', title: t('tableFw'), className: 'pf-fw',
      columns: [{ key: 'proto', label: t('colProto') }, { key: 'extPort', label: t('colExt') }],
      actionLabel: t('colTo'), markLabel: t('colMark'),
      rows: fwRows,
      implicit: { text: t('impFw'), action: h('span', null, t('impFwAct')), effect: 'deny' },
      at: fwAt, subject: read ? subjectChip(hop) : null, done: !!read,
      outcome: function (i) { return Simdeck.ruleTable.verdict(i < fwRows.length, t(i < fwRows.length ? 'outFwd' : 'outDrop')); },
      words: { skip: t('markSkip') }
    });
  }

  /** The caption of one hop. */
  function hopCaption(c) {
    var s = c.state;
    var hop = s.hop, d = hop.decision, pkt = hop.pkt, who = bold(hop.from);
    var f = s.forwards[0] ? bold(fwdText(s.forwards[0])) : null;
    var out = [t('stepN', { n: c.n })];
    var add = function (parts) { out = out.concat(parts); };
    if (hop.drop === 'R') {
      var near = d.compare.filter(function (x) { return x.miss.length === 1 && x.miss[0] === 'remote'; })[0];
      var nearRow = near ? d.compare.indexOf(near) : -1;
      var sameProto = s.forwards.some(function (g) { return g.extPort === pkt.dst.port && g.proto !== pkt.proto; });
      if (nearRow >= 0) {
        var v = L.viewOf(s.table[nearRow]);
        add(t.parts('captionDropRemote', { row: bold(String(nearRow + 1)), dst: bold(sock(pkt.dst)), remote: bold(sock(v.remote)), src: bold(sock(pkt.src)) }));
      } else if (sameProto) add(t.parts('captionDropProto', { f: f, proto: bold(proto(pkt.proto)), dst: bold(sock(pkt.dst)) }));
      else add(t.parts('captionDrop', { dst: bold(sock(pkt.dst)) }));
      return out;
    }
    if (hop.drop) {
      add(t.parts('captionUnexpected', { dst: bold(pkt.dst.ip), called: bold(sock(hop.called)), src: bold(sock(pkt.src)) }));
      return out;
    }
    if (hop.from !== 'R') {
      add(t.parts(hop.answer ? 'captionAnswer' : 'captionSend', { who: who, src: bold(sock(pkt.src)), dst: bold(sock(pkt.dst)) }));
      if (hop.to !== 'R') add([' ', t.parts('captionReached', { who: bold(hop.to) })]);
      return out;
    }
    var was = hop.was;
    if (d.rule === 'new') {
      add(t.parts('captionNew', { from: bold(sock(was.src)), to: bold(sock(pkt.src)) }));
      var outRows = s.table.filter(function (r) { return r.by === 'out'; });
      if (outRows.length === 2 && outRows[0].orig.src.port === outRows[1].orig.src.port) add([' ', h('span', { class: 'sd-hl' }, t.parts('captionSamePort', { port: bold(String(L.srcPort)) }))]);
    } else if (d.rule === 'forward') {
      if (hop.came === 'K' || N[hop.came].side === 'out') add(t.parts('captionForward', { f: f, src: bold(sock(pkt.src)) }));
      else if (sock(pkt.src) === sock(was.src)) add(t.parts('captionForwardLan', { f: f, src: bold(sock(pkt.src)) }));
      else add(t.parts('captionForwardLoop', { f: f, from: bold(sock(was.src)), to: bold(sock(pkt.src)) }));
    } else {
      var srcChanged = sock(pkt.src) !== sock(was.src), dstChanged = sock(pkt.dst) !== sock(was.dst), row = bold(String(d.row + 1));
      if (srcChanged && dstChanged) add(t.parts('captionRowBoth', { row: row, src: bold(sock(pkt.src)), dst: bold(sock(pkt.dst)) }));
      else if (srcChanged) add(t.parts('captionRowOut', { row: row, from: bold(sock(was.src)), to: bold(sock(pkt.src)), dst: bold(sock(pkt.dst)) }));
      else {
        var rv = L.viewOf(s.table[d.row]);
        add(t.parts('captionRowIn', { dst: bold(sock(was.dst)), row: row, inside: bold(sock(rv.inside)), remote: bold(sock(rv.remote)), to: bold(sock(pkt.dst)) }));
      }
    }
    if (hop.answer && hop.deliver && hop.opener === hop.to) add([' ', t.parts('captionGot', { who: bold(hop.to) })]);
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'choice', label: t('scene'), resets: true,
        options: [['book', t('sceneBook')], ['mixed', t('sceneMixed')], ['outside', t('sceneOutside')], ['inside', t('sceneInside')]] },
      { key: 'forward', type: 'toggle', label: t('forward') },
      { key: 'proto', type: 'choice', label: t('proto'), options: [['tcp', 'TCP'], ['udp', 'UDP']] },
      { key: 'extPort', type: 'choice', label: t('extPort'), options: L.extPorts.map(function (x) { return [x, x]; }) },
      { key: 'hairpin', type: 'toggle', label: t('hairpin') }
    ],

    presets: presets,

    legend: [
      { shape: 'round', label: t('legendIn') },
      { label: t('legendRouter') },
      { shape: 'diamond', label: t('legendOut') },
      { shape: 'hl', label: t('legendChanged') },
      { shape: 'pf-drop', label: t('legendDrop') },
      { shape: 'pf-out', label: t('legendPat') },
      { shape: 'pf-fwd', label: t('legendFwd') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'pf' }, drawing(c), translationTable(c)));
    },

    caption: function (c) {
      var s = c.state;
      if (!s.hop) {
        var probe = bold(NET.outside + ':' + c.params.extPort), web = bold(sock(L.web));
        var start = s.scene === 'book' ? t.parts('captionStartBook', { web: web, port: bold(String(L.srcPort)), probe: probe })
          : s.scene === 'mixed' ? t.parts('captionStartMixed', { web: web, p1: bold(sock(s.table[0].reply.dst)), p2: bold(sock(s.table[1].reply.dst)), probe: probe })
          : t.parts(s.scene === 'inside' ? 'captionStartInside' : 'captionStartOutside', { probe: probe });
        return start.concat([' '], s.forwards.length ? t.parts('captionFwdOne', { f: bold(fwdText(s.forwards[0])) }) : [t('captionFwdNone')]);
      }
      return hopCaption(c);
    }
  });
})();
