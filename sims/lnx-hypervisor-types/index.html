<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // Series colour per kind of layer (always with a shape: the stripes and K, the thick outline and H, the dark band).
  var COLOUR = { hv: 1, dhv: 1, kvmk: 2, hostk: 2, ctrk: 2, gk: 2, emu: 6, ctr: 3 };
  // The selection each preset opens with: its caption shows while the selection is still the preset's.
  var PRESET_SEL = { 'book': 'type2:dhv', 'vm-vs-container': 'containers:ctr1', 'kernel-hypervisor': 'kernel:kvmk', 'windows-guest': 'kernel:gk2' };

  function noSteal(e) { e.preventDefault(); }
  function data(text, cls) { return h('span', { class: cls || 'hv-mono', translate: 'no' }, text); }

  var sim;
  function pick(sel) {
    sim.set({ sel: sim.params.sel === sel ? '' : sel }, { preset: sim.preset }); // a click keeps the active preset
  }

  /** The card name of a layer (per-guest kinds carry the guest number). */
  function nameOf(l) { return l.kind === 'ctr' && l.os === 'windows' ? t('ctrWin') : t('n_' + l.kind, { i: l.guest }); }

  function block(st, l, s) {
    var k = L.KINDS[l.kind];
    var label = l.kind === 'gk' && l.os === 'windows' ? t('b_gkWin') : t('b_' + l.kind);
    var sub = null;
    if (l.kind === 'ctrk') sub = t('b_ctrkSub');
    if (s.laptop && st.id === 'type2' && l.kind === 'hw') sub = t('memHw', { n: s.laptop.total });
    if (s.laptop && st.id === 'type2' && l.kind === 'hostapp') sub = t('memHost', { n: s.laptop.host });
    if (l.rejected) sub = t('rejected');
    var cls = 'hv-layer' + (k.kernel ? ' is-k' : '') + (k.hv ? ' is-hv' : '') + (l.sel ? ' sd-changed' : '') + (l.lit ? ' is-lit' : '') +
      (COLOUR[l.kind] && !l.sel ? ' sd-soft' : '');
    return h('button', {
      type: 'button', class: cls, dataset: { kind: l.kind, c: COLOUR[l.kind] ? String(COLOUR[l.kind]) : '' },
      'aria-pressed': l.sel ? 'true' : 'false', 'aria-label': t('layerLabel', { name: nameOf(l), stack: t('s_' + st.id) }),
      onmousedown: noSteal, onclick: function () { pick(st.id + ':' + l.id); }
    },
      h('span', { class: 'hv-name' }, label,
        k.hv ? h('span', { class: 'hv-mark is-h', 'aria-hidden': 'true' }, t('badgeH')) : null,
        k.kernel ? h('span', { class: 'hv-mark', 'aria-hidden': 'true' }, t('badgeK')) : null),
      sub ? h('span', { class: 'hv-sub' }, sub) : null);
  }

  function leaves(l, layers) {
    var kids = layers.filter(function (x) { return x.on === l.id; });
    return kids.length ? kids.reduce(function (n, x) { return n + leaves(x, layers); }, 0) : 1;
  }

  /** A layer with what stands on it above; a guest kernel and a container sit in their double-lined frame. */
  function node(st, l, s) {
    var kids = st.layers.filter(function (x) { return x.on === l.id; });
    var inner = h('div', { class: 'hv-node', style: { '--leaves': String(leaves(l, st.layers)) } },
      kids.length ? h('div', { class: 'hv-up' }, kids.map(function (x) { return node(st, x, s); })) : null,
      block(st, l, s));
    if (l.kind !== 'gk' && l.kind !== 'ctr') return inner;
    var label = l.kind === 'gk' ? t('vmN', { i: l.guest }) + (s.laptop && st.id === 'type2' ? ' · ' + t('memVm', { n: s.laptop.perGuest }) : '')
      : l.os === 'windows' ? t('ctrWin') : t('ctrN', { i: l.guest });
    return h('div', { class: 'hv-frame' + (l.rejected ? ' is-rejected' : ''), style: { '--leaves': '1' } },
      h('p', { class: 'hv-frame-label' }, label), inner);
  }

  function stackEl(st, s) {
    var hw = st.layers[0];
    var ks = [];
    for (var i = 0; i < st.kernels; i++) ks.push(h('span', { class: 'hv-mark', 'aria-hidden': 'true' }, t('badgeK')));
    var kept = s.compare && s.compare.indexOf(st.id) >= 0;
    return h('section', { class: 'hv-stack' + (st.dim ? ' is-dim' : '') + (kept ? ' is-kept' : '') },
      h('header', { class: 'hv-head' }, h('h2', null, t('s_' + st.id)), h('p', null, t('sh_' + st.id))),
      h('div', { class: 'hv-body' }, node(st, hw, s)),
      h('p', { class: 'hv-foot' },
        h('span', { class: 'hv-count' }, t.n('kernelsN', st.kernels)), h('span', { class: 'hv-ks' }, ks),
        st.extra ? h('span', { class: 'hv-extra' }, t('kernelsExtra')) : null));
  }

  function kernelText(i) {
    if (i.rejected) return t('kh_rejected');
    if (i.kernel === 'host') return t.parts('kh_host', { v: data(L.HOST_VERSION) });
    if (i.kernel === 'guest') {
      return i.os === 'windows' ? t('kh_guestWin', { i: i.kernelGuest }) : t.parts('kh_guest', { i: i.kernelGuest, v: data(L.GUEST_VERSIONS[i.kernelGuest - 1]) });
    }
    return t('kh_' + i.kernel);
  }

  function card(s) {
    var i = s.info;
    if (!i) return h('div', { class: 'hv-card is-empty' }, h('p', null, t('cardHint')));
    var st = s.stacks.filter(function (x) { return x.id === i.stack; })[0];
    var l = st.layers.filter(function (x) { return x.id === i.layer; })[0];
    var rows = [
      h('dt', null, t('cKernel')), h('dd', null, kernelText(i)),
      h('dt', null, t('cBoundary')), h('dd', null, t('bd_' + i.boundary)),
      h('dt', null, t('cUname')), h('dd', null, i.uname ? data(i.uname) : t('un_' + i.unameWhy))
    ];
    if (i.ps) rows.push(h('dt', null, t('cPs')), h('dd', null, h('ul', { class: 'hv-ps' }, i.ps.map(function (g) { return h('li', null, t('psRow', { i: g })); }))));
    if (i.risk === 'own') rows.push(h('dt', null, t('cRisk')), h('dd', null, t('riskOwn')));
    if (i.risk === 'shared' && i.sharedBy > 0) rows.push(h('dt', null, t('cRisk')), h('dd', null, t.n('riskShared', i.sharedBy)));
    if (s.laptop && i.stack === 'type2') rows.push(h('dt', null, t('cMem')), h('dd', null, t('memLine', { total: s.laptop.total, guest: s.laptop.perGuest, host: s.laptop.host })));
    return h('div', { class: 'hv-card' },
      h('div', null,
        h('p', { class: 'hv-where' }, t('s_' + i.stack)),
        h('h2', null, nameOf(l)),
        h('p', null, i.rejected ? t('w_ctrWin') : t('w_' + i.kind)),
        i.extra ? h('p', { class: 'hv-note' }, t('cExtra')) : null),
      h('dl', { class: 'hv-meta' }, rows));
  }

  function selCaption(s) {
    var i = s.info;
    var st = s.stacks.filter(function (x) { return x.id === i.stack; })[0];
    var l = st.layers.filter(function (x) { return x.id === i.layer; })[0];
    var head = t('capSel', { name: nameOf(l), stack: t('s_' + i.stack) });
    var v = i.uname ? data(i.uname) : null;
    var key = 'k_' + i.kind;
    if (i.rejected) key = 'k_ctrWin';
    else if (i.os === 'windows' && (i.kind === 'gk' || i.kind === 'app')) key = i.kind === 'gk' ? 'k_gkWin' : 'k_appWin';
    if (i.kind === 'ctrk') return [head, t.n(key, st.running)];
    return [head].concat(t.parts(key, { v: v }));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'compare', type: 'choice', label: t('compare'), options: L.COMPARE_IDS.map(function (m) { return [m, t('cmp_' + m)]; }) },
      { key: 'guests', type: 'range', label: t('guests'), min: L.MIN_GUESTS, max: L.MAX_GUESTS },
      { key: 'win', type: 'toggle', label: t('win'), hint: t('winHint') },
      { key: 'sel', type: 'select', label: t('compare'), options: L.allSel().map(function (v) { return [v, v]; }),
        visible: function () { return false; } },
      { key: 'view', type: 'select', label: t('compare'), options: [['none', 'none'], ['book', 'book']],
        visible: function () { return false; } }
    ],

    presets: [
      { id: 'book', label: t('pBook'), params: { compare: 'type1-vs-type2', guests: 1, view: 'book', sel: 'type2:dhv' }, hint: t('pBookHint') },
      { id: 'vm-vs-container', label: t('pVmCtr'), params: { compare: 'vm-vs-container', guests: 2, sel: 'containers:ctr1' }, hint: t('pVmCtrHint') },
      { id: 'kernel-hypervisor', label: t('pKernel'), params: { compare: 'kernel', guests: 2, sel: 'kernel:kvmk' }, hint: t('pKernelHint') },
      { id: 'windows-guest', label: t('pWin'), params: { compare: 'vm-vs-container', guests: 2, win: true, sel: 'kernel:gk2' }, hint: t('pWinHint') }
    ],

    legend: [
      { shape: 'hv-hw', label: t('legHw') },
      { shape: 'hv-h', label: t('legHv') },
      { shape: 'hv-k', label: t('legK') },
      { shape: 'hv-app', label: t('legApp') },
      { shape: 'hv-frame', label: t('legBoundary') },
      { shape: 'hl', label: t('legChanged') },
      { shape: 'hv-lit', label: t('legLinked') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'hv' + (s.guests === 3 ? ' is-g3' : '') },
        // one column width per leaf, so a VM is as wide in every stack
        h('div', { class: 'hv-stacks', style: { '--cols': s.stacks.map(function (st) { return 'minmax(0, ' + leaves(st.layers[0], st.layers) + 'fr)'; }).join(' ') } },
          s.stacks.map(function (st) { return stackEl(st, s); })),
        card(s)));
    },

    caption: function (c) {
      var s = c.state;
      var g = s.guests;
      if (c.preset && PRESET_SEL[c.preset] === c.params.sel) {
        if (c.preset === 'book') {
          var out = t.parts('capBook');
          if (s.laptop) out.push(' ', t('capLaptop', { total: s.laptop.total, guest: s.laptop.perGuest, host: s.laptop.host }));
          return out;
        }
        if (c.preset === 'vm-vs-container') return t.n('capVmCtr', s.stacks[3].running);
        if (c.preset === 'kernel-hypervisor') return t.n('capKernel', g);
        if (c.preset === 'windows-guest') return t('capWin');
      }
      if (s.info) return selCaption(s);
      var k = s.stacks.map(function (st) { return st.kernels; });
      if (s.mode === 'all') return t('cap_all', { a: k[0], b: k[1], c: k[2], d: k[3] });
      if (s.mode === 'vm-vs-container') return t('cap_vm-vs-container', { a: k[2] });
      return t('cap_' + s.mode);
    }
  });
})();
</script>
</body>
</html>
