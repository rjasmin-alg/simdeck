<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // ── numbers in the page's language ──

  /** x with d decimals in the page's language. */
  function dec(x, d) {
    var s = x.toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  /** TiB, or GiB below 1 TiB. */
  function cap(tib) {
    if (tib < 1 - 1e-9) return t('gib', { n: dec(tib * 1024, 0) });
    return t('tib', { n: dec(tib, 1) });
  }
  function pct(r, d) { return t('pct', { n: dec(100 * r, d == null ? 1 : d) }); }
  function pctInt(r) { return t('pct', { n: String(Math.round(100 * r)) }); }
  function osdName(id) { return 'osd.' + id; }
  function data(x) { return h('span', { translate: 'no' }, String(x)); }
  /** *word* is an English term in italics. */
  function emph(text) {
    return text.split(/\*([^*]+)\*/).map(function (bit, i) { return i % 2 ? h('em', { lang: 'en' }, bit) : bit; });
  }
  function diskLabel(g) { return g < 1024 ? t('gib', { n: String(g) }) : t('tib', { n: String(g / 1024) }); }

  // ── the ceph df box and the health line ──

  function tile(role, label, value, sub, attrs) {
    return h('div', Object.assign({ class: 'sc-tile', dataset: { role: role } }, attrs || {}),
      h('span', { class: 'sc-tile-label' }, label),
      h('span', { class: 'sc-tile-value' }, value),
      h('span', { class: 'sc-tile-sub' }, sub));
  }

  function dfBox(s) {
    var lab = s.cluster === 'lab';
    var inCount = s.osds.filter(function (o) { return o.in; }).length;
    var tiles = [
      tile('raw', t('dfRaw'), cap(s.rawTiB), t.n('dfRawSub', inCount)),
      tile('used', t('dfUsed'), h('span', null, pct(s.rawRatio)),
        lab ? t('dfUsedSub', { stored: cap(s.storedTiB), size: s.pool.size }) : t('dfUsedSubHq')),
      tile('naive', t('dfNaive', { size: s.pool.size }), cap(s.naiveTiB), t('dfNaiveSub', { pct: pct(s.rawRatio, 0) })),
      tile('max', h('span', { translate: 'no' }, t('dfMax', { pool: s.pool.name })), cap(s.maxAvailTiB),
        t('dfMaxSub', { id: s.maxAvailOsd }))
    ];
    if (lab) {
      tiles.push(s.full
        ? tile('fits', t('dfFits', { id: s.fullest }), cap(0), t('dfFitsFull'), { 'data-full': 'true' })
        : tile('fits', t('dfFits', { id: s.fullest }), cap(s.headroomTiB), t('dfFitsSub')));
    }
    return h('div', { class: 'sc-df', style: { gridTemplateColumns: lab ? null : 'repeat(4, minmax(0, 1fr))' } }, tiles);
  }

  function health(s) {
    var c = s.counts;
    var hstate = c.full ? 'err' : (c.nearfull || c.backfillfull) ? 'warn' : 'ok';
    var parts = [];
    if (c.full) parts.push(t.n('hFull', c.full));
    if (c.backfillfull) parts.push(t.n('hBackfill', c.backfillfull));
    if (c.nearfull) parts.push(t.n('hNear', c.nearfull));
    if (s.full) parts.push(t('hPoolFull', { refused: cap(s.refusedTiB) }));
    if (!parts.length) parts.push(t('healthOk'));
    return h('div', { class: 'sc-health' },
      h('span', { class: 'sc-hstate', dataset: { h: hstate }, translate: 'no' }, t({ ok: 'hsOk', warn: 'hsWarn', err: 'hsErr' }[hstate])),
      h('span', null, parts.join(' · ')));
  }

  // ── hosts and bars ──

  function bar(s, o, maxSize, changed) {
    var heightPct = 100 * o.sizeTiB / maxSize;
    var fillPct = Math.min(100, 100 * o.ratio);
    var lines = o.in ? [85, 90, 95].map(function (n) { return h('div', { class: 'sc-line', style: { bottom: n + '%' } }); }) : [];
    var aria = t('osdAria', { id: o.id, used: cap(o.usedTiB), size: cap(o.sizeTiB), pct: pct(o.ratio, 0), level: t('lvl_' + o.level) });
    return h('div', { class: 'sc-col' },
      h('div', { class: 'sc-slot' },
        h('div', {
          class: 'sc-bar' + (changed ? ' sd-changed' : ''), role: 'img', 'aria-label': aria,
          dataset: Object.assign({ level: o.level }, o.id === s.fullest ? { decide: 'true' } : {}),
          style: { height: heightPct + '%' }
        },
          h('div', { class: 'sc-fill', style: { height: fillPct + '%' } }),
          lines,
          o.in ? null : h('span', { class: 'sc-out' }, t('osdOut')))),
      h('div', { class: 'sc-id', translate: 'no' }, String(o.id)));
  }

  function axis(maxHere, maxSize) {
    var hgt = 100 * maxHere / maxSize;
    return h('div', { class: 'sc-col', dataset: { axis: 'true' }, 'aria-hidden': 'true' },
      h('div', { class: 'sc-slot' },
        h('div', { class: 'sc-axis', style: { height: hgt + '%' } }, (hgt >= 90 ? [95, 90, 85] : [95, 85]).map(function (n) {   // 90 only where the labels have room
          return h('span', { class: 'sc-tick', dataset: { n: String(n) }, style: { bottom: n + '%' } }, t('line', { n: n }));
        }))),
      h('div', { class: 'sc-id' }, ' '));
  }

  function hostBox(s, x, hi, maxSize, chg) {
    var mine = s.osds.filter(function (o) { return o.host === hi; });
    var maxHere = Math.max.apply(null, mine.map(function (o) { return o.sizeTiB; }));
    var sizes = mine.filter(function (o) { return o.in; }).map(function (o) { return o.sizeTiB; });
    var uniform = sizes.every(function (z) { return Math.abs(z - sizes[0]) < 1e-9; });
    var diskLine = uniform ? t.n('hostDisks', x.disks, { size: cap(sizes[0]) }) : null;
    var holds = null;
    if (s.cluster === 'lab' && s.storedTiB > 1e-9) {
      holds = x.fullCopy ? t('hostCopy', { data: cap(x.usedTiB) }) : t('hostHolds', { data: cap(x.usedTiB) });
    } else if (s.cluster === 'hq') holds = t('hostHolds', { data: cap(x.usedTiB) });
    var fill = Math.round(100 * x.minRatio) === Math.round(100 * x.maxRatio)
      ? t('hostFillOne', { pct: pctInt(x.maxRatio) })
      : t('hostFill', { lo: String(Math.round(100 * x.minRatio)), hi: pctInt(x.maxRatio) });
    var f = L.osdOf(s, s.fullest);
    // every host header has the same lines (the decides line is blank elsewhere), so equal disks draw equal bars
    var decides = h('div', { class: 'sc-hdecides' }, f && f.host === hi ? t('decides', { id: f.id, pct: pctInt(f.ratio) }) : '\u00a0');
    return h('section', { class: 'sc-host', style: { '--disks': String(Math.max(2, x.disks + 1)) } },
      h('div', { class: 'sc-hhead' },
        h('div', { class: 'sc-hname', translate: 'no' }, x.name),
        h('div', null, diskLine || '\u00a0'),
        h('div', null, holds || '\u00a0'),
        h('div', null, fill),
        decides),
      h('div', { class: 'sc-bars' }, axis(maxHere, maxSize), mine.map(function (o) {
        return bar(s, o, maxSize, chg.indexOf(o.id) >= 0);
      })));
  }

  // ── render; the changed marks and the "disks added" note follow the last change ──

  var lastKey = null, lastState = null, prevState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key === lastKey) return;
    prevState = lastState;
    chg = L.changed(lastState, c.state);
    lastKey = key;
    lastState = c.state;
  }

  function render(c) {
    track(c);
    var s = c.state;
    var maxSize = Math.max.apply(null, s.osds.map(function (o) { return o.sizeTiB; }));
    c.stage.replaceChildren(h('div', { class: 'sc' },
      dfBox(s),
      health(s),
      h('div', { class: 'sc-hosts' }, s.hosts.map(function (x, hi) { return hostBox(s, x, hi, maxSize, chg); }))));
  }

  /** A string with {placeholders} filled by text or nodes, *terms* in italics. */
  function parts(key, vars, raw) {
    var text = raw != null ? raw : t(key, {});
    var out = [];
    emph(text).forEach(function (bit) {
      if (typeof bit !== 'string') { out.push(bit); return; }
      bit.split(/\{(\w+)\}/).forEach(function (x, i) {
        if (i % 2 === 0) { if (x) out.push(x); }
        else out.push(vars[x] == null ? '' : vars[x].nodeType ? vars[x].cloneNode(true) : vars[x]);   // a node may appear twice
      });
    });
    return out;
  }

  function caption(c) {
    track(c);
    var s = c.state;
    var k = L.captionKey(s);
    var f = L.osdOf(s, s.fullest);
    var host = s.hosts[f.host];
    var vars = {
      raw: pct(s.rawRatio, 0), osd: data(osdName(f.id)), pct: pctInt(f.ratio), host: data(host.name),
      disks: t.n('diskOn', host.disks), max: cap(s.maxAvailTiB), naive: cap(s.naiveTiB), size: s.pool.size,
      fits: s.headroomTiB == null ? '' : cap(s.headroomTiB), stored: s.storedTiB == null ? '' : cap(s.storedTiB),
      refused: s.refusedTiB == null ? '' : cap(s.refusedTiB), pool: data(s.pool.name), big: data(s.hosts[0].name),
      level: t('lvl_' + f.level)
    };
    if (k.key === 'cEven') vars.disks = t.n('diskPo', host.disks);
    var out = parts(k.key, vars);
    // "four more disks on the big host": right after the big host grew, all else equal; it replaces the other note
    var q = prevState;
    if (q && q.cluster === 'lab' && s.cluster === 'lab' && !s.full && !q.full && s.hosts[0].disks > q.hosts[0].disks &&
        q.hosts[1].disks === s.hosts[1].disks && q.pool.size === s.pool.size && q.storedTiB === s.storedTiB &&
        Math.abs(q.osds[0].sizeTiB - s.osds[0].sizeTiB) < 1e-9) {
      var n = s.hosts[0].disks - q.hosts[0].disks;
      out.push(' ');
      return out.concat(parts(null, Object.assign({}, vars, { n: n, rawFrom: cap(q.rawTiB), rawTo: cap(s.rawTiB),
        capFrom: cap(q.fullAtTiB), capTo: cap(s.fullAtTiB) }), t.n('nAdded', n)));
    }
    k.notes.forEach(function (key) { out.push(' '); out = out.concat(parts(key, vars)); });
    return out;
  }

  var labels = { 'unbalanced': 'pUnbalanced', 'add-to-big-host': 'pAddBig', 'fill-it': 'pFill', 'one-small-disk': 'pOneSmall', 'dr-38-percent': 'pHq' };
  function isLab(p) { return p.cluster !== 'hq'; }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'cluster', type: 'choice', label: t('cluster'), options: [['lab', t('clusterLab')], ['hq', t('clusterHq')]] },
      { key: 'smallHostDisks', type: 'range', label: t('smallHostDisks'), min: L.RANGE.smallHostDisks[0], max: L.RANGE.smallHostDisks[1], step: 1, visible: isLab },
      { key: 'bigHostDisks', type: 'range', label: t('bigHostDisks'), min: L.RANGE.bigHostDisks[0], max: L.RANGE.bigHostDisks[1], step: 1, visible: isLab },
      { key: 'diskGiB', type: 'choice', label: t('diskGiB'), options: L.DISKS.map(function (g) { return [g, diskLabel(g)]; }), visible: isLab },
      { key: 'storedTiB', type: 'range', label: t('storedTiB'), min: 0, max: L.storedMax, step: L.RANGE.storedStep,
        format: function (v) { return cap(v); }, visible: isLab },
      { key: 'size', type: 'choice', label: t('size'), options: [[2, '2'], [3, '3']], visible: isLab }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'sc-bar', label: t('legBar') },
      { shape: 'sc-over', label: t('legOver') },
      { shape: 'sc-full', label: t('legFull') },
      { shape: 'dash', label: t('legLine') },
      { shape: 'sc-decide', label: t('legDecide') },
      { shape: 'sc-host', label: t('legHost') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
