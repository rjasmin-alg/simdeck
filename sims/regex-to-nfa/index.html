<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  function s(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    for (var k in attrs || {}) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
    return el;
  }
  function data(text, cls) { return h('span', { translate: 'no', class: 'rn-mono' + (cls ? ' ' + cls : '') }, text); }
  function B(text) { return h('b', { translate: 'no' }, String(text)); }
  function setText(xs) { return '{' + xs.join(', ') + '}'; }
  function setTight(xs) { return '{' + xs.join(',') + '}'; }
  function setOrEmpty(xs) { return xs.length ? setText(xs) : '∅'; }
  var SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function sup(n) { return String(n).split('').map(function (d) { return SUP.charAt(Number(d)); }).join(''); }
  function names(list) {
    if (list.length < 2) return list.join('');
    return list.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + list[list.length - 1];
  }
  /** Groups of equivalent DFA states from the pairs with the same row. */
  function groupsOf(pairs) {
    var groups = [];
    pairs.forEach(function (p) {
      var g = groups.filter(function (x) { return x.indexOf(p[0]) >= 0 || x.indexOf(p[1]) >= 0; })[0];
      if (!g) groups.push(p.slice());
      else p.forEach(function (n) { if (g.indexOf(n) < 0) g.push(n); });
    });
    groups.forEach(function (g) { g.sort(); });
    return groups;
  }

  // ── geometry shared by the three drawings (units: the drawing's viewBox) ──
  function rim(cx, cy, tx, ty, r) {
    var dx = tx - cx, dy = ty - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
    return [cx + dx / d * r, cy + dy / d * r];
  }
  function dist(p, q) { return Math.sqrt((p[0] - q[0]) * (p[0] - q[0]) + (p[1] - q[1]) * (p[1] - q[1])); }
  /** A polyline as an SVG path, its corners rounded with radius r (at most half of each side). */
  function rounded(pts, r) {
    var d = 'M ' + pts[0];
    for (var i = 1; i < pts.length - 1; i++) {
      var p = pts[i], a = pts[i - 1], b = pts[i + 1];
      var ra = Math.min(r, dist(a, p) / 2), rb = Math.min(r, dist(p, b) / 2);
      var pa = [p[0] + (a[0] - p[0]) / dist(a, p) * ra, p[1] + (a[1] - p[1]) / dist(a, p) * ra];
      var pb = [p[0] + (b[0] - p[0]) / dist(p, b) * rb, p[1] + (b[1] - p[1]) / dist(p, b) * rb];
      d += ' L ' + pa + ' Q ' + p + ' ' + pb;
    }
    return d + ' L ' + pts[pts.length - 1];
  }
  function arrowHead(tip, dir, cls) {
    var l = Math.sqrt(dir[0] * dir[0] + dir[1] * dir[1]) || 1, ux = dir[0] / l, uy = dir[1] / l;
    var big = /rn-hot/.test(cls), len = big ? 20 : 15, wid = big ? 10 : 7;
    var bx = tip[0] - ux * len, by = tip[1] - uy * len;
    var pts = [tip, [bx - uy * wid, by + ux * wid], [bx + uy * wid, by - ux * wid]];
    return s('polygon', { points: pts.map(String).join(' '), class: 'rn-tip ' + cls });
  }

  /**
   * A state graph: spec { W, H, R, nodes: [{ id, x, y, label, accept, cls }], edges: [{ from, to, label, cls,
   * pts (a polyline from the start's centre to the end's, corners rounded when round), curve (sideways bend as a
   * share of the length), loop: [ux, uy] }], start: id }.
   * The SVG draws circles and lines; the labels are HTML spans placed by percentage.
   */
  function graph(spec, extraCls) {
    var W = spec.W, H = spec.H, R = spec.R;
    var at = {};
    spec.nodes.forEach(function (n) { at[n.id] = n; });
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    var box = h('div', { class: 'rn-draw' + (extraCls ? ' ' + extraCls : ''), translate: 'no', style: { '--ar': W + ' / ' + H } }, svg);
    function label(x, y, text, cls) {
      box.append(h('span', { class: 'rn-lbl' + (cls ? ' ' + cls : ''), style: { left: (x / W * 100) + '%', top: (y / H * 100) + '%' } }, text));
    }
    if (spec.start != null && at[spec.start]) {
      var a0 = at[spec.start], dirx = spec.startDir || [-1, 0];
      var from = [a0.x + dirx[0] * (R + 46), a0.y + dirx[1] * (R + 46)], to = [a0.x + dirx[0] * R, a0.y + dirx[1] * R];
      svg.append(s('path', { d: 'M ' + from + ' L ' + to, class: 'rn-edge' }));
      svg.append(arrowHead(to, [-dirx[0], -dirx[1]], ''));
    }
    var labels = [];
    var hotLast = spec.edges.slice().sort(function (x, y) { return (/rn-hot/.test(x.cls || '') ? 1 : 0) - (/rn-hot/.test(y.cls || '') ? 1 : 0); });
    hotLast.forEach(function (e) {
      var a = at[e.from], b = at[e.to];
      if (!a || !b) return;
      var cls = e.cls || '', path, tip, dir, lab;
      if (e.loop) {
        var ux = e.loop[0], uy = e.loop[1], px = -uy, py = ux;
        var p0 = [a.x + ux * R * 0.8 - px * R * 0.6, a.y + uy * R * 0.8 - py * R * 0.6];
        var p1 = [a.x + ux * R * 0.8 + px * R * 0.6, a.y + uy * R * 0.8 + py * R * 0.6];
        var c0 = [a.x + ux * R * 2.9 - px * R * 1.4, a.y + uy * R * 2.9 - py * R * 1.4];
        var c1 = [a.x + ux * R * 2.9 + px * R * 1.4, a.y + uy * R * 2.9 + py * R * 1.4];
        path = 'M ' + p0 + ' C ' + c0 + ' ' + c1 + ' ' + p1;
        tip = p1; dir = [p1[0] - c1[0], p1[1] - c1[1]];
        lab = [a.x + ux * R * 2.75, a.y + uy * R * 2.75];
      } else if (e.pts) {
        var P = e.pts, pre = P[P.length - 2];
        var pts = [rim(a.x, a.y, P[1][0], P[1][1], R)].concat(P.slice(1, -1), [rim(b.x, b.y, pre[0], pre[1], R)]);
        path = rounded(pts, e.round ? 22 : 0);
        tip = pts[pts.length - 1]; dir = [tip[0] - pre[0], tip[1] - pre[1]];
        var best = 0;
        for (var i = 1; i < pts.length - 1; i++) if (dist(pts[i], pts[i + 1]) > dist(pts[best], pts[best + 1])) best = i;
        var u0 = pts[best], u1 = pts[best + 1];
        lab = [(u0[0] + u1[0]) / 2, (u0[1] + u1[1]) / 2 - (Math.abs(u0[1] - u1[1]) < 1 && !e.round ? 15 : 0)];
      } else if (e.curve) {
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = b.x - a.x, dy = b.y - a.y;
        var c = [mx + dy * e.curve, my - dx * e.curve];
        var s0 = rim(a.x, a.y, c[0], c[1], R), s1 = rim(b.x, b.y, c[0], c[1], R);
        path = 'M ' + s0 + ' Q ' + c + ' ' + s1;
        tip = s1; dir = [s1[0] - c[0], s1[1] - c[1]];
        lab = [0.25 * s0[0] + 0.5 * c[0] + 0.25 * s1[0], 0.25 * s0[1] + 0.5 * c[1] + 0.25 * s1[1]];
      } else {
        var q0 = rim(a.x, a.y, b.x, b.y, R), q1 = rim(b.x, b.y, a.x, a.y, R);
        path = 'M ' + q0 + ' L ' + q1;
        tip = q1; dir = [q1[0] - q0[0], q1[1] - q0[1]];
        lab = [(q0[0] + q1[0]) / 2, (q0[1] + q1[1]) / 2 - (Math.abs(a.y - b.y) < 1 ? 15 : 0)];
      }
      svg.append(s('path', { d: path, class: 'rn-edge ' + cls }));
      if (!e.noTip) svg.append(arrowHead(tip, dir, cls));
      if (e.label) labels.push([lab[0], lab[1], e.label, cls]);
    });
    labels.forEach(function (l) { label(l[0], l[1], l[2], l[3]); });
    spec.nodes.forEach(function (n) {
      var r = n.r || R;
      svg.append(s('circle', { cx: n.x, cy: n.y, r: r, class: 'rn-node ' + (n.cls || '') }));
      if (n.accept) svg.append(s('circle', { cx: n.x, cy: n.y, r: r - 7, class: 'rn-ring' }));
      label(n.x, n.y, n.label, 'rn-st ' + (n.lcls || n.cls || ''));
    });
    return box;
  }

  // ── the NFA ──
  var COL = 100, ROW = 92, NR = 29, MARGIN_X = 80, MARGIN_Y = 48;
  var boxes = Object.create(null);
  function nfaBoxOf(src) { return boxes[src] || (boxes[src] = L.nfaBox(src)); }

  function nfaDrawing(st, c) {
    var B0 = nfaBoxOf(st.regex), lay = L.nfaLayout(st);
    var cw = Math.max(B0.w, 6) * COL, ch = Math.max(B0.up + B0.down, 2.4) * ROW;
    var W = cw + 2 * MARGIN_X, H = ch + 2 * MARGIN_Y;
    var ox = MARGIN_X + (cw - B0.w * COL) / 2, oy = MARGIN_Y + (ch - (B0.up + B0.down) * ROW) / 2 + B0.up * ROW;
    var ev = st.ev, sub = st.phase !== 'thompson' && ev && ev.kind === 'row';
    var added = ev && ev.added ? ev.added : [], merged = ev && ev.merged ? ev.merged.into : null;
    var newEdges = {};
    (ev && ev.edges ? ev.edges : []).forEach(function (e) { newEdges[e.from + '>' + e.to + '>' + e.sym] = true; });
    var cur = sub ? ev.set : [];
    var used = {};
    if (sub) ev.moves.forEach(function (m) {
      st.nfa.edges.forEach(function (e) { if (e.sym === m.sym && cur.indexOf(e.from) >= 0) used[e.from + '>' + e.to + '>' + e.sym] = true; });
    });
    var nodes = st.nfa.states.map(function (id) {
      var p = lay.pos[id];
      var isNew = added.indexOf(id) >= 0 || id === merged;
      var cls = isNew ? 'rn-new' : cur.indexOf(id) >= 0 ? 'rn-cur' : st.alias[id] != null ? 'rn-prov' : '';
      return { id: id, x: ox + p[0] * COL, y: oy + p[1] * ROW, label: L.label(st, id), accept: st.nfa.accept === id, cls: cls };
    });
    var edges = st.nfa.edges.map(function (e) {
      var k = e.from + '>' + e.to + '>' + e.sym;
      var cls = (e.sym === null ? 'rn-eps' : '') + (newEdges[k] || used[k] ? ' rn-hot' : '');
      var sh = L.edgeShape(lay, e.from, e.to);
      var px = sh.kind === 'line' ? null : sh.pts.map(function (q) { return [ox + q[0] * COL, oy + q[1] * ROW]; });
      return { from: e.from, to: e.to, label: e.sym === null ? 'ε' : e.sym, cls: cls, pts: px, round: sh.kind === 'arc' };
    });
    var g = graph({ W: W, H: H, R: NR, nodes: nodes, edges: edges, start: st.nfa.start != null ? st.nfa.start : null });
    g.style.setProperty('--phone-w', Math.max(22, Math.round(W / 34)) + 'rem');
    return g;
  }

  // ── the parse tree ──
  function treeDrawing(st) {
    var lay = L.treeLayout(st.tree), TC = 64, TR = 62, TRAD = 20, M = 30;
    var W = Math.max(lay.cols, 5) * TC + 2 * M, H = Math.max(lay.rows, 6) * TR + 2 * M - TR + 2 * TRAD;
    var ox = M + (W - 2 * M - lay.cols * TC) / 2 + TC / 2, oy = M + TRAD;
    var cur = st.ev && st.ev.token != null ? st.ev.token : -1;
    var nodes = st.tree.map(function (n, k) {
      var p = lay.pos[k];
      return { id: k, x: ox + p[0] * TC, y: oy + p[1] * TR, label: st.tokens[k],
        cls: k === cur ? 'rn-new' : k < st.ti ? '' : 'rn-todo' };
    });
    var edges = [];
    st.tree.forEach(function (n, k) { n.kids.forEach(function (c) { edges.push({ from: k, to: c, cls: 'rn-tree', noTip: true }); }); });
    var g = graph({ W: W, H: H, R: TRAD, nodes: nodes, edges: edges });
    g.style.setProperty('--phone-w', Math.max(12, Math.round(W / 26)) + 'rem');
    return g;
  }

  // ── the DFA ──
  var DW = 560, DH = 400, DR = 30;
  var finals = Object.create(null);
  function finalOf(src) { if (!finals[src]) { var all = L.run(src); finals[src] = all[all.length - 1]; } return finals[src]; }
  function dfaDrawing(st, c) {
    var last = finalOf(st.regex);
    var dead = c.params.showDead && st.dfa.dead;
    var order = last.dfa.states.map(function (d) { return d.name; });
    if (c.params.showDead && last.dfa.dead) order.push('∅');
    var pos = L.dfaLayout(order), rx = DW / 2 - 95, ry = DH / 2 - 78;
    function P(name) { return [DW / 2 + pos[name][0] * rx, DH / 2 + pos[name][1] * ry]; }
    var ev = st.ev && st.ev.kind === 'row' ? st.ev : null;
    var created = ev ? ev.moves.filter(function (m) { return m.isNew; }).map(function (m) { return m.to; }) : [];
    if (ev && ev.first) created.push('A');
    var nodes = st.dfa.states.map(function (d) {
      var p = P(d.name);
      return { id: d.name, x: p[0], y: p[1], label: d.name, accept: d.accepting,
        cls: created.indexOf(d.name) >= 0 ? 'rn-new' : ev && ev.name === d.name ? 'rn-cur' : '' };
    });
    if (dead) { var pd = P('∅'); nodes.push({ id: '∅', x: pd[0], y: pd[1], label: '∅', cls: 'rn-dead' }); }
    var edges = [];
    function outward(name) {
      var p = P(name), dx = p[0] - DW / 2, dy = p[1] - DH / 2, l = Math.sqrt(dx * dx + dy * dy);
      return l < 1 ? [0, -1] : [dx / l, dy / l];
    }
    st.dfa.states.forEach(function (d) {
      var row = st.dfa.trans[d.name];
      if (!row) return;
      var hot = ev && ev.name === d.name ? ' rn-hot' : '';
      var to = {};
      st.alphabet.forEach(function (sym) {
        var target = row[sym] || (dead ? '∅' : null);
        if (target) (to[target] = to[target] || []).push(sym);
      });
      Object.keys(to).forEach(function (target) {
        var e = { from: d.name, to: target, label: to[target].join(', '), cls: (target === '∅' ? 'rn-dead' : '') + hot };
        if (target === d.name) e.loop = outward(d.name);
        else e.curve = 0.16;
        edges.push(e);
      });
    });
    if (dead) edges.push({ from: '∅', to: '∅', label: st.alphabet.join(', '), cls: 'rn-dead', loop: outward('∅') });
    var g = graph({ W: DW, H: DH, R: DR, nodes: nodes, edges: edges, start: st.dfa.states.length ? 'A' : null,
      startDir: outward('A') });
    g.style.setProperty('--phone-w', '20rem');
    return g;
  }

  // ── the table ──
  function table(st, c) {
    var ev = st.ev && st.ev.kind === 'row' ? st.ev : null;
    var head = h('tr', null, h('th', null, t('colDfa')), h('th', null, t('colSet')),
      st.alphabet.map(function (sym) { return h('th', { translate: 'no', class: 'rn-mono' }, sym); }));
    var rows = st.dfa.states.map(function (d) {
      var row = st.dfa.trans[d.name], marked = !!row;
      var cls = ev && ev.name === d.name ? 'sd-changed' : marked ? '' : 'rn-todo';
      var nameCell = h('td', { translate: 'no' }, d.name === 'A' ? '→ ' : '', h('span', { class: 'rn-name' + (d.accepting ? ' rn-acc' : '') }, d.name));
      var cells = st.alphabet.map(function (sym) {
        if (!marked) return h('td', { class: 'rn-tr' }, '');
        var to = row[sym];
        if (to) return h('td', { class: 'rn-tr', translate: 'no' }, to);
        return h('td', { class: 'rn-tr rn-none', translate: 'no' }, c.params.showDead ? '∅' : '–');
      });
      return h('tr', { class: cls }, nameCell, h('td', { class: 'rn-set', translate: 'no' }, setTight(d.set)), cells);
    });
    if (c.params.showDead && st.dfa.dead) {
      rows.push(h('tr', { class: 'rn-deadrow' }, h('td', { translate: 'no' }, '∅'), h('td', { class: 'rn-set', translate: 'no' }, '∅'),
        st.alphabet.map(function () { return h('td', { translate: 'no' }, '∅'); })));
    }
    return h('table', { class: 'rn-table' }, h('thead', null, head), h('tbody', null, rows));
  }

  // ── the stage is built once; the field keeps its caret and focus while the rest is redrawn ──
  var ui = null;
  function build(stage) {
    var input = h('input', { id: 'rn-regex', type: 'text', class: 'rn-input', maxlength: String(L.MAX_LENGTH), spellcheck: 'false',
      autocomplete: 'off', autocapitalize: 'off', translate: 'no', 'aria-describedby': 'rn-err' });
    input.addEventListener('input', function () { sim.set({ regex: input.value }); sim.first(); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    var err = h('p', { class: 'rn-err', id: 'rn-err', role: 'status' });
    var tokens = h('div', { class: 'rn-row', translate: 'no' });
    var stack = h('div', { class: 'rn-row' });
    var tree = h('div', { class: 'rn-fit' });
    var nfa = h('div', { class: 'rn-fit' });
    var tbl = h('div', { class: 'rn-tablebox' });
    var dfa = h('div', { class: 'rn-fit' });
    var dfaNote = h('p', { class: 'rn-note' });
    var tblNote = h('p', { class: 'rn-note' });
    var root = h('div', { class: 'rn' },
      h('div', { class: 'rn-col' },
        h('div', { class: 'rn-box rn-field' }, h('label', { for: 'rn-regex' }, t('regexLabel')), input,
          h('p', { class: 'rn-note' }, t('regexHint')), err),
        h('div', { class: 'rn-box' }, h('h3', { class: 'rn-head' }, t('tokensHead')), tokens),
        h('div', { class: 'rn-box' }, h('h3', { class: 'rn-head' }, t('stackHead')), stack),
        h('div', { class: 'rn-box rn-grow' }, h('h3', { class: 'rn-head' }, t('treeHead')), tree)),
      h('div', { class: 'rn-right' },
        h('div', { class: 'rn-box' }, h('h3', { class: 'rn-head' }, t('nfaHead')), nfa, h('p', { class: 'rn-note' }, t('mergeNote'))),
        h('div', { class: 'rn-low' },
          h('div', { class: 'rn-box' }, h('h3', { class: 'rn-head' }, t('tableHead')), tbl, tblNote),
          h('div', { class: 'rn-box' }, h('h3', { class: 'rn-head' }, t('dfaHead')), dfa, dfaNote))));
    stage.replaceChildren(root);
    return { root: root, input: input, err: err, tokens: tokens, stack: stack, tree: tree, nfa: nfa, tbl: tbl, tblNote: tblNote, dfa: dfa, dfaNote: dfaNote };
  }

  function errorText(e) {
    if (e.code === 'length') return t.n('err_length', L.MAX_LENGTH);
    if (e.code === 'char') return t('err_char', { ch: e.ch === ' ' ? '␣' : e.ch });
    if (e.code === 'operand' || e.code === 'close') return t('err_' + e.code, { pos: e.at + 1 });
    if (e.code === 'symbols') return t('err_symbols', { n: e.symbols, max: L.MAX_SYMBOLS });
    if (e.code === 'steps') return t('err_steps', { steps: t.n('stepsN', e.steps), max: L.MAX_STEPS });
    return t('err_' + e.code);
  }

  function render(c) {
    var st = c.state;
    if (!ui || !c.stage.contains(ui.root)) ui = build(c.stage);
    var pv = String(c.params.regex == null ? '' : c.params.regex);
    if (ui.input.value !== pv) ui.input.value = pv;
    ui.input.setAttribute('aria-invalid', st.phase === 'error' ? 'true' : 'false');
    ui.err.textContent = st.phase === 'error' ? t('errTitle') + ': ' + errorText(st.error) : '';
    if (st.phase === 'error') {
      [ui.tokens, ui.stack, ui.tree, ui.nfa, ui.tbl, ui.tblNote, ui.dfa, ui.dfaNote].forEach(function (el) { el.replaceChildren(); });
      return;
    }
    var thisTok = st.ev && st.ev.token != null ? st.ev.token : -1;
    ui.tokens.replaceChildren.apply(ui.tokens, st.tokens.map(function (tok, k) {
      return h('span', { class: 'rn-tok' + (k === thisTok ? ' sd-changed' : k >= st.ti ? ' rn-todo' : '') }, tok);
    }));
    if (!st.stack.length) ui.stack.replaceChildren(h('span', { class: 'rn-empty' }, t('stackEmpty')));
    else ui.stack.replaceChildren.apply(ui.stack, st.stack.map(function (f, i) {
      var top = i === st.stack.length - 1;
      return h('span', { class: 'rn-frag' + (top && thisTok >= 0 ? ' sd-changed' : ''), translate: 'no' },
        L.textOf(st.tree, f.node), h('small', null, L.label(st, f.start) + '→' + L.label(st, f.accept)));
    }));
    ui.tree.replaceChildren(treeDrawing(st));
    ui.nfa.replaceChildren(st.nfa.states.length ? nfaDrawing(st, c) : h('p', { class: 'rn-placeholder' }, t('nfaEmpty')));
    ui.tbl.replaceChildren(st.dfa.states.length ? table(st, c) : h('p', { class: 'rn-placeholder' }, t('tableEmpty')));
    ui.dfa.replaceChildren(st.dfa.states.length ? dfaDrawing(st, c) : h('p', { class: 'rn-placeholder' }, t('dfaEmpty')));
    ui.dfaNote.textContent = st.dfa.dead && !c.params.showDead ? t('deadHidden') : '';
    ui.tblNote.textContent = st.dfa.unmarked.length ? t('unmarkedNote') : '';
  }

  // ── captions ──
  /** t.parts, but a node a string uses twice is cloned, so both places show it (a node can be in one place only). */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function caption(c) {
    var st = c.state, ev = st.ev;
    if (st.phase === 'error') return [h('b', null, t('errTitle')), ': ' + errorText(st.error)];
    if (!ev) return parts('capStart', { re: B(st.regex), post: B(st.tokens.join(' ')) });
    var lb = function (id) { return B(L.label(st, id)); };
    var out;
    if (ev.kind === 'row') {
      out = [];
      if (ev.first) out = out.concat(parts('capFirst', { start: B(st.nfa.start), set: B(setText(ev.set)) }), [' ']);
      out = out.concat(parts('capRow', { name: B(ev.name) }), [' ']);
      ev.moves.forEach(function (m, i) {
        if (i) out.push('; ');
        var mv = B('move(' + ev.name + ', ' + m.sym + ') = ' + setOrEmpty(m.move));
        if (!m.to) out = out.concat(parts('capMoveEmpty', { move: mv }));
        else out = out.concat(parts(m.isNew ? 'capMoveNew' : 'capMove', { move: mv, to: B(m.to) }));
      });
      out.push('.');
      if (st.phase === 'done') {
        var n = st.nfa.states.length;
        out = out.concat([' '], parts('capDone', { n: t.n('statesN', st.dfa.states.length), all: B('2' + sup(n) + ' = ' + Math.pow(2, n)) }));
        groupsOf(L.sameRows(st.dfa)).forEach(function (g) { out = out.concat([' '], parts('capSame', { names: B(names(g)) })); });
      }
      return out;
    }
    var n0 = st.tree[ev.token], tok = h('code', null, st.tokens[ev.token]);
    var text = function (k) { return B(L.textOf(st.tree, k)); };
    if (ev.kind === 'sym') {
      out = parts('capSym', { tok: tok, edge: B(L.label(st, ev.added[0]) + ' –' + n0.sym + '→ ' + L.label(st, ev.added[1])) });
    } else if (ev.kind === 'or') {
      out = parts('capOr', { tok: tok, s: text(n0.kids[0]), t: text(n0.kids[1]), i: lb(ev.added[0]), f: lb(ev.added[1]) });
    } else if (ev.kind === 'star') {
      var inner = L.textOf(st.tree, ev.token);
      out = parts('capStar', { tok: tok, s: B(inner.slice(0, -1)), i: lb(ev.added[0]), f: lb(ev.added[1]) });
    } else {
      out = parts('capCat', { tok: tok, s: text(n0.kids[0]), t: text(n0.kids[1]),
        into: B(ev.merged.into), gone: B(st.alias[ev.merged.gone] + '′') });
      var firstCat = st.tokens.indexOf(L.CAT) === ev.token;
      if (firstCat) out = out.concat([' '], parts('capCatAlt'));
    }
    // a new start that a concatenation will merge (sym, union or star): say what the prime means
    if (ev.kind !== 'cat' && st.alias[ev.added[0]] != null) {
      out = out.concat([' '], parts('capStartMerge', { p: lb(ev.added[0]), into: B(st.alias[ev.added[0]]) }));
    }
    if (st.phase === 'subset') {
      out = out.concat([' '], parts('capNfaDone', { n: t.n('statesN', st.nfa.states.length), start: B(st.nfa.start), accept: B(st.nfa.accept) }));
    }
    return out;
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'showDead', type: 'toggle', label: t('showDead'), hint: t('showDeadHint') }
    ],
    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('preset_' + pr.id), hint: t('hint_' + pr.id), params: { regex: pr.regex } };
    }),
    legend: [
      { shape: 'rn-state', label: t('legState') },
      { shape: 'rn-acc', label: t('legAccept') },
      { shape: 'rn-start', label: t('legStart') },
      { shape: 'dash', label: t('legEps') },
      { shape: 'line', label: t('legSym') },
      { shape: 'rn-cur', label: t('legSet') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });

  // ── the typed regex lives in the URL too (the kit keeps only its own params there and leaves other keys alone), so
  //    a reload, a copied link and the language switch keep it ──
  function writeTyped() {
    try {
      var u = new URLSearchParams(window.location.search);
      var pr = sim.preset ? L.PRESETS.filter(function (x) { return x.id === sim.preset; })[0] : null;
      var base = pr ? pr.regex : L.defaults.regex;
      if (sim.params.regex !== base) u.set('regex', sim.params.regex); else u.delete('regex');
      var qs = u.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    } catch (e) { /* file:// in some browsers */ }
  }
  (function readTyped() {
    var q = new URLSearchParams(window.location.search);
    if (!q.has('regex')) return;
    sim.set({ regex: q.get('regex') });
    // the kit clamped ?step= to the default regex's steps before the typed one was known: apply it again
    var n = parseInt(q.get('step'), 10);
    if (n > 0) sim.go(Math.min(n, sim.steps));
  })();
  sim.on(writeTyped);
})();
</script>
</body>
</html>
