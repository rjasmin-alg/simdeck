<!-- TCP three-way handshake: adopted from the URM book's web edition (uvod-u-racunalne-mreze,
     ugradbeno/trostruko-rukovanje.html) into the simdeck kit (docs/sim-ui.md). A stepper: A sends SYN, B answers
     SYN+ACK, A sends ACK; each side's octet line shows why the acknowledgment is X+1. The model is in sim.js, the
     words in strings.js. The sequence chart is drawn here until the kit has its own (kit-sequence-chart). -->

  "concept": { "hr": "SYN, SYN+ACK, ACK: potvrda je redni broj + 1, jer SYN zauzima jedan broj", "en": "SYN, SYN+ACK, ACK: the ack is seq + 1, because the SYN takes one number" }

<style>
/* Page CSS: every selector starts with [data-sim="tcp-handshake"]; colours only from kit tokens. */
[data-sim="tcp-handshake"] .th {
  --side: 22rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4cqh;
  height: 100%;
  padding: 1.5cqh 1.5cqw;
  font-size: 1.25rem;
}
[data-sim="tcp-handshake"] .th-num { font-family: var(--mono); font-weight: 700; white-space: nowrap; }
[data-sim="tcp-handshake"] .th-small { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }

/* the chart: the two ends on top, their lanes, one row per message */
[data-sim="tcp-handshake"] .th-chart {
  display: grid;
  grid-template-columns: var(--side) minmax(0, 1fr) var(--side);
  grid-template-rows: auto repeat(3, auto);
  row-gap: 2.2cqh;
}
[data-sim="tcp-handshake"] .th-lane { grid-row: 2 / span 3; justify-self: center; width: 0.25rem; background: var(--line); }
[data-sim="tcp-handshake"] .th-lane.th-a { grid-column: 1; }
[data-sim="tcp-handshake"] .th-lane.th-b { grid-column: 3; }
[data-sim="tcp-handshake"] .th-end {
  grid-row: 1;
  display: grid;
  grid-template-columns: auto auto;
  justify-content: start;
  gap: 0.1rem 0.7rem;
  padding: 0.5rem 0.8rem;
  border: 0.25rem solid var(--sw);
  border-radius: var(--radius);
  background: var(--panel);
  z-index: 1;
}
[data-sim="tcp-handshake"] .th-end.th-a { grid-column: 1; }
[data-sim="tcp-handshake"] .th-end.th-b { grid-column: 3; }
[data-sim="tcp-handshake"] .th-end > .th-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 0.6rem; }
[data-sim="tcp-handshake"] .th-end .th-name { font-size: var(--fs-lg); font-weight: 700; }
[data-sim="tcp-handshake"] .th-end .th-k { font-size: var(--fs-sm); color: var(--muted); align-self: center; }
[data-sim="tcp-handshake"] .th-end .th-v { justify-self: start; padding: 0 0.2rem; border-radius: 0.15em; }
[data-sim="tcp-handshake"] .th-end .th-v.th-none { font-family: var(--sans); font-weight: 400; font-style: italic; color: var(--muted); }
[data-sim="tcp-handshake"] .th-end .th-status { grid-column: 1 / -1; font-size: var(--fs-sm); font-weight: 700; }
[data-sim="tcp-handshake"] .th-end .th-status.th-no { color: var(--muted); font-weight: 400; }
[data-sim="tcp-handshake"] .th-mid { grid-row: 1; grid-column: 2; display: grid; place-items: center; padding: 0 1rem; }
[data-sim="tcp-handshake"] .th-est { font-weight: 700; padding: 0.3rem 0.8rem; border: 0.25rem solid var(--ok); border-radius: var(--radius); color: var(--ink); }
[data-sim="tcp-handshake"] .th-est::before { content: '✓ '; color: var(--ok); }

/* one message: the step tag outside the lanes, the arrow from lane to lane */
[data-sim="tcp-handshake"] .th-msg {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: calc(var(--side) / 2) minmax(0, 1fr) calc(var(--side) / 2);
  align-items: center;
}
[data-sim="tcp-handshake"] .th-step { grid-column: 1; justify-self: start; font-size: var(--fs-sm); font-weight: 700; color: var(--muted); padding-right: 0.6rem; }
[data-sim="tcp-handshake"] .th-msg.th-now .th-step { color: var(--ink); }
[data-sim="tcp-handshake"] .th-arrow { grid-column: 2; display: flex; flex-direction: column; gap: 0.25rem; color: var(--sw); }
[data-sim="tcp-handshake"] .th-label { align-self: center; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 0.2rem 1.1rem; padding: 0.05rem 0.5rem; color: var(--ink); border-radius: var(--radius-sm); }
[data-sim="tcp-handshake"] .th-msg.th-now .th-label { background: var(--hl); color: var(--on-hl); }
[data-sim="tcp-handshake"] .th-flags { font-family: var(--mono); font-weight: 700; padding: 0 0.4rem; border: var(--line-w) solid currentColor; border-radius: var(--radius-sm); }
[data-sim="tcp-handshake"] .th-field { white-space: nowrap; }
[data-sim="tcp-handshake"] .th-line { position: relative; height: 0.3rem; margin: 0 0.9rem; background: currentColor; }
[data-sim="tcp-handshake"] .th-msg.th-now .th-line { height: 0.55rem; }
[data-sim="tcp-handshake"] .th-line::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 0;
  height: 0;
  border-top: 0.8rem solid transparent;
  border-bottom: 0.8rem solid transparent;
  transform: translateY(-50%);
}
[data-sim="tcp-handshake"] .th-right .th-line::after { right: -0.9rem; border-left: 1.1rem solid currentColor; }
[data-sim="tcp-handshake"] .th-left .th-line::after { left: -0.9rem; border-right: 1.1rem solid currentColor; }
[data-sim="tcp-handshake"] .th-parts { display: flex; justify-content: center; gap: 0.3rem 2.5rem; font-size: var(--fs-sm); font-weight: 700; color: var(--ink); }
[data-sim="tcp-handshake"] .th-later .th-arrow { color: var(--line); }
[data-sim="tcp-handshake"] .th-later .th-line { height: 0; background: none; border-top: 0.2rem dashed currentColor; }
[data-sim="tcp-handshake"] .th-later .th-line::after { display: none; }
[data-sim="tcp-handshake"] .th-later .th-label { color: var(--muted); font-style: italic; }

/* each side's sequence numbers: SYN, first data octet, second octet */
[data-sim="tcp-handshake"] .th-lines { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw; }
[data-sim="tcp-handshake"] .th-seq { display: flex; flex-direction: column; gap: 0.3rem; }
[data-sim="tcp-handshake"] .th-cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
[data-sim="tcp-handshake"] .th-cell { display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
[data-sim="tcp-handshake"] .th-mark { min-height: 1.5em; font-size: var(--fs-sm); font-weight: 700; }
[data-sim="tcp-handshake"] .th-mark:not(:empty)::after { content: ' ▼'; }
[data-sim="tcp-handshake"] .th-box {
  align-self: stretch;
  text-align: center;
  font-size: var(--fs-lg);
  padding: 0.3rem 0.4rem;
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius-sm);
  background-color: var(--bg);
}
[data-sim="tcp-handshake"] .th-box.th-syn { border-style: dashed; }
[data-sim="tcp-handshake"] .th-chip { padding: 0 0.3rem; border-radius: var(--radius-sm); background: var(--bg); }
[data-sim="tcp-handshake"] .th-box.th-syn.th-used { border-style: solid; border-color: var(--sw); }
[data-sim="tcp-handshake"] .th-box.th-wait { border: 0.3rem solid var(--ink); }
[data-sim="tcp-handshake"] .th-cap { font-size: var(--fs-sm); color: var(--muted); text-align: center; }

/* Phone and portrait: the stage grows with its content; the ends stack, the arrows span the width. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="tcp-handshake"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="tcp-handshake"] .th { --side: 0rem; height: auto; gap: 1rem; padding: 0.6rem 0.4rem; }
  [data-sim="tcp-handshake"] .th-chart { grid-template-columns: 1fr 1fr; grid-template-rows: none; row-gap: 0.8rem; column-gap: 0.4rem; }
  [data-sim="tcp-handshake"] .th-lane { display: none; }
  [data-sim="tcp-handshake"] .th-end { grid-template-columns: 1fr; padding: 0.4rem 0.5rem; }
  [data-sim="tcp-handshake"] .th-end.th-b { grid-column: 2; }
  [data-sim="tcp-handshake"] .th-mid { grid-row: auto; grid-column: 1 / -1; }
  [data-sim="tcp-handshake"] .th-mid:empty { display: none; }
  [data-sim="tcp-handshake"] .th-msg { grid-template-columns: 1fr; gap: 0.2rem; }
  [data-sim="tcp-handshake"] .th-step, [data-sim="tcp-handshake"] .th-arrow { grid-column: 1; }
  [data-sim="tcp-handshake"] .th-label { gap: 0.1rem 0.6rem; }
  [data-sim="tcp-handshake"] .th-parts { flex-direction: column; gap: 0.1rem; }
  [data-sim="tcp-handshake"] .th-lines { grid-template-columns: 1fr; gap: 0.8rem; }
  [data-sim="tcp-handshake"] .th-cells { gap: 0.25rem; }
  [data-sim="tcp-handshake"] .th-box { padding: 0.2rem 0.1rem; font-size: var(--fs-sm); }
}
</style>

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">TCP: trostruko rukovanje</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var COLOUR = { A: '1', B: '2' };
  var OTHER = { A: 'B', B: 'A' };
  var STEP_TAG = ['step1', 'step23', 'step4'];

  function num(v, cls) { return h('span', { translate: 'no', class: 'th-num' + (cls ? ' ' + cls : '') }, String(v)); }
  function bold(v) { return h('b', { translate: 'no' }, String(v)); }
  function data(v) { return h('span', { translate: 'no' }, v); }

  /** The sliders apply only to isn 'own'; the other choices bring their own pair. */
  function ownOnly(p) { return p.isn === 'own' ? false : t('slidersOff'); }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { isn: 'own', x: 4000, y: 9500 } },
    { id: 'small', label: t('presetSmall'), hint: t('presetSmallHint'), params: { isn: 'own', x: 100, y: 500 } },
    { id: 'merged', label: t('presetMerged'), hint: t('presetMergedHint'), params: { isn: 'own', x: 4000, y: 9500 }, step: 2 },
    { id: 'own-number', label: t('presetOwn'), hint: t('presetOwnHint'), params: { isn: 'own', x: 4000, y: 4000 } },
    { id: 'real', label: t('presetReal'), hint: t('presetRealHint'), params: { isn: 'real', x: 4000, y: 9500 } },
    { id: 'wrap', label: t('presetWrap'), hint: t('presetWrapHint'), params: { isn: 'wrap', x: 4000, y: 9500 } }
  ];

  /** One side's card: name and role, its ISN, the next number it sends, what it expects, whether it is confirmed. */
  function end(k, side, prev) {
    function val(v, pv) {
      if (v === null) return h('span', { class: 'th-v th-num th-none' }, t('unknown'));
      return num(v, 'th-v' + (prev && pv !== v ? ' sd-changed' : ''));
    }
    return h('div', { class: 'th-end th-' + k.toLowerCase(), dataset: { c: COLOUR[k] } },
      h('div', { class: 'th-head' }, h('span', { class: 'th-name', translate: 'no' }, k), h('span', { class: 'th-small' }, t(k === 'A' ? 'client' : 'server'))),
      h('span', { class: 'th-k' }, t('iss'), ' ', data(k === 'A' ? 'X' : 'Y')), num(side.iss, 'th-v'),
      h('span', { class: 'th-k' }, t('sndNxt')), val(side.sndNxt, prev && prev.sndNxt),
      h('span', { class: 'th-k' }, t('rcvNxt', { other: OTHER[k] })), val(side.rcvNxt, prev && prev.rcvNxt),
      side.acked
        ? h('span', { class: 'th-status' + (prev && !prev.acked ? ' sd-hl' : '') }, '✓ ', t('acked', { other: OTHER[k] }))
        : h('span', { class: 'th-status th-no' }, '○ ', t('notAcked')));
  }

  /** One message row: sent (solid, coloured by its sender), the current one (highlighted, thicker) or not yet sent. */
  function message(seg, i, s, c) {
    var sent = i < s.sent, now = i === s.sent - 1;
    var label, parts = null;
    if (!sent) label = h('div', { class: 'th-label' }, t('notYet'));
    else {
      label = h('div', { class: 'th-label' },
        h('span', { class: 'th-flags', translate: 'no' }, seg.flags.join('+')),
        h('span', { class: 'th-field' }, t('seqField'), ' = ', num(seg.seq)),
        seg.ack !== null ? h('span', { class: 'th-field' }, t('ackField'), ' = ', num(seg.ack)) : null);
      if (seg.concept.length > 1) parts = h('div', { class: 'th-parts' }, h('span', null, t('part2')), h('span', null, t('part3')));
    }
    var cls = 'th-msg th-' + (seg.from === 'A' ? 'right' : 'left') + (now ? ' th-now' : '') + (sent ? '' : ' th-later');
    var arrow = h('div', { class: 'th-arrow' + (now && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { c: COLOUR[seg.from] } },
      label, h('div', { class: 'th-line', 'aria-hidden': 'true' }), parts);
    return h('div', { class: cls, style: { gridRow: String(i + 2) } }, h('span', { class: 'th-step' }, t(STEP_TAG[i])), arrow);
  }

  /** The octets side k sends: its ISN (taken by the SYN), the first data octet, the second; the other side's
      "waits for" mark sits on the number it expects. */
  function seqLine(k, s) {
    var iss = s[k].iss, waits = s[OTHER[k]].rcvNxt, synSent = s.segs.some(function (g, i) { return i < s.sent && g.from === k && g.flags.indexOf('SYN') >= 0; });
    var caps = ['cellSyn', 'cellFirst', 'cellNext'];
    var cells = [0, 1, 2].map(function (d) {
      var v = L.seqAdd(iss, d), wait = waits !== null && waits === v;
      var cls = 'th-box th-num' + (d === 0 ? ' th-syn' + (synSent ? ' th-used sd-hatch' : '') : '') + (wait ? ' th-wait' : '');
      return h('div', { class: 'th-cell' },
        h('span', { class: 'th-mark' }, wait ? t('expects', { who: OTHER[k] }) : ''),
        h('span', { class: cls, translate: 'no', dataset: { c: COLOUR[k] } }, h('span', { class: 'th-chip' }, String(v))),
        h('span', { class: 'th-cap' }, t(caps[d])));
    });
    return h('div', { class: 'th-seq' }, h('span', { class: 'th-small' }, t(k === 'A' ? 'lineA' : 'lineB')), h('div', { class: 'th-cells' }, cells));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'isn', type: 'choice', label: t('isn'), options: [['own', t('isnOwn')], ['real', t('isnReal')], ['wrap', t('isnWrap')]] },
      { key: 'x', type: 'range', label: t('x'), min: L.min, max: L.max, step: 1, disabled: ownOnly },
      { key: 'y', type: 'range', label: t('y'), min: L.min, max: L.max, step: 1, disabled: ownOnly }
    ],

    presets: presets,

    legend: [
      { c: 1, label: t('legendA') },
      { c: 2, label: t('legendB') },
      { shape: 'hl', label: t('legendNow') },
      { shape: 'hollow', label: t('legendLater') }
    ],

    render: function (c) {
      var s = c.state, p = c.prev;
      var chart = h('div', { class: 'th-chart' },
        h('div', { class: 'th-lane th-a', 'aria-hidden': 'true' }),
        h('div', { class: 'th-lane th-b', 'aria-hidden': 'true' }),
        end('A', s.A, p && p.A),
        h('div', { class: 'th-mid' }, s.established ? h('span', { class: 'th-est' + (c.dir === 'forward' ? ' sd-anim-in' : '') }, t('established')) : null),
        end('B', s.B, p && p.B),
        s.segs.map(function (g, i) { return message(g, i, s, c); }));
      var lines = h('div', { class: 'th-lines' }, seqLine('A', s), seqLine('B', s));
      c.stage.replaceChildren(h('div', { class: 'th' }, chart, lines));
    },

    caption: function (c) {
      var s = c.state;
      var v = { x: bold(s.x), x1: bold(L.seqAdd(s.x, 1)), y: bold(s.y), y1: bold(L.seqAdd(s.y, 1)) };
      if (c.first) return t.parts('captionStart', v);
      var out = t.parts('caption' + s.sent, v);
      var wrapX = s.wrapsX && (s.sent === 1 || s.sent === 2), wrapY = s.wrapsY && (s.sent === 2 || s.sent === 3);
      if (wrapX || wrapY) {
        var last = wrapX ? s.x : s.y;
        out = out.concat([' ', h('span', { class: 'sd-hl' }, t.parts('captionWrap', { last: bold(last), zero: bold(L.seqAdd(last, 1)) }))]);
      }
      return out;
    }
  });
})();
</script>
</body>
