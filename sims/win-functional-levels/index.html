<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var PRESET_KEY = { quillmoor: 'presetQuillmoor', 'upgraded-dcs': 'presetUpgraded', 'old-dc-present': 'presetOld', 'recycle-bin': 'presetRb' };

  /** Data (names of domains and DCs, version numbers) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  /** Parts of a string with *English term* turned into <em lang="en"> (the Croatian term rule). Placeholder nodes are
      cloned, so one vars object may serve several sentences. */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars || {}).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p.cloneNode(true)); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return h('span', null, out);
  }
  /** '2012R2' → '2012 R2'. */
  function ver(v) { return String(v).replace('R2', ' R2'); }
  function lvl(v) { return data(ver(v)); }
  function verList(list) { return data(list.map(ver).join(', ')); }
  function dname(d) { return L.domain(d).name; }
  /** The ladder as a sentence subject: "Domena quillmoor.example" / "Šuma". */
  function ladderCap(ladder) { return ladder === 'forest' ? h('span', null, t('ladCapForest')) : rich('ladCapDomain', { d: data(dname(ladder)) }); }
  function osRange(os) {
    var at = L.LEVELS.filter(function (l) { return L.supports(os, l); });
    return { from: lvl(at[0]), to: lvl(at[at.length - 1]) };
  }
  function dcOf(s, id) { return s.dcs.filter(function (x) { return x.id === id; })[0] || null; }

  // ── ladders ──
  function blockerShort(c) {
    var names = c.dcs.concat(c.domains.map(function (d) { return dname(d).split('.')[0]; }));
    if (!names.length) return '';
    var first = h('span', { class: 'fl-nw', translate: 'no' }, '✕ ' + names[0]);
    return names.length > 1 ? [first, ' ', h('span', { class: 'fl-nw' }, t('markMore', { n: names.length - 1 }))] : first;
  }
  function rungButton(c, ladder, level) {
    var s = c.state;
    var st = L.rungState(s, ladder, level);
    var chk = L.check(s, ladder, level);
    var sel = s.selected && s.selected.ladder === ladder && s.selected.level === level;
    var changed = s.last && s.last.action === 'set' && s.last.ok && s.last.ladder === ladder && s.last.target === level;
    var mark = st === 'current' ? t('markNow') : st === 'below' ? '✓' : st === 'raise-ok' ? '↑' : blockerShort(chk);
    var stWord = t(st === 'current' ? 'stNow' : st === 'below' ? 'stBelow' : st === 'raise-ok' ? 'stOk' : 'stNo');
    var lbl = t('rungLabel', { ladder: ladder === 'forest' ? t('ladForestName') : dname(ladder), level: ver(level), state: stWord });
    return h('li', null, h('button', {
      type: 'button', class: 'fl-rung' + (changed ? ' sd-changed' : ''),
      dataset: { st: st, rung: ladder + ':' + level }, 'aria-pressed': sel ? 'true' : 'false', 'aria-label': lbl, title: lbl
    }, h('span', { class: 'fl-lvl', translate: 'no' }, ver(level)), h('span', { class: 'fl-mark' }, mark)));
  }
  function ladderBox(c, ladder) {
    var s = c.state;
    var items = [];
    L.LEVELS.slice().reverse().forEach(function (level) {
      items.push(rungButton(c, ladder, level));
      if (level === '2025') items.push(h('li', { class: 'fl-gap', 'aria-hidden': 'true' }, t('noOwnLevel')));
    });
    var head = ladder === 'forest'
      ? h('div', { class: 'fl-lhead' }, h('span', { class: 'fl-sub' }, t('ladForest')), h('span', { class: 'fl-lname', translate: 'no' }, dname('q')),
        h('span', { class: 'fl-rb' + (s.last && s.last.action === 'rb' && s.last.ok ? ' sd-hl' : ''), dataset: { on: String(s.rb) } }, t(s.rb ? 'rbOn' : 'rbOff')))
      : h('div', { class: 'fl-lhead' }, h('span', { class: 'fl-sub' }, t('ladDomain')), h('span', { class: 'fl-lname', translate: 'no' }, dname(ladder)));
    var dcs = ladder === 'forest' ? null : h('div', { class: 'fl-dcs' }, h('h3', { class: 'fl-sub' }, t('dcsTitle')),
      s.dcs.filter(function (x) { return x.domain === ladder; }).map(function (x) { return dcChip(c, x); }));
    return h('section', { class: 'fl-box fl-ladder' }, head, h('ul', { class: 'fl-rungs' }, items), dcs);
  }

  // ── DCs ──
  function dcChip(c, x) {
    var s = c.state;
    var sel = s.selected && s.selected.dc === x.id;
    var changed = s.last && s.last.action === 'os' && s.last.ok && s.last.dc === x.id;
    var tags = [];
    if (x.extra) tags.push(h('span', { class: 'fl-tag' }, t('dcNew')), ' ', h('span', { class: 'fl-tag', dataset: { ok: String(x.joined) } }, x.joined ? '✓ ' : '✕ ', t(x.joined ? 'dcPromoted' : 'dcRefused')));
    else if (!x.fits) tags.push(h('span', { class: 'fl-tag', dataset: { ok: 'false' } }, '⚠ ', t('dcUnfit')));
    return h('button', {
      type: 'button', class: 'fl-dc' + (changed ? ' sd-changed' : ''), dataset: { dc: x.id, extra: String(!!x.extra), joined: String(x.joined) },
      'aria-pressed': sel ? 'true' : 'false'
    }, h('span', { class: 'fl-dcline' }, h('b', { translate: 'no' }, x.id), ' ', rich('dcOs', { os: lvl(x.os) })), tags.length ? h('span', { class: 'fl-dctags' }, tags) : null);
  }

  // ── the card ──
  function li(sign, content) {
    var ch = { plus: '+', minus: '−', x: '✕', dot: '·' }[sign];
    return h('li', null, h('span', { class: 'fl-sign', dataset: { k: sign }, 'aria-hidden': 'true' }, ch), h('span', null, content));
  }
  function actBtn(label, action, ok, primary) {
    return h('button', { type: 'button', class: 'sd-btn' + (primary && ok ? ' sd-btn--primary' : ''), dataset: { act: JSON.stringify(action) },
      'aria-disabled': ok ? 'false' : 'true' }, label);
  }
  function blockers(s, chk) {
    var out = [];
    chk.dcs.forEach(function (id) { out.push(li('x', rich('blkDc', { dc: data(id), os: lvl(dcOf(s, id).os) }))); });
    chk.domains.forEach(function (d) { out.push(li('x', rich('blkDomain', { d: data(dname(d)), level: lvl(s.levels[d]) }))); });
    if (chk.forest) out.push(li('x', rich('blkForest', { level: lvl(s.forest) })));
    if (chk.rollback === 'one-way') out.push(li('x', rich('blkOneWay')));
    if (chk.rollback === 'recycle-bin') out.push(li('x', rich('blkRb')));
    if (chk.rollback === 'undocumented') out.push(li('x', rich('blkUndoc', { level: lvl(L.levelOf(s, chk.ladder)) })));
    return out;
  }
  function rungCard(c, ladder, level) {
    var s = c.state;
    var r = L.rung(ladder, level);
    var chk = L.check(s, ladder, level);
    var st = L.rungState(s, ladder, level);
    var status = st === 'current' ? ['statusCurrent', true] : chk.kind === 'raise' ? [chk.ok ? 'statusOk' : 'statusNo', chk.ok] : [chk.ok ? 'statusLowerOk' : 'statusLowerNo', chk.ok];
    var parts = [h('h2', null, rich('cardRungTitle', { ladder: ladder === 'forest' ? h('span', null, t('ladCapForest')) : rich('ladCapDomain', { d: data(dname(ladder)) }), level: lvl(level) })),
      h('span', { class: 'fl-status', dataset: { ok: String(status[1]) } }, (status[1] ? '' : '✕ ') + t(status[0]))];
    parts.push(h('div', null, h('h3', null, t('hUnlocks')), r.unlocks.length
      ? h('ul', { class: 'fl-list' }, r.unlocks.map(function (f) { return li('plus', rich('f_' + f)); }))
      : h('p', { class: 'fl-none' }, t('nothingNew'))));
    var outs = [];
    var below = r.ruledOut.below;
    if (below.length) outs.push(li('minus', below.length > 1 ? rich('roBelowOlder', { v: lvl(below[below.length - 1]) }) : rich('roBelow', { list: verList(below) })));
    if (r.ruledOut.above.length) outs.push(li('minus', rich('roAbove', { list: verList(r.ruledOut.above) })));
    r.rulesOut.forEach(function (x) { outs.push(li('minus', rich('x_' + x))); });
    parts.push(h('div', null, h('h3', null, t('hRulesOut')), outs.length ? h('ul', { class: 'fl-list' }, outs) : h('p', { class: 'fl-none' }, t('roNone'))));
    parts.push(h('p', { class: 'fl-note' }, rich('canRun', { list: verList(r.oses) })));
    if (level === '2016') parts.push(h('p', { class: 'fl-note' }, t('noOwn')));
    var blk = blockers(s, chk);
    if (blk.length) parts.push(h('div', null, h('h3', null, t('hBlocked')), h('ul', { class: 'fl-list' }, blk)));
    var acts = [];
    if (st !== 'current') acts.push(actBtn(rich(chk.kind === 'raise' ? 'btnRaise' : 'btnLower', { level: lvl(level) }), { action: 'set', ladder: ladder, target: level }, chk.ok, true));
    if (ladder === 'forest' && level === '2008R2') {
      parts.push(h('p', { class: 'fl-note' }, t(s.rb ? 'rbIsOn' : 'rbNote')));
      if (!s.rb) acts.push(actBtn(t('btnRb'), { action: 'rb' }, L.recycleBin(s).ok, false));
    }
    if (acts.length) parts.push(h('div', { class: 'fl-acts' }, acts));
    return parts;
  }
  function dcCard(c, id) {
    var s = c.state, x = dcOf(s, id);
    var rg = osRange(x.os);
    var parts = [h('h2', null, data(x.id)), h('p', null, rich('dcRuns', { os: lvl(x.os), d: data(dname(x.domain)) })), h('p', null, rich('dcRange', rg))];
    if (x.extra) {
      parts.push(h('p', null, x.joined ? rich('extraOk', { os: lvl(x.os) })
        : rich(x.refused === 'forest' ? 'extraNoForest' : 'extraNoDomain', Object.assign({ level: lvl(x.refusedAt), os: lvl(x.os) }, rg))));
      parts.push(h('p', { class: 'fl-note' }, t('extraHint')));
      return parts;
    }
    var up = L.LEVELS[L.idx(s.levels[x.domain]) + 1];
    var blocks = up && L.check(s, x.domain, up).dcs.indexOf(x.id) >= 0;
    parts.push(h('p', null, blocks ? rich('dcBlocks', { d: data(dname(x.domain)), level: lvl(up) }) : t('dcBlocksNone')));
    var acts = L.REPLACE_WITH.filter(function (o) { return o !== x.os; }).map(function (o) {
      return actBtn(rich('btnReplace', { os: lvl(o) }), { action: 'os', dc: x.id, target: o }, L.canRun(s, o, x.domain).ok, false);
    });
    parts.push(h('p', { class: 'fl-note' }, t('dcReplaceNote')));
    if (acts.length) parts.push(h('div', { class: 'fl-acts' }, acts));
    return parts;
  }
  function introCard(c) {
    var s = c.state;
    return [h('h2', null, t('cardIntroTitle')), h('p', null, t('cardIntro')),
      h('h3', null, t('cardNow')), h('ul', { class: 'fl-list' },
        L.DOMAINS.map(function (d) { return li('dot', [h('span', null, t('ladDomain')), ' ', data(d.name + ': ' + ver(s.levels[d.id]))]); })
          .concat([li('dot', [h('span', null, t('ladForest')), data(': ' + ver(s.forest))])]))];
  }
  function card(c) {
    var s = c.state, sel = s.selected;
    var body = !sel ? introCard(c) : sel.dc ? dcCard(c, sel.dc) : rungCard(c, sel.ladder, sel.level);
    return h('aside', { class: 'fl-box fl-card' }, body);
  }

  // ── captions ──
  /** "qm-dc01, qm-dc02, brk-dc03" and their OS, or each with its own when they differ. */
  function dcBlockedCap(s, chk, keyAll, keyMixed, vars) {
    var oses = chk.dcs.map(function (id) { return dcOf(s, id).os; });
    var same = oses.every(function (o) { return o === oses[0]; });
    if (same) return rich(keyAll, Object.assign({ n: chk.dcs.length, dcs: data(chk.dcs.join(', ')), os: lvl(oses[0]) }, vars));
    return rich(keyMixed, Object.assign({ dcs: data(chk.dcs.map(function (id, i) { return id + ' (' + ver(oses[i]) + ')'; }).join(', ')) }, vars));
  }
  function refusalCap(s, chk) {
    var out = [];
    var v = { level: lvl(chk.target) };
    if (chk.kind === 'raise') {
      if (chk.ladder === 'forest') {
        if (chk.dcs.length) out.push(dcBlockedCap(s, chk, 'capForestDcs', 'capForestDcsMixed', v));
        if (chk.domains.length) out.push(rich('capForestDomains', { level: lvl(chk.target), list: data(chk.domains.map(function (d) { return dname(d) + ' (' + ver(s.levels[d]) + ')'; }).join(', ')) }));
      } else {
        out.push(dcBlockedCap(s, chk, 'capDcBlocked', 'capDcBlockedMixed', Object.assign({ d: data(dname(chk.ladder)) }, v)));
      }
    } else if (chk.rollback === 'recycle-bin') out.push(rich('capLowerRb'));
    else if (chk.rollback === 'undocumented') out.push(rich('capLowerUndoc', { from: lvl(L.levelOf(s, chk.ladder)) }));
    else if (chk.rollback) out.push(rich('capLowerOneWay', v));
    else if (chk.forest) out.push(rich(L.rollback('forest', s.forest, chk.target, s.rb).ok ? 'capLowerForest' : 'capLowerForestStuck', { level: lvl(s.forest) }));
    return out;
  }
  function rungCap(s, ladder, level) {
    var st = L.rungState(s, ladder, level);
    var chk = L.check(s, ladder, level);
    var v = { ladder: ladderCap(ladder), level: lvl(level) };
    if (st === 'current') return [rich('capCurrent', v)];
    if (chk.kind === 'raise' && chk.ok) {
      var noOwn = level === '2016' && s.dcs.some(function (x) { return x.joined && x.os === '2022'; });
      return [rich(noOwn ? 'capRaiseOkNoOwn' : 'capRaiseOk', v)];
    }
    if (chk.kind === 'raise') return refusalCap(s, chk);
    if (chk.ok) return [rich('capBelow', v), rich('capLowerOk', v)];
    return [rich('capBelow', v)].concat(refusalCap(s, chk));
  }
  function lastCap(s, e) {
    if (e.action === 'set') {
      if (!e.ok) return refusalCap(s, L.check(s, e.ladder, e.target));
      return [rich(e.up ? 'capRaised' : 'capLowered', { ladder: ladderCap(e.ladder), level: lvl(e.target) })];
    }
    if (e.action === 'os') {
      var x = dcOf(s, e.dc);
      if (e.ok) return [rich('capReplaced', { dc: data(e.dc), os: lvl(e.target) })];
      var run = L.canRun(s, e.target, x.domain);
      return [rich(run.reason === 'forest' ? 'capReplaceNoForest' : 'capReplaceNoDomain', Object.assign({ dc: data(e.dc), os: lvl(e.target), level: lvl(run.level) }, osRange(e.target)))];
    }
    return [rich(e.ok ? 'capRbOn' : 'capRbNo')];
  }
  function caption(c) {
    var s = c.state;
    var out;
    if (s.last) out = lastCap(s, s.last);
    else if (s.selected && s.selected.dc) {
      var x = dcOf(s, s.selected.dc);
      out = [rich('capDc', Object.assign({ dc: data(x.id), os: lvl(x.os) }, osRange(x.os)))];
    } else if (s.selected) out = rungCap(s, s.selected.ladder, s.selected.level);
    else out = [rich('capIntro')];
    if (s.extra && !(s.selected && s.selected.dc === s.extra.id)) {
      out.push(s.extra.joined ? rich('capExtraOk', { dc: data(s.extra.id) })
        : rich(s.extra.refused === 'forest' ? 'capExtraNoForest' : 'capExtraNoDomain', { dc: data(s.extra.id), os: lvl(s.extra.os), level: lvl(s.extra.refusedAt) }));
    }
    var joined = [];
    out.forEach(function (p, i) { if (i) joined.push(' '); joined.push(p); });
    return joined;
  }

  // ── clicks: the stage's buttons set hidden params ──
  var wired = null;
  function wire(stage) {
    if (wired === stage) return;
    wired = stage;
    stage.addEventListener('click', function (e) {
      var sim = window.simdeck;
      var b = e.target.closest('[data-act]');
      if (b) {
        var a = JSON.parse(b.dataset.act);
        var patch = L.act(sim.params, a);
        if (Object.keys(patch).length) sim.set(patch);
        return;
      }
      var r = e.target.closest('[data-rung]');
      if (r) { sim.set({ sel: r.dataset.rung, last: '' }); return; }
      var d = e.target.closest('[data-dc]');
      if (d) sim.set({ sel: 'dc:' + d.dataset.dc, last: '' });
    });
  }
  function focusKey() {
    var a = document.activeElement;
    if (!a || !a.dataset) return null;
    if (a.dataset.act) return '[data-act="' + a.dataset.act.replace(/"/g, '\\"') + '"]';
    if (a.dataset.rung) return '[data-rung="' + a.dataset.rung + '"]';
    if (a.dataset.dc) return '[data-dc="' + a.dataset.dc + '"]';
    return null;
  }

  // ── hidden params: the stage's state, kept in the URL like any param ──
  function opts(values) { return values.map(function (v) { return [v, v || '-']; }); }
  function hiddenSelect(key, values) { return { key: key, type: 'select', label: t('hidden'), options: opts(values), visible: function () { return false; } }; }
  var OS_IDS = L.OSES.map(function (o) { return o.id; });

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'extraDc', type: 'choice', label: t('pExtra'), hint: t('pExtraHint'),
        options: L.EXTRA_OPTIONS.map(function (v) { return [v, v === 'none' ? t('extraNone') : data(ver(v))]; }) },
      hiddenSelect('dq', L.LEVELS), hiddenSelect('dt', L.LEVELS), hiddenSelect('fl', L.LEVELS),
      hiddenSelect('o1', OS_IDS), hiddenSelect('o2', OS_IDS), hiddenSelect('o3', OS_IDS), hiddenSelect('o4', OS_IDS),
      hiddenSelect('rb', ['off', 'on']),
      hiddenSelect('sel', L.selValues()),
      hiddenSelect('last', L.lastValues())
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(PRESET_KEY[x.id]), hint: t(PRESET_KEY[x.id] + 'Hint'), params: x.params };
    }),

    legend: [
      { shape: 'fl-current', label: t('legCurrent') },
      { shape: 'fl-ok', label: t('legAllowed') },
      { shape: 'fl-no', label: t('legBlocked') },
      { shape: 'fl-plus', label: t('legUnlock') },
      { shape: 'fl-minus', label: t('legRuledOut') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var keep = focusKey();
      c.stage.replaceChildren(h('div', { class: 'fl' },
        h('div', { class: 'fl-ladders' }, L.LADDERS.map(function (l) { return ladderBox(c, l); })),
        card(c)));
      wire(c.stage);
      if (keep) {
        var el = c.stage.querySelector(keep);
        // a successful action removes its button: focus the rung or DC it acted on instead
        if (!el && /^\[data-act=/.test(keep)) {
          var e = c.state.last;
          el = e && e.action === 'set' ? c.stage.querySelector('[data-rung="' + e.ladder + ':' + e.target + '"]')
            : e && e.action === 'os' ? c.stage.querySelector('[data-dc="' + e.dc + '"]')
            : c.stage.querySelector('[data-rung="forest:2008R2"]');
        }
        if (el) el.focus({ preventScroll: true });
      }
    },

    caption: caption
  });
})();
</script>
</body>
</html>
