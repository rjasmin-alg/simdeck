    if (sc === 'sym') {
      big = h('div', { class: 'sa-big' }, num(cnt.total, ch), h('span', null, t.n('sharedKeysN', cnt.total)),
        j ? h('span', { class: 'sa-delta-row' }, h('span', { class: 'sa-delta' }, t.n('addedN', j.sym))) : null);
      secret = h('div', { class: 'sa-secret' }, h('b', null, String(cnt.secretTransfers)), h('span', null, t.n('secretN', cnt.secretTransfers)));
    } else {
      big = h('div', { class: 'sa-big' }, num(cnt.pairs, ch), h('span', null, t.n('pairsN', cnt.pairs) + ' ='), num(cnt.total, ch),
        h('span', null, t.n('keysN', cnt.total)), j ? h('span', { class: 'sa-delta-row' }, h('span', { class: 'sa-delta' }, t('addedPair'))) : null);
      secret = h('div', { class: 'sa-secret', 'data-none': '' }, h('b', null, '0'), h('span', null, t('secretNone')));
    }
    return h('div', { class: 'sa-card', dataset: { sc: sc } },
      h('div', { class: 'sa-cardhead' }, h('h3', null, t(sc === 'sym' ? 'schemeSym' : 'schemeAsym')), h('span', null, t(sc === 'sym' ? 'symSub' : 'asymSub'))),
      sc === 'sym' ? symRing(s) : asymRing(s),
      h('div', { class: 'sa-counts' }, big, secret));
  }

  // ---- lanes ----
  function keyChip(k, changed) {
    return h('span', { class: 'sa-key' + (changed ? ' sd-changed' : ''), title: keyLabel(k), 'aria-label': keyLabel(k) },
      icon(keyKind(k), false), h('span', { translate: 'no' }, keyText(k)));
  }
  function sessionChip(changed) {
    return h('span', { class: 'sa-key' + (changed ? ' sd-changed' : ''), 'aria-label': t('keySession') },
      icon('session', false), h('span', { translate: 'no' }, 'S'));
  }
  /** Keys a person holds that matter in this scheme's lane. */
  function held(s, sc, who) {
    return s.keys.filter(function (k) {
      if (!k.made) return false;
      if (sc === 'sym') return k.kind === 'shared' && has(k.pair, who);
      if (k.kind === 'public') return true;            // anyone may take a public key
      return k.kind === 'private' && k.owner === who;  // a private key stays with its owner
    });
  }
  function textOf(m) { return m.id === 'sym2' || m.id === 'asym2' ? t('replyText') : t('msgText'); }
  function usedIcon(s, keyId) {
    if (keyId === 'session') return h('span', { class: 'sa-key' }, icon('session', false), h('span', { translate: 'no' }, 'S'));
    return keyChip(L.find(s.keys, keyId), false);
  }
  function plainChip(m, text, changed, keyId, s) {
    return h('span', { class: 'sa-chip' + (changed ? ' sd-changed' : ''), dataset: { k: 'plain' } },
      icon('plain', false), h('span', null, text), keyId ? usedIcon(s, keyId) : null);
  }
  function cipherChip(s, m, changed, times) {
    return h('span', { class: 'sa-chip' + (changed ? ' sd-changed' : ''), dataset: { k: 'cipher' } },
      times ? h('b', { translate: 'no' }, times + ' ×') : null,
      icon('cipher', false), h('span', { class: 'sa-data', translate: 'no' }, CIPHER[m.id] + '…'), usedIcon(s, m.keyUsed));
  }
  function personCell(s, sc, who, extra) {
    return h('div', { class: 'sa-cell' }, h('span', { class: 'sa-who' }, name(who)),
      held(s, sc, who).map(function (k) { return keyChip(k, has(s.changed, k.id)); }), extra);
  }
  function eveCell(s, sc, msgs) {
    var c = s.changed;
    var keys = s.eve.keys.map(function (id) { return L.find(s.keys, id); })
      .filter(function (k) { return k && (sc === 'sym' ? k.kind === 'shared' : k.kind === 'public'); });
    var copies = msgs.filter(function (m) { return m.eveCopy; });
    var kids = keys.map(function (k) { return keyChip(k, has(c, 'eve-' + k.id)); });
    if (sc === 'hybrid') {
      if (copies.length) kids.push(cipherChip(s, copies[0], true), cipherChip(s, copies[1], true, copies.length - 1));
    } else copies.forEach(function (m) { kids.push(cipherChip(s, m, has(c, 'eve-' + m.id))); });
    if (copies.length) {
      var reads = copies.some(function (m) { return m.eveCanRead; });
      kids.push(reads
        ? h('span', { class: 'sa-verdict', 'data-read': '' }, '✓ ' + t('eveReads') + ':', h('span', null, textOf(copies[copies.length - 1])))
        : h('span', { class: 'sa-verdict', 'data-safe': '' }, '✕ ' + t('eveCannot')));
    }
    if (!kids.length) kids.push(h('span', { class: 'sa-muted' }, t('nothing')));
    return h('div', { class: 'sa-cell' }, kids);
  }
  function laneRows(s, sc, p) {
    var c = s.changed, lane = s.lanes[sc], msgs = lane.msgs, rows = [];
    var label = h('div', { class: 'sa-scheme', dataset: { sc: sc } },
      t({ sym: 'schemeSym', asym: 'schemeAsym', hybrid: 'schemeHybrid' }[sc]));
    if (sc === 'hybrid') {
      var wrap = msgs[0], data = msgs.slice(1);
      rows.push(label,
        personCell(s, 'asym', L.ALICE, sessionChip(false)),
        h('div', { class: 'sa-cell sa-wire' }, cipherChip(s, wrap, true), cipherChip(s, data[0], true, data.length),
          h('small', { class: 'sa-muted' }, t('hybOps', { n: data.length }))),
        personCell(s, 'asym', L.BOB, [sessionChip(true), plainChip(data[0], t.n('hybData', data.length), true, 'session', s)]),
        eveCell(s, sc, msgs));
      return rows;
    }
    var list = msgs.length ? msgs : [null];
    list.forEach(function (m, i) {
      var from = m ? m.from : L.ALICE, to = m ? m.to : L.BOB;
      var ch = m && has(c, 'm-' + m.id);
      var atFrom = null, wire = [], atTo = null;
      if (m && m.stage === 'plain') atFrom = [h('small', { class: 'sa-muted' }, t('wantsTo')), plainChip(m, textOf(m), ch)];
      if (m && m.stage === 'enc') atFrom = cipherChip(s, m, ch);
      if (m && (m.stage === 'wire' || m.whole)) wire.push(cipherChip(s, m, ch));
      if (m && m.stage === 'read') atTo = plainChip(m, textOf(m), ch, m.decryptedWith, s);
      if (i === 0 && s.phase === 'carry' && sc === 'sym') {
        var k = L.find(s.keys, L.sharedId(L.ALICE, L.BOB));
        wire.push(p.eveHasSharedKey
          ? h('span', { class: 'sa-chip sd-changed' }, keyChip(k, false), icon('eye', false), h('small', null, t('stolenChannel')))
          : h('span', { class: 'sa-chip sd-changed' }, keyChip(k, false), h('small', null, t('secureChannel'))));
      }
      if (i === 0 && s.phase === 'publish' && sc === 'asym') {
        wire.push(h('span', { class: 'sa-chip sd-changed' }, keyChip(L.find(s.keys, 'pub-' + L.BOB), false), h('small', null, t('published'))));
      }
      rows.push(i === 0 ? label : h('div'),
        personCell(s, sc, from, atFrom),
        h('div', { class: 'sa-cell sa-wire' }, wire),
        personCell(s, sc, to, atTo),
        eveCell(s, sc, m ? [m] : []));
    });
    return rows;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'n', type: 'range', label: t('n'), hint: t('nHint'), min: L.nMin, max: L.nMax, resets: true },
      { key: 'scheme', type: 'choice', label: t('scheme'), resets: true,
        options: [['both', t('schemeBoth')], ['symmetric', t('schemeSym')], ['asymmetric', t('schemeAsym')]] },
      { key: 'eveHasSharedKey', type: 'toggle', label: t('eve'), hint: t('eveHint'),
        disabled: function (p) { return p.scheme === 'asymmetric' ? t('eveOff') : false; } }
    ],

    presets: [
      { id: 'book', label: t('presetBook'), params: { n: 2 }, hint: t('presetBookHint') },
      { id: 'office4', label: t('presetOffice'), params: { n: 4 }, hint: t('presetOfficeHint') },
      { id: 'class30', label: t('presetClass'), params: { n: 30 }, hint: t('presetClassHint') },
      { id: 'newcomer', label: t('presetNewcomer'), params: { n: 10 }, step: 9, hint: t('presetNewcomerHint') },
      { id: 'stolen', label: t('presetStolen'), params: { n: 2, scheme: 'symmetric', eveHasSharedKey: true }, hint: t('presetStolenHint') },
      { id: 'hybrid', label: t('presetHybrid'), params: { n: 4 }, step: 10, hint: t('presetHybridHint') }
    ],

    legend: [
      { shape: 'k-shared', label: t('legendShared') },
      { shape: 'k-public', label: t('legendPublic') },
      { shape: 'k-private', label: t('legendPrivate') },
      { shape: 'k-cipher', label: t('legendCipher') },
      { shape: 'k-eye', label: t('legendEve') },
      { shape: 'k-ghost', label: t('legendGhost') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var one = s.schemes.length === 1;
      var lanes = [h('div', { class: 'sa-colhead' }), h('div', { class: 'sa-colhead' }, t('colFrom')), h('div', { class: 'sa-colhead' }, t('colWire')),
        h('div', { class: 'sa-colhead' }, t('colTo')), h('div', { class: 'sa-colhead', 'data-eve': '' }, icon('eye', false), t('colEve'))];
      s.schemes.forEach(function (sc) { lanes = lanes.concat(laneRows(s, sc, c.params)); });
      if (s.lanes.hybrid) lanes = lanes.concat(laneRows(s, 'hybrid', c.params));
      c.stage.replaceChildren(h('div', { class: 'sa', 'data-one': one ? '' : null, style: { '--cols': String(s.schemes.length) } },
        h('div', { class: 'sa-top' }, s.schemes.map(function (sc) { return card(s, sc); })),
        one ? null : h('p', { class: 'sa-more' }, moreText(s, s.n)),
        h('div', { class: 'sa-lanes' }, lanes)));
    },

    caption: function (c) {
      var s = c.state, p = c.params, stolen = p.eveHasSharedKey && p.scheme !== 'asymmetric';
      var n = s.n;
      if (c.first) {
        if (s.schemes.length === 2) {
          return t('capStart', { people: t.n('people', n), sym: count('sharedKeysN', L.symKeys(n)),
            pairs: count('pairsN', n), asym: count('keysN', L.asymKeys(n)), more: moreText(s, n) });
        }
        var bill = s.schemes[0] === 'sym' ? count('sharedKeysN', L.symKeys(n)) : count('pairsN', n) + ' = ' + count('keysN', L.asymKeys(n));
        return t('capStartOne', { people: t.n('people', n), bill: bill });
      }
      switch (s.phase) {
        case 'want': return t('capWant', { text: t('msgText') });
        case 'carry': return t(stolen ? 'capCarryStolen' : 'capCarry');
        case 'symEnc': return t('capSymEnc');
        case 'symEve': return t(stolen ? 'capSymEveStolen' : 'capSymEve');
        case 'symDec': return t('capSymDec');
        case 'symReply': return t(stolen ? 'capSymReplyStolen' : 'capSymReply');
        case 'publish': return t('capPublish');
        case 'asymEnc': return t('capAsymEnc');
        case 'asymEve': return t('capAsymEve');
        case 'asymDec': return t('capAsymDec');
        case 'asymReply': return t('capAsymReply');
        case 'join': return t('capJoin', { symAdd: t.n('addedN', s.joined.sym), old: t.n('people', s.joined.who),
          sym: count('sharedKeysN', s.counts.sym.total), pairs: count('pairsN', s.counts.asym.pairs),
          asym: count('keysN', s.counts.asym.total), more: moreText(s, n) });
        case 'hybrid': return t('capHybrid');
      }
      return '';
    }
  });

  // legend swatches: the same icons as the stage
  document.querySelectorAll('[data-sim="sym-vs-asym"] .sd-swatch[data-shape^="k-"]').forEach(function (sw) {
    var kind = sw.dataset.shape.slice(2);
    sw.replaceChildren(kind === 'ghost' ? icon('shared', true) : icon(kind, false));
  });
})();
</script>
</body>
</html>
