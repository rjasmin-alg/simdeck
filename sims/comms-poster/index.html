<style>
/* Page CSS: every selector starts with [data-sim="comms-poster"]; colours only from kit tokens. */
[data-sim="comms-poster"] .sd-main { grid-template-columns: minmax(0, 1fr); padding-bottom: var(--gap); }
[data-sim="comms-poster"] .sd-caption { min-height: calc(1.3em + 1rem); }
[data-sim="comms-poster"] .sd-stage { font-size: var(--fs-md); }
[data-sim="comms-poster"] .cp-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(3, minmax(0, 1fr));
  gap: 0.6rem;
  height: 100%;
  padding: 0.6rem;
}
[data-sim="comms-poster"] .cp-card {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  min-height: 0;
  padding: 0.4rem 0.6rem 0.5rem;
  border: var(--line-w) solid var(--line);
  border-left: 0.45rem solid var(--sw);
  border-radius: var(--radius);
  background: var(--panel);
  container: cp-card / inline-size;
}
[data-sim="comms-poster"] .cp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
[data-sim="comms-poster"] .cp-name { font-weight: 700; line-height: 1.2; }
[data-sim="comms-poster"] .cp-badge {
  flex: none;
  padding: 0 0.4rem;
  border: 2px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-size: var(--fs-sm);
  white-space: nowrap;
}
[data-sim="comms-poster"] .cp-badge[data-type='amateur'] { border-style: dashed; }
[data-sim="comms-poster"] .cp-badge[data-type='professional'] { border-color: var(--ink); }
/* The type mark is drawn, not a glyph, so the three shapes differ in every font: hollow dashed, solid, half. */
[data-sim="comms-poster"] .cp-mark {
  display: inline-block;
  width: 0.75em;
  height: 0.75em;
  margin-right: 0.3em;
  border: 2px solid var(--ink);
  border-radius: 50%;
  vertical-align: -0.05em;
}
[data-sim="comms-poster"] .cp-badge[data-type='amateur'] .cp-mark { border-style: dashed; }
[data-sim="comms-poster"] .cp-badge[data-type='professional'] .cp-mark { background: var(--ink); }
[data-sim="comms-poster"] .cp-badge[data-type='mixed'] .cp-mark { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }

/* The strip: ITU bands behind, one lane per row of bars. */
[data-sim="comms-poster"] .cp-strip {
  position: relative;
  flex: none;
  height: 3.4rem;
  border: 1px solid var(--line);
  background: var(--bg);
}
[data-sim="comms-poster"] .cp-itu {
  position: absolute;
  top: 0;
  bottom: 0;
  color: var(--muted);
  font-size: var(--fs-sm);
  line-height: 1.1;
  text-align: center;
  overflow: hidden;
}
[data-sim="comms-poster"] .cp-itu:nth-child(even) { background: color-mix(in srgb, var(--ink) 7%, transparent); }
[data-sim="comms-poster"] .cp-lanes { position: absolute; left: 0; right: 0; top: 1.2rem; bottom: 0.15rem; }
[data-sim="comms-poster"] .cp-bar {
  position: absolute;
  min-width: 3px;
  border-radius: 2px;
  cursor: pointer;
}
[data-sim="comms-poster"] .cp-bar.cp-point {
  min-width: 0;
  width: 0.7rem;
  margin-left: -0.35rem;
  border: 2px solid var(--ink);
  border-radius: 50%;
}
[data-sim="comms-poster"] .cp-bar.cp-point > i { display: none; }
[data-sim="comms-poster"] .cp-bar.is-sel { outline: 3px solid var(--ink); outline-offset: 1px; box-shadow: 0 0 0 6px var(--hl); z-index: 2; }
[data-sim="comms-poster"] .cp-axis { position: relative; flex: none; height: 1.25em; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="comms-poster"] .cp-tick { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; line-height: 1.2; }
[data-sim="comms-poster"] .cp-tick:first-child { transform: none; }
@container cp-card (max-width: 24rem) { [data-sim="comms-poster"] .cp-tick[data-odd] { display: none; } }

/* The list: the names with their ranges, two columns; each one selects its bar. */
[data-sim="comms-poster"] .cp-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.1rem 0.6rem;
  min-height: 0;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: var(--fs-sm);
}
[data-sim="comms-poster"] .cp-tech {
  display: flex;
  justify-content: space-between;
  gap: 0.4rem;
  width: 100%;
  padding: 0 0.25rem;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font: inherit;
  line-height: 1.3;
  text-align: left;
  cursor: pointer;
}
[data-sim="comms-poster"] .cp-tech:hover { background: color-mix(in srgb, var(--sw) 14%, transparent); }
[data-sim="comms-poster"] .cp-tech.is-sel { background: var(--hl); color: var(--on-hl); outline: 2px solid var(--ink); }
[data-sim="comms-poster"] .cp-range { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
[data-sim="comms-poster"] .cp-tech.is-sel .cp-range { color: var(--on-hl); }

/* Phones: the cards stack and the stage grows with them. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="comms-poster"] .sd-stage { height: auto; container-type: inline-size; overflow: visible; }
  [data-sim="comms-poster"] .cp-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; height: auto; }
}
@media (max-width: 420px) {
  [data-sim="comms-poster"] .cp-list { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Komunikacijske tehnologije: spektralni pregled</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
  </main>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sel = ''; // the selected technology: page state only, a reference page has no params
  var sim;

  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  function freq(p) {
    var num = Simdeck.lang === 'hr' ? p.num.replace('.', ',') : p.num;
    return num + ' ' + t('unit' + p.unit.charAt(0).toUpperCase() + p.unit.slice(1));
  }
  function rangeText(x) {
    var r = L.rangeOf(x);
    if (r.single) return freq(r.lo);
    if (r.same) return (Simdeck.lang === 'hr' ? r.lo.num.replace('.', ',') : r.lo.num) + '–' + freq(r.hi);
    return freq(r.lo) + ' – ' + freq(r.hi);
  }
  function pick(id) { sel = sel === id ? '' : id; sim.render(); }

  function card(c, s) {
    var lanes = c.lanes;
    return h('article', { class: 'cp-card', dataset: { c: String(c.c) }, 'aria-labelledby': 'cp-' + c.id },
      h('header', { class: 'cp-head' },
        h('h2', { class: 'cp-name sd-ink', id: 'cp-' + c.id, style: { fontSize: 'inherit', margin: '0' } }, t('cat_' + c.id)),
        h('span', { class: 'cp-badge', dataset: { type: c.type } }, h('i', { class: 'cp-mark', 'aria-hidden': 'true' }), t('type_' + c.type))),
      h('div', { class: 'cp-strip', 'aria-hidden': 'true' },
        s.itu.map(function (b) {
          return h('div', { class: 'cp-itu', translate: 'no', style: { left: pct(b.x), width: pct(b.w) } }, b.id);
        }),
        h('div', { class: 'cp-lanes' }, c.bars.map(function (b) {
          var top = b.lane / lanes, ht = 1 / lanes;
          return h('div', {
            class: 'cp-bar sd-fill' + (c.hatch ? ' sd-hatch' : '') + (b.point ? ' cp-point' : '') + (b.id === sel ? ' is-sel' : ''),
            dataset: { c: String(c.c) },
            style: b.point
              ? { left: pct(b.x), top: 'calc(' + pct(top + ht / 2) + ' - 0.35rem)', height: '0.7rem' }
              : { left: pct(b.x), width: pct(b.w), top: 'calc(' + pct(top) + ' + 1px)', height: 'calc(' + pct(ht) + ' - 2px)' },
            onclick: function () { pick(b.id); }
          });
        }))),
      h('div', { class: 'cp-axis', translate: 'no', 'aria-hidden': 'true' }, s.ticks.filter(function (k) {
        return Math.abs(Math.log10(k.f) - Math.round(Math.log10(k.f))) < 1e-9;
      }).map(function (k, i) {
        var a = { class: 'cp-tick', style: { left: pct(k.x) } };
        if (i % 2) a['data-odd'] = '';
        return h('span', a, freq(L.formatFreq(k.f)));
      })),
      h('ul', { class: 'cp-list' }, c.bars.map(function (b) {
        return h('li', null, h('button', {
          type: 'button', class: 'cp-tech' + (b.id === sel ? ' is-sel' : ''), 'aria-pressed': String(b.id === sel),
          onclick: function () { pick(b.id); }
        }, h('span', null, t('n_' + b.id)), h('span', { class: 'cp-range', translate: 'no' }, rangeText(L.BY_ID[b.id]))));
      })));
  }

  sim = Simdeck.mount({
    steps: 0,
    defaults: L.defaults,
    initial: L.initial,
    params: [],
    presets: [],
    legend: [
      { c: 2, label: t('legendBand') },
      { c: 2, shape: 'round', label: t('legendPoint') },
      { shape: 'hl', label: t('legendSel') }
    ],
    render: function (ctx) {
      ctx.stage.replaceChildren(h('div', { class: 'cp-grid' }, ctx.state.cards.map(function (c) { return card(c, ctx.state); })));
    },
    caption: function () {
      if (!sel) return t('capHint');
      var x = L.BY_ID[sel];
      return t.parts('capTech', {
        name: h('b', null, t('n_' + sel)), range: h('span', { translate: 'no' }, rangeText(x)),
        cat: t('cat_' + x.cat), note: t('d_' + sel)
      });
    }
  });
})();
</script>
</body>
</html>
