<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { A: '1', B: '2', C: '3' };
  var MEM_SCALE = 2048;     // MB at the right end of every memory bar

  // ── numbers in the page's language ──

  function num(x) {
    var s = String(Math.round(x * 100) / 100);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function cores(x) {
    var r = Math.round(x * 100) / 100;
    return r === Math.round(r) ? t.n('nCores', r, { n: num(r) }) : t('nCoresFrac', { n: num(r) });
  }
  function gb(mb) {
    var s = (mb / 1024).toFixed(1);
    return (Simdeck.lang === 'hr' ? s.replace('.', ',') : s) + ' GB';
  }
  function size(mb) { return mb >= 1024 ? num(mb / 1024) + ' GB' : mb + ' MB'; }
  function pct(x, of) { return Math.max(0, Math.min(100, x / of * 100)) + '%'; }
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }

  /** Caption parts: t.parts with *word* as <em lang="en"> and `x` as code (as in lnx-namespaces). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/(\*[^*]+\*|`[^`]+`)/).forEach(function (bit) {
        if (!bit) return;
        if (/^\*[^*]+\*$/.test(bit)) out.push(h('em', { lang: 'en' }, bit.slice(1, -1)));
        else if (/^`[^`]+`$/.test(bit)) out.push(code(bit.slice(1, -1)));
        else out.push(bit);
      });
    });
    return out;
  }

  // ── the host strip ──

  function host(s, chg) {
    var anyCpu = chg.some(function (k) { return /:cpu$/.test(k); });
    var anyMem = chg.some(function (k) { return /:mem$/.test(k); });
    var cpuSegs = s.groups.filter(function (g) { return g.alloc > 0; }).map(function (g) {
      return h('div', { class: 'cg-seg sd-fill', dataset: { c: COLOUR[g.id] }, style: { width: pct(g.alloc, s.cores) }, translate: 'no' },
        g.alloc / s.cores >= 0.08 ? g.id : '');
    });
    cpuSegs.push(h('div', { class: 'cg-seg cg-idle sd-hatch' }, s.idle > 0 && s.idle / s.cores >= 0.2 ? t('idle') : ''));
    var ticks = [];
    for (var i = 1; i < s.cores; i++) ticks.push(h('span', { class: 'cg-core', style: { left: pct(i, s.cores) } }));
    var ramSegs = [h('div', { class: 'cg-seg cg-own', style: { width: pct(s.hostOwn, s.hostRam) } })]
      .concat(s.groups.filter(function (g) { return g.memUsed > 0; }).map(function (g) {
        return h('div', { class: 'cg-seg sd-fill', dataset: { c: COLOUR[g.id] }, style: { width: pct(g.memUsed, s.hostRam) } });
      }))
      .concat([h('div', { class: 'cg-seg cg-idle' })]);
    return h('div', { class: 'cg-host' },
      h('h3', null, t('host')),
      h('div', { class: 'cg-hm' },
        h('div', { class: 'cg-hm-label' }, h('span', null, h('b', null, t('hostCpu')), ' ', cores(s.cores)),
          h('span', null, t('idle'), ' ', cores(s.idle))),
        h('div', { class: 'cg-stack' + (anyCpu ? ' sd-changed' : '') }, cpuSegs, ticks)),
      h('div', { class: 'cg-hm' },
        h('div', { class: 'cg-hm-label' }, h('span', null, h('b', null, t('hostRam')), ' ', data(gb(s.hostRam))),
          h('span', null, t('free'), ' ', data(gb(s.hostFree)))),
        h('div', { class: 'cg-stack' + (anyMem ? ' sd-changed' : '') }, ramSegs)));
  }

  // ── a group box ──

  function scale(max, stepOf, label) {
    var out = [];
    for (var v = 0; v <= max + 1e-9; v += stepOf) out.push(h('span', { style: { left: pct(v, max) } }, label(v)));
    return h('div', { class: 'cg-scale', translate: 'no' }, out);
  }

  function cpuMeter(g, s, top, on) {
    var cap = g.quota > 0 ? g.quota : null;
    var want = Math.min(g.demandCpu, cap != null ? cap : Infinity);
    var marks = [];
    if (s.cores < top) marks.push(h('span', { class: 'cg-mark', dataset: { k: 'host' }, style: { left: pct(s.cores, top) } }));
    if (cap != null) marks.push(h('span', { class: 'cg-mark', dataset: { k: 'cap' }, style: { left: pct(Math.min(cap, top), top) } }));
    return h('div', { class: 'cg-meter' + (on ? ' sd-changed' : '') },
      h('div', { class: 'cg-mlabel' }, t.parts('cpuLine', { got: h('b', null, cores(g.alloc)), want: cores(g.demandCpu) }),
        g.allKilled ? [' · ', h('span', { class: 'cg-x' }, t('allKilled'))] : null),
      h('div', { class: 'cg-bar', dataset: { c: COLOUR[g.id] } },
        h('div', { class: 'cg-used', style: { width: pct(g.alloc, top) } }),
        g.demandCpu > g.alloc + 1e-9 ? h('div', { class: 'cg-want', style: { left: pct(g.alloc, top), width: pct(g.demandCpu - g.alloc, top) } }) : null,
        marks),
      scale(top, 1, function (v) { return String(v); }));
  }

  function memMeter(g, on) {
    var marks = [];
    if (g.memHigh != null && g.memHigh < (g.memMax != null ? g.memMax : Infinity)) marks.push(h('span', { class: 'cg-mark', dataset: { k: 'high' }, style: { left: pct(g.memHigh, MEM_SCALE) } }));
    if (g.memMax != null) marks.push(h('span', { class: 'cg-mark', dataset: { k: 'max' }, style: { left: pct(g.memMax, MEM_SCALE) } }));
    return h('div', { class: 'cg-meter' + (on ? ' sd-changed' : '') },
      h('div', { class: 'cg-mlabel' }, t.parts('memLine', { used: h('b', null, String(g.memUsed)), want: String(g.demandMem) })),
      h('div', { class: 'cg-bar', dataset: { c: COLOUR[g.id] } },
        h('div', { class: 'cg-used', style: { width: pct(g.memUsed, MEM_SCALE) } }),
        g.demandMem > g.memUsed ? h('div', { class: 'cg-want', style: { left: pct(g.memUsed, MEM_SCALE), width: pct(g.demandMem - g.memUsed, MEM_SCALE) } }) : null,
        marks),
      scale(MEM_SCALE, 1024, function (v) { return v ? size(v) : '0'; }));
  }

  function box(g, s, p, top, chg) {
    var chips = [];
    if (g.throttled) chips.push(h('span', { class: 'cg-chip', dataset: { k: 'thr' } }, '‖ ', t('statThrottled')));
    if (g.overHigh) chips.push(h('span', { class: 'cg-chip', dataset: { k: 'high' } }, '↓ ', t('statHigh')));
    if (g.oom) chips.push(h('span', { class: 'cg-chip', dataset: { k: 'oom' } }, '✗ ', t('statOom')));
    var files = Object.keys(g.files).map(function (k) { return [h('dt', null, k), h('dd', null, g.files[k])]; });
    var procs = g.procs.map(function (x) {
      return h('li', { class: 'cg-proc' + (x.killed ? ' cg-killed' : '') },
        h('span', { class: 'cg-pid', translate: 'no' }, String(x.pid)),
        h('span', { class: 'cg-name', translate: 'no' }, x.name),
        x.killed ? h('span', { class: 'cg-x' }, '✗ ', data('OOM'), ' ', h('span', { class: 'cg-rss', translate: 'no' }, x.rss + ' MB'))
          : x.rss || g.demandCpu ? h('span', { class: 'cg-rss', translate: 'no' }, x.rss + ' MB') : h('span', { class: 'cg-quiet' }, t('sleeping')));
    });
    return h('section', { class: 'cg-box' + (p.group === g.id ? ' cg-edit' : ''), dataset: { c: COLOUR[g.id], g: g.id } },
      h('div', { class: 'cg-head' }, h('span', { class: 'cg-badge sd-fill', translate: 'no' }, g.id), h('h3', null, t('group', { g: g.id })), chips),
      h('dl', { class: 'cg-files', translate: 'no', 'aria-label': t('files') }, files),
      h('ul', { class: 'cg-procs', 'aria-label': t('procs') }, procs),
      cpuMeter(g, s, top, chg.indexOf(g.id + ':cpu') >= 0),
      memMeter(g, chg.indexOf(g.id + ':mem') >= 0));
  }

  function render(c) {
    track(c);
    var s = c.state, p = c.params;
    // the CPU bars share one scale: the host's cores, or more when a group wants or may use more
    var top = Math.ceil(Math.max.apply(null, [s.cores].concat(s.groups.map(function (g) { return Math.max(g.demandCpu, g.quota); }))));
    c.stage.replaceChildren(h('div', { class: 'cg' }, host(s, chg),
      h('div', { class: 'cg-groups' }, s.groups.map(function (g) { return box(g, s, p, top, chg); }))));
  }

  // ── captions: the group and half whose param changed last speak (sim.js nextFocus, captionKey) ──

  var focus = null, lastParams = null, lastPreset = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    var same = lastParams && JSON.stringify(lastParams) === key && lastPreset === c.preset;
    if (!same) {
      focus = L.nextFocus(focus, lastParams, c.params, c.preset, lastPreset);
      chg = lastState ? L.changed(lastState, c.state) : [];
      lastParams = Object.assign({}, c.params);
      lastPreset = c.preset;
      lastState = c.state;
    }
  }

  function caption(c) {
    var k = L.captionKey(c.state, focus);
    var v = {};
    Object.keys(k).forEach(function (name) { v[name] = k[name]; });
    ['want', 'quota', 'idle', 'got', 'share', 'a', 'b', 'c', 'ca', 'cb', 'ch'].forEach(function (name) {
      if (typeof k[name] === 'number') v[name] = cores(k[name]);
    });
    if (k.key === 'cContention') { v.cl = num(k.cl); v.ratio = num(k.ratio); }
    if (k.free != null) v.free = gb(k.free);
    if (k.max != null) v.max = size(k.max);
    if (k.high != null) v.high = size(k.high);
    if (k.name) v.name = data(k.name);
    if (k.pid) v.pid = data(k.pid);
    var out = rich(k.key, v);
    if (k.key === 'cOom' && k.n > 1) out = out.concat([' '], rich('cOomMore'));
    return out;
  }

  var labels = {
    'weights-contention': 'pContention', 'weights-idle': 'pIdle', 'quota-cap': 'pQuota',
    'oom-inside': 'pOom', 'high-throttle': 'pHigh', 'oom-group': 'pOomGroup'
  };

  var params = [
    { key: 'cores', type: 'range', label: t('cores'), min: 1, max: 8, step: 1 },
    { key: 'group', type: 'choice', label: t('editGroup'), options: [['A', 'A'], ['B', 'B'], ['C', 'C']] }
  ];
  function opt(v) { return [v, t('opt_' + v)]; }
  L.GROUPS.forEach(function (g) {
    var only = function (p) { return p.group === g; };
    params.push(
      { key: 'weight' + g, type: 'range', label: t('weight'), min: 1, max: 1000, step: 1, visible: only },
      { key: 'quota' + g, type: 'range', label: t('quota'), min: 0, max: 8, step: 0.1, visible: only,
        format: function (v) { return v > 0 ? cores(v) : t('quotaMax'); } },
      { key: 'cpu' + g, type: 'range', label: t('cpu'), min: 0, max: 8, step: 0.1, visible: only, format: cores },
      { key: 'mem' + g, type: 'range', label: t('mem'), min: 0, max: 2000, step: 50, visible: only,
        format: function (v) { return v + ' MB'; } },
      { key: 'memHigh' + g, type: 'choice', label: t('memHigh'), visible: only,
        options: ['off', '256M', '384M', '1G'].map(opt) },
      { key: 'memMax' + g, type: 'choice', label: t('memMax'), visible: only,
        options: ['256M', '512M', '1G', '2G', 'max'].map(opt) });
  });
  params.push({ key: 'oomGroup', type: 'toggle', label: t('oomGroup') });

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cg-used', label: t('legUsed') },
      { shape: 'cg-want', label: t('legWanted') },
      { shape: 'cg-cap', label: t('legCap') },
      { shape: 'cg-high', label: t('legHigh') },
      { shape: 'cg-max', label: t('legMax') },
      { shape: 'cg-oom', label: t('legOom') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
