<!-- cmp-exceptions: an exception to a standard is a risk acceptance: it needs an owner, a compensating control and an
     expiry date; without expiry, exceptions pile up until they are the real policy; a review at expiry renews, fixes
     or escalates.
     The stage: four numbers (share of the estate meeting the standard, the oldest open exception, what the exception
     register says, what the reviews at expiry did); the open exceptions month by month, stacked by status, over the
     whole estate's height; the 48 systems in the chosen month, each with its exception's age; and the same requests
     in the same month under the four regimes.
     Lifecycle and scoring: exceptions.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var ORDER = ['valid', 'renewed', 'escalated', 'expired', 'open'];
  var ST = { open: 'stOpen', valid: 'stValid', renewed: 'stRenewed', escalated: 'stEscalated', expired: 'stExpired' };

  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function int(x) { return new Intl.NumberFormat(LOCALE).format(x); }
  function pct(x) { return new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 0 }).format(x * 100) + ' %'; }
  function age(a) { return t.n('ageM', a, { c: int(a) }); }

  var sim = null;
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to that button
  function moveMonth(d) {
    var m = sim.params.month + d;
    if (m >= 0 && m <= L.MONTHS) sim.set({ month: m });
  }
  function monthButton(d, sel, label, s) {
    var off = d < 0 ? s.p.month <= 0 : s.p.month >= L.MONTHS;
    return h('button', { type: 'button', class: 'ex-b', onmousedown: noFocus, 'aria-label': label,
      'aria-disabled': String(off), dataset: { sel: sel },
      onclick: function (e) { if (e.detail === 0) refocus = sel; moveMonth(d); } }, d < 0 ? '◀' : '▶');
  }

  // ── the numbers ──

  function numbers(s) {
    var regs = ORDER.filter(function (k) { return s.by[k] > 0; }).map(function (k) {
      return h('span', { class: 'ex-reg' }, h('span', { class: 'ex-sw', dataset: { st: k }, 'aria-hidden': 'true' }),
        h('span', null, t(ST[k])), b(int(s.by[k])));
    });
    var verdict = s.regime === 'none' ? ['bad', 'regNoDate']
      : s.by.expired > 0 ? ['bad', 'regExpired'] : s.by.escalated > 0 ? ['warn', 'regEscalated'] : ['ok', 'regOk'];
    var revs;
    if (s.regime === 'review') {
      revs = h('div', { class: 'ex-revs ex-num' },
        h('span', null, t('revFixed'), ' ', b(int(s.reviews.fixed))),
        h('span', null, t('revRenewed'), ' ', b(int(s.reviews.renewed))),
        h('span', null, t('revEscalated'), ' ', b(int(s.reviews.escalated))));
    } else {
      revs = h('span', { class: 'ex-verdict', dataset: { v: 'bad' } },
        t({ none: 'revNone', nothing: 'revNothing', renew: 'revRenew' }[s.regime]));
    }
    var o = s.oldest;
    return h('div', { class: 'ex-sum' },
      h('div', { class: 'ex-k ex-meets' }, h('span', null, t('kMeets')),
        b(pct(s.share)), h('small', { class: 'ex-num' }, t('meetsOf', { k: int(s.meets), n: int(L.SYSTEMS) }))),
      h('div', { class: 'ex-k' }, h('span', null, t('kOldest')),
        b(o ? age(o.age) : t('oldestNone')),
        o ? h('span', { class: 'ex-why' }, t('why' + o.why)) : null,
        h('small', { class: 'ex-num' }, t('yearOld', { k: int(s.year) }))),
      h('div', { class: 'ex-k' }, h('span', null, t('kRegister')),
        h('div', { class: 'ex-regs ex-num' }, regs),
        h('span', { class: 'ex-verdict', dataset: { v: verdict[0] } }, t(verdict[1]))),
      h('div', { class: 'ex-k' }, h('span', null, t('kReviews')), revs));
  }

  // ── the history: open exceptions per month, stacked by status, over the estate's height ──

  function history(s) {
    var cols = s.history.map(function (x) {
      var segs = ORDER.filter(function (k) { return x.by[k] > 0; }).map(function (k) {
        return h('span', { class: 'ex-seg', dataset: { st: k }, style: { height: (x.by[k] / L.SYSTEMS * 100) + '%' } });
      });
      return h('span', { class: 'ex-col', dataset: { on: String(x.m === s.p.month) },
        onclick: function () { sim.set({ month: x.m }); } }, segs);
    });
    var axis = s.history.map(function (x) {
      var show = x.m % 6 === 0;
      return h('span', { class: 'ex-num', dataset: { on: String(x.m === s.p.month), mid: String(x.m % 12 !== 0) } },
        show ? t('axisMonth', { m: int(x.m) }) : '');
    });
    var cur = s.history[s.p.month];
    return h('div', { class: 'ex-hist' },
      h('div', { class: 'ex-hhead' },
        h('p', { class: 'ex-head' }, t('headHist')),
        monthButton(-1, 'prev', t('monthBack'), s),
        h('span', { class: 'ex-mon ex-num' }, t('monthNow', { m: int(s.p.month) })),
        monthButton(1, 'next', t('monthOn'), s)),
      h('div', { class: 'ex-cols', role: 'img', 'aria-label': t('histLabel', { m: s.p.month, o: cur.open, n: L.SYSTEMS }) }, cols),
      h('div', { class: 'ex-axis', 'aria-hidden': 'true' }, axis),
      h('p', { class: 'ex-gaps ex-num' }, t('gaps', { c: int(s.noCtl), o: int(s.noOwner), b: int(s.board) })));
  }

  // ── the estate: 48 systems in the chosen month ──

  function estate(s) {
    var tiles = s.tiles.map(function (x) {
      if (!x) return h('span', { class: 'ex-t' });
      var old = s.oldest && s.oldest.idx === x.idx;
      return h('span', { class: 'ex-t', dataset: { st: x.st, old: String(!!old) } },
        h('span', { class: 'ex-age ex-num' }, int(x.age)),
        x.ctl ? null : h('span', { class: 'ex-flag' }, '✕'),
        x.owner ? null : h('span', { class: 'ex-flag' }, '?'));
    });
    return h('div', { class: 'ex-estate' },
      h('p', { class: 'ex-head' }, t('headGrid', { m: int(s.p.month) })),
      h('div', { class: 'ex-grid', role: 'img', 'aria-label': t('gridLabel', { n: L.SYSTEMS, k: s.meets, o: s.open }) }, tiles));
  }

  // ── the comparison: the same requests, same month, four regimes ──

  function compare(s) {
    var keys = { none: 'cmpNone', nothing: 'cmpNothing', renew: 'cmpRenew', review: 'cmpReview' };
    return h('div', { class: 'ex-cmp' },
      h('p', { class: 'ex-head' }, t('headCmp', { m: int(s.p.month), e: int(s.cmpExpiry) })),
      s.compare.map(function (c) {
        return h('div', { class: 'ex-c', dataset: { on: String(c.rg === s.regime) } },
          h('span', null, t(keys[c.rg])), b(pct(c.share)),
          h('span', { class: 'ex-ctrack', 'aria-hidden': 'true' }, h('span', { class: 'ex-cfill', style: { width: (c.share * 100) + '%' } })));
      }));
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset.sel;
    c.stage.replaceChildren(h('div', { class: 'ex' }, numbers(s), history(s), estate(s), compare(s), h('p', { class: 'ex-foot' }, t('foot'))));
    var sel = refocus || had;
    if (sel) {
      var el = c.stage.querySelector('[data-sel="' + sel + '"]');
      if (el) el.focus();
    }
    refocus = null;
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var out = t.parts(k.key, {
      m: b(int(s.p.month)), o: b(int(s.open)), p: b(pct(s.share)), a: b(s.oldest ? age(s.oldest.age) : age(0)),
      x: b(int(s.regime === 'nothing' ? s.by.expired : s.by.renewed)),
      f: b(int(s.reviews.fixed)), r: b(int(s.reviews.renewed)), e: b(int(s.reviews.escalated))
    });
    k.notes.forEach(function (key) { out.push(' '); out = out.concat(t.parts(key, {})); });
    return out;
  }

  var noExpiry = function (p) { return Number(p.expiry) === 0 ? t('noExpiry') : false; };
  var labels = { 'open-ended': 'pOpenEnded', 'date-only': 'pDateOnly', 'auto-renew': 'pAutoRenew', review: 'pReview',
    incomplete: 'pIncomplete', yearly: 'pYearly' };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'expiry', type: 'choice', label: t('expiry'),
        options: L.EXPIRIES.map(function (x) { return [x, x ? t('expM', { m: int(x) }) : t('expNone')]; }) },
      { key: 'atExpiry', type: 'choice', label: t('atExpiry'), disabled: noExpiry,
        options: [['nothing', t('atNothing')], ['renew', t('atRenew')], ['review', t('atReview')]] },
      { key: 'complete', type: 'toggle', label: t('complete') },
      { key: 'month', type: 'range', label: t('month'), min: 0, max: L.MONTHS, step: 1, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'ex-valid', label: t('legValid') },
      { shape: 'ex-renewed', label: t('legRenewed') },
      { shape: 'ex-escalated', label: t('legEscalated') },
      { shape: 'ex-expired', label: t('legExpired') },
      { shape: 'ex-open', label: t('legOpen') },
      { shape: 'ex-meets', label: t('legMeets') },
      { shape: 'ex-noctl', label: t('legNoCtl') },
      { shape: 'ex-noowner', label: t('legNoOwner') },
      { shape: 'ex-oldest', label: t('legOldest') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
