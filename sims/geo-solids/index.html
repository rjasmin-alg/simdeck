<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var G = L.solids;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // what the last action did (one more lit, a refused button), kept while the params stay as it left them
  var ev = null;
  // a turn or an unfolding, drawn over a moment (never under reduced motion)
  var anim = null;
  var stageArea = null;
  var geoms = {};

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {

  function len(x, u) { return t('fmt', { n: num(x), u: t('unit_' + u) }); }
  function sizeText(w, hh, u) { return t('size', { a: len(w, u), b: len(hh, u) }); }
  function geom(id) { return geoms[id] || (geoms[id] = G.geom(id)); }

      dataset: opts.main ? { main: '' } : {},

  }
  function revealBtn(s) {
    if (s.hide) return btn(t('reveal'), t('revealKey') + ' (V)', function () { sim.set({ hide: false }); }, { kbd: 'V' });
    if (audience === 'teacher') return btn(t('hide'), t('hideHint'), function () { sim.set({ hide: true }); }, { kbd: 'V' });
    return null;

  function sigOf(p) { return JSON.stringify([p.mode, p.solid, p.show, p.lit, p.open]); }
  function evNow(c) { return ev && ev.sig === sigOf(c.params) ? ev : null; }
  /** Run an action: remember what it did, start the animation, set the params (or redraw when refused). */
  function act(e, patch, from) {
    var next = Object.assign({}, sim.params, patch);
    e.sig = sigOf(next);
    ev = e;
    anim = from && !Simdeck.reducedMotion() ? { from: from, t0: null, dur: 500 } : null;
    if (Object.keys(patch).length) sim.set(patch); else sim.render();
    if (anim) requestAnimationFrame(frame);

  function frame(ts) {
    if (!anim) return;
    if (anim.t0 === null) anim.t0 = ts;
    anim.k = Math.min(1, (ts - anim.t0) / anim.dur);
    if (stageArea && stageArea.isConnected) { var a = drawArea(sim.state); stageArea.replaceWith(a); stageArea = a; }
    if (anim.k < 1) requestAnimationFrame(frame);

  /** A value drawn now: during the animation, between where it was and where it is (yaw the short way round). */

  function project(p, yaw, tilt) { var q = G.turn(p, yaw, tilt); return [q[0], -q[1], q[2]]; }
  function ptsAttr(list) { return list.map(function (p) { return p[0].toFixed(3) + ',' + p[1].toFixed(3); }).join(' '); }
  function makeField(R, kids, labs, label, opts) {
    opts = opts || {};

  function labAt(vb, x, y, kids, data) {

  }
  function centre(list) {
    var c = [0, 0];
    list.forEach(function (p) { c[0] += p[0]; c[1] += p[1]; });

  // shading of a curved strip: how much it faces a light from the upper left, in view coordinates
  var LIGHT = (function () { var v = [-0.45, 0.6, 0.66], n = Math.hypot(v[0], v[1], v[2]); return v.map(function (x) { return x / n; }); })();
  function shade(nv) {
    var n = Math.hypot(nv[0], nv[1], nv[2]) || 1;
    var d = (nv[0] * LIGHT[0] + nv[1] * LIGHT[1] + nv[2] * LIGHT[2]) / n;
    return (0.16 + 0.42 * Math.max(0, d)).toFixed(3);

  /* ══ count: one solid ══ */
  function countField(s) {

    var P2 = g.pts.map(function (p) { return project(p, yaw, tilt); });
    var R = 0;
    g.pts.forEach(function (p) { R = Math.max(R, Math.hypot(p[0], p[1], p[2])); });
    R *= 1.18;
    var vb = [-R, -R, 2 * R, 2 * R];
    var labs = [], lit = s.lit, show = s.show;
    var litOf = function (i) { return lit.indexOf(i); };
    // rim segment k of rim r: the flat face it bounds and the strip next to it (sim.js round(): faces 0 [, 1], then strips)
    var flatOfRim = function (r) { return s.solid === 'cylinder' ? r : 0; };
    var strip0 = g.groups.length - 1;
    var label = t('countLabel', { solid: sname(s.solid), n: s.n, t: s.total });
    return makeField(R, function (el) {
      var gHid = svg('g'), gFace = svg('g'), gEdge = svg('g'), gLit = svg('g'), gHit = svg('g');
      // hidden lines go over the faces, as dashes on a drawing
      el.append(gFace, gHid, gEdge, gLit, gHit);
      // hidden lines (dashed), when asked for
      if (s.see) {
        g.edges.forEach(function (e, i) {
          if (sn.e[i]) return;
          gHid.append(svg('line', { class: 'gs-hid', x1: P2[e[0]][0], y1: P2[e[0]][1], x2: P2[e[1]][0], y2: P2[e[1]][1] }));
        });
        g.rims.forEach(function (rim, r) {
          rim.forEach(function (a, k) {
            var b = rim[(k + 1) % rim.length];
            if (sn.face[flatOfRim(r)] || sn.face[strip0 + k]) return;
            gHid.append(svg('line', { class: 'gs-hid', x1: P2[a][0], y1: P2[a][1], x2: P2[b][0], y2: P2[b][1] }));
          });
        });

      // a sphere: one smooth, shaded disc (its strips would look like flat faces)
      if (s.solid === 'sphere') {

        var grad = svg('radialGradient', { id: 'gs-ball', cx: '0.36', cy: '0.3', r: '0.8' });

        var defs = svg('defs');

      if (A === 'child') { put(t('cNetFlatC_' + s.solid)); return out; }
      var sq = s.faces[0], fr = s.faces[1], ri = s.faces[2];
      if (A === 'teacher' && s.solid === 'cuboid') putHl(t('cMistCuboid'));
      if (s.solid === 'cube') put(t('cNetFlat_cube', { s: sizeText(sq.w, sq.h, s.unit) }));
      else if (s.solid === 'cuboid') put(t('cNetFlat_cuboid', { a: sizeText(fr.w, fr.h, s.unit), b: sizeText(sq.w, sq.h, s.unit), c: sizeText(ri.w, ri.h, s.unit) }));
      else put(t('cNetFlat_sugar', { a: sizeText(sq.w, sq.h, s.unit), b: sizeText(fr.w, fr.h, s.unit) }));
      if (A === 'adult') put(t('whyNet'));
      return out;
    }
    if (A === 'child') { put(t('cNet0C')); return out; }
    if (s.hide) { put(t('cNetAsk')); return out; }
    put(t(s.open ? 'cNetMid' : 'cNet0'));
    if (A === 'adult') put(t('whyNet'));
    return out;
  }

  /* ══ the header: the audience switch ══ */
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  function m(mode) { return function (prm) { return prm.mode === mode; }; }
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, options: L.MODES.map(function (x) { return [x, t('mode_' + x)]; }) },
      { key: 'solid', type: 'select', label: t('solidLab'), value: L.defaults.solid, visible: m('count'),
        options: L.SOLID_IDS.map(function (id) { return [id, cap(sname(id))]; }) },
      { key: 'tilt', type: 'range', label: t('tiltLab'), value: L.defaults.tilt, min: L.TILT_MIN, max: L.TILT_MAX, step: 5,
        format: function (v) { return t(v > 0 ? 'tiltUp' : v < 0 ? 'tiltDown' : 'tiltFront'); } },
      
      { key: 'open', type: 'range', label: t('openLab'), value: L.defaults.open, min: 0, max: 100, step: 5, visible: m('net'), format: openWord },
      // the stage's buttons, the drag and V; here so the URL and the presets carry them
      { key: 'show', type: 'choice', label: t('showLab'), value: L.defaults.show, options: L.SHOWS.map(function (k) { return [k, t('show_' + k)]; }), visible: hidden },
      { key: 'lit', type: 'range', label: t('showLab'), value: 0, min: 0, max: L.LIT_MAX, visible: hidden },
      // wide bounds: the model wraps yaw (SPEC rule 1), the kit would only clamp it
      { key: 'yaw', type: 'range', label: t('turnHint'), value: L.defaults.yaw, min: -36000, max: 36000, visible: hidden },
      { key: 'see', type: 'toggle', label: t('seeLab'), hint: t('seeHint'), value: L.defaults.see, visible: hidden },
      { key: 'hide', type: 'toggle', label: t('hide'), hint: t('hideHint'), value: L.defaults.hide, visible: hidden }
    ],

    presets: L.PRESETS.map(function (pr) {
      var k = pr.id.replace('-', '_');
      return { id: pr.id, label: t('p_' + k), hint: t('ph_' + k), params: pr.params };
    }),

    keys: [
      { key: 'V', label: t('revealKey'), run: function (sm) { sm.set({ hide: !sm.params.hide }); } },
      { key: 'P', label: t('keyP'), run: function (sm) { if (sm.state.mode === 'count') lightNext(); else openMore(); } },
      { key: 'O', label: t('keyO'), run: function () { turn(L.TURN); } }
    ],

    legend: [
      { c: 1, label: t('legFlat') },
      { c: 1, label: t('legCurved') },
      { c: 2, label: t('legLit') },
      { shape: 'dash', label: t('legHidden') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows: a new solid, count or mode puts every light out; the net takes a box
  var last = null;
  sim.on(function (c) {
    var p = c.params, s = c.state, fix = {};
    if (p.mode === 'net' && L.NET_IDS.indexOf(p.solid) < 0) fix.solid = s.solid;
    if (last && (last.solid !== p.solid || last.show !== p.show || last.mode !== p.mode) && p.lit) fix.lit = 0;
    last = { solid: fix.solid || p.solid, show: p.show, mode: p.mode };
    if (Object.keys(fix).length) sim.set(fix, { preset: sim.preset });
  });

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
