     rules: SPEC.md. -->

<style>
/* Page CSS: every selector starts with [data-sim="http-status-codes"]; colours only from kit tokens. */

/* The poster: five columns, one per class. */

}

[data-sim="http-status-codes"] .hs-letter {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 1.45rem;
  height: 1.45rem;
  border-radius: 50%;
  font-size: var(--fs-sm);
  font-weight: 700;
}
[data-sim="http-status-codes"] .hs-cls { font-family: var(--mono); font-weight: 700; }

  gap: 0 0.4rem;
  width: 100%;
  min-height: var(--hit);
  padding: 0.1rem 0.45rem 0.15rem 0.55rem;
  border: var(--line-w) solid var(--line);

/* Dimmed: muted text, dashed border; never hidden, still clickable. */
[data-sim="http-status-codes"] .hs-card.is-dim { border-style: dashed; border-left-color: var(--line); background: var(--bg); color: var(--muted); }
[data-sim="http-status-codes"] .hs-card.is-dim:hover { background: var(--panel); }
[data-sim="http-status-codes"] .hs-card.sd-changed { background: var(--hl); color: var(--on-hl); }
[data-sim="http-status-codes"] .hs-card.is-sel { border-color: var(--accent); border-width: 0.25rem; border-left-width: 0.4rem; border-style: double; border-left-style: solid; border-left-color: var(--sw); }
[data-sim="http-status-codes"] .hs-card.is-dim.is-sel { border-style: double; }

/* The detail strip: the selected card's exchange, or the view's cards side by side. */
[data-sim="http-status-codes"] .hs-detail {
  display: grid;
  grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr));
  gap: 0.6rem 1.2rem;
  height: 12.5rem;
  padding: 0.4rem 0.9rem 0.5rem;
  border: var(--line-w) solid var(--line);
  border-left: 0.45rem solid var(--accent);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
}
[data-sim="http-status-codes"] .hs-detail.is-empty { display: flex; align-items: center; justify-content: center; color: var(--muted); border-style: dashed; border-left-style: dashed; border-left-color: var(--line); }
[data-sim="http-status-codes"] .hs-detail.is-empty p { margin: 0; font-size: 1.15rem; }
[data-sim="http-status-codes"] .hs-ex { min-width: 0; }
[data-sim="http-status-codes"] .hs-ex h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; margin: 0 0 0.3rem; font-size: 1.15rem; line-height: 1.25; }
[data-sim="http-status-codes"] .hs-ex h2 .hs-letter { align-self: center; }
[data-sim="http-status-codes"] .hs-ex h2 .hs-phrase { font-size: 1.15rem; }
[data-sim="http-status-codes"] .hs-ex h2 .hs-mean { font-size: var(--fs-sm); font-weight: 400; }
[data-sim="http-status-codes"] .hs-ex h2 .hs-rfc { margin-left: auto; color: var(--muted); font-size: var(--fs-sm); font-weight: 400; }
[data-sim="http-status-codes"] .hs-exbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.4rem 1.4rem; }
[data-sim="http-status-codes"] .hs-detail.is-one .hs-exbody { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
[data-sim="http-status-codes"] .hs-detail.is-two .hs-exbody { grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); }
[data-sim="http-status-codes"] .hs-msgs { display: flex; flex-direction: column; gap: 0.15rem; margin: 0; padding: 0; list-style: none; }
[data-sim="http-status-codes"] .hs-msg { display: flex; align-items: flex-start; gap: 0.5rem; }
[data-sim="http-status-codes"] .hs-msg.is-resp { padding-left: 0.8rem; }
[data-sim="http-status-codes"] .hs-arrow { flex: none; width: 1.7rem; height: 1.3rem; fill: none; stroke: var(--ink); stroke-width: 2.4; }
[data-sim="http-status-codes"] .hs-arrow .hs-head { fill: var(--ink); stroke: none; }
[data-sim="http-status-codes"] .hs-msg.is-resp .hs-arrow line { stroke-dasharray: 4 3; }
[data-sim="http-status-codes"] .hs-lines { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1rem 0.7rem; min-width: 0; }
[data-sim="http-status-codes"] .hs-start,
[data-sim="http-status-codes"] .hs-hdr { font-family: var(--mono); font-size: 0.95rem; line-height: 1.3; overflow-wrap: anywhere; }
[data-sim="http-status-codes"] .hs-start { font-weight: 700; }
[data-sim="http-status-codes"] .hs-hdr { padding: 0 0.3rem; border-radius: var(--radius-sm); background: var(--bg); }
[data-sim="http-status-codes"] .hs-note,
[data-sim="http-status-codes"] .hs-nobody { font-size: var(--fs-sm); color: var(--muted); font-style: italic; }
[data-sim="http-status-codes"] .hs-nobody { padding: 0 0.3rem; border: 2px dashed var(--line); border-radius: var(--radius-sm); font-style: normal; }
[data-sim="http-status-codes"] .hs-follow,
[data-sim="http-status-codes"] .hs-after { padding-left: 2.1rem; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="http-status-codes"] .hs-follow::before { content: '↓ '; }
[data-sim="http-status-codes"] .hs-about p { margin: 0 0 0.25rem; font-size: 1rem; line-height: 1.3; }
[data-sim="http-status-codes"] .hs-about .hs-x { padding-left: 0.6rem; border-left: 3px solid var(--accent); font-weight: 700; }
[data-sim="http-status-codes"] .hs-about .hs-count { font-weight: 700; }
[data-sim="http-status-codes"] .hs-detail.is-three .hs-about { margin-top: 0.3rem; }

/* Legend shapes of this page. */
[data-sim="http-status-codes"] .sd-swatch[data-shape^='hs-'] { position: relative; background: var(--bg); border-color: var(--ink); }
[data-sim="http-status-codes"] .sd-swatch[data-shape^='hs-']::after { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; line-height: 1; color: var(--ink); }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-star'] { border: 0; background: transparent; }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-star']::after { content: '★'; }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-req'],
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-resp'] { border: 0; background: transparent; }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-req']::before,
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-resp']::before { content: ''; position: absolute; left: 0.1em; right: 0.1em; top: calc(50% - 1px); border-top: 2px solid var(--ink); }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-resp']::before { border-top-style: dashed; }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-req']::after,
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-resp']::after { content: ''; inset: auto; top: calc(50% - 0.3em); width: 0; height: 0; border-top: 0.3em solid transparent; border-bottom: 0.3em solid transparent; }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-req']::after { right: 0; border-left: 0.45em solid var(--ink); }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-resp']::after { left: 0; border-right: 0.45em solid var(--ink); }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-letter'] { border-radius: 50%; border-color: var(--sw); background: var(--sw); }
[data-sim="http-status-codes"] .sd-swatch[data-shape='hs-letter']::after { content: 'C'; font-size: 0.75em; color: var(--on-series); }

/* The hidden params (view, sel): kit.css gives .sd-ctl display: flex, which beats [hidden]. */
[data-sim="http-status-codes"] .sd-ctl[hidden] { display: none; }

/* Phones and portrait screens: the columns stack, the page scrolls. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="http-status-codes"] .sd-stage { height: auto; container-type: inline-size; overflow: visible; }
  [data-sim="http-status-codes"] .hs { height: auto; grid-template-rows: auto auto; }
  [data-sim="http-status-codes"] .hs-poster { grid-template-columns: minmax(0, 1fr); gap: 0.9rem; }
  [data-sim="http-status-codes"] .hs-detail,
  [data-sim="http-status-codes"] .hs-detail.is-one .hs-exbody { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; }
}
</style>

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Statusni kodovi HTTP-a</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // Series colour per class; the letter badge and the column carry the class too.
  var CLS_C = { 1: 6, 2: 3, 3: 1, 4: 2, 5: 5 };
  var VIEW_CAP = { 'book-five': 'capBook', 'redirect': 'capRedirect', 'whose-fault': 'capFault', 'cache': 'capCache', 'auth': 'capAuth' };
  var NOTE = { 100: 1, 301: 1, 302: 1, 304: 1, 307: 1, 308: 1, 401: 1, 403: 1, 404: 1, 503: 1 };
  var STAR = 'M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z';

  var svgNs = 'http://www.w3.org/2000/svg';
  function star() {
    var s = document.createElementNS(svgNs, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'hs-star');
    s.setAttribute('role', 'img');
    s.setAttribute('aria-label', t('coreMark'));
    var p = document.createElementNS(svgNs, 'path');
    p.setAttribute('d', STAR);
    s.append(p);
    return s;
  }
  function arrow(kind) {
    var s = document.createElementNS(svgNs, 'svg');
    s.setAttribute('viewBox', '0 0 28 20');
    s.setAttribute('class', 'hs-arrow');
    s.setAttribute('role', 'img');
    s.setAttribute('aria-label', t(kind === 'req' ? 'legReq' : 'legResp'));
    var l = document.createElementNS(svgNs, 'line');
    var p = document.createElementNS(svgNs, 'path');
    p.setAttribute('class', 'hs-head');
    if (kind === 'req') { l.setAttribute('x1', '2'); l.setAttribute('x2', '19'); p.setAttribute('d', 'M27 10l-9-6v12z'); }
    else { l.setAttribute('x1', '9'); l.setAttribute('x2', '26'); p.setAttribute('d', 'M1 10l9-6v12z'); }
    l.setAttribute('y1', '10');
    l.setAttribute('y2', '10');
    s.append(l, p);
    return s;
  }
  function data(text, cls) { return h('span', { class: cls || 'hs-start', translate: 'no' }, text); }
  function phrase(c) { return h('span', { class: 'hs-phrase', translate: 'no', lang: 'en' }, c.phrase); }
  function noSteal(e) { e.preventDefault(); }
  function cardOf(s, code) { return s.cards.filter(function (c) { return c.code === code; })[0]; }
  function letter(cls) { return h('span', { class: 'hs-letter sd-fill', 'data-c': String(CLS_C[cls]), translate: 'no', 'aria-hidden': 'true' }, L.CLASSES[cls - 1].letter); }

  var sim;
  function pick(code) {
    var v = String(code);
    sim.set({ sel: sim.params.sel === v ? '' : v }, { preset: sim.preset }); // a click keeps the active preset
  }

  // "Changed": the cards that appeared with the last change of the active set (SPEC.md §4). The renders before
  // mount returns (the kit's preset and URL passes) only set the starting point: the first view marks nothing.
  var ready = false, last = null, lastKey = null, changed = [];
  function changedOf(s) {
    var key = s.active.join(',');
    if (!ready) { last = s; lastKey = key; changed = []; return changed; }
    if (key !== lastKey) { changed = L.appeared(last, s); last = s; lastKey = key; }
    return changed;
  }

  function cardEl(c, ch) {
    var cls = 'hs-card' + (c.active ? '' : ' is-dim') + (ch.indexOf(c.code) >= 0 ? ' sd-changed' : '') + (c.selected ? ' is-sel' : '');
    return h('button', {
      type: 'button', class: cls, 'data-c': String(CLS_C[c.cls]), 'aria-pressed': c.selected ? 'true' : 'false',
      onmousedown: noSteal, onclick: function () { pick(c.code); }
    },
      data(String(c.code), 'hs-code'), phrase(c), c.core ? star() : null,
      h('span', { class: 'hs-mean' }, t('m' + c.code)));
  }

  function column(k, s, ch) {
    var on = s.filter.class === 'all' || s.filter.class === k.id;
    return h('section', { class: 'hs-col' + (on ? '' : ' is-off'), 'data-c': String(CLS_C[k.cls]) },
      h('header', { class: 'hs-head' },
        h('h2', { class: 'hs-title' }, letter(k.cls), data(k.id, 'hs-cls'), h('span', { class: 'hs-name' }, t('c' + k.cls))),
        h('p', { class: 'hs-whose' }, t('w_' + k.whose)),
        h('p', { class: 'hs-unknown' }, t('unknownAs', { cls: k.id, code: k.cls * 100 }))),
      h('ul', { class: 'hs-cards' }, s.cards.filter(function (c) { return c.cls === k.cls; }).map(function (c) {
        return h('li', null, cardEl(c, ch));
      })));
  }

  function msgRow(kind, m) {
    return h('li', { class: 'hs-msg is-' + kind },
      arrow(kind),
      h('span', { class: 'hs-lines' },
        m.start ? data(m.start) : null,
        m.headers.map(function (x) { return data(x, 'hs-hdr'); }),
        m.note ? h('span', { class: 'hs-note' }, t('note_' + m.note)) : null,
        m.body ? null : h('span', { class: 'hs-nobody' }, t('noBody'))));
  }

  function exchange(c, one) {
    var ex = c.example;
    var rows = [msgRow('req', ex.request), msgRow('resp', ex.response)];
    if (ex.followUp) {
      rows.push(h('li', { class: 'hs-follow' }, t(ex.followUp.same ? 'followSame' : 'followNew')));
      rows.push(msgRow('req', ex.followUp.request), msgRow('resp', ex.followUp.response));
    }
    if (c.after) rows.push(h('li', { class: 'hs-after' }, t('after_' + c.after)));
    return h('article', { class: 'hs-ex' },
      h('h2', null, letter(c.cls), data(String(c.code), 'hs-code'), phrase(c), c.core ? star() : null,
        one ? null : h('span', { class: 'hs-mean' }, t('m' + c.code)),
        data(c.rfc, 'hs-rfc')),
      h('div', { class: 'hs-exbody' },
        h('ol', { class: 'hs-msgs' }, rows),
        h('div', { class: 'hs-about' },
          one ? h('p', null, t('d' + c.code)) : null,
          NOTE[c.code] ? h('p', { class: 'hs-x' }, t('x' + c.code)) : null,
          h('p', { class: 'hs-count' }, t('perClick', { req: t.n('reqN', c.messages.requests), resp: t.n('respN', c.messages.responses) })))));
  }

  function detail(s) {
    if (!s.detail.length) return h('div', { class: 'hs-detail is-empty' }, h('p', null, t('cardHint')));
    var one = s.detail.length === 1;
    return h('div', { class: 'hs-detail ' + ['', 'is-one', 'is-two', 'is-three'][s.detail.length], style: '--n: ' + s.detail.length },
      s.detail.map(function (code) { return exchange(cardOf(s, code), one); }));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'class', type: 'select', label: t('klass'), hint: t('klassHint'), value: 'all',
        options: L.CLASS_IDS.map(function (id, i) { return [id, i === 0 ? t('cAll') : id + ' · ' + t('c' + i)]; }) },
      { key: 'core', type: 'toggle', label: t('core'), hint: t('coreHint') },
      { key: 'view', type: 'select', label: t('klass'), value: 'none', options: L.VIEW_IDS.map(function (v) { return [v, v]; }),
        visible: function () { return false; } },
      { key: 'sel', type: 'select', label: t('klass'), value: '', options: [['', '']].concat(L.CARDS.map(function (c) { return [String(c.code), String(c.code)]; })),
        visible: function () { return false; } }
    ],

    presets: [
      { id: 'book-five', label: t('pBook'), params: { core: true, view: 'book-five' }, hint: t('pBookHint') },
      { id: 'redirect', label: t('pRedirect'), params: { view: 'redirect' }, hint: t('pRedirectHint') },
      { id: 'whose-fault', label: t('pFault'), params: { view: 'whose-fault' }, hint: t('pFaultHint') },
      { id: 'cache', label: t('pCache'), params: { view: 'cache' }, hint: t('pCacheHint') },
      { id: 'auth', label: t('pAuth'), params: { view: 'auth' }, hint: t('pAuthHint') }
    ],

    legend: [
      { shape: 'hs-letter', c: 2, label: t('legLetter') },
      { shape: 'hs-star', label: t('legCore') },
      { shape: 'hs-req', label: t('legReq') },
      { shape: 'hs-resp', label: t('legResp') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var ch = changedOf(s);
