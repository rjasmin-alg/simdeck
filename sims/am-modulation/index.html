<!-- AM modulation: adopted from 50ohm-contents-hr/contents/html/applet_am_modulator.html (a diode AM modulator

     the simdeck kit (docs/sim-ui.md), translated and changed. An explorer: the circuit is solved in sim.js with the
     original's values, the page draws its output over time and its spectrum as SVG; the words are in strings.js.
     The original's circuit simulator is not used. -->
<html lang="hr" data-sim="am-modulation">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amplitudna modulacija · simdeck</title>
<meta name="description" content="AM modulator s diodom: amplituda nositelja prati NF signal, a u spektru se pojavljuju dva bočna pojasa.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "am-modulation",
  "class": "explorer",
  "title": { "hr": "Amplitudna modulacija (AM)", "en": "Amplitude modulation (AM)" },
  "concept": { "hr": "Amplituda nositelja prati NF signal; u spektru nastaju dva bočna pojasa", "en": "The carrier's amplitude follows the AF signal; the spectrum gains two sidebands" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="am-modulation"]; colours only from kit tokens. */
[data-sim="am-modulation"] .am { height: 100%; padding: 1.2cqh 1.4cqw; display: flex; flex-direction: column; gap: 0.6rem; }
/* the circuit as a row of blocks */
[data-sim="am-modulation"] .am-circuit { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.5rem; font-size: var(--fs-sm); }
[data-sim="am-modulation"] .am-sources { display: flex; flex-direction: column; gap: 0.3rem; }
[data-sim="am-modulation"] .am-block { border: 2px solid var(--line); border-radius: 0.4rem; padding: 0.2rem 0.6rem; background: var(--panel); color: var(--ink); line-height: 1.25; text-align: center; }
[data-sim="am-modulation"] .am-block b { display: block; font-weight: 600; }
[data-sim="am-modulation"] .am-block.sd-soft { border-color: currentColor; }
[data-sim="am-modulation"] .am-block .am-v { color: var(--muted); white-space: nowrap; }
[data-sim="am-modulation"] .am-off { border-style: dashed; color: var(--muted); background: transparent; }
[data-sim="am-modulation"] .am-off b { text-decoration: line-through; }
[data-sim="am-modulation"] .am-arrow { color: var(--muted); font-size: var(--fs-md); }
/* Subscripts in the explanation stay at the text size (the phone floor is 14 px); only the baseline drops. */
[data-sim="am-modulation"] .sd-explain sub { font-size: inherit; vertical-align: -0.3em; line-height: 0; }
[data-sim="am-modulation"] .am-diode { font-family: var(--sans); letter-spacing: -0.05em; }
/* the two plots */
[data-sim="am-modulation"] .am-fig { position: relative; flex: 1; min-height: 9rem; display: flex; flex-direction: column; }
[data-sim="am-modulation"] .am-fig h2 { margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
[data-sim="am-modulation"] .am-plot { position: relative; flex: 1; }
[data-sim="am-modulation"] .am-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="am-modulation"] .am-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="am-modulation"] .am-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="am-modulation"] .am-grid { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
[data-sim="am-modulation"] .am-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="am-modulation"] .am-out { fill: none; stroke: var(--c1); stroke-width: 2; stroke-linejoin: round; }
[data-sim="am-modulation"] .am-nf { fill: none; stroke: var(--c3); stroke-width: 3; stroke-dasharray: 10 6; }
[data-sim="am-modulation"] .am-band { fill: var(--c4); opacity: 0.18; stroke: var(--c4); stroke-width: 1.5; stroke-dasharray: 4 4; }
[data-sim="am-modulation"] .am-stem { stroke: var(--muted); stroke-width: 2; }
[data-sim="am-modulation"] .am-stem-c { stroke: var(--c1); stroke-width: 4; }
[data-sim="am-modulation"] .am-stem-s { stroke: var(--c2); stroke-width: 4; }
[data-sim="am-modulation"] .am-head-c { fill: var(--c1); stroke: var(--bg); stroke-width: 2; }
[data-sim="am-modulation"] .am-head-s { fill: var(--c2); stroke: var(--bg); stroke-width: 2; }
[data-sim="am-modulation"] .am-plot text.am-tag { fill: var(--ink); font-weight: 600; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="am-modulation"] .am-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="am-modulation"] .am-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="am-modulation"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="am-modulation"] .am { height: auto; padding: 0.6rem; }
  [data-sim="am-modulation"] .am-fig { flex: none; height: 14rem; }
  [data-sim="am-modulation"] .am-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="am-modulation"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Amplitudna modulacija (AM)</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="am-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function trim(x, d) { return num(parseFloat(x.toFixed(d))); }
  function freq(f) { return f >= 1000 ? t('khz', { v: trim(f / 1000, 2) }) : t('hz', { v: trim(f, 0) }); }
  function volts(x) { return t('volt', { v: num(x.toFixed(2)) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

  var labels = { original: 'presetOriginal', fm1k: 'presetFm1k', noTank: 'presetNoTank', noNf: 'presetNoNf', strong: 'presetStrong' };

  // ── the circuit, as a row of blocks: two sources, the resistors, the diode, the high-pass, the tank, the output ──
  function circuit(st) {
    var arrow = function () { return h('span', { class: 'am-arrow', 'aria-hidden': 'true' }, '→'); };
    var block = function (cls, name, value, c) {
      var a = { class: 'am-block' + (cls ? ' ' + cls : '') };
      if (c) { a.class += ' sd-soft'; a['data-c'] = c; }
      return h('div', a, h('b', null, name), value ? h('span', { class: 'am-v' }, value) : null);
    };
    var vf = L.CIRCUIT;
    return h('div', { class: 'am-circuit' },
      h('div', { class: 'am-sources' },
        block('', t('blockNf'), freq(st.fm) + ' · ' + volts(st.am), 3),
        block('', t('blockVf'), freq(vf.fc) + ' · ' + volts(vf.uc))),
      arrow(), block('', t('blockSum')),
      arrow(), block('am-diode', t('blockDiode'), '▶|'),
      arrow(), block('', t('blockHp')),
      arrow(), st.tank ? block('', t('blockTank'), t('blockTankF', { v: freq(Math.round(st.f0 / 100) * 100) }))
                       : block('am-off', t('blockTank'), t('blockTankOff')),
      arrow(), block('', t('blockOut'), null, 1));
  }

  // ── the output over time, with the AF input dashed on the same volt axis ──
  function drawTime(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), pad = { l: 3.4 * r, r: 1.2 * r, t: 0.6 * r, b: 1.6 * r };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var span = (st.time.length - 1) * st.dtView;
    var vmax = Math.max(1, Math.ceil(Math.max(Math.abs(st.vMax), Math.abs(st.vMin), st.am) * 2) / 2);
    var X = function (tt) { return pad.l + (tt / span) * cw; };
    var Y = function (v) { return pad.t + ch * (1 - (v + vmax) / (2 * vmax)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'am-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    for (var ms = 0; ms <= span * 1000 + 1e-9; ms += 0.5) {
      var x = X(ms / 1000);
      if (ms > 0 && ms < span * 1000 - 1e-9) svg.append(s('line', { class: 'am-grid', x1: x, x2: x, y1: pad.t, y2: pad.t + ch }));
      if (ms % 1 === 0) svg.append(s('text', { x: x, y: H - 0.2 * r, 'text-anchor': ms === 0 ? 'start' : ms >= span * 1000 - 1e-9 ? 'end' : 'middle' }, t('ms', { v: num(ms) })));
    }
    svg.append(s('line', { class: 'am-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    [vmax, -vmax].forEach(function (v) {
      svg.append(s('text', { x: pad.l - 0.3 * r, y: Y(v) + (v > 0 ? 0.8 * r : -0.1 * r), 'text-anchor': 'end' }, t('volt', { v: num(v) })));
    });
    var pts = function (ys) { return ys.map(function (v, i) { return X(i * st.dtView).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' '); };
    svg.append(s('polyline', { class: 'am-out', points: pts(st.time) }));
    if (st.am > 0) svg.append(s('polyline', { class: 'am-nf', points: pts(st.nf) }));
    box.replaceChildren(svg);
  }

  // ── the spectrum: one line per 50 Hz bin, carrier and sidebands marked; the tank's pass band shaded ──
  function drawSpec(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), pad = { l: 3.4 * r, r: 1.2 * r, t: 1.4 * r, b: 1.6 * r };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var fmax = L.FMAX, amax = Math.max(0.5, Math.ceil(Math.max.apply(null, st.spectrum.slice(1)) * 4) / 4);
    var X = function (f) { return pad.l + (f / fmax) * cw; };
    var Y = function (a) { return pad.t + ch * (1 - a / amax); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'am-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    if (st.tank) svg.append(s('rect', { class: 'am-band', x: X(st.bandLo), y: pad.t, width: X(st.bandHi) - X(st.bandLo), height: ch }));
    // a label every 5, 10 or 20 kHz, whichever leaves about 4.5 rem per label
    var every = [5000, 10000, 20000].filter(function (e) { return cw / (fmax / e) >= 4.5 * r; })[0] || 20000;
    for (var f = 0; f <= fmax; f += 5000) {
      if (f > 0 && f < fmax) svg.append(s('line', { class: 'am-grid', x1: X(f), x2: X(f), y1: pad.t, y2: pad.t + ch }));
      if (f % every === 0) svg.append(s('text', { x: X(f), y: H - 0.2 * r, 'text-anchor': f === 0 ? 'start' : f === fmax ? 'end' : 'middle' }, freq(f)));
    }
    svg.append(s('text', { x: pad.l - 0.3 * r, y: Y(amax) + 0.8 * r, 'text-anchor': 'end' }, t('volt', { v: num(amax) })));
    svg.append(s('text', { x: pad.l - 0.3 * r, y: Y(0), 'text-anchor': 'end' }, t('volt', { v: 0 })));
    var kc = Math.round(st.fc / st.bin), kl = Math.round(st.lsb / st.bin), ku = Math.round(st.usb / st.bin);
    var marked = st.am > 0 ? [kl, kc, ku] : [kc];
    st.spectrum.forEach(function (a, k) {
      if (k === 0 || a < 0.002 || marked.indexOf(k) >= 0) return;
      svg.append(s('line', { class: 'am-stem', x1: X(k * st.bin), x2: X(k * st.bin), y1: Y(0), y2: Y(a) }));
    });
    var hr = 0.42 * r;
    marked.forEach(function (k) {
      var x = X(k * st.bin), y = Y(st.spectrum[k]), carrier = k === kc;
      svg.append(s('line', { class: carrier ? 'am-stem-c' : 'am-stem-s', x1: x, x2: x, y1: Y(0), y2: y }));
      svg.append(carrier ? s('rect', { class: 'am-head-c', x: x - hr, y: y - hr, width: 2 * hr, height: 2 * hr })
                         : s('circle', { class: 'am-head-s', cx: x, cy: y, r: hr }));
      var anchor = carrier ? 'middle' : k === kl ? 'end' : 'start';
      var dx = carrier ? 0 : k === kl ? -0.7 * r : 0.7 * r;
      svg.append(s('text', { class: 'am-tag', x: x + dx, y: y - 0.6 * r, 'text-anchor': anchor }, freq(k * st.bin)));
    });
    box.replaceChildren(svg);
  }

  var plots = null;

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'fm', type: 'range', label: t('fm'), hint: t('fmHint'), min: L.FM_MIN, max: L.FM_MAX, step: L.FM_STEP, format: freq },
      { key: 'am', type: 'range', label: t('am'), hint: t('amHint'), min: 0, max: L.AM_MAX * 10, step: 1,
        format: function (v) { return volts(v / 10); } },
      { key: 'tank', type: 'toggle', label: t('tank'), hint: t('tankHint') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendOut') },
      { c: 3, label: t('legendNf') },
      { c: 1, label: t('legendCarrier') },
      { c: 2, shape: 'round', label: t('legendSide') },
      { c: 4, shape: 'hollow', label: t('legendBand') }
    ],

    render: function (c) {
      var time = h('div', { class: 'am-plot' }), spec = h('div', { class: 'am-plot' });
      c.stage.replaceChildren(h('div', { class: 'am' },
        circuit(c.state),
        h('div', { class: 'am-fig' }, h('h2', null, t('plotTime')), time),
        h('div', { class: 'am-fig' }, h('h2', null, t('plotSpec')), spec)));
      plots = { time: time, spec: spec };
      drawTime(time, c.state);
      drawSpec(spec, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      if (st.am === 0) return t.parts('captionNoNf', { fc: b(freq(st.fc)), ac: b(volts(st.aCarrier)) });
      var parts = t.parts('caption', {
        fc: b(freq(st.fc)), ac: b(volts(st.aCarrier)), lsb: b(freq(st.lsb)), usb: b(freq(st.usb)),
        al: b(volts(st.aLsb)), au: b(volts(st.aUsb)), fm: b(freq(st.fm))
      });
      // the depth is read from the envelope, which only the tank's clean carrier has
      return [].concat(parts, st.tank ? t.parts('captionDepth', { m: b(num(st.depth.toFixed(2))) }) : t('captionNoTank'));
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
