<style>
/* Page CSS: every selector starts with [data-sim="attenuator"]; colours only from kit tokens. */
[data-sim="attenuator"] .at { height: 100%; padding: 1.4cqh 1.6cqw; display: flex; flex-direction: column; gap: 1.2cqh; }
[data-sim="attenuator"] .at-plot { position: relative; flex: 1; min-height: 12rem; }
[data-sim="attenuator"] .at-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="attenuator"] .at-plot text { font-family: var(--sans); font-size: var(--fs-md); fill: var(--ink); }
[data-sim="attenuator"] .at-plot text.at-soft { fill: var(--muted); font-size: var(--fs-sm); }
[data-sim="attenuator"] .at-wire { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-linecap: round; }
[data-sim="attenuator"] .at-box { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 8 6; }
[data-sim="attenuator"] .at-term { fill: var(--bg); stroke: var(--ink); stroke-width: 2.5; }
[data-sim="attenuator"] .at-r { stroke: var(--ink); stroke-width: 2.5; }
[data-sim="attenuator"] .at-r.is-series { fill: var(--c1); }
[data-sim="attenuator"] .at-r.is-across { fill: var(--c2); }
[data-sim="attenuator"] .at-r.is-end { fill: var(--panel); stroke: var(--c3); stroke-dasharray: 6 4; stroke-width: 3; }
[data-sim="attenuator"] .at-gen { fill: var(--panel); stroke: var(--c3); stroke-width: 3; }
[data-sim="attenuator"] .at-sine { fill: none; stroke: var(--c3); stroke-width: 2.5; }
[data-sim="attenuator"] .at-name { font-weight: 700; }
[data-sim="attenuator"] .at-plot text .at-sub { font-size: var(--fs-sm); }
/* the readout: ideal against standard values */
[data-sim="attenuator"] .at-table { border-collapse: collapse; width: 100%; font-size: var(--fs-md); }
[data-sim="attenuator"] .at-table th,
[data-sim="attenuator"] .at-table td { padding: 0.25rem 0.8rem; text-align: right; border-bottom: 1px solid var(--line); }
[data-sim="attenuator"] .at-table th:first-child,
[data-sim="attenuator"] .at-table td:first-child { text-align: left; padding-left: 0; }
[data-sim="attenuator"] .at-table thead th { color: var(--muted); font-weight: 600; font-size: var(--fs-sm); }
[data-sim="attenuator"] .at-table td { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
[data-sim="attenuator"] .at-table td:first-child { font-family: var(--sans); white-space: normal; }
[data-sim="attenuator"] .at-table tr.is-sum td { border-bottom: 0; }
[data-sim="attenuator"] .at-table tr.is-sum:first-of-type td { border-top: 2px solid var(--line); }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="attenuator"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="attenuator"] .at { height: auto; padding: 0.6rem; }
  [data-sim="attenuator"] .at-plot { flex: none; width: 100%; height: 11rem; }
  [data-sim="attenuator"] .at-table th,
  [data-sim="attenuator"] .at-table td { padding: 0.25rem 0.3rem; }
  [data-sim="attenuator"] .at-credit { text-align: left; }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Prigušni član</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="at-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian, no grouping.
  function num(s) { s = String(s); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  // up to `d` decimals, trailing zeros dropped (68, 71,5, 96,25)
  function trim(x, d) { return num(parseFloat(x.toFixed(d))); }
  // resistance as the applet: Ω with up to 2 decimals, kΩ from 1000 Ω with up to 3; below 1 Ω up to 3, so the
  // E96 value 0,287 Ω is not shown as its ideal 0,29 Ω
  function ohms(v) { return v >= 1000 ? t('kohm', { v: trim(v / 1000, 3) }) : t('ohm', { v: trim(v, v < 1 ? 3 : 2) }); }
  function db(x, d) { return t('dbv', { v: num(x.toFixed(d)) }); }
  // A share of the power in %, to three significant digits, and its complement to the same decimals (99,99 %).
  function shares(p) {
    var pct = p * 100, d = Math.min(4, Math.max(0, 2 - Math.floor(Math.log10(pct))));
    return { pct: num(parseFloat(pct.toFixed(d))) + ' %', heat: num(parseFloat((100 - pct).toFixed(d))) + ' %' };
  }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }

  var labels = { pi3: 'presetPi3', pi10: 'presetPi10', pi10e96: 'presetPi10e96', t10: 'presetT10', pi15e12: 'presetPi15e12', pi30: 'presetPi30' };

  // ── the stage: source, pad and load as a circuit, drawn in pixels so text stays 1:1 ──
  // Grid units: x 0 … 17, y 0 … 6.4. Rails at y 1.6 and 5.2; the pad sits between its ports at x 4.3 and 12.7.
  var GW = 17, GH = 6.4, TOP = 1.6, BOT = 5.2, IN = 4.3, OUT = 12.7;
  function drawPlot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var k = Math.min(W / GW, H / GH);
    var ox = (W - GW * k) / 2, oy = (H - GH * k) / 2;
    var X = function (x) { return ox + x * k; }, Y = function (y) { return oy + y * k; };
    var full = k >= 48;                 // room for values and port names next to the parts; else names only
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var wire = function (pts) {
      svg.append(s('polyline', { class: 'at-wire', points: pts.map(function (p) { return X(p[0]) + ',' + Y(p[1]); }).join(' ') }));
    };
    var text = function (x, y, anchor, str, cls) {
      var e = s('text', { x: X(x), y: Y(y), 'text-anchor': anchor, 'dominant-baseline': 'middle' }, str);
      if (cls) e.setAttribute('class', cls);
      svg.append(e);
      return e;
    };
    // "R1 = 68 Ω"; the source and load resistors take a subscript (g, L), shifted down and back with dy
    var label = function (x, y, anchor, name, value, sub) {
      var e = text(x, y, anchor, '');
      e.append(s('tspan', { class: 'at-name' }, name));
      if (sub) e.append(s('tspan', { class: 'at-name at-sub', dy: '0.3em' }, sub));
      if (full && value) e.append(s('tspan', sub ? { dy: '-0.3em' } : {}, ' = ' + value));
    };
    // a resistor along the rail (series) or between the rails (across), centred on (cx, cy)
    var LEN = 1.7, WID = 0.55;
    var horiz = function (cx, cls, name, value, sub) {
      svg.append(s('rect', { class: 'at-r ' + cls, x: X(cx - LEN / 2), y: Y(TOP - WID / 2), width: LEN * k, height: WID * k }));
      label(cx, TOP - 0.85, 'middle', name, value, sub);
    };
    var vert = function (cx, cls, name, value, side, sub) {
      var cy = (TOP + BOT) / 2;
      wire([[cx, TOP], [cx, cy - LEN / 2]]);
      wire([[cx, cy + LEN / 2], [cx, BOT]]);
      svg.append(s('rect', { class: 'at-r ' + cls, x: X(cx - WID / 2), y: Y(cy - LEN / 2), width: WID * k, height: LEN * k }));
      label(cx + side * 0.5, cy, side > 0 ? 'start' : 'end', name, value, sub);
    };

    // the dashed outline of the pad, its name and the port names under it
    svg.append(s('rect', { class: 'at-box', x: X(IN + 0.35), y: Y(0.3), width: (OUT - IN - 0.7) * k, height: (BOT + 0.35 - 0.3) * k }));
    if (full) {
      text((IN + OUT) / 2, BOT + 0.8, 'middle', t('pad'), 'at-soft');
      text(IN, BOT + 0.8, 'middle', t('portIn'), 'at-soft');
      text(OUT, BOT + 0.8, 'middle', t('portOut'), 'at-soft');
    }
    // rails
    wire([[0.9, TOP], [OUT + 2.9, TOP]]);
    wire([[0.9, BOT], [OUT + 2.9, BOT]]);
    // the source: a generator with its 50 Ω inner resistance
    var gy = (TOP + BOT) / 2, gr = 0.55;
    wire([[0.9, TOP], [0.9, gy - gr]]);
    wire([[0.9, gy + gr], [0.9, BOT]]);
    svg.append(s('circle', { class: 'at-gen', cx: X(0.9), cy: Y(gy), r: gr * k }));
    var sine = [];
    for (var i = 0; i <= 24; i++) { var u = i / 24; sine.push(X(0.9 - 0.35 + 0.7 * u) + ',' + Y(gy - 0.22 * Math.sin(2 * Math.PI * u))); }
    svg.append(s('polyline', { class: 'at-sine', points: sine.join(' ') }));
    horiz(2.6, 'is-end', 'R', t('ohm', { v: L.Z0 }), t('subSource'));
    // the pad
    var std = st.std;
    if (st.topo === 'pi') {
      vert(IN + 1.1, 'is-across', 'R1', ohms(std.across), 1);
      horiz((IN + OUT) / 2, 'is-series', 'R2', ohms(std.series));
      vert(OUT - 1.1, 'is-across', 'R3', ohms(std.across), -1);
    } else {
      horiz(IN + 1.9, 'is-series', 'R1', ohms(std.series));
      vert((IN + OUT) / 2, 'is-across', 'R3', ohms(std.across), 1);
      horiz(OUT - 1.9, 'is-series', 'R2', ohms(std.series));
    }
    // ports
    [IN, OUT].forEach(function (x) {
      [TOP, BOT].forEach(function (y) { svg.append(s('circle', { class: 'at-term', cx: X(x), cy: Y(y), r: 0.13 * k })); });
    });
    // the load
    vert(OUT + 2.9, 'is-end', 'R', t('ohm', { v: L.Z0 }), -1, t('subLoad'));
    if (full) {
      text(0.9, BOT + 0.8, 'middle', t('source'), 'at-soft');
      text(OUT + 2.9, BOT + 0.8, 'middle', t('load'), 'at-soft');
    }
    box.replaceChildren(svg);
  }

  function table(st) {
    var pi = st.topo === 'pi';
    var row = function (key, a, b, cls) { return h('tr', cls ? { class: cls } : null, h('td', null, t(key)), h('td', null, a), h('td', null, b)); };
    return h('table', { class: 'at-table' },
      h('thead', null, h('tr', null,
        h('th', { scope: 'col' }, t('thResistor')), h('th', { scope: 'col' }, t('thIdeal')),
        h('th', { scope: 'col' }, t('thStd', { series: st.series })))),
      h('tbody', null,
        row(pi ? 'rowAcrossPi' : 'rowSeriesT', ohms(pi ? st.ideal.across : st.ideal.series), ohms(pi ? st.std.across : st.std.series)),
        row(pi ? 'rowSeriesPi' : 'rowAcrossT', ohms(pi ? st.ideal.series : st.ideal.across), ohms(pi ? st.std.series : st.std.across)),
        row('rowAtt', db(st.db, 1), db(st.achieved, 2), 'is-sum'),
        row('rowZin', t('ohm', { v: num(st.zinIdeal.toFixed(2)) }), t('ohm', { v: num(st.zinStd.toFixed(2)) }), 'is-sum')));
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'dt', type: 'range', label: t('db'), hint: t('dbHint'), min: L.DT_MIN, max: L.DT_MAX, step: 1,
        format: function (v) { return db(v / 10, 1); } },
      { key: 'topo', type: 'choice', label: t('topo'), hint: t('topoHint'), options: [['pi', t('topoPi')], ['t', t('topoT')]] },
      { key: 'series', type: 'select', label: t('series'), hint: t('seriesHint'),
        options: L.SERIES_NAMES.map(function (n) { return [n, n]; }) }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendSeries') },
      { c: 2, label: t('legendAcross') },
      { c: 3, shape: 'hollow', label: t('legendEnds') }
    ],

    render: function (c) {
      var plot = h('div', { class: 'at-plot' });
      c.stage.replaceChildren(h('div', { class: 'at' }, plot, table(c.state)));
      drawPlot(plot, c.state);
    },

    caption: function (c) {
      var st = c.state, sh = shares(st.powerOut);
      var b = function (x) { return h('b', null, x); };
      return t.parts('caption', {
        db: b(db(st.db, 1)), pct: b(sh.pct), heat: b(sh.heat), ratio: b(num(parseFloat(st.ratio.toPrecision(3)))),
        series: b(st.series), ach: b(db(st.achieved, 2)), zin: b(t('ohm', { v: num(st.zinStd.toFixed(2)) }))
      });
    }
  });

  // The circuit is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
