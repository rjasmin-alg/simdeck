<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (hooks, chains, addresses, interfaces, rule text) is not language: the word check skips translate="no". */
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function data(s, cls) { return h('span', Object.assign({ translate: 'no' }, cls ? { class: cls } : {}), String(s)); }
  function has(s, mark) { return s.changed.indexOf(mark) >= 0; }
  function ap(a, p) { return a + ':' + p; }
  function hostWord(addr) { var w = L.HOSTS[addr]; return w === 'rtr' ? t('router') : w ? t(w) : addr; }

  // ── rule text (the subject being taught, shown as data) ──

  function matchParts(rule) {
    var m = rule.m, out = [];
    if (m.ct) out.push(['ct', 'ct state established,related']);
    if (m.iif) out.push(['iif', 'iif ' + m.iif]);
    if (m.saddr) out.push(['saddr', 'ip saddr ' + m.saddr]);
    if (m.oif) out.push(['oif', 'oif ' + m.oif]);
    if (m.dport !== undefined) out.push(['dport', 'tcp dport ' + m.dport]);
    return out;
  }
  function actionText(rule) {
    if (rule.v === 'dnat') return 'dnat to ' + ap(rule.to.addr, rule.to.port);
    return rule.v;
  }
  /** The match cell: failing parts struck with ✕ on a row that was read and did not match. */
  function matchCell(rule, miss) {
    var parts = matchParts(rule);
    var nodes = [];
    parts.forEach(function (p, i) {
      if (i) nodes.push(' ');
      nodes.push(h('span', { class: miss && miss.indexOf(p[0]) >= 0 ? 'nf-miss' : null }, p[1]));
    });
    return h('span', { translate: 'no' }, nodes);
  }

  /** A verdict as symbol + word: accept ✓, drop ✕, an address rewrite ↷, skipped –. */
  function verdictNode(v, word) {
    var k = v === 'accept' ? 'accept' : v === 'drop' ? 'drop' : v === 'skip' ? 'skip' : 'nat';
    var sym = { accept: '✓', drop: '✕', nat: '↷', skip: '–' }[k];
    return h('span', { class: 'nf-v', dataset: { v: k } }, h('span', { class: 'nf-sym', 'aria-hidden': 'true' }, sym), word);
  }
  function traceVerdict(x) {
    if (x.verdict === 'skip') return verdictNode('skip', t('traceSkip'));
    if (x.verdict === 'ct-nat') return verdictNode('nat', t('traceCt'));
    return verdictNode(x.verdict, data(x.verdict));
  }

  // ── the hook diagram ──

  /** The short verdict in a hook box: the symbol and the verdict itself (conntrack's rewrite as "conntrack"). */
  function boxVerdict(x) {
    var v = h('div', { class: 'nf-ch-v' });
    if (x.verdict === 'skip') v.append(verdictNode('skip', t('traceSkip')));
    else if (x.verdict === 'ct-nat') v.append(verdictNode('nat', data('conntrack')));
    else v.append(verdictNode(x.verdict, data(x.verdict)));
    return v;
  }

  /** Grid placement of each box and arrow (columns 1–13: boxes on odd columns, arrows on even; rows 1 and 3). */
  var AREA = {
    info: '1 / 1 / 2 / 4', 'in': '3 / 1', prerouting: '3 / 3', route: '3 / 5', input: '1 / 5', local: '1 / 7',
    'route-out': '1 / 9', output: '1 / 11', forward: '3 / 7 / 4 / 10', postrouting: '3 / 11', out: '3 / 13', dropped: '1 / 13'
  };
  var ARROWS = [
    ['3 / 2', '→', 'in', 'prerouting'], ['3 / 4', '→', 'prerouting', 'route'], ['3 / 6', '→', 'route', 'forward'],
    ['3 / 10', '→', 'forward', 'postrouting'], ['3 / 12', '→', 'postrouting', 'out'], ['2 / 5', '↑', 'route', 'input'],
    ['1 / 6', '→', 'input', 'local'], ['1 / 8', '→', 'local', 'route-out'], ['1 / 10', '→', 'route-out', 'output'],
    ['2 / 11', '↓', 'output', 'postrouting']
  ];

  /** Boxes this packet has been through (lit); 'in' and 'local' count where the packet started. */
  function onPath(s, box) {
    if (s.visited.indexOf(box) >= 0) return true;
    if (box === 'in') return !!s.packet.iif;
    if (box === 'local') return s.from === 'rtr' && !s.packet.iif;
    return false;
  }
  function stateOf(s, box) { return s.at === box ? 'here' : onPath(s, box) ? 'lit' : 'dark'; }
  function chip(s) {
    return h('span', { class: 'nf-chip sd-fill' + (s.event.kind !== 'start' ? ' sd-anim-in' : ''), dataset: { c: 1 } },
      '▶ ', s.dir === 'reply' ? t('hereReply') : t('here'));
  }

  function hookBox(s, hook, c) {
    var ord = L.chainsAt(s.chains, hook);
    var lines = ord.chains.map(function (ch) {
      var x = s.trace.filter(function (y) { return y.hook === hook && y.chain === ch.name; })[0];
      return h('div', { class: 'nf-ch' },
        h('span', { class: 'nf-ch-name', translate: 'no' }, ch.name),
        h('span', { class: 'nf-ch-meta', translate: 'no' }, ch.type + ' ' + ch.prio),
        x ? boxVerdict(x) : null);
    });
    var st = stateOf(s, hook);
    return h('section', { class: 'nf-box', dataset: { kind: 'hook', state: st }, style: { gridArea: AREA[hook] } },
      h('h3', { translate: 'no' }, hook),
      lines.length ? h('div', { class: 'nf-chains' }, lines) : h('div', { class: 'nf-box-sub' }, t('noChain')),
      ord.tie ? h('span', { class: 'nf-tie' }, '⚠ ', t('tie')) : null,
      st === 'here' ? chip(s) : null);
  }

  function routeBox(s, box) {
    var st = stateOf(s, box);
    var sub = null;
    if (onPath(s, box)) {
      if (box === 'route-out') sub = t.parts('toIf', { oif: data(s.packet.oif) });
      else if (s.dropAt === 'route') sub = verdictNode('drop', data('drop'));
      else if (s.visited.indexOf('input') >= 0 || (s.at === 'route' && s.route && s.route.to === 'input')) sub = t('toInput');
      else sub = [t('toForward'), ' · ', data(s.packet.oif)];
    }
    return h('section', { class: 'nf-box', dataset: { kind: 'route', state: st }, style: { gridArea: AREA[box] } },
      h('h3', null, t('boxRoute')),
      box === 'route' ? h('div', { class: 'nf-box-sub', translate: 'no' }, 'ip_forward = ' + (s.ipForward ? 1 : 0)) : null,
      sub ? h('div', { class: 'nf-box-sub' }, sub) : null,
      st === 'here' ? chip(s) : null);
  }

  function endBox(s, box) {
    var st = stateOf(s, box);
    var title = { 'in': t('boxIn'), out: t('boxOut'), local: t('boxLocal'), dropped: t('boxDropped') }[box];
    var sub = null;
    var pk = s.packet;
    if (box === 'in' && pk.iif) sub = [data(pk.iif), ' ← ', hostWord(pk.src)];
    if (box === 'out' && onPath(s, 'out')) sub = [data(pk.oif), ' → ', hostWord(pk.dst)];
    if (box === 'local' && onPath(s, 'local')) sub = s.at === 'local' && s.event.kind === 'local' ? [t('gets'), ' ', data(':' + pk.dport)] : [t('sends'), ' ', data(':' + pk.sport)];
    if (box === 'dropped' && s.at === 'dropped') sub = verdictNode('drop', data(s.dropAt));
    return h('section', { class: 'nf-box', dataset: { kind: box === 'dropped' ? 'drop' : 'end', state: st }, style: { gridArea: AREA[box] } },
      h('h3', null, title), sub ? h('div', { class: 'nf-box-sub' }, sub) : null,
      st === 'here' ? chip(s) : null);
  }

  function infoBox() {
    return h('section', { class: 'nf-box nf-sm', dataset: { kind: 'info', state: 'lit' }, style: { gridArea: AREA.info } },
      h('h3', null, t('router'), ' ', data('rtr')),
      h('div', null, data('eth0 198.51.100.10'), ' · ', data('WAN'), ' → ', t('outside'), ' ', data('203.0.113.7')),
      h('div', null, data('eth1 10.0.0.1/24'), ' · ', data('LAN'), ' → ', t('inside'), ' ', data('10.0.0.5')));
  }

  function diagram(s, c) {
    var kids = [infoBox(), endBox(s, 'in'), hookBox(s, 'prerouting', c), routeBox(s, 'route'), hookBox(s, 'input', c),
      endBox(s, 'local'), routeBox(s, 'route-out'), hookBox(s, 'output', c), hookBox(s, 'forward', c),
      hookBox(s, 'postrouting', c), endBox(s, 'out'), endBox(s, 'dropped')];
    ARROWS.forEach(function (a) {
      var lit = onPath(s, a[2]) && onPath(s, a[3]);
      kids.push(h('span', { class: 'nf-arrow', 'aria-hidden': 'true', dataset: lit ? {} : { off: '' }, style: { gridArea: a[0] } }, a[1]));
    });
    return h('div', { class: 'nf-dia' }, kids);
  }

  // ── the packet card and the connection table ──

  function packetCard(s) {
    var pk = s.packet, o = s.orig;
    function field(k) {
      var rw = pk[k] !== o[k] && k !== 'oif';
      var v = pk[k] === null ? '–' : String(pk[k]);
      return h('div', { class: 'nf-f' },
        h('span', { class: 'nf-f-k', translate: 'no' }, k),
        h('span', { class: 'nf-f-v' + (has(s, 'pkt:' + k) ? ' sd-changed' : ''), translate: 'no', dataset: rw ? { rw: '' } : {} }, v),
        rw ? h('span', { class: 'nf-f-old', translate: 'no' }, String(o[k])) : null);
    }
    var ctw = !s.ct ? (s.at === 'dropped' && has(s, 'ct:gone') ? t('ctGone') : t('ctNone')) : s.ct.state === 'new' ? t('ctNew') : t('ctEst');
    return h('section', { class: 'nf-panel nf-card' },
      h('div', { class: 'nf-head' }, h('h3', null, s.dir === 'reply' ? t('cardReply') : t('cardPacket')), data(pk.proto, 'nf-sm'),
        h('span', { class: 'nf-sm' }, t('ctState'), ': ', h('b', null, ctw))),
      h('div', { class: 'nf-fields' }, ['src', 'sport', 'iif', 'dst', 'dport', 'oif'].map(field)));
  }

  function tuple(x) { return ap(x.src, x.sport) + ' → ' + ap(x.dst, x.dport); }
  function connTable(s) {
    var rows = s.conntrack.map(function (e, i) {
      var ch = has(s, 'ct:' + i);
      return h('div', { class: 'nf-ct' + (ch ? ' sd-changed' : '') },
        h('span', { class: 'nf-ct-k' }, t('colOrig')), data(tuple(e.orig)),
        h('span', { class: 'nf-ct-k' }, t('colReply')), data(tuple(e.reply)),
        h('div', { class: 'nf-ct-tags' },
          h('span', { class: 'nf-tag' + (ch ? ' sd-changed' : '') }, t('colStatus'), ': ', e.status === 'new' ? t('ctNew') : t('ctEst')),
          e.nat.length ? h('span', { class: 'nf-tag', translate: 'no' }, e.nat.join(' ')) : h('span', { class: 'nf-tag', dataset: { k: 'dashed' } }, t('colNat'), ': –')));
    });
    return h('section', { class: 'nf-panel' }, h('h3', null, t('ctTitle')), data('conntrack', 'nf-sm nf-muted'),
      rows.length ? h('div', { class: 'nf-cts' }, rows) : h('div', { class: 'nf-empty' }, t('ctEmpty')));
  }

  // ── the detail: chains of this hook, the routing decision, or the whole path ──

  function chainTable(s, ch, x, c) {
    var head = t.parts('chainHead', { name: data(ch.name), type: data(ch.type), prio: data(ch.prio) });
    if (x && (x.verdict === 'skip' || x.verdict === 'ct-nat')) {
      var what = L.NAT_POINT[x.hook] === 'dst' ? t('whatDst') : t('whatSrc');
      var val = L.NAT_POINT[x.hook] === 'dst' ? ap(s.packet.dst, s.packet.dport) : ap(s.packet.src, s.packet.sport);
      return h('div', { class: 'nf-off' }, h('div', null, head), h('p', { class: 'nf-note' }, t('skippedNat')),
        h('p', { class: 'nf-note nf-ctdid' }, x.verdict === 'ct-nat' ? t.parts('ctDid', { what: what, value: data(val) }) : t('ctDidNothing')));
    }
    var at = x ? x.rule : -1;
    return RT({
      dir: c.dir,
      mode: 'first',
      title: head,
      columns: [{ key: 'match', label: t('colMatch'), wrap: true }],
      actionLabel: t('colVerdict'),
      markLabel: s.dir === 'reply' ? t('hereReply') : t('here'),
      rows: ch.rules.map(function (r, i) {
        var read = x && i <= at && i < ch.rules.length;
        var miss = read ? x.miss[i] : null;
        return { no: i + 1, cells: { match: matchCell(r, miss && miss.length ? miss : null) }, action: actionText(r),
          effect: r.v === 'drop' ? 'deny' : 'allow', hit: read ? miss.length === 0 : null };
      }),
      implicit: { text: t('policyRow'), action: ch.policy, effect: ch.policy === 'drop' ? 'deny' : 'allow' },
      at: x ? at : -1,
      subject: { mark: s.dir === 'reply' ? '←' : '→', c: 1 },
      done: !!x,
      outcome: function () { return traceVerdict(x); },
      words: { win: t('markWin'), skip: t('markSkip') },
      changed: !!x,
      stickyMark: true
    });
  }

  function routeTable(s) {
    var r = s.route;
    var local = s.at === 'route' && r.local;
    var rows = [h('tr', { class: local ? 'sd-changed' : null, dataset: local ? { hit: '' } : {} },
      h('td', null, data(L.LOCAL_ADDRS.join(', ')), ' (', t('rtLocal'), ')'), h('td', { translate: 'no' }, 'input'))];
    L.ROUTES.forEach(function (x, i) {
      var hit = !local && r.route === i;
      rows.push(h('tr', { class: hit ? 'sd-changed' : null, dataset: hit ? { hit: '' } : {} },
        h('td', { translate: 'no' }, x.dst), h('td', { translate: 'no' }, x.oif)));
    });
    var fwd = s.at === 'route'
      ? h('div', { class: 'nf-fwd' }, h('b', { translate: 'no' }, 'net.ipv4.ip_forward = ' + (s.ipForward ? 1 : 0)), ' ',
        s.ipForward ? t('rtForwardOn') : verdictNode('drop', t('rtForwardOff')))
      : h('div', { class: 'nf-fwd' }, t('rtNoCheck'));
    return h('div', { class: 'nf-panel' }, h('h3', null, t('rtTitle'), ': ', data(ap(s.packet.dst, s.packet.dport))),
      h('table', { class: 'nf-tbl' }, h('thead', null, h('tr', null, h('th', null, t('rtDest')), h('th', null, t('rtIf')))),
        h('tbody', null, rows)), fwd);
  }

  function traceTable(s) {
    if (!s.trace.length) return h('div', { class: 'nf-panel' }, h('h3', null, t('traceTitle')), h('div', { class: 'nf-empty' }, t('notYet')));
    var rows = s.trace.map(function (x) {
      return h('tr', null, h('td', { translate: 'no' }, x.hook), h('td', { translate: 'no' }, x.chain),
        h('td', null, x.rule === null ? '' : x.rule < chainOf(s, x.chain).rules.length ? t('traceRule', { n: x.rule + 1 }) : t('tracePolicy')),
        h('td', null, traceVerdict(x)));
    });
    return h('div', { class: 'nf-panel' }, h('h3', null, t('traceTitle')), h('table', { class: 'nf-tbl' }, h('tbody', null, rows)));
  }
  function chainOf(s, name) { return s.chains.filter(function (c) { return c.name === name; })[0]; }

  function detail(s, c) {
    var kids = [];
    if (L.HOOKS.indexOf(s.at) >= 0) {
      var ord = L.chainsAt(s.chains, s.at);
      kids.push(h('h3', null, t.parts('chainsAt', { hook: data(s.at) })));
      if (!ord.chains.length) kids.push(h('div', { class: 'nf-off' }, t('hookNoChain')));
      ord.chains.forEach(function (ch) {
        var x = s.trace.filter(function (y) { return y.hook === s.at && y.chain === ch.name; })[0];
        kids.push(chainTable(s, ch, x, c));
      });
    } else if (s.at === 'route' || s.at === 'route-out') kids.push(routeTable(s));
    else kids.push(traceTable(s));
    return h('div', { class: 'nf-detail' }, kids);
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, e = s.event, pk = s.packet;
    var out = [];
    function add(x) { if (out.length) out.push(' '); out.push.apply(out, Array.isArray(x) ? x : [x]); }
    var first = (s.dir === 'reply' && s.visited.length === 1);
    if (first) add(pk.iif ? t.parts('cReplyIn', { src: code(ap(s.orig.src, s.orig.sport)), dst: code(ap(s.orig.dst, s.orig.dport)), iif: code(pk.iif) })
      : t.parts('cReplyLocal', { src: code(ap(s.orig.src, s.orig.sport)), dst: code(ap(s.orig.dst, s.orig.dport)) }));
    switch (e.kind) {
      case 'start':
        if (pk.iif) add(t.parts('cStartIn', { who: hostWord(pk.src), src: code(ap(pk.src, pk.sport)), dst: code(ap(pk.dst, pk.dport)), iif: code(pk.iif) }));
        else add(t.parts('cStartLocal', { dst: code(ap(pk.dst, pk.dport)) }));
        break;
      case 'hook': hookCaption(s, add); break;
      case 'route':
        if (e.to === 'dropped') add(t.parts('rNoFwd', { dst: code(pk.dst), sysctl: code('ip_forward = 0') }));
        else if (e.to === 'input') add(t.parts('rLocal', { dst: code(pk.dst) }));
        else if (e.rewrite === 'dnat') add(t.parts('rDnat', { pre: code('prerouting'), dst: code(ap(pk.dst, pk.dport)), fwd: code('forward'), inp: code('input') }));
        else if (e.rewrite === 'ct') add(t.parts('rCt', { dst: code(ap(pk.dst, pk.dport)), oif: code(pk.oif) }));
        else add(t.parts('rFwd', { dst: code(pk.dst), oif: code(pk.oif) }));
        break;
      case 'route-out':
        add(t.parts('rOut', { dst: code(pk.dst), oif: code(pk.oif) }));
        break;
      case 'local':
        add(t.parts('cLocal', { dport: code(pk.dport) }));
        break;
      case 'out':
        add(t.parts('cOut', { oif: code(pk.oif), dst: code(ap(pk.dst, pk.dport)), who: hostWord(pk.dst) }));
        if (pk.src !== s.orig.src) add(t.parts('cOutSnat', { src: code(ap(pk.src, pk.sport)), old: code(ap(s.orig.src, s.orig.sport)) }));
        else if (pk.dst !== s.orig.dst) add(t.parts('cOutDnat', { dst: code(ap(pk.dst, pk.dport)), old: code(ap(s.orig.dst, s.orig.dport)) }));
        break;
      default:
        add(e.where === 'route' ? t('cDroppedRoute') : t.parts(has(s, 'ct:gone') ? 'cDropped' : 'cDroppedReply', { where: code(e.where) }));
    }
    return out;
  }

  function hookCaption(s, add) {
    var hook = s.at, pk = s.packet;
    var ord = L.chainsAt(s.chains, hook);
    var here = s.trace.filter(function (x) { return x.hook === hook; });
    if (!ord.chains.length) { add(t.parts('hNoChain', { hook: code(hook) })); return; }
    if (ord.tie) {
      var a = ord.chains[0], b = ord.chains[1];
      add(t.parts('hTie', { a: code(a.name), b: code(b.name), prio: code(a.prio) }));
    }
    here.forEach(function (x, i) {
      var ch = chainOf(s, x.chain), n = code(x.rule === null ? '' : x.rule + 1);
      var name = code(x.chain), name2 = code(x.chain); // a node can sit in one place only
      var policy = x.rule !== null && x.rule >= ch.rules.length;
      if (x.verdict === 'skip') add(t.parts('hNatSkip', { chain: name }));
      else if (x.verdict === 'ct-nat') {
        var dst = L.NAT_POINT[hook] === 'dst';
        add(t.parts('hCtNat', { chain: name, what: dst ? t('whatDst') : t('whatSrc'), value: code(dst ? ap(pk.dst, pk.dport) : ap(pk.src, pk.sport)) }));
      } else if (x.verdict === 'dnat') add(t.parts('hDnat', { chain: name, n: n, to: code(ap(pk.dst, pk.dport)) }));
      else if (x.verdict === 'masquerade') {
        add(t.parts('hMasq', { chain: name, n: n, addr: code(pk.src), oif: code(pk.oif) }));
        add(t.parts('hMasqAfter', { old: code(s.orig.src) }));
      } else if (ch.type === 'nat' && policy) add(t.parts('hNatNoMatch', { chain: name }));
      else if (x.verdict === 'accept') {
        add(t.parts(policy ? 'hAcceptPolicy' : 'hAccept', { chain: name, n: n }));
        var next = here[i + 1];
        if (next) add(t.parts('hNotFinal', { chain: name2, next: code(next.chain) }));
      } else add(t.parts(policy ? 'hDropPolicy' : 'hDrop', { chain: name, n: n }));
    });
    if (hook === 'forward' && s.dir === 'orig' && pk.dst !== s.orig.dst) add(t.parts('hSeesDnat', { dst: code(ap(pk.dst, pk.dport)) }));
  }

  // ── the stage ──
  function render(c) {
    var s = c.state;
    var low = h('div', { class: 'nf-low' },
      h('div', { class: 'nf-col' }, packetCard(s), connTable(s)),
      detail(s, c));
    c.stage.replaceChildren(h('div', { class: 'nf' }, diagram(s, c), low));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'packet', type: 'choice', label: t('packet'), resets: true,
        options: [['ssh-in', t('pkSshIn')], ['port-fwd', t('pkPortFwd')], ['lan-out', t('pkLanOut')], ['local-out', t('pkLocalOut')]] },
      { key: 'reply', type: 'toggle', label: t('reply') },
      { key: 'ipForward', type: 'toggle', label: t('ipForward') },
      { key: 'inputPolicy', type: 'choice', label: t('inputPolicy'), options: [['accept', t('optAccept')], ['drop', t('optDrop')]] },
      { key: 'fwdRule', type: 'choice', label: t('fwdRule'), options: [['80', t('fwd80')], ['8080', t('fwd8080')], ['none', t('fwdNone')]] },
      { key: 'extra', type: 'choice', label: t('extra'), hint: t('extraHint'), options: [['none', t('extraNone')], ['10', '10'], ['0', '0']] }
    ],

    presets: [
      { id: 'inbound-ssh', label: t('pInbound'), params: { packet: 'ssh-in' } },
      { id: 'port-forward', label: t('pPortFwd'), params: { packet: 'port-fwd' } },
      { id: 'masquerade', label: t('pMasq'), params: { packet: 'lan-out', reply: true } },
      { id: 'local-out', label: t('pLocalOut'), params: { packet: 'local-out' } },
      { id: 'accept-not-final', label: t('pAcceptNotFinal'), params: { packet: 'ssh-in', extra: '10' } },
      { id: 'no-forwarding', label: t('pNoForward'), params: { packet: 'lan-out', ipForward: false } }
    ],

    legend: [
      { shape: 'nf-lit', label: t('lgPath') },
      { shape: 'nf-dark', label: t('lgDark') },
      { shape: 'nf-accept', label: t('lgAccept') },
      { shape: 'nf-drop', label: t('lgDrop') },
      { shape: 'nf-nat', label: t('lgNat') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
