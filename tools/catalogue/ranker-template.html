<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simdeck catalogue ranker</title>
<style>
:root {
  --bg: #f7f6f2; --card: #ffffff; --ink: #1d1d1b; --muted: #66645e; --line: #dedbd2;
  --accent: #2459c9; --i3: #1f8a4c; --i2: #2459c9; --i1: #a06a00; --i0: #b0362e; --chip: #efede6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --card: #201f1c; --ink: #ecebe6; --muted: #a4a198; --line: #36342f;
    --accent: #7aa2ff; --i3: #4cc27f; --i2: #7aa2ff; --i1: #e0a53a; --i0: #ec7066; --chip: #2a2925;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 12px 16px; }
h1 { font-size: 18px; margin: 0 0 8px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar input[type=search] { flex: 1 1 220px; }
input, select, button { font: inherit; color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
.counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--muted); }
.counts span b { color: var(--ink); }
main { padding: 8px 16px 48px; max-width: 1200px; margin: 0 auto; }
h2 { font-size: 16px; margin: 20px 0 6px; display: flex; gap: 8px; align-items: baseline; }
h2 small { color: var(--muted); font-weight: normal; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; background: var(--card);
  border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 6px;
  padding: 8px 10px; margin: 4px 0; }
.row[data-int="3"] { border-left-color: var(--i3); }
.row[data-int="2"] { border-left-color: var(--i2); }
.row[data-int="1"] { border-left-color: var(--i1); }
.row[data-int="0"] { border-left-color: var(--i0); opacity: .55; }
.title { font-weight: 600; }
.id { font: 12px ui-monospace, monospace; color: var(--muted); margin-left: 6px; }
.concept { color: var(--muted); font-size: 14px; grid-column: 1; }
.meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; font-size: 12px; }
.chip { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
.chip.pri { font-weight: 600; }
.seed { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.rate { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 4px; align-self: start; }
.rate button { width: 34px; padding: 4px 0; font-weight: 600; }
.rate button[aria-pressed="true"][data-v="3"] { background: var(--i3); color: #fff; border-color: var(--i3); }
.rate button[aria-pressed="true"][data-v="2"] { background: var(--i2); color: #fff; border-color: var(--i2); }
.rate button[aria-pressed="true"][data-v="1"] { background: var(--i1); color: #fff; border-color: var(--i1); }
.rate button[aria-pressed="true"][data-v="0"] { background: var(--i0); color: #fff; border-color: var(--i0); }
.help { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
@media (max-width: 640px) {
  .row { grid-template-columns: 1fr; }
  .rate { grid-row: auto; grid-column: 1; }
}
</style>
</head>
<body>
<header>
  <h1>Simdeck catalogue ranker</h1>
  <div class="bar">
    <input type="search" id="q" placeholder="Search title, concept, id, seed" aria-label="Search">
    <select id="kind" aria-label="Kind">
      <option value="">Build + adopt</option><option value="build">Build list</option><option value="adopt">Adoption list</option>
    </select>
    <select id="area" aria-label="Area"><option value="">All areas</option></select>
    <select id="course" aria-label="Course"><option value="">All courses</option></select>
    <select id="pri" aria-label="Priority">
      <option value="">All priorities</option><option>B1</option><option>P1</option><option>P2</option><option>P3</option>
    </select>
    <select id="group" aria-label="Group by">
      <option value="int">Group by interest</option><option value="area">Group by area</option>
      <option value="course">Group by course</option><option value="pri">Group by priority</option>
      <option value="none">One ranked list</option>
    </select>
    <label><input type="checkbox" id="hide0"> hide dropped</label>
    <button id="export">Export ratings</button>
    <button id="import">Import</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>
  <div class="counts" id="counts"></div>
  <p class="help">Rate each entry: 3 want soon, 2 interested, 1 maybe later, 0 drop. Click again to clear.
    Ratings stay in this browser. Export them and run <code>ranker.py merge ratings.json</code>, or drop
    the file in the project's uploads folder.</p>
</header>
<main id="list"></main>
<script>
const DATA = /*DATA*/[];
const KEY = "simdeck-ranker-v1";
const PRI = { B1: 0, P1: 1, P2: 2, P3: 3 };
const SIZE = { S: 0, M: 1, L: 2 };
const INT_LABEL = { 3: "3 · want soon", 2: "2 · interested", 1: "1 · maybe later", "": "unrated", 0: "0 · dropped" };
const INT_ORDER = { 3: 0, 2: 1, 1: 2, "": 3, 0: 4 };

let ratings = {};
for (const d of DATA) if (d.int !== "") ratings[d.id] = Number(d.int);
try { Object.assign(ratings, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(ratings)); } catch (e) {} }
function rated(id) { return id in ratings && ratings[id] !== null ? String(ratings[id]) : ""; }

const $ = (id) => document.getElementById(id);
const areas = [...new Map(DATA.map(d => [d.sec, d.area])).entries()];
for (const [sec, name] of areas) $("area").append(new Option(sec + " " + name, sec));
for (const c of [...new Set(DATA.flatMap(d => d.courses))].sort()) $("course").append(new Option(c, c));

function rankCmp(a, b) {
  return (INT_ORDER[rated(a.id)] - INT_ORDER[rated(b.id)])
    || ((PRI[a.pri] ?? 9) - (PRI[b.pri] ?? 9))
    || ((SIZE[a.size] ?? 9) - (SIZE[b.size] ?? 9))
    || a.id.localeCompare(b.id);
}

function filtered() {
  const q = $("q").value.trim().toLowerCase();
  return DATA.filter(d =>
    (!$("kind").value || d.kind === $("kind").value) &&
    (!$("area").value || d.sec === $("area").value) &&
    (!$("course").value || d.courses.includes($("course").value)) &&
    (!$("pri").value || d.pri === $("pri").value) &&
    (!$("hide0").checked || rated(d.id) !== "0") &&
    (!q || [d.id, d.title, d.concept, d.seed, d.does].join(" ").toLowerCase().includes(q)));
}

function groupsOf(items) {
  const mode = $("group").value, g = new Map();
  const add = (k, d) => { if (!g.has(k)) g.set(k, []); g.get(k).push(d); };
  for (const d of items) {
    if (mode === "int") add(INT_LABEL[rated(d.id)], d);
    else if (mode === "area") add(d.sec + " " + d.area, d);
    else if (mode === "pri") add(d.pri || "none", d);
    else if (mode === "course") (d.courses.length ? d.courses : ["(no course)"]).forEach(c => add(c, d));
    else add("Ranked", d);
  }
  let keys = [...g.keys()];
  if (mode === "int") keys = [3, 2, 1, "", 0].map(k => INT_LABEL[k]).filter(k => g.has(k));
  else if (mode === "pri") keys.sort((a, b) => (PRI[a] ?? 9) - (PRI[b] ?? 9));
  else if (mode === "area") keys.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  else keys.sort();
  return keys.map(k => [k, g.get(k).sort(rankCmp)]);
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render() {
  const list = $("list"); list.replaceChildren();
  const items = filtered();
  for (const [name, rows] of groupsOf(items)) {
    const h = el("h2", null, name); h.append(el("small", null, rows.length + " entries")); list.append(h);
    for (const d of rows) {
      const r = el("div", "row"); r.dataset.int = rated(d.id);
      const t = el("div"); t.append(el("span", "title", d.title), el("span", "id", d.id));
      const rate = el("div", "rate");
      for (const v of [3, 2, 1, 0]) {
        const b = el("button", null, String(v)); b.dataset.v = v;
        b.setAttribute("aria-pressed", rated(d.id) === String(v));
        b.title = INT_LABEL[v];
        b.onclick = () => { if (rated(d.id) === String(v)) delete ratings[d.id]; else ratings[d.id] = v; save(); render(); };
        rate.append(b);
      }
      const meta = el("div", "meta");
      meta.append(el("span", "chip", d.kind === "adopt" ? "adopt" : "build"));
      if (d.pri) meta.append(el("span", "chip pri", d.pri));
      if (d.size) meta.append(el("span", "chip", "size " + d.size));
      for (const c of d.courses) meta.append(el("span", "chip", c));
      meta.append(el("span", "chip", d.sec + " " + d.area));
      if (d.seed) meta.append(el("span", "seed", d.seed));
      r.append(t, rate, el("div", "concept", [d.concept, d.does].filter(Boolean).join(" — ")), meta);
      list.append(r);
    }
  }
  const c = { 3: 0, 2: 0, 1: 0, 0: 0, "": 0 };
  for (const d of DATA) c[rated(d.id)]++;
  $("counts").replaceChildren(...[3, 2, 1, 0, ""].map(k => { const s = el("span"); s.append(el("b", null, c[k]), " " + INT_LABEL[k]); return s; }),
    el("span", null, "· showing " + items.length + " of " + DATA.length));
}

$("export").onclick = () => {
  const blob = new Blob([JSON.stringify(ratings, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "ratings.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("import").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { Object.assign(ratings, JSON.parse(await f.text())); save(); render(); } catch (err) { alert("Not a ratings file: " + err.message); }
};
for (const id of ["q", "kind", "area", "course", "pri", "group", "hide0"]) $(id).addEventListener("input", render);
render();
</script>
</body>
</html>
