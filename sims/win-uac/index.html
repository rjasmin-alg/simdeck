<!-- win-uac: an administrator runs with a filtered token until elevated. ana (Administrators) logs on to PC-07: two
     linked tokens, the desktop gets the filtered one; a task from Explorer is checked with it, "Run as administrator"
     asks and starts a new process with the full token, children inherit their parent's token. A stepper, one action
     and its check per step.
     Left: the logon (who, UAC), the two token cards side by side with the chain between them (SIDs with their
     attribute, privileges, integrity level), and the process tree with the UAC prompt. Right: the access check of the
     last attempt: the process and token used, the target, the integrity check, the DACL as kit view K4
     (kit/ruletable.js), or the privilege the task needs.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVGNS = 'http://www.w3.org/2000/svg';
  /** Privileges a full token shows by name besides the five it shares with the filtered one; the rest are counted. */
  var NOTABLE = ['SeSystemtimePrivilege', 'SeBackupPrivilege', 'SeDebugPrivilege'];

  /** Data (names, SIDs, paths, levels) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'uac-mono' : cls || null }, String(text)); }
  function q(text) { return h('b', { translate: 'no' }, String(text)); }
  function sub(text) { return h('span', { class: 'uac-sub' }, text); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) { if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit); });
    });
    return out;
  }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function chg(on, c) { return on ? ' sd-changed' + anim(c) : ''; }
  /** "SeTimeZonePrivilege" → "TimeZone" (the full name in the tooltip). */
  function shortPriv(p) { return p.replace(/^Se/, '').replace(/Privilege$/, ''); }
  function lastAttempt(s) { return s.attempts.length ? s.attempts[s.attempts.length - 1] : null; }
  function ilBadge(il) { return h('span', { class: 'uac-il', dataset: { il: il }, translate: 'no', title: il === 'H' ? 'High' : 'Medium' }, il); }
  function tokWord(kind) { return t(kind === 'full' ? 'procTokFull' : kind === 'standard' ? 'procTokStandard' : 'procTokFiltered'); }
  function taskPhrase(s) { return t('do_' + s.task); }
  function cap(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

  /** What the last check used: { slot, sids: [names], priv } (the page marks those chips "changed"). */
  function used(c) {
    var s = c.state, e = s.last;
    if (!e || e.kind !== 'attempt') return null;
    var a = lastAttempt(s), task = L.TASKS[a.task];
    if (a.by === 'priv') return { slot: a.token, sids: [], priv: a.priv };
    var names = [];
    a.rows.forEach(function (r, i) { if (r === 'decides' || r === 'denyOnly') names.push(task.dacl[i].who); });
    return { slot: a.token, sids: names, priv: null };
  }

  // ── tokens ──
  function chainSvg() {
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 44');
    svg.setAttribute('aria-hidden', 'true');
    [[4, 2], [4, 22]].forEach(function (xy) {
      var r = document.createElementNS(SVGNS, 'rect');
      r.setAttribute('x', xy[0]); r.setAttribute('y', xy[1]); r.setAttribute('width', 16); r.setAttribute('height', 20);
      r.setAttribute('rx', 7); r.setAttribute('fill', 'none'); r.setAttribute('stroke', 'currentColor'); r.setAttribute('stroke-width', 3);
      svg.appendChild(r);
    });
    var l = document.createElementNS(SVGNS, 'rect');
    l.setAttribute('x', 9); l.setAttribute('y', 12); l.setAttribute('width', 6); l.setAttribute('height', 20);
    l.setAttribute('rx', 3); l.setAttribute('fill', 'none'); l.setAttribute('stroke', 'currentColor'); l.setAttribute('stroke-width', 3);
    svg.appendChild(l);
    return svg;
  }
  function tokenCard(c, slot) {
    var s = c.state, tok = s.tokens[slot], u = used(c);
    var fresh = s.last && (s.last.kind === 'logon' || (s.last.kind === 'approve' && slot === 'full' && s.last.prompt === 'credentials'));
    if (!tok) {
      var why;
      if (!s.last) why = slot === 'filtered' ? t('notYet', { user: s.user }) : '';
      else if (slot === 'filtered') why = s.uacOn ? t('noFilteredBuiltin') : t('noFilteredOff');
      else why = s.uacOn ? t('noFullYet') : t('noFullStandard', { user: s.user });
      if (!s.last && slot === 'full') why = s.isAdmin ? '' : t('noFullStandard', { user: s.user });
      return h('section', { class: 'uac-card', dataset: { k: 'none' } },
        h('h3', null, t(slot === 'full' ? 'tokFull' : s.isAdmin ? 'tokFiltered' : 'tokStandard')), why ? sub(why) : null);
    }
    var head = t(tok.kind === 'full' ? 'tokFull' : tok.kind === 'standard' ? 'tokStandard' : 'tokFiltered');
    var mine = u && u.slot === slot;
    var rows = [];
    tok.sids.forEach(function (x) {
      var deny = x.attr === 'denyOnly';
      var hot = mine && u.sids.indexOf(x.name) >= 0;
      rows.push(h('span', { class: 'uac-chip' + chg(hot, c), dataset: { attr: x.attr }, title: deny ? t('denyOnlyTag') : null },
        deny ? h('span', { class: 'uac-stop', 'aria-hidden': 'true' }) : null, data(x.name, '')));
      rows.push(h('span', { class: 'uac-sid-v' }, data(x.sid, ''), deny ? [' ', h('span', { class: 'uac-sub' }, t('denyOnlyTag'))] : null));
    });
    var shown = tok.kind === 'full' ? L.LIMITED_PRIVS.concat(NOTABLE).filter(function (p) { return tok.privs.indexOf(p) >= 0; }) : tok.privs;
    var more = tok.privs.length - shown.length;
    var privs = shown.map(function (p) {
      var hot = mine && u.priv === p;
      return h('span', { class: 'uac-priv' + chg(hot, c), title: p }, h('span', { class: 'uac-key', 'aria-hidden': 'true' }), data(shortPriv(p), ''));
    });
    if (more > 0) privs.push(sub(t.n('privsMore', more)));
    return h('section', { class: 'uac-card' + chg(fresh, c), dataset: { k: tok.kind === 'full' ? 'full' : 'thin' } },
      h('h3', null, head, ilBadge(tok.il), sub(t.parts('tokOfUser', { user: data(tok.user, '') }))),
      h('div', { class: 'uac-sids' }, rows),
      h('div', { class: 'uac-privs' }, h('b', { class: 'uac-sub' }, t('privsLabel')), privs));
  }
  function tokensRow(c) {
    var s = c.state, linked = s.tokens.filtered && s.tokens.full && s.tokens.filtered.linked;
    return h('div', { class: 'uac-tokens' }, tokenCard(c, 'filtered'),
      h('div', { class: 'uac-chain', dataset: linked ? {} : { k: 'none' } }, chainSvg(), h('span', null, t('linked'))),
      tokenCard(c, 'full'));
  }

  // ── processes ──
  function procBox(c, pr) {
    var s = c.state, e = s.last;
    var kind = s.tokens[pr.token].kind;
    var fresh = e && ((e.kind === 'explorer' && pr.id === 'explorer') || (e.kind === 'approve' && pr.id === 'cmd') ||
      (e.kind === 'spawn' && e.id === pr.id) || (e.kind === 'attempt' && e.proc === pr.id));
    var res = s.attempts.filter(function (a) { return a.proc === pr.id; }).map(function (a) {
      return h('span', { class: 'uac-res', dataset: { ok: a.ok ? '1' : '0' } }, (a.ok ? '✓ ' : '✕ ') + t(a.ok ? 'attemptOk' : 'attemptDenied'));
    });
    return h('div', { class: 'uac-proc' + chg(fresh, c), dataset: { k: kind === 'full' ? 'full' : 'thin' } },
      h('b', { translate: 'no' }, pr.image), ilBadge(pr.il),
      sub(t.parts('procAs', { user: data(pr.user, '') })),
      h('span', { class: 'uac-tag' }, tokWord(kind)),
      pr.elevated ? h('span', { class: 'uac-elev' }, '⇧ ' + t('elevatedTag')) : null,
      res);
  }
  function promptBox(c) {
    var s = c.state;
    if (!s.prompt) return null;
    var cred = s.prompt === 'credentials';
    return h('div', { class: 'uac-prompt' + chg(s.last && s.last.kind === 'prompt', c), role: 'img', 'aria-label': t('promptTitle') },
      h('h3', null, t('promptTitle')),
      h('div', { class: 'uac-line' }, t(cred ? 'promptCred' : 'promptConsent')),
      cred ? [h('div', { class: 'uac-field' }, h('span', null, t('promptUser')), data(L.CRED_ADMIN, '')),
        h('div', { class: 'uac-field' }, h('span', null, t('promptPass')), data('••••••••', ''))] : null,
      h('div', { class: 'uac-btns' }, h('span', { class: 'uac-btn', dataset: { k: 'yes' } }, t('promptYes')), h('span', { class: 'uac-btn' }, t('promptNo'))));
  }
  function tree(c, parent) {
    var s = c.state;
    var kids = s.procs.filter(function (p) { return p.parent === parent; });
    var items = kids.map(function (p) {
      var sub_ = tree(c, p.id);
      var extra = p.id === 'explorer' && s.prompt ? h('ul', { class: 'uac-tree' }, h('li', null, promptBox(c))) : null;
      return h('li', null, procBox(c, p), sub_, extra);
    });
    return items.length ? h('ul', { class: 'uac-tree' }, items) : null;
  }
  function logonCol(c) {
    var s = c.state;
    var kind = s.user === 'Administrator' ? 'kindBuiltin' : s.isAdmin ? 'kindAdmin' : 'kindStandard';
    return h('div', { class: 'uac-col uac-tok' },
      h('h2', null, t.parts('logonTitle', { pc: data(L.PC, '') }), data(s.user, ''), sub(t(kind)),
        h('span', { class: 'uac-tag', dataset: s.uacOn ? {} : { k: 'off' } }, t(s.uacOn ? 'uacOn' : 'uacOff'))),
      tokensRow(c));
  }
  function procsCol(c) {
    var s = c.state;
    return h('div', { class: 'uac-col uac-procs' }, h('h2', null, t('procsTitle')),
      s.procs.length ? tree(c, null) : sub(t('procsNone')));
  }

  // ── access check ──
  function rightsWord(ace) {
    if (ace.level === 'all') return h('span', null, t('svcAll'));
    if (ace.level === 'query') return h('span', null, t('svcQuery'));
    return data({ full: 'Full control', rx: 'Read & execute', read: 'Read' }[ace.level], '');
  }
  function checkCol(c) {
    var s = c.state, a = lastAttempt(s), task = L.TASKS[s.task];
    var fresh = !!a && s.last && s.last.kind === 'attempt';
    var head = h('h3', { class: 'uac-chk-h' }, t('chkTitle'));
    var target = task.kind === 'priv'
      ? h('div', { class: 'uac-line' }, h('b', null, t('task_timezone')))
      : h('div', { class: 'uac-line' }, data(task.target, 'uac-path'), sub(t('kind_' + task.kind)), sub(t('chkTarget', { need: t('need_' + task.need) })));
    if (!a) return h('div', { class: 'uac-col uac-chk' }, h('section', { class: 'uac-box' }, h('div', { class: 'uac-chk-info' }, head, target, sub(t('chkNone', { task: taskPhrase(s) })))));
    var pr = s.procs.filter(function (p) { return p.id === a.proc; })[0];
    var tokKind = s.tokens[a.token].kind;
    var who = h('div', { class: 'uac-line' }, t.parts('chkWho', { n: String(a.n), proc: q(pr.image), tok: tokWord(tokKind) }), ilBadge(pr.il), sub(t.parts('procAs', { user: data(pr.user, '') })));
    var body, info = [head, who, target];
    if (a.by === 'priv') {
      info.push(sub(t('privNoAcl')));
      body = h('div', { class: 'uac-chk-info' }, h('div', { class: 'uac-line' }, sub(t('privNeed')),
        h('span', { class: 'uac-priv' + chg(fresh, c) }, h('span', { class: 'uac-key', 'aria-hidden': 'true' }), data(a.priv, ''))),
        h('div', { class: 'uac-line uac-mic', dataset: { ok: a.ok ? '1' : '0' } }, t(a.ok ? 'privHeld' : 'privMissing')));
    } else {
      info.push(h('div', { class: 'uac-line uac-mic', dataset: { ok: a.il.ok ? '1' : '0' } },
        h('span', null, t.parts('micLine', { p: ilBadge(a.il.proc), o: ilBadge(a.il.obj) })), sub(t(a.il.ok ? 'micPass' : 'micFail'))));
      var need = t('need_' + task.need);
      var table = RT({
        dir: c.dir,
        mode: 'first',
        columns: [{ key: 'who', label: t('colWho'), wrap: true }, { key: 'rights', label: t('colRights') }],
        actionLabel: t('colAction'),
        markLabel: t('colMark', { n: a.n }),
        rows: task.dacl.map(function (ace, i) {
          var r = a.rows[i];
          var note = r === 'denyOnly' ? [{ k: 'dashed', text: t('noteDenyOnly') }]
            : r === 'noRight' ? [{ k: 'muted', text: t('noteNoRight', { need: need }) }]
            : r === 'absent' ? [{ k: 'muted', text: t('noteAbsent') }] : null;
          return {
            no: String(i + 1),
            cells: { who: data(ace.who, ''), rights: rightsWord(ace) },
            action: h('span', null, t(ace.type === 'allow' ? 'allow' : 'deny')),
            effect: ace.type,
            hit: r === 'skip' ? null : r === 'decides',
            miss: r === 'absent' || r === 'denyOnly' ? ['who'] : r === 'noRight' ? ['rights'] : [],
            note: note
          };
        }),
        implicit: { text: t('implicitDeny'), action: h('span', null, t('deny')), effect: 'deny' },
        at: a.row >= 0 ? a.row : task.dacl.length,
        subject: { mark: pr.image.replace('.exe', ''), c: 1 },
        done: true,
        outcome: function () { return RT.verdict(a.ok, t(a.ok ? 'outOk' : 'outDenied')); },
        words: { win: t('markWin'), skip: t('markSkip') },
        changed: fresh,
        bare: true,
        stickyMark: true
      });
      body = table;
    }
    return h('div', { class: 'uac-col uac-chk' },
      h('section', { class: 'uac-box' }, h('div', { class: 'uac-chk-info' }, info,
        h('div', { class: 'uac-verdict' }, RT.verdict(a.ok, t(a.ok ? 'outOk' : 'outDenied')))), body));
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, e = s.last, n = c.n;
    var task = h('span', null, cap(taskPhrase(s)));
    var taskLow = h('span', null, taskPhrase(s));
    if (c.first) {
      var k = s.user === 'Administrator' ? 'capStart_builtin' : s.isAdmin ? 'capStart_admin' : 'capStart_standard';
      var out0 = rich(k, { pc: q(L.PC), task: taskLow });
      if (!s.uacOn) out0.push(' ', t('capStartOff'));
      return out0;
    }
    var N = String(n), out;
    switch (e.kind) {
      case 'logon':
        if (s.tokens.filtered && s.tokens.full) out = rich('capLogonSplit', { n: N, all: String(s.tokens.full.privs.length), few: String(s.tokens.filtered.privs.length) });
        else if (!s.isAdmin) out = rich('capLogonStandard', { n: N, few: String(s.tokens.filtered.privs.length) });
        else if (s.uacOn) out = rich('capLogonBuiltin', { n: N });
        else out = rich('capLogonOff', { n: N, user: q(s.user) });
        break;
      case 'explorer':
        out = rich(!s.isAdmin ? 'capExplorerStandard' : e.token === 'filtered' ? 'capExplorerFiltered' : 'capExplorerFull', { n: N });
        break;
      case 'attempt': {
        var a = lastAttempt(s), kind = s.tokens[a.token].kind;
        if (a.by === 'priv') {
          out = rich(kind === 'filtered' ? 'capPrivOk' : kind === 'standard' ? 'capPrivOkStandard' : 'capPrivOkFull', { n: N, task: task, priv: q(a.priv) });
        } else if (e.proc === 'cmd') {
          out = rich(a.user === L.CRED_ADMIN ? 'capAllowedElevatedCred' : 'capAllowedElevated', { n: N, row: q(a.row + 1), task: task, admin: q(L.CRED_ADMIN) });
        } else if (a.ok) {
          out = rich('capAllowedSilent', { n: N, row: q(a.row + 1), task: task });
        } else if (kind === 'filtered') {
          out = rich('capDeniedFiltered', { n: N, task: task });
        } else {
          out = rich(s.uacOn ? 'capDeniedStandard' : 'capDeniedOff', { n: N, task: task, need: t('need_' + L.TASKS[s.task].need) });
        }
        break;
      }
      case 'prompt':
        out = rich(e.prompt === 'credentials' ? 'capPromptCred' : 'capPromptConsent', { n: N, admin: q(L.CRED_ADMIN) });
        break;
      case 'approve':
        out = rich(e.prompt === 'credentials' ? 'capApproveCred' : 'capApproveConsent', { n: N, admin: q(L.CRED_ADMIN) });
        break;
      case 'spawn':
        if (e.parent === 'cmd') out = rich('capSpawnCmd', { n: N });
        else {
          var k2 = s.tokens[e.token].kind;
          out = rich(k2 === 'filtered' ? 'capSpawnExplorer' : k2 === 'standard' ? 'capSpawnExplorerStandard' : 'capSpawnExplorerFull', { n: N, user: q(s.user) });
        }
        break;
      default: out = [''];
    }
    if (c.last) out.push(' ', t('capEnd'));
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'account', type: 'select', label: t('pAccount'), options: [['admin', t('optAdmin')], ['standard', t('optStandard')], ['builtin-admin', t('optBuiltin')]] },
      { key: 'uac', type: 'toggle', label: t('pUac'), hint: t('pUacHint') },
      { key: 'task', type: 'select', label: t('pTask'), options: L.TASK_KEYS.map(function (k) { return [k, t('task_' + k)]; }) },
      { key: 'children', type: 'toggle', label: t('pChildren'), hint: t('pChildrenHint') }
    ],

    presets: [
      { id: 'admin-filtered', label: t('presetFiltered'), hint: t('presetFilteredHint'), params: {} },
      { id: 'time-zone', label: t('presetTimeZone'), hint: t('presetTimeZoneHint'), params: { task: 'timezone' } },
      { id: 'standard-user', label: t('presetStandard'), hint: t('presetStandardHint'), params: { account: 'standard' } },
      { id: 'child-inherits', label: t('presetChildren'), hint: t('presetChildrenHint'), params: { children: true } },
      { id: 'uac-off', label: t('presetOff'), hint: t('presetOffHint'), params: { uac: false, children: true } }
    ],

    legend: [
      { shape: 'sid-on', label: t('legSidOn') },
      { shape: 'sid-deny', label: t('legSidDeny') },
      { shape: 'priv', label: t('legPriv') },
      { shape: 'il', label: t('legIl') },
      { shape: 'thin', label: t('legThin') },
      { shape: 'thick', label: t('legThick') },
      { shape: 'rt-verdict', label: t('legVerdict') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'uac' }, logonCol(c), procsCol(c), checkCol(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
