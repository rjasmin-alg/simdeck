<!-- Radio networks under load: adopted from single-page-labs/radio-network-demos.html into the simdeck kit
     (docs/sim-ui.md). A stepper: in the conventional and trunked networks one step is one time slot of the same seeded
     call load, in the mesh one step is one hop of a flood. The model is in sim.js, the words in strings.js. -->
<html lang="hr" data-sim="radio-networks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radijske mreže pod opterećenjem · simdeck</title>
<meta name="description" content="Konvencionalna mreža s repetitorom, trunking (TETRA) i mesh: isti pozivi, fiksni ili zajednički kanali, i put preko releja.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>
<script src="../../kit/glossary.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "radio-networks",
  "class": "stepper",
  "steps": 20,
  "title": { "hr": "Radijske mreže pod opterećenjem", "en": "Radio networks under load" },
  "concept": { "hr": "Fiksni kanali, zajednički skup ili put preko releja: tko dođe na red", "en": "Fixed channels, a shared pool or a route through relays: who gets through" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="radio-networks"]; colours only from kit tokens. */

[data-sim="radio-networks"] .sd-ctl[hidden] { display: none; }
/* Workaround: the kit ignores visible() on button params; render sets data-net on <html>, so the call-pattern button
   (key N) is hidden in the mesh, where it does nothing. */
[data-sim="radio-networks"][data-net="mesh"] .sd-group > button[aria-keyshortcuts="n"] { display: none; }

[data-sim="radio-networks"] .rn {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
  gap: 1.2rem 1.6rem;
  height: 100%;
  padding: 1.2cqh 1.4cqw;
  font-size: var(--fs-md);
}
[data-sim="radio-networks"] .rn-left { display: flex; flex-direction: column; gap: 0.8rem; min-height: 0; min-width: 0; }
[data-sim="radio-networks"] .rn-right { display: flex; flex-direction: column; gap: 0.9rem; min-height: 0; min-width: 0; }
[data-sim="radio-networks"] .rn-head { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
[data-sim="radio-networks"] .rn-data { font-family: var(--mono); white-space: nowrap; }

/* the drawing: SVG lines underneath, the radios, nodes and labels in HTML on top, from the same 760 × 340 coordinates */
[data-sim="radio-networks"] .rn-scene { flex: 1 1 0; min-height: 0; container-type: size; display: grid; place-items: center; }
[data-sim="radio-networks"] .rn-draw { position: relative; width: min(100cqw, calc(100cqh * 760 / 340)); aspect-ratio: 760 / 340; }
[data-sim="radio-networks"] .rn-draw svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
[data-sim="radio-networks"] .rn-line { stroke: var(--line); stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; }
[data-sim="radio-networks"] .rn-line.rn-on { stroke-width: 6; stroke-dasharray: none; }
[data-sim="radio-networks"] .rn-line.rn-on[data-c="1"] { stroke: var(--c1); }
[data-sim="radio-networks"] .rn-line.rn-on[data-c="2"] { stroke: var(--c2); }
[data-sim="radio-networks"] .rn-line.rn-on[data-c="3"] { stroke: var(--c3); }
[data-sim="radio-networks"] .rn-line.rn-on[data-c="4"] { stroke: var(--c4); }
[data-sim="radio-networks"] .rn-link { stroke: var(--muted); stroke-width: 2.5; }
[data-sim="radio-networks"] .rn-link.rn-route { stroke: var(--ok); stroke-width: 8; }
[data-sim="radio-networks"] .rn-reach { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 4 6; }
[data-sim="radio-networks"] .rn-tower { fill: none; stroke: var(--ink); stroke-width: 3; }
[data-sim="radio-networks"] .rn-at {
  position: absolute;
  transform: translate(-50%, -50%);
  white-space: nowrap;

}
[data-sim="radio-networks"] .rn-unit, [data-sim="radio-networks"] .rn-node {

}
[data-sim="radio-networks"] .rn-unit.sd-fill { border-color: var(--ink); }
[data-sim="radio-networks"] .rn-unit:not(.sd-fill) { border-color: currentColor; }
[data-sim="radio-networks"] button.rn-node { cursor: pointer; }
[data-sim="radio-networks"] .rn-node.rn-down { border-style: dashed; border-color: var(--line); color: var(--muted); background: var(--panel); }
[data-sim="radio-networks"] .rn-node.rn-reached { background: var(--panel); border-width: 0.32rem; }
[data-sim="radio-networks"] .rn-node.sd-changed { background: var(--hl); color: var(--on-hl); }
[data-sim="radio-networks"] .rn-node.sd-fill[data-c="1"] { background: var(--c1); color: var(--on-series); }
[data-sim="radio-networks"] .rn-node.sd-fill[data-c="3"] { background: var(--c3); color: var(--on-series); }
[data-sim="radio-networks"] .rn-node.sd-fill.sd-changed { background: var(--hl); color: var(--on-hl); }
[data-sim="radio-networks"] .rn-tag { font-size: var(--fs-sm); font-weight: 700; padding: 0 0.25rem; border-radius: var(--radius-sm); background: var(--bg); }
[data-sim="radio-networks"] .rn-tag.rn-muted { color: var(--muted); font-weight: 400; }
[data-sim="radio-networks"] .rn-tag.rn-bad { outline: var(--line-w) dashed var(--danger); }
[data-sim="radio-networks"] .rn-tag.rn-wait { outline: var(--line-w) dotted var(--ink); }
[data-sim="radio-networks"] .rn-note { font-size: var(--fs-sm); color: var(--muted); text-align: center; }

/* chips: a call on a channel, an event in this slot */
[data-sim="radio-networks"] .rn-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; min-height: 2.4rem; }
[data-sim="radio-networks"] .rn-chip {

}
[data-sim="radio-networks"] .rn-chip.rn-free { border-style: dashed; border-color: var(--line); color: var(--muted); }
[data-sim="radio-networks"] .rn-chip.rn-bad { border-style: dashed; border-color: var(--danger); }
[data-sim="radio-networks"] .rn-chip.rn-wait { border-style: dotted; }
[data-sim="radio-networks"] .rn-chip.rn-gone { color: var(--muted); border-color: var(--line); }

/* channel rows */
[data-sim="radio-networks"] .rn-rows { display: flex; flex-direction: column; gap: 0.35rem; }
[data-sim="radio-networks"] .rn-row {
  display: grid;
  grid-template-columns: 3.6rem minmax(0, 1fr) auto;
  gap: 0.6rem;
  align-items: center;
  padding: 0.2rem 0.5rem;
  border: var(--line-w) solid var(--line);

}
[data-sim="radio-networks"] .rn-row.rn-ctl { border-style: dotted; }
[data-sim="radio-networks"] .rn-row > .rn-who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-sim="radio-networks"] .rn-ch { font-family: var(--mono); font-weight: 700; }

/* totals */
[data-sim="radio-networks"] .rn-stats { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.15rem 1rem; align-items: baseline; }
[data-sim="radio-networks"] .rn-stats > .rn-k { color: var(--muted); }
[data-sim="radio-networks"] .rn-stats > .rn-v { font-weight: 700; font-family: var(--mono); text-align: right; padding: 0 0.3rem; border-radius: var(--radius-sm); }

[data-sim="radio-networks"] .rn-big {

}
[data-sim="radio-networks"] .rn-big > b { font-size: var(--fs-xl); font-family: var(--mono); }
[data-sim="radio-networks"] .rn-big > span { font-size: var(--fs-sm); color: var(--muted); }

/* route */

[data-sim="radio-networks"] .rn-num {

[data-sim="radio-networks"] .sd-explain table { border-collapse: collapse; font-size: var(--fs-sm); margin: 0.4rem 0; }
[data-sim="radio-networks"] .sd-explain th, [data-sim="radio-networks"] .sd-explain td { border: 1px solid var(--line); padding: 0.15rem 0.3rem; text-align: left; vertical-align: top; }

/* Phone and portrait: one column; the drawing keeps a readable width and scrolls inside its box. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="radio-networks"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="radio-networks"] .rn { grid-template-columns: minmax(0, 1fr); height: auto; padding: 0.5rem 0.4rem; }
  [data-sim="radio-networks"] .rn-scene { flex: none; container-type: normal; display: block; place-items: normal; width: 100%; min-width: 0; overflow-x: auto; }
  [data-sim="radio-networks"] .rn-draw { width: 44rem; }
}
</style>

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Radijske mreže pod opterećenjem</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var W = 760, H = 340, TOWER = [380, 165];
  var sim = null;

  function s(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    for (var k in attrs || {}) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
    return el;
  }
  function data(text) { return h('span', { translate: 'no', class: 'rn-data' }, text); }
  function bold(text) { return h('b', { translate: 'no' }, String(text)); }
  function colourOf(team) { return String(L.TEAMS.indexOf(team) + 1); }
  function teamName(team) { return t('team_' + team); }
  function code(team) { return team.toUpperCase(); }
  function ch(n) { return t('chShort', { n: n }); }
  function num(v) { var x = String(v); return Simdeck.lang === 'hr' ? x.replace('.', ',') : x; }
  function at(x, y, node, cls) {
    node.classList.add('rn-at');
    if (cls) node.classList.add(cls);
    node.style.left = (x / W * 100) + '%';
    node.style.top = (y / H * 100) + '%';
    return node;
  }
  function listOf(items) { return items.join(', '); }

  // ── conventional and trunked ──

  function loadScene(c) {
    var p = c.params, st = c.state;
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    var box = h('div', { class: 'rn-draw' }, svg);
    var live = {}, blocked = {}, queued = {};
    st.active.forEach(function (a) { (live[a.team] = live[a.team] || []).push(a.ch); });
    st.blocked.forEach(function (b) { blocked[b.team] = true; });
    st.queue.forEach(function (q) { queued[q.team] = true; });
    var simplex = p.net === 'conv' && p.mode === 'simplex';

    if (simplex) {
      L.UNITS.forEach(function (u, i) {
        L.UNITS.slice(i + 1).forEach(function (v) {
          if (v.team !== u.team) return;
          var on = !!live[u.team];
          svg.append(s('line', { x1: u.x, y1: u.y, x2: v.x, y2: v.y, class: 'rn-line' + (on ? ' rn-on' : ''), 'data-c': colourOf(u.team) }));
        });
      });
      box.append(at(W / 2, 4, h('span', { class: 'rn-note' }, t('simplexNote'))));
    } else {
      L.UNITS.forEach(function (u) {
        var on = !!live[u.team];
        svg.append(s('line', { x1: u.x, y1: u.y, x2: TOWER[0], y2: TOWER[1], class: 'rn-line' + (on ? ' rn-on' : ''), 'data-c': colourOf(u.team) }));
      });
      var x = TOWER[0], y = TOWER[1];
      svg.append(s('polygon', { points: [x, y - 48, x - 24, y + 8, x + 24, y + 8].join(' '), class: 'rn-tower' }));
      svg.append(s('line', { x1: x, y1: y + 8, x2: x, y2: y + 32, class: 'rn-tower' }));
      svg.append(s('line', { x1: x - 17, y1: y + 20, x2: x + 17, y2: y + 20, class: 'rn-tower' }));
      svg.append(s('circle', { cx: x, cy: y - 57, r: 6, class: 'rn-tower' }));
      var label = p.net === 'trunk' ? 'towerTrunk' : p.mode === 'fixed' ? 'towerFixed' : 'towerRepeater';
      box.append(at(x, y + 55, h('span', { class: 'rn-tag' }, t(label))));
    }

    L.UNITS.forEach(function (u) {
      var on = !!live[u.team];
      box.append(at(u.x, u.y, h('span', { class: 'rn-unit sd-ink' + (on ? ' sd-fill' : ''), translate: 'no',
        dataset: { c: colourOf(u.team) } }, u.id)));
      box.append(at(u.x, u.y + 37, h('span', { class: 'rn-tag rn-muted', translate: 'no' }, code(u.team))));
      var tag = on ? h('span', { class: 'rn-tag' }, '● ' + listOf(live[u.team].map(ch)))
        : blocked[u.team] ? h('span', { class: 'rn-tag rn-bad' }, t('unitBlocked'))
        : queued[u.team] ? h('span', { class: 'rn-tag rn-wait' }, t('unitQueued')) : null;
      if (tag) box.append(at(u.x, u.y - 38, tag));
    });
    return h('div', { class: 'rn-scene' }, box);
  }

  function callChip(a, changed) {
    return h('span', { class: 'rn-chip sd-fill' + (changed ? ' sd-changed' : ''), dataset: { c: colourOf(a.team) } },
      data(a.id + ' · ' + code(a.team)), h('span', null, t('left', { n: a.left })));
  }

  function events(c) {
    var st = c.state, chips = [];
    var byId = {};
    st.active.forEach(function (a) { byId[a.id] = a; });
    st.ended.forEach(function (id) { chips.push(h('span', { class: 'rn-chip rn-gone' }, t.parts('evEnded', { id: data(id) }))); });
    var fromQueue = st.granted.filter(function (id) { return st.arrived.indexOf(id) < 0; });
    fromQueue.forEach(function (id) {
      var a = byId[id];
      chips.push(h('span', { class: 'rn-chip sd-fill sd-changed', dataset: { c: colourOf(a.team) } }, t.parts('evFromQueue', { id: data(id), ch: ch(a.ch) })));
    });
    st.arrived.forEach(function (id) {
      var a = byId[id] && st.granted.indexOf(id) >= 0 ? byId[id] : null;
      var b = st.blocked.filter(function (x) { return x.id === id; })[0];
      if (a) chips.push(h('span', { class: 'rn-chip sd-fill sd-changed', dataset: { c: colourOf(a.team) } }, t.parts('evGranted', { id: data(id), ch: ch(a.ch) })));
      else if (b) chips.push(h('span', { class: 'rn-chip rn-bad' }, t.parts(b.why === 'busy' ? 'evBusy' : 'evNoChan', { id: data(id), ch: ch(b.ch) })));
      else chips.push(h('span', { class: 'rn-chip rn-wait' }, t.parts('evQueued', { id: data(id) })));
    });
    if (!st.arrived.length && c.n > 0) chips.push(h('span', { class: 'rn-chip rn-free' }, t('evNone')));
    return h('div', { class: 'rn-box' },
      h('div', { class: 'rn-head' }, t('slotHead', { n: st.slot })),
      h('div', { class: 'rn-chips' }, chips));
  }

  function pool(c) {
    var p = c.params, st = c.state, rows = [];
    if (p.net === 'trunk') {
      var grants = [];
      st.granted.forEach(function (id, i) {
        var a = st.active.filter(function (x) { return x.id === id; })[0];
        if (i) grants.push(', ');
        grants.push(data(id), ' → ' + ch(a.ch));
      });
      rows.push(h('div', { class: 'rn-row rn-ctl' }, h('span', { class: 'rn-ch' }, '◆'), h('span', { class: 'rn-who' }, t('control')),
        h('span', { class: 'rn-chip' + (grants.length ? ' sd-hl' : ' rn-free') }, grants.length ? t.parts('controlGrants', { list: h('span', null, grants) }) : t('controlIdle'))));
    }
    for (var i = 1; i <= p.channels; i++) {
      var a = st.active.filter(function (x) { return x.ch === i; })[0];
      var owner = p.net === 'conv' ? (L.TEAMS[i - 1] ? teamName(L.TEAMS[i - 1]) : t('noTeam')) : t('anyTeam');
      rows.push(h('div', { class: 'rn-row' }, h('span', { class: 'rn-ch' }, ch(i)), h('span', { class: 'rn-who' }, owner),
        a ? callChip(a, st.granted.indexOf(a.id) >= 0) : h('span', { class: 'rn-chip rn-free' }, t('free'))));
    }
    var out = [h('div', { class: 'rn-head' }, t(p.net === 'trunk' ? 'poolTrunk' : 'poolConv')), h('div', { class: 'rn-rows' }, rows)];
    if (p.net === 'trunk') {
      out.push(h('div', { class: 'rn-head' }, t('queueHead')));
      out.push(h('div', { class: 'rn-chips' }, st.queue.length ? st.queue.map(function (q) {
        return h('span', { class: 'rn-chip rn-wait' + (st.arrived.indexOf(q.id) >= 0 ? ' sd-changed' : ''), dataset: { c: colourOf(q.team) } },
          data(q.id + ' · ' + code(q.team)), h('span', null, t('waiting', { n: q.waited })));
      }) : h('span', { class: 'rn-chip rn-free' }, t('queueEmpty'))));
    }
    return out;
  }

  function totals(c) {
    var p = c.params, st = c.state, T = st.total;
    var busy = st.active.length;
    var nowBox = h('div', { class: 'rn-now' },
      h('div', { class: 'rn-big' }, h('b', null, String(busy)), h('span', null, t('busyNow'))),
      h('div', { class: 'rn-big' }, h('b', null, String(p.channels - busy)), h('span', null, t('idleNow'))),
      p.net === 'trunk' ? h('div', { class: 'rn-big' }, h('b', null, String(st.queue.length)), h('span', null, t('queueNow')))
        : h('div', { class: 'rn-big' }, h('b', null, String(T.blocked)), h('span', null, t('totBlocked'))));
    var rows = [['totOffered', String(T.offered)], ['totServed', String(T.served)]];
    if (p.net === 'conv') rows.push(['totBlocked', String(T.blocked)]);
    else {
      rows.push(['totWaited', String(T.waited)]);
      rows.push(['totAvgWait', T.waited ? t('avgWait', { v: num(Math.round(T.waitSlots / T.waited * 10) / 10) }) : t('none')]);
    }
    rows.push(['totUse', st.slot ? t('percent', { v: String(Math.round(T.busySlots / (st.slot * p.channels) * 100)) }) : t('none')]);
    var prev = c.prev ? c.prev.total : null;
    var key = { totOffered: 'offered', totServed: 'served', totBlocked: 'blocked', totWaited: 'waited' };
    return [nowBox, h('div', { class: 'rn-stats' }, rows.map(function (r) {
      var changed = prev && key[r[0]] && prev[key[r[0]]] !== T[key[r[0]]];
      return [h('span', { class: 'rn-k' }, t(r[0])), h('span', { class: 'rn-v' + (changed ? ' sd-hl' : '') }, r[1])];
    }))];
  }

  // ── mesh ──

  function meshScene(c) {
    var p = c.params, st = c.state;
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    var box = h('div', { class: 'rn-draw' }, svg);
    var down = L.downSet(p), route = st.route || [];
    var onRoute = {};
    for (var i = 0; i + 1 < route.length; i++) onRoute[[route[i], route[i + 1]].sort().join('-')] = true;
    var src = L.BY_ID[p.src];
    svg.append(s('circle', { cx: src.x, cy: src.y, r: p.range, class: 'rn-reach' }));
    var links = L.links(p).sort(function (a, b) { return (onRoute[a.join('-')] ? 1 : 0) - (onRoute[b.join('-')] ? 1 : 0); });
    links.forEach(function (l) {
      var a = L.BY_ID[l[0]], b = L.BY_ID[l[1]];
      svg.append(s('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'rn-link' + (onRoute[l.join('-')] ? ' rn-route' : '') }));
    });
    L.NODES.forEach(function (n) {
      var isDown = down.indexOf(n.id) >= 0, fixed = n.id === p.src || n.id === p.dst;
      var hop = st.reached[n.id];
      var cls = 'rn-node' + (isDown ? ' rn-down' : '') + (hop != null && !fixed ? ' rn-reached' : '') +
        (fixed ? ' sd-fill' : '') + (st.fresh.indexOf(n.id) >= 0 && c.n > 0 ? ' sd-changed' : '');
      var btn = h('button', { type: 'button', class: cls, translate: 'no',
        dataset: fixed ? { c: n.id === p.src ? '1' : '3' } : {},
        'aria-label': t(fixed ? 'nodeFixed' : 'nodeBtn', { id: n.id }),
        'aria-pressed': fixed ? null : String(isDown),
        onmousedown: function (e) { e.preventDefault(); },
        onclick: function () { if (sim && !fixed) sim.set({ down: L.toggleDown(sim.params, n.id) }); } }, n.id);
      box.append(at(n.x, n.y, btn));
      var below = n.id === p.src ? t('srcLabel') : n.id === p.dst ? t('dstLabel') : isDown ? t('nodeDown') : null;
      if (below) box.append(at(n.x, n.y + 38, h('span', { class: 'rn-tag' + (isDown ? ' rn-muted' : '') }, below)));
      if (hop != null && hop > 0) box.append(at(n.x, n.y - 38, h('span', { class: 'rn-tag' }, t('hopLabel', { n: hop }))));
    });
    return h('div', { class: 'rn-scene' }, box);
  }

  function meshSide(c) {
    var p = c.params, st = c.state, route = st.route;
    var rows;
    if (route) {
      rows = route.map(function (id, i) {
        return h('div', { class: 'rn-route-row' }, h('span', { class: 'rn-num' }, String(i)),
          i + 1 < route.length ? t.parts('routeHop', { a: bold(id), b: bold(route[i + 1]) }) : t.parts('routeArrive', { a: bold(id) }));
      });
    } else {
      rows = [h('span', { class: 'rn-chip rn-free' }, st.hopsTo < 0 ? t('routeNone') : t('routeWait'))];
    }
    var down = L.downSet(p);
    var stats = [
      ['nodesUp', String(L.NODES.length - down.length)],
      ['linksN', String(L.links(p).length)],
      ['hopsN', route ? String(route.length - 1) : t('none')],
      ['sentN', String(st.sent)]
    ];
    return [
      h('p', { class: 'rn-note' }, t('meshClick')),
      h('div', { class: 'rn-head' }, t('routeHead')),
      h('div', { class: 'rn-rows' }, rows),
      h('div', { class: 'rn-stats' }, stats.map(function (r) {
        return [h('span', { class: 'rn-k' }, t(r[0])), h('span', { class: 'rn-v' }, r[1])];
      }))
    ];
  }

  // ── captions ──

  function loadCaption(c) {
    var p = c.params, st = c.state;
    if (c.n === 0) return t.parts('capLoadStart', { load: bold(t('erl', { v: p.load })), seed: bold(p.seed) });
    var out = t.parts('capSlot', { n: c.n });
    var byId = {};
    st.active.forEach(function (a) { byId[a.id] = a; });
    var idle = [];
    for (var i = 1; i <= p.channels; i++) if (!st.active.some(function (a) { return a.ch === i; })) idle.push(ch(i));
    var parts = [];
    if (st.ended.length) parts.push(t.parts('capEnded', { ids: bold(listOf(st.ended)) }));
    st.granted.filter(function (id) { return st.arrived.indexOf(id) < 0; }).forEach(function (id) {
      var a = byId[id];
      parts.push(t.parts('capFromQueue', { id: bold(id), team: teamName(a.team), ch: bold(ch(a.ch)), wait: t.n('slots', st.slot - c.prev.queue.filter(function (q) { return q.id === id; })[0].at) }));
    });
    st.arrived.forEach(function (id) {
      var b = st.blocked.filter(function (x) { return x.id === id; })[0];
      var q = st.queue.filter(function (x) { return x.id === id; })[0];
      if (b) {
        var why = t.parts(b.why === 'busy' ? 'capBusy' : 'capNoChan', { id: bold(id), team: teamName(b.team), ch: bold(ch(b.ch)) });
        parts.push(why.concat([idle.length ? t.n('capIdle', idle.length, { list: listOf(idle) }) : t('capNoIdle')]));
      } else if (q) {
        parts.push(t.parts('capQueued', { id: bold(id), team: teamName(q.team) }));
      } else {
        var a = byId[id];
        parts.push(t.parts('capGranted', { id: bold(id), team: teamName(a.team), ch: bold(ch(a.ch)) }));
      }
    });
    if (!st.arrived.length) parts.push([t('capNone')]);
    parts.forEach(function (x) { out = out.concat([' '], x); });
    if (c.last) {
      var T = st.total;
      out = out.concat([' '], p.net === 'conv'
        ? t.parts('capEndConv', { served: bold(T.served), offered: bold(T.offered), blocked: bold(T.blocked) })
        : t.parts('capEndTrunk', { served: bold(T.served), offered: bold(T.offered), queue: bold(st.queue.length) }));
    }
    return out;
  }

  function meshCaption(c) {
    var p = c.params, st = c.state;
    if (p.src === p.dst) return t('capSame');
    if (c.n === 0) {
      return t.parts('capMeshStart', { src: bold(p.src), dst: bold(p.dst), range: bold(p.range), ttl: bold(p.ttl) });
    }
    var out;
    if (st.stalled) out = t.parts('capStalled', { n: c.n });
    else out = t.parts('capHop', { n: c.n, senders: bold(listOf(c.prev.frontier)), fresh: bold(listOf(st.fresh)) });
    if (st.found === c.n) {
      out = out.concat([' '], t.parts('capFound', { dst: bold(p.dst), hops: t.n('hops', c.n), route: bold(st.route.join(' → ')) }));
    }
    if (!st.route && (st.stalled || c.last)) {
      out = out.concat([' '], st.hopsTo < 0
        ? t.parts('capPartition', { src: bold(p.src), dst: bold(p.dst) })
        : t.parts('capTtl', { dst: bold(p.dst), hops: t.n('hopsAway', st.hopsTo) }));
    }
    return out;
  }

  var nodeOptions = L.NODE_IDS.map(function (id) { return [id, id]; });
  var notMesh = function (p) { return p.net !== 'mesh'; };
  var isMesh = function (p) { return p.net === 'mesh'; };

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'net', type: 'choice', label: t('net'),
        options: [['conv', t('netConv')], ['trunk', t('netTrunk')], ['mesh', t('netMesh')]] },
      { key: 'mode', type: 'choice', label: t('mode'), visible: function (p) { return p.net === 'conv'; },
        options: [['simplex', t('modeSimplex')], ['repeater', t('modeRepeater')], ['fixed', t('modeFixed')]] },
      { key: 'channels', type: 'range', label: t('channels'), min: 1, max: 5, visible: notMesh },
      { key: 'load', type: 'range', label: t('load'), min: 1, max: 5, visible: notMesh,
        format: function (v) { return t('erl', { v: v }); } },
      { key: 'seed', type: 'range', label: t('seed'), min: 1, max: 20, visible: function () { return false; } },
      { type: 'button', label: t('newPattern'), key: 'n',
        run: function (sm) { sm.set({ seed: sm.params.seed % 20 + 1 }); } },
      { key: 'range', type: 'range', label: t('range'), min: 100, max: 260, step: 10, visible: isMesh },
      { key: 'src', type: 'select', label: t('src'), options: nodeOptions, visible: isMesh, resets: true },
      { key: 'dst', type: 'select', label: t('dst'), options: nodeOptions, visible: isMesh, resets: true },
      { key: 'ttl', type: 'range', label: t('ttl'), min: 1, max: 7, visible: isMesh },
      { key: 'down', type: 'select', label: t('down'), visible: function () { return false; },
        options: L.downValues().map(function (v) { return [v, v || t('none')]; }) }
    ],

    presets: [
      { id: 'conv', label: t('presetConv'), hint: t('presetConvHint'), params: { net: 'conv' } },
      { id: 'trunk', label: t('presetTrunk'), hint: t('presetTrunkHint'), params: { net: 'trunk' } },
      { id: 'overload', label: t('presetOverload'), hint: t('presetOverloadHint'), params: { net: 'trunk', load: 5 } },
      { id: 'mesh-heal', label: t('presetMeshHeal'), hint: t('presetMeshHealHint'), params: { net: 'mesh' } },
      { id: 'mesh-split', label: t('presetMeshSplit'), hint: t('presetMeshSplitHint'), params: { net: 'mesh', down: 'DE' } },
      { id: 'mesh-ttl', label: t('presetMeshTtl'), hint: t('presetMeshTtlHint'), params: { net: 'mesh', ttl: 2 } }
    ],

    legend: L.TEAMS.map(function (team, i) { return { c: i + 1, label: teamName(team) }; }).concat([
      { shape: 'hollow', label: t('legendHollow') },
      { shape: 'hl', label: t('legendNew') }
    ]),

    render: function (c) {
      var p = c.params;
      var left, right;
      document.documentElement.dataset.net = p.net;
      if (p.net === 'mesh') {
        left = [meshScene(c)];
        right = meshSide(c);
      } else {
        left = [loadScene(c), events(c)];
        right = pool(c).concat(totals(c));
      }
      c.stage.replaceChildren(h('div', { class: 'rn' }, h('div', { class: 'rn-left' }, left), h('div', { class: 'rn-right' }, right)));
    },

    caption: function (c) { return c.params.net === 'mesh' ? meshCaption(c) : loadCaption(c); }
  });
})();
</script>
</body>
</html>
