<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function data(text) { return h('b', { translate: 'no' }, String(text)); }
  function ctl() { return sim || window.simdeck; }

  // ---- the stage is built once and updated in place, so a text box keeps its caret and focus while typing ----
  var ui = null;

  function card(which, c) {
    var input = h('input', {
      type: 'text', class: 'hp-input', maxlength: '120', spellcheck: 'false', autocomplete: 'off', translate: 'no',
      'aria-label': t(which === 'a' ? 'inputA' : 'inputB'), title: t('inputHint')
    });
    input.addEventListener('input', function () { var p = {}; p[which] = input.value; ctl().set(p); });
    var bytes = h('span', { class: 'hp-meta' });
    var nl = h('span', { class: 'hp-nl' }, h('span', { translate: 'no' }, '↵ '), t('plusNewline'));
    var lines = [h('div', { class: 'hp-hexline', translate: 'no' }), h('div', { class: 'hp-hexline', translate: 'no' })];
    var cells = [];
    for (var i = 0; i < 256; i++) cells.push(h('span', { class: 'hp-bit' }));
    var grid = h('div', { class: 'hp-grid', role: 'img', 'aria-label': t('gridLabel', { which: which.toUpperCase() }) }, cells);
    var el = h('div', { class: 'hp-card', dataset: { c: String(c) } },
      h('div', { class: 'hp-head' }, h('span', { class: 'hp-name' }, t(which === 'a' ? 'inputA' : 'inputB')), bytes, which === 'b' ? nl : null),
      input,
      h('div', { class: 'hp-hex' }, h('span', { class: 'hp-meta' }, t('digestLabel')), lines),
      grid);
    return { el: el, input: input, bytes: bytes, nl: nl, lines: lines, cells: cells };
  }

  function build(stage) {
    var A = card('a', 1), B = card('b', 1);
    var count = h('div', { class: 'hp-count' });
    var fill = h('div', { class: 'hp-meter-fill' });
    var verdict = h('span');
    var sum = h('div', { class: 'hp-sum' },
      count,
      h('div', { class: 'hp-meter', 'aria-hidden': 'true' }, fill, h('div', { class: 'hp-meter-half' })),
      h('div', { class: 'hp-verdict' }, verdict, h('span', { class: 'hp-oneway' }, t('oneWay'))));

    var toyTitle = h('div', { class: 'hp-name' });
    var toySub = h('div', { class: 'hp-sub' });
    var stats = h('div', { class: 'hp-stats' });
    var pair = h('div', { class: 'hp-pair' });
    var mapCells = [];
    for (var v = 0; v < 256; v++) mapCells.push(h('span', { class: 'hp-v' }));
    var map = h('div', { class: 'hp-map', role: 'img', 'aria-label': t('toyMapAria') }, mapCells);
    var key = h('div', { class: 'hp-key' },
      h('span', null, h('span', { class: 'hp-v hp-1' }), t('toyMapTaken')),
      h('span', null, h('span', { class: 'hp-v hp-2' }), t('toyMapRepeated')),
      h('span', null, h('span', { class: 'hp-v hp-first' }), t('toyFirst')));
    var mapWrap = h('div', { class: 'hp-mapwrap' }, h('div', { class: 'hp-sub' }, t('toyMapLabel')), map, key);
    var barFill = h('div', { class: 'hp-bar-fill' });
    var barText = h('div', { class: 'hp-sub' });
    var barWrap = h('div', { class: 'hp-mapwrap' }, barText, h('div', { class: 'hp-bar', 'aria-hidden': 'true' }, barFill));
    var toy = h('div', { class: 'hp-toy' }, toyTitle, toySub, stats, pair, mapWrap, barWrap);

    var root = h('div', { class: 'hp' }, h('div', { class: 'hp-ab' }, A.el, B.el, sum), toy);
    stage.replaceChildren(root);
    return { root: root, A: A, B: B, count: count, fill: fill, verdict: verdict, toyTitle: toyTitle, toySub: toySub,
      stats: stats, pair: pair, mapCells: mapCells, mapWrap: mapWrap, barWrap: barWrap, barFill: barFill, barText: barText };
  }

  function fillCard(k, text, digest, bytes, diff) {
    if (k.input.value !== text) k.input.value = text;
    k.bytes.textContent = t.n('bytes', bytes);
    k.lines[0].replaceChildren.apply(k.lines[0], [0, 8, 16, 24].map(function (o) { return h('span', null, digest.slice(o, o + 8)); }));
    k.lines[1].replaceChildren.apply(k.lines[1], [32, 40, 48, 56].map(function (o) { return h('span', null, digest.slice(o, o + 8)); }));
    var bits = L.bitsOf(digest);
    for (var i = 0; i < 256; i++) k.cells[i].className = 'hp-bit' + (bits[i] ? ' hp-1' : '') + (diff[i] ? ' hp-d' : '');
  }

  function stat(label, value, cls) { return [h('span', null, label), h('b', { translate: 'no', class: cls || null }, String(value))]; }

  function fillToy(s) {
    var hx = function (v) { return L.toyHex(v, s.toyBits); };
    ui.toyTitle.textContent = t('toyTitle', { bits: s.toyBits });
    ui.toySub.replaceChildren.apply(ui.toySub, t.parts('toySub', { bits: s.toyBits, first: data(L.toyMessage(1)), last: data(L.toyMessage(s.toyInputs)) }));
    ui.stats.replaceChildren.apply(ui.stats, [].concat(
      stat(t('toyMessages'), s.toyInputs),
      stat(t('toyPossible'), s.toySize),
      stat(t('toyUsed'), s.toyDistinct),
      stat(t('toyRepeats'), s.toyRepeats, s.toyRepeats ? 'hp-rep' : null),
      [h('span', null, t('toyExpected')), h('b', null, t('toyExpectedVal', { n: s.toyExpected }))]));
    var fc = s.toyFirstCollision;
    ui.pair.className = 'hp-pair' + (fc ? '' : ' hp-empty');
    if (fc) {
      var row = function (i) {
        return h('div', { class: 'hp-pair-row' }, h('span', { class: 'hp-dia', 'aria-hidden': 'true' }, '◆'),
          h('span', { translate: 'no' }, L.toyMessage(i) + ' → ' + hx(fc.value)));
      };
      ui.pair.replaceChildren(h('div', { class: 'hp-pair-title' }, t('toyFirst')), row(fc.i), row(fc.j));
    } else {
      ui.pair.replaceChildren(h('div', { class: 'hp-pair-title' }, t('toyFirst')), h('div', null, t('toyNone')));
    }
    var small = !!s.toyMap;
    ui.mapWrap.hidden = !small;
    ui.barWrap.hidden = small;
    if (small) {
      for (var v = 0; v < 256; v++) {
        var n = s.toyMap[v];
        var first = fc && fc.value === v;
        ui.mapCells[v].className = 'hp-v' + (first ? ' hp-first' : n >= 2 ? ' hp-2' : n === 1 ? ' hp-1' : '');
      }
    } else {
      ui.barFill.style.width = (100 * s.toyDistinct / s.toySize) + '%';
      ui.barText.textContent = t('toyMeter', { used: s.toyDistinct, size: s.toySize });
    }
  }

  // ---- caption focus: the half whose params changed last speaks (sim.js nextFocus; SPEC.md, Captions) ----
  var focus = null, last = null, lastPreset = null, keepFocus = null;
  function track(c) {
    focus = keepFocus || L.nextFocus(focus, last, c.params, c.preset, lastPreset);
    keepFocus = null;
    last = Object.assign({}, c.params);
    lastPreset = c.preset;
  }

  var labels = { abc: 'presetAbc', 'one-char': 'presetOneChar', payment: 'presetPayment', empty: 'presetEmpty', newline: 'presetNewline', toy8: 'presetToy8', toy16: 'presetToy16' };
  var sim;

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      // value: what a bad URL value falls back to (the kit's coerce and normalise use the spec's value)
      { key: 'newline', type: 'toggle', label: t('newline'), hint: t('newlineHint'), value: L.defaults.newline },
      { key: 'toyBits', type: 'choice', label: t('toyBits'), options: [[8, t('toyBits8')], [16, t('toyBits16')]], value: L.defaults.toyBits },
      { key: 'toyCount', type: 'range', label: t('toyCount'), min: 1, max: L.TOY_MAX, step: 1, value: L.defaults.toyCount }
    ],

    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),

    legend: [
      { c: 1, label: t('legendOne') },
      { shape: 'hollow', label: t('legendZero') },
      { shape: 'hp-diff', label: t('legendDiff') },
      { shape: 'hp-pair', label: t('legendPair') }
    ],

    render: function (c) {
      track(c);
      var s = c.state;
      if (!ui || !c.stage.contains(ui.root)) ui = build(c.stage);
      var diff = {};
      s.diff.forEach(function (i) { diff[i] = true; });
      fillCard(ui.A, c.params.a, s.digestA, s.bytesA, diff);
      fillCard(ui.B, c.params.b, s.digestB, s.bytesB, diff);
      ui.B.nl.hidden = !c.params.newline;
      ui.count.replaceChildren.apply(ui.count, t.parts('diffCount', { n: h('b', { translate: 'no' }, String(s.diffBits)) }));
      ui.fill.style.width = (100 * s.diffBits / 256) + '%';
      var same = s.diffBits === 0;
      ui.verdict.className = same ? 'hp-ok' : 'hp-bad';
      ui.verdict.replaceChildren(h('span', { 'aria-hidden': 'true', class: 'hp-sym' }, same ? '=' : '≠'), t(same ? 'verdictSame' : 'verdictDiff'));
      fillToy(s);
    },

    caption: function (c) {
      var s = c.state;
      if (focus === 'toy') {
        var fc = s.toyFirstCollision;
        if (fc) return t.parts('capToyHit', { bits: s.toyBits, j: fc.j, mi: data(L.toyMessage(fc.i)), mj: data(L.toyMessage(fc.j)), value: data(L.toyHex(fc.value, s.toyBits)) });
        return t.parts('capToyNone', { n: s.toyInputs, bits: s.toyBits, exp: s.toyExpected });
      }
      var key = { same: 'capSame', one: 'capOne', newline: 'capNewline', more: 'capMore' }[s.edit];
      return t.parts(key, { n: h('b', { class: s.diffBits ? 'sd-hl' : null, translate: 'no' }, String(s.diffBits)) });
    }
  });

  // ---- typed text survives a reload (the language switch reloads the page; a and b are not in the URL) ----
  // Saved on leaving, restored once and only into the same address apart from ?lang=, so a later link to another
  // preset never gets old text. Storage may be unavailable (private mode, file://): then the boxes start fresh.
  var KEEP = 'simdeck.hash-properties.text';
  function here() { var u = new URLSearchParams(window.location.search); u.delete('lang'); return window.location.pathname + '?' + u.toString(); }
  window.addEventListener('pagehide', function () {
    try { window.sessionStorage.setItem(KEEP, JSON.stringify({ at: here(), a: sim.params.a, b: sim.params.b, focus: focus })); } catch (e) { /* no storage */ }
  });
  try {
    var kept = JSON.parse(window.sessionStorage.getItem(KEEP) || 'null');
    window.sessionStorage.removeItem(KEEP);
    if (kept && kept.at === here() && typeof kept.a === 'string' && typeof kept.b === 'string') {
      keepFocus = kept.focus === 'toy' ? 'toy' : 'digest';
      sim.set({ a: kept.a, b: kept.b });
    }
  } catch (e) { /* no storage */ }
})();
</script>
