<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (commands, paths, module names, statuses) is not language: the word check skips translate="no". */
  function data(text) { return h('code', { translate: 'no', class: 'ai-mono' }, String(text)); }
  function wrap(parts) { return h('span', null, parts); }

  // ── the sources: one display line each; item = the item index it belongs to (lockstep), head = not an item ──
  var Q = '"' + L.LINE + '"';
  var SCRIPT = {
    line: ['echo ' + Q + ' >> /etc/hosts'],
    dir: ['mkdir ' + L.DIR],
    user: ['useradd ' + L.USER],
    conf: ['cp web.conf /etc/web/web.conf'],
    restart: ['systemctl restart web']
  };
  var GUARDED = {
    line: ['grep -qxF ' + Q + ' /etc/hosts ||', '  echo ' + Q + ' >> /etc/hosts'],
    dir: ['mkdir -p ' + L.DIR],
    user: ['id ' + L.USER + ' &>/dev/null || useradd ' + L.USER]
  };
  var TASK = {
    line: ['  - lineinfile: {path: /etc/hosts, line: ' + Q + '}'],
    dir: ['  - file: {path: ' + L.DIR + ', state: directory}'],
    user: ['  - user: {name: ' + L.USER + '}'],
    conf: ['  - copy: {src: web.conf, dest: /etc/web/web.conf}', '    notify: restart web'],
    restart: ['  - name: restart web', '    service: {name: web, state: restarted}']
  };
  var MODULE = { line: 'lineinfile', dir: 'file', user: 'user', conf: 'copy' };
  var CMD = { line: 'echo', dir: 'mkdir', user: 'useradd', conf: 'cp', restart: 'systemctl' };
  var GUARD = { line: 'grep -qxF', dir: 'mkdir -p', user: 'id ' + L.USER };

  function sourceLines(side, p) {
    var items = L.PLAYS[p.play], out = [];
    function head(text) { out.push({ text: text, item: null }); }
    if (side === 'A') {
      head('#!/bin/bash');
      if (p.setE) head('set -e');
      items.forEach(function (it, k) {
        (p.play === 'guarded' ? GUARDED : SCRIPT)[it].forEach(function (text, i, all) { out.push({ text: text, item: k, first: i === 0, last: i === all.length - 1 }); });
      });
    } else {
      head('- hosts: all');
      head('  gather_facts: false');
      head('  tasks:');
      items.forEach(function (it, k) {
        if (it === 'restart') head('  handlers:');
        TASK[it].forEach(function (text, i) { out.push({ text: text, item: k, first: i === 0 }); });
      });
    }
    return out;
  }

  /** The result mark of one item: glyph + shape + colour. */
  function mark(side, r) {
    if (!r) return h('span', { class: 'ai-g' });
    var o, glyph, label;
    if (side === 'A') {
      o = r.outcome === 'error' ? 'failed' : r.outcome === 'skipped' ? 'skipped' : r.changed ? 'changed' : 'ok';
    } else o = r.outcome === 'none' ? 'skipped' : r.outcome;
    glyph = { ok: '✓', changed: '✎', failed: '✗', skipped: '–' }[o];
    label = { ok: t('legOk'), changed: t('legChanged'), failed: t('legFailed'), skipped: side === 'B' ? t('none') : t('skipped') }[o];
    return h('span', { class: 'ai-g' }, h('span', { class: 'ai-mark', dataset: { o: o }, role: 'img', 'aria-label': label, title: label }, glyph));
  }

  function source(side, c) {
    var s = c.state, p = c.params;
    var res = s.results[side];
    var now = s.run > 0 && !s.edit ? s.pc : -1;
    var box = h('div', { class: 'ai-src', translate: 'no' });
    sourceLines(side, p).forEach(function (ln) {
      var r = ln.item === null ? null : res[ln.item];
      var skip = r && (r.outcome === 'skipped' || r.outcome === 'none');
      var attrs = { class: 'ai-code', dataset: Object.assign({}, ln.item === null ? { head: '' } : {}, ln.item !== null && ln.item === now ? { now: '' } : {}, skip ? { skip: '' } : {}) };
      var code = h('div', attrs, ln.text);
      if (side === 'A' && ln.last && r && r.exit !== null) code.append(h('span', { class: 'ai-exit', dataset: r.exit ? { bad: '' } : {} }, '$? = ' + r.exit));
      box.append(ln.first ? mark(side, r) : h('span', { class: 'ai-g' }), code);
    });
    return box;
  }

  // ── host state ──
  function stateRows(side, c) {
    var hs = c.state.hosts[side], ph = c.prev ? c.prev.hosts[side] : null, p = c.params;
    var items = L.PLAYS[p.play], rows = [];
    function row(k, v) { rows.push(h('div', { class: 'ai-k' }, k), h('div', { class: 'ai-v' }, v)); }
    function path(text) { return h('span', { translate: 'no', class: 'ai-mono' }, text); }
    function val(present, changed, text) {
      return h('span', { class: 'ai-val' + (changed ? ' sd-changed' : ''), dataset: present ? {} : { absent: '' } }, text);
    }
    if (items.indexOf('line') >= 0) {
      var file = h('div', { class: 'ai-file' }), seen = {};
      var removed = ph && ph.hostsLines.length > hs.hostsLines.length;
      hs.hostsLines.forEach(function (line, i) {
        seen[line] = (seen[line] || 0) + 1;
        var isNew = ph && i >= ph.hostsLines.length;
        file.append(h('div', { class: 'ai-fl' + (isNew ? ' sd-changed' : ''), dataset: seen[line] > 1 ? { dup: '' } : {} },
          h('span', { translate: 'no' }, line), seen[line] > 1 ? h('span', { class: 'ai-dup', translate: 'no' }, '×' + seen[line]) : null));
      });
      if (removed) file.classList.add('sd-changed');
      row(path('/etc/hosts'), file);
    }
    if (items.indexOf('dir') >= 0) {
      var hasDir = hs.dirs.indexOf(L.DIR) >= 0;
      row(path(L.DIR), val(hasDir, ph && (ph.dirs.indexOf(L.DIR) >= 0) !== hasDir, t(hasDir ? 'present' : 'absent')));
    }
    if (items.indexOf('user') >= 0) {
      var hasUser = hs.users.indexOf(L.USER) >= 0;
      row([t('userRow') + ' ', path(L.USER)], val(hasUser, ph && (ph.users.indexOf(L.USER) >= 0) !== hasUser, t(hasUser ? 'present' : 'absent')));
    }
    if (items.indexOf('conf') >= 0) {
      var ours = hs.conf === 'ours';
      var confChanged = c.state.run > 0 && !c.state.edit && L.PLAYS[p.play][c.state.pc] === 'conf' && c.state.results[side][c.state.pc] &&
        (side === 'A' || c.state.results[side][c.state.pc].outcome === 'changed');
      row(path('/etc/web/web.conf'), val(true, confChanged, t(ours ? 'confOurs' : 'confStock')));
    }
    if (items.indexOf('restart') >= 0) {
      row(t('restartsRow'), val(true, ph && ph.restarts !== hs.restarts, h('b', { translate: 'no' }, String(hs.restarts))));
    }
    return h('div', null, h('h3', null, t('hostState')), h('div', { class: 'ai-state' }, rows));
  }

  // ── results per run ──
  function results(side, c) {
    var s = c.state, p = c.params, list = h('div', { class: 'ai-runs' });
    for (var r = 1; r <= p.runs; r++) {
      var rc = s.recap.filter(function (x) { return x.run === r; })[0];
      if (!rc) { list.append(h('div', { class: 'ai-run', dataset: { future: '' } }, h('span', { class: 'ai-rn', translate: 'no' }, r + '.'), h('span', { class: 'ai-note' }, t('notYet')))); continue; }
      var fresh = c.prev && c.prev.recap.length < s.recap.length && r === s.recap[s.recap.length - 1].run;
      var row = h('div', { class: 'ai-run' + (fresh ? ' sd-changed' : '') }, h('span', { class: 'ai-rn', translate: 'no' }, r + '.'));
      if (side === 'A') {
        var bad = rc.A.exit !== 0;
        row.append(h('span', { class: 'ai-mark', dataset: { o: bad ? 'failed' : 'ok' }, role: 'img', 'aria-label': bad ? t('legFailed') : t('legOk') }, bad ? '✗' : '✓'),
          h('span', { translate: 'no' }, 'exit ' + rc.A.exit));
        var stopped = rc.A.stopped;
        if (stopped) row.append(h('span', { class: 'ai-note' }, t('stoppedAt')));
      } else {
        row.append(h('span', { class: 'ai-mark', dataset: { o: rc.B.changed ? 'changed' : 'ok' }, role: 'img', 'aria-label': rc.B.changed ? t('legChanged') : t('legOk') }, rc.B.changed ? '✎' : '✓'),
          h('span', { translate: 'no' }, 'ok=' + rc.B.ok + ' changed=' + rc.B.changed + ' failed=' + rc.B.failed));
      }
      list.append(row);
    }
    return h('div', { class: 'ai-res' }, h('h3', null, t(side === 'A' ? 'resA' : 'resB')), list);
  }

  function column(side, c) {
    return h('div', { class: 'ai-col' },
      h('h2', null, t(side === 'A' ? 'colA' : 'colB'), h('small', null, t(side === 'A' ? 'colASub' : 'colBSub'))),
      source(side, c), stateRows(side, c), results(side, c));
  }

  // ── timeline ──
  function timeline(c) {
    var s = c.state, p = c.params, tl = h('div', { class: 'ai-tl' });
    var blocks = [];
    for (var r = 1; r <= p.runs; r++) {
      blocks.push({ k: 'run', r: r });
      if (r === 1 && L.hasEdit(p)) blocks.push({ k: 'edit' });
    }
    var editDone = s.edited;
    blocks.forEach(function (b) {
      var st;
      if (b.k === 'edit') st = s.edit ? 'now' : editDone ? 'done' : 'future';
      else st = !s.edit && s.run === b.r ? 'now' : s.recap.some(function (x) { return x.run === b.r; }) || s.run > b.r ? 'done' : 'future';
      tl.append(h('span', { class: 'ai-chip', dataset: { s: st, k: b.k } }, b.k === 'edit' ? t('tlEdit') : t('tlRun', { r: b.r })));
    });
    var items = L.PLAYS[p.play];
    if (s.run > 0 && !s.edit && items.length > 1) {
      tl.append(h('span', { class: 'ai-tl-at' }, items[s.pc] === 'restart' ? t('tlHandlers') : t('tlItem', { k: s.pc + 1, n: items.length })));
    }
    return tl;
  }

  // ── caption ──
  function aClause(s, p, item, r, last) {
    if (r.outcome === 'skipped') return t.parts('aSkipped', { cmd: data(CMD[item]) });
    if (p.play === 'guarded') {
      return t.parts(r.msg === 'guard' ? 'aGuard' : 'aGuardDo', { guard: data(GUARD[item]), what: t('whatA' + item) });
    }
    var tail = r.outcome === 'error' && !last ? t(p.setE ? 'aStops' : 'aRunsOn') : '';
    switch (item) {
      case 'line':
        if (r.msg === 'again') return t.parts('aAgain', { copies: t('copies' + Math.min(3, L.copies(s.hosts.A))) });
        return s.run > 1 ? t.parts('aAfterEdit') : t.parts('aAppend', { line: data(L.LINE) });
      case 'dir':
        return r.outcome === 'error' ? t.parts('aDirFail', { exit: data(r.exit) }).concat([tail]) : t.parts('aCreateDir', { dir: data(L.DIR) });
      case 'user':
        return r.outcome === 'error' ? t.parts('aUserFail', { user: data(L.USER), exit: data(r.exit) }).concat([tail]) : t.parts('aCreateUser', { user: data(L.USER) });
      case 'conf':
        return t.parts(r.msg === 'again' ? 'aCpAgain' : 'aCp', { conf: data('web.conf') });
      case 'restart':
        return t.parts('aRestart', { n: t.n('times', s.hosts.A.restarts) });
    }
    return [];
  }
  function bClause(item, r) {
    var ch = data('changed'), hd = data('restart web');
    if (item === 'restart') return t.parts(r.outcome === 'changed' ? 'bHandler' : 'bHandlerNone', { h: hd, mod: data('copy'), changed: ch });
    if (r.outcome === 'changed') return item === 'conf' ? t.parts('bChangedNotify', { mod: data('copy'), changed: ch, h: hd }) : t.parts('bChanged', { mod: data(MODULE[item]), changed: ch });
    return t.parts('bOk', { mod: data(MODULE[item]), what: t('whatB' + item), ok: data('ok') });
  }
  function caption(c) {
    var s = c.state, p = c.params;
    if (s.edit) return t.parts('capEdit', { line: data(L.LINE), file: data('/etc/hosts') });
    if (s.run === 0) return t('capStart');
    var items = L.PLAYS[p.play], item = items[s.pc], last = s.pc === items.length - 1;
    var run = t('run' + s.run);
    var head = items.length === 1 ? run : item === 'restart' ? t('capHeadHandlers', { run: run }) : t('capHead', { run: run, k: s.pc + 1 });
    var parts = t.parts('capStep', { head: head, a: wrap(aClause(s, p, item, s.results.A[s.pc], last)), b: wrap(bClause(item, s.results.B[s.pc])) });
    if (last) {
      var rc = s.recap[s.recap.length - 1];
      parts = parts.concat(t.parts('capEnd', { exit: data(rc.A.exit), recap: data('ok=' + rc.B.ok + ' changed=' + rc.B.changed + ' failed=' + rc.B.failed) }));
      if (rc.A.exit === 0 && L.copies(s.hosts.A) > 1) parts = parts.concat(t.parts('capWrong'));
      else if (p.play === 'guarded' && s.run >= 2 && JSON.stringify(s.hosts.A) === JSON.stringify(s.hosts.B)) parts = parts.concat(t.parts('capSame'));
    }
    return parts;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'play', type: 'choice', label: t('play'), resets: true,
        options: [['hosts', t('playHosts')], ['three', t('playThree')], ['guarded', t('playGuarded')], ['handler', t('playHandler')]] },
      { key: 'runs', type: 'range', label: t('runs'), min: 1, max: 3, resets: true },
      { key: 'setE', type: 'toggle', label: t('setE'), hint: t('setEHint'), resets: true },
      { key: 'manualEdit', type: 'toggle', label: t('manualEdit'), hint: t('manualEditHint'), resets: true,
        disabled: function (p) { return p.runs >= 2 && L.PLAYS[p.play].indexOf('line') >= 0 ? false : t('manualEditOff'); } }
    ],

    presets: [
      { id: 'append-twice', label: t('presetAppend'), hint: t('presetAppendHint'), params: { play: 'hosts', runs: 3, setE: true, manualEdit: false } },
      { id: 'three-tasks', label: t('presetThree'), hint: t('presetThreeHint'), params: { play: 'three', runs: 2, setE: true, manualEdit: false } },
      { id: 'guarded-script', label: t('presetGuarded'), hint: t('presetGuardedHint'), params: { play: 'guarded', runs: 2, setE: true, manualEdit: false } },
      { id: 'drift', label: t('presetDrift'), hint: t('presetDriftHint'), params: { play: 'hosts', runs: 2, setE: true, manualEdit: true } },
      { id: 'handler', label: t('presetHandler'), hint: t('presetHandlerHint'), params: { play: 'handler', runs: 2, setE: true, manualEdit: false } }
    ],

    legend: [
      { shape: 'ai-ok', label: t('legOk') },
      { shape: 'ai-changed', label: t('legChanged') },
      { shape: 'ai-failed', label: t('legFailed') },
      { shape: 'ai-dup', label: t('legDup') },
      { shape: 'ai-skip', label: t('legSkipped') },
      { shape: 'hl', label: t('legWritten') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'ai' }, timeline(c),
        h('div', { class: 'ai-cols' }, column('A', c), column('B', c))));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
