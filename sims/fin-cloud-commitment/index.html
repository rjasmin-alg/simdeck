<!-- fin-cloud-commitment: a commitment buys a discount on usage that is paid whether used or not; a committed server
     pays off above break-even (committed price ÷ on-demand price), so commit the base load and leave the peaks on
     demand; a longer term deepens the discount and the risk. The stage: year 1 month by month (drag the columns),
     years 2–3 for the 3-year term, each server level's share of the time against break-even (the ladder sets the
     level), the term's cost all on demand and with the commitment, and both terms' saving.
     Sums: commitment.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var N = L.N_MAX;

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (30 000 / 30,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Whole euros (every amount here is whole). */
  function money(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  function pct(n) { return t('pct', { n: String(n) }); }
  /** A saving or loss as a percent, never "0 %" for one that is not zero (it rounds to 0 below 0.5 %). */
  function pctOf(v, outcome) { return v === 0 && outcome !== 'even' ? t('pctLt1') : pct(Math.abs(v)); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function at(v) { return (100 * v / N) + '%'; }                // a server count as a height on the plot
  /** A whole-percent share for the ladder (exact comparison is the model's; this is only the label). */
  function shareText(x) { return pct(Math.round(x)); }

  // ── editing: drag across the months (or arrow keys); drag the ladder (or arrow keys) for the level ──

  var drag = null;      // { kind: 'month' | 'level', rect } while dragging
  var refocus = null;   // the element to give focus back to after a render (keyboard changes)

  function clampN(v) { return Math.max(0, Math.min(N, Math.round(v))); }
  function levelAt(y) { return clampN((drag.rect.bottom - y) / drag.rect.height * N); }
  function onMove(e) {
    if (!drag) return;
    var patch = {};
    if (drag.kind === 'level') patch.commit = levelAt(e.clientY);
    else {
      var m = Math.floor((e.clientX - drag.rect.left) / drag.rect.width * 12);
      if (m < 0 || m > 11) return;
      patch['u' + (m + 1)] = levelAt(e.clientY);
    }
    sim.set(patch);
  }
  function onUp() {
    if (!drag) return;
    drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
  }
  function startDrag(e, kind) {
    if (e.button !== 0) return;
    e.preventDefault();
    drag = { kind: kind, rect: e.currentTarget.getBoundingClientRect() };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    onMove(e);
  }
  /** Arrow keys on a month or the ladder: ±1, Shift or PageUp/PageDown ±5, Home 0, End the top. */
  function onKey(e, key, v, focusKey) {
    var by = e.shiftKey ? 5 : 1, to = null;
    if (e.key === 'ArrowUp' || e.key === 'ArrowRight') to = v + by;
    else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') to = v - by;
    else if (e.key === 'PageUp') to = v + 5;
    else if (e.key === 'PageDown') to = v - 5;
    else if (e.key === 'Home') to = 0;
    else if (e.key === 'End') to = N;
    if (to === null) return;
    e.preventDefault();
    refocus = focusKey;
    var patch = {};
    patch[key] = clampN(to);
    sim.set(patch);
  }
  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)

  // ── the stage ──

  /** One month's column: used (solid), unused (hatched), on demand (striped), from the bottom. */
  function segs(u, c) {
    var used = Math.min(u, c), unused = Math.max(0, c - u), od = Math.max(0, u - c);
    return [
      used > 0 ? h('div', { class: 'cc-seg', dataset: { k: 'used' }, style: { bottom: '0', height: at(used) } }) : null,
      unused > 0 ? h('div', { class: 'cc-seg', dataset: { k: 'unused' }, style: { bottom: at(u), height: at(unused) } }) : null,
      od > 0 ? h('div', { class: 'cc-seg', dataset: { k: 'od' }, style: { bottom: at(c), height: at(od) } }) : null
    ];
  }
  function line(c) { return h('div', { class: 'cc-line', style: { bottom: at(c) } }); }

  function chart(s) {
    var p = s.p, c = p.commit, term = p.term;
    var kids = [];
    // axis: ticks and the commitment tag
    var ticks = [0, 4, 8, 12, 16].map(function (v) {
      return h('span', { class: 'cc-tick', translate: 'no', style: { bottom: at(v) } }, String(v));
    });
    ticks.push(h('span', { class: 'cc-ctag', translate: 'no', style: { bottom: at(c) } }, String(c)));
    kids.push(h('div', { class: 'cc-axis', 'aria-hidden': 'true' }, ticks));

    // year 1
    kids.push(h('p', { class: 'cc-head', dataset: { r: 'y' } }, t('headYear1')));
    var cols = s.months.map(function (m, i) {
      var key = 'u' + (i + 1), name = t('m' + (i + 1));
      var label = t('monthLabel', { m: name, servers: t.n('nServers', m.u) });
      return h('div', {
        class: 'cc-col', role: 'slider', tabindex: '0', dataset: { k: key },
        'aria-label': name, 'aria-valuemin': '0', 'aria-valuemax': String(N), 'aria-valuenow': String(m.u),
        'aria-valuetext': label, title: label,
        onkeydown: function (e) { onKey(e, key, m.u, key); }
      }, segs(m.u, c), h('span', { class: 'cc-num', translate: 'no', style: { bottom: 'min(' + at(Math.max(m.u, c)) + ', calc(100% - 1.2rem))' } }, m.u > 0 ? String(m.u) : ''));
    });
    kids.push(h('div', { class: 'cc-plot cc-y1', dataset: { r: 'y' } },
      h('div', { class: 'cc-cols', onpointerdown: function (e) { startDrag(e, 'month'); } }, cols), line(c)));
    kids.push(h('div', { class: 'cc-months', dataset: { r: 'y' }, 'aria-hidden': 'true' },
      s.months.map(function (m, i) { return h('span', null, t('m' + (i + 1))); })));

    // years 2 and 3 (the 3-year term): year 1 scaled by later; drawn, not edited
    if (term === 3) {
      kids.push(h('p', { class: 'cc-head', dataset: { r: 'l' } }, t.parts('headLater', { p: b(pct(p.later)) })));
      kids.push(h('div', { class: 'cc-plot', dataset: { r: 'l' }, 'aria-hidden': 'true' },
        h('div', { class: 'cc-cols' }, s.later.map(function (u) { return h('div', { class: 'cc-col' }, segs(u, c)); })),
        line(c)));
    }

    // the ladder: each level's share of the time, break-even, the committed levels
    kids.push(h('p', { class: 'cc-head', dataset: { r: 'd' } }, t('headLadder')));
    var rows = s.levels.map(function (l) {
      return h('div', { class: 'cc-row', dataset: l.k <= c ? { in: '' } : {}, style: { bottom: at(l.k - 1) } },
        h('div', { class: 'cc-track' }, l.share > 0 ? h('div', { class: 'cc-bar', dataset: { v: l.verdict }, style: { width: l.share + '%' } }) : null),
        l.share > 0 ? h('span', { class: 'cc-share', translate: 'no', dataset: { v: l.verdict } }, shareText(l.share)) : null);
    });
    var lv = t('ladderLabel', { servers: t.n('nServers', c) });
    kids.push(h('div', {
      class: 'cc-plot cc-ladder', dataset: { r: 'd', k: 'commit' }, role: 'slider', tabindex: '0',
      'aria-label': t('commit'), 'aria-valuemin': '0', 'aria-valuemax': String(N), 'aria-valuenow': String(c),
      'aria-valuetext': lv, title: lv,
      onpointerdown: function (e) { startDrag(e, 'level'); },
      onkeydown: function (e) { onKey(e, 'commit', c, 'commit'); }
    }, rows, h('div', { class: 'cc-be', style: { left: (0.74 * s.breakEven) + '%' } }), line(c)));
    kids.push(h('p', { class: 'cc-betag', dataset: { r: 'd' } }, t.parts('breakEvenTag', { p: b(pct(s.breakEven)) })));

    return h('div', { class: 'cc-chart', dataset: { term: String(term) } }, kids);
  }

  function money3(s, chg) {
    var x = s.cost, top = Math.max(x.all, x.with, 1);
    var seg = function (k, v) { return v > 0 ? h('div', { class: 'cc-seg', dataset: { k: k }, style: { width: (100 * v / top) + '%' } }) : null; };
    var res;
    if (s.outcome === 'save') res = t('resultSave', { d: money(x.save), p: pctOf(s.pct, s.outcome) });
    else if (s.outcome === 'loss') res = s.pct === null ? t('resultLossNoUse', { d: money(x.save) }) : t('resultLoss', { d: money(x.save), p: pctOf(s.pct, s.outcome) });
    else res = t('resultEven');
    var over = t.n('overYears', s.p.term);
    return h('div', { class: 'cc-money' },
      h('span', { class: 'cc-mlabel' }, t('rowAll'), ' ', h('span', { class: 'cc-parts' }, over)),
      h('div', { class: 'cc-stack' }, seg('od', x.all)),
      h('span', { class: 'cc-sum', translate: 'no' }, money(x.all)),
      h('span', { class: 'cc-mlabel' }, t('rowWith')),
      h('div', { class: 'cc-stack' }, seg('used', x.used), seg('unused', x.unused), seg('od', x.od)),
      h('span', { class: 'cc-sum', translate: 'no' }, money(x.with)),
      h('span', { class: 'cc-parts' }, t('parts', { used: money(x.used), unused: money(x.unused), od: money(x.od) })),
      h('span', { class: 'cc-result' + (chg.indexOf('outcome') >= 0 ? ' sd-changed' : ''), dataset: { o: s.outcome } }, res));
  }

  function terms(s) {
    var chips = L.TERMS.map(function (term) {
      var v = s.chips[term];
      var res = v.pct === null ? t('chipNoUse') : v.outcome === 'save' ? t('chipSave', { p: pctOf(v.pct, v.outcome) })
        : v.outcome === 'loss' ? t('chipLoss', { p: pctOf(v.pct, v.outcome) }) : t('chipEven');
      return h('button', {
        type: 'button', class: 'cc-chip', 'aria-pressed': String(term === s.p.term), onmousedown: noFocus,
        onclick: function () { sim.set({ term: term }); }
      }, t('termChip', { term: t('term' + term), off: pct(L.DISCOUNT[term]), res: res }));
    });
    return h('p', { class: 'cc-terms' }, h('span', null, t('termsLabel')), chips);
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'cc' },
      chart(s),
      money3(s, chg),
      terms(s),
      h('p', { class: 'cc-foot' }, t('dragHint'), ' ',
        t('priceNote', { p: money(L.P), c1: money(L.committedPrice(1)), c3: money(L.committedPrice(3)) }), ' ',
        t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-k="' + refocus + '"][tabindex]');
      refocus = null;
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state, x = s.cost, term = s.p.term;
    var k = L.captionKey(s);
    var over = t.n('overYears', term);
    var out = t.parts(k.key, {
      servers: t.n('ofServers', s.p.commit), term: over, paid: b(money(x.paid)), unused: b(money(x.unused)),
      od: b(money(x.od)), with: b(money(x.with)), all: b(money(x.all)), d: b(money(x.save)),
      pct: s.pct === null || s.outcome === 'even' ? '' : t('pctParen', { p: pctOf(s.pct, s.outcome) })
    });
    if (k.key === 'capNone') out = t.parts('capNone', { all: b(money(x.all)), term: over });
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, { be: b(pct(s.breakEven)), k: b(s.best), later: b(pct(s.p.later)) }));
    });
    return out;
  }

  var labels = {
    steady: 'pSteady', 'base-load': 'pBaseLoad', 'cover-peak': 'pCoverPeak', 'three-years': 'pThreeYears',
    'usage-falls': 'pUsageFalls'
  };
  var never = function () { return false; };

  // The months are set on the stage; these hidden params keep them in the URL and clamp them.
  var hidden = [];
  for (var m = 1; m <= L.MONTHS; m++) {
    hidden.push({ key: 'u' + m, type: 'range', label: t('m' + m), min: 0, max: N, step: 1, visible: never });
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'commit', type: 'range', label: t('commit'), min: 0, max: N, step: 1,
        format: function (v) { return t.n('nServers', v); } },
      { key: 'term', type: 'choice', label: t('term'), options: [[1, t('term1')], [3, t('term3')]] },
      { key: 'later', type: 'range', label: t('later'), min: 0, max: L.LATER_MAX, step: L.LATER_STEP,
        format: function (v) { return pct(v); } },
      { type: 'button', label: t('best'), key: 'o', run: function (api) { api.set({ commit: api.state.best }); } }
    ].concat(hidden),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cc-used', label: t('legUsed') },
      { shape: 'cc-unused', label: t('legUnused') },
      { shape: 'cc-od', label: t('legOd') },
      { shape: 'cc-commit', label: t('legCommit') },
      { shape: 'cc-be', label: t('legBreakEven') },
      { shape: 'cc-pays', label: t('legPays') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
