<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var SCHEMES = L.SCHEMES;
  var NAME = { plain: 'schemePlain', hash: 'schemeHash', salted: 'schemeSalted', slow: 'schemeSlow' };
  var SUB = { plain: 'subPlain', hash: 'subHash', salted: 'subSalted', slow: 'subSlow' };
  var CAPNAME = { hash: 'capHashName', salted: 'capSaltedName', slow: 'capSlowName' };
  var COLOUR = { plain: 'var(--c5)', hash: 'var(--c2)', salted: 'var(--c3)', slow: 'var(--c1)' };
  var MARKS = ['◆', '●'];

  function ctl() { return sim || window.simdeck; }
  function data(text, cls) { return h('b', { translate: 'no', class: cls || null }, String(text)); }

  // ---- numbers in the page language: Croatian 456 976 and 6,1; English 456,976 and 6.1 ----
  var SEP = Simdeck.lang === 'hr' ? ['\u00a0', ','] : [',', '.'];
  function num(v) { return L.fmtNum(v, SEP[0], SEP[1]); }
  function big(x) {
    if (x < 1e7 && Number.isInteger(x)) return num(x);
    var s = L.sci(x);
    return num(s.m) + ' · 10' + L.sup(s.e);
  }
  function approx(x) { return x < 1e7 && Number.isInteger(x) ? ' = ' : ' ≈ '; }
  /** 456 976, or ≈ 2,18 · 10¹⁴ when rounded (SPEC.md, Tie-breaks). */
  function about(x) { return (approx(x) === ' = ' ? '' : '≈ ') + big(x); }
  function dur(seconds, long) {
    var p = L.timeParts(seconds), pre = long ? 'l_' : 'u_';
    if (p.unit === 'now') return t(pre + 'now');
    if (p.m !== undefined) return t(pre + 'y', { n: 5, v: num(p.m) + ' · 10' + L.sup(p.e) });
    return t(pre + p.unit, { n: Number.isInteger(p.value) ? p.value : 5, v: num(p.value) });
  }
  function names(list) {
    if (list.length < 2) return list.join('');
    return list.slice(0, -1).join(t('listSep')) + t('and') + list[list.length - 1];
  }

  // ---- the stage is built once and updated in place, so Luka's box keeps its caret and focus while typing ----
  var ui = null;

  function build(stage) {
    var head = h('tr', null,
      h('th', { class: 'ps-lane ps-keep', 'aria-label': t('sameLane') }),
      h('th', { class: 'ps-keep' }, t('colUser')));
    var cols = {};
    SCHEMES.forEach(function (s) {
      var stolen = h('span', { class: 'ps-stolen' }, '▼ ' + t('stolen'));
      var th = h('th', { style: { '--sw': COLOUR[s] }, dataset: { s: s }, class: s === 'plain' ? 'ps-keep' : null },
        stolen, h('div', null, t(NAME[s])), h('span', { class: 'ps-sub' }, t(SUB[s])));
      head.appendChild(th);
      cols[s] = { th: th, stolen: stolen, cells: [] };
    });
    var rows = [], lanes = [];
    var body = h('tbody');
    L.initial(L.defaults).users.forEach(function (u, i) {
      var lane = h('td', { class: 'ps-lane ps-keep' });
      lanes.push(lane);
      var tr = h('tr', null, lane, h('td', { class: 'ps-name ps-keep', translate: 'no' }, u.name));
      SCHEMES.forEach(function (s) {
        var td = h('td', { style: { '--sw': COLOUR[s] }, dataset: { s: s }, class: s === 'plain' ? 'ps-keep' : null });
        tr.appendChild(td);
        cols[s].cells.push(td);
      });
      body.appendChild(tr);
      rows.push(tr);
    });
    var input = h('input', {
      type: 'text', class: 'ps-input', maxlength: '40', spellcheck: 'false', autocomplete: 'off', translate: 'no',
      'aria-label': t('lukaInput'), title: t('lukaHint')
    });
    input.addEventListener('input', function () {
      var p = { password: input.value };
      var shape = L.shapeOf(input.value);
      if (shape) Object.assign(p, shape);
      ctl().set(p);
    });
    var same = h('span', { class: 'ps-same' });
    var server = h('section', { class: 'ps-box' },
      h('div', { class: 'ps-headline' }, h('span', { class: 'ps-h' }, t('tableTitle')), h('span', { class: 'ps-sub' }, t('cut')), same),
      h('table', { class: 'ps-table' }, h('thead', null, head), body));

    // the precomputed table
    var rbRows = [];
    var rbList = h('div', { class: 'ps-rb-list' },
      h('span', { class: 'ps-rb-head' }, t('rainbowHash')), h('span', { class: 'ps-rb-head' }, t('rainbowPassword')), h('span', { class: 'ps-rb-head' }));
    L.rainbowTable().forEach(function (e) {
      var hash = h('span', { class: 'ps-mono', translate: 'no' }, e.hash.slice(0, L.SHOW));
      var hit = h('span', { class: 'ps-rb-hit' });
      rbList.append(hash, h('span', { class: 'ps-mono', translate: 'no' }, e.password), hit);
      rbRows.push({ hash: hash, hit: hit, entry: e });
    });
    var rbStatus = h('div', { class: 'ps-status' });
    var term = h('i', { lang: 'en' }, t('rainbowTerm'));
    var rainbow = h('section', { class: 'ps-box' },
      h('div', { class: 'ps-h' }, t('rainbowTitle')),
      h('div', { class: 'ps-sub' }, t.parts('rainbowSub', { term: term })),
      rbList,
      h('div', { class: 'ps-sub' }, t('rainbowSize')),
      rbStatus);

    // the time bars
    var spaceLine = h('div', { class: 'ps-sub' });
    var breachLine = h('div', { class: 'ps-sub' });
    var bars = h('div', { class: 'ps-bars', role: 'img', 'aria-label': t('axisLabel') });
    var barUi = {};
    SCHEMES.forEach(function (s) {
      var rate = h('span');
      var track = h('div', { class: 'ps-track', style: { '--sw': COLOUR[s] } });
      L.TICKS.forEach(function (tk) { track.appendChild(h('span', { class: 'ps-gridline', style: { left: (100 * L.axisPos(tk[0]).pos) + '%' } })); });
      var fill = h('div', { class: 'ps-fill' });
      track.appendChild(fill);
      var value = h('b', { translate: 'no' });
      var note = h('span');
      bars.append(h('div', { class: 'ps-bl' }, h('b', null, t(NAME[s])), rate, h('span', { class: 'ps-bv' }, value, note)), track);
      barUi[s] = { rate: rate, track: track, fill: fill, value: value, note: note };
    });
    var axis = h('div', { class: 'ps-axis', 'aria-hidden': 'true' });
    // the right end (10¹² years) has a gridline and no label: it would collide with 10⁹
    L.TICKS.slice(0, -1).forEach(function (tk) { axis.appendChild(h('span', { class: 'ps-tick', style: { left: (100 * L.axisPos(tk[0]).pos) + '%' } }, t('t_' + tk[1]))); });
    bars.append(axis);
    var time = h('section', { class: 'ps-box' },
      h('div', { class: 'ps-headline' }, h('span', { class: 'ps-h' }, t('timeTitle')), h('span', { class: 'ps-sub' }, t('timeAvg'))),
      spaceLine, breachLine, bars);

    var root = h('div', { class: 'ps' }, server, h('div', { class: 'ps-attack' }, rainbow, time));
    stage.replaceChildren(root);
    return { root: root, same: same, cols: cols, lanes: lanes, input: input, rbRows: rbRows, rbList: rainbow, rbStatus: rbStatus,
      spaceLine: spaceLine, breachLine: breachLine, bars: barUi };
  }

  var lastStored = null;

  function fillTable(s, password) {
    var changed = {};
    SCHEMES.forEach(function (sc) {
      var col = ui.cols[sc], sel = sc === s.scheme;
      col.th.classList.toggle('ps-sel', sel);
      col.stolen.hidden = !sel;
      var mark = {};
      s.groups[sc].forEach(function (g, gi) { g.forEach(function (n) { mark[n] = MARKS[gi]; }); });
      s.table.forEach(function (row, i) {
        var td = col.cells[i], v = row.stored[sc];
        td.classList.toggle('ps-sel', sel);
        var key = row.name + '/' + sc;
        td.classList.toggle('sd-changed', !!lastStored && lastStored[key] !== v);
        changed[key] = v;
        if (sc === 'plain' && row.name === 'Luka') {
          if (!td.contains(ui.input)) td.replaceChildren(ui.input);
          if (ui.input.value !== password) ui.input.value = password;
          ui.input.classList.toggle('sd-hl', !!mark[row.name]);
          return;
        }
        var val = h('span', { class: 'ps-val' + (mark[row.name] ? ' sd-hl' : ''), translate: 'no', dataset: mark[row.name] ? { mark: mark[row.name] } : {} }, v);
        if (sc === 'salted' || sc === 'slow') {
          td.replaceChildren(h('span', { class: 'ps-salt sd-hatch', translate: 'no', title: t('saltTitle') }, s.users[i].salt), val);
        } else {
          td.replaceChildren(val);
        }
      });
    });
    lastStored = changed;
    // the group labels: "◆ same hash: Ana and Marko" for each group in the stolen column
    ui.same.replaceChildren.apply(ui.same, s.groups[s.scheme].map(function (g, gi) {
      return h('span', { class: 'sd-hl' }, t.parts('sameLine', { mark: MARKS[gi], names: h('span', { translate: 'no' }, names(g)) }));
    }));
    // the bracket lane: the stolen column's groups, linked from their first to their last row
    ui.lanes.forEach(function (l) { l.replaceChildren(); });
    s.groups[s.scheme].forEach(function (g, gi) {
      var idx = g.map(function (n) { return s.table.findIndex(function (r) { return r.name === n; }); }).sort(function (x, y) { return x - y; });
      var lo = idx[0], hi = idx[idx.length - 1];
      for (var i = lo; i <= hi; i++) {
        var pos = i === lo ? 'ps-top' : i === hi ? 'ps-bot' : 'ps-mid';
        var member = idx.indexOf(i) >= 0;
        ui.lanes[i].appendChild(h('span', {
          class: 'ps-br ' + pos + (member ? ' ps-mem' : ''), dataset: { lane: String(gi), mark: member ? MARKS[gi] : '' },
          title: member ? t('sameTag') : null, 'aria-label': member ? t('sameTag') : null, role: member ? 'img' : null
        }));
      }
    });
  }

  function fillRainbow(s) {
    var hits = s.hits[s.scheme];
    var on = s.scheme === 'hash';
    ui.rbList.classList.toggle('ps-rb-off', !on);
    ui.rbRows.forEach(function (r) {
      var who = on ? s.users.filter(function (u) { return L.sha256(u.password) === r.entry.hash; }).map(function (u) { return u.name; }) : [];
      r.hash.classList.toggle('sd-hl', who.length > 0);
      r.hit.replaceChildren(who.length ? h('span', null, h('span', { 'aria-hidden': 'true' }, '✓ '), who.join(t('listSep'))) : '');
    });
    var st = ui.rbStatus;
    if (s.scheme === 'plain') { st.className = 'ps-status ps-bad'; st.textContent = t('rbPlain'); }
    else if (on && hits.length) { st.className = 'ps-status ps-bad'; st.replaceChildren(h('span', { class: 'ps-sym', 'aria-hidden': 'true' }, '✓'), t.n('rbHits', hits.length)); }
    else if (on) { st.className = 'ps-status ps-good'; st.replaceChildren(h('span', { class: 'ps-sym', 'aria-hidden': 'true' }, '✗'), t('rbNone')); }
    else { st.className = 'ps-status ps-good'; st.replaceChildren(h('span', { class: 'ps-sym', 'aria-hidden': 'true' }, '✗'), t('rbSalted')); }
  }

  function fillTime(s) {
    var a = s.attack, p = s.policy;
    ui.spaceLine.replaceChildren.apply(ui.spaceLine, t.parts('timeSpace', {
      len: t.n('len' + p.alphabet, p.length),
      calc: data(p.alphabet + L.sup(p.length) + approx(a.space) + big(a.space))
    }));
    ui.breachLine.hidden = !p.inBreachList;
    ui.breachLine.replaceChildren.apply(ui.breachLine, t.parts('timeBreach', { list: data(big(a.listSize)) }));
    a.schemes.forEach(function (r) {
      var b = ui.bars[r.scheme];
      b.track.classList.toggle('ps-selt', r.scheme === s.scheme);
      var ax = L.axisPos(r.seconds);
      b.fill.style.width = (100 * ax.pos) + '%';
      b.fill.classList.toggle('ps-over', ax.over);
      b.value.textContent = dur(r.seconds) + (ax.over ? ' ▶' : '');
      if (r.scheme === 'plain') {
        b.rate.textContent = t('rowRead');
        b.note.textContent = '';
      } else {
        b.rate.textContent = t('rowRate', { rate: '10' + L.sup(Math.round(Math.log10(r.rate))) });
        b.note.textContent = r.scheme === 'hash' ? t('rowTableSame') : t('rowTableEach', { time: dur(r.table) });
      }
      b.value.title = ax.over ? t('over') : '';
    });
  }

  // ---- caption focus: table after a scheme change or the same-password preset, time after the rest (sim.js) ----
  var focus = null, last = null, lastPreset = null, keepFocus = null;
  function track(c) {
    focus = keepFocus || L.nextFocus(focus, last, c.params, c.preset, lastPreset);
    keepFocus = null;
    last = Object.assign({}, c.params);
    lastPreset = c.preset;
  }

  function tableCaption(s) {
    if (s.scheme === 'plain') return t.parts('capPlain');
    if (s.scheme === 'hash') {
      var g = s.groups.hash[0];
      var first = g ? t.parts(g.length === 2 ? 'capSame2' : 'capSameMore', { names: data(names(g)) }) : t.parts('capHashOnly');
      var n = s.hits.hash.length;
      return first.concat(' ', n ? t.parts('capHits', { n: n, count: data(n, 'sd-hl') }) : t.parts('capNoHits'));
    }
    if (s.scheme === 'salted') {
      var pg = s.groups.plain[0];
      return pg ? t.parts('capSalted', { names: data(names(pg)) }) : t.parts('capSaltedNone');
    }
    return t.parts('capSlow', { ratio: data('10' + L.sup(Math.round(Math.log10(s.rate.fast / s.rate.slow)))) });
  }

  function timeCaption(s) {
    var p = s.policy;
    var len = t.n('lenOf' + p.alphabet, p.length);
    if (s.scheme === 'plain') return t.parts('capTimePlain', { len: len });
    var r = s.attack.schemes[SCHEMES.indexOf(s.scheme)];
    var vars = { len: len, space: data(about(s.attack.space)), list: data(big(s.attack.listSize)), scheme: t(CAPNAME[s.scheme]), time: data(dur(r.seconds, true), 'sd-hl') };
    return t.parts(p.inBreachList ? 'capTimeBreach' : 'capTime', vars);
  }

  var labels = { 'four-chars': 'presetFour', 'same-password': 'presetSame', 'eight-alnum': 'presetEight', passphrase15: 'presetPass15', breached: 'presetBreached' };
  var sim;

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      // value: what a bad URL value falls back to (the kit's coerce and normalise use the spec's value)
      { key: 'scheme', type: 'choice', label: t('scheme'), value: L.defaults.scheme,
        options: [['plain', t('optPlain')], ['hash', t('optHash')], ['salted', t('optSalted')], ['slow', t('optSlow')]] },
      { key: 'length', type: 'range', label: t('length'), min: 4, max: 20, step: 1, value: L.defaults.length },
      { key: 'alphabet', type: 'choice', label: t('alphabet'), hint: t('alphabetHint'), value: L.defaults.alphabet,
        options: L.ALPHABETS.map(function (a) { return [a, t('alpha' + a)]; }) },
      { key: 'inBreachList', type: 'toggle', label: t('inBreachList'), value: L.defaults.inBreachList },
      { key: 'fastRate', type: 'choice', label: t('fastRate'), value: L.defaults.fastRate,
        options: L.FAST_RATES.map(function (r) { return [r, '10' + L.sup(Math.round(Math.log10(r)))]; }) },
      { key: 'slowRate', type: 'choice', label: t('slowRate'), value: L.defaults.slowRate,
        options: L.SLOW_RATES.map(function (r) { return [r, '10' + L.sup(Math.round(Math.log10(r)))]; }) }
    ],

    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),

    legend: [
      { shape: 'ps-stored', label: t('legendStored') },
      { shape: 'ps-salt', label: t('legendSalt') },
      { shape: 'ps-same', label: t('legendSame') },
      { shape: 'ps-bar', label: t('legendBar') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      track(c);
      var s = c.state;
      if (!ui || !c.stage.contains(ui.root)) { ui = build(c.stage); lastStored = null; }
      fillTable(s, String(c.params.password));
      fillRainbow(s);
      fillTime(s);
    },

    caption: function (c) {
      return focus === 'time' ? timeCaption(c.state) : tableCaption(c.state);
    }
  });

  // ---- Luka's password survives a reload (the language switch reloads the page; it is not in the URL) ----
  // Saved on leaving, restored once and only into the same address apart from ?lang=, so a later link to another
  // preset never gets an old password. Storage may be unavailable (private mode, file://): then the box starts fresh.
  var KEEP = 'simdeck.password-storage.text';
  function here() { var u = new URLSearchParams(window.location.search); u.delete('lang'); return window.location.pathname + '?' + u.toString(); }
  window.addEventListener('pagehide', function () {
    try { window.sessionStorage.setItem(KEEP, JSON.stringify({ at: here(), password: sim.params.password, focus: focus })); } catch (e) { /* no storage */ }
  });
  try {
    var kept = JSON.parse(window.sessionStorage.getItem(KEEP) || 'null');
    window.sessionStorage.removeItem(KEEP);
    if (kept && kept.at === here() && typeof kept.password === 'string' && kept.password !== sim.params.password) {
      keepFocus = kept.focus === 'time' ? 'time' : 'table';
      lastStored = null;
      sim.set({ password: kept.password });
    }
  } catch (e) { /* no storage */ }
})();
</script>
</body>
</html>
