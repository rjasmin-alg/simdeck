<!-- cmp-maturity-levels: each control area is rated on a scale from ad hoc to measured and improving; one average looks
     fine while one area stays at the bottom, and the weakest area is where incidents and findings come from; each
     level up costs more than the last, so a target per area beats raising everything.
     The stage: a radar of eight areas (now dashed, the target filled, the target's average as a dotted ring, the audit
     line at level 3) with the budget meter under it; a table of the eight areas, where the student rates the current
     level and sets a target with − and +, with each area's cost, audit finding and incidents; and four plans from the
     same current levels and budget (now, +1 everywhere, at least 3 everywhere, yours).
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var NS = 'http://www.w3.org/2000/svg';

  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function dec(x, d) { return new Intl.NumberFormat(LOCALE, { maximumFractionDigits: d }).format(x); }
  function pct(x) { return new Intl.NumberFormat(LOCALE, { style: 'percent', maximumFractionDigits: 1 }).format(x); }
  function wk(n) { return t.n('weeks', n, { n: dec(n, 0) }); }
  function area(i) { return t('area' + (i + 1)); }

  function svg(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    return el;
  }

  var sim = null;
  var refusal = null;                                 // the last refused move, until the params change
  var refocus = null;                                 // after a keyboard press, focus goes back to that button
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  function act(kind, i, e) {
    var s = sim.state;
    var m = L.move(s, kind, i);
    if (e.detail === 0) refocus = kind + i;
    if (m.ok) { refusal = null; sim.set(m.patch); return; }
    refusal = { why: m.why, i: i, need: m.need, left: m.left, at: JSON.stringify(sim.params) };
    sim.render();
  }
  function stepButton(kind, i, s, label, glyph) {
    var m = L.move(s, kind, i);
    return h('button', { type: 'button', class: 'ml-b', onmousedown: noFocus, 'aria-label': t(label, { w: area(i) }),
      'aria-disabled': String(!m.ok), dataset: { sel: kind + i },
      onclick: function (e) { act(kind, i, e); } }, glyph);
  }

  // ── the radar ──

  var R = 20;                                         // one level = 20 user units; level 5 at 100
  function pt(i, lv) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / L.AREAS;
    return [Math.cos(a) * lv * R, Math.sin(a) * lv * R];
  }
  function poly(levels) { return levels.map(function (lv, i) { return pt(i, lv).map(function (x) { return x.toFixed(2); }).join(','); }).join(' '); }

  function radar(s) {
    var g = svg('svg', { viewBox: '-128 -128 256 256', 'aria-hidden': 'true' });
    for (var lv = 1; lv <= L.MAX; lv++) {
      if (lv === L.LINE) continue;
      g.append(svg('polygon', { class: 'ml-grid', points: poly([lv, lv, lv, lv, lv, lv, lv, lv]), 'vector-effect': 'non-scaling-stroke' }));
    }
    for (var i = 0; i < L.AREAS; i++) {
      var e = pt(i, L.MAX);
      g.append(svg('line', { class: 'ml-grid', x1: 0, y1: 0, x2: e[0].toFixed(2), y2: e[1].toFixed(2), 'vector-effect': 'non-scaling-stroke' }));
    }
    g.append(svg('polygon', { class: 'ml-line', points: poly([3, 3, 3, 3, 3, 3, 3, 3]), 'vector-effect': 'non-scaling-stroke' }));
    g.append(svg('polygon', { class: 'ml-planp', points: poly(s.tgt), 'vector-effect': 'non-scaling-stroke' }));
    g.append(svg('circle', { class: 'ml-avg', r: (s.plan.avg * R).toFixed(2), cx: 0, cy: 0, 'vector-effect': 'non-scaling-stroke' }));
    g.append(svg('polygon', { class: 'ml-nowp', points: poly(s.cur), 'vector-effect': 'non-scaling-stroke' }));
    s.tgt.forEach(function (lv, i) {
      var p = pt(i, lv);
      g.append(svg('circle', { class: 'ml-pt', cx: p[0].toFixed(2), cy: p[1].toFixed(2), r: 4.5, 'vector-effect': 'non-scaling-stroke' }));
    });
    var w = pt(s.plan.weakest, s.plan.low);
    g.append(svg('circle', { class: 'ml-weak', cx: w[0].toFixed(2), cy: w[1].toFixed(2), r: 10, 'vector-effect': 'non-scaling-stroke' }));
    var labels = s.tgt.map(function (lv, i) {
      var p = pt(i, L.MAX + 0.62);
      return h('span', { class: 'ml-vx ml-num', translate: 'no', dataset: { weak: String(i === s.plan.weakest) },
        style: { left: (50 + p[0] / 256 * 100) + '%', top: (50 + p[1] / 256 * 100) + '%' } }, String(i + 1));
    });
    var scale = [];
    for (var k = L.MIN; k <= L.MAX; k++) {
      if (k > L.MIN) scale.push(' · ');
      scale.push(h('span', null, b(k), ' ', t('lv' + k)));
    }
    var over = s.over;
    return h('div', { class: 'ml-left' },
      h('p', { class: 'ml-head' }, t('headRadar')),
      h('div', { class: 'ml-rbox' },
        h('div', { class: 'ml-radar', role: 'img',
          'aria-label': t('radarLabel', { a: dec(s.plan.avg, 3), w: area(s.plan.weakest), l: s.plan.low }) }, g, labels)),
      h('p', { class: 'ml-scale' }, scale),
      h('div', { class: 'ml-budget ml-num' },
        h('span', null, t.parts('budgetUse', { k: b(wk(s.cost)), b: b(wk(s.budget)) }), ' · ',
          over ? h('span', { class: 'ml-over' }, t('budgetOver', { x: wk(-s.left) })) : h('span', null, t('budgetLeft', { x: wk(s.left) }))),
        h('span', { class: 'ml-btrack', 'aria-hidden': 'true' },
          h('span', { class: 'ml-bfill', dataset: { over: String(over) }, style: { width: Math.min(100, s.cost / s.budget * 100) + '%' } }))));
  }

  // ── the table ──

  function finding(f) {
    return h('span', { class: 'ml-f', dataset: { f: f || 'none' } }, t(f === 'major' ? 'fMajor' : f === 'minor' ? 'fMinor' : 'fNone'));
  }

  function table(s) {
    var head = h('div', { class: 'ml-tr' },
      h('span', { class: 'ml-th' }), h('span', { class: 'ml-th' }, t('colArea')),
      h('span', { class: 'ml-th ml-c' }, t('colNow')), h('span', { class: 'ml-th ml-c' }, t('colPlan')),
      h('span', { class: 'ml-th' }, t('colWeeks')), h('span', { class: 'ml-th' }, t('colAudit')), h('span', { class: 'ml-th' }, t('colInc')));
    var rows = s.rows.map(function (r) {
      return h('div', { class: 'ml-tr', dataset: { weak: String(r.i === s.plan.weakest) } },
        h('span', { class: 'ml-vx ml-num', translate: 'no' }, String(r.i + 1)),
        h('span', { class: 'ml-name' }, area(r.i)),
        h('span', { class: 'ml-step' },
          stepButton('cDown', r.i, s, 'bCurDown', '−'), h('span', { class: 'ml-lv ml-num', translate: 'no' }, String(r.c)), stepButton('cUp', r.i, s, 'bCurUp', '+')),
        h('span', { class: 'ml-step' },
          stepButton('tDown', r.i, s, 'bTgtDown', '−'),
          h('span', { class: 'ml-lv ml-num', translate: 'no', dataset: { up: String(r.t > r.c) } }, String(r.t)),
          stepButton('tUp', r.i, s, 'bTgtUp', '+')),
        h('span', { class: 'ml-wk ml-num', translate: 'no' }, r.cost ? dec(r.cost, 0) : '–'),
        finding(r.f),
        h('span', { class: 'ml-inc' }, h('b', { class: 'ml-num', translate: 'no' }, dec(r.inc, 1)),
          h('span', { class: 'ml-itrack', 'aria-hidden': 'true' }, h('span', { class: 'ml-ifill', style: { width: (r.inc / 8 * 100) + '%' } }))));
    });
    return h('div', { class: 'ml-right' },
      h('p', { class: 'ml-head' }, t('headTable')),
      h('div', { class: 'ml-tab' }, head, rows));
  }

  // ── the comparison ──

  function compare(s) {
    var head = h('div', { class: 'ml-cr' },
      h('span', { class: 'ml-th' }, t('cmpPlan')), h('span', { class: 'ml-th' }, t('cmpCost')), h('span', { class: 'ml-th' }, t('cmpAvg')),
      h('span', { class: 'ml-th' }, t('cmpWeak')), h('span', { class: 'ml-th' }, t('cmpAudit')), h('span', { class: 'ml-th' }, t('cmpInc')));
    var rows = s.compare.map(function (x) {
      return h('div', { class: 'ml-cr', dataset: { yours: String(x.id === 'yours') } },
        h('span', null, t('plan_' + x.id)),
        h('span', { class: 'ml-num' }, b(wk(x.cost)), ' ',
          x.fits ? h('span', { class: 'ml-ok' }, t('fits')) : h('span', { class: 'ml-over' }, t('overBy', { x: wk(x.cost - s.budget) }))),
        h('span', { class: 'ml-num' }, b(dec(x.avg, 3))),
        h('span', null, b(x.low), ' · ', area(x.weakest)),
        h('span', { class: 'ml-fs ml-num', translate: 'no' },
          h('span', { dataset: { f: 'major' } }, '✕ ', b(x.major)), '  ', h('span', { dataset: { f: 'minor' } }, '! ', b(x.minor))),
        h('span', { class: 'ml-num' }, b(dec(x.inc, 1)), ' ', t('shareOf', { s: pct(x.share) })));
    });
    return h('div', { class: 'ml-cmpw' },
      h('p', { class: 'ml-head' }, t('headCmp', { b: wk(s.budget) })),
      h('div', { class: 'ml-cmp' }, head, rows));
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset.sel;
    c.stage.replaceChildren(h('div', { class: 'ml' }, radar(s), table(s), compare(s), h('p', { class: 'ml-foot' }, t('foot'))));
    var sel = refocus || had;
    if (sel) {
      var el = c.stage.querySelector('[data-sel="' + sel + '"]');
      if (el) el.focus();
    }
    refocus = null;
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s), n = s.now, p = s.plan;
    var vars = k.key !== 'capPlan'
      ? { a: b(dec(n.avg, 3)), w: b(area(n.weakest)), l: b(n.low), M: b(n.major), m: b(n.minor), s: b(pct(n.share)) }
      : { k: b(wk(s.cost)), b: b(wk(s.budget)), a0: b(dec(n.avg, 3)), a1: b(dec(p.avg, 3)), l0: b(n.low), l1: b(p.low),
          w: b(area(p.weakest)), M0: b(n.major), M1: b(p.major), m0: b(n.minor), m1: b(p.minor),
          i0: b(dec(n.inc, 1)), i1: b(dec(p.inc, 1)) };
    var out = t.parts(k.key, vars);
    if (refusal && refusal.at === JSON.stringify(c.params)) {
      var rk = { top: 'refTop', bottom: 'refBottom', floor: 'refFloor', budget: (refusal.left || 0) < 0 ? 'refOver' : 'refBudget' }[refusal.why];
      if (rk) {
        out.push(' ');
        out = out.concat(t.parts(rk, { w: b(area(refusal.i)), k: b(wk(refusal.need || 0)), x: b(wk(Math.max(0, refusal.left || 0))) }));
      }
    }
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, { x: b(wk(-s.left)), a: b(dec(p.avg, 3)), w: b(area(p.weakest)), l: b(p.low) }));
    });
    return out;
  }

  var labels = { 'average-fine': 'pAverageFine', 'plus-one': 'pPlusOne', floor: 'pFloor', 'per-area': 'pPerArea',
    showcase: 'pShowcase', 'showcase-floor': 'pShowcaseFloor' };
  var hidden = function () { return false; };
  var levelParams = [];
  ['c', 't'].forEach(function (pre) {
    for (var i = 1; i <= L.AREAS; i++) {
      levelParams.push({ key: pre + i, type: 'range', label: (pre === 'c' ? t('colNow') : t('colPlan')) + ' ' + i,
        min: L.MIN, max: L.MAX, step: 1, visible: hidden });
    }
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'budget', type: 'choice', label: t('budget'),
        options: L.BUDGETS.map(function (x) { return [x, t('budgetOpt', { n: dec(x, 0) })]; }) },
      { type: 'button', label: t('clear'), run: function (c) { refusal = null; c.set(L.clearPlan(c.state)); } }
    ].concat(levelParams),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'ml-now', label: t('legNow') },
      { shape: 'ml-plan', label: t('legPlan') },
      { shape: 'ml-avg', label: t('legAvg') },
      { shape: 'ml-line', label: t('legLine') },
      { shape: 'ml-weak', label: t('legWeak') },
      { shape: 'ml-major', label: t('legMajor') },
      { shape: 'ml-minor', label: t('legMinor') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
