<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var CLIENT = 'democli1', SERVER = 'www1.lab.example', PORT = '443';   // UL ch21
  var COLOUR = { C: '1', S: '2' };

  /** Data (message names, host names, cipher suites, error texts, numbers) is not language: the word check skips it. */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'th-mono' : cls || null }, text); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  /** Round trips with a half as ½ (1½ RTT). */
  function rttText(r) {
    var whole = Math.floor(r), half = r - whole >= 0.5;
    return (whole || !half ? String(whole) : '') + (half ? '½' : '');
  }
  function ms(v) { return String(Math.round(v)); }
  function keyIcon() { return h('span', { class: 'th-keyicon', 'aria-hidden': 'true' }); }

  // ── chart ──
  function keyChip(col, side, n) {
    var at = col.keysAt[side];
    if (at == null || at > n) return h('span', { class: 'th-nokey' }, t('keysNone'));
    return h('span', { class: 'th-key' + (at === n ? ' sd-changed' : '') }, keyIcon(), t('keysYes'));
  }
  function lanes(col, n) {
    return [
      { id: 'C', mark: null, c: COLOUR.C, shape: 'square', name: t('client'), body: keyChip(col, 'C', n) },
      { id: 'S', mark: null, c: COLOUR.S, name: t('server'), body: keyChip(col, 'S', n) }
    ];
  }
  var SHORT = { sni: 'sName', versions: 'sVersions', suites: 'sSuites', version: 'sVersion', suite: 'sSuite', cert: 'sCert',
    shareC: 'sShare', shareS: 'sShare' };
  /** What the eavesdropper reads of one chart row (its messages). */
  function seenOf(msgs) {
    if (msgs[0].enc) return t('sEnc');
    if (msgs[0].tcp) return data(msgs[0].name, '');
    if (msgs[0].alert) return data(msgs[0].alert + ' (' + L.ALERT_CODE[msgs[0].alert] + ')', '');
    var words = [];
    msgs.forEach(function (x) {
      x.reads.forEach(function (it) { var w = t(SHORT[it]); if (words.indexOf(w) < 0) words.push(w); });
      if (x.name === 'ChangeCipherSpec') words.push(t('sCcs'));
    });
    return words.join(', ');
  }
  /** One chart row per (flight, row) group of messages (sim.js rowsOf). */
  function rowsFor(col, n, rttMs) {
    var groups = [];
    col.msgs.forEach(function (x) {
      var g = groups[groups.length - 1];
      if (g && g.flight === x.flight && g.row === x.row) g.msgs.push(x);
      else groups.push({ flight: x.flight, row: x.row, msgs: [x] });
    });
    var timed = {};
    var rows = groups.map(function (g) {
      var first = g.msgs[0];
      var label = first.app ? t('appData') : g.msgs.map(function (x) { return x.name; }).join(', ');
      var time = timed[g.flight] ? null : ms(L.msOf(first.half, rttMs)) + ' ms';
      timed[g.flight] = true;
      var long = (typeof label === 'string' ? label : '').length > 18;
      return { from: first.from, to: first.to, label: first.app ? h('span', null, label) : label, c: COLOUR[first.from],
        lock: first.enc, muted: first.tcp, place: long ? 'mid' : null, time: time, changed: first.step === n,
        seen: seenOf(g.msgs) };
    });
    if (col.failed === 'no_protocols_local' && n >= 2) {
      rows.push({ kind: 'note', lane: 'C', text: t('noteLocal'), k: 'fill', time: ms(L.msOf(2, rttMs)) + ' ms',
        changed: n === 2, seen: t('sNothing') });
    }
    return rows;
  }
  function chart(c, col, eve) {
    return Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(col, c.n),
      rows: rowsFor(col, c.n, c.params.rttMs),
      timeWidth: '4.4rem',
      eve: eve ? { title: t('eveTitle'), width: '10.5rem' } : null,
      empty: t('chartEmpty'),
      earlier: function (k) { return t.n('earlier', k); }
    });
  }

  // ── counter and what the eavesdropper has read ──
  function readList(c, col) {
    var r = col.read, items = [];
    var newAt = {};
    col.msgs.forEach(function (x) { if (x.step === c.n) x.reads.forEach(function (it) { newAt[it] = true; }); });
    function item(key, it, attrs) {
      var ds = Object.assign({}, attrs || {}, newAt[it] ? { new: '' } : {});
      items.push(h('span', { class: 'th-item', dataset: ds }, t(key)));
    }
    if (r.indexOf('sni') >= 0) item('oName', 'sni');
    if (r.indexOf('versions') >= 0) item('oOffered', 'versions');
    if (r.indexOf('version') >= 0) item('oChosen', 'version');
    var shares = (r.indexOf('shareC') >= 0) + (r.indexOf('shareS') >= 0);
    if (shares) item(shares === 2 ? 'oShares' : 'oShare', newAt.shareC ? 'shareC' : 'shareS');
    if (r.indexOf('cert') >= 0) item('oCert', 'cert', { cert: '' });
    else if (col.msgs.some(function (x) { return x.cert; })) {
      var fresh = col.msgs.some(function (x) { return x.cert && x.step === c.n; });
      items.push(h('span', { class: 'th-item', dataset: Object.assign({ hidden: '', cert: '' }, fresh ? { new: '' } : {}) }, t('oCertHidden')));
    }
    if (r.indexOf('alert') >= 0) item('oAlert', 'alert');
    return items.length ? h('span', { class: 'th-read' }, items) : h('span', { class: 'th-none' }, t('obsNothing'));
  }
  function counter(c, col, prev) {
    var rtt = c.params.rttMs, rows = [];
    rows.push(h('dt', null, t('ctrElapsed')), h('dd', null, data(t('ctrElapsedVal', { rtt: rttText(col.rtt), ms: ms(col.rtt * rtt) }))));
    var first;
    if (col.appDataAt != null) {
      var fresh = !prev || prev.appDataAt == null;
      first = [h('span', { class: 'th-first' + (fresh && c.n > 0 ? ' sd-changed' : '') },
        data(t('ctrFirstVal', { ms: ms(col.appDataAt * rtt), k: rttText(col.appDataAt - 1), n: rttText(col.appDataAt) }), '')),
        col.waiting ? h('span', { class: 'th-wait' }, t('ctrWaiting')) : null];
    } else first = h('span', { class: 'th-none' }, t('ctrFirstNot'));
    rows.push(h('dt', null, t('ctrFirst')), h('dd', null, first));
    if (c.params.suites && col.suite) rows.push(h('dt', null, t('ctrSuite')), h('dd', null, data(col.suite)));
    if (c.params.attackerView) rows.push(h('dt', null, t('obsTitle')), h('dd', null, readList(c, col)));
    return h('section', { class: 'th-box' }, h('dl', { class: 'th-ctr' }, rows));
  }

  // ── fail panel ──
  function failPanel(c, s) {
    var forbids = c.params.clientOffers === 'old-forbidden';
    var v = s.failure === 'no_protocols_local' ? 'local' : s.failure === 'protocol_version' ? 'remote' : 'pending';
    var changed = !!c.prev && c.prev.failure !== s.failure;
    var verdict = v === 'pending' ? h('span', null, t('failPending'))
      : h('span', null, t(v === 'local' ? 'failLocal' : 'failRemote'),
        h('span', { class: 'th-err', translate: 'no' }, v === 'local' ? 'no protocols available' : 'alert protocol_version (70)'));
    return h('section', { class: 'th-box th-fail' },
      h('h2', null, t('failTitle')),
      h('dl', { class: 'th-ctr' },
        h('dt', null, t('failWants')), h('dd', null, data('TLS ' + s.wanted.join(', '))),
        h('dt', null, t('failPolicy')), h('dd', null, t(forbids ? 'polForbids' : 'polAllows')),
        h('dt', null, t('failServer')), h('dd', null, data('TLS ' + L.SERVER_ACCEPTS.join(', ')))),
      h('p', { class: 'th-verdict' + (changed ? ' sd-changed' : ''), dataset: { v: v } },
        h('span', { class: 'th-vmark', 'aria-hidden': 'true', translate: 'no' }, v === 'local' ? t('markC') : v === 'remote' ? t('markS') : '…'),
        verdict));
  }

  // ── render ──
  function render(c) {
    var s = c.state, eve = !!c.params.attackerView;
    var hosts = h('p', { class: 'th-hosts', translate: 'no' }, CLIENT + ' → ' + SERVER + ':' + PORT + ' · RTT ' + c.params.rttMs + ' ms');
    var charts = [], cols;
    if (s.mode === 'compare') {
      cols = [['v12', 'TLS 1.2'], ['v13', 'TLS 1.3']].map(function (x) {
        var col = s[x[0]], ch = chart(c, col, eve);
        charts.push(ch);
        return h('div', { class: 'th-col' }, h('h2', { class: 'th-coltitle', translate: 'no' }, x[1]), ch,
          counter(c, col, c.prev ? c.prev[x[0]] : null));
      });
      c.stage.replaceChildren(h('div', { class: 'th' }, hosts, h('div', { class: 'th-cols' }, cols)));
    } else {
      var ch = chart(c, s.att, eve);
      charts.push(ch);
      c.stage.replaceChildren(h('div', { class: 'th' }, hosts, h('div', { class: 'th-cols', dataset: { fail: '' } },
        h('div', { class: 'th-col' }, h('h2', { class: 'th-coltitle' }, t('colOld')), ch, counter(c, s.att, c.prev ? c.prev.att : null)),
        failPanel(c, s))));
    }
    charts.forEach(function (x) { x.fit(); });
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, rtt = c.params.rttMs;
    if (s.mode === 'compare') {
      switch (c.n) {
        case 0: return rich('cap0');
        case 1: return rich('cap1', { ms: data(ms(rtt), '') });
        case 2: return rich('cap2');
        case 3: return c.params.suites ? rich('cap3Suites', { s12: data(L.SUITES['1.2']), s13: data(L.SUITES['1.3']) }) : rich('cap3');
        case 4: return rich('cap4', { ms: data(ms(s.v13.appDataAt * rtt), '') });
        case 5: return rich('cap5').concat(' ', rich('capCert'));
        default: return rich('cap6', { ms12: data(ms(s.v12.appDataAt * rtt), ''), ms13: data(ms(s.v13.appDataAt * rtt), ''),
          d: data(ms((s.v12.appDataAt - s.v13.appDataAt) * rtt), '') });
      }
    }
    var forbids = c.params.clientOffers === 'old-forbidden';
    if (c.n === 0) return rich(forbids ? 'capF0Local' : 'capF0Alert');
    if (c.n === 1) return rich('capFTcp', { ms: data(ms(rtt), '') });
    if (forbids) return rich('capLocal', { err: data('no protocols available') });
    if (c.n === 2) return rich('capOldCh');
    return rich('capAlert', { alert: data('protocol_version (70)') });
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'clientOffers', type: 'choice', label: t('clientOffers'), hint: t('clientOffersHint'), resets: true,
        options: [['modern', t('offModern')], ['old-allowed', t('offOldOk')], ['old-forbidden', t('offOldNo')]] },
      { key: 'rttMs', type: 'range', label: t('rttMs'), min: 10, max: 300, step: 10,
        format: function (v) { return t('rttFmt', { v: v }); } },
      { key: 'attackerView', type: 'toggle', label: t('attackerView'), hint: t('attackerViewHint') },
      { key: 'suites', type: 'toggle', label: t('suites'), hint: t('suitesHint'),
        disabled: function (p) { return p.clientOffers === 'modern' ? false : t('suitesOff'); } }
    ],

    presets: [
      { id: 'side-by-side', label: t('presetSide'), params: { clientOffers: 'modern', suites: false }, hint: t('presetSideHint') },
      { id: 'book-versions', label: t('presetBook'), params: { clientOffers: 'modern', suites: true }, hint: t('presetBookHint') },
      { id: 'old-version-local', label: t('presetLocal'), params: { clientOffers: 'old-forbidden' }, hint: t('presetLocalHint') },
      { id: 'old-version-alert', label: t('presetAlert'), params: { clientOffers: 'old-allowed' }, hint: t('presetAlertHint') }
    ],

    legend: [
      { shape: 'line', label: t('legPlain') },
      { shape: 'th-lock', label: t('legLock') },
      { shape: 'th-key', label: t('legKey') },
      { shape: 'th-tcp', label: t('legTcp') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
