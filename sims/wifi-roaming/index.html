<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var COLOUR = { A: '1', B: '2', C: '3' };
  var TOP = -50, BOTTOM = -95; // the chart's dBm range

  // ── formatting: one decimal, the language's decimal mark, a real minus ──
  function num(v, digits) {
    var s = (Math.round(v * 10) / 10).toFixed(digits == null ? 1 : digits);
    if (/^-0(\.0)?$/.test(s)) s = s.slice(1);
    return s.replace('-', '−').replace('.', t('decimal'));
  }
  function dbm(v) { return num(v); }
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function bold(text) { return h('b', { translate: 'no' }, String(text)); }
  function metres(x) { return h('b', { translate: 'no' }, t('metres', { x: x })); }
  function svg(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    return el;
  }
  function pctX(x) { return (x / L.LENGTH * 100) + '%'; }
  function pctY(v) { return ((TOP - v) / (TOP - BOTTOM) * 100) + '%'; }
  function apBadge(id, cls) { return h('span', { class: (cls || 'wr-sm') + ' sd-fill', dataset: { c: COLOUR[id] }, translate: 'no' }, id); }

  // ── the walk as groups of metres on one AP: the association during (x, x+1) is path[x] ──
  function groups(path) {
    var out = [], g = null;
    for (var x = 0; x < path.length - 1; x++) {
      if (!g || g.ap !== path[x]) { g = { ap: path[x], from: x, to: x + 1 }; out.push(g); } else g.to = x + 1;
    }
    return out;
  }
  function sample(ap, from, to, lift) {
    var pts = [];
    for (var x = from; x <= to + 1e-9; x += 0.25) pts.push([x, -(L.rssi(ap, x) + (lift || 0))]);
    if (pts.length && pts[pts.length - 1][0] < to) pts.push([to, -(L.rssi(ap, to) + (lift || 0))]);
    return pts;
  }
  function pts(list) { return list.map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(3); }).join(' '); }

  // ── corridor ──
  function personIcon() {
    var s = svg('svg', { viewBox: '0 0 20 28', class: 'wr-fig', 'aria-hidden': 'true' });
    s.append(svg('circle', { cx: 10, cy: 4.5, r: 4 }));
    s.append(svg('path', { d: 'M10 9 L10 18 M3 13 L10 11 L17 13 M10 18 L5 26 M10 18 L15 26' }));
    return s;
  }

  function corridorView(s, changedAt) {
    var APY = 46, WALKY = 70, DSY = 9; // vertical places in % of the corridor
    var g = svg('svg', { class: 'wr-svg', 'aria-hidden': 'true' });
    g.append(svg('line', { x1: '0%', y1: WALKY + '%', x2: '100%', y2: WALKY + '%', class: 'wr-walk' }));
    g.append(svg('line', { x1: '0%', y1: DSY + '%', x2: '100%', y2: DSY + '%', class: 'wr-ds' }));
    L.APS.forEach(function (a) {
      g.append(svg('line', { x1: pctX(a.x), y1: DSY + '%', x2: pctX(a.x), y2: APY + '%', class: 'wr-stub' }));
    });
    L.APS.forEach(function (a) {
      if (a.id === s.current) return;
      g.append(svg('line', { x1: pctX(s.x), y1: WALKY + '%', x2: pctX(a.x), y2: APY + '%', class: 'wr-other' }));
    });
    var cur = L.APS[L.IDS.indexOf(s.current)];
    g.append(svg('line', { x1: pctX(s.x), y1: WALKY + '%', x2: pctX(cur.x), y2: APY + '%', class: 'wr-link' }));
    var kids = [h('div', { class: 'wr-hall' }), g, h('span', { class: 'wr-dslab', style: { top: '0', left: '50%' } }, t('ds'))];
    L.APS.forEach(function (a, i) {
      var isCur = a.id === s.current;
      kids.push(h('div', { class: 'wr-at', style: { left: pctX(a.x), top: APY + '%' } },
        h('span', { class: 'wr-apdot sd-fill', dataset: { c: COLOUR[a.id] }, translate: 'no' }, a.id),
        h('div', { class: 'wr-aplab ' + (i === 2 ? 'wr-lab-l' : 'wr-lab-r') + (isCur ? ' wr-cur' : '') + (changedAt && isCur ? ' sd-changed' : '') },
          h('b', { translate: 'no' }, 'AP-' + a.id),
          h('span', null, data(dbm(s.rssi[a.id])), ' ', t('dbm')))));
    });
    kids.push(h('div', { class: 'wr-at', style: { left: pctX(s.x), top: WALKY + '%' } },
      h('div', { class: 'wr-who', 'aria-label': t('cardTitle', { x: t('metres', { x: s.x }) }) },
        personIcon(), h('span', { class: 'wr-whoname' }, t('clientMark')))));
    return h('section', { class: 'wr-corrcol' },
      h('div', { class: 'wr-h' }, h('small', null, t('corridorTitle'))),
      h('div', { class: 'wr-corr' }, h('div', { class: 'wr-plot' }, kids)));
  }

  // ── chart ──
  function chartView(s, p) {
    var x0 = s.x;
    var g = svg('svg', { class: 'wr-svg', viewBox: '0 ' + (-TOP) + ' ' + L.LENGTH + ' ' + (TOP - BOTTOM), preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var over = [];
    // grid
    [-60, -70, -80, -90].forEach(function (v) { g.append(svg('line', { x1: 0, x2: L.LENGTH, y1: -v, y2: -v, class: 'wr-grid' })); });
    [10, 20, 30, 40, 50, 60].forEach(function (x) { g.append(svg('line', { x1: x, x2: x, y1: -TOP, y2: -BOTTOM, class: 'wr-grid' })); });
    // the hysteresis band and the association path, walked part solid and the rest ahead faded
    var gs = groups(s.path);
    function part(from, to, ahead) {
      if (to - from < 1e-9) return;
      gs.forEach(function (gr) {
        var a = Math.max(gr.from, from), b = Math.min(gr.to, to);
        if (b - a < 1e-9) return;
        var low = sample(gr.ap, a, b, 0), high = sample(gr.ap, a, b, s.delta);
        var layer = svg('g', ahead ? { class: 'wr-ahead' } : {});
        if (s.delta > 0) {
          layer.append(svg('polygon', { points: pts(high.concat(low.slice().reverse())), class: 'wr-band' }));
          for (var x = Math.ceil(a); x + 1 <= b + 1e-9; x += 1) {
            layer.append(svg('line', { x1: x, y1: -L.rssi(gr.ap, x), x2: x + 1, y2: -(L.rssi(gr.ap, x + 1) + s.delta), class: 'wr-hatch' }));
          }
        }
        layer.append(svg('polyline', { points: pts(low), class: 'wr-path', 'data-c': COLOUR[gr.ap] }));
        g.append(layer);
      });
    }
    // thin curves of every AP first
    L.IDS.forEach(function (id) {
      g.append(svg('polyline', { points: pts(sample(id, 0, L.LENGTH, 0)), class: 'wr-curve', 'data-ap': id, 'data-c': COLOUR[id] }));
    });
    part(0, x0, false);
    part(x0, L.LENGTH, true);
    // the jumps at roams
    s.allRoams.forEach(function (r) {
      g.append(svg('line', { x1: r.x, x2: r.x, y1: -r.rssiFrom, y2: -r.rssiTo, class: 'wr-jump' + (r.x > x0 ? ' wr-ahead' : '') }));
    });
    // levels: the client's trigger, the AP's BTM level (when on), link lost
    g.append(svg('line', { x1: 0, x2: L.LENGTH, y1: -s.trigger, y2: -s.trigger, class: 'wr-trig' }));
    over.push(h('span', { class: 'wr-linelab wr-linelab-r', style: { top: pctY(s.trigger) } }, t('lineTrigger', { v: num(s.trigger, 0) })));
    if (p.btm) {
      g.append(svg('line', { x1: 0, x2: L.LENGTH, y1: -L.BTM_LEVEL, y2: -L.BTM_LEVEL, class: 'wr-level' }));
      over.push(h('span', { class: 'wr-linelab wr-linelab-l', style: { top: pctY(L.BTM_LEVEL) } }, t('lineBtm', { v: num(L.BTM_LEVEL, 0) })));
    }
    g.append(svg('line', { x1: 0, x2: L.LENGTH, y1: -L.LOST_LEVEL, y2: -L.LOST_LEVEL, class: 'wr-level' }));
    over.push(h('span', { class: 'wr-linelab wr-linelab-l', style: { top: pctY(L.LOST_LEVEL) } }, t('lineLost', { v: num(L.LOST_LEVEL, 0) })));
    // cursor at the client
    g.append(svg('line', { x1: x0, x2: x0, y1: -TOP, y2: -BOTTOM, class: 'wr-cursor' }));
    // axes
    [-50, -60, -70, -80, -90].forEach(function (v) { over.push(h('span', { class: 'wr-ytick', translate: 'no', style: { top: pctY(v) } }, num(v, 0))); });
    [0, 10, 20, 30, 40, 50, 60].forEach(function (x) {
      over.push(h('span', { class: 'wr-xtick' + (x % 20 ? ' wr-thin' : ''), translate: 'no', style: { left: pctX(x), top: '100%' } }, t('metres', { x: x })));
    });
    // curve letters at each AP's peak
    L.APS.forEach(function (a, i) {
      over.push(h('div', { class: 'wr-at', style: { left: pctX(a.x), top: pctY(L.rssi(a.id, a.x)) } },
        h('span', { class: 'wr-tag sd-fill' + (i === 0 ? ' wr-tag-l' : i === 2 ? ' wr-tag-r' : ''), dataset: { c: COLOUR[a.id] }, translate: 'no' }, a.id)));
    });
    // events: BTM requests (✉) and roams (◆; ✕ for a lost link)
    s.allRequests.forEach(function (q) {
      if (q.accepted) return; // an accepted request is drawn with its roam
      over.push(h('div', { class: 'wr-at', style: { left: pctX(q.x), top: pctY(q.rssiFrom) } },
        h('span', { class: 'wr-mark wr-below wr-ignored' + (q.x > x0 ? ' wr-ahead' : '') + (q.x === x0 ? ' sd-changed' : '') },
          '✉', h('small', { translate: 'no' }, '✕ ' + q.from + '→' + q.to))));
    });
    s.allRoams.forEach(function (r) {
      var sym = r.reason === 'lost' ? '✕' : r.reason === 'btm' ? '✉◆' : '◆';
      over.push(h('div', { class: 'wr-at', style: { left: pctX(r.x), top: pctY(r.rssiTo) } },
        h('span', { class: 'wr-mark' + (r.reason === 'lost' ? ' wr-lost' : '') + (r.x > x0 ? ' wr-ahead' : '') + (r.x === x0 ? ' sd-changed' : '') },
          sym, h('small', { translate: 'no' }, r.from + '→' + r.to))));
    });
    // the client's dots on each curve
    L.IDS.forEach(function (id) {
      over.push(h('div', { class: 'wr-at', style: { left: pctX(x0), top: pctY(s.rssi[id]) } },
        h('span', { class: 'wr-dot sd-fill' + (id === s.current ? ' wr-cur' : ''), dataset: { c: COLOUR[id] } })));
    });
    return h('section', { class: 'wr-chartcol', style: { display: 'contents' } },
      h('div', { class: 'wr-h' }, h('span', null, t('chartTitle')), h('small', null, t('chartSub'))),
      h('div', { class: 'wr-chart' }, h('div', { class: 'wr-plot' }, g, over)));
  }

  // ── the client's card and the log ──
  var BARS = { good: 3, fair: 2, poor: 1 };
  function cardView(s, p, changed) {
    var rows = L.IDS.map(function (id) {
      var isCur = id === s.current;
      var diff = s.rssi[id] - s.rssi[s.current];
      return h('tr', { class: (isCur ? 'wr-cur' : '') + (isCur && changed ? ' sd-changed' : '') },
        h('td', null, apBadge(id), data('AP-' + id)),
        h('td', { class: 'wr-num' }, data(dbm(s.rssi[id])), ' ', t('dbm')),
        h('td', { class: isCur ? null : 'wr-num' }, isCur ? t('associated') : h('span', { translate: 'no' }, (diff > 0 ? '+' : '') + num(diff) + ' dB')));
    });
    var bars = h('span', { class: 'wr-bars', 'aria-hidden': 'true' }, [1, 2, 3].map(function (i) {
      return h('span', { class: i <= BARS[s.quality] ? 'on' : null, style: { height: (35 + 32 * (i - 1)) + '%' } });
    }));
    return h('section', { class: 'wr-card' },
      h('h2', null, t('cardTitle', { x: t('metres', { x: s.x }) })),
      h('table', { class: 'wr-table' },
        h('thead', null, h('tr', null, h('th', null, t('colAp')), h('th', null, t('colRssi')), h('th', null, t('colDiff')))),
        h('tbody', null, rows)),
      h('div', { class: 'wr-q wr-q-' + s.quality }, t('qualityLabel'), bars, h('b', null, t('q_' + s.quality))),
      h('div', { class: 'wr-set' }, t.parts('settings', { trig: data(num(s.trigger, 0)), d: data(num(s.delta, 0)) }),
        p.btm ? h('div', null, t('settingsBtm', { how: p.support === 'cooperative' ? t('howCoop') : t('howLegacy') })) : null));
  }

  function logView(s) {
    var events = [];
    s.requests.forEach(function (q) { if (!q.accepted) events.push({ x: q.x, kind: 'ignored', from: q.from, to: q.to, rf: q.rssiFrom, rt: q.rssiTo }); });
    s.roams.forEach(function (r) { events.push({ x: r.x, kind: r.reason, from: r.from, to: r.to, rf: r.rssiFrom, rt: r.rssiTo }); });
    events.sort(function (a, b) { return a.x - b.x; });
    var lastRoam = s.roams.length ? s.roams[s.roams.length - 1] : null;
    var items = events.map(function (e) {
      var sub = null;
      if (lastRoam && e.x === lastRoam.x && e.kind === lastRoam.reason) sub = h('small', null, e.kind === 'lost' ? t('logRejoin') : t.parts('logReassoc', { from: data('AP-' + e.from) }));
      return h('li', { class: e.x === s.x ? 'sd-changed' : null },
        metres(e.x), ' · ', bold(e.from + ' → ' + e.to), ' · ', t('log_' + e.kind), ' ',
        h('span', { translate: 'no', class: 'sd-mono wr-pair' }, '(' + dbm(e.rf) + ' → ' + dbm(e.rt) + ')'), sub);
    });
    var ahead = s.allRoams.filter(function (r) { return r.x > s.x; }).length +
      s.allRequests.filter(function (q) { return q.x > s.x && !q.accepted; }).length;
    return h('section', { class: 'wr-log' },
      h('div', { class: 'wr-h' }, h('span', null, t('logTitle'))),
      items.length ? h('ol', null, items) : h('p', { class: 'wr-empty' }, t('logEmpty')),
      ahead ? h('p', { class: 'wr-more' }, t.n('logAhead', ahead)) : null);
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'position', type: 'range', label: t('position'), min: 0, max: L.LENGTH, step: 1, unit: 'm' },
      { key: 'client', type: 'choice', label: t('client'),
        options: [['default', t('clientDefault')], ['sticky', t('clientSticky')], ['custom', t('clientCustom')]] },
      { key: 'trigger', type: 'range', label: t('trigger'), min: -90, max: -60, step: 1,
        format: function (v) { return num(v, 0) + ' dBm'; }, visible: function (p) { return p.client === 'custom'; } },
      { key: 'delta', type: 'range', label: t('delta'), min: 0, max: 20, step: 1,
        format: function (v) { return v + ' dB'; }, visible: function (p) { return p.client === 'custom'; } },
      { key: 'btm', type: 'toggle', label: t('btm') },
      { key: 'support', type: 'choice', label: t('support'),
        options: [['legacy', t('supportLegacy')], ['cooperative', t('supportCoop')]], visible: function (p) { return p.btm; } }
    ],

    presets: L.presets.map(function (pr) {
      return { id: pr.id, label: t('preset_' + pr.id), hint: t('presetHint_' + pr.id), params: pr.params };
    }),

    legend: [
      { c: 1, shape: 'round', label: t('legendAp') },
      { shape: 'thick', label: t('legendLink') },
      { shape: 'thin', label: t('legendOther') },
      { shape: 'trig', label: t('legendTrigger') },
      { shape: 'band', label: t('legendBand') },
      { shape: 'sym-roam', label: t('legendRoam') },
      { shape: 'sym-btm', label: t('legendBtm') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state, p = c.params;
      var changed = s.roams.some(function (r) { return r.x === s.x; });
      c.stage.replaceChildren(h('div', { class: 'wr' },
        h('div', { class: 'wr-left' }, corridorView(s, changed), chartView(s, p)),
        h('div', { class: 'wr-right' }, cardView(s, p, changed), logView(s))));
    },

    caption: function (c) {
      var s = c.state;
      var x = metres(s.x);
      var ap = function (id) { return h('b', { translate: 'no', class: 'wr-nb' }, 'AP-' + id); };
      var dB = function (v) { return bold(dbm(v)); };
      var out;
      var roam = s.roams.filter(function (r) { return r.x === s.x; })[0];
      var asked = s.requests.filter(function (q) { return q.x === s.x && !q.accepted; })[0];
      var lk = s.look;
      if (roam && roam.reason === 'client') {
        out = t.parts('capRoamClient', { x: x, from: ap(roam.from), to: ap(roam.to), to2: ap(roam.to), rf: dB(roam.rssiFrom), trig: bold(num(s.trigger, 0)),
          m: bold(num(roam.rssiTo - roam.rssiFrom)), d: bold(num(s.delta, 0)) });
      } else if (roam && roam.reason === 'btm') {
        out = t.parts('capRoamBtm', { x: x, from: ap(roam.from), to: ap(roam.to), to2: ap(roam.to), rf: dB(roam.rssiFrom), rt: dB(roam.rssiTo) });
      } else if (roam) {
        out = t.parts('capLost', { x: x, from: ap(roam.from), to: ap(roam.to), rf: dB(roam.rssiFrom), rt: dB(roam.rssiTo) });
      } else if (asked) {
        out = t.parts('capBtmIgnored', { x: x, from: ap(asked.from), to: ap(asked.to), rf: dB(asked.rssiFrom), rt: dB(asked.rssiTo) });
      } else {
        var vars = { x: x, cur: ap(s.current), rc: dB(s.rssi[s.current]), trig: bold(num(s.trigger, 0)), best: ap(lk.best),
          rb: dB(s.rssi[lk.best]), m: bold(num(lk.margin)), d: bold(num(s.delta, 0)) };
        if (lk.under) out = t.parts(lk.margin === 0 ? 'capLookEqual' : lk.margin < 0 ? 'capLookNone' : 'capLookStay', vars);
        else out = t.parts(lk.margin > 0 ? 'capSticky' : 'capFine', vars);
      }
      out.push(' ', t('capQuality', { q: t('q_' + s.quality) }));
      return out;
    }
  });
})();
</script>
</body>
</html>
