<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SCALE = 64 * 1024;           // blocks bar: 0–64 MiB in KiB
  var MSG = 'Disk quota exceeded';

  /** Data (paths, numbers, commands, file names) never gets translated. */
  function data(text, cls) { return h('span', { class: 'qt-mono' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  /** t.parts with the values in `d` wrapped as data and the others (words, plural phrases) left as text. */
  function parts(key, d, w) {
    var out = {};
    Object.keys(d || {}).forEach(function (k) { out[k] = typeof d[k] === 'object' ? d[k] : data(d[k]); });
    Object.keys(w || {}).forEach(function (k) { out[k] = w[k]; });
    return [].concat(t.parts(key, out));
  }
  function pct(kb) { return Math.max(0, Math.min(100, kb / SCALE * 100)) + '%'; }
  function blocksN(n) { return numPhrase('blocks', n); }
  function filesN(n) { return numPhrase('files', n); }
  function daysN(n) { return numPhrase('days', n); }
  /** A plural phrase with its number as data: "46084 bloka". */
  function numPhrase(key, n) {
    var s = t.n(key, n), i = s.indexOf(String(n));
    if (i < 0) return h('span', null, s);
    return h('span', null, s.slice(0, i), data(n), s.slice(i + String(n).length));
  }
  function has(c, key) { return c.state.changed.indexOf(key) >= 0; }

  // ── command ──

  function command(c) {
    var s = c.state, last = s.last;
    var body;
    if (!last) body = h('p', { class: 'qt-term qt-muted', style: { fontFamily: 'var(--sans)' } }, t('idle'));
    else if (last.op === 'days') {
      body = h('p', { class: 'qt-term sd-changed' }, h('span', { class: 'qt-time' }, numPhraseIn('daysPass', last.n)),
        h('span', { class: 'qt-out', style: { fontFamily: 'var(--sans)' } }, parts('todayIs', { day: s.day })));
    } else {
      var out = last.out.map(function (line) {
        var cls = /^status=0$/.test(line) ? 'qt-out qt-out-ok' : /^status=1$/.test(line) ? 'qt-out qt-out-1' : /Disk quota exceeded/.test(line) ? 'qt-out qt-out-err' : 'qt-out';
        return h('span', { class: cls, translate: 'no' }, line);
      });
      if (!out.length) out = [h('span', { class: 'qt-out qt-muted', style: { fontFamily: 'var(--sans)' } }, last.op === 'repquota' ? t('reportBelow') : t('noOutput'))];
      body = h('p', { class: 'qt-term' }, h('span', { class: 'qt-prompt', translate: 'no' }, L.PROMPT), h('b', { translate: 'no' }, last.cmd), out);
    }
    return h('div', { class: 'qt-box qt-cmd' }, h('h3', null, t('cmdTitle')), body);
  }
  function numPhraseIn(key, n) {
    var s = t.n(key, n), i = s.indexOf(String(n));
    return i < 0 ? s : [s.slice(0, i), data(n), s.slice(i + String(n).length)];
  }

  // ── filesystem: ana's bars ──

  function expiredNow(u, day) { return u.graceUntil != null && day >= u.graceUntil; }

  function blocksBar(c, fs, u) {
    var s = c.state, key = fs.id + ':' + u.name;
    var segs = [], x = 0;
    u.list.forEach(function (f) {
      if (f.kb > 0) {
        var ch = has(c, 'file:' + key + ':' + f.name);
        segs.push(h('div', { class: 'qt-seg sd-fill' + (ch ? ' sd-changed' : ''), dataset: { c: '1' },
          style: { left: pct(x), width: pct(f.kb) }, title: f.name }, f.kb / SCALE > 0.12 ? data(f.name) : null));
      }
      x += f.kb;
    });
    var over = u.soft && u.usedKB > u.soft ? h('div', { class: 'qt-over', style: { left: pct(u.soft), width: pct(Math.min(u.usedKB, SCALE) - u.soft) } }) : null;
    var lim = has(c, 'limits:' + key);
    var wallSoft = expiredNow(u, s.day);
    var lines = [], labs = [];
    if (u.soft) {
      lines.push(h('div', { class: 'qt-line qt-line-soft' + (wallSoft ? ' qt-wall' : ''), style: { left: pct(u.soft) } }));
      labs.push(h('span', { class: 'qt-lab qt-lab-top' + (lim ? ' sd-changed' : ''), style: { left: pct(u.soft) } }, parts('softAt', { n: u.soft })));
    }
    if (u.hard) {
      lines.push(h('div', { class: 'qt-line qt-line-hard', style: { left: pct(u.hard) } }));
      labs.push(h('span', { class: 'qt-lab qt-lab-bot' + (lim ? ' sd-changed' : ''), style: { left: pct(u.hard) } }, parts('hardAt', { n: u.hard })));
    }
    var x2 = null;
    if (has(c, 'refused:' + key + ':blocks')) {
      var at = s.last.why === 'block-expired' ? u.soft : u.hard;
      x2 = h('span', { class: 'qt-x', style: { left: pct(Math.max(at, u.usedKB)) }, 'aria-label': t('legRefused') }, '×');
    }
    return h('div', { class: 'qt-bar' }, labs, h('div', { class: 'qt-track' }, segs, over, lines, x2));
  }

  function ticks() {
    return h('div', { class: 'qt-ticks' }, [0, 16, 32, 48, 64].map(function (m) {
      return h('span', { class: 'qt-tick', style: { left: m / 64 * 100 + '%' } }, m ? numPhraseIn('tick', m) : data(0));
    }));
  }

  function filesBar(c, fs, u) {
    var key = fs.id + ':' + u.name;
    var n = Math.max(8, u.files + 1, u.ihard + 1);
    var refused = has(c, 'refused:' + key + ':files');
    var newName = c.state.last && c.state.last.op === 'touch' && !refused ? c.state.last.file : null;
    var cells = [];
    for (var i = 1; i <= n; i++) {
      var used = i <= u.files;
      var cls = 'qt-cell' + (used ? ' sd-fill' : '') + (used && u.isoft && i > u.isoft ? ' qt-cell-over' : '') +
        (u.isoft && i === u.isoft ? ' qt-cell-soft' : '') + (u.ihard && i === u.ihard ? ' qt-cell-hard' : '') +
        (used && i === u.files && (newName || has(c, 'file:' + key + ':' + (c.state.last && c.state.last.file))) ? ' sd-changed' : '');
      if (refused && i === u.files + 1) cells.push(h('span', { class: 'qt-cell qt-cell-x', 'aria-label': t('legRefused') }, '×'));
      else cells.push(h('span', { class: cls, dataset: { c: '6' } }));
    }
    var lim = has(c, 'limits:' + key);
    var label = u.isoft || u.ihard
      ? h('span', { class: 'qt-fl' + (lim ? ' sd-hl' : '') }, parts('softAt', { n: u.isoft }), ' · ', parts('hardAt', { n: u.ihard }))
      : h('span', { class: 'qt-fl qt-muted' }, t('noLimits'));
    return h('div', { class: 'qt-cells' }, cells, label);
  }

  function badge(c, until, from, prevUntil) {
    var s = c.state;
    if (until == null) return null;
    var gone = s.day >= until;
    var changed = prevUntil !== until || has(c, 'day');
    return h('span', { class: 'qt-badge' + (gone ? ' qt-badge-gone' : '') + (changed ? ' sd-changed' : '') },
      gone ? t('graceGone') : parts('graceLeft', null, { left: daysN(until - s.day) }));
  }

  function prevUser(c, fsId, name) {
    if (!c.prev) return null;
    for (var i = 0; i < c.prev.fs.length; i++) if (c.prev.fs[i].id === fsId) return L.userOf(c.prev.fs[i], name);
    return null;
  }

  function userRow(c, fs, u) {
    var pu = prevUser(c, fs.id, u.name) || {};
    var lim = u.soft || u.hard;
    // a filesystem without quotas: one line, no limits to draw and no file row
    if (!fs.quotas) return h('div', { class: 'qt-user' },
      h('span', { class: 'qt-uname', translate: 'no' }, u.name),
      h('div', null, blocksBar(c, fs, u), ticks()),
      h('div', { class: 'qt-nums' }, h('span', null, parts('usedIs', { n: u.usedKB })), h('span', { class: 'qt-muted' }, t('noLimits'))));
    return h('div', { class: 'qt-user' },
      h('span', { class: 'qt-uname', translate: 'no' }, u.name),
      h('div', null, blocksBar(c, fs, u), lim ? null : ticks()),
      h('div', { class: 'qt-nums' },
        h('span', { class: 'qt-kind' }, t('blocksRow'), ' · ', t('unitNote')),
        h('span', null, parts('usedIs', { n: u.usedKB })),
        lim ? null : h('span', { class: 'qt-muted' }, t('noLimits')),
        badge(c, u.graceUntil, u.graceFrom, pu.graceUntil)),
      h('div', { class: 'qt-files' }, h('span', { class: 'qt-kind' }, t('filesRow')), ' ', filesBar(c, fs, u)),
      h('div', { class: 'qt-nums' }, h('span', null, parts('usedIs', { n: u.files })), badge(c, u.igraceUntil, u.igraceFrom, pu.igraceUntil)));
  }

  function fsCard(c, fs) {
    var s = c.state;
    var anaU = L.userOf(fs, 'ana');
    var head;
    if (fs.quotas) {
      head = h('h3', null, data(fs.mount), h('span', { class: 'qt-muted qt-sm' }, parts('fsDev', { type: fs.fstype, dev: fs.dev })),
        h('span', { class: 'qt-on ' + (s.quotaOn ? 'qt-on-yes' : 'qt-on-no') + (has(c, 'quotaon') ? ' sd-changed' : '') }, s.quotaOn ? t('quotaOn') : t('quotaOff')));
    } else {
      head = h('h3', null, data(fs.mount), h('span', { class: 'qt-muted qt-sm' }, t('fsOther')), h('span', { class: 'qt-on qt-on-no' }, t('quotaNone')));
    }
    var others = fs.users.filter(function (u) { return u.name !== 'ana'; }).map(function (u) {
      return h('div', { class: 'qt-root' }, h('b', { translate: 'no' }, u.name), ': ',
        parts('rootLine', null, { blocks: blocksN(u.usedKB), files: filesN(u.files) }));
    });
    return h('div', { class: 'qt-box qt-fs' + (fs.quotas ? '' : ' qt-fs-home') }, head, userRow(c, fs, anaU), others);
  }

  // ── report ──

  function report(c) {
    var s = c.state, fs = L.fsOf(s, 'polje');
    var prevFs = c.prev ? L.fsOf(c.prev, 'polje') : null;
    var head = L.repquotaHead(fs.dev, s.graceDays).join('\n') + '\n';
    var rows = fs.users.map(function (u) {
      var cells = L.repquotaCells(u, s.day);
      var pc = prevFs ? L.repquotaCells(L.userOf(prevFs, u.name), c.prev.day) : null;
      var line = L.COLS.map(function (col) {
        var txt = String(cells[col.key]);
        while (txt.length < col.width) txt = col.left ? txt + ' ' : ' ' + txt;
        var ch = pc && String(pc[col.key]) !== String(cells[col.key]);
        return [col.sep, h('span', { class: 'qt-c' + (ch ? ' qt-c-ch' : '') }, txt)];
      });
      return [line, '\n'];
    });
    var asked = s.last && s.last.op === 'repquota';
    return h('div', { class: 'qt-box qt-rep' },
      h('h3', null, t('reportTitle'), data('sudo repquota ' + fs.mount, 'qt-sm')),
      h('pre', { class: 'qt-pre' + (asked ? ' sd-changed' : ''), translate: 'no' }, head, rows));
  }

  // ── calendar ──

  function calendar(c) {
    var s = c.state, u = L.userOf(L.fsOf(s, 'polje'), 'ana');
    var clocks = [];
    if (u.graceUntil != null) clocks.push({ key: 'calBlocks', from: u.graceFrom, until: u.graceUntil });
    if (u.igraceUntil != null) clocks.push({ key: 'calFiles', from: u.igraceFrom, until: u.igraceUntil });
    var last = 15;
    clocks.forEach(function (k) { last = Math.max(last, k.until); });
    last = Math.max(last, s.day);
    var nd = last + 1;
    var cells = [h('span', { class: 'qt-dh' }, t('calDays'))];
    for (var d = 0; d <= last; d++) {
      var today = d === s.day;
      cells.push(h('span', { class: 'qt-d qt-dnum' + (today ? ' qt-d-today' : '') + (today && has(c, 'day') ? ' sd-changed' : ''), translate: 'no',
        title: today ? t('calToday') : null }, String(d)));
    }
    var rows = clocks.map(function (k) {
      var r = [h('span', { class: 'qt-dh' }, '⏱')];
      for (var d = 0; d <= last; d++) {
        var on = d >= k.from && d < k.until;
        var end = d === k.until;
        var run = s.day < k.until;
        r.push(h('span', { class: 'qt-d qt-span' + (on ? ' qt-span-on' : '') + (end ? ' qt-span-end' + (run ? ' qt-span-run' : '') : '') }));
      }
      return r;
    });
    var notes = clocks.length ? clocks.map(function (k) {
      return h('div', { class: 'qt-calnote' }, h('b', null, t(k.key)), ': ', parts('calSpan', { from: k.from, until: k.until }));
    }) : [h('div', { class: 'qt-calnote qt-muted' }, t('calNoClock'))];
    return h('div', { class: 'qt-box qt-cal' },
      h('h3', null, t('calTitle'), h('span', { class: 'qt-sm qt-muted' }, t('calToday'), ': ', data(s.day))),
      h('div', { class: 'qt-days' + (nd > 16 ? ' qt-days-wide' : ''), style: { '--days': String(nd) } }, cells, rows),
      notes);
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'qt' },
      command(c),
      h('div', { class: 'qt-fsw' }, s.fs.map(function (fs) { return fsCard(c, fs); })),
      report(c),
      calendar(c)));
  }

  // ── captions: what the command did, then where ana stands ──

  function caption(c) {
    var s = c.state, last = s.last;
    var fs = L.fsOf(s, 'polje'), u = L.userOf(fs, 'ana');
    if (!last) return parts('cap_start', { mount: fs.mount }, { used: blocksN(u.usedKB), files: numPhrase('filesAcc', u.files) });
    var pu = prevUser(c, last.fs || 'polje', 'ana');
    var st = 'status=' + last.status;
    var g = s.graceDays;
    var out = [];
    function add(x) { if (out.length) out.push(' '); out.push.apply(out, [].concat(x)); }
    var op = last.op;
    if (op === 'setquota') {
      add(parts('cap_setquota', { cmd: 'setquota', soft: u.soft, hard: u.hard, softM: u.soft / 1024, hardM: u.hard / 1024 }));
      add(u.isoft || u.ihard ? parts('cap_setquotaFiles', { isoft: u.isoft, ihard: u.ihard }) : parts('cap_setquotaFilesNone', { zero: '0 0' }));
      if (!s.quotaOn) add(t('cap_notYet'));
    } else if (op === 'repquota') {
      add(parts(s.quotaOn ? 'cap_repquotaOn' : 'cap_repquota', { cmd: 'repquota', used: u.usedKB, soft: u.soft, hard: u.hard }));
    } else if (op === 'quotaon') {
      add(parts('cap_quotaon', { cmd: 'quotaon', dev: fs.dev }));
    } else if (op === 'dd' || op === 'touch') {
      var fsx = L.fsOf(s, last.fs), ux = L.userOf(fsx, 'ana');
      var crossed = ux.graceUntil != null && (pu.graceUntil == null);
      if (last.why === 'inode-hard') add(parts('cap_inodeHard', { files: ux.files, ihard: ux.ihard, file: last.file, msg: MSG, st: st }));
      else if (last.why === 'inode-expired') add(parts('cap_inodeExpired', { until: ux.igraceUntil, file: last.file, msg: MSG, st: st }));
      else if (op === 'touch') {
        add(parts('cap_touch', { cmd: 'touch', file: last.file }, { files: numPhrase('filesAcc', ux.files) }));
        var icrossed = ux.igraceUntil != null && pu.igraceUntil == null;
        var flag = L.flags(ux).charAt(1);
        if (!ux.isoft && !ux.ihard) add(t('cap_touchNoLimit'));
        else if (icrossed) add(parts('cap_touchCrossed', { isoft: ux.isoft, flag: flag }, { g: String(g) }));
        else if (ux.ihard && ux.files === ux.ihard) add(parts('cap_touchAtHard', { ihard: ux.ihard }));
        else if (ux.files === ux.isoft) add(parts('cap_touchAtSoft', { isoft: ux.isoft, flag: flag }));
        else if (ux.files > ux.isoft && ux.igraceUntil != null) add(parts('cap_touchInGrace', { isoft: ux.isoft }, { left: daysN(ux.igraceUntil - s.day) }));
        else add(parts('cap_touchUnder', { isoft: ux.isoft }));
      } else if (!fsx.quotas) {
        add(parts('cap_ddHome', { mount: fsx.mount, mib: last.wantKB / 1024, st: st, other: fs.mount }));
      } else if (last.why === 'block-hard') {
        add(parts('cap_ddHard', { want: last.wantKB, written: last.writtenKB, hard: ux.hard, msg: MSG, st: st, file: last.file }));
        if (crossed) add(parts('cap_alsoCrossed', { soft: ux.soft }, { g: String(g) }));
      } else if (last.why === 'block-expired') {
        add(parts('cap_ddExpired', { until: ux.graceUntil, msg: MSG, st: st, used: ux.usedKB, hard: ux.hard, file: last.file }));
      } else if (!s.quotaOn) add(parts('cap_ddOff', { st: st }));
      else if (!ux.soft && !ux.hard) add(parts('cap_ddNoLimit', { st: st }));
      else if (crossed && ux.usedKB === ux.hard) add(parts('cap_crossedAtHard', { soft: ux.soft, hard: ux.hard }, { used: blocksN(ux.usedKB), g: String(g) }));
      else if (crossed) add(parts('cap_crossed', { soft: ux.soft, hard: ux.hard }, { used: blocksN(ux.usedKB), g: String(g) }));
      else if (ux.usedKB > ux.soft) add(parts('cap_ddInGrace', { st: st }, { left: daysN(ux.graceUntil - s.day) }));
      else if (ux.usedKB === ux.soft) add(parts('cap_ddAtSoft', { st: st, used: ux.usedKB }));
      else add(parts('cap_ddUnder', { st: st, soft: ux.soft }, { used: blocksN(ux.usedKB) }));
    } else if (op === 'rm') {
      add(parts('cap_rm', { cmd: 'rm', file: last.file }, { freed: blocksN(last.freedKB), used: blocksN(u.usedKB) }));
      if (pu.graceUntil != null && u.graceUntil == null) add(parts('cap_rmCleared', { soft: u.soft }, { g: daysN(g) }));
      else if (u.graceUntil != null) add(t('cap_rmStill'));
    } else if (op === 'days') {
      add(parts('cap_days', { day: s.day }, { passed: h('span', null, numPhraseIn('daysPass', last.n)) }));
      var k = u.graceUntil != null ? { until: u.graceUntil, from: u.graceFrom } : u.igraceUntil != null ? { until: u.igraceUntil, from: u.igraceFrom } : null;
      if (!k) add(t('cap_daysNone'));
      else if (s.day >= k.until) add(parts('cap_daysExpired', { until: k.until, none: 'none' }));
      else add(parts('cap_daysRunning', { from: k.from, until: k.until }, { left: daysN(k.until - s.day) }));
    }
    return out;
  }

  // ── mount ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'graceDays', type: 'range', label: t('graceDays'), min: 1, max: 14, step: 1,
        format: function (v) { return t.n('days', v); } },
      { key: 'fileLimits', type: 'toggle', label: t('fileLimits'), hint: t('fileLimitsHint') },
      // the commands come with the preset; hidden so the panel fits one screen
      { key: 'script', type: 'select', label: t('script'), resets: true, visible: function () { return false; },
        options: L.SCRIPT_IDS.map(function (x) { return [x, t('preset_' + x)]; }) }
    ],

    presets: L.PRESETS.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), params: x.params, hint: t('preset_' + x.id + '_hint') };
    }),

    legend: [
      { c: 1, label: t('legUsed') },
      { shape: 'dash', label: t('legSoft') },
      { shape: 'qt-wall', label: t('legHard') },
      { shape: 'qt-over', label: t('legOver') },
      { shape: 'qt-grace', label: t('legGrace') },
      { shape: 'qt-x', label: t('legRefused') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
