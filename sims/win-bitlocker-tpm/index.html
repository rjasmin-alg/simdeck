        h('tbody', null, rows.map(function (r) {
          return h('tr', null, h('td', null, T(r[0])), h('td', null, r[1]),
            h('td', null, h('span', { class: r[3] ? 'bl-diff' : null }, r[2])));
        }))));
  }

  function renderScreen(c) {
    var s = c.state, body, k = 'plain';
    if (!s.power) body = h('span', null, t('scrOff'));
    else if (s.recovery) {
      k = 'recovery';
      var groups = [];
      for (var g = 0; g < 8; g++) groups.push(data('______'));
      body = [h('b', null, t('scrRecTitle')), h('span', null, t('scrRecAsk')), h('div', { class: 'bl-digits' }, groups),
        h('small', null, t('scrRecWhere'))];
    } else if (s.done.indexOf('winload') >= 0) body = h('b', null, t('scrWindows'));
    else body = h('span', null, t('scrBooting'));
    return h('div', { class: 'bl-box', style: { display: 'flex', flexDirection: 'column', flex: '1 1 auto' } },
      h('div', { class: 'bl-head' }, h('h3', null, t('scrTitle'))),
      h('div', { class: 'bl-screen' + (s.recovery && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { k: k } }, body));
  }

  // ── captions ──

  /** PCRs not in the profile whose value at the unlock moment differs from a seal-time boot (rule 5). */
  function outside(s) {
    if (!s.atUnlock) return [];
    var ref = L.pcrsAtUnlock(L.SEAL_SETTINGS);
    return L.PCRS.filter(function (i) { return s.sealed.profile.indexOf(i) < 0 && s.atUnlock[i] !== ref[i]; });
  }
  function bad(s) { return s.sealed.profile.filter(function (i) { return !s.compare.pcr[i].match; }); }

  function caption(c) {
    var s = c.state, n = c.n, out = [];
    function add(key, vars) { out = out.concat(T(key, vars)); }
    function addN(key, k, vars) { out = out.concat(rich(t.n(key, k, vars))); }
    if (n === 0) { add('capStart', { list: list(s.sealed.profile) }); if (s.suspended) add('capStartSusp'); return out; }
    if (n === 1) { add('capPower'); return out; }
    if (n === 2) {
      add('capFirmware');
      if (!s.settings.sameTpm) add('capFirmwareOther');
      else if (s.settings.firmware !== L.SEAL_SETTINGS.firmware) add('capFirmwareDiff');
      return out;
    }
    if (n === 3) { add(s.settings.secureBoot ? 'capSecureOn' : 'capSecureOff'); return out; }
    if (n === 4) { add('capBootmgr'); if (s.settings.bootManager !== L.SEAL_SETTINGS.bootManager) add('capBootmgrNew'); return out; }
    if (n === 5) {
      var b = bad(s);
      if (s.how === 'clearKey') {
        add('capClear');
        if (b.length) addN('capClearWould', b.length, { list: list(b) });
        if (!s.compare.sameTpm) add('capClearOther');
      } else if (!s.compare.sameTpm) add('capOtherTpm');
      else if (b.length) addN('capMismatch', b.length, { list: list(b) });
      else {
        add('capUnlock', { list: list(s.sealed.profile) });
        var o = outside(s);
        if (o.length) addN('capOutside', o.length, { list: list(o) });
      }
      return out;
    }
    if (s.recovery) { add('capRecovery'); return out; }
    add('capWindows');
    if (s.resealed) add('capResealed');
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'profile', type: 'choice', label: t('pProfile'), options: [['7,11', '7, 11'], ['0,2,4,11', '0, 2, 4, 11']] },
      { key: 'secureBoot', type: 'toggle', label: t('pSecureBoot') },
      { key: 'firmwareUpdate', type: 'toggle', label: t('pFirmwareUpdate') },
      { key: 'bootManager', type: 'choice', label: t('pBootManager'), options: [['original', t('optOriginal')], ['changed', t('optChanged')]] },
      { key: 'suspend', type: 'toggle', label: t('pSuspend') },
      { key: 'otherMachine', type: 'toggle', label: t('pOtherMachine') }
    ],

    presets: L.presets.map(function (pr) {
      var w = PRESET_WORDS[pr.id];
      return { id: pr.id, label: t(w), params: pr.params, hint: t(w + 'Hint') };
    }),

    legend: [
      { c: 1, label: t('legMeasured') },
      { shape: 'bl-ring', label: t('legProfile') },
      { shape: 'bl-bad', label: t('legMismatch') },
      { shape: 'bl-lock-open', label: t('legReleased') },
      { shape: 'bl-lock', label: t('legHeld') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var stages = L.stagesOf(c.state.settings);
      c.stage.replaceChildren(h('div', { class: 'bl' },
        h('div', { class: 'bl-chain', 'aria-label': t('chainTitle') }, stages.map(function (st, i) { return stageBox(c, st, i); })),
        h('div', { class: 'bl-low' },
          h('div', { class: 'bl-col' }, renderTpm(c), renderSettings(c)),
          h('div', { class: 'bl-col' }, renderSeal(c), renderScreen(c)))));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
