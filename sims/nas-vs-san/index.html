<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SERIES = { A: 1, B: 2, S: 3 };
  var note = null;

  // ── small pieces: data is not language (translate="no") ──

  function data(text) { return h('span', { class: 'ns-data', translate: 'no' }, String(text)); }
  function letter(c) {
    return h('span', { class: 'ns-letter', translate: 'no', dataset: { c: String(SERIES[c] || 8) } }, c);
  }
  function files(list) { return list.length ? data(list.join(', ')) : t('emptyDir'); }
  function entries(dir, withLba) {
    if (!dir || !dir.length) return h('div', { class: 'ns-note' }, t('emptyDir'));
    return data(dir.map(function (e) { return withLba ? e[0] + ' → ' + e[1] : e[0]; }).join(', '));
  }
  function lbaRange(arg) { return Array.isArray(arg) ? arg[0] + '–' + arg[1] : String(arg); }
  function opText(m) {
    if (m.kind === 'block') return m.op + ' LBA ' + lbaRange(m.arg);
    return m.op + ' ' + m.arg + (m.op === 'write' || m.op === 'read' ? ' @0' : '');
  }
  function replyText(r) { return r.indexOf('data:') === 0 ? (r.slice(5) || '0').repeat(4) : r; }

  // ── one panel ──

  function clientCard(kind, s, k, active) {
    var c = s.clients[k];
    var name = h('div', { class: 'ns-client-name' }, letter(k), h('span', null, t.parts('client', { c: data(k) })),
      c.mounted ? null : h('span', { class: 'ns-off' }, t('notMounted')));
    var body;
    if (kind === 'san') {
      body = c.mounted ? h('div', { class: 'ns-fs' },
        h('div', { class: 'ns-fs-title' }, t('fsCached')),
        h('div', { class: 'ns-cached' }, entries(c.dir, true)),
        h('div', { class: 'ns-row' }, h('span', { class: 'ns-k' }, t('bitmapLabel')), c.bitmap.length ? data(c.bitmap.join(', ')) : data('—'))) : null;
    } else {
      body = c.mounted ? h('div', null,
        h('div', { class: 'ns-note' }, t('noFsHere')),
        h('div', { class: 'ns-cached', 'aria-label': t('viewLabel') }, entries(c.dir, false))) : null;
    }
    var lost = kind === 'san' && s.lost.length && active
      ? h('div', { class: 'ns-lost' }, t('lostLabel'), ' ', data(s.lost.join(', '))) : null;
    return h('div', { class: 'ns-client' + (active ? ' sd-changed' : '') }, name, body, lost);
  }

  function wire(kind, s) {
    var lines = s.wire.map(function (m) {
      return h('div', { class: 'ns-msg' },
        letter(m.from), h('span', { class: 'ns-arrow', 'aria-hidden': 'true' }, '→'),
        h('span', { class: 'ns-op sd-changed', translate: 'no', dataset: { kind: m.kind } }, opText(m)),
        h('span', { class: 'ns-arrow', 'aria-hidden': 'true' }, '←'),
        h('span', { class: 'ns-reply', translate: 'no', dataset: m.ok ? {} : { bad: '' } }, (m.ok ? '' : '✕ ') + replyText(m.reply)));
    });
    if (!lines.length) lines.push(h('div', { class: 'ns-note' }, t('wireIdle')));
    if (kind === 'nas' && s.changed.length) {
      lines.push(h('div', { class: 'ns-note' }, t.parts('wireLocal', { list: data('WRITE LBA ' + s.changed.join(', ')) })));
    }
    return h('div', { class: 'ns-wire' }, h('div', { class: 'ns-wire-title' }, t('wire')), lines);
  }

  function cell(s, i) {
    var formatted = s.disk[0] === 'fs';
    var now = s.changed.indexOf(i) >= 0;
    var conflict = s.conflicts.indexOf(i) >= 0;
    var lba = 'LBA ' + i;
    if (i >= 3 && i < L.DATA_FIRST) return { kind: 'ghost', sub: lba };
    var text = '';
    if (i < 3) { if (formatted) text = ['SB', 'BM', 'DIR'][i]; }
    else text = s.disk[i];
    if (!text) return { text: ' ', sub: lba, now: now };
    return { text: conflict ? text + '!' : text, sub: lba, kind: conflict ? 'soft' : 'fill', c: SERIES[s.by[i]] || 8, now: now };
  }

  /** The disk as rows of eight blocks (four on a phone), the LBA in each cell: 16 in a row would be too narrow beside a
      second panel. */
  var narrow = window.matchMedia ? window.matchMedia('(max-width: 900px), (max-aspect-ratio: 1/1)') : null;
  function disk(s, dir) {
    var per = narrow && narrow.matches ? 4 : 8;
    var rows = [];
    for (var j = 0; j < L.BLOCKS; j++) {
      if (j % per === 0) rows.push({ id: 'r' + j, cells: [] });
      rows[rows.length - 1].cells.push(cell(s, j));
    }
    return Simdeck.blockGrid({ dir: dir, bare: true, cellHeight: '3rem', cellWidthPhone: 'minmax(0, 1fr)', rows: rows });
  }

  function store(kind, s, dir) {
    var parts = [];
    if (kind === 'nas') {
      var srv = s.server;
      parts.push(h('div', { class: 'ns-store-name' }, t('server'), h('span', { class: 'ns-off' }, t('disk'))));
      parts.push(h('div', { class: 'ns-fs' },
        h('div', { class: 'ns-fs-title' }, t('fsBox')),
        h('div', { class: 'ns-row' }, h('span', { class: 'ns-k' }, t('dirLabel')),
          srv.dir.length ? data(srv.dir.map(function (e) { return e[0] + ' → ' + e[1]; }).join(', ')) : t('emptyDir')),
        h('div', { class: 'ns-row' }, h('span', { class: 'ns-k' }, t('bitmapLabel')), srv.bitmap.length ? data(srv.bitmap.join(', ')) : data('—')),
        h('div', { class: 'ns-row' }, h('span', { class: 'ns-k' }, t('locksLabel')),
          srv.locks.length ? data(srv.locks.map(function (l) { return l[0] + ': ' + l[1]; }).join(', ')) : data('—'))));
    } else {
      parts.push(h('div', { class: 'ns-store-name' }, t('target'), h('span', { class: 'ns-off' }, t('lun')),
        s.reservation ? h('span', { class: 'ns-res' }, t.parts('reservedBy', { c: data(s.reservation) })) : null));
    }
    parts.push(disk(s, dir));
    return h('div', { class: 'ns-store' }, parts);
  }

  function panel(kind, st, c) {
    var s = st[kind];
    var who = st.op ? st.op.who : null;
    return h('section', { class: 'ns-panel', dataset: { kind: kind } },
      h('div', { class: 'ns-head' }, h('b', null, t(kind === 'nas' ? 'panelNas' : 'panelSan')),
        h('span', null, t(kind === 'nas' ? 'panelNasSub' : 'panelSanSub'))),
      h('div', { class: 'ns-clients' }, ['A', 'B'].map(function (k) { return clientCard(kind, s, k, k === who); })),
      wire(kind, s),
      store(kind, s, c.dir));
  }

  function kinds(p) { return p.mode === 'nas' ? ['nas'] : p.mode === 'san' ? ['san'] : ['nas', 'san']; }

  // ── captions ──

  function outcome(kind, st, prev, mode) {
    var s = st[kind], r = s.res, op = st.op;
    var v = { c: data(op.who), f: data(L.FILE[op.who]), lba: data(r.lba), data: letter(r.data || '?'),
      files: r.files ? files(r.files) : '' };
    if (kind === 'nas') {
      var nk = { noDevice: 'nNoDevice', already: 'nAlready', mounted: 'nMounted', remounted: 'nRemounted', notMounted: 'nNotMounted',
        listed: 'nListed', read: 'nRead', notFound: 'nNotFound', wrote: r.fresh ? 'nWrote' : 'nRewrote', full: 'nFull' }[r.code];
      return t.parts(nk, v);
    }
    var clash = r.code === 'wrote' && s.conflicts.indexOf(r.lba) >= 0 && (!prev || prev.san.conflicts.indexOf(r.lba) < 0);
    if (clash) return t.parts('sClash', v);
    var key = { formatted: 'sFormatted', busy: 'sBusy', conflict: 'sConflict', formatConflict: 'sFormatConflict', already: 'sAlready', noFs: 'sNoFs', mounted: 'sMounted',
      remounted: 'sRemounted', notMounted: 'sNotMounted', listed: 'sListed', read: 'sRead', notFound: 'sNotFound',
      wrote: r.fresh ? 'sWrote' : 'sRewrote', full: 'sFull' }[r.code];
    var out = t.parts(key, v);
    if (r.code === 'read' && r.wrong) out.push(' ', h('b', null, t('sReadWrong')));
    if (r.code === 'remounted' && s.lost.length) out.push(' ', h('b', null, t.parts('sLost', { f: data(s.lost.join(', ')), w: data(r.dirBy) })));
    if (r.code === 'wrote' && r.fresh && mode === 'san') out.push(' ', t('sNoIdea'));
    return out;
  }

  function capitalised(parts) {
    var p0 = parts[0];
    if (typeof p0 === 'string' && p0) parts[0] = p0.charAt(0).toUpperCase() + p0.slice(1);
    else if (p0 && p0.nodeType === 3 && p0.data) p0.data = p0.data.charAt(0).toUpperCase() + p0.data.slice(1);
    return parts;
  }

  // ── buttons: an operation at the next step; the steps after it are dropped ──

  function add(sim, tok) {
    var acts = L.actionsOf(sim.params);
    var kept = acts.slice(0, Math.min(sim.n, acts.length));
    if (kept.length >= L.MAX_ACTIONS) { note = 'noteFull'; sim.render(); return; }
    kept.push({ verb: tok[0], who: tok[1] });
    sim.set({ ops: L.encode(kept) });
    sim.go(kept.length);
  }
  function btn(key, tok) { return { type: 'button', label: t(key), run: function (sim) { add(sim, tok); } }; }

  var PRESETS = [
    { id: 'nas-two-clients', label: t('prNas'), hint: t('prNasHint'), params: { mode: 'nas', reservation: false, ops: 'mA.mB.wA.wB.lA.lB' } },
    { id: 'san-one-client', label: t('prSan1'), hint: t('prSan1Hint'), params: { mode: 'san', reservation: false, ops: 'fA.mA.wA' } },
    { id: 'san-two-clients', label: t('prSan2'), hint: t('prSan2Hint'), params: { mode: 'both', reservation: false, ops: 'fA.mA.mB.wA.wB.rA.uA' } },
    { id: 'san-reservation', label: t('prRes'), hint: t('prResHint'), params: { mode: 'san', reservation: true, ops: 'fA.mA.mB.wA.wB.rA.uA' } }
  ];
  /** The hidden run: the kit reads a URL value only when it is one of the options, so the options are the presets'
      runs and the (cleaned) run in this page's URL. Any other value is set by the buttons. */
  function opsOptions() {
    var list = PRESETS.map(function (x) { return x.params.ops; });
    var raw = new URLSearchParams(window.location.search).get('ops');
    if (raw !== null) {
      var clean = L.encode(L.actionsOf({ ops: raw }));
      if (clean === raw && clean && list.indexOf(raw) < 0) list.push(raw);
    }
    return list.filter(function (x, i) { return list.indexOf(x) === i; }).map(function (x) { return [x, x]; });
  }

  var sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('pMode'), options: [['nas', 'NAS'], ['san', 'SAN'], ['both', t('modeBoth')]] },
      { key: 'reservation', type: 'toggle', label: t('pRes'), hint: t('pResHint'), visible: function (p) { return p.mode !== 'nas'; } },
      // the run (set by presets and the buttons): hidden, but kept in the URL so a link, a reload or L keeps it
      { key: 'ops', type: 'choice', label: t('pOps'), visible: function () { return false; }, options: opsOptions() },
      btn('btnFA', 'fA'),
      btn('btnMA', 'mA'),
      btn('btnMB', 'mB'),
      btn('btnWA', 'wA'),
      btn('btnWB', 'wB'),
      btn('btnRA', 'rA'),
      btn('btnLA', 'lA'),
      btn('btnUA', 'uA')
    ],

    presets: PRESETS,

    legend: [
      { shape: 'ns-fs', label: t('lgFs') },
      { shape: 'ns-file', label: t('lgFileOp') },
      { shape: 'ns-block', label: t('lgBlockOp') },
      { shape: 'hollow', label: t('lgCached') },
      { shape: 'ns-conflict', label: t('lgConflict') },
      { shape: 'bg-bad', label: t('lgRejected') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'ns', dataset: { mode: c.params.mode } },
        kinds(c.params).map(function (k) { return panel(k, c.state, c); })));
    },

    caption: function (c) {
      var out;
      if (c.first || !c.state.op) {
        out = [t(c.params.mode === 'nas' ? 'capStartNas' : c.params.mode === 'san' ? 'capStartSan' : 'capStart')];
      } else {
        var op = c.state.op;
        out = t.parts('capStep', { n: c.n, op: h('span', null, t.parts('op' + op.verb, { c: data(op.who), f: data(L.FILE[op.who]) })) });
        var ks = kinds(c.params);
        ks.forEach(function (k) {
          out.push(' ');
          if (ks.length > 1) out.push(h('b', null, t(k === 'nas' ? 'panelNas' : 'panelSan') + ':'), ' ');
          var o = outcome(k, c.state, c.prev, c.params.mode);
          out.push.apply(out, ks.length > 1 ? o : capitalised(o));
        });
      }
      if (note) { out.push(' ', t(note)); note = null; }
      return out;
    }
  });
  if (narrow && narrow.addEventListener) narrow.addEventListener('change', function () { sim.render(); });
})();
</script>
</body>
</html>
