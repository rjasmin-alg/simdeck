  };

  var FILTER_CAP = { 'static-shareable': 'cap_static', 'variable': 'cap_variable', 'host-specific': 'cap_host', 'may-be-lost': 'cap_lost', 'virtual': 'cap_virtual' };

  var svgNs = 'http://www.w3.org/2000/svg';
  function icon(b) {

    s.setAttribute('viewBox', '0 0 24 24');

  var sim;
  function pick(path) {

  }

  /** The name a node shows: the full path at depth 0 and 1, below that the rest after its parent, one line per name. */
  function nameOf(n) {
    if (n.depth <= 1) return h('span', { class: 'ld-name', translate: 'no' }, n.path);
    var parts = n.path.slice(n.parent.length + 1).split('/');
    var out = [];
    parts.forEach(function (s, i) { out.push(i < parts.length - 1 ? s + '/' : s); if (i < parts.length - 1) out.push(h('br')); });
    return h('span', { class: 'ld-name', translate: 'no' }, out);
  }

  function nodeEl(n, s) {
    var cls = 'ld-node' + (n.depth === 0 ? ' is-root' : '') + (n.ring === 1 && n.depth === 1 ? ' is-ring1' : '') +
      (n.lit ? ' sd-changed' : '') + (n.onPath ? ' is-path' : '') + (s.selected === n.path ? ' is-sel' : '');
    var showWord = s.badges && n.lit && n.primary;

      nameOf(n),
      showWord ? badge(n.primary) : (n.behaviours.length && n.depth > 0 ? h('span', { class: 'ld-icons' }, n.behaviours.map(icon)) : null),
      s.describe && n.depth > 0 ? h('p', { class: 'ld-desc' }, t('d_' + n.key)) : null);
  }

  function tree(s) {
    var byParent = {};
    s.nodes.forEach(function (n) { (byParent[n.parent] = byParent[n.parent] || []).push(n); });
    var rootNode = byParent['null'][0];
    var kids = byParent['/'] || [];
    var endAt = -1;
    kids.forEach(function (k, i) { if (k.onPath) endAt = i; });
    return h('div', { class: 'ld-tree' },
      h('div', { class: 'ld-rootrow' }, nodeEl(rootNode, s), endAt >= 0 ? h('span', { class: 'ld-stem-on' }) : null),
      h('ul', { class: 'ld-kids' }, kids.map(function (k, i) {
        var subs = byParent[k.path] || [];
        var subEnd = -1;
        subs.forEach(function (c, j) { if (c.onPath) subEnd = j; });

          h('span', { class: 'ld-bus' }),
          i <= endAt ? h('span', { class: 'ld-bus is-on' + (i === endAt ? ' is-end' : '') }) : null,

          subs.length ? h('ul', { class: 'ld-sub' }, subs.map(function (c, j) {

              h('span', { class: 'ld-vline' }),
              j <= subEnd ? h('span', { class: 'ld-vline is-on' + (j === subEnd ? ' is-end' : '') }) : null,
              h('span', { class: 'ld-tick' + (j === subEnd ? ' is-on' : '') }),

    var n = s.nodes.filter(function (x) { return x.path === s.selected; })[0];
    var chain = [];
    s.path.forEach(function (p, i) {

        fhs ? h('dd', null, data(fhs[1])) : null,
        n.example ? h('dt', null, t('cardExample')) : null,
        n.example ? h('dd', null, data(n.example.file), ' (', t('chapterN', { n: n.example.chapter }), ')') : null,
        h('dt', null, t('cardBook')),
        h('dd', null, t('chapterN', { n: n.chapter })),
        h('dt', null, t('cardRead')),
        h('dd', null, data(chain.join(''), 'ld-chain'))));
  }

  function key(s) {
    var on = s.filter ? L.FILTERS[s.filter] : [];
    return h('ul', { class: 'ld-key' },
      h('li', { class: 'ld-key-title' }, t('keyTitle')),
      L.BEHAVIOURS.map(function (b) {
        return h('li', { class: on.indexOf(b) >= 0 ? 'is-on' : '' }, icon(b), t(BADGE[b].word));
      }));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'filter', type: 'select', label: t('filter'), hint: t('filterHint'),
        options: L.FILTER_IDS.map(function (f) { return [f, t(FILTER_WORD[f])]; }) },
      { key: 'ring', type: 'choice', label: t('ring'), options: [['book', t('ringBook')], ['all', t('ringAll')]] },
      { key: 'view', type: 'select', label: t('ring'), options: L.VIEW_IDS.map(function (v) { return [v, v]; }),
        visible: function () { return false; } },
      { key: 'sel', type: 'select', label: t('ring'), options: [['', '']].concat(L.NODES.map(function (n) { return [n.path, n.path]; })),
        visible: function () { return false; } }
    ],

    presets: [
      { id: 'book-six', label: t('pBook'), params: { ring: 'book', view: 'book-six' }, hint: t('pBookHint') },
      { id: 'behaviour', label: t('pBehaviour'), params: { view: 'behaviour' }, hint: t('pBehaviourHint') },
      { id: 'where-are-logs', label: t('pLogs'), params: { view: 'where-are-logs' }, hint: t('pLogsHint') },
      { id: 'boot-and-disks', label: t('pBoot'), params: { view: 'boot-and-disks' }, hint: t('pBootHint') },
      { id: 'virtual', label: t('pVirtual'), params: { filter: 'virtual', view: 'virtual' }, hint: t('pVirtualHint') }
    ],

    legend: [
      { shape: 'ld-folder', label: t('legFolder') },
      { shape: 'ld-path', label: t('legPath') },
      { shape: 'hl', label: t('legChanged') },
      { shape: 'ld-fhs', label: t('legFhs') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'ld' + (s.ring === 'book' ? ' is-book' : '') }, key(s), tree(s), card(s)));
    },

    caption: function (c) {
      var s = c.state;
      if (s.selected) {
        var chain = s.path.map(function (p, i) { return i === 0 ? '/' : p.slice(s.path[i - 1] === '/' ? 1 : s.path[i - 1].length + 1); });
        return t.parts('capSel', { path: data(s.selected), chain: data(chain.join(' → ')) });
      }
      if (s.filter) {
        if (!s.lit.length) return [t(FILTER_CAP[s.filter]), ' ', t('capNoneInRing')];
        return [t(FILTER_CAP[s.filter]), ' ', t.n('litN', s.lit.length)];
      }
      return t(VIEW_CAP[s.view] || 'capDefault');
    }
  });
})();
</script>
</body>
</html>
