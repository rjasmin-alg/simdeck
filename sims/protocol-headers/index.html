     words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Series colour per header; the column, its title and position carry the header too. */
  var COLOR = { eth: 1, ipv4: 2, ipv6: 3, tcp: 4, udp: 5 };
  var MARK = { same: '=', renamed: '↔', left: '✕', right: '✕' };
  /** Flex weight of the Ethernet strip: octets for the fixed fields, a fixed width for the data. */
  var DATA_W = 20;

  /** Data (values, addresses, numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function oct(n) { return t.n('octN', n); }
  function range(a, b) { return a === b ? String(a) : a + '…' + b; }
  /** t.parts with *word* turned into an English term in italics (term pairs not in the glossary yet). */
  function rich(k, vars) {
    var out = [];
    t.parts(k, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (piece, i) {
        if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }
  /** The full name as plain text (captions, aria labels). */
  function plain(k) { return t(k).replace(/\*/g, ''); }
  function nKey(hid, fid) { return hid + '_' + fid; }
  function noSteal(e) { e.preventDefault(); }

  var sim, hover = null, pressed = '';  // pressed: the clicked field (params.sel), for aria-pressed

  /** The state with the hovered field as the selection (a hover previews; it does not touch the URL). */
  function eff(c) {
    if (!hover || hover === c.params.sel) return c.state;
    return L.initial(Object.assign({}, c.params, { sel: hover }));
  }
  function pick(key) {
    if (sim.params.sel === key) hover = null;  // clearing: show the cleared state at once, not the hover preview
    sim.set({ sel: sim.params.sel === key ? '' : key }, { preset: sim.preset }); // a click keeps the active preset
  }

  /** What a box shows besides its name: the value (with an example), else its size. */
  function boxBody(hd, f) {
    var out = [];
    if (f.narrow && hd.kind === 'octets') return out;
    if (f.value) out.push(data(f.value.text, 'ph-val'));
    else if (f.variable) out.push(h('span', { class: 'ph-size' }, hd.kind === 'octets' ? range(f.variable.min, f.variable.max) : t('sizeRange', { min: f.variable.min, max: f.variable.max })));
    else if (!f.narrow) out.push(h('span', { class: 'ph-size' }, hd.kind === 'octets' ? oct(f.octets) : t.n('bitsN', f.bits)));
    return out;
  }

  function fieldBox(hd, f, extra) {
    var cls = 'ph-f' + (f.variable ? ' is-var' : '') + (f.narrow ? ' is-narrow' : '') + (!f.counted ? ' is-uncounted' : '') +
      (f.mark && (f.mark.kind === 'left' || f.mark.kind === 'right') ? ' is-only' : '') +
      (f.selected ? ' is-sel' : '') + (f.changed ? ' sd-changed' : '');
    var label = f.narrow ? h('span', { class: 'ph-num', translate: 'no' }, String(f.narrow)) : t('n_' + nKey(hd.id, f.id));
    if (f.mark) {
      var pp = f.mark.partner ? f.mark.partner.split('.') : null;
      label = [f.mark.kind === 'renamed' ? null : [h('span', { class: 'ph-mark', 'aria-hidden': 'true' }, MARK[f.mark.kind]), ' '], label,
        f.mark.kind === 'renamed' ? h('span', { class: 'ph-partner' }, ' ↔ ', t('n_' + nKey(pp[0], pp[1]))) : null];
    }
    label = h('span', { class: 'ph-name' }, label);
    return h('button', Object.assign({
      type: 'button', class: cls, 'data-key': f.key, 'data-c': String(COLOR[hd.id]),
      'aria-pressed': f.key === pressed ? 'true' : 'false', 'aria-label': plain('f_' + nKey(hd.id, f.id)),
      onmousedown: noSteal, onclick: function () { pick(f.key); }
    }, extra || {}), label, boxBody(hd, f));
  }

  function keyLine(hd) {
    var narrow = hd.fields.filter(function (f) { return f.narrow; });
    return h('p', { class: 'ph-key' }, narrow.length ? [t('key'), ' '].concat(narrow.map(function (f) {
      return h('span', null, h('span', { class: 'ph-num', translate: 'no', 'data-c': String(COLOR[hd.id]) }, String(f.narrow)), t('n_' + nKey(hd.id, f.id)));
    })) : null);
  }

  function title(hd) {
    var size = hd.id === 'eth' ? null : hd.minOctets === hd.maxOctets ? oct(hd.minOctets) : t('sizeRange', { min: hd.minOctets, max: hd.maxOctets });
    return h('h2', { class: 'ph-title', 'data-c': String(COLOR[hd.id]) },
      h('span', { class: 'ph-hname' }, t('h_' + hd.id)), size ? h('span', { class: 'ph-hsize' }, size) : null,
      hd.inUse ? null : h('span', { class: 'ph-off' }, t('notInUse')));
  }

  /** The Ethernet frame: preamble and SFD (not counted), then the frame; offsets under it. */
  function ethStrip(hd, s) {
    var w = function (f) { return String(f.variable ? DATA_W : f.octets); };
    var frame = s.nesting.frame, data = s.example ? s.nesting.packet[0] + s.nesting.padding[0] : null;
    var before = hd.fields.filter(function (f) { return !f.counted; });
    var offs = [h('span', { style: { '--w': String(before.reduce(function (n, f) { return n + f.octets; }, 0)) } }, title(hd))];
    hd.fields.forEach(function (f) {
      if (!f.counted) return;
      if (f.id === 'fcs') {
        offs.push(h('span', { class: 'ph-o is-end', style: { '--w': w(f) }, translate: 'no', 'aria-hidden': 'true' },
          (data === null ? '' : (14 + data) + ' ') + '→ ' + (data === null ? range(L.MIN_FRAME, L.MAX_FRAME) : String(frame[0]))));
      } else offs.push(h('span', { class: 'ph-o', style: { '--w': w(f) }, translate: 'no', 'aria-hidden': 'true' }, String(f.offset)));
    });
    return h('section', { class: 'ph-eth' },
      h('div', { class: 'ph-strip' }, hd.fields.map(function (f) {
        var box = fieldBox(hd, f, { style: { '--w': w(f) } });
        if (!f.counted && !f.narrow) box.append(h('span', { class: 'ph-size' }, t('notCounted')));
        return box;
      })),
      h('div', { class: 'ph-offs' }, offs));
  }

  function ruler() {
    return h('div', { class: 'ph-ruler', 'aria-hidden': 'true' },
      [0, 8, 16, 24].map(function (b) { return h('span', { style: { gridColumn: (b + 1) + ' / span 4' } }, String(b)); }),
      h('span', { class: 'is-end', style: { gridColumn: '29 / span 4' } }, '31'));
  }

  /** A 32-bit header; the column with the most free rows also holds the card under its rows. */
  function column(hd, cardEl) {
    return h('section', { class: 'ph-col' + (hd.inUse ? '' : ' is-dim'), 'data-c': String(COLOR[hd.id]) },
      title(hd), keyLine(hd), ruler(),
      h('div', { class: 'ph-rows' }, hd.fields.map(function (f) {
        return fieldBox(hd, f, { style: { gridColumn: (f.bit + 1) + ' / span ' + Math.min(f.bits, 32), gridRow: (f.row + 1) + ' / span ' + f.span } });
      }), cardEl ? (cardEl.style.gridRow = (hd.rows + 1) + ' / -1', cardEl.style.gridColumn = '1 / -1', cardEl) : null));
  }

  // ── the card ──

  function fieldOf(s, key) {
    var p = key.split('.');
    var hd = s.headers.filter(function (x) { return x.id === p[0]; })[0];
    return { hd: hd, f: hd.fields.filter(function (x) { return x.id === p[1]; })[0] };
  }

  function card(s) {
    if (!s.selected) {
      if (s.compareId) return compareCard(s);
      return h('div', { class: 'ph-card is-empty' }, h('p', null, t('cardHint')));
    }
    var x = fieldOf(s, s.selected.header + '.' + s.selected.field), hd = x.hd, f = x.f;
    var k = nKey(hd.id, f.id);
    var size = hd.kind === 'octets' ? oct(f.octets) : f.bits % 8 === 0 ? t.n('bitsN', f.bits) + ' = ' + oct(f.bits / 8) : t.n('bitsN', f.bits);
    if (f.variable) size = t('variable', { min: f.variable.min, max: f.variable.max });
    var where = hd.kind === 'octets' ? (f.counted ? t('whereOctet', { n: f.offset }) : t('whereBefore')) : t('whereBits', { row: f.row, bit: f.bit });
    var val = null;
    if (f.value) {
      var note = f.value.note ? t('v_' + f.value.note, { octets: Number(f.value.text) * 4 }) : null;
      val = h('p', { class: 'ph-kv' },
        h('span', null, h('b', null, t('lblValue')), data(f.value.text, 'ph-mono'), note ? h('span', { class: 'ph-note' }, ' ', note) : null),
        f.wire ? h('span', null, h('b', null, t('lblWire')), data(f.wire.join(' '), 'ph-mono'), h('span', { class: 'ph-note' }, ' (' + t('wireNote') + ')')) : null);
    } else if (s.example === null) val = h('p', { class: 'ph-note' }, t('noValue'));
    var pair = null;
    if (f.mark) {
      var mk = f.mark.kind === 'left' || f.mark.kind === 'right' ? t('mk_' + s.compareId + '_' + f.mark.kind) : t('mk_' + f.mark.kind);
      var pp = f.mark.partner ? f.mark.partner.split('.') : null;
      pair = h('p', null, h('b', null, t('lblPair'), ' '), MARK[f.mark.kind] + ' ' + mk,
        pp ? [': ', h('span', { class: 'ph-hname', 'data-c': String(COLOR[pp[0]]) }, t('h_' + pp[0])), ' ', rich('f_' + nKey(pp[0], pp[1]))] : null);
    }
    return h('div', { class: 'ph-card', 'data-c': String(COLOR[hd.id]) },
      h('h2', null, h('span', { class: 'ph-hname' }, t('h_' + hd.id)), h('span', null, rich('f_' + k)), data(hd.rfc, 'ph-rfc')),
      h('p', { class: 'ph-kv' }, h('span', null, h('b', null, t('lblSize')), size), h('span', null, h('b', null, t('lblWhere')), where)),
      h('p', null, t('d_' + k)),
      val, pair);
  }

  /** Compare on, nothing selected: the fields of each kind. */
  function compareCard(s) {
    var c = L.COMPARES[s.compareId];
    var left = s.headers.filter(function (x) { return x.id === c.left; })[0];
    var right = s.headers.filter(function (x) { return x.id === c.right; })[0];
    function names(hd, kinds) {
      return hd.fields.filter(function (f) { return f.mark && kinds.indexOf(f.mark.kind) >= 0; })
        .map(function (f) { return t('n_' + nKey(hd.id, f.id)); }).join(', ');
    }
    var renamed = left.fields.filter(function (f) { return f.mark && f.mark.kind === 'renamed'; }).map(function (f) {
      var pp = f.mark.partner.split('.');
      return t('n_' + nKey(left.id, f.id)) + ' → ' + t('n_' + nKey(pp[0], pp[1]));
    }).join(', ');
    var rows = [['= ' + t('mk_same'), names(left, ['same'])]];
    if (renamed) rows.push(['↔ ' + t('mk_renamed'), renamed]);
    rows.push(['✕ ' + t('mk_' + s.compareId + '_left'), names(left, ['left'])]);
    rows.push(['✕ ' + t('mk_' + s.compareId + '_right'), names(right, ['right'])]);
    return h('div', { class: 'ph-card' },
      h('dl', { class: 'ph-cmp' }, rows.map(function (r) { return [h('dt', null, r[0]), h('dd', null, r[1])]; })));
  }

  // ── the nesting strip ──

  function nest(s) {
    var n = s.nesting;
    var segWord = n.transport === 'tcp' ? 'nestSegment' : 'nestDatagram';
    function chip(c, label, num, cls) {
      return h('span', { class: 'ph-chip' + (cls ? ' ' + cls : ''), 'data-c': c ? String(c) : null }, label, ' ', data(num));
    }
    function box(c, label, num, kids) {
      return h('div', { class: 'ph-box', 'data-c': String(c) }, h('span', { class: 'ph-blabel' }, label, ' ', data(num)), h('div', { class: 'ph-brow' }, kids));
    }
    var dataChip = h('span', { class: 'ph-chip is-data' }, h('span', null, t('nestData'), ' ', data(range(n.data[0], n.data[1]))));
    var seg = box(COLOR[n.transport], t(segWord), range(n.segment[0], n.segment[1]),
      [chip(COLOR[n.transport], t('h_' + n.transport), n.transportHeader), dataChip]);
    var pkt = box(COLOR[n.ip], t('nestPacket'), range(n.packet[0], n.packet[1]), [chip(COLOR[n.ip], t('h_' + n.ip), n.ipHeader), seg]);
    var pad = n.padding[0] || n.padding[1] ? chip(null, t('nestPad'), range(Math.min(n.padding[0], n.padding[1]), Math.max(n.padding[0], n.padding[1])), 'is-pad') : null;
    var frame = box(COLOR.eth, t('nestFrame'), range(n.frame[0], n.frame[1]),
      [chip(COLOR.eth, 'Ethernet', 14), pkt, pad, chip(COLOR.eth, 'FCS', 4)]);
    return h('section', { class: 'ph-nest' }, frame,
      h('p', { class: 'ph-minmax' }, t('nestMinMax', { min: n.minFrame, max: n.maxFrame })));
  }

  // ── mount ──

  var allKeys = [];
  L.HEADERS.forEach(function (hd) { hd.fields.forEach(function (f) { allKeys.push(hd.id + '.' + f.id); }); });

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'compare', type: 'choice', label: t('compare'), hint: t('compareHint'), value: 'none',
        options: L.COMPARE_IDS.map(function (id) { return [id, t('cmp_' + id)]; }) },
      { key: 'example', type: 'select', label: t('example'), hint: t('exampleHint'), value: 'none',
        options: L.EXAMPLE_IDS.map(function (id) { return [id, id === 'none' ? t('ex_none') : t('p_' + id)]; }) },
      { key: 'sel', type: 'select', label: t('selField'), value: '', options: [['', '']].concat(allKeys.map(function (k) { return [k, k]; })),
        visible: function () { return false; } }
    ],

    presets: [
      { id: 'book-ipv4', label: t('p_book-ipv4'), params: { example: 'book-ipv4', sel: 'ipv4.ihl' }, hint: t('ph_book-ipv4') },
      { id: 'book-tcp-offset', label: t('p_book-tcp-offset'), params: { example: 'book-tcp-offset', sel: 'tcp.offset' }, hint: t('ph_book-tcp-offset') },
      { id: 'min-frame', label: t('p_min-frame'), params: { example: 'min-frame', sel: 'eth.data' }, hint: t('ph_min-frame') },
      { id: 'max-frame', label: t('p_max-frame'), params: { example: 'max-frame', sel: 'eth.data' }, hint: t('ph_max-frame') },
      { id: 'ipv4-vs-ipv6', label: t('p_ipv4-vs-ipv6'), params: { example: 'ipv4-vs-ipv6', compare: 'ipv4-ipv6', sel: 'ipv4.ttl' }, hint: t('ph_ipv4-vs-ipv6') },
      { id: 'overhead', label: t('p_overhead'), params: { example: 'overhead' }, hint: t('ph_overhead') }
    ],

    legend: [
      { c: 2, label: t('legField') },
      { shape: 'ph-hatch', label: t('legVar') },
      { shape: 'hollow', label: t('legDashed') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      pressed = c.params.sel;
      var s = eff(c);
      var eth = s.headers[0];
      var cols = s.headers.filter(function (x) { return x.kind === 'bits' && x.shown; });
      // the card goes under the shortest header (ties: the rightmost)
      var host = cols.reduce(function (a, b) { return b.rows <= a.rows ? b : a; });
      var cardEl = card(s);
      c.stage.replaceChildren(h('div', { class: 'ph' },
        ethStrip(eth, s),
        h('div', { class: 'ph-cols' + (cols.length === 2 ? ' is-two' : '') }, cols.map(function (hd) { return column(hd, hd === host ? cardEl : null); })),
        nest(s)));
    },

    caption: function (c) {
      var s = eff(c);
      if (s.selected) {
        var key = s.selected.header + '.' + s.selected.field;
        if (key !== s.focus || !s.example) {
          var f = fieldOf(s, key).f;
          var size = f.variable ? t('variable', { min: f.variable.min, max: f.variable.max }) :
            s.selected.header === 'eth' ? oct(f.octets) : t.n('bitsN', f.bits);
          return t('capSel', { field: t('n_' + nKey(s.selected.header, s.selected.field)), header: t('h_' + s.selected.header), size: size });
        }
      }
      if (s.example) return t('cap_' + s.example);
      if (s.compareId) return t('capc_' + s.compareId);
      return t('capDefault');
    }
  });

  // Hover previews a field (SPEC.md "Tie-breaks"): one listener on the stage, which the renders do not replace.
  var stage = document.querySelector('[data-sd-stage]');
  stage.addEventListener('pointerover', function (e) {
    var el = e.target.closest ? e.target.closest('[data-key]') : null;
    var key = el ? el.getAttribute('data-key') : null;
    if (key !== hover) { hover = key; sim.render(); }  // off a field (card, strip, gaps): back to the clicked one
  });
  stage.addEventListener('pointerleave', function () { if (hover) { hover = null; sim.render(); } });
})();
</script>
</body>
