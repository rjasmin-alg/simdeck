<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var isText = function (p) { return !!(L.VALUES[p.value] || {}).text; };

  // ── formatting (data, not language: shown in translate="no" spans) ──
  function hx2(b) { return (b < 16 ? '0' : '') + b.toString(16).toUpperCase(); }
  function hexOf(v, width) {
    var s = v.toString(16).toUpperCase();
    while (s.length < width / 4) s = '0' + s;
    return '0x' + s;
  }
  function grouped(v) { return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function addr(i) { return '0x' + (L.BASE + i).toString(16).toUpperCase(); }
  function bytesText(bytes) { return bytes.map(hx2).join(' '); }
  function data(text, cls) { return h('span', { class: 'en-mono' + (cls ? ' ' + cls : ''), translate: 'no' }, text); }
  /** Series colour of a byte by its significance (MSB c1 … LSB c4), or by position for text (c5 …). */
  function colourOf(s, sig) {
    if (s.text) return String(5 + sig);
    var n = s.width / 8;
    return n === 2 ? (sig === 0 ? '1' : '4') : String(sig + 1);
  }
  /** The number the reader gets, as the captions and the result line say it. */
  function numberText(v, s, p) {
    if (s.width === 32 && p.value === 'ipv4') return L.dottedOf(v);
    return hexOf(v, s.width) + ' = ' + grouped(v);
  }

  // ── stage: the typed-hex field is built once (so typing keeps focus); everything else is redrawn ──
  var sim = null;
  var urlQuery = new URLSearchParams(window.location.search);
  var prevParams = null, lastParams = null;
  var input = h('input', {
    type: 'text', inputmode: 'text', autocomplete: 'off', spellcheck: 'false', maxlength: '10',
    'aria-label': t('typedLabel'), placeholder: t('typedPlaceholder'), translate: 'no',
    oninput: function () {
      var raw = input.value, clean = L.cleanHex(raw);
      if (raw.toUpperCase() !== clean) {
        // keep the caret where it was, less the characters dropped before it
        var at = input.selectionStart == null ? clean.length : L.cleanHex(raw.slice(0, input.selectionStart)).length;
        input.value = clean;
        try { input.setSelectionRange(at, at); } catch (e) { /* not focused */ }
      }
      if (sim) sim.set({ value: 'typed', hex: clean });
    }
  });
  var entry = h('label', { class: 'en-entry' }, h('span', { 'data-t': 'typedLabel' }, t('typedLabel')),
    h('span', { class: 'en-0x', translate: 'no' }, '0x'), input);
  var valBox = h('div', { class: 'en-val' });
  var body = h('div', { class: 'en-body' });
  var root = h('div', { class: 'en' }, h('div', { class: 'en-top' }, valBox, entry), body);

  function cell(s, b, sig, top, tag, label) {
    var msb = !s.text && sig === 0;
    return h('div', {
      class: 'en-cell' + (msb ? ' en-msb' : ''), dataset: { c: colourOf(s, sig) }, translate: 'no',
      role: 'img', 'aria-label': label
    },
      top ? h('span', { class: 'en-top-lbl' }, top) : null,
      h('span', { class: 'en-hex' }, hx2(b)),
      tag ? h('span', { class: 'en-tag' }, tag) : null);
  }
  function tagOf(s, sig, b) {
    if (s.text) return String.fromCharCode(b);
    if (sig === 0) return t('msb');
    if (sig === s.width / 8 - 1) return t('lsb');
    return null;
  }
  function pad(row, n) { for (var i = n; i < 4; i++) row.push(h('div', { class: 'en-empty', 'aria-hidden': 'true' })); return row; }

  function memRow(s, order) {
    var bytes = order === 'big' ? s.bytesBE : s.bytesLE;
    var sig = order === 'big' ? s.sigBE : s.sigLE;
    var isHost = s.hostOrder === order;
    var cells = bytes.map(function (b, i) {
      return cell(s, b, sig[i], addr(i), tagOf(s, sig[i], b), t('cellLabel', { a: addr(i), b: hx2(b) }));
    });
    return [
      h('div', { class: 'en-lbl' + (isHost ? ' en-row-host' : '') },
        h('b', null, t(order === 'big' ? 'rowBig' : 'rowLittle')),
        h('small', null, t(order === 'big' ? 'rowBigSub' : 'rowLittleSub')))

  }

  function wireRow(s) {
    var cells = s.wire.map(function (b, i) {
      return cell(s, b, s.sigWire[i], t('nth', { n: i + 1 }), tagOf(s, s.sigWire[i], b), t('wireLabel', { n: i + 1, b: hx2(b) }));
    });
    return [h('div', { class: 'en-lbl' }, h('b', null, t('rowWire')), h('small', null, t('rowWireSub')))]
      .concat(pad(cells, s.wire.length), [h('span', { class: 'en-note-empty' }),
        h('span', { class: 'en-note-empty' }), h('div', { class: 'en-arrow' }, t('firstSent')), h('span', { class: 'en-note-empty' })]);
  }

  function readBlock(s, p, changed) {
    var cells = s.readBytes.map(function (b, k) { return cell(s, b, s.sigRead[k], null, s.text ? String.fromCharCode(b) : null, hx2(b)); });
    var how = s.text ? h('span', { class: 'en-fn', dataset: { raw: '' } }, t('readText'))
      : s.convert ? h('span', { class: 'en-fn', translate: 'no' }, s.fn + '(x)')
      : h('span', { class: 'en-fn', dataset: { raw: '' } }, t.parts('readRaw', { fn: data(s.fn) }));
    var res;
    if (s.text) {
      res = h('div', { class: 'en-res' }, h('div', { class: 'en-res-main' }, '= ', data(t('quoted', { s: s.text }))));
    } else {
      var main = h('div', { class: 'en-res-main' }, '= ', data(hexOf(s.read, s.width)), ' = ', data(grouped(s.read)),
        s.dottedRead ? [' = ', data(s.dottedRead)] : null);
      var other = s.convert ? s.readAs.withoutConversion : s.readAs.withConversion;
      var otherLine = h('div', { class: 'en-other' },
        t.parts(s.convert ? 'otherWithout' : 'otherWith', { fn: data(s.fn) }), ' ',
        s.differs ? [data(hexOf(other, s.width)), ' = ', data(grouped(other)), s.dottedOther ? [' = ', data(s.dottedOther)] : null]
          : t('same'));
      res = h('div', { class: 'en-res' }, main, otherLine);
    }
    return h('div', { class: 'en-read' + (changed ? ' sd-changed' : ''), dataset: { changed: changed ? '1' : '' } },
      h('div', { class: 'en-lbl' }, h('b', null, t('rowRead')), h('small', null, t('rowReadSub', { from: addr(0) })), how),
      pad(cells, s.readBytes.length), h('span', { class: 'en-note-empty' }), res);
  }

  function renderValue(s, p) {
    var head = h('span', { class: 'en-val-head' }, t('valueHead'), ' ', h('small', null, s.text ? t('textValue') : t.n('bits', s.width)));
    if (s.text) {
      valBox.replaceChildren(head, data(t('quoted', { s: s.text }), 'en-val-big'));
      return;
    }
    var kids = [head, data(hexOf(s.value, s.width), 'en-val-big'),
      h('span', { class: 'en-eq' }, '= ', data(grouped(s.value)), ' ', h('small', null, t('dec')),
        s.dotted ? [' = ', data(s.dotted), ' ', h('small', null, t('dotted'))] : null)];
    if (s.cut) kids.push(h('span', { class: 'en-cut' }, t('cut', { bits: t.n('bits', s.width) })));
    valBox.replaceChildren.apply(valBox, kids);
  }

  function syncInput(p) {
    // While the field has focus it is the source, unless a preset or the select moved off the typed value.
    var want = p.value === 'typed' ? (p.hex || '') : '';
    if (document.activeElement === input && p.value === 'typed' && L.cleanHex(input.value) === want) return;
    if (input.value !== want) input.value = want;
  }

  // ?hex= is the page's own state (the kit keeps only its params in the URL and leaves other keys alone)
  function writeHex(p) {
    try {
      var u = new URLSearchParams(window.location.search);
      if (p.value === 'typed' && p.hex) u.set('hex', p.hex); else u.delete('hex');

    } catch (e) { /* file:// in some browsers */ }
  }

  var presetList = L.presets.map(function (pr) {
    return { id: pr.id, label: t('preset_' + pr.id), hint: t('hint_' + pr.id), params: pr.params };
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'value', type: 'select', label: t('value'), options: L.VALUE_IDS.map(function (v) { return [v, t('value_' + v)]; }) },
      { key: 'width', type: 'choice', label: t('width'), options: [[16, t.n('bits', 16)], [32, t.n('bits', 32)]],
        disabled: function (p) { return isText(p) ? t('textNoWidth') : false; } },
      { key: 'host', type: 'choice', label: t('host'), options: [['little', t('little')], ['big', t('big')]] },
      { key: 'convert', type: 'toggle', label: t('convert'), hint: t('convertHint'),
        disabled: function (p) { return isText(p) ? t('textNoConvert') : false; } }

    presets: presetList,

    legend: [
      { c: 1, shape: 'msb', label: t('legendMsb') },

      var grid = h('div', { class: 'en-grid' }, memRow(s, 'big'), memRow(s, 'little'), wireRow(s), readBlock(s, p, changed));
      body.replaceChildren(grid);
      if (root.parentNode !== c.stage) c.stage.replaceChildren(root);
      writeHex(p);
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      var b = function (x) { return h('b', { translate: 'no' }, x); };
      var fn = function () { return h('code', null, s.fn); };
      if (s.text) return t.parts('capText', { v: b(t('quoted', { s: s.text })), bytes: b(bytesText(s.wire)) });
      var parts = t.parts(p.value === 'ipv4' && s.width === 32 ? 'capWireAddr' : 'capWireValue',
        { v: b(numberText(s.value, s, p)), bytes: b(bytesText(s.wire)) });
      parts.push(' ');
      var same = bytesText(s.bytesLE) === bytesText(s.bytesBE);
      parts = parts.concat(t.parts(s.hostOrder === 'big' ? 'capBig' : same ? 'capLittleSame' : 'capLittle', { bytes: b(bytesText(s.hostBytes)) }));
      parts.push(' ');
      if (!s.differs && s.hostOrder === 'big') parts = parts.concat(t.parts('capNoop', { fn: fn(), r: b(numberText(s.read, s, p)) }));
      else parts = parts.concat(t.parts(s.convert ? 'capConv' : 'capRaw', { fn: fn(), r: b(numberText(s.read, s, p)) }));
      return parts;
    }
  });

  // A link with ?value=typed&hex= opens on that typed value (read before the first render rewrote the URL).
  if (urlQuery.get('value') === 'typed' && urlQuery.get('hex')) sim.set({ hex: L.cleanHex(urlQuery.get('hex')) });
})();
</script>
