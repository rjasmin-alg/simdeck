<!-- cmp-bia: a business impact analysis sets each business process's maximum tolerable downtime (MTD); a supporting
     system inherits the shortest MTD of every process that depends on it, so the infrastructure ends up most urgent;
     its RTO must be below that, and the gap between required and achieved recovery is the work list.
     The stage: two numbers (processes within MTD, the work list) and the recovery order; the dependency graph in three
     rows (processes with their MTD stepper and when they are back; applications and infrastructure with the required
     RTO, the process it comes from, today's recovery stepper and the gap), lines for "depends on", dashed where the
     analysis ignores them; ⇣ on a card edits what it depends on. Model: sim.js; rules: SPEC.md; words: strings.js. -->

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function b(text) { return h('b', null, text); }
  /** Hours: under two days, or not whole days, as hours; else days. */
  function dur(n) { return n >= 48 && n % 24 === 0 ? t.n('days', n / 24, { n: n / 24 }) : t('hours', { n: n }); }
  function nameOf(id) { return L.SYSTEMS.indexOf(id) >= 0 ? t('sys_' + id) : t('proc_' + id); }
  function shortOf(id) { return t('short_' + id); }
  function list(ids, f) { return ids.map(f || nameOf).join(', '); }

  var sim = null;
  var sel = null;                                     // the card whose dependencies are being drawn (page state only)
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to the same button
  function btn(key, attrs, run, kids) {
    return h('button', Object.assign({ type: 'button', class: 'bi-b', onmousedown: noFocus, dataset: { sel: key },
      onclick: function (e) {
        if (this.getAttribute('aria-disabled') === 'true') return;
        refocus = e.detail === 0 ? key : null; run();
      } }, attrs), kids);
  }
  /** A − value + stepper over a list of values. */
  function stepper(key, values, value, down, up) {
    function move(dir) { return function () { var o = {}; o[key] = L.stepList(values, sim.params[key], dir); sim.set(o); }; }
    return h('span', { class: 'bi-step' },
      btn(key + '-', { 'aria-label': down, 'aria-disabled': String(value <= values[0]) }, move(-1), '−'),
      h('span', { class: 'bi-sv bi-num' }, dur(value)),
      btn(key + '+', { 'aria-label': up, 'aria-disabled': String(value >= values[values.length - 1]) }, move(1), '+'));
  }

  // ── the numbers and the order ──

  function top(s) {
    var m = s.m, by = byId(s);
    var late = s.procs.filter(function (x) { return !x.within; }).map(function (x) { return x.id; });
    var chips = s.order.map(function (id) {
      var x = by[id];
      return h('li', { class: 'bi-chip', dataset: { st: x.req === null ? 'none' : x.gap > 0 ? 'gap' : 'ok' } },
        h('b', { class: 'bi-num' }, String(x.pos)), shortOf(id));
    });
    return h('div', { class: 'bi-top' },
      h('div', { class: 'bi-k', dataset: { kind: late.length ? 'bad' : 'good' } }, h('span', null, t('kWithin')),
        h('b', { class: 'bi-num', translate: 'no' }, m.within + ' / ' + s.procs.length),
        h('small', null, late.length ? t.n('kWithinLate', late.length, { n: late.length }) : t('kWithinAll'))),
      h('div', { class: 'bi-k', dataset: { kind: m.work.length ? 'bad' : 'plain' } }, h('span', null, t('kWork')),
        h('b', { class: 'bi-num' }, t.n('workItems', m.work.length, { n: m.work.length })),
        h('small', null, m.worst ? t('kWorkSub', { name: shortOf(m.worst), gap: t('gap', { t: dur(by[m.worst].gap) }) }) : t('kWorkNone'))),
      h('div', { class: 'bi-k' }, h('span', null, t('kOrder')), h('ol', { class: 'bi-ord' }, chips)));
  }

  // ── the graph ──

  function byId(s) { var o = {}; s.sys.forEach(function (x) { o[x.id] = x; }); return o; }
  function layerOf(id) {
    if (L.PROCS.some(function (x) { return x.id === id; })) return 'proc';
    return L.APPS.some(function (x) { return x.id === id; }) ? 'app' : 'infra';
  }
  var below = { proc: 'app', app: 'infra' };

  /** ⇣ on a process or application card: start or stop drawing its dependencies. */
  function linkBtn(id) {
    return btn('link-' + id, { 'aria-label': t('linkBtn', { name: nameOf(id) }), 'aria-pressed': String(sel === id) },
      function () { sel = sel === id ? null : id; sim.render(); }, '⇣');
  }
  /** On a card in the row below the one being drawn: does the selected card depend on this one? */
  function depBtn(id) {
    var on = L.hasEdge(sim.params, sel, id);
    return btn('dep-' + id, {
      'aria-pressed': String(on), 'aria-label': t(on ? 'depOn' : 'depOff', { from: nameOf(sel), to: nameOf(id) }),
      dataset: { sel: 'dep-' + id, k: 'dep' }
    }, function () { sim.set(L.toggle(sim.params, sel, id)); }, on ? '✓' : '+');
  }
  function nameRow(id, pos) {
    var layer = layerOf(id);
    var kids = [pos !== undefined ? h('span', { class: 'bi-pos bi-num', 'aria-hidden': 'true' }, String(pos)) : null, b(nameOf(id))];
    if (sel && below[layerOf(sel)] === layer) kids.push(depBtn(id));
    else if (below[layer]) kids.push(linkBtn(id));
    return h('div', { class: 'bi-name' }, kids);
  }
  function needs(s, id) {
    var d = s.adj[id];
    return h('div', { class: 'bi-needs' }, d.length ? t('needs', { list: list(d, shortOf) }) : t('needsNone'));
  }

  function procCard(s, x) {
    var p = s.p, key = L.procKey(x.id);
    return h('div', { class: 'bi-card', role: 'group', dataset: { st: x.within ? 'ok' : 'late', sel: String(sel === x.id) },
      'aria-label': t('cardProc', { name: nameOf(x.id), mtd: dur(x.mtd), back: dur(x.back), ok: t(x.within ? 'okWithin' : 'okLate') }) },
      nameRow(x.id),
      h('div', { class: 'bi-line' }, h('span', null, t('mtd')),
        stepper(key, L.MTD_STEPS, p[key], t('mtdDown', { name: nameOf(x.id) }), t('mtdUp', { name: nameOf(x.id) }))),
      h('div', { class: 'bi-line' }, h('span', null, t('back', { t: dur(x.back) })),
        h('span', { class: 'bi-mark', dataset: { k: x.within ? 'ok' : 'late' } }, x.within ? '✓' : '✕')),
      needs(s, x.id));
  }

  function sysCard(s, x) {
    var p = s.p, key = L.sysKey(x.id), st = x.req === null ? 'none' : x.gap > 0 ? 'gap' : 'ok';
    var req = x.req === null ? b(t('reqNone')) : b(t('req', { t: dur(x.req) }));
    var from = h('div', { class: 'bi-from' }, x.req === null ? (x.users.length ? t('reqNoneWhy') : t('reqUnused'))
      : t('reqFrom', { proc: nameOf(x.from) }));
    var mark = st === 'gap' ? h('span', { class: 'bi-mark bi-num', dataset: { k: 'gap' } }, t('gap', { t: dur(x.gap) }))
      : st === 'ok' ? h('span', { class: 'bi-mark', dataset: { k: 'ok' } }, '✓') : null;
    return h('div', { class: 'bi-card', role: 'group', dataset: { st: st, sel: String(sel === x.id) },
      'aria-label': t('cardSys', { name: nameOf(x.id), req: x.req === null ? t('reqNone') : t('req', { t: dur(x.req) }),
        ach: dur(x.ach), ok: st === 'gap' ? t('okGap', { t: dur(x.gap) }) : st === 'ok' ? t('okWithin') : t('okNone'), pos: x.pos }) },
      nameRow(x.id, x.pos),
      h('div', { class: 'bi-req' }, req, mark),
      from,
      h('div', { class: 'bi-line' }, h('span', null, t('today')),
        stepper(key, L.ACH_STEPS, p[key], t('achDown', { name: nameOf(x.id) }), t('achUp', { name: nameOf(x.id) }))),
      needs(s, x.id));
  }

  /** Column centres in the edge band: process and application k at (2k + 1) × 10 %, infrastructure at 30, 50, 70 %. */
  function cx(id) {
    var i = L.PROCS.findIndex(function (x) { return x.id === id; });
    if (i < 0) i = L.APPS.findIndex(function (x) { return x.id === id; });
    if (i < 0) i = 1 + L.INFRA.findIndex(function (x) { return x.id === id; });
    return (2 * i + 1) * 10;
  }
  var SVG = 'http://www.w3.org/2000/svg';
  function edges(s, upper, lower, row, ignored) {
    var svg = document.createElementNS(SVG, 'svg'), top = [];
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    upper.forEach(function (u) {
      lower.forEach(function (d) {
        if (!L.hasEdge(s.p, u.id, d.id)) return;
        var l = document.createElementNS(SVG, 'line');
        [['x1', cx(u.id)], ['y1', 0], ['x2', cx(d.id)], ['y2', 100], ['vector-effect', 'non-scaling-stroke'],
          ['data-k', sel === u.id ? 'sel' : ignored ? 'ignored' : 'dep']].forEach(function (a) { l.setAttribute(a[0], String(a[1])); });
        if (sel === u.id) top.push(l); else svg.appendChild(l);
      });
    });
    top.forEach(function (l) { svg.appendChild(l); });   // the selected card's lines on top
    return h('div', { class: 'bi-edges', 'aria-hidden': 'true', style: { gridRow: String(row) } }, svg);
  }

  function graph(s) {
    var by = byId(s), kids = [];
    kids.push(h('div', { class: 'bi-row', style: { gridRow: '1' } }, t('rowProcs')));
    s.procs.forEach(function (x, i) {
      kids.push(h('div', { class: 'bi-cell', style: { gridRow: '1', gridColumn: String(i + 2) } }, procCard(s, x)));
    });
    kids.push(edges(s, L.PROCS, L.APPS, 2, false));
    kids.push(h('div', { class: 'bi-row', style: { gridRow: '3' } }, t('rowApps')));
    L.APPS.forEach(function (a, i) {
      kids.push(h('div', { class: 'bi-cell', style: { gridRow: '3', gridColumn: String(i + 2) } }, sysCard(s, by[a.id])));
    });
    kids.push(edges(s, L.APPS, L.INFRA, 4, s.p.mode === 'direct'));
    kids.push(h('div', { class: 'bi-row', style: { gridRow: '5' } }, t('rowInfra')));
    L.INFRA.forEach(function (a, i) {
      var arrow = L.FIXED.some(function (e) { return e[0] === a.id; });
      kids.push(h('div', { class: 'bi-cell', dataset: { layer: 'infra', arrow: String(arrow) }, style: { gridRow: '5', gridColumn: String(i + 3) } },
        sysCard(s, by[a.id])));
    });
    return h('div', { class: 'bi-g' }, kids);
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    var foot = sel ? h('p', { class: 'bi-foot', dataset: { sel: 'true' } }, t('selHint', { name: nameOf(sel) }))
      : h('p', { class: 'bi-foot' }, t('foot'));
    c.stage.replaceChildren(h('div', { class: 'bi' }, top(s), graph(s), foot));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, m = s.m, k = L.captionKey(s), by = byId(s);
    var work = m.work.map(function (id) { return t('workItem', { name: shortOf(id), gap: t('gap', { t: dur(by[id].gap) }) }); }).join(', ');
    var out = t.parts(k.key, { ok: b(String(m.within)), n: b(String(s.procs.length)), work: b(work) });
    var late = s.procs.filter(function (x) { return !x.within; })[0];
    k.notes.forEach(function (key) {
      var v = {};
      if (key === 'nUnrated') {
        var u = L.unratedLate(s), pr = s.procs.filter(function (x) { return x.id === u.proc; })[0];
        v = { sys: b(nameOf(u.sys)), proc: b(nameOf(u.proc)), back: b(dur(pr.back)), mtd: b(dur(pr.mtd)) };
      } else if (key === 'nUnratedAny') {
        var y = by[m.unrated[0]];
        v = { sys: b(nameOf(y.id)), procs: b(list(y.users)) };
      } else if (key === 'nWaits') {
        var a = by[m.broken[0]], w = by[a.waits[a.waits.length - 1]];
        v = { a: b(nameOf(a.id)), pa: b(String(a.pos)), b: b(nameOf(w.id)), pb: b(String(w.pos)) };
      } else if (key === 'nMiss') {
        v = { proc: b(nameOf(late.id)), back: b(dur(late.back)), mtd: b(dur(late.mtd)), sys: b(nameOf(late.slow)), ach: b(dur(by[late.slow].ach)) };
      } else if (key === 'nMargin') {
        var g = by[L.marginGap(s)];
        v = { sys: b(nameOf(g.id)), m: b(dur(s.p.margin)), ach: b(dur(g.ach)), mtd: b(dur(g.req + s.p.margin)), req: b(dur(g.req)) };
      } else if (key === 'nInherit') {
        var x = by[L.inherited(s)];
        v = { sys: b(nameOf(x.id)), req: b(dur(x.req)), proc: b(nameOf(x.from)), mtd: b(dur(x.req + s.p.margin)), m: b(dur(s.p.margin)) };
      }
      out.push(' ');
      out = out.concat(t.parts(key, v));
    });
    return out;
  }

  var hidden = function () { return false; };
  var labels = { direct: 'pDirect', chain: 'pChain', hidden: 'pHidden', fixed: 'pFixed', late: 'pLate' };
  var params = [
    { key: 'mode', type: 'choice', label: t('mode'), hint: t('modeHint'), options: [['direct', t('modeDirect')], ['chain', t('modeChain')]] },
    { key: 'margin', type: 'choice', label: t('margin'), hint: t('marginHint'),
      options: L.MARGINS.map(function (x) { return [x, dur(x)]; }) },
    { key: 'pa', type: 'range', label: t('rowProcs'), min: 0, max: L.PA_MAX, step: 1, visible: hidden },
    { key: 'ai', type: 'range', label: t('rowApps'), min: 0, max: L.AI_MAX, step: 1, visible: hidden }
  ];
  L.PROCS.forEach(function (x) {
    params.push({ key: x.key, type: 'range', label: nameOf(x.id), min: L.MTD_STEPS[0], max: L.MTD_STEPS[L.MTD_STEPS.length - 1], step: 1, visible: hidden });
  });
  L.SYSTEMS.forEach(function (id) {
    params.push({ key: L.sysKey(id), type: 'range', label: nameOf(id), min: L.ACH_STEPS[0], max: L.ACH_STEPS[L.ACH_STEPS.length - 1], step: 1, visible: hidden });
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'bi-line', label: t('legLine') },
      { shape: 'bi-ignored', label: t('legIgnored') },
      { shape: 'bi-ok', label: t('legOk') },
      { shape: 'bi-gap', label: t('legGap') },
      { shape: 'bi-none', label: t('legNone') },
      { shape: 'bi-pos', label: t('legPos') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
