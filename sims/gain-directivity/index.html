<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var D2R = Math.PI / 180;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function sig(x) { var a = Math.abs(x); return num(x, a >= 99.5 ? 0 : a >= 9.95 ? 1 : 2); }   // 3 significant digits
  function watts(w) { return w < 0.9995 ? t('mwatt', { v: sig(w * 1000) }) : t('watt', { v: w >= 1000 ? num(w, 0) : sig(w) }); }
  function dbi(v) { return t('dbi', { v: num(v, 2) }); }
  function dbd(v) { return t('dbd', { v: num(v, 2) }); }
  function dbv(v) { return t('dbVal', { v: num(v, 1) }); }
  function deg(v) { return t('degVal', { v: num(v, Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1) }); }
  function pct(x) { var q = x * 100; return t('pctVal', { v: num(q, q >= 9.95 || Math.abs(q - Math.round(q)) < 0.05 ? 0 : 1) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }

  // ── a polar plot: radius from gain over isotropic (power ratio) in the chosen scale ──
  function radiusFn(st) {
    var sc = st.p.scale, top = st.top, topDb = st.topDb, floor = topDb - 40;
    if (sc === 'field') return function (g) { return g > 0 ? Math.sqrt(g / top) : 0; };
    if (sc === 'power') return function (g) { return Math.min(1, g / top); };
    return function (g) { return g > 0 ? Math.max(0, (10 * Math.log10(g) - floor) / (topDb - floor)) : 0; };
  }

  function polar(box, st, vertical) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'gd-title', x: 0.2 * r0, y: 1.2 * r0 }, t(vertical ? 'vTitle' : 'hTitle')));
    var top = 2.0 * r0, cx = W / 2, cy = top + (H - top) / 2;
    var R = Math.max(10, Math.min(W / 2 - 3.6 * r0, (H - top) / 2 - 1.2 * r0));
    var rf = radiusFn(st), sh = L.shape(st.p), d = st.d, eff = st.eff;
    function P(a, rr) { return [cx + rr * R * Math.cos(a * D2R), cy - rr * R * Math.sin(a * D2R)]; }
    // the relative intensity U at polar angle a (0 = front, counter-clockwise; vertical: 90 = up)
    function U(a) {
      if (!vertical) return L.horiz(sh, a);
      var aa = ((a % 360) + 360) % 360;
      if (aa <= 90 || aa >= 270) return L.vert(sh, aa > 180 ? aa - 360 : aa);           // the front half
      return L.horiz(sh, 180) * L.vert(sh, 180 - aa);                                   // the back half
    }
    function dip(a) { return vertical ? L.dipoleAt(Math.asin(Math.sin(a * D2R)) / D2R) : L.D_DIPOLE; }
    function curve(fn) { var out = []; for (var a = 0; a <= 360; a += 0.5) out.push(P(a, rf(fn(a)))); return out; }

    // rings and labels
    var rings = [];
    if (st.p.scale === 'db') { for (var k = 0; k <= 4; k++) rings.push([st.topDb - 10 * k, (40 - 10 * k) / 40]); }
    else rings.push([null, 1]);
    rings.forEach(function (q) {
      if (q[1] <= 0) return;
      svg.append(s('circle', { class: 'gd-ring', cx: cx, cy: cy, r: q[1] * R }));
    });
    [0, 45, 90, 135].forEach(function (a) {
      var p1 = P(a, 1), p2 = P(a + 180, 1);
      svg.append(s('line', { class: 'gd-spoke', x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }));
    });
    if (st.p.scale === 'db') {
      rings.forEach(function (q, i) {
        if (i % 2 || q[1] <= 0) return;
        var p = P(255, q[1]);
        svg.append(s('text', { class: 'gd-halo gd-mute', x: p[0], y: p[1] + 0.35 * r0, 'text-anchor': 'middle' }, t('ringDbi', { v: num(q[0], 0) })));
      });
    } else {
      var pr = P(255, 1);
      svg.append(s('text', { class: 'gd-halo gd-mute', x: pr[0], y: pr[1] + 1.1 * r0, 'text-anchor': 'middle' }, t('ringX', { v: num(st.top, 0) })));
    }
    // the isotropic radiator and the dipole, fed the same power
    svg.append(s('circle', { class: 'gd-iso', cx: cx, cy: cy, r: rf(1) * R }));
    svg.append(s('polygon', { class: 'gd-dip', points: pts(curve(dip)) }));
    // the directivity (no losses) when there are losses, then the gain
    if (st.lossy) svg.append(s('polygon', { class: 'gd-dir', points: pts(curve(function (a) { return d * U(a); })) }));
    svg.append(s('polygon', { class: 'gd-pat', points: pts(curve(function (a) { return eff * d * U(a); })) }));
    // half-power lines
    var bw = vertical ? st.vbwRead : st.hbwRead;
    if (bw !== null) {
      [bw / 2, -bw / 2].forEach(function (a) {
        var q = P(a, 1.04);
        svg.append(s('line', { class: 'gd-hp', x1: cx, y1: cy, x2: q[0], y2: q[1] }));
      });
      var lq = P(0, 1.04);
      svg.append(s('text', { class: 'gd-halo', x: lq[0] - 0.2 * r0, y: lq[1] - 0.5 * r0, 'text-anchor': 'end' }, deg(bw)));
    }
    // the directions
    var fp = P(0, 1), bp = P(180, 1);
    var out = cx + R + 6.5 * r0 < W;          // room outside the circle (projector); inside on a phone
    svg.append(s('text', { class: 'gd-halo gd-mute', x: fp[0] + (out ? 0.3 : -0.2) * r0, y: fp[1] + 1.4 * r0, 'text-anchor': out ? 'start' : 'end' }, t('front')));
    svg.append(s('text', { class: 'gd-halo gd-mute', x: bp[0] + (out ? -0.3 : 0.2) * r0, y: bp[1] + 1.4 * r0, 'text-anchor': out ? 'end' : 'start' }, t('back')));
    if (vertical) {
      var up = P(90, 1);
      svg.append(s('text', { class: 'gd-halo gd-mute', x: up[0] + 0.4 * r0, y: up[1] + 0.2 * r0 }, t('up')));
    }
    // F/B and the strongest side lobe on the horizontal plot
    if (!vertical && !st.omni) {
      var bq = P(180, 0.62);   // the F/B label above the back axis, clear of the centre's curves
      svg.append(s('text', { class: 'gd-halo', x: bq[0], y: bq[1] - 0.5 * r0, 'text-anchor': 'middle' }, t('fbLabel', { v: dbv(st.fbRead) })));
      var sr = st.side ? rf(eff * d * Math.pow(10, st.side.db / 10)) : 0;
      if (sr > 0.12) {                          // not at the centre (below the dB floor, or tiny on a linear scale)
        var sq = P(st.side.at, sr);
        svg.append(s('circle', { class: 'gd-mark', cx: sq[0], cy: sq[1], r: 0.25 * r0 }));
        svg.append(s('text', { class: 'gd-halo', x: sq[0] + 0.4 * r0, y: sq[1] - 0.4 * r0 }, t('sideLabel', { v: dbv(st.side.db) })));
      }
    }
    svg.append(s('circle', { class: 'gd-ant', cx: cx, cy: cy, r: 0.3 * r0 }));
    box.replaceChildren(svg);
  }

  // ── the power ladder in dBW: levels as bars from the axis, changes as floating bars ──
  function ladder(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), tx = st.tx, svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('defs', null, s('pattern', { id: 'gd-hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
      s('line', { class: 'gd-hatchline', x1: 0, y1: 0, x2: 0, y2: 8 }))));
    svg.append(s('text', { class: 'gd-title', x: 0.2 * r0, y: 1.2 * r0 }, t('ladTitle')));
    var rows = [
      { label: t('ladTx'), level: tx.ptxDbw },
      { label: t('ladCable'), step: -st.p.cable },
      { label: t('ladLoss'), step: tx.effDb },
      { label: t('ladRad'), level: tx.pRadDbw },
      { label: t('ladGain'), step: st.dbi },
      { label: t('ladEirp'), level: tx.eirpDbw, key: true },
      { label: t('ladDip'), step: -L.DBD },
      { label: t('ladErp'), level: tx.erpDbw, key: true }
    ];
    var watt = [tx.ptx, null, null, tx.pRad, null, tx.eirp, null, tx.erp];
    var lv = [], cur = 0;
    rows.forEach(function (r) { if (r.level !== undefined) cur = r.level; else cur += r.step; lv.push(cur); });
    var lo = Math.min.apply(null, lv.concat([0])), hi = Math.max.apply(null, lv);
    lo = 10 * Math.floor((lo - 1) / 10); hi = 10 * Math.ceil((hi + 1) / 10);
    // wide: label | bar | value on one line; narrow (phone): label and value on a line, the bar under them
    var narrow = W < 26 * r0;
    var labW = narrow ? 1.2 * r0 : Math.min(13 * r0, 0.34 * W), valW = narrow ? 1.4 * r0 : 11.2 * r0;
    var x0 = labW, x1 = W - valW, rowH = (H - 3.2 * r0) / rows.length, y0 = 1.8 * r0;
    function X(v) { return x0 + (v - lo) / (hi - lo) * (x1 - x0); }
    for (var g = lo; g <= hi; g += 10) {
      svg.append(s('line', { class: 'gd-grid', x1: X(g), x2: X(g), y1: y0, y2: y0 + rows.length * rowH }));
      svg.append(s('text', { class: 'gd-mute', x: X(g), y: H - 0.3 * r0, 'text-anchor': 'middle' }, num(g, 0)));
    }
    svg.append(s('text', { class: 'gd-mute', x: narrow ? W - 0.3 * r0 : labW - 1.4 * r0, y: H - (narrow ? 1.4 : 0.3) * r0, 'text-anchor': 'end' }, t('dbwTick')));
    var prev = null;
    rows.forEach(function (r, i) {
      var y = y0 + i * rowH, bh = Math.max(4, rowH * (narrow ? 0.3 : 0.62)), by = narrow ? y + rowH - bh - 0.1 * rowH : y + (rowH - bh) / 2;
      var ty = narrow ? y + 1.0 * r0 : y + rowH / 2 + 0.35 * r0, vx = narrow ? W - 0.3 * r0 : x1 + 0.4 * r0, va = narrow ? 'end' : 'start';
      svg.append(s('text', { class: (r.key ? 'gd-title ' : '') + 'gd-halo', x: narrow ? 0.3 * r0 : labW - 0.4 * r0, y: ty, 'text-anchor': narrow ? 'start' : 'end' }, r.label));
      if (r.level !== undefined) {
        svg.append(s('rect', { class: 'gd-level', x: X(lo), y: by, width: Math.max(1, X(r.level) - X(lo)), height: bh }));
        svg.append(s('text', { class: 'gd-mono gd-halo' + (r.key ? ' gd-title' : ''), x: vx, y: ty, 'text-anchor': va },
          t('ladLevel', { db: num(r.level, 1), w: watts(watt[i]) })));
      } else {
        var a = X(prev), b = X(lv[i]), up = lv[i] >= prev;
        svg.append(s('line', { class: 'gd-link', x1: a, x2: a, y1: y - 0.1 * rowH, y2: by }));
        if (Math.abs(b - a) >= 1) svg.append(s('rect', { class: up ? 'gd-up' : 'gd-down', x: Math.min(a, b), y: by, width: Math.abs(b - a), height: bh }));
        svg.append(s('text', { class: 'gd-mono gd-halo', x: vx, y: ty, 'text-anchor': va }, t('ladStep', { v: (r.step >= 0 ? '+' : '') + num(r.step, 2) })));
      }
      prev = lv[i];
    });
    svg.append(s('line', { class: 'gd-axis', x1: X(0), x2: X(0), y1: y0, y2: y0 + rows.length * rowH }));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'gd-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var bwH = st.hbwRead === null ? t('bwAll') : deg(st.hbwRead);
    var bwV = st.vbwRead !== null ? deg(st.vbwRead) : st.omni ? t('bwAll') : t('bwFlat');   // a fan beam: not squeezed
    return h('table', { class: 'gd-table' }, h('tbody', null,
      row(t('rowD'), t('dCell', { d: num(st.d, st.d >= 10 ? 1 : 2), b: dbi(st.dbi) }), true),
      row(t('rowG'), t('gCell', { a: dbi(st.gDbi), b: dbd(st.gDbd) }), true),
      row(t('rowBw'), t('bwCell', { h: bwH, v: bwV })),
      row(t('rowFb'), st.omni ? t('none') : dbv(st.fbRead)),
      row(t('rowSide'), st.side ? dbv(st.side.db) : t('none'))));
  }

  var hasFront = function (p) { return p.hbw < 360; };   // an omni pattern has no back or side lobes (SPEC tie-break 2)
  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'hbw', type: 'range', label: t('hbw'), min: 20, max: 360, step: 5, format: function (v) { return t('degVal', { v: num(v, 0) }); } },
      { key: 'vbw', type: 'range', label: t('vbw'), min: 10, max: 180, step: 5, format: function (v) { return t('degVal', { v: num(v, 0) }); } },
      { key: 'fb', type: 'range', label: t('fb'), min: 0, max: 40, step: 1, visible: hasFront, format: function (v) { return t('dbDown', { v: num(v, 0) }); } },
      { key: 'sll', type: 'range', label: t('sll'), min: -40, max: -10, step: 1, visible: hasFront, format: function (v) { return t('dbVal', { v: num(v, 0) }); } },
      { key: 'eff', type: 'range', label: t('eff'), min: 5, max: 100, step: 5, format: function (v) { return t('pctVal', { v: num(v, 0) }); } },
      { key: 'cable', type: 'range', label: t('cable'), min: 0, max: 10, step: 0.5, format: function (v) { return t('dbVal', { v: num(v, 1) }); } },
      { key: 'ptx', type: 'choice', label: t('ptx'), options: L.PTX.map(function (w) { return [w, t('watt', { v: num(w, 0) })]; }) },
      { key: 'scale', type: 'choice', label: t('scale'), options: [['field', t('scaleField')], ['power', t('scalePower')], ['db', t('scaleDb')]] }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'gd-pat', label: t('legendGain') },
      { shape: 'gd-dir', label: t('legendDir') },
      { shape: 'gd-iso', label: t('legendIso') },
      { shape: 'gd-dip', label: t('legendDipole') },
      { shape: 'gd-hp', label: t('legendHalf') }
    ],

    render: function (c) {
      var hp = h('div', { class: 'gd-pic' }), vp = h('div', { class: 'gd-pic' }), lad = h('div', { class: 'gd-lad' });
      c.stage.replaceChildren(h('div', { class: 'gd' }, hp, vp,
        h('div', { class: 'gd-read' }, table(c.state), h('p', { class: 'gd-units' }, t('units'))), lad));
      polar(hp, c.state, false);
      polar(vp, c.state, true);
      ladder(lad, c.state);
    },

    caption: function (c) {
      var st = c.state, tx = st.tx, p = st.p;
      var b = function (x) { return h('b', null, x); };
      var side = st.side ? st.side.db : null;
      function mk() { return {   // fresh nodes for each sentence: a node can sit in one place only
        d: b(num(st.d, st.d >= 10 ? 1 : 2)), dbi: b(dbi(st.dbi)), dbd: b(dbd(st.dbd)), gdbi: b(dbi(st.gDbi)),
        prad: b(watts(tx.pRad)), eff: b(pct(st.eff)), cable: b(dbv(p.cable)), pant: b(watts(tx.pAnt)), ptx: b(watts(tx.ptx)),
        eirp: b(watts(tx.eirp)), erp: b(watts(tx.erp)), fb: b(dbv(st.fbRead)),
        side: b(side === null ? '' : dbv(side)), floor: b(t('dbi', { v: num(st.topDb - 40, 0) })),
        pct: b(side === null ? '' : pct(Math.pow(10, side / (p.scale === 'field' ? 20 : 10))))
      }; }
      var parts = [];
      function say(key) { if (parts.length) parts.push(' '); parts = parts.concat(t.parts(key, mk())); }
      if (st.kind === 'iso') say('shape_iso');
      else if (st.kind === 'omni') say(st.d >= st.dDipole ? 'shape_omni' : 'shape_omniLow');
      else if (st.kind === 'bidir') say('shape_bidir');
      else if (st.kind === 'broad') say('shape_broad');
      else { say('shape_beam'); if (st.fbTail) say('shape_broadFb'); }
      if (st.lossy) say(st.belowIso ? 'loss_below' : 'loss_some');
      if (p.cable > 0) say('cable_some');
      say('eirp');
      if (st.kind === 'beam') {
        // what shows above the dB plot's floor (the efficiency lowers the lobes, the scale stays: SPEC §6)
        var floor = st.topDb - 40, backUp = st.gDbi - st.fbRead > floor, sideUp = side !== null && st.gDbi + side > floor;
        if (p.scale === 'db') { if (!st.fbTail) say(!backUp ? 'scale_dbFloor' : st.fbLimited ? 'scale_dbTail' : sideUp ? 'scale_db' : 'scale_dbNoSide'); }
        else if (side !== null) say(p.scale === 'field' ? 'scale_field' : 'scale_power');
      }
      return parts;
    }
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; window.simdeck.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { window.simdeck.render(); });
})();
</script>
</body>
</html>
