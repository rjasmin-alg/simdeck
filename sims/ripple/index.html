     An explorer: the rectifier (half-wave, full-wave) and the reservoir capacitor drive the voltage on the load
     (sim.js), drawn over 60 ms; the P button keeps the original's hum, now played from the drawn voltage's AC part.
     The original loaded nothing but Bootstrap classes and MathJax from its host page, so nothing is vendored. -->
<html lang="hr" data-sim="ripple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brujanje i preostala valovitost · simdeck</title>
<meta name="description" content="Brujanje i preostala valovitost: poluvalni ispravljač ostavlja valovitost od 50 Hz, punovalni od 100 Hz; poslušaj je.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "ripple",
  "class": "explorer",
  "title": { "hr": "Brujanje i preostala valovitost", "en": "Mains hum and ripple" },
  "concept": { "hr": "Poluvalno ostaje valovitost 50 Hz, punovalno 100 Hz; zvučnik je čini brujanjem", "en": "Half-wave leaves a 50 Hz ripple, full-wave 100 Hz; a speaker makes it a hum" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="ripple"]; colours only from kit tokens. */
[data-sim="ripple"] .rp { height: 100%; padding: 1.2cqh 1.6cqw; display: flex; flex-direction: column; gap: 0.5rem; box-sizing: border-box; }
[data-sim="ripple"] .rp-read { display: flex; flex-wrap: wrap; gap: 0.2rem 1.6rem; font-size: var(--fs-lg); font-weight: 700; }
[data-sim="ripple"] .rp-read .rp-muted { color: var(--muted); font-weight: 600; }
[data-sim="ripple"] .rp-sound { display: inline-flex; align-items: center; gap: 0.4rem; }
[data-sim="ripple"] .rp-sound svg { width: 1.2em; height: 1.2em; }
[data-sim="ripple"] .rp-plot { position: relative; flex: 1; min-height: 0; }
[data-sim="ripple"] .rp-plot svg { position: absolute; inset: 0; overflow: visible; }
/* R_L, C_L: the subscript keeps the full size, so no text falls under the 16 px floor */
[data-sim="ripple"] sub { font-size: 100%; vertical-align: -0.3em; line-height: 0; }
/* SVG */
[data-sim="ripple"] svg text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--ink); font-weight: 600; }
[data-sim="ripple"] svg text.rp-halo { paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
[data-sim="ripple"] svg text.rp-mut { fill: var(--muted); }
[data-sim="ripple"] svg text.rp-t1 { fill: var(--c1); font-weight: 700; }
[data-sim="ripple"] svg text.rp-t2 { fill: var(--c2); font-weight: 700; }
[data-sim="ripple"] svg text.rp-t3 { fill: var(--c3); font-weight: 700; }
[data-sim="ripple"] svg text.rp-t4 { fill: var(--c4); font-weight: 700; }
[data-sim="ripple"] .rp-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="ripple"] .rp-grid { stroke: var(--line); stroke-width: 1; }
[data-sim="ripple"] .rp-zero { stroke: var(--muted); stroke-width: 1.5; }
/* mains: thin dashed; rectified without C: dotted; the output: thick solid; the DC part: long dashes */
[data-sim="ripple"] .rp-mains { fill: none; stroke: var(--c3); stroke-width: 2; stroke-dasharray: 9 6; }
[data-sim="ripple"] .rp-rect { fill: none; stroke: var(--c2); stroke-width: 3; stroke-dasharray: 2 5; stroke-linecap: round; }
[data-sim="ripple"] .rp-out { fill: none; stroke: var(--c1); stroke-width: 4; stroke-linejoin: round; }
[data-sim="ripple"] .rp-dc { stroke: var(--c4); stroke-width: 2.5; stroke-dasharray: 22 6 4 6; }
[data-sim="ripple"] .rp-band { fill: var(--c1); fill-opacity: 0.12; }
[data-sim="ripple"] .rp-bracket { fill: none; stroke: var(--ink); stroke-width: 2; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="ripple"] .rp-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="ripple"] .rp-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ripple"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="ripple"] .rp { height: auto; padding: 0.6rem; }
  [data-sim="ripple"] .rp-read { font-size: var(--fs-md); }
  [data-sim="ripple"] .rp-plot { flex: none; height: 22rem; }
  [data-sim="ripple"] .rp-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="ripple"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Brujanje i preostala valovitost</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="rp-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var GAIN = 0.3;                           // the AC part is at most ±0.68 Û, so the loudest hum peaks near 0.2 (the original's gain)
  var sim = null;

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function ms(v) { return t('ms', { v: String(v) }); }
  function hz(v) { return t('hz', { v: String(v) }); }
  function pct(st) { return t('pct', { v: String(st.ppPct) }); }
  // R_L, C_L with a subscript, and Û, for the caption's placeholders
  function sym(main, sub) { return h('span', { translate: 'no' }, main, sub ? h('sub', null, sub) : null); }
  // t.parts with a node used by two placeholders ({c} … {c}): the second gets a copy, or the node would move there
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }

  var presetKeys = { half0: 'presetHalf0', full0: 'presetFull0', half: 'presetHalf', full: 'presetFull', big: 'presetBig', ac: 'presetAc' };

  // ── the hum (the original's applet): the AC part of the drawn voltage, looped; off ↔ on ──
  var snd = { ctx: null, src: null, gain: null, key: '' };
  function soundKey(st) { return st.rect + '/' + st.tau; }
  function soundStop() {
    if (snd.src && snd.gain && snd.ctx) {
      var now = snd.ctx.currentTime;
      try {
        snd.gain.gain.cancelScheduledValues(now);
        snd.gain.gain.setValueAtTime(snd.gain.gain.value, now);
        snd.gain.gain.linearRampToValueAtTime(0, now + 0.03);   // a short fade against clicks, as the original
        snd.src.stop(now + 0.04);
      } catch (e) { /* already stopped */ }
    }
    snd.src = null; snd.gain = null; snd.key = '';
  }
  function soundStart(st) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!snd.ctx) snd.ctx = new AC();
    if (snd.ctx.state === 'suspended') snd.ctx.resume();
    soundStop();
    var rate = snd.ctx.sampleRate;
    var one = L.humPeriod(st.rect, st.tau, rate);
    // one second of whole periods, so the loop joins without a click (as the original)
    var buf = snd.ctx.createBuffer(1, one.length * st.f, rate), data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) data[i] = one[i % one.length];
    var src = snd.ctx.createBufferSource(), g = snd.ctx.createGain(), now = snd.ctx.currentTime;
    src.buffer = buf;
    src.loop = true;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(GAIN, now + 0.03);
    src.connect(g);
    g.connect(snd.ctx.destination);
    src.start();
    Object.assign(snd, { src: src, gain: g, key: soundKey(st) });
  }
  function soundToggle() { if (snd.src) soundStop(); else soundStart(sim.state); sim.render(); }

  // ── the plot: the voltage against time, 0 … 60 ms. Normal: −Û … +Û with the mains (dashed), the rectified wave
  //    without C (dotted), the voltage on R (solid) and its DC part. AC coupling: the voltage on R minus its DC part,
  //    enlarged to fill the frame. Above the frame, one ripple period T; below it (normal view), one mains period. ──
  function draw(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), narrow = W < 40 * rem;
    var pad = { l: 2.6 * rem, r: 0.8 * rem, t: 2.6 * rem, b: (st.ac ? 1.8 : 4.2) * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (tm) { return pad.l + tm / L.T_MS * cw; };
    var lim = st.ac ? Math.max(st.acPeak, 0.005) * 1.25 : 1.15;     // the half-height of the frame, in Û
    var off = st.ac ? st.mean : 0;
    var Y = function (v) { return pad.t + ch / 2 - (v - off) / lim * (ch / 2); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var top = [];
    var line = function (pts) { return pts.map(function (q) { return X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1); }).join(' '); };

    svg.append(s('rect', { class: 'rp-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    // time grid every 10 ms, labelled every 10 ms (every 20 ms when narrow)
    for (var tm = 0; tm <= L.T_MS; tm += 10) {
      svg.append(s('line', { class: 'rp-grid', x1: X(tm), x2: X(tm), y1: pad.t, y2: pad.t + ch }));
      if (!narrow || tm % 20 === 0) {
        top.push(s('text', { class: 'rp-mut', x: X(tm), y: pad.t + ch + 1.2 * rem, 'text-anchor': tm === 0 ? 'start' : tm === L.T_MS ? 'end' : 'middle', translate: 'no' },
          tm === 0 && !narrow ? t('axisT') + ' = 0' : tm === 0 ? '0' : ms(tm)));
      }
    }
    if (st.ac) {
      // AC coupling: zero is the DC part; ticks at the ripple's top and bottom, in % of Û
      svg.append(s('line', { class: 'rp-zero', x1: pad.l, x2: pad.l + cw, y1: Y(off), y2: Y(off) }));
      top.push(s('text', { class: 'rp-mut', x: pad.l - 0.3 * rem, y: Y(off) + 0.35 * rem, 'text-anchor': 'end', translate: 'no' }, '0'));
      top.push(s('text', { class: 'rp-mut rp-halo', x: pad.l + cw - 0.4 * rem, y: pad.t + ch - 0.5 * rem, 'text-anchor': 'end' }, t('axisAc')));
      svg.append(s('polyline', { class: 'rp-out', points: line(st.out) }));
    } else {
      [1, -1].forEach(function (v) { svg.append(s('line', { class: 'rp-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) })); });
      svg.append(s('line', { class: 'rp-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
      top.push(s('text', { class: 'rp-mut', x: pad.l - 0.3 * rem, y: Y(1) + 0.35 * rem, 'text-anchor': 'end', translate: 'no' }, '+Û'),
        s('text', { class: 'rp-mut', x: pad.l - 0.3 * rem, y: Y(0) + 0.35 * rem, 'text-anchor': 'end', translate: 'no' }, '0'),
        s('text', { class: 'rp-mut', x: pad.l - 0.3 * rem, y: Y(-1) + 0.35 * rem, 'text-anchor': 'end', translate: 'no' }, '−Û'));
      // the ripple band: between the output's lowest and highest value
      if (st.cap) svg.append(s('rect', { class: 'rp-band', x: pad.l, y: Y(1), width: cw, height: Y(st.min) - Y(1) }));
      svg.append(s('polyline', { class: 'rp-mains', points: line(st.mains) }),
        s('polyline', { class: 'rp-rect', points: line(st.rectified) }),
        s('line', { class: 'rp-dc', x1: pad.l, x2: pad.l + cw, y1: Y(st.mean), y2: Y(st.mean) }),
        s('polyline', { class: 'rp-out', points: line(st.out) }));
      // labels on the curves: the mains at its first trough; the DC part at the right end, under the ripple band (with
      // C) or above its line (without), clear of the output
      if (!narrow) top.push(s('text', { class: 'rp-t3 rp-halo', x: X(15), y: Y(-1) + 1.4 * rem, 'text-anchor': 'middle' }, t('legendMains')));
      top.push(s('text', { class: 'rp-t4 rp-halo', x: pad.l + cw - 0.4 * rem, y: st.cap ? Y(st.min) + 1.3 * rem : Y(st.mean) - 0.5 * rem, 'text-anchor': 'end' }, t('legendDc')));
      // one mains period below the frame: 5 … 25 ms (peak to peak)
      var yb = pad.t + ch + 2.2 * rem;
      svg.append(s('path', { class: 'rp-bracket', d: 'M' + X(5) + ',' + (yb - 0.4 * rem) + 'v' + 0.4 * rem + 'H' + X(25) + 'v' + (-0.4 * rem) }));
      top.push(s('text', { class: 'rp-t3', x: X(15), y: yb + 1.3 * rem, 'text-anchor': 'middle' }, t('bracketMains')));
    }
    // one ripple period above the frame, from one peak of the output to the next
    var p0 = 5, p1 = 5 + st.periodMs, ya = pad.t - 0.6 * rem;
    svg.append(s('path', { class: 'rp-bracket', d: 'M' + X(p0) + ',' + (ya + 0.4 * rem) + 'v' + (-0.4 * rem) + 'H' + X(p1) + 'v' + 0.4 * rem }));
    top.push(s('text', { class: 'rp-t1', x: X(p1) + 0.5 * rem, y: ya + 0.3 * rem, translate: 'no' }, t('bracketRipple', { t: ms(st.periodMs) })));
    top.forEach(function (n) { svg.append(n); });
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'rect', type: 'choice', label: t('rect'), hint: t('rectHint'),
        options: L.RECTS.map(function (k) { return [k, t(k === 'full' ? 'rectFull' : 'rectHalf')]; }) },
      { key: 'tau', type: 'range', label: t('tau'), hint: t('tauHint'), min: L.TAU_MIN, max: L.TAU_MAX, step: L.TAU_STEP,
        format: function (v) { return v > 0 ? ms(v) : t('tauNone'); } },
      { key: 'ac', type: 'toggle', label: t('ac'), hint: t('acHint') },
      { key: 'p', type: 'button', label: t('sound'), run: soundToggle }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 3, shape: 'hollow', label: t('legendMains') },
      { c: 2, shape: 'round', label: t('legendRect') },
      { c: 1, label: t('legendOut') },
      { c: 4, shape: 'hollow', label: t('legendDc') }
    ],

    render: function (c) {
      var st = c.state;
      // a changed rectifier or capacitor changes the hum while it plays
      if (snd.src && snd.key !== soundKey(st)) soundStart(st);
      var plot = h('div', { class: 'rp-plot' });
      var read = [
        h('span', { translate: 'no' }, t('readF', { f: hz(st.f) })),
        h('span', { translate: 'no' }, t('readT', { t: ms(st.periodMs) })),
        h('span', { class: 'rp-muted' }, t('readPp', { v: pct(st) })),
        h('span', { class: 'rp-muted' }, t('readMean', { v: t('pct', { v: String(st.meanPct) }) })),
        h('span', { class: 'rp-muted rp-sound' }, snd.src ? t('readPlaying', { f: hz(st.f) }) : t('readSilent'))
      ];
      c.stage.replaceChildren(h('div', { class: 'rp' }, h('div', { class: 'rp-read' }, read), plot));
      draw(plot, st);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var v = { r: sym('R', 'L'), c: sym('C', 'L'), u: sym('Û'), f: b(hz(st.f)) };
      var out;
      if (!st.cap) out = [parts(st.rect === 'full' ? 'captionFull0' : 'captionHalf0', v)];
      else {
        out = [parts('captionCap', Object.assign({}, v, { tau: b(ms(st.tau)), pp: b(pct(st)) }))];
        if (st.rect === 'half') out.push(parts('captionHalfCap', { c: sym('C', 'L') }));
        else if (st.tau >= 100) out.push(t('captionBig'));
      }
      if (st.ac) out.push(t('captionAc'));
      return out;
    }
  });

  // Hidden page: no hum in the background.
  document.addEventListener('visibilitychange', function () { if (document.hidden && snd.src) { soundStop(); sim.render(); } });

  // The plot is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
