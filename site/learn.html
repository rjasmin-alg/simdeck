<!doctype html>

<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>/* A lecture link from before the finder moved (?set=…) opens in the finder, as it did on the old home page. */ if (/[?&]set=/.test(location.search)) location.replace('{{FINDER}}index.html' + location.search + location.hash);</script>
<style>{{CSS}}</style>
<script>{{LANGJS}}</script>
</head>
<body>
<header class="hero">
  <div class="brand">
    <p class="name">{{TITLE}}</p>
    <h1>{{ASK}}</h1>
    <p class="lead">{{LEAD}}</p>
  </div>
  {{SWITCH}}
</header>
<div class="bar">
  <form class="search" action="{{FINDER}}index.html" method="get" role="search">
    <input id="learn-q" name="q" type="search" placeholder="{{SEARCH}}" aria-label="{{SEARCH}}" data-t-attr="placeholder aria-label" data-hr="{{SEARCH_HR}}" data-en="{{SEARCH_EN}}" autocomplete="off" spellcheck="false"><input type="hidden" name="lang" value="{{LANG}}" id="learn-lang"><kbd aria-hidden="true">/</kbd>
  </form>
  <a class="finder" data-lang-link href="{{FINDER}}index.html"><strong>{{FIND}} →</strong> <span>{{FIND_HINT}}</span></a>
  <p class="count">{{COUNT}}</p>
</div>
<main id="learn">{{TREE}}</main>
<footer>{{FOOTER}}</footer>
<script>{{SCRIPT}}</script>
</body>
</html>
