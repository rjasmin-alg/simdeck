<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var R = 44; // state radius, in diagram units

  function s(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    for (var k in attrs || {}) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
    return el;
  }
  function data(text) { return h('span', { translate: 'no', class: 'au-data' }, text); }
  function bold(text) { return h('b', { translate: 'no' }, text); }
  function cap(m) { return m.charAt(0).toUpperCase() + m.slice(1); }
  function wordOf(w) { return w === '' ? 'ε' : w; }

  // ── the four diagrams: states { id: [x, y, accepting, sink] } and transitions, in a W × H box ──
  // Transition labels are data (symbols, stack actions, head moves) and the same in both languages.
  var DIAGRAMS = {
    dfa: {
      W: 1000, H: 380, start: 'q0',
      nodes: { q0: [95, 110], q1: [230, 110], q2: [365, 110], q3: [500, 110], q4: [635, 110], q5: [770, 110],
        q6: [905, 110, true], dead: [500, 285, false, true] },
      edges: [
        ['q0', 'q1', 'b'], ['q1', 'q2', 'a'], ['q2', 'q3', 'n'], ['q3', 'q4', 'a'], ['q4', 'q5', 'n'], ['q5', 'q6', 'a'],
        ['q0', 'dead', '≠ b', { at: 0.42 }], ['q1', 'dead', '≠ a', { at: 0.42 }], ['q2', 'dead', '≠ n', { at: 0.42 }],
        ['q3', 'dead', '≠ a', { at: 0.45 }], ['q4', 'dead', '≠ n', { at: 0.42 }], ['q5', 'dead', '≠ a', { at: 0.42 }],
        ['q6', 'dead', 'Σ', { at: 0.42 }], ['dead', 'dead', 'Σ', { loop: 'down' }]
      ]
    },
    nfa: {
      W: 1000, H: 300, start: 'q0',
      nodes: { q0: [140, 190], q1: [390, 190], q2: [640, 190], q3: [890, 190, true] },
      edges: [['q0', 'q0', 'Σ', { loop: 'up' }], ['q0', 'q1', 'a'], ['q1', 'q2', 'n'], ['q2', 'q3', 'a']]
    },
    pda: {
      W: 1000, H: 300, start: 'q0',
      nodes: { q0: [140, 190], q1: [390, 190], q2: [640, 190], q3: [890, 190, true] },
      edges: [['q0', 'q1', 'b; push $'], ['q1', 'q1', 'a; push A', { loop: 'up' }], ['q1', 'q2', 'n'],
        ['q2', 'q2', 'a; pop A', { loop: 'up' }], ['q2', 'q3', 'ε, $; pop $']]
    },
    tm: {
      W: 1000, H: 530, start: 'q0',
      nodes: { q0: [140, 260], qA: [400, 260], qAN: [660, 260], ACCEPT: [895, 260, true], REJECT: [560, 480, false, true] },
      edges: [
        ['q0', 'q0', '≠ a / R', { loop: 'down' }], ['q0', 'qA', 'a / R'], ['qA', 'qA', 'a / R', { loop: 'up' }],
        ['qA', 'qAN', 'n / R'], ['qAN', 'ACCEPT', 'a / R'],
        ['qA', 'q0', '≠ a, n / R', { bend: 55 }], ['qAN', 'q0', '≠ a / R', { bend: 150 }],
        ['q0', 'REJECT', '□', { at: 0.35 }], ['qA', 'REJECT', '□', { at: 0.4 }], ['qAN', 'REJECT', '□', { at: 0.4 }]
      ]
    }
  };

  /** Point on a circle around (cx, cy) toward (tx, ty). */
  function rim(cx, cy, tx, ty, r) {
    var dx = tx - cx, dy = ty - cy, d = Math.sqrt(dx * dx + dy * dy) || 1;
    return [cx + dx / d * r, cy + dy / d * r];
  }

  /** One transition as SVG path, arrow head and label position. */
  function edgeGeom(D, e) {
    var a = D.nodes[e[0]], b = D.nodes[e[1]], o = e[3] || {};
    var path, tip, lab, dir;
    if (o.loop) {
      var sg = o.loop === 'down' ? 1 : -1;
      var x = a[0], y = a[1];
      var p0 = [x - 18, y + sg * (R - 4)], p1 = [x + 18, y + sg * (R - 4)];
      var c0 = [x - 60, y + sg * (R + 75)], c1 = [x + 60, y + sg * (R + 75)];
      path = 'M ' + p0 + ' C ' + c0 + ' ' + c1 + ' ' + p1;
      tip = p1; dir = [p1[0] - c1[0], p1[1] - c1[1]];
      lab = [x, y + sg * (R + 66)];
    } else if (o.bend) {
      var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      var nx = -(b[1] - a[1]), ny = b[0] - a[0], nl = Math.sqrt(nx * nx + ny * ny);
      var c = [mx + nx / nl * o.bend * 2, my + ny / nl * o.bend * 2];
      var s0 = rim(a[0], a[1], c[0], c[1], R), s1 = rim(b[0], b[1], c[0], c[1], R);
      path = 'M ' + s0 + ' Q ' + c + ' ' + s1;
      tip = s1; dir = [s1[0] - c[0], s1[1] - c[1]];
      lab = [0.25 * s0[0] + 0.5 * c[0] + 0.25 * s1[0], 0.25 * s0[1] + 0.5 * c[1] + 0.25 * s1[1]];
    } else {
      var q0 = rim(a[0], a[1], b[0], b[1], R), q1 = rim(b[0], b[1], a[0], a[1], R);
      path = 'M ' + q0 + ' L ' + q1;
      tip = q1; dir = [q1[0] - q0[0], q1[1] - q0[1]];
      var at = o.at == null ? 0.5 : o.at;
      lab = [q0[0] + (q1[0] - q0[0]) * at, q0[1] + (q1[1] - q0[1]) * at - (o.at == null && a[1] === b[1] ? 22 : 0)];
    }
    return { path: path, tip: tip, dir: dir, lab: lab };
  }

  function arrowHead(tip, dir, hot) {
    var l = Math.sqrt(dir[0] * dir[0] + dir[1] * dir[1]) || 1, ux = dir[0] / l, uy = dir[1] / l;
    var len = hot ? 22 : 16, wid = hot ? 11 : 8;
    var bx = tip[0] - ux * len, by = tip[1] - uy * len;
    var pts = [tip, [bx - uy * wid, by + ux * wid], [bx + uy * wid, by - ux * wid]];
    return s('polygon', { points: pts.map(String).join(' '), class: 'au-tip' + (hot ? ' au-hot' : '') });
  }

  function diagram(st) {
    var D = DIAGRAMS[st.machine];
    var now = st.machine === 'nfa' ? st.active : [st.state];
    var hot = {};
    (st.ev ? st.ev.edges : []).forEach(function (p) { hot[p[0] + '>' + p[1]] = true; });
    var svg = s('svg', { viewBox: '0 0 ' + D.W + ' ' + D.H, 'aria-hidden': 'true' });
    var box = h('div', { class: 'au-draw', style: { '--ar': D.W + ' / ' + D.H } }, svg);
    var label = function (x, y, text, cls) {
      box.append(h('span', { class: 'au-lbl' + (cls ? ' ' + cls : ''), translate: 'no', style: { left: (x / D.W * 100) + '%', top: (y / D.H * 100) + '%' } }, text));
    };
    // the start arrow
    var st0 = D.nodes[D.start];
    svg.append(s('path', { d: 'M ' + (st0[0] - R - 55) + ',' + st0[1] + ' L ' + (st0[0] - R) + ',' + st0[1], class: 'au-edge' }));
    svg.append(arrowHead([st0[0] - R, st0[1]], [1, 0], false));
    // transitions: cold ones first, so a hot one is drawn on top
    var edges = D.edges.slice().sort(function (x, y) { return (hot[x[0] + '>' + x[1]] ? 1 : 0) - (hot[y[0] + '>' + y[1]] ? 1 : 0); });
    edges.forEach(function (e) {
      var g = edgeGeom(D, e), on = !!hot[e[0] + '>' + e[1]];
      svg.append(s('path', { d: g.path, class: 'au-edge' + (on ? ' au-hot' : '') }));
      svg.append(arrowHead(g.tip, g.dir, on));
    });
    // labels after the lines, in the original order (stable positions)
    D.edges.forEach(function (e) {
      var g = edgeGeom(D, e), on = !!hot[e[0] + '>' + e[1]];
      label(g.lab[0], g.lab[1], e[2], on ? 'sd-hl au-hot' : '');
    });
    Object.keys(D.nodes).forEach(function (id) {
      var n = D.nodes[id], isNow = now.indexOf(id) >= 0;
      svg.append(s('circle', { cx: n[0], cy: n[1], r: R, class: 'au-node' + (n[3] ? ' au-sink' : '') + (isNow ? ' au-now' : '') }));
      if (n[2]) svg.append(s('circle', { cx: n[0], cy: n[1], r: R - 8, class: 'au-ring' }));
      label(n[0], n[1], id, 'au-state' + (isNow ? ' au-now' : ''));
    });
    return h('div', { class: 'au-diag' }, box);
  }

  // ── input or tape, memory, result ──
  function tapeBox(st) {
    var cells = L.tape(st);
    var row = h('div', { class: 'au-row', translate: 'no' });
    if (!cells.length) row.append(h('span', { class: 'au-cell au-at' }, 'ε'));
    cells.forEach(function (c, i) {
      var at = i === st.pos && !(st.done && st.machine !== 'tm');
      row.append(h('span', { class: 'au-col' },
        h('span', { class: 'au-headmark', 'aria-hidden': 'true' }, at ? '▼' : ''),
        h('span', { class: 'au-cell' + (i < st.pos ? ' au-read' : '') + (at ? ' au-at' : '') }, c)));
    });
    return h('div', { class: 'au-box' }, h('span', { class: 'au-head' }, t(st.machine === 'tm' ? 'tape' : 'input')), row);
  }

  function memoryBox(st, c) {
    var row = h('div', { class: 'au-row', translate: 'no' }), head;
    if (st.machine === 'pda') {
      head = t('stack');
      if (!st.stack.length) row.append(h('span', { class: 'au-empty', translate: 'yes' }, t('stackEmpty')));
      var grew = c.prev && st.stack.length > c.prev.stack.length;
      st.stack.forEach(function (x, i) {
        var isTop = i === st.stack.length - 1;
        row.append(h('span', { class: 'au-chip' + (isTop ? ' au-top-of' : '') + (isTop && grew ? ' sd-changed' : '') }, x));
      });
    } else if (st.machine === 'nfa') {
      head = t('active');
      if (!st.active.length) row.append(h('span', { class: 'au-empty', translate: 'yes' }, t('noActive')));
      st.active.forEach(function (q) { row.append(h('span', { class: 'au-chip sd-hl' }, q)); });
    } else {
      head = t('path');
      var path = st.path.slice(-7), cut = st.path.length > path.length;
      if (cut) row.append(h('span', { class: 'au-arrow' }, '… →'));
      path.forEach(function (q, i) {
        if (i) row.append(h('span', { class: 'au-arrow', 'aria-hidden': 'true' }, '→'));
        row.append(h('span', { class: 'au-chip' + (i === path.length - 1 ? ' sd-hl' : '') }, q));
      });
    }
    return h('div', { class: 'au-box' }, h('span', { class: 'au-head' }, head), row);
  }

  function statusBox(st, c) {
    var changed = c.prev && (st.machine === 'nfa' ? st.active.join() !== c.prev.active.join() : st.state !== c.prev.state);
    var res = st.done ? (st.accepted ? ['au-yes', '✓ ' + t('accepts')] : ['au-no', '✗ ' + t('rejects')]) : ['au-run', '… ' + t('running')];
    return h('div', { class: 'au-box' },
      h('span', { class: 'au-head' }, t('machine')),
      h('div', { class: 'au-status' },
        h('span', { class: 'au-k' }, t(st.machine === 'nfa' ? 'states' : 'state')),
        h('span', { class: 'au-v' + (changed ? ' sd-changed' : ''), translate: 'no' },
          st.machine === 'nfa' ? (st.active.join(', ') || '∅') : st.state),
        h('span', { class: 'au-k' }, t(st.machine === 'tm' ? 'head' : 'position')),
        h('span', { class: 'au-v', translate: 'no' }, String(st.pos)),
        h('span', { class: 'au-k' }, t('result')),
        h('span', { class: 'au-res ' + res[0] }, res[1])));
  }

  // ── captions ──
  function caption(c) {
    var st = c.state, e = st.ev, m = st.machine;
    var B = function (x) { return bold(x == null ? '' : String(x)); };
    if (c.n === 0) {
      var vars = { m: t('name' + cap(m)), state: B(st.state === undefined ? 'q0' : (m === 'nfa' ? 'q0' : st.state)), word: B(wordOf(st.word)) };
      return t.parts(st.word === '' ? 'captionStartEmpty' : 'captionStart', vars);
    }
    if (!e) return t('halted');
    var k = e.kind;
    if (k === 'move') return t.parts('dfaMove', { from: B(e.from), sym: B(e.sym), to: B(e.to) });
    if (k === 'toDead') return e.expected === null
      ? t.parts('dfaToDeadEnd', { from: B(e.from), sym: B(e.sym) })
      : t.parts('dfaToDead', { expected: B(e.expected), sym: B(e.sym), from: B(e.from) });
    if (k === 'deadStay') return t.parts('dfaDeadStay', { sym: B(e.sym) });
    if (k === 'endAccept' || k === 'endReject') {
      if (m === 'nfa') return t.parts(k === 'endAccept' ? 'nfaEndAccept' : 'nfaEndReject', { active: B(e.active.join(', ') || '∅') });
      return t.parts(k, { state: B(e.state) });
    }
    if (k === 'nfaRead') {
      var moves = e.edges.map(function (p) {
        return p[0] === p[1] ? t('nfaStay', { q: p[0] }) : p[0] + ' –' + e.sym + '→ ' + p[1];
      }).join('; ');
      var out = t.parts('nfaRead', { sym: B(e.sym), moves: h('span', { translate: 'no' }, moves) });
      if (e.dropped.length) out = out.concat([' '], t.parts('nfaDropped', { states: B(e.dropped.join(', ')), sym: B(e.sym) }));
      return out;
    }
    var nA = st.stack.filter(function (x) { return x === 'A'; }).length;
    if (k === 'pdaStart' || k === 'pdaMiddle' || k === 'pdaAccept') return t(k);
    if (k === 'pdaPush' || k === 'pdaPop') return t.parts(k, { k: B(nA) });
    if (k === 'pdaNoB') return e.sym === null ? t('pdaNoBEnd') : t.parts('pdaNoB', { sym: B(e.sym) });
    if (k === 'pdaBadQ1') return e.sym === null ? t('pdaBadQ1End') : t.parts('pdaBadQ1', { sym: B(e.sym) });
    if (k === 'pdaBadQ2') return e.sym === 'a' && e.top === '$' ? t('pdaNoA') : t.parts('pdaBadQ2', { sym: B(e.sym) });
    if (k === 'pdaLeft') return t.parts('pdaLeft', { k: B(e.left) });
    if (k === 'tmSkip') return t.parts('tmSkip', { sym: B(e.sym) });
    if (k === 'tmBack') return t.parts('tmBack', { from: B(e.from), sym: B(e.sym) });
    if (k === 'tmReject') return t.parts('tmReject', { from: B(e.from) });
    return t(k); // tmA, tmAgain, tmAN, tmAccept
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'machine', type: 'choice', label: t('machine'), resets: true,
        options: L.machines.map(function (m) { return [m, t('name' + cap(m))]; }) },
      { key: 'word', type: 'select', label: t('word'), hint: t('wordHint'), resets: true,
        options: L.words.map(function (w) { return [w, wordOf(w)]; }) }
    ],

    presets: [
      { id: 'dfa-banana', label: t('presetDfaYes'), hint: t('presetDfaYesHint'), params: { machine: 'dfa', word: 'banana' } },
      { id: 'dfa-bandana', label: t('presetDfaNo'), hint: t('presetDfaNoHint'), params: { machine: 'dfa', word: 'bandana' } },
      { id: 'nfa-banana', label: t('presetNfaYes'), hint: t('presetNfaYesHint'), params: { machine: 'nfa', word: 'banana' } },
      { id: 'nfa-ananas', label: t('presetNfaNo'), hint: t('presetNfaNoHint'), params: { machine: 'nfa', word: 'ananas' } },
      { id: 'pda-baanaa', label: t('presetPdaYes'), hint: t('presetPdaYesHint'), params: { machine: 'pda', word: 'baanaa' } },
      { id: 'pda-banana', label: t('presetPdaNo'), hint: t('presetPdaNoHint'), params: { machine: 'pda', word: 'banana' } },
      { id: 'pda-bana', label: t('presetPdaBana'), hint: t('presetPdaBanaHint'), params: { machine: 'pda', word: 'bana' } },
      { id: 'tm-bandana', label: t('presetTmYes'), hint: t('presetTmYesHint'), params: { machine: 'tm', word: 'bandana' } },
      { id: 'tm-baba', label: t('presetTmNo'), hint: t('presetTmNoHint'), params: { machine: 'tm', word: 'baba' } }
    ],

    legend: [
      { shape: 'hl', label: t('legendNow') },
      { shape: 'hollow', label: t('legendAccept') },
      { c: 1, label: t('legendEdge') }
    ],

    render: function (c) {
      var st = c.state, m = st.machine;
      var top = h('div', { class: 'au-top' },
        h('span', { class: 'au-name' }, t('name' + cap(m))),
        h('span', { class: 'au-full' }, t('full' + cap(m))),
        h('span', { class: 'au-lang' }, t('lang' + cap(m))));
      c.stage.replaceChildren(h('div', { class: 'au' },
        top,
        h('span', { class: 'au-note' }, t('note' + cap(m))),
        diagram(st),
        h('div', { class: 'au-bottom' }, tapeBox(st), memoryBox(st, c), statusBox(st, c))));
    },

    caption: caption
  });
})();
</script>
