<div class="sd-page">

<script src="recording.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var REC = window.Chirp1Recording;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  function dec(str) { return String(str).replace('.', t('dec')); }
  function secs(v) { return t('s', { v: dec(v.toFixed(1)) }); }
  function hz(v) { return t('hz', { v: String(Math.round(v)) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function text(svg, x, y, str, cls, attrs) {
    svg.append(s('text', Object.assign({ class: 'ch-halo' + (cls ? ' ' + cls : ''), x: x, y: y, translate: 'no' }, attrs || {}), str));
  }

  // ── playback: the recording through an <audio>, the model through Web Audio. Not part of the state. ──
  var play = null;      // { kind: 'rec' | 'model', ... } while sound plays
  var head = null;      // the live play position in s (the recording's time, or the model's from its start)
  var audio = null;

  function modelKey(p) { return [p.reg, p.jump, p.tau].join('|'); }
  function every() { return Simdeck.reducedMotion() ? 500 : 100; }   // ms between cursor redraws

  function stop(keepT) {
    if (!play) return;
    var p = play;
    play = null; head = null;
    if (p.kind === 'rec') {
      audio.pause();
      if (keepT !== false) sim.set({ t: L.snapT(audio.currentTime) });
    } else {
      try { p.osc.stop(); } catch (e) { /* already stopped */ }
      p.osc.disconnect(); p.gain.disconnect();
    }
    sim.render();
  }

  function loop(tick) {
    var last = 0;
    function frame(now) {
      if (!play) return;
      if (now - last >= every()) { last = now; if (tick() === false) return; sim.render(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  function playRec() {
    if (!audio) {
      audio = new Audio(REC.audio);
      audio.preload = 'auto';
      audio.addEventListener('ended', function () { if (play && play.kind === 'rec') { stop(false); sim.set({ t: L.REC_MAX }); } });
    }
    var p = sim.params, from = p.t >= L.REC_MAX ? 0 : p.t;
    audio.currentTime = from;
    play = { kind: 'rec', t: from };
    head = from;
    if (from !== p.t) sim.set({ t: from });
    var started = audio.play();
    if (started && started.catch) started.catch(function () { stop(); });
    loop(function () { head = audio.currentTime; });
  }

  function playModel() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!playModel.ctx) playModel.ctx = new AC();
    var ctx = playModel.ctx, st = sim.state;
    if (ctx.state === 'suspended') ctx.resume();
    var osc = ctx.createOscillator(), gain = ctx.createGain(), t0 = ctx.currentTime + 0.1, tau = st.tau / 1000;
    osc.type = 'sine';
    osc.frequency.setValueAtTime(st.f0, ctx.currentTime);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    st.elements.forEach(function (e) {
      var on = t0 + e.on / 1000, off = t0 + e.off / 1000;
      osc.frequency.setValueAtTime(st.f0 + st.jump, on);       // the jump at key-down …
      osc.frequency.setTargetAtTime(st.f0, on, tau);          // … and the exponential return
      gain.gain.setTargetAtTime(0.25, on, 0.004);             // 4 ms keying edges: no clicks
      gain.gain.setTargetAtTime(0, off, 0.004);
    });
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(t0 + st.duration / 1000 + 0.2);
    play = { kind: 'model', osc: osc, gain: gain, key: modelKey(sim.params) };
    head = 0;
    loop(function () {
      head = Math.max(0, ctx.currentTime - t0);
      if (head > st.duration / 1000 + 0.1) { stop(); return false; }
    });
  }

  function toggle() {
    if (play) { stop(); return; }
    if (sim.state.src === 'rec') playRec(); else playModel();
  }

  // ── drawing: pitch over time, key-down bars under it, the cursor ──
  function pitchPlot(box, o) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 3.6 * rem, right = 4 * rem, top = 2.2 * rem, bottom = 3.4 * rem;
    var X = function (sec) { return left + (sec - o.from) / (o.to - o.from) * (W - left - right); };
    var Y = function (f) { return top + (o.fHi - f) / (o.fHi - o.fLo) * (H - top - bottom); };
    var yBase = H - bottom, keyY = yBase + 0.5 * rem, keyH = 0.7 * rem;
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    // frequency grid and labels
    for (var f = Math.ceil(o.fLo / o.fStep) * o.fStep; f <= o.fHi + 1e-9; f += o.fStep) {
      svg.append(s('line', { class: 'ch-grid', x1: left, x2: W - right, y1: Y(f), y2: Y(f) }));
      text(svg, left - 0.4 * rem, Y(f) + 0.35 * rem, String(f), null, { 'text-anchor': 'end' });
    }
    text(svg, left - 0.4 * rem, top - 1.1 * rem, t('axisF'), null, { 'text-anchor': 'end' });
    // the time axis: a tick every 0.5 s, a number every 1 s (every 0.5 s when there is room)
    svg.append(s('line', { class: 'ch-axis', x1: left, x2: W - right, y1: yBase, y2: yBase }));
    var halfRoom = X(o.from + 0.5) - X(o.from) >= 3 * rem;
    for (var k = Math.ceil(o.from * 2 - 1e-9); k / 2 <= o.to + 1e-9; k++) {
      var x = X(k / 2);
      svg.append(s('line', { class: 'ch-tick', x1: x, x2: x, y1: yBase, y2: yBase + 0.3 * rem }));
      if (k % 2 === 0 || halfRoom) text(svg, x, yBase + 2.5 * rem, dec(String(k / 2)), null, { 'text-anchor': 'middle' });
    }
    // the true pitch (model)
    if (o.f0 != null) {
      svg.append(s('line', { class: 'ch-true', x1: left, x2: W - right, y1: Y(o.f0), y2: Y(o.f0) }));
      text(svg, W - right, Y(o.f0) - 0.5 * rem, t('tagTrue'), 'ch-ink', { 'text-anchor': 'end' });
    }
    // elements: key-down bar and pitch curve, clipped to the window
    o.elements.forEach(function (e) {
      if (e.off < o.from || e.on > o.to) return;
      var a = Math.max(e.on, o.from), b = Math.min(e.off, o.to);
      svg.append(s('rect', { class: 'ch-key', x: X(a), y: keyY, width: Math.max(1, X(b) - X(a)), height: keyH }));
      var pts = [];
      e.f.forEach(function (fv, i) {
        var ts = e.t0 + i * e.dt;
        if (ts < o.from || ts > o.to) return;
        pts.push(X(ts).toFixed(1) + ',' + Y(Math.max(o.fLo, Math.min(o.fHi, fv))).toFixed(1));
      });
      if (pts.length > 1) svg.append(s('polyline', { class: 'ch-pitch', points: pts.join(' ') }));
      if (pts.length && e.t0 >= o.from) {
        var p0 = pts[0].split(',');
        svg.append(s('circle', { class: 'ch-start', cx: p0[0], cy: p0[1], r: 0.3 * rem }));
      }
    });
    // the cursor
    if (o.head != null && o.head >= o.from && o.head <= o.to) {
      var xh = X(o.head);
      svg.append(s('line', { class: 'ch-head', x1: xh, x2: xh, y1: top, y2: keyY + keyH }));
      svg.append(s('path', { class: 'ch-headtip', d: 'M' + (xh - 0.45 * rem) + ',' + (top - 0.6 * rem) + 'L' + (xh + 0.45 * rem) + ',' + (top - 0.6 * rem) + 'L' + xh + ',' + (top + 0.2 * rem) + 'Z' }));
    }
    text(svg, W - 0.2 * rem, yBase + 2.5 * rem, t('axisT'), null, { 'text-anchor': 'end' });
    box.replaceChildren(svg);
  }

  // the whole recording: key-down bars, the page on show, the cursor. Clicking jumps.
  function overview(box, pos, page) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 3.6 * rem, right = 4 * rem;
    var X = function (sec) { return left + sec / REC.duration * (W - left - right); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    REC.track.forEach(function (e) {
      svg.append(s('rect', { class: 'ch-key', x: X(e[0]), y: 0.9 * rem, width: Math.max(1, X(e[1]) - X(e[0])), height: 0.9 * rem }));
    });
    svg.append(s('rect', { class: 'ch-page', x: X(page.from), y: 0.5 * rem, width: X(page.to) - X(page.from), height: 1.7 * rem, rx: 4 }));
    var xh = X(pos);
    svg.append(s('line', { class: 'ch-head', x1: xh, x2: xh, y1: 0.3 * rem, y2: 2.4 * rem }));
    text(svg, left, 3.1 * rem, t('whole'), null);
    text(svg, W - right, 3.1 * rem, secs(REC.duration), null, { 'text-anchor': 'end' });
    box.replaceChildren(svg);
    box.onclick = function (ev) {
      var r = box.getBoundingClientRect(), sec = (ev.clientX - r.left - left) / (W - left - right) * REC.duration;
      sim.set({ t: L.snapT(sec) });
    };
  }

  // the recording's elements in the plot's form: [on, off, first sample, [f every 10 ms]] → { on, off, t0, f, dt }
  var recEls = REC.track.map(function (e) { return { on: e[0], off: e[1], t0: e[2], f: e[3], dt: 0.01 }; });

  function modelEls(st) {
    return st.elements.map(function (e) {
      var f = [], dt = 5;
      for (var ms = 0; ms <= e.off - e.on + 1e-9; ms += dt) f.push(L.pitch(ms, st.jump, st.tau));
      return { on: e.on / 1000, off: e.off / 1000, t0: e.on / 1000, f: f, dt: dt / 1000 };
    });
  }

  var codeOf = function (ch) { return L.MORSE[ch].replace(/\./g, '·').replace(/-/g, '−'); };
  var presetKeys = { rec: 'presetRec', likeRec: 'presetLikeRec', regulated: 'presetRegulated', fast: 'presetFast', above: 'presetAbove' };
  var isRec = function (p) { return L.source(p.src) === 'rec'; };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'src', type: 'choice', label: t('src'), options: [['rec', t('srcRec')], ['model', t('srcModel')]] },
      { type: 'button', label: t('play'), key: 'p', run: function () { toggle(); } },
      { key: 't', type: 'range', label: t('t'), hint: t('tHint'), min: 0, max: L.REC_MAX, step: 0.1, format: function (v) { return secs(L.snapT(v)); }, visible: isRec },
      { key: 'reg', type: 'toggle', label: t('reg'), hint: t('regHint'), visible: function (p) { return !isRec(p); } },
      { key: 'jump', type: 'range', label: t('jump'), hint: t('jumpHint'), min: L.JUMP_MIN, max: L.JUMP_MAX, step: L.JUMP_STEP,
        format: function (v) { var j = L.snapJump(v); return (j > 0 ? '+' : j < 0 ? '−' : '') + hz(Math.abs(j)); },
        disabled: function (p) { return p.reg ? t('regOn') : false; }, visible: function (p) { return !isRec(p); } },
      { key: 'tau', type: 'range', label: t('tau'), hint: t('tauHint'), min: L.TAU_MIN, max: L.TAU_MAX, step: L.TAU_STEP,
        format: function (v) { return t('ms', { v: String(L.snapTau(v)) }); },
        disabled: function (p) { return p.reg ? t('regOn') : false; }, visible: function (p) { return !isRec(p); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: 0 }; }),
    legend: [
      { c: 1, shape: 'round', label: t('legendPitch') },
      { shape: 'hollow', label: t('legendTrue') },
      { c: 2, label: t('legendKey') },
      { c: 3, label: t('legendHead') }
    ],

    render: function (c) {
      var st = c.state;
      var plot = h('div', { class: 'ch-plot' }), line, fig;
      if (st.src === 'rec') {
        var pos = head != null ? head : st.t, page = L.recPage(pos);
        var heard = L.transcript(REC.events, pos);
        var strip = h('div', { class: 'ch-strip' });
        line = h('p', { class: 'ch-text' }, h('span', { class: 'ch-label' }, t('heard')), h('span', { class: 'ch-msg', translate: 'no' }, heard));
        fig = h('div', { class: 'ch-fig' }, h('h2', null, t('plotRec')), plot, strip);
        c.stage.replaceChildren(h('div', { class: 'ch' }, line, fig));
        pitchPlot(plot, { from: page.from, to: page.to, fLo: 170, fHi: 360, fStep: 50, elements: recEls, head: pos > 0 || play ? pos : null });
        overview(strip, pos, page);
      } else {
        var letters = st.word.split('').map(function (ch) {
          return [h('span', null, ch), h('span', { class: 'ch-code' }, codeOf(ch))];
        });
        line = h('p', { class: 'ch-text' }, h('span', { class: 'ch-label' }, t('sending')), h('span', { class: 'ch-msg', translate: 'no' }, letters));
        fig = h('div', { class: 'ch-fig' }, h('h2', null, t('plotModel')), plot);
        c.stage.replaceChildren(h('div', { class: 'ch' }, line, fig));
        pitchPlot(plot, { from: 0, to: Math.max(2, st.duration / 1000 + 0.1), fLo: 380, fHi: 820, fStep: 100, f0: st.f0, elements: modelEls(st), head: head });
      }
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', { translate: 'no' }, x); };
      if (st.src === 'rec') {
        return [t.parts('captionRec', { t: b(secs(st.t)), d: b(secs(L.REC_DURATION)) }), t('captionRecNote')];
      }
      var f0 = b(hz(st.f0));
      if (st.reg) return t.parts('captionReg', { f0: f0 });
      if (st.dir === 'none') return t.parts('captionZero', { f0: f0 });
      var out = [t.parts(st.dir === 'below' ? 'captionBelow' : 'captionAbove', { jump: b(hz(Math.abs(st.jump))), f0: f0, tau: b(t('ms', { v: String(st.tau) })) })];
      [['elDit', st.dit, st.ditEnd], ['elDah', 3 * st.dit, st.dahEnd]].forEach(function (r) {
        var key = r[2] === 0 ? 'endSettled' : r[2] < 0 ? 'endLow' : 'endHigh';
        out.push(t.parts(key, { el: t(r[0]), len: b(t('ms', { v: String(r[1]) })), off: b(hz(Math.abs(r[2]))) }));
      });
      return out;
    }
  });

  // After each render: a param change that alters what is playing stops it; moving the recording's position while it
  // plays seeks.
  sim.on(function (c) {
    var st = c.state;
    if (!play) return;
    if (play.kind !== (st.src === 'rec' ? 'rec' : 'model')) stop(false);
    else if (play.kind === 'model' && play.key !== modelKey(c.params)) stop();
    else if (play.kind === 'rec' && st.t !== play.t) { play.t = st.t; audio.currentTime = st.t; head = st.t; }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
