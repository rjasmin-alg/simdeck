     many ways to win. An explorer in four modes: throw (two dice and a tally chart of the sums 1 … 13), pairs (the 36
     pairs as a 6 × 6 grid and sorted into columns by sum; an event lit, certain, possible or impossible), race (the
     curriculum's race to 10 with players 1 … 12, and many races) and fair (Ana and Bruno: who wins on which sum, count
     the ways, then play). The question on top; the header's audience switch is Simdeck.paperColumns.audience
     (docs/sim-ui.md §14). Throws are seeded (?seed=; from the clock otherwise). Rules: SPEC.md. -->

</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var D = L.dice;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // what the last action did (throws, a refusal, an owner changed), kept while the params stay as it left them
  var ev = null;

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function btn(label, title, run, opts) {
    opts = opts || {};
    return noFocus(h('button', { type: 'button', class: 'sd-btn dd-btn' + (opts.cls ? ' ' + opts.cls : ''), title: title,
      'aria-keyshortcuts': opts.kbd ? opts.kbd.toLowerCase() : null, 'aria-label': opts.aria || null,
      'aria-pressed': opts.pressed == null ? null : String(opts.pressed), 'aria-disabled': opts.disabled ? 'true' : null,
      dataset: Object.assign(opts.main ? { main: '' } : {}, opts.data || {}),
      onclick: function () { run(); } }, label, opts.kbd ? ' ' : '', opts.kbd ? h('kbd', null, opts.kbd) : ''));
  }

  /* ══ words ══ */
  function list(xs) {

    return xs.slice(0, -1).join(', ') + t('and') + xs[xs.length - 1];
  }
  function waysText(n) { return t.n('ways', n); }
  function timesText(n) { return t.n('times', n); }
  function eventText(s) { return s.ev === 'sum' ? t('evSum', { k: s.k }) : t('ev_' + s.ev); }
  function ownerName(o) { return t('own_' + o); }

  /* ══ events ══ */
  function sigOf(p) {
    var out = [p.mode, p.seed, p.n, p.ways, p.ev, p.k, p.rn, p.rr, p.fn];
    L.SUMS.forEach(function (s) { out.push(p['o' + s]); });
    return JSON.stringify(out);
  }
  function evNow(c) { return ev && ev.sig === sigOf(c.params) ? ev : null; }
  /** Run an action: remember what it did, set the params (or redraw when refused). */
  function act(e, patch) {
    var next = Object.assign({}, sim.params, patch);
    e.sig = sigOf(next);
    ev = e;
    if (Object.keys(patch).length) sim.set(patch); else sim.render();
  }
  function throwMore(d) {
    var s = sim.state;
    if (s.mode === 'throw' || s.mode === 'fair') {
      var key = s.mode === 'throw' ? 'n' : 'fn', r = L.more(sim.params, key, d);
      act({ kind: 'throws', d: d, from: r.from, to: r.to, refused: r.refused }, r.patch);
    } else if (s.mode === 'race') {
      var q = L.raceMore(sim.params, d);
      act({ kind: 'race', d: d, from: q.from, to: q.to, refused: q.refused }, q.patch);
    }
  }
  function moreRaces() {
    var r = L.racesMore(sim.params, 10);
    act({ kind: 'races', refused: r.refused }, r.patch);
  }
  function fresh() { act({ kind: 'fresh' }, L.fresh(sim.params)); }
  function setEvent(evName, k) { ev = null; sim.set(evName === 'sum' ? { ev: 'sum', k: Math.max(0, Math.min(14, k)) } : { ev: evName }); }
  function cycleOwner(sum) { act({ kind: 'owner', sum: sum }, L.cycle(sim.params, sum)); }
  function toggleWays() { ev = null; sim.set({ ways: !sim.params.ways }); }

  /* ══ dice (drawn in a 100 × 100 box; no text but "?", so scaling is fine) ══ */
  var PIPS = { 1: [[50, 50]], 2: [[28, 28], [72, 72]], 3: [[26, 26], [50, 50], [74, 74]], 4: [[28, 28], [72, 28], [28, 72], [72, 72]],
    5: [[26, 26], [74, 26], [50, 50], [26, 74], [74, 74]], 6: [[28, 24], [72, 24], [28, 50], [72, 50], [28, 76], [72, 76]] };
  function dieSvg(v, which) {
    var el = svg('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' });
    el.append(svg('rect', { class: v ? 'dd-face' + which : 'dd-face0', x: 5, y: 5, width: 90, height: 90, rx: 16 }));
    if (v) PIPS[v].forEach(function (p) { el.append(svg('circle', { class: 'dd-pip', cx: p[0], cy: p[1], r: 9 })); });
    else { var q = svg('text', { class: 'dd-q', x: 50, y: 66, 'text-anchor': 'middle' }); q.textContent = '?'; el.append(q); }
    return el;
  }
  function diceBox(s, last) {
    var a = last ? last[0] : 0, b = last ? last[1] : 0;
    return h('div', { class: 'dd-dice', role: 'img', 'aria-label': last ? t('diceLabel', { a: a, b: b, s: a + b }) : t('diceNone') },
      h('div', { class: 'dd-die' }, dieSvg(a, 1), t('die1')),
      h('div', { class: 'dd-die' }, dieSvg(b, 2), t('die2')));
  }
  function chip(a, b) { return h('div', { class: 'dd-chip', translate: 'no', 'aria-label': a + ' + ' + b }, h('span', null, String(a)), h('span', null, String(b))); }
  function waySquares(n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(h('span', { class: 'dd-wsq', 'aria-hidden': 'true' }));
    return out;
  }

  /* ══ the dice panel (throw, race, fair) ══ */
  function dicePanel(s) {
    var A = audience, kids = [h('h2', { class: 'dd-h' }, t(s.mode === 'race' ? 'hRaceThrow' : 'hThrow'))];
    kids.push(diceBox(s, s.last));
    kids.push(h('div', { class: 'dd-eq', translate: 'no' }, s.last ? s.last[0] + ' + ' + s.last[1] + ' = ' + (s.last[0] + s.last[1]) : ' '));
    var count = s.mode === 'throw' ? s.n : s.mode === 'fair' ? s.fn : s.rn;
    var acts = [btn(t('throw1'), t('throw1Hint'), function () { throwMore(1); }, { main: true, kbd: 'P', disabled: s.mode === 'race' ? s.done : count >= L.N_MAX })];
    if (A !== 'child') acts.push(btn(t('throw10'), t('throw10Hint'), function () { throwMore(10); }, { kbd: 'T', disabled: s.mode === 'race' ? s.done : count >= L.N_MAX }));
    if (s.mode === 'race') acts.push(btn(t('toGoal'), t('toGoalHint'), function () { throwMore(Infinity); }, { kbd: 'A', disabled: s.done }));
    else if (A !== 'child') acts.push(btn(t('throw100'), t('throw100Hint'), function () { throwMore(100); }, { kbd: 'A', disabled: count >= L.N_MAX }));
    acts.push(btn(t(s.mode === 'race' ? 'newRace' : 'fresh'), t('freshHint'), fresh, { kbd: 'N' }));
    kids.push(h('div', { class: 'dd-grp dd-acts' }, acts));
    kids.push(h('div', { class: 'dd-count' }, t.n(s.mode === 'race' ? 'raceThrows' : 'throwsN', count)));
    if (s.mode === 'throw' && s.recent.length > 1 && A !== 'child') {
      kids.push(h('div', { class: 'dd-recent', translate: 'no' }, t('recent', { list: s.recent.join('  ') })));
    }
    if (s.mode === 'race' && A !== 'child') {
      kids.push(h('div', { class: 'dd-grp dd-acts' },
        btn(t('races10'), t('races10Hint'), moreRaces, { kbd: 'U', disabled: s.rr >= L.RACES_MAX }),
        h('span', null, t.n('racesN', s.rr))));
    }
    if (s.mode === 'fair') kids.push(scoreTable(s));
    return h('section', { class: 'dd-box dd-panel' }, kids);
  }
  function scoreTable(s) {
    var tot = Math.max(1, s.fn);
    var row = function (o, v) {
      return h('tr', null, h('th', { scope: 'row' }, h('span', { class: 'dd-tag', dataset: { own: o } }, ownerName(o))),
        h('td', { class: 'dd-num dd-mono', translate: 'no' }, String(v)),
        h('td', { style: { width: '50%' } }, h('span', { class: 'dd-bar', style: { width: (v / tot * 100).toFixed(1) + '%' } })));
    };
    return h('table', { class: 'dd-score', 'aria-label': t('scoreLab') },
      h('caption', { class: 'dd-h', style: { textAlign: 'left' } }, t('scoreLab')),
      h('tbody', null, row('a', s.score.a), row('b', s.score.b), row('n', s.score.n)));
  }

  /* ══ throw: the tally chart of the sums 1 … 13 ══ */
  function tallySvg(v) {
    var fives = Math.floor(v / 5), ones = v % 5;
    var W = fives * 9 + ones * 1.7 + 0.5, el = svg('svg', { viewBox: '0 0 ' + Math.max(W, 1) + ' 10', 'aria-hidden': 'true' });
    el.style.width = (Math.max(W, 1) / 10 * 1.6).toFixed(2) + "em";
    var x = 0.8;
    for (var f = 0; f < fives; f++) {
      for (var j = 0; j < 4; j++) el.append(svg('line', { class: 'dd-stroke', x1: x + j * 1.6, y1: 1, x2: x + j * 1.6, y2: 9 }));
      el.append(svg('line', { class: 'dd-stroke', x1: x - 0.6, y1: 7.6, x2: x + 3 * 1.6 + 0.6, y2: 2.4 }));
      x += 9;
    }
    for (var o = 0; o < ones; o++) { el.append(svg('line', { class: 'dd-stroke', x1: x, y1: 1, x2: x, y2: 9 })); x += 1.7; }
    return el;
  }
  function throwView(s) {
    var lastSum = s.last ? s.last[0] + s.last[1] : -1, rows = [];
    for (var sum = 1; sum <= 13; sum++) {
      var v = s.counts[sum], w = D.ways(sum), never = w === 0, lead = s.leaders.indexOf(sum) >= 0;
      var cls = [sum === lastSum ? 'dd-last' : '', lead ? 'dd-lead' : '', never ? 'dd-never' : ''].join(' ').trim() || null;
      var mark = h('span', { class: 'dd-mark', 'aria-hidden': 'true' }, lead ? '▶' : '');
      var tl;
      if (never) tl = h('td', { class: 'dd-tl sd-hatch' }, t('never'));
      else if (s.tally) tl = h('td', { class: 'dd-tally', 'aria-label': t.n('tallyLabel', v) }, tallySvg(v));
      else tl = h('td', null, h('span', { class: 'dd-bar', style: { width: (v / Math.max(1, s.max) * 100).toFixed(1) + '%' } }));
      var wc = s.ways ? h('td', { class: 'dd-ways', 'aria-label': waysText(w) }, waySquares(w), h('span', { class: 'dd-mono' }, String(w)))
        : h('td', { class: 'dd-ways dd-mono' }, t('unknown'));
      rows.push(h('tr', { class: cls }, h('th', { scope: 'row', class: 'dd-sum', translate: 'no' }, mark, String(sum)), tl,
        h('td', { class: 'dd-num', translate: 'no' }, String(v)), wc));
    }
    var head = h('tr', null, h('th', { scope: 'col' }, t('colSum')), h('th', { scope: 'col' }, t(s.tally ? 'colTally' : 'colBar')),
      h('th', { scope: 'col' }, t('colCount')), h('th', { scope: 'col' }, t('colWays')));
    return h('section', { class: 'dd-box dd-panel' }, h('h2', { class: 'dd-h' }, t('hTally')),
      h('div', { class: 'dd-fill' }, h('table', { class: 'dd-table' }, h('thead', null, head), h('tbody', null, rows))));
  }

  /* ══ pairs: the 6 × 6 grid and the columns by sum ══ */
  function gridTable(s, cell) {
    var head = [h('th', { class: 'dd-corner', scope: 'col' }, t('corner'))];
    for (var b = 1; b <= 6; b++) head.push(h('th', { class: 'dd-h2', scope: 'col', translate: 'no' }, String(b)));
    var rows = [];
    for (var a = 1; a <= 6; a++) {
      var cells = [h('th', { class: 'dd-h1', scope: 'row', translate: 'no' }, String(a))];
      for (var b2 = 1; b2 <= 6; b2++) cells.push(cell(a, b2, (a - 1) * 6 + (b2 - 1)));
      rows.push(h('tr', null, cells));
    }
    return h('table', { class: 'dd-grid', 'aria-label': t('gridLab') }, h('thead', null, h('tr', null, head)), h('tbody', null, rows));
  }
  function pairsView(s) {
    var lit = {};
    s.lit.forEach(function (i) { lit[i] = true; });
    var grid = gridTable(s, function (a, b, i) {
      return h('td', { class: lit[i] ? 'dd-on' : null, translate: 'no', title: t('pairHint', { a: a, b: b, s: a + b }),
        onclick: function () { setEvent('sum', a + b); } }, String(a + b));
    });
    var cols = [], sums = [];
    for (var x = 1; x <= 13; x++) sums.push(x);
    if (s.ev === 'sum' && (s.k === 0 || s.k === 14)) { if (s.k === 0) sums.unshift(0); else sums.push(14); }
    sums.forEach(function (sum) {
      var w = D.ways(sum), on = s.ev === 'sum' ? sum === s.k : D.inEvent(s.ev, 0, 1, sum - 1) && w > 0;
      var stack = [h('div', { class: 'dd-slab', translate: 'no' }, String(sum)), h('div', { class: 'dd-sn' }, String(w))];
      if (!w) stack.push(h('div', { class: 'dd-empty sd-hatch', title: t('never') }, '×'));
      D.pairs().forEach(function (p) { if (p[0] + p[1] === sum) stack.push(chip(p[0], p[1])); });
      cols.push(h('div', { class: 'dd-scol' + (on ? ' dd-on' : '') + (w ? '' : ' dd-never'), title: t('colHint', { s: sum, w: waysText(w) }),
        onclick: function () { setEvent('sum', sum); } }, stack));
    });
    return [
      h('section', { class: 'dd-box dd-panel' }, h('h2', { class: 'dd-h' }, t('hGrid')), h('div', { style: { margin: 'auto 0' } }, grid)),
      h('section', { class: 'dd-box dd-panel dd-pairs' }, h('h2', { class: 'dd-h' }, t('hCols')),
        h('div', { class: 'dd-cols', role: 'img', 'aria-label': t('hCols') }, cols),
        h('div', { class: 'dd-sub' }, t('colsNote')))
    ];
  }

  /* ══ race ══ */
  function raceView(s) {
    var lastSum = s.last ? s.last[0] + s.last[1] : -1, rows = [];
    var head = [h('th', { scope: 'col', class: 'dd-ph' }, t('colPlayer'))];
    for (var c = 1; c <= L.GOAL; c++) head.push(h('th', { scope: 'col', class: c === L.GOAL ? 'dd-goalh' : 'dd-mono', style: { textAlign: 'center' }, translate: 'no' }, c === L.GOAL ? t('goal') : String(c)));
    if (s.rr) head.push(h('th', { scope: 'col', class: 'dd-wh' }, t('colWins')));
    head.push(h('th', { scope: 'col', class: 'dd-wh' }, t('colWays')));
    for (var pl = 1; pl <= 12; pl++) {
      var pos = s.pos[pl], w = D.ways(pl), cells = [];
      var cls = [pl === s.winner ? 'dd-win' : '', pl === lastSum ? 'dd-last' : '', w === 0 && s.ways ? 'dd-never' : ''].join(' ').trim() || null;
      for (var j = 1; j <= L.GOAL; j++) {
        cells.push(h('td', { class: 'dd-cell' + (j === L.GOAL ? ' dd-goal' : '') + (w === 0 && s.ways ? ' sd-hatch' : ''), dataset: j <= pos ? { on: '' } : {} }, h('span')));
      }
      var row = [h('th', { scope: 'row', class: 'dd-sum', translate: 'no' }, h('span', { class: 'dd-mark', 'aria-hidden': 'true' }, pl === s.winner ? '▶' : ''), String(pl))].concat(cells);
      if (s.rr) row.push(h('td', { class: 'dd-num', translate: 'no', style: { width: '3em' } }, String(s.wins[pl])));
      row.push(s.ways ? h('td', { class: 'dd-ways', 'aria-label': waysText(w) }, waySquares(w), h('span', { class: 'dd-mono' }, String(w)))
        : h('td', { class: 'dd-ways dd-mono' }, t('unknown')));
      rows.push(h('tr', { class: cls, 'aria-label': t('raceRow', { p: pl, n: pos }) }, row));
    }
    return h('section', { class: 'dd-box dd-panel' }, h('h2', { class: 'dd-h' }, t('hRace')),
      h('div', { class: 'dd-fill' }, h('table', { class: 'dd-table dd-race' }, h('thead', null, h('tr', null, head)), h('tbody', null, rows))));
  }

  /* ══ fair ══ */
  function fairView(s) {
    var f = s.fair;
    var grid = gridTable(s, function (a, b) {
      var o = s.owners[a + b];
      return h('td', { dataset: { own: o }, class: o === 'n' ? 'sd-hatch' : null, translate: 'no', title: t('ownHint', { s: a + b, o: ownerName(o) }),
        onclick: function () { cycleOwner(a + b); } }, String(a + b), h('span', { class: 'dd-who', 'aria-hidden': 'true' }, t('ownShort_' + o)));
    });
    var rows = [];
    L.SUMS.forEach(function (sum) {
      var o = s.owners[sum], w = D.ways(sum);
      rows.push(h('span', { class: 'dd-mono', translate: 'no' }, String(sum)));
      rows.push(btn(ownerName(o), t('cycleHint', { s: sum }), function () { cycleOwner(sum); }, { cls: 'dd-own', data: { own: o }, aria: t('ownHint', { s: sum, o: ownerName(o) }) }));
      rows.push(h('span', { 'aria-label': s.ways ? waysText(w) : t('unknown') }, s.ways ? waySquares(w) : h('span', { class: 'dd-mono' }, t('unknown'))));
    });
    var tot = h('div', { class: 'dd-tot' },
      ['a', 'b', 'n'].map(function (o) {
        var w = o === 'n' ? f.again : f[o];
        return h('span', null, h('span', { class: 'dd-tag', dataset: { own: o } }, ownerName(o)), ' ',
          t.n('sumsN', f.sums[o].length), ', ', s.ways ? t.n('pairsN', w) : t('pairsHidden'));
      }));
    return h('section', { class: 'dd-box dd-panel' }, h('h2', { class: 'dd-h' }, t('hFair')),
      h('div', { class: 'dd-fair' }, h('div', { class: 'dd-left' }, grid, tot), h('div', { class: 'dd-owners' }, rows)));
  }

  /* ══ the top box ══ */
  function headline(s) {
    var A = audience;
    if (s.mode === 'throw') {
      if (!s.ways) return [t('qThrow'), null];
      return [t('aThrowQ'), t('aThrow')];
    }
    if (s.mode === 'pairs') return [cap(eventText(s)) + ':', t('evWays', { w: s.evWays })];
    if (s.mode === 'race') {
      if (s.done) return [t('raceWon', { p: s.winner, n: s.rn }), s.ways ? t('raceUnfair') : null];
      return [t('qRace'), s.ways ? t('raceUnfair') : null];
    }
    var f = s.fair;
    if (!s.ways) return [t('qFair'), t('unknown')];
    return [t('qFair'), t('verdict_' + f.verdict, { a: f.a, b: f.b, o: f.favours ? ownerName(f.favours) : '' })];
  }
  function topBox(s) {
    var col = [], side = [], hl = headline(s), A = audience;
    col.push(h('div', { class: 'dd-say' }, h('span', null, hl[0]), hl[1] ? h('span', { class: 'dd-ans' }, hl[1]) : null));
    if (s.mode === 'pairs') {
      col.push(h('div', { class: 'dd-kinds', role: 'list', 'aria-label': t('kindsLab') },
        ['impossible', 'possible', 'certain'].map(function (k) {
          return h('span', { class: 'dd-kind', role: 'listitem', dataset: s.kind === k ? { on: '' } : {} }, (s.kind === k ? '✓ ' : '') + t('kind_' + k));
        })));
      if (A !== 'child' && s.cmp) col.push(h('div', { class: 'dd-sub' }, cmpText(s)));
      side.push(h('div', { class: 'dd-grp', role: 'group', 'aria-label': t('evLab') }, h('span', { class: 'dd-lab' }, t('evSumLab')),
        btn('−', t('kDown'), function () { setEvent('sum', (s.ev === 'sum' ? s.k : 7) - 1); }, { aria: t('kDown'), disabled: s.ev === 'sum' && s.k <= 0 }),
        h('span', { class: 'dd-k dd-mono', translate: 'no', 'aria-live': 'off' }, s.ev === 'sum' ? String(s.k) : '·'),
        btn('+', t('kUp'), function () { setEvent('sum', (s.ev === 'sum' ? s.k : 7) + 1); }, { aria: t('kUp'), disabled: s.ev === 'sum' && s.k >= 14 })));
      side.push(h('div', { class: 'dd-grp', role: 'group', 'aria-label': t('evLab') },
        ['even', 'odd', 'lt13'].map(function (e) { return btn(t('evb_' + e), t('evbHint'), function () { setEvent(e); }, { pressed: s.ev === e }); })));
    } else {
      if (A !== 'child') col.push(h('div', { class: 'dd-sub' }, subText(s)));
      if (!s.ways) side.push(btn(t('reveal'), t('revealHint'), toggleWays, { kbd: 'V', main: true }));

    }
    return h('section', { class: 'dd-box dd-top' }, h('div', { class: 'dd-col' }, col), h('div', { class: 'dd-side' }, side));
  }
  function cmpText(s) {
    var c = s.cmp, parts = [];
    if (c.most) parts.push(t('cmpMost'));
    if (c.more.length) parts.push(t('cmpMore', { list: list(c.more) }));
    if (c.less.length) parts.push(t('cmpLess', { list: list(c.less) }));

  }
  function subText(s) {
    if (s.mode === 'throw') {

    }

  }

  function render(c) {
    var s = c.state, body;
    if (s.mode === 'throw') body = [dicePanel(s), throwView(s)];

    else body = [dicePanel(s), fairView(s)];
    c.stage.replaceChildren(h('div', { class: 'dd', dataset: { aud: audience, mode: s.mode } },
      topBox(s), h('div', { class: 'dd-body' }, body)));
  }

  /* ══ captions (SPEC, Legend and captions) ══ */
  function caption(c) {
    var s = c.state, A = audience, out = [], e = evNow(c);
    function put(x) { if (out.length) out.push(' '); out.push(h('span', null, cap(x))); }
    function putHl(x) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, cap(x))); }
    // 1. a refused action
    if (e && e.refused) {
      put(t(e.refused === 'done' ? 'cRefDone' : e.kind === 'races' ? 'cRefRaces' : 'cRefLimit'));
      return out;
    }
    if (s.mode === 'throw') return throwCaption(s, e, put, putHl, out);
    if (s.mode === 'pairs') return pairsCaption(s, put, putHl, out);
    if (s.mode === 'race') return raceCaption(s, e, put, putHl, out);
    return fairCaption(s, e, put, putHl, out);
  }
  function throwCaption(s, e, put, putHl, out) {
    var A = audience;
    if (!s.n) {
      put(t(A === 'child' ? 'cThrow0C' : 'cThrow0'));
      if (A === 'teacher') putHl(t('cMistEqual'));
      if (A === 'adult') put(t('whyNever'));
      return out;
    }
    var sum = s.last[0] + s.last[1];
    if (A === 'child') { put(t('cThrowC', { s: sum, v: timesText(s.counts[sum]) })); return out; }
    if (e && e.kind === 'throws' && e.d > 1) put(t.n('cThrowMany', e.to - e.from, { m: s.n }));
    else put(t('cThrowOne', { a: s.last[0], b: s.last[1], s: sum, v: timesText(s.counts[sum]) }));
    if (s.n < 36) put(t(s.leaders.indexOf(7) >= 0 && s.leaders.length === 1 ? 'cFewSeven' : 'cFew'));
    else if (s.ways) put(t(s.leaders.length === 1 && s.leaders[0] === 7 ? 'cManySeven' : s.leaders.indexOf(7) >= 0 ? 'cManyTie7' : s.leaders.length > 1 ? 'cManyNotTie' : 'cManyNot', { list: list(s.leaders) }));
    else put(t('cManyAsk'));
    if (A === 'teacher') {
      var run = runOf(s);
      if (run) putHl(t('cMistDue', { s: run }));
      else putHl(t(s.ways ? 'cMistOrder' : 'cMistEqual'));
    }
    if (A === 'adult') put(t(s.ways ? 'whyWays' : 'whyNever'));
    if (!s.tally) put(t('cBars', { m: L.TALLY_MAX }));
    return out;
  }
  /** The sum of the last two throws when they are the same (a "run"), for the "due" mistake. */
  function runOf(s) {
    var r = s.recent;
    return r.length >= 2 && r[r.length - 1] === r[r.length - 2] ? r[r.length - 1] : 0;
  }
  function pairsCaption(s, put, putHl, out) {
    var A = audience, k = s.k;
    if (A === 'child') { put(t('cKind_' + s.kind, { e: eventText(s), w: s.evWays })); return out; }
    if (s.ev === 'sum') {
      if (s.kind === 'impossible') {
        put(t(k === 0 ? 'cZero' : k < 2 ? 'cLow' : 'cHigh', { k: k }));
        if (A === 'teacher') putHl(t('cMistUnlikely'));
      } else {
        var ps = D.pairs().filter(function (p) { return p[0] + p[1] === k; }).map(function (p) { return p[0] + ' + ' + p[1]; });
        put(t.n('cSumWays', s.evWays, { k: k, list: list(ps) }));
        if (A === 'teacher') putHl(t(k === 7 ? 'cMistOnce' : D.ways(k) === 1 ? 'cMistPossible' : 'cMistOnce'));
        if (A === 'adult') put(t(k === 7 ? 'whyMost' : 'whyCount'));
      }
    } else if (s.ev === 'lt13') {
      put(t('cCertain'));
      if (A === 'teacher') putHl(t('cMistCertain'));
    } else {
      put(t('cParity', { e: t('ev_' + s.ev), w: s.evWays }));
      if (A !== 'child') put(t('cParity2'));
    }
    return out;
  }
  function racesText(s) {
    if (s.rr === 1) return t('cRaces1', { p: s.winLeaders[0] });
    var many = s.wins.filter(function (w) { return w > 0; }).length > 1;
    return t(s.winLeaders.length > 1 ? 'cRacesTie' : 'cRaces', { in: t.n('racesIn', s.rr), list: list(s.winLeaders) }) + ' ' +
      t(many ? 'cRacesOthers' : 'cRacesOnly');
  }
  function raceCaption(s, e, put, putHl, out) {
    var A = audience;
    if (e && e.kind === 'races') {
      put(racesText(s));
      if (A === 'teacher') putHl(t('cMistSevenAlways'));
      return out;
    }
    if (e && e.kind === 'fresh') { put(t(A === 'child' ? 'cRace0C' : 'cRace0')); return out; }
    if (!s.rn) {
      put(t(A === 'child' ? 'cRace0C' : 'cRace0'));
      if (A === 'teacher') putHl(t('cRaceQs'));
      return out;
    }
    var sum = s.last[0] + s.last[1];
    if (A === 'child') { put(t(s.done ? 'cRaceWonC' : 'cRaceC', { p: s.done ? s.winner : sum })); return out; }
    if (s.done) put(t('cRaceWon', { p: s.winner, n: s.rn }));
    else put(t('cRaceMove', { s: sum, n: s.pos[sum] }));
    if (s.ways) put(t('cRaceWays'));
    else if (A === 'teacher') putHl(t('cRaceQs'));
    if (A === 'adult') put(t('whyRace'));
    if (s.rr && s.ways) put(racesText(s));
    return out;
  }
  function fairCaption(s, e, put, putHl, out) {
    var A = audience, f = s.fair;
    if (A === 'child') {
      if (e && e.kind === 'throws' && s.last) { put(t('cPlayC', { s: s.last[0] + s.last[1], o: ownerName(s.owners[s.last[0] + s.last[1]]) })); return out; }
      put(t(s.ways ? 'cFairC_' + f.verdict : 'cFairAskC', { o: f.favours ? ownerName(f.favours) : '' }));
      return out;
    }
    if (e && e.kind === 'owner') put(t('cOwner', { s: e.sum, o: ownerName(s.owners[e.sum]) }));
    if (e && e.kind === 'throws' && s.last) {
      var sum = s.last[0] + s.last[1], o = s.owners[sum];
      put(t(o === 'n' ? 'cPlayAgain' : 'cPlay', { s: sum, o: ownerName(o) }));
    }
    if (!s.ways) {
      put(t('cFairAsk'));
      if (A === 'teacher') putHl(t('cMistSums'));
      return out;
    }
    put(t('cFair_' + f.verdict, { a: t.n('pairsN', f.a), b: t.n('pairsN', f.b), o: f.favours ? ownerName(f.favours) : '' }));
    if (A === 'teacher' && f.sums.a.length !== f.sums.b.length) putHl(t('cMistSums2', { sa: t.n('sumsN', f.sums.a.length), sb: t.n('sumsN', f.sums.b.length) }));
    if (A === 'adult') put(t('whyFair'));
    if (s.fn >= 100 && f.verdict !== 'nogame') put(t('cPlayed', { in: t.n('throwsIn', s.fn), a: timesText(s.score.a), b: timesText(s.score.b) }));
    return out;
  }

  /* ══ the header: the audience switch ══ */
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  var params = [
    { key: 'mode', type: 'choice', label: t('modeLab'), value: L.defaults.mode, options: L.MODES.map(function (x) { return [x, t('mode_' + x)]; }) },
    { key: 'ways', type: 'toggle', label: t('waysLab'), hint: t('waysHint'), value: L.defaults.ways, visible: function (p) { return p.mode !== 'pairs'; } },
    // the stage's buttons and keys; here so the URL and the presets carry them
    { key: 'seed', type: 'range', label: t('fresh'), value: L.defaults.seed, min: 0, max: L.SEED_MAX, visible: hidden },
    { key: 'n', type: 'range', label: t('throwsLab'), value: L.defaults.n, min: 0, max: L.N_MAX, visible: hidden },
    { key: 'ev', type: 'choice', label: t('evLab'), value: L.defaults.ev, options: L.EVENTS.map(function (x) { return [x, t('evb_' + x)]; }), visible: hidden },
    { key: 'k', type: 'range', label: t('evSumLab'), value: L.defaults.k, min: 0, max: 14, visible: hidden },
    { key: 'rn', type: 'range', label: t('raceThrowsLab'), value: L.defaults.rn, min: 0, max: L.RACE_MAX, visible: hidden },
    { key: 'rr', type: 'range', label: t('races10'), value: L.defaults.rr, min: 0, max: L.RACES_MAX, visible: hidden },
    { key: 'fn', type: 'range', label: t('scoreLab'), value: L.defaults.fn, min: 0, max: L.N_MAX, visible: hidden }
  ];
  L.SUMS.forEach(function (sum) {
    params.push({ key: 'o' + sum, type: 'choice', label: t('evSum', { k: sum }), value: L.defaults['o' + sum],
      options: L.OWNERS.map(function (o) { return [o, ownerName(o)]; }), visible: hidden });
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'p', label: t('throw1'), run: function () { throwMore(1); } },
      { key: 't', label: t('throw10'), run: function () { throwMore(10); } },
      { key: 'a', label: t('keyA'), run: function () { throwMore(sim.state.mode === 'race' ? Infinity : 100); } },
      { key: 'n', label: t('fresh'), run: function () { if (sim.state.mode !== 'pairs') fresh(); } },
      { key: 'u', label: t('races10'), run: function () { if (sim.state.mode === 'race') moreRaces(); } },
      { key: 'v', label: t('revealKey'), run: function () { if (sim.state.mode !== 'pairs') toggleWays(); } },
      { key: 'm', label: t('keyM'), run: function () { ev = null; sim.set({ mode: L.MODES[(L.MODES.indexOf(sim.state.mode) + 1) % L.MODES.length] }); } }
    ],

    legend: [
      { c: 1, label: t('legDie1') },
      { c: 2, label: t('legDie2') },
      { shape: 'hl', label: t('legLit') },
      { shape: 'hollow', label: t('legNever') }
    ],

    render: render,
    caption: caption
  });

  // the throws come from the clock unless the link names a seed (seed 0 means "not chosen yet", also after a preset)
  sim.on(function (c) {
    if (c.params.seed === 0) sim.set({ seed: (Date.now() % L.SEED_MAX) + 1 }, { preset: sim.preset });
  });

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
