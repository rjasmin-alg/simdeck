<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var U = L.units;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // the last unit measured in (ruler), for "a smaller unit gives a bigger number" (rule 5)
  var lastUnit = null, lastThing = null, prevUnit = null;
  // the table's last reading, to slide the digits only when it changes
  var tabSig = null;

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  /** Numbers of five digits and more are grouped by three (hr a no-break space, en a comma). */
  function grp(n) {
    var s = String(n);
    if (s.length < 5) return s;
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'en' ? ',' : '\u00a0'); // not a word
  }
  function q(n, u) { return t('fmt', { n: grp(n), u: u }); }
  function reading(parts) { return parts.map(function (p) { return q(p[0], p[1]); }).join(' '); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function btn(label, title, run, opts) {
    opts = opts || {};
    return noFocus(h('button', { type: 'button', class: 'sd-btn ' + (opts.cls || 'un-btn'), title: title,
      'aria-keyshortcuts': opts.kbd ? opts.kbd.toLowerCase() : null, 'aria-label': opts.aria || null,
      'aria-pressed': opts.pressed == null ? null : String(opts.pressed), 'aria-disabled': opts.disabled ? 'true' : null,
      onclick: function () { if (!opts.disabled) run(); } }, label, opts.kbd ? ' ' : '', opts.kbd ? h('kbd', null, opts.kbd) : ''));
  }
  function revealBtn(s) {
    if (s.hide) return btn(t('reveal'), t('revealKey') + ' (V)', function () { sim.set({ hide: false }); }, { kbd: 'V' });
    if (audience === 'teacher') return btn(t('hide'), t('hideHint'), function () { sim.set({ hide: true }); }, { kbd: 'V' });
    return null;
  }

  /* ══ ruler ══ */
  function trackPx(c) { return Math.max(200, c.stage.clientWidth * 0.86); }
  function topRuler(s) {
    var col = [], side = [];
    var r = s.hide ? t('unknown') : reading(s.reading);
    col.push(h('div', { class: 'un-say' }, h('span', null, cap(t('th_' + s.thing)) + ':'), h('span', { class: 'un-q', translate: 'no' }, r)));
    if (audience !== 'child') {
      var sub = [];
      if (!s.hide) {
        if (s.less) sub.push(t('lessSub', { u: s.unit }));
        else {
          sub.push(t.n('fitsN', s.count, { u: s.unit, n: grp(s.count) }));
          if (!s.exact) sub.push(t('restLeft', { r: reading(U.mixed(s.rest, 'length')) }));
        }
        if (audience === 'teacher') sub.push('· ' + t('bestUnit', { u: s.best }));
      }
      if (sub.length) col.push(h('div', { class: 'un-sub' }, sub.join(' ')));
    }
    side.push(h('div', { class: 'un-grp', role: 'group', 'aria-label': t('unitsLab') }, h('span', null, t('unitsLab')),
      L.RULER_UNITS.map(function (u) {
        return btn(u, t('unitsLab') + ' ' + u, function () { sim.set({ unit: u }); }, { pressed: u === s.unit, cls: 'un-btn un-mono' });
      })));
    side.push(h('div', { class: 'un-grp' },
      btn('−', t('zoomOut') + ' (−)', function () { zoomBy(4); }, { aria: t('zoomOut'), disabled: s.zoom >= L.ZOOM_MAX }),
      btn('+', t('zoomIn') + ' (+)', function () { zoomBy(-4); }, { aria: t('zoomIn'), disabled: s.zoom <= 0 }),
      btn(t('zoomFit'), t('zoomFit'), function () { sim.set({ zoom: s.fits }); }, { pressed: s.zoom === s.fits })));
    side.push(revealBtn(s));
    return [h('div', { class: 'un-col' }, col), h('div', { class: 'un-side' }, side)];
  }
  /** zoom is the view's width (rule 6): zooming in makes it smaller. */
  function zoomBy(d) { sim.set({ zoom: Math.max(0, Math.min(L.ZOOM_MAX, sim.state.zoom + d)) }); }

  function pct(frac) { return (frac * 100).toFixed(3) + '%'; }
  function laneOf(s, th, px) {
    var sel = th.id === s.thing, kids = [];
    if (th.frac * px < 3) kids.push(h('span', { class: 'un-dot' }));
    else kids.push(h('div', { class: 'un-bar', style: { width: pct(Math.min(1, th.frac)) } }));
    if (th.frac > 1) kids.push(h('span', { class: 'un-more' }, t('goesOn') + ' →'));
    if (sel && !s.hide) {
      var bf = s.f / s.W;
      if (s.less) {
        kids.push(h('div', { class: 'un-band', dataset: { less: '' }, style: { left: '0', width: pct(Math.min(1, bf)) } }));
        if (bf > 1 && th.frac <= 1) kids.push(h('span', { class: 'un-more' }, '1 ' + s.unit + ' →'));
      } else if (s.tooSmall) {
        kids.push(h('span', { class: 'un-note' }, s.unit + ': ' + t('tooSmall')));
      } else {
        var n = Math.min(s.count, Math.ceil(1 / bf));
        var wpx = bf * px;
        for (var i = 0; i < n; i++) {
          var label = wpx >= 16 + 9 * String(i + 1).length ? String(i + 1) : '';
          // a band that runs past the view is cut at its edge
          kids.push(h('div', { class: 'un-band', style: { left: pct(i * bf), width: pct(Math.min(bf, 1 - i * bf)) } }, label));
        }
      }
    }
    return h('div', { class: 'un-row', dataset: sel ? { sel: '' } : {}, title: t('thingHint'),
      onclick: function () { sim.set({ thing: th.id }); } },

        else if (s.bigger && s.bigger !== 'same' && s.bigger !== s.side) put(t('cVsBig', { big: t('sideW_' + s.bigger), heavy: t('sideW_' + s.side) }));
        else put(t('cVsSame', { heavy: t('sideW_' + s.side) }));
      } else if (s.weighed) {
        if (s.item === 'kg1') { if (A === 'teacher') putHl(t('cMistKg')); put(t('cRelKg')); }
        else if (s.item === 'dag1') put(t('cRelDag'));
        else put(t('cWeighed', { m: reading(s.massL) }));
      } else if (!s.w.length) put(t('cBalEmpty'));
      else if (s.side === 'left') put(t('cBalLeft', { sum: reading(s.sumMixed) }));
      else put(t('cBalRight', { sum: reading(s.sumMixed) }));
      if (A === 'adult') put(t('whyBal'));
      return out;
    }
    if (s.over) { put(t('cTabOver', { to: s.to })); return out; }
    if (s.hide) { put(t(A === 'child' ? 'cAskTabC' : 'cAskTab', { to: s.to })); return out; }
    var rr = reading(s.reading);
    if (A === 'child') { put(t('cTabC', { eq: eqOf(s) })); return out; }
    if (s.mistake != null && A === 'teacher') {
      putHl(t('cMistZero', { wrong: q(s.mistake, s.to), from: s.from, to: s.to, steps: t.n('stepsN', s.steps), zeros: t.n('zerosN', s.zeros.length) }));
    }
    if (s.dir === 'smaller') put(t('cTabSmaller', { to: s.to, r: rr }));
    else if (s.dir === 'same') put(t('cTabSame'));
    else if (s.exact) put(t('cTabBigger', { to: s.to, r: rr }));
    else if (s.whole === 0) put(t('cTabLess', { to: s.to, r: rr }));
    else put(t('cTabBiggerRest', { to: s.to, w: q(s.whole, s.to), r: rr }));
    if (A === 'teacher' && s.reading.length === 2 && s.reading[1][1] === s.from && s.reading[0][0] < 10 && s.reading[1][0] < 10) {
      var sum = s.reading.reduce(function (a, p) { return a + p[0]; }, 0);
      put(t('cMistMix', { mixed: rr, sum: q(sum, s.from), n: q(s.n, s.from) }));
    }
    if (A === 'adult') put(t('whyTab'));
    return out;
  }

  /* ══ the header: the audience switch ══ */
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  var allUnits = ['mm', 'cm', 'dm', 'm', 'km', 'dl', 'l'];
  function m(mode) { return function (prm) { return prm.mode === mode; }; }
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, options: L.MODES.map(function (x) { return [x, t('mode_' + x)]; }) },
      { key: 'thing', type: 'select', label: t('thing'), value: L.defaults.thing, visible: m('ruler'),
        options: L.THING_IDS.map(function (id) { return [id, cap(t('th_' + id))]; }) },
      { key: 'zoom', type: 'range', label: t('zoom'), value: L.defaults.zoom, min: 0, max: L.ZOOM_MAX, visible: hidden },
      { key: 'item', type: 'select', label: t('item'), value: L.defaults.item, visible: m('balance'),
        options: L.ITEM_IDS.map(function (id) { return [id, cap(t('it_' + id))]; }) },
      { key: 'vs', type: 'select', label: t('vs'), value: L.defaults.vs, visible: m('balance'),
        options: [['none', cap(t('vs_none'))]].concat(L.ITEM_IDS.map(function (id) { return [id, cap(t('it_' + id))]; })) },
      { key: 'qty', type: 'choice', label: t('qty'), value: L.defaults.qty, visible: m('table'),
        options: [['length', t('qty_length')], ['volume', t('qty_volume')]] },
      { key: 'n', type: 'range', label: t('n'), value: L.defaults.n, min: 1, visible: m('table'),
        max: function (prm) { var s = L.table(prm); return U.nMax(s.qty, s.from); } },
      // asking first: the stage's button and V (the panel has no room for it in every mode)
      { key: 'hide', type: 'toggle', label: t('hide'), hint: t('hideHint'), value: L.defaults.hide, visible: hidden },
      // the stage's buttons; here so the URL and the presets carry them
      { key: 'unit', type: 'choice', label: t('unit'), value: L.defaults.unit, options: L.RULER_UNITS.map(function (u) { return [u, u]; }), visible: hidden },
      { key: 'from', type: 'select', label: t('fromLab'), value: L.defaults.from, options: allUnits.map(function (u) { return [u, u]; }), visible: hidden },
      { key: 'to', type: 'select', label: t('toLab'), value: L.defaults.to, options: allUnits.map(function (u) { return [u, u]; }), visible: hidden }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'v', label: t('revealKey'), run: function (sm) { sm.set({ hide: !sm.params.hide }); } },
      { key: '+', label: t('zoomIn'), run: function (sm) { if (sm.state.mode === 'ruler') zoomBy(-4); } },
      { key: '-', label: t('zoomOut'), run: function (sm) { if (sm.state.mode === 'ruler') zoomBy(4); } }
    ],

    legend: [
      { c: 1, label: t('legThing') },
      { c: 2, label: t('legUnit') },
      { shape: 'dash', label: t('legZero') }
    ],

    render: render,
    caption: caption
  });

  // ── keep the params what the page shows: a new thing fits the zoom (rule 6), a new family resets its units, the
  //    weights in the URL; remember the last unit for rule 5 ──
  var sig = null;
  function baseW() {
    var pr = sim.preset ? L.PRESETS.filter(function (x) { return x.id === sim.preset; })[0] : null;
    return pr && pr.params.w ? pr.params.w : L.defaults.w;
  }
  function urlW(p) {
    try {
      var u = new URLSearchParams(window.location.search), enc = L.encodeW(p.w);
      if (enc === L.encodeW(baseW())) u.delete('w'); else u.set('w', enc);
      var qs = u.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    } catch (e) { /* file:// in some browsers */ }
  }
  sim.on(function (c) {
    var s = c.state, p = c.params, fix = {};
    if (sig && s.mode === 'ruler' && sig.thing !== p.thing && sig.mode === 'ruler' && p.zoom === sig.zoom) fix.zoom = L.units.fitZoom(L.THINGS[s.thing]);
    if (s.mode === 'table') {
      if (p.from !== s.from) fix.from = s.from;
      if (p.to !== s.to) fix.to = s.to;
      if (p.n !== s.n) fix.n = s.n;
    }
    sig = { thing: p.thing, zoom: p.zoom, mode: s.mode };
    urlW(p);
    if (Object.keys(fix).length) sim.set(fix, { preset: sim.preset });
  });
  (function () {
    var u = new URLSearchParams(window.location.search), w = u.get('w');
    if (w !== null) sim.set({ w: L.decodeW(w) }, { preset: sim.preset });
    // rule 6: a link naming a thing but no zoom fits the zoom to it
    if (u.has('thing') && !u.has('zoom') && sim.state.mode === 'ruler') sim.set({ zoom: L.units.fitZoom(L.THINGS[sim.state.thing]) }, { preset: sim.preset });
  })();

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
