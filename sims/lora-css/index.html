<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var F_AXIS = 250;                         // the frequency axis, ± kHz from the centre (fits 500 kHz)
  var KIND_C = { pre: 1, sync: 2, down: 2, data: 3 };
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian; at most d decimals, trailing zeros dropped.
  function num(x, d) {
    var s = String(Number(x.toFixed(d == null ? 2 : d)));
    if (s.indexOf('-') === 0) s = '−' + s.slice(1);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function fmtS(sec) { return t('s', { v: num(sec, sec < 10 ? 1 : 0) }); }
  function fmtMs(ms) {
    if (ms >= 1000) return fmtS(ms / 1000);
    return t('ms', { v: num(ms, ms < 10 ? 3 : ms < 100 ? 1 : 0) });
  }
  function fmtRate(b) { return b >= 1000 ? t('kbps', { v: num(b / 1000, 1) }) : t('bps', { v: num(b, 0) }); }
  function fmtTimes(x) { return num(x, x >= 10 ? 0 : 1); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function sup(n) { return String(n).replace(/\d/g, function (d) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]; }); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  /** A tick step of 1, 2 or 5 × 10^k giving about n ticks over span. */
  function niceStep(span, n) {
    var raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }

  // ── the time–frequency plot ──
  function drawPlot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), t0 = st.span[0], t1 = st.span[1], win = t1 - t0;
    var left = 4.6 * r, right = 0.6 * r, top = 2.4 * r, bot = 2.2 * r;
    var pw = W - left - right, ph = H - top - bot;
    var X = function (ms) { return left + (Math.max(t0, Math.min(ms, t1)) - t0) / win * pw; };
    var Xu = function (ms) { return left + (ms - t0) / win * pw; };     // unclamped: chirps are cut by the clip path
    var Y = function (khz) { return top + (F_AXIS - khz) / (2 * F_AXIS) * ph; };
    var lo = -st.BW / 2, hi = st.BW / 2, M = st.chips;
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var clipId = 'lc-clip';
    svg.append(s('defs', {}, s('clipPath', { id: clipId }, s('rect', { x: left, y: top - 2, width: pw, height: ph + 4 }))));
    svg.append(s('rect', { class: 'lc-box', x: left, y: top, width: pw, height: ph }));
    svg.append(s('rect', { class: 'lc-band', x: left, y: Y(hi), width: pw, height: Y(lo) - Y(hi) }));
    // frequency ticks
    [-250, -125, 0, 125, 250].forEach(function (f) {
      svg.append(s('line', { class: 'lc-grid', x1: left, x2: left + pw, y1: Y(f), y2: Y(f) }));
      svg.append(s('text', { x: left - 0.3 * r, y: Y(f) + 0.3 * r, 'text-anchor': 'end' }, num(f, 0)));
    });
    if (st.BW < 2 * F_AXIS) svg.append(s('text', { x: left + pw - 0.3 * r, y: Y(hi) - 0.35 * r, 'text-anchor': 'end', class: 'lc-brk' }, 'BW = ' + t('kHz', { v: num(st.BW, 0) })));
    svg.append(s('text', { x: 1.0 * r, y: top + ph / 2, 'text-anchor': 'middle', transform: 'rotate(-90 ' + (1.0 * r) + ' ' + (top + ph / 2) + ')' }, t('axisFreq')));
    // time ticks
    var step = niceStep(win, Math.max(3, Math.min(6, Math.floor(pw / (5 * r))))), unitS = t1 >= 1000;
    for (var tk = Math.ceil(t0 / step - 1e-9) * step; tk <= t1 + 1e-9; tk += step) {
      svg.append(s('line', { class: 'lc-tick', x1: X(tk), x2: X(tk), y1: top + ph, y2: top + ph + 0.35 * r }));
      svg.append(s('text', { x: X(tk), y: top + ph + 1.3 * r, 'text-anchor': tk === 0 ? 'start' : 'middle' },
        unitS ? num(tk / 1000, 3) : num(tk, 2)));
    }
    svg.append(s('text', { x: left + pw, y: top + ph + 2.15 * r, 'text-anchor': 'end' }, t('axisTime') + ' (' + (unitS ? 's' : 'ms') + ')'));
    // chirps
    var g = s('g', { 'clip-path': 'url(#' + clipId + ')' });
    var symW = st.Ts / win * pw, showVals = symW >= 2.8 * r, showSep = symW >= 1.5 * r;
    st.chirps.forEach(function (c, i) {
      if (c.start >= t1 - 1e-9 || c.start + c.dur <= t0 + 1e-9) return;
      var x0 = Xu(c.start), x1 = Xu(c.start + c.dur), c3 = s('g', { 'data-c': KIND_C[c.kind] });
      if (showSep && c.start > t0 + 1e-9) g.append(s('line', { class: 'lc-sym', x1: x0, x2: x0, y1: top, y2: top + ph }));
      if (c.kind === 'down') {
        var fEnd = hi - (c.dur / st.Ts) * st.BW;
        c3.append(s('line', { class: 'lc-up', x1: x0, y1: Y(hi), x2: x1, y2: Y(fEnd) }));
      } else {
        var f0 = lo + c.offset / M * st.BW, w = L.wrapAt(c.offset, st.SF);
        if (w == null) {
          c3.append(s('line', { class: 'lc-up', x1: x0, y1: Y(lo), x2: x1, y2: Y(hi) }));
        } else {
          var xw = x0 + w * (x1 - x0);
          c3.append(s('line', { class: 'lc-up', x1: x0, y1: Y(f0), x2: xw, y2: Y(hi) }));
          c3.append(s('line', { class: 'lc-wrap', x1: xw, y1: Y(hi), x2: xw, y2: Y(lo) }));
          c3.append(s('line', { class: 'lc-up', x1: xw, y1: Y(lo), x2: x1, y2: Y(f0) }));
        }
        if (c.kind !== 'pre' && symW >= 0.4 * r) {
          c3.append(s('circle', { class: 'lc-dot', cx: x0, cy: Y(f0), r: Math.max(2.5, Math.min(0.32 * r, symW / 4)) }));
          if (showVals) {
            // the value, and its SF bits when they fit in the symbol's width
            var bin = c.offset.toString(2).padStart(st.SF, '0'), lab = String(c.offset) + ' = ' + bin;
            if (lab.length * 0.5 * r > symW - 0.5 * r) lab = String(c.offset);
            c3.append(s('text', { class: 'lc-val', x: x0 + 0.25 * r, y: Y(f0) > Y(0) ? Y(f0) - 0.45 * r : Y(f0) + 1.15 * r }, lab));
          }
        }
      }
      g.append(c3);
    });
    svg.append(g);
    // brackets over the preamble, the sync part and the data
    var pre = L.PREAMBLE * st.Ts, sync = pre + L.SYNC * st.Ts;
    var brY = top - 0.35 * r;
    [[0, pre, t('bracketPre')], [pre, sync, t('bracketSync')], [sync, st.toaMs, t.n('bracketData', st.payloadSymbols)]].forEach(function (b) {
      if (b[0] >= t1 - 1e-9 || b[1] <= t0 + 1e-9) return;
      var xa = X(b[0]) + 2, xb = X(b[1]) - 2, open = b[1] > t1 + 1e-9;
      if (open) xb = X(t1);
      if (b[0] < t0) xa = X(t0);
      svg.append(s('path', { class: 'lc-bracket', d: 'M' + xa + ' ' + (brY + 0.35 * r) + 'V' + brY + 'H' + xb + (open ? '' : 'V' + (brY + 0.35 * r)) }));
      var label = b[2], est = label.length * 0.5 * r;
      if (xb - xa >= est) svg.append(s('text', { class: 'lc-brk', x: (xa + xb) / 2, y: brY - 0.35 * r, 'text-anchor': 'middle' }, label));
    });
    // the end of the packet, when it falls inside the window
    if (st.toaMs < t1 - 1e-9) {
      var xe = X(st.toaMs);
      svg.append(s('line', { class: 'lc-end', x1: xe, x2: xe, y1: top, y2: top + ph }));
      var endRight = xe + 3 * r > left + pw;
      svg.append(s('text', { class: 'lc-brk', x: endRight ? xe - 0.3 * r : xe + 0.3 * r, y: top + 1.1 * r, 'text-anchor': endRight ? 'end' : 'start' }, t('endMark')));
    }
    box.replaceChildren(svg);
  }

  // ── "changed": the bars that moved by more than 10 % since the last change of params ──
  var lastKey = null, lastState = null, marks = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key === lastKey) return;
    marks = L.changed(lastState, c.state);
    lastKey = key;
    lastState = c.state;
  }

  function bar(id, label, value, frac, ref, c) {
    return h('div', { class: 'lc-bar' + (marks.indexOf(id) >= 0 ? ' sd-changed' : ''), dataset: { bar: id } },
      h('div', { class: 'lc-bar-top' }, h('span', null, label), h('b', null, value)),
      h('div', { class: 'lc-track', 'data-c': String(c) },
        h('div', { class: 'lc-fill', style: { width: (Math.min(1, frac) * 100).toFixed(2) + '%' } }),
        ref == null ? null : h('div', { class: 'lc-ref', title: t('barRef'), style: { left: (Math.min(1, ref) * 100).toFixed(2) + '%' } })));
  }

  function side(st) {
    var kv = function (k, v, wide) { return h('div', { class: wide ? 'lc-wide' : null }, h('span', { class: 'lc-k' }, k), h('span', { class: 'lc-v' }, v)); };
    var card = h('div', { class: 'lc-card' },
      h('div', { class: 'lc-head' }, h('span', { class: 'lc-v' }, 'SF' + st.SF + ' · ' + t('kHz', { v: num(st.BW, 0) }) + ' · 4/' + (4 + st.CR))),
      kv(t('cardSymbol') + ' ' + t('cardTs'), fmtMs(st.Ts)),
      kv(t('cardBits'), t('cardBitsVal', { n: st.SF })),
      kv(t('cardOffsets'), st.chips + ' = 2' + sup(st.SF)),
      kv(t('cardRate'), fmtRate(st.bitRate)),
      kv(t('cardSnr'), t('dB', { v: num(st.snrLimit, 1) })),
      kv(t('cardSens'), t('dBm', { v: num(st.sensitivityDbm, 1) })),
      kv(t('cardSymbols'), t('cardSymbolsVal', { pre: num(L.PREAMBLE + L.SYNC, 2), pay: st.payloadSymbols, all: num(st.symbols, 2) }), true));
    var bars = h('div', { class: 'lc-bars' },
      bar('toa', t('barToa'), fmtMs(st.toaMs), st.toaMs / st.scale.toaMs, st.ref.toaMs / st.scale.toaMs, 1),
      bar('range', t('barRange'), t('times', { v: num(st.rangeFactor, 2) }), st.rangeFactor / st.scale.rangeFactor, 1 / st.scale.rangeFactor, 3),
      bar('wait', t('barWait'), fmtS(st.dutyWaitS), st.dutyWaitS / st.scale.dutyWaitS, st.ref.dutyWaitS / st.scale.dutyWaitS, 4),
      h('div', { class: 'lc-refnote' }, h('span', { class: 'lc-refmark', 'aria-hidden': 'true' }), t('refNote')));
    var head = h('tr', null, ['thSf', 'thTs', 'thToa', 'thSens', 'thRange', 'thWait'].map(function (k) { return h('th', { scope: 'col', class: k === 'thTs' ? 'lc-ts' : null }, t(k)); }));
    var rows = st.table.map(function (rw) {
      var now = rw.sf === st.SF;
      return h('tr', { class: now ? 'lc-now' : null, 'aria-current': now ? 'true' : null },
        h('td', null, h('button', { type: 'button', onclick: function () { sim.set({ SF: rw.sf }); } }, 'SF' + rw.sf)),
        h('td', { class: 'lc-ts' }, fmtMs(rw.ts)), h('td', null, fmtMs(rw.toaMs)), h('td', null, num(rw.sensitivityDbm, 1)),
        h('td', null, t('times', { v: num(rw.rangeFactor, 2) })), h('td', null, fmtS(rw.dutyWaitS)));
    });
    var table = h('table', { class: 'lc-table' }, h('thead', null, head), h('tbody', null, rows));
    return h('div', { class: 'lc-right' }, card, bars, table);
  }

  function note(st) {
    var toa = fmtMs(st.toaMs), win = fmtMs(st.windowMs);
    if (st.view === 'packet') return t('packetAll', { toa: toa });
    if (st.view === 'symbols') return t('zoomNote', { n: L.ZOOM_SYMBOLS, m: st.chips });
    return st.toaMs > st.windowMs ? t('winPart', { win: win, toa: toa }) : t('winAll', { win: win, toa: toa });
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'SF', type: 'range', label: t('SF'), min: 7, max: 12, step: 1, format: function (v) { return 'SF' + v; } },
      { key: 'BW', type: 'choice', label: t('BW'), options: L.BWS.map(function (b) { return [b, t('kHz', { v: b })]; }) },
      { key: 'CR', type: 'choice', label: t('CR'), options: L.CRS.map(function (c) { return [c, '4/' + (4 + c)]; }) },
      { key: 'payload', type: 'range', label: t('payload'), min: 1, max: L.PL_MAX, step: 1, format: function (v) { return t.n('bytes', v); } },
      { key: 'n', type: 'choice', label: t('n'), options: [['free', t('nFree')], ['built', t('nBuilt')]] },
      // the view stays a param (URL); its toggle is the button under the plot, to keep the panel on one screen
      { key: 'view', type: 'choice', label: t('view'), options: L.VIEWS.map(function (v) { return [v, t('view_' + v)]; }), visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'lc-up', label: t('legendUp') },
      { shape: 'lc-down', label: t('legendDown') },
      { shape: 'round', c: 3, label: t('legendData') },
      { shape: 'lc-brk', label: t('legendPre') },
      { shape: 'lc-wrap', label: t('legendWrap') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var st = c.state;
      track(c);
      var plot = h('div', { class: 'lc-plot' });
      var root = h('div', { class: 'lc' },
        h('div', { class: 'lc-left' }, plot, h('p', { class: 'lc-note' }, h('span', null, note(st)),
          h('span', { class: 'lc-views', role: 'group', 'aria-label': t('view') }, L.VIEWS.map(function (v) {
            return h('button', { type: 'button', class: 'lc-view', 'aria-pressed': String(st.view === v), onclick: function () { sim.set({ view: v }); } },
              t('view_' + v));
          })))),
        side(st));
      c.stage.replaceChildren(root);
      drawPlot(plot, st);
    },

    caption: function (c) {
      var st = c.state, pl = t.n('bytesGen', st.payload), out;
      if (st.SF === 7) out = t('capSf7', { ts: fmtMs(st.Ts), pl: pl, toa: fmtMs(st.toaMs), wait: fmtS(st.dutyWaitS) });
      else out = t(st.de ? 'capSfDe' : 'capSf', { sf: st.SF, d: st.SF - 2, ts: fmtMs(st.Ts), pl: pl, toa: fmtMs(st.toaMs), x: fmtTimes(st.vsSf7.toa),
        r: num(st.vsSf7.range, 1), env: t(st.n === 'free' ? 'envFree' : 'envBuilt') });
      out += t('capNoise', { snr: t('dB', { v: num(-st.snrLimit, 1) }) });
      if (st.BW !== 125) out += t('capBw', { bw: t('kHz', { v: st.BW }), k: num(st.BW / 125, 0), db: t('dB', { v: num(10 * Math.log10(st.BW / 125), 1) }) });
      return out;
    }
  });

  // The plot is in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var lastSize = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== lastSize) { lastSize = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
