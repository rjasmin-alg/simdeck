<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // ── numbers in the page's language: a decimal comma, a true minus sign, grouped thousands ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    var neg = v.charAt(0) === '-';
    if (neg) v = v.slice(1);
    var parts = v.split('.');
    if (parts[0].length > 4) parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    v = parts.join(Simdeck.lang === 'hr' ? ',' : '.');
    return (neg ? '−' : '') + v;
  }
  /** Three significant digits, at most two decimals (0.495, 2.00, 13.4, 245, 2452). */
  function sig(x) {
    var a = Math.abs(x);
    return num(x, a >= 99.95 ? 0 : a >= 9.995 ? 1 : 2);
  }
  function ohm(v) { return t('ohm', { v: sig(v) }); }
  function pct(v) {
    var q = v * 100;
    return t('pct', { v: num(q, q >= 99.95 ? 0 : q >= 0.995 ? 1 : 2) });
  }
  function khz(hz) { var k = hz / 1000; return t('khz', { v: num(k, k >= 99.95 ? 0 : k >= 9.995 ? 1 : 2) }); }
  function watts(w) {
    if (w >= 0.1 || w === 0) return t('watt', { v: num(w, w >= 9.95 ? 0 : w >= 0.995 ? 1 : 2) });
    if (w >= 1e-4) return t('mwatt', { v: sig(w * 1000) });
    return t('uwatt', { v: sig(w * 1e6) });
  }
  function swrTxt(v) {
    if (v === null) return '∞';
    if (v >= 1e6) return t('million', { v: num(v / 1e6, 1) });
    return num(v, v >= 99.5 ? 0 : 2);
  }
  function qTxt(v) { return num(v, v >= 9.95 ? 0 : 1); }
  function lenTxt(v) { return t('lenLabel', { v: num(v, 2) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    (function add(list) {
      for (var i = 0; i < list.length; i++) {
        if (Array.isArray(list[i])) add(list[i]);
        else if (list[i] != null) e.append(list[i]);
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function arrowHead(x, y, ux, uy, size, cls) {
    var hw = 0.55 * size;
    return s('polygon', { class: cls, points: pts([
      [x, y], [x - ux * size - uy * hw, y - uy * size + ux * hw], [x - ux * size + uy * hw, y - uy * size - ux * hw]]) });
  }

  // ── the antenna at a fixed scale (λ/2 fills the height), its feed with the coil, the transformer and the transmitter ──
  function drawAntenna(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'sa-title', x: 0.2 * r0, y: 1.2 * r0 }, t('antTitle')));
    var top = 2.6 * r0, bottom = H - 1.4 * r0, cy = (top + bottom) / 2, sc = (bottom - top) / 0.5;
    var cx = W - 4.2 * r0, half = st.len / 2, A = 1.6 * r0;
    function Y(v) { return cy - v * sc; }

    // the half-wave dipole's outline, dotted, at the right edge, with its length in metres
    var ox = W - 1.0 * r0;
    svg.append(s('line', { class: 'sa-outline', x1: ox, y1: Y(0.25), x2: ox, y2: Y(-0.25) }));
    [0.25, -0.25].forEach(function (v) { svg.append(s('line', { class: 'sa-tick', x1: ox - 0.4 * r0, y1: Y(v), x2: ox + 0.4 * r0, y2: Y(v) })); });
    svg.append(s('text', { class: 'sa-halo sa-mute', x: ox + 0.5 * r0, y: Y(0.25) - 0.5 * r0, 'text-anchor': 'end' },
      t('halfLabel') + ' = ' + t('halfMetres', { v: num(L.LAMBDA / 2, 1) })));

    // the current now, |I(s)·cos ωt| as a spindle round the wire, arrows for its direction
    var cut = function (v) { return Math.sin(2 * Math.PI * (half - Math.abs(v))) / Math.sin(Math.PI * st.len); };
    var poly = [], n = 40, k, v;
    for (k = 0; k <= n; k++) { v = half - 2 * half * k / n; poly.push([cx + Math.abs(cut(v) * st.cosT) * A, Y(v)]); }
    for (k = n; k >= 0; k--) { v = half - 2 * half * k / n; poly.push([cx - Math.abs(cut(v) * st.cosT) * A, Y(v)]); }
    if (Math.abs(st.cosT) > 0.02) svg.append(s('polygon', { class: 'sa-cur', points: pts(poly) }));

    // the wire with its feed gap
    var gap = 0.35 * r0;
    svg.append(s('line', { class: 'sa-wire', x1: cx, y1: Y(half), x2: cx, y2: cy - gap }));
    svg.append(s('line', { class: 'sa-wire', x1: cx, y1: cy + gap, x2: cx, y2: Y(-half) }));
    if (Math.abs(st.cosT) > 0.1 && half * sc > 2.2 * r0) {
      var dir = st.cosT > 0 ? -1 : 1;        // cos ωt > 0: the current flows up the wire
      [half / 2, -half / 2].forEach(function (m) {
        svg.append(arrowHead(cx, Y(m) + dir * 0.5 * r0, 0, dir, 0.9 * r0, 'sa-head'));
      });
    }
    // the charges at the tips: + at the top while sin ωt > 0
    if (Math.abs(st.sinT) > 0.1) {
      var rq = 0.25 * r0 + 0.45 * r0 * Math.abs(st.sinT), topPlus = st.sinT > 0;
      [[Y(half) - rq - 0.15 * r0, topPlus], [Y(-half) + rq + 0.15 * r0, !topPlus]].forEach(function (c) {
        svg.append(s('circle', { class: c[1] ? 'sa-plus' : 'sa-minus', cx: cx, cy: c[0], r: rq }));
        svg.append(s('text', { class: 'sa-bold', x: cx, y: c[0] + 0.35 * r0, 'text-anchor': 'middle' }, c[1] ? '+' : '−'));
      });
    }
    // its length beside the wire, near the top end
    // its length under the bottom end, or beside it where the end is near the bottom edge
    var below = Y(-half) + 2.5 * r0 <= H - 0.3 * r0;
    svg.append(s('text', { class: 'sa-halo sa-bold', x: below ? cx : cx - 2.0 * r0, y: below ? Y(-half) + 2.5 * r0 : Y(-half) + 0.3 * r0,
      'text-anchor': below ? 'middle' : 'end' }, lenTxt(st.len)));

    // the feed: two wires to the left, the coil in the upper one, the transformer, the transmitter
    var yU = cy - gap, yD = cy + gap, xg = 1.3 * r0, xb0 = 2.9 * r0, xb1 = 5.1 * r0, xc0 = 6.0 * r0, xc1 = cx - 0.9 * r0;
    svg.append(s('circle', { class: 'sa-gen', cx: xg, cy: cy, r: 0.9 * r0 }));
    svg.append(s('text', { x: xg, y: cy + 0.4 * r0, 'text-anchor': 'middle' }, '~'));
    svg.append(s('text', { class: 'sa-halo', x: xg - 0.6 * r0, y: cy + 2.3 * r0 }, t('txLabel')));
    svg.append(s('line', { class: 'sa-feedline', x1: xg + 0.9 * r0, y1: cy, x2: xb0, y2: cy }));
    svg.append(s('rect', { class: 'sa-box', x: xb0, y: cy - 1.1 * r0, width: xb1 - xb0, height: 2.2 * r0, rx: 4 }));
    svg.append(s('text', { x: (xb0 + xb1) / 2, y: cy + 0.35 * r0, 'text-anchor': 'middle' }, t('matchLabel')));
    svg.append(s('line', { class: 'sa-feedline', x1: xb1, y1: yD, x2: cx, y2: yD }));
    if (st.coil && st.lCoil > 0) {
      // more turns for more inductance: 1 + 1.6·log2(1 + L/2 µH), 1 … 10
      var turns = Math.max(1, Math.min(10, Math.round(1 + 1.6 * Math.log2(1 + st.lCoil / 2))));
      var room = xc1 - xc0, tw = Math.min(0.75 * r0, room / (turns + 1)), w0 = xc0 + (room - turns * tw) / 2, d = 'M' + xb1 + ',' + yU + ' L' + w0 + ',' + yU;
      for (k = 0; k < turns; k++) d += ' a' + (tw / 2) + ',' + (0.75 * r0) + ' 0 0 1 ' + tw + ',0';
      d += ' L' + cx + ',' + yU;
      svg.append(s('path', { class: 'sa-coil', d: d }));
      svg.append(s('text', { class: 'sa-halo sa-bold', x: (xc0 + xc1) / 2, y: yU - 1.2 * r0, 'text-anchor': 'middle' },
        t('coilLabel', { v: sig(st.lCoil) })));
    } else {
      svg.append(s('line', { class: 'sa-feedline', x1: xb1, y1: yU, x2: cx, y2: yU }));
      svg.append(s('text', { class: 'sa-halo sa-mute', x: (xc0 + xc1) / 2, y: yU - 0.6 * r0, 'text-anchor': 'middle' }, t('noCoil')));
    }
    box.replaceChildren(svg);
  }

  // ── SWR across the 40 m band, 7.000 … 7.200 MHz, SWR 1 … 4 ──
  var SWR_TOP = 4;
  function drawSwr(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'sa-title', x: 0.2 * r0, y: 1.2 * r0 }, t('swrTitle')));
    var pad = { l: 2.4 * r0, r: 0.9 * r0, t: 2.0 * r0, b: 1.5 * r0 }, cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var f0 = L.BAND[0], f1 = L.BAND[1];
    function X(f) { return pad.l + (f - f0) / (f1 - f0) * cw; }
    function Y(w) { return pad.t + ch * (1 - (Math.min(SWR_TOP, w) - 1) / (SWR_TOP - 1)); }
    // the band where SWR ≤ 2

      var a = Math.max(f0, st.fLo), b = Math.min(f1, st.fHi);
      if (b > a) svg.append(s('rect', { class: 'sa-band', x: X(a), y: pad.t, width: Math.max(1.5, X(b) - X(a)), height: ch }));
    }
    [2, 3].forEach(function (w) { svg.append(s('line', { class: w === 2 ? 'sa-limit' : 'sa-grid', x1: pad.l, x2: pad.l + cw, y1: Y(w), y2: Y(w) })); });
    [7.05e6, 7.1e6, 7.15e6].forEach(function (f) { svg.append(s('line', { class: 'sa-grid', x1: X(f), x2: X(f), y1: pad.t, y2: pad.t + ch })); });
    svg.append(s('rect', { class: 'sa-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [1, 2, 3, 4].forEach(function (w) { svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(w) + 0.35 * r0, 'text-anchor': 'end' }, String(w))); });
    [7.0e6, 7.05e6, 7.1e6, 7.15e6, 7.2e6].forEach(function (f, i) {
      if (i % 2 && cw < 22 * r0) return;          // a phone: 7.0, 7.1 and 7.2 only
      svg.append(s('text', { x: X(f), y: H - 0.15 * r0, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' },
        t('mhz', { v: num(f / 1e6, f % 1e5 ? 2 : 1) }) + (i === 4 ? ' ' + t('mhzAxis') : '')));
    });
    // the curve, clipped at the top
    var run = [], above = null;                      // above: the x of the last sample clipped at the top edge
    function flush() { if (run.length > 1) svg.append(s('polyline', { class: 'sa-swr', points: pts(run) })); run = []; }
    L.swrCurve({ len: st.len, coil: st.coil, qc: st.qc }).forEach(function (q) {
      if (q.swr === null || q.swr > SWR_TOP) { if (run.length) { run.push([X(q.f), Y(SWR_TOP)]); flush(); } above = X(q.f); return; }
      if (!run.length && above !== null) run.push([above, Y(SWR_TOP)]);   // coming down from above the top edge
      above = null;
      run.push([X(q.f), Y(q.swr)]);
    });
    flush();
    // the bandwidth bracket, or why there is none
    if (st.bw !== null && !st.wholeBand) {
      var xa = X(Math.max(f0, st.fLo)), xb = X(Math.min(f1, st.fHi)), yb = pad.t + 0.9 * r0;
      svg.append(s('path', { class: 'sa-bracket', d: 'M' + xa + ',' + (yb + 0.4 * r0) + ' V' + yb + ' H' + xb + ' V' + (yb + 0.4 * r0) }));
      // the width beside the bracket, right or left, or inside it under the bar where neither side has room
      var lab = khz(st.bw), lw = 0.62 * r0 * lab.length, at;
      if (xb + 0.4 * r0 + lw <= W) at = { x: xb + 0.4 * r0, y: yb + 0.35 * r0, a: 'start' };
      else if (xa - 0.4 * r0 - lw >= pad.l) at = { x: xa - 0.4 * r0, y: yb + 0.35 * r0, a: 'end' };
      else at = { x: (xa + xb) / 2, y: yb + 1.6 * r0, a: 'middle' };
      svg.append(s('text', { class: 'sa-halo sa-bold', x: at.x, y: at.y, 'text-anchor': at.a }, lab));
    } else if (st.wholeBand) {
      svg.append(s('text', { class: 'sa-halo sa-bold', x: pad.l + cw / 2, y: pad.t + 1.3 * r0, 'text-anchor': 'middle' }, t('swrWhole') + ' (' + khz(st.bw) + ')'));
    } else if (st.swr0 === null || st.swr0 > SWR_TOP) {
      svg.append(s('text', { class: 'sa-halo sa-bold', x: pad.l + cw / 2, y: pad.t + ch / 2, 'text-anchor': 'middle' }, t('swrOff', { v: swrTxt(st.swr0) })));
    }
    box.replaceChildren(svg);
  }

  // ── the trade-off: efficiency against bandwidth, both log; η × bandwidth is fixed by the length ──
  var BW_MIN = 500, BW_MAX = 1e6, ETA_MIN = 0.005, ETA_MAX = 1;
  var REFS = null, PATHS = {};
  function drawTrade(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    // the title on two lines where it does not fit on one (a phone): measured, so the box is attached first
    var title = t('tradeTitle'), cut = title.indexOf(': ');
    var one = s('text', { class: 'sa-title', x: 0.2 * r0, y: 1.2 * r0 }, title);
    svg.append(one); box.replaceChildren(svg);
    var two = cut > 0 && one.getComputedTextLength() > W - 0.4 * r0;
    if (two) {
      one.remove();
      [title.slice(0, cut + 1), title.slice(cut + 2)].forEach(function (line, i) {
        svg.append(s('text', { class: 'sa-title', x: 0.2 * r0, y: (1.2 + 1.25 * i) * r0 }, line));
      });
    }
    var pad = { l: 3.4 * r0, r: 0.9 * r0, t: (two ? 4.1 : 2.9) * r0, b: 2.6 * r0 }, cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var lx0 = Math.log10(BW_MIN), lx1 = Math.log10(BW_MAX), ly0 = Math.log10(ETA_MIN), ly1 = Math.log10(ETA_MAX);
    function X(bw) { return pad.l + (Math.log10(bw) - lx0) / (lx1 - lx0) * cw; }
    function Y(eta) { return pad.t + ch * (1 - (Math.log10(eta) - ly0) / (ly1 - ly0)); }
    var clip = 'sa-clip-' + Math.round(W) + 'x' + Math.round(H);
    svg.append(s('defs', null, s('clipPath', { id: clip }, s('rect', { x: pad.l, y: pad.t, width: cw, height: ch }))));
    [1e3, 1e4, 1e5].forEach(function (x) { svg.append(s('line', { class: 'sa-grid', x1: X(x), x2: X(x), y1: pad.t, y2: pad.t + ch })); });
    [0.01, 0.1].forEach(function (y) { svg.append(s('line', { class: 'sa-grid', x1: pad.l, x2: pad.l + cw, y1: Y(y), y2: Y(y) })); });
    svg.append(s('rect', { class: 'sa-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [1e3, 1e4, 1e5, 1e6].forEach(function (x, i) {
      svg.append(s('text', { x: X(x), y: pad.t + ch + 1.1 * r0, 'text-anchor': i === 3 ? 'end' : 'middle' }, num(x / 1000, 0)));
    });
    svg.append(s('text', { class: 'sa-mute', x: pad.l + cw / 2, y: H - 0.15 * r0, 'text-anchor': 'middle' }, t('tradeX') + ', kHz →'));
    [0.01, 0.1, 1].forEach(function (y) {
      svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(y) + (y === 1 ? 0.9 : 0.35) * r0, 'text-anchor': 'end' }, t('pct', { v: num(y * 100, 0) })));
    });
    svg.append(s('text', { class: 'sa-mute', x: -(pad.t + ch / 2), y: 0.95 * r0, transform: 'rotate(-90)', 'text-anchor': 'middle' }, t('tradeY') + ' →'));

    var g = s('g', { 'clip-path': 'url(#' + clip + ')' });
    svg.append(g);
    function kLine(kk, cls) { return s('line', { class: cls, x1: X(kk), y1: Y(1), x2: X(BW_MAX), y2: Y(kk / BW_MAX) }); }
    // the 40 m band's width
    g.append(s('line', { class: 'sa-bandline', x1: X(2e5), x2: X(2e5), y1: pad.t, y2: pad.t + ch }));
    // reference lengths, dotted, labelled at the top
    if (!REFS) REFS = L.refLines();
    REFS.forEach(function (r) {
      if (Math.abs(r.len - st.len) < 1e-9) return;
      g.append(kLine(r.k, 'sa-ref'));
      if (X(r.k) < pad.l + cw - 2 * r0) svg.append(s('text', { class: 'sa-halo sa-mute', x: X(r.k), y: pad.t - 0.25 * r0, 'text-anchor': 'middle' }, lenTxt(r.len)));
    });
    // the chosen coil over every length, faint
    var key = String(st.qc);
    if (!PATHS[key]) PATHS[key] = L.lengthPath(st.qc);
    g.append(s('polyline', { class: 'sa-path', points: pts(PATHS[key].map(function (q) { return [X(q.bw), Y(q.eta)]; })) }));
    // its label left of where it crosses 10 % (or of its start when it never is that low)
    var p0 = PATHS[key].filter(function (q) { return q.eta >= 0.1; })[0], pl = [X(p0.bw), Y(p0.eta)], low = p0 !== PATHS[key][0];
    svg.append(s('text', { class: 'sa-halo sa-mute', x: pl[0] - 0.4 * r0, y: low ? pl[1] + 0.35 * r0 : pl[1] + 2.2 * r0, 'text-anchor': 'end' },
      st.qc === 'ideal' ? t('tradePathIdeal') : t('tradePath', { q: String(st.qc) })));
    // Chu's line for this size, and this length's line
    g.append(kLine(st.kChu, 'sa-chu'));
    var kNow = L.analyse(st.len, true, 'ideal').k;
    g.append(kLine(kNow, 'sa-line'));
    if (X(st.kChu) < pad.l + cw - 1.5 * r0) svg.append(s('text', { class: 'sa-halo', x: X(st.kChu) + 0.3 * r0, y: Y(1) + 1.1 * r0 }, t('tradeChu')));
    svg.append(s('text', { class: 'sa-halo sa-bold', x: Math.min(X(kNow), pad.l + cw - 2 * r0), y: pad.t - 0.25 * r0, 'text-anchor': 'middle' }, lenTxt(st.len)));
    var bx = X(2e5) - 0.35 * r0, by = pad.t + ch - 0.3 * r0;
    svg.append(s('text', { class: 'sa-halo', x: bx, y: by, transform: 'rotate(-90 ' + bx + ' ' + by + ')' }, t('tradeBand')));
    // a dot for each coil on this length's line, the chosen one large
    // labels above right of each dot (the line runs down to the right), skipped where they would overlap
    var lastLab = null;
    L.coilPoints(st.len).forEach(function (q) {
      var now = st.coil && String(q.qc) === String(st.qc), x = X(q.bw), y = Y(q.eta);
      g.append(s('circle', { class: now ? 'sa-dotnow' : 'sa-dot', cx: x, cy: y, r: (now ? 0.5 : 0.3) * r0 }));
      if (lastLab && Math.hypot(x - lastLab[0], y - lastLab[1]) < 1.3 * r0 && !now) return;
      lastLab = [x, y];
      var lbl = q.qc === 'ideal' ? t('tradeIdeal') : String(q.qc);
      svg.append(s('text', { class: 'sa-halo' + (now ? ' sa-bold' : ''), x: Math.min(x + 0.5 * r0, pad.l + cw - 2.6 * r0), y: Math.max(y - 0.5 * r0, pad.t + 1.0 * r0) }, 'Q ' + lbl));
    });
    box.replaceChildren(svg);
  }

  // ── the energy stored, swinging between the coil and the field round the wire ──
  function energy(st) {
    var bar = function (cls, f) { return h('div', { class: 'sa-meter' }, h('span', { class: cls, style: 'width:' + (100 * f).toFixed(1) + '%' })); };
    var kids = [h('h3', null, t('enTitle'))];
    if (st.coil && st.q !== null) {
      kids.push(h('span', null, st.coilShare >= 0.5 ? t('enMagCoil', { p: pct(st.coilShare) }) : t('enMag')), bar('sa-mag', st.wMag));
      kids.push(h('span', null, t('enEl')), bar('sa-el', st.wEl));
      kids.push(h('p', null, t('enCycle', { r: pct(st.perRad), h: pct(st.perHeat) })));
    } else kids.push(h('p', null, t('enNone')));
    return h('div', { class: 'sa-energy' }, kids);
  }

  // ── the readout table and where the 100 W go ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'sa-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var coilOn = st.coil && st.xCoil > 0;
    return h('table', { class: 'sa-table' }, h('tbody', null,
      row(t('rowLen'), t('lenCell', { v: num(st.len, 2), m: num(st.metres, 2) }), true),
      row(t('rowRrad'), ohm(st.rRad), true),
      row(t('rowX'), t('xCap', { v: sig(-st.xAnt) })),
      row(t('rowCoil'), coilOn ? t('coilCell', { l: sig(st.lCoil), x: sig(st.xCoil) }) : t('none')),
      row(t('rowRcoil'), !st.coil ? t('none') : st.lossless ? t('rcIdeal') : t('rcCell', { r: ohm(st.rCoil), q: String(st.qc) })),
      row(t('rowRwire'), ohm(st.rWire)),
      row(t('rowEta'), st.coil ? pct(st.eta) : t('etaOf', { v: pct(st.eta), p: watts(st.pIn) }), true),
      row(t('rowQ'), st.q === null ? t('none') : t('qCell', { q: qTxt(st.q), r: qTxt(st.qRad), c: qTxt(st.qChu) })),
      row(t('rowBw'), st.bw === null ? t('none') : khz(st.bw), true),
      row(t('rowSwr'), swrTxt(st.swr0))));
  }
  function power(st) {
    var segs = [['sa-p-rad', st.pRad, 'powRad'], ['sa-p-coil', st.pCoil, 'powCoil'], ['sa-p-wire', st.pWire, 'powWire'], ['sa-p-ref', st.pRef, 'powRef']];
    return h('div', { class: 'sa-pow' },
      h('h3', null, t('powTitle')),
      h('div', { class: 'sa-powbar' }, segs.map(function (g) { return h('span', { class: g[0], style: 'width:' + (g[1] / L.P_TX * 100).toFixed(2) + '%' }); })),
      h('ul', { class: 'sa-powkeys' }, segs.map(function (g) { return h('li', null, h('i', { class: g[0] }), t(g[2]), h('b', null, watts(g[1]))); })));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'len', type: 'range', label: t('len'), min: L.LEN_MIN, max: L.LEN_MAX, step: L.LEN_STEP, format: function (v) { return t('lenVal', { v: num(v, 2) }); } },
      { key: 'coil', type: 'toggle', label: t('coil'), hint: t('coilHint') },
      { key: 'qc', type: 'choice', label: t('qc'), hint: t('qcHint'), disabled: function (p) { return p.coil ? false : t('qcOff'); },
        options: L.QCS.map(function (q) { return [q, q === 'ideal' ? t('qcIdeal') : String(q)]; }) },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'sa-cur', label: t('legendCur') },
      { shape: 'sa-coil', label: t('legendCoil') },
      { shape: 'sa-outline', label: t('legendOutline') },
      { shape: 'sa-band', label: t('legendBand') },
      { shape: 'sa-line', label: t('legendLine') },
      { shape: 'sa-chu', label: t('legendChu') }
    ],

    render: function (c) {
      var ap = h('div', { class: 'sa-pic' }), sp = h('div', { class: 'sa-pic' }), tp = h('div', { class: 'sa-pic' });
      c.stage.replaceChildren(h('div', { class: 'sa' },
        h('div', { class: 'sa-col' }, ap, energy(c.state)),
        h('div', { class: 'sa-col' }, sp, tp),
        h('div', { class: 'sa-col' }, table(c.state), h('p', { class: 'sa-units' }, t('units')), power(c.state))));
      drawAntenna(ap, c.state);
      drawSwr(sp, c.state);
      drawTrade(tp, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var vars = {
        len: b(t('lenCell', { v: num(st.len, 2), m: num(st.metres, 2) })), r: b(ohm(st.rRad)), x: b(t('xCap', { v: sig(-st.xAnt) })),
        swr: b(swrTxt(st.swr0)), pin: b(watts(st.pIn)), lc: b(t('coilLabel', { v: sig(st.lCoil) })), qc: b(String(st.qc)),
        rc: b(ohm(st.rCoil)), rw: b(ohm(st.rWire)), prad: b(watts(st.pRad)), pcoil: b(watts(st.pCoil)),
        q: b(st.q === null ? '' : qTxt(st.q)), bw: b(st.bw === null ? '' : khz(st.bw)), k: b(st.k === null ? '' : khz(st.k))
      };
      var parts = [];
      function say(key) { if (parts.length) parts.push(' '); parts = parts.concat(t.parts(key, vars)); }
      say(st.nearRes ? 'cap_resFull' : st.rRad < 25 ? 'cap_res' : 'cap_resMid');
      if (!st.coil) {
        if (st.swr0 !== null && st.swr0 <= L.SWR_LIMIT) say('cap_bareOk');
        else {
          say(st.pIn < 1 ? 'cap_bare' : 'cap_bareSome');
          say(st.bandMinSwr !== null && st.bandMinSwr <= L.SWR_LIMIT ? 'cap_bareEdge' : 'cap_bareBand');
        }
        return parts;
      }
      if (st.lossless) say('cap_ideal');
      else if (st.nearRes) say('cap_coilFull');
      else say('cap_coil');
      say(st.wholeBand ? 'cap_bandWhole' : st.bw >= L.BAND[1] - L.BAND[0] ? 'cap_bandWide' : 'cap_band');
      say(st.nearRes ? 'cap_kFull' : 'cap_k');
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
