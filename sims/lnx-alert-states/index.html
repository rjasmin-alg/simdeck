      var v = L.valueAt(p, i), past = i <= s.t;
      var k = !past ? 'future' : L.isScrape(p, i) ? 'scraped' : 'missed';
      tr.append(h('span', { class: 'as-dot', dataset: { k: k }, style: { left: x(i, n), top: y(v) + '%' } }));
      if (past) tr.append(h('span', { class: 'as-val', translate: 'no', dataset: v > p.threshold ? {} : { below: '' }, style: { left: x(i, n), top: y(v) + '%' } }, String(v)));
    }
    return tr;
  }
  function seen(c, n) {
    var s = c.state;
    var tr = h('div', { class: 'as-track as-cells as-seen', style: { '--n': String(n) } }, nowCol(s, n));
    for (var i = 1; i <= n; i++) {
      var e = s.history[i - 1];
      if (!e) { tr.append(h('div', { dataset: { future: '' } })); continue; }
      var held = c.state.history.slice(0, i).reduce(function (a, x2) { return x2.sampled ? x2 : a; }, null);
      tr.append(h('div', { translate: 'no', dataset: Object.assign({}, e.sampled ? {} : { held: '' }, e.cond ? { cond: '' } : {}) },
        h('span', null, held ? String(held.v) : '—'), h('i', null, e.cond ? '✓' : '✗')));
    }
    return tr;
  }
  function band(c, n) {
    var s = c.state, p = c.params;
    var tr = h('div', { class: 'as-track as-cells as-band', style: { '--n': String(n) } }, nowCol(s, n));
    var activeAt = null;
    for (var i = 1; i <= n; i++) {
      var e = s.history[i - 1];
      if (!e) { tr.append(h('div', { dataset: { future: '' } })); continue; }
      var before = i >= 2 ? s.history[i - 2].alert : 'inactive';
      if (e.alert === 'pending' && before !== 'pending') activeAt = i;
      var changed = i === s.t && c.prev && before !== e.alert;
      var body = e.alert === 'pending' ? h('span', { translate: 'no' }, (i - activeAt) + '/' + p.forMin) : e.alert === 'firing' ? bell() : null;
      tr.append(h('div', { class: changed ? 'sd-changed' : null, dataset: Object.assign({ s: e.alert }, e.kept ? { kept: '' } : {}),
        'aria-label': t(e.alert) }, body));
    }
    return tr;
  }

  // ── caption ──
  function caption(c) {
    var s = c.state, p = c.params, pr = c.prev;
    if (c.first) return t.parts('capStart', { expr: data('expr: cpu > ' + p.threshold), for: data('for: ' + p.forMin + 'm') });
    var e = s.history[s.history.length - 1];
    var parts = [t('capMin', { t: s.t })];
    var ev = s.event;
    var vars = { pending: term('pending'), firing: term('firing'), inactive: term('inactive') };
    if (ev === 'pending') parts = parts.concat(t.parts('evPending', Object.assign(vars, { active: data('activeAt = ' + s.t), at: data(s.t + p.forMin) })));
    else if (ev === 'held') parts = parts.concat(t.parts('evHeld', { k: data(s.t - s.activeAt), for: data(p.forMin) }));
    else if (ev === 'fired' && p.forMin === 0) parts = parts.concat(t.parts('evFired0', Object.assign(vars, { for0: data('for: 0') })));
    else if (ev === 'fired') parts = parts.concat(t.parts('evFired', Object.assign(vars, { n: t.n('minutes', p.forMin), since: data(s.activeAt) })));
    else if (ev === 'firing') parts = parts.concat(t.parts('evFiring', vars));
    else if (ev === 'reset') parts = parts.concat(t.parts('evReset', Object.assign(vars, { n: t.n('afterTrue', s.t - pr.activeAt), forc: data('for') })));
    else if (ev === 'resolved') parts = parts.concat(t.parts('evResolved', vars));
    else if (ev === 'kept') parts = parts.concat(t.parts('evKept', Object.assign(vars, { kff: data('keep_firing_for'), at: data(L.resolvesAt(s, p)) })));
    else parts = parts.concat(t.parts('evIdle', vars));
    parts.push(' ');
    if (e.sampled) parts = parts.concat(t.parts('capScraped', { v: data(e.v) }));
    else {
      parts = parts.concat(t.parts('capHeld', { v: data(s.lastSample.v), s: data(s.lastSample.t) }));
      if ((e.v > p.threshold) !== s.cond) parts = parts.concat([' '], t.parts('capMissed', { v: data(e.v) }));
    }
    return parts;
  }

  var minFormat = function (v) { return t('min', { v: v }); };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'series', type: 'choice', label: t('series'), resets: true,
        options: [['sustained', t('serSustained')], ['flapping', t('serFlapping')], ['short-spike', t('serShort')], ['one-spike', t('serOne')]] },
      { key: 'threshold', type: 'range', label: t('threshold'), min: 50, max: 99 },
      { key: 'forMin', type: 'range', label: t('forMin'), min: 0, max: 10, format: minFormat },
      { key: 'keepFiringFor', type: 'range', label: t('keepFiringFor'), min: 0, max: 5, format: minFormat },
      { key: 'scrape', type: 'choice', label: t('scrape'), resets: true, options: [[1, minFormat(1)], [2, minFormat(2)], [5, minFormat(5)]] }
    ],

    presets: [
      { id: 'sustained', label: t('presetSustained'), hint: t('presetSustainedHint'), params: { series: 'sustained', threshold: 90, forMin: 5, keepFiringFor: 0, scrape: 1 } },
      { id: 'flapping-long-for', label: t('presetFlapLong'), hint: t('presetFlapLongHint'), params: { series: 'flapping', threshold: 90, forMin: 5, keepFiringFor: 0, scrape: 1 } },
      { id: 'flapping-for-0', label: t('presetFlap0'), hint: t('presetFlap0Hint'), params: { series: 'flapping', threshold: 90, forMin: 0, keepFiringFor: 0, scrape: 1 } },
      { id: 'keep-firing', label: t('presetKeep'), hint: t('presetKeepHint'), params: { series: 'flapping', threshold: 90, forMin: 1, keepFiringFor: 3, scrape: 1 } },
      { id: 'short-spike', label: t('presetShort'), hint: t('presetShortHint'), params: { series: 'short-spike', threshold: 90, forMin: 5, keepFiringFor: 0, scrape: 1 } },
      { id: 'missed-by-scrape', label: t('presetMissed'), hint: t('presetMissedHint'), params: { series: 'one-spike', threshold: 90, forMin: 0, keepFiringFor: 0, scrape: 2 } }
    ],

    legend: [
      { shape: 'line', label: t('legMetric') },
      { shape: 'scraped', label: t('legScraped') },
      { shape: 'missed', label: t('legMissed') },
      { shape: 'inactive', label: legTerm('inactive') },
      { shape: 'pending', label: legTerm('pending') },
      { shape: 'firing', label: legTerm('firing') },
      { shape: 'kept', label: t('legKept') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state, n = L.steps(c.params);
      // the firing swatch carries the band's bell (the kit's legend has no icons)
      var sw = document.querySelector('.sd-swatch[data-shape="firing"]');
      if (sw && !sw.firstChild) sw.append(bell());
      c.stage.replaceChildren(h('div', { class: 'as' },
        h('div', { class: 'as-cards' }, ruleCard(c.params), alertCard(c), notesCard(c)),
        h('div', { class: 'as-axislbl' }, h('span', null, t('minute')), h('b', { translate: 'no' }, String(s.t))), axis(s, n),
        label('laneMetric'), metric(c, n),
        label('laneSeen'), seen(c, n),
        label('laneState'), band(c, n)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
