<html lang="hr" data-sim="phase-modulation">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "phase-modulation",
  "class": "explorer",
  "title": { "hr": "Fazna modulacija (PM)", "en": "Phase modulation (PM)" },
  "concept": { "hr": "Faza nositelja izravno prati vrijednost signala; kod FM to radi frekvencija", "en": "The carrier's phase follows the signal directly; in FM, the frequency does" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="phase-modulation"]; colours only from kit tokens. */
[data-sim="phase-modulation"] .pm { height: 100%; padding: 1.2cqh 1.6cqw; display: flex; flex-direction: column; gap: 0.5rem; }
[data-sim="phase-modulation"] .pm-row { flex: 1; min-height: 0; display: flex; flex-direction: column; }
[data-sim="phase-modulation"] .pm-row[data-row="signal"] { flex: 1.5; }
[data-sim="phase-modulation"] .pm-label { font-weight: 700; font-size: var(--fs-md); line-height: 1.25; }
[data-sim="phase-modulation"] .pm-plot { position: relative; flex: 1; min-height: 3.5rem; }
[data-sim="phase-modulation"] .pm-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="phase-modulation"] .pm-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--ink); font-weight: 600; }
[data-sim="phase-modulation"] .pm-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="phase-modulation"] .pm-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="phase-modulation"] .pm-ref { stroke: var(--c8); stroke-width: 1.5; stroke-dasharray: 2 5; }
[data-sim="phase-modulation"] .pm-dot { fill: var(--c8); }
[data-sim="phase-modulation"] .pm-edge { stroke: var(--c5); stroke-width: 3; stroke-dasharray: 8 5; }
[data-sim="phase-modulation"] .pm-tag { fill: var(--bg); stroke: var(--c5); stroke-width: 2; }
[data-sim="phase-modulation"] .pm-wave { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
[data-sim="phase-modulation"] .pm-wave[data-row="signal"] { stroke: var(--c1); stroke-width: 4; }
[data-sim="phase-modulation"] .pm-wave[data-row="carrier"] { stroke: var(--c8); }
[data-sim="phase-modulation"] .pm-wave[data-row="fm"] { stroke: var(--c3); }
[data-sim="phase-modulation"] .pm-wave[data-row="pm"] { stroke: var(--c2); stroke-width: 3; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="phase-modulation"] .pm-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="phase-modulation"] .pm-credit a { color: inherit; }
/* Subscripts in the explanation keep the text size (the browser's 83 % would fall under the floor on a phone). */
[data-sim="phase-modulation"] .sd-explain sub { font-size: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="phase-modulation"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="phase-modulation"] .pm { height: auto; padding: 0.6rem; }
  [data-sim="phase-modulation"] .pm-row { flex: none; }
  [data-sim="phase-modulation"] .pm-plot { flex: none; height: 5rem; }
  [data-sim="phase-modulation"] .pm-row[data-row="signal"] .pm-plot { height: 6rem; }
  [data-sim="phase-modulation"] .pm-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="phase-modulation"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Fazna modulacija (PM)</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="pm-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian; up to `d` decimals, trailing zeros dropped.
  function num(x, d) { var s = String(parseFloat(x.toFixed(d || 0))); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function deg(x) { return t('deg', { v: num(x) }); }
  // A signed angle with a real minus sign, not a hyphen.
  function signedDeg(x) { return x < 0 ? '−' + deg(-x) : '+' + deg(x); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }

  var shapeKeys = { sine: 'Sine', square: 'Square', saw: 'Saw', ramp: 'Ramp' };
  var presetKeys = { sine: 'presetSine', reversal: 'presetReversal', saw: 'presetSaw', ramp: 'presetRamp', none: 'presetNone', turn: 'presetTurn' };
  var rows = [
    { key: 'signal', label: 'rowSignal', v: 'm' },
    { key: 'carrier', label: 'rowCarrier', v: 'c' },
    { key: 'fm', label: 'rowFm', v: 'fm' },
    { key: 'pm', label: 'rowPm', v: 'pm' }
  ];

  // ── one row: a frame over the window, the zero line, the carrier's upward zero crossings as reference marks (dots
  //    on the carrier row), the signal's edges (on the signal and PM rows, with the PM phase jump), and the wave ──
  function drawRow(box, row, st, pts) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 0.4 * rem, r: 0.4 * rem, t: 0.3 * rem, b: 0.3 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (x) { return pad.l + x * cw; };
    var Y = function (y) { return pad.t + ch * (1 - (y + 1.15) / 2.3); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'pm-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    svg.append(s('line', { class: 'pm-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    if (row.key !== 'signal') {
      st.zeros.forEach(function (z) {
        if (z > 0) svg.append(s('line', { class: 'pm-ref', x1: X(z), x2: X(z), y1: pad.t, y2: pad.t + ch }));
        if (row.key === 'carrier') svg.append(s('circle', { class: 'pm-dot', cx: X(z), cy: Y(0), r: 0.3 * rem }));
      });
    }
    if (row.key === 'signal' || row.key === 'pm') {
      st.edges.forEach(function (e) {
        svg.append(s('line', { class: 'pm-edge', x1: X(e.t), x2: X(e.t), y1: pad.t, y2: pad.t + ch }));
      });
    }
    svg.append(s('polyline', { class: 'pm-wave', 'data-row': row.key,
      points: pts.map(function (p) { return X(p.t).toFixed(1) + ',' + Y(p[row.v]).toFixed(1); }).join(' ') }));
    // the PM phase jump at each edge, in a tag on the edge line (after the wave, so the wave does not cross it)
    if (row.key === 'pm') {
      st.edges.forEach(function (e) {
        var label = s('text', { x: X(e.t), y: pad.t + 1.05 * rem, 'text-anchor': 'middle', translate: 'no' },
          t('jump', { v: e.jump === 180 || e.jump === 0 ? deg(e.jump) : signedDeg(e.jump) }));
        var tag = s('rect', { class: 'pm-tag', rx: 0.25 * rem });
        svg.append(tag, label);
        box.replaceChildren(svg);
        var bb = label.getBBox ? label.getBBox() : null;
        if (bb && bb.width) {
          tag.setAttribute('x', bb.x - 0.3 * rem); tag.setAttribute('y', bb.y - 0.1 * rem);
          tag.setAttribute('width', bb.width + 0.6 * rem); tag.setAttribute('height', bb.height + 0.2 * rem);
        }
      });
    }
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'shape', type: 'choice', label: t('shape'), hint: t('shapeHint'),
        options: L.SHAPES.map(function (k) { return [k, t('shape' + shapeKeys[k])]; }) },
      { key: 'dev', type: 'range', label: t('dev'), hint: t('devHint'), min: L.DEV_MIN, max: L.DEV_MAX, step: L.DEV_STEP, format: deg }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendSignal') },
      { c: 3, label: t('legendFm') },
      { c: 2, label: t('legendPm') },
      { c: 8, shape: 'round', label: t('legendZero') },
      { c: 5, shape: 'hollow', label: t('legendEdge') }
    ],

    render: function (c) {
      var st = c.state;
      var pts = L.curve(st.shape, st.dev);
      var plots = rows.map(function () { return h('div', { class: 'pm-plot' }); });
      c.stage.replaceChildren(h('div', { class: 'pm' }, rows.map(function (r, i) {
        return h('div', { class: 'pm-row', 'data-row': r.key }, h('div', { class: 'pm-label' }, t(r.label)), plots[i]);
      })));
      rows.forEach(function (r, i) { drawRow(plots[i], r, st, pts); });
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var v = {
        shape: t('shapeName' + shapeKeys[st.shape]), d: b(deg(st.dev)), fc: b(num(L.FC)),
        lo: b(num(st.fmLow, 1)), hi: b(num(st.fmHigh, 1)), pm: b(num(L.FC + st.rampExtra, 2)),
        j: b(st.edges.length ? deg(Math.abs(st.edges[0].jump)) : '')
      };
      if (st.none) return t.parts('captionNone', v);
      if (st.shape === 'ramp') return t.parts('captionRamp', v);
      if (!st.edges.length) return t.parts('captionSmooth', v);
      if (st.hidden) return t.parts('captionHidden', v);
      if (st.edges.every(function (e) { return e.jump === 180; })) return t.parts('captionReversal', v);
      return t.parts('captionJumps', v);
    }
  });

  // The rows are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
