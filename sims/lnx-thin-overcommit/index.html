<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Series colour of each thin volume (thin1 … thin4). */
  function colour(k) { return k + 1; }

  // ── numbers in the page's language ──

  function dec(x, d) {
    var s = x.toFixed(d);
    if (d > 0) s = s.replace(/\.?0+$/, '');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function gib(x) { return t('gib', { n: dec(x, 1) }); }
  function pct(x) { return t('pct', { p: dec(x, 1) }); }
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function list(names) {
    if (names.length < 2) return names.join('');
    return names.slice(0, -1).join(', ') + t('and') + names[names.length - 1];
  }

  // ── the pool grid (K3) ──

  /** The pool's cells as rows: the pool as created, then the autoextensions as added rows (each a span). */
  function poolRows(s, chg) {
    var cells = s.pool.cells.map(function (o, i) {
      var c = o === L.FREE ? {} : { kind: s.pool.kept.indexOf(i) >= 0 ? 'soft' : 'fill', c: colour(o), text: String(o + 1) };
      if (chg.indexOf(i) >= 0) c.now = true;
      return c;
    });
    // the narrowest grid that keeps the pool, then its autoextensions, within 6 rows (300 GiB at most: 6 × 50); with
    // four volume bars below, within 4 rows where it can
    var extTotal = s.pool.size - s.pool.size0;
    var maxRows = s.lvs.length > 3 ? 4 : 6;
    var cols = [20, 25, 40, 50].filter(function (n) {
      return Math.ceil(s.pool.size0 / n) + Math.ceil(extTotal / n) <= maxRows;
    })[0] || 50;
    var base = Simdeck.blockGrid.split({ id: 'pool', label: h('span', null, t('poolRow')), cells: cells.slice(0, s.pool.size0) }, cols);
    if (!s.extended.length) return { rows: base, cols: cols, n: base.length };
    var spans = s.extended.map(function (e) {
      return { from: e.from - s.pool.size0, len: e.by, style: 'dashed' };
    });
    var ext = Simdeck.blockGrid.split({ id: 'ext', label: h('span', null, t('extRow', { p: s.extPercent })),
      cells: cells.slice(s.pool.size0), spans: spans }, cols);
    return { rows: base.concat(ext), cols: cols, n: base.length + ext.length };
  }

  function poolGrid(s, chg, dir) {
    var pr = poolRows(s, chg);
    var parts = s.lvs.map(function (lv, k) { return { n: lv.allocated, kind: 'fill', c: colour(k) }; });
    var dataMeter = Simdeck.blockGrid.meter({
      total: s.pool.size, parts: parts, label: t('mData'), text: pct(s.pool.pct),
      mark: s.autoextend ? { at: s.threshold * s.pool.size / 100, label: t('mTick', { p: s.threshold }) } : null
    });
    var promMeter = Simdeck.blockGrid.meter({
      total: s.pool.size, label: t('mPromised'),
      parts: s.lvs.map(function (lv, k) { return { n: lv.virt, kind: 'ghost', c: colour(k) }; }),
      text: h('span', { class: 'to-banner', dataset: s.promised > s.pool.size ? { over: 'true' } : {} },
        t('banner', { promised: gib(s.promised), real: gib(s.pool.size) }))
    });
    // the pool's sizes after each autoextension; past three, the first and the last only
    var sizes = [s.pool.size0].concat(s.extended.map(function (e) { return e.to; }));
    if (sizes.length > 4) sizes = [sizes[0], sizes[1], '…', sizes[sizes.length - 1]];
    var chain = sizes.join(' → ') + ' GiB';
    var foot = h('div', { class: 'to-foot' },
      dataMeter, promMeter,
      h('p', { class: 'to-note' }, t('vgLine', { vg: gib(s.vgFree) }), s.extended.length ? [' · ', data(chain)] : null),
      h('p', { class: 'to-note ' + (s.warned ? '' : 'to-muted') }, s.warned ? '⚠ ' + t('warn') : t('noWarn')));
    return Simdeck.blockGrid({
      dir: dir,
      title: t('poolTitle'),
      meta: [t('cellNote')],
      count: { text: t('poolCount', { p: pct(s.pool.pct), used: dec(s.pool.used, 0), size: dec(s.pool.size, 0) }), hl: s.full },
      cols: pr.cols,
      rows: pr.rows,
      cellHeight: pr.n > 5 ? '1.2rem' : s.lvs.length > 3 ? '1.55rem' : '2rem',   // taller cells while there is room
      foot: [foot]
    });
  }

  // ── the thin volumes ──

  function volumes(s, mode) {
    var rows = s.lvs.map(function (lv, k) {
      var rest = lv.virt - lv.fsUsed - lv.kept - lv.refused;
      var bar = Simdeck.blockGrid.meter({
        total: lv.virt,
        parts: [
          { n: lv.fsUsed, kind: 'fill', c: colour(k) },
          { n: lv.kept, kind: 'soft', c: colour(k) },
          { n: lv.refused, kind: 'bad' },
          { n: rest, kind: 'ghost' }
        ]
      });
      var info = [
        h('span', null, t('volFs', { used: gib(lv.fsUsed), free: gib(lv.fsFree) })),
        h('span', null, t('volPool', { a: gib(lv.allocated), p: pct(lv.dataPct) })),
        lv.kept > 0 ? h('span', null, t('volKept', { k: gib(lv.kept) })) : null
      ];
      var badge = lv.refused > 0 ? h('span', { class: 'to-badge', dataset: { k: mode } },
        h('span', null, t(mode === 'error' ? 'volRefused' : 'volQueued', { r: gib(lv.refused) }))) : null;
      return h('div', { class: 'to-vol' },
        h('div', { class: 'to-vol-head' },
          h('span', { class: 'to-vol-name' }, h('i', { dataset: { c: String(colour(k)) } }), data(lv.name)), badge),
        bar,
        h('div', { class: 'to-vol-info' }, info));
    });
    return h('section', { class: 'to-vols' },
      h('h2', null, t('volTitle'), h('span', null, t('volSize', { v: gib(s.lvs[0].virt) }))),
      rows);
  }

  // ── render; the changed marks follow param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = lastState ? L.changedCells(lastState, c.state) : [];
      lastKey = key;
      lastState = c.state;
    }
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'to' }, poolGrid(s, chg, c.dir), volumes(s, s.mode)));
  }

  function caption(c) {
    var s = c.state;
    var k = L.captionKey(s);
    var lv = s.firstRefused ? s.lvs[s.firstRefused.lv] : null;
    var out = [t(k.key, {
      promised: gib(s.promised), real: gib(s.pool.size), used: gib(s.pool.used), p: pct(s.pool.pct),
      lv: lv ? lv.name : '', free: lv ? gib(s.firstRefused.free) : ''
    })];
    k.notes.forEach(function (nt) {
      var txt;
      if (nt.key === 'nAlsoRefused') txt = t.n('nAlsoRefused', nt.lvs.length, { lvs: list(nt.lvs) });
      else if (nt.key === 'nKept' || nt.key === 'nDiscarded' || nt.key === 'nDiscardedOnly') txt = t(nt.key, { d: gib(nt.d) });
      else if (nt.key === 'nGrew') txt = t.n('nGrew', nt.n, { size: gib(s.pool.size) });
      else if (nt.key === 'nShort') txt = t('nShort', { at: gib(s.short.at), want: gib(s.short.want), vg: gib(s.short.vgFree) });
      else if (nt.key === 'nGrewShort') txt = t.n('nGrewShort', nt.n, { size: gib(s.pool.size), want: gib(s.short.want), vg: gib(s.short.vgFree) });
      else txt = t(nt.key);
      out.push(' ', txt);
    });
    return out;
  }

  var labels = {
    'overcommit-ok': 'pOk', 'one-tenant-fills': 'pFills', 'autoextend': 'pAuto',
    'deleted-not-returned': 'pDeleted', 'error-at-once': 'pError'
  };
  function gibFmt(v) { return gib(v); }
  function pctFmt(v) { return t('pct', { p: v }); }
  function shown(k) { return function (p) { return p.n >= k; }; }
  function auto(p) { return p.autoextend === true; }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'pool', type: 'range', value: L.defaults.pool, label: t('pool'), min: 50, max: 200, step: 10, format: gibFmt },
      { key: 'n', type: 'range', value: L.defaults.n, label: t('n'), min: 1, max: 4, step: 1 },
      { key: 'virt', type: 'range', value: L.defaults.virt, label: t('virt'), min: 10, max: 100, step: 10, format: gibFmt },
      { key: 'w1', type: 'range', value: L.defaults.w1, label: t('w1'), min: 0, max: function (p) { return p.virt; }, step: 1, format: gibFmt },
      { key: 'w2', type: 'range', value: L.defaults.w2, label: t('w2'), min: 0, max: function (p) { return p.virt; }, step: 1, format: gibFmt, visible: shown(2) },
      { key: 'w3', type: 'range', value: L.defaults.w3, label: t('w3'), min: 0, max: function (p) { return p.virt; }, step: 1, format: gibFmt, visible: shown(3) },
      { key: 'w4', type: 'range', value: L.defaults.w4, label: t('w4'), min: 0, max: function (p) { return p.virt; }, step: 1, format: gibFmt, visible: shown(4) },
      { key: 'deleted1', type: 'range', value: L.defaults.deleted1, label: t('deleted1'), min: 0, max: function (p) { return Math.min(50, p.w1); }, step: 1, format: gibFmt },
      { key: 'discard', type: 'toggle', label: t('discard'), visible: function (p) { return p.deleted1 > 0; } },
      { key: 'autoextend', type: 'toggle', label: t('autoextend') },
      { key: 'errorWhenFull', type: 'toggle', label: t('errorWhenFull') },
      { key: 'threshold', type: 'range', value: L.defaults.threshold, label: t('threshold'), min: 50, max: 95, step: 5, format: pctFmt, visible: auto },
      { key: 'percent', type: 'range', value: L.defaults.percent, label: t('percent'), min: 10, max: 50, step: 10, format: pctFmt, visible: auto },
      { key: 'vgFree', type: 'range', value: L.defaults.vgFree, label: t('vgFree'), min: 0, max: 100, step: 10, format: gibFmt, visible: auto }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'bg-fill', c: 1, label: t('legOwned') },
      { shape: 'to-free', label: t('legFree') },
      { shape: 'bg-soft', c: 1, label: t('legKept') },
      { shape: 'bg-ghost', label: t('legPromised') },
      { shape: 'to-refused', label: t('legRefused') },
      { shape: 'to-queued', label: t('legQueued') },
      { shape: 'to-tick', label: t('legThreshold') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
