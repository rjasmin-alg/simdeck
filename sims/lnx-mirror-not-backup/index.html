<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var C_META = 1;                                   // series colour of the filesystem's metadata block
  var C_FILE = { p: 2, v: 3, r: 4 };                 // series colour per file (proba, vjezba, README)
  var C_SYNC = 8;                                    // not yet in sync (hatched)
  var DEV = '/dev/md0', COPY = '/mnt/kopija';

  /** Data (device and file names, commands, mdstat) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function sp(parts) { return [' '].concat(parts); }
  function pct(p) { return t('pct', { p: String(p).replace('.', t('dec')) }); }

  /** Caption parts from t(key) or, with n, t.n(key, n): node placeholders are put back where they land (cloned, so a
      node may appear twice), and *English term* becomes <em lang="en"> (the Croatian term rule, for terms the glossary
      lacks). */
  var MARK = '\u0001';
  function rich(key, vars, n) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var text = n === undefined ? t(key, flat) : t.n(key, n, flat);
    var out = [];
    text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
      if (!bit) return;
      bit.split(MARK).forEach(function (piece, j) {
        if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
        else if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }

  function box(s) { return s.mdstat.created ? '[' + s.mdstat.of + '/' + s.mdstat.n + '] [' + s.mdstat.map + ']' : ''; }
  function catErr(s) { return 'cat: ' + L.MNT + '/' + L.WATCH + ': ' + (s.cat.err === 'eio' ? 'Input/output error' : 'No such file or directory'); }
  function show(text) { return text.replace(/\n$/, ''); }

  /** The command (data) or event (words) of one script entry, and its layer. */
  function command(op) {
    switch (op.op) {
      case 'create': return { cmd: 'sudo mdadm --create --run ' + DEV + ' --level=1 --raid-devices=2 /dev/vdb /dev/vdc', out: 'mdadm: array ' + DEV + ' started.', layer: 'layerDev' };
      case 'mkfs': return { cmd: 'sudo mkfs.ext4 -q ' + DEV, layer: 'layerFs' };
      case 'mount': return { cmd: 'sudo mount ' + DEV + ' ' + L.MNT, layer: 'layerFs' };
      case 'tee':
        if (op.by === 'malware') return { ev: rich('evNote', { f: data(op.file) }), layer: 'layerFs', event: true };
        var line = op.data.replace(/\n$/, '').split('\n').pop();
        return { cmd: "echo '" + line + "' | sudo tee " + (op.append ? '-a ' : '') + L.MNT + '/' + op.file, out: line, layer: 'layerFs' };
      case 'fail': return { cmd: 'sudo mdadm --fail ' + DEV + ' /dev/' + op.disk, layer: 'layerDev' };
      case 'readd': return { cmd: 'sudo mdadm --re-add ' + DEV + ' /dev/' + op.disk, out: 'mdadm: re-add /dev/' + op.disk + ' to md0 succeed', layer: 'layerDev' };
      case 'die': return { ev: rich('evDie', { d: data(op.disk) }), layer: 'layerDev', event: true };
      case 'rm': return { cmd: 'sudo rm -f ' + L.MNT + '/' + op.file, layer: 'layerFs' };
      case 'corrupt': return { ev: rich('evCorrupt', { f: data(op.file) }), layer: 'layerFs', event: true };
      case 'encrypt': return { ev: rich('evEncrypt', { f: data(op.file), g: data(op.file + '.locked') }), layer: 'layerFs', event: true };
      case 'backup': return { cmd: 'cp ' + L.MNT + '/' + op.file + ' ' + COPY + '/', note: rich('evCopyNote', { dir: data(COPY) }), layer: 'layerNet' };
      case 'restore': return { cmd: 'cp ' + COPY + '/' + op.file + ' ' + L.MNT + '/', layer: 'layerFs' };
    }
    return {};
  }

  // ── stage ──

  function blockCell(s, b, k, failed) {
    if (failed) return b ? { text: b.tag, kind: 'dead' } : { kind: 'dead' };
    if (!b) return {};
    if (b.tag === 'fs') return { text: 'fs', kind: 'fill', c: C_META };
    if (!L.usedBlocks(s)[k]) return { text: b.tag, kind: 'ghost', dim: true };
    if (b.data === L.GARBAGE || b.data === L.ENC) return { text: b.tag, kind: 'bad' };
    return { text: b.tag, kind: 'fill', c: C_FILE[b.tag.charAt(0)] || C_META };
  }

  function grid(c) {
    var s = c.state, ev = s.ev, prev = c.prev;
    var ks = []; for (var k = 0; k < L.NBLK; k++) ks.push(k);
    var wrote = function (k) { return !!(ev && ev.wrote.indexOf(k) >= 0); };
    var act = L.active(s);

    var md;
    if (!s.created) md = ks.map(function () { return null; });
    else if (s.array === 'failed') md = ks.map(function () { return { kind: 'dead', now: !!(ev && ev.op === 'die') }; });
    else md = ks.map(function (k) {
      var cell = blockCell(s, act[0].blocks[k], k, false);
      cell.now = wrote(k);
      return cell;
    });
    var mdState = { optimal: 'stOptimal', degraded: 'stDegraded', failed: 'stFailed', resync: 'stResync', none: 'stNone' }[s.array];
    var mdCls = s.array === 'failed' ? 'mb-role-bad' : s.array === 'degraded' ? 'mb-role-warn' : 'mb-role';
    var rows = [{ id: 'md0', label: 'md0', cells: md,
      aside: h('span', { class: mdCls + (prev && prev.array !== s.array ? ' mb-asnow' : '') }, (s.array === 'failed' ? '✕ ' : '') + t(mdState)) }];

    s.disks.forEach(function (d) {
      var failed = d.status === 'failed';
      var synced = s.mdstat.resync ? Math.max(1, Math.round(s.mdstat.resync.done / L.MD_BLOCKS * L.NBLK)) : L.NBLK;   // 9.6 % of 8 blocks: block 0
      var cells = ks.map(function (k) {
        var cell;
        if (d.status === 'resync' && k >= synced) cell = { kind: 'soft', c: C_SYNC };
        else cell = blockCell(s, d.blocks[k], k, failed);
        // changed = written to this disk in this step (by the filesystem, a re-add or the resync), never a fail
        cell.now = (wrote(k) && ev.to.indexOf(d.name) >= 0) ||
          !!(ev && ev.op === 'readd' && ev.disk === d.name && ev.copied.indexOf(k) >= 0) ||
          !!(ev && ev.resyncDone && prev && L.disk(prev, d.name).status === 'resync' && k >= 1);
        return cell;
      });
      var aside;
      if (failed) aside = h('span', { class: 'mb-role-bad' }, '(F) ' + t('dFailed'));
      else if (d.status === 'resync') aside = h('span', { class: 'mb-role' }, t('dResync') + ' ' + pct(s.mdstat.resync.pct));
      else aside = h('span', { class: 'mb-role' }, t('dOk') + (s.array === 'degraded' && s.cat.from === d.name ? ' · ' + t('dReads') : ''));
      if (prev && L.disk(prev, d.name).status !== d.status) aside = h('span', { class: 'mb-asnow' }, aside);
      rows.push({ id: d.name, label: d.name, cells: cells, aside: aside });
    });

    var changed = !prev || box(prev) !== box(s);
    return Simdeck.blockGrid({
      dir: c.dir,
      title: h('span', null, t('gridTitle'), ' ', data('md0 · raid1')),
      meta: [t('gridMeta', { n: L.NBLK })],
      count: s.created ? { text: data(box(s)), hl: !!(prev && changed) } : null,
      cols: L.NBLK,
      cellHeight: '3.4rem',
      colLabels: ks.map(String),
      rows: rows
    });
  }

  function fsBox(c) {
    var s = c.state, ev = s.ev, prev = c.prev, o = L.norm(c.params);
    var list;
    if (!s.mounted) list = [h('li', { class: 'mb-muted' }, t('fsNone'))];
    else if (s.array === 'failed') list = [h('li', { class: 'mb-bad' }, '✕ ' + t('fsLost'))];
    else {
      var hot = ev && ev.layer === 'fs' && !ev.noop && !ev.err ? (ev.renamed || ev.file) : null;
      list = [h('li', null, h('span', { class: 'mb-name', translate: 'no' }, 'lost+found/'), '')];
      s.fs.files.forEach(function (f) {
        list.push(h('li', { class: f.name === hot ? 'mb-hl' : null },
          h('span', { class: 'mb-name', translate: 'no' }, f.name), h('span', null, t('bytes', { n: f.size }))));
      });
      if (ev && ev.op === 'rm' && !ev.noop) {
        list.push(h('li', { class: 'mb-gone mb-hl' }, h('span', { class: 'mb-name', translate: 'no' }, ev.file), h('span', null, '✕ ' + t('fsDeleted'))));
      }
    }
    var justMounted = !!(ev && ev.op === 'mount');
    var fs = h('div', { class: 'mb-box' + (justMounted ? ' mb-now' : '') },
      h('div', { class: 'mb-head' }, h('b', { translate: 'no' }, L.MNT),
        h('span', { class: 'mb-muted' }, s.mounted ? rich('fsOn', { dev: data(DEV) }) : t('fsUnmounted'))),
      h('ul', { class: 'mb-files' }, list));
    var parts = [fs];
    if (s.backup) {
      var bl = s.backup.files.length ? s.backup.files.map(function (f) {
        return h('li', { class: ev && ev.op === 'backup' && !ev.err ? 'mb-hl' : null },
          h('span', { class: 'mb-name', translate: 'no' }, f.name), h('span', { class: 'mb-muted' }, t('backupAt', { n: f.at })));
      }) : [h('li', { class: 'mb-muted' }, t('backupEmpty'))];
      parts.push(h('div', { class: 'mb-box mb-backup' },
        h('div', { class: 'mb-head' }, h('strong', null, t('backupTitle')), h('span', { class: 'mb-muted' }, data(COPY), ' · ', t('backupNote'))),
        h('ul', { class: 'mb-files' }, bl)));
    }
    return h('div', { class: 'mb-top' }, parts);
  }

  function boundary(c) {
    var o = L.norm(c.params);
    return h('div', { class: 'mb-boundary' },
      o.showLayers ? h('div', { class: 'mb-layers' }, h('span', null, '▲ ' + t('layerFs')), h('span', null, '▼ ' + t('layerDev'))) : null,
      h('span', null, t('boundary')));
  }

  /** mdstat lines, each changed token (by position, on lines that exist in both) on the highlight. */
  function key(line) { return /resync =/.test(line) ? 'resync' : line.trim().split(/\s+/)[0]; }   // lines matched by their first word
  function mdstatPre(s, prev) {
    var now = L.mdstatLines(s.mdstat), was = prev ? L.mdstatLines(prev.mdstat) : null;
    var kids = [];
    now.forEach(function (line, i) {
      if (i) kids.push('\n');
      if (!was) { kids.push(line); return; }
      var old = was.filter(function (x) { return key(x) === key(line); })[0];
      if (old === undefined) { kids.push(h('span', { class: 'mb-now' }, line)); return; }
      if (old === line) { kids.push(line); return; }
      var a = line.split(/( +)/), b = old.split(/( +)/);
      a.forEach(function (tok, j) { kids.push(tok.trim() && tok !== b[j] ? h('span', { class: 'mb-now' }, tok) : tok); });
    });
    return h('pre', { translate: 'no' }, kids);
  }

  function terminal(c) {
    var s = c.state, ev = s.ev, prev = c.prev;
    var op = c.n ? L.script(c.params)[c.n - 1] : null;
    var cm = op ? command(op) : null;
    var out = [];
    out.push(h('h3', null, h('span', null, t('cmdTitle')),
      cm ? h('span', { class: 'mb-tag' }, (cm.event ? t('layerEvent') + ' · ' : '') + t('layerOf', { l: t(cm.layer) })) : null));
    if (!cm) out.push(h('pre', { class: 'mb-event' }, t('cmdStart')));
    else if (cm.cmd) {
      out.push(h('pre', { translate: 'no', class: 'mb-cmd' }, '$ ' + cm.cmd + (cm.out ? '\n' : ''), cm.out ? h('span', { style: { fontWeight: 400 } }, cm.out) : null));
      if (cm.note) out.push(h('div', { class: 'mb-muted' }, cm.note));
    } else out.push(h('pre', { class: 'mb-event' }, cm.ev));

    var same = prev && JSON.stringify(L.mdstatLines(prev.mdstat)) === JSON.stringify(L.mdstatLines(s.mdstat));
    out.push(h('h3', null, data('$ cat /proc/mdstat'),
      prev ? h('span', { class: 'mb-tag' + (same ? ' mb-same' : '') }, same ? '= ' + t('mdUnchanged') : '≠ ' + t('mdChanged')) : null));
    out.push(mdstatPre(s, prev));

    var catNow = !prev || JSON.stringify(prev.cat) !== JSON.stringify(s.cat);
    out.push(h('h3', null, data('$ cat ' + L.MNT + '/' + L.WATCH)));
    var text = s.cat.exit ? catErr(s) : show(s.cat.out);
    out.push(h('pre', { translate: 'no' }, h('span', { class: prev && catNow ? 'mb-now' : null }, text)));
    out.push(h('div', { class: 'mb-muted' }, h('span', { class: prev && catNow && prev.cat.exit !== s.cat.exit ? 'mb-now' : null }, t('exit', { n: s.cat.exit }))));

    var nx = L.script(c.params)[c.n];
    var nc = nx ? command(nx) : null;
    out.push(h('div', { class: 'mb-next' }, h('b', null, t('next')),
      nc ? (nc.cmd ? code(nc.cmd) : h('span', null, nc.ev)) : t('nextNone')));
    return h('div', { class: 'mb-term' }, out);
  }

  function render(c) {
    var left = h('div', { class: 'mb-left' }, fsBox(c), boundary(c), grid(c));
    c.stage.replaceChildren(h('div', { class: 'mb' }, left, terminal(c)));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, ev = s.ev, prev = c.prev;
    var MD = code('md0'), MDSTAT = code('/proc/mdstat'), BOX = code(box(s)), CAT = code('cat');
    if (!ev) {
      if (!s.created) return rich('capStartBlank', { b: data('vdb'), c: data('vdc'), mdstat: MDSTAT })
        .concat(s.backup ? sp(rich('capStartBackup')) : []);
      return rich('capStartHealthy', { md: MD, b: data('vdb'), c: data('vdc'), mnt: code(L.MNT), box: BOX });
    }
    var catOk = function () { return rich('capCatOk', { cat: CAT, out: code(show(s.cat.out)) }); };
    var out = [];
    if (ev.resyncDone) out = rich('capResyncDone').concat(' ');
    switch (ev.op) {
      case 'create':
        return rich('capCreate', { cmd: code('mdadm --create'), mdstat: MDSTAT, resync: code('resync =  ' + s.mdstat.resync.pct + '%') });
      case 'mkfs': return out.concat(rich('capMkfs', { cmd: code('mkfs.ext4'), md: MD }));
      case 'mount': return out.concat(rich('capMount', { cmd: code('mount'), md: MD, mnt: code(L.MNT) }));
      case 'tee':
        if (ev.by === 'malware') return rich('capMalware', { md: MD, box: BOX });
        out = rich('capTee', { f: code(ev.file), md: MD, n: ev.to.length === 2 ? t('both') : data(ev.to.join(', ')) });
        if (ev.skipped.length) return rich('capTeeDegraded', { to: data(ev.to.join(', ')), skip: data(ev.skipped.join(', ')) }).concat(sp(catOk()));
        return out.concat(sp(catOk()));
      case 'fail':
        if (ev.refused) return rich('capFailRefused', { d: data(ev.disk) });
        if (ev.noop) return rich('capNoop');
        out = rich('capFail', { d: data(ev.disk), F: code('(F)'), box: BOX, state: code('State : clean, degraded') });
        if (!s.cat.exit && s.cat.out === L.GARBAGE) return out.concat(sp(rich('capFailWrong', { from: data(s.cat.from) })));
        if (!s.cat.exit) return out.concat(sp(rich('capFailReadable', { from: data(s.cat.from) })));
        return out.concat(sp(rich('capFailLocked', { from: data(L.active(s)[0].name), ext: code('.locked') })));
      case 'readd':
        if (ev.noop || ev.refused) return rich('capNoop');
        if (ev.copied.length) return rich('capReaddCopied', { d: data(ev.disk), src: data(L.DISKS.filter(function (x) { return x !== ev.disk; })[0]), box: BOX }, ev.copied.length);
        return rich('capReadd', { d: data(ev.disk), box: BOX });
      case 'rm':
        if (ev.noop) return rich('capNoop');
        out = rich('capRm', { mdstat: MDSTAT, box: BOX });
        out = out.concat(sp(rich('capRmFreed', { k: data(ev.freed.join(', ')) })));
        if (s.backup && s.backup.files.length) out = out.concat(sp(rich('capRmBackup')));
        return out;
      case 'corrupt': return rich('capCorrupt', { f: code(ev.file), md: MD, mdstat: MDSTAT, box: BOX });
      case 'encrypt': return rich('capEncrypt', { f: code(ev.file), g: code(ev.renamed), box: BOX });
      case 'die': return rich('capDie', { d: data(ev.disk), box: BOX, cat: CAT, c: data(L.DISKS.filter(function (x) { return x !== ev.disk; })[0]) });
      case 'backup': return rich('capBackup', { cmd: code('cp') });
      case 'restore': return rich('capRestore').concat(sp(catOk()));
    }
    return [];
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'select', label: t('scene'), resets: true,
        options: [['book-primjer3', t('presetBook')], ['corruption', t('presetCorrupt')], ['ransomware-mirror', t('presetRansom')],
          ['two-failures', t('presetTwo')], ['with-backup', t('presetBackup')]],
        visible: function () { return false; } },
      { key: 'showLayers', type: 'toggle', label: t('showLayers') }
    ],

    presets: [
      { id: 'book-primjer3', label: t('presetBook'), params: { scene: 'book-primjer3' }, hint: t('presetBookHint') },
      { id: 'corruption', label: t('presetCorrupt'), params: { scene: 'corruption' }, hint: t('presetCorruptHint') },
      { id: 'ransomware-mirror', label: t('presetRansom'), params: { scene: 'ransomware-mirror' }, hint: t('presetRansomHint') },
      { id: 'two-failures', label: t('presetTwo'), params: { scene: 'two-failures' }, hint: t('presetTwoHint') },
      { id: 'with-backup', label: t('presetBackup'), params: { scene: 'with-backup' }, hint: t('presetBackupHint') }
    ],

    legend: [
      { shape: 'hl', label: t('legChanged') },
      { shape: 'bg-fill', c: C_META, label: t('legMeta') },
      { shape: 'bg-fill', c: C_FILE.p, label: t('legFile') },
      { shape: 'bg-bad', label: t('legBad') },
      { shape: 'bg-ghost', label: t('legFreed') },
      { shape: 'bg-dead', label: t('legDead') },
      { shape: 'bg-soft', c: C_SYNC, label: t('legResync') },
      { shape: 'boundary', label: t('legBoundary') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
