<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);
  var FAC_KEY = { user: 'facUser', authpriv: 'facAuthpriv', mail: 'facMail', cron: 'facCron', kern: 'facKern', daemon: 'facDaemon' };
  var SAY = { kernel: 'sayKernel', 'sshd-session': 'saySshd', CROND: 'sayCrond', systemd: 'saySystemd' };

  /** Data (commands, paths, selectors, fields, log lines) is not language: the word check skips translate="no". */
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function data(s, cls) { return h('span', Object.assign({ translate: 'no' }, cls ? { class: cls } : {}), String(s)); }
  /** t.parts, but a placeholder used twice in one string gets a copy (a DOM node can stand in one place only). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!x || !x.nodeType) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function has(s, mark) { return s.event.changed.indexOf(mark) >= 0; }
  function anim(c, on) { return on && c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function sevName(s) { return L.SEVERITIES[s.msg.severity]; }
  function fs(s) { return s.msg.facility + '.' + sevName(s); }
  function token(s) { return h('span', { class: 'lp-token', translate: 'no' }, fs(s)); }
  function senderName(s) { return s.msg.sender === 'kernel' ? t('kernelName') : code(s.msg.sender); }
  function prompt(s) { return h('span', { class: 'lp-prompt', 'aria-hidden': 'true', translate: 'no' }, '[student@' + s.host + ' ~]$'); }
  function no(n) { return h('span', { class: 'lp-no', 'aria-hidden': 'true' }, String(n)); }
  function arrow(on) { return h('span', { class: 'lp-arrow', 'aria-hidden': 'true', dataset: on ? { on: '' } : {} }, '→'); }

  // ── what the sender runs ──
  function sayLine(s, p) {
    var cmd = L.commandOf(s.msg, p);
    var now = s.at === 'sender';
    var body = cmd ? [prompt(s), h('code', { translate: 'no', class: now ? 'sd-changed' : null }, cmd)]
      : [h('span', { class: 'lp-words' + (now ? ' sd-changed' : '') }, t(SAY[s.msg.sender]))];
    return h('div', { class: 'lp-say', 'aria-label': t('cmdLabel') }, body);
  }

  // ── the three stations ──
  function senderBox(s, c) {
    var sent = s.at !== null;
    var m = s.msg, fn = L.FACILITIES[m.facility];
    var who = m.sender === 'kernel' ? h('div', { class: 'lp-who' }, h('span', null, t('senderKernel'))) : h('div', { class: 'lp-who', translate: 'no' }, m.sender);
    var msg = h('div', { class: 'lp-msg' + (s.at === 'sender' ? ' sd-changed' + anim(c, true) : ''), dataset: sent ? {} : { unsent: '' } },
      h('div', { class: 'lp-msgtext', translate: 'no' }, L.ident(m) + ': ' + m.text),
      h('div', { class: 'lp-nums' }, token(s),
        h('span', null, t('facilityW'), ' ', h('b', { translate: 'no' }, String(fn))),
        h('span', null, t('severityW'), ' ', h('b', { translate: 'no' }, String(m.severity))),
        h('span', null, data('PRI <' + L.pri(m.facility, m.severity) + '>'))),
      sent ? null : h('div', { class: 'lp-empty' }, t('notSent')));
    return h('section', { class: 'lp-box lp-station', dataset: s.at === 'sender' ? { here: '' } : {} },
      h('h3', null, no(1), t('sender')), who, msg);
  }

  function journalBox(s, c) {
    var path = L.journalPath(s.storage);
    var vol = s.storage === 'volatile';
    var entries = s.journal.map(function (e, i) {
      if (e.id === 'msg') {
        var f = [h('b', null, 'PRIORITY=' + e.PRIORITY), h('b', null, 'SYSLOG_FACILITY=' + e.SYSLOG_FACILITY),
          h('span', null, 'SYSLOG_IDENTIFIER=' + e.SYSLOG_IDENTIFIER), e._PID != null ? h('span', null, '_PID=' + e._PID) : null,
          h('span', null, '_TRANSPORT=' + e._TRANSPORT), h('span', null, 'MESSAGE=' + e.MESSAGE)];
        return h('div', { class: 'lp-entry' + (has(s, 'journal') ? ' sd-changed' + anim(c, true) : ''), translate: 'no' }, f);
      }
      var fresh = has(s, 'journal-own') && (s.event.kind === 'server' ? i === s.journal.length - 1 : i > 0);
      return h('div', { class: 'lp-own' + (fresh ? ' sd-changed' + anim(c, true) : ''), translate: 'no' },
        e.time + ' ' + e.SYSLOG_IDENTIFIER + '[' + e._PID + ']: ' + e.MESSAGE);
    });
    return h('section', { class: 'lp-box lp-station', dataset: s.at === 'journald' ? { here: '' } : {} },
      h('h3', null, no(2), data('journald'), h('span', { class: 'lp-sub' }, t('journaldSub')), s.at === 'journald' ? token(s) : null),
      h('div', { class: 'lp-store' }, data('Storage=' + s.storage), data('→ ' + path + '/'),
        h('span', { class: 'lp-tag', dataset: vol ? { k: 'dashed' } : {} }, t(vol ? 'lostAtReboot' : 'onDisk'))),
      entries.length ? h('div', { class: 'lp-entries' }, entries) : h('div', { class: 'lp-empty' }, t('journalEmpty')));
  }

  function rsyslogBox(s, c) {
    var reading = s.at === 'rsyslog';
    return h('section', { class: 'lp-box lp-station', dataset: reading ? { here: '' } : {} },
      h('h3', null, no(3), data('rsyslog'), h('span', { class: 'lp-sub' }, t('rsyslogSub')), reading ? token(s) : null),
      h('div', { class: 'lp-inputs' },
        h('div', { class: 'lp-input' + (reading ? ' sd-changed' + anim(c, true) : '') }, h('b', { translate: 'no' }, 'imjournal'), h('span', null, '✓ ', t('inputOn'))),
        h('div', { class: 'lp-input', dataset: { off: '' } }, h('b', { translate: 'no' }, 'imuxsock'), data('SysSock.Use="off"'), h('span', null, '✕ ', t('inputOff')))));
  }

  // ── the rule table (K4): every rule is read, every match fires ──
  function selectorCell(r, i, s) {
    var decided = s.ruleTerms[i];
    var v = s.ruleResults[i] === true ? 'take' : 'drop';
    var out = [];
    var parts = r.selector.split(';');
    parts.forEach(function (txt, k) {
      var ds = {};
      if (decided === k) { ds.v = v; if (s.at === i) ds.now = ''; }
      // a term and its ';' stay on one line; a line may break after the ';'
      out.push(h('span', { class: 'lp-tgroup' }, h('span', { class: 'lp-term', dataset: ds }, txt),
        k < parts.length - 1 ? h('span', { class: 'lp-sep' }, ';') : null), k < parts.length - 1 ? h('wbr') : null);
    });
    // a rule from an included file names its file under the selector
    var from = r.file !== L.RULES[0].file ? h('span', { class: 'lp-from' }, r.file.split('/').pop()) : null;
    return h('span', { translate: 'no' }, out, from);
  }
  function actionCell(r) {
    var parts = r.action.split(' ');
    var out = [];
    parts.forEach(function (x, k) { if (k) out.push(' ', h('wbr')); out.push(x); });
    return h('span', { translate: 'no' }, out);
  }
  function ruleTable(s, c) {
    var at = typeof s.at === 'number' ? s.at : -1;
    return RT({
      dir: c.dir,
      mode: 'deny',   // every row reads as allow: every match wins (each row's mark is set below anyway)
      title: t(s.remote ? 'tableTitleRemote' : 'tableTitle'),
      columns: [{ key: 'sel', label: t('colSel'), wrap: true }],
      actionLabel: t('colAction'),
      markLabel: data(fs(s)),
      rows: s.rules.map(function (r, i) {
        var res = s.ruleResults[i];
        var note = r.kind === 'forward' && res && s.remote.suspended ? [{ k: 'dashed', text: t('noteSuspended') }] : null;
        return { no: i + 1, cells: { sel: selectorCell(r, i, s) }, action: actionCell(r), hit: res,
          mark: res === true ? 'win' : res === false ? 'no' : 'pending', note: note };
      }),
      at: at,
      subject: { mark: '✉', c: 1 },
      words: { win: t('markTakes') },
      changed: at >= 0,
      stickyMark: true
    });
  }

  // ── the outputs ──
  function outputs(s, c) {
    var rows = [];
    var ruleOf = {};
    s.rules.forEach(function (r, i) { ruleOf[r.kind === 'file' ? r.target : r.kind] = i + 1; });
    L.FILES.forEach(function (f) {
      var lines = s.files[f], fresh = has(s, 'file:' + f);
      rows.push(h('div', { class: 'lp-fname', translate: 'no' }, f),
        h('div', { class: 'lp-lines' }, lines.length ? lines.map(function (ln, k) {
          return h('div', { class: 'lp-line' + (fresh && k === lines.length - 1 ? ' sd-changed' + anim(c, true) : ''), translate: 'no' }, ln);
        }) : h('div', { class: 'lp-empty' }, t('noNew'))));
    });
    var tf = has(s, 'terminals');
    rows.push(h('div', { class: 'lp-fname', dataset: { kind: 'users' } }, t('terminals')),
      h('div', { class: 'lp-lines' }, s.terminals.length ? s.terminals.map(function (ln) {
        return h('div', { class: 'lp-line' + (tf ? ' sd-changed' + anim(c, true) : ''), translate: 'no' }, ln);
      }) : h('div', { class: 'lp-empty' }, t('noNew'))));
    var box = h('section', { class: 'lp-box' }, h('h3', null, t('outputs'), h('span', { class: 'lp-sub', translate: 'no' }, s.host)),
      h('div', { class: 'lp-files' }, rows));
    return h('div', { class: 'lp-outs' }, box, s.remote ? serverBox(s, c) : null);
  }

  function serverBox(s, c) {
    var r = s.remote, srv = L.SERVER;
    var down = !r.up && !r.resumed;
    var stateWord = r.up ? t('srvUp') : r.resumed ? t('srvBack') : t('srvDown');
    var lines = r.received.map(function (ln, k) {
      var fresh = has(s, 'server') && k === r.received.length - 1;
      return h('div', { class: 'lp-line' + (fresh ? ' sd-changed' + anim(c, true) : ''), dataset: fresh ? {} : { old: '' }, translate: 'no' }, ln.text);
    });
    var note = null;
    if (r.inFlight) note = h('div', { class: 'lp-srvnote sd-changed' + anim(c, true) }, token(s), ' ', t('onWire'));
    else if (r.checked) note = h('div', { class: 'lp-srvnote' + (has(s, 'checked') ? ' sd-changed' + anim(c, true) : '') }, t.n('checked', r.received.length, { time: r.checked }));
    return h('section', { class: 'lp-box lp-srv', dataset: Object.assign(down ? { down: '' } : {}, s.at === 'server' ? { here: '' } : {}) },
      h('h3', null, t('server'), data(srv.host), data(srv.addr + ':' + srv.port + '/' + srv.proto),
        h('span', { class: 'lp-state', dataset: down ? { down: '' } : {} }, (down ? '✕ ' : '✓ ') + stateWord)),
      h('div', { class: 'lp-fname', translate: 'no' }, srv.file),
      h('div', { class: 'lp-lines' }, lines), note);
  }

  // ── where the event is ──
  function recordsBar(s, c) {
    var done = s.at === 'done';
    var chips = s.records.map(function (r) {
      if (r.where === 'journal') {
        var vol = s.storage === 'volatile';
        return h('span', { class: 'lp-chip', dataset: vol ? { k: 'volatile' } : {} }, h('b', null, '✓ ', t('recJournal')), data(L.journalPath(s.storage) + '/'),
          vol ? h('span', null, t('lostAtReboot')) : null);
      }
      if (r.where === 'terminals') return h('span', { class: 'lp-chip' }, h('b', null, '✓ ', t('recTerminals')));
      if (r.where === 'remote') {
        var unk = r.status === 'unknown';
        return h('span', { class: 'lp-chip', dataset: unk ? { k: 'unknown' } : {} }, h('b', null, (unk ? '? ' : '✓ ') + t('recRemote')),
          data(L.SERVER.host), unk ? h('span', null, t('recUnknown')) : null);
      }
      return h('span', { class: 'lp-chip' }, h('b', null, '✓'), data(r.where));
    });
    return h('section', { class: 'lp-rec' + (done ? ' sd-changed' + anim(c, true) : '') },
      h('h3', null, t('records')),
      chips.length ? chips : h('span', { class: 'lp-empty' }, t('recNone')),
      // the count is of records that exist; a copy whose fate is unknown is shown but not counted
      chips.length ? h('span', { class: 'lp-count' }, t.n('recCount', s.records.filter(function (r) { return r.status === 'yes'; }).length)) : null);
  }

  // ── captions ──
  function captionParts(c) {
    var s = c.state, p = c.params, m = s.msg;
    var fn = L.FACILITIES[m.facility];
    var v = { sender: senderName(s), host: code(s.host), fs: code(fs(s)), fac: code(m.facility), sev: code(sevName(s)),
      fn: data(fn), sn: data(m.severity), pri: data('<' + L.pri(m.facility, m.severity) + '>') };
    var ev = s.event;
    switch (ev.kind) {
      case 'start': return tp('cStart', v);
      case 'emit':
        if (m.sender === 'kernel') return tp('cEmitKernel', v);
        if (m.sender === 'logger') return tp('cEmitLogger', Object.assign({ cmd: code(L.commandOf(m, p)) }, v));
        return tp('cEmitOther', v);
      case 'store':
        return [].concat(tp('cStore', { prio: code('PRIORITY=' + m.severity), facf: code('SYSLOG_FACILITY=' + fn), path: code(L.journalPath(s.storage) + '/') }),
          ' ', t(s.storage === 'volatile' ? 'cStoreVolatile' : 'cStorePersistent'));
      case 'read':
        return m.pid == null ? t('cReadKernel') : tp('cRead', { pid: code(m.pid) });
      case 'rule': {
        var r = s.rules[ev.rule], terms = L.parseSelector(r.selector), n = data(ev.rule + 1);
        var why;
        if (ev.term < 0) why = tp('cTermNoFac', Object.assign({ n: n, sel: code(r.selector) }, v));
        else {
          var tm = terms[ev.term], term = code(r.selector.split(';')[ev.term]);
          if (ev.match) why = tp('cTermTakes', Object.assign({ n: n, term: term }, v));
          else if (tm.sev === 'none') why = tp('cTermNone', Object.assign({ n: n, term: term }, v));
          else if (tm.sev === 'emerg') why = tp('cTermOnlyEmerg', Object.assign({ n: n, term: term }, v));
          else why = tp('cTermWeaker', Object.assign({ n: n, term: term, lvl: code(tm.sev), ln: data(L.SEVERITIES.indexOf(tm.sev)) }, v));
        }
        var act;
        if (!ev.match) act = t('cNoAct');
        else if (r.kind === 'file') act = tp('cActFile', { file: code(r.target) });
        else if (r.kind === 'users') act = t('cActUsers');
        else if (s.remote.up) act = tp('cActFwdUp', { target: code(r.target) });
        else act = tp('cActFwdDown', { target: code(r.target) });
        var out = [].concat(why, ' ', act);
        // "reading goes on" on the first match among rsyslog.conf's own rules (the forward rule's caption is long already)
        var firstOwn = -1;
        s.rules.forEach(function (x, k) { if (firstOwn < 0 && x.kind !== 'forward' && s.ruleResults[k] === true) firstOwn = k; });
        var firstHit = ev.match && firstOwn === ev.rule && ev.rule < s.rules.length - 1;
        if (firstHit) out.push(' ', t('cGoOn'));
        return out;
      }
      case 'server':
        return s.remote.checked ? t('cServerDown') : tp('cServerUp', { srv: code(L.SERVER.host), host: code(s.host) });
      default: {
        var recs = s.records, k = recs.length;
        var main;
        var unknown = recs.some(function (r) { return r.status === 'unknown'; });
        var res0 = function (target) { for (var i = 0; i < s.rules.length; i++) if (s.rules[i].target === target) return s.ruleResults[i]; return null; };
        var secureOnly = m.facility === 'authpriv' && res0('/var/log/messages') === false && res0('/var/log/secure') === true && k === 2;
        if (unknown) main = tp('cDoneRemoteDown', { list: clientList(s) });
        else if (k === 1) main = tp('cDone1', v);
        else if (secureOnly) main = t('cDoneAuthpriv');
        else main = t('cDone' + Math.min(k, 4));
        var res = [].concat(main);
        if (s.storage === 'volatile') res.push(' ', t('cDoneVolatile'));
        return res;
      }
    }
  }

  /** The client's own records, for the remote-down summary: "system journal, /var/log/secure, terminals". */
  function clientList(s) {
    var out = [];
    s.records.forEach(function (r) {
      if (r.where === 'remote') return;
      if (out.length) out.push(', ');
      out.push(r.where === 'journal' ? t('recJournal') : r.where === 'terminals' ? t('recTerminals') : code(r.where));
    });
    return h('span', null, out);
  }

  // ── the stage ──
  function render(c) {
    var s = c.state;
    var path = h('div', { class: 'lp-path' },
      senderBox(s, c), arrow(s.at === 'journald'), journalBox(s, c), arrow(s.at === 'rsyslog'), rsyslogBox(s, c));
    var low = h('div', { class: 'lp-low' }, ruleTable(s, c), outputs(s, c));
    c.stage.replaceChildren(h('div', { class: 'lp' }, sayLine(s, c.params), path, low, recordsBar(s, c)));
  }

  var sevOptions = L.SEVERITIES.map(function (x, i) { return [x, t('sev' + i)]; });

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'facility', type: 'select', label: t('facility'), resets: true,
        options: L.FACILITY_IDS.map(function (f) { return [f, t(FAC_KEY[f])]; }) },
      { key: 'severity', type: 'select', label: t('severity'), resets: true, options: sevOptions },
      { key: 'storage', type: 'choice', label: t('storage'), resets: true,
        options: [['persistent', t('storagePersistent')], ['volatile', t('storageVolatile')]] },
      { key: 'remote', type: 'toggle', label: t('remote'), resets: true },
      { key: 'serverUp', type: 'toggle', label: t('serverUp'), resets: true,
        visible: function (p) { return p.remote; } }
    ],

    presets: [
      { id: 'logger-notice', label: t('pNotice'), params: { facility: 'user', severity: 'notice' } },
      { id: 'authpriv', label: t('pAuthpriv'), params: { facility: 'authpriv', severity: 'info' } },
      { id: 'debug-journal-only', label: t('pDebug'), params: { facility: 'user', severity: 'debug' } },
      { id: 'emerg', label: t('pEmerg'), params: { facility: 'user', severity: 'emerg' } },
      { id: 'cron', label: t('pCron'), params: { facility: 'cron', severity: 'info' } },
      { id: 'remote-down', label: t('pRemote'), params: { remote: true, serverUp: false } }
    ],

    legend: [
      { shape: 'lp-token', label: t('legendToken') },
      { shape: 'rt-win', label: t('legendTakes') },
      { shape: 'rt-no', label: t('legendNo') },
      { shape: 'lp-term', label: t('legendTerm') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: render,
    caption: captionParts
  });
})();
</script>
</body>
</html>
