<!-- VLAN: adopted from the URM book's web edition (uvod-u-racunalne-mreze, ugradbeno/vlan.html) into the simdeck kit
     (docs/sim-ui.md). A stepper through two frames, one per VLAN, crossing two switches joined by one link that is a
     trunk or an access port: the frame enters untagged, is tagged (trunk), carried untagged (its own access VLAN) or
     held (another VLAN's access port), then delivered with the tag removed. The model is in sim.js, the words in
     strings.js. -->

     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->

    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  /** Each VLAN has a colour, a badge shape and its number written out: colour is never the only carrier. */
  var LOOK = { 10: { c: '1', shape: 'square' }, 20: { c: '2', shape: 'round' } };

  // t.parts puts the same node at every use of a placeholder, and a node can stand in one place only: copy repeats.
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) !== -1) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function data(text) { return h('b', { translate: 'no' }, String(text)); }
  function hostOf(id) { return L.hosts.filter(function (x) { return x.id === id; })[0]; }
  function name(id) { return h('b', { translate: 'no', class: 'sd-ink', dataset: { c: LOOK[hostOf(id).vlan].c } }, id); }

  function roleOf(s, id) {
    if (s.phase === 'idle') return null;
    if (id === s.src) return 'sends';
    if (s.phase !== 'exit') return null;
    if (id === s.delivered) return 'gets';
    return id === s.dst ? 'nothing' : null;
  }

  function frameView(s) {
    if (s.phase === 'idle') {
      return h('div', { class: 'vl-frame' }, h('div', { class: 'vl-frame-line vl-none' }, t('frameNone')));
    }
    var fields = [
      h('div', { class: 'vl-field' }, h('small', null, t('fDst')), data(s.dst)),
      h('div', { class: 'vl-field' }, h('small', null, t('fSrc')), data(s.src))
    ];
    if (s.tag !== null) {
      fields.push(h('div', { class: 'vl-field vl-tag' + (s.tagChange === 'added' ? ' sd-changed' : '') },
        h('small', null, t('fTag')), h('b', { translate: 'no' }, t('fTagValue', { v: s.tag }))));
    } else if (s.tagChange === 'removed') {
      fields.push(h('div', { class: 'vl-field vl-tag vl-gone sd-changed' }, h('small', null, t('fTag')), t('fTagRemoved')));
    }
    fields.push(h('div', { class: 'vl-field' }, h('small', null, t('fType'))));
    fields.push(h('div', { class: 'vl-field vl-grow' }, h('small', null, t('fData'))));
    var where = s.at === 'sw1' ? t('whereSw1') : s.at === 'link' ? t('whereLink') : s.at === 'held'
      ? (s.phase === 'exit' ? t('whereNowhere') : t('whereHeld')) : t('whereHost', { host: s.delivered });
    return h('div', { class: 'vl-frame' },
      h('div', { class: 'vl-frame-line' }, parts('frameLine', { k: data(s.frame), src: name(s.src), dst: name(s.dst), v: data(s.vlan) })),
      h('div', { class: 'vl-fields' }, fields),
      h('div', { class: 'vl-state' }, (s.tag !== null ? t('stateTagged') : t('stateUntagged')) + ' · ' + where));
  }

  function hostBox(id, s, c) {
    var x = hostOf(id), look = LOOK[x.vlan], role = roleOf(s, id);
    var cls = role === 'sends' || role === 'gets' ? ' vl-active' : role === 'nothing' ? ' vl-idle' : '';
    var anim = role === 'gets' && c.dir === 'forward' ? ' sd-anim-in' : '';
    var roleKey = { sends: 'roleSends', gets: 'roleGets', nothing: 'roleNothing' }[role];
    return h('div', { class: 'vl-host' + cls + anim },
      h('b', { class: 'vl-badge sd-fill', dataset: { c: look.c, shape: look.shape }, translate: 'no' }, id),
      h('div', { class: 'vl-host-text' },
        h('span', null, t('vlanLine', { v: x.vlan, name: t('vlanName' + x.vlan) })),
        h('small', { class: 'vl-role' }, roleKey ? t(roleKey) : '')));
  }

  /** The access port between a host and its switch: thick while this host's frame passes it. */
  function drop(id, s) {
    var x = hostOf(id);
    var on = (s.phase === 'enter' && id === s.src) || (s.phase === 'exit' && id === s.delivered);
    return h('div', { class: 'vl-drop' + (on ? ' vl-on' : '') }, h('span', null, t('portAccess', { v: x.vlan })));
  }

  function linkView(s, p) {
    var l = L.parseLink(p.link);
    var label = l.mode === 'trunk' ? t('portTrunk') : t('portAccess', { v: l.vlan });
    var wire = 'vl-wire', text = '';
    if (s.phase === 'link' && s.at === 'link') {
      wire += ' vl-on';
      text = s.tag !== null ? t('wireTagged', { v: s.tag }) : t('wireUntagged');
    } else if (s.at === 'held') {
      wire += ' vl-cut';
      text = t('wireHeld', { v: s.vlan });
    }
    return h('div', { class: 'vl-link' },
      h('div', { class: 'vl-link-label', translate: 'no' }, label),
      h('div', { class: wire }),
      h('div', { class: 'vl-wire-text' }, text));
  }

  function switchBox(nr, s) {
    var active = (nr === 1 && (s.at === 'sw1' || s.at === 'held')) || (nr === 2 && s.phase === 'exit' && s.at === 'host');
    return h('div', { class: 'vl-switch' + (active ? ' vl-active' : ''), translate: 'no' }, 'SW' + nr);
  }

  function results(s) {
    var items = L.frames.map(function (f) {
      var r = s.results[f.vlan];
      var key = r === 'ok' ? 'resultOk' : r === 'cut' ? 'resultCut' : 'resultPending';
      var cls = r === 'ok' ? 'vl-ok' : r === 'cut' ? 'vl-cutres' : 'vl-pending';
      return h('div', { class: 'vl-result ' + cls }, parts(key, { a: name(f.src), b: name(f.dst) }));
    });
    return h('div', { class: 'vl-results' }, h('h2', null, t('resultsTitle')), items);
  }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: {} },
    { id: 'trunk', label: t('presetTrunk'), hint: t('presetTrunkHint'), params: { link: 'trunk' } },
    { id: 'wrong', label: t('presetWrong'), hint: t('presetWrongHint'), params: { link: 'access-20' } }
  ];

  var params = [
    { key: 'link', type: 'choice', label: t('link'), options: [
      ['trunk', t('optTrunk')], ['access-10', t('optAccess10')], ['access-20', t('optAccess20')]
    ] }
  ];

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: presets,

    legend: [
      { c: 1, label: t('legend10') },
      { c: 2, shape: 'round', label: t('legend20') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var net = h('div', { class: 'vl-net' },
        hostBox('Ra1', s, c), h('div'), hostBox('Ra2', s, c),
        drop('Ra1', s), h('div'), drop('Ra2', s),
        switchBox(1, s), linkView(s, c.params), switchBox(2, s),
        drop('Pr1', s), h('div'), drop('Pr2', s),
        hostBox('Pr1', s, c), h('div'), hostBox('Pr2', s, c));
      c.stage.replaceChildren(h('div', { class: 'vl' }, frameView(s), net, results(s)));
    },

    caption: function (c) {
      var s = c.state, l = L.parseLink(c.params.link);
      if (s.phase === 'idle') {
        return parts('captionIdle', { link: l.mode === 'trunk' ? t('linkTrunk') : t('linkAccess', { v: l.vlan }) });
      }
      var v = { src: name(s.src), dst: name(s.dst), v: data(s.vlan), lv: data(l.vlan) };
      var out;
      if (s.phase === 'enter') out = parts('captionEnter', v);
      else if (s.phase === 'link') {
        out = parts(s.at === 'held' ? 'captionLinkHeld' : l.mode === 'trunk' ? 'captionLinkTrunk' : 'captionLinkAccess', v);
      } else {
        out = parts(s.at === 'held' ? 'captionExitHeld' : l.mode === 'trunk' ? 'captionExitTrunk' : 'captionExitAccess', v);
      }
      if (c.last) {
        var cut = L.vlans.filter(function (x) { return s.results[x] === 'cut'; });
        out = out.concat([' '], cut.length ? parts('captionDoneAccess', { cut: data(cut[0]) }) : parts('captionDoneTrunk', {}));
      }
      return out;
    }
  });
})();
</script>
</body>
