<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var NS = 'http://www.w3.org/2000/svg';

  // ── numbers in the page's language ──

  /** Tenths as text: 27 → "2,7" / "2.7". */
  function dec(x10) {
    var s = Math.floor(x10 / 10) + '.' + (x10 % 10);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function svg(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  // ── the numbers at the month ──

  function table(s) {
    var m = s.p.month, x = s.base.series[m], y = s.mine.series[m], r = s.mine.sum;
    function row(key, base, mine) {
      return h('tr', null, h('th', { scope: 'row' }, t(key)),
        h('td', { class: 'jm-num jm-base', translate: 'no' }, base),
        h('td', { class: 'jm-num', translate: 'no' }, mine));
    }
    return h('table', { class: 'jm-tab', 'aria-label': t('tableLabel', { m: m, bx: dec(x.excess10), bo: x.orphans, mx: dec(y.excess10), mo: y.orphans }) },
      h('thead', null, h('tr', null, h('th', null, h('span', { class: 'jm-num', translate: 'no' }, t('monthAxis', { n: m }))),
        h('th', { scope: 'col' }, t('h_base')), h('th', { scope: 'col' }, t('h_mine')))),
      h('tbody', null,
        row('m_excess', dec(x.excess10), dec(y.excess10)),
        row('m_orphans', String(x.orphans), String(y.orphans)),
        row('m_lines', String(x.lines), String(y.lines)),
        row('m_removed', t('dash'), r.count ? r.removed + ' · ' + r.closed : t('dash'))));
  }

  // ── the charts ──

  /** A chart of one number over the two years, both runs up to the month; the y scale fixed over the two years. */
  function chart(s, kind) {
    var M = L.MONTHS, m = s.p.month;
    function val(v) { return kind === 'excess' ? v.excess10 / 10 : v.orphans; }
    var all = s.base.series.concat(s.mine.series).map(val);
    var top = Math.max.apply(null, all);
    var ymax = kind === 'excess' ? Math.max(1, Math.ceil(top)) : Math.max(5, Math.ceil(top / 5) * 5);
    function pts(series) {
      return series.slice(0, m + 1).map(function (v, i) { return i + ',' + (100 - val(v) / ymax * 100).toFixed(2); }).join(' ');
    }
    var plot = svg('svg', { viewBox: '0 0 ' + M + ' 100', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    [['base', s.base.series], ['mine', s.mine.series]].forEach(function (x) {
      plot.append(svg('polyline', { class: 'jm-l-' + x[0], points: pts(x[1]), 'vector-effect': 'non-scaling-stroke' }));
    });
    var pct = function (i) { return (i / M * 100) + '%'; };
    var kids = [plot, h('span', { class: 'jm-cur', style: { left: pct(m) } })];
    s.mine.reviews.forEach(function (rm) { if (rm <= m) kids.push(h('span', { class: 'jm-rev', style: { left: pct(rm) } })); });
    kids.push(h('span', { class: 'jm-dot', dataset: { base: 'true' }, style: { left: pct(m), bottom: (val(s.base.series[m]) / ymax * 100) + '%' } }));
    kids.push(h('span', { class: 'jm-dot', style: { left: pct(m), bottom: (val(s.mine.series[m]) / ymax * 100) + '%' } }));
    kids.push(h('span', { class: 'jm-y jm-num', translate: 'no', style: { top: '0%' } }, String(ymax)));
    kids.push(h('span', { class: 'jm-y jm-num', translate: 'no', style: { top: '100%' } }, '0'));
    for (var i = 0; i <= M; i += 6) kids.push(h('span', { class: 'jm-x jm-num', translate: 'no', style: { left: pct(i) } }, i === 0 ? '0' : t('monthAxis', { n: i })));
    var b0 = kind === 'excess' ? dec(s.base.series[m].excess10) : s.base.series[m].orphans;
    var y0 = kind === 'excess' ? dec(s.mine.series[m].excess10) : s.mine.series[m].orphans;
    var what = t(kind === 'excess' ? 'chExcess' : 'chOrphans');
    return h('div', { class: 'jm-ch' },
      h('p', { class: 'jm-ch-t' }, what),
      h('div', { class: 'jm-plot', role: 'img', 'aria-label': t('chartLabel', { what: what, m: m, b: b0, y: y0 }) },
        h('div', { class: 'jm-area' }, kids)));
  }

  // ── the matrix ──

  function matrix(s) {
    var cols = s.mine.cols, R = L.RIGHTS, P = L.PER_TEAM;
    var groups = [];
    for (var g = 0; g < L.TEAMS; g++) groups.push({ team: g, cols: cols.filter(function (c) { return c.left === null && c.team === g; }) });
    var gone = cols.filter(function (c) { return c.left !== null; });
    if (gone.length) groups.push({ team: null, cols: gone });
    groups = groups.filter(function (x) { return x.cols.length; });

    var tpl = 'var(--lab, 12rem)';
    groups.forEach(function (x) { tpl += ' 0.45rem repeat(' + x.cols.length + ', minmax(0, 1fr))'; });

    function who(c) {
      return c.left === null ? t('who', { id: c.id, team: t('t_' + c.team) }) : t('whoGone', { id: c.id, m: c.left });
    }
    var kids = [h('span')];
    groups.forEach(function (x) {
      kids.push(h('span'));
      var gone = x.team === null;
      kids.push(h('span', { class: 'jm-gh', dataset: { team: gone ? '' : String(x.team), gone: String(gone) },
        style: { gridColumn: 'span ' + x.cols.length } },
        gone ? t('mxGone', { n: x.cols.length }) : t('t_' + x.team) + ' ' + x.cols.length));
    });
    var extra = 0;
    for (var r = 0; r < R; r++) {
      var rt = Math.floor(r / P);
      if (r % P === 0) kids.push(h('span', { class: 'jm-sep' }));
      kids.push(h('span', { class: 'jm-rl', dataset: { team: String(rt) } }, t('x_' + r)));
      groups.forEach(function (x) {
        kids.push(h('span'));
        x.cols.forEach(function (c) {
          var bit = 1 << r, st = '';
          if (c.held & bit) st = c.left !== null ? 'gone' : (c.extra & bit ? 'extra' : 'need');
          if (st === 'extra') extra++;
          var key = st === 'need' ? 'cellNeed' : st === 'extra' ? 'cellExtra' : st === 'gone' ? 'cellGone' : null;
          kids.push(h('span', { class: 'jm-c', title: key ? t(key, { who: who(c), right: t('x_' + r) }) : null,
            dataset: { s: st, team: String(rt), col: c.left === null ? '' : 'gone' } }));
        });
      });
    }
    var people = cols.length - gone.length;
    return h('div', { class: 'jm-mxw' },
      h('p', { class: 'jm-mx-t' }, t('mxTitle', { m: s.p.month })),
      h('div', { class: 'jm-mx', role: 'img', 'aria-label': t('mxLabel', { p: people, o: gone.length, x: extra }), style: { '--cols': tpl } }, kids));
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'jm' },
      table(s), chart(s, 'excess'), chart(s, 'orphans'), matrix(s),
      h('p', { class: 'jm-foot' }, t('foot'))));
  }

  function caption(c) {
    var s = c.state, m = s.p.month;
    var k = L.captionKey(s);
    var x = s.base.series[m], y = s.mine.series[m], n = s.counts;
    var out = t.parts(k.key, {
      m: m, j: b(n.joins), mv: b(n.moves), l: b(n.leaves),
      bx: b(dec(x.excess10)), bo: b(x.orphans), mx: b(dec(y.excess10)), mo: b(y.orphans)
    });
    var last = s.mine.sum.last;
    k.notes.forEach(function (key) {
      out.push(' ');
      if (key === 'nReview') {
        // rule 10: who reviewed and how much they read, then what it removed (and closed, when leavers were listed)
        out = out.concat(t.parts(s.p.review === 'teams' ? 'nReviewTeams' : 'nReviewOne',
          { rm: last.month, n: b(last.reviewers), tl: b(last.lines), pl: b(last.perReviewer), c: b(last.checked) }));
        out.push(' ');
        out = out.concat(t.parts(last.orphans ? 'nRemovedClosed' : 'nRemoved',
          { r: b(last.removed), x: b(last.excess), k: b(last.closed), o: b(last.orphans) }));
      } else {
        out = out.concat(t.parts(key, { k: b(s.mine.copied), u: b(n.untold), l: b(n.leaves) }));
      }
    });
    return out;
  }

  var labels = { drift: 'pDrift', hr: 'pHr', 'big-review': 'pBigReview', 'team-review': 'pTeamReview', roles: 'pRoles', all: 'pAll' };
  var R = L.RANGES;

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'hr', type: 'toggle', label: t('hr') },
      { key: 'roles', type: 'toggle', label: t('roles') },
      { key: 'move', type: 'toggle', label: t('move') },
      { key: 'review', type: 'choice', label: t('review'), options: L.REVIEWS.map(function (x) { return [x, t('rv_' + x)]; }) },
      { key: 'care', type: 'range', label: t('care'), min: R.care[0], max: R.care[1], step: L.CARE_STEP,
        visible: function (p) { return p.review !== 'off'; } },
      { key: 'month', type: 'range', label: t('month'), min: R.month[0], max: R.month[1], step: 1 },
      // the seed: "New two years" adds 1; hidden, kept in the URL
      { key: 'seed', type: 'range', label: t('newRun'), min: R.seed[0], max: R.seed[1], step: 1, visible: function () { return false; } },
      { type: 'button', label: t('newRun'), key: 'n', run: function (api) { api.set({ seed: L.nextSeed(api.params.seed) }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'jm-need', label: t('legNeed') },
      { shape: 'jm-extra', label: t('legExtra') },
      { shape: 'jm-gone', label: t('legGone') },
      { shape: 'jm-base', label: t('legBase') },
      { shape: 'jm-mine', label: t('legMine') },
      { shape: 'jm-rev', label: t('legReview') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
