<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particioniranje diska</title>
<style>
  /* Placeholder only: the real look comes from the kit. */
  body { font: 24px/1.4 system-ui, sans-serif; margin: 2rem; }
  .disk { display: flex; height: 80px; border: 3px solid #333; margin: 2rem 0; }
  .disk div { display: grid; place-items: center; border-right: 2px solid #333; overflow: hidden; }
  .p1 { background: #9cc3ff; } .p2 { background: #ffd27f; } .free { background: #eee; flex: 1; }
  label { display: block; margin: 0.5rem 0; }
</style>
</head>
<body>
<a id="back" href="../../index.html">← simdeck</a>
<h1 id="title"></h1>
<label>/boot (GB) <input id="a" type="range" min="1" max="100" value="1"> <span id="av"></span></label>
<label>/ (GB) <input id="b" type="range" min="10" max="400" value="100"> <span id="bv"></span></label>
<div class="disk"><div class="p1" id="d1">sda1</div><div class="p2" id="d2">sda2</div><div class="free" id="df">slobodno</div></div>
<p>R ispočetka</p>
<script>
  // Placeholder explorer. The kit's controls replace all of this; only the meta read stays.
  const meta = JSON.parse(document.getElementById('simdeck-meta')?.textContent ?? '{}');
  document.getElementById('title').textContent = meta.title ?? document.title;
  const DISK = 500, $ = (id) => document.getElementById(id);
  const show = () => {
    const a = +$('a').value, b = +$('b').value;
    $('av').textContent = a; $('bv').textContent = b;
    $('d1').style.width = `${(a / DISK) * 100}%`; $('d2').style.width = `${(b / DISK) * 100}%`;
    $('df').textContent = `slobodno ${DISK - a - b} GB`;
  };
  $('a').oninput = $('b').oninput = show;
  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.key !== 'r' && e.key !== 'R') return;
    if (e.key === 'r' || e.key === 'R') { $('a').value = 1; $('b').value = 100; show(); }
  });
  show();
</script>
</body>
</html>
