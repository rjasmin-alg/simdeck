     o 26, 16, 14). An explorer: the readout or the question on top, the squared paper below (click or drag to colour

/* ── the top box: the readout, the question or the walk ── */

[data-sim="geo-perimeter-area"] .pa-lab {

}

[data-sim="geo-perimeter-area"] .pa-lab[data-walk] { padding: 0.08em 0.18em; border: 0.12rem solid var(--c2); border-radius: var(--radius-sm); background: var(--bg); }
[data-sim="geo-perimeter-area"] .pa-lab[data-word] { font-family: inherit; font-weight: 400; font-size: max(16px, 0.8em); color: var(--muted); padding: 0.05em 0.2em; background: color-mix(in srgb, var(--bg) 85%, transparent); border-radius: var(--radius-sm); }
[data-sim="geo-perimeter-area"] .pa-lab[data-tag] { font-family: inherit; font-size: max(16px, 0.85em); padding: 0.1em 0.35em; border: 0.12rem solid var(--ink); border-radius: var(--radius-sm); background: var(--bg); }

/* ── mode twelve: the table beside the paper ── */
[data-sim="geo-perimeter-area"] .pa-tablebox { display: flex; flex-direction: column; justify-content: center; gap: 0.6em; padding: 0.6em 1em 0.6em 0; min-width: 0; }
[data-sim="geo-perimeter-area"] .pa-table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
[data-sim="geo-perimeter-area"] .pa-table th, [data-sim="geo-perimeter-area"] .pa-table td { padding: 0.25em 0.7em; border-bottom: var(--line-w) solid var(--line); text-align: right; white-space: nowrap; }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="geo-perimeter-area"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="geo-perimeter-area"] .pa { display: flex; flex-direction: column; height: auto; gap: 0.7rem; padding: 0.6rem; font-size: 1rem; }
  [data-sim="geo-perimeter-area"] .pa-say, [data-sim="geo-perimeter-area"] .pa[data-aud='child'] .pa-say { font-size: 1.25rem; }
  [data-sim="geo-perimeter-area"] .pa-top { min-height: 0; }
  [data-sim="geo-perimeter-area"] .pa-side { justify-content: flex-start; }
  [data-sim="geo-perimeter-area"] .pa-paperbox, [data-sim="geo-perimeter-area"] .pa[data-mode='twelve'] .pa-paperbox { height: auto; grid-template-columns: minmax(0, 1fr); }
  [data-sim="geo-perimeter-area"] .pa-wrap { container-type: inline-size; margin: 0.3em; }
  [data-sim="geo-perimeter-area"] .pa-field { width: 100%; }
  [data-sim="geo-perimeter-area"] .pa-tablebox { padding: 0 0.6em 0.6em; }
  [data-sim="geo-perimeter-area"] .pa-lab[data-num], [data-sim="geo-perimeter-area"] .pa-lab[data-walk]:not([data-cur]) { display: none; }
}
</style>

<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Opseg i površina na kvadratnoj mreži</h1>
      <p class="sd-subtitle"></p>
    </div>

    <div data-pc-audience></div>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var A = L.area;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // the sheet with a margin of 0.6 × 0.3 (keeps 2 : 1), so the edge on the sheet's border and its labels show whole
  var VIEW = { x0: -0.6, y0: -0.3, x1: L.W + 0.6, y1: L.H + 0.3 };
  // what the last click or drag did to P and o (rule 6), shown while the squares are still the ones it made
  var last = null;

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function cm(n) { return t('cmFmt', { n: n }); }
  function cm2(n) { return t('cm2Fmt', { n: n }); }
  function symO() { return t('symO'); }
  function symP() { return t('symP'); }

  // ── the paper: paper coordinates (y up) to the SVG (y down) and to % for the HTML labels ──
  function Paper() {
    var view = VIEW, w = view.x1 - view.x0, hh = view.y1 - view.y0;
    var el = svg('svg', { viewBox: view.x0 + ' ' + (-view.y1) + ' ' + w + ' ' + hh, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var labs = [];
    var api = {
      el: el, labs: labs,
      line: function (a, b, cls) { el.append(svg('line', { class: cls, x1: a[0], y1: -a[1], x2: b[0], y2: -b[1] })); },
      square: function (c, cls) { el.append(svg('rect', { class: cls, x: c[0], y: -(c[1] + 1), width: 1, height: 1 })); },
      poly: function (pts, cls) {
        el.append(svg('polygon', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      circle: function (c, r, cls) { el.append(svg('circle', { class: cls, cx: c[0], cy: -c[1], r: r })); },
      /** An HTML label at a point of the paper, shifted by (dx, dy) in rem (y down). */
      lab: function (p, text, dx, dy, data) {
        var left = Math.min(98, Math.max(2, (p[0] - view.x0) / w * 100)), top = Math.min(97, Math.max(3, (view.y1 - p[1]) / hh * 100));
        labs.push(h('span', { class: 'pa-lab', translate: 'no', dataset: data || {},
          style: { left: 'calc(' + left.toFixed(3) + '% + ' + (dx || 0) + 'rem)', top: 'calc(' + top.toFixed(3) + '% + ' + (dy || 0) + 'rem)' } }, text));
      }
    };
    for (var x = 0; x <= L.W; x++) api.line([x, 0], [x, L.H], 'pa-grid');
    for (var y = 0; y <= L.H; y++) api.line([0, y], [L.W, y], 'pa-grid');
    return api;
  }

  // ── the top box ──
  function sideBtn(label, title, run, kbd, pressed) {
    return noFocus(h('button', { type: 'button', class: 'sd-btn pa-sidebtn', title: title, 'aria-keyshortcuts': kbd ? kbd.toLowerCase() : null,
      'aria-pressed': pressed == null ? null : String(pressed), onclick: run }, label, kbd ? ' ' : '', kbd ? h('kbd', null, kbd) : ''));
  }
  /** One readout: the word (površina / opseg), then "P = 8 cm²". */
  function readout(k, sym, val) {
    return h('span', { class: 'pa-read', dataset: { k: k } }, audience === 'child' ? null : h('span', { class: 'pa-w' }, t(k === 'P' ? 'wP' : 'wO')),
      h('span', { class: 'pa-v', translate: 'no' }, t(k === 'P' ? 'readP' : 'readO', { sym: sym, v: val })));
  }
  function revealBtn(s) {
    if (s.hide) return sideBtn(t('reveal'), t('revealKey') + ' (V)', function () { sim.set({ hide: false }); }, 'V');
    if (audience === 'teacher') return sideBtn(t('hide'), t('hideHint'), function () { sim.set({ hide: true }); }, 'V');
    return null;
  }

  function topPaint(s) {
    var col = [], side = [];
    if (!s.P) {
      col.push(h('div', { class: 'pa-say' }, t('paintEmpty')), h('div', { class: 'pa-sub' }, t('paintEmptySub')));
    } else if (s.hide) {
      col.push(h('div', { class: 'pa-say' }, t('askPaint')),
        h('div', { class: 'pa-sub' }, readout('P', symP(), t('unknown')), ' · ', readout('o', symO(), t('unknown'))));
    } else if (s.pieces.length > 1 && s.pieces.length <= 3) {
      // a few shapes: each its own P and o (a sum over shapes is no shape's perimeter)
      col.push(h('div', { class: 'pa-say' }, s.pieces.map(function (pc, i) {
        return h('span', { class: 'pa-read' }, h('span', { class: 'pa-w' }, t('wShape', { n: i + 1 }) + ':'),
          h('span', { translate: 'no' }, t('readP', { sym: symP(), v: cm2(pc.P) }) + ', ' + t('readO', { sym: symO(), v: cm(pc.o) })));
      })));
      col.push(h('div', { class: 'pa-sub' }, t.n('shapesN', s.pieces.length)));
    } else if (s.pieces.length > 3) {
      col.push(h('div', { class: 'pa-say' }, t.n('shapesN', s.pieces.length)));
      col.push(h('div', { class: 'pa-sub' }, s.pieces.map(function (pc, i) {
        return t('pieceRead', { i: i + 1, P: symP() + ' = ' + cm2(pc.P), o: symO() + ' = ' + cm(pc.o) });
      }).join(' · ')));
    } else {
      col.push(h('div', { class: 'pa-say' }, readout('P', symP(), cm2(s.P)), readout('o', symO(), cm(s.o))));
      col.push(h('div', { class: 'pa-sub' }, symP() + ': ' + t.n('squaresN', s.P) + ' · ' + symO() + ': ' + t.n('sidesN', s.o)));
    }
    side.push(revealBtn(s));
    if (s.P) side.push(sideBtn(t('clear'), t('clear'), function () { last = null; sim.set({ cells: [] }); }));
    return [h('div', { class: 'pa-col' }, col), h('div', { class: 'pa-side' }, side)];
  }

  function rectName(r) { return t('rectName', { b: r.b, a: r.a }); }
  function topTwelve(s) {
    var o = s.hide ? t('unknown') : cm(s.o);
    var sum = s.sides.map(cm).join(' + ');
    var col = [
      h('div', { class: 'pa-say' }, h('span', { translate: 'no' }, rectName(s)), readout('P', symP(), cm2(s.P)), readout('o', symO(), o)),
      h('div', { class: 'pa-sub', translate: 'no' }, t('sumSides', { sym: symO(), sum: sum, o: o }))
    ];
    var side = s.rects.map(function (r) {
      return sideBtn(rectName(r), rectName(r), function () { sim.set({ b: r.b }); }, null, r.b === s.b);
    });
    side.push(revealBtn(s));
    return [h('div', { class: 'pa-col' }, col), h('div', { class: 'pa-side' }, side)];
  }

  function walkTo(k) { sim.set({ k: Math.max(0, Math.min(sim.state.o, k)) }); }
  function topWalk(s) {
    var col = [], side = [];
    if (!s.o) {
      col.push(h('div', { class: 'pa-say' }, t('walkEmpty')));
    } else {
      var say = s.k === 0 ? t('walkSay0') : s.done && s.pieces.length === 1 ? t('walkSayDone', { sym: symO(), v: cm(s.k) })
        : t('walkSay', { v: cm(s.pieces.length > 1 ? s.pieceN : s.k) });
      col.push(h('div', { class: 'pa-say' }, say));
      col.push(h('div', { class: 'pa-sub' }, s.pieces.length > 1 ? t('wShape', { n: s.lastPiece + 1 }) + ' · ' + t('walkSub') : t('walkSub')));
      side.push(sideBtn('◀ ' + t('back'), t('back'), function () { walkTo(s.k - 1); }));
      side.push(sideBtn(t('next') + ' ▶', t('nextKey') + ' (N)', function () { walkTo(s.k + 1); }, 'N'));
      side.push(sideBtn(t('toEnd') + ' ⏭', t('toEnd'), function () { walkTo(s.o); }));
      if (s.k) side.push(sideBtn(t('restart'), t('restart'), function () { walkTo(0); }));
    }
    return [h('div', { class: 'pa-col' }, col), h('div', { class: 'pa-side' }, side)];
  }

  // ── the paper, per mode ──
  function drawEdges(pp, edges) { edges.forEach(function (e) { pp.line(e.from, e.to, 'pa-edge'); }); }
  function mid(e) { return [(e.from[0] + e.to[0]) / 2, (e.from[1] + e.to[1]) / 2]; }

  function drawPaint(s, pp) {
    s.cells.forEach(function (c) { pp.square(c, 'pa-sq'); });
    drawEdges(pp, s.edges);
    if (!s.hide && audience !== 'child') {
      // P counted: each shape's squares numbered in reading order, so its last number is its P
      s.pieces.forEach(function (pc) { pc.cells.forEach(function (c, i) { pp.lab([c[0] + 0.5, c[1] + 0.5], String(i + 1), 0, 0, { num: '' }); }); });
    }
    if (s.pieces.length > 1) {
      s.pieces.forEach(function (pc, i) { var c = pc.cells[0]; pp.lab([c[0] + 0.5, c[1] + 1], t('wShape', { n: i + 1 }), 0, -0.75, { tag: '' }); });
    }
  }

  function drawTwelve(s, pp) {
    s.cells.forEach(function (c) { pp.square(c, 'pa-sq'); });
    drawEdges(pp, s.edges);
    s.cells.forEach(function (c, i) { pp.lab([c[0] + 0.5, c[1] + 0.5], String(i + 1), 0, 0, { num: '' }); });
    // the four sides, each with its length: o is their sum
    var x0 = s.x0, y0 = s.y0, x1 = x0 + s.a, y1 = y0 + s.b;
    pp.lab([(x0 + x1) / 2, y0], cm(s.a), 0, 0.9, { side: '' });
    pp.lab([(x0 + x1) / 2, y1], cm(s.a), 0, -0.9, { side: '' });
    pp.lab([x0, (y0 + y1) / 2], cm(s.b), -1.9, 0, { side: '' });
    pp.lab([x1, (y0 + y1) / 2], cm(s.b), 1.9, 0, { side: '' });
  }

  function drawWalk(s, pp) {
    s.cells.forEach(function (c) { pp.square(c, 'pa-sq'); });
    if (!s.o) return;
    s.path.forEach(function (e, i) {
      if (i >= s.k) { pp.line(e.from, e.to, 'pa-todo'); return; }
      pp.line(e.from, e.to, 'pa-edge');
      // the number on the side itself: two sides' middles are at least 0.7 of a square apart, so numbers do not
      // overlap at 1920 × 1080, even in a notch one square wide; on a phone only the last one shows (CSS)
      pp.lab(mid(e), String(e.n), 0, 0, i === s.k - 1 ? { walk: '', cur: '' } : { walk: '' });
    });
    // where each shape's walk starts, and the walker with its next way
    var starts = s.path.filter(function (e, i) { return e.n === 1; });
    starts.forEach(function (e) { pp.circle(e.from, 0.3, 'pa-start'); });
    if (s.k === 0) pp.lab(starts[0].from, t('wStart'), -0.4, 1.1, { word: '' });
    var at = s.at;
    if (s.next) {
      var d = s.next.d, n = [-d[1], d[0]], tip = [at[0] + d[0] * 0.55, at[1] + d[1] * 0.55];
      pp.poly([tip, [at[0] + n[0] * 0.25, at[1] + n[1] * 0.25], [at[0] - n[0] * 0.25, at[1] - n[1] * 0.25]], 'pa-walker');
    }
    pp.circle(at, 0.2, 'pa-walker');
    if (s.pieces.length > 1) {
      var firsts = A.pieces(s.cells);
      firsts.forEach(function (pc, i) { var c = pc[0]; pp.lab([c[0] + 0.5, c[1] + 1], t('wShape', { n: i + 1 }), 0, -1.6, { tag: '' }); });
    }
  }

  function tableTwelve(s) {
    var rows = s.rects.map(function (r, i) {
      var shown = (s.seen >> i) & 1;
      return h('tr', { 'aria-current': i === s.idx ? 'true' : null },
        h('td', { translate: 'no' }, rectName(r)),
        h('td', { translate: 'no' }, shown ? cm2(r.P) : t('unknown')),
        h('td', { translate: 'no' }, shown ? cm(r.o) : t('unknown')));
    });
    var table = h('table', { class: 'pa-table' },
      h('thead', null, h('tr', null, h('th', null, t('tRect')), h('th', { translate: 'no' }, symP()), h('th', { translate: 'no' }, symO()))),
      h('tbody', null, rows));
    var same = s.allSeen && s.rects.length > 1 ? h('div', { class: 'pa-same' }, t('tSame', { P: symP(), o: symO() })) : null;
    return h('div', { class: 'pa-tablebox' }, table, same);
  }

  function render(c) {
    var s = c.state;
    var pp = Paper(), label, top;
    if (s.mode === 'paint') {
      drawPaint(s, pp);
      top = topPaint(s);
      label = s.hide ? t('paintLabelHidden') : s.pieces.length > 1 ? t.n('shapesN', s.pieces.length) + ': ' + s.pieces.map(function (pc, i) {
        return t('pieceRead', { i: i + 1, P: symP() + ' = ' + cm2(pc.P), o: symO() + ' = ' + cm(pc.o) });
      }).join('; ') : t('paintLabel', { P: t.n('squaresN', s.P), Pv: cm2(s.P), ov: cm(s.o) });
    } else if (s.mode === 'twelve') {
      drawTwelve(s, pp);
      top = topTwelve(s);
      label = t('twLabel', { r: rectName(s), n: t.n('squaresGen', s.n), Pv: cm2(s.P), ov: s.hide ? '?' : cm(s.o) });
    } else {
      drawWalk(s, pp);
      top = topWalk(s);
      label = t.n('walkLabel', s.k);
    }
    var field = h('div', { class: 'pa-field', role: 'img', title: s.mode === 'paint' ? t('paintHint') : null, 'aria-label': label,
      dataset: s.mode === 'paint' ? { paint: '' } : {} }, [pp.el].concat(pp.labs));
    c.stage.replaceChildren(h('div', { class: 'pa', dataset: { aud: audience, mode: s.mode } },
      h('section', { class: 'pa-box pa-top' }, top),
      h('section', { class: 'pa-box pa-paperbox' }, h('div', { class: 'pa-wrap' }, field), s.mode === 'twelve' ? tableTwelve(s) : null)));
  }

  // ── captions (SPEC, Legend and captions) ──
  function delta(n) { return n > 0 ? t('dPlus', { n: n }) : n < 0 ? t('dMinus', { n: -n }) : t('dSame'); }
  function delta2(n) { return n > 0 ? t('dPlus2', { n: n }) : n < 0 ? t('dMinus2', { n: -n }) : t('dSame'); }
  function caption(c) {
    var s = c.state, A2 = audience;
    var out = [];
    function put(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function putHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    function sameNum() { if (s.sameNumber && !s.hide && A2 !== 'child') put(t('cSameNum', { n: s.o })); }
    if (s.mode === 'paint') {
      if (!s.P) { put(t('cPaintEmpty')); return out; }
      if (s.hide) { put(t(A2 === 'child' ? 'cAskPaintC' : 'cAskPaint')); return out; }
      if (A2 === 'child') { put(t('cPaintC')); return out; }
      var lastNow = last && last.enc === L.encode(c.params.cells) ? last : null;
      if (lastNow) {
        var d = lastNow.d;
        if (lastNow.many) put(t('cMany', { dP: delta2(lastNow.dP), dO: delta(lastNow.dO) }));
        else put(d.add ? t('cAdd_' + (d.dO < 0 ? 'm' + -d.dO : d.dO)) : t('cDel', { d: delta(d.dO) }));
      }
      if (s.pieces.length > 1) {
        var os = s.pieces.map(function (pc) { return pc.o; }), ps = s.pieces.map(function (pc) { return pc.P; });
        var sameO = os.every(function (v) { return v === os[0]; }) && ps.some(function (v) { return v !== ps[0]; });
        if (sameO && A2 === 'teacher') putHl(t('cMistSameO'));
        put(t('cPieces', { n: t.n('shapesN', s.pieces.length) }));
      } else if (!lastNow) {
        put(t('cPaint', { P: t.n('squaresN', s.P), Pv: cm2(s.P), o: t.n('sidesSq', s.o), ov: cm(s.o) }));
      }
      if (s.holes) put(t('cHole'));
      sameNum();
      if (A2 === 'adult') put(t('whyPaint'));
      return out;
    }
    if (s.mode === 'twelve') {
      if (s.hide) { put(t(A2 === 'child' ? 'cAskTwC' : 'cAskTw')); return out; }
      if (A2 === 'child') { put(t('cTwC')); return out; }
      if (s.rects.length === 1) put(t.n('cTwOne', s.n, { r: rectName(s) }));
      else {
        if (s.allSeen && A2 === 'teacher') putHl(t('cMistSameP', { Pv: cm2(s.n), min: cm(s.oMin), max: cm(s.oMax) }));
        put(t.n('cTw', s.n, { r: rectName(s), Pv: cm2(s.P), ov: cm(s.o) }));
        if (!s.allSeen) put(t('cTwMore'));
      }
      sameNum();
      if (A2 === 'adult') put(t('whyTw'));
      return out;
    }
    if (!s.o) { put(t('cWalkEmpty')); return out; }
    if (A2 === 'child') { put(s.done && s.pieces.length === 1 ? t('cWalkDoneC', { v: cm(s.o) }) : t('cWalkC')); return out; }
    if (s.k === 0) put(t('cWalk0'));
    else if (s.done) {
      if (s.pieces.length === 1) {
        if (s.edgeCells !== s.o && A2 === 'teacher') putHl(t('cMistEdge', { e: s.edgeCells, o: s.o }));
        put(t('cWalkDone', { v: cm(s.o) }));
      } else put(t('cWalkDoneMany'));
      sameNum();
    } else if (s.pieceDone) {
      put(t('cWalkPiece', { i: s.lastPiece + 1, v: cm(s.pieceN), j: s.lastPiece + 2 }));
    } else {
      put(t.n('cWalk', s.pieceN, { v: cm(s.pieceN) }));
      if (s.jump || s.inHole) put(t('cWalkJump'));
    }
    if (A2 === 'adult') put(t('whyWalk'));
    return out;
  }

  // ── the header: the audience switch ──
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, options: L.MODES.map(function (m) { return [m, t('mode_' + m)]; }) },
      { key: 'n', type: 'range', label: t('n'), value: L.defaults.n, min: L.N_MIN, max: L.N_MAX,
        visible: function (prm) { return prm.mode === 'twelve'; } },
      { key: 'hide', type: 'toggle', label: t('hide'), hint: t('hideHint'), value: L.defaults.hide,
        visible: function (prm) { return prm.mode !== 'walk' && audience === 'teacher'; } },
      // the rectangle, the table and the walk: the stage's buttons; here so the URL and the presets carry them
      { key: 'b', type: 'range', label: 'b', value: L.defaults.b, min: 1, max: L.N_MAX, visible: hidden },
      { key: 'seen', type: 'range', label: 'seen', value: L.defaults.seen, min: 0, max: 15, visible: hidden },
      { key: 'k', type: 'range', label: 'k', value: L.defaults.k, min: 0, max: 4 * L.W * L.H, visible: hidden }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'v', label: t('revealKey'), run: function (sm) {
        if (sm.state.mode === 'walk') return; // the walk counts as it goes
        sm.set({ hide: !sm.params.hide });
      } },
      { key: 'n', label: t('nextKey'), run: function (sm) {
        if (sm.state.mode === 'walk') walkTo(sm.state.k + 1);
      } }
    ],

    legend: [
      { c: 1, label: t('legSquare') },
      { c: 2, shape: 'line', label: t('legEdge') },
      { shape: 'dash', label: t('legWalked') }
    ],

    render: render,
    caption: caption
  });

  // ── keep the params what the page shows (snapped and clamped values written back), the table's rows, and the
  //    squares in the URL ──
  var nSig = null;
  function baseCells() {
    var pr = sim.preset ? L.PRESETS.filter(function (x) { return x.id === sim.preset; })[0] : null;
    return pr && pr.params.cells ? pr.params.cells : L.defaults.cells;
  }
  function urlCells(p) {
    try {
      var u = new URLSearchParams(window.location.search), enc = L.encode(p.cells);
      if (enc === L.encode(baseCells())) u.delete('cells'); else u.set('cells', enc);
      var qs = u.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    } catch (e) { /* file:// in some browsers */ }
  }
  sim.on(function (c) {
    var s = c.state, p = c.params, fix = {};
    if (s.mode === 'twelve') {
      if (nSig !== null && nSig !== p.n && p.seen) fix.seen = 0; // other squares: a new table
      else if (p.seen !== s.seen) fix.seen = s.seen;
      if (p.b !== s.b) fix.b = s.b;
    }
    nSig = p.n;
    if (s.mode === 'walk' && p.k !== s.k) fix.k = s.k;
    urlCells(p);
    if (Object.keys(fix).length) sim.set(fix, { preset: sim.preset });
  });
  (function () {
    var q = new URLSearchParams(window.location.search).get('cells');
    if (q !== null) sim.set({ cells: L.decode(q) }, { preset: sim.preset });
  })();

  // ── colouring: a click colours an empty square or erases a coloured one; a drag does the same to every square
  //    it passes (mode paint) ──
  var paintTo = null, lastCell = null, dragFrom = null, dragCount = 0;
  function paperXY(e) {
    var f = document.querySelector('[data-sim="geo-perimeter-area"] .pa-field');
    if (!f) return null;
    var r = f.getBoundingClientRect();
    return [VIEW.x0 + (e.clientX - r.left) / r.width * (VIEW.x1 - VIEW.x0), VIEW.y1 - (e.clientY - r.top) / r.height * (VIEW.y1 - VIEW.y0)];
  }
  function onPaper(xy) { return xy[0] >= 0 && xy[0] < L.W && xy[1] >= 0 && xy[1] < L.H; }
  function paintAt(xy) {
    var c = L.cellAt(xy[0], xy[1]);
    if (lastCell && lastCell[0] === c[0] && lastCell[1] === c[1]) return;
    lastCell = c;
    var cells = sim.params.cells, d = A.toggle(cells, c);
    if (d.add !== paintTo) return;
    var next = d.add ? cells.concat([c]) : cells.filter(function (q) { return q[0] !== c[0] || q[1] !== c[1]; });
    dragCount++;
    var m = A.measure(A.norm(next));
    // one square: what it did and why (rule 6); a drag over several: how P and o changed in all
    last = { d: d, enc: L.encode(next), many: dragCount > 1, dP: m.P - dragFrom.P, dO: m.o - dragFrom.o };
    sim.set({ cells: A.norm(next) });
  }
  var stage = document.querySelector('[data-sd-stage]');
  stage.addEventListener('pointerdown', function (e) {
    if (!e.target.closest || !e.target.closest('.pa-field')) return;
    if (sim.state.mode !== 'paint') return;
    var xy = paperXY(e);
    if (!xy || !onPaper(xy)) return;
    var c = L.cellAt(xy[0], xy[1]);
    paintTo = A.toggle(sim.params.cells, c).add;
    lastCell = null;
    dragFrom = A.measure(A.norm(sim.params.cells));
    dragCount = 0;
    paintAt(xy);
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    e.preventDefault();
  });
  stage.addEventListener('pointermove', function (e) {
    if (paintTo === null) return;
    var xy = paperXY(e);
    if (xy && onPaper(xy)) paintAt(xy);
  });
  function end() { paintTo = null; lastCell = null; }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
