<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var C = L.crew;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  /* Where each person sits in the chart (viewBox 1000 × 360), as in set-chain-of-command: left to right production and
     the director, the 1st AD, the heads and the people who report to the 1st AD, the crews. */
  var POS = {
    prod: [95, 120], dir: [95, 240],
    ad1: [290, 180],
    trainee: [490, 30], actor: [490, 90], dop: [490, 150], snd: [490, 270], pmast: [490, 330],
    op: [695, 90], gaf: [695, 150], kg: [695, 210], boom: [695, 270], prop: [695, 330],
    el: [900, 150], gr: [900, 210]
  };
  /* The hazard tag sits beside the owning crew member: above the electrician, below the grip. */
  var HAZARD_POS = { el: [900, 100], gr: [900, 262] };
  var W = 1000, H = 360, HALF = [87, 24.5], HALF_AD = [107, 24.5];
  var SYM = { hop: '→', halt: '■', fixed: '✓', clear: '✓', restart: '▶', lost: '✕', check: '?', blame: '!', accident: '⚠' };

  function svg(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function role(id) { return t('r_' + id); }
  function pct(v, of) { return (100 * v / of) + '%'; }
  function ruleOf(p) { return p.anyone ? 'on' : 'off'; }

  /* An arrow from box a to box b, cut at both box edges and shifted to the right of its direction, so two arrows
     between the same pair in opposite directions stay apart. */
  function ends(a, b) {
    var pa = POS[a], pb = POS[b];
    var dx = pb[0] - pa[0], dy = pb[1] - pa[1];
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    function cut(id) {
      var half = id === 'ad1' ? HALF_AD : HALF;
      var sx = ux === 0 ? Infinity : half[0] / Math.abs(ux);
      var sy = uy === 0 ? Infinity : half[1] / Math.abs(uy);
      return Math.min(sx, sy) + 5;
    }
    var off = 7, ox = -uy * off, oy = ux * off;
    var ca = cut(a), cb = cut(b);
    return { x1: pa[0] + ux * ca + ox, y1: pa[1] + uy * ca + oy, x2: pb[0] - ux * cb + ox, y2: pb[1] - uy * cb + oy, ux: ux, uy: uy };
  }

  function arrow(g, badges, e, changed) {
    var p = ends(e.from, e.to);
    var tip = 14, wing = 7;
    var bx = p.x2 - p.ux * tip, by = p.y2 - p.uy * tip;
    g.append(
      svg('line', { class: 'ss-arrow', x1: p.x1, y1: p.y1, x2: bx, y2: by, 'data-how': e.how }),
      svg('polygon', { class: 'ss-head', 'data-how': e.how, points: [p.x2, p.y2, bx - p.uy * wing, by + p.ux * wing, bx + p.uy * wing, by - p.ux * wing].join(' ') }));
    var mx = (p.x1 + p.x2) / 2, my = (p.y1 + p.y2) / 2;
    badges.push(h('div', { class: 'ss-badge' + (changed ? ' sd-changed' : ''), dataset: { how: e.how }, style: { left: pct(mx, W), top: pct(my, H) } }, e.t + '′'));
  }

  /* What each person's box says at minute n, for the chosen run. */
  function tags(run, p, n) {
    var hz = L.hazard(p.hazard);
    var N = L.noticer(p.noticer, hz), O = C.headOf(hz.dept), Wc = L.crewOf(hz.dept);
    var lg = run.log, out = {};
    out[N] = { k: 'saw', text: t('tagSaw') };
    if (run.lostAt) out[run.lostAt] = { k: 'lost', text: t('tagLost') };
    if (run.blamed) out[run.blamed] = { k: 'blame', text: t('tagBlame') };
    var sent = run.hops.some(function (e) { return e.how === 'send'; });
    if (sent && lg.accident === null) {
      if (lg.fixed !== null) out[Wc] = { k: 'fixed', text: t('tagFixed') };
      else if (lg.clear !== null) out[Wc] = { k: 'fixed', text: t('tagClear') };
      else out[Wc] = { k: 'fixing', text: t('tagFixing') };
    }
    if (lg.restart !== null) out.ad1 = { k: 'run', text: t('tagRun') };
    else if (lg.halt !== null) out.ad1 = { k: 'halt', text: t('tagHalt') };
    else if (lg.check !== null && lg.blame === null && lg.accident === null) out.ad1 = { k: 'check', text: t('tagCheck') };
    return { tags: out, owner: O, crewMember: Wc };
  }

  function chart(run, p, n, first) {
    var hz = L.hazard(p.hazard);
    var bg = svg('g', { class: 'ss-bg' });
    C.lines().forEach(function (l) {
      bg.append(svg('line', { x1: POS[l[0]][0], y1: POS[l[0]][1], x2: POS[l[1]][0], y2: POS[l[1]][1] }));
    });
    var fg = svg('g', null), badges = [];
    var touched = {};
    run.hops.forEach(function (e) {
      var now = !first && e.t === n;
      arrow(fg, badges, e, now);
      if (now) touched[e.to] = 1;
    });
    if (!first) run.now.forEach(function (e) { if (e.at && e.kind !== 'hop') touched[e.at] = 1; });
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    root.append(bg, fg);

    var tg = tags(run, p, n);
    var involved = {};
    involved.ad1 = 1; involved[tg.owner] = 1; involved[tg.crewMember] = 1;
    Object.keys(tg.tags).forEach(function (id) { involved[id] = 1; });
    run.hops.forEach(function (e) { involved[e.from] = 1; involved[e.to] = 1; });
    var nodes = C.PEOPLE.map(function (q) {
      var tag = tg.tags[q.id];
      return h('div', {
        class: 'ss-node' + (touched[q.id] ? ' sd-changed' : ''),
        dataset: { id: q.id, head: q.head ? '1' : '0', k: tag ? tag.k : '', dim: involved[q.id] ? '0' : '1' },
        style: { left: pct(POS[q.id][0], W), top: pct(POS[q.id][1], H) }
      },
        h('span', { class: 'ss-name' }, role(q.id)),
        tag ? h('span', { class: 'ss-tag' }, tag.text) : null);
    });
    var hp = HAZARD_POS[tg.crewMember];
    var hk = run.log.accident !== null ? 'accident' : (run.log.fixed !== null || run.log.clear !== null) ? 'fixed' : '';
    var hText = (hk === 'accident' ? '⚠ ' : hk === 'fixed' ? '✓ ' : '⚠ ') + t('h_' + hz.id);
    var hazardTag = h('div', { class: 'ss-hazard', dataset: { k: hk }, style: { left: pct(hp[0], W), top: pct(hp[1], H) } }, hText);
    return h('div', { class: 'ss-chart' }, root, nodes, hazardTag, badges);
  }

  /* The minute line: one column per minute 0..steps, the events of the chosen run so far, the fuse and the break. */
  function minuteLine(p, n) {
    var rule = ruleOf(p);
    var hz = L.hazard(p.hazard);
    var ev = L.plan(p, p.action, rule);
    var check = ev.filter(function (e) { return e.kind === 'check' && e.t <= n; })[0];
    var showBreak = p.action === 'break' || ev.some(function (e) { return e.how === 'break'; });
    var cols = [];
    for (var m = 0; m <= L.steps; m++) {
      var here = ev.filter(function (e) { return e.t === m && e.t <= n; });
      var inCheck = check && m >= check.t && m < check.until && m <= n;
      cols.push(h('div', {
        class: 'ss-col',
        dataset: { fuse: hz.fuse === m ? '1' : '0', now: m === n ? '1' : '0', future: m > n ? '1' : '0', check: inCheck ? '1' : '0' }
      },
        h('div', { class: 'ss-top-l' }, hz.fuse === m ? t('fuseAt', { m: m }) : ''),
        h('div', { class: 'ss-cell' }, here.map(function (e) {
          return h('span', { class: 'ss-ev', dataset: { k: e.kind } }, SYM[e.kind]);
        })),
        h('div', { class: 'ss-num' }, String(m)),
        h('div', { class: 'ss-bot-l' }, showBreak && m === p.breakAt ? t('breakAt') : (check && m === check.t && m <= n ? t('checkSpan') : ''))));
    }
    return h('div', { class: 'ss-linebox' }, h('div', { class: 'ss-line' }, cols));
  }

  function cellText(o, p) {
    if (o.kind === 'restart') return t('o_restart', { t: o.t, h: o.halt });
    if (o.kind === 'check') return t('o_check', { u: o.until });
    if (o.kind === 'waiting') return o.how === 'break' ? t('o_waitBreak', { t: o.t }) : t('o_waiting');
    if (o.kind === 'quiet') return t('o_quiet');
    return t('o_' + o.kind, { t: o.t });
  }

  function table(s, p, n, first) {
    var rule = ruleOf(p);
    var rows = L.ACTIONS.map(function (a) {
      return h('tr', null, h('td', null, t('a_' + a)), L.RULES.map(function (r) {
        var k = L.key(a, r), run = s.runs[k];
        var o = L.outcome(run, p, a, r, n);
        var on = a === p.action && r === rule;
        var changed = !first && run.now.some(function (e) { return e.kind !== 'hop' && e.kind !== 'check'; });
        return h('td', { class: changed ? 'sd-changed' : '', dataset: { k: o.kind, on: on ? '1' : '0' } }, cellText(o, p));
      }));
    });
    return h('table', { class: 'ss-tab' },
      h('thead', null, h('tr', null, h('th', null, t('thAction')),
        h('th', { dataset: { on: rule === 'on' ? '1' : '0' } }, t('thOn')),
        h('th', { dataset: { on: rule === 'off' ? '1' : '0' } }, t('thOff')))),
      h('tbody', null, rows));
  }

  function eventText(e, p) {
    var hz = L.hazard(p.hazard);
    if (e.kind === 'hop') return t('cap_' + e.how, { from: role(e.from), to: role(e.to) });
    if (e.kind === 'halt') return t('cap_halt');
    if (e.kind === 'check') return t('cap_check', { head: role(e.head), n: e.until - e.t });
    if (e.kind === 'lost') return t('cap_lost', { who: role(e.at) });
    if (e.kind === 'fixed') return t('cap_fixed', { who: role(e.at) });
    if (e.kind === 'clear') return t('cap_clear', { who: role(e.at) });
    if (e.kind === 'blame') return t('cap_blame', { who: role(e.who) });
    if (e.kind === 'accident') return t('acc_' + hz.id);
    return '';
  }

  function quietText(run, p, n) {
    var o = L.outcome(run, p, p.action, ruleOf(p), n);
    if (o.kind === 'accident') return t('q_after');
    if (o.kind === 'restart' || o.kind === 'blame') return t('q_run');
    if (o.kind === 'halt') return t('q_halted');
    var real = L.hazard(p.hazard).real;
    if (o.kind === 'fixed') return t('q_fixed');
    if (o.kind === 'clear') return t('q_clear');
    if (o.kind === 'lost') return t(real ? 'q_lost' : 'q_lostFalse');
    if (o.kind === 'check') return t('q_check');
    if (o.kind === 'waiting') return o.how === 'break' ? t('q_wait', { b: o.t }) : t('q_none');
    return real ? t('q_quiet') : t('q_none');
  }

  function caption(c) {
    var p = c.params, run = c.state.runs[L.key(p.action, ruleOf(p))];
    var hz = L.hazard(p.hazard);
    var who = role(L.noticer(p.noticer, hz));
    if (c.first) {
      return t(hz.real ? 'capStart' : 'capStartFalse', { who: who, hazard: t('hl_' + hz.id), act: t('act_' + p.action, { b: p.breakAt }) });
    }
    var out = run.now.map(function (e) {
      if (e.kind === 'restart') {
        var n = e.t - run.log.halt;
        return t(hz.real ? 'cap_restart' : 'cap_restartFalse', { n: n });
      }
      return eventText(e, p);
    }).filter(Boolean);
    // a quiet last minute says only the outcome (the end line), not the state twice
    if (!out.length && !c.last) out.push(quietText(run, p, c.n));
    var text = t('capMinute', { m: c.n }) + (out.length ? ' ' + out.join(' ') : '');
    if (c.last) {
      var lg = run.log;
      var end = lg.accident !== null ? 'endAccident'
        : lg.blame !== null ? 'endBlame'
        : !hz.real ? (lg.halt !== null ? 'endFalse' : lg.clear !== null ? 'endClear' : lg.lost !== null ? 'endLostFalse' : 'endQuiet')
        : lg.halt !== null ? 'endSafe' : 'endFixed';
      text += ' ' + t(end);
    }
    return text;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'hazard', type: 'select', label: t('hazard'), options: L.HAZARDS.map(function (x) { return [x.id, t('h_' + x.id)]; }) },
      { key: 'noticer', type: 'choice', label: t('noticer'), options: L.NOTICERS.map(function (x) { return [x, t('n_' + x)]; }) },
      { key: 'action', type: 'choice', label: t('action'), options: L.ACTIONS.map(function (x) { return [x, t('a_' + x)]; }) },
      { key: 'anyone', type: 'toggle', label: t('anyone') },
      { key: 'breakAt', type: 'range', label: t('breakMin'), min: L.BREAK_MIN, max: L.BREAK_MAX, step: 1 }
    ],

    presets: [
      { id: 'stop', label: t('presetStop'), params: { hazard: 'stand', noticer: 'trainee', action: 'stop', anyone: true }, hint: t('presetStopHint') },
      { id: 'break', label: t('presetBreak'), params: { hazard: 'stand', noticer: 'trainee', action: 'break', anyone: true }, hint: t('presetBreakHint') },
      { id: 'colleague', label: t('presetColleague'), params: { hazard: 'exit', noticer: 'dayplayer', action: 'colleague', anyone: false }, hint: t('presetColleagueHint') },
      { id: 'smoke', label: t('presetSmoke'), params: { hazard: 'smoke', noticer: 'trainee', action: 'stop', anyone: false }, hint: t('presetSmokeHint') },
      { id: 'false', label: t('presetFalse'), params: { hazard: 'smell', noticer: 'dayplayer', action: 'stop', anyone: true }, hint: t('presetFalseHint') }
    ],

    keys: [{ key: 'a', label: t('anyoneKey'), run: function (sim) { sim.set({ anyone: !sim.params.anyone }); } }],

    legend: [
      { shape: 'line', label: t('legendLine') },
      { shape: 'dash', label: t('legendCall') },
      { shape: 'ss-break', label: t('legendBreak') },
      { shape: 'ss-lost', label: t('legendLost') },
      { shape: 'ss-fuse', label: t('legendFuse') }
    ],

    render: function (c) {
      var p = c.params, s = c.state, run = s.runs[L.key(p.action, ruleOf(p))];
      c.stage.replaceChildren(h('div', { class: 'ss' },
        h('div', { class: 'ss-top' }, chart(run, p, c.n, c.first)),
        h('div', { class: 'ss-bottom' }, minuteLine(p, c.n), table(s, p, c.n, c.first)),
        h('p', { class: 'ss-foot' }, t('foot'))));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
