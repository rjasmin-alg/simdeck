<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (URLs, header fields, methods, bodies) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'cr-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text)); }
  /** An origin or URL in a narrow lane card: it may break after "://" and before a path, never inside a name. */
  function url(u) {
    var m = /^([a-z]+:\/\/)([^/]*)(.*)$/.exec(String(u));
    if (!m) return data(u, 'cr-mono cr-url');
    return h('span', { translate: 'no', class: 'cr-mono cr-url' }, m[1], h('wbr'), m[2], m[3] ? [h('wbr'), m[3]] : null);
  }
  function span(x) { return h('span', null, x); }
  /** Append children the way Simdeck.h does (arrays flattened, null skipped); the DOM's append would print them. */
  function put(el) {
    (function add(x) {
      if (x == null || x === false) return;
      if (Array.isArray(x)) x.forEach(add);
      else el.append(x instanceof Node ? x : String(x));
    })(Array.prototype.slice.call(arguments, 1));
    return el;
  }
  /** t.parts, with a placeholder node used twice cloned (appending the same node twice would move it). */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (p) {
      if (typeof p === 'string' || p.nodeType === 3) return p;
      var out = seen.indexOf(p) >= 0 ? p.cloneNode(true) : p;
      seen.push(p);
      return out;
    });
  }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function changedCls(on, c) { return on ? 'sd-changed' + anim(c) : null; }

  /** The step at which each phase of this run happens (1-based), and the phase of step n. */
  function phaseStep(p, phase) { return L.plan(p).phases.indexOf(phase) + 1; }
  function isWrite(m) { return m === 'POST' || m === 'PUT'; }
  function gateOf(s) {
    if (s.kind === 'other' || s.kind === 'same') return s.n >= 1 ? 'none' : 'idle';
    if (s.blocked) return 'closed';
    if (s.check && s.check.ok) return 'open';
    return 'idle';
  }

  // ── the chart (K1) ──

  function rowsOf(c) {
    var s = c.state, p = c.params, rows = [];
    if (s.n < 1) return rows;
    var stepOf = function (ph) { return phaseStep(p, ph); };
    var lastAt = 0;
    function row(r, at) { if (at !== lastAt) r.time = String(at); lastAt = at; r.changed = at === s.n; rows.push(r); return r; }
    var tgt = s.target;
    // (1) classify
    if (s.kind === 'other') row({ kind: 'note', lane: 'O', text: t('clsOther'), k: 'solid' }, 1);
    else {
      row({ from: 'S', to: 'B', label: 'fetch()', c: 1, fields: tgt.method }, 1);
      row({ kind: 'note', lane: 'B', text: t(s.kind === 'same' ? 'noteSame' : s.kind === 'simple' ? 'noteSimple' : 'notePreflight'), k: 'solid' }, 1);
    }
    var msgs = s.messages.slice();
    // (2) preflight
    if (s.preflight) {
      var at = stepOf('preflight'), pq = msgs.shift(), pr = msgs.shift();
      row({ from: 'B', to: 'V', label: pq.method + ' ' + pq.target, c: 4, line: 'dashed' }, at);
      row({ from: 'V', to: 'B', label: pr.code + ' ' + pr.reason, c: 6, line: 'dashed' }, at);
      if (!s.preflight.ok) {
        row({ kind: 'note', lane: 'B', text: t('noteNotSent'), k: 'fill' }, at);
        row({ from: 'B', to: 'S', label: span(t('chipError')), c: 2, re: { S: span(t('reNoBody')) } }, at);
      }
    }
    // (3) the actual request
    if (msgs.length) {
      var ra = stepOf('request'), rq = msgs.shift(), rs = msgs.shift(), who = s.kind === 'other' ? 'O' : 'B';
      row({ from: who, to: 'V', label: rq.method + ' ' + rq.target, c: s.kind === 'other' ? 5 : 4 }, ra);
      row({ from: 'V', to: who, label: rs.code + ' ' + rs.reason, c: 6 }, ra);
      if (s.kind === 'same') row({ from: 'B', to: 'S', label: rs.body, c: 3 }, ra);
    }
    // (4) the check
    if (s.check) {
      var ca = stepOf('check');
      if (s.check.ok) row({ from: 'B', to: 'S', label: s.delivered, c: 3 }, ca);
      else row({ from: 'B', to: 'S', label: span(t('chipError')), c: 2, re: { S: span(t('reNoBody')) } }, ca);
    }
    return rows;
  }

  function renderChart(c) {
    var s = c.state, other = s.client === 'other';
    var lanes = [
      { id: 'S', mark: 'JS', c: 1, shape: 'square', name: t('laneScript'), body: scriptCard(c), state: other ? 'down' : null },
      { id: 'B', mark: '◧', c: 4, shape: 'square', name: t('laneBrowser'), body: browserCard(c), state: other ? 'down' : null },
      { id: 'V', mark: 'API', c: 6, name: t('laneServer'), body: serverCard(c) },
      { id: 'O', mark: '>_', c: 5, shape: 'square', name: t('laneOther'), body: otherCard(c), state: other ? null : 'down' }
    ];
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '3rem',
      lanes: lanes,
      rows: rowsOf(c),
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  function scriptCard(c) {
    var s = c.state;
    if (s.client === 'other') return h('div', { class: 'cr-card' }, h('p', { class: 'cr-muted' }, t('cardNotUsed')), h('p', null, ' '));
    var got = s.delivered !== null && s.client === 'browser' ? data(s.delivered)
      : s.blocked ? [h('span', { class: 'cr-err' }, t('cardError')), h('br'), h('span', { class: 'cr-muted' }, t('cardConsole'))]
      : h('span', { class: 'cr-muted' }, t('cardWaiting'));
    var fresh = c.prev && (c.prev.delivered !== s.delivered || c.prev.blocked !== s.blocked);
    return h('div', { class: 'cr-card' },
      h('p', null, h('span', { class: 'cr-muted' }, t('cardPage'), ' '), url(L.serialize(s.pageOrigin))),
      h('p', { class: changedCls(fresh, c) }, h('span', { class: 'cr-muted' }, t('cardGot'), ' '), got));
  }

  function gateBadge(st) {
    var word = { open: 'gateOpen', closed: 'gateClosed', none: 'gateNone', idle: 'gateIdle' }[st];
    var sym = { open: '✓ ', closed: '✕ ', none: '', idle: '' }[st];
    return h('span', { class: 'cr-gate', dataset: { st: st } }, sym ? h('span', { class: 'cr-sym', 'aria-hidden': 'true' }, sym) : null, t(word));
  }

  function browserCard(c) {
    var s = c.state;
    if (s.client === 'other') return h('div', { class: 'cr-card' }, h('p', { class: 'cr-muted' }, t('cardNotUsed')), h('p', null, ' '));
    var cls = s.kind ? t({ same: 'clsSame', simple: 'clsSimple', preflight: 'clsPreflight' }[s.kind]) : '—';
    var g = gateOf(s), gPrev = c.prev ? gateOf(c.prev) : g;
    return h('div', { class: 'cr-card' },
      h('p', { class: changedCls(s.phase === 'classify', c) }, cls),
      h('p', { class: changedCls(g !== gPrev && g !== 'none', c) }, h('span', { class: 'cr-muted' }, t('gateLabel'), ' '), gateBadge(g)));
  }

  function serverCard(c) {
    var s = c.state, n = s.server.log.length;
    var fresh = c.prev && c.prev.server.log.length !== n;
    return h('div', { class: 'cr-card' },
      h('p', null, url(s.server.origin)),
      h('p', { class: changedCls(fresh, c) }, n ? t.n('srvLog', n) : t('srvLogEmpty')));
  }

  function otherCard(c) {
    var s = c.state;
    if (s.client !== 'other') return h('div', { class: 'cr-card' }, h('p', { class: 'cr-muted' }, t('cardNotUsed')), h('p', null, ' '));
    var fresh = c.prev && c.prev.delivered !== s.delivered;
    return h('div', { class: 'cr-card' },
      h('p', { class: 'cr-muted' }, t('noteOther')),
      h('p', { class: changedCls(fresh, c) }, h('span', { class: 'cr-muted' }, t('cardGotOther'), ' '),
        s.delivered !== null ? data(s.delivered) : h('span', { class: 'cr-muted' }, t('cardWaiting'))));
  }

  // ── right: the origins ──

  function renderOrigins(c) {
    var s = c.state, pg = s.pageOrigin, api = s.apiOrigin, m = s.match;
    var box = h('section', { class: 'cr-box' }, h('h2', null, t('oriTitle')));
    var grid = h('div', { class: 'cr-ori' },
      h('span', { class: 'cr-th' }, t('oriPart')), h('span', { class: 'cr-th' }, t('oriPage')), h('span', { class: 'cr-th' }, t('oriTarget')));
    [['scheme', 'oriScheme'], ['host', 'oriHost'], ['port', 'oriPort']].forEach(function (k) {
      var diff = m ? !m[k[0]] : false;
      grid.append(h('span', { class: 'cr-th' }, t(k[1])),
        h('span', { class: 'cr-v', dataset: { diff: String(diff) }, translate: 'no' }, pg ? String(pg[k[0]]) : '—'),
        h('span', { class: 'cr-v', dataset: { diff: String(diff) }, translate: 'no' }, diff ? h('span', { class: 'cr-ne', 'aria-hidden': 'true' }, '≠') : null, String(api[k[0]])));
    });
    put(box, grid, h('p', { class: 'cr-sm' }, t(!m ? 'oriNoPage' : m.same ? 'oriSame' : 'oriCross')));
    return box;
  }

  // ── right: the exchange as text ──

  function msgLines(m, c, marked) {
    var marks = (marked && m.marks || []).map(function (x) { return x.toLowerCase(); });
    return h('div', { class: 'cr-msg', translate: 'no' },
      h('span', { class: 'cr-line', dataset: { k: 'start' } }, L.startLine(m)),
      m.headers.map(function (f) {
        return h('span', { class: 'cr-line' + (marks.indexOf(f[0].toLowerCase()) >= 0 ? ' sd-changed' + anim(c) : '') }, f[0] + ': ' + f[1]);
      }),
      m.body ? h('span', { class: 'cr-line', dataset: { k: 'body' } }, m.body) : null);
  }

  function verdict(ok, okKey, badKey) {
    return h('p', { class: 'cr-verdict' }, gateBadge(ok ? 'open' : 'closed'), t(ok ? okKey : badKey));
  }

  function renderExchange(c) {
    var s = c.state, box = h('section', { class: 'cr-box cr-xchg' });
    var msgs = s.messages;
    if (s.phase === 'start' || s.phase === 'classify') {
      var tg = s.target, it = L.intent(c.params);
      put(box, h('h2', null, t(s.client === 'other' ? 'laneOther' : 'msgIntent')),
        h('div', { class: 'cr-msg', translate: 'no' },
          h('span', { class: 'cr-line', dataset: { k: 'start' } }, tg.method + ' ' + tg.url),
          tg.contentType ? h('span', { class: 'cr-line' + (s.phase === 'classify' && s.why && s.why.headers.length ? ' sd-changed' + anim(c) : '') }, 'Content-Type: ' + tg.contentType) : null,
          it.body ? h('span', { class: 'cr-line', dataset: { k: 'body' } }, it.body) : null),
        tg.credentials ? h('p', { class: 'cr-sm' }, data("credentials: 'include'"), ' (', t('fetchCredentials'), ')') : null);
      return box;
    }
    var pre = s.phase === 'preflight';
    box.dataset.pre = String(pre);
    var pair = pre ? msgs.slice(0, 2) : msgs.slice(-2);
    put(box, h('h2', null, t(pre ? 'msgPreflight' : 'msgActual')), msgLines(pair[0], c, false), msgLines(pair[1], c, pre || s.phase === 'check'));
    if (pre) put(box, verdict(s.preflight.ok, 'verdictPreOk', 'verdictPreFail'));
    else if (s.phase === 'request' && (s.kind === 'same' || s.kind === 'other')) put(box, h('p', { class: 'cr-verdict' }, gateBadge('none'), t('verdictFree')));
    else if (s.phase === 'check') put(box, verdict(s.check.ok, 'verdictOk', 'verdictBlocked'));
    return box;
  }

  // ── right: the server ──

  function renderServer(c) {
    var s = c.state, srv = s.server;
    var box = h('section', { class: 'cr-box' }, h('h2', null, t('laneServer')));
    var decl = [];
    if (srv.acao !== null) decl.push('Access-Control-Allow-Origin: ' + srv.acao);
    if (srv.acac) decl.push('Access-Control-Allow-Credentials: true');
    decl.push('Access-Control-Allow-Methods: ' + srv.allowMethods.join(', '));
    if (srv.allowHeaders.length) decl.push('Access-Control-Allow-Headers: ' + srv.allowHeaders.join(', '));
    // what it will send, until the first answer is on screen (from then on the exchange shows it)
    if (!s.messages.length) put(box, h('h3', null, t('srvDeclares')),
      srv.acao === null ? h('span', { class: 'cr-line cr-muted' }, t('srvNoAcao')) : null,
      decl.map(function (d) { return h('span', { class: 'cr-line', translate: 'no' }, d); }));
    var before = c.prev ? c.prev.server.log.length : srv.log.length;
    put(box, h('h3', null, t('logTitle')), srv.log.length ? h('ul', { class: 'cr-log' }, srv.log.map(function (l, i) {
      return h('li', { class: changedCls(i >= before, c) },
        data(l.method + ' ' + l.path + ' → ' + l.code), ' ',
        l.origin ? data('Origin: ' + l.origin, 'cr-mono cr-sm') : h('span', { class: 'cr-sm cr-muted' }, t('logNoOrigin')),
        l.write ? h('span', { class: 'cr-tag' }, t('logWrite')) : null);
    })) : h('p', { class: 'cr-sm cr-muted' }, t('logEmpty')));
    return box;
  }

  // ── captions ──

  function partsDiffering(m) {
    return ['scheme', 'host', 'port'].filter(function (k) { return !m[k]; })
      .map(function (k) { return t({ scheme: 'partScheme', host: 'partHost', port: 'partPort' }[k]); }).join(', ');
  }
  function fieldName(s, name) { return name === 'content-type' ? 'Content-Type: ' + s.target.contentType : name; }

  function caption(c) {
    var s = c.state, ev = s.ev, tg = s.target, out = [];
    var page = s.pageOrigin ? L.serialize(s.pageOrigin) : '';
    var last = s.messages[s.messages.length - 1];
    switch (ev.kind) {
      case 'start':
        out = s.client === 'other' ? parts('capStartOther', { req: B(tg.method + ' ' + tg.url) })
          : parts('capStart', { page: B(page), req: B(tg.method + ' ' + tg.url) });
        break;
      case 'classify':
        if (ev.class === 'other') out = [t('capOther')];
        else if (ev.class === 'same') out = parts('capSame', { origin: B(page) });
        else if (ev.class === 'simple') out = parts('capSimple', { parts: partsDiffering(s.match), method: B(tg.method) });
        else {
          var f = ev.headers.length ? B(fieldName(s, ev.headers[0])) : null;
          var reason = ev.method && f ? parts('reasonBoth', { method: B(tg.method), field: f })
            : ev.method ? parts('reasonMethod', { method: B(tg.method) }) : parts('reasonHeader', { field: f });
          out = parts('capPreflight', { parts: partsDiffering(s.match), reason: span(reason) });
        }
        break;
      case 'preflight': {
        var v = { method: B(tg.method), origin: B(page) };
        if (ev.ok) {
          var what = [];
          if (s.why.method) what = what.concat(parts('capPreOkMethod', { method: B(tg.method) }));
          if (s.why.headers.length) what = what.concat(parts('capPreOkHeader', { field: B(s.why.headers.join(', ')) }));
          out = parts('capPreOk', { origin: B(page), what: span(what) });
        } else if (ev.fail === 'method') out = parts('capPreFailMethod', Object.assign(v, { allowed: B(s.server.allowMethods.join(', ')) }));
        else if (ev.fail === 'header') out = parts('capPreFailHeader', Object.assign(v, { field: B(ev.missing) }));
        else out = parts({ 'acao-missing': 'capPreFailAcao', 'acao-star': 'capPreFailStar', 'acac-missing': 'capPreFailAcac',
          'acao-other': 'capPreFailOther', status: 'capPreFailStatus' }[ev.fail], v);
        break;
      }
      case 'request': {
        var code = B(last.code), body = B(last.body);
        if (ev.class === 'same') out = parts('capFreeSame', { code: code, body: body });
        else if (ev.class === 'other') {
          var noAcao = !L.fieldValues(last.headers, 'Access-Control-Allow-Origin').length;
          out = parts(noAcao ? 'capFreeOtherNoAcao' : 'capFreeOther', { code: code, body: body });
        } else out = parts(isWrite(tg.method) ? 'capReqWrite' : 'capReq', { code: code, method: B(tg.method) });
        break;
      }
      case 'check': {
        var b = B(s.delivered || ''), o = B(page);
        if (ev.ok) out = parts(tg.credentials ? 'capOkCred' : s.server.acao === '*' ? 'capOkStar' : 'capOkExact', { body: b, origin: o });
        else if (ev.fail === 'acao-missing') {
          out = [t('capBlockAcao')];
          if (ev.write) out = out.concat(parts('capBlockAcaoWrite', { method: B(tg.method) }));
        } else if (ev.fail === 'acao-star') out = parts('capBlockStar', { origin: o });
        else if (ev.fail === 'acac-missing') out = [t('capBlockAcac')];
        else out = parts('capBlockOther', { acao: B(s.server.acao) });
        break;
      }
      default: out = [];
    }
    return out;
  }

  // ── controls ──

  var M = function (m) { return [m, data(m, '')]; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'outside', type: 'toggle', label: t('outside'), resets: true },
      { key: 'targetOrigin', type: 'choice', label: t('targetOrigin'), resets: true,
        options: [['same', t('tgtSame')], ['host', t('tgtHost')], ['port', t('tgtPort')], ['scheme', t('tgtScheme')]] },
      { key: 'method', type: 'choice', label: t('method'), options: L.METHODS.map(M) },
      { key: 'jsonBody', type: 'toggle', label: t('jsonBody'), visible: function (p) { return p.method !== 'GET'; } },
      { key: 'credentials', type: 'toggle', label: t('credentials'), visible: function (p) { return !p.outside; } },
      { key: 'acao', type: 'choice', label: t('acao'), options: [['none', t('acaoNone')], ['star', data('*', '')], ['exact', t('acaoExact')]] },
      // shown only where they can matter (the panel must fit one screen); the server sends them either way
      { key: 'acac', type: 'toggle', label: t('acac'), visible: function (p) { return !p.outside && p.credentials; } },
      { key: 'allowPut', type: 'toggle', label: t('allowPut'), visible: function (p) { return p.method === 'PUT' || (p.method !== 'GET' && p.jsonBody); } }
    ],

    presets: [
      { id: 'same-origin', label: t('presetSame'), hint: t('presetSameHint'), params: { targetOrigin: 'same' } },
      { id: 'simple-blocked', label: t('presetBlocked'), hint: t('presetBlockedHint'), params: {} },
      { id: 'simple-allowed', label: t('presetAllowed'), hint: t('presetAllowedHint'), params: { acao: 'exact' } },
      { id: 'preflight', label: t('presetPreflight'), hint: t('presetPreflightHint'), params: { method: 'PUT', jsonBody: true, acao: 'exact', allowPut: true } },
      { id: 'credentials-star', label: t('presetStar'), hint: t('presetStarHint'), params: { credentials: true, acao: 'star', acac: true } },
      { id: 'non-browser', label: t('presetOther'), hint: t('presetOtherHint'), params: { outside: true } }
    ],

    legend: [
      { shape: 'line', label: t('legActual') },
      { shape: 'dash', label: t('legPreflight') },
      { shape: 'gate', label: t('legGate') },
      { shape: 'diff', label: t('legDiff') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'cr' },
        h('div', { class: 'cr-col cr-mid' }, chart),
        h('div', { class: 'cr-col' }, renderOrigins(c), renderExchange(c), renderServer(c))));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
