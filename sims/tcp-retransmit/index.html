  // ── the chart (K1) ──

  var RE_B = { lost: 'reLost', held: 'reHeld', discarded: 'reDiscarded', fills: 'reFills', already: 'reAlready' };
  var RE_A = { lost: 'reLost', fast: 'reFast', partial: 'rePartial' };
  var WHY = { rto: 'cRto', fast: 'cFast', partial: 'cPartial' };

  function renderChart(c) {
    var s = c.state, fresh = freshRows(c), ev = s.ev;
    var rows = s.rows.map(function (r, i) {
      if (r.note != null) {
        var note = s.notes[r.note];
        return { kind: 'note', lane: 'A', k: 'solid', text: t('noteRto'), time: msOf(note.at), changed: i >= fresh };
      }
      var m = s.msgs[r.m];
      var changed = i >= fresh || ev.m === r.m;
      var word = m.fate === 'flight' ? t('reFlight') : null;
      var row;
      if (m.k === 'seg') {
        if (!word && RE_B[m.re]) word = t(RE_B[m.re]);
        row = { from: 'A', to: 'B', c: 1, label: range(m.seq, m.seq + m.len),
          line: m.tx > 0 ? 'dashed' : undefined, cause: m.why ? t(WHY[m.why]) : undefined, re: word ? { B: word } : {} };
      } else {
        if (!word && RE_A[m.re]) word = t(RE_A[m.re]);
        row = { from: 'B', to: 'A', c: 2, weight: 'thin', label: 'ACK ' + m.n,
          cause: m.dup ? t('cDup', { k: m.dup }) : undefined, re: word ? { A: word } : {} };
      }

    box.append(rto);

    box.append(h('div', { class: 'tr-meter', dataset: { st: left === null ? 'off' : 'on' }, 'aria-hidden': 'true' }, h('span', { style: { width: pct + '%' } })));

    return box;
  }

  // ── captions ──

  function segOf(m) { return B(range(m.seq, m.seq + m.len)); }
  /** The bytes missing before the first held or discarded range. */
  function gapText(s) {
    var next = s.ooo.length ? s.ooo[0][0] : null;
    s.discarded.forEach(function (r) { if (r[0] >= s.rcvNxt && (next === null || r[0] < next)) next = r[0]; });
    return next === null ? '' : range(s.rcvNxt, next);
  }

  function caption(c) {
    var s = c.state, p = c.params, ev = s.ev, f = s.flow;
    var out;
    switch (ev.kind) {
      case 'start': {
        var v = p.lose, k = v === 'none' ? 0 : Number(v.slice(1));
        // segment K of fewer, or B's K-th ACK with K above the count (one lost ACK leaves B sending exactly count ACKs)
        var lost = v === 'none' || k > f.count ? rich('capLostNone')
          : v[0] === 's' ? rich('capLostSeg', { k: String(k) }) : rich('capLostAck', { k: String(k) });
        if (v[0] === 's' && k <= f.count && p.loseRetx > 0) lost = lost.concat(' ', t.n('capLostRetx', p.loseRetx));
        return rich('capStart', { count: t.n('segCount', f.count, { len: f.len }), first: data(f.start), last: data(L.endOf(f) - 1), lost: h('span', null, lost) });
      }
      case 'window': out = rich('capWindow', { count: t.n('segCount', f.count, { len: f.len }), last: data(ev.last), rto: data(secs(L.RTO0), '') }); break;
      case 'rto': {
        var note = s.notes[ev.note];
        out = rich('capRto', { seg: B(s.sndUna), rto: B(secs(note.next)) });
        // the few duplicates are news only at the first timeout of this segment
        var first = s.segs.filter(function (g) { return g.seq === s.sndUna; })[0].tx === 2;
        if (first && c.prev.dupCount > 0 && c.prev.dupCount < L.DUP_THRESH) out = out.concat(' ', t.n('capRtoFew', c.prev.dupCount));
        if (note.next === note.rto) out = out.concat(' ', rich('capRtoCap', { rto: data(secs(note.next), '') }));
        break;
      }
      case 'lost': {
        var ml = s.msgs[ev.m];
        out = ml.k === 'seg' ? rich('capSegLost', { seg: segOf(ml) }) : rich('capAckLost', { n: B(ml.n) });
        break;
      }
      case 'arrived': {
        var m = s.msgs[ev.m];
        if (m.k === 'seg') {
          var n = B(s.rcvNxt);
          if (m.re === 'inorder') out = rich('capInorder', { seg: segOf(m), n: n });
          else if (m.re === 'held') out = rich('capHeld', { seg: segOf(m), gap: B(gapText(s)), n: n });
          else if (m.re === 'discarded') out = rich('capDiscarded', { seg: segOf(m), gap: B(gapText(s)), n: n });
          else if (m.re === 'fills') out = rich('capFills', { seg: segOf(m), held: B(range(m.seq + m.len, s.rcvNxt)), n: n });
          else out = rich('capAlready', { seg: segOf(m), n: n });
          break;
        }
        var an = B(m.n);
        if (m.re === 'dup') out = m.dup >= L.DUP_THRESH ? rich('capDupMore', { n: an, k: String(m.dup) }) : rich('capDup', { n: an, k: String(m.dup) });
        else if (m.re === 'fast') out = rich('capFast', { n: an });
        else if (m.re === 'partial') out = rich('capPartial', { n: an, end: data(L.endOf(f)) });
        else if (m.re === 'all') out = rich('capAckAll', { n: an });
        else out = rich('capAckNew', { n: an, rto: data(secs(s.rto), '') });
        if (m.re === 'new' || m.re === 'all' || m.re === 'partial') {
          // a cumulative ACK covers an earlier lost one (rule 7)
          var covered = s.msgs.filter(function (x) { return x.k === 'ack' && x.fate === 'lost' && x.n > c.prev.sndUna && x.n <= m.n; });
          if (covered.length) out = out.concat(' ', rich('capAckCovers', { m: B(covered[covered.length - 1].n) }));
          out = out.concat(' ', m.sample === 'karn' ? rich('capKarn') : rich('capSample', { ms: data(m.sample) }));
        }
        break;
      }
      default: out = [];
    }
    if (s.done) out = out.concat(' ', h('b', null, rich('capDone', { t: data(s.t, '') })));
    else if (c.last && s.n > 0) out = out.concat(' ', rich('capTrunc'));
    return out;
  }

  // ── a loss setting changed mid-run: it applies from the next step, the past stays (NOTES.md) ──

  // The kit replays from step 0 on every change. When the user changes what is lost at step n (not a preset, not a
  // reset), the page pins the past: `keep` lists what was already lost by step n, `from` = n, and the new choice acts on
  // later steps only (sim.js isLost). A change that sends the demo to step 0 (data, buffer, RTT) clears both.
  var LOSS = ['lose', 'loseRetx'], OTHER = ['flow', 'bufferOoo', 'rtt'];
  var seen = null, busy = false;
  function pin(c) {
    if (busy) return;
    var p = c.params, before = seen;
    seen = { p: Object.assign({}, p), n: c.n };
    if (!before) return;
    var diff = function (keys) { return keys.some(function (k) { return before.p[k] !== p[k]; }); };
    var at = before.n, patch = null;
    if (diff(OTHER)) {
      if (p.keep || p.from) { patch = { keep: '', from: 0 }; at = 0; }
    } else if (diff(LOSS) && !c.preset && at > 0 && c.n > 0 && p.keep === before.p.keep && p.from === before.p.from) {
      patch = { keep: L.lostBy(before.p, at).join(','), from: at };
    }
    if (!patch) return;
    busy = true;
    window.simdeck.set(patch);
    window.simdeck.go(at);
    busy = false;
    seen = { p: Object.assign({}, window.simdeck.params), n: window.simdeck.n };
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'flow', type: 'choice', label: t('flow'), resets: true, options: [['rto', t('flowRto')], ['fast', t('flowFast')], ['five', t('flowFive')]] },
      { key: 'lose', type: 'select', label: t('lose'), options: L.LOSE.map(function (v) {
          return [v, v === 'none' ? t('loseNone') : t(v[0] === 's' ? 'loseSeg' : 'loseAck', { k: v.slice(1) })];
        }) },
      { key: 'loseRetx', type: 'choice', label: t('loseRetx'), options: [[0, '0'], [1, '1'], [2, '2']] },
      { key: 'bufferOoo', type: 'toggle', label: t('bufferOoo'), resets: true },
      { key: 'rtt', type: 'choice', label: t('rtt'), resets: true, options: [[100, msOf(100)], [300, msOf(300)]] }
    ],

    presets: [
      { id: 'book-rto', label: t('presetRto'), hint: t('presetRtoHint'), params: {} },
      { id: 'book-fast', label: t('presetFast'), hint: t('presetFastHint'), params: { flow: 'fast' } },
      { id: 'ack-lost', label: t('presetAck'), hint: t('presetAckHint'), params: { flow: 'five', lose: 'a2' } },
      { id: 'backoff', label: t('presetBackoff'), hint: t('presetBackoffHint'), params: { loseRetx: 2 } },
      { id: 'no-buffer', label: t('presetNoBuffer'), hint: t('presetNoBufferHint'), params: { flow: 'fast', bufferOoo: false } }
    ],

    legend: [
      { shape: 'line', label: t('legSeg') },
      { shape: 'thin', label: t('legAck') },
      { shape: 'dupb', label: t('legDup') },
      { shape: 'lost', label: t('legLost') },
      { shape: 'dash', label: t('legRetx') },
      { shape: 'timer', label: t('legTimer') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'tr' },
        h('div', { class: 'tr-col' }, renderA(c), renderTimer(c), renderDups(c)),
        h('div', { class: 'tr-col tr-mid' }, chart),
        h('div', { class: 'tr-col' }, renderB(c))));
      chart.fit();
    },

    caption: caption
  });
  window.simdeck.on(pin);
  pin({ params: window.simdeck.params, n: window.simdeck.n });
})();
</script>
</body>
</html>
