<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SEC = { install: 'Installing:', dep: 'Installing dependencies:', remove: 'Removing:', unused: 'Removing unused dependencies:' };

  /** Data (names, capabilities, versions, output lines) never gets translated. */
  function data(text, cls) { return h('span', { class: 'pk-mono' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  function cap(c, now, changed) {
    return h('span', { class: 'pk-cap' + (now ? ' pk-cap-now' : '') + (changed ? ' sd-changed' : ''), translate: 'no' }, c);
  }
  /** t.parts with every plain placeholder value wrapped as data; a node used twice gets its own copy. */
  function parts(key, vars) {
    var out = {};
    Object.keys(vars || {}).forEach(function (k) { out[k] = typeof vars[k] === 'object' ? vars[k] : data(vars[k]); });
    var seen = [];
    return [].concat(t.parts(key, out)).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function list(items) {
    var out = [];
    items.forEach(function (x, i) { if (i) out.push(', '); out.push(data(x)); });
    return h('span', null, out);
  }
  function has(s, key) { return s.changed.indexOf(key) >= 0; }
  function own(p) { return p.provides.filter(function (c) { return c !== p.name; }); }
  function planRow(s, name) { return L.findIn(s.plan, name); }
  /** The summary step has run (the queue may be empty one step before it). */
  function summarised(s) { return s.stage === 'order' || s.stage === 'execute' || s.stage === 'done'; }
  function erasing(s) { return s.request.op === 'remove' && s.stage !== 'done'; }

  // ── left: repositories ──

  function tagLine(p, now) {
    var out = [];
    [['Provides', own(p)], ['Requires', p.requires], ['Conflicts', p.conflicts]].forEach(function (x) {
      if (!x[1].length) return;
      out.push(h('span', { class: 'pk-tagname', translate: 'no' }, x[0]));
      x[1].forEach(function (c) { out.push(cap(c, c === now)); });
    });
    return out.length ? h('div', { class: 'pk-tags' }, out) : null;
  }

  function repoPkg(s, r, p) {
    var last = s.last || {};
    var now = last.cap;
    var cand = (last.cands || []).filter(function (x) { return x.name === p.name && x.repo === r.id; })[0];
    var chosen = has(s, 'repo:' + p.name) && last.kind === 'chosen' && last.repo === r.id;
    var cls = 'pk-pkg';
    if (p.name === s.request.name) cls += ' pk-req';
    if (cand && cand.rejected) cls += ' pk-conflict';
    else if (cand) cls += ' pk-cand';
    if (chosen) cls += ' sd-changed';
    var mark = cand && cand.rejected ? '✗ ' + t('rejected', { pkg: cand.rejected })
      : chosen ? '✓ ' + t('chosenTag') : cand ? t('cand') : null;
    return h('div', { class: cls },
      h('div', { class: 'pk-line' }, data(p.name, 'pk-name'), data(p.ver, 'pk-ver'), mark ? h('span', { class: 'pk-mark' }, mark) : null),
      tagLine(p, now));
  }

  function repos(c) {
    var s = c.state;
    return h('div', { class: 'pk-box' },
      h('h3', null, t('repos')),
      s.repos.map(function (r) {
        return h('div', { class: 'pk-repo' + (r.enabled ? '' : ' pk-repo-off sd-hatch') },
          h('h3', null, data(r.id), h('span', { class: 'pk-small pk-muted' }, parts('prio', { key: 'priority', n: r.priority })),
            h('span', { class: 'pk-meta' + (has(s, 'meta:' + r.id) ? ' sd-changed' : '') }, t('meta_' + r.meta))),
          r.pkgs.map(function (p) { return repoPkg(s, r, p); }));
      }));
  }

  // ── middle: the resolver ──

  function byLabel(by) { return by === null ? t('byReq') : data(by); }

  function actionBox(s) {
    var a = s.last;
    if (!a) return h('div', { class: 'pk-act' }, h('span', { class: 'pk-muted' }, t('idle')));
    var head = null, res = [];
    if (a.cap) head = h('div', null, cap(a.cap, true, true), ' ', h('span', { class: 'pk-by' }, '← ', byLabel(a.by)));
    var k = a.kind;
    if (k === 'chosen' || k === 'conflict') {
      a.cands.forEach(function (x) {
        var chosen = k === 'chosen' && x.name === a.pkg;
        res.push(h('span', null, data(x.name + ' (' + x.repo + ')'), ' ',
          x.rejected ? h('span', { class: 'pk-bad' }, '✗ ' + t('rejected', { pkg: x.rejected }))
            : chosen ? h('span', { class: 'pk-ok' }, '✓ ' + t('chosenTag')) : null));
      });
      if (a.key) res.push(h('span', { class: 'pk-muted' }, t('decided', { key: t('key_' + a.key) })));
    }
    else if (k === 'installed') res.push(h('span', null, h('span', { class: 'pk-ok' }, '✓ '), parts('satisfiedBy', { pkg: a.pkg })));
    else if (k === 'planned') res.push(h('span', null, h('span', { class: 'pk-ok' }, '✓ '), parts('satisfiedPlan', { pkg: a.pkg })));
    else if (k === 'nomatch' || k === 'nothing' || k === 'notinstalled') res.push(h('span', { class: 'pk-bad' }, '✗ ' + t('noProvider')));
    else if (k === 'remove' || k === 'unused' || k === 'keptUser' || k === 'going') res.push(h('span', null, data(a.pkg), ': ', t('act_' + k)));
    else if (k === 'keptNeeded') res.push(h('span', null, data(a.pkg), ': ', parts('act_keptNeeded', { pkg: a.needer })));
    else if (k === 'none') res.push(h('span', { class: 'pk-muted' }, '–'));
    else res.push(h('span', null, t('act_' + k)));
    return h('div', { class: 'pk-act' }, head, h('div', { class: 'pk-act-res' }, res));
  }

  /** The package manager's output lines after the table: summary, order, completion, or the problem. */
  function outLines(s) {
    var lines = [];
    function line(text, cls, changed) { lines.push(h('li', { class: (cls || '') + (changed ? ' sd-changed' : ''), translate: 'no' }, text)); }
    var p = s.problem;
    if (p) {
      var ch = has(s, 'problem');
      if (p.kind === 'nomatch') { line('No match for argument: ' + p.cap, 'pk-problem', ch); line('Error: Unable to find a match: ' + p.cap, 'pk-problem', ch); }
      else if (p.kind === 'notinstalled') { line('No match for argument: ' + p.cap, 'pk-problem', ch); line('No packages marked for removal.', 'pk-problem', ch); }
      else if (p.kind === 'nothing') { line('Error:', 'pk-problem', ch); line(' Problem: conflicting requests', 'pk-problem', ch); line('  - nothing provides ' + p.cap + ' needed by ' + p.by, 'pk-problem', ch); }
      else {
        line('Error:', 'pk-problem', ch);
        // the format of a real run (a container, 2026-11-12): '- package X-v from baseos conflicts with Y provided by Y-v from @System'
        line(p.withInstalled ? ' Problem: problem with installed package ' + p.with + '-' + p.withVer : ' Problem: conflicting requests', 'pk-problem', ch);
        line('  - package ' + p.pkg + '-' + p.ver + ' from ' + p.repo + ' conflicts with ' + p.with + ' provided by ' + p.with + '-' + p.withVer +
          ' from ' + p.withRepo, 'pk-problem', ch);
        line('(try to add \'--allowerasing\' to command line to replace conflicting packages)', 'pk-muted', ch);
      }
      return lines;
    }
    if (!summarised(s)) return lines;
    if (!s.plan.length) { line('Nothing to do.', 'pk-strong', has(s, 'summary')); line('Complete!'); return lines; }
    var sum = L.summary(s);
    line('Transaction Summary', 'pk-strong', has(s, 'summary'));
    line((sum.op === 'install' ? 'Install  ' : 'Remove  ') + sum.n + (sum.n === 1 ? ' Package' : ' Packages'), '', has(s, 'summary'));
    if (s.order) {
      var verb = s.request.op === 'install' ? '  Installing : ' : '  Erasing    : ';
      var ran = s.stage === 'done';
      s.order.forEach(function (name, i) {
        line((ran ? '✓' : ' ') + verb + name + '  ' + (i + 1) + '/' + s.order.length, '', has(s, 'order') || has(s, 'execute'));
      });
      if (ran) line('Complete!', 'pk-strong', has(s, 'execute'));
    }
    return lines;
  }

  function planTable(s) {
    if (!s.plan.length && s.problem) return null;
    if (!s.plan.length && !summarised(s)) return h('p', { class: 'pk-small pk-muted' }, t('planEmpty'));
    var rows = [];
    if (summarised(s) && !s.problem) rows.push(h('tr', null, h('td', { colspan: 3 }, 'Dependencies resolved.')));
    if (s.plan.length) rows.push(h('tr', { class: 'pk-hd' }, h('td', null, 'Package'), h('td', null, 'Version'), h('td', null, 'Repository')));
    ['install', 'dep', 'remove', 'unused'].forEach(function (sec) {
      var mine = s.plan.filter(function (r) { return r.section === sec; });
      if (!mine.length) return;
      rows.push(h('tr', { class: 'pk-sec' }, h('td', { colspan: 3 }, SEC[sec])));
      mine.forEach(function (r) {
        var cls = 'pk-row' + (sec === 'install' || sec === 'remove' ? ' pk-row-req' : '') +
          (s.request.op === 'remove' ? ' pk-row-erase' : '') + (has(s, 'plan:' + r.name) ? ' sd-changed' : '');
        rows.push(h('tr', { class: cls }, h('td', null, r.name), h('td', null, r.ver), h('td', null, r.repo)));
      });
    });
    return h('table', { class: 'pk-plan', translate: 'no' }, h('tbody', null, rows));
  }

  function middle(c) {
    var s = c.state;
    var cmd = 'dnf ' + s.request.op + ' ' + s.request.name;
    return h('div', { class: 'pk-box pk-mid' },
      h('h3', null, t('resolver')),
      h('div', { class: 'pk-cmd', translate: 'no' }, h('span', { class: 'pk-muted' }, '$ sudo '), cmd),
      h('h4', null, t('workList')),
      s.queue.length ? h('ul', { class: 'pk-queue' }, s.queue.map(function (q, i) {
        return h('li', { class: i === 0 ? 'pk-next' : '' }, cap(q.cap), h('span', { class: 'pk-by' }, '← ', byLabel(q.by)));
      })) : h('p', { class: 'pk-small pk-muted' }, t('workEmpty')),
      h('h4', null, t('action')),
      actionBox(s),
      h('h4', null, t('plan')),
      planTable(s),
      h('ul', { class: 'pk-out' }, outLines(s)));
  }

  // ── right: installed ──

  function installed(c) {
    var s = c.state, a = s.last || {};
    var going = erasing(s) ? s.plan.map(function (r) { return r.name; }) : [];
    return h('div', { class: 'pk-box' },
      h('h3', null, t('installed')),
      h('ul', { class: 'pk-inst' }, s.installed.map(function (p) {
        var cls = 'pk-irow';
        var mark = null;
        if (going.indexOf(p.name) >= 0) cls += ' pk-erase';
        if (s.problem && s.problem.with === p.name && s.problem.withInstalled) { cls += ' pk-conflict'; mark = '✗'; }
        if (a.kind === 'installed' && a.pkg === p.name) mark = '✓';
        if (a.kind === 'keptNeeded' && (a.pkg === p.name || a.needer === p.name)) mark = '✓';
        if (a.kind === 'keptUser' && a.pkg === p.name) mark = '✓';
        if (has(s, 'inst:' + p.name)) cls += ' sd-changed';
        return h('li', { class: cls },
          data(p.name, 'pk-name'), h('span', { class: 'pk-from', translate: 'no' }, '@' + p.from),
          h('span', { class: 'pk-reason pk-reason-' + p.reason, title: t('reasonHint_' + p.reason) }, t('reason_' + p.reason)),
          mark ? h('span', { class: 'pk-mark' }, mark) : null,
          own(p).length ? h('div', { class: 'pk-tags' }, own(p).map(function (x) { return cap(x, x === a.cap); })) : null);
      })));
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'pk' }, repos(c), middle(c), installed(c)));
  }

  // ── captions ──

  function reqsOf(s, name) {
    var r = L.findIn(s.plan, name);
    if (!r) return [];
    var p = r.repo.charAt(0) === '@' ? L.findIn(s.installed, name)
      : L.findIn(s.repos.filter(function (x) { return x.id === r.repo; })[0].pkgs, name);
    return p ? p.requires : [];
  }
  function thenReqs(s, name) {
    var reqs = reqsOf(s, name);
    return reqs.length ? parts('thenReqs', { reqs: list(reqs) }) : [t('thenNoReqs')];
  }

  function caption(c) {
    var s = c.state, a = s.last, q = s.request;
    if (!a) return parts(q.op === 'install' ? 'capStart_install' : 'capStart_remove', { name: q.name });
    var k = a.kind, out;
    var cnt = function (n) { return h('span', null, t.n('pkgs', n)); };
    if (k === 'chosen') {
      var row = planRow(s, a.pkg);
      if (a.by === null) out = parts('cap_chosen', { pkg: a.pkg, repo: a.repo, cap: a.cap });
      else {
        var byRepo = planRow(s, a.by).repo;
        out = byRepo !== a.repo ? parts('cap_chosenCross', { by: a.by, cap: a.cap, byRepo: byRepo, pkg: a.pkg, repo: a.repo })
          : parts('cap_chosenDep', { by: a.by, cap: a.cap, pkg: a.pkg, repo: a.repo });
      }
      out = out.concat(' ', thenReqs(s, row.name));
      if (a.key) out = out.concat(' ', t('keyNote', { key: t('key_' + a.key) }));
      var fresh = s.repos.filter(function (r) { return has(s, 'meta:' + r.id); })[0];
      if (fresh) out = parts('metaNote', { repo: fresh.id }).concat(' ', out);
      return out;
    }
    if (k === 'installed' && a.by === null) return parts('cap_installedReq', { pkg: a.pkg });
    if (k === 'installed' || k === 'planned') return parts('cap_' + k, { by: a.by, cap: a.cap, pkg: a.pkg });
    if (k === 'nomatch') {
      out = parts('cap_nomatch', { cap: a.cap, msg: 'No match for argument: ' + a.cap });
      s.repos.forEach(function (r) {
        if (r.enabled) return;
        var p = L.providers(r.pkgs, a.cap)[0];
        if (p) out = out.concat(' ', parts('offNote', { pkg: p.name, repo: r.id }));
      });
      return out;
    }
    if (k === 'nothing') return parts('cap_nothing', { by: a.by, cap: a.cap });
    if (k === 'conflict') {
      out = parts(a.cands.length > 1 ? 'cap_conflictAll' : 'cap_conflict', { pkg: a.pkg, cap: a.cap, with: a.with, where: h('span', null, t(s.problem.withInstalled ? 'whereInstalled' : 'wherePlanned')) });
      var mine = L.PKGS[a.pkg], theirs = L.PKGS[a.with];
      var shared = mine && theirs ? own(mine).filter(function (x) { return theirs.provides.indexOf(x) >= 0; }) : [];
      if (shared.length) out = out.concat(' ', parts('sharedNote', { shared: list(shared) }));
      return out;
    }
    if (k === 'remove') {
      var rq = reqsOf(s, a.pkg);
      return rq.length ? parts('cap_remove', { pkg: a.pkg, reqs: list(rq) }) : parts('cap_removeNoReq', { pkg: a.pkg });
    }
    if (k === 'unused') return parts('cap_unused', { pkg: a.pkg, cap: a.cap }).concat(' ', thenReqs(s, a.pkg));
    if (k === 'keptNeeded') return parts('cap_keptNeeded', { pkg: a.pkg, cap: a.cap, needer: a.needer });
    if (k === 'keptUser' || k === 'going' || k === 'none' || k === 'notinstalled') return parts('cap_' + k, { pkg: a.pkg || '', cap: a.cap });
    if (k === 'aborted') {
      out = [t('cap_aborted')];
      if (s.problem && s.problem.kind === 'conflict') out = out.concat(' ', parts('abortedConflict', { pkg: s.problem.pkg, with: s.problem.with }));
      return out;
    }
    var sum = L.summary(s);
    var main = s.plan.filter(function (r) { return r.section === 'install' || r.section === 'remove'; })[0];
    if (k === 'summary') {
      if (!s.plan.length) return [t('cap_nothingToDo')];
      if (q.op === 'install') return sum.n === 1 ? parts('cap_summaryInstallOne', { name: main.name }) : parts('cap_summaryInstall', { count: cnt(sum.n), deps: String(sum.deps) });
      return sum.n === 1 ? parts('cap_summaryRemoveOne', { name: main.name }) : parts('cap_summaryRemove', { count: cnt(sum.n), deps: String(sum.deps) });
    }
    if (k === 'order') {
      if (s.order.length === 1) return parts('cap_orderOne', { name: s.order[0] });
      return parts(q.op === 'install' ? 'cap_orderInstall' : 'cap_orderRemove', { first: s.order[0], last: s.order[s.order.length - 1] });
    }
    // execute
    if (q.op === 'install') return sum.n === 1 ? parts('cap_executeInstallOne', { name: main.name }) : parts('cap_executeInstall', { count: cnt(sum.n), name: main.name });
    if (sum.n > 1) return parts('cap_executeRemove', { count: h('span', null, t.n('removedCount', sum.n)) });
    out = parts('cap_executeRemoveOne', { name: main.name });
    var kept = s.resolved.filter(function (r) { return r.kind === 'keptNeeded'; })[0];
    if (kept) {
      var needer = null;
      s.installed.forEach(function (p) { if (!needer && p.name !== kept.pkg && p.requires.indexOf(kept.cap) >= 0) needer = p.name; });
      var kp = L.findIn(s.installed, kept.pkg);
      var kreqs = [];
      (kp ? kp.requires : []).forEach(function (c) { L.providers(s.installed, c).forEach(function (q) { if (kreqs.indexOf(q.name) < 0) kreqs.push(q.name); }); });
      out = out.concat(' ', parts(kreqs.length ? 'keptNote' : 'keptNoteBare', { kept: kept.pkg, needer: needer || '', reqs: list(kreqs) }));
    }
    return out;
  }

  // ── mount ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'request', type: 'choice', label: t('request'), resets: true, options: L.REQUEST_IDS.map(function (x) { return [x, t('req_' + x)]; }) },
      { key: 'epel', type: 'toggle', label: t('epel') },
      { key: 'keepLibs', type: 'toggle', label: t('keepLibs'), visible: function (p) { return /htop$/.test(p.request); } }
    ],

    presets: L.PRESETS.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), params: x.params, hint: t('preset_' + x.id + '_hint') };
    }),

    legend: [
      { shape: 'pk-req', label: t('legRequested') },
      { shape: 'pk-dep', label: t('legDep') },
      { shape: 'pk-cap', label: t('legCap') },
      { shape: 'pk-ok', label: t('legSatisfied') },
      { shape: 'pk-conflict', label: t('legConflict') },
      { shape: 'pk-inst', label: t('legInstalled') },
      { shape: 'pk-erase', label: t('legErased') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
