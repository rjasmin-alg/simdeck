<!-- ipsec-ike: two IPsec peers bring up IKEv2 (IKE_SA_INIT with Diffie–Hellman, IKE_AUTH with the first Child SA and its

     sender's SPD as kit view K4 (rule table, kit/ruletable.js, most specific wins) and the packet view: the original
     packet and the same packet wrapped by ESP, in columns, so the header added (tunnel) or kept (transport) lines up.

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { HA: '3', GA: '1', GB: '2', HB: '4' };
  var DH = L.DH;
  var SUP = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };

  /** Data (addresses, SPIs, message and payload names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'ik-mono' : cls || null }, String(text)); }
  function has(s, id) { return s.changed.indexOf(id) >= 0; }
  function chg(on) { return on ? ' sd-changed' : ''; }
  function sup(n) { return String(n).split('').map(function (d) { return SUP[d]; }).join(''); }
  function formula(base, e, val) { return data(base + sup(e) + ' mod ' + DH.p + ' = ' + val); }
  function laneName(s, lane) {
    if (lane === 'HA') return t('laneHostA');
    if (lane === 'HB') return t('laneHostB');
    if (s.mode === 'transport') return t(lane === 'GA' ? 'laneRouterA' : 'laneRouterB');
    return t(lane === 'GA' ? 'gwA' : 'gwB');
  }
  /** After "kod" (at) Croatian takes the genitive: "kod računala A"; the gateways' names do not change. */
  function laneGen(s, lane) { return lane === 'HA' ? t('genHostA') : lane === 'HB' ? t('genHostB') : laneName(s, lane); }
  function peerOf(s, lane) { return lane === s.peers.A ? 'A' : lane === s.peers.B ? 'B' : null; }

  // ── lane cards ──
  function spiChip(s, sa) {
    return h('span', { class: 'ik-spi' + chg(has(s, 'sa.' + sa.spi)), dataset: { state: sa.state }, translate: 'no' }, sa.spi);
  }
  function card(s, lane) {
    var who = peerOf(s, lane);
    var addr = h('div', { class: 'ik-addr' }, h('span', { class: 'ik-muted' }, t('kAddr')), data(L.laneAddr(s.mode, lane)));
    if (!who) return h('div', { class: 'ik-card' }, addr, h('div', { class: 'ik-plain' }, t(lane === 'HA' || lane === 'HB' ? 'plainHost' : 'plainRouter')));
    var ike = s.ikeSA;
    var ikeText = ike.state === 'none' ? h('span', { class: 'ik-none' }, t('ikeNone'))
      : ike.state === 'keyed' ? h('span', null, t('ikeKeyed'))
      : h('span', null, '✓ ', t(ike.authMethod === 'cert' ? 'authCert' : 'authPsk'));
    var outs = s.childSAs.filter(function (x) { return x.from === who; });
    var ins = s.childSAs.filter(function (x) { return x.to === who; });
    function line(label, list) {
      return h('div', { class: 'ik-line' }, h('span', { class: 'ik-muted' }, t(label)),
        list.length ? list.map(function (x) { return spiChip(s, x); }) : h('span', { class: 'ik-none' }, t('none')));
    }
    return h('div', { class: 'ik-card' }, addr,
      h('div', { class: 'ik-box' + chg(has(s, 'ikeSA')), dataset: { k: 'ike' } }, h('b', null, t('kIke')), ikeText),
      h('div', { class: 'ik-box' + chg(has(s, 'childSAs') && s.phase === 'auth'), dataset: { k: 'esp' } }, line('kOut', outs), line('kIn', ins)));
  }

  // ── chart rows ──
  function noteText(r, s) {
    switch (r.what) {
      case 'born': return h('span', null, t('noteBorn'), ' → ', data(r.dst));
      case 'match':
        var act = t(r.action === 'protect' ? 'actProtect' : r.action === 'discard' ? 'actDiscard' : 'actBypass');
        return h('span', null, t.parts('noteMatch', { act: act }), r.sa ? [' → ', data(r.sa)] : null);
      case 'decrypted': return t('noteDecrypted');
      case 'noSA': return t('noteNoSA');
      case 'authFail': return t('noteAuthFail');
      case 'tsFail': return t('noteTsFail');
      case 'delivered': return t('noteDelivered');
      case 'discarded': return t('noteDiscarded');
      case 'bypassed': return t('noteBypassed');
      case 'lifetime': return t('noteLifetime');
      case 'soft': return t('noteSoft');
    }
    return '';
  }
  function chart(c) {
    var s = c.state, shown = {};
    var rows = s.rows.map(function (r) {
      var changed = r.step === c.n;
      var time = shown[r.step] ? null : String(r.step);
      shown[r.step] = true;
      if (r.kind === 'note') {
        var bad = ['discarded', 'noSA', 'authFail', 'tsFail'].indexOf(r.what) >= 0;
        var good = ['decrypted', 'delivered'].indexOf(r.what) >= 0;
        return { kind: 'note', lane: r.lane, text: noteText(r, s), k: bad ? 'fill' : good ? 'solid' : null, time: time, changed: changed };
      }
      var fields = null, re = {};
      if (r.ke != null) fields = (r.from === s.peers.A ? 'KEi ' : 'KEr ') + r.ke;
      else if (r.esp) fields = 'SPI ' + r.spi + ' · seq ' + r.seq;
      else if (r.del) fields = 'D ' + r.del;
      else if (r.plain) fields = r.src + ' → ' + r.dst;
      return { from: r.from, to: r.to, label: r.msg, c: COLOUR[r.from], fields: fields, lock: !!r.lock,
        line: r.plain ? 'dashed' : null, re: re, place: s.mode === 'transport' && (r.ike || r.esp) ? 'mid' : null, time: time, changed: changed };
    });
    return Simdeck.sequence({
      dir: c.dir,
      lanes: L.LANES.map(function (lane) {
        var peer = peerOf(s, lane);
        return { id: lane, mark: null, c: COLOUR[lane], shape: lane === 'HA' || lane === 'HB' ? 'square' : null,
          name: laneName(s, lane), tags: peer ? h('span', { class: 'ik-muted' }, t('tagPeer')) : null, body: card(s, lane) };
      }),
      rows: rows,
      timeWidth: '2.2rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── SPD (K4, most specific) ──
  function actWord(a) { return t(a === 'protect' ? 'actProtect' : a === 'discard' ? 'actDiscard' : 'actBypass'); }
  function spdTable(c) {
    var s = c.state, lk = s.lookup;
    var rows = s.spd.map(function (e, i) {
      var action = actWord(e.action);
      return { no: i + 1, cells: { dst: e.dst }, action: action, rank: Number(e.dst.split('/')[1]) * 100 + Number(e.src.split('/')[1]),
        hit: lk ? lk.hits[i] : null };
    });
    var who = laneGen(s, s.peers.A);
    return Simdeck.ruleTable({
      dir: c.dir,
      mode: 'specific',
      title: h('span', { class: 'ik-hl' + chg(has(s, 'spd')) }, t.parts('spdTitle', { who: who, src: data(s.spd[0].src) })),
      columns: [{ key: 'dst', label: t('colDst') }],
      actionLabel: t('colAction'),
      markLabel: lk ? data('→ ' + lk.dst) : t('markIdle'),
      rows: rows,
      implicit: { text: t('implicitAny'), action: actWord('bypass') },
      at: lk ? 'all' : -1,
      done: !!lk,
      outcome: function (i) {
        var a = i >= s.spd.length ? 'bypass' : s.spd[i].action;
        if (a === 'protect') return h('span', { class: 'sd-rt-verdict', dataset: { ok: 'true' } }, '✓ ', t.parts('outProtect', { spi: data(lk.sa || '–') }));
        return Simdeck.ruleTable.verdict(a === 'bypass', t(a === 'discard' ? 'outDiscard' : 'outBypass'));
      },
      words: { win: t('wWin'), beaten: t('wBeaten') },
      changed: false
    });
  }

  // ── packet view ──
  function blk(k, name, val, opts) {
    opts = opts || {};
    return h('div', { class: 'ik-blk' + (opts.enc ? ' ik-enc' : '') + chg(opts.changed), dataset: { k: k }, style: opts.col ? { gridColumn: String(opts.col) } : null },
      h('b', { translate: 'no' }, name), val == null ? null : [].concat(val).map(function (v) { return h('span', null, v); }));
  }
  function ipVal(src, dst) { return [data(src, ''), data('→ ' + dst, '')]; }
  /** The original packet and the ESP packet in one grid of columns: tunnel 7 parts, transport 6. */
  function espGrid(s, p, showOriginal, showWire) {
    var tunnel = p.mode === 'tunnel' || (p.kind === 'plain' && s.mode === 'tunnel');
    var C = tunnel
      ? { outer: 2, esp: 3, ip: 4, tcp: 5, data: 6, trailer: 7, icv: 8, n: 8 }
      : { outer: 2, esp: 3, ip: 2, tcp: 4, data: 5, trailer: 6, icv: 7, n: 7 };
    var cols = 'repeat(' + C.n + ', auto)';
    var items = [], r = 1;
    var wireChanged = has(s, 'packet') && p.kind === 'esp';
    function at(el, row) { el.style.gridRow = String(row); return el; }
    if (showOriginal) {
      items.push(at(h('div', { class: 'ik-rowlabel', style: { gridColumn: '1' } }, t(p.delivered && p.kind === 'esp' ? 'pkDelivered' : 'pkOriginal')), r));
      items.push(at(blk('ip', 'IP', ipVal(p.innerSrc, p.innerDst), { col: C.ip }), r));
      items.push(at(blk('tcp', 'TCP', null, { col: C.tcp }), r));
      items.push(at(blk('data', '…', t('pkData'), { col: C.data }), r));
      r++;
    }
    if (showWire) {
      items.push(at(h('div', { class: 'ik-rowlabel', style: { gridColumn: '1' } }, t('pkWire')), r));
      items.push(at(blk('outer', 'IP · 50', ipVal(p.outerSrc, p.outerDst), { col: C.outer, changed: wireChanged }), r));
      items.push(at(blk('esp', 'ESP', [data('SPI ' + p.spi, ''), data('seq ' + p.seq, '')], { col: C.esp, changed: wireChanged }), r));
      if (tunnel) items.push(at(blk('ip', 'IP', ipVal(p.innerSrc, p.innerDst), { col: C.ip, enc: true }), r));
      items.push(at(blk('tcp', 'TCP', null, { col: C.tcp, enc: true }), r));
      items.push(at(blk('data', '…', t('pkData'), { col: C.data, enc: true }), r));
      items.push(at(blk('trailer', t('pkTrailer'), t('pkNext', { n: p.next }), { col: C.trailer, enc: true }), r));
      items.push(at(blk('icv', 'ICV', null, { col: C.icv }), r));
      r++;
      var encFrom = tunnel ? C.ip : C.tcp;
      items.push(at(h('div', { class: 'ik-br', dataset: { k: 'enc' }, style: { gridColumn: encFrom + ' / ' + C.icv } }, t('pkEncrypted')), r++));
      items.push(at(h('div', { class: 'ik-br', dataset: { k: 'auth' }, style: { gridColumn: C.esp + ' / ' + C.icv } }, t('pkAuthenticated')), r++));
    }
    return h('div', { class: 'ik-grid', style: { gridTemplateColumns: cols } }, items);
  }
  function ikeStrip(s, m) {
    var src = L.ADDR[s.peers[m.from]], dst = L.ADDR[s.peers[m.to]];
    var parts = [blk('outer', 'IP', ipVal(src, dst)), blk('udp', 'UDP', data(String(m.port), '')), blk('hdr', m.exchange, null)];
    m.clear.forEach(function (pl) {
      var v = pl === 'KEi' || pl === 'KEr' ? formula(DH.g, pl === 'KEi' ? DH.a : DH.b, m.ke) : null;
      parts.push(blk('pl', pl, v));
    });
    if (m.sk.length) {
      parts.push(h('div', { class: 'ik-sk ik-enc' }, h('b', { translate: 'no' }, 'SK {'),
        m.sk.map(function (pl) {
          var text = pl === 'D' && m.del ? 'D ' + m.del : pl === 'N(REKEY_SA)' && m.rekeys ? pl + ' ' + m.rekeys : pl;
          return h('span', { class: 'ik-pl', translate: 'no' }, text);
        }),
        h('b', { translate: 'no' }, '}')));
    }
    return h('div', { class: 'ik-strip' }, parts);
  }
  function packet(c) {
    var s = c.state, p = s.packet, body = [];
    if (s.ike.length) {
      body.push(h('div', { class: 'ik-iketab' },
        h('span', { class: 'ik-rowlabel' }, t('pkRequest')), ikeStrip(s, s.ike[0]),
        h('span', { class: 'ik-rowlabel' }, t('pkResponse')), ikeStrip(s, s.ike[1])));
      if (s.ike[0].sk.length) body.push(h('p', { class: 'ik-verdict ik-muted' }, h('span', { class: 'ik-sk ik-enc', style: { display: 'inline-flex' } }, 'SK'), ' ', t('pkSk')));
      else body.push(h('p', { class: 'ik-verdict ik-muted' }, t('pkDhBoth'), ': ', formula(s.ikeSA.dh.KEr, DH.a, s.ikeSA.dh.sA), ' · ', formula(s.ikeSA.dh.KEi, DH.b, s.ikeSA.dh.sB)));
    } else if (!p) {
      body.push(h('p', { class: 'ik-muted', style: { margin: 0 } }, t('pkNone')));
    } else if (p.kind === 'plain') {
      body.push(espGrid(s, p, true, false));
      if (s.lookup && s.lookup.action === 'protect') body.push(h('p', { class: 'ik-verdict', dataset: { ok: 'true' } }, t.parts('pkVerdictProtect', { spi: data(s.lookup.sa) })));
      if (p.dropped) body.push(h('p', { class: 'ik-verdict', dataset: { ok: 'false' } }, t.parts('pkVerdictDiscard', { who: laneGen(s, s.peers.A) })));
    } else {
      var phase = s.phase;
      var showOrig = phase !== 'receive';
      body.push(espGrid(s, p, showOrig, true));
      if (phase === 'receive' && s.check) body.push(h('p', { class: 'ik-verdict', dataset: { ok: String(!!s.check.authOk) } }, t.parts('pkVerdictRecv', { spi: data(p.spi) })));
      if ((phase === 'deliver' || phase === 'reply') && p.delivered) body.push(h('p', { class: 'ik-verdict', dataset: { ok: 'true' } }, t.parts('pkVerdictDeliver', { dst: data(p.innerDst) })));
    }
    var title = s.ike.length || !p ? t('pkTitle') : t(s.mode === 'tunnel' ? 'pkTitleTunnel' : 'pkTitleTransport');
    return h('section', { class: 'ik-pk' }, h('h2', null, h('span', { class: 'ik-hl' + chg(has(s, 'packet') || has(s, 'ike')) }, title)), body);
  }

  function render(c) {
    var ch = chart(c);
    c.stage.replaceChildren(h('div', { class: 'ik' }, ch, h('div', { class: 'ik-bottom' }, spdTable(c), packet(c))));
    ch.fit();
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = s.packet, q = L.norm(c.params);
    var tunnel = s.mode === 'tunnel';
    var who = laneName(s, s.peers.A), whoB = laneName(s, s.peers.B);
    var ts = s.selectors || L.selectorsFor(s.mode);
    switch (s.phase) {
      case 'start':
        if (q.action === 'bring-up') return t(tunnel ? 'capStartTunnel' : 'capStartTransport');
        return t(tunnel ? 'capStartUp' : 'capStartUpTransport');
      case 'init':
        var dh = s.ikeSA.dh;
        return t.parts('capInit', { peers: h('span', null, t.parts(tunnel ? 'peersTunnel' : 'peersTransport', tunnel ? { a: data('GW-A'), b: data('GW-B') } : { a: data(L.ADDR.HA), b: data(L.ADDR.HB) })),
          kei: formula(DH.g, DH.a, dh.KEi), ker: formula(DH.g, DH.b, dh.KEr), s: data(dh.sA) });
      case 'auth': return t.parts('capAuth', { how: t(q.auth === 'cert' ? 'howCert' : 'howPsk'), tsi: data(ts.local), tsr: data(ts.remote) });
      case 'send': return t.parts(tunnel ? 'capSendTunnel' : 'capSendTransport', { dst: data(p.innerDst) });
      case 'match':
        if (s.lookup.action === 'protect') return t.parts('capMatchProtect', { who: who, dst: data(p.innerDst), tsr: data(ts.remote), spi: data(s.lookup.sa) });
        return t.parts('capMatchDiscard', { who: who, dst: data(p.innerDst), tsr: data(ts.remote) });
      case 'policy': return t.parts('capPolicy', { who: laneGen(s, s.peers.A) });
      case 'wrap': return t.parts(tunnel ? 'capWrapTunnel' : 'capWrapTransport', { spi: data(p.spi), seq: data(p.seq), src: data(p.outerSrc), dst: data(p.outerDst) });
      case 'receive': return t.parts('capReceive', { who: whoB, spi: data(p.spi) });
      case 'deliver': return t.parts(tunnel ? 'capDeliverTunnel' : 'capDeliverTransport', { tsi: data(ts.local), tsr: data(ts.remote), dst: data(p.innerDst) });
      case 'lifetime': return t('capLifetime');
      case 'traffic': return t.parts('capTraffic', { spi: data(p.spi), seq: data(p.seq) });
      case 'soft': return t.parts('capSoft', { who: who });
      case 'ccs': return t.parts('capCcs', { b: data(L.SPI[2].B), a: data(L.SPI[2].A) });
      case 'moved': return t.parts('capMoved', { spi: data(p.spi), seq: data(p.seq) });
      case 'delete': return t.parts('capDelete', { a: data(L.SPI[1].A), b: data(L.SPI[1].B) });
      case 'reply': return t.parts('capReply', { who: whoB, spi: data(p.spi) });
    }
    return '';
  }

  var notRekey = function (p) { return p.action === 'rekey' ? t('notRekey') : false; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), resets: true, options: [['tunnel', t('modeTunnel')], ['transport', t('modeTransport')]] },
      { key: 'auth', type: 'choice', label: t('auth'), resets: true, options: [['psk', t('authPsk')], ['cert', t('authCert')]] },
      { key: 'action', type: 'choice', label: t('action'), resets: true,
        options: [['bring-up', t('actBringUp')], ['send', t('actSend')], ['rekey', t('actRekey')]] },
      { key: 'selectorMatch', type: 'toggle', label: t('selectorMatch'), hint: t('selectorMatchHint'), resets: true, disabled: notRekey }
    ],

    presets: [
      { id: 'site-to-site', label: t('presetS2s'), params: { mode: 'tunnel', action: 'bring-up', selectorMatch: true }, hint: t('presetS2sHint') },
      { id: 'transport', label: t('presetTransport'), params: { mode: 'transport', action: 'bring-up', selectorMatch: true }, hint: t('presetTransportHint') },
      { id: 'no-selector', label: t('presetNoSel'), params: { mode: 'tunnel', action: 'bring-up', selectorMatch: false }, hint: t('presetNoSelHint') },
      { id: 'rekey', label: t('presetRekey'), params: { mode: 'tunnel', action: 'rekey', selectorMatch: true }, hint: t('presetRekeyHint') }
    ],

    legend: [
      { shape: 'ik-ike', label: t('legIke') },
      { shape: 'ik-esp', label: t('legEsp') },
      { shape: 'ik-enc', label: t('legEnc') },
      { shape: 'ik-tun', label: t('legTunnel') },
      { shape: 'ik-tra', label: t('legTransport') },
      { shape: 'ik-ok', label: t('legOk') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
