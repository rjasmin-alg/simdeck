<!-- ddos-amplification: spoofed small requests become large replies at the victim. An explorer: the params (public
     UDP service and its amplification factor, sent rate, victim link capacity, defences) give the scene at once.
     Custom scene (no kit view fits this three-column amplification picture): sender → reflectors → victim, arrow
     widths ∝ bit rate, a load gauge on the victim's link, a defence panel. Model: sim.js; rules: SPEC.md; words:
     strings.js. -->

<style>
/* Page CSS: every selector starts with [data-sim="ddos-amplification"]; colours only from kit tokens.
   Layout: the scene on top (sender → reflectors → victim, request thin and dashed, reply thick, width ∝ rate),
   the victim's load gauge below it, then the defence chips. */
[data-sim="ddos-amplification"] .ddos {
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto auto;
  gap: 1.2cqh;
  height: 100%;
  padding: 1.5cqh 1.8cqw;
  font-size: 1rem;
}

/* ── the scene ── */
[data-sim="ddos-amplification"] .ddos-scene {
  display: grid;
  grid-template-columns: minmax(7rem, 1fr) minmax(5rem, 1.4fr) minmax(8rem, 1.3fr) minmax(5rem, 1.4fr) minmax(7rem, 1fr);
  align-items: center;
  gap: 0;
  min-height: 0;
}
[data-sim="ddos-amplification"] .ddos-node {
  border: var(--line-w) solid var(--ink);
  border-radius: var(--radius-sm);
  background: var(--panel);
  padding: 0.6rem 0.7rem;
  text-align: center;
  align-self: center;
}
[data-sim="ddos-amplification"] .ddos-node h3 { margin: 0 0 0.15rem; font-size: var(--fs-md); }
[data-sim="ddos-amplification"] .ddos-node .ddos-sub { font-size: var(--fs-sm); color: var(--muted); }
[data-sim="ddos-amplification"] .ddos-victim { border-width: 0.25rem; }

/* the reflector stack */
[data-sim="ddos-amplification"] .ddos-refs { display: flex; flex-direction: column; gap: 0.3rem; }
[data-sim="ddos-amplification"] .ddos-ref {
  border: var(--line-w) solid var(--line); border-radius: var(--radius-sm);
  padding: 0.1rem 0.5rem; font-size: var(--fs-sm); background: var(--bg);
  display: flex; justify-content: space-between; gap: 0.6rem;
}
[data-sim="ddos-amplification"] .ddos-ref[data-on] { border-color: var(--c3); border-left: 0.4rem solid var(--c3); font-weight: 700; }
[data-sim="ddos-amplification"] .ddos-ref[data-off] { color: var(--muted); border-style: dashed; }
[data-sim="ddos-amplification"] .ddos-ref .ddos-baf { font-family: var(--mono); }

/* the flows: a bar whose thickness ∝ rate, with a label above and (for the request) the forged-source chip */
[data-sim="ddos-amplification"] .ddos-flow { position: relative; padding: 0 0.3rem; min-width: 0; }
[data-sim="ddos-amplification"] .ddos-flowlabel { font-size: var(--fs-sm); text-align: center; margin-bottom: 0.2rem; white-space: nowrap; }
[data-sim="ddos-amplification"] .ddos-rate { font-family: var(--mono); font-weight: 700; }
[data-sim="ddos-amplification"] .ddos-bar {
  position: relative; width: 100%; background: var(--ink);
  height: var(--thick, 0.4rem); border-radius: 0.2rem;
}
[data-sim="ddos-amplification"] .ddos-bar::after {       /* the arrow head */
  content: ''; position: absolute; right: -0.1rem; top: 50%; transform: translateY(-50%);
  border-top: 0.55rem solid transparent; border-bottom: 0.55rem solid transparent;
  border-left: 0.7rem solid var(--ink);
}
[data-sim="ddos-amplification"] .ddos-req .ddos-bar {
  background: repeating-linear-gradient(90deg, var(--muted) 0 0.5rem, transparent 0.5rem 0.9rem);
  height: var(--thick, 0.35rem);
}
[data-sim="ddos-amplification"] .ddos-req .ddos-bar::after { border-left-color: var(--muted); }
[data-sim="ddos-amplification"] .ddos-chip {
  display: inline-flex; align-items: center; gap: 0.25rem; margin-top: 0.3rem;
  font-size: var(--fs-sm); padding: 0.05rem 0.4rem; border: var(--line-w) dashed var(--danger);
  border-radius: var(--radius-sm); color: var(--danger); white-space: nowrap;
}
[data-sim="ddos-amplification"] .ddos-mask { width: 1.1em; height: 1.1em; }
[data-sim="ddos-amplification"] .ddos-none { font-size: var(--fs-sm); color: var(--muted); text-align: center; margin-top: 0.3rem; }
[data-sim="ddos-amplification"] .ddos-flow.sd-changed { background: var(--hl); border-radius: var(--radius-sm); }

/* ── the gauge ── */
[data-sim="ddos-amplification"] .ddos-gauge { }
[data-sim="ddos-amplification"] .ddos-gauge h3 { margin: 0 0 0.25rem; font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
[data-sim="ddos-amplification"] .ddos-meter {
  position: relative; height: 1.9rem; border: var(--line-w) solid var(--ink);
  border-radius: var(--radius-sm); background: var(--panel); overflow: hidden;
}
[data-sim="ddos-amplification"] .ddos-fill { height: 100%; width: 0; background: var(--c1); transition: width 0.25s ease; }
[data-sim="ddos-amplification"] .ddos-meter[data-sat] .ddos-fill {
  background: var(--danger);
  background-image: repeating-linear-gradient(45deg, transparent 0 0.5rem, color-mix(in srgb, var(--on-series) 28%, transparent) 0.5rem 1rem);
}
[data-sim="ddos-amplification"] .ddos-cap {       /* capacity mark at the right edge */
  position: absolute; top: 0; bottom: 0; right: 0; width: 0.2rem; background: var(--ink);
}
[data-sim="ddos-amplification"] .ddos-caplbl { position: absolute; right: 0.3rem; top: 50%; transform: translateY(-50%);
  font-size: var(--fs-sm); font-weight: 700; }
[data-sim="ddos-amplification"] .ddos-gline { margin: 0.25rem 0 0; font-size: var(--fs-sm); display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; align-items: baseline; }
[data-sim="ddos-amplification"] .ddos-gline .ddos-num { font-family: var(--mono); }
[data-sim="ddos-amplification"] .ddos-sat { font-weight: 700; color: var(--danger); padding: 0 0.35rem; border: var(--line-w) solid var(--danger); border-radius: var(--radius-sm); }
[data-sim="ddos-amplification"] .ddos-free { color: var(--ok); font-weight: 700; }
[data-sim="ddos-amplification"] .ddos-gauge.sd-changed .ddos-meter { outline: 0.2rem solid var(--ink); outline-offset: 0.15rem; }

/* ── the defence chips ── */
[data-sim="ddos-amplification"] .ddos-defs { display: flex; flex-wrap: wrap; gap: 0.4rem; }
[data-sim="ddos-amplification"] .ddos-def {
  font-size: var(--fs-sm); padding: 0.1rem 0.5rem; border: var(--line-w) solid var(--line);
  border-radius: var(--radius-sm); color: var(--muted);
}
[data-sim="ddos-amplification"] .ddos-def[data-active] { color: var(--ink); border-color: var(--ok); border-left: 0.4rem solid var(--ok); font-weight: 700; }
[data-sim="ddos-amplification"] .ddos-def[data-active][data-useless] { border-color: var(--warn); border-left-color: var(--warn); }

/* legend swatches the kit lacks */
[data-sim="ddos-amplification"] .sd-swatch[data-shape="ddos-req"] { height: 0.3rem; border: 0; border-radius: 0;
  background: repeating-linear-gradient(90deg, var(--muted) 0 0.35rem, transparent 0.35rem 0.6rem); }
[data-sim="ddos-amplification"] .sd-swatch[data-shape="ddos-rep"] { height: 0.7rem; border: 0; border-radius: 0; background: var(--ink); }
[data-sim="ddos-amplification"] .sd-swatch[data-shape="ddos-gauge"] { background: var(--c1); border: var(--line-w) solid var(--ink); }
[data-sim="ddos-amplification"] .sd-swatch[data-shape="ddos-sat"] { background: var(--danger);
  background-image: repeating-linear-gradient(45deg, transparent 0 0.3rem, color-mix(in srgb, var(--ink) 28%, transparent) 0.3rem 0.6rem); border: var(--line-w) solid var(--danger); }
[data-sim="ddos-amplification"] .sd-swatch[data-shape="ddos-def"] { background: var(--bg); border: var(--line-w) solid var(--ok); border-left: 0.4rem solid var(--ok); }

[data-sim="ddos-amplification"] .ddos-note { font-size: var(--fs-sm); color: var(--muted); }

/* seven controls plus five presets: tighten the panel's own gaps (not the 44px targets) so it fits one screen */
[data-sim="ddos-amplification"] .sd-panel { gap: 0.5rem; }
[data-sim="ddos-amplification"] .sd-group { gap: 0.4rem; }
[data-sim="ddos-amplification"] .sd-ctl { gap: 0.2rem; }
[data-sim="ddos-amplification"] .sd-presets { gap: 0.3rem; }

/* Phone and portrait: the scene stacks top to bottom; nothing scrolls sideways. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ddos-amplification"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="ddos-amplification"] .ddos { height: auto; grid-template-rows: none; padding: 0.6rem; gap: 0.9rem; }
  [data-sim="ddos-amplification"] .ddos-scene { grid-template-columns: 1fr; gap: 0.5rem; }
  [data-sim="ddos-amplification"] .ddos-flow { padding: 0.3rem 0; }
  [data-sim="ddos-amplification"] .ddos-bar { width: 60%; margin: 0 auto; }
  [data-sim="ddos-amplification"] .ddos-flowlabel { white-space: normal; }
}
</style>

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Pojačavanje (DRDoS)</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var SVC_KEY = { dns: 'svcDns', snmp: 'svcSnmp', ssdp: 'svcSsdp', ntp: 'svcNtp' };

  /** Data (rates, factors, percentages, protocol names) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no', class: 'ddos-num' }, String(text)); }

  /** Arrow thickness ∝ rate: a sqrt scale with a floor and a cap, so the request stays thin and the reply reads
      much thicker without a huge factor overflowing the scene. Returns a rem string. */
  function thick(rate) {
    if (rate <= 0) return '0.3rem';
    var rem = 0.3 + Math.sqrt(rate) * 0.12;
    return Math.min(rem, 7).toFixed(2) + 'rem';
  }

  // a small mask glyph for the forged-source chip (fixed size, no text: safe at any scale)
  function maskIcon() {
    return h('svg', { class: 'ddos-mask', viewBox: '0 0 24 24', 'aria-hidden': 'true', fill: 'none', stroke: 'currentColor', 'stroke-width': '2' },
      h('path', { d: 'M2 8c6-2 14-2 20 0-1 7-4 9-10 9S3 15 2 8z' }),
      h('circle', { cx: '8', cy: '11', r: '1.6', fill: 'currentColor', stroke: 'none' }),
      h('circle', { cx: '16', cy: '11', r: '1.6', fill: 'currentColor', stroke: 'none' }));
  }

  // ── "changed": against the state before the last param change (a preset against the defaults) ──
  var last = null, changed = {};
  function track(c) {
    var cur = c.state;
    if (!last || last.preset !== c.preset || !samePieces(last, cur)) {
      var base = c.preset ? L.initial(L.defaults) : (last ? last.state : null);
      changed = {
        req: !!base && base.sentEffective !== cur.sentEffective,
        rep: !!base && base.reflectedMbps !== cur.reflectedMbps,
        gauge: !!base && (base.reflectedMbps !== cur.reflectedMbps || base.victimCapacity !== cur.victimCapacity)
      };
      last = { preset: c.preset, state: cur };
    }
  }
  function samePieces(prev, cur) {
    var a = prev.state;
    return a.sentEffective === cur.sentEffective && a.reflectedMbps === cur.reflectedMbps &&
      a.victimCapacity === cur.victimCapacity && a.service === cur.service &&
      JSON.stringify(a.defences) === JSON.stringify(cur.defences);
  }

  // ── the scene ──

  function renderScene(s) {
    var sender = h('div', { class: 'ddos-node' }, h('h3', null, t('sender')), h('div', { class: 'ddos-sub' }, t('senderSub')));

    var refs = h('div', { class: 'ddos-refs' }, L.SERVICES.map(function (svc) {
      var ds = {};
      if (svc.id === s.service) ds[s.defences.reflectorsClosed ? 'off' : 'on'] = '1'; else ds.off = '1';
      return h('div', { class: 'ddos-ref', dataset: ds },
        h('span', { translate: 'no' }, t(SVC_KEY[svc.id])),
        h('span', { class: 'ddos-baf', translate: 'no' }, svc.baf + '×'));
    }));
    var reflectors = h('div', { class: 'ddos-node' }, h('h3', null, t('reflectors')),
      h('div', { class: 'ddos-sub' }, t('reflectorsSub')), refs);

    // request flow (thin, dashed, forged-source chip)
    var reqBlocked = s.defences.ingressFiltering;
    var req = h('div', { class: 'ddos-flow ddos-req' + (changed.req ? ' sd-changed' : '') },
      h('div', { class: 'ddos-flowlabel' }, t('reqLabel'), ' ', data(s.sentEffective + ' ' + t('unitMbps'))),
      reqBlocked ? h('div', { class: 'ddos-none' }, t('blockedSource'))
        : h('div', { class: 'ddos-bar', style: { '--thick': thick(s.sentMbps) } }),
      reqBlocked ? null : h('div', { style: { textAlign: 'center' } },
        h('span', { class: 'ddos-chip' }, maskIcon(), h('span', { translate: 'no' }, t('forged')))));

    // reply flow (thick, solid, width ∝ reflected)
    var rep = h('div', { class: 'ddos-flow ddos-rep' + (changed.rep ? ' sd-changed' : '') },
      h('div', { class: 'ddos-flowlabel' }, t('repLabel'), ' ', data(s.reflectedMbps + ' ' + t('unitMbps'))),
      s.reflectedMbps > 0 ? h('div', { class: 'ddos-bar', style: { '--thick': thick(s.reflectedMbps) } })
        : h('div', { class: 'ddos-none' }, s.stopped.atReflector ? t('blockedReflector') : t('blockedSource')));

    var victim = h('div', { class: 'ddos-node ddos-victim' }, h('h3', null, t('victim')), h('div', { class: 'ddos-sub' }, t('victimSub')));

    return h('div', { class: 'ddos-scene' }, sender, req, reflectors, rep, victim);
  }

  // ── the gauge ──

  function renderGauge(s) {
    var pct = Math.min(s.loadPct, 100);
    var meter = h('div', { class: 'ddos-meter', dataset: s.saturated ? { sat: '1' } : {} },
      h('div', { class: 'ddos-fill', style: { width: pct + '%' } }),
      h('div', { class: 'ddos-cap' }),
      h('div', { class: 'ddos-caplbl', translate: 'no' }, t('capMark')));
    var line = h('div', { class: 'ddos-gline' },
      h('span', null, t.parts('loadLine', { load: data(s.reflectedMbps), cap: data(s.victimCapacity), pct: data(s.loadPct) })),
      s.saturated ? h('span', { class: 'ddos-sat' }, t('satTimes', { times: s.times })) : null,
      !s.saturated ? h('span', { class: 'ddos-free' }, t('freeLine', { free: s.effectiveMbps })) : null);
    return h('div', { class: 'ddos-gauge' + (changed.gauge ? ' sd-changed' : '') },
      h('h3', null, t('gaugeTitle')), meter, line);
  }

  // ── the defence chips ──

  function renderDefs(s) {
    var d = s.defences;
    function chip(on, key, useless) {
      var ds = {};
      if (on) { ds.active = '1'; if (useless) ds.useless = '1'; }
      return h('span', { class: 'ddos-def', dataset: ds }, t(key));
    }
    return h('div', { class: 'ddos-defs' },
      chip(d.ingressFiltering, 'pIngress', false),
      chip(d.reflectorsClosed, 'pClosed', false),
      chip(d.rateLimit, 'pRate', false),
      chip(d.victimFilter, 'pVictimFilter', true));
  }

  // ── captions ──

  function caption(s) {
    var out = [t('capBaf', { baf: s.baf, sent: s.sentMbps, refl: s.reflectedMbps })];
    // a defence sentence takes priority when it changed the outcome
    if (s.defences.ingressFiltering) return [t('capIngress')];
    if (s.defences.reflectorsClosed) { out = [t('capClosed')]; return out; }
    out.push(s.saturated ? t('capSat', { times: s.times, cap: s.victimCapacity })
      : t('capUnder', { pct: s.loadPct, cap: s.victimCapacity }));
    if (s.defences.rateLimit) out.push(t('capRate'));
    // the "a victim filter does not help" lesson holds only once the link is full; under capacity it would help
    if (s.defences.victimFilter && s.saturated) out.push(t('capVictimFilter', { times: s.times }));
    return out.join(' ');
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'service', type: 'choice', label: t('pService'),
        options: [['dns', t('svcDns')], ['snmp', t('svcSnmp')], ['ssdp', t('svcSsdp')], ['ntp', t('svcNtp')]] },
      { key: 'sentMbps', type: 'range', label: t('pSent'), min: 1, max: 100, step: 1, unit: t('unitMbps') },
      { key: 'victimMbps', type: 'range', label: t('pVictim'), min: 100, max: 10000, step: 100, unit: t('unitMbps') },
      { key: 'ingressFiltering', type: 'toggle', label: t('pIngress') },
      { key: 'reflectorsClosed', type: 'toggle', label: t('pClosed') },
      { key: 'rateLimit', type: 'toggle', label: t('pRate') },
      { key: 'victimFilter', type: 'toggle', label: t('pVictimFilter') }
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: Object.assign({}, L.defaults, x.params) };
    }),

    legend: [
      { shape: 'ddos-req', label: t('legReq') },
      { shape: 'ddos-rep', label: t('legRep') },
      { shape: 'ddos-gauge', label: t('legGauge') },
      { shape: 'ddos-sat', label: t('legSat') },
      { shape: 'ddos-def', label: t('legDefence') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      track(c);
      c.stage.replaceChildren(h('div', { class: 'ddos' },
        renderScene(c.state),
        renderGauge(c.state),
        renderDefs(c.state)));
    },

    caption: function (c) {
      track(c);
      return caption(c.state);
    }
  });
})();
</script>
</body>
</html>
