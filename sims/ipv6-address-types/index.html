<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var SERIES = { gua: 'var(--c1)', ll: 'var(--c2)', ula: 'var(--c3)', mc: 'var(--c4)', special: 'var(--c8)' };
  /** Which regions are shaded for a reach (rule 3/4). */
  var SHADE = { host: ['H'], link: ['L1', 'R1'], site: ['site'], global: ['site', 'inet'], none: [], admin: [] };
  var ROUTERS = { R1: 1, R2: 1 };

  /** Data (addresses, prefixes, bits) is not language: the word check skips translate="no". */
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function put(el, items) {
    var out = [];
    (function walk(x) { if (Array.isArray(x)) x.forEach(walk); else if (x !== null && x !== undefined && x !== false) out.push(x); })(items);
    el.replaceChildren.apply(el, out);
  }
  function sw(group) { return SERIES[group]; }

  // ── the typed address: the field is the page's own (the kit has no text param) ──
  var typedError = null;    // { text, code } while the field holds text that does not parse (rule 7)
  var fromInput = false;    // true while the field's own input handler renders

  // ── the stage is built once and updated in place, so the field keeps its caret and focus ──
  var ui = null;
  function build(stage) {
    var input = h('input', { id: 'at-addr', type: 'text', class: 'at-input', maxlength: '60', spellcheck: 'false',
      autocomplete: 'off', autocapitalize: 'off', translate: 'no', 'aria-describedby': 'at-addr-err' });
    input.addEventListener('input', function () {
      var r = L.typed(sim.params.addr, input.value);
      typedError = r.error ? { text: input.value, code: r.error } : null;
      fromInput = true;
      try {
        if (r.error || r.addr === sim.params.addr) sim.render();
        else sim.set({ addr: r.addr });
      } finally { fromInput = false; }
    });
    // Enter or Escape hands the keys back to the clicker
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    var err = h('p', { class: 'at-err', id: 'at-addr-err', role: 'status' });
    var short = h('p', { class: 'at-short' });
    var chips = h('div', { class: 'at-chips' });
    var inBox = h('section', { class: 'at-box at-in' },
      h('div', { class: 'at-field' }, h('label', { for: 'at-addr' }, t('addrLabel')), input),
      err, short, chips);
    var card = h('section', { class: 'at-box at-card' });
    var tbody = h('tbody');
    var table = h('section', { class: 'at-box at-table' }, h('h3', null, t('tableTitle')),
      h('table', null, h('thead', null, h('tr', null, h('th', null, t('thType')), h('th', null, t('thPrefix')), h('th', null, t('thReach')), h('th'))), tbody));
    var strip = h('section', { class: 'at-box at-strip' });
    var topo = h('section', { class: 'at-box at-topo' });
    var root = h('div', { class: 'at' }, inBox, card, table, strip, topo);
    stage.replaceChildren(root);
    return { root: root, input: input, err: err, short: short, chips: chips, card: card, tbody: tbody, strip: strip, topo: topo };
  }

  // ── the address box ──
  function fillInput(c) {
    var s = c.state, p = c.params;
    if (!fromInput) {                          // a preset, a list button, reset, a toggle or the URL: show the address in use
      typedError = null;
      if (ui.input.value !== p.addr) ui.input.value = p.addr;
    }
    var e = errorOf(s);
    ui.input.setAttribute('aria-invalid', e ? 'true' : 'false');
    ui.err.textContent = e ? t('err_' + e.code) : '';
    // while the field holds an error, the error line takes the RFC 5952 line's place (the caption names the address kept)
    ui.short.hidden = !!e;
    put(ui.short, [t('shortLabel') + ' ', code(s.address)]);
    put(ui.chips, [h('span', null, t('listLabel'))].concat(s.list.map(function (a, i) {
      return h('button', { type: 'button', class: 'at-chip', translate: 'no', 'aria-pressed': String(i === s.inList),
        onclick: function () { typedError = null; ui.input.value = a; if (a === sim.params.addr) sim.render(); else sim.set({ addr: a }); } }, a);
    })));
  }
  function errorOf(s) {
    if (typedError) return typedError;
    return s.error ? { text: s.input, code: s.error } : null;
  }

  // ── the prefix table ──
  function reachWord(row) { return row.reach === null ? t('reachByScope') : t('reach_' + row.reach); }
  function fillTable(s) {
    var rows = L.ROWS.concat([L.OTHER]);
    put(ui.tbody, rows.map(function (r) {
      var win = r.id === s.type, also = !win && s.matches.indexOf(r.id) >= 0, near = s.nearest && s.nearest.row === r.id;
      var ds = { group: r.group };
      if (win) ds.win = '';
      if (also) ds.also = '';
      if (near) ds.near = '';
      if (r.id === 'other') ds.other = '';
      var sym = win ? '◀' : also ? '✓' : near ? '≈' : '';
      var mark = sym ? [sym, h('span', { class: 'at-markw' }, ' ' + t(win ? 'markWin' : also ? 'markAlso' : 'markNear'))] : null;
      return h('tr', { dataset: ds, style: { '--sw': sw(r.group) } },
        h('td', null, h('span', { class: 'at-sw', dataset: r.group === 'special' ? { group: r.group } : { on: '', group: r.group } }), t('row_' + r.id)),
        h('td', { dataset: { mono: '' }, translate: 'no' }, r.prefix === null ? '—' : r.prefix + '/' + r.len),
        h('td', null, reachWord(r)),
        h('td', { class: 'at-mark' }, mark));
    }));
  }

  // ── the type card ──
  function fillCard(s) {
    ui.card.style.setProperty('--sw', sw(s.group));
    ui.card.dataset.group = s.group;
    var kv = [h('dt', null, t('cardPrefix')), h('dd', null, s.matchedPrefix ? code(s.matchedPrefix) : t('cardNone')),
      h('dt', null, t('cardReach')), h('dd', null, t('reach_' + s.reach))];
    if (s.scope) {
      kv.push(h('dt', null, t('cardScope')), h('dd', null, code(s.scopeNibble.toString(16)), ' = ', t('scope_' + s.scope)));
    }
    if (s.mcGroup) kv.push(h('dt', null, t('cardGroup')), h('dd', null, t('grp_' + s.mcGroup)));
    put(ui.card, [
      h('p', { class: 'at-type' }, h('span', { class: 'at-sw', dataset: s.group === 'special' ? { group: s.group } : { on: '', group: s.group }, style: { '--sw': sw(s.group) } }), t('type_' + s.type)),
      h('dl', { class: 'at-kv' }, kv),
      s.note ? h('p', { class: 'at-note' }, noteOf(s)) : null
    ]);
  }
  function noteOf(s) {
    if (s.note === 'gua-bits') {
      var d = s.full[0];
      return t.parts('note_gua-bits', { d: code(d), b: code(s.bits.slice(0, 4)) });
    }
    if (s.note === 'nearest') {
      var r = L.rowOf(s.nearest.row);
      return t.parts('note_nearest', { p: code(r.prefix + '/' + r.len), same: s.nearest.same, len: r.len, diff: s.nearest.diff });
    }
    return t('note_' + s.note);
  }

  // ── the bit strip ──
  /** The row the strip compares with: the matched one, or the nearest for an unassigned address. */
  function refRow(s) { return s.type === 'other' ? L.rowOf(s.nearest.row) : L.rowOf(s.type); }
  /** Bit ranges [from, to) to draw: whole 16-bit groups covering the prefix; for a /128, the first and last group. */
  function segmentsOf(len, diff) {
    if (len === 128) {
      // the first and the last group; when the first differing bit falls between them, its group instead of the first
      return diff >= 16 && diff < 112 ? [[diff - diff % 16, diff - diff % 16 + 16], [112, 128]] : [[0, 16], [112, 128]];
    }
    var out = [];
    for (var a = 0; a < Math.max(16, Math.ceil(len / 16) * 16); a += 16) out.push([a, a + 16]);
    return out;
  }
  /** Bit index → a tag drawn under it: multicast flags and scope, ULA's L bit. */
  function tagsOf(s) {
    var tags = {};
    if (s.type === 'multicast') {
      for (var i = 8; i < 12; i++) tags[i] = 'flags';
      for (var j = 12; j < 16; j++) tags[j] = 'scope';
    }
    if (s.type === 'ula') tags[7] = 'L';
    return tags;
  }
  function fillStrip(s) {
    var row = refRow(s);
    var same = s.type === 'other' ? s.nearest.same : row.len;
    var diff = s.type === 'other' ? s.nearest.diff : -1;
    var tags = tagsOf(s);
    var cmpDigits = Math.ceil(row.len / 4);     // hex digits that hold compared bits
    // the full form, compared digits marked
    var digit = 0;
    var full = h('div', { class: 'at-full', translate: 'no' }, s.full.split('').map(function (ch) {
      if (ch === ':') return ch;
      var d = digit++;
      var inCmp = row.len === 128 ? true : d < cmpDigits;
      return inCmp ? h('span', { class: 'at-cmp' }, ch) : ch;
    }));
    var segs = segmentsOf(row.len, diff);
    var out = [];
    segs.forEach(function (seg, k) {
      var prevEnd = k > 0 ? segs[k - 1][1] : 0;
      if (prevEnd < seg[0]) {
        var a = prevEnd, b = seg[0] - 1, zero = s.bits.slice(a, b + 1).indexOf('1') < 0;
        out.push(h('div', { class: 'at-gap' }, '⋯ ' + t(zero ? 'stripGapZero' : 'stripGap', { a: a, b: b })));
      }
      var cells = [h('span', { class: 'at-rowlbl' }, t('stripBit', { i: seg[0] }))];
      for (var q = seg[0]; q < seg[1]; q += 4) {
        cells.push(h('span', { class: 'at-hex', translate: 'no', style: { gridColumn: 'span 4' } }, s.full.replace(/:/g, '')[q / 4]));
      }
      cells.push(h('span', { class: 'at-rowlbl' }, t('stripAddr')));
      for (var i = seg[0]; i < seg[1]; i++) {
        var ds = { nib: String(i % 4) };
        if (i < same) ds.eq = '';
        else if (i === diff) ds.diff = '';
        else if (i >= row.len) ds.out = '';
        if (tags[i]) ds.tag = tags[i];
        cells.push(h('span', { class: 'at-bit', dataset: ds, translate: 'no' }, s.bits[i]));
      }
      cells.push(h('span', { class: 'at-rowlbl' }, t('stripRef')));
      for (var j = seg[0]; j < seg[1]; j++) {
        var rd = { nib: String(j % 4), ref: '' };
        if (j < row.len) {
          if (j < same) rd.eq = '';
          else if (j === diff) rd.diff = '';
        } else rd.empty = '';
        cells.push(h('span', { class: 'at-bit', dataset: rd, translate: 'no' }, j < row.len ? row.bits[j] : ''));
      }
      // tags row: a label under each run of tagged bits, ✕ under the first differing bit
      var tagRow = [h('span')];
      var any = false;
      for (var m = seg[0]; m < seg[1];) {
        if (tags[m]) {
          var e = m;
          while (e < seg[1] && tags[e] === tags[m]) e++;
          tagRow.push(h('span', { class: 'at-tag', style: { gridColumn: 'span ' + (e - m) } }, tags[m] === 'L' ? t('stripL') : t(tags[m] === 'scope' ? 'stripScope' : 'stripFlags')));
          any = true;
          m = e;
        } else if (m === diff) {
          tagRow.push(h('span', { class: 'at-diffmark' }, '✕'));
          any = true;
          m++;
        } else { tagRow.push(h('span')); m++; }
      }
      if (any) cells = cells.concat(tagRow);
      out.push(h('div', { class: 'at-seg' }, cells));
    });
    var label = s.type === 'other' ? t.parts('stripNear', { p: code(row.prefix + '/' + row.len) }) : t.parts('stripPrefix', { p: code(row.prefix + '/' + row.len) });
    put(ui.strip, [
      h('div', { class: 'at-strip-head' }, h('h3', null, t('stripTitle')),
        h('span', null, label, ': ', t('stripSame', { same: same, len: row.len }))),
      full,
      h('div', { class: 'at-segs' }, out)
    ]);
  }

  // ── the topology ──
  function node(s, id) {
    var got = s.reachNodes.indexOf(id) >= 0;
    var ds = {};
    if (got) ds.got = '';
    if (ROUTERS[id]) ds.router = '';
    if (SHADE[s.reach].indexOf(id) >= 0) { ds.on = ''; ds.group = s.group; }
    var stop = s.stopAt === id ? h('span', { class: 'at-stop' }, t('stop_' + s.stopWhy)) : null;
    return h('div', { class: 'at-node', dataset: ds, style: { '--sw': sw(s.group) } },
      h('b', { translate: 'no' }, id), h('small', null, t('role_' + id)),
      stop || h('span', { class: 'at-got' }, got ? '✓ ' + t('gets') : '– ' + t('getsNot')));
  }
  function region(s, id, kind, title, children) {
    var ds = { kind: kind };
    if (SHADE[s.reach].indexOf(id) >= 0) { ds.on = ''; ds.group = s.group; }
    return h('div', { class: 'at-reg', dataset: ds, style: { '--sw': sw(s.group) } }, h('b', null, title), children);
  }
  function fillTopo(s) {
    var wire = function () { return h('span', { class: 'at-wire', 'aria-hidden': 'true' }); };
    var site = region(s, 'site', 'site', t('siteTitle'), [
      h('div', { class: 'at-row' },
        region(s, 'L1', 'link', t('l1Title'), h('div', { class: 'at-row' }, node(s, 'H'), node(s, 'N'))),
        wire(), node(s, 'R1'), wire(),
        region(s, 'L2', 'link', t('l2Title'), h('div', { class: 'at-row' }, node(s, 'H2'))),
        wire(), node(s, 'R2')),
      s.reach === 'admin' ? h('div', { class: 'at-admin' }, h('span', null, '? ' + t('adminMark'))) : null
    ]);
    var inet = region(s, 'inet', 'inet', t('netTitle'), h('div', { class: 'at-row' }, node(s, 'S')));
    put(ui.topo, [site, wire(), inet]);
  }

  // ── caption ──
  function caption(c) {
    var s = c.state;
    var e = errorOf(s);
    if (e) return t.parts('cap_error', { text: code(e.text), why: t('err_' + e.code), addr: code(s.address) });
    var v = { addr: h('b', null, code(s.address)), prefix: s.matchedPrefix ? code(s.matchedPrefix) : '' };
    if (s.type === 'multicast') {
      v.n = code(s.scopeNibble.toString(16));
      v.scope = t('scope_' + s.scope);
      v.rest = t('mc_' + s.reach);
    }
    if (s.type === 'other') {
      var r = L.rowOf(s.nearest.row);
      v.prefix = code(r.prefix + '/' + r.len);
      v.diff = s.nearest.diff;
    }
    return t.parts('cap_' + s.type, v);
  }

  function render(c) {
    if (!ui || !c.stage.contains(ui.root)) ui = build(c.stage);
    ui.root.dataset.bits = c.params.showBits ? 'on' : 'off';
    fillInput(c);
    fillCard(c.state);
    fillTable(c.state);
    if (c.params.showBits) fillStrip(c.state);
    fillTopo(c.state);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'showBits', type: 'toggle', label: t('showBits'), hint: t('showBitsHint') }
    ],
    presets: L.PRESETS.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params };
    }),
    legend: [
      { c: 1, shape: 'at-gua', label: t('legGua') },
      { c: 3, shape: 'at-ula', label: t('legUla') },
      { c: 2, shape: 'at-ll', label: t('legLl') },
      { c: 4, shape: 'at-mc', label: t('legMc') },
      { c: 8, shape: 'at-special', label: t('legSpecial') },
      { shape: 'hl', label: t('legChanged') },
      { shape: 'at-stop', label: t('legStop') }
    ],
    render: render,
    caption: caption
  });

  // ── the typed address and its list live in the URL too (the kit keeps only its own params there and leaves other
  //    keys alone), so a reload, a copied link and the language switch keep them ──
  var TYPED = ['addr', 'set'];
  function baseParams() {
    var pr = sim.preset ? L.PRESETS.filter(function (x) { return x.id === sim.preset; })[0] : null;
    return pr ? Object.assign({}, L.defaults, pr.params) : L.defaults;
  }
  function writeTyped() {
    try {
      var u = new URLSearchParams(window.location.search);
      var base = baseParams(), p = sim.params;
      TYPED.forEach(function (k) { if (p[k] !== base[k]) u.set(k, p[k]); else u.delete(k); });
      var qs = u.toString();
      window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
    } catch (e) { /* file:// in some browsers */ }
  }
  (function readTyped() {
    var q = new URLSearchParams(window.location.search);
    var patch = {};
    TYPED.forEach(function (k) { if (q.has(k)) patch[k] = q.get(k); });
    if (Object.keys(patch).length) sim.set(patch);
  })();
  sim.on(writeTyped);
})();
</script>
</body>
</html>
