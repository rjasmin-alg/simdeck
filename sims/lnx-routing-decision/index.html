<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);
  var PLACE_NO = { iface: 1, route: 2, name: 3 };
  var PH_WORD = { name: 'phName', route: 'phRoute', link: 'phLink' };

  /** Data (commands, paths, addresses, outputs) is not language: the word check skips translate="no". */
  function data(s, cls) { return h('span', Object.assign({ translate: 'no' }, cls ? { class: cls } : {}), String(s)); }
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function b(x) { return h('b', null, x); }
  /** t.parts, but a placeholder used twice in one string gets a copy (a DOM node can stand in one place only). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!x || !x.nodeType) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function hl(on, c) { return on ? ' sd-changed' + anim(c) : ''; }
  function has(s, mark) { return s.event.changed.indexOf(mark) >= 0; }
  function no(n) { return h('span', { class: 'rd-no', dataset: { c: String(n) }, 'aria-hidden': 'true' }, String(n)); }
  function brokenTag(on) { return on ? h('span', { class: 'rd-tag' }, '✕ ', t('broken')) : null; }
  function prefixText(r) { return r.prefix === 0 ? 'default' : r.dst + '/' + r.prefix; }
  /** The places the current command uses (thick border). */
  function usedPlaces(s) {
    var out = {};
    s.phases.forEach(function (ph) { out[ph.place] = true; });
    if (s.lookup) out.route = true;
    return out;
  }
  var strangersMemo = {};
  function strangersOf(p) {
    var k = p.script + '|' + p.break + '|' + p.target;
    if (!strangersMemo[k]) strangersMemo[k] = L.strangers(p);
    return strangersMemo[k];
  }

  // ── ① the interface ──
  function ifaceBox(s, c) {
    var i = s.iface, used = usedPlaces(s).iface, faults = L.faults(s);
    var start = c.first && s.broke === 'address';
    var addrLine = i.addr
      ? h('div', { class: 'rd-line' + hl(has(s, 'iface') || start, c) }, data(i.addr.ip + '/' + i.addr.prefix, 'rd-addr'))
      : h('div', { class: 'rd-line' + hl(has(s, 'iface') || start, c) }, h('span', { class: 'rd-miss' }, '✕ ', t('noAddr')));
    var net = i.addr ? prefixText(L.connectedOf(i.addr, i.name)) : null;
    return h('section', { class: 'rd-box', dataset: used ? { here: '' } : {} },
      h('h3', null, no(1), t('placeIface'), brokenTag(faults.indexOf('iface') >= 0)),
      h('div', { class: 'rd-kv' },
        h('div', { class: 'rd-line' }, data(i.name, 'rd-addr'), h('span', { class: 'rd-state' }, data(i.admin === 'up' ? 'UP' : 'DOWN')), h('span', { class: 'rd-sub' }, t('admin'))),
        addrLine,
        net ? h('div', { class: 'rd-line rd-sub' }, t('lanOf'), ' ', data(net)) : null,
        h('div', { class: 'rd-file', translate: 'no' }, 'ip -br addr')));
  }

  // ── ② the routing table (K4): every row containing the destination matches, the longest applies ──
  function routeTable(s, c) {
    var lk = s.lookup;
    var faults = L.faults(s);
    var start = c.first && (s.broke === 'route' || s.broke === 'address');
    var read = has(s, 'routes');
    var title = h('span', { class: 'rd-hl' + hl(read || start, c) }, no(2), ' ', t('placeRoute'));
    var rows = s.routes.map(function (r, i) {
      var hit = lk ? lk.matches.indexOf(i) >= 0 : null;
      var fresh = s.event.kind === 'routeAdd' && s.event.added === r.dst + '/' + r.prefix;
      return {
        no: i + 1,
        cells: { dst: prefixText(r), metric: r.metric ? String(r.metric) : '' },
        action: r.via || '–',
        hit: hit,
        rank: hit ? lk.order.length - lk.order.indexOf(i) : undefined,
        tags: fresh ? [{ k: 'hl', text: '+' }] : null
      };
    });
    var label = lk ? h('span', null, h('span', { class: 'rd-dest' }, '→ ', data(lk.dest)),
      lk.purpose === 'dns' ? h('span', { class: 'rd-sub rd-for' }, t('forDns')) : lk.purpose === 'gateway' ? h('span', { class: 'rd-sub rd-for' }, t('forGw')) : null) : '';
    var table = RT({
      dir: c.dir,
      mode: 'specific',
      title: h('span', null, title, h('span', { class: 'rd-sub', translate: 'no' }, 'ip route'), brokenTag(faults.indexOf('route') >= 0)),
      columns: [{ key: 'dst', label: t('colDst') }],
      actionLabel: data('via'),
      extra: [{ key: 'metric', label: data('metric') }],
      markLabel: label,
      rows: rows,
      implicit: { text: t('noRoute'), action: t('unreachable') },
      at: lk ? 'all' : -1,
      done: !!lk,
      outcome: function (i) {
        if (i >= s.routes.length) return h('span', { class: 'sd-rt-verdict', dataset: { ok: 'false' } }, '✕ ', t('bNoRoute'));
        var r = s.routes[i];
        var ok = lk.purpose !== 'gateway' || !r.via;
        return h('span', { class: 'sd-rt-verdict', dataset: { ok: String(ok) } }, ok ? '✓ ' : '✕ ',
          t(r.via ? (ok ? 'outGw' : 'outOff') : 'outLink'));
      },
      words: { beaten: t('wBeaten') },
      changed: false
    });
    if (usedPlaces(s).route) table.dataset.here = '';
    return table;
  }

  // ── ③ the name files ──
  function namesBox(s, c) {
    var faults = L.faults(s), used = usedPlaces(s).name, nm = s.name;
    var start = c.first;
    var trace = {};
    if (nm) nm.trace.forEach(function (x) { trace[x.src] = x; });
    var srcs = s.nsswitch.map(function (src) {
      var x = trace[src];
      var mark = null;
      if (x) {
        if (x.result === 'hit') mark = h('i', null, '✓ ', t('srcHit'));
        else if (x.result === 'miss') mark = h('i', null, '– ', t('srcMiss'));
        else if (x.result === 'skip') mark = h('i', null, t('srcSkip'));
        else mark = h('i', null, '✕ ', t(x.why === 'noroute' ? 'srcNoRoute' : 'srcTimeout'));
      }
      return h('span', { class: 'rd-src', dataset: x ? { r: x.result } : {} }, data(src), mark);
    });
    var hitLine = trace.files && trace.files.result === 'hit' ? trace.files.line : -1;
    var hosts = s.hosts.map(function (hl0, k) {
      var stale = hl0.ip === L.STALE.ip;
      var on = k === hitLine || (stale && start && s.broke === 'hosts');
      return h('div', { class: 'rd-line' + hl(on, c), translate: 'no' }, hl0.ip + '  ' + hl0.names.join(' '));
    });
    var dnsAsked = trace.dns && trace.dns.result !== 'skip';
    var nsOn = has(s, 'resolv') || dnsAsked || (start && s.broke === 'resolver');
    return h('section', { class: 'rd-box', dataset: used ? { here: '' } : {} },
      h('h3', null, no(3), t('placeName'), brokenTag(faults.indexOf('resolv') >= 0 || faults.indexOf('hosts') >= 0)),
      h('div', { class: 'rd-kv rd-files' },
        h('div', { class: 'rd-file', translate: 'no' }, '/etc/nsswitch.conf'),
        h('div', { class: 'rd-line rd-srcs' + hl(has(s, 'nsswitch'), c) }, data('hosts:'), srcs),
        h('div', { class: 'rd-file', translate: 'no' }, '/etc/hosts'),
        h('div', { class: 'rd-kv' + hl(has(s, 'hosts'), c) }, hosts),
        h('div', { class: 'rd-file', translate: 'no' }, '/etc/resolv.conf'),
        h('div', { class: 'rd-line' + hl(nsOn, c) }, data('nameserver ' + s.resolv.nameserver),
          h('span', { class: 'rd-prof rd-hl' + hl(has(s, 'profile'), c) }, '← ', t('fromProfile'), ' ', data('ipv4.dns')))));
  }

  // ── the LAN (K2) ──
  function netBox(s, c) {
    var p = c.params;
    var ghosts = strangersOf(p);
    var cols = ['srv', 'cli'].concat(ghosts.length ? ['ghost'] : [], ['gw', 'cloud']);
    var col = {};
    cols.forEach(function (id, i) { col[id] = i; });
    function nodeOf(ip) {
      if (ip === '192.168.122.57') return 'srv';
      if (ip === '192.168.122.186') return 'cli';
      if (ip === L.GW) return 'gw';
      if (ghosts.indexOf(ip) >= 0) return 'ghost';
      if (L.FAR_HOSTS.indexOf(ip) >= 0) return 'cloud';
      return null;
    }
    var badges = { srv: [], cli: [], ghost: [], gw: [], cloud: [] };
    var packets = [];
    var pk = s.packet;
    var sends = false;
    if (pk) {
      sends = true;
      var to = nodeOf(pk.hop);
      var lbl = pk.kind === 'dns' ? t('lnDns') : t('lnPing');
      packets.push({ from: 'srv', to: to, label: lbl, c: pk.kind === 'dns' ? 3 : 1, drop: !pk.reply && !pk.via });
      if (pk.via) packets.push({ from: 'gw', to: 'cloud', label: lbl, c: 1, drop: !pk.reply });
      var dest = nodeOf(pk.to);
      if (dest && pk.via) badges.gw.push({ text: t('bHop'), k: 'dashed' });
      if (dest) badges[dest].push(pk.reply ? { text: t(pk.kind === 'dns' ? 'bAnswers' : 'bDest'), k: 'fill' } : { text: t('bSilent'), k: 'dashed' });
    } else if (s.route && s.route.ok && s.dest) {
      var hop = nodeOf(s.route.hop), dn = nodeOf(s.dest);
      if (hop && hop !== dn) badges[hop].push({ text: t('bHop'), k: 'dashed' });
      if (dn) badges[dn].push({ text: t('bDest'), k: 'solid' });
    }
    if (s.route && !s.route.ok) badges.srv.push({ text: t('bNoRoute'), k: 'dashed' });
    if (sends) badges.srv.unshift({ text: t('bSends'), k: 'fill' });
    var a = s.iface.addr;
    var nodes = [
      { id: 'srv', kind: 'host', col: col.srv, row: 0, c: 1, mark: 'S', state: sends ? 'active' : null,
        lines: [{ text: 'demosrv1', kind: 'addr' }, a ? { text: '.' + a.ip.split('.')[3], kind: 'sub' } : { text: t('noAddr'), kind: 'role' }], badges: badges.srv },
      { id: 'cli', kind: 'host', col: col.cli, row: 0, c: 5, mark: 'C',
        lines: [{ text: 'democli1', kind: 'addr' }, { text: '.186', kind: 'sub' }], badges: badges.cli },
      { id: 'gw', kind: 'router', col: col.gw, row: 0, c: 4, mark: 'G',
        lines: [{ text: '.1', kind: 'addr' }, { text: t('gateway'), kind: 'role' }, { text: t('dnsRole'), kind: 'role' }], badges: badges.gw },
      { id: 'cloud', kind: 'cloud', col: col.cloud, row: 0, name: t('internet'),
        // a break after www. keeps the name readable in a narrow card
        lines: [{ text: '1.1.1.1', kind: 'sub' }, { text: 'www.\u200bexample.org', kind: 'sub' }, { text: '203.0.113.10', kind: 'sub' }], badges: badges.cloud }
    ];
    if (ghosts.length) nodes.push({ id: 'ghost', kind: 'host', col: col.ghost, row: 0, mark: '?', state: 'down', name: t('nobody'),
      lines: ghosts.map(function (ip) { return { text: '.' + ip.split('.')[3], kind: 'sub' }; }), badges: badges.ghost });
    var bus = ['srv', 'cli'].concat(ghosts.length ? ['ghost'] : [], ['gw']);
    var topo = Simdeck.topology({
      cols: cols.length, rows: ['auto', '4.2rem'], dir: c.dir, gap: '0.8cqw',
      nodes: nodes,
      links: [{ id: 'lan', bus: bus, row: 1 }, { id: 'wan', a: 'gw', b: 'cloud' }],
      packets: packets
    });
    return h('section', { class: 'rd-box rd-net', dataset: usedPlaces(s).link ? { here: '' } : {} },
      h('h3', null, t('lan'), data('192.168.122.0/24', 'rd-sub')), topo);
  }

  // ── the terminal ──
  function phaseChip(ph) {
    var mark = ph.result === 'ok' ? '✓' : ph.result === 'fail' ? '✕' : ph.result === 'info' ? 'ℹ' : '–';
    var icon = ph.place === 'link' ? h('span', { class: 'rd-link', 'aria-hidden': 'true' }, '⇄') : no(PLACE_NO[ph.place]);
    var word;
    if (ph.phase === 'read') word = [t('phRead'), ' ', t(ph.place === 'iface' ? 'legIface' : ph.place === 'route' ? 'legRoute' : 'legName')];
    else if (ph.phase === 'change') word = [t('phChange'), ' ', t(ph.place === 'route' ? 'legRoute' : 'legName')];
    else word = t(PH_WORD[ph.phase]);
    return h('span', { class: 'rd-phase', dataset: { r: ph.result } }, icon, h('span', null, word), h('b', null, mark));
  }
  function terminal(s, c) {
    var lines = [];
    var head = [h('h3', null, t('terminal'),
      s.exit != null ? h('span', { class: 'rd-exit', dataset: s.exit ? { bad: '' } : {} }, t('exit', { n: s.exit })) : null)];
    var phases = [];
    s.phases.forEach(function (ph, i) {
      if (i) phases.push(h('span', { class: 'rd-arrow', 'aria-hidden': 'true' }, '→'));
      phases.push(phaseChip(ph));
    });
    if (!s.cmd) lines.push(h('div', { class: 'rd-empty' }, t('noCmd')));
    else {
      s.text.forEach(function (ln) {
        lines.push(h('div', { class: 'rd-cmd', translate: 'no' }, h('span', { class: 'rd-prompt' }, '[student@demosrv1 ~]$ '),
          h('span', { class: 'rd-hl' + hl(true, c) }, ln)));
      });
      s.out.forEach(function (ln) {
        var err = /unreachable|failure|not known|Error/.test(ln);
        lines.push(h('div', { translate: 'no', class: err ? 'rd-err' : null }, ln));
      });
      if (!s.out.length) lines.push(h('div', { class: 'rd-empty' }, t('noOut')));
    }
    return h('section', { class: 'rd-box rd-term' }, head, h('div', { class: 'rd-phases' }, phases),
      h('div', { class: 'rd-screen', 'aria-live': 'off' }, lines));
  }

  // ── captions ──
  function rowName(s, i) { return data(prefixText(s.routes[i])); }
  function rungParts(s) {
    if (s.event.rung === 'address') return [' ', t('cRungAddress')];
    if (s.event.rung === 'route') return [' ', t('cRungRoute')];
    return [];
  }
  function nameCaption(s) {
    var nm = s.name, v = { name: code(nm.name), ip: b(data(nm.ip || '')), src: code(s.text[0].split(' ').slice(0, 2).join(' ')) };
    if (nm.from === 'files') return tp(s.iface.addr ? 'cFiles' : 'cFilesNoAddr', v);
    if (nm.from) return tp('cDns', Object.assign(v, { ns: data(nm.dns.ns) }));
    var dns = nm.trace.filter(function (x) { return x.src === 'dns'; })[0];
    if (dns && dns.result === 'unavail') {
      if (dns.why === 'noroute') return [].concat(tp('cNoRouteNs', Object.assign(v, { ns: data(dns.ns) })), rungParts(s));
      return tp('cTimeout', Object.assign(v, { ns: data(dns.ns) }));
    }
    return tp('cNotFound', v);
  }
  function caption(c) {
    var s = c.state, p = c.params, ev = s.event;
    if (!s.cmd) {
      if (s.broke === 'none') return t('cStart');
      var what = s.broke === 'address' ? t('whatAddress') : s.broke === 'route' ? t('whatRoute')
        : s.broke === 'resolver' ? tp('whatResolver', { ns: data(L.BAD_NS) }) : tp('whatHosts', { line: data(L.STALE.ip + ' ' + L.STALE.names[0]) });
      return tp('cStartBroken', { what: h('span', null, what) });
    }
    switch (ev.kind) {
      case 'addr':
        return s.iface.addr ? tp('cAddrOk', { dev: code(s.iface.name), addr: b(data(s.iface.addr.ip + '/' + s.iface.addr.prefix)), len: data(s.iface.addr.prefix) })
          : t('cAddrNone');
      case 'routes': {
        var hasDef = s.routes.some(function (r) { return r.prefix === 0; });
        if (!s.routes.length) return t('cRoutesEmpty');
        if (!hasDef) return tp('cRoutesNoDefault', { net: data(prefixText(s.routes[0])) });
        return tp('cRoutesOk', { n: s.routes.length, gw: data(L.GW) });
      }
      case 'routeGet': {
        if (!s.route.ok) return [].concat(tp('cGetNone', { dst: b(data(s.dest)) }), rungParts(s));
        var k = s.lookup.matches.length;
        var v = { dst: b(data(s.dest)), k: t.n('kRows', k), win: b(rowName(s, s.lookup.winner)), via: b(data(s.route.via || '')), src: data(s.route.src) };
        if (k === 1 && !s.route.via) return tp('cGetLinkOne', v);
        if (k === 1 && s.routes[s.lookup.winner].prefix === 0) return tp('cGetViaOne', v);
        return tp(s.route.via ? 'cGetVia' : 'cGetLink', v);
      }
      case 'getent':
        return nameCaption(s);
      case 'ping': {
        var ph = {};
        s.phases.forEach(function (x) { ph[x.phase] = x.result; });
        if (ph.name === 'fail') {
          var dn = s.name.trace.filter(function (x) { return x.src === 'dns'; })[0];
          if (dn && dn.why === 'noroute') return [].concat(tp('cPingNoNameRoute', { name: code(s.name.name), ns: data(dn.ns) }), rungParts(s));
          var why = dn && dn.result === 'unavail' ? tp('whyTimeout', { ns: data(dn.ns) }) : t('whyNotFound');
          return tp('cPingNoName', { name: code(s.name.name), why: h('span', null, why) });
        }
        if (ph.route === 'fail') {
          if (s.name && s.iface.addr) return tp('cPingNoRoute', { name: code(s.name.name), ip: data(s.dest), rl: h('i', { lang: 'en' }, t('termRL')) });
          return [].concat(tp('cPingNoRouteAddr', { ip: b(data(s.dest)) }), rungParts(s));
        }
        var how = s.packet.via ? tp('howVia', { via: data(s.packet.via) }) : t('howLink');
        if (ph.link === 'fail') {
          var out = tp('cPingNoReply', { hop: b(data(s.packet.hop)) });
          if (s.name && s.name.from === 'files' && s.name.ip === L.STALE.ip) out = out.concat(' ', tp('cPingStale', { ip: data(s.name.ip) }));
          return out;
        }
        if (s.name) return tp('cPingOk', { target: code(s.name.name), ip: data(s.dest), how: h('span', null, how) });
        return tp('cPingOkAddr', { ip: data(s.dest), how: h('span', null, how) });
      }
      case 'nsswitch': return t(L.faults(s).indexOf('hosts') >= 0 ? 'cNsswitch' : 'cNsswitchPlain');
      case 'resolv': return tp('cResolv', { ns: b(data(s.resolv.nameserver)) });
      case 'hostsDel': return t(ev.removed ? 'cHostsDel' : 'cHostsDelNone');
      case 'routeAdd': {
        var cmd = s.cmd;
        if (s.exit) return [].concat(tp('cRouteAddFail', { via: b(data(cmd.via)) }), rungParts(s));
        return tp('cRouteAdd', { dst: b(data(cmd.dst + '/' + cmd.prefix)), via: data(cmd.via) });
      }
      case 'dnsFix': {
        var res = tp('cDnsFix', { ns: b(data(s.resolv.nameserver)) });
        if (has(s, 'iface')) res = res.concat(' ', t('cDnsFixAll'));
        else if (has(s, 'routes')) res = res.concat(' ', t('cDnsFixRoute'));
        return res;
      }
    }
    return '';
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'rd' },
      h('div', { class: 'rd-places' }, ifaceBox(s, c), routeTable(s, c), namesBox(s, c)),
      h('div', { class: 'rd-low' }, netBox(s, c), terminal(s, c))));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'script', type: 'select', label: t('script'), resets: true,
        options: [['healthy', t('pHealthy')], ['stale-hosts', t('pStale')], ['no-default', t('pNoDefault')],
          ['no-address', t('pNoAddress')], ['bad-resolver', t('pBadResolver')], ['longest-prefix', t('pLongest')]] },
      { key: 'break', type: 'choice', label: t('brk'), hint: t('brkHint'),
        options: [['none', t('brkNone')], ['address', t('brkAddress')], ['route', t('brkRoute')], ['resolver', t('brkResolver')], ['hosts', t('brkHosts')]] },
      { key: 'target', type: 'choice', label: t('target'), options: [['by-name', t('byName')], ['by-address', t('byAddress')]] }
    ],

    presets: [
      { id: 'healthy', label: t('pHealthy'), params: { script: 'healthy', break: 'none' } },
      { id: 'stale-hosts', label: t('pStale'), params: { script: 'stale-hosts', break: 'hosts' } },
      { id: 'no-default', label: t('pNoDefault'), params: { script: 'no-default', break: 'route' } },
      { id: 'no-address', label: t('pNoAddress'), params: { script: 'no-address', break: 'address' } },
      { id: 'bad-resolver', label: t('pBadResolver'), params: { script: 'bad-resolver', break: 'resolver' } },
      { id: 'longest-prefix', label: t('pLongest'), params: { script: 'longest-prefix', break: 'none' } }
    ],

    legend: [
      { shape: 'rd-1', label: t('legIface') },
      { shape: 'rd-2', label: t('legRoute') },
      { shape: 'rd-3', label: t('legName') },
      { shape: 'rd-ph', label: t('legPhase') },
      { shape: 'rt-win', label: t('legWin') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
