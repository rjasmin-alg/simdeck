     centre; the disc (krug) is the circle with its inside; a point is inside, on or outside by comparing |ST| with r;
     the compass carries a length, which is how a rectangle or a square with given sides is constructed. An explorer:
     the question, the step or the answer on top, the squared paper below (drag S, T and the compass's pencil). The
     geometry is paper.js (the squared-paper model of catalogue §5.27, copied from geo-lines) and logic.compass in
     sim.js; the header's audience switch is Simdeck.paperColumns.audience (docs/sim-ui.md §14). Rules: SPEC.md. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // the sheet with a margin of 0.6 × 0.3 (keeps 2 : 1), so a circle touching the edge of the sheet is drawn whole
  var VIEW = { x0: -0.6, y0: -0.3, x1: L.W + 0.6, y1: L.H + 0.3 };

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function norm(v) { var l = Math.hypot(v[0], v[1]); return l ? [v[0] / l, v[1] / l] : [1, 0]; }
  function add(a, v, s) { return [a[0] + v[0] * s, a[1] + v[1] * s]; }
  function cm(n) { return t('cmFmt', { n: n }); }
  function lenText(d) {
    if (d.exact) return t('lenCm', { cm: d.cm });
    return d.mm ? t('lenAbout', { cm: d.cm, mm: d.mm }) : t('lenAboutCm', { cm: d.cm });
  }
  /** The pencil after k twelfths of a turn (anticlockwise from the right). */
  function pencilAt(s, k) {
    var a = 2 * Math.PI * k / L.TURN;
    return [s.s[0] + s.r * Math.cos(a), s.s[1] + s.r * Math.sin(a)];
  }

  // ── the paper: paper coordinates (y up) to the SVG (y down) and to % for the HTML labels ──
  function Paper(grid) {
    var view = VIEW, w = view.x1 - view.x0, hh = view.y1 - view.y0;
    var el = svg('svg', { viewBox: view.x0 + ' ' + (-view.y1) + ' ' + w + ' ' + hh, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var labs = [];
    var api = {
      el: el, labs: labs,
      line: function (a, b, cls) { el.append(svg('line', { class: cls, x1: a[0], y1: -a[1], x2: b[0], y2: -b[1] })); },
      poly: function (pts, cls) {
        el.append(svg('polygon', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      path: function (pts, cls) {
        el.append(svg('polyline', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      circle: function (c, r, cls) { el.append(svg('circle', { class: cls, cx: c[0], cy: -c[1], r: r })); },
      /** An arc of the circle (c, r) from angle a0 to a1 (radians, anticlockwise on the paper). */
      arc: function (c, r, a0, a1, cls) {
        var p0 = [c[0] + r * Math.cos(a0), c[1] + r * Math.sin(a0)], p1 = [c[0] + r * Math.cos(a1), c[1] + r * Math.sin(a1)];
        var large = a1 - a0 > Math.PI ? 1 : 0;
        // y is flipped, so anticlockwise on the paper is sweep-flag 0 in the SVG
        el.append(svg('path', { class: cls, d: 'M' + p0[0] + ' ' + (-p0[1]) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p1[0] + ' ' + (-p1[1]) }));
      },
      dot: function (p, attrs, size) {
        var c = svg('circle', { class: 'gc-pt', cx: p[0], cy: -p[1], r: size || 0.24 });
        Object.keys(attrs || {}).forEach(function (k) { c.setAttribute(k, attrs[k]); });
        el.append(c);
      },
      /** An HTML label at a point of the paper, shifted by (dx, dy) in rem (y down). */
      lab: function (p, text, dx, dy, data) {
        var left = Math.min(97, Math.max(3, (p[0] - view.x0) / w * 100)), top = Math.min(96, Math.max(4, (view.y1 - p[1]) / hh * 100));
        labs.push(h('span', { class: 'gc-lab', translate: 'no', dataset: data || {},
          style: { left: 'calc(' + left.toFixed(3) + '% + ' + (dx || 0) + 'rem)', top: 'calc(' + top.toFixed(3) + '% + ' + (dy || 0) + 'rem)' } }, text));
      },
      rightAngle: function (at, d1, d2) {
        var a = 0.6, e1 = norm(d1), e2 = norm(d2);
        api.path([add(at, e1, a), add(add(at, e1, a), e2, a), add(at, e2, a)], 'gc-rt');
      },
      /** The compass from above: the needle in `needle`, the pencil in `pencil`, the hinge to the left of the way. */
      compass: function (needle, pencil) {
        var d = [pencil[0] - needle[0], pencil[1] - needle[1]], len = Math.hypot(d[0], d[1]);
        var e = norm(d), n = [-e[1], e[0]], up = Math.max(1.2, 0.45 * len);
        var hinge = add(add(needle, d, 0.5), n, up);
        // the hinge and its handle stay on the paper: on the other side when this one would leave it
        var top = add(hinge, n, 0.9);
        if (top[0] < 0 || top[0] > L.W || top[1] < 0 || top[1] > L.H) { n = [-n[0], -n[1]]; hinge = add(add(needle, d, 0.5), n, up); }
        api.line(needle, hinge, 'gc-leg');
        api.line(hinge, pencil, 'gc-leg');
        el.append(svg('circle', { class: 'gc-hinge', cx: hinge[0], cy: -hinge[1], r: 0.32 }));
        api.line(hinge, add(hinge, n, 0.9), 'gc-leg'); // the handle
        el.append(svg('circle', { class: 'gc-tip', cx: pencil[0], cy: -pencil[1], r: 0.2 }));
      },
      /** A ruler from a to b (paper units), on the side `side` (a unit vector), with a tick each cm counted from a. */
      ruler: function (a, b, side, numbers) {
        var e = norm([b[0] - a[0], b[1] - a[1]]), len = Math.hypot(b[0] - a[0], b[1] - a[1]);
        var o = add(a, e, -0.6), q = add(b, e, 0.6);
        api.poly([o, q, add(q, side, 1), add(o, side, 1)], 'gc-ruler');
        for (var i = 0; i <= len + 1e-9; i++) {
          var tk = add(a, e, i);
          api.line(tk, add(tk, side, i % 5 === 0 ? 0.45 : 0.28), 'gc-tick');
        }
        (numbers || []).forEach(function (i) { api.lab(add(add(a, e, i), side, 0.72), String(i), 0, 0, { len: '' }); });
      }
    };
    if (grid) {
      for (var x = 0; x <= L.W; x++) api.line([x, 0], [x, L.H], 'gc-grid');
      for (var y = 0; y <= L.H; y++) api.line([0, y], [L.W, y], 'gc-grid');
    }
    return api;
  }

  // ── the top box ──
  function verdict(ok, text) {
    return h('span', { class: 'gc-verdict', dataset: { ok: ok ? 'yes' : 'no' } }, h('span', { 'aria-hidden': 'true' }, ok ? '✓' : '✗'), h('span', null, text));
  }
  /** The answer itself: neither right nor wrong, so no ✓ / ✗ and no red. */
  function answer(key, val) {
    return h('span', { class: 'gc-verdict', dataset: { ok: 'ans' } }, h('span', { class: 'gc-k' }, key), h('span', null, val));
  }
  function sideBtn(label, title, run, kbd) {
    return noFocus(h('button', { type: 'button', class: 'sd-btn gc-sidebtn', title: title, 'aria-keyshortcuts': kbd ? kbd.toLowerCase() : null,
      onclick: run }, label, kbd ? ' ' : '', kbd ? h('kbd', null, kbd) : ''));
  }
  function guessBtn(g, label) {
    return noFocus(h('button', { type: 'button', class: 'sd-btn sd-btn--primary gc-guess', onclick: function () { sim.set({ guess: g, hide: false }); } }, label));
  }

  function topCircle(s) {
    var r = cm(s.r);
    var say = s.closed ? t('cirSayDone', { r: r }) : s.sweep === 0 ? t('cirSay0', { r: r }) : t('cirSay', { r: r });
    var side = [];
    if (s.closed) {
      side.push(noFocus(h('button', { type: 'button', class: 'sd-btn gc-sidebtn', 'aria-pressed': String(s.fill),
        onclick: function () { sim.set({ fill: !s.fill }); } }, (s.fill ? '☑ ' : '☐ ') + t('fill'))));
    }
    return [h('div', { class: 'gc-col' }, h('div', { class: 'gc-say' }, say), h('div', { class: 'gc-sub' }, t('cirSub', { r: r }))), h('div', { class: 'gc-side' }, side)];
  }
  function whereText(s) { return t(s.centre ? 'ptCentre' : s.where === 'in' ? 'ptIn' : s.where === 'on' ? 'ptOn' : 'ptOut'); }
  function cmpText(s) {
    var v = { d: lenText(s.dist), r: cm(s.r) };
    return t(s.where === 'in' ? 'cmpLess' : s.where === 'on' ? 'cmpEq' : 'cmpMore', v);
  }
  function topPoint(s) {
    var col = [], side = [];
    if (s.hide) {
      col.push(h('div', { class: 'gc-say' }, t('ask_q_' + s.ask)), h('div', { class: 'gc-sub', translate: 'no' }, 'r = ' + cm(s.r)));
      side.push(guessBtn('yes', t('gYes')), guessBtn('no', t('gNo')),
        sideBtn(t('reveal'), t('revealKey') + ' (V)', function () { sim.set({ hide: false }); }, 'V'));
    } else {
      col.push(h('div', { class: 'gc-say' }, whereText(s)), h('div', { class: 'gc-sub' }, cmpText(s)));
      if (s.guess) {
        side.push(verdict(s.right, t('guessWas', { g: t(s.guess === 'yes' ? 'gYes' : 'gNo') }) + ' · ' + t(s.right ? 'gRight' : 'gWrong')));
      }
      side.push(answer(t('toCircle'), t(s.inCircle ? 'yes' : 'no')), answer(t('toDisc'), t(s.inDisc ? 'yes' : 'no')));
      if (audience === 'teacher') side.push(sideBtn(t('hide'), t('hideHint'), function () { sim.set({ hide: true, guess: '' }); }, 'V'));
    }
    return [h('div', { class: 'gc-col' }, col), h('div', { class: 'gc-side' }, side)];
  }
  function stepKey(s) { return s.stepId === 'takeB' && s.shape === 'square' ? 'bs_takeB_sq' : 'bs_' + s.stepId; }
  function topBuild(s) {
    var say = [h('span', { class: 'gc-step' }, t('bStep', { n: s.step + 1, of: L.LAST + 1 })), t(stepKey(s))];
    var sub = s.shape === 'square' ? t('bTask_square', { a: cm(s.a) }) : t('bTask_rect', { a: cm(s.a), b: cm(s.b) });
    var side = [];
    if (s.last) side.push(verdict(true, t('bCheck')));
    side.push(sideBtn('◀ ' + t('back'), t('back'), function () { sim.set({ step: Math.max(0, s.step - 1) }); }));
    side.push(sideBtn(t('next') + ' ▶', t('next'), function () { sim.set({ step: Math.min(L.LAST, s.step + 1) }); }));
    return [h('div', { class: 'gc-col' }, h('div', { class: 'gc-say' }, say), h('div', { class: 'gc-sub' }, sub)), h('div', { class: 'gc-side' }, side)];
  }

  // ── the paper, per mode ──
  function drawCircle(s, pp) {
    var S = s.s, r = s.r;
    if (s.fill) pp.circle(S, r, 'gc-disc');
    // the pencil's marks so far and (not for a child) the radius to each: all the same length
    var n = Math.min(s.marks, L.TURN);
    if (audience !== 'child') for (var i = 0; i < n; i++) pp.line(S, pencilAt(s, i), 'gc-spoke');
    if (s.closed) pp.circle(S, r, 'gc-circle');
    else if (s.sweep > 0) pp.arc(S, r, 0, 2 * Math.PI * s.sweep / L.TURN, 'gc-circle');
    for (var j = 0; j < n; j++) { var m = pencilAt(s, j); pp.circle(m, 0.16, 'gc-mark'); }
    var P0 = pencilAt(s, s.sweep);
    // the compass open on the ruler before it turns
    if (s.sweep === 0) pp.ruler(S, [S[0] + r, S[1]], [0, -1], [0, r]);
    pp.line(S, P0, 'gc-radius');
    var e = norm([P0[0] - S[0], P0[1] - S[1]]);
    // the radius named beside it (at the start above it: the ruler is below)
    var side = s.sweep === 0 ? [-e[1], e[0]] : [e[1], -e[0]];
    pp.lab(add(add(S, e, r / 2), side, 0.7), 'r = ' + cm(r), 0, 0, { len: '' });
    pp.compass(S, P0);
    pp.dot(S);
    pp.lab(S, 'S', -1.1, s.sweep === 0 ? -0.9 : 0.9);
    if (s.closed) {
      pp.lab(add(S, norm([-1, 1]), r + 0.8), 'k', 0, 0, { c: '1', big: '' });
      if (s.fill && r >= 2) pp.lab([S[0], S[1] - r * 0.55], t('wDisc'), 0, 0, { word: '' });
    }
  }

  function drawPoint(s, pp) {
    var S = s.s, r = s.r, T = s.t;
    pp.circle(S, r, 'gc-disc');
    pp.circle(S, r, 'gc-circle');
    pp.lab(add(S, norm([-1, 1]), r + 0.8), 'k', 0, 0, { c: '1', big: '' });
    if (r >= 2) pp.lab([S[0], S[1] - r * 0.6], t('wDisc'), 0, 0, { word: '' });
    if (s.hide || s.centre) {
      // the radius to the right: r, without giving the answer away
      var K0 = [S[0] + r, S[1]];
      pp.line(S, K0, 'gc-radius');
      pp.lab(add(S, [1, 0], r / 2), 'r', 0, -0.9, { len: '' });
    } else {
      // the compass laid from S towards T: its pencil K is r from S; T is before K, at K or past it
      var e = norm([T[0] - S[0], T[1] - S[1]]), K = add(S, e, r), nrm = [-e[1], e[0]];
      pp.line(S, T, 'gc-st');
      if (s.where !== 'on') pp.line(K, T, 'gc-miss');
      pp.compass(S, K);
      pp.lab(add(add(S, e, Math.min(r, Math.sqrt(s.d2)) / 2), nrm, -0.8), 'r', 0, 0, { len: '' });
      if (s.where === 'out' && s.miss < 10) pp.lab(add(T, e, 1.5), t('mmFmt', { n: s.miss }), 0, 0, { bad: '' }); // past T, off the names
    }
    // S and T named beside the way from S to T (on its right), so the names stay off the radius and the miss
    var w = s.centre ? [1, 0] : norm([T[0] - S[0], T[1] - S[1]]);
    pp.dot(S);
    pp.lab(S, 'S', s.centre ? -1.1 : w[1] * 1.1, s.centre ? 0.9 : w[0] * 1.1);
    pp.dot(T, { 'data-t': '' });
    pp.lab(T, 'T', s.centre ? 1.1 : w[1] * 1.1, s.centre ? 0.9 : w[0] * 1.1, { c: '2' });
  }

  function drawBuild(s, pp) {
    var A = s.A, B = s.B, C = s.C, D = s.D;
    // the given segments, with their lengths
    var ga = s.given.a, gb = s.given.b;
    pp.lab([ga[0][0] - 1.6, ga[0][1]], t('wGiven') + ':', 0, 0, { word: '' });
    [[ga, 'a', s.a], [gb, 'b', s.b]].forEach(function (g) {
      if (!g[0]) return;
      var p = g[0];
      pp.line(p[0], p[1], 'gc-given');
      pp.line([p[0][0], p[0][1] - 0.3], [p[0][0], p[0][1] + 0.3], 'gc-given');
      pp.line([p[1][0], p[1][1] - 0.3], [p[1][0], p[1][1] + 0.3], 'gc-given');
      pp.lab([(p[0][0] + p[1][0]) / 2, p[0][1]], g[1] + ' = ' + cm(g[2]), 0, -0.85, { c: '3' });
    });
    if (s.sides) pp.poly([A, B, C, D], 'gc-rect');
    if (s.line) {
      pp.line([0.4, A[1]], [L.W - 0.4, A[1]], 'gc-line');
      pp.lab([L.W - 0.9, A[1]], 'p', 0, -0.9, { big: '' });
    }
    if (s.perps) {
      var top = A[1] + s.b + 1.6;
      pp.line([A[0], A[1] - 1], [A[0], top], 'gc-line');
      pp.line([B[0], B[1] - 1], [B[0], top], 'gc-line');
      pp.rightAngle(A, [1, 0], [0, 1]);
      pp.rightAngle(B, [-1, 0], [0, 1]);
    }
    s.arcs.forEach(function (arc) {
      var a = Math.atan2(arc.at[1] - arc.c[1], arc.at[0] - arc.c[0]), w = Math.min(0.5, 1.4 / arc.r);
      pp.arc(arc.c, arc.r, a - w, a + w, 'gc-arc');
    });
    if (s.square) {
      // the set square: one leg on p, the right angle at B, the other leg up the perpendicular
      var up = Math.min(5, s.b + 1.5);
      pp.poly([B, [B[0] + 3, B[1]], [B[0], B[1] + up]], 'gc-sq');
      pp.lab([B[0] + 1, B[1] + up / 3], t('wSquare'), 0, 0, { word: '' });
    }
    if (s.ruler === 'p') { pp.ruler([0.8, A[1] - 0.15], [Math.max(A[0] + s.a + 2, 10), A[1] - 0.15], [0, -1]); pp.lab([6, A[1] - 1.5], t('wRuler'), 0, 0, { word: '' }); }
    if (s.sides) {
      pp.lab([(A[0] + B[0]) / 2, A[1]], 'a', 0, 0.9, { c: '3' });
      pp.lab([A[0], (A[1] + D[1]) / 2], s.shape === 'square' ? 'a' : 'b', -0.9, 0, { c: '3' });
    }
    if (s.compass) pp.compass(s.compass.needle, s.compass.pencil);
    var names = { A: [A, -0.9, 0.9], B: [B, 0.9, 0.9], C: [C, 0.9, -0.9], D: [D, -0.9, -0.9] };
    s.pts.forEach(function (k) { var nm = names[k]; pp.dot(nm[0]); pp.lab(nm[0], k, nm[1], nm[2]); });
  }

  function render(c) {
    var s = c.state;
    var pp = Paper(s.mode !== 'build');
    var top, label;
    if (s.mode === 'circle') {
      drawCircle(s, pp);
      top = topCircle(s);
      label = t('cirLabel', { r: cm(s.r), k: s.sweep });
    } else if (s.mode === 'point') {
      drawPoint(s, pp);
      top = topPoint(s);
      label = t('ptLabel', { r: cm(s.r), verdict: s.hide ? '?' : whereText(s) });
    } else {
      drawBuild(s, pp);
      top = topBuild(s);
      label = t('bLabel', { step: t(stepKey(s)) });
    }
    var field = h('div', { class: 'gc-field', role: 'img', title: s.mode === 'build' ? null : t('dragHint'), 'aria-label': label,
      dataset: s.mode === 'build' ? {} : { drag: '' } }, [pp.el].concat(pp.labs));
    c.stage.replaceChildren(h('div', { class: 'gc', dataset: { aud: audience, mode: s.mode } },
      h('section', { class: 'gc-box gc-top' }, top),
      h('section', { class: 'gc-box gc-paperbox' }, h('div', { class: 'gc-wrap' }, field))));
  }

  // ── captions (SPEC, Legend and captions) ──
  function caption(c) {
    var s = c.state, A = audience;
    var out = [];
    function put(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function putHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    var r = cm(s.r);
    if (s.mode === 'circle') {
      if (A === 'child') { put(t(s.closed ? 'cCirDoneC' : s.sweep === 0 ? 'cCir0C' : 'cCirC')); return out; }
      if (s.sweep === 0) put(t('cCir0', { r: r }));
      else if (!s.closed) put(t('cCir', { r: r }));
      else {
        put(t('cCirDone', { r: r }));
        put(t(s.fill ? 'cCirDisc' : 'cCirNoDisc'));
      }
      if (A === 'adult') put(t('whyCircle'));
      return out;
    }
    if (s.mode === 'point') {
      if (s.hide) { put(t(A === 'child' ? 'cAskC' : 'cAsk')); return out; }
      if (A === 'child') { put(t(s.where === 'in' ? 'cInC' : s.where === 'on' ? 'cOnC' : 'cOutC')); return out; }
      if (s.right === false) {
        if (s.ask === 'circle' && s.where === 'in') putHl(t('cMistIn'));
        else if (s.ask === 'circle' && s.where === 'out') putHl(t('cMistNear'));
        else if (s.ask === 'circle' && s.where === 'on') putHl(t('cMistSlant', { r: r }));
        else if (s.ask === 'disc' && s.where === 'on') putHl(t('cMistEdge'));
        else if (s.ask === 'disc' && s.where === 'in') putHl(t('cMistDiscIn'));
        else if (s.ask === 'disc' && s.where === 'out') putHl(t('cMistDiscOut'));
      }
      put(t(s.centre ? 'cCentre' : s.where === 'in' ? 'cIn' : s.where === 'on' ? 'cOn' : 'cOut'));
      if (s.where === 'out' && s.miss < 10) put(t('cMiss', { mm: t('mmFmt', { n: s.miss }) }));
      if (A === 'adult') put(t('whyPoint'));
      return out;
    }
    if (A === 'child') { put(t(s.last ? 'cbDoneC' : 'cbC')); return out; }
    var key = s.stepId === 'takeB' && s.shape === 'square' ? 'cb_takeB_sq' : s.stepId === 'join' ? 'cb_join_' + s.shape : 'cb_' + s.stepId;
    put(t(key));
    if (A === 'adult') put(t('whyBuild'));
    return out;
  }

  // ── the header: the audience switch ──
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  var isMode = function (m) { return function (prm) { return prm.mode === m; }; };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      // the points: dragged on the paper or set by the presets; here so the URL carries them
      { key: 'sx', type: 'range', label: 'S x', value: L.defaults.sx, min: 0, max: L.W, visible: hidden },
      { key: 'sy', type: 'range', label: 'S y', value: L.defaults.sy, min: 0, max: L.H, visible: hidden },
      { key: 'tx', type: 'range', label: 'T x', value: L.defaults.tx, min: 0, max: L.W, visible: hidden },
      { key: 'ty', type: 'range', label: 'T y', value: L.defaults.ty, min: 0, max: L.H, visible: hidden },
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, options: L.MODES.map(function (m) { return [m, t('mode_' + m)]; }) },
      { key: 'r', type: 'range', label: t('r'), value: L.defaults.r, min: L.R_MIN, max: L.R_MAX, format: cm,
        visible: function (prm) { return prm.mode !== 'build'; } },
      { key: 'sweep', type: 'range', label: t('sweep'), value: L.defaults.sweep, min: 0, max: L.TURN, format: function () { return ''; },
        visible: isMode('circle') },
      // colouring the disc: the stage's button (once the circle is closed); here so the URL and the presets carry it
      { key: 'fill', type: 'toggle', label: t('fill'), value: L.defaults.fill, visible: hidden },
      { key: 'ask', type: 'choice', label: t('ask'), value: L.defaults.ask, options: L.ASKS.map(function (a) { return [a, t('ask_' + a)]; }),
        visible: function (prm) { return prm.mode === 'point' && audience === 'teacher'; } },
      { key: 'a', type: 'range', label: t('a'), value: L.defaults.a, min: L.A_MIN, max: L.A_MAX, format: cm, visible: isMode('build') },
      { key: 'b', type: 'range', label: t('b'), value: L.defaults.b, min: L.B_MIN, max: L.B_MAX, format: cm, visible: isMode('build') },
      // the construction's step: the stage's Back / Next buttons; here so the URL and the presets carry it
      { key: 'step', type: 'range', label: t('step'), value: L.defaults.step, min: 0, max: L.LAST, visible: hidden },
      // asking first: the stage's buttons and V open and close it; here so the URL and the presets carry it
      { key: 'hide', type: 'toggle', label: t('hide'), value: L.defaults.hide, visible: hidden },
      { key: 'guess', type: 'select', label: t('guessWas', { g: '' }), value: L.defaults.guess, visible: hidden,
        options: [['', '–'], ['yes', t('gYes')], ['no', t('gNo')]] }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'v', label: t('revealKey'), run: function (sm) {
        if (sm.state.mode !== 'point') return; // only a point is asked about
        sm.set(sm.params.hide ? { hide: false } : { hide: true, guess: '' });
      } }
    ],

    legend: [
      { c: 1, shape: 'line', label: t('legCircle') },
      { c: 1, shape: 'round', label: t('legDisc') },
      { shape: 'dash', label: t('legRadius') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows (clamped values written back), and forget the class's answer when the
  // picture changes under it
  var POS = ['mode', 'r', 'sx', 'sy', 'tx', 'ty', 'ask'];
  var sig = null;
  sim.on(function (c) {
    var s = c.state, p = c.params, fix = {};
    if (s.s && (p.sx !== s.s[0] || p.sy !== s.s[1])) { fix.sx = s.s[0]; fix.sy = s.s[1]; }
    var now = POS.map(function (k) { return String(p[k]); }).join('|');
    if (sig !== null && now !== sig && p.guess) fix.guess = '';
    sig = now;
    if (Object.keys(fix).length) sim.set(fix);
  });

  // ── dragging S, T and the compass's pencil; a click on empty paper moves T (mode point) ──
  var drag = null;
  function paperXY(e) {
    var f = document.querySelector('[data-sim="geo-compass"] .gc-field');
    if (!f) return null;
    var r = f.getBoundingClientRect();
    return [VIEW.x0 + (e.clientX - r.left) / r.width * (VIEW.x1 - VIEW.x0), VIEW.y1 - (e.clientY - r.top) / r.height * (VIEW.y1 - VIEW.y0)];
  }
  function handles(s) {
    if (s.mode === 'circle') return [['P', pencilAt(s, s.sweep)], ['S', s.s]];
    if (s.mode === 'point') return [['T', s.t], ['S', s.s]];
    return [];
  }
  function moveTo(key, xy) {
    var s = sim.state, patch = {};
    if (key === 'P') {
      var r = L.radiusAt(s.s, xy[0], xy[1]);
      if (r === sim.params.r) return;
      patch.r = r;
    } else {
      var c = L.cornerAt(xy[0], xy[1]), k = key.toLowerCase();
      if (sim.params[k + 'x'] === c[0] && sim.params[k + 'y'] === c[1]) return;
      patch[k + 'x'] = c[0]; patch[k + 'y'] = c[1];
    }
    sim.set(patch);
  }
  var stage = document.querySelector('[data-sd-stage]');
  stage.addEventListener('pointerdown', function (e) {
    if (!e.target.closest || !e.target.closest('.gc-field')) return;
    var s = sim.state;
    if (s.mode === 'build') return;
    var xy = paperXY(e);
    if (!xy) return;
    var best = null, bd = 0.9;
    handles(s).forEach(function (hd) {
      var d = Math.hypot(hd[1][0] - xy[0], hd[1][1] - xy[1]);
      if (d < bd) { bd = d; best = hd[0]; } // T is listed first, so it wins when T = S
    });
    drag = best || (s.mode === 'point' ? 'T' : null);
    if (!drag) return;
    moveTo(drag, xy);
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    e.preventDefault();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var xy = paperXY(e);
    if (xy) moveTo(drag, xy);
  });
  function end() { drag = null; }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
