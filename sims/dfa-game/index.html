<!-- DFA classroom game: adopted from single-page-labs/dfa-classroom-game.html into the simdeck kit (docs/sim-ui.md).
     A tool (lecturer-only): no steps. The game model is in sim.js, the words in strings.js; this page keeps the
     session (role, room, name) and passes the game between tabs of one browser over a broadcast channel, with the
     original's messages (STATE, JOIN_PLAYER, ACTION, REQUEST_STATE, HELLO). The session and the game are kept in
     sessionStorage so a language switch (which reloads the page) keeps them. -->
<html lang="hr" data-sim="dfa-game">

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">DFA igra za razred</h1>
      <p class="sd-subtitle"></p>
    </div>

    <div class="sd-tools" data-sd-tools></div>

  <main class="sd-main">

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings); // picks the language; every visible word goes through t
  var KEY = 'simdeck.dfa-game';
  var $ = function (id) { return document.getElementById(id); };
  var data = function (s, cls) { return h('span', { class: cls || 'dg-d', translate: 'no' }, String(s)); };

  // ---- session: this tab's id, name, role and room; the game. sessionStorage keeps them across the reload a language
  // switch does, and gives every tab its own id (the original kept the id in localStorage, which all tabs of a browser
  // share, so every tab had the same id and ignored the others' messages). It may be unavailable: then a fresh start.
  function stored() { try { return JSON.parse(sessionStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function newId() {
    try { return crypto.randomUUID(); } catch (e) { /* not a secure context */ }
    var a = new Uint32Array(4);
    try { crypto.getRandomValues(a); } catch (e) { a = [Date.now(), Math.random() * 1e9, performance.now() * 1e3, 7]; }
    return Array.prototype.map.call(a, function (x) { return (x >>> 0).toString(16); }).join('-');
  }
  var saved = stored();
  var client = {
    id: typeof saved.id === 'string' ? saved.id : newId(),
    name: typeof saved.name === 'string' ? saved.name : '',
    role: saved.role === 'presenter' || saved.role === 'player' ? saved.role : 'none',
    room: typeof saved.room === 'string' && saved.room ? saved.room : 'dfa-room',
    channel: null
  };
  var game;
  try { game = saved.game ? L.sanitize(saved.game) : L.empty(); } catch (e) { game = L.empty(); }
  var note = null; // a local message for the caption: [key, vars]
  var sim;

  function save() {
    try { sessionStorage.setItem(KEY, JSON.stringify({ id: client.id, name: client.name, role: client.role, room: client.room, game: game })); }
    catch (e) { /* unavailable */ }
  }

  function now() {
    return new Date().toLocaleTimeString(Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // ---- the channel between tabs: the original's protocol ----
  function connect() {
    if (client.channel) client.channel.close();
    client.channel = null;
    try {
      client.channel = new BroadcastChannel('dfa-game-' + client.room);
      client.channel.onmessage = function (e) { receive(e.data); };
    } catch (e) { /* no channel: the tab plays alone */ }
  }
  function send(type, payload) {
    if (!client.channel) return;
    try { client.channel.postMessage({ type: type, from: client.id, name: client.name, role: client.role, payload: payload || {}, ts: Date.now() }); }
    catch (e) { /* closed */ }
  }
  function broadcast() { if (client.role === 'presenter') send('STATE', game); }

  /** A model result: log its events with the time, keep it, tell the other tabs (presenter), redraw. */
  function commit(result, msg) {
    game = result.events && result.events.length ? L.record(result.game, result.events, now()) : result.game;
    note = msg || null;
    save();
    broadcast();
    sim.render();
  }

  function receive(msg) {
    if (!msg || msg.from === client.id) return;
    var name = typeof msg.name === 'string' && msg.name ? msg.name : t('defaultName');
    if (msg.type === 'HELLO' || msg.type === 'REQUEST_STATE') { broadcast(); return; }
    if (msg.type === 'STATE') {
      try { game = L.sanitize(msg.payload); } catch (e) { return; }
      note = null;
      save();
      sim.render();
      return;
    }
    if (client.role !== 'presenter') return;
    if (msg.type === 'JOIN_PLAYER') commit(L.join(game, msg.from, name));
    else if (msg.type === 'ACTION' && msg.payload && typeof msg.payload === 'object') commit(L.submit(game, msg.from, name, msg.payload));
  }

  // ---- form ----
  var room = $('dg-room'), myName = $('dg-name'), actionSel = $('dg-action'), fields = $('dg-fields');
  room.value = client.room;
  myName.value = client.name || t('defaultName');
  L.ACTIONS.forEach(function (a) { actionSel.append(h('option', { value: a }, t('act_' + a))); });
  L.TASKS.forEach(function (k) { $('dg-task-type').append(h('option', { value: k }, t('opt_' + k))); });
  $('dg-task-type').value = game.taskType;
  $('dg-target').value = game.target;
  $('dg-alphabet').value = game.alphabet.join(',');
  $('dg-players').value = String(game.expectedPlayers);
  $('dg-json').placeholder = t('jsonPlaceholder');
  if (client.role === 'presenter' && game.round === 0) $('dg-setup').open = true;

  function join(role) {
    client.room = room.value.trim() || 'dfa-room';
    room.value = client.room;
    client.name = myName.value.trim() || t(role === 'presenter' ? 'defaultPresenter' : 'defaultName');
    myName.value = client.name;
    client.role = role;
    connect();
    var msg = [role === 'presenter' ? 'note_joinedPresenter' : 'note_joinedPlayer', { room: client.room }];
    if (role === 'presenter') {
      var g = JSON.parse(JSON.stringify(game));
      g.presenterId = client.id;
      if (g.round === 0) $('dg-setup').open = true;
      commit({ game: g, events: [{ key: 'isPresenter', vars: { name: client.name } }] }, msg);
    } else {
      send('JOIN_PLAYER');
      send('REQUEST_STATE');
      commit({ game: game, events: [] }, msg);
    }
  }

  function presenterOnly() {
    if (client.role === 'presenter') return true;
    note = ['note_presenterOnly'];
    sim.render();
    return false;
  }

  // The move fields: rebuilt only when the action or the automaton's states or symbols change, so a name being typed
  // survives the other tabs' messages (the original rebuilt them on every message).
  var fieldsKey = '';
  function stateSelect(id, label) {
    var sel = h('select', { id: id, translate: 'no' }, game.dfa.states.map(function (s) { return h('option', { value: s }, s); }));
    return h('label', null, h('span', null, t(label)), sel);
  }
  function symbolSelect() {
    var syms = game.dfa.alphabet.length ? game.dfa.alphabet : game.alphabet;
    return h('label', null, h('span', null, t('symbol')),
      h('select', { id: 'dg-f-symbol', translate: 'no' }, syms.map(function (s) { return h('option', { value: s }, s); })));
  }
  function renderFields() {
    var type = actionSel.value;
    var key = JSON.stringify([type, game.dfa.states, game.dfa.alphabet, game.alphabet, Simdeck.lang]);
    if (key === fieldsKey) return;
    var keep = {};
    Array.prototype.forEach.call(fields.querySelectorAll('select'), function (s) { keep[s.id] = s.value; });
    fieldsKey = key;
    var out = [];
    if (type === 'ADD_STATE') out.push(h('label', null, h('span', null, t('stateName')), h('input', { id: 'dg-f-state', value: 'q' + game.dfa.states.length, maxlength: '12', autocomplete: 'off', translate: 'no' })));
    else if (type === 'ADD_SYMBOL') out.push(h('label', null, h('span', null, t('symbol')), h('input', { id: 'dg-f-sym', maxlength: '1', autocomplete: 'off', translate: 'no' })));
    else if (type === 'ADD_TRANSITION') out.push(stateSelect('dg-f-from', 'fromState'), symbolSelect(), stateSelect('dg-f-to', 'toState'));
    else if (type === 'REMOVE_TRANSITION') out.push(stateSelect('dg-f-from', 'fromState'), symbolSelect());
    else out.push(stateSelect('dg-f-state-sel', 'state'));
    fields.replaceChildren.apply(fields, out);
    Object.keys(keep).forEach(function (id) {
      var s = $(id);
      if (s && Array.prototype.some.call(s.options, function (o) { return o.value === keep[id]; })) s.value = keep[id];
    });
  }
  function readAction() {
    var type = actionSel.value;
    var v = function (id) { var e = $(id); return e ? e.value : ''; };
    if (type === 'ADD_STATE') return { type: type, state: v('dg-f-state').trim() };
    if (type === 'ADD_SYMBOL') return { type: type, symbol: v('dg-f-sym').trim() };
    if (type === 'ADD_TRANSITION') return { type: type, from: v('dg-f-from'), symbol: v('dg-f-symbol'), to: v('dg-f-to') };
    if (type === 'REMOVE_TRANSITION') return { type: type, from: v('dg-f-from'), symbol: v('dg-f-symbol') };
    return { type: type, state: v('dg-f-state-sel') };
  }

  function submitMove() {
    if (client.role === 'none') { note = ['note_connectFirst']; sim.render(); return; }
    if (game.round < 1) { note = ['note_notStarted']; sim.render(); return; }
    if (Object.prototype.hasOwnProperty.call(game.actions, client.id)) { note = ['note_alreadyPlayed']; sim.render(); return; }
    var action = readAction();
    if (L.NEEDS_STATE.indexOf(action.type) >= 0 && game.dfa.states.length === 0) { note = ['note_needState']; sim.render(); return; }
    if (client.role === 'presenter') { commit(L.submit(game, client.id, client.name, action)); return; }
    send('ACTION', action);
    var g = JSON.parse(JSON.stringify(game));
    g.actions[client.id] = { playerName: client.name, action: action };
    commit({ game: g, events: [{ key: 'sent', vars: { name: client.name, type: action.type } }] });
  }

  function startGame() {
    if (!presenterOnly()) return;
    var r = L.start(game, client.id, {
      taskType: $('dg-task-type').value, target: $('dg-target').value,
      alphabet: $('dg-alphabet').value, expectedPlayers: $('dg-players').value
    });
    if (r.error) { note = ['why_' + r.error]; sim.render(); return; }
    $('dg-alphabet').value = r.game.alphabet.join(',');
    $('dg-players').value = String(r.game.expectedPlayers);
    $('dg-setup').open = false;
    commit(r);
  }

  // Buttons never keep focus on click, as the kit's own (docs/sim-ui.md §3).
  Array.prototype.forEach.call(document.querySelectorAll('.dg-form .sd-btn'), function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });
  $('dg-join-presenter').addEventListener('click', function () { join('presenter'); });
  $('dg-join-player').addEventListener('click', function () { join('player'); });
  $('dg-submit').addEventListener('click', submitMove);
  actionSel.addEventListener('change', function () { renderFields(); sim.render(); });
  $('dg-start').addEventListener('click', startGame);
  $('dg-validate').addEventListener('click', function () { if (presenterOnly()) commit(L.check(game), ['note_validated']); });
  $('dg-layout').addEventListener('click', function () { if (presenterOnly()) commit(L.layout(game), ['note_layout']); });
  $('dg-clear').addEventListener('click', function () {
    if (presenterOnly() && window.confirm(t('confirmClear'))) commit(L.clear(game));
  });
  $('dg-export').addEventListener('click', function () { $('dg-json').value = JSON.stringify(game, null, 2); note = ['note_exported']; sim.render(); });
  $('dg-import').addEventListener('click', function () {
    var g;
    try { g = L.sanitize(JSON.parse($('dg-json').value)); } catch (e) { note = ['note_badJson']; sim.render(); return; }
    commit({ game: g, events: [{ key: 'imported', vars: {} }] });
  });

  // ---- stage ----
  var svgNs = 'http://www.w3.org/2000/svg';
  function s(tag, attrs, text) {
    var el = document.createElementNS(svgNs, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    if (text != null) el.textContent = text;
    return el;
  }
  var ui = null;
  function build(stage) {
    ui = {
      task: h('span'), pills: h('span', { class: 'dg-pills' }),
      round: h('span', { class: 'dg-val' }), progress: h('span', { class: 'dg-val' }),
      valid: h('span', { class: 'dg-val' }), counter: h('span', { class: 'dg-val', translate: 'no' }),
      players: h('div', { class: 'dg-players' }), tests: h('div', { class: 'dg-scroll' }), log: h('div', { class: 'dg-scroll' }),
      svg: s('svg', { role: 'img' }), graph: h('div', { class: 'dg-graph' })
    };
    ui.graph.append(ui.svg);
    var card = function (label, val) { return h('div', { class: 'dg-card' }, h('span', { class: 'dg-label' }, t(label)), val); };
    stage.replaceChildren(h('div', { class: 'dg' },
      h('div', { class: 'dg-task' }, h('span', { class: 'dg-label' }, t('task')), ui.task, ui.pills),
      ui.graph,
      h('div', { class: 'dg-side' },
        h('div', { class: 'dg-stats' }, card('round', ui.round), card('progress', ui.progress), card('validation', ui.valid), card('counter', ui.counter)),
        h('div', { class: 'dg-sec' }, h('h3', { class: 'dg-label' }, t('players')), ui.players),
        h('div', { class: 'dg-sec dg-tests-sec' }, h('h3', { class: 'dg-label' }, t('tests')), ui.tests),
        h('div', { class: 'dg-sec dg-log-sec' }, h('h3', { class: 'dg-label' }, t('log')), ui.log))));
    if (window.ResizeObserver) new ResizeObserver(function () { drawGraph(); }).observe(ui.graph);
    setupDrag();
  }

  function word(w) { return w === '' ? t('emptyWord') : w; }

  // The automaton, drawn 1:1 in CSS pixels (the viewBox is the box's own size) so its text is never scaled down;
  // positions live in the original's 900 × 640 space and are scaled to the box.
  var geo = { sx: 1, sy: 1 };
  function drawGraph() {
    if (!ui) return;
    var w = Math.max(1, ui.graph.clientWidth), hgt = Math.max(1, ui.graph.clientHeight);
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var sx = w / L.W, sy = hgt / L.H, k = Math.min(sx, sy);
    geo = { sx: sx, sy: sy };
    var R = Math.max(1.3 * rem, Math.min(2.6 * rem, 36 * k));
    var fs = Math.max(16, rem);
    var dfa = game.dfa;
    var svg = ui.svg;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + hgt);
    svg.setAttribute('aria-label', t('stage'));
    var out = [s('defs', {})];
    var mk = s('marker', { id: 'dg-arrow', markerWidth: 10, markerHeight: 10, refX: 9, refY: 3, orient: 'auto', markerUnits: 'strokeWidth' });
    mk.append(s('path', { d: 'M0,0 L0,6 L9,3 z', class: 'dg-arrowhead' }));
    out[0].append(mk);
    var P = function (st) { var p = dfa.positions[st] || { x: 100, y: 100 }; return { x: p.x * sx, y: p.y * sy }; };
    L.edges(dfa).forEach(function (e) {
      if (!dfa.positions[e.from] || !dfa.positions[e.to]) return;
      var a = P(e.from), b = P(e.to), label = e.symbols.join(',');
      if (e.from === e.to) {
        var q = R / 36;
        out.push(s('path', { class: 'dg-edge', 'marker-end': 'url(#dg-arrow)',
          d: 'M ' + (a.x - 22 * q) + ' ' + (a.y - 30 * q) + ' C ' + (a.x - 70 * q) + ' ' + (a.y - 95 * q) + ', ' + (a.x + 70 * q) + ' ' + (a.y - 95 * q) + ', ' + (a.x + 22 * q) + ' ' + (a.y - 30 * q) }));
        out.push(s('text', { class: 'dg-edgetext', x: a.x, y: Math.max(fs, a.y - 84 * q), 'text-anchor': 'middle', 'font-size': fs, translate: 'no' }, label));
        return;
      }
      var dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
      var x1 = a.x + dx / len * R, y1 = a.y + dy / len * R, x2 = b.x - dx / len * (R + 2), y2 = b.y - dy / len * (R + 2);
      var mx = (x1 + x2) / 2, my = (y1 + y2) / 2, curve = 30 * Math.max(0.8, k);
      var nx = -dy / len * curve, ny = dx / len * curve;
      out.push(s('path', { class: 'dg-edge', 'marker-end': 'url(#dg-arrow)', d: 'M ' + x1 + ' ' + y1 + ' Q ' + (mx + nx) + ' ' + (my + ny) + ' ' + x2 + ' ' + y2 }));
      out.push(s('text', { class: 'dg-edgetext', x: mx + nx, y: my + ny - 0.4 * fs, 'text-anchor': 'middle', 'font-size': fs, translate: 'no' }, label));
    });
    if (dfa.start && dfa.positions[dfa.start]) {
      var p = P(dfa.start);
      out.push(s('line', { class: 'dg-edge', 'marker-end': 'url(#dg-arrow)', x1: p.x - R - 2.6 * rem, y1: p.y, x2: p.x - R - 2, y2: p.y }));
      out.push(s('text', { class: 'dg-edgetext', x: p.x - R - 1.6 * rem, y: p.y - 0.6 * fs, 'text-anchor': 'middle', 'font-size': fs }, t('start')));
    }
    dfa.states.forEach(function (st) {
      var p = P(st), acc = dfa.accept.indexOf(st) >= 0;
      out.push(s('circle', { class: 'dg-node' + (acc ? ' is-accept' : ''), 'data-state': st, cx: p.x, cy: p.y, r: R }));
      if (acc) out.push(s('circle', { class: 'dg-inner', cx: p.x, cy: p.y, r: R - 0.3 * rem }));
      out.push(s('text', { class: 'dg-nodetext', x: p.x, y: p.y, 'font-size': fs * 1.1, translate: 'no' }, st));
    });
    if (!dfa.states.length) out.push(s('text', { class: 'dg-empty', x: w / 2, y: hgt / 2, 'font-size': fs * 1.1 }, t('noStates')));
    svg.replaceChildren.apply(svg, out);
  }

  // Drag a state (any tab; the presenter's positions are what the others see). The capture is on the svg, which stays.
  var dragging = null;
  function setupDrag() {
    var svg = ui.svg;
    svg.addEventListener('pointerdown', function (e) {
      var st = e.target && e.target.getAttribute && e.target.getAttribute('data-state');
      if (st == null) return;
      dragging = st;
      try { svg.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ }
      e.preventDefault();
    });
    svg.addEventListener('pointermove', function (e) {
      if (dragging === null) return;
      var r = svg.getBoundingClientRect();
      game = L.move(game, dragging, (e.clientX - r.left) / geo.sx, (e.clientY - r.top) / geo.sy).game;
      drawGraph();
    });
    var stop = function () { if (dragging === null) return; dragging = null; save(); broadcast(); };
    svg.addEventListener('pointerup', stop);
    svg.addEventListener('pointercancel', stop);
  }

  /** A log line or event as parts: data (names, states, symbols) in translate="no", codes worded. */
  function eventParts(key, vars) {
    var v = {};
    Object.keys(vars || {}).forEach(function (k) {
      var x = vars[k];
      if (k === 'taskType') return;
      if (k === 'type') v[k] = t('act_' + x);
      else if (k === 'why') v[k] = t('why_' + x);
      else if (k === 'done' || k === 'next') v[k] = String(x);
      else v[k] = data(x);
    });
    if (key === 'newGame') {
      var d = L.describe({ taskType: vars.taskType, target: vars.target });
      v.task = h('span', null, t.parts(d.key, { target: data(vars.target) }));
    }
    return t.parts('ev_' + key, v);
  }

  function renderStage() {
    var d = L.describe(game);
    ui.task.replaceChildren.apply(ui.task, game.round > 0
      ? t.parts(d.key, { target: data(game.target, 'dg-word') })
      : [t('notStartedYet')]);
    var alpha = game.dfa.alphabet.length ? game.dfa.alphabet : game.alphabet;
    ui.pills.replaceChildren.apply(ui.pills, [h('span', { class: 'dg-label' }, t('alphabet'))].concat(alpha.length
      ? alpha.map(function (a) { return h('span', { class: 'dg-pill', translate: 'no' }, a); })
      : [h('span', null, t('emptyAlphabet'))]));

    ui.round.textContent = String(game.round);
    ui.progress.textContent = Object.keys(game.actions).length + ' / ' + L.required(game);
    var v = game.validation;
    ui.valid.textContent = !v ? t('notRun') : (v.pass ? '✓ ' + t('pass') : '✗ ' + t('fail'));
    ui.valid.className = 'dg-val ' + (!v ? 'is-warn' : v.pass ? 'is-ok' : 'is-bad');
    ui.counter.textContent = !v || v.pass ? '—' : (v.counter.input === '' ? t('emptyWord') : '"' + v.counter.input + '"');
    ui.counter.className = 'dg-val' + (!v || v.pass ? '' : ' is-bad');

    var all = game.players.slice();
    if (client.role === 'presenter' && !all.some(function (p) { return p.id === client.id; })) all.unshift({ id: client.id, name: client.name, presenter: true });
    ui.players.replaceChildren.apply(ui.players, all.length ? all.map(function (p) {
      var done = Object.prototype.hasOwnProperty.call(game.actions, p.id), me = p.id === client.id;
      return h('span', { class: 'dg-player' + (done ? ' is-done' : '') + (me ? ' is-me' : '') },
        h('span', null, p.presenter ? t.parts('asPresenter', { name: data(p.name, 'dg-name') }) : data(p.name, 'dg-name'), me ? ' ' + t('me') : null),
        h('b', null, done ? '✓ ' + t('done') : t('waiting')));
    }) : [h('span', { class: 'sd-hint' }, t('noPlayers'))]);

    // The tests shown are the stored validation's, or a fresh check that is not stored (the original stored it, so
    // the status card said FAIL before anyone pressed Validate).
    var rows = (v || L.validate(game)).rows;
    var counterInput = v && !v.pass ? v.counter.input : null;
    var shown = rows.slice(0, 80);
    var yn = function (b) { return t(b ? 'yes' : 'no'); };
    var reasonText = function (r) { return t('reason_' + r.code, { sym: r.sym || '', from: r.from || '' }); };
    var table = h('table', { class: 'dg-tests' },
      h('thead', null, h('tr', null, h('th', null, t('colWord')), h('th', null, t('colExpected')), h('th', null, t('colActual')))),
      h('tbody', null, shown.map(function (r) {
        return h('tr', { class: r.input === counterInput ? 'is-counter' : null, title: reasonText(r.reason) },
          h('td', { translate: 'no' }, word(r.input)),
          h('td', null, yn(r.expected)),
          h('td', { class: r.ok ? 'is-ok' : 'is-bad' }, (r.ok ? '✓ ' : '✗ ') + yn(r.actual)));
      })));
    ui.tests.replaceChildren(table);
    if (rows.length > shown.length) ui.tests.append(h('p', { class: 'sd-hint' }, t.n('moreTests', rows.length - shown.length)));

    ui.log.replaceChildren(h('ul', { class: 'dg-log' }, game.log.map(function (l) {
      return h('li', null, h('time', { translate: 'no' }, l.at), eventParts(l.key, l.vars));
    })));
    drawGraph();
  }

  function renderPanel() {
    var role = $('dg-role');
    role.textContent = t(client.role === 'presenter' ? 'rolePresenter' : client.role === 'player' ? 'rolePlayer' : 'roleNone');
    role.className = client.role === 'presenter' ? 'is-presenter' : client.role === 'player' ? 'is-player' : '';
    $('dg-identity').textContent = client.role === 'none' ? '—' : client.name;
    renderFields();
    var played = Object.prototype.hasOwnProperty.call(game.actions, client.id);
    var needState = L.NEEDS_STATE.indexOf(actionSel.value) >= 0 && game.dfa.states.length === 0;
    $('dg-turn').textContent = t(client.role === 'none' ? 'turnConnect' : game.round < 1 ? 'turnNotStarted' : played ? 'turnDone' : 'turnOpen');
    // aria-disabled, not disabled: the button keeps focus and a click says why in the caption (playbook §9)
    $('dg-submit').setAttribute('aria-disabled', String(client.role === 'none' || game.round < 1 || played || needState));
    ['dg-start', 'dg-validate', 'dg-layout', 'dg-clear'].forEach(function (id) {
      $(id).setAttribute('aria-disabled', String(client.role !== 'presenter'));
    });
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [],
    legend: [
      { c: 1, shape: 'ring', label: t('legendState') },
      { shape: 'arrow', label: t('legendStart') },
      { c: 3, shape: 'double', label: t('legendAccept') }
    ],
    render: function (c) {
      if (!ui) build(c.stage);
      renderStage();
      renderPanel();
    },
    caption: function () {
      if (note) return note[1] ? t.parts(note[0], { room: data(note[1].room) }) : t(note[0]);
      if (game.log.length) return eventParts(game.log[0].key, game.log[0].vars);
      return t(client.role === 'none' ? 'turnConnect' : game.round < 1 ? 'turnNotStarted' : 'turnOpen');
    }
  });

  // A tab that was in a game before the reload rejoins its room: the presenter sends its game, a player asks for it.
  if (client.role !== 'none') {
    connect();
    if (client.role === 'presenter') broadcast(); else send('REQUEST_STATE');
  }
  window.addEventListener('pagehide', function () { save(); });
})();
</script>
</body>
</html>
