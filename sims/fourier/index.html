<html lang="hr" data-sim="fourier">
<head>

<title>Fourierova sinteza · simdeck</title>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "fourier",
  "class": "explorer",
  "title": { "hr": "Fourierova sinteza", "en": "Fourier synthesis" },
  "concept": { "hr": "Periodičan signal: zbroj sinusnih titraja na višekratnicima osnovne frekvencije", "en": "A periodic signal is a sum of sine waves at multiples of a base frequency" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="fourier"]; colours only from kit tokens. */
[data-sim="fourier"] .fo { position: relative; height: 100%; }
[data-sim="fourier"] .fo-scene { position: absolute; inset: 0; cursor: grab; touch-action: pan-y; user-select: none; }
[data-sim="fourier"] .fo-scene.is-dragging { cursor: grabbing; }
[data-sim="fourier"] .fo-scene svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="fourier"] .fo-scene text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
[data-sim="fourier"] .fo-scene text.fo-title { fill: var(--ink); font-weight: 600; }
[data-sim="fourier"] .fo-scene text.fo-sel { fill: var(--ink); font-weight: 700; }
[data-sim="fourier"] .fo-plane { fill: var(--panel); fill-opacity: 0.72; stroke: var(--line); stroke-width: 1.5; }
[data-sim="fourier"] .fo-base { stroke: var(--muted); stroke-width: 1; opacity: 0.55; }
[data-sim="fourier"] .fo-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="fourier"] .fo-lane { fill: none; stroke: var(--c1); stroke-width: 2; stroke-linejoin: round; }
[data-sim="fourier"] .fo-lane.is-sel { stroke: var(--c4); stroke-width: 5; }
[data-sim="fourier"] .fo-sum { fill: none; stroke: var(--c3); stroke-width: 4.5; stroke-linejoin: round; }
[data-sim="fourier"] .fo-stem { stroke: var(--c2); stroke-width: 3; }
[data-sim="fourier"] .fo-dot { fill: var(--c2); stroke: var(--bg); stroke-width: 1.5; }
[data-sim="fourier"] .fo-dot.is-sel { fill: var(--c4); }
[data-sim="fourier"] .fo-titles { position: absolute; left: 0.6rem; top: 0.3rem; margin: 0; font-size: var(--fs-sm); line-height: 1.3; color: var(--ink); }
[data-sim="fourier"] .fo-titles[hidden] { display: none; }
[data-sim="fourier"] .fo-hint { position: absolute; right: 0.6rem; bottom: 0.3rem; margin: 0; font-size: var(--fs-sm); color: var(--muted); pointer-events: none; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="fourier"] .fo-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="fourier"] .fo-credit a { color: inherit; }
/* The kit's .sd-ctl { display: flex } beats the hidden attribute, so a control whose visible() is false would still
   show (NOTES.md "Shared requests"); only the selected harmonic's two sliders are meant to. */
[data-sim="fourier"] .sd-ctl[hidden] { display: none; }
/* Presets in two columns. */
[data-sim="fourier"] .sd-presets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
/* The settings group as a grid, so the three view buttons (the kit's buttons without a key) share one row. */
[data-sim="fourier"] [data-sd-controls] .sd-group { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.55rem 0.35rem; }
[data-sim="fourier"] [data-sd-controls] .sd-group > * { grid-column: 1 / -1; }
[data-sim="fourier"] [data-sd-controls] .sd-group > .sd-btn:not([aria-keyshortcuts]) { grid-column: auto; justify-content: center; padding-inline: 0.3rem; }
[data-sim="fourier"] .fo-viewlabel { margin-bottom: -0.25rem; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="fourier"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="fourier"] .fo { height: 24rem; }
  [data-sim="fourier"] .fo-scene { top: 2.6rem; }
  [data-sim="fourier"] .fo-credit { text-align: left; }
  [data-sim="fourier"] .sd-presets { grid-template-columns: minmax(0, 1fr); }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="fourier"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Fourierova sinteza</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="fo-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var POINTS = 200;          // the original's steps per period
  var LIST_MAX = 6;          // frequencies named one by one in the caption; more are written first … last
  var VIEW_KEY = 'simdeck-fourier-view';
  var sim = null, last = null, scene = null, titles = null;

  // The camera is the page's, not a param: a preset or R changes the signal and keeps the view the lecturer chose.
  // Kept for the tab in sessionStorage (a convenience; the page works without it), so L (reload) keeps it too.
  var view = Object.assign({}, L.VIEWS['3d']);
  try { var saved = JSON.parse(window.sessionStorage.getItem(VIEW_KEY) || 'null'); if (saved && Number.isFinite(saved.yaw) && Number.isFinite(saved.pitch)) view = saved; } catch (e) { /* storage blocked */ }
  function setView(v) {
    view = { yaw: ((v.yaw + 540) % 360) - 180, pitch: Math.min(L.PITCH_MAX, Math.max(L.PITCH_MIN, v.pitch)) };
    try { window.sessionStorage.setItem(VIEW_KEY, JSON.stringify(view)); } catch (e) { /* storage blocked */ }
    if (last) draw(last);
  }

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function amp(x) { return num(parseFloat(x.toFixed(3))); }
  function hz(n) { return t('hz', { v: n }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }

  // ── the stage: the original's 3D scene, projected by sim.js and fitted to the stage ──
  function draw(st) {
    var box = scene;
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var cam = L.camera(view.yaw, view.pitch);
    var pr = L.box().map(function (p) { return L.project(cam, p); });
    var x0 = Math.min.apply(null, pr.map(function (p) { return p.x; })), x1 = Math.max.apply(null, pr.map(function (p) { return p.x; }));
    var y0 = Math.min.apply(null, pr.map(function (p) { return p.y; })), y1 = Math.max.apply(null, pr.map(function (p) { return p.y; }));
    var pad = { x: 3 * rem, t: 2.2 * rem, b: 3.4 * rem };
    var k = Math.min((W - 2 * pad.x) / (x1 - x0), (H - pad.t - pad.b) / (y1 - y0));
    var ox = W / 2 - k * (x0 + x1) / 2, oy = pad.t + (H - pad.t - pad.b) / 2 + k * (y0 + y1) / 2;
    function P(p) { var q = L.project(cam, p); return { x: ox + k * q.x, y: oy - k * q.y, depth: q.depth }; }
    function pts(list) { return list.map(function (p) { var q = P(p); return q.x.toFixed(1) + ',' + q.y.toFixed(1); }).join(' '); }
    function depthOf(p) { return L.project(cam, p).depth; }

    var F = L.FRONT, S = L.SIDE, groups = [], labels = [];
    var scale = st.scale;

    // one lane per harmonic: its baseline and its own sine wave
    st.harmonics.forEach(function (hm) {
      var zz = L.laneZ(hm.n, st.count);
      var g = s('g');
      g.append(s('line', { class: 'fo-base', x1: P([0, L.MID, zz]).x, y1: P([0, L.MID, zz]).y, x2: P([1, L.MID, zz]).x, y2: P([1, L.MID, zz]).y }));
      if (hm.a > 0) {
        var c = L.curve(function (tm) { return L.component(hm, tm); }, POINTS);
        g.append(s('polyline', { class: 'fo-lane' + (hm.n === st.sel ? ' is-sel' : ''), points: pts(c.map(function (p) { return [p.t, L.MID + L.LANE * p.y, zz]; })) }));
      }
      groups.push({ depth: depthOf([0.5, L.MID, zz]), node: g });
    });

    // the time plane in front: the sum
    var tFace = L.facing(cam, [0, 0, 1]);
    var gt = s('g');
    gt.append(s('polygon', { class: 'fo-plane', points: pts([[0, L.Y0, F], [1, L.Y0, F], [1, L.Y1, F], [0, L.Y1, F]]) }));
    gt.append(s('polyline', { class: 'fo-zero', points: pts([[0, L.MID, F], [1, L.MID, F]]) }));
    var sum = L.curve(function (tm) { return L.sumAt(st.harmonics, tm); }, POINTS * 2);
    gt.append(s('polyline', { class: 'fo-sum', points: pts(sum.map(function (p) { return [p.t, L.MID + L.SUM * p.y / scale, F]; })) }));
    groups.push({ depth: depthOf([0.5, L.MID, F]), node: gt });

    // the frequency plane at the side: one stem per harmonic, at its lane
    var fFace = L.facing(cam, [1, 0, 0]);
    var gf = s('g');
    gf.append(s('polygon', { class: 'fo-plane', points: pts([[S, L.Y0, 0], [S, L.Y0, 1], [S, L.Y1, 1], [S, L.Y1, 0]]) }));
    gf.append(s('polyline', { class: 'fo-zero', points: pts([[S, L.BAR0, 0], [S, L.BAR0, 1]]) }));
    st.harmonics.forEach(function (hm) {
      if (!(hm.a > 0)) return;
      var zz = L.laneZ(hm.n, st.count), a = P([S, L.BAR0, zz]), b = P([S, L.BAR0 + L.BAR * hm.a, zz]);
      gf.append(s('line', { class: 'fo-stem', x1: a.x, y1: a.y, x2: b.x, y2: b.y }));
      gf.append(s('circle', { class: 'fo-dot' + (hm.n === st.sel ? ' is-sel' : ''), cx: b.x, cy: b.y, r: 0.32 * rem }));
    });
    groups.push({ depth: depthOf([S, L.MID, 0.5]), node: gf });

    // labels, on top of everything; a plane seen nearly edge on gets none
    function label(p, txt, cls, dy, anchor) {
      var q = P(p);
      labels.push(s('text', { x: q.x.toFixed(1), y: (q.y + dy * rem).toFixed(1), 'text-anchor': anchor || 'middle', class: cls || '' }, txt));
    }
    // Titles at the outer top corners (outside the scene in the views it is drawn for), the scale at the sum
    // plane's top left, the time axis under the sum plane, the frequencies under the spectrum.
    // On a narrow stage (a phone) the two titles would run into each other: they go in a line above the scene.
    var narrow = W < 40 * rem;
    titles.hidden = !narrow;
    if (tFace > 0.3) {
      if (!narrow) label([0, L.Y1, F], t('planeTime'), 'fo-title', -1.6, 'start');
      label([0, L.Y1, F], t('scaleLabel', { v: amp(scale) }), '', -0.4, 'start');
      label([0, L.Y0, F], t('sec', { v: 0 }), '', 1.3);
      label([0.5, L.Y0, F], t('axisTime'), '', 1.3);
      label([1, L.Y0, F], t('sec', { v: 1 }), '', 1.3);
    }
    if (fFace > 0.3) {
      if (!narrow) label([S, L.Y1, 0], t('planeFreq'), 'fo-title', -0.6, 'end');
      // harmonic labels under the spectrum, thinned so they do not overlap; the selected one always shows
      var gap = Math.hypot(P([S, L.Y0, L.laneZ(1, st.count)]).x - P([S, L.Y0, L.laneZ(2, st.count)]).x, 0) || 1;
      var every = Math.max(1, Math.ceil(3.2 * rem / gap));
      st.harmonics.forEach(function (hm) {
        var show = hm.n === st.sel || ((hm.n - 1) % every === 0 && Math.abs(hm.n - st.sel) >= every);
        if (show) label([S, L.Y0, L.laneZ(hm.n, st.count)], hz(hm.n), hm.n === st.sel ? 'fo-sel' : '', 1.2);
      });
    }

    groups.sort(function (a, b) { return b.depth - a.depth; });
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    groups.forEach(function (g) { svg.append(g.node); });
    labels.forEach(function (l) { svg.append(l); });
    box.replaceChildren(svg);
  }

  // Drag to turn the scene (the original's mouse rotation, here with pointer events for touch and pen too).
  function bindDrag(el) {
    var start = null;
    el.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      start = { x: e.clientX, y: e.clientY, view: Object.assign({}, view) };
      el.setPointerCapture(e.pointerId);
      el.classList.add('is-dragging');
    });
    el.addEventListener('pointermove', function (e) {
      if (!start) return;
      setView({ yaw: start.view.yaw - (e.clientX - start.x) * 0.4, pitch: start.view.pitch + (e.clientY - start.y) * 0.3 });
    });
    function end() { start = null; el.classList.remove('is-dragging'); }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  // ── controls: count, the selected harmonic, and that harmonic's amplitude and phase ──
  var params = [
    { key: 'count', type: 'range', label: t('count'), hint: t('countHint'), min: L.COUNT_MIN, max: L.MAX, step: 1,
      format: function (v) { return t.n('harmonics', v); } },
    { key: 'sel', type: 'range', label: t('sel'), min: 1, max: function (p) { return p.count; }, step: 1,
      format: function (v) { return hz(v); } }
  ];
  for (var n = 1; n <= L.MAX; n++) (function (n) {
    params.push({ key: L.aKey(n), type: 'range', label: t('amp') + ' · ' + hz(n), min: 0, max: 1, step: L.AMP_STEP,
      format: amp, visible: function (p) { return p.sel === n; } });
    params.push({ key: L.pKey(n), type: 'range', label: t('phase') + ' · ' + hz(n), hint: t('phaseHint'), min: 0, max: L.PHASE_MAX, step: L.PHASE_STEP,
      format: function (v) { return t('deg', { v: v }); }, visible: function (p) { return p.sel === n; } });
  })(n);
  params.push(
    { type: 'button', label: t('view3d'), run: function () { setView(L.VIEWS['3d']); } },
    { type: 'button', label: t('viewTime'), run: function () { setView(L.VIEWS.time); } },
    { type: 'button', label: t('viewFreq'), run: function () { setView(L.VIEWS.freq); } }
  );

  var labelKeys = {
    sine: 'presetSine', square: 'presetSquare', 'square-30': 'presetSquare30', 'square-phase': 'presetSquarePhase',
    sawtooth: 'presetSawtooth', triangle: 'presetTriangle', all: 'presetAll', none: 'presetNone'
  };

  // "1, 3, 5 i 7 Hz"; more than LIST_MAX: "1, 3, 5 … 29 Hz"
  function freqList(ns) {
    var u = function (x) { return t('hz', { v: x }); };
    if (ns.length === 1) return u(ns[0]);
    if (ns.length > LIST_MAX) return t('listLong', { first: ns.slice(0, 3).join(', '), last: u(ns[ns.length - 1]) });
    return t('listAnd', { a: ns.slice(0, -1).join(', '), b: u(ns[ns.length - 1]) });
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labelKeys[x.id]), hint: t(labelKeys[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendLanes') },
      { c: 4, label: t('legendSel') },
      { c: 3, label: t('legendSum') },
      { c: 2, shape: 'round', label: t('legendSpectrum') }
    ],

    render: function (c) {
      last = c.state;
      if (!scene) {
        scene = h('div', { class: 'fo-scene' });
        titles = h('p', { class: 'fo-titles', hidden: true }, h('b', null, t('planeTime')), h('br'), h('b', null, t('planeFreq')));
        bindDrag(scene);
        c.stage.replaceChildren(h('div', { class: 'fo' }, titles, scene, h('p', { class: 'fo-hint' }, t('dragHint'))));
      }
      draw(c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var main;
      if (st.kind === 'none') main = [t('captionNone')];
      else if (st.kind === 'single') main = t.parts('captionSingle', { list: b(freqList(st.active)) });
      else main = t.parts(st.kind === 'odd' ? 'captionOdd' : 'captionMixed', {
        count: b(t.n('harmonics', st.active.length)), list: b(freqList(st.active)), peak: b(amp(st.peak))
      });
      var hm = st.harmonics[st.sel - 1];
      return main.concat(t.parts('captionSel', { f: b(hz(hm.n)), a: b(amp(hm.a)), p: b(t('deg', { v: hm.phase })) }));
    }
  });

  // A label over the three view buttons (the kit's buttons have none).
  var firstView = document.querySelector('[data-sd-controls] .sd-group > .sd-btn:not([aria-keyshortcuts])');
  if (firstView) firstView.before(h('span', { class: 'sd-ctl-label fo-viewlabel' }, t('view')));

  // The scene is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var lastSize = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== lastSize) { lastSize = key; if (last) draw(last); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
