     sliders drive the three rows and the constellation diagram live; the model is in sim.js, the words in strings.js.
     The original's Chart.js charts are gone (nothing vendored): each plot is SVG drawn at 1:1. -->
<html lang="hr" data-sim="iq-signals">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I/Q signali · simdeck</title>
<meta name="description" content="I/Q signali: zbroj dvaju nositelja pomaknutih za 90° daje titraj amplitude A i faze φ.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "iq-signals",
  "class": "explorer",
  "title": { "hr": "I/Q signali", "en": "I/Q signals" },
  "concept": { "hr": "I i Q nositelji pomaknuti za 90° zbrajaju se u jedan titraj amplitude A i faze φ", "en": "I and Q carriers 90° apart add up to one wave of amplitude A and phase φ" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="iq-signals"]; colours only from kit tokens. */
[data-sim="iq-signals"] .iq { height: 100%; padding: 1.2cqh 1.6cqw; display: grid; gap: 0.5rem 1.6cqw;
  grid-template-columns: minmax(0, 1fr) min(40cqw, 62cqh); }
[data-sim="iq-signals"] .iq-waves { min-height: 0; display: flex; flex-direction: column; gap: 0.4rem; }
[data-sim="iq-signals"] .iq-row { flex: 1; min-height: 0; display: flex; flex-direction: column; }
[data-sim="iq-signals"] .iq-row[data-row="s"] { flex: 1.3; }
[data-sim="iq-signals"] .iq-label { font-weight: 700; font-size: var(--fs-md); line-height: 1.25; }
[data-sim="iq-signals"] .iq-time { text-align: right; font-size: var(--fs-sm); color: var(--muted); line-height: 1.2; }
[data-sim="iq-signals"] .iq-plot { position: relative; flex: 1; min-height: 3.5rem; }
[data-sim="iq-signals"] .iq-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="iq-signals"] .iq-side { min-height: 0; display: flex; flex-direction: column; gap: 0.4rem; }
[data-sim="iq-signals"] .iq-const { position: relative; width: 100%; aspect-ratio: 1; }
[data-sim="iq-signals"] .iq-const svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="iq-signals"] .iq-read { display: flex; flex-wrap: wrap; gap: 0.2rem 1.4rem; font-size: var(--fs-lg); font-weight: 700; }
[data-sim="iq-signals"] svg text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--ink); font-weight: 600; }
[data-sim="iq-signals"] svg text.iq-scale { paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
[data-sim="iq-signals"] .iq-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="iq-signals"] .iq-axis { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="iq-signals"] .iq-grid { stroke: var(--line); stroke-width: 1; }
[data-sim="iq-signals"] .iq-circle { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
[data-sim="iq-signals"] .iq-ref { stroke: var(--c8); stroke-width: 1.5; stroke-dasharray: 2 5; }
[data-sim="iq-signals"] .iq-peak { stroke: var(--c5); stroke-width: 2.5; stroke-dasharray: 8 5; }
[data-sim="iq-signals"] .iq-tri { fill: var(--c5); }
[data-sim="iq-signals"] .iq-wave { fill: none; stroke-width: 3; stroke-linejoin: round; }
[data-sim="iq-signals"] .iq-wave[data-row="i"] { stroke: var(--c1); }
[data-sim="iq-signals"] .iq-wave[data-row="q"] { stroke: var(--c3); stroke-dasharray: 10 4; }
[data-sim="iq-signals"] .iq-wave[data-row="s"] { stroke: var(--c2); stroke-width: 4; }
[data-sim="iq-signals"] .iq-proj { stroke-width: 2.5; }
[data-sim="iq-signals"] .iq-proj[data-row="i"] { stroke: var(--c1); stroke-dasharray: 8 5; }
[data-sim="iq-signals"] .iq-proj[data-row="q"] { stroke: var(--c3); stroke-dasharray: 2 4; }
[data-sim="iq-signals"] .iq-vec { stroke: var(--c2); stroke-width: 4; }
[data-sim="iq-signals"] .iq-head { fill: var(--c2); }
[data-sim="iq-signals"] .iq-arc { fill: none; stroke: var(--ink); stroke-width: 2; }
[data-sim="iq-signals"] .iq-point { fill: var(--c2); stroke: var(--bg); stroke-width: 2; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="iq-signals"] .iq-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="iq-signals"] .iq-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="iq-signals"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="iq-signals"] .iq { height: auto; padding: 0.6rem; grid-template-columns: minmax(0, 1fr); }
  [data-sim="iq-signals"] .iq-row { flex: none; }
  [data-sim="iq-signals"] .iq-plot { flex: none; height: 5rem; }
  [data-sim="iq-signals"] .iq-row[data-row="s"] .iq-plot { height: 6.5rem; }
  [data-sim="iq-signals"] .iq-const { width: min(100%, 22rem); margin: 0 auto; }
  [data-sim="iq-signals"] .iq-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="iq-signals"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">I/Q signali</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="iq-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var YMAX = 160;                            // every row on the same scale, so the sum can be seen to outgrow its parts
  var CMAX = 125;                            // the constellation's half width, in percent
  var sim = null;

  // A number with a real minus sign, not a hyphen.
  function sgn(x) { return x < 0 ? '−' + String(-x) : String(x); }
  function pct(x) { return t('pct', { v: sgn(x) }); }
  function deg(x) { return t('deg', { v: sgn(x) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

  var presetKeys = { start: 'presetStart', ionly: 'presetIonly', qonly: 'presetQonly', equal: 'presetEqual',
    reverse: 'presetReverse', corner: 'presetCorner', none: 'presetNone' };
  var rows = [
    { key: 'i', label: 'rowI' },
    { key: 'q', label: 'rowQ' },
    { key: 's', label: 'rowSum' }
  ];

  // ── one time row: a frame over the window, the zero line, ±100 % lines, the I carrier's peaks as reference marks,
  //    on the sum row the sum's own peaks (dashed, with a triangle), and the wave ──
  function drawRow(box, row, st, pts) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var pad = { l: 0.4 * rem, r: 0.4 * rem, t: 0.3 * rem, b: 0.3 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (x) { return pad.l + (x - L.X0) / (L.X1 - L.X0) * cw; };
    var Y = function (y) { return pad.t + ch * (1 - (y + YMAX) / (2 * YMAX)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'iq-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [100, -100].forEach(function (y) { svg.append(s('line', { class: 'iq-grid', x1: pad.l, x2: pad.l + cw, y1: Y(y), y2: Y(y) })); });
    svg.append(s('line', { class: 'iq-axis', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    st.refs.forEach(function (x) { svg.append(s('line', { class: 'iq-ref', x1: X(x), x2: X(x), y1: pad.t, y2: pad.t + ch })); });
    if (row.key === 's') {
      st.peaks.forEach(function (x) {
        // a triangle hanging from the frame's top edge, pointing down at the peak, and a dashed line below it
        var tx = X(x);
        svg.append(s('line', { class: 'iq-peak', x1: tx, x2: tx, y1: pad.t, y2: pad.t + ch }));
      });
    }
    svg.append(s('polyline', { class: 'iq-wave', 'data-row': row.key,
      points: pts.map(function (p) { return X(p.x).toFixed(1) + ',' + Y(p[row.key]).toFixed(1); }).join(' ') }));
    if (row.key === 's') {
      st.peaks.forEach(function (x) {
        var tx = X(x), d = 0.45 * rem;
        svg.append(s('path', { class: 'iq-tri', d: 'M' + (tx - d) + ',' + pad.t + 'H' + (tx + d) + 'L' + tx + ',' + (pad.t + 1.5 * d) + 'Z' }));
      });
    }
    // the scale, last and with a halo, so neither the wave nor a peak mark hides it
    if (row.key === 's') svg.append(s('text', { class: 'iq-scale', x: pad.l + 0.3 * rem, y: Y(100) + 1.2 * rem, translate: 'no' }, pct(100)));
    box.replaceChildren(svg);
  }

  // ── the constellation diagram: axes, the 100 % circle, the projections onto I and Q, the arrow to (I, Q), φ ──
  function drawConst(box, st) {
    var W = box.clientWidth;
    if (!W) return;
    var rem = remPx(), m = 1.4 * rem, r = (W - 2 * m) / 2, c = W / 2;
    var P = function (v) { return v / CMAX * r; };
    var x = c + P(st.i), y = c - P(st.q);
    var svg = s('svg', { width: W, height: W, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'iq-frame', x: c - r, y: c - r, width: 2 * r, height: 2 * r }));
    [-100, -50, 50, 100].forEach(function (v) {
      svg.append(s('line', { class: 'iq-grid', x1: c + P(v), x2: c + P(v), y1: c - r, y2: c + r }));
      svg.append(s('line', { class: 'iq-grid', y1: c + P(v), y2: c + P(v), x1: c - r, x2: c + r }));
    });
    svg.append(s('circle', { class: 'iq-circle', cx: c, cy: c, r: P(100) }));
    svg.append(s('line', { class: 'iq-axis', x1: c - r, x2: c + r, y1: c, y2: c }));
    svg.append(s('line', { class: 'iq-axis', y1: c - r, y2: c + r, x1: c, x2: c }));
    svg.append(s('text', { x: c + r - 0.3 * rem, y: c - 0.4 * rem, 'text-anchor': 'end', translate: 'no' }, 'I'));
    svg.append(s('text', { x: c + 0.4 * rem, y: c - r + 1.1 * rem, translate: 'no' }, 'Q'));
    svg.append(s('text', { x: c + P(100), y: c + r + 1.15 * rem, 'text-anchor': 'middle', translate: 'no' }, pct(100)));
    svg.append(s('text', { x: c - P(100), y: c + r + 1.15 * rem, 'text-anchor': 'middle', translate: 'no' }, pct(-100)));
    if (!st.none) {
      if (st.q !== 0) svg.append(s('line', { class: 'iq-proj', 'data-row': 'i', x1: x, x2: x, y1: y, y2: c }));
      if (st.i !== 0) svg.append(s('line', { class: 'iq-proj', 'data-row': 'q', x1: x, x2: c, y1: y, y2: y }));
      // the angle φ from the I axis, as an arc (counter-clockwise for positive φ), with its label
      var ar = Math.min(2.2 * rem, 0.45 * Math.hypot(x - c, y - c));
      if (st.phi !== 0 && ar > 0.6 * rem) {
        var a1 = -st.phi * Math.PI / 180;
        svg.append(s('path', { class: 'iq-arc', d: 'M' + (c + ar) + ',' + c + 'A' + ar + ',' + ar + ' 0 0,' + (st.phi > 0 ? 0 : 1) + ' ' +
          (c + ar * Math.cos(a1)) + ',' + (c + ar * Math.sin(a1)) }));
        var am = a1 / 2, lr = ar + 0.8 * rem;
        // near the Q axis (φ around ±180°) the label moves off the axis line
        var side = Math.abs(Math.cos(am)) < 0.3;
        svg.append(s('text', { x: c + lr * Math.cos(am) + (side ? 0.3 * rem : 0), y: c + lr * Math.sin(am) + 0.35 * rem,
          'text-anchor': side ? 'start' : 'middle', translate: 'no' }, 'φ'));
      }
      // the arrow from the origin to (I, Q)
      var len = Math.hypot(x - c, y - c), ux = (x - c) / len, uy = (y - c) / len, hd = Math.min(0.9 * rem, len / 2);
      svg.append(s('line', { class: 'iq-vec', x1: c, y1: c, x2: x - ux * hd * 0.8, y2: y - uy * hd * 0.8 }));
      svg.append(s('path', { class: 'iq-head', d: 'M' + x + ',' + y +
        'L' + (x - ux * hd - uy * hd * 0.5) + ',' + (y - uy * hd + ux * hd * 0.5) +
        'L' + (x - ux * hd + uy * hd * 0.5) + ',' + (y - uy * hd - ux * hd * 0.5) + 'Z' }));
    }
    svg.append(s('circle', { class: 'iq-point', cx: x, cy: y, r: 0.4 * rem }));
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'i', type: 'range', label: t('i'), hint: t('iHint'), min: L.MIN, max: L.MAX, step: L.STEP, format: pct },
      { key: 'q', type: 'range', label: t('q'), hint: t('qHint'), min: L.MIN, max: L.MAX, step: L.STEP, format: pct }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendI') },
      { c: 3, label: t('legendQ') },
      { c: 2, label: t('legendSum') },
      { c: 8, shape: 'round', label: t('legendRef') },
      { c: 5, shape: 'hollow', label: t('legendPeak') }
    ],

    render: function (c) {
      var st = c.state;
      var pts = L.curve(st.i, st.q);
      var plots = rows.map(function () { return h('div', { class: 'iq-plot' }); });
      var cons = h('div', { class: 'iq-const' });
      c.stage.replaceChildren(h('div', { class: 'iq' },
        h('div', { class: 'iq-waves' }, rows.map(function (r, i) {
          return h('div', { class: 'iq-row', 'data-row': r.key }, h('div', { class: 'iq-label' }, t(r.label)), plots[i]);
        }), h('div', { class: 'iq-time' }, t('time'))),
        h('div', { class: 'iq-side' },
          h('div', { class: 'iq-label' }, t('constTitle')),
          cons,
          h('div', { class: 'iq-read' },
            h('span', { translate: 'no' }, t('readA', { v: pct(st.aRound) })),
            h('span', null, t('readPhi', { v: st.none ? t('undefinedPhi') : deg(st.phiRound) }))))));
      rows.forEach(function (r, i) { drawRow(plots[i], r, st, pts); });
      drawConst(cons, st);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var v = {
        zero: b(pct(0)), i: b(pct(st.i)), q: b(pct(st.q)), a: b(pct(st.aRound)),
        phi: b(st.none ? '' : deg(st.phiRound)), phiAbs: b(st.none ? '' : deg(Math.abs(st.phiRound)))
      };
      var parts;
      if (st.none) return t.parts('captionNone', v);
      if (st.phi === 0) parts = t.parts('captionInPhase', v);
      else if (st.phi === 180) parts = t.parts('captionReverse', v);
      else parts = t.parts(st.lead > 0 ? 'captionLead' : 'captionLag', v);
      return st.over ? [parts, t('captionOver')] : parts;
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
