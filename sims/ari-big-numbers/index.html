     classes of three: count over the edge (every 9 turns to 0 and carries once, written as the school's addition of
     one count), read a number by its classes, compare two numbers from the highest place down. Under the table a
     number line that zooms (two tiers: the whole line 0 … 1 000 000 with a window, the zoomed stretch below).
     The table is kit view K5 (Simdeck.paperColumns, docs/sim-ui.md §14); the class brackets on it, the number line
     (numberline.js, from ari-constant-difference) and the mistake card are this page's. Rules: SPEC.md. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var NL = window.SimdeckModels['number-line'];
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';

  var PRESET_KEY = { 'over-9999': 'pOver9999', 'over-99999': 'pOver99999', 'back-thousands': 'pBackThousands',
    million: 'pMillion', read: 'pRead', 'read-zeros': 'pReadZeros', compare: 'pCompare', 'compare-length': 'pCompareLength' };
  var MODE_KEY = { count: 'modeCount', read: 'modeRead', compare: 'modeCompare' };
  var SEP = Simdeck.lang === 'en' ? ',' : ' ';   // between classes: 345 678, 345,678 (not a word)
  var SIGN = { '<': '<', '>': '>', '=': '=' };

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  /** A click on a page button keeps the clicker keys (the kit does the same for its own buttons). */
  function noFocus(btn) { btn.addEventListener('mousedown', function (e) { e.preventDefault(); }); return btn; }

  // ── numbers and words as data ──
  /** A numeral in classes of three from 1000 up (345 678; English 345,678): the classes are this page's subject. */
  function F(v) {
    var s = String(v);
    if (s.length < 4) return s;
    var out = '';
    for (var i = 0; i < s.length; i++) { if (i > 0 && (s.length - i) % 3 === 0) out += SEP; out += s[i]; }
    return out;
  }
  /** A typed number without the page's own class separator (English 345,678); the model reads digits and spaces. */
  function unsep(text) { return SEP === ',' ? String(text).replace(/,/g, '') : text; }
  /** The first letter in capitals (a caption that starts with a number word or a place name). */
  function cap(text) { text = String(text); return text.charAt(0).toUpperCase() + text.slice(1); }
  function num(v, cls) { return h('span', { class: 'bn-num' + (cls ? ' ' + cls : ''), translate: 'no' }, typeof v === 'number' ? F(v) : String(v)); }
  /** Tokens to words: '-' glues two words with a hyphen (forty-five). */
  function say(tokens) {
    var out = '', glue = false;
    tokens.forEach(function (k) {
      if (k === '-') { glue = true; return; }
      out += (out && !glue ? ' ' : glue ? '-' : '') + t('w_' + k);
      glue = false;
    });
    return out;
  }
  function words(n) { return say(L.wordsOf(n, Simdeck.lang)); }
  function quoted(text) { return h('i', null, text); }
  function placeLabel(k) { return t('place' + k); }
  function placeName(k) { return t('placeName' + k); }
  function digitsAt(v) { return L.digitsOf(v).map(String); }
  function calcText(ch, D) { return F(ch.from) + (D.dir === 'on' ? ' + ' : ' − ') + F(D.by) + ' = ' + F(ch.to); }

  // ── the sentence and the words on top ──
  function top(D, s) {
    var sent = [], said = null;
    if (D.mode === 'count') {
      var i = s.phase === 'start' ? 0 : s.i;
      var shown = D.values.slice(Math.max(0, i - 4), i + 1);
      sent.push(h('span', { class: 'bn-label' }, t('counted')));
      shown.forEach(function (v, j) {
        var last = j === shown.length - 1;
        sent.push(h('span', { class: 'bn-num' + (last ? '' : ' bn-done'), translate: 'no' },
          last ? h('span', { class: s.phase === 'count' ? 'sd-hl' : null }, F(v)) : F(v) + t('listSep')));
      });
      if (i + 1 < D.values.length) sent.push(h('span', { class: 'bn-q', translate: 'no' }, '…'));
      said = quoted(words(D.values[i]));
    } else if (D.mode === 'read') {
      var grouped = s.phase !== 'digits';
      sent.push(num(grouped ? F(D.n) : String(D.n), s.phase === 'words' ? 'sd-hl' : null));
      if (s.phase === 'class' || s.phase === 'words') {
        var upTo = s.phase === 'words' ? -1 : s.k, tok = [];
        D.classes.forEach(function (k, j) {
          if (k.c < upTo) return;
          if (Simdeck.lang === 'en' && k.c === 0 && j > 0 && k.value > 0 && k.value < 100) tok.push('and');
          tok = tok.concat(L.classWordsOf(k.value, k.c, Simdeck.lang));
        });
        if (D.n === 0) tok = ['zero'];
        said = [h('span', { class: 'bn-label', style: { fontStyle: 'normal' } }, t('sayIt'), ' '), quoted(say(tok) || '…')];
      }
    } else {
      var done = s.phase === 'verdict';
      sent.push(num(D.a), h('span', { class: done ? 'sd-hl' : 'bn-q', translate: 'no' }, done ? SIGN[D.verdict] : '?'), num(D.b));
      said = done ? t(D.verdict === '<' ? 'vLess' : D.verdict === '>' ? 'vMore' : 'vEq', { a: F(D.a), b: F(D.b) }) : t('whichMore');
    }
    return h('div', { class: 'bn-top' }, modeTabs(D), h('div', { class: 'bn-sent' }, sent), h('div', { class: 'bn-words' }, said));
  }
  /** The three demos as tabs on the stage (the projector shows which one runs); the param keeps it in the URL. */
  function modeTabs(D) {
    return h('div', { class: 'sd-seg bn-modes', role: 'group', 'aria-label': t('mode') }, L.MODES.map(function (m) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': String(D.mode === m),
        onclick: function () { if (D.mode !== m) sim.set({ mode: m }); } }, t(MODE_KEY[m])));
    }));
  }

  // ── the place-value table (K5) ──
  function places() { var out = [], tt = []; for (var k = 0; k < L.PLACES; k++) { out.push(placeLabel(k)); tt.push(placeName(k)); } return { places: out, titles: tt }; }

  function countTable(D, s) {
    var i = s.phase === 'start' ? 0 : s.i, fresh = s.phase === 'count';
    var ch = i > 0 ? D.changes[i - 1] : null;
    var A = ch ? ch.from : D.values[0];
    var topCells = digitsAt(A), carry = [];
    if (ch && ch.carries.length) {
      if (D.dir === 'on') {
        ch.carries.forEach(function (k) { carry[k] = { text: '1', now: fresh, label: t('carryLabel') }; });
      } else {
        var ds = L.digitsOf(A);
        var rewrite = function (k, text) {
          carry[k] = { text: text, now: fresh, label: t('borrowLabel', { d: text }) };
          topCells[k] = { text: String(ds[k]), x: true };
        };
        rewrite(ch.grew, String(ds[ch.grew] - 1));
        ch.rolled.forEach(function (k) { rewrite(k, k === D.e ? '10' : '9'); });
      }
    }
    var rows = [
      { kind: 'carry', cells: carry },
      { cells: topCells },
      { cells: digitsAt(D.by), sign: D.dir === 'on' ? '+' : '−' }
    ];
    var res = [];
    if (ch) {
      var before = L.digitsOf(ch.from), after = L.digitsOf(ch.to);
      res = after.map(function (d, k) { return fresh && d !== before[k] ? { text: String(d), now: true } : String(d); });
    }
    rows.push({ kind: 'result', rule: true, cells: res });
    var band = [];
    if (ch && fresh) for (var k = D.e; k <= ch.grew && k < L.PLACES; k++) band.push(k);
    var pl = places();
    return P({ cols: L.PLACES, big: audience === 'child', places: pl.places, placeTitles: pl.titles, band: band, rows: rows,
      label: t('paperCount', { calc: ch ? calcText(ch, D) : F(A) + (D.dir === 'on' ? ' + ' : ' − ') + F(D.by) }) });
  }

  function readTable(D, s) {
    var pl = places(), ds = L.digitsOf(D.n);
    var band = [];
    if (s.phase === 'class') for (var k = s.k * 3; k < Math.min(s.k * 3 + 3, ds.length); k++) band.push({ k: k, from: 0, to: 1 });
    var spec = { cols: L.PLACES, big: audience === 'child', places: pl.places, placeTitles: pl.titles, band: band,
      rows: [{ cells: ds.map(String) }, { cells: [] }], label: t('paperRead', { n: F(D.n) }) };
    var paper = P(spec);
    if (s.phase !== 'digits') {
      var lay = P.layout(spec), first = lay.first;
      D.classes.forEach(function (cl) {
        var lo = cl.c * 3, hi = Math.min(lo + 2, L.PLACES - 1);
        if (cl.c > 0) paper.appendChild(h('div', { class: 'bn-sep', 'aria-hidden': 'true', style: { gridRow: '1 / ' + (first + 2), gridColumn: String(lay.gc(lo)) } }));
        var now = s.phase === 'class' && s.k === cl.c;
        paper.appendChild(h('div', { class: 'bn-cls', dataset: now ? { now: '' } : {}, style: { gridRow: String(first + 1), gridColumn: lay.gc(hi) + ' / ' + (lay.gc(lo) + 1) } },
          t('class' + cl.c)));
      });
    }
    return paper;
  }

  function compareTable(D, s) {
    var pl = places(), marks = [];
    var upto = s.phase === 'start' ? 0 : s.phase === 'place' ? s.i : D.places.length;
    D.places.slice(0, upto).forEach(function (x, j) {
      var sign = x.a === x.b ? '=' : x.a < x.b ? '<' : '>';
      marks[x.k] = { text: sign, now: s.phase === 'place' && j === upto - 1 };
    });
    var band = s.phase === 'start' ? [] : [{ k: s.k, from: 0, to: 2 }];
    return P({ cols: L.PLACES, big: audience === 'child', places: pl.places, placeTitles: pl.titles, band: band,
      rows: [{ cells: digitsAt(D.a) }, { cells: digitsAt(D.b) }, { kind: 'result', rule: true, cells: marks }],
      label: t('paperCompare', { a: F(D.a), b: F(D.b) }) });
  }

  function table(D, s) {
    var paper = D.mode === 'count' ? countTable(D, s) : D.mode === 'read' ? readTable(D, s) : compareTable(D, s);
    return h('section', { class: 'bn-table sd-paper-box' }, paper);
  }

  // ── the number line ──
  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  function lineBox(D, s, p) {
    var Ln = L.lineOf(p, s), v = Ln.view;
    var whole = v.lo === 0 && v.hi === L.MAX;
    var pos = function (x) { return pct(NL.pos(x, v)); };
    var kids = [];
    // the whole line, with a window on the stretch below
    if (!whole) {
      var W = { lo: 0, hi: L.MAX, step: L.MAX / 10, minor: 0 };
      var ck = [h('div', { class: 'bn-axis' })];
      NL.ticks(W, 0).forEach(function (tk) {
        ck.push(h('span', { class: 'bn-tick', style: { left: pct(NL.pos(tk.v, W)) } }));
        ck.push(h('span', { class: 'bn-tl', translate: 'no', style: { left: pct(NL.pos(tk.v, W)) } }, F(tk.v)));
      });
      var x1 = NL.pos(v.lo, W), x2 = NL.pos(v.hi, W);
      ck.push(h('span', { class: 'bn-win', style: { left: pct(x1), width: pct(x2 - x1) } }));
      kids.push(h('div', { class: 'bn-tier bn-coarse', 'aria-hidden': 'true' }, ck));
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'bn-zoom');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      var poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', (x1 * 100) + ',0 ' + (x2 * 100) + ',0 100,100 0,100');
      svg.appendChild(poly);
      kids.push(svg);
    }
    // the stretch
    var fk = [h('div', { class: 'bn-axis' })];
    var ticks = NL.ticks(v);
    if (D.mode === 'count') { ticks = []; for (var tv = v.lo; tv <= v.hi; tv += D.by) ticks.push({ v: tv, major: true }); }
    var majors = ticks.filter(function (tk) { return tk.major; });
    var crowded = majors.length > 9;
    var ten = D.mode === 'count' ? D.by * 10 : v.step * 10;
    majors.forEach(function (tk, j) { tk.alt = crowded && j % 2 === 1; });
    ticks.forEach(function (tk) {
      var long = tk.major && tk.v % ten === 0;
      fk.push(h('span', { class: 'bn-tick', dataset: tk.major ? (long ? { long: '' } : {}) : { minor: '' }, style: { left: pos(tk.v) } }));
      if (tk.major) fk.push(h('span', { class: 'bn-tl', translate: 'no', dataset: Object.assign(long ? { long: '' } : {}, tk.alt ? { alt: '' } : {}), style: { left: pos(tk.v) } }, F(tk.v)));
    });
    if (D.mode === 'count') {
      Ln.points.forEach(function (pt, j) {
        if (!j) return;
        var a = Ln.points[j - 1].v, b = pt.v, l = Math.min(a, b), r = Math.max(a, b);
        fk.push(h('span', { class: 'bn-arc', style: { left: pos(l), width: pct(NL.pos(r, v) - NL.pos(l, v)) } }));
        if (pt.role === 'now') fk.push(h('span', { class: 'bn-al', translate: 'no', style: { left: pct((NL.pos(l, v) + NL.pos(r, v)) / 2) } }, (D.dir === 'on' ? '+' : '−') + F(D.by)));
      });
    }
    Ln.points.forEach(function (pt) {
      var c = pt.role === 'b' ? '4' : pt.role === 'done' ? null : '1';
      fk.push(h('span', { class: 'bn-dot', dataset: c ? { role: pt.role, c: c } : { role: pt.role }, style: { left: pos(pt.v) } }));
    });
    Ln.points.forEach(function (pt) {
      if (pt.role === 'done' || (D.mode === 'count' && pt.role === 'now')) return;
      fk.push(h('span', { class: 'bn-pl', translate: 'no', dataset: { role: pt.role, c: pt.role === 'b' ? '4' : '1' }, style: { left: pos(pt.v) } }, F(pt.v)));
    });
    var label = t('lineLabel', { lo: F(v.lo), hi: F(v.hi) });
    kids.push(h('div', { class: 'bn-tier bn-fine', role: 'img', 'aria-label': label }, fk));
    var head = h('div', { class: 'bn-lhead' }, h('span', { class: 'bn-head' }, t('lineTitle')),
      h('span', { class: 'bn-small' }, whole ? t('lineWhole') : t('lineZoom', { lo: F(v.lo), hi: F(v.hi) })));
    return h('section', { class: 'bn-box bn-line' }, head,
      h('div', { class: 'bn-scroll' }, h('div', { class: 'bn-scale', style: { '--n': String(Math.max(majors.length, 6)) } }, kids)));
  }

  // ── the typical mistake ──
  var PRESET_FOR = { count: { on: 'pOver9999', back: 'pBackThousands' }, read: 'pReadZeros', compare: 'pCompareLength' };
  function mistakeCard(D, s, p) {
    var m = L.mistakeOf(p);
    var kids = [h('div', { class: 'bn-head' }, t('mcHead'))];
    var preset = t(D.mode === 'count' ? PRESET_FOR.count[D.dir] : PRESET_FOR[D.mode]);
    if (!m.applies) {
      var na = { nocarry: 'mcNaNocarry', noborrow: 'mcNaNoborrow', same: D.mode === 'compare' ? 'mcNaSameLen' : 'mcNaSame',
        short: 'mcNaShort', six: 'mcNaSix', long: 'mcNaLong', agrees: 'mcNaAgrees' }[m.reason];
      kids.push(h('p', { class: 'bn-small' }, t(na, { preset: preset })));
      return h('section', { class: 'bn-box bn-mc' }, kids);
    }
    if (D.mode === 'count') {
      var seen = D.values.slice(Math.max(0, m.at - 2), m.at);
      kids.push(h('p', null, t('mcCounted'), ' ', h('b', null, num(seen.map(F).join(t('listSep') + ' ') + t('listSep') + ' ')), h('b', null, num(m.wrong, 'bn-wrong'))));
      var reached = (s.phase === 'count' || s.phase === 'end') && s.i >= m.at;
      if (!reached) { kids.push(h('p', { class: 'bn-small' }, t('mcAsk'))); return h('section', { class: 'bn-box bn-mc' }, kids); }
      kids.push(h('div', { class: 'sd-paper-box' }, diffPaper(m.right, m.wrong)));
      var ch = D.changes[m.at - 1];
      kids.push(h('p', { class: 'bn-small' }, tp(D.dir === 'on' ? 'mcWhyOn' : 'mcWhyBack',
        { from: num(m.from), right: num(m.right), wrong: num(m.wrong), by: num(D.by), pl: placeLabel(ch.grew) })));
    } else if (D.mode === 'read') {
      kids.push(h('p', null, t('mcRead'), ' ', h('b', null, num(m.groups.join(' '), 'bn-bad'))));
      kids.push(h('p', null, quoted(words(m.wrong))));
      if (s.phase !== 'words') { kids.push(h('p', { class: 'bn-small' }, t('mcReadAsk'))); return h('section', { class: 'bn-box bn-mc' }, kids); }
      kids.push(h('p', { class: 'bn-small' }, tp('mcWhyRead', { right: num(D.n), ww: words(m.wrong), wrong: num(m.wrong) })));
    } else {
      kids.push(h('p', null, t('mcCompare')));
      var sa = String(D.a), sb = String(D.b), w = Math.max(sa.length, sb.length);
      var row = function (str) { return { cells: str.split('').reverse(), at: w - str.length }; };
      var mk = []; mk[w - 1 - m.col] = m.wrong;
      kids.push(h('div', { class: 'sd-paper-box' }, P({ cols: w, label: t('mcHead'), band: [w - 1 - m.col],
        rows: [row(sa), row(sb), { kind: 'result', rule: true, cells: mk }] })));
      kids.push(h('p', null, h('b', null, num(F(D.a) + ' ' + m.wrong + ' ' + F(D.b), 'bn-wrong'))));
      if (s.phase !== 'verdict') { kids.push(h('p', { class: 'bn-small' }, t('mcCompareAsk'))); return h('section', { class: 'bn-box bn-mc' }, kids); }
      kids.push(h('p', { class: 'bn-small' }, tp('mcWhyCompare', { right: num(F(D.a) + ' ' + D.verdict + ' ' + F(D.b)) })));
    }
    return h('section', { class: 'bn-box bn-mc' }, kids);
  }
  /** The right and the wrong number by place, the wrong digits crossed. */
  function diffPaper(right, wrong) {
    var r = L.digitsOf(right), w = L.digitsOf(wrong), cols = Math.max(r.length, w.length);
    return P({ cols: cols, label: t('mcHead'), rows: [
      { cells: r.map(String), aside: '✓' },
      { cells: w.map(function (d, k) { return d !== r[k] ? { text: String(d), x: 'wrong' } : String(d); }), aside: '✗' }] });
  }

  function render(c) {
    var D = L.demoOf(c.params), s = c.state;
    var mid = [table(D, s)];
    if (audience === 'teacher' && L.numbersOf(c.params).mistake) mid.push(mistakeCard(D, s, c.params));
    c.stage.replaceChildren(h('div', { class: 'bn', dataset: { aud: audience, mode: D.mode } },
      top(D, s), h('div', { class: 'bn-mid' }, mid), lineBox(D, s, c.params)));
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var D = L.demoOf(c.params), s = c.state;
    var X = audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    var B = function (v) { return num(v); };

    if (D.mode === 'count') {
      var On = D.dir === 'on' ? 'On' : 'Back';
      if (s.phase === 'start') add(tp('cStart' + On + X + (X === 'T' && !D.fit ? '0' : ''), { n: B(D.n), by: B(D.by) }));
      else if (s.phase === 'end') add(X === 'C' ? t('cEndC') : t('cEnd' + On));
      else {
        var ch = D.changes[s.i - 1], calc = num(calcText(ch, D));
        var d0 = L.digitsOf(ch.from)[ch.grew] || 0, d1 = L.digitsOf(ch.to)[ch.grew] || 0;
        if (!ch.carries.length) {
          if (X === 'T') add(tp('cPlainT', { calc: calc, pl: placeLabel(ch.grew) }));
          else if (X === 'A') add(tp('cPlain' + On + 'A', { calc: calc, pl: placeLabel(ch.grew) }));
          else add(tp('cPlainC', { to: B(ch.to) }));
        } else {
          if (X === 'T') add(tp('cCarry' + On + 'T', { calc: calc, k: t.n(D.dir === 'on' ? 'nines' : 'zerosTo9', ch.rolled.length), pl: placeLabel(ch.grew), d0: B(d0), d1: B(d1) }));
          else if (X === 'A') add(tp('cCarry' + On + 'A', { calc: calc, pl: placeLabel(ch.grew), pe: placeLabel(D.e) }));
          else addHl(tp('cCarry' + On + 'C', { to: B(ch.to) }));
          var la = L.digitsOf(ch.from).length, lb = L.digitsOf(ch.to).length;
          if (la !== lb && X !== 'C') add(t.n('digitsNow', lb));
          var top = Math.max(la, lb) - 1;
          if (la !== lb && top >= 4 && !(top === 6 && D.dir === 'back')) (X === 'C' ? add : addHl)(t('cEdge' + top));
        }
      }
    } else if (D.mode === 'read') {
      var n = B(D.n);
      if (s.phase === 'digits') add(tp('cDigits' + X, { n: num(String(D.n)) }));
      else if (s.phase === 'classes') add(tp(D.classes.length === 1 && X !== 'C' ? 'cClassesOne' : 'cClasses' + X, { groups: num(D.classes.map(function (k) { return k.c === D.classes[0].c ? String(k.value) : ('00' + k.value).slice(-3); }).join(' | ')) }));
      else if (s.phase === 'class') {
        var cl = D.classes.filter(function (k) { return k.c === s.k; })[0];
        var vText = cl.c === D.classes[0].c ? String(cl.value) : ('00' + cl.value).slice(-3);
        if (D.n === 0) add(t('cZero'));
        else if (!cl.value) add(t((X === 'C' ? 'cNoneC' : 'cNone' + X), { cls: t('classGen' + cl.c) }));
        else {
          var w = quoted(say(L.classWordsOf(cl.value, cl.c, Simdeck.lang)));
          var vars = { cls: t('classGen' + cl.c), clsN: t('classAcc' + cl.c), v: num(vText), w: w };
          add(tp(X === 'A' && cl.c === 0 ? 'cClass0A' : 'cClass' + X, vars));
          if (X !== 'C' && vText.length === 3 && vText[0] === '0') add(t('cLeadZeros'));
        }
      } else {
        var all = quoted(words(D.n));
        if (X === 'C') addHl(tp('cWordsC', { w: quoted(cap(words(D.n))) }));
        else addHl(tp(D.classes.length === 1 ? 'cWordsT' : 'cWords' + X, { n: n, w: all }));
      }
    } else {
      var cmpEmpty = function (k) { return L.digitsOf(D.a).length <= k || L.digitsOf(D.b).length <= k; };
      if (s.phase === 'start') {
        add(tp('cCmpStart' + X, { pl: placeLabel(D.top) }));
        if (X !== 'C' && cmpEmpty(D.top)) add(t('cEmpty0'));
      } else if (s.phase === 'place') {
        var x = D.places[s.i - 1], same = x.a === x.b;
        var sign = x.a < x.b ? '<' : '>';
        var vars2 = { pl: placeLabel(x.k), name: cap(placeName(x.k)), x: B(x.a), y: B(x.b), sign: sign,
          worth: num(F(x.a * Math.pow(10, x.k))), u: num(F(Math.pow(10, x.k))), rest: num(F(Math.pow(10, x.k) - 1)) };
        if (same) add(tp(x.k === 0 && X !== 'C' ? 'cSameLast' : 'cSame' + X, vars2));
        else if (X === 'C') addHl(tp('cDiffC', vars2));
        else {
          add(tp(x.k === 0 ? 'cDiffLast' : 'cDiff' + X, vars2));
          if (cmpEmpty(x.k)) add(t('cEmpty0'));
        }
      } else {
        if (D.verdict === '=' && X !== 'C') add(t('cAllSame'));
        addHl(t(D.verdict === '<' ? 'vLess' : D.verdict === '>' ? 'vMore' : 'vEq', { a: F(D.a), b: F(D.b) }));
      }
    }
    return out;
  }

  // ── the panel: the number fields; the header: the audience switch ──
  var fields = {};
  function buildField(key, id) {
    var label = h('label', { class: 'sd-ctl-label', for: id }, h('span', null, ''));
    var input = h('input', { id: id, type: 'text', class: 'bn-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', inputmode: 'numeric', 'aria-describedby': id + '-msg' });
    var msg = h('small', { class: 'sd-hint', id: id + '-msg', role: 'status', hidden: true });
    input.title = t('numHint');
    var f = { key: key, input: input, label: label.firstChild, msg: msg, wrap: h('div', { class: 'bn-field' }, label, input, msg) };
    function reset() { input.removeAttribute('aria-invalid'); msg.textContent = ''; msg.className = 'sd-hint'; msg.hidden = true; }
    f.reset = reset;
    input.addEventListener('input', function () {
      var r = L.parseNumber(unsep(input.value));
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t({ digit: 'errDigit', max: 'errMax', empty: 'errEmpty' }[r.error], { at: r.at });
        msg.className = 'bn-err';
        msg.hidden = false;
        return;
      }
      reset();
      var patch = {}; patch[key] = r.value;
      if (r.value !== L.numbersOf(sim.params)[key]) sim.set(patch);
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { reset(); sim.render(); } });
    fields[key] = f;
    return f.wrap;
  }
  function buildNumbers() {
    var host = document.querySelector('[data-bn-numbers]');
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('numsTitle') }, buildField('n', 'bn-n'), buildField('m', 'bn-m')));
  }
  function syncPanel(c) {
    var x = L.numbersOf(c.params);
    fields.n.label.textContent = t(x.mode === 'count' ? 'numStart' : x.mode === 'read' ? 'numRead' : 'numA');
    fields.m.label.textContent = t('numB');
    fields.m.wrap.hidden = x.mode !== 'compare';
    ['n', 'm'].forEach(function (key) {
      var f = fields[key], r = L.parseNumber(unsep(f.input.value));
      var typing = document.activeElement === f.input;
      if (!typing || (!r.error && r.value !== x[key])) { f.input.value = F(x[key]); f.reset(); }
    });
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }

  buildAudience();
  buildNumbers();

  var isCount = function (p) { return L.numbersOf(p).mode === 'count'; };
  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, resets: true,
        options: L.MODES.map(function (m) { return [m, t(MODE_KEY[m])]; }), visible: function () { return false; } },
      { key: 'dir', type: 'choice', label: t('dir'), value: L.defaults.dir, resets: true,
        options: [['on', t('dirOn')], ['back', t('dirBack')]], visible: isCount },
      { key: 'e', type: 'select', label: t('by'), value: L.defaults.e, resets: true,
        options: [0, 1, 2, 3, 4, 5].map(function (e) { return [e, F(Math.pow(10, e))]; }), visible: isCount },
      { key: 'count', type: 'range', label: t('count'), value: L.defaults.count, min: 1, max: L.MAX_COUNT, resets: true, visible: isCount },
      { key: 'mistake', type: 'toggle', label: t('mistake'), value: L.defaults.mistake,
        visible: function () { return audience === 'teacher'; } },
      // the numbers: set from the fields above, kept here for the URL and the L switch
      { key: 'n', type: 'range', label: t('numsTitle'), value: L.defaults.n, min: 0, max: L.MAX, resets: true, visible: function () { return false; } },
      { key: 'm', type: 'range', label: t('numB'), value: L.defaults.m, min: 0, max: L.MAX, resets: true, visible: function () { return false; } }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    legend: [
      { shape: 'pc-band', label: t('legBand') },
      { shape: 'hl', label: t('legNew') },
      { shape: 'pc-carry', label: t('legCarry') }
    ],

    render: render,
    caption: caption
  });
  sim.render();
})();
</script>
</body>
</html>
