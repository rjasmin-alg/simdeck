<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SITE_C = { hq: '1', br: '2' };
  var NAME = { HQ: 'WSUS-HQ', BR: 'WSUS-BR', MU: 'Microsoft Update' };
  var RULER = 96;   // the ruler runs Tue 19:00 → Sat 19:00

  /** Data (names, times, sizes) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'ws-mono' : cls || null }, String(text)); }
  function q(text) { return h('b', { translate: 'no' }, String(text)); }
  /** "sri 09:30" / "Wed 09:30": the day is a word, the time data. */
  function when(tt) { var c = L.clockOf(tt); return h('span', null, t('d' + c.day), ' ', data(c.hm, '')); }
  function whenB(tt) { var c = L.clockOf(tt); return h('b', null, t('d' + c.day), ' ', data(c.hm, '')); }
  function size(s) { return q(s.update.sizeMB + ' MB'); }
  /** t.parts, with a node that fills two placeholders cloned (a DOM node can stand in one place only). */
  function P(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (p) {
      if (typeof p === 'string' || p.nodeType === 3) return p;
      var dup = seen.indexOf(p) >= 0;
      seen.push(p);
      return dup ? p.cloneNode(true) : p;
    });
  }
  /** Parts with *term* (or *=term*) turned into <em lang="en">. */
  function rich(key, vars) {
    var out = [];
    P(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*=?([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function clientOf(s, id) { return s.clients.filter(function (c) { return c.id === id; })[0]; }
  /** The site an event belongs to, for the ruler and the log. */
  function siteOf(s, e) {
    if (e.kind === 'sync' || e.kind === 'approve' || e.kind === 'content') return e.who === 'BR' ? 'br' : 'hq';
    return clientOf(s, e.who).site;
  }

  // ── clock and ruler ──
  function renderClock(c) {
    var s = c.state;
    var ruler = h('div', { class: 'ws-ruler', 'aria-hidden': 'true' },
      h('span', { class: 'ws-row-label', style: { top: '0.45rem' }, translate: 'no' }, 'HQ'),
      h('span', { class: 'ws-row-label', style: { top: '2.3rem' }, translate: 'no' }, 'BR'),
      h('div', { class: 'ws-axis' }));
    for (var d = 1; d <= 4; d++) {
      var tt = d * 24 - 19;   // midnights: Wed 00:00 is t = 5
      ruler.append(h('div', { class: 'ws-day', style: { left: (tt / RULER * 100) + '%' } }, h('span', null, t('d' + d))));
    }
    s.log.forEach(function (e) {
      ruler.append(h('span', { class: 'ws-tick' + (e.n === c.n ? ' sd-changed' : ''), dataset: { site: siteOf(s, e) },
        style: { left: (Math.min(e.t, RULER) / RULER * 100) + '%' } }));
    });
    ruler.append(h('span', { class: 'ws-mark', style: { left: (Math.min(s.t, RULER) / RULER * 100) + '%' } }));
    return h('div', { class: 'ws-clock' }, h('div', { class: 'ws-now' }, h('span', { class: 'ws-sub' }, t('clockNow')), whenB(s.t)), ruler);
  }

  // ── servers ──
  function slot(letter, name, has, changed) {
    return h('span', { class: 'ws-slot' + (changed ? ' sd-changed' : ''), dataset: has ? { has: '' } : {}, title: t(name) },
      h('b', null, t(letter)), h('span', null, has ? '✓' : '—'));
  }
  function serverExtra(c, id) {
    var s = c.state, v = s.servers[id], pv = c.prev ? c.prev.servers[id] : v;
    var approved = L.approvedFor(v, L.GROUP), pApproved = L.approvedFor(pv, L.GROUP);
    var info = [];
    if (id === 'HQ') {
      var sel = v.products.indexOf(s.update.product) >= 0;
      info.push(h('span', { class: sel ? null : 'ws-bad' }, P(sel ? 'products' : 'productsNone', { p: data(s.update.product, '') })));
    } else {
      info.push(h('span', { class: 'ws-mode', dataset: { mode: v.mode } }, t(v.mode === 'replica' ? 'modeReplica' : 'modeAutonomous')));
    }
    info.push(h('span', null, approved ? P('approvedFor', { g: data(L.GROUP, '') }) : t('notApproved')));
    var reps = Object.keys(v.reports).sort();
    info.push(h('span', null, t('statusOf'), ' ', reps.length ? data(reps.map(function (r) { return r + ' ✓'; }).join(', '), '') : t('statusNone')));
    return h('div', { class: 'ws-extra' },
      h('div', { class: 'ws-slots' },
        slot('slotM', 'slotMName', v.meta, v.meta !== pv.meta),
        slot('slotA', 'slotAName', approved, approved !== pApproved),
        slot('slotC', 'slotCName', v.content, v.content !== pv.content)),
      h('div', { class: 'ws-info' }, info));
  }

  // ── clients ──
  var STAGES = [['scanned', 'stScanned'], ['detected', 'stDetected'], ['downloaded', 'stDownloaded'], ['installed', 'stInstalled'], ['reported', 'stReported']];
  var RANK = { idle: 0, detected: 2, downloaded: 3, installed: 4, reported: 5 };
  function reached(cl) { return Math.max(RANK[cl.state], cl.scanT !== null ? 1 : 0); }
  function stageTime(cl, i) { return [cl.scanT, cl.detectT, cl.dlT, cl.installT, cl.reportT][i]; }
  function clientExtra(c, cl) {
    var pcl = c.prev ? clientOf(c.prev, cl.id) : cl;
    var now = reached(cl), before = reached(pcl);
    var e = c.n > 0 ? c.state.last : null;
    var scanChanged = !!e && e.kind === 'scan' && e.who === cl.id;
    var items = STAGES.map(function (st, i) {
      var done = now > i, changed = (done && before <= i) || (i === 0 && scanChanged && c.n > 0);
      var tt = done ? stageTime(cl, i) : null;
      return h('li', { class: changed ? 'sd-changed' : null, dataset: done ? { done: '' } : {} },
        h('span', { class: 'ws-box', 'aria-hidden': 'true' }), h('span', null, t(st[1])), tt != null ? when(tt) : h('span'));
    });
    if (cl.state === 'idle' && cl.seen && cl.seen !== 'approved') {
      items.splice(1, 0, h('li', { dataset: { done: '' } }, h('span'), h('span', { class: 'ws-seen' }, t(cl.seen === 'absent' ? 'seenAbsent' : 'seenNotApproved'))));
    }
    return h('ol', { class: 'ws-strip ws-extra' }, items);
  }

  // ── packets of this step ──
  function packetsOf(s, e) {
    if (!e) return [];
    var out = [];
    if (e.kind === 'sync' && e.who === 'HQ') {
      out.push(e.outcome === 'new' ? { from: 'MU', to: 'HQ', label: t('pkMeta'), c: 1 } : { from: 'MU', to: 'HQ', label: t('pkSkipped'), c: 1, drop: true });
    } else if (e.kind === 'sync') {
      var gm = e.got.indexOf('meta') >= 0, ga = e.got.indexOf('approval') >= 0;
      if (gm || ga) out.push({ from: 'HQ', to: 'BR', label: t(gm && ga ? 'pkMetaApproval' : gm ? 'pkMeta' : 'pkApproval'), c: 1 });
      else if (e.notInherited) out.push({ from: 'HQ', to: 'BR', label: t('pkNoApproval'), c: 1, drop: true });
      else if (!(e.rolled && e.rolled.length)) out.push({ from: 'HQ', to: 'BR', label: t('pkEmpty'), c: 1, drop: true });
      if (e.rolled && e.rolled.length) out.push({ from: 'BR', to: 'HQ', label: t('pkStatus'), c: 2 });
    } else if (e.kind === 'content') {
      out.push({ from: e.from, to: e.who, label: s.update.sizeMB + ' MB', c: e.who === 'HQ' ? 1 : 2, bulk: true });
    } else if (e.kind === 'scan') {
      out.push({ from: e.who, to: e.server, label: t('pkScan'), c: SITE_C[clientOf(s, e.who).site] });
    } else if (e.kind === 'download') {
      out.push({ from: e.server, to: e.who, label: s.update.sizeMB + ' MB', c: SITE_C[clientOf(s, e.who).site], bulk: true });
    } else if (e.kind === 'report') {
      out.push({ from: e.who, to: e.server, label: t('pkReport'), c: SITE_C[clientOf(s, e.who).site] });
    }
    return out;
  }

  /** The role line of a server: "upstream · syncs daily at 03:00". */
  function role(key, v) {
    return h('span', null, t(key), ' · ', P('syncDaily', { t: data((v.syncHour < 10 ? '0' : '') + v.syncHour + ':00', '') }));
  }
  function renderTopo(c) {
    var s = c.state, e = c.n > 0 ? s.last : null;
    var br1 = clientOf(s, 'PC-BR1'), toHq = br1.server === 'HQ';
    var active = function (id) { return e && (e.kind === 'approve' || e.kind === 'install') && e.who === id ? 'active' : null; };
    var nodes = [
      { id: 'MU', kind: 'cloud', col: 0, row: 0, name: data(NAME.MU, ''),
        lines: [{ text: s.update.id + ' · ' + s.update.sizeMB + ' MB', kind: 'addr' }, { text: t('released', { t: t('d0') + ' 19:00' }), kind: 'role' }] },
      { id: 'HQ', kind: 'server', col: 1, span: 2, row: 0, mark: 'HQ', c: 1, name: data(NAME.HQ, ''), lines: [{ text: role('roleUp', s.servers.HQ), kind: 'role' }],
        extra: serverExtra(c, 'HQ'), state: active('HQ') },
      { id: 'WAN', kind: 'cloud', col: 3, row: 0, name: data('WAN', ''), align: 'start' },
      { id: 'BR', kind: 'server', col: 4, span: 2, row: 0, mark: 'BR', c: 2, name: data(NAME.BR, ''), lines: [{ text: role('roleDown', s.servers.BR), kind: 'role' }],
        extra: serverExtra(c, 'BR'), state: active('BR') }
    ];
    s.clients.forEach(function (cl) {
      nodes.push({ id: cl.id, kind: 'host', col: cl.site === 'hq' ? 1 : 4, span: 2, row: 2, mark: cl.site === 'hq' ? 'H1' : 'B1', c: Number(SITE_C[cl.site]),
        name: data(cl.id, ''),
        lines: [{ text: t('clientServer', { srv: NAME[cl.server] }), kind: 'role' },
          { text: t('nextScan', { t: t('d' + L.clockOf(cl.nextScan).day) + ' ' + L.clockOf(cl.nextScan).hm }), kind: 'role' }],
        extra: clientExtra(c, cl), state: active(cl.id) });
    });
    var links = [
      { id: 'mu', a: 'MU', b: 'HQ' },
      { id: 'wan', a: 'HQ', b: 'BR' },
      { id: 'lan-hq', a: 'HQ', b: 'PC-HQ1' },
      { id: 'lan-br', a: 'BR', b: 'PC-BR1', state: toHq ? 'off' : 'up' }
    ];
    if (toHq) links.push({ id: 'hq-br1', a: 'HQ', b: 'PC-BR1' });
    var packets = packetsOf(s, e);
    var bulk = packets.some(function (p) { return p.bulk; });
    return Simdeck.topology({
      className: 'ws-topo' + (bulk ? ' ws-bulk' : ''),
      cols: 6, rows: ['auto', '3.4rem', 'auto'], dir: c.dir,
      nodes: nodes, links: links,
      packets: packets.map(function (p) { return { from: p.from, to: p.to, label: p.label, c: p.c, drop: p.drop, at: p.from === 'HQ' && p.to === 'BR' || p.from === 'BR' && p.to === 'HQ' ? 0.3 : null }; })
    });
  }

  // ── event log ──
  function logText(s, e) {
    var pc = function (key) { return [data(e.who, ''), ' ', t(key)]; };
    switch (e.kind) {
      case 'sync':
        if (e.who === 'HQ') return t(e.outcome === 'new' ? 'logSyncHqNew' : 'logSyncHqSkipped');
        if (e.rolled && e.rolled.length && !e.got.length) return t('logSyncBrRollup');
        if (e.got.length === 2) return t('logSyncBrMetaApproval');
        if (e.got[0] === 'meta') return t('logSyncBrMeta');
        if (e.got[0] === 'approval') return t('logSyncBrApproval');
        if (e.notInherited) return t('logSyncBrNotInherited');
        return t(e.outcome === 'empty' ? 'logSyncBrEmpty' : 'logSyncBrNothing');
      case 'approve': {
        var k = { approved: 'Br', replica: 'BrReplica', noMeta: 'BrNoMeta', already: 'BrAlready' }[e.outcome];
        if (e.who === 'HQ') return t(e.outcome === 'approved' ? 'logApproveHq' : 'logApproveHqNoMeta');
        return t('logApprove' + k);
      }
      case 'content': return t(e.who === 'HQ' ? 'logContentHq' : 'logContentBr');
      case 'scan': return pc({ detected: 'logScanDetected', notApproved: 'logScanNotApproved', absent: 'logScanAbsent', approved: 'logScanDetected' }[e.outcome]);
      case 'download': return pc(e.wan ? 'logDownloadWan' : 'logDownload');
      case 'install': return pc('logInstall');
      case 'report': return pc('logReport');
    }
    return '';
  }
  function renderLog(c) {
    var s = c.state;
    var list = h('ol', null, s.log.map(function (e) {
      var cl = L.clockOf(e.t);
      return h('li', { class: e.n === c.n ? 'sd-changed' : null, dataset: { site: siteOf(s, e) } },
        data(e.n + '.', 'ws-n'), h('span', null, t('d' + cl.day), ' ', data(cl.hm)), h('span', null, logText(s, e)));
    }));
    return h('section', { class: 'ws-log' }, h('h2', null, t('logTitle')), s.log.length ? list : h('p', { class: 'ws-sub' }, t('logEmpty')));
  }

  /** Drop the oldest log rows that do not fit, and say how many (the newest row is always shown). */
  function fitLog(box) {
    var ol = box.querySelector('ol');
    if (!ol) return;
    var dropped = 0;
    while (box.scrollHeight > box.clientHeight + 1 && ol.children.length > (dropped ? 2 : 1)) {
      ol.removeChild(dropped ? ol.children[1] : ol.firstChild);
      if (!dropped) ol.prepend(h('li', { class: 'ws-more' }));
      dropped++;
    }
    if (dropped) ol.firstChild.textContent = t.n('earlier', dropped);
  }

  // ── captions ──
  function eventCaption(s, e) {
    var kb = q(s.update.id), g = q(L.GROUP);
    var cl = e.who && e.who.indexOf('PC-') === 0 ? clientOf(s, e.who) : null;
    var pc = cl ? q(cl.id) : null, srv = e.server ? q(NAME[e.server]) : null;
    switch (e.kind) {
      case 'sync':
        if (e.who === 'HQ') return rich(e.outcome === 'new' ? 'capSyncHqNew' : 'capSyncHqSkipped', { kb: kb });
        if (e.rolled && e.rolled.length && !e.got.length) return P('capSyncBrRollup', { pcs: q(e.rolled.join(', ')) });
        var gm = e.got.indexOf('meta') >= 0, ga = e.got.indexOf('approval') >= 0, out;
        if (gm && ga) out = rich('capSyncBrMetaApproval', { kb: kb });
        else if (gm) out = rich(e.mode === 'replica' ? 'capSyncBrMeta' : e.notInherited ? 'capSyncBrMetaNotInherited' : 'capSyncBrMetaAuto', { kb: kb });
        else if (ga) out = rich('capSyncBrApproval', {});
        else if (e.notInherited) out = rich('capSyncBrNotInherited', { kb: kb });
        else out = P(e.outcome === 'empty' ? 'capSyncBrEmpty' : 'capSyncBrNothing', { kb: kb });
        if (e.rolled && e.rolled.length) out = out.concat([' ']).concat(P('capSyncBrRollup', { pcs: q(e.rolled.join(', ')) }));
        return out;
      case 'approve':
        if (e.who === 'HQ') return P(e.outcome !== 'approved' ? 'capApproveHqNoMeta' : s.servers.HQ.contentT !== null && s.servers.HQ.contentT <= e.t ? 'capApproveHqHas' : 'capApproveHq', { kb: kb, g: g });
        if (e.outcome === 'replica') return rich('capApproveBrReplica', { kb: kb });
        if (e.outcome === 'approved') return P(s.servers.HQ.content ? 'capApproveBr' : 'capApproveBrFetch', { kb: kb, g: g });
        return P(e.outcome === 'noMeta' ? 'capApproveBrNoMeta' : 'capApproveBrAlready', { kb: kb });
      case 'content': return P(e.who === 'HQ' ? 'capContentHq' : clientOf(s, 'PC-BR1').server === 'BR' ? 'capContentBr' : 'capContentBrUnused', { kb: kb, size: size(s) });
      case 'scan':
        return P({ detected: 'capScanDetected', notApproved: 'capScanNotApproved', absent: 'capScanAbsent', approved: 'capScanDetected' }[e.outcome],
          { pc: pc, srv: srv, kb: kb });
      case 'download': return P(e.wan ? 'capDownloadWan' : 'capDownload', { pc: pc, srv: srv, kb: kb, size: size(s) });
      case 'install': return P('capInstall', { pc: pc, kb: kb });
      case 'report': {
        var r = P('capReport', { pc: pc, srv: srv, kb: kb });
        if (e.server === 'BR') r.push(t(s.servers.BR.mode === 'replica' ? 'capReportReplica' : 'capReportAuto'));
        return r;
      }
    }
    return [];
  }
  function endNote(s) {
    var kb = q(s.update.id), br = s.servers.BR, br1 = clientOf(s, 'PC-BR1');
    if (!s.servers.HQ.meta) return P('capEndNotSynced', {});
    if (s.clients.every(function (cl) { return cl.state === 'reported'; })) return P('capEndDone', { kb: kb });
    if (br1.server === 'BR' && br.mode === 'autonomous' && !L.approvedFor(br, L.GROUP)) return P('capEndWaiting', { kb: kb });
    return [];
  }
  function caption(c) {
    var s = c.state;
    if (c.first) return P('capStart', { t: whenB(0), kb: q(s.update.id) });
    var out = P('capStep', { n: c.n, t: whenB(s.last.t) }).concat(eventCaption(s, s.last));
    if (c.last) out = out.concat(endNote(s));
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: [['replica', t('modeReplica')], ['autonomous', t('modeAutonomous')]] },
      { key: 'upstreamProducts', type: 'toggle', label: t('upstreamProducts') },
      { key: 'branchPointsToHQ', type: 'toggle', label: t('branchPointsToHQ') },
      { key: 'approveAt', type: 'choice', label: t('approveAt'), hint: t('approveHint'), options: [[14, t('approveWed9')], [8.5, t('approveWed0330')]] },
      // brAt (in the model's defaults, no control of its own): the step after which the branch admin approves
      { type: 'button', label: t('brApprove'), hint: t('brApproveHint'), key: 'a', run: function (sim) { sim.set({ brAt: sim.n }); } }
    ],

    presets: [
      { id: 'replica-two-sites', label: t('presetReplica'), hint: t('presetReplicaHint'), params: {} },
      { id: 'autonomous-waits', label: t('presetAutonomous'), hint: t('presetAutonomousHint'), params: { mode: 'autonomous' } },
      { id: 'replica-cant-approve', label: t('presetCantApprove'), hint: t('presetCantApproveHint'), params: { brAt: 2 }, step: 2 },
      { id: 'not-synced', label: t('presetNotSynced'), hint: t('presetNotSyncedHint'), params: { upstreamProducts: false } },
      { id: 'client-points-to-hq', label: t('presetToHq'), hint: t('presetToHqHint'), params: { branchPointsToHQ: true } }
    ],

    legend: [
      { shape: 'ws-has', label: t('legendSlot') },
      { shape: 'hollow', label: t('legendSlotNo') },
      { shape: 'line', label: t('legendThin') },
      { shape: 'ws-thick', label: t('legendThick') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var log = renderLog(c);
      c.stage.replaceChildren(h('div', { class: 'ws' }, renderClock(c), renderTopo(c), log));
      fitLog(log);
    },

    caption: caption
  });
})();
</script>
</body>
</html>
