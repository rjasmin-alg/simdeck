    var o = ck.outcome;
    return h('div', { class: 'se-link' },
      h('span', { class: 'se-sm' }, t('linkAsk')),
      h('div', { class: 'se-arrow', dataset: { dir: 'l', k: o === 'fail' ? 'fail' : 'ok' } }),
      e.kind === 'run' ? h('span', { class: 'se-count', translate: 'no' }, '× ' + e.count) : null,
      h('strong', null, t(ck.kind === 'refresh' ? 'kRefresh' : 'kRetry')),
      h('span', { class: 'se-badge se-outcome', dataset: { k: o } }, t({ transfer: 'oTransfer', current: 'oCurrent', fail: 'oFail' }[o])));
  }
  function queryLink(s) {
    var fail = s.client.rcode === 'SERVFAIL';
    return h('div', { class: 'se-link' },
      h('div', { class: 'se-arrow', dataset: { dir: 'l', k: 'ok' } }),
      h('div', { class: 'se-arrow', dataset: { dir: 'r', k: fail ? 'fail' : 'ok' } }));
  }
  function timerRow(c, key, label, soaKey, value, bar, text) {
    return h('div', { class: 'se-tm' + (has(c, key) ? ' se-hl' : '') },
      h('div', { class: 'se-tm-label' }, key === 'expire' ? h('span', { class: 'se-clock', 'aria-hidden': 'true' }) : null, h('strong', null, t(label)),
        h('span', { class: 'se-muted se-sm', translate: 'no' }, soaKey + ' ' + t('sec', { v: num(value) }))),
      bar, h('div', { class: 'se-sm se-tm-text' }, text));
  }
  function bar(k, frac, attrs) {
    return h('div', { class: 'se-bar', dataset: Object.assign({ k: k }, attrs || {}) },
      h('span', { style: { width: Math.max(0, Math.min(100, frac * 100)) + '%' } }));
  }
  function timers(c, sc, s) {
    var S = s.secondary, soa = s.soa;
    var rows = [];
    rows.push(S.nextRefresh !== null
      ? timerRow(c, 'refresh', 'tmRefresh', 'REFRESH', soa.refresh, bar('refresh', 1 - (S.nextRefresh - s.t) / soa.refresh), t('tmNextRefresh', { at: when(sc, S.nextRefresh) }))
      : timerRow(c, 'refresh', 'tmRefresh', 'REFRESH', soa.refresh, bar('refresh', 0, { off: '' }), t('tmOffRefresh')));
    rows.push(S.nextRetry !== null
      ? timerRow(c, 'retry', 'tmRetry', 'RETRY', soa.retry, bar('retry', 1 - (S.nextRetry - s.t) / soa.retry), t('tmNextRetry', { at: when(sc, S.nextRetry) }))
      : timerRow(c, 'retry', 'tmRetry', 'RETRY', soa.retry, bar('retry', 0, { off: '' }), t('tmOffRetry')));
    rows.push(S.expired
      ? timerRow(c, 'expire', 'tmExpire', 'EXPIRE', soa.expire, bar('expire', 1, { expired: '' }), t('tmExpiredAt', { at: when(sc, S.expiredAt) }))
      : timerRow(c, 'expire', 'tmExpire', 'EXPIRE', soa.expire, bar('expire', (s.t - S.lastOk) / soa.expire), t('tmExpireAt', { at: when(sc, S.expireAt), left: dur(S.expireAt - s.t) })));
    return h('div', { class: 'se-timers', 'aria-label': t('tmTitle') }, rows);
  }
  function logText(e) {
    if (e.kind === 'action') {
      if (!e.applied) return t('lgNoop');
      return t({ edit: e.bumped ? 'lgEdit' : 'lgEditNo', kill: 'lgKill', revive: 'lgRevive' }[e.act]);
    }
    var out = [];
    if (e.expired) out.push(t('lgExpired'));
    if (e.check) {
      out.push(t(e.check === 'refresh' ? 'kRefresh' : 'kRetry') + (e.kind === 'run' ? ' ×' + e.count : '') + ' ' +
        t({ transfer: 'oTransfer', current: 'oCurrent', fail: 'oFail' }[e.outcome]));
    }
    return out.join(' · ');
  }
  function log(c, sc, s) {
    var items = [{ t: 0, text: t('lgStart') }].concat(s.log.map(function (e) { return { t: e.t, text: logText(e) }; }));
    var shown = items.slice(-8);
    return h('section', { class: 'se-log' }, h('h2', null, t('logTitle')),
      h('ol', null, shown.map(function (it, i) {
        return h('li', { 'aria-current': i === shown.length - 1 ? 'step' : null }, h('span', { translate: 'no', class: 'se-mono' }, when(sc, it.t)), h('span', null, it.text));
      })));
  }
  function has(c, k) { return !c.first && c.state.changed.indexOf(k) >= 0; }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = c.params, sc = L.SCENES[s.scene], prev = c.prev, e = s.ev, S = s.secondary, Pr = s.primary;
    // the lab's long names are on the cards; captions say P and S (the estate's short names stay)
    var q = sc.qname, nP = b(s.scene === 'estate' ? sc.primary : 'P'), nS = b(s.scene === 'estate' ? sc.secondary : 'S'), out = [];
    function say(parts) { if (out.length) out.push(' '); out.push.apply(out, parts); }
    var now = upper(when(sc, s.t));
    if (c.first) {
      say(parts('capStart', { t: now, s: nS, p: nP, zone: b(sc.zone), serial: b(S.serial) }));
      if (sc.lastXfer !== 0) say(parts('capXfer', { xfer: when(sc, sc.lastXfer) }));
      say(parts('capTimers', { refresh: secs(p.refresh), retry: secs(p.retry), expire: secs(p.expire), at: when(sc, S.expireAt), p: nP }));
      if (!s.done) say([t(Pr.up && p.killAt === L.NONE ? 'capPressK' : 'capPress')]);
    } else if (e.kind === 'action') {
      if (e.act === 'edit') {
        if (!e.applied) say(parts('capEditSkip', { t: now, p: nP }));
        else {
          say(parts(e.bumped ? 'capEdit' : 'capEditNoBump', { t: now, p: nP, name: b(sc.edit.name), value: b(sc.edit.value), serial: b(Pr.serial) }));
          if (S.records[q] !== Pr.records[q]) say(parts('capNotYet', { s: nS, old: b(S.records[q]) }));
        }
      } else if (!e.applied) say(parts('capNoop', { t: now }));
      else if (e.act === 'kill') say(parts('capKill', { t: now, p: nP, s: nS }));
      else if (S.nextRetry === null) say(parts('capReviveQuiet', { t: now, p: nP, s: nS }));
      else say(parts('capRevive', { t: now, p: nP, s: nS, next: when(sc, L.nextCheckAt(S)) }));
    } else if (e.kind === 'moment') {
      var ck = e.check;
      if (e.expired) {
        say(parts('capExpired', { t: now, expire: t('sec', { v: num(p.expire) }) }));
        if (ck && ck.outcome === 'fail') say(parts('capExpiredMore', { s: nS, retry: secs(p.retry) }));
      } else {
        say(parts('capCheck', { t: now, kind: t(ck.kind === 'refresh' ? 'kRefresh' : 'kRetry') }));
      }
      if (ck && (!e.expired || ck.outcome !== 'fail')) {
        if (ck.outcome === 'transfer') {
          say(prev.secondary.expired || e.expired ? parts('capReload', { p: nP, s: nS })
            : parts('capTransfer', { p: nP, s: nS, sp: b(ck.serialP), ss: b(prev.secondary.serial), value: b(S.records[q]) }));
          say(parts('capRestart', { exp: when(sc, S.expireAt) }));
        } else if (ck.outcome === 'current') {
          say(S.records[q] !== Pr.records[q]
            ? parts('capCurrentDiff', { sp: b(ck.serialP), p: nP, s: nS, name: b(q), pv: b(Pr.records[q]), sv: b(S.records[q]) })
            : parts('capCurrent', { sp: b(ck.serialP), p: nP, s: nS }));
          say(parts('capRestart', { exp: when(sc, S.expireAt) }));
        } else if (S.expired) say(parts('capFailExpired', { p: nP, s: nS }));
        else if (ck.kind === 'refresh') say(parts('capFailRefresh', { p: nP, s: nS, retry: secs(p.retry), exp: when(sc, S.expireAt) }));
        else say(parts('capFailRetry', { p: nP, retry: secs(p.retry), left: dur(S.expireAt - s.t) }));
      }
    } else if (e.kind === 'run') {
      var sp = upper(span(sc, e.from, e.t));
      if (e.check.outcome === 'fail') {
        say(parts(S.expired ? 'capRunRetryExpired' : 'capRunRetry', { span: sp, n: t.n('retries', e.count), p: nP, s: nS, left: dur(S.expireAt - s.t) }));
      } else {
        say(parts('capRunRefresh', { span: sp, n: t.n(e.check.kind === 'refresh' ? 'refreshes' : 'retries', e.count), serial: b(S.serial), exp: when(sc, S.expireAt) }));
        if (S.records[q] !== Pr.records[q]) say(parts('capRunDiff', { s: nS, p: nP, sv: b(S.records[q]), pv: b(Pr.records[q]) }));
      }
    }
    if (s.done && !c.first) {
      if (!Pr.up) say(parts('capEndDown', { p: nP, s: nS }));
      else {
        // offer only the actions this run still has
        var keys = ['edit', 'kill'].filter(function (k) { return s.acted.indexOf(k) < 0; }).map(function (k) { return k === 'edit' ? 'E' : 'K'; });
        say([keys.length ? t('capEndUp', { keys: keys.join(', ') }) : t('capEndUpR')]);
      }
    }
    if (note) { out.unshift(note, ' '); note = null; }
    return out;
  }

  // ── buttons: an action at the moment shown, processed as the next step; later scheduled actions are dropped ──
  function act(sim, kind) {
    var s = sim.state, p = sim.params, why = null;
    if (kind === 'kill' && !s.primary.up) why = 'noteKillDown';
    else if (kind === 'revive' && s.primary.up) why = 'noteReviveUp';
    else if (kind === 'edit' && !s.primary.up) why = 'noteEditDown';
    else if (s.acted.indexOf(kind) >= 0) why = 'noteOnce';
    else if (sim.n >= L.MAX_STEPS) why = 'noteLimit';
    if (why) { note = t(why); sim.render(); return; }
    // after an action at this same moment the new one comes a second later, so the steps shown so far stay as they are
    var at = s.lastActionAt === s.t ? s.t + 1 : s.t;
    var patch = {};
    ACTS.forEach(function (k) { if (s.acted.indexOf(k) < 0 && p[k + 'At'] !== L.NONE) patch[k + 'At'] = L.NONE; });
    patch[kind + 'At'] = at;
    sim.set(patch, { preset: sim.preset });
    sim.next();
  }

  var hidden = function () { return false; };
  var atParam = function (key, label) {
    return { key: key, type: 'range', label: t(label), min: L.NONE, max: 99999999, step: 1, visible: hidden };
  };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'refresh', type: 'range', label: t('pRefresh'), min: 900, max: 86400, step: 300, format: secs, resets: true },
      { key: 'retry', type: 'range', label: t('pRetry'), min: 300, max: 7200, step: 300, format: secs, resets: true },
      { key: 'expire', type: 'choice', label: t('pExpire'), resets: true, options: [[604800, secs(604800)], [1209600, secs(1209600)]] },
      { key: 'bumpSerial', type: 'toggle', label: t('pBump'), resets: true },
      { type: 'button', label: t('bEdit'), hint: t('bHint'), key: 'e', run: function (sim) { act(sim, 'edit'); } },
      { type: 'button', label: t('bKill'), hint: t('bHint'), key: 'k', run: function (sim) { act(sim, 'kill'); } },
      { type: 'button', label: t('bRevive'), hint: t('bHint'), key: 'v', run: function (sim) { act(sim, 'revive'); } },
      // the zone and the actions (set by presets and the buttons): hidden, but kept in the URL so a link, a reload or
      // L keeps a run the buttons made
      { key: 'scene', type: 'choice', label: t('pScene'), resets: true, visible: hidden, options: [['lab', 'lab.example'], ['estate', 'qm.internal']] },
      atParam('editAt', 'pEditAt'),
      atParam('killAt', 'pKillAt'),
      atParam('reviveAt', 'pReviveAt')
    ],

    presets: [
      { id: 'book-edit', label: t('prEdit'), hint: t('prEditHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: 600, killAt: -1, reviveAt: -1 } },
      { id: 'no-serial-bump', label: t('prNoBump'), hint: t('prNoBumpHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: false, editAt: 600, killAt: -1, reviveAt: -1 } },
      { id: 'primary-dies', label: t('prDies'), hint: t('prDiesHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: -1, killAt: 0, reviveAt: -1 } },
      { id: 'estate-14-days', label: t('prEstate'), hint: t('prEstateHint'),
        params: { scene: 'estate', refresh: 10800, retry: 3600, expire: 1209600, bumpSerial: true, editAt: -1, killAt: 10680, reviveAt: -1 } },
      { id: 'revived-in-time', label: t('prRevived'), hint: t('prRevivedHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: -1, killAt: 0, reviveAt: 432000 } }
    ],

    legend: [
      { shape: 'se-refresh', label: t('lgdRefresh') },
      { shape: 'se-retry', label: t('lgdRetry') },
      { shape: 'se-expire', label: t('lgdExpire') },
      { shape: 'se-expired', label: t('lgdExpired') },
      { shape: 'hl', label: t('lgdChanged') }
    ],

    render: function (c) {
      var s = c.state, sc = L.SCENES[s.scene], prev = c.first ? null : c.prev;
      c.stage.replaceChildren(h('div', { class: 'se' },
        primaryCard(c, sc, s, prev), checkLink(c, s), secondaryCard(c, sc, s, prev), queryLink(s), clientCard(c, sc, s),
        log(c, sc, s)));
    },

    caption: caption
  });
})();
</script>
</body>
