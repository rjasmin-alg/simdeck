     decides (pg_hba.conf: its method is checked next, with no fall-through); a request that matches nothing meets the

     rules: SPEC.md; words: strings.js. -->

[data-sim="rule-first-match"] .rf-box { border: var(--line-w) solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 0.5rem 0.8rem 0.6rem; min-width: 0; }

[data-sim="rule-first-match"] td.sd-changed { background: var(--hl); color: var(--on-hl); }

  [data-sim="rule-first-match"] .sd-stage { height: auto; container-type: inline-size; }

  [data-sim="rule-first-match"] .rf-tally { grid-column: auto; }

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = ['1', '2', '5'];
  var COLS = {
    pg: [['type', 'colType'], ['db', 'colDb'], ['user', 'colUser'], ['addr', 'colAddr']],
    acl: [['proto', 'colProto'], ['src', 'colSrc'], ['srcPort', 'colSrcPort'], ['dst', 'colDst'], ['dstPort', 'colDstPort']]
  };
  var OUT_WORD = { permit: 'outPermit', deny: 'outDeny', accept: 'outAccept', reject: 'outReject' };
  var OK = { permit: true, accept: true, deny: false, reject: false };

  /** Data (rule text, addresses, numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function list(items) {
    items = items.slice();
    if (items.length === 1) return items[0];
    var last = items.pop();
    var head = items.reduce(function (acc, it) { return acc === null ? it : t('listMore', { a: acc, b: it }); }, null);
    return t('list2', { a: head, b: last });
  }
  /** A field of a rule row as text: /32 hosts lose the length, local rows have no address. */
  function cellText(key, v) {
    if (v === null) return '';
    if ((key === 'src' || key === 'dst') && /\/32$/.test(v)) return v.replace(/\/32$/, '');
    return String(v);
  }
  function outcomeNode(outcome) {
    return h('span', { class: 'rf-out', dataset: { ok: String(OK[outcome]) } }, (OK[outcome] ? '✓ ' : '✕ ') + t(OUT_WORD[outcome]));
  }
  function whyText(m, req) {
    if (m.why === 'name') return h('span', null, t.parts(m.ok ? 'whyNameOk' : 'whyName', { os: data(req.fields.osUser), user: data(req.fields.user) }));
    if (m.why === 'password') return t('whyPassword');
    return t(m.why === 'trust' ? 'whyTrust' : 'whyReject');
  }
  function pktText(f) { return f.src + ':' + f.srcPort + ' → ' + f.dst + ':' + f.dstPort; }
  function resultOf(s, req) { return s.results.filter(function (r) { return r.req === req.id; })[0] || null; }

  function renderQueue(c) {
    var s = c.state, fwd = c.dir === 'forward';
    var box = h('section', { class: 'rf-box rf-queue' }, h('h2', null, t('queueTitle')));
    s.requests.forEach(function (q, i) {
      var f = q.fields, res = resultOf(s, q);
      var cur = i === s.cur, wait = i > s.cur;
      var head = h('div', { class: 'rf-card-h' },
        h('span', { class: 'rf-num sd-fill', dataset: { c: COLOUR[(q.n - 1) % 3] } }, String(q.n)),
        h('span', null, t('reqN', { n: q.n })),
        res ? h('span', { class: (cur && s.phase === 'decided' && fwd ? 'sd-anim-in' : null) }, outcomeNode(res.outcome))
          : cur ? h('span', { class: 'rf-badge' }, t('now')) : null);
      var lines;
      if (s.kind === 'pg') {
        lines = [
          h('div', null, f.type === 'local' ? rich('cardSocket') : t.parts('cardTcp', { addr: data(f.addr) })),
          h('div', null, t.parts('cardUser', { user: data(f.user) })),
          h('div', null, t.parts('cardDb', { db: data(f.db) })),
          h('div', null, t.parts('cardOs', { os: data(f.osUser) }))
        ];
      } else {
        lines = [
          q.dir ? h('div', { class: 'rf-dir' }, t(q.dir === 'out' ? 'dirOut' : q.dir === 'reply' ? 'dirReply' : 'dirUnsolicited')) : null,
          h('div', null, data(f.proto + ' ' + f.src + ':' + f.srcPort)),
          h('div', null, data('→ ' + f.dst + ':' + f.dstPort))
        ];
      }
      box.append(h('div', { class: 'rf-card' + (cur ? ' rf-cur' : '') + (wait ? ' rf-wait' : ''), dataset: { c: COLOUR[(q.n - 1) % 3] } }, head, lines));
    });
    return box;
  }

  function renderTable(c) {
    var s = c.state, fwd = c.dir === 'forward';
    var cols = COLS[s.kind];
    var req = s.cur >= 0 ? s.requests[s.cur] : null;
    var matchRow = s.marks.indexOf('match');
    var implicitHit = s.phase === 'decided' && s.outcome && s.outcome.reason === 'implicit';
    var rowNow = req ? s.row : -1;
    var chip = function () {
      return req ? h('span', { class: 'rf-num sd-fill' + (fwd ? ' sd-anim-in' : ''), dataset: { c: COLOUR[(req.n - 1) % 3] } }, req.n + ' ▸') : null;
    };

    var head = h('tr', null, h('th', { class: 'rf-ptr' }), h('th', null, t('colNo')),
      cols.map(function (col) { return h('th', null, t(col[1])); }),
      h('th', null, t(s.kind === 'pg' ? 'colMethod' : 'colAction')),
      h('th', null, req ? t('colMark', { n: req.n }) : t('colMarkNone')));

    var rows = s.rules.map(function (r, i) {
      var tested = s.test && s.test.row === i;
      var mark = s.marks[i];
      var skip = req && matchRow >= 0 && i > matchRow;
      var cls = [mark === 'match' ? 'rf-match' : '', skip ? 'rf-skip' : '', s.shadow[i] >= 0 ? 'rf-shadowed' : ''].join(' ').trim();
      var no = h('td', { class: 'rf-no' }, data(r.label),
        r.fixed ? h('span', { class: 'rf-flag', dataset: { k: 'fix' } }, t('fixTag')) : null,
        r.was ? h('span', { class: 'rf-flag', dataset: { k: 'was' } }, t('wasLabel', { r: r.was })) : null);
      var cells = cols.map(function (col) {
        var miss = tested && !s.test.fields[col[0]];
        return h('td', null, data(cellText(col[0], r.match[col[0]]), miss ? 'rf-miss' : null));
      });
      var markCell;
      var now = i === rowNow && s.row < s.rules.length;
      if (mark === 'no') markCell = '–';
      else if (mark === 'match') {
        var res = s.phase === 'decided' ? s.outcome : null;
        markCell = [h('span', { style: { whiteSpace: 'nowrap' } }, '▶ ' + t('markMatch')), res ? ' ' : null, res ? outcomeNode(res.outcome) : null,
          res && s.method ? h('span', { class: 'rf-why' }, whyText(s.method, req)) : null];
      } else if (skip) markCell = t('markSkip');
      else markCell = '';
      return h('tr', { class: cls || null },
        h('td', { class: 'rf-ptr' }, now ? chip() : null),
        no, cells,
        h('td', { class: 'rf-act' }, data(r.action)),
        h('td', { class: 'rf-mark' + (now ? ' sd-changed' : '') + (now && fwd ? ' sd-anim-in' : '') }, markCell,
          s.shadow[i] >= 0 ? h('span', { class: 'rf-flag', dataset: { k: 'shadow' } }, '⚠ ' + t('shadowOf', { r: s.rules[s.shadow[i]].label })) : null));
    });

    var impNow = req && s.row >= s.rules.length;
    rows.push(h('tr', { class: 'rf-implicit' + (implicitHit ? ' rf-hit' : '') + (req && matchRow >= 0 ? ' rf-skip' : '') },
      h('td', { class: 'rf-ptr' }, impNow ? chip() : null),
      h('td', { class: 'rf-no' }, ''),
      h('td', { colspan: String(cols.length) }, t(s.kind === 'pg' ? 'implicitPg' : 'implicitAcl')),
      h('td', { class: 'rf-act' }, data(s.implicit)),
      h('td', { class: 'rf-mark' + (impNow ? ' sd-changed' : '') + (impNow && fwd ? ' sd-anim-in' : '') },
        implicitHit ? outcomeNode(s.outcome.outcome) : req && matchRow >= 0 ? t('markSkip') : '')));

    return h('section', { class: 'rf-box rf-tbox' }, h('h2', null, t('tableTitle')),
      h('div', { class: 'rf-scroll' }, h('table', { class: 'rf-table' }, h('thead', null, head), h('tbody', null, rows))));
  }

  function renderTally(c) {
    var s = c.state, fwd = c.dir === 'forward';
    var box = h('section', { class: 'rf-box rf-tally' }, h('h2', null, t('tallyTitle')));
    if (!s.results.length) { box.append(h('p', { class: 'rf-empty', style: { margin: '0' } }, t('tallyEmpty'))); return box; }
    box.append(h('ol', null, s.results.map(function (r, i) {
      var q = s.requests.filter(function (x) { return x.id === r.req; })[0];
      var last = i === s.results.length - 1 && s.phase === 'decided' && c.prev && c.prev.results.length < s.results.length;
      return h('li', { class: last ? 'sd-changed' + (fwd ? ' sd-anim-in' : '') : null },
        h('span', { class: 'rf-num sd-fill', dataset: { c: COLOUR[(q.n - 1) % 3] } }, String(q.n)),
        h('span', null, '→'),
        h('span', null, r.row >= 0 ? t.parts('tallyRow', { r: data(r.label) }) : t('tallyImplicit')),
        r.method ? data(r.method) : null,
        h('span', null, '→'),
        outcomeNode(r.outcome));
    })));
    return box;
  }

  function fixCaption(s, p) {
    var f = L.sceneOf(p).fix, fixed = s.rules.filter(function (r) { return r.fixed; })[0];
    if (!fixed) return [];
    if (f.op === 'edit') return rich('fixEdit', { r: data(fixed.label), m: data(fixed.action) });
    if (f.op === 'add') return rich('fixAdd', { r: data(fixed.label) });
    var top = s.rules.indexOf(fixed) === 0;
    return rich(top ? 'fixMoveTop' : 'fixMoveEnd', { was: data(fixed.was), r: data(fixed.label) });
  }
  function shadowCaption(s) {
    var dead = [];
    s.shadow.forEach(function (by, i) { if (by >= 0) dead.push({ i: i, by: by }); });
    if (!dead.length) return [];
    var sameBy = dead.every(function (d) { return d.by === dead[0].by; });
    if (dead.length > 1 && sameBy) {
      return rich('capShadowMany', { rs: data(list(dead.map(function (d) { return s.rules[d.i].label; }))), by: data(s.rules[dead[0].by].label) });
    }
    var out = [];
    dead.forEach(function (d) { out = out.concat(rich('capShadow', { r: data(s.rules[d.i].label), by: data(s.rules[d.by].label) })); });
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'select', label: t('scene'), resets: true,
        options: [['pg-hba', t('scenePg')], ['pg-hba-append', t('scenePgAppend')], ['router-acl', t('sceneAcl')],
          ['stateless-reply', t('sceneStateless')], ['permit-any-top', t('sceneTop')]] },
      { key: 'request', type: 'choice', label: t('request'), resets: true, options: [['all', t('reqAll')], [1, '1'], [2, '2'], [3, '3']] },
      { key: 'fix', type: 'toggle', label: t('fix'), hint: t('fixHint') },
      { key: 'mode', type: 'choice', label: t('mode'), resets: true, options: [['row', t('modeRow')], ['request', t('modeReq')]] }
    ],

    presets: [
      { id: 'pg-hba', label: t('presetPg'), params: { scene: 'pg-hba' }, hint: t('presetPgHint') },
      { id: 'pg-hba-append', label: t('presetPgAppend'), params: { scene: 'pg-hba-append' }, hint: t('presetPgAppendHint') },
      { id: 'router-acl', label: t('presetAcl'), params: { scene: 'router-acl' }, hint: t('presetAclHint') },
      { id: 'stateless-reply', label: t('presetStateless'), params: { scene: 'stateless-reply' }, hint: t('presetStatelessHint') },
      { id: 'permit-any-top', label: t('presetTop'), params: { scene: 'permit-any-top' }, hint: t('presetTopHint') }
    ],

    legend: [
      { shape: 'no', label: t('legNo') },
      { shape: 'match', label: t('legMatch') },
      { shape: 'skip', label: t('legSkip') },
      { shape: 'shadow', label: t('legShadow') },
      { shape: 'outcome', label: t('legOutcome') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'rf' }, renderQueue(c), renderTable(c), renderTally(c)));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      var req = s.cur >= 0 ? s.requests[s.cur] : null;
      var Q = req ? data(req.n) : null;
      var out = [];
      if (s.phase === 'start') {
        out.push(t.n('capStart', s.requests.length));
        out = out.concat(rich('capStartRule'), fixCaption(s, p), shadowCaption(s));
        return out;
      }
      var r = s.row >= 0 && s.row < s.rules.length ? s.rules[s.row] : null;
      if (s.phase === 'nomatch') {
        var miss = COLS[s.kind].filter(function (col) { return !s.test.fields[col[0]]; }).map(function (col) { return t(col[1]); });
        out = out.concat(rich('capNo', { q: Q, r: data(r.label), fields: list(miss) }));
        out = out.concat(s.row + 1 < s.rules.length ? rich('capNext', { r: data(s.rules[s.row + 1].label) }) : rich('capLast'));
        return out;
      }
      if (s.phase === 'match') return rich('capMatchPg', { q: Q, r: data(r.label), m: data(r.action) });
      var o = s.outcome;
      if (o.reason === 'implicit') {
        out = out.concat(s.kind === 'pg' ? rich('capImplicitPg', { q: Q }) : rich('capImplicitAcl', { pkt: data(pktText(req.fields)) }));
        if (p.scene === 'stateless-reply' && req.dir === 'reply') out = out.concat(rich('noteReplyAlone'));
        return out;
      }
      if (o.reason === 'action') out = out.concat(rich('capAction', { q: Q, r: data(r.label), a: h('b', null, data(r.action)) }));
      else out = out.concat(rich(o.reason === 'method-ok' ? 'capMethodOk' : 'capMethodFail', { r: data(r.label), m: data(s.method.method), why: whyText(s.method, req) }));
      var later = L.laterMatch(s.kind, s.rules, req, s.row);
      if (later && later.outcome !== o.outcome) {
        var key = { permit: 'capLaterPermit', deny: 'capLaterDeny', accept: 'capLaterAccept', reject: 'capLaterReject' }[later.outcome];
        out = out.concat(rich(key, { r: data(later.label) }));
      }
      if (p.scene === 'stateless-reply' && p.fix && req.dir === 'unsolicited') out = out.concat(rich('noteWide'));
      return out;
    }
  });
})();
</script>
</body>
