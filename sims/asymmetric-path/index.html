<!-- asymmetric-path: an organization with two exits, each with an edge device that keeps connection state. The request
     leaves through exit 1, which records the connection; the reply comes back through the exit the internet chooses.
     Through exit 2 it finds no entry and is dropped, although the server sent it. A stepper of six packet moves; kit
     view K2 draws the scene, the page draws the packet on the wire and the two captures. Model: sim.js; rules:
     SPEC.md; words: strings.js. -->

<head>

  "id": "asymmetric-path",
  "title": {

  },

  },

<style>
/* Page CSS: every selector starts with [data-sim="asymmetric-path"]; colours only from kit tokens.
   Layout: the packet on the wire (and the two captures) on top, the kit's K2 topology under it: twelve columns
   (user over two, a gap, the two exits over three, a gap, the internet over two, a gap, the server over two) and three rows (exit 1, the middle line,
   exit 2). */
[data-sim="asymmetric-path"] .ap {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 2.4cqh;
  height: 100%;
  padding: 2cqh 1.5cqw;
  font-size: 1.05rem;
}
[data-sim="asymmetric-path"] .ap .sd-topo { row-gap: 2cqh; align-content: center; }
[data-sim="asymmetric-path"] .sd-presets { grid-template-columns: 1fr 1fr; }
[data-sim="asymmetric-path"] .ap-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.6rem 1.2cqw; }
[data-sim="asymmetric-path"] .ap-top[data-cap] { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); }
[data-sim="asymmetric-path"] .ap-box {
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  padding: 0.4rem 0.8rem 0.5rem;
  min-width: 0;
}
[data-sim="asymmetric-path"] .ap-box h2 { margin: 0 0 0.2rem; font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
[data-sim="asymmetric-path"] .ap-wire { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; align-items: center; }
[data-sim="asymmetric-path"] .ap-kind { padding: 0 0.55rem; border-radius: 1rem; font-weight: 700; }
[data-sim="asymmetric-path"] .ap-kind[data-k="reply"] { outline: var(--line-w) dashed var(--ink); outline-offset: 0.1rem; }
[data-sim="asymmetric-path"] .ap-none { color: var(--muted); }
[data-sim="asymmetric-path"] .ap-dropped { padding: 0 0.45rem; border: var(--line-w) dashed var(--danger); border-radius: var(--radius-sm); font-weight: 700; }
[data-sim="asymmetric-path"] .ap-cap ul { margin: 0; padding: 0; list-style: none; font-size: var(--fs-sm); }
[data-sim="asymmetric-path"] .ap-cap li { line-height: 1.45; }
[data-sim="asymmetric-path"] .ap-cap li[data-ev="nothing"] { color: var(--danger); font-weight: 700; }
[data-sim="asymmetric-path"] .ap-cap li.ap-alone { margin-top: 0.15rem; color: var(--muted); font-style: italic; }
[data-sim="asymmetric-path"] .ap-top[data-cap] .ap-cap { grid-row: span 2; }
[data-sim="asymmetric-path"] .ap-diag { margin: 0; font-size: var(--fs-sm); padding: 0.2rem 0.6rem; border-left: 0.45rem solid var(--ink); font-weight: 700; }

[data-sim="asymmetric-path"] .ap-off { font-size: var(--fs-sm); color: var(--muted); border: var(--line-w) dashed var(--muted); border-radius: var(--radius-sm); padding: 0.1rem 0.4rem; }
[data-sim="asymmetric-path"] .ap-exit { grid-column: 1 / -1; margin-top: 0.3rem; }
[data-sim="asymmetric-path"] .ap-addr { grid-column: 1 / -1; margin-top: 0.25rem; font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700; overflow-wrap: anywhere; }
/* legend swatches (the kit has round, hollow, hl, dash, line) */
[data-sim="asymmetric-path"] .sd-swatch[data-shape="dev"] { background: transparent; border: 0.22rem solid var(--ink); border-radius: var(--radius-sm); }
[data-sim="asymmetric-path"] .sd-swatch[data-shape="x"] {
  border: 0;
  background: linear-gradient(45deg, transparent 40%, var(--danger) 40% 60%, transparent 60%),
              linear-gradient(-45deg, transparent 40%, var(--danger) 40% 60%, transparent 60%);
}
/* Phone and portrait: the stage grows with its content; the kit lists the nodes. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="asymmetric-path"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="asymmetric-path"] .ap { height: auto; padding: 0.5rem; gap: 0.8rem; font-size: 1rem; }
  [data-sim="asymmetric-path"] .ap-top[data-cap] { grid-template-columns: minmax(0, 1fr); }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Asimetričan put kroz NAT i vatrozid</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { user: '4', exit1: '5', exit2: '6', server: '3', request: '1', reply: '2' };

  /** Data (addresses, ports, protocol) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no', class: 'sd-mono' }, String(text)); }
  function ep(e) { return e.ip + ':' + e.port; }
  function exitName(x) { return t(x); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function hl(key) { return h('span', { class: 'sd-hl' }, t(key)); }

  // ── top: the packet on the wire, the two captures ──

  function renderWire(c) {
    var s = c.state, pk = s.packet;
    var box = h('section', { class: 'ap-box' }, h('h2', null, t('wireTitle')));
    var row = h('div', { class: 'ap-wire' });
    if (!pk) {
      row.append(h('span', { class: 'ap-none' }, t('wireNone')));
    } else {
      var hdr = pk.kind === 'request' ? L.request : L.reply;
      row.append(
        h('span', { class: 'ap-kind sd-fill', dataset: { c: COLOUR[pk.kind], k: pk.kind } }, t(pk.kind === 'request' ? 'wireReq' : 'wireRep')),
        data(hdr.proto.toUpperCase() + ' ' + ep(hdr.src) + ' → ' + ep(hdr.dst)));
      if (pk.drop) row.append(h('span', { class: 'ap-dropped' }, t('wireDropped', { exit: t(pk.to + 'Loc') })));
    }
    box.append(row);
    return box;
  }

  var EV = { reqSent: 'evReqSent', reqRecv: 'evReqRecv', repSent: 'evRepSent', repRecv: 'evRepRecv', nothing: 'evNothing' };
  function renderCapture(c, side) {
    var s = c.state, list = s.captures[side];
    var items = list.map(function (e) { return h('li', { dataset: { ev: e.ev } }, t(EV[e.ev], { n: e.n })); });
    if (!items.length) items.push(h('li', { class: 'ap-none' }, t('capEmpty')));
    var lost = L.diagnose(s.captures, 'both') === 'lostBetween';
    if (lost) items.push(h('li', { class: 'ap-alone' }, t(side === 'user' ? 'aloneUser' : 'aloneServer')));
    return h('section', { class: 'ap-box ap-cap' }, h('h2', null, t(side === 'user' ? 'capUser' : 'capServer')), h('ul', null, items));
  }

  function renderTop(c) {
    var s = c.state;
    if (!c.params.captures) return h('div', { class: 'ap-top' }, renderWire(c));
    var d = L.diagnose(s.captures, 'both');
    // the verdict of both captures sits under the wire box; the two captures span both rows
    return h('div', { class: 'ap-top', dataset: { cap: '' } },
      renderWire(c), renderCapture(c, 'user'), renderCapture(c, 'server'),
      h('p', { class: 'ap-diag', dataset: { d: d } }, t(d === 'lostBetween' ? 'diagLost' : d === 'complete' ? 'diagComplete' : 'diagWait')));
  }

  // ── topology ──

  function badge(key, k) { return { text: t(key), k: k || 'solid', anim: true }; }

  function exitTable(c, x) {
    var s = c.state, p = c.params, fwd = c.dir === 'forward' ? 'forward' : null;
    if (!p.stateful) return h('div', { class: 'ap-exit' }, h('span', { class: 'ap-off' }, t('tableOff')));
    var rows = s.tables[x].map(function (r, i) {
      var isNew = (s.inserted || []).some(function (e) { return e.device === x && e.row === i; });
      var isHit = s.lookup && s.lookup.device === x && s.lookup.result === 'hit' && s.lookup.row === i;
      var note = isNew ? t('noteNew') : isHit ? t('noteHit') : r.origin !== x ? t('noteShared') : t('established');
      return { cells: [ep(r.a), '↔ ' + ep(r.b) + ' ' + r.proto.toUpperCase()], note: note, c: COLOUR[r.origin], mark: isNew ? 'new' : isHit ? 'hit' : null };
    });
    return h('div', { class: 'ap-exit' }, Simdeck.topology.table({ title: t('tableTitle'), rows: rows, empty: t('tableEmpty') }, fwd));
  }

  /** The address and port of a host, on its own line under the card's name, the card's full width. */
  function addr(e) { return h('span', { class: 'ap-addr', translate: 'no' }, ep(e)); }

  function renderTopo(c) {
    var s = c.state, p = c.params, ph = s.phase, pk = s.packet;
    var badges = { user: [], exit1: [], exit2: [], server: [] };
    var active = null;
    switch (ph) {
      case 'out1': badges.user.push(badge('bSends', 'fill')); active = 'user'; break;
      case 'out2':
        badges.exit1.push(p.stateful ? badge('bRecords', 'fill') : badge('bPasses', 'muted'));
        if (p.stateful && p.fix === 'shared') badges.exit2.push(badge('bShares', 'dashed'));
        active = 'exit1';
        break;
      case 'arrive': badges.server.push(badge('bReceives')); active = 'server'; break;
      case 'reply': badges.server.push(badge('bReplies', 'fill')); active = 'server'; break;
      case 'in': {
        var r = s.lookup.result;
        badges[s.lookup.device].push(r === 'hit' ? badge('bHit') : r === 'miss' ? badge('bMiss', 'fill') : badge('bUnchecked', 'muted'));
        active = s.lookup.device;
        break;
      }
      case 'deliver': badges.user.push(badge('bReceives')); active = 'user'; break;
      case 'silence': badges.user.push(badge('bNothing', 'muted')); active = 'user'; break;
    }
    function st(id) { return active === id ? 'active' : null; }
    var role = function (x) {
      var words = [p.stateful ? t('roleState') : t('roleNoState')];
      if (x === L.outPath) words.push(t('roleDefault'));
      return { text: words.join(' · '), kind: 'role' };
    };
    var nodes = [
      { id: 'user', kind: 'host', col: 0, span: 2, row: 1, mark: 'A', c: COLOUR.user, name: t('user'),
        badges: badges.user, state: st('user'), extra: addr(L.user) },
      { id: 'exit1', kind: 'router', col: 3, span: 3, row: 0, mark: '1', c: COLOUR.exit1, name: t('exit1'), lines: [role('exit1')],
        badges: badges.exit1, state: st('exit1'), extra: exitTable(c, 'exit1') },
      { id: 'exit2', kind: 'router', col: 3, span: 3, row: 2, mark: '2', c: COLOUR.exit2, name: t('exit2'), lines: [role('exit2')],
        badges: badges.exit2, state: st('exit2'), extra: exitTable(c, 'exit2') },
      { id: 'internet', kind: 'cloud', col: 7, span: 2, row: 1, name: t('internet') },
      { id: 'server', kind: 'server', col: 10, span: 2, row: 1, mark: 'S', c: COLOUR.server, name: t('server'),
        badges: badges.server, state: st('server'), extra: addr(L.server) }
    ];
    var on = function (a, b) { return !!pk && ((pk.from === a && pk.to === b) || (pk.from === b && pk.to === a)); };
    var links = [['ue1', 'user', 'exit1'], ['ue2', 'user', 'exit2'], ['e1n', 'exit1', 'internet'], ['e2n', 'exit2', 'internet'], ['ns', 'internet', 'server']]
      .map(function (l) { return { id: l[0], a: l[1], b: l[2], active: on(l[1], l[2]) }; });
    var packets = pk ? [{ from: pk.from, to: pk.to, label: t(pk.kind === 'request' ? 'chipReq' : 'chipRep'), c: COLOUR[pk.kind],
      cast: pk.kind === 'reply' ? 'broadcast' : null, drop: !!pk.drop }] : [];
    return Simdeck.topology({ cols: 12, rows: ['auto', 'auto', 'auto'], gap: '1.2cqw', dir: c.dir, nodes: nodes, links: links, packets: packets });
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, p = c.params;
    var U = data(ep(L.user)), S = data(ep(L.server));
    var back = h('b', null, exitName(s.inPath));
    switch (s.phase) {
      case 'start':
        return p.fix === 'symmetric' && p.returnPath !== L.outPath ? rich('capStartSym', { u: U, s: S }) : rich('capStart', { u: U, s: S, back: back });
      case 'out1': return rich('capOut1');
      case 'out2':
        if (!p.stateful) return rich('capOut2Off');
        return rich(p.fix === 'shared' ? 'capOut2Shared' : 'capOut2', { rec: hl('recWord') });
      case 'arrive': return rich('capArrive');
      case 'reply':
        if (p.fix === 'symmetric' && p.returnPath !== L.outPath) return rich('capReplySym');
        return s.inPath === L.outPath ? rich('capReplySame') : rich('capReply', { back: back });
      case 'in': {
        var ex = h('b', null, exitName(s.lookup.device));
        if (s.lookup.result === 'none') return rich('capInOff', { exit: ex });
        if (s.lookup.result === 'miss') return rich('capInMiss', { drop: hl('dropWord') });
        var shared = s.tables[s.lookup.device][s.lookup.row].origin !== s.lookup.device;
        return rich(shared ? 'capInHitShared' : 'capInHit', { exit: ex, pass: hl('passWord') });
      }
      case 'deliver': {
        var out = rich('capDeliver', { ok: h('b', null, t('okWord')) });
        if (!p.stateful && s.inPath !== L.outPath) out.push(' ', t('capDeliverOff'));
        return out;
      }
      default:
        return p.captures ? rich('capSilenceCaptures', { dead: hl('deadWordCap') }) : rich('capSilence', { dead: hl('deadWord') });
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'returnPath', type: 'choice', label: t('returnPath'), options: [['exit1', t('exit1')], ['exit2', t('exit2')]] },
      { key: 'stateful', type: 'toggle', label: t('stateful'), hint: t('statefulHint') },
      { key: 'fix', type: 'choice', label: t('fix'), options: [['none', t('fixNone')], ['symmetric', t('fixSym')], ['shared', t('fixShared')]] },
      { key: 'captures', type: 'toggle', label: t('captures') }
    ],

    presets: [
      { id: 'symmetric-ok', label: t('presetSym'), params: { returnPath: 'exit1' }, hint: t('presetSymHint') },
      { id: 'asymmetric-drop', label: t('presetAsym'), params: { returnPath: 'exit2' }, hint: t('presetAsymHint') },
      { id: 'two-captures', label: t('presetCaptures'), params: { returnPath: 'exit2', captures: true }, hint: t('presetCapturesHint') },
      { id: 'make-symmetric', label: t('presetMakeSym'), params: { returnPath: 'exit2', fix: 'symmetric' } },
      { id: 'share-state', label: t('presetShare'), params: { returnPath: 'exit2', fix: 'shared' } },
      { id: 'no-state', label: t('presetNoState'), params: { returnPath: 'exit2', stateful: false }, hint: t('presetNoStateHint') }
    ],

    legend: [
      { shape: 'line', label: t('legReq') },
      { shape: 'dash', label: t('legRep') },
      { shape: 'dev', label: t('legDevice') },
      { shape: 'x', label: t('legDrop') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'ap' }, renderTop(c), renderTopo(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
