<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CephSim</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="toolbar">
  <span class="brand">CephSim</span>
  <input id="doc-title" aria-label="Cluster name" spellcheck="false">

  <span class="sep"></span>
  <div class="group" role="group" aria-label="File">
    <button id="btn-new" title="New cluster">New</button>
    <button id="btn-open" title="Open a .json cluster">Open</button>
    <button id="btn-save" title="Save as .json (Ctrl+S)">Save</button>
    <select id="export-picker" aria-label="Export">
      <option value="">Export…</option>
      <option value="svg">SVG (this view)</option>
      <option value="png">PNG (this view)</option>
      <option value="copy">Copy PNG to clipboard</option>
      <option value="crush">CRUSH map (crushtool text)</option>
      <option value="script">ceph commands (.sh)</option>
      <option value="json">Cluster JSON</option>
    </select>
    <select id="sample-picker" aria-label="Load a sample cluster">
      <option value="">Samples…</option>
    </select>
  </div>

  <span class="sep"></span>
  <div class="group" role="group" aria-label="Tools">
    <button id="tool-select" data-tool="select" class="tool" title="Select (V)">Select</button>
    <button id="tool-link" data-tool="link" class="tool" title="Draw a cable (L)">Cable</button>
    <button id="tool-pan" data-tool="pan" class="tool" title="Pan (H)">Pan</button>
    <select id="link-net" aria-label="Network for new cables">
      <option value="public">Public net</option>
      <option value="cluster">Cluster net</option>
    </select>
  </div>

  <span class="sep"></span>
  <div class="group" role="group" aria-label="History">
    <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  </div>

  <span class="spacer"></span>
  <div class="group" role="group" aria-label="View">
    <button id="btn-fit" title="Fit to content">Fit</button>
    <button id="btn-zoom-out" title="Zoom out">&minus;</button>
    <button id="btn-zoom-in" title="Zoom in">+</button>
    <button id="btn-grid" title="Toggle grid">Grid</button>
    <button id="btn-theme" title="Toggle light/dark">Theme</button>
    <button id="btn-present" title="Presentation mode (P)">Present</button>
  </div>
</header>

<main>
  <aside id="rail-left" aria-label="Palette">
    <div id="palette"></div>
  </aside>

  <section id="stage">
    <div id="tabs" role="tablist">
      <button class="tab" data-tab="physical" role="tab">Physical</button>
      <button class="tab" data-tab="crush" role="tab">CRUSH</button>
      <button class="tab" data-tab="osdmap" role="tab">OSD map</button>
      <button class="tab" data-tab="pools" role="tab">Pools &amp; clients</button>
      <button class="tab" data-tab="console" role="tab">Console</button>
    </div>
    <div id="pane-actions"></div>
    <div id="pane-host">
      <svg id="canvas" class="pane" xmlns="http://www.w3.org/2000/svg" role="application"
           aria-label="Physical cluster canvas"></svg>
      <svg id="crush-canvas" class="pane" xmlns="http://www.w3.org/2000/svg"
           role="application" aria-label="CRUSH tree" hidden></svg>
      <svg id="osdmap-canvas" class="pane" xmlns="http://www.w3.org/2000/svg"
           role="img" aria-label="OSD map" hidden></svg>
      <div id="pools-pane" class="pane" hidden></div>
      <div id="console-pane" class="pane" hidden></div>
      <div id="placing-hint" hidden></div>
    </div>
  </section>

  <aside id="rail-right" aria-label="Inspector">
    <div id="inspector"></div>
  </aside>
</main>

<div id="timeline" aria-label="Recovery timeline"></div>

<footer id="statusbar">
  <span id="health" class="health">—</span>
  <span id="pgline" class="mono"></span>
  <span class="spacer"></span>
  <span id="capline" class="mono"></span>
</footer>

<div id="sheet" hidden>
  <div class="sheet-box">
    <h2 id="sheet-title">CRUSH map</h2>
    <p class="hint" id="sheet-hint"></p>
    <textarea id="sheet-text" spellcheck="false" aria-label="CRUSH map text"></textarea>
    <p class="sheet-err" id="sheet-err"></p>
    <div class="sheet-actions">
      <button id="sheet-copy">Copy</button>
      <button id="sheet-cancel">Close</button>
      <button id="sheet-apply" hidden>Import</button>
    </div>
  </div>
</div>

<button id="exit-present" hidden>Exit presentation (Esc)</button>

<div id="toast" hidden></div>
<input id="file-input" type="file" accept="application/json,.json" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
