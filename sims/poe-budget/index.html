<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var COLOUR = { phone: 1, ap: 3, cam: 2, ptz: 4 };   // series colour per device kind; the letter carries it too
  var KIND = {};
  L.KINDS.forEach(function (k) { KIND[k.id] = k; });

  // ── formatting: numbers in the page's language (15,4 / 15.4), data in translate="no" ──
  function fmt(x) {
    var s = String(Math.round(x * 100) / 100);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function b(text) { return h('b', { class: 'pb-num', translate: 'no' }, text); }
  function kindName(id) { return h('span', { class: 'pb-kn', dataset: { k: id } }, t('kind_' + id)); }
  function chip(id) { return h('span', { class: 'pb-chip', dataset: { c: String(COLOUR[id]) }, 'aria-hidden': 'true' }, t('letter_' + id)); }

  // ── "changed": the state before the last param change (none on load) ──
  var ready = false, prev = null, cur = null, curKey = null;
  function keyOf(params) { return JSON.stringify(params); }

  // ── the switch ──
  function switchNode(s, changed) {
    var ports = s.result.map(function (r) {
      var on = changed.indexOf(r.n) >= 0 ? ' sd-changed' : '';
      if (!r.device) {
        return h('div', { class: 'pb-port' + on, dataset: { st: 'empty' }, role: 'img', 'aria-label': t('portEmpty', { n: r.n }) },
          h('span', { class: 'pb-pn', translate: 'no' }, String(r.n)), h('span', { class: 'pb-pl' }, ' '), h('span', { class: 'pb-pw' }, ' '));
      }
      var mark = r.state === 'denied' ? '✕' : r.state === 'limited' ? '▲' : null;
      var shown = r.state === 'powered' || r.state === 'limited' ? r.allocated : r.want;
      return h('div', {
        class: 'pb-port' + on, dataset: { st: r.state, c: String(COLOUR[r.device]) }, role: 'img',
        'aria-label': t('portLabel', { n: r.n, kind: t('kind_' + r.device), cls: KIND[r.device].cls, state: t('state_' + r.state), w: fmt(r.allocated) })
      },
        h('span', { class: 'pb-pn', translate: 'no' }, String(r.n)),
        h('span', { class: 'pb-pl' }, t('letter_' + r.device)),
        h('span', { class: 'pb-pw', translate: 'no' }, fmt(shown)),
        mark ? h('span', { class: 'pb-mark', dataset: { m: r.state }, 'aria-hidden': 'true' }, mark) : null);
    });
    return h('div', { class: 'pb-switch' },
      h('div', { class: 'pb-swhead' }, t('switchHead', { type: s.portType, cap: fmt(s.cap) })),
      h('div', { class: 'pb-ports' }, ports));
  }

  // ── the gauge: powered allocations in port order, then what was asked for and not given, past the budget line ──
  function gaugeNode(s) {
    var over = s.result.filter(function (r) { return r.state === 'denied' || r.state === 'shed'; });
    var overW = over.reduce(function (a, r) { return a + r.want; }, 0);
    var scale = s.budget + overW;   // the bar draws total, the free part (together the budget), then the requests
    var segs = [];
    s.result.forEach(function (r) {
      if (r.allocated > 0) segs.push(h('span', { class: 'pb-seg', dataset: { c: String(COLOUR[r.device]) }, style: { width: (r.allocated / scale * 100) + '%' } }));
    });
    var gap = s.left;   // the empty part of the budget, then the requests that did not get it
    if (over.length && gap > 0) segs.push(h('span', { class: 'pb-seg pb-gap', style: { width: (gap / scale * 100) + '%' } }));
    over.forEach(function (r) {
      segs.push(h('span', { class: 'pb-seg', dataset: { c: String(COLOUR[r.device]), over: '' }, style: { width: (r.want / scale * 100) + '%' } }));
    });
    segs.push(h('span', { class: 'pb-budgetline', style: { left: (s.budget / scale * 100) + '%' } }));
    return h('div', { class: 'pb-gauge' },
      h('div', { class: 'pb-ghead' },
        h('b', null, t('gaugeHead', { total: fmt(s.total), budget: fmt(s.budget) })),
        h('span', null, t('gaugeLeft', { left: fmt(s.left) })),
        overW > 0 ? h('span', { class: 'pb-gover' }, t('gaugeOver', { w: fmt(overW) })) : null,
        h('span', { class: 'pb-gbudget' }, '▌ ' + t('gaugeBudget', { budget: fmt(s.budget) }))),
      h('div', { class: 'pb-bar', role: 'img', 'aria-label': t('gaugeLabel', { total: fmt(s.total), budget: fmt(s.budget), left: fmt(s.left) }) }, segs));
  }

  // ── the port table: runs of consecutive ports ──
  function badge(st) {
    var m = { powered: '●', denied: '✕', shed: '▨', limited: '▲' }[st];
    return h('span', { class: 'pb-badge', dataset: { st: st } }, h('span', { 'aria-hidden': 'true' }, m), t('state_' + st));
  }
  function portTable(s, changed) {
    var g = L.groups(s);
    var head = h('tr', null, [
      h('th', null, t('thPorts')), h('th', null, t('thDevice')), h('th', { class: 'pb-r' }, t('thClass')), h('th', null, t('thPrio')),
      h('th', { class: 'pb-r' }, t('thAlloc')), h('th', { class: 'pb-r' }, t('thPd')), h('th', null, t('thState'))
    ]);
    var rows = g.map(function (x) {
      var ch = false;
      for (var n = x.from; n <= x.to; n++) if (changed.indexOf(n) >= 0) ch = true;
      var w = x.state === 'powered' || x.state === 'limited' ? x.allocated : x.want;
      var alloc = x.count > 1 ? t('allocMany', { count: x.count, w: fmt(w) }) : t('allocOne', { w: fmt(w) });
      return h('tr', { class: ch ? 'sd-changed' : '' },
        h('td', { class: 'pb-num', translate: 'no' }, x.from === x.to ? String(x.from) : x.from + '–' + x.to),
        h('td', null, chip(x.device), kindName(x.device)),
        h('td', { class: 'pb-r pb-num', translate: 'no' }, String(x.cls)),
        h('td', null, t('prio_' + (x.priority || 'none'))),
        h('td', { class: 'pb-r pb-num' + (x.allocated ? '' : ' pb-muted') }, x.allocated ? alloc : '0 W'),
        h('td', { class: 'pb-r pb-num' + (x.allocated ? '' : ' pb-muted'), translate: 'no' }, x.allocated ? fmt(x.pd) + ' W' : '0 W'),
        h('td', null, badge(x.state)));
    });
    var draws = {};
    L.KINDS.forEach(function (k) { draws[k.id] = fmt(k.draw); });
    return h('div', { class: 'pb-col' },
      h('div', { class: 'pb-thead' }, t('tableHead')),
      rows.length ? h('table', null, h('thead', null, head), h('tbody', null, rows)) : h('p', { class: 'pb-muted' }, t('noDevices')),
      h('p', { class: 'pb-note' }, t('examples', draws)));
  }

  // ── the class table, the classes in use marked, the port type's cap drawn ──
  function classTable(s) {
    var used = {};
    L.KINDS.forEach(function (k) {
      if (s.result.some(function (r) { return r.device === k.id; })) (used[k.cls] = used[k.cls] || []).push(k.id);
    });
    var firstOver = true;
    var rows = L.CLASSES.map(function (c) {
      var over = c.pse > s.cap, cls = over ? 'pb-over' : '';
      if (over && firstOver) { cls += ' pb-capline'; firstOver = false; }
      return h('tr', { class: cls },
        h('td', { class: 'pb-num', translate: 'no' }, String(c.cls)),
        h('td', { class: 'pb-num', translate: 'no' }, c.std),
        h('td', { class: 'pb-r pb-num', translate: 'no' }, fmt(c.pse)),
        h('td', { class: 'pb-r pb-num', translate: 'no' }, fmt(c.pd)),
        h('td', { class: 'pb-r pb-num', translate: 'no' }, fmt(c.pse - c.pd)),
        h('td', null, (used[c.cls] || []).map(chip)));
    });
    var head = h('tr', null,
      h('th', null, t('thClass')), h('th', null, t('thStd')),
      h('th', { class: 'pb-r' }, t('thPse'), ' ', h('span', { translate: 'no' }, 'W')),
      h('th', { class: 'pb-r' }, t('thPdc'), ' ', h('span', { translate: 'no' }, 'W')),
      h('th', { class: 'pb-r' }, t('thLoss'), ' ', h('span', { translate: 'no' }, 'W')),
      h('th', null, ' '));
    return h('div', { class: 'pb-col' },
      h('div', { class: 'pb-thead' }, t('classHead')),
      h('table', null, h('thead', null, head), h('tbody', null, rows)),
      h('p', { class: 'pb-note pb-capnote' }, t('classCap', { cap: fmt(s.cap), type: s.portType })));
  }

  // ── caption ──
  function caption(s, params) {
    var placed = s.result.filter(function (r) { return r.device; });
    if (!placed.length) return t('capEmpty');
    var out = [];
    if (s.allocMode === 'measured') {
      var cd = L.derive(Object.assign({}, params, { allocMode: 'class' })).demand;
      if (cd !== s.demand) out = out.concat(t.parts('capMeasured', { devices: t.n('devices', placed.length), demand: b(fmt(s.demand)), classDemand: b(fmt(cd)) }), [' ']);
    }
    out = out.concat(t.parts('capClass', { total: b(fmt(s.total)), budget: b(fmt(s.budget)), left: b(fmt(s.left)) }));
    var shed = s.events.filter(function (e) { return e.type === 'shed'; });
    var deny = s.events.filter(function (e) { return e.type === 'deny'; });
    if (shed.length) {
      var e = shed[0];
      out = out.concat([' '], t.parts(e.ports.length > 1 ? 'capShedMany' : 'capShed', {
        n: b(String(e.n)), kind: kindName(s.result[e.n - 1].device), left: b(fmt(e.left)), ports: b(e.ports.join(', ')), freed: b(fmt(e.freed))
      }));
    }
    if (deny.length) {
      var d = deny[0], dk = s.result[d.n - 1].device;
      out = out.concat([' '], t.parts('capDeny', { n: b(String(d.n)), kind: kindName(dk), need: b(fmt(d.need)), cls: b(String(KIND[dk].cls)), left: b(fmt(d.left)) }));
      if (deny.length > 1) out.push(' ', t.n('capDenyMore', deny.length - 1));
    }
    if (!shed.length && !deny.length) {
      var lim = s.result.filter(function (r) { return r.state === 'limited'; })[0];
      if (lim) {
        var k = KIND[lim.device];
        out = out.concat([' '], t.parts('capLimited', {
          n: b(String(lim.n)), kind: kindName(lim.device), cls: b(String(k.cls)), pse: b(fmt(L.CLASSES[k.cls].pse)), type: b(s.portType), cap: b(fmt(s.cap))
        }));
      } else if (s.allocMode === 'class') {
        out = out.concat([' '], t.parts('capAllFine', { draw: b(fmt(s.draw)) }));
      }
    }
    return out;
  }

  var root = h('div', { class: 'pb' });

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'budget', type: 'range', label: t('budget'), min: L.BUDGET.min, max: L.BUDGET.max, step: L.BUDGET.step, unit: 'W' },
      { key: 'allocMode', type: 'choice', label: t('allocMode'), options: L.MODES.map(function (m) { return [m, t('mode_' + m)]; }) },
      { key: 'phones', type: 'range', label: t('phones'), min: 0, max: 24, step: 1 },
      { key: 'aps', type: 'range', label: t('aps'), min: 0, max: 8, step: 1 },
      { key: 'cams', type: 'range', label: t('cams'), min: 0, max: 8, step: 1 },
      { key: 'ptz', type: 'range', label: t('ptz'), min: 0, max: 2, step: 1 },
      { key: 'portType', type: 'choice', label: t('portType'), options: L.TYPES.map(function (x) { return [x, t('type_' + x)]; }) },
      { key: 'priorities', type: 'toggle', label: t('priorities') }
    ],

    presets: L.presets.map(function (pr) {
      return { id: pr.id, label: t('preset_' + pr.id), hint: t('hint_' + pr.id), params: pr.params };
    }),

    legend: [
      { c: 1, label: t('legend_phone') },
      { c: 3, label: t('legend_ap') },
      { c: 2, label: t('legend_cam') },
      { c: 4, label: t('legend_ptz') },
      { c: 8, label: t('legendPowered') },
      { shape: 'pb-denied', label: t('legendDenied') },
      { shape: 'pb-shed', label: t('legendShed') },
      { shape: 'pb-limited', label: t('legendLimited') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var k = keyOf(c.params);
      if (!ready) { prev = null; cur = s; curKey = k; }
      else if (k !== curKey) { prev = cur; cur = s; curKey = k; }
      var changed = L.changedPorts(prev, s);
      root.replaceChildren(
        switchNode(s, changed),
        gaugeNode(s),
        h('div', { class: 'pb-bottom' }, portTable(s, changed), classTable(s)));
      if (root.parentNode !== c.stage) c.stage.replaceChildren(root);
    },

    caption: function (c) { return caption(c.state, c.params); }
  });
  ready = true;
})();
</script>
</body>
</html>
