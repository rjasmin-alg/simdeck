<html lang="hr" data-sim="speech-spectrum">
<head>

<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="speech-spectrum"]; colours only from kit tokens. */
[data-sim="speech-spectrum"] .sp { height: 100%; padding: 1.2cqh 1.6cqw; display: flex; flex-direction: column; gap: 0.5rem; }
[data-sim="speech-spectrum"] .sp-read { display: flex; flex-wrap: wrap; gap: 0.2rem 1.6rem; font-size: var(--fs-lg); font-weight: 700; }
[data-sim="speech-spectrum"] .sp-mode { color: var(--muted); }
[data-sim="speech-spectrum"] .sp-plot { position: relative; flex: 1; min-height: 0; }
[data-sim="speech-spectrum"] .sp-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="speech-spectrum"] svg text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--ink); font-weight: 600; }
[data-sim="speech-spectrum"] svg text.sp-halo { paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
[data-sim="speech-spectrum"] svg text.sp-axis-t { fill: var(--muted); }
[data-sim="speech-spectrum"] .sp-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="speech-spectrum"] .sp-grid { stroke: var(--line); stroke-width: 1; }
[data-sim="speech-spectrum"] .sp-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="speech-spectrum"] .sp-band { fill: var(--c2); fill-opacity: 0.12; }
[data-sim="speech-spectrum"] .sp-edge { stroke: var(--c2); stroke-width: 2.5; stroke-dasharray: 10 5; }
[data-sim="speech-spectrum"] .sp-line { stroke: var(--c1); stroke-width: 3; stroke-linecap: butt; }
[data-sim="speech-spectrum"] .sp-line.sp-out { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; }
[data-sim="speech-spectrum"] .sp-env { fill: none; stroke: var(--c3); stroke-width: 2.5; stroke-dasharray: 9 5; stroke-linejoin: round; }
[data-sim="speech-spectrum"] .sp-noise { fill: var(--c4); fill-opacity: 0.3; stroke: var(--c4); stroke-width: 2.5; stroke-linejoin: round; }
[data-sim="speech-spectrum"] .sp-live { fill: none; stroke: var(--c1); stroke-width: 2.5; stroke-linejoin: round; }
[data-sim="speech-spectrum"] .sp-tri { fill: var(--c5); }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="speech-spectrum"] .sp-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="speech-spectrum"] .sp-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="speech-spectrum"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="speech-spectrum"] .sp { height: auto; padding: 0.6rem; }
  [data-sim="speech-spectrum"] .sp-read { font-size: var(--fs-md); }
  [data-sim="speech-spectrum"] .sp-plot { flex: none; height: 22rem; }
  [data-sim="speech-spectrum"] .sp-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="speech-spectrum"] .sd-bar { position: static; }
}

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Spektar govornog signala</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="sp-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var QUIET = -80;                           // live: a frame whose strongest bin is below this (dBFS) counts as quiet
  var sim = null;

  // ── number formats: Hz as whole numbers, kHz with one decimal (a decimal comma in Croatian), a real minus sign ──
  function dec(x) { return Simdeck.lang === 'hr' ? String(x).replace('.', ',') : String(x); }
  function hz(f) { return t('hz', { v: String(Math.round(f)) }); }
  function khz(f) { return f < 1000 ? hz(f) : t('khz', { v: dec(Math.round(f / 100) / 10) }); }
  function tick(f) { return f < 1000 ? hz(f) : t('khz', { v: dec(f / 1000) }); }
  function db(x) { return t('db', { v: x < 0 ? '−' + String(-x) : String(x) }); }
  function share(st) { return st.shareLow ? t('pctLow') : st.shareHigh ? t('pctHigh') : t('pct', { v: String(st.sharePct) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

  var presetKeys = { a: 'presetA', i: 'presetI', u: 'presetU', high: 'presetHigh', s: 'presetS', band: 'presetBand' };
  var soundNames = { a: 'nameA', i: 'nameI', u: 'nameU', s: 'nameS' };

  // ── the live microphone (the original's applet): off → wait (asking for access) → on, or error ──
  var mic = { state: 'off', why: '', ac: null, stream: null, an: null, buf: null, binHz: 0, lines: null, quiet: true, raf: 0, last: 0 };
  function micStop() {
    if (mic.raf) cancelAnimationFrame(mic.raf);
    if (mic.stream) mic.stream.getTracks().forEach(function (tr) { tr.stop(); });
    if (mic.ac) mic.ac.close().catch(function () { /* already closed */ });
    mic = { state: 'off', why: '', ac: null, stream: null, an: null, buf: null, binHz: 0, lines: null, quiet: true, raf: 0, last: 0 };
  }
  function micFail(key) { micStop(); mic.state = 'error'; mic.why = t(key); sim.render(); }
  function micFrame(now) {
    mic.raf = requestAnimationFrame(micFrame);
    // a fresh spectrum ten times a second, or twice a second under reduced motion
    if (now - mic.last < (Simdeck.reducedMotion() ? 500 : 100)) return;
    mic.last = now;
    mic.an.getFloatFrequencyData(mic.buf);
    var max = -Infinity;
    for (var i = 1; i < mic.buf.length; i++) if (mic.buf[i] > max) max = mic.buf[i];
    mic.quiet = !(max > QUIET);
    mic.lines = L.fromAnalyser(mic.buf, mic.binHz);
    sim.render();
  }
  function micStart() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micFail('errNoApi'); return; }
    micStop();
    mic.state = 'wait';
    sim.render();
    navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(function (stream) {
      if (mic.state !== 'wait') { stream.getTracks().forEach(function (tr) { tr.stop(); }); return; }
      var ac = new AC();
      var an = ac.createAnalyser();
      an.fftSize = 2048;                     // as the original: 1024 bins, about 23 Hz apart at 48 kHz
      ac.createMediaStreamSource(stream).connect(an);
      ac.resume();
      Object.assign(mic, { state: 'on', ac: ac, stream: stream, an: an, buf: new Float32Array(an.frequencyBinCount),
        binHz: ac.sampleRate / an.fftSize });
      mic.raf = requestAnimationFrame(micFrame);
    }).catch(function () { if (mic.state === 'wait') micFail('errDenied'); });
  }
  function micToggle() { if (mic.state === 'wait' || mic.state === 'on') { micStop(); sim.render(); } else micStart(); }

  // ── the spectrum plot: a log frequency axis 50 Hz … 20 kHz, the level in dB from FLOOR to CEIL; the radio band,
  //    the voiced lines and their envelope with F1–F3, or the noise area, or the live trace; the strongest component ──
  function draw(box, st, live) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var pad = { l: 0.4 * rem, r: 0.6 * rem, t: 2.4 * rem, b: 1.6 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var lf0 = Math.log(L.FMIN), lf1 = Math.log(L.FMAX);
    var X = function (f) { return pad.l + (Math.log(f) - lf0) / (lf1 - lf0) * cw; };
    var Y = function (d) { return pad.t + ch * (L.CEIL - Math.max(L.FLOOR, Math.min(L.CEIL, d))) / (L.CEIL - L.FLOOR); };
    var bottom = Y(L.FLOOR);
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var top = [];                            // text drawn last, over everything

    svg.append(s('rect', { class: 'sp-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    if (st.band) svg.append(s('rect', { class: 'sp-band', x: X(L.BAND[0]), y: pad.t, width: X(L.BAND[1]) - X(L.BAND[0]), height: ch }));
    // grid: decades and the 2 and 5 between them; levels every 20 dB
    var fticks = [50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
    fticks.forEach(function (f) { svg.append(s('line', { class: 'sp-grid', x1: X(f), x2: X(f), y1: pad.t, y2: bottom })); });
    [-20, -40].forEach(function (d) { svg.append(s('line', { class: 'sp-grid', x1: pad.l, x2: pad.l + cw, y1: Y(d), y2: Y(d) })); });
    svg.append(s('line', { class: 'sp-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    // frequency labels: the decades first, then the ends, then 2 and 5, each only where it does not touch another
    var taken = [];
    [100, 1000, 10000, 50, 20000, 200, 500, 2000, 5000].forEach(function (f) {
      var label = tick(f), w = label.length * 0.5 * rem;
      var x = Math.max(pad.l + w / 2, Math.min(pad.l + cw - w / 2, X(f)));
      if (taken.some(function (r) { return x + w / 2 + 0.6 * rem > r[0] && x - w / 2 - 0.6 * rem < r[1]; })) return;
      taken.push([x - w / 2, x + w / 2]);
      top.push(s('text', { class: 'sp-axis-t', x: x, y: bottom + 1.2 * rem, 'text-anchor': 'middle', translate: 'no' }, label));
    });
    [0, -20, -40].forEach(function (d) {
      top.push(s('text', { class: 'sp-halo', x: pad.l + 0.3 * rem, y: Y(d) + 1.15 * rem, translate: 'no' }, db(d)));
    });
    // axis titles in the frame's empty top strip (above 0 dB): the level on the left, the frequency on the right
    // (a phone-narrow plot leaves them out: the strip is the band labels' then, and the ticks carry the units)
    if (cw > 40 * rem) {
      top.push(s('text', { class: 'sp-axis-t sp-halo', x: pad.l + 0.3 * rem, y: pad.t + 1.2 * rem }, t('axisDb')));
      top.push(s('text', { class: 'sp-axis-t sp-halo', x: pad.l + cw - 0.3 * rem, y: pad.t + 1.2 * rem, 'text-anchor': 'end' }, t('axisF')));
    }

    function inBand(f) { return f >= L.BAND[0] && f <= L.BAND[1]; }
    var lines = live ? live : st.lines;
    var peak;
    if (live) {
      var pts = live.filter(function (l) { return l.f >= L.FMIN; })
        .map(function (l) { return X(l.f).toFixed(1) + ',' + Y(l.db).toFixed(1); });
      svg.append(s('polyline', { class: 'sp-live', points: pts.join(' ') }));
      peak = live[L.strongest(live)];
    } else if (st.voiced) {
      lines.forEach(function (l) {
        if (l.db <= L.FLOOR || l.f < L.FMIN) return;
        svg.append(s('line', { class: 'sp-line' + (st.band && !inBand(l.f) ? ' sp-out' : ''), x1: X(l.f), x2: X(l.f), y1: bottom, y2: Y(l.db) }));
      });
      svg.append(s('polyline', { class: 'sp-env',
        points: st.envelope.map(function (e) { return X(e.f).toFixed(1) + ',' + Y(e.db).toFixed(1); }).join(' ') }));
      var lastX = -Infinity;
      st.formants.forEach(function (fm) {
        var x = Math.max(X(fm.f), lastX + 1.8 * rem);   // too close to the last label: moved right
        var y = Math.max(pad.t + 1.1 * rem, Y(fm.db) - 0.5 * rem);   // a peak cut at the top keeps its label inside
        lastX = x;
        top.push(s('text', { class: 'sp-halo', x: x, y: y, 'text-anchor': 'middle', translate: 'no' }, 'F' + fm.n));
      });
      peak = st.peak;
    } else {
      var d = 'M' + X(lines[0].f).toFixed(1) + ',' + bottom;
      lines.forEach(function (l) { d += 'L' + X(l.f).toFixed(1) + ',' + Y(l.db).toFixed(1); });
      d += 'L' + X(lines[lines.length - 1].f).toFixed(1) + ',' + bottom + 'Z';
      svg.append(s('path', { class: 'sp-noise', d: d }));
      peak = st.peak;
    }
    if (st.band) {
      [0, 1].forEach(function (i) {
        var x = X(L.BAND[i]);
        svg.append(s('line', { class: 'sp-edge', x1: x, x2: x, y1: pad.t, y2: bottom }));
        top.push(s('text', { class: 'sp-halo', x: x + (i ? 0.3 : -0.3) * rem, y: pad.t + 1.0 * rem,
          'text-anchor': i ? 'start' : 'end', translate: 'no' }, t(i ? 'bandHi' : 'bandLo')));
      });
    }
    // the strongest component: a triangle above the frame pointing down at it, with its frequency
    if (peak && !(live && mic.quiet)) {
      var px = X(Math.max(L.FMIN, peak.f)), tw = 0.5 * rem, ty = pad.t - 0.3 * rem;
      svg.append(s('path', { class: 'sp-tri', d: 'M' + (px - tw) + ',' + (ty - 1.4 * tw) + 'H' + (px + tw) + 'L' + px + ',' + ty + 'Z' }));
      top.push(s('text', { x: px + 0.8 * rem, y: ty - 0.1 * rem, translate: 'no',
        'text-anchor': px > pad.l + cw - 6 * rem ? 'end' : 'start', dx: px > pad.l + cw - 6 * rem ? -1.6 * rem : 0 }, hz(peak.f)));
    }
    top.forEach(function (n) { svg.append(n); });
    box.replaceChildren(svg);
  }

  function liveState() { return mic.state === 'on' && mic.lines; }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'sound', type: 'choice', label: t('sound'), hint: t('soundHint'),
        options: L.SOUNDS.map(function (k) { return [k, t('sound' + k.toUpperCase())]; }),
        disabled: function () { return mic.state === 'on' ? t('pitchLive') : false; } },
      { key: 'pitch', type: 'range', label: t('pitch'), hint: t('pitchHint'), min: L.PITCH_MIN, max: L.PITCH_MAX, step: L.PITCH_STEP, format: hz,
        disabled: function (p) { return mic.state === 'on' ? t('pitchLive') : p.sound === 's' ? t('pitchNone') : false; } },
      { key: 'band', type: 'toggle', label: t('band'), hint: t('bandHint') },
      { key: 'm', type: 'button', label: t('mic'), run: micToggle }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendLine') },
      { c: 3, shape: 'hollow', label: t('legendEnv') },
      { c: 4, label: t('legendNoise') },
      { c: 5, shape: 'round', label: t('legendPeak') },
      { c: 2, shape: 'hl', label: t('legendBand') }
    ],

    render: function (c) {
      var st = c.state, live = liveState();
      var plot = h('div', { class: 'sp-plot' });
      var read = [];
      if (mic.state === 'on') {
        read.push(h('span', { class: 'sp-mode' }, t('modeLive')));
        if (live && !mic.quiet) {
          var lp = live[L.strongest(live)];
          read.push(h('span', { translate: 'no' }, t('readPeak', { f: hz(lp.f) })));
          if (st.band) read.push(h('span', null, t('readShare', { v: share(liveShare(live)) })));
        }
      } else {
        read.push(h('span', { class: 'sp-mode' }, t('modeModel', { sound: t(soundNames[st.sound]) })));
        if (st.voiced) read.push(h('span', { translate: 'no' }, t('readPitch', { f: hz(st.pitch) })));
        read.push(h('span', { translate: 'no' }, t('readPeak', { f: hz(st.peak.f) })));
        if (st.band) read.push(h('span', null, t('readShare', { v: share(st) })));
      }
      c.stage.replaceChildren(h('div', { class: 'sp' }, h('div', { class: 'sp-read' }, read), plot));
      draw(plot, st, live && !mic.quiet ? live : null);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      if (mic.state === 'wait') return t('captionLiveWait');
      if (mic.state === 'on') {
        var live = liveState();
        if (!live || mic.quiet) return t('captionLiveQuiet');
        var parts = t.parts('captionLive', { peak: b(hz(live[L.strongest(live)].f)) });
        return st.band ? [parts, t.parts('captionLiveBand', { share: b(share(liveShare(live))) })] : parts;
      }
      var out;
      if (st.voiced) {
        out = [t.parts('captionVoiced', { sound: b(t(soundNames[st.sound])), f0: b(hz(st.pitch)), k: b(String(st.peak.k)),
          peak: b(hz(st.peak.f)), top: b(khz(st.top)) })];
      } else {
        out = [t.parts('captionS', { peak: b(khz(st.peak.f)), top: b(khz(st.top)) })];
      }
      if (mic.state === 'error') out.unshift(t('captionLiveError', { why: mic.why }) + ' ');
      if (st.band) {
        out.push(t.parts('captionBand', { share: b(share(st)) }));
        if (!st.voiced) out.push(t('captionBandS'));
        else if (st.pitch < L.BAND[0]) out.push(t('captionBandLowF0'));
      }
      return out;
    }
  });

  function liveShare(live) {
    var x = L.bandShare(live, L.BAND[0], L.BAND[1]);
    return { sharePct: Math.round(x * 100), shareLow: x > 0 && Math.round(x * 100) === 0, shareHigh: x < 1 && Math.round(x * 100) === 100 };
  }

  // A preset loaded while the microphone runs means "show me the model": the microphone goes off.
  var lastPreset = sim.preset;
  sim.on(function (c) {
    if (c.preset && c.preset !== lastPreset && mic.state !== 'off') { micStop(); sim.render(); }
    lastPreset = c.preset;
  });

  // The plot is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
