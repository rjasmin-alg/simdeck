<style>
/* Page CSS: every selector starts with [data-sim="subnet-mask"]; colours only from kit tokens. */
[data-sim="subnet-mask"] .sm {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2.2cqh;
  height: 100%;
  padding: 2cqh 2cqw;
  --labw: 13rem;
  --bw: min(calc((100cqw - var(--labw) - 4cqw - 3.6rem) / 33), 5.4cqh);
  --gap8: 0.6rem;
}

/* the bit table: a label column, then 32 bit columns with a wider gap after every octet */
[data-sim="subnet-mask"] .sm-table {
  display: grid;
  grid-template-columns:
    var(--labw)
    repeat(8, var(--bw)) var(--gap8) repeat(8, var(--bw)) var(--gap8)
    repeat(8, var(--bw)) var(--gap8) repeat(8, var(--bw));
  column-gap: 0.12rem;
  row-gap: 1.1cqh;
  align-items: center;
  justify-content: center;
  position: relative;
}
/* --r is the table row; on a phone every label takes its own row above its bits (rows 2r − 1 and 2r) */
[data-sim="subnet-mask"] .sm-table > * { grid-row: var(--r); }
[data-sim="subnet-mask"] .sm-label, [data-sim="subnet-mask"] .sm-gaprow { grid-column: 1; }
[data-sim="subnet-mask"] .sm-label { display: flex; flex-direction: column; line-height: 1.15; padding-right: 0.8rem; font-size: var(--fs-md); }
[data-sim="subnet-mask"] .sm-label b { font-weight: 700; white-space: nowrap; align-self: start; }
[data-sim="subnet-mask"] .sm-label span { font-family: var(--mono); font-weight: 700; }
[data-sim="subnet-mask"] .sm-new b { background: var(--hl); color: var(--on-hl); padding: 0 0.2rem; border-radius: var(--radius-sm); }
[data-sim="subnet-mask"] .sm-gaprow { height: 1.2cqh; }
[data-sim="subnet-mask"] .sm-part {
  text-align: center;
  font-size: var(--fs-sm);
  font-weight: 700;
  border-bottom: var(--line-w) solid var(--ink);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
}
[data-sim="subnet-mask"] .sm-part.sm-host { border-bottom-style: dashed; }
[data-sim="subnet-mask"] .sm-bit {
  display: grid;
  place-items: center;
  height: calc(var(--bw) * 1.45);
  border: var(--line-w) solid var(--line);
  border-radius: 3px;
  font-family: var(--mono);
  font-size: max(16px, calc(var(--bw) * 0.7));
  font-weight: 700;
  line-height: 1;
}
[data-sim="subnet-mask"] .sm-bit.sm-h { border-style: dashed; background: var(--bg); color: var(--ink); }
/* a network bit where the two results differ: highlighter fill plus the kit's thick outline */
[data-sim="subnet-mask"] .sm-bit.sd-changed { background: var(--hl); color: var(--on-hl); }
[data-sim="subnet-mask"] .sm sup { font-size: var(--fs-sm); }
/* the boundary between network and host part, through every row */
[data-sim="subnet-mask"] .sm-cut {
  grid-row: 1 / 9 !important;
  align-self: stretch;
  justify-self: start;
  width: 0.3rem;
  margin-left: -0.21rem;
  background: var(--ink);
  border-radius: 0.15rem;
  pointer-events: none;
}
[data-sim="subnet-mask"] .sm-later { visibility: hidden; }
/* 2^h in the explanation: the browser's smaller sup would fall under the text floor on a phone. */
[data-sim="subnet-mask"] .sd-explain sup { font-size: var(--fs-sm); }

/* below the table: hosts, the verdict, ARP */
[data-sim="subnet-mask"] .sm-facts { display: flex; flex-wrap: wrap; gap: 1rem 1.4rem; justify-content: center; align-items: stretch; }
[data-sim="subnet-mask"] .sm-box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.2rem;
  padding: 0.5rem 1rem;
  border: var(--line-w) solid var(--line);
  border-left: 0.4rem solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--panel);
  font-size: var(--fs-stage);
  line-height: 1.2;
}
[data-sim="subnet-mask"] .sm-box small { font-size: var(--fs-md); color: var(--muted); }
[data-sim="subnet-mask"] .sm-mono { font-family: var(--mono); }
[data-sim="subnet-mask"] .sm-warn { color: var(--danger); font-weight: 700; font-size: var(--fs-md); }
[data-sim="subnet-mask"] .sm-verdict.sm-local { border-left-color: var(--ok); }
[data-sim="subnet-mask"] .sm-verdict.sm-remote { border-left-color: var(--warn); border-left-style: dashed; }
[data-sim="subnet-mask"] .sm-arp { display: grid; grid-template-columns: auto auto auto; gap: 0.3rem 0.8rem; align-items: center; }
[data-sim="subnet-mask"] .sm-node { padding: 0.1rem 0.5rem; border: var(--line-w) solid var(--ink); border-radius: var(--radius-sm); font-size: var(--fs-md); }
[data-sim="subnet-mask"] .sm-msg { display: flex; flex-direction: column; align-items: center; font-size: var(--fs-md); }
[data-sim="subnet-mask"] .sm-msg small { font-size: var(--fs-sm); color: var(--muted); }
[data-sim="subnet-mask"] .sm-msg b::after { content: ' →'; }
[data-sim="subnet-mask"] .sm-msg.sm-bcast b { border-bottom: var(--line-w) dashed var(--ink); }
[data-sim="subnet-mask"] .sm-msg.sm-ucast b { border-bottom: var(--line-w) solid var(--ink); }

/* Phone and portrait: the stage grows with its content; the labels go above their bits. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="subnet-mask"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="subnet-mask"] .sm { height: auto; gap: 1rem; padding: 0.6rem 0.3rem; --labw: 0px; --gap8: 0.25rem; --bw: calc((100cqw - 0.6rem - 0.75rem - 2.6rem) / 32); }
  [data-sim="subnet-mask"] .sm-table { column-gap: 0.08rem; }
  [data-sim="subnet-mask"] .sm-table > * { grid-row: calc(var(--r) * 2); }
  [data-sim="subnet-mask"] .sm-table > .sm-label { grid-row: calc(var(--r) * 2 - 1); grid-column: 2 / -1; flex-direction: row; gap: 0.6rem; padding: 0.3rem 0 0; }
  [data-sim="subnet-mask"] .sm-table > .sm-cut { grid-row: 2 / 17 !important; width: 0.2rem; margin-left: -0.15rem; }
  [data-sim="subnet-mask"] .sm-gaprow { display: none; }
  [data-sim="subnet-mask"] .sm-bit { font-size: 14px; border: 0; border-radius: 1px; height: 1.3rem; overflow: hidden; }
  [data-sim="subnet-mask"] .sm-bit.sm-h { border-bottom: 2px dashed var(--ink); }
  [data-sim="subnet-mask"] .sm-part { font-size: 14px; }
  [data-sim="subnet-mask"] .sm-arp { grid-template-columns: minmax(0, 1fr); }
}
</style>

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Podmrežna maska</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PH = L.phases;

  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, text); }
  function bold(text) { return h('b', { translate: 'no' }, text); }
  function count(n) { return n.toLocaleString(Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB'); }
  function grid(i) { return 2 + i + Math.floor(i / 8); } // grid column of bit i (0 = leftmost)

  // One row of the table: a label (name and dotted decimal) and 32 bits, coloured by the side of the boundary.
  function row(r, key, value, p, opts) {
    var b = L.bits(value), cells = [];
    cells.push(h('div', { class: 'sm-label' + (opts.fresh ? ' sm-new' : '') + (opts.later ? ' sm-later' : ''),
      style: { '--r': String(r) } }, h('b', null, t(key)), data(L.format(value))));
    for (var i = 0; i < 32; i++) {
      var net = i < p, mark = opts.differ && opts.differ.indexOf(i) >= 0;
      cells.push(h('span', {
        class: 'sm-bit' + (net ? ' sd-fill' : ' sm-h') + (mark ? ' sd-changed' : '') + (mark && opts.forward ? ' sd-anim-in' : '') +
          (opts.later ? ' sm-later' : ''),
        dataset: net ? { c: '1' } : null, translate: 'no', 'aria-hidden': 'true',
        style: { gridColumn: String(grid(i)), '--r': String(r) }
      }, b[i]));
    }
    return cells;
  }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { addr: '192.168.1.100', prefix: 26, dest: '192.168.1.77' } },
    { id: 'far', label: t('presetFar'), hint: t('presetFarHint'), params: { prefix: 26, dest: '192.168.1.200' } },
    { id: 'mask-240', label: t('presetMask28'), hint: t('presetMask28Hint'), params: { prefix: 28 } },
    { id: 'internet', label: t('presetInternet'), hint: t('presetInternetHint'), params: { prefix: 26, dest: '8.8.8.8' } },
    { id: 'example-2', label: t('presetP2'), hint: t('presetP2Hint'), params: { addr: '192.168.1.10', prefix: 24, dest: '192.168.2.50' } },
    { id: 'example-6', label: t('presetP6'), hint: t('presetP6Hint'), params: { addr: '192.168.5.77', prefix: 28, dest: '192.168.5.70' } }
  ];

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'addr', type: 'choice', label: t('addr'), options: L.addrs.map(function (a) { return [a, a]; }) },
      { key: 'prefix', type: 'range', label: t('prefix'), min: L.minPrefix, max: L.maxPrefix, step: 1,
        format: function (v) { return '/' + v; } },
      { key: 'dest', type: 'select', label: t('dest'), options: L.dests.map(function (a) { return [a, a]; }) }
    ],

    presets: presets,

    legend: [
      { c: 1, label: t('legendNet') },
      { shape: 'hollow', label: t('legendHost') },
      { shape: 'hl', label: t('legendDiffer') }
    ],

    render: function (c) {
      var s = c.state, p = c.params.prefix, at = PH.indexOf(s.phase), fwd = c.dir === 'forward';
      var fresh = function (k) { return at === k && !c.first; };
      var differ = at >= 5 ? s.differ : null;
      var cells = [];
      // row 1: the two parts, labelled over their bits
      if (p > 0) cells.push(h('div', { class: 'sm-part', style: { gridColumn: grid(0) + ' / ' + (grid(p - 1) + 1), '--r': '1' } }, t('partNet'), ' /', data(String(p))));
      cells.push(h('div', { class: 'sm-part sm-host', style: { gridColumn: grid(p) + ' / ' + (grid(31) + 1), '--r': '1' } }, t('partHost')));
      cells = cells.concat(
        row(2, 'rowAddr', s.addr, p, {}),
        row(3, 'rowMask', s.mask, p, {}),
        row(4, 'rowNet', s.network, p, { later: at < 1, fresh: fresh(1), differ: differ, forward: fwd && at === 5 }),
        row(5, 'rowBc', s.broadcast, p, { later: at < 2, fresh: fresh(2) }),
        [h('div', { class: 'sm-gaprow', style: { '--r': '6' } })],
        row(7, 'rowDest', s.dest, p, { later: at < 4, fresh: fresh(4) }),
        row(8, 'rowDestNet', s.destNetwork, p, { later: at < 4, fresh: fresh(4), differ: differ, forward: fwd && at === 5 }));
      cells.push(h('div', { class: 'sm-cut', style: { gridColumn: String(grid(p)) } }));

      var facts = [];
      var edge = s.addrRole !== 'host';
      facts.push(h('div', { class: 'sm-box' + (at < 3 ? ' sm-later' : '') },
        h('span', null, t.n('usable', s.hosts, { count: count(s.hosts) })),
        h('small', null, t.n('hostsBox', s.hostBits, { h: s.hostBits }), ' · ', h('span', { translate: 'no' }, '2', h('sup', null, String(s.hostBits)), ' − 2')),
        h('small', null, t('range', { first: L.format(s.first), last: L.format(s.last) })),
        edge ? h('span', { class: 'sm-warn' }, data(L.format(s.addr)), ': ', t('notAssignable')) : null));
      facts.push(h('div', { class: 'sm-box sm-verdict ' + (s.local ? 'sm-local' : 'sm-remote') + (at < 5 ? ' sm-later' : '') },
        h('b', null, t(s.local ? 'verdictLocal' : 'verdictRemote')),
        h('small', null, data(L.format(s.destNetwork) + (s.local ? ' = ' : ' ≠ ') + L.format(s.network)))));
      facts.push(h('div', { class: 'sm-box sm-arp' + (at < 6 ? ' sm-later' : '') },
        h('span', { class: 'sm-node' }, t('thisHost')),
        h('span', { class: 'sm-msg sm-bcast' }, h('b', null, s.local ? t.parts('arpAsk', { who: data(L.format(s.dest)) }) : t('arpAskGateway')), h('small', null, t('arpBroadcast'))),
        h('span', { class: 'sm-node' }, t('everyone')),
        h('span', { class: 'sm-node' + (at < 7 ? ' sm-later' : '') }, s.local ? data(L.format(s.dest)) : t('gateway')),
        h('span', { class: 'sm-msg sm-ucast' + (at < 7 ? ' sm-later' : '') }, h('b', null, t('arpAnswer')), h('small', null, t('arpUnicast'))),
        h('span', { class: 'sm-node' + (at < 7 ? ' sm-later' : '') }, t('thisHost'))));

      c.stage.replaceChildren(h('div', { class: 'sm' },
        h('div', { class: 'sm-table' }, cells),
        h('div', { class: 'sm-facts' }, facts)));
    },

    caption: function (c) {
      var s = c.state, p = c.params.prefix;
      var v = {
        addr: bold(L.format(s.addr)), mask: bold(L.format(s.mask)), p: bold('/' + p),
        net: bold(L.format(s.network)), bc: bold(L.format(s.broadcast)),
        first: bold(L.format(s.first)), last: bold(L.format(s.last)),
        dest: bold(L.format(s.dest)), dnet: bold(L.format(s.destNetwork))
      };
      var edge = s.addrRole === 'network' ? 'captionAddrNetwork' : s.addrRole === 'broadcast' ? 'captionAddrBroadcast' : null;
      switch (s.phase) {
        case 'start': return t.parts('captionStart', v);
        case 'network': return t.parts('captionNetwork', v).concat(edge ? [' ', h('span', { class: 'sd-hl' }, t.parts(edge, v))] : []);
        case 'broadcast': return t.parts('captionBroadcast', v);
        case 'hosts':
          v.ofAll = t.n('ofAll', Math.pow(2, s.hostBits), { count: count(Math.pow(2, s.hostBits)) });
          v.usable = h('b', null, t.n('usableLeft', s.hosts, { count: count(s.hosts) }));
          return t.parts('captionHosts', v).concat(edge ? [' ', h('span', { class: 'sd-hl' }, t.parts(edge, v))] : []);
        case 'dest': return t.parts('captionDest', v);
        case 'compare': return t.parts(s.local ? 'captionLocal' : 'captionRemote', v);
        case 'arpRequest': return t.parts(s.local ? 'captionArpLocal' : 'captionArpRemote', v);
        default: return t.parts(s.local ? 'captionReplyLocal' : 'captionReplyRemote', v);
      }
    }
  });
})();
</script>
</body>
</html>
