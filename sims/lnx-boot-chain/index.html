<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings); // picks the language; every visible word goes through t

  // ── small pieces ──

  /** Data (versions, UUIDs, unit names) is not language: the word check skips translate="no". */
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function secs(x) { var s = x.toFixed(3); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }

  /** Caption parts (from sims/lnx-links-inodes): t.parts with node placeholders cloned where they land, *English term*
      as <em lang="en"> (the Croatian term rule, for terms the glossary lacks) and `x` as code. */
  var MARK = '\u0001';
  function rich(key, vars) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var out = [];
    t.parts(key, flat).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/(\*[^*]+\*|`[^`]+`)/).forEach(function (bit) {
        if (!bit) return;
        if (/^\*[^*]+\*$/.test(bit)) { out.push(h('em', { lang: 'en' }, bit.slice(1, -1))); return; }
        if (/^`[^`]+`$/.test(bit)) { out.push(code(bit.slice(1, -1))); return; }
        bit.split(MARK).forEach(function (piece, j) {
          if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
          else if (piece) out.push(piece);
        });
      });
    });
    return out;
  }

  // ── the chain ──

  var MARKS = { done: '✓', now: '▶', failed: '✗', never: '–', waiting: '·' };
  var STATUS = { done: 'stDone', now: 'stNow', failed: 'stFailed', never: 'stNever', waiting: 'stWaiting' };

  function stateOf(s, id, i) {
    if (s.done.indexOf(id) >= 0) return 'done';
    if (s.failedAt === id) return 'failed';
    if (s.failedAt) return 'never';
    if (s.at === i) return 'now';
    return 'waiting';
  }

  function box(c, st, i) {
    var s = c.state, p = c.params;
    var k = stateOf(s, st.id, i);
    var sub = L.subOf(st, p);
    var needs = st.needs.length ? h('div', { class: 'bc-need' }, h('b', null, t('needs') + ': '),
      st.needs.map(function (n, j) {
        var m = k === 'done' ? 'ok' : k === 'failed' && n === p['break'] ? 'bad' : null;
        return [j ? ', ' : '', t('need_' + n),
          m ? h('span', { class: 'bc-mark', dataset: { m: m } }, m === 'ok' ? ' ✓' : ' ✗') : null];
      })) : null;
    var changed = s.changed === st.id;
    return h('div', {
      class: 'bc-box' + (changed ? ' sd-changed' : '') + (changed && c.dir === 'forward' ? ' sd-anim-in' : ''),
      dataset: { st: k }
    },
      h('div', { class: 'bc-head' }, h('span', { class: 'bc-num' }, String(i + 1)),
        h('span', { class: 'bc-status' }, MARKS[k] + ' ' + t(STATUS[k]))),
      h('div', { class: 'bc-name' }, t(st.label)),
      sub ? h('div', { class: 'bc-sub', translate: 'no' }, sub) : null,
      h('span', { class: 'bc-lives' }, t(st.lives)),
      needs,
      h('div', { class: 'bc-hands' }, h('b', null, t('hands') + ': '), t(st.hands)));
  }

  function chainRow(c) {
    var chain = L.chainOf(c.params), s = c.state, out = [];
    chain.stages.forEach(function (st, i) {
      if (i) out.push(h('span', { class: 'bc-arrow', 'aria-hidden': 'true', dataset: s.done.indexOf(chain.stages[i - 1].id) >= 0 ? { on: '' } : {} }, '→'));
      out.push(box(c, st, i));
    });
    return h('div', { class: 'bc-chain' }, out);
  }

  // ── the console and the state card ──

  function screenPanel(s) {
    var off = !s.power;
    var lines = off ? [h('span', null, t('scrOff'))] : s.screen.map(function (l, i) {
      var br = i < s.screen.length - 1 ? '\n' : '';
      return typeof l === 'string' ? [h('span', { translate: 'no' }, l), br] : [h('span', { class: 'bc-desc' }, t(l.t)), br];
    });
    return h('div', { class: 'bc-screen', dataset: off ? { off: '' } : {} },
      h('div', { class: 'bc-screen-title' }, t('screen')),
      h('pre', { class: 'bc-lines' }, lines));
  }

  function row(key, val, attrs) { return h('div', { class: 'bc-row' }, h('span', { class: 'bc-key' }, t(key)), h('span', Object.assign({ class: 'bc-val' }, attrs || {}), val)); }
  function marked(node, on) { return on ? h('span', { class: 'sd-changed' }, node) : node; }

  function card(c) {
    var s = c.state, prev = c.prev;
    var rootVal = s.root.real ? [t('rootReal'), ' ', code('UUID=' + L.ROOT_UUID.slice(0, 8) + '…')]
      : s.root.initramfs ? t('rootInitramfs') : t('rootNone');
    var rootChanged = prev && (prev.root.real !== s.root.real || prev.root.initramfs !== s.root.initramfs);
    var p = c.params, chain = L.chainOf(p), vars = chain.vars(p);
    // Only the rows the chain's stages fill (a chain without a PID 1 or a target shows no such row).
    var sets = function (k) { return chain.stages.some(function (st) { return st.does && st.does[k]; }); };
    var rows = [];
    if (sets('root')) rows.push(row('rootLabel', marked(h('span', null, rootVal), rootChanged)));
    if (sets('pid1')) rows.push(row('pid1Label', marked(s.pid1 ? code(s.pid1) : h('span', null, t('pid1None')), prev && prev.pid1 !== s.pid1)));
    if (sets('target')) rows.push(row('targetLabel', marked(s.target ? code(s.target) : h('span', null, t('targetNone')), prev && prev.target !== s.target),
      s.halt === 'emergency' ? { dataset: { bad: '' } } : null));
    // What root= asks for and what the disk has: the two causes of one symptom (no driver, wrong UUID) side by side.
    if (vars.uuid && s.done.indexOf('loader') >= 0 && !s.root.real) {
      // The answer shows once the initramfs has looked (it stopped there); until then it is still looking.
      var looked = s.failedAt === 'initramfs';
      var hidden = p['break'] === 'diskDriver';
      rows.push(h('div', { class: 'bc-sep' }));
      rows.push(row('wantKey', code('root=UUID=' + vars.uuid), looked && vars.uuid !== L.ROOT_UUID ? { dataset: { bad: '' } } : null));
      rows.push(row('diskKey', !looked ? h('span', null, t('diskUnknown'))
        : hidden ? h('span', null, t('diskHidden')) : code('vda4 UUID=' + L.ROOT_UUID),
        looked && hidden ? { dataset: { bad: '' } } : null));
    }
    if (s.halt) rows.push(row('haltLabel', t('halt_' + s.halt), { dataset: { bad: '' } }));
    if (s.halt === 'emergency') {
      rows.push(h('div', { class: 'bc-cmp' },
        h('div', null, h('span', { class: 'bc-mark', dataset: { m: 'bad' } }, '✗'), h('span', null, code('rescue.target'), ': ', t('cmpRescue'))),
        h('div', null, h('span', { class: 'bc-mark' }, '▶'), h('span', null, code('emergency.target'), ': ', t('cmpEmergency')))));
    }
    return h('div', { class: 'bc-card' }, rows);
  }

  // ── the time bar ──

  var PHASES = [['kernel', 'tKernel', 'var(--c2)'], ['initrd', 'tInitrd', 'var(--c3)'], ['userspace', 'tUser', 'var(--c4)']];

  function timeBar(c) {
    var chain = L.chainOf(c.params), tm = chain.timing, s = c.state, p = c.params;
    if (!tm) return null;
    var full = { kernel: tm.kernel, initrd: tm.initrd, userspace: tm.userspace['multi-user'] };
    var total = full.kernel + full.initrd + full.userspace;
    var stopped = !!s.failedAt;
    var finished = !stopped && s.at >= chain.stages.length;
    var segs = [], legend = [];
    PHASES.forEach(function (ph) {
      var v = s.t[ph[0]];
      var st = v != null ? 'done' : stopped ? 'never' : 'wait';
      var notMeasured = finished && v == null;
      segs.push(h('div', { class: 'bc-seg', dataset: { k: ph[0], st: st },
        style: { flex: '0 0 ' + (100 * full[ph[0]] / total) + '%', '--sc': ph[2] } }));
      legend.push(h('span', null, h('span', { class: 'bc-sw', dataset: { k: ph[0] }, style: { '--sc': ph[2] } }),
        t(ph[1]) + ': ', v != null ? h('b', { translate: 'no' }, secs(v) + ' s')
          : t(notMeasured ? 'tNotMeasured' : stopped ? 'tNotRun' : 'tWait')));
    });
    var tick = null;
    if (s.t.targetAt != null) {
      var at = (full.kernel + full.initrd + s.t.targetAt) / total * 100;
      tick = h('span', { class: 'bc-tick', style: { left: at + '%' } });
      legend.push(h('span', null, h('span', { class: 'bc-sw', dataset: { k: 'tick' } }), t('tTargetAt', { s: secs(s.t.targetAt) })));
    }
    var head = [h('b', null, t('timeTitle'))];
    if (finished && s.t.userspace != null) {
      // The book's line is cut before systemd's "= total"; the page prints only what the book shows.
      head.push(h('span', { class: 'bc-raw', translate: 'no' }, 'Startup finished in ' + s.t.kernel.toFixed(3) + 's (kernel) + ' +
        s.t.initrd.toFixed(3) + 's (initrd) + ' + s.t.userspace.toFixed(3) + 's (userspace)'));
    } else if (stopped) head.push(h('span', null, t('tUnfinished')));
    return h('div', { class: 'bc-time' },
      h('div', { class: 'bc-time-head' }, head),
      h('div', { class: 'bc-bar' }, segs, tick),
      h('div', { class: 'bc-tlegend' }, legend));
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'bc' },
      chainRow(c),
      h('div', { class: 'bc-mid' }, screenPanel(c.state), card(c)),
      timeBar(c)));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, p = c.params, chain = L.chainOf(p);
    var pre = chain.capPrefix || '';
    var vars = { kver: code(L.KVER), target: code(L.targetName(p) || ''),
      at: s.t.targetAt != null ? secs(s.t.targetAt) : '', user: s.t.userspace != null ? secs(s.t.userspace) : '' };
    if (!s.power) return rich('capOff');
    if (s.failedAt) {
      var i = s.stages.indexOf(s.failedAt);
      var out = rich(pre + 'capFail_' + p['break'], vars);
      // The last link has nothing after it to not try.
      return i < s.stages.length - 1 ? out.concat(' ', rich('capStopped', { ord: t('ord' + (i + 1)) })) : out;
    }
    if (!s.done.length) return rich('capPowerOn');
    var last = s.done[s.done.length - 1];
    if (s.at >= chain.stages.length && s.t.targetAt == null && chain.timing) return rich(pre + 'capDone_' + last + 'Other', vars);
    return rich(pre + 'capDone_' + last, vars);
  }

  var breaks = [['none', t('break_none')]];
  Object.keys(L.CHAINS).forEach(function (k) {
    L.CHAINS[k].breaks.forEach(function (b) { if (!breaks.some(function (o) { return o[0] === b; })) breaks.push([b, t('break_' + b)]); });
  });

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'chain', type: 'select', label: t('chain'), resets: true, options: [['linux', t('chainLinux')]],
        visible: function () { return false; } },
      { key: 'break', type: 'select', label: t('breakLabel'), hint: t('breakHint'), resets: true, options: breaks },
      { key: 'target', type: 'choice', label: t('targetParam'),
        options: [['multi-user', t('targetMulti')], ['graphical', t('targetGraphical')]],
        visible: function (p) { return L.chainOf(p).targets.length > 0; } }
    ],

    presets: [
      { id: 'normal', label: t('pNormal'), params: {}, hint: t('pNormalHint') },
      { id: 'no-kernel', label: t('pNoKernel'), params: { break: 'kernelFile' }, hint: t('pNoKernelHint') },
      { id: 'no-driver', label: t('pNoDriver'), params: { break: 'diskDriver' }, hint: t('pNoDriverHint') },
      { id: 'wrong-uuid', label: t('pWrongUuid'), params: { break: 'rootUuid' }, hint: t('pWrongUuidHint') },
      { id: 'rescue', label: t('pRescue'), params: { break: 'targetUnit' }, hint: t('pRescueHint') }
    ],

    legend: [
      { shape: 'bc-done', label: t('legDone') },
      { shape: 'bc-now', label: t('legNow') },
      { shape: 'bc-failed', label: t('legFailed') },
      { shape: 'bc-never', label: t('legNever') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
