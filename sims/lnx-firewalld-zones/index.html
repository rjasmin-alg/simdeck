<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (zones, addresses, interfaces, ports, targets, commands) is not language: translate="no". */
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function data(s, cls) { return h('span', Object.assign({ translate: 'no' }, cls ? { class: cls } : {}), String(s)); }
  function has(s, mark) { return s.changed.indexOf(mark) >= 0; }
  var ROLE = { democli1: 'hostDemocli1', admin: 'hostAdmin', outside: 'hostOutside' };
  var HOSTNAME = { democli1: 'democli1', admin: 'admin-laptop', outside: 'ext1' };
  /** --list-all prints the block zone's target as %%REJECT%%. */
  function targetText(tg) { return tg === 'REJECT' ? '%%REJECT%%' : tg; }
  function fw(s) { return { zones: s.zones, defaultZone: s.defaultZone }; }
  /** The zone an interface uses now: its binding, or the default zone. */
  function ifaceZone(s, i) { return L.holderOf(fw(s), 'interface', i) || s.defaultZone; }
  function whatOf(pk) { return pk.proto === 'icmp' ? t('icmpEcho') : data(pk.dport + '/' + pk.proto); }

  /** A verdict as symbol + word: ✓ accepted, ↩ rejected with a reply, ∅ dropped. */
  function verdictNode(v) {
    var sym = { accept: '✓', reject: '↩', drop: '∅' }[v];
    var word = { accept: t('vAccept'), reject: t('vReject'), drop: t('vDrop') }[v];
    return h('span', { class: 'fz-v', dataset: { v: v } }, h('span', { class: 'fz-sym', 'aria-hidden': 'true' }, sym), word);
  }
  function kindNode(kind) {
    return h('span', { class: 'fz-kind' }, h('span', { class: 'fz-sym', 'aria-hidden': 'true' }, kind === 'source' ? '◉' : '⇥'),
      kind === 'source' ? t('kindSource') : t('kindIface'));
  }

  // ── left: senders, the server's interfaces, the packet ──

  function senders(s, p) {
    var rows = L.SOURCES.map(function (a) {
      var id = L.HOSTS[a], on = a === p.source;
      return h('div', { class: 'fz-host', dataset: on ? { on: '' } : {} },
        h('span', { class: 'fz-host-ptr', 'aria-hidden': 'true' }, on ? '▶' : ''),
        h('span', { class: 'fz-host-id' }, data(HOSTNAME[id]), data(a)),
        h('span', { class: 'fz-host-role' }, t(ROLE[id])));
    });
    return h('section', { class: 'fz-panel' }, h('h3', null, t('senders')), h('div', { class: 'fz-hosts' }, rows));
  }

  function server(s) {
    var rows = L.IFACE_IDS.map(function (i) {
      var bound = L.holderOf(fw(s), 'interface', i);
      var into = s.packet && s.packet.iif === i;
      var ch = has(s, 'interface:' + i) || (!bound && has(s, 'default'));
      return h('div', { class: 'fz-if', dataset: into ? { 'in': '' } : {} },
        data(i, 'fz-if-name'), data(L.IFACES[i].addr + '/' + L.IFACES[i].net.split('/')[1]),
        h('span', { class: 'fz-if-zone' + (ch ? ' sd-changed' : '') },
          bound ? [t('ifZone'), ' ', data(bound)] : [t('ifDefault'), ' ', data(s.defaultZone)]));
    });
    return h('section', { class: 'fz-panel' }, h('h3', null, t('server'), ' ', data('demosrv1')), h('div', { class: 'fz-ifs' }, rows));
  }

  function packetCard(s) {
    var pk = s.packet;
    if (!pk) return h('section', { class: 'fz-panel fz-card' }, h('h3', null, t('card')), h('div', { class: 'fz-empty' }, s.phase === 'config' ? t('noPacketCmd') : t('noPacket')));
    function field(k, v) { return h('div', { class: 'fz-f' }, h('span', { class: 'fz-f-k' }, t(k)), h('span', { class: 'fz-f-v' }, v)); }
    return h('section', { class: 'fz-panel fz-card' },
      h('h3', null, t('card'), ' ', h('span', { class: 'fz-chip sd-fill' + (s.event.kind === 'arrived' ? ' sd-anim-in' : ''), dataset: { c: 1 } }, String(s.round)),
        s.round === 2 ? h('span', { class: 'fz-sm fz-muted' }, ' · ', t('round2')) : null),
      h('div', { class: 'fz-fields' },
        field('fSrc', data(pk.src)), field('fIif', data(pk.iif)),
        field('fDst', data(pk.dst)), field('fWhat', whatOf(pk))));
  }

  // ── centre: the zone picker (K4) and the command ──

  function picker(s, c) {
    var rows = L.bindings(fw(s));
    var pick = s.pick;
    var at = -1;
    if (pick) at = pick.row >= 0 ? pick.row : rows.length;
    var defChanged = has(s, 'default');
    return h('section', { class: 'fz-panel' }, RT({
      bare: true,
      dir: c.dir,
      mode: 'first',
      title: t('pickTitle'),
      columns: [{ key: 'value', label: t('colValue') }],
      actionLabel: t('colZoneAct'),
      markLabel: s.packet ? h('span', { class: 'fz-chip sd-fill', dataset: { c: 1 } }, String(s.round)) : '',
      rows: rows.map(function (b, i) {
        var read = pick && i < pick.hits.length;
        var hit = read ? pick.hits[i] : null;
        var isNew = has(s, b.kind + ':' + b.value);
        return { no: i + 1, cells: { value: b.value }, action: b.zone, effect: 'allow',
          hit: hit, miss: read && !hit ? ['value'] : [],
          tags: [{ k: 'muted', text: kindNode(b.kind) }].concat(isNew ? [{ k: 'hl', text: t('tagNew') }] : []) };
      }),
      implicit: { text: h('span', null, h('span', { class: 'fz-sym', 'aria-hidden': 'true' }, '★'), defChanged ? t('implicitDefaultNew') : t('implicitDefault')),
        action: s.defaultZone, effect: 'allow' },
      at: at,
      subject: { mark: String(s.round), c: 1 },
      done: !!pick,
      outcome: function (i) { return i === rows.length ? h('b', null, '▶ ', t('markWin')) : ''; }, // the implicit row has no win word of its own
      words: { win: t('markWin'), skip: t('markSkip') },
      changed: !!pick,
      stickyMark: true
    }));
  }

  function cmdLine(cmd) {
    if (cmd.op === 'add-port') return 'firewall-cmd ' + (cmd.explicit ? '--zone=' + cmd.zone + ' ' : '') + '--add-port=' + cmd.arg;
    if (cmd.op === 'add-source') return 'firewall-cmd --zone=' + cmd.zone + ' --add-source=' + cmd.arg;
    if (cmd.op === 'change-interface') return 'firewall-cmd --zone=' + cmd.zone + ' --change-interface=' + cmd.arg;
    return 'firewall-cmd --set-default-zone=' + cmd.zone;
  }
  function command(s) {
    var done = !!s.cmd;
    var cmd = done ? s.cmd : Object.assign({ explicit: !!L.SCENARIOS[s.scenario].cmd.zone }, L.SCENARIOS[s.scenario].cmd);
    var out = done ? (s.cmd.refused === 'ZONE_CONFLICT' ? 'Error: ZONE_CONFLICT' : s.cmd.refused ? 'Warning: ' + s.cmd.refused : 'success') : null;
    return h('section', { class: 'fz-term' + (s.phase === 'config' ? ' sd-changed' : ''), dataset: done ? {} : { next: '' } },
      h('h3', null, done ? t('cmdDone') : t('cmdTitle'), done ? null : [' · ', h('span', { class: 'fz-muted' }, t('cmdNext'))]),
      h('span', { class: 'fz-term-line', translate: 'no' }, '$ sudo ' + cmdLine(cmd)),
      out ? h('span', { class: 'fz-term-out', translate: 'no' }, out) : null);
  }

  // ── right: the zones, the chosen zone's contents, the verdict ──

  function zonesStrip(s) {
    return h('section', { class: 'fz-panel' }, h('h3', null, t('zonesTitle')),
      h('div', { class: 'fz-zones' }, Object.keys(s.zones).map(function (z) {
        var ds = {};
        if (z === s.zone && s.phase !== 'config') ds.on = '';
        if (z === s.defaultZone) ds.def = '';
        return h('span', { class: 'fz-z', dataset: ds, translate: 'no' }, z + ' · ' + targetText(s.zones[z].target));
      })));
  }

  function zoneCard(s) {
    if (!s.zone) return h('section', { class: 'fz-panel' }, h('div', { class: 'fz-empty' }, t('noZoneYet')));
    var z = s.zones[s.zone], ck = s.check;
    function line(k, vals, decided) {
      return [h('span', { class: 'fz-la-k' + (decided ? ' sd-changed' : ''), translate: 'no' }, k + ':'), h('div', { class: 'fz-la-v' }, vals)];
    }
    function item(text, sub, on, isNew) {
      return h('span', { class: 'fz-item' + (on ? ' sd-changed' : ''), translate: 'no', dataset: isNew ? { 'new': '' } : {} },
        text, sub ? h('small', null, ' ' + sub) : null);
    }
    var head = s.zone + ' (' + (s.zone === s.defaultZone ? 'default, ' : '') + 'active)';
    var ifs = z.interfaces.slice();
    if (s.zone === s.defaultZone) L.unbound(fw(s)).forEach(function (i) { ifs.push(i); });
    var lines = [].concat(
      line('target', [item(targetText(z.target), null, ck && ck.by === 'target')], false),
      line('ingress-priority', [data(z.prio)]),
      line('interfaces', ifs.map(function (i) {
        return item(i, z.interfaces.indexOf(i) < 0 ? '(default)' : null, false, has(s, 'interface:' + i) || (has(s, 'default') && z.interfaces.indexOf(i) < 0));
      })),
      line('sources', z.sources.map(function (x) { return item(x, null, false, has(s, 'source:' + x)); })),
      line('services', z.services.map(function (x) { return item(x, (L.SERVICE_DEFS[x] || []).join(' '), ck && ck.by === 'service' && ck.item === x); })),
      line('ports', z.ports.map(function (x) { return item(x, null, ck && ck.by === 'port' && ck.item === x, has(s, 'port:' + x)); })));
    return h('section', { class: 'fz-panel' },
      h('div', { class: 'fz-zhead' }, h('h3', { translate: 'no' }, head), h('span', { class: 'fz-sm fz-muted' }, t('listAll'))),
      h('div', { class: 'fz-la' }, lines));
  }

  /** The client's lines (rule 6). ssh for 22 and 8991 (sshd listens on both), the bare connect line for 9090. */
  function clientLines(s) {
    var pk = s.packet, out = [];
    if (pk.proto === 'icmp') {
      out.push(data('$ ping -c 1 ' + pk.dst, 'fz-term-line'));
      if (s.client === 'answer') out.push(data('64 bytes from ' + pk.dst + ': icmp_seq=1 ttl=64 time=0.41 ms', 'fz-term-out'));
      else if (s.client === 'unreach') out.push(data('From ' + pk.dst + ' icmp_seq=1 Packet filtered', 'fz-term-out'));
      else out.push(h('span', { class: 'fz-term-out' }, t('clientNothing')));
      return out;
    }
    var ssh = pk.dport === 22 || pk.dport === 8991;
    if (ssh) out.push(data('$ ssh ' + (pk.dport === 22 ? '' : '-p ' + pk.dport + ' ') + 'student@' + pk.dst + ' hostname', 'fz-term-line'));
    var pre = (ssh ? 'ssh: ' : '') + 'connect to host ' + pk.dst + ' port ' + pk.dport + ': ';
    if (s.client === 'answer') out.push(ssh ? data('demosrv1.lab.local', 'fz-term-out') : h('span', { class: 'fz-term-out' }, t('clientAnswer')));
    else if (s.client === 'unreach') out.push(data(pre + 'No route to host', 'fz-term-out'));
    else { out.push(h('span', { class: 'fz-term-line fz-muted' }, t('clientWaits'))); out.push(data(pre + 'Connection timed out', 'fz-term-out')); }
    return out;
  }

  function verdictBox(s) {
    if (!s.verdict) return null;
    return h('section', { class: 'fz-panel fz-verdict' + (has(s, 'check') ? ' sd-changed' : '') },
      h('h3', null, t('verdictTitle')), verdictNode(s.verdict),
      h('div', { class: 'fz-client' }, h('div', { class: 'fz-client-k' }, t('clientSees')), clientLines(s)));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, pk = s.packet, e = s.event;
    switch (e.kind) {
      case 'start': return t('cIdle');
      case 'arrived': {
        var id = L.HOSTS[pk.src];
        return t.parts(s.round === 2 ? 'cArrived2' : 'cArrived', { who: [data(HOSTNAME[id]), ' (', t(ROLE[id]), ')'], what: whatOf(pk), src: code(pk.src), iif: code(pk.iif) });
      }
      case 'zoned': {
        var rows = L.bindings(fw(s));
        if (s.pick.kind === 'source') {
          var b = rows[s.pick.row];
          var other = ifaceZone(s, pk.iif);
          if (other !== s.zone) return t.parts('cZonedSourceOver', { src: code(pk.src), iif: code(pk.iif), zone: code(s.zone), other: code(other) });
          return t.parts('cZonedSource', { src: code(pk.src), prefix: code(b.value), zone: code(s.zone), zone2: code(s.zone) });
        }
        var anySource = rows.some(function (x) { return x.kind === 'source'; });
        if (s.pick.kind === 'interface') return t.parts(anySource ? 'cZonedIface' : 'cZonedIfaceOnly', { src: code(pk.src), iif: code(pk.iif), zone: code(s.zone), zone2: code(s.zone) });
        return t.parts('cZonedDefault', { src: code(pk.src), iif: code(pk.iif), zone: code(s.zone) });
      }
      case 'judged': {
        var main = judgedCaption(s, pk);
        // the new default zone gives the same answer: say so, or the step looks like nothing happened
        if (s.round === 2 && s.cmd && s.cmd.op === 'set-default-zone' && s.pick.kind === 'default' && s.cmd.moved)
          return main.concat([' '], t.parts('cSameAnswer', { zone: code(s.zone), old: code(s.cmd.moved), iif: code(pk.iif) }));
        return main;
      }
      default: return configCaption(s);
    }
  }

  function judgedCaption(s, pk) {
    var ck = s.check, zc = code(s.zone), tg = code('target: ' + targetText(ck.target));
    if (ck.by === 'service') return t.parts('cService', { zone: zc, svc: code(ck.item), ports: code(L.SERVICE_DEFS[ck.item].join(' ')) });
    if (ck.by === 'port') return t.parts('cPort', { zone: zc, port: code(ck.item) });
    if (ck.target === 'default') {
      if (pk.proto === 'icmp') return t.parts('cTargetDefaultIcmp', { target: tg });
      return t.parts('cTargetDefault', { zone: zc, what: whatOf(pk), target: tg, msg: code('No route to host') });
    }
    if (ck.target === 'REJECT') return t.parts('cTargetReject', { zone: zc, target: tg });
    if (ck.target === 'DROP') return t.parts('cTargetDrop', { zone: zc, target: tg });
    return t.parts('cTargetAccept', { zone: zc, target: tg });
  }

  function configCaption(s) {
    var cmd = s.cmd;
    if (cmd.refused) return t.parts('cRefused', { code: code(cmd.refused) });
    if (cmd.op === 'add-port') return t.parts('cAddPort', { port: code(cmd.arg), zone: code(cmd.zone) });
    if (cmd.op === 'add-source') {
      var iif = L.iifOf(cmd.arg.split('/')[0]);
      return t.parts('cAddSource', { prefix: code(cmd.arg), zone: code(cmd.zone), iif: code(iif), other: code(ifaceZone(s, iif)) });
    }
    if (cmd.op === 'change-interface') {
      if (cmd.moved) return t.parts('cChangeIface', { iface: code(cmd.arg), from: code(cmd.moved), zone: code(cmd.zone) });
      return t.parts('cChangeIfaceNew', { iface: code(cmd.arg), zone: code(cmd.zone) });
    }
    var free = L.unbound(fw(s)), bound = L.IFACE_IDS.filter(function (i) { return free.indexOf(i) < 0; });
    return t.parts('cSetDefault', { zone: code(cmd.zone), zone2: code(cmd.zone), ifaces: code(free.join(', ')), bound: code(bound.join(', ')),
      old: code(bound.length ? ifaceZone(s, bound[0]) : cmd.moved) });
  }

  // ── the stage ──
  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'fz' },
      h('div', { class: 'fz-col' }, h('h2', null, t('colPacket')), senders(s, c.params), server(s), packetCard(s)),
      h('div', { class: 'fz-col' }, h('h2', null, t('colPick')), picker(s, c), command(s)),
      h('div', { class: 'fz-col' }, h('h2', null, t('colZone')), zonesStrip(s), zoneCard(s), verdictBox(s))));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scenario', type: 'select', label: t('scenario'), resets: true,
        options: [['book', t('scBook')], ['by-source', t('scBySource')], ['drop-vs-block', t('scDropBlock')], ['default-zone', t('scDefault')]] },
      { key: 'source', type: 'choice', label: t('source'),
        options: L.SOURCES.map(function (a) { return [a, data(a)]; }) },
      { key: 'dport', type: 'choice', label: t('dport'), hint: t('dportHint'),
        options: [['22/tcp', data('22/tcp')], ['8991/tcp', data('8991/tcp')], ['9090/tcp', data('9090/tcp')], ['icmp', t('icmpEcho')]] }
    ],

    presets: [
      { id: 'book', label: t('pBook'), params: { scenario: 'book', source: '192.168.122.186', dport: '8991/tcp' } },
      { id: 'by-source', label: t('pBySource'), params: { scenario: 'by-source', source: '192.168.122.20', dport: '8991/tcp' } },
      { id: 'drop-vs-block', label: t('pDropBlock'), params: { scenario: 'drop-vs-block', source: '10.20.0.9', dport: '22/tcp' } },
      { id: 'default-zone', label: t('pDefault'), params: { scenario: 'default-zone', source: '10.20.0.9', dport: '22/tcp' } }
    ],

    legend: [
      { shape: 'fz-src', label: t('lgSource') },
      { shape: 'fz-if', label: t('lgIface') },
      { shape: 'fz-def', label: t('lgDefault') },
      { shape: 'fz-accept', label: t('lgAccept') },
      { shape: 'fz-reject', label: t('lgReject') },
      { shape: 'fz-drop', label: t('lgDrop') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
