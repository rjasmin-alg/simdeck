<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var notice = null;   // a refused action, said once in the caption
  var GAP = 0.5;       // the gap after every ten columns, in dot pitches
  var dragging = false; // while the cut is dragged the array keeps b columns (the dividing mistake would widen it)

  /** t.parts, with every node cloned: a caption fills one number into several placeholders and several sentences
      (the kit returns the same node each time, and appending it again would move it out of the earlier place). */
  function tp(key, vars) {
    return t.parts(key, vars).map(function (x) { return x instanceof Node ? x.cloneNode(true) : x; });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function num(v) { return h('span', { class: 'ds-num', translate: 'no' }, String(v)); }
  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  var SIGN = { mul: '·', div: ':' };

  // ── geometry of the array, in dot pitches: a gap after every ten columns ──
  function colX(j) { return j + GAP * Math.floor(j / 10); }
  function widthOf(cols) { return colX(cols - 1) + 1; }
  /** The x of the boundary before column j (0 … cols): in the middle of a ten's gap. */
  function boundX(j, cols) {
    if (j <= 0) return 0;
    if (j >= cols) return widthOf(cols);
    return j % 10 === 0 ? colX(j) - GAP / 2 : colX(j);
  }

  // ── the number sentence ──
  function n(v, c) { return h('span', { class: 'ds-n', translate: 'no', dataset: c ? { c: String(c) } : {} }, String(v)); }
  function op(s) { return h('span', { class: s === '(' ? 'ds-po' : s === ')' ? 'ds-pc' : null }, s); }
  function mark(c) { return h('span', { class: 'ds-mark', dataset: { c: String(c), shape: c === 1 ? 'round' : '' }, 'aria-hidden': 'true' }); }
  function term(c, kids, bad) {
    return h('span', { class: 'ds-term' + (bad ? ' ds-bad' : ''), dataset: { c: String(c) } }, mark(c), kids);
  }
  function seg(kids) { return h('span', { class: 'ds-seg' }, kids); }
  function res(v, ok) { return h('span', { class: 'ds-res', translate: 'no', dataset: { ok: ok } }, String(v)); }

  function sentence(s) {
    var child = audience === 'child', ask = s.hide;
    var segs = [];
    var mul = s.op === 'mul';
    segs.push(seg(mul ? [n(s.a), op('·'), n(s.b)] : [n(s.n), op(':'), n(s.a)]));
    if (s.trivial) {
      segs.push(seg([ask ? res('?', 'ask') : res(s.result, 'yes')]));
      return segs;
    }
    var p = s.parts[0].add, q = s.parts[1].add;
    var bad = !ask && (s.wrong && s.delta !== 0);
    var noDiv = !s.divides;
    if (!child) {
      segs.push(seg(mul ? [n(s.a), op('·'), op('('), n(p, 1), op('+'), n(q, 2), op(')')]
        : [op('('), n(p, 1), op('+'), n(q, 2), op(')'), op(':'), n(s.a)]));
    }
    var t1 = term(1, mul ? [n(s.a), op('·'), n(p)] : [n(p), op(':'), n(s.a)], !ask && noDiv);
    var t2 = s.wrong ? term(2, [n(q)], bad)
      : term(2, mul ? [n(s.a), op('·'), n(q)] : [n(q), op(':'), n(s.a)], !ask && noDiv);
    segs.push(seg([t1, op('+'), t2]));
    if (noDiv) return segs;
    var v1 = s.parts[0].val, v2 = s.parts[1].val;
    if (ask) segs.push(seg([res('?', 'ask'), op('+'), res('?', 'ask')]));
    else {
      var w2 = n(v2, 2);
      segs.push(seg([n(v1, 1), op('+'), bad ? h('span', { class: 'ds-bad' }, w2) : w2]));
    }
    segs.push(seg([ask ? res('?', 'ask') : bad ? h('span', { class: 'ds-bad' }, res(s.result, 'no')) : res(s.result, 'yes')]));
    return segs;
  }

  function eqBox(s) {
    var child = audience === 'child', ask = s.hide;
    var segs = sentence(s), line = [];
    segs.forEach(function (sg, i) { if (i) line.push(h('span', { class: 'ds-seg' }, '=')); line.push(sg); });
    var col = [h('div', { class: 'ds-eq', role: 'group', 'aria-label': t('paperEq') }, line)];
    // dividing: the check by multiplying (veza množenja i dijeljenja)
    if (s.op === 'div' && !ask && s.divides) {
      var ok = s.check === s.n;
      col.push(h('div', { class: 'ds-check', dataset: { ok: ok ? 'yes' : 'no' } },
        h('span', null, t('checkLab')),
        h('b', { translate: 'no' }, s.result + ' · ' + s.a + ' = ' + s.check),
        ok ? null : h('b', { class: 'ds-ne', translate: 'no' }, '≠ ' + s.n),
        h('span', { 'aria-hidden': 'true' }, ok ? '✓' : '✗')));
    }
    var side = [];
    if (ask) {
      side.push(h('span', { class: 'ds-ask' }, t('ask')));
      side.push(noFocus(h('button', { type: 'button', class: 'sd-btn sd-btn--primary ds-reveal', title: t('revealKey') + ' (V)', 'aria-keyshortcuts': 'v',
        onclick: function () { sim.set({ hide: false }); } }, t('reveal'), ' ', h('kbd', null, 'V'))));
    } else if (!s.trivial) {
      var good = s.ok || (s.wrong && s.delta === 0);
      var word = child ? t(good ? 'vSameC' : 'vNotC') : !s.divides ? t('vNoDiv') : t(good ? 'vSame' : 'vNot');
      var kids = [h('span', { 'aria-hidden': 'true' }, good ? '✓' : '✗'), h('span', null, word)];
      if (!good && s.divides) kids.push(h('span', { class: 'ds-ne', translate: 'no' }, s.result + ' ≠ ' + s.right));
      side.push(h('span', { class: 'ds-verdict', dataset: { ok: good ? 'yes' : 'no' } }, kids));
      if (audience === 'teacher') {
        side.push(noFocus(h('button', { type: 'button', class: 'sd-btn ds-sidebtn', title: t('hideHint'), 'aria-keyshortcuts': 'v',
          onclick: function () { sim.set({ hide: true }); } }, t('hide'), ' ', h('kbd', null, 'V'))));
      }
    }
    return h('section', { class: 'ds-box ds-eqbox' }, h('div', { class: 'ds-eqcol' }, col), side.length ? h('div', { class: 'ds-side' }, side) : null);
  }

  // ── the array ──
  function arrayBox(s) {
    var cols = s.cols, rows = s.a, W = widthOf(cols), H = rows;
    var svgNS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    var ask = s.hide;
    for (var i = 0; i < rows; i++) {
      var row = s.rows[i];
      for (var j = 0; j < cols; j++) {
        var k = row.charAt(j);
        // asking first: lost and phantom dots are not judged yet; a lost dot is drawn as the dot it is, a phantom not at all
        if (ask && k === 'x') k = '2';
        if (ask && k === 'o') continue;
        var cx = colX(j) + 0.5, cy = i + 0.5, el;
        if (k === '1') {
          el = document.createElementNS(svgNS, 'circle');
          el.setAttribute('cx', cx); el.setAttribute('cy', cy); el.setAttribute('r', 0.34);
          el.setAttribute('class', 'ds-d1');
        } else if (k === '2') {
          el = document.createElementNS(svgNS, 'rect');
          el.setAttribute('x', cx - 0.31); el.setAttribute('y', cy - 0.31); el.setAttribute('width', 0.62); el.setAttribute('height', 0.62);
          el.setAttribute('class', 'ds-d2');
        } else {
          el = document.createElementNS(svgNS, k === 'x' ? 'rect' : 'circle');
          if (k === 'x') { el.setAttribute('x', cx - 0.29); el.setAttribute('y', cy - 0.29); el.setAttribute('width', 0.58); el.setAttribute('height', 0.58); }
          else { el.setAttribute('cx', cx); el.setAttribute('cy', cy); el.setAttribute('r', 0.3); }
          el.setAttribute('class', 'ds-dx');
        }
        svg.append(el);
      }
    }
    // the cut: straight between columns, or a step where a column is split (dividing, rule 4)
    var c = s.c, r = s.r;
    var x0 = boundX(c, cols), x1 = r ? boundX(c + 1, cols) : x0;
    var path = document.createElementNS(svgNS, 'path');
    path.setAttribute('d', r ? 'M ' + x1 + ' -0.35 V ' + r + ' H ' + x0 + ' V ' + (H + 0.35) : 'M ' + x0 + ' -0.35 V ' + (H + 0.35));
    path.setAttribute('class', 'ds-cut');
    svg.append(path);

    var kids = [svg, h('span', { class: 'ds-knob', style: { left: pct(x1 / W) } })];
    // brackets under the parts with their numbers of columns; the rows on the left
    function bracket(from, to, c, label, bad) {
      if (to <= from) return;
      kids.push(h('span', { class: 'ds-brk', dataset: bad ? { c: String(c), bad: '' } : { c: String(c) }, style: { left: pct(from / W), width: pct((to - from) / W) } }));
      if (label != null) kids.push(h('span', { class: 'ds-brklab', translate: 'no', dataset: bad ? {} : { c: String(c) }, style: { left: pct((from + to) / 2 / W) } }, String(label)));
    }
    var mul = s.op === 'mul';
    if (s.trivial) bracket(0, W, s.p === 0 ? 2 : 1, s.b, false);
    else if (!s.divides) { bracket(0, x1, 1, null, !ask); bracket(x0, W, 2, null, !ask); }
    else {
      bracket(0, x0, 1, mul ? s.p : s.p / s.a, false);
      var wide = s.wrong && !mul && s.wideOk;
      bracket(x0, W, 2, mul ? s.q : wide ? s.q : s.q / s.a, wide && !ask);
    }
    kids.push(h('span', { class: 'ds-rows' }));
    kids.push(h('span', { class: 'ds-rowslab', translate: 'no' }, String(rows)));

    var cutText = s.trivial ? '—' : (s.parts[0].add + ' + ' + s.parts[1].add);
    var field = h('div', { class: 'ds-field', style: { '--ratio': (W / H).toFixed(4) }, role: 'img',
      'aria-label': t('arrayLabel', { rows: t.n('rowsN', rows), dots: t.n('dotsN', s.b), cut: cutText }) }, kids);
    var wrap = h('div', { class: 'ds-fieldwrap' }, field);
    attachDrag(wrap, field);
    return h('section', { class: 'ds-box ds-arrbox' }, wrap);
  }

  // ── dragging the cut: the nearest boundary between whole columns ──
  function attachDrag(wrap, field) {
    wrap.addEventListener('pointerdown', function (e) {
      if (field.getBoundingClientRect().width <= 0) return;
      e.preventDefault();
      var id = e.pointerId;
      // every move re-renders the stage: take the current field each time. While dragging, the array is drawn with
      // its b columns (render), so the geometry does not move under the pointer in the dividing mistake
      dragging = true;
      if (sim.state.cols !== sim.state.b) sim.render();
      function move(ev) {
        if (ev.pointerId !== id) return;
        var s = sim.state, f = document.querySelector('[data-sim="ari-distributive"] .ds-field') || field;
        var rect = f.getBoundingClientRect();
        if (rect.width <= 0) return;
        var cols = s.b, W = widthOf(cols), maxJ = s.b;
        var x = (ev.clientX - rect.left) / rect.width * W;
        var best = 0;
        for (var j = 1; j <= maxJ; j++) if (Math.abs(boundX(j, cols) - x) < Math.abs(boundX(best, cols) - x)) best = j;
        var p = s.op === 'mul' ? best : best * s.a;
        if (p !== sim.params.p) sim.set({ p: p });
      }
      function up(ev) {
        if (ev && ev.pointerId !== id) return;
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        window.removeEventListener('blur', up);
        dragging = false;
        sim.render();
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
      window.addEventListener('blur', up);
      move(e);
    });
  }

  // ── the written form ──
  function digitsOf(v) { return String(v).split(''); }
  function paper(s) {
    var w = s.written;
    var cells = [], cols;
    function sq(text, opts) {
      opts = opts || {};
      return h('span', { class: 'ds-sq' + (opts.rule ? ' ds-rule' : ''), dataset: opts.c ? { c: String(opts.c) } : {}, translate: 'no' },
        text == null ? '' : text, opts.carry ? h('span', { class: 'ds-carry', dataset: { c: '2' }, title: t('wCarry', { c: opts.carry }) }, String(opts.carry)) : null);
    }
    if (s.op === 'mul') {
      var bd = digitsOf(s.b), rd = digitsOf(w.result);
      var L0 = Math.max(bd.length, rd.length);
      cols = L0 + 2;
      var i;
      for (i = 0; i < L0 - bd.length; i++) cells.push(sq(''));
      bd.forEach(function (d) { cells.push(sq(d)); });
      cells.push(sq('·'), sq(String(s.a)));
      var carry = w.steps.length > 1 ? w.carry : 0;
      for (i = 0; i < L0; i++) {
        var k = i - (L0 - rd.length);
        var place = L0 - 1 - i; // 0 = ones; the carry tag sits on the tens of the product
        cells.push(sq(k >= 0 ? rd[k] : '', { rule: true, carry: place === 1 && carry ? carry : 0 }));
      }
      cells.push(sq(''), sq(''));
    } else {
      var nd = digitsOf(w.n), qd = digitsOf(w.result);
      cols = nd.length + 3 + qd.length;
      nd.forEach(function (d) { cells.push(sq(d)); });
      cells.push(sq(':'), sq(String(s.a)), sq('='));
      qd.forEach(function (d) { cells.push(sq(d)); });
      w.work.forEach(function (line) {
        var txt = line.text.split('');
        var lead = nd.length - txt.length - line.end;
        for (var j = 0; j < cols; j++) {
          var k2 = j - lead;
          cells.push(sq(k2 >= 0 && k2 < txt.length ? txt[k2] : ''));
        }
      });
    }
    return h('div', { class: 'ds-paper', style: { '--cols': String(cols) }, role: 'img', 'aria-label': t('wTitle_' + s.op) }, cells);
  }

  function stepText(st) {
    switch (st.kind) {
      case 'mulOnes': return t(st.carry ? 'mulOnes' : 'mulOnes0', { d: st.d, a: st.a, prod: st.prod, w: st.write, c: st.carry });
      case 'mulTens': return t(st.carryIn ? 'mulTens' : 'mulTens0', { d: st.d, a: st.a, prod: st.prod, c: st.carryIn, s: st.sum });
      case 'mulOnly': return t('mulOnly', { d: st.d, a: st.a, prod: st.prod });
      case 'divTens': return t(st.rem ? 'divTens' : 'divTens0', { num: st.num, a: st.a, quot: st.quot, rem: st.rem });
      case 'divOnes': return t('divOnes', { num: st.num, a: st.a, quot: st.quot, down: st.down });
      default: return t('divOnly', { num: st.num, a: st.a, quot: st.quot });
    }
  }

  function writtenBox(s) {
    var w = s.written, here = s.place.here;
    var items = w.steps.map(function (st) {
      var lab = st.kind === 'mulOnes' ? 'wOnes' : st.kind === 'mulTens' || st.kind === 'divTens' ? 'wTens' : st.kind === 'divOnes' ? 'wOnes' : null;
      return h('li', null, here && st.part ? mark(st.part) : null, lab ? h('small', null, t(lab)) : null, h('span', { translate: 'no' }, stepText(st)));
    });
    var link;
    if (s.place.trivial) link = h('div', { class: 'ds-link' }, h('span', null, s.b < 10 ? t('wOne') : t('wTensOnly', { b: s.b })));
    else {
      var T = Math.floor(s.b / 10), U = s.b % 10;
      var txt = s.op === 'mul'
        ? t('wLink_mul', { w: 10 * T, a: s.a, u: U, pu: s.a * U, t: 10 * T, pt: s.a * 10 * T, r: s.a * s.b })
        : t('wLink_div', { w: 10 * T, a: s.a, p: s.place.p, q: s.n - s.place.p, qt: 10 * T, qu: U, r: s.b });
      link = h('div', { class: 'ds-link' }, h('span', null, txt),
        here ? h('span', { class: 'ds-here' }, '✓ ' + t('wHere'))
          : noFocus(h('button', { type: 'button', class: 'sd-btn ds-sidebtn', title: t('placeKey') + ' (P)', 'aria-keyshortcuts': 'p', onclick: placeNow },
            t('wPlace'), ' ', h('kbd', null, 'P'))));
    }
    return h('section', { class: 'ds-box ds-written' },
      h('div', { class: 'ds-wtitle' }, t('wTitle_' + s.op)),
      paper(s),
      h('div', { class: 'ds-steps' }, h('ol', null, items), link));
  }

  function render(c) {
    var s = c.state;
    var showWritten = audience !== 'child' && !s.hide;
    c.stage.replaceChildren(h('div', { class: 'ds', dataset: { aud: audience, op: s.op } },
      eqBox(s), arrayBox(dragging && s.cols !== s.b ? L.initial(Object.assign({}, c.params, { way: 'right' })) : s),
      showWritten ? writtenBox(s) : null));
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, A = audience;
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(notice); notice = null; }
    var mul = s.op === 'mul';
    var task = num(L.taskText(s));
    if (s.hide) { add(A === 'child' ? t('cAskC') : t('cAsk')); return out; }
    if (s.trivial) { add(A === 'child' ? t('cNoneC') : tp('cNone', { task: task })); return out; }
    var p = s.parts[0].add, q = s.parts[1].add;
    // a number followed by a noun takes the noun's plural form (hr: 1 / 2–4 / 5+)
    var V = { a: num(s.a), b: num(s.b), n: num(s.n), p: num(p), q: num(q), r: num(s.right),
      rows: t.n('rowsN', s.a), rowsEq: t.n('rowsEqN', s.a), dots: t.n('dotsN', mul ? s.b : s.n) };
    if (!s.divides) {
      V.c = num(s.c); V.rr = num(s.r);
      if (A === 'child') { add(tp('cNoDivC', V)); return out; }
      if (!s.place.trivial) { V.pp = num(s.place.p); V.qq = num(s.n - s.place.p); addHl(tp('cNoDiv', V)); }
      else addHl(tp('cNoDivNoHint', V));
      if (A === 'adult') add(t('whyNoDiv'));
      return out;
    }
    if (s.wrong) {
      V.res = num(s.result); V.lost = t.n('dotsN', s.lost); V.chk = num(s.check); V.qd = t.n('dotsN', q);
      if (s.delta === 0) { add(tp(mul ? 'cOneSame' : 'cOneSameDiv', V)); return out; }
      if (A === 'child') { addHl(tp(mul ? 'cOneMulC' : 'cOneDivC', V)); return out; }
      addHl(tp(mul ? 'cOneMul' : s.wideOk ? 'cOneDiv' : 'cOneDivWide', V));
      if (A === 'adult') add(tp(mul ? 'whyOneMul' : 'whyOneDiv', V));
      return out;
    }
    V.v1 = num(s.parts[0].val); V.v2 = num(s.parts[1].val);
    if (A === 'child') { add(tp(mul ? 'cMulC' : 'cDivC', V)); return out; }
    add(tp(mul ? 'cMul' : 'cDiv', V));
    if (s.place.here) add(t('cPlace_' + s.op));
    if (A === 'adult') add(tp(mul ? 'whyMul' : 'whyDiv', V));
    return out;
  }

  // ── the panel: the operation and the task field; the header: the audience switch ──
  var field = null;
  function buildTask() {
    var host = document.querySelector('[data-ds-task]');
    var opBtns = L.OPS.map(function (o) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { switchOp(o); } }, t('op_' + o)));
    });
    var seg = h('div', { class: 'sd-seg', role: 'group', 'aria-label': t('op') }, opBtns);
    var label = h('label', { class: 'sd-ctl-label', for: 'ds-task' }, h('span', null, t('taskLabel')));
    var input = h('input', { id: 'ds-task', type: 'text', class: 'ds-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', title: t('taskHint'), 'aria-describedby': 'ds-task-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'ds-task-msg', role: 'status' }, '');
    function clear() { input.removeAttribute('aria-invalid'); msg.textContent = ''; msg.className = 'sd-hint'; }
    input.addEventListener('input', function () {
      var r = L.parseTask(input.value);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t('err_' + r.error);
        msg.className = 'ds-err';
        return;
      }
      clear();
      var tk = r.task, cur = L.taskOf(sim.params);
      if (tk.op === cur.op && tk.a === cur.a && tk.b === cur.b) return;
      // a new task starts at the cut of the written form (or in the middle when that is no cut)
      var pc = L.placeCut(tk.op, tk.a, tk.b);
      var pMax = tk.op === 'mul' ? tk.b : tk.a * tk.b;
      var p = pc.trivial ? (tk.op === 'mul' ? Math.floor(tk.b / 2) : tk.a * Math.floor(tk.b / 2)) : pc.p;
      sim.set({ op: tk.op, a: tk.a, b: tk.b, p: Math.min(p, pMax) });
    });
    // Enter or Esc hands the keys back to the page
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    // leaving the field writes the task back as the page reads it (23 · 4 → 4 · 23, 84/4 → 84 : 4)
    input.addEventListener('blur', function () {
      if (input.getAttribute('aria-invalid')) { clear(); sim.render(); return; }
      input.value = L.taskText(L.taskOf(sim.params));
    });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('taskTitle') },
      h('div', { class: 'ds-field-ctl' }, seg, label, input, msg)));
    field = { host: host, input: input, clear: clear, opBtns: opBtns };
  }
  function syncPanel(c) {
    if (!field) return;
    field.host.hidden = audience === 'child';
    var tk = L.taskOf(c.params);
    field.opBtns.forEach(function (b, i) { b.setAttribute('aria-pressed', String(L.OPS[i] === tk.op)); });
    var shown = L.parseTask(field.input.value);
    var same = !shown.error && shown.task.op === tk.op && shown.task.a === tk.a && shown.task.b === tk.b;
    if (document.activeElement !== field.input && !same) { field.input.value = L.taskText(tk); field.clear(); }
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }

  /** Switch the operation and keep the array: the cut is converted (columns ↔ dots). */
  function switchOp(o) {
    var prm = sim.params;
    var cur = L.taskOf(prm);
    if (cur.op === o) return;
    sim.set({ op: o, p: L.convertP(cur.op, cur.a, L.pOf(prm)) });
  }

  function placeNow() {
    var s = sim.state;
    if (s.place.trivial) { notice = t('nPlaceNone'); sim.render(); return; }
    if (s.place.here) { notice = t('nPlaceDone'); sim.render(); return; }
    sim.set({ p: s.place.p });
  }

  buildAudience();
  buildTask();

  function pMaxNow() { return L.taskOf(sim ? sim.params : L.defaults).pMax; }
  var hidden = function (key, max) {
    return { key: key, type: 'range', label: t('taskTitle'), value: L.defaults[key], min: 1, max: max, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'op', type: 'choice', label: t('op'), value: L.defaults.op, options: L.OPS.map(function (o) { return [o, t('op_' + o)]; }),
        visible: function () { return false; } },
      hidden('a', L.A_MAX), hidden('b', L.B_MAX),
      { key: 'p', type: 'range', label: t('p'), hint: t('pHint'), value: L.defaults.p, min: 0,
        max: function (prm) { return L.taskOf(prm).pMax; },
        format: function (v) { return v + ' + ' + (pMaxNow() - v); } },
      { key: 'way', type: 'choice', label: t('way'), value: L.defaults.way,
        options: L.WAYS.map(function (w) { return [w, t('way_' + w)]; }), visible: function () { return audience === 'teacher'; } },
      // asking first: the stage's buttons and V open and close it; here so the URL and the presets carry it
      { key: 'hide', type: 'toggle', label: t('hide'), value: L.defaults.hide, visible: function () { return false; } }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 'p', label: t('placeKey'), run: placeNow },
      { key: 'v', label: t('revealKey'), run: function (s) { s.set({ hide: !s.params.hide }); } }
    ],

    legend: [
      { c: 1, shape: 'round', label: t('legFirst') },
      { c: 2, label: t('legSecond') },
      { shape: 'hollow', label: t('legLost') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows: a clamped task or cut is written back, so the slider and the URL say what the
  // stage says
  sim.on(function (c) {
    var prm = c.params, s = c.state;
    if (prm.op !== s.op || prm.a !== s.a || prm.b !== s.b) { sim.set({ op: s.op, a: s.a, b: s.b }); return; }
    if (prm.p !== s.p) sim.set({ p: s.p });
  });
  sim.render();
})();
</script>
</body>
</html>
