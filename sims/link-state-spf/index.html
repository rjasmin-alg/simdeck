<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var R = L.ROUTERS;
  var NS = 'http://www.w3.org/2000/svg';

  // Where each router sits in the grid: [col, row], every card spanning two of ten columns. A zigzag of three triangles
  // (A-B-C, B-C-D, C-D-E): B and D on top, A, C and E below, row 1 a spacer, so every link is long enough for its cost
  // in the middle and a chip near each end.
  var POS = { A: [0, 2], B: [2, 0], C: [4, 2], D: [6, 0], E: [8, 2] };
  var ROWS = ['auto', 'minmax(2rem, 1fr)', 'auto'];

  function colour(r) { return R.indexOf(r) + 1; }
  function data(x) { return h('b', { translate: 'no' }, String(x)); }
  function dash(id) { return id.replace('-', '–'); }
  function list(names, word) {
    var out = [];
    names.forEach(function (r, i) {
      if (i > 0) out.push(i === names.length - 1 ? t(word || 'and') : t('listSep'));
      out.push(data(r));
    });
    return h('span', null, out);
  }
  function hops(nh) { return nh.length ? nh.join(', ') : '—'; }
  function term(key) { return h('i', null, t(key)); }
  /** t.parts, with a fresh copy of a node that a string uses twice ("{r} … {r}"): a node can stand in one place only. */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function inSpf(s) { return s.kind === 'spf' || s.kind === 'table'; }
  function spfState(s, r) {
    if (!s.spf) return 'none';
    if (s.spf.final.indexOf(r) >= 0) return 'final';
    return s.spf.dist[r] == null ? 'none' : 'tent';
  }

  // ── stage ──

  function lsdbEl(s, r) {
    var latest = L.latestOf(s.lsas);
    var fresh = {};
    s.inFlight.forEach(function (c) { if (c.to === r && c.fate === 'new') fresh[c.o] = true; });
    if (s.kind === 'originate' || s.kind === 'change') s.originated.forEach(function (o) {
      if (s.kind === 'originate' ? o === r : true) fresh[o] = true;
    });
    var cells = R.map(function (o) {
      var seq = s.lsdb[r] ? s.lsdb[r][o] : null;
      var held = seq == null ? 'no' : seq < latest[o] ? 'old' : 'yes';
      return h('span', { class: 'ls-cell' + (held === 'yes' ? ' sd-fill' : '') + (fresh[o] ? ' ls-new' : ''), dataset: { c: colour(o), held: held }, translate: 'no' },
        o, h('small', null, seq == null ? '·' : String(seq)));
    });
    // the router's own links and costs: shown only where the drawing is hidden (phone), so the costs stay visible
    var own = L.lsaOf(s.links, r, 0).links.map(function (e) { return e[0] + ' ' + e[1]; }).join(' · ');
    return h('div', { class: 'ls-dbx' }, h('span', { class: 'ls-dbh' }, t('lsdbHead')),
      h('div', { class: 'ls-db', role: 'group', 'aria-label': t('lsdbOf', { r: r }) }, cells),
      h('span', { class: 'ls-own' }, t('ownLinks'), ' ', h('b', { translate: 'no' }, own)));
  }

  function chipEl(copies) {
    return h('span', { class: 'ls-env', translate: 'no' }, copies.map(function (c) {
      var ds = { c: colour(c.o) };
      if (c.fate === 'dup') ds.dup = '';
      return h('span', { class: 'ls-lsa' + (c.fate === 'dup' ? '' : ' sd-fill'), dataset: ds }, c.o);
    }));
  }

  /** The cost on every link and the gap that makes an ECMP tree link double: drawn over K2's links after layout. */
  function overlay(topo, links, ecmp, changed) {
    var svgEl = document.createElementNS(NS, 'svg');
    var labels = links.map(function (l) {
      var ds = {};
      if (!l.up) ds.down = '';
      return h('span', { class: 'ls-cost' + (changed.indexOf(l.id) >= 0 ? ' ls-new' : ''), dataset: ds, translate: 'no' }, String(l.cost));
    });
    topo.append(h('div', { class: 'ls-over', 'aria-hidden': 'true' }, svgEl), h('div', { class: 'ls-over ls-costs', 'aria-hidden': 'true' }, labels));
    function centre(id) {
      var c = topo.querySelector('.sd-topo-card[data-id="' + id + '"]');
      var a = c.getBoundingClientRect(), b = topo.getBoundingClientRect();
      return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2 };
    }
    function place() {
      if (!topo.getBoundingClientRect().width) return;
      svgEl.replaceChildren();
      links.forEach(function (l, i) {
        var a = centre(l.a), b = centre(l.b);
        labels[i].style.left = (a.x + b.x) / 2 + 'px';
        labels[i].style.top = (a.y + b.y) / 2 + 'px';
        if (ecmp.indexOf(l.id) >= 0) {
          var line = document.createElementNS(NS, 'line');
          line.setAttribute('x1', a.x); line.setAttribute('y1', a.y); line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
          line.setAttribute('class', 'ls-gap');
          svgEl.append(line);
        }
      });
    }
    if (typeof ResizeObserver === 'function') {
      var ro = new ResizeObserver(function () { if (!topo.isConnected) { ro.disconnect(); return; } place(); });
      ro.observe(topo);
    } else requestAnimationFrame(place);
  }

  function drawEl(c) {
    var s = c.state, p = c.params;
    var spf = inSpf(s);
    var treeIds = s.tree.map(function (e) { return L.linkId(e.a, e.b); });
    var ecmpIds = s.tree.filter(function (e) { return e.ecmp; }).map(function (e) { return L.linkId(e.a, e.b); });
    var changedLinks = [];
    if (s.kind === 'change' && s.change) {
      if (s.change.cost) changedLinks.push('B-C');
      if (s.change.fail) changedLinks.push(s.change.fail);
    }
    var nodes = R.map(function (r) {
      return { id: r, kind: 'router', col: POS[r][0], row: POS[r][1], span: 2, mark: r, c: colour(r),
        state: spf && r === p.source ? 'active' : null, extra: lsdbEl(s, r) };
    });
    var links = s.links.map(function (l) {
      return { id: l.id, a: l.a, b: l.b, state: l.up ? 'up' : 'down', active: l.up && treeIds.indexOf(l.id) >= 0 };
    });
    var groups = {}, order = [];
    s.inFlight.forEach(function (cp) {
      var k = cp.from + '>' + cp.to;
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(cp);
    });
    var packets = order.map(function (k) {
      var g = groups[k];
      return { from: g[0].from, to: g[0].to, label: chipEl(g), at: 0.2 };
    });
    var topo = Simdeck.topology({ cols: 10, rows: ROWS, dir: c.dir, nodes: nodes, links: links, packets: packets });
    if (spf) R.forEach(function (r) {
      var card = topo.querySelector('.sd-topo-card[data-id="' + r + '"]');
      if (card) card.dataset.spf = spfState(s, r);
    });
    overlay(topo, s.links, ecmpIds, changedLinks);
    return h('div', { class: 'ls-draw' }, topo);
  }

  function statusEl(c) {
    var s = c.state, p = c.params;
    var what = s.kind === 'start' ? t(s.change ? 'phConv' : 'phStart') : s.kind === 'change' ? t('phChange') :
      s.kind === 'originate' ? t('phOrig') : s.kind === 'flood' ? t('phFlood', { k: s.round }) :
      s.kind === 'spf' ? t('phSpf', { k: s.spf.final.length }) : t('phTable');
    var chg = [];
    if (s.change && s.change.cost) chg.push(h('span', { class: 'ls-chg' }, parts('chgCost', { from: data(s.change.cost.from), to: data(s.change.cost.to) })));
    if (s.change && s.change.fail) chg.push(h('span', { class: 'ls-chg' }, parts('chgFail', { l: data(dash(s.change.fail)) })));
    return h('div', { class: 'ls-status' }, h('b', null, what), chg, s.end ? h('span', { class: 'ls-done' }, t('phDone')) : null);
  }

  function spfTable(c) {
    var s = c.state, p = c.params;
    var head = h('h3', null, parts('spfTitle', { r: data(p.source) }));
    if (!s.spf) return h('section', null, head, h('p', { class: 'ls-empty' }, parts('spfWait', { r: data(p.source) })));
    var touched = {};
    // marked: a row whose distance or next hops changed this step (an equal path that adds no next hop is not)
    if (s.kind === 'spf') s.spf.relaxed.forEach(function (x) {
      if (x.how === 'new' || x.how === 'better' || (x.how === 'equal' && x.old.nextHop.join() !== s.spf.nextHop[x.r].join())) touched[x.r] = true;
    });
    var rows = R.map(function (r) {
      var st = spfState(s, r), d = s.spf.dist[r];
      var cls = 'ls-tr' + (s.kind === 'spf' && s.spf.picked === r ? ' ls-picked' : '') + (touched[r] ? ' ls-new' : '');
      return h('div', { class: cls, dataset: { st: st } },
        h('span', { class: 'ls-who' }, h('span', { class: 'ls-dot' + (st === 'final' ? ' sd-fill' : ''), dataset: { c: colour(r), st: st }, translate: 'no' }, r)),
        h('span', { class: 'ls-d', translate: 'no' }, d == null ? '∞' : String(d)),
        h('span', { class: 'ls-d', translate: 'no' }, r === p.source ? '—' : hops(s.spf.nextHop[r])),
        h('span', { class: 'ls-w' }, t(st === 'final' ? 'stFinal' : st === 'tent' ? 'stTent' : 'stNone')));
    });
    return h('section', null, head, h('div', { class: 'ls-tab', dataset: { cols: 4 } },
      h('span', { class: 'ls-th' }, t('colRouter')), h('span', { class: 'ls-th' }, t('colDist')),
      h('span', { class: 'ls-th' }, t('colVia')), h('span', { class: 'ls-th' }, t('colState')), rows));
  }

  function sameRow(a, b) { return !!a && !!b && a.cost === b.cost && a.via.join() === b.via.join(); }
  function oldRow(s, dest) { return (s.oldTable || []).filter(function (x) { return x.dest === dest; })[0]; }

  function routeTable(c) {
    var s = c.state, p = c.params;
    var old = s.kind !== 'table' && s.oldTable;
    var head = h('h3', null, parts('rtTitle', { r: data(p.source) }), old ? h('small', null, t('rtOld')) : null);
    if (!s.table.length) return h('section', null, head, h('p', { class: 'ls-empty' }, t('rtEmpty')));
    var rows = s.table.map(function (x) {
      var isNew = s.kind === 'table' && !sameRow(x, oldRow(s, x.dest));
      return h('div', { class: 'ls-tr' + (isNew ? ' ls-new' : '') },
        h('span', { class: 'ls-who' }, h('span', { class: 'ls-dot sd-fill', dataset: { c: colour(x.dest) }, translate: 'no' }, x.dest)),
        h('span', { class: 'ls-d', translate: 'no' }, String(x.cost)),
        h('span', { class: 'ls-d', translate: 'no' }, hops(x.via)));
    });
    return h('section', null, head, h('div', { class: 'ls-tab', dataset: { cols: 3 } },
      h('span', { class: 'ls-th' }, t('colDest')), h('span', { class: 'ls-th' }, t('colCost')), h('span', { class: 'ls-th' }, t('colVia')), rows));
  }

  // ── caption ──

  function changeWords(ch) {
    var out = [];
    if (ch.cost) out.push(parts('chgCostLong', { from: data(ch.cost.from), to: data(ch.cost.to) }));
    if (ch.fail) {
      if (out.length) out.push([t('and')]);
      out.push(parts('chgFailLong', { l: data(dash(ch.fail)) }));
    }
    return h('span', null, out);
  }

  /** The path to u along first parents, then v: "A–B–C–D". */
  function pathTo(spf, u, v) {
    var chain = [v, u];
    while (spf.parents[chain[chain.length - 1]].length) chain.push(spf.parents[chain[chain.length - 1]][0]);
    return data(chain.reverse().join('–'));
  }

  function relaxWords(s, x) {
    var sp = s.spf, two = sp.nextHop[x.r].length > 1;
    var v = { v: data(x.r), u: data(x.via), d: data(x.offer), nh: two ? list(sp.nextHop[x.r]) : data(hops(sp.nextHop[x.r])) };
    if (x.how === 'new') return parts(two ? 'relNewTwo' : 'relNew', v);
    v.path = pathTo(sp, x.via, x.r);
    v.old = data(x.old.dist);
    if (x.how === 'worse') return parts('relWorse', v);
    if (x.how === 'better') {
      v.oldLink = data(dash(L.linkId(x.old.parents[0], x.r)));
      if (two) return parts('relBetterTwo', v);
      return parts(x.old.nextHop.join() === sp.nextHop[x.r].join() ? 'relBetterSame' : 'relBetterNew', v);
    }
    if (x.old.nextHop.join() === sp.nextHop[x.r].join()) return parts('relEqualSame', v);
    v.term = term('termEcmp');
    return parts('relEqual', v);
  }

  function capFor(c) {
    var s = c.state, p = c.params, n = c.n, out = [];
    var push = function (ps) { if (!ps) return; if (out.length) out.push(' '); out.push.apply(out, ps); };
    if (s.kind === 'start') {
      if (s.change) push(parts('capStartConv', { r: data(p.source), change: changeWords(s.change) }));
      else if (!p.showFlood) push(parts('capStartFull', { r: data(p.source) }));
      else push(parts('capStartCold', { term: term('termMetric') }));
    } else if (s.kind === 'change') {
      push(parts('capChange', { n: n, change: changeWords(s.change), ends: list(s.change.ends) }));
      if (!p.showFlood) push(parts('capChangeHidden', { seq: data(s.lsdb[s.change.ends[0]][s.change.ends[0]]) }));
    } else if (s.kind === 'originate') {
      if (!s.change) push(parts('capOrigCold', { n: n, term: term('termLsa') }));
      else {
        var seq = s.lsdb[s.originated[0]][s.originated[0]];
        push(parts('capOrigChange', { n: n, ends: list(s.originated), seq: data(seq), old: data(seq - 1) }));
      }
    } else if (s.kind === 'flood') {
      var dups = s.inFlight.filter(function (x) { return x.fate === 'dup'; }).length;
      var copies = t.n('copies', s.inFlight.length);
      if (!dups) push(parts('capFloodFirst', { k: s.round, copies: copies, term: term('termFlood') }));
      else push(parts('capFlood', { k: s.round, copies: copies, fresh: data(s.inFlight.length - dups), dups: data(dups) }));
      if (s.inFlight.some(function (x) { return x.fate === 'new' && x.held != null; })) push([t('capFloodNewer')]);
      if (L.complete(s.lsdb, s.lsas)) push(s.change ? parts('capFloodDoneChange', { ends: list(s.change.ends) }) : [t('capFloodDone')]);
    } else if (s.kind === 'spf') {
      var sp = s.spf;
      push(sp.picked === p.source ? parts('capSpfFirst', { n: n, r: data(sp.picked) }) : parts('capPick', { n: n, r: data(sp.picked), d: data(sp.dist[sp.picked]) }));
      sp.relaxed.forEach(function (x) { push(relaxWords(s, x)); });
      if (L.pickOf(sp) == null) push([t('capAllFinal')]);
      else if (!sp.relaxed.length) push([t('capNoNews')]);
    } else {
      push(parts('capTable', { n: n, r: data(p.source) }));
      var vias = {};
      s.table.forEach(function (x) { x.via.forEach(function (v) { vias[v] = true; }); });
      var ecmp = s.table.filter(function (x) { return x.via.length > 1; }).map(function (x) { return x.dest; });
      if (Object.keys(vias).length === 1) push(parts('capTableOne', { h: data(Object.keys(vias)[0]) }));
      if (ecmp.length) push(parts('capTableEcmp', { ds: list(ecmp) }));
      if (s.oldTable) {
        var moved = s.table.filter(function (x) { return !sameRow(x, oldRow(s, x.dest)); }).map(function (x) { return x.dest; });
        push(moved.length ? parts('capTableChanged', { ds: list(moved) }) : [t('capTableSame')]);
      }
    }
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'source', type: 'choice', label: t('pSource'), options: R.map(function (r) { return [r, r]; }) },
      { key: 'costBC', type: 'range', label: t('pCost'), min: 1, max: 10, step: 1, resets: true },
      { key: 'fail', type: 'choice', label: t('pFail'), resets: true,
        options: L.FAILS.map(function (f) { return [f, f === 'none' ? t('failNone') : dash(f)]; }) },
      { key: 'showFlood', type: 'toggle', label: t('pFlood'), hint: t('pFloodHint'), resets: true }
    ],

    presets: [
      { id: 'spf-from-a', label: t('prA'), hint: t('prAHint'), params: { source: 'A', costBC: 1, fail: 'none', showFlood: true } },
      { id: 'cost-change', label: t('prCost'), hint: t('prCostHint'), params: { source: 'A', costBC: 5, fail: 'none', showFlood: true } },
      { id: 'link-fails', label: t('prFail'), hint: t('prFailHint'), params: { source: 'A', costBC: 1, fail: 'C-D', showFlood: true } },
      { id: 'spf-from-e', label: t('prE'), hint: t('prEHint'), params: { source: 'E', costBC: 1, fail: 'none', showFlood: true } }
    ],

    legend: [
      { shape: 'ls-cost', label: t('legCost') },
      { shape: 'ls-lsa', label: t('legLsa') },
      { shape: 'ls-dup', label: t('legDup') },
      { shape: 'ls-tent', label: t('legTent') },
      { shape: 'ls-final', label: t('legFinal') },
      { shape: 'ls-tree', label: t('legTree') },
      { shape: 'ls-ecmp', label: t('legEcmp') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'ls' }, statusEl(c), drawEl(c),
        h('div', { class: 'ls-side' }, spfTable(c), routeTable(c))));
    },

    caption: function (c) { return capFor(c); }
  });
})();
</script>
</body>
</html>
