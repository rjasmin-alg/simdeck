(function () {

  function topRow(c) {

    else if (!s.sites[u.session].up) sessLine = h('div', { class: 'sf-line' }, icon('key', true), h('span', null, t('sessionDead', { site: u.session })));
    else sessLine = h('div', { class: 'sf-line' }, icon('key', false), h('span', null, t('session', { site: u.session })));
    var notes = [];
    if (asked) notes.push(h('div', { class: 'sf-line sf-k' }, t('askedAgain')));
    if (ok && !L.licenceWorks(s, u.addr)) notes.push(h('div', { class: 'sf-line' }, icon('lock', true), h('span', { class: 'sf-bad' }, t('licBlocked'))));
    if (u.lostData && ok) notes.push(h('div', { class: 'sf-line sf-bad' }, t('userDataOld')));
    return h('div', {
      class: 'sf-user' + (moved ? ' sd-changed' : '') + (moved && c.dir === 'forward' ? ' sd-anim-in' : ''),
      dataset: { ok: ok ? '1' : '0', site: u.addr }, 'aria-label': t('user', { n: u.id })
    },
      h('div', { class: 'sf-uhead' }, h('span', { class: 'sf-badge', dataset: { c: String(USER_C[i]) }, title: t('user', { n: u.id }) }, String(u.id)),
        h('span', { class: 'sf-left', translate: 'no' }, 'TTL ' + left + ' s')),
      h('div', { class: 'sf-pill' + (pu && pu.addr !== u.addr ? ' sd-hl' : ''), dataset: { site: u.addr }, translate: 'no' }, L.ADDR[u.addr]),
      reach, sessLine, notes);
  }

  function siteCard(c, site) {
    var s = c.state, p = c.params, st = s.sites[site], prev = c.prev;
    var changed = prev && (prev.sites[site].up !== st.up || prev.sites[site].data !== st.data || prev.sites[site].readOnly !== st.readOnly);
    var dataText = { current: t('dataCurrent'), replica: t('dataReplica', { lag: dur(s.replicaLagS) }), old: t('dataOld'), none: t('dataNone') }[st.data];
    var licText, licOk = L.licenceWorks(s, site);
    if (!st.up) licText = h('span', { class: 'sf-bad' }, t('licDown'));
    else if (s.licence.movable) licText = h('span', null, t('licFree') + ': ', h('span', { class: 'sf-good' }, t('licWorks')));
    else if (licOk) licText = h('span', null, t('licBound') + ': ', h('span', { class: 'sf-good' }, t('licWorks')));
    else licText = h('span', null, t('licBound') + ': ', h('span', { class: 'sf-bad' }, t('licNoStart')));
    return h('div', { class: 'sf-site' + (changed ? ' sd-changed' : ''), dataset: { up: st.up ? '1' : '0' } },
      h('div', { class: 'sf-shead' },
        h('b', null, siteName(site)),
        h('span', { class: 'sf-k' }, t(site === 'A' ? 'rolePrimary' : 'roleStandby')),
        h('span', { class: 'sf-mono', translate: 'no' }, L.ADDR[site]),
        h('span', { class: 'sf-status ' + (st.up ? 'sf-good' : 'sf-bad') }, (st.up ? '✓ ' : '✗ ') + t(st.up ? 'up' : 'down'))),
      h('dl', { class: 'sf-parts' },
        h('dt', null, t('partApp')), h('dd', null, h('span', { class: st.up ? '' : 'sf-bad' }, t(st.up ? 'appRuns' : 'appDown'))),
        h('dt', null, icon('key', false), t('partSessions')), h('dd', { translate: 'no' }, String(sessionsAt(s, site))),
        h('dt', null, t('partData')), h('dd', null, dataText, st.readOnly ? h('span', { class: 'sf-ro' }, t('readOnly')) : null),
        h('dt', null, icon('lock', st.up && !licOk), t('partLicence')), h('dd', null, licText)));
  }

  function linkBetween(c) {
    var s = c.state, prev = c.prev, kids = [];
    if (s.scenario === 'failback') {
      var copied = s.event.code !== 'start' && s.event.code !== 'return' && c.params.copyBack;
      var skipped = s.event.code !== 'start' && s.event.code !== 'return' && !c.params.copyBack;
      kids.push(arrowSvg(!copied, true));
      kids.push(h('span', { class: copied ? '' : skipped ? 'sf-bad' : 'sf-k' }, copied ? t('copyBA') : skipped ? t('copySkipped') : t('replStopped')));
    } else {
      var live = s.sites.A.up;
      kids.push(arrowSvg(!live, false));
      kids.push(h('span', { class: live ? '' : 'sf-k' }, live ? t('replAB', { lag: dur(s.replicaLagS) }) : t('replStopped')));
      if (s.lostWritesS > 0) kids.push(h('span', { class: 'sf-bad' + (prev && !prev.lostWritesS ? ' sd-hl' : '') }, t('lostWrites', { lag: dur(s.lostWritesS) })));
    }
    return h('div', { class: 'sf-link' }, kids);
  }

  function timeline(c) {
    var s = c.state, p = c.params, end = s.end;
    function pct(x) { return (100 * Math.max(0, Math.min(end, x)) / end) + '%'; }
    var bar = h('div', { class: 'sf-bar', role: 'img', 'aria-label': t('timeline') });
    s.phases.forEach(function (ph) {
      if (ph.to <= ph.from) return;
      bar.append(h('div', { class: 'sf-seg', dataset: { p: ph.id, past: s.t > ph.from || (s.t === ph.from && s.event.code !== 'start' && ph.from > 0) ? '1' : '0' },
        style: { left: pct(ph.from), width: 'calc(' + pct(ph.to) + ' - ' + pct(ph.from) + ')' } }));
    });
    if (s.record.changedAt !== null) bar.append(h('div', { class: 'sf-chg', style: { left: pct(s.record.changedAt) }, title: t('changeMark') }));
    bar.append(h('div', { class: 'sf-now', style: { left: pct(s.t) } }));
    // users who moved so far, grouped by second, on two rows so neighbours do not overlap
    var groups = {};
    s.users.forEach(function (u) { if (u.movedAt !== null) (groups[u.movedAt] = groups[u.movedAt] || []).push(u.id); });
    var times = Object.keys(groups).map(Number).sort(function (a, b) { return a - b; });
    // place each label on the lowest of four rows where it does not touch the previous one (widths estimated in rem)
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var barW = Math.max(1, c.stage.clientWidth - 3 * rem);
    var rowEnd = [-Infinity, -Infinity, -Infinity, -Infinity], used = 1;
    var ticks = h('div', { class: 'sf-ticks' }, times.map(function (tm) {
      var fresh = groups[tm].some(function (id) { return s.switched.indexOf(id) >= 0; });
      var edge = tm / end > 0.92 ? 'end' : tm / end < 0.08 ? 'start' : 'mid';   // keep the label inside the bar
      var label = '→' + groups[tm].join(',');
      var w = (label.length * 0.62 + 1.2) * rem, x = barW * tm / end;
      var from = edge === 'end' ? x - w : edge === 'start' ? x : x - w / 2;
      var row = 0;
      while (row < 3 && rowEnd[row] > from - 0.3 * rem) row++;
      if (rowEnd[row] > from - 0.3 * rem) row = rowEnd.indexOf(Math.min.apply(null, rowEnd));
      rowEnd[row] = from + w;
      used = Math.max(used, row + 1);
      return h('span', { class: 'sf-tick' + (fresh ? ' sd-changed' : ''), dataset: { row: String(row), edge: edge }, style: { left: pct(tm) },
        'aria-label': t('moveMark', { n: groups[tm].join(', '), t: when(p, tm) }) }, label);
    }));
    ticks.style.height = (used * 1.5 + 0.2) + 'rem';
    var names = { detect: 'phDetect', decide: 'phDecide', caches: 'phCaches', copy: 'phCopy', nocopy: 'phNoCopy' };
    var phl = h('div', { class: 'sf-phl' }, s.phases.filter(function (ph) { return ph.to > ph.from; }).map(function (ph) {
      return h('span', null, h('span', { class: 'sf-sw', dataset: { p: ph.id }, 'aria-hidden': 'true' }), t(names[ph.id]) + ' ' + dur(ph.to - ph.from));
    }), h('span', null, h('b', null, t('worstCase', { t: when(p, end) }))));
    return h('div', { class: 'sf-time' }, ticks, bar,
      h('div', { class: 'sf-axis', translate: 'no' }, h('span', null, when(p, 0)), h('span', null, when(p, end))), phl);
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, p = c.params, ev = s.event, b = function (x) { return h('b', null, x); };
    var T = b(when(p, s.t));
    var out;
    switch (ev.code) {
      case 'start':
        return s.scenario === 'failback' ? t.parts('capStartBack', {}) : t.parts('capStart', { ttl: b(dur(p.ttl)) });
      case 'fail':
        return t.parts('capFail', { t: T });
      case 'check':
        out = t.parts(ev.k === p.threshold ? 'capCheckLast' : 'capCheck', { k: ev.k, thr: p.threshold, t: T });
        break;
      case 'change':
        if (s.scenario === 'failback') return t.parts(p.copyBack ? 'capChangeBack' : 'capChangeBackNoCopy', { t: T });
        var ls = L.longestStale(s);
        if (!ls) return t.parts('capFail', { t: T });   // cannot happen: at the change every cache still holds A
        out = t.parts(p.auto ? 'capChange' : 'capChangeManual', { t: T, id: b(String(ls.id)), left: h('span', { class: 'sd-hl' }, dur(ls.left)), decide: dur(s.tc) });
        if (s.renewed.length) out.push(' ', t.n('capRenewedBefore', s.renewed.length, { ids: idList(s.renewed) }));
        return out;
      case 'return':
        return t.parts(p.copyBack ? 'capReturnCopy' : 'capReturn', { t: T });
      case 'copy':
        return p.copyBack ? t.parts('capCopy', { t: T }) : t.parts('capCopySkipped', {});
      case 'window':
        var target = s.record.addr, old = target === 'A' ? 'B' : 'A';
        out = s.switched.length
          ? t.parts('capWindow', { n: s.switched.length, t: T, ids: b(idList(s.switched)), site: target, old: old })
          : t.parts('capWindowEmpty', { t: T });
        var waiting = s.users.filter(function (u) { return u.addr !== target; }).length;
        if (waiting) out.push(' ', t.n('capWaiting', waiting, { site: old }));
        if (s.scenario === 'failover' && s.switched.length && !L.licenceWorks(s, 'B')) out.push(' ', t('capLicence'));
        return out;
      case 'summary':
        var st = L.stats(s);
        if (s.scenario === 'failback') {
          return t.parts(p.copyBack ? 'capSummaryBack' : 'capSummaryBackNoCopy', { last: b(dur(st.last)), worst: dur(st.worst) });
        }
        out = t.parts('capSummary', { last: b(dur(st.last)), worst: dur(st.worst), lag: dur(s.lostWritesS) });
        if (!L.licenceWorks(s, 'B')) out.push(' ', t('capSummaryLic', { days: L.REHOST_DAYS }));
        return out;
    }
    if (s.renewed.length) out.push(' ', t.n('capRenewed', s.renewed.length, { ids: idList(s.renewed) }));
    return out;
  }

  var failover = function (p) { return p.scenario !== 'failback'; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'ttl', type: 'choice', label: t('ttl'), options: [[60, t('secs', { n: 60 })], [300, t('secs', { n: 300 })], [3600, t('secs', { n: 3600 })]] },
      { key: 'checkInterval', type: 'choice', label: t('checkInterval'), visible: failover, options: [[10, t('secs', { n: 10 })], [30, t('secs', { n: 30 })]] },
      { key: 'threshold', type: 'choice', label: t('threshold'), visible: failover, options: [[1, '1'], [3, '3']] },
      { key: 'auto', type: 'toggle', label: t('auto'), visible: failover },
      { key: 'decideMin', type: 'range', label: t('decideMin'), min: 5, max: 120, step: 5, format: function (v) { return t('mins', { n: v }); },
        visible: function (p) { return failover(p) && !p.auto; } },
      { key: 'licenceBound', type: 'toggle', label: t('licenceBound') },
      { key: 'copyBack', type: 'toggle', label: t('copyBack'), visible: function (p) { return !failover(p); } }
    ],

    presets: [
      { id: 'auto-failover', label: t('presetAuto'), hint: t('presetAutoHint'), params: { scenario: 'failover' } },
      { id: 'manual-dns', label: t('presetManual'), hint: t('presetManualHint'), params: { scenario: 'failover', auto: false, clockMin: 845 } },
      { id: 'long-ttl', label: t('presetLong'), hint: t('presetLongHint'), params: { scenario: 'failover', ttl: 3600 } },
      { id: 'licence-stays', label: t('presetLicence'), hint: t('presetLicenceHint'), params: { scenario: 'failover', clockMin: 845, ttl: 60, threshold: 1 } },
      { id: 'failback', label: t('presetBack'), hint: t('presetBackHint'), params: { scenario: 'failback' } }
    ],

    legend: [
      { shape: 'sf-up', label: t('legendUp') },
      { shape: 'sf-down', label: t('legendDown') },
      { shape: 'sf-pill', label: t('legendCache') },
      { shape: 'sf-key', label: t('legendKey') },
      { shape: 'sf-lock', label: t('legendLock') },
      { shape: 'sf-repl', label: t('legendRepl') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'sf', dataset: { scn: s.scenario } },
        topRow(c),
        h('div', { class: 'sf-users' }, s.users.map(function (u, i) { return userCard(c, u, i); })),
        h('div', { class: 'sf-sites' }, siteCard(c, 'A'), linkBetween(c), siteCard(c, 'B')),
        timeline(c)));
    },

    caption: caption
  });

  // the legend's icon swatches (the kit draws empty swatches with data-shape; the page fills them)
  var fill = { 'sf-key': function () { return icon('key', true); }, 'sf-lock': function () { return icon('lock', false); }, 'sf-repl': function () { return arrowSvg(false, false); } };
  document.querySelectorAll('[data-sd-legend] .sd-swatch').forEach(function (sw) {
    var f = fill[sw.dataset.shape];
    if (f) sw.replaceChildren(f());
  });
})();
</script>
</body>
</html>
