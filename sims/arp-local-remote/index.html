     AND destination, decide the next hop, look it up in the ARP table, ARP request (broadcast), everyone hears,

     SPEC.md; words: strings.js. -->

<style>

  grid-template-rows: auto minmax(0, 1fr);

  height: 100%;
  padding: 2.5cqh 1.5cqw;

}
[data-sim="arp-local-remote"] .ar-top { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 1.5cqw; align-items: stretch; }
[data-sim="arp-local-remote"] .ar-box {
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius);

  padding: 0.5rem 0.8rem 0.6rem;
  font-size: 1em;
}
[data-sim="arp-local-remote"] .ar-box h2 { margin: 0 0 0.35rem; font-size: 1em; font-weight: 700; }

/* decision box */
[data-sim="arp-local-remote"] .ar-dec table { border-collapse: collapse; width: 100%; }
[data-sim="arp-local-remote"] .ar-dec td { padding: 0.08rem 0.4rem 0.08rem 0; white-space: nowrap; vertical-align: baseline; }

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Lokalno ili udaljeno, pa ARP</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { A: '1', B: '2', C: '3', R: '4' };
  var COL = { A: 0, B: 1, C: 2, R: 3, cloud: 4 };

  /** Data (addresses, MACs, host letters) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'sd-mono' : cls || null }, text); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      // a placeholder used twice is the same node: clone it, or appending moves it
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function list(ids) {
    var items = ids.slice();
    if (items.length === 1) return items[0];
    var last = items.pop();
    var head = items.reduce(function (acc, it) { return acc === null ? it : t('listMore', { a: acc, b: it }); }, null);
    return t('list2', { a: head, b: last });
  }
  function bitsSpan(ip, diff) {
    var b = L.bits(ip), kids = [];
    b.forEach(function (bit, i) {
      if (i && i % 8 === 0) kids.push(h('span', { class: 'ar-dot' }, '.'));
      kids.push(diff && diff[i] ? h('span', { class: 'ar-diff' }, String(bit)) : String(bit));
    });
    return h('span', { class: 'ar-bits', translate: 'no' }, kids);
  }

  function renderDecision(c, net, a) {
    var s = c.state, fwd = c.dir === 'forward';
    var maskIp = L.maskIp(s.mask);
    var diff = null;
    if (s.decision) {
      var x1 = L.bits(s.netSrc), x2 = L.bits(s.netDst);
      diff = x1.map(function (v, i) { return v !== x2[i]; });
    }
    function row(label, ip, opts) {
      opts = opts || {};
      var cls = (opts.res ? 'ar-res' : '') + (opts.changed ? ' sd-changed' : '') + (opts.changed && fwd ? ' sd-anim-in' : '');
      return h('tr', { class: cls.trim() || null },
        h('td', null, label),
        h('td', { class: opts.later ? 'ar-later' : null }, ip ? bitsSpan(ip, opts.diff) : ''),
        h('td', { class: 'ar-dd' + (opts.later ? ' ar-later' : ''), translate: 'no' }, ip || t('pending')));
    }
    var nowPhase = s.phase;
    var table = h('table', null,
      row(data('A', ''), a.ip),
      row(t('rowMask', { p: s.mask }), maskIp),
      row(t('rowDst'), s.dstIp),
      row(t('rowNetOwn'), s.netSrc || '0.0.0.0', { res: true, later: !s.netSrc, changed: nowPhase === 'andSrc', diff: diff }),
      row(t('rowNetDst'), s.netDst || '0.0.0.0', { res: true, later: !s.netDst, changed: nowPhase === 'andDst', diff: diff }));
    var verdict = h('div', { class: 'ar-verdict' + (nowPhase === 'decide' ? ' sd-changed' : '') + (nowPhase === 'decide' && fwd ? ' sd-anim-in' : '') });
    if (s.decision) {
      verdict.append(
        h('span', null, s.decision === 'local' ? t('equal') + ' →' : t('differ') + ' →'),
        h('span', { class: 'ar-tag', dataset: { v: s.decision } }, s.decision === 'local' ? t('verdictLocal') : t('verdictRemote')),
        h('span', null, t.parts('nextHop', { ip: data(s.nextHop) })));
    }
    return h('section', { class: 'ar-box ar-dec' }, h('h2', null, t('decTitle')), table, verdict);
  }

  function renderFrame(c) {
    var s = c.state, f = s.frame;
    var box = h('section', { class: 'ar-box ar-frame' }, h('h2', null, t('frameTitle')));
    if (!f) { box.append(h('p', { class: 'ar-none' }, t('frameNone'))); return box; }
    var bc = f.kind === 'arp-req';
    var inner = f.kind === 'ip'
      ? { title: t('ipPacket'), c: COLOUR.A, fields: [[t('srcIp'), f.srcIp], [t('dstIp'), f.dstIp]] }
      : { title: bc ? t('arpReq') : t('arpRep'), c: COLOUR[f.from],
        body: h('span', { class: 'ar-say' }, bc
          ? t.parts('whoHas', { ip: data(f.targetIp, ''), asker: data(f.srcIp, '') })
          : t.parts('isAt', { ip: data(f.srcIp, ''), mac: data(f.srcMac, '') })) };
    box.append(Simdeck.topology.headers([
      { dashed: bc, fields: [
        [t('dstMac'), [data(f.dstMac, ''), bc ? h('span', null, ' (' + t('broadcastAll') + ')') : null], { changed: f.kind === 'ip' }],
        [t('srcMac'), f.srcMac]] },
      inner
    ], c.dir === 'forward' && s.phase !== 'arpHear' ? 'forward' : null));
    return box;
  }

  /** Badges under a station: what it does in this step. Kit badge styles: fill (sends), dashed (hears), muted (dest). */
  var BADGE = { sends: 'fill', hears: 'dashed', answers: 'solid', receives: 'solid', dest: 'muted' };
  function badgesFor(id, s) {
    var out = [], f = s.frame;
    if (s.phase === 'arpReq' && id === 'A') out.push('sends');
    if (s.phase === 'arpHear' && s.heardBy.indexOf(id) >= 0) out.push(id === s.answeredBy ? 'answers' : 'hears');
    if (s.phase === 'arpRep' && f) { if (id === f.from) out.push('sends'); if (id === 'A') out.push('receives'); }
    if (s.phase === 'send' && f) { if (id === 'A') out.push('sends'); if (id === s.deliveredTo) out.push('receives'); }
    return out;
  }

  /** The ARP table under a station; A's shows the lookup of this step under it. */
  function arpTable(c, net, st) {
    var s = c.state;
    var lookup = st.id === 'A' && s.phase === 'lookup';
    return Simdeck.topology.table({
      title: t('arpTable'),
      empty: t('empty'),
      rows: (s.arp[st.id] || []).map(function (e) {
        var owner = L.stationByIp(net, e.ip);
        return { cells: [e.ip, e.mac], c: owner ? COLOUR[owner.id] : null,
          note: e.state === 'new' ? t('entryNew') : e.state === 'refreshed' ? t('entryRefreshed') : null,
          mark: e.state === 'new' || e.state === 'refreshed' ? e.state : lookup && s.hit && e.ip === s.nextHop ? 'hit' : null };
      }),
      foot: lookup ? h('div', { class: 'ar-look sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { hit: String(!!s.hit) } },
        s.hit ? t('lookupHit') : t.parts('lookupMiss', { ip: data(s.nextHop, '') })) : null
    }, c.dir);
  }

  /** Kit view K2: A, B, C and R on the bus (row 0 cards, row 1 the lane, row 2 the ARP tables), R linked to the cloud. */
  function renderTopo(c, net) {
    var s = c.state;
    var dstOwner = s.decision ? L.stationByIp(net, s.dstIp) : null;
    var nodes = net.stations.map(function (st) {
      var badges = badgesFor(st.id, s);
      if (dstOwner && dstOwner.id === st.id && badges.indexOf('receives') < 0) badges.unshift('dest');
      return {
        id: st.id, kind: st.id === 'R' ? 'router' : 'host', col: COL[st.id], row: 0, c: COLOUR[st.id],
        lines: [{ text: st.ip, kind: 'addr' }, { text: st.mac, kind: 'sub' }, st.id === 'R' ? { text: t('gateway'), kind: 'role' } : null],
        badges: badges.map(function (b) { return { text: t(b === 'dest' ? 'rowDst' : b), k: BADGE[b], anim: b !== 'dest' }; }),
        state: badges.some(function (b) { return b !== 'dest' && b !== 'hears'; }) ? 'active' : null,
        table: arpTable(c, net, st), tableRow: 2
      };
    });
    var remote = s.decision === 'remote' && !L.stationByIp(net, s.dstIp);
    nodes.push({ id: 'cloud', kind: 'cloud', col: COL.cloud, row: 0, name: t('cloud'), changed: remote && s.phase === 'decide',
      lines: [{ text: t('cloudSub'), kind: 'role' }, remote ? { text: s.dstIp, kind: 'addr' } : null, remote ? { text: t('rowDst'), kind: 'role' } : null] });

    // the frame of this step over the bus: dashed to every listener (broadcast) or solid to one; the chip moves on a
    // forward step, and step 6 (everyone hears) keeps the request's arrows without a chip
    var packets = [], f = s.frame;
    if (f && (s.phase === 'arpReq' || s.phase === 'arpHear' || s.phase === 'arpRep' || s.phase === 'send')) {
      var bc = f.kind === 'arp-req';
      packets.push({
        from: f.from,
        to: bc ? net.stations.filter(function (st) { return st.id !== f.from; }).map(function (st) { return st.id; }) : f.to,
        label: bc ? t('laneReq') : f.kind === 'arp-rep' ? t('laneRep') : t('lanePing'),
        c: COLOUR[f.from], cast: bc ? 'broadcast' : 'unicast', chip: s.phase !== 'arpHear'
      });
    }
    return Simdeck.topology({
      cols: 5, rows: ['auto', '4.2rem', 'auto'], dir: c.dir,
      nodes: nodes,
      links: [{ id: 'lan', bus: ['A', 'B', 'C', 'R'], row: 1 }, { id: 'wan', a: 'R', b: 'cloud' }],
      packets: packets
    });
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'net', type: 'choice', label: t('net'), options: [['lan', t('netLan')], ['lan28', t('netLan28')]], resets: true },
      { key: 'dst', type: 'select', label: t('dst'), visible: function (p) { return p.net === 'lan'; },
        options: [['192.168.1.20', t('dstB', { ip: '192.168.1.20' })], ['192.168.1.30', t('dstC', { ip: '192.168.1.30' })],
          ['192.168.2.50', t('dstNear', { ip: '192.168.2.50' })], ['8.8.8.8', t('dstFar', { ip: '8.8.8.8' })],
          ['192.168.1.1', t('dstGw', { ip: '192.168.1.1' })]] },
      { key: 'mask', type: 'choice', label: t('mask'), hint: t('maskHint'), options: [[24, '/24'], [25, '/25'], [28, '/28']],
        disabled: function (p) { return p.net === 'lan28' ? t('maskFixed') : false; } },
      { key: 'cache', type: 'toggle', label: t('cache'), hint: t('cacheHint') }
    ],

    presets: [
      { id: 'local', label: t('presetLocal'), params: { dst: '192.168.1.20' } },
      { id: 'remote', label: t('presetRemote'), params: { dst: '8.8.8.8' } },
      { id: 'looks-close', label: t('presetLooksClose'), params: { dst: '192.168.2.50' }, hint: t('presetLooksCloseHint') },
      { id: 'cache-hit', label: t('presetCacheHit'), params: { dst: '8.8.8.8', cache: true } },
      { id: 'mask-28', label: t('presetMask28'), params: { net: 'lan28' } }
    ],

    legend: [
      { shape: 'dash', label: t('legBroadcast') },
      { shape: 'line', label: t('legUnicast') },
      { shape: 'row', label: t('legEntry') },
      { shape: 'tick', label: t('legDecision') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var net = L.netOf(c.params);
      var a = net.stations[0];
      c.stage.replaceChildren(h('div', { class: 'ar' },
        h('div', { class: 'ar-top' }, renderDecision(c, net, a), renderFrame(c)),
        renderTopo(c, net)));
    },

    caption: function (c) {
      var s = c.state, p = c.params, net = L.netOf(p), a = net.stations[0];
      var out = [];
      if (s.packets > 1) out.push(t('packetOf', { k: s.pkt + 1, n: s.packets }));
      var owner = s.nextHop ? L.stationByIp(net, s.nextHop) : null;
      var D = function (v) { return data(v); };
      switch (s.phase) {
        case 'start': out = out.concat(rich('capStart', { src: D(a.ip), dst: D(s.dstIp) })); break;
        case 'andSrc': out = out.concat(rich('capAndSrc', { ip: D(a.ip), mask: D(L.maskIp(s.mask)), net: h('b', null, data(s.netSrc)) })); break;
        case 'andDst': out = out.concat(rich('capAndDst', { ip: D(s.dstIp), mask: D(L.maskIp(s.mask)), net: h('b', null, data(s.netDst)) })); break;
        case 'decide':
          out = out.concat(rich(s.decision === 'local' ? 'capLocal' : 'capRemote',
            { ns: D(s.netSrc), nd: D(s.netDst), hop: h('b', null, data(s.nextHop)) }));
          break;
        case 'lookup': out = out.concat(rich(s.hit ? 'capHit' : 'capMiss', { hop: D(s.nextHop), mac: D(owner.mac) })); break;
        case 'arpReq': out = out.concat(rich('capReq', { hop: h('b', null, data(s.nextHop)), a: D(a.ip) })); break;
        case 'arpHear':
          out = out.concat(rich('capHear', { all: data(list(s.heardBy), ''), owner: data(s.answeredBy, ''), hop: D(s.nextHop) }));
          var refreshed = Object.keys(s.arp).filter(function (id) { return id !== s.answeredBy && s.arp[id].some(function (e) { return e.state === 'refreshed'; }); });
          if (refreshed.length) out = out.concat(rich('capRefreshed', { who: data(list(refreshed), '') }));
          break;
        case 'arpRep': out = out.concat(rich('capRep', { owner: data(owner.id, ''), hop: D(s.nextHop), mac: h('b', null, data(owner.mac)) })); break;
        case 'send':
          out = out.concat(rich(s.decision === 'local' ? 'capSendLocal' : 'capSendRemote',
            { mac: h('b', null, data(s.frame.dstMac)), owner: data(owner.id, ''), dst: h('b', null, data(s.dstIp)) }));
          if (!s.done) out = out.concat(rich('capNext', { k: s.pkt + 2, dst: D(L.packetsOf(p)[s.pkt + 1]) }));
          break;
      }
      return out;
    }
  });
})();
</script>
</body>
</html>
