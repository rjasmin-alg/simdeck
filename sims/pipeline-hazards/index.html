<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var STAGES = L.STAGES;
  var SW = { IF: 'var(--c1)', ID: 'var(--c2)', EX: 'var(--c3)', MEM: 'var(--c4)', WB: 'var(--c5)' };

  function isInstr(v) { return typeof v === 'number'; }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function bare(q) { return q.label ? q.text.replace(/^\s*\w+:\s*/, '') : q.text; }
  function op(s, i) { return code(s.instrs[i].op); }
  function reg(r) { return code('x' + r); }
  function path(p) { return h('span', { class: 'ph-mono', translate: 'no' }, p); }
  function dec(x) { var v = (Math.round(x * 100) / 100).toString(); return Simdeck.lang === 'hr' ? v.replace('.', ',') : v; }

  // the end state of this program and setting: how many instructions complete
  function finalOf(p) {
    var s = L.initial(p), n = 0;
    while (!s.finished && n < 200) { n++; s = L.step(s, n, p); }
    return s;
  }

  // ── the five stage boxes ──
  function box(c, st) {
    var s = c.state, v = s.inStage[st], ev = s.last;
    var kids = [], note = null, cls = 'ph-box', sw = SW[st];
    if (isInstr(v)) {
      var q = s.instrs[v];
      kids.push(code(bare(q)));
      if (q.flushed === s.cycle) { cls += ' ph-box--flush'; note = t('flushedNow'); }
      else if (ev && ev.stall && st === 'ID' && ev.stall.consumer === v) note = t('held', { reg: 'x' + ev.stall.reg });
      else if (ev && ev.stall && st === 'IF') note = t('heldIF');
    } else if (v === 'bubble' || v === 'flushed') {
      cls += ' ph-box--slot';
      kids.push(h('span', { class: 'ph-bubble', 'aria-hidden': 'true' }, v === 'bubble' ? '—' : '×'), ' ',
        h('span', null, t(v === 'bubble' ? 'slotBubble' : 'slotFlushed')));
    } else {
      cls += ' ph-box--slot';
      kids.push(h('span', { class: 'ph-empty' }, t('slotEmpty')));
    }
    // changed: the bubble a stall puts into EX, and the slots a flush left in the cycle after it
    var flushedJustNow = v === 'flushed' && s.instrs.some(function (q) { return q.flushed === s.cycle - 1; });
    var changed = (ev && st === 'EX' && ev.stall) || flushedJustNow;
    return h('div', { class: cls + (changed ? ' sd-changed' : ''), style: { '--sw': sw, gridColumn: String(STAGES.indexOf(st) + 1) } },
      h('div', { class: 'ph-box-head' }, h('b', { translate: 'no' }, st), h('span', { class: 'ph-box-sub' }, t('st' + st))),
      h('div', { class: 'ph-box-body' }, kids),
      h('div', { class: 'ph-box-note' }, note));
  }

  // a lane: from the centre of column `from` back to the centre of column `to`
  // (offl / offr: where the line ends, in % of the spanned columns; reach: how far up it extends over other lanes)
  function arrow(from, to, row, label, used, up, offl, reach) {
    var span = from - to + 1;
    var centre = 50 / span;
    return h('div', { class: 'ph-arrow ph-arrow--' + (used ? 'used' : 'idle') + (up ? ' ph-arrow--up' : ''),
      style: { gridColumn: to + ' / span ' + span, gridRow: String(row), '--offl': (offl == null ? centre : offl) + '%', '--offr': centre + '%', '--reach': reach || '0rem' } },
      h('div', { class: 'ph-arrow-line' }),
      h('span', { class: 'ph-arrow-label' }, label));
  }

  function pipe(c) {
    var s = c.state, ev = s.last, p = c.params;
    var kids = STAGES.map(function (st) { return box(c, st); });
    var fw = ev ? ev.forwards : [];
    var rp = ev ? ev.regPasses : [];
    if (rp.length) {
      kids.push(arrow(5, 2, 1, [t('regPass'), ' · ', h('span', { translate: 'no' }, rp.map(function (r) { return 'x' + r.reg; }).join(', '))], true, true));
    }
    if (p.forwarding) {
      // EX/MEM enters EX right of its centre, MEM/WB left of it, so the two lines do not overlap
      [['EX/MEM', 4, 3, 30, null], ['MEM/WB', 5, 4, 12, '2.1rem']].forEach(function (d) {
        var used = fw.filter(function (f) { return f.from === d[0]; });
        var regs = used.map(function (f) { return 'x' + f.reg; }).join(', ');
        var label = [path(d[0] + ' → EX'), ' · ', used.length ? h('span', { translate: 'no' }, regs) : t('fwdIdle')];
        kids.push(arrow(d[1], 3, d[2], label, used.length > 0, false, d[3], d[4]));
      });
    } else {
      kids.push(h('div', { class: 'ph-lane-off' }, t('fwdOff')));
    }
    return h('div', { class: 'ph-pipe' }, kids);
  }

  function counts(c, fin) {
    var s = c.state;
    var rows = [
      [t('cntCycle'), t('cntOf', { k: s.cycle, n: c.steps })],
      [t('cntDone'), t('cntOf', { k: s.completed, n: fin.completed })],
      [t('cntStalls'), String(s.stalls)],
      [t('cntFlushed'), String(s.flushes)]
    ];
    if (c.last) rows.push([t('cntCpi'), dec(s.cycle / s.completed)]);
    var kids = [];
    rows.forEach(function (r) { kids.push(h('dt', null, r[0]), h('dd', { translate: 'no' }, r[1])); });
    return h('dl', { class: 'ph-counts' }, kids);
  }

  // ── the pipeline diagram ──
  function diagram(c, fin) {
    var s = c.state, N = c.steps, ev = s.last;
    var hazard = {};
    if (ev && ev.stall) { hazard[ev.stall.consumer] = 1; hazard[ev.stall.producer] = 1; }
    var labels = [h('span', { class: 'ph-dh' }, h('span', null, t('colInstr')), h('span', null, t('colCycle')))];
    var kids = [];
    for (var k = 1; k <= N; k++) kids.push(h('span', { class: 'ph-ch' + (k === s.cycle ? ' sd-changed' : ''), translate: 'no' }, String(k)));
    s.instrs.forEach(function (q, i) {
      var shown = fin.instrs[i].fetched;
      if (!shown) return;
      var wrong = q.wrongPath;   // marked once the branch has flushed it, not before
      labels.push(h('span', { class: 'ph-rl' + (wrong ? ' ph-rl--wrong' : '') + (hazard[i] ? ' ph-rl--hazard' : '') },
        code(q.text), wrong ? h('span', { class: 'ph-tag' }, t('wrongPath')) : null));
      for (var cy = 1; cy <= N; cy++) {
        var x = cy <= s.cycle ? L.cell(q, cy) : null;
        var now = cy === s.cycle;
        var cls = 'ph-c' + (now ? ' ph-c--now' : '');
        if (x === 'stall') {
          kids.push(h('span', { class: cls + ' ph-c--stall' + (now ? ' sd-changed' : ''), 'aria-label': t('cellStall') },
            h('span', { class: 'ph-bubble', translate: 'no' }, '—')));
        } else if (x === 'flush') {
          kids.push(h('span', { class: cls + ' ph-c--flush' + (now ? ' sd-changed' : ''), 'aria-label': t('cellFlush') },
            h('span', { translate: 'no' }, '×')));
        } else if (x) {
          kids.push(h('span', { class: cls + ' ph-c--st' + (now && c.dir === 'forward' ? ' sd-anim-in' : ''), style: { '--sw': SW[x] }, translate: 'no' }, x));
        } else {
          kids.push(h('span', { class: cls }));
        }
      }
    });
    return h('div', { class: 'ph-diag' }, h('div', { class: 'ph-labels' }, labels),
      h('div', { class: 'ph-diagwrap' }, h('div', { class: 'ph-cells', style: { '--cols': String(N) } }, kids)));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'program', type: 'choice', label: t('program'), hint: t('programHint'), resets: true,
        options: [['independent', t('progIndependent')], ['raw', t('progRaw')], ['load-use', t('progLoadUse')], ['mixed', t('progMixed')]] },
      { key: 'forwarding', type: 'toggle', label: t('forwarding'), hint: t('forwardingHint') }
    ],

    presets: [
      { id: 'independent', label: t('prIndependent'), hint: t('prIndependentHint'), params: { program: 'independent', forwarding: true } },
      { id: 'raw-no-fwd', label: t('prRawNoFwd'), hint: t('prRawNoFwdHint'), params: { program: 'raw', forwarding: false } },
      { id: 'raw-fwd', label: t('prRawFwd'), hint: t('prRawFwdHint'), params: { program: 'raw', forwarding: true } },
      { id: 'load-use', label: t('prLoadUse'), hint: t('prLoadUseHint'), params: { program: 'load-use', forwarding: true } },
      { id: 'mixed', label: t('prMixed'), hint: t('prMixedHint'), params: { program: 'mixed', forwarding: true } }
    ],

    legend: [
      { c: 3, label: t('legStage') },
      { shape: 'hollow', label: t('legBubble') },
      { shape: 'bg-dead', label: t('legFlush') },
      { shape: 'dash', label: t('legFwd') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var fin = finalOf(c.params);
      c.stage.replaceChildren(h('div', { class: 'ph' },
        h('div', { class: 'ph-top' }, pipe(c), counts(c, fin)),
        diagram(c, fin)));
      // on a phone the diagram scrolls sideways inside itself: keep the current cycle's column in view
      var wrap = c.stage.querySelector('.ph-diagwrap'), col = c.stage.querySelector('.ph-ch.sd-changed');
      if (wrap && col && wrap.scrollWidth > wrap.clientWidth) wrap.scrollLeft = Math.max(0, col.offsetLeft + col.offsetWidth / 2 - wrap.clientWidth / 2);
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      if (c.first) {
        var fin = finalOf(p);
        var n = fin.instrs.filter(function (q) { return q.fetched; }).length;
        return t('capStart', { n: t.n('instrN', n), fwd: t(p.forwarding ? 'fwdOn' : 'fwdOffWord') });
      }
      var ev = s.last, out = [h('b', null, t('capCycle', { n: s.cycle }))];
      var said = 0;
      function say(parts) { out.push(' '); out.push(h('span', null, parts)); said++; }
      if (ev.stall) {
        var st = ev.stall;
        if (st.cause === 'load-use') {
          say(t.parts('capLoadUse', { c: op(s, st.consumer), c2: op(s, st.consumer), reg: reg(st.reg), p: op(s, st.producer) }));
        } else {
          var when = s.inStage.WB === st.producer ? t('wbNow') : t('wbAt', { n: s.cycle + 1 });
          say(t.parts('capNoFwd', { c: op(s, st.consumer), reg: reg(st.reg), p: op(s, st.producer), when: when }));
        }
        if (isInstr(s.inStage.IF)) say(t('capIFHeld'));
      }
      // the forward into EX first: the branch is resolved with the value it brings
      ev.forwards.forEach(function (f) {
        say(t.parts('capFwd', { c: op(s, f.consumer), reg: reg(f.reg), p: op(s, f.producer), path: path(f.from + ' → EX') }));
      });
      if (ev.flush) say(t.parts('capFlush', { b: op(s, ev.flush.branch), target: op(s, ev.flush.target) }));
      if (ev.notTaken != null) say(t.parts('capNotTaken', { b: op(s, ev.notTaken) }));
      ev.regPasses.forEach(function (r) {
        say(t.parts('capRegPass', { p: op(s, r.producer), reg: reg(r.reg), c: op(s, r.consumer) }));
      });
      // a quiet cycle: what the hazard unit sees now (it acts next cycle), else what enters EX
      var seen = said ? null : L.hazard(s, s.inStage, !!p.forwarding);
      if (seen) {
        say(t.parts('capHazardSeen', { c: op(s, s.inStage.ID), c2: op(s, s.inStage.ID), reg: reg(seen.reg), p: op(s, seen.producer) }));
      } else if (!said && isInstr(s.inStage.EX) && ev.fetched == null && ev.completed == null) {
        say(t.parts('capEnters', { c: op(s, s.inStage.EX) }));
      }
      if (!said) {
        if (ev.fetched != null) say(t.parts('capFetch', { i: code(bare(s.instrs[ev.fetched])) }));
        if (ev.completed != null) say(t.parts('capDone', { i: code(bare(s.instrs[ev.completed])) }));
      }
      if (said < 2 && (s.inStage.WB === 'bubble' || s.inStage.WB === 'flushed')) say(t('capNoneDone'));
      if (c.last) {
        out.push(' ', h('span', { class: 'sd-hl' }, t.parts('capEnd', {
          cycles: t.n('cyclesN', s.cycle), n: s.completed, stalls: t.n('stallsN', s.stalls), flushed: t.n('flushedN', s.flushes)
        })));
      }
      return out;
    }
  });
})();
</script>
