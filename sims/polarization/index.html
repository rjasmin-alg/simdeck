<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var PZ = L.PZ;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var D2R = Math.PI / 180;
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function deg(v) {                                  // whole degrees exactly; else one decimal, two where one would read as 0° or 90°
    var d = Math.abs(v - Math.round(v)) < 1e-9 ? 0 : (Math.abs(v - 90) < 0.05 || Math.abs(v) < 0.05) ? 2 : 1;
    return t('deg', { v: num(v, d) });
  }
  function angleTick(b) { return t('degVal', { v: String(b) }); }
  function pct(v) { var q = Math.abs(v * 100); return num(v * 100, q > 0 && q < 9.95 ? 1 : 0) + ' %'; }
  function dB(v) { return v === null ? t('dbNone') : t('dbVal', { v: num(v, Math.abs(v) < 10 ? 2 : 1) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    (function add(list) {
      for (var i = 0; i < list.length; i++) {
        if (Array.isArray(list[i])) add(list[i]);
        else if (list[i] != null) e.append(list[i]);
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function arrowHead(x, y, ux, uy, size, cls) {
    var hw = 0.55 * size;
    return s('polygon', { class: cls, points: pts([
      [x, y], [x - ux * size - uy * hw, y - uy * size + ux * hw], [x - ux * size + uy * hw, y - uy * size - ux * hw]]) });
  }
  function add3(a, b, k) { return [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k]; }

  // ── the oblique view: x right, z up, y (across the path) receding up and to the right ──
  var R = 1, RP = 0.4, HW = 0.17, AMP = 0.24;          // arc radius, pattern radius, half a wire, wave amplitude (world)
  var KY = 0.5, GY = 35 * D2R;                         // cabinet projection of y: half length, 35° up
  function view(W, H) {
    var x0 = -RP - 0.18, x1 = R + 0.66, z0 = -RP - 0.12, z1 = R + 0.36;
    var sc = Math.min(W / (x1 - x0), H / (z1 - z0));
    var ox = (W - (x1 - x0) * sc) / 2 - x0 * sc, oy = H - (H - (z1 - z0) * sc) / 2 + z0 * sc;
    return { sc: sc, P: function (p) { return [ox + sc * (p[0] + KY * p[1] * Math.cos(GY)), oy - sc * (p[2] + KY * p[1] * Math.sin(GY))]; } };
  }

  function wire(svg, P, centre, dir, sending, r0) {
    var a = P(add3(centre, dir, -HW)), b = P(add3(centre, dir, HW)), c = P(centre);
    var g1 = P(add3(centre, dir, -0.025)), g2 = P(add3(centre, dir, 0.025));
    [['pz-wirehalo'], ['pz-wire']].forEach(function (k) {
      svg.append(s('line', { class: k[0], x1: a[0], y1: a[1], x2: g1[0], y2: g1[1] }));
      svg.append(s('line', { class: k[0], x1: g2[0], y1: g2[1], x2: b[0], y2: b[1] }));
    });
    svg.append(s('circle', { class: sending ? 'pz-send' : 'pz-feed', cx: c[0], cy: c[1], r: 0.42 * r0 }));
  }

  function drawPicture(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), v = view(W, H), P = v.P, sc = v.sc;
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var O = [0, 0, 0], rh = L.rhat(st.el), Bpos = [rh[0] * R, 0, rh[2] * R];
    var A = L.dirA(st.a), B = L.dirB(st.b, st.el);

    // the vertical plane x–z through A and B: a light quarter disc, the arc B moves on
    var quarter = [P(O)];
    for (var d = 0; d <= 90; d += 3) quarter.push(P([Math.cos(d * D2R) * R * 1.12, 0, Math.sin(d * D2R) * R * 1.12]));
    svg.append(s('polygon', { class: 'pz-plane', points: pts(quarter) }));
    var arc = [];
    for (d = 0; d <= 90; d += 3) arc.push(P([Math.cos(d * D2R) * R, 0, Math.sin(d * D2R) * R]));
    svg.append(s('polyline', { class: 'pz-arc', points: pts(arc) }));

    // a small triad in the free corner, top left: up (z) and across (y), as in B's view
    var tri = [0.9 * r0, 4.6 * r0], tl = 3.2 * r0;
    [[[0, -tl], t('axisUp')], [[tl * KY * 1.6 * Math.cos(GY), -tl * KY * 1.6 * Math.sin(GY)], t('axisAcross')]].forEach(function (ax) {
      var x2 = tri[0] + ax[0][0], y2 = tri[1] + ax[0][1], n = Math.hypot(ax[0][0], ax[0][1]);
      svg.append(s('line', { class: 'pz-axis', x1: tri[0], y1: tri[1], x2: x2, y2: y2 }));
      svg.append(arrowHead(x2, y2, ax[0][0] / n, ax[0][1] / n, 0.6 * r0, 'pz-axhead'));
      svg.append(s('text', { class: 'pz-mute', x: x2 + 0.4 * r0, y: y2 + 0.3 * r0 }, ax[1]));
    });
    // the key to the shaded quarter disc: in the free top right corner; on a phone above the scale note
    var narrow = W <= 30 * r0;
    var ky = narrow ? H - 3.2 * r0 : 0.6 * r0, kx = narrow ? 0.4 * r0 : W - 1.7 * r0;
    svg.append(s('rect', { class: 'pz-plane', x: kx, y: ky, width: 1.2 * r0, height: 1.0 * r0 }));
    svg.append(s('text', { class: 'pz-mute', x: narrow ? kx + 1.6 * r0 : kx - 0.4 * r0, y: ky + 0.85 * r0, 'text-anchor': narrow ? 'start' : 'end' }, t('planeLabel')));

    // A's pattern in that plane (sending and receiving)
    var pat = L.patternXZ(st.a, 3).map(function (q) { return P([Math.cos(q.phi * D2R) * RP * q.amp, 0, Math.sin(q.phi * D2R) * RP * q.amp]); });
    svg.append(s('polyline', { class: 'pz-pattern', points: pts(pat) }));
    var lp = P([-RP, 0, -RP * 0.95]);
    if (W > 30 * r0) svg.append(s('text', { class: 'pz-halo', x: Math.max(0.3 * r0, lp[0]), y: lp[1] + 1.5 * r0 }, t('patternLabel')));   // on a phone the legend names it

    // the line of sight
    var pA = P(O), pB = P(Bpos);
    svg.append(s('line', { class: 'pz-sight', x1: pA[0], y1: pA[1], x2: pB[0], y2: pB[1] }));

    // the wave along the path, from the sender to the receiver: arrows in its plane of polarization, the curve through the tips
    var fromA = st.from === 'a';
    var S0 = fromA ? O : Bpos, S1 = fromA ? Bpos : O;
    var e3 = fromA ? (PZ.dipoleWave(A, rh).e || null) : PZ.linear(B);
    if (e3 && st.waveAmp > 0) {
      var ev = e3.map(function (c) { return c[0]; }), tips = [], n = 12 * L.WAVES;
      for (var i = 0; i <= n; i++) {
        var f = 0.2 + 0.6 * i / n, base = [S0[0] + (S1[0] - S0[0]) * f, 0, S0[2] + (S1[2] - S0[2]) * f];
        var val = st.waveAmp * L.waveAt(f, st.t) * AMP;
        var tip = add3(base, ev, val), pb = P(base), pt = P(tip);
        tips.push(pt);
        if (Math.abs(val) > 0.02 * AMP) svg.append(s('line', { class: 'pz-stick', x1: pb[0], y1: pb[1], x2: pt[0], y2: pt[1] }));
        if (i % 3 === 0 && Math.abs(val) > 0.45 * AMP) {
          var dx = pt[0] - pb[0], dy = pt[1] - pb[1], nn = Math.hypot(dx, dy);
          if (nn > 0.5 * r0) svg.append(arrowHead(pt[0], pt[1], dx / nn, dy / nn, 0.5 * r0, 'pz-head'));
        }
      }
      svg.append(s('polyline', { class: 'pz-curve', points: pts(tips) }));
      var m = P([S0[0] + (S1[0] - S0[0]) * 0.86, 0, S0[2] + (S1[2] - S0[2]) * 0.86]);
      var dir = [pB[0] - pA[0], pB[1] - pA[1]], dn = Math.hypot(dir[0], dir[1]) || 1;
      var sgn = fromA ? 1 : -1;
      svg.append(arrowHead(m[0] + sgn * dir[0] / dn * 0.9 * r0, m[1] + sgn * dir[1] / dn * 0.9 * r0, sgn * dir[0] / dn, sgn * dir[1] / dn, 0.85 * r0, 'pz-inkhead'));
    } else {
      var mid = P([Bpos[0] * 0.55, 0, Bpos[2] * 0.55]);
      svg.append(s('text', { class: 'pz-halo pz-title', x: mid[0] + 0.8 * r0, y: mid[1], 'text-anchor': 'start' }, t('nothing')));
    }

    // the two dipoles, with their names and roles
    wire(svg, P, O, A, fromA, r0);
    wire(svg, P, Bpos, B, !fromA, r0);
    var la = P(O), lb = P(Bpos), ax0 = la[0] - Math.abs(A[1]) * HW * KY * Math.cos(GY) * sc - 1.1 * r0;
    svg.append(s('text', { class: 'pz-halo pz-big', x: ax0, y: la[1] + 0.5 * r0, 'text-anchor': 'end' }, 'A'));
    svg.append(s('text', { class: 'pz-halo', x: ax0, y: la[1] + 1.9 * r0, 'text-anchor': 'end' }, fromA ? t('roleSend') : t('roleRecv')));
    // B's labels to its right, clear of its wire (at most HW·sc to either side) and of the wave below it
    var bx = lb[0] + HW * sc + 0.8 * r0, by = lb[1] - 0.6 * r0;
    var anchor = 'start';
    if (narrow) { bx = Math.min(lb[0], W - 3 * r0); by = Math.max(1.4 * r0, lb[1] - HW * sc - 3.6 * r0); anchor = 'middle'; }   // a phone: above B
    else if (bx + 6 * r0 > W) { bx = lb[0] - HW * sc - 0.8 * r0; anchor = 'end'; }
    svg.append(s('text', { class: 'pz-halo pz-big', x: bx, y: by, 'text-anchor': anchor }, 'B'));
    svg.append(s('text', { class: 'pz-halo', x: bx, y: by + 1.4 * r0, 'text-anchor': anchor }, fromA ? t('roleRecv') : t('roleSend')));
    var rx = fromA ? bx : ax0, ry = fromA ? by + 2.7 * r0 : la[1] + 3.2 * r0;
    svg.append(s('text', { class: 'pz-halo pz-title', x: rx, y: ry, 'text-anchor': fromA ? anchor : 'end' },
      t('voltNow', { v: num(st.vNow * L.V_MAX * 1000, 2) })));

    svg.append(s('text', { class: 'pz-halo pz-mute', x: W - 0.5 * r0, y: H - 0.6 * r0, 'text-anchor': 'end' }, t('scaleNote')));
    box.replaceChildren(svg);
  }

  // ── B's view: looking back from B towards A along the line of sight; up = u1, right = across ──
  function drawView(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var top = 1.9 * r0, Rv = Math.min((H - top - 1.4 * r0) / 2, W / 2 - 4.2 * r0), cx = W / 2, cy = top + (H - top) / 2 - 0.2 * r0;
    function at(angle, len) { return [cx + Math.sin(angle * D2R) * len, cy - Math.cos(angle * D2R) * len]; }
    svg.append(s('text', { class: 'pz-title', x: 0.2 * r0, y: 1.2 * r0 }, t('viewTitle')));
    svg.append(s('circle', { class: 'pz-ring', cx: cx, cy: cy, r: Rv }));
    svg.append(s('line', { class: 'pz-ref', x1: cx, y1: cy - Rv, x2: cx, y2: cy + Rv }));
    svg.append(s('line', { class: 'pz-ref', x1: cx - Rv, y1: cy, x2: cx + Rv, y2: cy }));
    svg.append(s('text', { class: 'pz-mute', x: cx + 0.3 * r0, y: cy - Rv - 0.25 * r0 }, t('viewUp')));
    svg.append(s('text', { class: 'pz-mute', x: cx + Rv + 0.3 * r0, y: cy + 0.35 * r0 }, t('viewRight')));

    var fromA = st.from === 'a';
    // the arriving field: its line (polarization) and the arrow now; the receiving wire
    var ePol = st.wavePol, eAmp = st.waveAmp;
    var rPol = fromA ? st.b : st.tau, rLen = fromA ? 1 : st.gain;      // B is always across the line; A is foreshortened
    var hasE = ePol !== null && eAmp > 0, hasW = rPol !== null && rLen > 0;
    // the shorter turn from E's line to the wire's (−90 … 90); labels go on either side of the pair, the angle at the far ends
    var turn = 0;
    if (hasE && hasW) { turn = (((rPol - ePol) % 180) + 180) % 180; if (turn > 90) turn -= 180; }
    var sd = turn >= 0 ? 1 : -1, wEnd = hasE ? ePol + turn : rPol;
    function beside(angle, len, off) { var p = at(angle, len), q = at(angle + off, 1.0 * r0); return [p[0] + q[0] - cx, p[1] + q[1] - cy]; }
    if (hasW) {
      var w1 = at(rPol, -0.92 * Rv * rLen), w2 = at(rPol, 0.92 * Rv * rLen);
      svg.append(s('line', { class: 'pz-rwire', x1: w1[0], y1: w1[1], x2: w2[0], y2: w2[1] }));
      var lw = beside(wEnd, 0.92 * rLen * Rv, 90 * sd);
      svg.append(s('text', { class: 'pz-halo pz-title', x: lw[0], y: lw[1] + 0.35 * r0, 'text-anchor': 'middle' }, fromA ? t('viewB') : 'A'));
    } else if (!fromA) {
      svg.append(s('circle', { class: 'pz-feed', cx: cx, cy: cy, r: 0.5 * r0 }));
    }
    if (!fromA) svg.append(s('text', { class: 'pz-mute', x: W - 0.2 * r0, y: H - 0.3 * r0, 'text-anchor': 'end' }, t('viewA')));
    if (hasE) {
      var e1 = at(ePol, -Rv * eAmp), e2 = at(ePol, Rv * eAmp);
      svg.append(s('line', { class: 'pz-eline', x1: e1[0], y1: e1[1], x2: e2[0], y2: e2[1] }));
      // the field now: E·cos ωt along ê (from A: the sign of ê is A's transverse part, so the arrow is the signed wave)
      var sign = 1;
      if (fromA) {                                      // A's transverse part may point along ePol or against it
        var A = L.dirA(st.a), arrow = Math.atan2(PZ.dot3(A, L.U2), PZ.dot3(A, L.u1(st.el))) / D2R;
        sign = Math.cos((arrow - ePol) * D2R) >= 0 ? 1 : -1;
      } else {
        sign = st.b >= 180 ? -1 : 1;                    // b = 180 is drawn as the line at 0, pointing down
      }
      var nowLen = eAmp * sign * Math.cos(st.t * D2R) * Rv;
      var tip = at(ePol, nowLen);
      if (Math.abs(nowLen) > 0.08 * Rv) {
        svg.append(s('line', { class: 'pz-earrow', x1: cx, y1: cy, x2: tip[0], y2: tip[1] }));
        var ux = (tip[0] - cx) / Math.abs(nowLen), uy = (tip[1] - cy) / Math.abs(nowLen);
        svg.append(arrowHead(tip[0] + ux * 0.3 * r0, tip[1] + uy * 0.3 * r0, ux, uy, 0.9 * r0, 'pz-head'));
      }
      var le = beside(ePol, Math.max(0.8 * Rv * eAmp, 1.2 * r0), -90 * sd);
      svg.append(s('text', { class: 'pz-halo pz-big', x: le[0], y: le[1] + 0.45 * r0, 'text-anchor': 'middle' }, t('viewE')));
      // the part of E along the receiving wire: drop the tip onto the wire's line
      if (hasW) {
        var c = Math.cos((ePol - rPol) * D2R), along = nowLen * c * rLen;   // E·(receiving wire): A foreshortened when B sends
        var foot = at(rPol, along);
        if (Math.abs(nowLen) > 0.08 * Rv && Math.abs(c) < 0.995) svg.append(s('line', { class: 'pz-drop', x1: tip[0], y1: tip[1], x2: foot[0], y2: foot[1] }));
        if (Math.abs(along) > 0.02 * Rv) svg.append(s('line', { class: 'pz-proj', x1: cx, y1: cy, x2: foot[0], y2: foot[1] }));
        svg.append(s('circle', { class: 'pz-projdot', cx: foot[0], cy: foot[1], r: 0.3 * r0 }));
        // the angle between E's line and the wire, at the lines' far ends (the labels are at the near ends)
        if (st.mis !== null && st.mis > 2) {
          var from = ePol + 180, to = from + turn, ra = 0.42 * Rv, arcp = [];
          for (var k = 0; k <= 24; k++) arcp.push(at(from + (to - from) * k / 24, ra));
          svg.append(s('polyline', { class: 'pz-angle', points: pts(arcp) }));
          var lm = at((from + to) / 2, ra + 1.7 * r0);
          svg.append(s('text', { class: 'pz-halo pz-title', x: lm[0], y: lm[1] + 0.35 * r0, 'text-anchor': 'middle' }, deg(st.mis)));
        }
      }
    } else {
      svg.append(s('text', { class: 'pz-halo pz-title', x: cx, y: cy - 1.2 * r0, 'text-anchor': 'middle' }, t('viewNone')));
    }
    box.replaceChildren(svg);
  }

  // ── plot: voltage and power over the best case as B turns 0 … 180° ──
  function drawSweep(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), data = L.sweepB(st.a, st.el, 2);
    var pad = { l: 2.4 * r0, r: 0.8 * r0, t: 1.9 * r0, b: 1.5 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (b) { return pad.l + b / 180 * cw; }, Y = function (y) { return pad.t + ch * (1 - (y + 1.08) / 2.16); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'pz-title', x: 0.2 * r0, y: 1.2 * r0 }, t('plotTitle')));
    svg.append(s('rect', { class: 'pz-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [0, 45, 90, 135, 180].forEach(function (b) {
      if (b && b < 180) svg.append(s('line', { class: 'pz-grid', x1: X(b), x2: X(b), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(b), y: H - 0.15 * r0, 'text-anchor': b === 180 ? 'end' : b ? 'middle' : 'start' }, angleTick(b)));
    });
    svg.append(s('line', { class: 'pz-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    [[1, t('plotOne')], [0, '0'], [-1, t('plotMinus')]].forEach(function (yv) {
      svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(yv[0]) + 0.32 * r0, 'text-anchor': 'end' }, yv[1]));
    });
    svg.append(s('polyline', { class: 'pz-sP', points: pts(data.map(function (q) { return [X(q.b), Y(q.p)]; })) }));
    svg.append(s('polyline', { class: 'pz-sV', points: pts(data.map(function (q) { return [X(q.b), Y(q.v)]; })) }));
    svg.append(s('line', { class: 'pz-now', x1: X(st.b), x2: X(st.b), y1: pad.t, y2: pad.t + ch }));
    svg.append(s('circle', { class: 'pz-nowdot', cx: X(st.b), cy: Y(st.v), r: 0.32 * r0 }));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'pz-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var gainDb = st.gain > 0 ? 20 * Math.log10(st.gain) : null;
    var vtxt = t('mvPct', { v: num(st.V * 1000, 3), p: pct(Math.abs(st.v)) });
    if (st.anti) vtxt += ', ' + t('anti');
    return h('table', { class: 'pz-table' }, h('tbody', null,
      row(t('rowTheta'), deg(st.theta)),
      row(t('rowGain'), t('pctDb', { p: pct(st.gain), d: dB(gainDb) })),
      row(t(st.from === 'a' ? 'rowTau' : 'rowTauA'), st.tau === null ? t('dash') : deg(st.tau)),
      row(t('rowB'), deg(st.b)),
      row(t('rowMis'), st.mis === null ? t('dash') : deg(st.mis), true),
      row(t('rowPlf'), st.plf === null ? t('dash') : t('pctDb', { p: pct(st.plf), d: dB(st.plfDb) })),
      row(t('rowE'), t('mvm', { v: num(st.E * 1000, 3) })),
      row(t('rowV'), vtxt, true),
      row(t('rowP'), dB(st.pDb), true)));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  var angle = function (v) { return t('degVal', { v: num(v, 0) }); };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'from', type: 'choice', label: t('from'), options: [['a', t('from_a')], ['b', t('from_b')]] },
      { key: 'a', type: 'range', label: t('a'), min: 0, max: 180, step: L.ANG_STEP, format: angle },
      { key: 'el', type: 'range', label: t('el'), min: 0, max: 90, step: L.ANG_STEP, format: angle },
      { key: 'b', type: 'range', label: t('b'), min: 0, max: 180, step: L.ANG_STEP, format: angle },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'pz-pattern', label: t('legendPattern') },
      { shape: 'pz-wave', label: t('legendWave') },
      { shape: 'pz-wire', label: t('legendWire') },
      { shape: 'pz-proj', label: t('legendProj') }
    ],

    render: function (c) {
      var pic = h('div', { class: 'pz-pic' }), vw = h('div', { class: 'pz-box pz-view' }), pl = h('div', { class: 'pz-box' });
      var keys = h('p', { class: 'pz-keys' },
        h('span', null, h('span', { class: 'pz-key-v' }), t('seriesV')),
        h('span', null, h('span', { class: 'pz-key-p' }), t('seriesP')));
      c.stage.replaceChildren(h('div', { class: 'pz' }, pic,
        h('div', { class: 'pz-side' }, vw, table(c.state), h('p', { class: 'pz-units' }, t('units')), keys, pl)));
      drawPicture(pic, c.state);
      drawView(vw, c.state);
      drawSweep(pl, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var vars = {
        theta: b(deg(st.theta)), gain: b(pct(st.gain)), tau: b(st.tau === null ? t('dash') : deg(st.tau)),
        b: b(deg(L.line180(st.b))), mis: b(st.mis === null ? t('dash') : deg(st.mis)), misc: b(st.mis === null ? t('dash') : deg(st.mis)),
        v: b(pct(Math.abs(st.v))), pDb: b(dB(st.pDb))
      };
      var parts;
      if (st.from === 'a') parts = t.parts(st.endOn ? 'cap_a_end' : 'cap_a', vars);
      else parts = t.parts(st.endOn ? 'cap_b_end' : 'cap_b', vars);
      if (!st.endOn) {
        parts.push(' ');
        var B = st.from === 'b' ? 'B' : '';
        parts = parts.concat(t.parts(st.crossed ? 'cap_cross' : st.mis < 1e-9 ? 'cap_match' + B : 'cap_cos' + B, vars));
        if (st.anti) { parts.push(' '); parts = parts.concat(t.parts('cap_anti', vars)); }
      }
      if (st.from === 'b' && !st.endOn && !st.crossed) { parts.push(' '); parts = parts.concat(t.parts('cap_recip', vars)); }
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
