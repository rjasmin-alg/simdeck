<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var EV_ID = { 'new': '10', renew: '11', release: '12', expire: '17' };
  var EV_WORD = { 'new': 'evNew', renew: 'evRenew', release: 'evRelease', expire: 'evExpire' };
  var EV_GLYPH = { 'new': '●', renew: '◆', release: '○', expire: '◌' };
  var SPAN = L.DAY_END - L.DAY_START;

  /** Data (addresses, MACs, names, times, event IDs) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function clock(m) { return L.clock(m); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function richN(key, n, vars) { return rich(key, Object.assign({ n: n }, vars || {})); }
  function dateOf(day) { return t('date', { wd: t('wd' + day.wd), d: day.d, m: t('mon' + day.m) }); }
  function pct(m) { return ((Math.min(Math.max(m, L.DAY_START), L.DAY_END) - L.DAY_START) / SPAN * 100) + '%'; }
  function hostOf(a) { return a.host || a.mac; }

  /** One line for an answer (the chain's last box and the earlier question). */
  function answerParts(a) {
    if (a.kind === 'unknown') return [h('b', null, a.why === 'free' ? t('ansNobody') : t('ansUnknown'))];
    var out = [data(hostOf(a))];
    if (a.users.length) out.push(a.users.length > 1 ? ' · ' : ', ', data(a.users.join(' / ')));
    else out.push(' · ', h('span', null, t('ansUserUnknown')));
    return out;
  }

  // ── top: the question, the sources, DNS now ──
  function renderTop(c) {
    var s = c.state, q = s.question, av = s.avail, R = s.retentionDays;
    var asked = s.askedDaysAgo === 0 ? t('qSameDay') : t.n('qLater', s.askedDaysAgo) + ', ' + dateOf(s.asked);
    var line = h('div', { class: 'au-qline' });
    if (q.of > 1) line.append(h('b', null, t('qNo', { i: q.qi + 1, of: q.of })));
    line.append(h('span', null, t.parts('qAsked', { date: h('b', null, asked) })));
    s.prior.forEach(function (pr) { line.append(h('span', null, t.parts('qPrior', { at: data(clock(pr.at)), answer: h('b', null, answerParts(pr.answer)) }))); });
    function src(name, keep, ok) {
      var st = ok === 'off' ? '– ' + t('srcOff') : ok ? '✓ ' + t('srcOk') : '✕ ' + t('srcGone');
      return h('span', { class: 'au-src', dataset: { ok: String(ok) } }, h('b', null, name), h('span', { class: 'au-keep' }, keep), h('span', { class: 'au-st' }, st));
    }
    var srcs = h('div', { class: 'au-srcs' },
      src(t('srcDhcp'), t.n('keepDays', R.dhcp), av.dhcp),
      src(t('srcDc'), t('keepDc', { n: R.dc }), av.dc),
      src(t('srcIpam'), t('keepIpam'), av.ipam ? true : 'off'));
    var qbox = h('section', { class: 'au-box au-q' },
      h('h2', { class: 'au-qtitle' }, t.parts('qTitle', { ip: data(q.ip), at: data(clock(q.at)) })), line, srcs);
    var dns = h('section', { class: 'au-box au-dns' },
      h('h2', null, t('dnsTitle'), ' · ', h('span', { class: 'au-note' }, dateOf(s.asked))),
      h('span', { class: 'au-rr', translate: 'no' }, s.dnsNow.name + '  A  ' + s.dnsNow.ip),
      h('span', { class: 'au-note' }, h('b', null, '✕ '), t.parts('dnsNote', { at: data(clock(q.at)) })));
    return h('div', { class: 'au-top' }, qbox, dns);
  }

  // ── the time axis ──
  /** The day's leases as bars: from a new lease (or the first event) to its release or expiry, or open to 18:00. */
  function bars(events) {
    var out = [], open = null;
    L.chronological(events, L.IP).forEach(function (i) {
      var e = events[i];
      if (e.id === 'new' || e.id === 'renew') {
        if (open && open.mac !== e.mac) { out.push(open); open = null; }
        if (!open) open = { mac: e.mac, host: e.host, from: e.t, to: null, events: [] };
        open.events.push(i);
      } else if (open) { open.to = e.t; open.events.push(i); out.push(open); open = null; }
    });
    if (open) out.push(open);
    return out;
  }
  function renderTimeline(c) {
    var s = c.state, link = s.link, av = s.avail;
    var leaseTrack = h('div', { class: 'au-track' });
    var logonTrack = h('div', { class: 'au-track' });
    if (!av.leases) leaseTrack.append(h('div', { class: 'au-gone' }, h('span', null, t('tlGone'))));
    else {
      var cover = s.cover && s.cover.kind === 'lease' ? s.cover.decider : -1;
      var macs = [];
      s.leaseEvents.forEach(function (e) { if (macs.indexOf(e.mac) < 0) macs.push(e.mac); });
      bars(s.leaseEvents).forEach(function (bar) {
        var used = link >= 1 && bar.events.indexOf(cover) >= 0;
        var ds = { c: String(macs.indexOf(bar.mac) % 3 + 1) };
        if (bar.to == null) ds.open = '';
        if (used) ds.used = '';
        var end = bar.to == null ? L.DAY_END : bar.to;
        leaseTrack.append(h('div', { class: 'au-bar' + (used && link === 1 ? ' sd-changed' : ''), dataset: ds,
          style: { left: pct(bar.from), width: 'calc(' + pct(end) + ' - ' + pct(bar.from) + ')' } }, data(bar.host || bar.mac)));
      });
      s.leaseEvents.forEach(function (e) {
        leaseTrack.append(h('span', { class: 'au-tick', 'aria-hidden': 'true', style: { left: pct(e.t) } }, EV_GLYPH[e.id]));
      });
    }
    if (!av.logons) logonTrack.append(h('div', { class: 'au-gone' }, h('span', null, t('tlGone'))));
    else {
      s.logonEvents.forEach(function (g, i) {
        var ds = {};
        if (link >= 3 && s.logons) {
          if (s.logons.inside.indexOf(i) >= 0) ds['in'] = '';
          else ds.out = '';
        }
        logonTrack.append(h('span', { class: 'au-mark', dataset: ds, style: { left: pct(g.t) } },
          h('span', { 'aria-hidden': 'true' }, g.kind === 'tgt' ? '▲' : '▽'), data(g.user)));
      });
    }
    var axis = h('div', { class: 'au-axis' });
    for (var hr = 8; hr <= 18; hr++) axis.append(h('span', { class: 'au-hour', style: { left: pct(hr * 60) } }, data((hr < 10 ? '0' : '') + hr)));
    var at = s.question.at;
    [leaseTrack, logonTrack].forEach(function (tr) { tr.append(h('span', { class: 'au-tline', 'aria-hidden': 'true', style: { left: pct(at) } })); });
    axis.append(h('span', { class: 'au-tlabel', translate: 'no', style: { left: pct(at), transform: at > 17 * 60 ? 'translateX(-90%)' : null } }, clock(at)));
    return h('section', { class: 'au-box au-tl' },
      h('span', { class: 'au-tlname' }, t('tlLeases')), leaseTrack,
      h('span', { class: 'au-tlname' }, t('tlLogons')), logonTrack,
      h('span'), axis);
  }

  // ── the lease table (K4, first match, newest first) ──
  function renderLeases(c) {
    var s = c.state, link = s.link, at = s.question.at, av = s.avail, E = s.leaseEvents;
    var title = [t('leaseTitle', { ip: L.IP, at: clock(at) }), ' ', h('span', { class: 'au-via' }, av.via === 'ipam' ? t('viaIpam') : t('viaDhcp'))];
    var rows = [], idx = [], ptr = -1, implicitText, outcomeFor;
    if (!av.leases) {
      implicitText = data(t('impLeaseGone', { date: dateOf(L.dayAfter(L.RETENTION.dhcp)) }), 'au-sans');
      ptr = link >= 1 ? 0 : -1;
    } else {
      var cv = s.cover;
      idx = cv.order;
      rows = idx.map(function (i) {
        var e = E[i];
        var row = { no: clock(e.t), hit: null, tags: [], cells: {
          ev: h('span', null, data(EV_ID[e.id]), ' ', t(EV_WORD[e.id])),
          mac: e.mac,
          host: e.host ? e.host : h('span', null, t('noHost')) }, action: '' };
        if (link >= 1) {
          if (cv.read.indexOf(i) >= 0) { row.hit = false; row.note = [{ k: 'muted', text: t('tagAfter', { at: clock(at) }) }]; }
          if (i === cv.decider) row.hit = true;
        }
        if (link >= 2 && cv.kind === 'lease' && i === s.start) row.tags.push({ k: link === 2 ? 'hl' : 'dashed', text: t('tagStart') });
        return row;
      });
      implicitText = h('span', null, t('impLease', { at: clock(at) }));
      if (link >= 1) ptr = cv.decider >= 0 ? idx.indexOf(cv.decider) : rows.length;
    }
    outcomeFor = function (i) {
      if (i >= rows.length) return Simdeck.ruleTable.verdict(false, av.leases ? t('outNone') : t('outGone'));
      return Simdeck.ruleTable.verdict(s.cover.kind === 'lease', s.cover.kind === 'lease' ? t('outLease') : t('outFree'));
    };
    var el = Simdeck.ruleTable({
      dir: c.dir, mode: 'first', title: title, noLabel: t('colTime'),
      columns: [{ key: 'ev', label: t('colEvent') }, { key: 'mac', label: t('colMac') }, { key: 'host', label: t('colHost') }],
      actionLabel: '', markLabel: t('colMark', { at: clock(at) }),
      rows: rows, implicit: { text: implicitText, action: '' },
      at: ptr, subject: { mark: String(s.question.qi + 1), c: 1 }, done: link >= 1, outcome: outcomeFor,
      words: { win: '', skip: t('wSkip') }, changed: link === 1 && c.n > 0
    });
    // link 2 reads the device from the deciding row: mark its MAC and name as changed
    if (link === 2 && s.cover && s.cover.kind === 'lease') {
      var tr = el.querySelectorAll('tbody tr')[idx.indexOf(s.cover.decider)];
      if (tr) Array.prototype.forEach.call(tr.querySelectorAll('td[data-col="mac"], td[data-col="host"]'), function (td) { td.classList.add('sd-changed'); });
    }
    return el;
  }

  // ── the logon table (K4: every row read; matches add up, so mode 'deny' with no deny rows) ──
  function renderLogons(c) {
    var s = c.state, link = s.link, at = s.question.at, av = s.avail, G = s.logonEvents;
    var title = [t('logonTitle', { ip: L.IP }), ' ', h('span', { class: 'au-via' }, av.via === 'ipam' ? t('viaIpamDc') : t('viaDc'))];
    var rows = [], implicitText = h('span', null, t('impLogon')), ptr = -1, done = false;
    var held = s.cover && s.cover.kind === 'lease';
    var changedRows = [];
    if (!av.logons) {
      implicitText = h('span', null, t('impLogonGone'));
      if (link >= 3) { ptr = 0; done = true; }
    } else {
      var lg = s.logons, on = s.on;
      rows = G.map(function (g, i) {
        var row = { no: clock(g.t), hit: null, action: '', cells: {
          ev: g.kind === 'tgt' ? h('span', null, data('4768'), ' ', data(t('evTgt'))) : h('span', null, t('evLogoff')),
          user: g.user, addr: g.clientIp, dc: g.dc } };
        if (link >= 3 && !held) row.mark = 'skip';
        else if (link >= 3) {
          if (lg.inside.indexOf(i) >= 0) { row.hit = true; if (link === 3) changedRows.push(i); }
          else {
            row.hit = false;
            if (lg.before.indexOf(i) >= 0) row.note = [{ k: 'muted', text: t('tagBefore', { t: clock(s.leaseEvents[s.start].t) }) }];
            else if (lg.after.indexOf(i) >= 0) row.note = [{ k: 'muted', text: t('tagAfter', { at: clock(at) }) }];
          }
          if (link >= 4 && on) {
            if (on.dropped.indexOf(i) >= 0) { row.hit = false; row.mark = 'beaten'; if (link === 4) changedRows.push(i); }
            if (on.by.indexOf(i) >= 0) { row.mark = 'hit'; row.note = [{ k: 'dashed', text: t('tagLogoff') }]; if (link === 4) changedRows.push(i); }
            if (link === 4 && on.kept.indexOf(i) >= 0) changedRows.push(i);
          }
          if (link === 5 && row.hit) changedRows.push(i);
        }
        return row;
      });
      if (link >= 3) { ptr = 'all'; done = link >= 5 || !held; }
      if (!held && link >= 3) implicitText = h('span', null, t('impLogonNoLease'));
    }
    var el = Simdeck.ruleTable({
      dir: c.dir, mode: 'deny', title: title, noLabel: t('colTime'),
      columns: [{ key: 'ev', label: t('colEvent') }, { key: 'user', label: t('colUser') }, { key: 'addr', label: t('colAddr') }, { key: 'dc', label: t('colDc') }],
      actionLabel: '', markLabel: t('colMark', { at: clock(at) }),
      rows: rows, implicit: { text: implicitText, action: '' },
      at: ptr, done: done,
      outcome: function (i) {
        if (i >= rows.length) return Simdeck.ruleTable.verdict(false, av.logons ? t('outNoUser') : t('outGone'));
        return Simdeck.ruleTable.verdict(true, t('outCand'));
      },
      words: { hit: t('wHit'), win: '', beaten: t('wBeaten'), skip: t('wSkip') },
      changed: link >= 3 && c.n > 0 && typeof ptr === 'number'
    });
    var trs = el.querySelectorAll('tbody tr');
    changedRows.forEach(function (i) { var td = trs[i] && trs[i].querySelector('td.sd-rt-mark'); if (td) td.classList.add('sd-changed'); });
    if (link >= 3 && !rows.length || (link >= 5 && s.on && !s.on.users.length)) {
      var imp = trs[trs.length - 1] && trs[trs.length - 1].querySelector('td.sd-rt-mark');
      if (imp && (link === 3 || link === 5)) imp.classList.add('sd-changed');
    }
    return el;
  }

  // ── the chain ──
  var LINK_HEAD = { lease: 'lnLease', device: 'lnDevice', logons: 'lnLogons', logoffs: 'lnLogoffs', answer: 'lnAnswer' };
  var GLYPH = { found: '✓', missing: '✕', ambiguous: '≈' };
  function linkBody(s, k, ch) {
    var E = s.leaseEvents, at = s.question.at;
    if (k === 'lease') {
      if (ch.why === 'gone') return t('evGone');
      if (ch.why === 'none') return t('evNone', { at: clock(at) });
      var e = E[ch.evidence[0]];
      return t.parts(ch.why === 'free' ? 'evFree' : 'evLease', { t: data(clock(e.t)), ev: t(EV_WORD[e.id]) });
    }
    if (k === 'device') {
      if (ch.ok === 'missing') return t('evNoLease');
      var d = E[ch.evidence[0]];
      return [data(d.mac), h('br'), d.host ? data(d.host) : t('noHost')];
    }
    if (k === 'logons') {
      if (ch.why === 'gone') return t('evGone');
      if (ch.why === 'no-lease') return t('evNoLease');
      var since = t.parts('evSince', { t: data(clock(E[s.start].t)) });
      if (!ch.evidence.length) return [t('evNoLogon'), ' · '].concat(since);
      return [data(ch.evidence.map(function (i) { return s.logonEvents[i].user + ' ' + clock(s.logonEvents[i].t); }).join(', ')), h('br')].concat(since);
    }
    if (k === 'logoffs') {
      if (ch.ok === 'missing' && ch.why !== 'all-off') return ch.why === 'gone' ? t('evGone') : ch.why === 'no-lease' ? t('evNoLease') : t('evNoLogon');
      return [t.n('evCands', s.on.users.length), s.on.users.length ? ': ' : '', s.on.users.length ? data(s.on.users.join(', ')) : ''];
    }
    return answerParts(s.answer);
  }
  function renderChain(c) {
    var s = c.state;
    var list = h('ol', { class: 'au-chain' });
    ['lease', 'device', 'logons', 'logoffs', 'answer'].forEach(function (k, i) {
      var ch = s.chain[i];
      var head = h('span', { class: 'au-lhead' }, (i + 1) + ' · ' + t(LINK_HEAD[k], { at: clock(s.question.at) }));
      var li = h('li', { class: 'au-link' + (ch && i === s.link - 1 && c.n > 0 ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''),
        dataset: ch ? { ok: ch.ok, k: k } : { k: k } },
        h('span', { class: 'au-glyph', 'aria-hidden': 'true' }, ch ? GLYPH[ch.ok] : t('lnPending')),
        head, h('span', { class: 'au-lbody' }, ch ? linkBody(s, k, ch) : ''));
      list.append(li);
    });
    return list;
  }

  // ── captions ──
  /** A node placed twice would move: the second and later uses get a copy. */
  function dedupe(parts) {
    var seen = [];
    return parts.map(function (x) {
      if (!x || !x.nodeType) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function caption(c) { return dedupe(captionParts(c)); }
  function captionParts(c) {
    var s = c.state, p = c.params, n = c.n, at = s.question.at, link = s.link;
    var AT = data(clock(at)), IPd = b(L.IP);
    if (c.first) return t.parts('capStart', { ip: IPd, at: AT });
    var out = [];
    var add = function (parts) { if (out.length) out.push(' '); out.push.apply(out, parts); };
    if (s.question.qi > 0 && link === 1) add(t.parts('capNextQ', { at: AT }));
    var ch = s.chain[link - 1], E = s.leaseEvents, G = s.logonEvents;
    if (link === 1) {
      if (ch.why === 'gone') add(t.parts('capGone', { n: n, date: h('b', null, dateOf(L.dayAfter(L.RETENTION.dhcp))) }));
      else if (ch.why === 'free') {
        var fe = E[s.cover.decider];
        add(t.parts('capFree', { n: n, at: AT, ev: h('b', null, t(EV_WORD[fe.id])), t: b(clock(fe.t)) }));
      } else if (ch.why === 'none') add(t.parts('capNone', { n: n, ip: IPd, at: AT }));
      else {
        var de = E[s.cover.decider];
        add(rich(de.id === 'new' ? 'capLeaseNew' : 'capLeaseRenew', { n: n, at: AT, ip: IPd, t: b(clock(de.t)), host: b(de.host || de.mac) }));
        // the earlier holder whose lease ended before this one began
        var chron = L.chronological(E, L.IP), prevEnd = null;
        chron.forEach(function (i) { var e = E[i]; if (e.t <= de.t && e.mac !== de.mac && (e.id === 'release' || e.id === 'expire')) prevEnd = e; });
        if (prevEnd) add(t.parts(prevEnd.id === 'release' && prevEnd.t < 12 * 60 ? 'capEarlierMorning' : 'capEarlier', { host: b(prevEnd.host || prevEnd.mac), t: b(clock(prevEnd.t)) }));
      }
      if (s.cover && s.cover.read.length) add(t.parts('capLater', { n: s.cover.read.length, at: AT }));
      if (s.avail.ipam && !s.avail.dhcp) add([t('capIpamHas')]);
      return out;
    }
    if (link === 2) {
      if (ch.ok === 'missing') add(t.parts('capNoDevice', { n: n }));
      else {
        var d = E[s.cover.decider];
        add(t.parts(d.host ? 'capDevice' : 'capDeviceNoHost', { n: n, mac: b(d.mac), host: b(d.host || ''), start: b(clock(E[s.start].t)) }));
      }
      return out;
    }
    if (link === 3) {
      if (ch.why === 'gone') add(t.parts('capLogonsGone', { n: n, d: L.RETENTION.dc }));
      else if (ch.why === 'no-lease') add(t.parts('capLogonsNoLease', { n: n }));
      else {
        var start = b(clock(E[s.start].t));
        if (ch.why === 'none') add(t.parts('capLogonsNone', { n: n, start: start, at: AT, ip: IPd }));
        else add(t.parts('capLogons', { n: n, start: start, at: AT, ip: IPd,
          list: b(ch.evidence.map(function (i) { return G[i].user + ' ' + clock(G[i].t); }).join(', ')) }));
        s.logons.before.forEach(function (i) { add(t.parts('capLogonBefore', { user: b(G[i].user), t: b(clock(G[i].t)) })); });
        s.logons.after.forEach(function (i) { add(t.parts('capLogonAfter', { user: b(G[i].user), t: b(clock(G[i].t)), at: AT })); });
      }
      return out;
    }
    if (link === 4) {
      if (!s.on) add(t.parts(ch.why === 'gone' ? 'capOffGone' : ch.why === 'no-lease' ? 'capOffNoLease' : 'capOffMissing', { n: n }));
      else if (s.on.by.length) {
        var gone = [];
        s.on.by.forEach(function (i) { if (gone.indexOf(G[i].user) < 0) gone.push(G[i].user); });
        add(t.parts('capOffDropped', { n: n, at: AT, gone: b(gone.join(', ')), left: s.on.users.length ? b(s.on.users.join(', ')) : t('ansNobody') }));
      } else if (s.on.users.length === 1) add(t.parts('capOffOne', { n: n, at: AT, user: b(s.on.users[0]) }));
      else add(t.parts('capOffMany', { n: s.on.users.length, s: n, at: AT }));
      return out;
    }
    var a = s.answer;
    if (a.kind === 'one') add(t.parts('capAnswerOne', { n: n, at: AT, ip: IPd, host: b(hostOf(a)), mac: b(a.mac), user: b(a.users[0]) }));
    else if (a.kind === 'several') { add(t.parts('capAnswerMany', { n: a.users.length, s: n, at: AT })); add([t('capAnswerManyWhy')]); }
    else if (a.kind === 'device') add(t.parts('capAnswerDevice', { n: n, host: b(hostOf(a)), mac: b(a.mac) }));
    else if (a.why === 'free') add(t.parts('capAnswerFree', { n: n, at: AT, ip: IPd }));
    else if (a.why === 'none') add(t.parts('capAnswerNone', { n: n, at: AT, ip: IPd }));
    else add(rich('capAnswerGone', { n: n, d: L.RETENTION.dc }));
    if (a.host && s.dnsNow.name.toLowerCase() !== a.host.toLowerCase()) add(t.parts('capDnsTrap', { dns: b(s.dnsNow.name), at: AT }));
    s.prior.forEach(function (pr) {
      if (!pr.answer.host || !a.host) return;
      add(t.parts(pr.answer.mac !== a.mac ? 'capCompare' : 'capSame', { at: data(clock(pr.at)), host: b(hostOf(pr.answer)) }));
    });
    return out;
  }

  var EVIDENCE_IDS = Object.keys(L.EVIDENCE);

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'evidence', type: 'select', label: t('hidden'), resets: true, options: EVIDENCE_IDS.map(function (id) { return [id, id]; }), visible: function () { return false; } },
      { key: 'at', type: 'choice', label: t('pAt'), resets: true, options: [[L.AT['09:10'], '09:10'], [L.AT['14:32'], '14:32'], [L.AT['17:55'], '17:55']] },
      { key: 'askedDaysAgo', type: 'range', label: t('pDays'), resets: true, min: 0, max: 14 },
      { key: 'ipamCollected', type: 'toggle', label: t('pIpam'), hint: t('pIpamHint'), resets: true }
    ],

    presets: [
      { id: 'one-user', label: t('prOne'), hint: t('prOneHint'), params: { evidence: 'one-user', at: 872, askedDaysAgo: 0, ipamCollected: true } },
      { id: 'address-reused', label: t('prReused'), hint: t('prReusedHint'), params: { evidence: 'address-reused', at: 872, askedDaysAgo: 0, ipamCollected: true } },
      { id: 'two-users', label: t('prTwo'), hint: t('prTwoHint'), params: { evidence: 'two-users', at: 872, askedDaysAgo: 0, ipamCollected: true } },
      { id: 'too-old', label: t('prOld'), hint: t('prOldHint'), params: { evidence: 'one-user', at: 872, askedDaysAgo: 9, ipamCollected: false } },
      { id: 'dns-trap', label: t('prDns'), hint: t('prDnsHint'), params: { evidence: 'dns-trap', at: 872, askedDaysAgo: 2, ipamCollected: true } }
    ],

    legend: [
      { shape: 'tline', label: t('legendT') },
      { shape: 'rt-win', label: t('legendUsed') },
      { shape: 'chain', label: t('legendLinks') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'au' }, renderTop(c), renderTimeline(c), renderLeases(c), renderLogons(c), renderChain(c)));
    },

    caption: caption
  });
})();
</script>
</body>
