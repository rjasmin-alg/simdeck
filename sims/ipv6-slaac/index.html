     groups and default router; centre: the messages on the link as kit view K1 (kit/sequence.js) and the card of the

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { H: '1', N: '2', R: '4' };

  /** Data (addresses, MACs, message names, hex) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'sl-mono' : cls || null }, text); }
  function B(text) { return h('b', null, data(text)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      // a placeholder used twice is the same node: clone it, or appending moves it
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function days(sec) { return t.n('days', sec / 86400); }
  function groupName(addr) {
    return addr === L.ALL_NODES ? t('gAllNodes') : addr === L.ALL_ROUTERS ? t('gAllRouters') : t('gSolicited');
  }
  function changedHere(c, key) { return c.state.changed.indexOf(key) >= 0 && c.state.phase !== 'start'; }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }

  // ── left: H's addresses, groups, default router ──

  function renderAddrs(c) {
    var s = c.state;
    var box = h('section', { class: 'sl-box sl-addrs' }, h('h2', null, t('addrTitle')));
    if (!s.addrs.length) box.append(h('p', { class: 'sl-muted', style: { margin: 0 } }, t('addrNone')));
    else box.append(h('ul', null, s.addrs.map(function (a) {
      var ch = changedHere(c, a.addr);
      var life = a.valid === null ? t('life', { v: '∞', p: '∞' }) : t('life', { v: days(a.valid), p: days(a.preferred) });
      var use = null;
      if (s.outcome === 'ready') use = a.scope === 'link' ? t('useLink') : t.parts('useBeyond', { r: data(L.ROUTER.ll, '') });
      return h('li', { class: 'sl-addr' + (ch ? ' sd-changed' + anim(c) : ''), dataset: { st: a.state } },
        h('span', { class: 'sl-dot', dataset: { st: a.state }, 'aria-hidden': 'true' }, a.state === 'duplicate' ? '✕' : ''),
        h('span', null,
          h('b', { translate: 'no' }, a.addr),
          h('span', { class: 'sl-sm' },
            h('span', null, a.scope === 'link' ? t('scLink') : t('scGlobal')), ' ',
            h('span', { class: 'sl-tag', dataset: { st: a.state } }, t('st' + a.state.charAt(0).toUpperCase() + a.state.slice(1)))),
          h('span', { class: 'sl-sm sl-muted' }, life),
          use ? h('span', { class: 'sl-sm sl-use' }, use) : null));
    })));
    if (!s.ipv6) box.append(h('p', { class: 'sl-note', dataset: { k: 'bad' } }, t('offNote')));
    else if (s.outcome === 'globalDuplicate') box.append(h('p', { class: 'sl-note', dataset: { k: 'bad' } }, t('dupNote')));
    else if (s.outcome === 'noLength') box.append(h('p', { class: 'sl-note', dataset: { k: 'bad' } }, t('noLenNote', { p: c.params.prefixLen })));
    else if (s.outcome === 'noAFlag') box.append(h('p', { class: 'sl-note', dataset: { k: 'bad' } }, t('noANote')));

    box.append(h('h3', null, t('groupsTitle')));
    var groups = s.ipv6 ? s.groups : [];
    box.append(groups.length ? h('dl', { class: 'sl-kv sl-groups sl-sm' }, groups.map(function (g) {
      var ch = s.joined.indexOf(g.addr) >= 0;
      return [h('dt', { class: ch ? 'sd-changed' : null, translate: 'no' }, g.addr), h('dd', null, groupName(g.addr))];
    })) : h('p', { class: 'sl-muted sl-sm', style: { margin: 0 } }, t('groupsNone')));

    box.append(h('h3', null, t('routerTitle')));
    var r = s.defaultRouter;
    box.append(r ? h('p', { class: 'sl-sm' + (changedHere(c, 'router') ? ' sd-changed' + anim(c) : ''), style: { margin: 0 } },
      B(r.addr), ' · ', t('routerLife', { n: r.lifetime }))
      : h('p', { class: 'sl-muted sl-sm', style: { margin: 0 } }, t('routerNone')));
    return box;
  }

  // ── centre: the chart (K1) and the message card ──

  function laneBody(lines) { return h('div', { class: 'sl-lane' }, lines); }
  function lanes(c) {
    var p = c.params, s = c.state, nodes = L.others(p);
    var hLines = [data(p.mac)];
    if (!s.ipv6) hLines.push(h('div', null, h('span', { class: 'sl-off' }, t('ipv6Off'))));
    else if (!s.addrs.length) hLines.push(h('div', { class: 'sl-muted' }, t('noAddrYet')));
    // H in the middle: its notes have room on both sides, and the link reads neighbour, host, router
    return [
      { id: 'N', c: COLOUR.N, name: t('laneN'), changed: c.state.dupOf === 'N' && c.state.phase === 'dadNa',
        body: laneBody(nodes[0].addrs.map(function (a) { return h('div', null, data(a)); })) },
      { id: 'H', c: COLOUR.H, name: t('laneH'), body: laneBody(hLines.map(function (x) { return h('div', null, x); })) },
      { id: 'R', c: COLOUR.R, shape: 'square', name: t('laneR'), body: laneBody([h('div', null, data(L.ROUTER.ll))]) }
    ];
  }
  var RE = { notMine: 'reNotMine', owns: 'reOwns', answers: 'reAnswers', processes: 'reProcesses' };
  function renderChart(c) {
    var s = c.state;
    var fresh = c.prev ? c.prev.rows.length : 0;
    var scopeOf = function (addr) { return L.isLinkLocal(addr) ? t('scLink') : t('scGlobal'); };
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '3.4rem',
      lanes: lanes(c),
      rows: s.rows.map(function (r, i) {
        var time = r.kind === 'msg' ? s.msgs[r.n - 1].t : r.t;
        var row = { time: time + ' s', changed: i >= fresh };
        if (r.kind === 'note') {
          return Object.assign(row, { kind: 'note', lane: 'H', k: r.what === 'noAddr' ? 'fill' : null,
            text: r.what === 'noAddr' ? t('noteNoAddr') : t(r.what === 'formed' ? 'noteFormed' : 'notePreferred', { scope: scopeOf(r.addr) }) });
        }
        var m = s.msgs[r.n - 1];
        var re = {}, lost = [];
        m.to.forEach(function (id) {
          if (m.react[id] === 'notMember') lost.push(id);   // ✕ without a word: the message card names the members
          else if (RE[m.react[id]]) re[id] = t(RE[m.react[id]]);   // a member that only hears it gets no word
        });
        if (m.type === 'NA' && m.react.H === 'processes') re.H = h('b', null, t('stDuplicate'));
        return Object.assign(row, { from: m.from, to: m.to, label: m.type, c: COLOUR[m.from], line: 'dashed', lost: lost, re: re });
      }),
      timers: s.timers.map(function (tm) { return { lane: tm.lane, from: tm.from, to: tm.to === null ? undefined : tm.to, end: tm.end || undefined, label: data('1 s', '') }; }),   // RetransTimer, named in the caption; a longer label covers N's word
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  function addrWithName(addr) {
    var name = addr === L.UNSPEC ? t('unspecified') : addr.indexOf('ff02:') === 0 ? groupName(addr) : null;
    return [data(addr, 'sl-mono sl-wrap'), name ? h('span', { class: 'sl-muted' }, ' (' + name + ')') : null];
  }
  function renderMsg(c) {
    var s = c.state, before = c.prev ? c.prev.msgs.length : 0;
    var box = h('section', { class: 'sl-box sl-msg' });
    if (!s.msgs.length) { box.append(h('h2', null, t('msgNone'))); return box; }
    var fresh = s.msgs.length > before;
    var m = s.msgs[s.msgs.length - 1];
    box.append(h('h2', null, t('msgTitle', { n: m.n }), ' · ', h('span', { class: 'sl-muted' }, fresh ? t('msgNew') : t('msgOld'))));
    box.append(h('div', { class: 'sl-mtype' },
      h('b', { class: 'sd-fill' + (fresh ? anim(c) : ''), dataset: { c: COLOUR[m.from] }, translate: 'no' }, m.type),
      h('span', null, rich('name' + m.type))));
    var kv = [h('dt', null, t('fSrc')), h('dd', null, addrWithName(m.src)), h('dt', null, t('fDst')), h('dd', null, addrWithName(m.dst))];
    if (m.target) kv.push(h('dt', null, t('fTarget')), h('dd', null, data(m.target, 'sl-mono sl-wrap')));
    kv.push(h('dt', null, t('fMembers')), h('dd', null, m.members.length ? data(m.members.join(', '), '') : t('fNobody'),
      m.to.length > m.members.length ? h('span', { class: 'sl-muted' }, ' · ', t('fIgnore'), ' ', data(m.to.filter(function (id) { return m.members.indexOf(id) < 0; }).join(', '), '')) : null));
    if (m.type === 'NA') kv.push(h('dt', null, t('fFlags')), h('dd', null, data('S = ' + (m.flags.S ? 1 : 0) + ', O = ' + (m.flags.O ? 1 : 0))));
    if (m.type === 'RA') kv.push(h('dt', null, t('fFlags')), h('dd', null, data('M = ' + (m.flags.M ? 1 : 0) + ', O = ' + (m.flags.O ? 1 : 0))),
      h('dt', null, t('fRouterLife')), h('dd', null, data(t('lifeVal', { n: m.routerLifetime }), '')));
    box.append(h('dl', { class: 'sl-kv' }, kv));
    if (m.type === 'RA') {
      var o = m.prefix;
      box.append(h('div', { class: 'sl-opt' }, h('dl', { class: 'sl-kv' },
        h('dt', null, t('fPrefix')), h('dd', null, data(o.prefix + '/' + o.len), ' ', data('L = ' + (o.L ? 1 : 0) + ', A = ' + (o.A ? 1 : 0))),
        h('dt', null, t('fValid')), h('dd', null, data(t('lifeVal', { n: o.valid }), ''), ' (', days(o.valid), ')'),
        h('dt', null, t('fPreferred')), h('dd', null, data(t('lifeVal', { n: o.preferred }), ''), ' (', days(o.preferred), ')'))));
    }
    return box;
  }

  // ── right: the bit strip ──

  function oct(cells) { return h('div', { class: 'sl-oct', translate: 'no' }, cells); }
  function cell(text, k, extra) { return h('span', { dataset: Object.assign({ k: k }, extra || {}) }, text); }
  function row(label, body) { return h('div', { class: 'sl-row' }, h('span', { class: 'sl-lbl' }, label), body); }
  function bin8(v, mark) {
    var s = ('0000000' + v.toString(2)).slice(-8), out = [];
    for (var i = 0; i < 8; i++) {
      if (i === 4) out.push(' ');
      out.push(i === mark ? h('i', null, s[i]) : s[i]);
    }
    return out;
  }
  function groups4(groups) { return groups.map(function (g) { return ('000' + g.toString(16)).slice(-4); }); }

  /** An address as 8 groups: prefix groups (c3), interface ID groups (c5). With a /56 prefix the 4th group is half
      prefix, half missing: 56 + 64 = 120 bits. */
  function bar(prefix, len, iid, changed, c) {
    var pg = groups4(L.parse(prefix).slice(0, 4)), ig = groups4(iid);
    var cells = [];
    if (len === 64) pg.forEach(function (g) { cells.push(cell(g, 'p')); });
    else {
      pg.slice(0, 3).forEach(function (g) { cells.push(cell(g, 'p')); });
      cells.push(cell(pg[3].slice(0, 2), 'p', { half: '' }), cell('??', 'x', { half: '' }));
    }
    ig.forEach(function (g) { cells.push(cell(g, 'i')); });
    var bits = h('div', { class: 'sl-bar' + (changed ? anim(c) : ''), dataset: changed ? { new: '' } : {}, translate: 'no' }, cells);
    var legend = h('div', { class: 'sl-split' }, h('span', null, t.n('prefixBits', len)), h('span', null, t.n('iidBits', 64)));
    return [bits, legend, len === 64 ? null : h('div', { class: 'sl-missing' }, '?? = ', t.n('missing', 128 - 64 - len))];
  }

  function renderBits(c, only) {
    var p = c.params, s = c.state, e = L.eui64(p.mac), st = s.stage, ph = s.phase;
    var box = h('section', { class: 'sl-box sl-bits' }, h('h2', null, t('bitsTitle')));
    var macCells = [];
    e.mac.forEach(function (b, i) {
      if (i === 3) macCells.push(st >= 1 ? cell('', 'gap', { gap: '' }) : null, st >= 1 ? cell('', 'gap', { gap: '' }) : null);
      macCells.push(cell(L.hex2(b), 'mac'));
    });
    box.append(row(t('rowMac'), oct(macCells)));
    if (st >= 1 && st < 4 && only) box.append(h('div', { class: 'sl-split' }, h('span', null, t('half', { n: 1 })), h('span', null, t('half', { n: 2 }))));
    if (st >= 2) {
      // the bits just written carry the changed mark: ff:fe in its step, the flipped octet always (the U/L highlight)
      var ins = ph === 'insert' || ph === 'iid';
      box.append(row(t('rowInsert'), oct(e.inserted.map(function (b, i) {
        return i === 3 || i === 4 ? cell(L.hex2(b), 'ins', ins ? { new: '' } : null) : cell(L.hex2(b), 'mac');
      }))));
    }
    if (st >= 3) {
      box.append(row(t('rowFlip'), oct(e.iid.map(function (b, i) { return cell(L.hex2(b), i === 0 ? 'flip' : 'iid'); }))));
      // the comparison (step 4 of the interface-ID view) carries the U/L bit and the IID of every MAC itself
      if (st < 4) {
        box.append(row(t('ulBit'), h('span', { class: 'sl-bin', translate: 'no' }, bin8(e.mac[0], 6), ' → ', bin8(e.iid[0], 6))));
        box.append(row(t('rowIid'), h('span', { class: 'sl-iid', translate: 'no' }, L.full(e.groups))));
      }
    }
    if (only) {
      if (st >= 4) box.append(compareTable(p));
      return box;
    }
    var ll = s.addrs.filter(function (a) { return a.scope === 'link'; })[0];
    if (ll) {
      box.append(row(h('span', null, t('rowLl'), ' ', data(ll.addr)), bar('fe80::', 64, e.groups, changedHere(c, ll.addr) && ph === 'll', c)));
      var sn = L.solicitedNodeParts(ll.addr);
      box.append(row(h('span', null, t('rowSn'), ' · ', t('lowBits')),
        h('span', { class: 'sl-sn', translate: 'no' }, sn.fixed, h('span', null, sn.low))));
    }
    var ra = s.msgs.filter(function (m) { return m.type === 'RA'; })[0];
    var gua = s.addrs.filter(function (a) { return a.scope === 'global'; })[0];
    if (ll) {
      var gLabel = h('span', null, t('rowGlobal'), gua ? [' ', data(gua.addr)] : null);
      if (!ra) box.append(row(gLabel, h('span', { class: 'sl-muted sl-sm' }, t('notYet'))));
      else if (!ra.prefix.A) box.append(row(gLabel, h('p', { class: 'sl-note', dataset: { k: 'bad' } }, t('noA'))));
      else box.append(row(gLabel, bar(L.ROUTER.prefix, ra.prefix.len, e.groups, ph === 'gua' || ph === 'noAddr', c)));
    }
    return box;
  }

  function compareTable(p) {
    return h('table', { class: 'sl-cmp' },
      h('caption', { class: 'sl-lbl' }, t('cmpTitle')),
      h('tr', null, h('th', null, t('rowMac')), h('th', null, t('cmpUl')), h('th', null, t('rowIid'))),
      L.MACS.map(function (mac) {
        var e = L.eui64(mac);
        return h('tr', { dataset: mac === p.mac ? { cur: '' } : {} },
          h('td', { translate: 'no' }, mac), h('td', { translate: 'no' }, e.ulBefore + ' → ' + e.ulAfter), h('td', { translate: 'no', class: 'sl-iid' }, L.full(e.groups)));
      }));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, p = c.params, e = L.eui64(p.mac);
    var D = function (v) { return data(v); };
    var m = s.msgs[s.msgs.length - 1];
    var out;
    switch (s.phase) {
      case 'start': return s.mode === 'iid' ? rich('capStartIid', { mac: D(p.mac) }) : rich('capStart');
      case 'split': return rich('capSplit', { mac: D(p.mac), a: B(e.split[0].map(L.hex2).join(':')), b: B(e.split[1].map(L.hex2).join(':')) });
      case 'insert': return rich('capInsert', { eui: B(e.inserted.map(L.hex2).join(':')) });
      case 'flip':
        out = rich('capFlip', { before: D(L.hex2(e.mac[0])), after: B(L.hex2(e.iid[0])), iid: B(L.full(e.groups)) });
        if (e.ulBefore) out = out.concat(' ', rich('capFlipLocal'));
        return out;
      case 'compare': return rich('capCompare');
      case 'iid': return rich('capIid', { mac: D(p.mac), iid: B(L.full(e.groups)) });
      case 'll': return rich('capLl', { addr: B(s.probe), all: D(L.ALL_NODES), sn: D(L.solicitedNode(s.probe)) });
      case 'gua':
        out = rich('capGua', { prefix: D(L.ROUTER.prefix + '/' + p.prefixLen), addr: B(s.probe) });
        if (!s.joined.length) out = out.concat(' ', rich('capGuaGroup', { sn: D(L.solicitedNode(s.probe)) }));
        return out;
      case 'dadNs':
        out = rich('capNs', { sn: D(m.dst), addr: B(m.target) });
        var owner = m.members.filter(function (id) { return m.react[id] === 'owns'; });
        var silent = m.members.filter(function (id) { return m.react[id] === 'notMine'; });
        if (owner.length) out = out.concat(' ', rich('capNsOwner', { who: data(owner[0], '') }));
        silent.forEach(function (id) { out = out.concat(' ', rich('capNsNotMine', { who: data(id, '') })); });
        if (!m.members.length) out = out.concat(' ', rich('capNsNobody'));
        return out;
      case 'dadOk': return rich('capOk', { addr: B(s.addrs.filter(function (a) { return a.state === 'preferred'; }).slice(-1)[0].addr) });
      case 'dadNa':
        return rich('capNa', { who: data(m.from, ''), all: D(m.dst), addr: B(m.target) }).concat(' ', rich(s.ipv6 ? 'capNaGlobal' : 'capNaLl'));
      case 'rs': return rich('capRs', { dst: D(m.dst) });
      case 'ra':
        out = rich('capRa', { src: D(m.src), dst: D(m.dst), prefix: B(m.prefix.prefix + '/' + m.prefix.len), a: D(m.prefix.A ? '1' : '0'), life: D(String(m.routerLifetime)) });
        if (m.flags.M) out = out.concat(' ', rich('capRaM'));
        return out;
      case 'noAddr':
        return s.outcome === 'noAFlag' ? rich('capNoA') : rich('capNoLength', { p: D(String(p.prefixLen)), sum: B(String(p.prefixLen + 64)) });
      case 'ready':
        return rich('capReady', { ll: B(s.addrs[0].addr), gua: B(s.addrs[1].addr), r: D(L.ROUTER.ll) });
    }
    return '';
  }

  /** prefix, A flag and duplicate act on the whole link only; the interface-ID view hides them. */
  var wholeLink = function (p) { return !p.iidOnly; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'iidOnly', type: 'toggle', label: t('iidOnly'), resets: true },
      { key: 'mac', type: 'select', label: t('mac'), options: [[L.MACS[0], t('mac1')], [L.MACS[1], t('mac2')], [L.MACS[2], t('mac3')]] },
      { key: 'prefixLen', type: 'choice', label: t('prefixLen'), options: [[64, '/64'], [56, '/56']], visible: wholeLink },
      { key: 'aFlag', type: 'toggle', label: t('aFlag'), visible: wholeLink },
      { key: 'duplicate', type: 'choice', label: t('duplicate'), options: [['none', t('dupNone')], ['link-local', t('dupLl')], ['global', t('dupGlobal')]], visible: wholeLink }
    ],

    presets: [
      { id: 'join', label: t('presetJoin'), params: {} },
      { id: 'eui64', label: t('presetEui'), params: { iidOnly: true } },
      { id: 'dad-fail', label: t('presetDad'), params: { duplicate: 'global' }, hint: t('presetDadHint') },
      { id: 'prefix-56', label: t('presetP56'), params: { prefixLen: 56 } },
      { id: 'a-off', label: t('presetAoff'), params: { aFlag: false } }
    ],

    legend: [
      { shape: 'hollow', label: t('legTentative') },
      { shape: 'round', c: 1, label: t('legPreferred') },
      { shape: 'dup', label: t('legDuplicate') },
      { shape: 'dash', label: t('legMulticast') },
      { c: 3, label: t('legPrefix') },
      { c: 5, label: t('legIid') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      if (c.params.iidOnly) {
        c.stage.replaceChildren(h('div', { class: 'sl sl-only' }, renderBits(c, true)));
        return;
      }
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'sl' },
        h('div', { class: 'sl-col' }, renderAddrs(c), renderMsg(c)),
        h('div', { class: 'sl-col sl-mid' }, chart),
        h('div', { class: 'sl-col' }, renderBits(c, false))));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
