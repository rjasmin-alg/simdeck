<style>
/* Page CSS: every selector starts with [data-sim="ham-modes"]; colours only from kit tokens. */
[data-sim="ham-modes"] .sd-main { grid-template-columns: minmax(0, 1fr); padding-bottom: var(--gap); }
[data-sim="ham-modes"] .sd-caption { min-height: calc(1.3em + 1rem); }
[data-sim="ham-modes"] .sd-stage { font-size: var(--fs-md); }
[data-sim="ham-modes"] .hm-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr);
  gap: 0.8rem;
  height: 100%;
  padding: 0.6rem;
}

/* Left: the filter row and the six groups of cards. */
[data-sim="ham-modes"] .hm-left { display: flex; flex-direction: column; gap: 0.45rem; min-height: 0; }
[data-sim="ham-modes"] .hm-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
[data-sim="ham-modes"] .hm-flabel { margin-right: 0.2rem; color: var(--muted); font-size: var(--fs-sm); }
[data-sim="ham-modes"] .hm-fbtn {
  padding: 0.1rem 0.75rem;
  border: var(--line-w) solid var(--line);
  border-radius: 999px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: var(--fs-sm);
  line-height: 1.5;
  cursor: pointer;
}
[data-sim="ham-modes"] .hm-fbtn:hover { border-color: var(--ink); }
[data-sim="ham-modes"] .hm-fbtn[aria-pressed='true'] { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; }
/* Six groups in five rows: the two groups of three share a row, so every row holds up to six cards. */
[data-sim="ham-modes"] .hm-groups {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-content: space-evenly;
  gap: 0.5rem 0.35rem;
  flex: 1;
  min-height: 0;
}
[data-sim="ham-modes"] .hm-group { grid-column: 1 / -1; }
[data-sim="ham-modes"] .hm-group.is-half { grid-column: auto; }
[data-sim="ham-modes"] .hm-group.is-half .hm-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-sim="ham-modes"] .hm-glabel { margin: 0 0 0.15rem; font-size: var(--fs-sm); font-weight: 400; color: var(--muted); line-height: 1.2; }
[data-sim="ham-modes"] .hm-glabel b { color: var(--ink); }
[data-sim="ham-modes"] .hm-tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.35rem; margin: 0; padding: 0; list-style: none; }
[data-sim="ham-modes"] .hm-tile {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.1rem;
  width: 100%;
  height: 100%;
  padding: 0.25rem 0.5rem 0.3rem;
  border: var(--line-w) solid var(--line);
  border-left: 0.4rem solid var(--sw);
  border-radius: var(--radius-sm);
  background: var(--panel);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
[data-sim="ham-modes"] .hm-tile:hover { border-color: var(--ink); border-left-color: var(--sw); }
[data-sim="ham-modes"] .hm-tname { font-weight: 700; line-height: 1.2; }
[data-sim="ham-modes"] .hm-tmeta { display: flex; flex-wrap: wrap; gap: 0 0.4rem; color: var(--muted); font-size: var(--fs-sm); line-height: 1.25; }
[data-sim="ham-modes"] .hm-tcls { font-family: var(--mono); color: var(--ink); }
[data-sim="ham-modes"] .hm-tile.is-off { border-style: dashed; border-left-style: solid; background: transparent; opacity: 0.45; }
[data-sim="ham-modes"] .hm-tile.is-sel { background: var(--hl); color: var(--on-hl); outline: 3px solid var(--ink); outline-offset: 1px; opacity: 1; }
[data-sim="ham-modes"] .hm-tile.is-sel .hm-tmeta,
[data-sim="ham-modes"] .hm-tile.is-sel .hm-tcls { color: var(--on-hl); }

/* Right: the details of the selected mode. */
[data-sim="ham-modes"] .hm-detail {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  min-height: 0;
  padding: 0.5rem 0.8rem;
  border: var(--line-w) solid var(--line);
  border-left: 0.45rem solid var(--sw);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: auto;
  container: hm-detail / inline-size;
}
[data-sim="ham-modes"] .hm-dname { margin: 0; font-size: var(--fs-lg); line-height: 1.2; }
[data-sim="ham-modes"] .hm-dsub { margin: 0; color: var(--muted); }
[data-sim="ham-modes"] .hm-dsec { margin: 0; font-size: var(--fs-sm); font-weight: 700; color: var(--muted); }
[data-sim="ham-modes"] .hm-desig { font-family: var(--mono); font-weight: 700; }
[data-sim="ham-modes"] .hm-desig small { margin-left: 0.4rem; font-family: var(--sans); font-weight: 400; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="ham-modes"] .hm-codes { display: flex; flex-direction: column; gap: 0.2rem; }
[data-sim="ham-modes"] .hm-code { display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
[data-sim="ham-modes"] .hm-sym {
  display: inline-block;
  min-width: 1.6em;
  padding: 0 0.25rem;
  border: 2px solid var(--ink);
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-weight: 700;
  text-align: center;
}
[data-sim="ham-modes"] .hm-sym + .hm-sym { margin-left: -0.15rem; }
[data-sim="ham-modes"] .hm-codekey { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 0.5rem; margin: 0; }
[data-sim="ham-modes"] .hm-codekey dt { font-family: var(--mono); font-weight: 700; }
[data-sim="ham-modes"] .hm-codekey dd { margin: 0; }
[data-sim="ham-modes"] .hm-codekey .hm-pos { color: var(--muted); font-size: var(--fs-sm); }
[data-sim="ham-modes"] .hm-desc { margin: 0; line-height: 1.35; }
[data-sim="ham-modes"] .hm-table { width: 100%; border-collapse: collapse; }
[data-sim="ham-modes"] .hm-table th { padding: 0.05rem 0.6rem 0.05rem 0; color: var(--muted); font-size: var(--fs-sm); font-weight: 400; text-align: left; vertical-align: baseline; white-space: nowrap; }
[data-sim="ham-modes"] .hm-table td { padding: 0.05rem 0; vertical-align: baseline; }
[data-sim="ham-modes"] .hm-note { margin: 0; padding-left: 0.6rem; border-left: 3px solid var(--line); color: var(--muted); }

/* The bandwidth axis: every mode's bandwidth in a thin lane, the selected one in the lane above. */
[data-sim="ham-modes"] .hm-bw { flex: none; }
[data-sim="ham-modes"] .hm-bwline b { font-variant-numeric: tabular-nums; }
[data-sim="ham-modes"] .hm-axis { position: relative; height: 2.6rem; margin: 0.25rem 0.4rem 0; border-bottom: 2px solid var(--line); }
[data-sim="ham-modes"] .hm-grid { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
[data-sim="ham-modes"] .hm-bar { position: absolute; min-width: 3px; border-radius: 2px; }
[data-sim="ham-modes"] .hm-bar.is-other { bottom: 0.25rem; height: 0.5rem; background: var(--line); }
[data-sim="ham-modes"] .hm-bar.is-other.hm-point { width: 0.5rem; margin-left: -0.25rem; border-radius: 50%; }
[data-sim="ham-modes"] .hm-bar.is-sel { top: 0.3rem; height: 1rem; outline: 2px solid var(--ink); }
[data-sim="ham-modes"] .hm-bar.is-sel.hm-point { width: 1rem; margin-left: -0.5rem; border-radius: 50%; }
[data-sim="ham-modes"] .hm-ticks { position: relative; height: 1.3em; margin: 0 0.4rem; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="ham-modes"] .hm-tick { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; line-height: 1.3; }
[data-sim="ham-modes"] .hm-tick:first-child { transform: none; }
[data-sim="ham-modes"] .hm-tick:last-child { transform: translateX(-100%); }
@container hm-detail (max-width: 34rem) { [data-sim="ham-modes"] .hm-tick[data-odd] { display: none; } }

/* Projectors with less room: five cards a row. Phones: everything stacks and the stage grows. */
@container hm-detail (max-width: 22rem) { [data-sim="ham-modes"] .hm-tick:not([data-q]) { display: none; } }
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ham-modes"] .sd-stage { height: auto; container-type: inline-size; overflow: visible; }
  [data-sim="ham-modes"] .hm-wrap { grid-template-columns: minmax(0, 1fr); height: auto; }
  [data-sim="ham-modes"] .hm-groups { grid-template-columns: minmax(0, 1fr); }
  [data-sim="ham-modes"] .hm-tiles,
  [data-sim="ham-modes"] .hm-group.is-half .hm-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  [data-sim="ham-modes"] .hm-detail { overflow: visible; }
}
@media (max-width: 480px) {
  [data-sim="ham-modes"] .hm-tiles,
  [data-sim="ham-modes"] .hm-group.is-half .hm-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Amaterski načini rada: referentni pregled</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
  </main>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  // Page state only (a reference page has no params): the selected mode and the filter.
  var sel = 'ssb';
  var filter = 'all';
  var GROUP_C = { voice: 2, image: 5, weak: 3, hftext: 1, vhfdigi: 4, packet: 6 };
  var sim;

  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  function num(s) { return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function hz(p) { return num(p.num) + ' ' + t('unit' + (p.unit === 'Hz' ? 'Hz' : p.unit === 'kHz' ? 'KHz' : 'MHz')); }
  function bwText(bw) {
    var r = L.rangeOf(bw);
    if (r.single) return hz(r.lo);
    if (r.same) return num(r.lo.num) + '–' + hz(r.hi);
    return hz(r.lo) + ' – ' + hz(r.hi);
  }
  function value(m, row) {
    if (row !== 'doppler') return t('v_' + m.id + '_' + row);
    return t('v_' + m.id + '_' + row, { d2: num(L.dopplerKHz(145.9).toFixed(1)), d70: num(L.dopplerKHz(435).toFixed(0)) });
  }
  function rerender() { sim.render(); }

  function tile(id, keep) {
    var m = L.BY_ID[id];
    var on = keep.indexOf(id) >= 0;
    return h('li', null, h('button', {
      type: 'button',
      class: 'hm-tile' + (id === sel ? ' is-sel' : '') + (on ? '' : ' is-off'),
      dataset: { c: String(GROUP_C[m.group]) },
      'aria-pressed': String(id === sel),
      onclick: function () { sel = id; rerender(); }
    },
    h('span', { class: 'hm-tname' }, t('n_' + id)),
    h('span', { class: 'hm-tmeta', translate: 'no' },
      h('span', { class: 'hm-tcls' }, m.cls ? m.cls.join(' ') : '—'),
      h('span', null, m.bands.join(' '))),
    h('span', { class: 'hm-tmeta', translate: 'no' }, m.bw ? bwText(m.bw) : '—')));
  }

  function codes(m) {
    if (!m.cls) return h('p', { class: 'hm-desc' }, t('noClass'));
    var des = L.designations(m);
    return h('div', { class: 'hm-codes' },
      m.cls.map(function (c, i) {
        var parts = L.decodeEmission(c);
        return h('div', null,
          h('div', { class: 'hm-code' },
            parts.map(function (p) { return h('span', { class: 'hm-sym', translate: 'no' }, p.sym); }),
            des[i] ? h('span', { class: 'hm-desig', translate: 'no' }, '= ' + des[i]) : null),
          h('dl', { class: 'hm-codekey' }, parts.map(function (p) {
            return [h('dt', { translate: 'no' }, p.sym), h('dd', null, t('e' + p.pos + '_' + p.sym), ' ', h('span', { class: 'hm-pos' }, '(' + t('pos' + p.pos) + ')'))];
          })));
      }),
      des.length ? h('p', { class: 'hm-desc' }, h('span', { class: 'hm-dsec' }, t('lblDesig') + ': '), h('span', { class: 'hm-pos' }, t('desigHint'))) : null);
  }

  function bandwidth(m, s) {
    return h('div', { class: 'hm-bw' },
      h('p', { class: 'hm-desc hm-bwline' }, h('span', { class: 'hm-dsec' }, t('lblBw') + ': '),
        m.bw ? h('b', { translate: 'no' }, bwText(m.bw)) : t('noBw')),
      h('div', { class: 'hm-axis', role: 'img', 'aria-label': t('bwAxis') },
        s.ticks.map(function (k) { return h('div', { class: 'hm-grid', style: { left: pct(k.x) } }); }),
        s.bars.map(function (b) {
          var mine = b.id === m.id;
          return h('div', {
            class: 'hm-bar ' + (mine ? 'is-sel sd-fill' : 'is-other') + (b.point ? ' hm-point' : ''),
            dataset: mine ? { c: '1' } : {},
            style: b.point ? { left: pct(b.x) } : { left: pct(b.x), width: pct(b.w) }
          });
        })),
      h('div', { class: 'hm-ticks', translate: 'no', 'aria-hidden': 'true' }, s.ticks.map(function (k, i) {
        var a = { class: 'hm-tick', style: { left: pct(k.x) } };
        if (i % 2) a['data-odd'] = '';
        if (i % 4 === 0) a['data-q'] = '';
        return h('span', a, hz(L.formatHz(k.f)));
      })));
  }

  function detail(s) {
    var m = L.BY_ID[sel];
    return h('article', { class: 'hm-detail', dataset: { c: String(GROUP_C[m.group]) }, 'aria-live': 'polite' },
      h('header', null,
        h('h2', { class: 'hm-dname' }, t('n_' + m.id)),
        h('p', { class: 'hm-dsub' }, t('s_' + m.id))),
      h('h3', { class: 'hm-dsec' }, t('lblClass')),
      codes(m),
      bandwidth(m, s),
      h('p', { class: 'hm-desc' }, t('d_' + m.id)),
      h('table', { class: 'hm-table' }, h('tbody', null, m.rows.map(function (r) {
        return h('tr', null, h('th', { scope: 'row' }, t('r_' + r)), h('td', null, value(m, r)));
      }))),
      m.note ? h('p', { class: 'hm-note' }, t('note_' + m.id)) : null);
  }

  sim = Simdeck.mount({
    steps: 0,
    defaults: L.defaults,
    initial: L.initial,
    params: [],
    presets: [],
    legend: [
      { shape: 'hl', label: t('legendSel') },
      { shape: 'hollow', label: t('legendOff') },
      { c: 1, label: t('legendBw') },
      { c: 1, shape: 'round', label: t('legendPoint') }
    ],
    render: function (ctx) {
      var s = ctx.state;
      var keep = L.filterModes(filter);
      ctx.stage.replaceChildren(h('div', { class: 'hm-wrap' },
        h('div', { class: 'hm-left' },
          h('div', { class: 'hm-filters', role: 'group', 'aria-label': t('filters') },
            h('span', { class: 'hm-flabel' }, t('filters') + ':'),
            ['all'].concat(L.CATS).map(function (f) {
              return h('button', {
                type: 'button', class: 'hm-fbtn', 'aria-pressed': String(f === filter),
                onclick: function () { filter = f; rerender(); }
              }, t('f_' + f));
            })),
          h('div', { class: 'hm-groups' }, s.groups.map(function (g) {
            var half = g.modes.length <= 3;
            return h('section', { class: 'hm-group' + (half ? ' is-half' : ''), 'aria-label': t('g_' + g.id) },
              h('h2', { class: 'hm-glabel' }, h('b', null, t('k_' + g.kind)), ' · ', t('g_' + g.id)),
              h('ul', { class: 'hm-tiles' }, g.modes.map(function (id) { return tile(id, keep); })));
          }))),
        detail(s)));
    },
    caption: function () {
      if (filter === 'all') return t('capHint');
      return t.n('capFilter', L.filterModes(filter).length, { f: t('f_' + filter) });
    }
  });
})();
</script>
</body>
