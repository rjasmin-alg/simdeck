<style>
/* Page CSS: every selector starts with [data-sim="osi-tcpip-map"]; colours only from kit tokens.
   Layout: one grid. Columns: OSI bracket lanes | OSI rows | bands | TCP/IP rows | TCP/IP bracket lanes | tray.
   Rows: a heading row, then seven tracks (layer 7 on top) when OSI is shown, or one track per TCP/IP row alone. */
[data-sim="osi-tcpip-map"] .om {
  display: grid;
  gap: 0.45rem 0.5rem;
  height: 100%;
  padding: 1.2cqh 1cqw;
  font-size: 1rem;

/* a layer row: a hit button underneath, the words and chips above it */
[data-sim="osi-tcpip-map"] .om-row {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  align-content: start;
  gap: 0.15rem 0.5rem;

[data-sim="osi-tcpip-map"] .om-row[data-row="tp"]::before,
[data-sim="osi-tcpip-map"] .om-row[data-row="o1"]::before { background-image: repeating-linear-gradient(45deg, transparent 0 0.25rem, var(--on-series) 0.25rem 0.4rem); }
[data-sim="osi-tcpip-map"] .om-row.om-target { border-style: dashed; border-color: var(--ink); }

/* the mapping bands between the columns */

[data-sim="osi-tcpip-map"] .om-tray-note { color: var(--muted); }
[data-sim="osi-tcpip-map"] .om-cards { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0.45rem; }
[data-sim="osi-tcpip-map"] .om-card { flex-wrap: wrap; text-align: left; }
[data-sim="osi-tcpip-map"] .om-card[data-long] { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.1rem 0.35rem; width: 100%; padding: 0.2rem 0.5rem; }
[data-sim="osi-tcpip-map"] .om-card .om-label { font-weight: 700; }
[data-sim="osi-tcpip-map"] .om-q { grid-column: 1 / -1; font-size: 1rem; font-weight: 400; }
[data-sim="osi-tcpip-map"] .om-return {

/* legend swatches of the page's own shapes */
[data-sim="osi-tcpip-map"] .sd-swatch[data-shape="bracket"] { background: transparent; border: 0.2rem solid var(--ink); border-right: 0; border-radius: 0.15em; }

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Series colour per OSI layer, from its TCP/IP layer (as in encapsulation: application c1 … link c4). */
  var C_OF_LAYER = { 7: 1, 6: 1, 5: 1, 4: 2, 3: 3, 2: 4, 1: 4 };
  var MARK = { ok: '✓', wrong: '✕', 'both-ok': '≈', moved: '→' };
  /** Phone and portrait: the tray goes under the columns, the bands get short labels (same query as the kit's). */
  var PHONE = window.matchMedia('(max-width: 900px), (max-aspect-ratio: 1/1)');
  PHONE.addEventListener('change', function () { if (window.simdeck) window.simdeck.render(); });

  // ── page state (not in the URL): where each card is, which card is selected, what just happened ──
  var page = { placed: {}, sel: null, last: null, lastState: null, lastParams: null, resetting: false };

  /** The kit does not tell the page about R, so watch for it (key and the reset buttons) in the capture phase; the
      flag lives for this event only, and syncPage clears the placements when the reset renders. */
  function flagReset() { page.resetting = true; window.setTimeout(function () { page.resetting = false; }, 0); }
  window.addEventListener('keydown', function (e) {
    var el = e.target;
    if (e.ctrlKey || e.metaKey || e.altKey || (e.key || '').toLowerCase() !== 'r') return;
    if (el instanceof HTMLElement && el.closest('input, textarea, select, [contenteditable="true"]')) return;
    flagReset();
  }, true);
  window.addEventListener('click', function (e) {
    if (e.target instanceof Element && e.target.closest('button[aria-keyshortcuts="R"]')) flagReset();
  }, true);

  /** t.parts with *word* turned into an English term in italics (term pairs not in the glossary yet). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function plain(key) { return t(key).replace(/\*/g, ''); }
  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  function isDevice(id) { return L.CARDS[id].kind === 'device'; }
  function numberOf(id, cards) { return cards.indexOf(id) + 1; }
  function sameParams(a, b) {
    if (!a || !b) return false;
    return Object.keys(a).every(function (k) { return a[k] === b[k]; });
  }
  /** "3 mrežni (OSI)" or "internetski (TCP/IP)". */
  function rowWords(rowId) {
    var m = L.modelOf(rowId);
    var name = (m === 'osi' ? rowId.slice(1) + ' ' : '') + t('row_' + rowId);
    return t('inModel', { row: name, model: t(m) });
  }
  function visibleModels(p) {
    var m = L.effectiveModel(p);
    return m === 'both' ? ['osi', 'tcpip'] : [m];
  }

  // ── actions ──
  function select(id) {
    page.sel = page.sel === id ? null : id;
    page.last = null;
    window.simdeck.render();
  }
  function drop(rowId) {
    if (!page.sel) { page.last = { kind: 'noPick' }; window.simdeck.render(); return; }
    page.placed = L.place(page.placed, page.sel, rowId);
    page.last = { kind: 'placed', card: page.sel, row: rowId };
    page.sel = null;
    window.simdeck.render();
  }
  function toTray() {
    if (!page.sel) return;
    page.placed = L.place(page.placed, page.sel, null);
    page.last = { kind: 'returned', card: page.sel };
    page.sel = null;
    window.simdeck.render();
  }
  function clearAll(sim) {
    page.placed = {};
    page.sel = null;
    page.last = null;
    sim.render();
  }

  /** Placements clear when the set changes, a preset is (re)loaded, or R resets (SPEC "Params and presets"). */
  function syncPage(c) {
    if (c.state === page.lastState) return;
    var prev = page.lastState;
    if (prev && (page.resetting || c.state.set !== prev.set || c.preset !== null || sameParams(c.params, page.lastParams))) {
      page.placed = {};
      page.sel = null;
      page.last = null;
    }
    page.lastState = c.state;
    page.lastParams = Object.assign({}, c.params);
  }

  // ── drawing ──
  /** What each card shows now: per visible model, the row it is on (or, revealed, its answer) and its verdict. */
  function layout(p, cards) {
    var models = visibleModels(p), out = { rows: {}, tray: [], brackets: { osi: [], tcpip: [] } };
    models.forEach(function (m) { L.rowsOf(m, p.layers5).forEach(function (r) { out.rows[r.id] = []; }); });
    cards.forEach(function (id) {
      var r = L.visibleRow(page.placed[id], p);
      if (r) {
        var v = p.reveal ? L.check(id, r, p.layers5) : null;
        out.rows[r].push({ id: id, v: v, row: r });
        if (isDevice(id)) out.brackets[L.modelOf(r)].push({ id: id, v: v, row: r });
        return;
      }
      if (!p.reveal) { out.tray.push(id); return; }
      models.forEach(function (m) {
        var a = L.answer(id, m, p.layers5);
        if (!a) return;
        out.rows[a].push({ id: id, v: 'moved', row: a });
        if (isDevice(id)) out.brackets[m].push({ id: id, v: 'moved', row: a });
      });
    });
    return out;
  }

  function chip(it, cards, changed) {
    var id = it.id;
    return h('button', {
      type: 'button',
      class: 'om-chip' + (changed ? ' sd-changed' + (Simdeck.reducedMotion() ? '' : ' sd-anim-in') : ''),
      dataset: { v: it.v || '' },
      'aria-pressed': String(page.sel === id),
      title: it.v ? plain('r_' + id) : null,
      onmousedown: noFocus,
      onclick: function () { select(id); }
    },
      isDevice(id) ? h('span', { class: 'om-badge', 'aria-label': t('badge', { n: numberOf(id, cards) }) }, String(numberOf(id, cards))) : null,
      it.v ? h('span', { class: 'om-mark', 'aria-hidden': 'true' }, MARK[it.v]) : null,
      h('span', { class: 'om-label' }, rich('c_' + id)),
      it.v ? h('span', { class: 'om-sr' }, ' ' + t(it.v === 'moved' ? 'v_moved' : 'v_' + it.v)) : null);
  }

  function rowEl(rowId, model, p, items, cards, track) {
    var cov = L.covers(rowId, p.layers5);
    var changed = page.last && page.last.kind === 'placed' && page.last.row === rowId;
    var target = !!page.sel;
    return h('div', {
      class: 'om-row' + (changed ? ' sd-changed' : '') + (target ? ' om-target' : ''),
      dataset: { row: rowId, c: String(C_OF_LAYER[cov[cov.length - 1]]) },
      style: { gridColumn: track.col, gridRow: track.row }
    },
      h('button', {
        type: 'button', class: 'om-hit',
        'aria-label': t('rowAria', { model: t(model), row: (model === 'osi' ? rowId.slice(1) + ' ' : '') + t('row_' + rowId) }),
        onmousedown: noFocus,
        onclick: function () { drop(rowId); }
      }),
      h('span', { class: 'om-name' }, model === 'osi' ? h('span', { class: 'om-num' }, rowId.slice(1)) : null, ' ', t('row_' + rowId),
        model === 'tcpip' ? h('span', { class: 'om-cov' }, ' · ', covText(cov)) : null),
      h('span', { class: 'om-pdu' }, t('pdu_' + rowId)),
      h('span', { class: 'om-chips' }, items.map(function (it) {
        var ch = page.last && page.last.kind === 'placed' && page.last.card === it.id && page.last.row === it.row && it.v !== 'moved';
        return chip(it, cards, ch);
      })));
  }

  function covShort(cov) {
    var lo = Math.min.apply(null, cov), hi = Math.max.apply(null, cov);
    return lo === hi ? String(lo) : lo + '–' + hi;
  }
  function covText(cov) {
    var lo = Math.min.apply(null, cov), hi = Math.max.apply(null, cov);
    return lo === hi ? t('covers1', { a: lo }) : t('covers', { a: lo, b: hi });
  }

  function render(c) {
    syncPage(c);
    var p = c.params, cards = c.state.cards;
    var models = visibleModels(p), both = models.length === 2, shared = models.indexOf('osi') >= 0;
    var phone = PHONE.matches;
    var lay = layout(p, cards);
    var tcpRows = L.rowsOf('tcpip', p.layers5);
    var nTracks = shared ? 7 : tcpRows.length;

    /** Grid rows of a row id: shared tracks follow the OSI layers it covers; alone, one track per row. */
    function trackRows(rowId) {
      if (shared) {
        var s = L.span(rowId, p.layers5);
        return (2 + 7 - s.hi) + ' / ' + (2 + 7 - s.lo + 1);
      }
      var i = tcpRows.map(function (r) { return r.id; }).indexOf(rowId);
      return (2 + i) + ' / ' + (3 + i);
    }
    function lowestTrackEnd() { return String(2 + nTracks); }

    // columns, left to right
    var cols = [], col = {};
    function addCol(key, size, n) { col[key] = cols.length + 1; for (var i = 0; i < (n || 1); i++) cols.push(size); }
    var osiLanes = lay.brackets.osi.length, tcpLanes = lay.brackets.tcpip.length;
    var lane = phone ? '1.3rem' : '1.9rem';
    if (models.indexOf('osi') >= 0) { if (osiLanes) addCol('osiBr', lane, osiLanes); addCol('osi', 'minmax(0, 1fr)'); }
    if (both) addCol('band', phone ? '2.8rem' : '6.2rem');
    if (models.indexOf('tcpip') >= 0) { addCol('tcp', 'minmax(0, 1fr)'); if (tcpLanes) addCol('tcpBr', lane, tcpLanes); }
    if (!phone) addCol('tray', both ? 'minmax(15rem, 0.95fr)' : 'minmax(15rem, 0.6fr)');

    var kids = [];
    function head(model, key) {
      var n = model === 'osi' ? 7 : tcpRows.length;
      kids.push(h('div', { class: 'om-head', style: { gridColumn: String(col[key]), gridRow: '1' } },
        t(model), h('span', null, t.n('layersN', n))));
    }
    if (col.osi) {
      head('osi', 'osi');
      L.rowsOf('osi').forEach(function (r) {
        kids.push(rowEl(r.id, 'osi', p, lay.rows[r.id], cards, { col: String(col.osi), row: trackRows(r.id) }));
      });
      lay.brackets.osi.forEach(function (b, i) { kids.push(bracket(b, 'left', String(col.osiBr + i), trackRows(b.row).split(' / ')[0] + ' / ' + lowestTrackEnd(), cards)); });
    }
    if (col.band) {
      tcpRows.forEach(function (r) {
        var cov = r.covers;
        kids.push(h('div', {
          class: 'om-band', dataset: { c: String(C_OF_LAYER[cov[cov.length - 1]]), merge: cov.length > 1 ? '1' : null },
          style: { gridColumn: String(col.band), gridRow: trackRows(r.id) }
        }, phone ? covShort(cov) : [covText(cov), h('span', { 'aria-hidden': 'true' }, '→')]));
      });
    }
    if (col.tcp) {
      head('tcpip', 'tcp');
      tcpRows.forEach(function (r) {
        kids.push(rowEl(r.id, 'tcpip', p, lay.rows[r.id], cards, { col: String(col.tcp), row: trackRows(r.id) }));
      });
      lay.brackets.tcpip.forEach(function (b, i) { kids.push(bracket(b, 'right', String(col.tcpBr + i), trackRows(b.row).split(' / ')[0] + ' / ' + lowestTrackEnd(), cards)); });
    }
    kids.push(tray(p, lay, cards, phone ? { col: '1 / -1', row: lowestTrackEnd() } : { col: String(col.tray), row: '1 / ' + lowestTrackEnd() }));

    c.stage.replaceChildren(h('div', {
      class: 'om',
      dataset: { models: models.join(' ') },
      style: {
        gridTemplateColumns: cols.join(' '),
        gridTemplateRows: 'auto repeat(' + nTracks + (phone ? ', minmax(3.4rem, auto)) auto' : ', minmax(0, 1fr))')
      }
    }, kids));
  }

  function bracket(b, side, gridCol, gridRow, cards) {
    var row = (L.modelOf(b.row) === 'osi' ? b.row.slice(1) + ' ' : '') + t('row_' + b.row);
    return h('div', {
      class: 'om-br', dataset: { side: side, v: b.v === 'moved' || b.v === 'wrong' ? b.v : '' },
      role: 'img', 'aria-label': t('bracketAria', { card: plain('c_' + b.id), row: row }),
      style: { gridColumn: gridCol, gridRow: gridRow }
    }, h('span', { class: 'om-badge', 'aria-hidden': 'true' }, String(numberOf(b.id, cards))));
  }

  function tray(p, lay, cards, track) {
    var selPlaced = page.sel && L.visibleRow(page.placed[page.sel], p);
    var note = p.reveal ? t('trayRevealHint') : lay.tray.length ? null : t('trayEmpty');
    return h('div', { class: 'om-tray', role: 'group', 'aria-label': t('tray'), style: { gridColumn: track.col, gridRow: track.row } },
      h('div', { class: 'om-tray-top' },
        h('span', { class: 'om-tray-title' }, t('tray')),
        h('button', { type: 'button', class: 'om-clear', 'aria-keyshortcuts': 'K', title: t('clearKey'), onmousedown: noFocus,
          onclick: function () { clearAll(window.simdeck); } }, '↺ ', t('clear'), ' ', h('kbd', null, 'K'))),
      selPlaced ? h('button', { type: 'button', class: 'om-return', onmousedown: noFocus, onclick: toTray }, '↩ ', t('trayReturn')) : null,
      note ? h('div', { class: 'om-tray-note' }, note) : null,
      h('div', { class: 'om-cards' }, lay.tray.map(function (id) {
        var long = !!window.SimStrings[Simdeck.lang]['q_' + id];
        return h('button', {
          type: 'button', class: 'om-card', dataset: { long: long ? '1' : null },
          'aria-pressed': String(page.sel === id), onmousedown: noFocus, onclick: function () { select(id); }
        },
          isDevice(id) ? h('span', { class: 'om-badge' }, String(numberOf(id, cards))) : null,
          h('span', { class: 'om-label' }, rich('c_' + id)),
          long ? h('span', { class: 'om-q' }, rich('q_' + id)) : null);
      })));
  }

  /** The verdict, reason and note of one card as it stands (placed, or revealed at its answer). */
  function judged(id, p) {
    var r = L.visibleRow(page.placed[id], p), out = [h('b', null, rich('c_' + id)), ' '];
    if (r) {
      var v = L.check(id, r, p.layers5);
      out.push('→ ', rowWords(r), ': ', h('span', { class: 'sd-hl' }, t('v_' + v)), '. ');
      out = out.concat(rich('r_' + id));
      var n = L.note(id, r, p.layers5);
      if (n) out.push(' ', t('n_' + n));
      return out;
    }
    var a = visibleModels(p).map(function (m) { return L.answer(id, m, p.layers5); }).filter(Boolean)[0];
    out.push(a ? t('capAnswer', { row: rowWords(a) }) : t('capAnswerNone'), ' ');
    return out.concat(rich('r_' + id));
  }

  function caption(c) {
    var p = c.params, cards = c.state.cards;
    var placedN = cards.filter(function (id) { return L.visibleRow(page.placed[id], p); }).length;
    var count = t('capCount', { n: placedN, m: cards.length });
    var last = page.last;
    // a card whose column was just hidden is back in the tray: say nothing about where it was
    if (last && last.kind === 'placed' && !L.visibleRow(page.placed[last.card], p)) last = null;
    if (last && last.kind === 'noPick') return t('capNoPick');
    if (page.sel) {
      if (p.reveal) return judged(page.sel, p);
      var on = L.visibleRow(page.placed[page.sel], p);
      return rich(on ? 'capPickedPlaced' : 'capPicked', { card: h('b', null, rich('c_' + page.sel)) });
    }
    if (last && last.kind === 'placed') {
      if (p.reveal) return judged(last.card, p);
      var out = rich('capPlaced', { card: h('b', null, rich('c_' + last.card)), row: rowWords(L.visibleRow(last.row, p) || last.row) });
      out.push(' ', count);
      if (placedN === cards.length) out.push(' ', t('capTurnOn'));
      return out;
    }
    if (last && last.kind === 'returned') {
      var back = rich('capReturned', { card: h('b', null, rich('c_' + last.card)) });
      back.push(' ', count);
      return back;
    }
    if (p.reveal) {
      var s = L.score(page.placed, p);
      return [t('capScore', s), ' ', t('capScoreHint')];
    }
    return placedN ? [t('capStart'), ' ', count] : t('capStart');
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'set', type: 'choice', label: t('set'), options: Object.keys(L.SETS).map(function (k) { return [k, t('set_' + k)]; }) },
      { key: 'model', type: 'choice', label: t('model'), options: [['osi', t('model_osi')], ['tcpip', t('model_tcpip')], ['both', t('model_both')]],
        disabled: function (p) { return p.set === 'vocab' ? t('modelVocab') : false; } },
      { key: 'layers5', type: 'toggle', label: t('layers5') },
      { key: 'reveal', type: 'toggle', label: t('reveal') }
    ],
    keys: [{ key: 'k', label: t('clearKey'), run: clearAll }],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t('p_' + x.id), hint: t('p_' + x.id + 'Hint'), params: x.params };
    }),

    legend: [
      { shape: 'bracket', label: t('legendBracket') },
      { shape: 'ok', label: t('legendOk') },
      { shape: 'both', label: t('legendBoth') },
      { shape: 'wrong', label: t('legendWrong') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
