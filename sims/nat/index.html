[data-sim="nat"] .nt-pkt { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2cqw; align-items: stretch; }

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">NAT: tablica prijevoda</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function data(text, cls) { return h('span', { translate: 'no', class: 'nt-addr' + (cls ? ' ' + cls : '') }, text); }
  function bold(text) { return h('b', { translate: 'no' }, text); }
  function sock(e) { return e.ip + ':' + e.port; }
  function both(list) {
    var out = [];
    list.forEach(function (x, j) { if (j) out.push(j === list.length - 1 ? t('listAnd') : ', '); out.push(bold(x)); });
    return h('span', null, out);
  }
  var SRV = sock(L.server);

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { mode: 'pat', second: 'B', probe: '61050' } },
    { id: 'open-port', label: t('presetOpen'), hint: t('presetOpenHint'), params: { mode: 'pat', second: 'B', probe: '61000' } },
    { id: 'same-host', label: t('presetTwice'), hint: t('presetTwiceHint'), params: { mode: 'pat', second: 'A', probe: '61050' } },
    { id: 'basic-one', label: t('presetBasic'), hint: t('presetBasicHint'), params: { mode: 'basic', second: 'B', probe: '61050' } },
    { id: 'basic-two', label: t('presetBasic2'), hint: t('presetBasic2Hint'), params: { mode: 'basic2', second: 'B', probe: '61050' } }
  ];

  /** A packet card: label, source, destination; `changed` names the field R rewrote ('src' or 'dst'). */
  function card(label, pkt, changed) {
    return h('div', { class: 'nt-card' },
      h('span', { class: 'nt-small' }, label),
      h('span', null, t('src')),
      pkt.src ? data(sock(pkt.src), 'nt-field' + (changed === 'src' ? ' sd-changed' : '')) : h('span', { class: 'nt-field' }, t('anyOutside')),
      h('span', null, t('dst')),
      data(sock(pkt.dst), 'nt-field' + (changed === 'dst' ? ' sd-changed' : '')));
  }
  function empty(label, msg) {
    return h('div', { class: 'nt-card nt-none' }, h('span', { class: 'nt-small' }, label), h('span', { class: 'nt-msg' }, msg));
  }
  /** Where a dropped packet would have gone: no packet, only the word that R dropped it. */
  function dropped(label) {
    return h('div', { class: 'nt-card nt-drop sd-hatch' }, h('span', { class: 'nt-small' }, label), h('span', { class: 'nt-dropmsg' }, t('dropped')));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: [['pat', t('modePat')], ['basic', t('modeBasic')], ['basic2', t('modeBasic2')]] },
      { key: 'second', type: 'choice', label: t('second'), options: [['B', t('secondB')], ['A', t('secondA')]] },
      { key: 'probe', type: 'choice', label: t('probe'), options: L.probes.map(function (p) { return [p, p]; }) }
    ],

    presets: presets,

    legend: [
      { shape: 'hl', label: t('legendChanged') },
      { c: 1, label: t('legendNew') },
      { shape: 'hollow', label: t('legendDrop') }
    ],

    render: function (c) {
      var s = c.state, e = s.event, fwd = c.dir === 'forward', pat = s.mode === 'pat';
      var active = e && e.who && (e.kind !== 'probe' || e.outcome === 'deliver') ? e.who : null;

      // the three places
      var hosts = ['A', 'B'].map(function (k) {
        return h('div', { class: 'nt-host' + (active === k ? ' nt-active' : '') },
          h('span', { class: 'nt-name', translate: 'no' }, k), data(L.hosts[k] + ':' + L.srcPort));
      });
      var topo = h('div', { class: 'nt-topo' },
        h('div', { class: 'nt-box' }, h('span', { class: 'nt-small' }, t('insideNet')), hosts),
        h('div', { class: 'nt-box nt-router' },
          h('span', null, t('router'), ' ', bold('R')),
          h('span', { class: 'nt-small' }, t(s.outside.length > 1 ? 'outsideAddrs' : 'outsideAddr')),
          s.outside.map(function (a) { return data(a); })),
        h('div', { class: 'nt-box' }, h('span', { class: 'nt-small' }, t('internet')),
          h('div', { class: 'nt-host' + (e && (e.kind === 'out' || e.kind === 'reply') ? ' nt-active' : '') }, h('span', null, t('server')), data(SRV)),
          h('div', { class: 'nt-host' + (e && e.kind === 'probe' ? ' nt-active' : '') }, h('span', null, t('someone')))));

      // the packet on each side of R
      var inside, outside, dir = '';
      if (!e) { inside = empty(t('pktInside'), t('noPacket')); outside = empty(t('pktOutside'), t('noPacket')); }
      else if (e.kind === 'noreply') { inside = empty(t('pktInside'), t('notSent')); outside = empty(t('pktOutside'), t('notSent')); }
      else if (e.kind === 'out') {
        dir = '→';
        inside = card(t('pktInside'), e.before, null);
        outside = e.after ? card(t('pktOutside'), e.after, 'src') : dropped(t('pktOutside'));
      } else {
        dir = '←';
        outside = card(t('pktOutside'), e.before, null);
        inside = e.after ? card(t('pktInside'), e.after, 'dst') : dropped(t('pktInside'));
      }
      if (fwd && e) (e.kind === 'out' ? outside : inside).classList.add('sd-anim-in');
      var pkt = h('div', { class: 'nt-pkt' }, inside, h('div', { class: 'nt-dir', 'aria-hidden': 'true' }, dir), outside);

      // the translation table (Basic NAT binds addresses, so its inside and outside columns show addresses only)
      var cells = [
        h('span', { class: 'nt-cell nt-small nt-head', style: { '--r': '1', gridColumn: '1' } }, t('colInside')),
        h('span', { class: 'nt-cell nt-small nt-head', style: { '--r': '1', gridColumn: '2' } }, t('colOutside')),
        h('span', { class: 'nt-cell nt-small nt-head', style: { '--r': '1', gridColumn: '3' } }, t('colDest'))
      ];
      if (!s.table.length) cells.push(h('span', { class: 'nt-empty', style: { '--r': '2' } }, t('tableEmpty')));
      s.table.forEach(function (row, k) {
        var r = String(k + 2), here = e && e.row === k;
        var fresh = here && e.outcome === 'new', used = here && !fresh;
        var on = fresh ? ' nt-on' : '';
        cells.push(h('div', { class: 'nt-frame' + (fresh ? ' sd-fill' + (fwd ? ' sd-anim-in' : '') : used ? ' nt-used' : ''), dataset: fresh ? { c: '1' } : null, style: { '--r': r } }));
        cells.push(h('span', { class: 'nt-cell nt-c1' + on, dataset: { k: t('colInside') }, style: { '--r': r, gridColumn: '1' } }, data(pat ? sock(row.inside) : row.inside.ip)));
        cells.push(h('span', { class: 'nt-cell' + on, dataset: { k: t('colOutside') }, style: { '--r': r, gridColumn: '2' } }, data(pat ? sock(row.outside) : row.outside.ip)));
        cells.push(h('span', { class: 'nt-cell' + on, dataset: { k: t('colDest') }, style: { '--r': r, gridColumn: '3' } }, data(sock(row.dest))));
        if (fresh || used) cells.push(h('span', { class: 'nt-tag ' + (fresh ? 'nt-tag-new nt-on' : 'nt-tag-used'), style: { '--r': r } }, t(fresh ? 'tagNew' : 'tagUsed')));
      });
      var table = h('div', { class: 'nt-tablebox' }, h('span', { class: 'nt-small' }, t('tableTitle')), h('div', { class: 'nt-table' }, cells));

      c.stage.replaceChildren(h('div', { class: 'nt' }, topo, pkt, table));
    },

    caption: function (c) {
      var s = c.state, e = s.event, pat = s.mode === 'pat';
      if (!e) {
        return t.parts('captionStart', {
          a: bold(L.hosts.A), b: bold(L.hosts.B), srv: bold(SRV), port: bold(String(L.srcPort)),
          out: h('span', null, s.outside.length > 1 ? t.parts('captionStartTwo', { addrs: both(s.outside) }) : t.parts('captionStartOne', { addr: bold(s.outside[0]) }))
        });
      }
      var who = bold(e.who || '');
      if (e.kind === 'out') {
        if (e.outcome === 'nofree') {
          return t.parts('captionNoFree', { who: who, addr: bold(s.outside[0]), same: bold(s.outside[0] + ':' + L.srcPort + ' → ' + SRV) });
        }
        var v = { who: who, from: bold(sock(e.before.src)), to: bold(sock(e.after.src)), srv: bold(SRV), addr: bold(e.after.src.ip) };
        if (e.outcome === 'reuse') return t.parts(pat ? 'captionReusePat' : 'captionReuseBasic', v);
        if (!pat) return t.parts('captionOutBasic', v);
        var out = t.parts('captionOutPat', v);
        if (s.table.length === 2) out = out.concat([' ', h('span', { class: 'sd-hl' }, t.parts('captionOutPatSecond', { port: bold(String(L.srcPort)) }))]);
        return out;
      }
      if (e.kind === 'noreply') return t.parts('captionNoReply', { who: who });
      if (e.kind === 'reply') return t.parts('captionReply', { who: who, dst: bold(sock(e.before.dst)), to: bold(sock(e.after.dst)) });
      var w = { who: who, dst: bold(sock(e.before.dst)), to: e.after ? bold(sock(e.after.dst)) : null, addr: bold(e.before.dst.ip) };
      if (e.outcome === 'drop') return t.parts('captionProbeDrop', w);
      return t.parts(pat ? 'captionProbePat' : 'captionProbeBasic', w);
    }
  });
})();
</script>
</body>
