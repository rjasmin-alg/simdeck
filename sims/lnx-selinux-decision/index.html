<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);
  var CLS = { owner: 'clsOwner', group: 'clsGroup', other: 'clsOther' };

  /** Data (commands, types, paths, user names, mode names) is not language: the word check skips translate="no". */
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function data(s, cls) { return h('span', Object.assign({ translate: 'no' }, cls ? { class: cls } : {}), String(s)); }
  function userOf(uid) { return L.USERS[uid] || String(uid); }
  function has(s, mark) { return s.changed.indexOf(mark) >= 0; }
  function anim(c, on) { return on && c.dir === 'forward' ? ' sd-anim-in' : ''; }

  /** A context user:role:type[:range] with the type in bold and the rest muted; a line may break after a colon. */
  function ctxNode(context, cls) {
    var f = String(context).split(':');
    var out = [];
    f.forEach(function (x, i) {
      if (i) out.push(h('span', { class: 'sx-dim' }, ':'), h('wbr'));
      out.push(i === 2 ? h('b', null, x) : h('span', { class: 'sx-dim' }, x));
    });
    return h('span', { class: 'sx-ctx' + (cls ? ' ' + cls : ''), translate: 'no' }, out);
  }
  /** ✓ yes / ✕ no / – not asked / … waiting, as a symbol and a word. */
  function verdict(v, words, changed, c) {
    var sym = { yes: '✓', no: '✕', skip: '–', wait: '…' }[v];
    if (!sym) return h('div', { class: 'sx-v', 'aria-hidden': 'true' }, ' ');
    return h('div', { class: 'sx-v' + (changed ? ' sd-changed' + anim(c, true) : ''), dataset: { v: v } },
      h('span', { class: 'sx-sym', 'aria-hidden': 'true' }, sym), ' ', words);
  }
  function gateNo(n) { return h('span', { class: 'sx-gno', 'aria-hidden': 'true' }, String(n)); }

  // ── the command of this step ──
  function cmdLine(s) {
    var acting = s.phase === 'action' || s.phase === 'attempt';
    if (s.cmd) return h('div', { class: 'sx-cmd', 'aria-label': t('cmdLabel') }, h('span', { class: 'sx-prompt', 'aria-hidden': 'true' }, '$'),
      h('code', { translate: 'no', class: acting ? 'sd-changed' : null }, s.cmd));
    var say = s.phase === 'start' ? t('before')
      : s.scene === 'keys' ? t('readsKeys') : s.actions[s.actions.length - 1] === 'reboot' ? t('boots') : t('noCmd');
    return h('div', { class: 'sx-cmd', 'aria-label': t('cmdLabel') }, h('span', { class: 'sx-prompt', 'aria-hidden': 'true' }, '$'),
      h('span', { class: 'sx-say' }, say));
  }

  // ── the decision path ──
  function gateStates(s) {
    var inTry = s.phase !== 'start' && s.phase !== 'action';
    var g1 = s.dac === true ? 'yes' : s.dac === false ? 'no' : inTry ? 'wait' : 'idle';
    var g2 = s.mac === true ? 'yes' : s.mac === false ? 'no' : s.dac === false ? 'skip' : s.dac === true ? 'wait' : 'idle';
    var g3 = s.enforced === true ? 'no' : s.enforced === false ? 'yes' : s.dac === false || s.mac === true ? 'skip' : s.mac === false ? 'wait' : 'idle';
    var g4 = s.outcome === 'allowed' ? 'yes' : s.outcome === 'denied' ? 'no' : inTry && (g1 === 'no' || g2 === 'yes' || g3 === 'yes' || g3 === 'no') ? 'wait' : 'idle';
    return [g1, g2, g3, g4];
  }

  function procBox(s) {
    return h('section', { class: 'sx-box sx-gate', dataset: { v: s.phase === 'attempt' ? 'wait' : 'idle' } },
      h('h3', null, t('proc')),
      h('div', { class: 'sx-comm', translate: 'no' }, s.proc.comm),
      h('div', { class: 'sx-detail' }, t.parts('uid', { uid: data(s.proc.uid), user: data(userOf(s.proc.uid)) })),
      ctxNode(s.proc.scontext),
      h('div', { class: 'sx-detail' }, t('wants'), ' ', data(s.perm + ' · ' + s.tclass)));
  }

  function dacBox(s, v, c) {
    var detail;
    if (s.obj.kind === 'port') detail = h('div', { class: 'sx-detail' }, t('dacPort'));
    else {
      var why = s.dacWhy;
      var trip = [s.obj.mode.slice(0, 3), s.obj.mode.slice(3, 6), s.obj.mode.slice(6, 9)];
      var on = why ? { owner: 0, group: 1, other: 2 }[why.cls] : -1;
      detail = h('div', { class: 'sx-detail' },
        h('div', { translate: 'no' }, '-', trip.map(function (x, i) { return h('span', { class: 'sx-trip', dataset: i === on ? { on: '' } : {} }, x); })),
        h('div', { translate: 'no' }, userOf(s.obj.owner) + ' ' + userOf(s.obj.group)),
        why ? h('div', null, t.parts('dacAs', { user: data(userOf(s.proc.uid)), cls: t(CLS[why.cls]) }), ' · ', t('dacNeed')) : null);
    }
    var words = v === 'yes' ? t('yes') : v === 'no' ? t('no') : v === 'wait' ? t('waiting') : '';
    return h('section', { class: 'sx-box sx-gate', dataset: { v: v } },
      h('h3', null, gateNo(1), t('gate1')), h('div', { class: 'sx-who' }, t('gate1Who')),
      detail, verdict(v, words, has(s, 'dac'), c));
  }

  function macBox(s, v, c) {
    var req = data(L.typeOf(s.proc.scontext) + ' → ' + L.typeOf(s.obj.tcontext));
    var words = v === 'yes' ? [t('yes'), ' · ', t('ruleN', { n: s.macAt + 1 })] : v === 'no' ? [t('no'), ' · ', t('noRule')]
      : v === 'skip' ? t('notAsked') : v === 'wait' ? t('waiting') : '';
    return h('section', { class: 'sx-box sx-gate', dataset: { v: v } },
      h('h3', null, gateNo(2), t('gate2')), h('div', { class: 'sx-who' }, t('gate2Who')),
      h('div', { class: 'sx-detail' }, h('b', null, req), h('br'), data(s.tclass + ' ' + s.perm)),
      verdict(v, words, has(s, 'mac'), c));
  }

  function modeBox(s, v, c) {
    var sw = h('div', { class: 'sx-switch' + (has(s, 'mode') ? ' sd-changed' : ''), translate: 'no' },
      h('span', { dataset: s.mode === 'enforcing' ? { on: '' } : {} }, 'enforcing'),
      h('span', { dataset: s.mode === 'permissive' ? { on: '' } : {} }, 'permissive'));
    // the mode box answers whether a "no" is enforced: enforced reads as a closed gate, let through as an open one
    var words = v === 'no' ? t('enforces') : v === 'yes' ? t('letsThrough') : v === 'skip' ? t('notAsked') : v === 'wait' ? t('waiting') : '';
    return h('section', { class: 'sx-box sx-gate', dataset: { v: v } },
      h('h3', null, gateNo(3), t('gateMode')), sw,
      h('div', { class: 'sx-who' }, t('gateModeWho'), ' ', data(s.configMode)),
      verdict(v, words, has(s, 'mode-gate'), c));
  }

  function outBox(s, v, c) {
    var words = v === 'yes' ? (s.enforced === false ? t('allowedLogged') : t('allowed')) : v === 'no' ? t('denied') : v === 'wait' ? t('waiting') : '';
    return h('section', { class: 'sx-box sx-gate', dataset: { v: v } },
      h('h3', null, t('outcome')),
      h('div', { class: 'sx-out-word' }, verdict(v, words, has(s, 'outcome'), c)));
  }

  function arrow() { return h('span', { class: 'sx-arrow', 'aria-hidden': 'true' }, '→'); }

  // ── the object ──
  function objectBox(s, c) {
    if (s.obj.kind === 'port') {
      var ports = Object.keys(s.portLabels).map(Number).sort(function (a, b) { return a - b; });
      return h('section', { class: 'sx-box' },
        h('h3', null, t('object'), ': ', t('objPort', { port: s.obj.name })),
        ctxNode(s.obj.tcontext, has(s, 'port:' + s.obj.name) ? 'sd-changed' : ''),
        h('div', { class: 'sx-meta' }, t('portTable')),
        h('table', { class: 'sx-ports', translate: 'no' }, h('tbody', null, ports.map(function (p) {
          var ch = has(s, 'port:' + p);
          return h('tr', { class: ch ? 'sd-changed' + anim(c, true) : null, dataset: String(p) === s.obj.name ? { target: '' } : {} },
            h('td', null, 'tcp ' + p), h('td', null, '→'), h('td', null, s.portLabels[p]));
        }))));
    }
    var rows = s.files.map(function (f) {
      var whole = has(s, 'file:' + f.inode), typeOnly = has(s, 'file:' + f.inode + ':type');
      return h('div', { class: 'sx-file' + (whole ? ' sd-changed' + anim(c, true) : ''), dataset: f.path === s.obj.name ? { target: '' } : {} },
        h('div', { class: 'sx-file-head' }, h('span', { class: 'sx-path-name', translate: 'no' }, f.path),
          h('span', { class: 'sx-meta' }, t('inode', { n: f.inode })),
          whole && s.action === 'cp' ? h('span', { class: 'sx-tag' }, t('newFile')) : null),
        h('div', { class: 'sx-ls', translate: 'no' }, '-' + f.mode + ' ' + userOf(f.owner) + ' ' + userOf(f.group)),
        ctxNode(f.tcontext, typeOnly ? 'sd-changed' : ''));
    });
    return h('section', { class: 'sx-box' }, h('h3', null, t('object')), h('div', { class: 'sx-rows' }, rows));
  }

  // ── what you see ──
  function seenBox(s) {
    var body;
    if (s.scene === 'port') {
      var lch = has(s, 'listening');
      var sshPorts = Object.keys(s.portLabels).map(Number).filter(function (p) { return s.portLabels[p] === 'ssh_port_t'; })
        .sort(function (a, b) { return b - a; });
      body = h('div', { class: 'sx-term', translate: 'no' },
        h('div', { class: 'sx-in' }, '$ systemctl is-active sshd'), h('div', { class: 'sx-out' }, 'active'),
        h('div', { class: 'sx-in' }, '$ sudo ss -tlnp | grep sshd'),
        s.listening.map(function (p) { return h('div', { class: 'sx-out' + (lch ? ' sd-changed' : '') }, 'LISTEN  0.0.0.0:' + p + '  sshd'); }),
        h('div', { class: 'sx-in' }, '$ sudo semanage port -l | grep ssh_port_t'),
        h('div', { class: 'sx-out' + (has(s, 'port:8991') ? ' sd-changed' : '') }, 'ssh_port_t   tcp   ' + sshPorts.join(', ')));
    } else if (s.scene === 'keys') {
      var lw = s.seen === 'ok' ? t('loginOk') : s.seen === 'denied' ? t('loginNo') : t('loginNotYet');
      body = h('div', { class: 'sx-login' }, t('keyLogin'), ' ', h('b', { class: has(s, 'outcome') ? 'sd-changed' : null }, lw));
    } else {
      var out = s.seen === 'ok' ? h('div', { class: 'sx-out' + (has(s, 'outcome') ? ' sd-changed' : '') }, t('fileText'))
        : s.seen === 'denied' ? h('div', { class: 'sx-out' + (has(s, 'outcome') ? ' sd-changed' : ''), translate: 'no' }, 'cat: ' + s.obj.name + ': Permission denied')
        : h('div', { class: 'sx-empty' }, t('notRunYet'));
      body = h('div', { class: 'sx-term' }, h('div', { class: 'sx-in', translate: 'no' }, '$ cat ' + s.obj.name), out);
    }
    return h('section', { class: 'sx-box' }, h('h3', null, t('seen')), body);
  }

  // ── the policy table (K4) ──
  function policyTable(s, c) {
    var req = { src: L.typeOf(s.proc.scontext), tgt: L.typeOf(s.obj.tcontext), tclass: s.tclass, perm: s.perm };
    var lk = s.macAt !== null ? L.lookup(s.policy, req) : null;
    var at = lk ? lk.at : -1;
    var table = RT({
      dir: c.dir,
      mode: 'first',
      title: t('policyTitle'),
      columns: [{ key: 'src', label: t('colSrc') }, { key: 'tgt', label: t('colTgt') }, { key: 'tclass', label: t('colClass') }, { key: 'perm', label: t('colPerm') }],
      actionLabel: '',
      markLabel: data(s.proc.comm),
      rows: s.policy.map(function (r, i) {
        var read = lk && i <= at;
        return { no: i + 1, cells: { src: r.src, tgt: r.tgt, tclass: r.tclass, perm: r.perm }, action: '', effect: 'allow',
          hit: read ? lk.rows[i].hit : null, miss: read && !lk.rows[i].hit ? lk.rows[i].miss : [] };
      }),
      implicit: { text: t('implicit'), action: '', effect: 'deny' },
      at: at,
      subject: { mark: s.proc.comm, c: 1 },
      done: s.mac !== null,
      outcome: function (i) { return RT.verdict(i < s.policy.length, t(i < s.policy.length ? 'allowed' : 'denied')); },
      words: { win: t('markWin'), skip: t('markSkip') },
      changed: has(s, 'mac'),
      stickyMark: true,
      className: s.dac === false ? 'sx-off' : null
    });
    if (s.dac === false) table.append(h('p', { class: 'sx-note' }, t('notConsulted')));
    return table;
  }

  // ── the audit log ──
  function avcLine(a, isNew) {
    var where = a.src != null ? 'src=' + a.src : 'name="' + a.name + '"';
    return h('div', { class: 'sx-avc' + (isNew ? ' sd-changed' : ''), dataset: isNew ? {} : { old: '' }, translate: 'no' },
      h('span', { class: 'sx-den' }, 'denied { ' + a.perm + ' }'), h('span', null, 'comm="' + a.comm + '"'), h('span', null, where),
      h('span', null, 'scontext=', ctxNode(a.scontext)), h('span', null, 'tcontext=', ctxNode(a.tcontext)),
      h('span', null, 'tclass=' + a.tclass), h('span', { class: a.permissive ? 'sx-perm1' : null }, 'permissive=' + a.permissive));
  }
  function auditBox(s) {
    var fresh = has(s, 'audit');
    var lines = s.audit.map(function (a, i) { return avcLine(a, fresh && i === s.audit.length - 1); });
    return h('section', { class: 'sx-box sx-audit' },
      h('h3', null, t('auditTitle')), data('ausearch -m AVC', 'sx-meta'),
      lines.length ? h('div', { class: 'sx-avcs' }, lines) : h('div', { class: 'sx-empty' }, t('auditEmpty')));
  }

  // ── captions ──

  /** Caption parts with `backticked` text turned into code (commands and file names are data, not words). */
  function rich(parts) {
    var out = [];
    (Array.isArray(parts) ? parts : [parts]).forEach(function (p) {
      if (typeof p !== 'string') { out.push(p); return; }
      p.split('`').forEach(function (bit, i) { if (bit) out.push(i % 2 ? code(bit) : bit); });
    });
    return out;
  }
  function caption(c) { return rich(captionParts(c)); }
  function captionParts(c) {
    var s = c.state;
    var tObj = code(L.typeOf(s.obj.tcontext)), tSrc = code(L.typeOf(s.proc.scontext));
    var cmd = s.cmd ? code(s.cmd) : null;
    switch (s.phase) {
      case 'start':
        if (s.scene === 'port') return t('cStartPort');
        if (s.scene === 'keys') return t.parts('cStartKeys', { path: code(s.obj.name), type: tObj });
        return t.parts('cStartSecret', { path: code(s.obj.name) });
      case 'action': {
        var ch = s.changed.length > 0;
        switch (s.action) {
          case 'cp': {
            var copy = s.files.filter(function (f) { return f.path === '/tmp/ak'; })[0];
            return t.parts('cCp', { cmd: cmd, type: code(L.typeOf(copy.tcontext)), old: tObj });
          }
          case 'mv': return t.parts('cMv', { cmd: cmd, type: tObj });
          case 'semanage': return t.parts('cSemanage', { cmd: cmd, port: code(s.obj.name), type: tObj });
          case 'restorecon': return t.parts(ch ? 'cRestorecon' : 'cRestoreconSame', { cmd: cmd, type: tObj });
          case 'setenforce0': case 'setenforce1':
            return ch ? t.parts(s.action === 'setenforce0' ? 'cSetenforce0' : 'cSetenforce1', { cmd: cmd }) : t.parts('cSetenforceSame', { cmd: cmd, mode: code(s.mode) });
          default: return t.parts('cReboot', { cmd: cmd });
        }
      }
      case 'attempt': {
        var v = { comm: code(s.proc.comm), type: tSrc, perm: code(s.perm), tclass: code(s.tclass), path: code(s.obj.name), port: code(s.obj.name) };
        if (s.scene === 'port') return t.parts(s.cmd ? 'cAttemptPort' : 'cAttemptBoot', v);
        return t.parts(s.scene === 'keys' ? 'cAttemptKeys' : 'cAttemptSecret', v);
      }
      case 'dac': {
        if (s.dacWhy.cls === 'port') return t.parts('cDacPort', { port: code(s.obj.name) });
        return t.parts(s.dac ? 'cDacYes' : 'cDacNo', { user: code(userOf(s.proc.uid)), cls: t(CLS[s.dacWhy.cls]), bits: code(s.dacWhy.bits) });
      }
      case 'mac':
        if (s.mac) return t.parts('cMacYes', { n: String(s.macAt + 1), src: tSrc, tgt: tObj });
        return t.parts(s.perm === 'name_bind' ? 'cMacNoBind' : 'cMacNoRead', { src: tSrc, tgt: tObj });
      case 'mode':
        return t(s.enforced ? 'cModeEnf' : 'cModePerm');
      default: {
        var ok = s.outcome === 'allowed', perm = ok && s.enforced === false;
        if (s.scene === 'port') return t(ok ? (perm ? 'cOutPortPerm' : 'cOutPortYes') : 'cOutPortNo');
        if (s.scene === 'keys') return ok ? (perm ? t.parts('cOutKeysPerm', { type: tObj }) : t('cOutKeysYes')) : t('cOutKeysNo');
        if (ok) return t('cOutSecretYes');
        return s.mode === 'permissive' ? [t('cOutSecretNo'), ' ', t('nPermNoHelp')] : t('cOutSecretNo');
      }
    }
  }

  // ── the stage ──
  function render(c) {
    var s = c.state;
    var g = gateStates(s);
    var path = h('div', { class: 'sx-path' },
      procBox(s), arrow(), dacBox(s, g[0], c), arrow(), macBox(s, g[1], c), arrow(), modeBox(s, g[2], c), arrow(), outBox(s, g[3], c));
    var low = h('div', { class: 'sx-low' },
      h('div', { class: 'sx-col' }, objectBox(s, c), seenBox(s)),
      h('div', { class: 'sx-col' }, policyTable(s, c)));
    c.stage.replaceChildren(h('div', { class: 'sx' }, cmdLine(s), path, low, auditBox(s)));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'choice', label: t('scene'), resets: true,
        options: [['port', t('sPort')], ['keys', t('sKeys')], ['secret', t('sSecret')]] },
      { key: 'mode', type: 'choice', label: t('mode'), options: [['enforcing', t('modeEnforcing')], ['permissive', t('modePermissive')]] },
      { key: 'fix', type: 'choice', label: t('fix'), hint: t('fixHint'),
        options: [['none', t('fixNone')], ['relabel', t('fixRelabel')], ['setenforce', t('fixSetenforce')]] },
      { key: 'undo', type: 'choice', label: t('undo'), options: [['setenforce1', t('undoSetenforce')], ['reboot', t('undoReboot')]],
        visible: function (p) { return p.fix === 'setenforce'; } },
      { key: 'dacOk', type: 'toggle', label: t('dacOk'), hint: t('dacOkHint'),
        disabled: function (p) { return p.scene !== 'secret' ? t('dacOkOff') : false; } }
    ],

    presets: [
      { id: 'sshd-8991', label: t('pPort'), params: { scene: 'port', fix: 'relabel' } },
      { id: 'permissive-switch', label: t('pPermissive'), params: { scene: 'port', fix: 'setenforce', undo: 'setenforce1' } },
      { id: 'mv-label', label: t('pMvLabel'), params: { scene: 'keys', fix: 'relabel' } },
      { id: 'dac-first', label: t('pDacFirst'), params: { scene: 'secret', dacOk: false } }
    ],

    legend: [
      { shape: 'sx-yes', label: t('legendYes') },
      { shape: 'sx-no', label: t('legendNo') },
      { shape: 'sx-skip', label: t('legendSkip') },
      { shape: 'sx-avc', label: t('legendAvc') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
