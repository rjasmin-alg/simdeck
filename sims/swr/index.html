<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var W = 1000;                 // the plot's viewBox width; x in λ maps to W·x / LEN
  var MID = 50, SCALE = 22;     // y of the axis and per unit of voltage, in the plot's 0…100 box (±2 → 6 … 94)
  var PERIOD = 2400;            // ms per cycle of the instantaneous voltage
  var sim = null;

  // ── numbers: data, not language (translate="no"); the decimal comma in Croatian ──
  function num(x, digits) {
    var s = String(Number(x.toFixed(digits)));
    if (s === '-0') s = '0';
    s = s.replace('-', '−');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function swrText(v) { var s = L.shown(v); return s === null ? '∞' : num(s, 2); }
  function pctText(v) { return num(v, 1) + ' %'; }
  function wText(v) { return num(v, 1) + ' W'; }
  function gammaText(g) { return (g > 0 ? '+' : '') + num(g, 2); }
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function svg(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }
  function pctX(x) { return (100 * x / L.LEN) + '%'; }
  function yOf(v) { return MID - SCALE * v; }
  function pathOf(points, sign) {
    return points.map(function (p, i) { return (i ? 'L' : 'M') + (W * p.x / L.LEN).toFixed(2) + ' ' + yOf(sign * p.v).toFixed(3); }).join('');
  }
  /** "U_max" with the subscript as markup; symbols, so the same in both languages. */
  function sym(base, sub) { return h('span', { translate: 'no' }, base, h('sub', null, sub)); }

  // ── "changed": the meter values of a card whose SWR class differs from the previous render's ──
  var lastClass = null, marks = { tx: false, load: false };
  function track(s) {
    var now = { tx: s.classTx, load: s.classLoad };
    marks = lastClass ? { tx: now.tx !== lastClass.tx, load: now.load !== lastClass.load } : { tx: false, load: false };
    lastClass = now;
  }

  // ── animation of the instantaneous voltage (never under reduced motion) ──
  var instPath = null, gammaNow = 0, raf = 0, t0 = 0;
  function animating(p) { return !!p.animate && !Simdeck.reducedMotion(); }
  function frame(now) {
    raf = 0;
    if (!instPath || !instPath.isConnected || !sim || !animating(sim.params)) return;
    if (!t0) t0 = now;
    var phase = 2 * Math.PI * ((now - t0) % PERIOD) / PERIOD;
    instPath.setAttribute('d', pathOf(L.instant(gammaNow, phase, 161), 1));
    raf = requestAnimationFrame(frame);
  }
  function startAnim() { if (!raf) raf = requestAnimationFrame(frame); }

  // ── scene parts ──
  function head() {
    var e = svg('svg', { class: 'sw-head', viewBox: '0 0 20 20', 'aria-hidden': 'true' });
    e.append(svg('polygon', { points: '2,1 19,10 2,19' }));
    return e;
  }
  function waves(s) {
    var g = Math.abs(s.gamma);
    var fwd = h('div', { class: 'sw-wave sw-fwd' },
      h('span', { class: 'sw-name' }, t('fwd')),
      h('div', { class: 'sw-arrow' }, h('span', { class: 'sw-bar' }), head()));
    var refl;
    if (g === 0) {
      refl = h('div', { class: 'sw-wave' }, h('span', { class: 'sw-name sw-none' }, t('reflNone')));
    } else {
      var th = Math.max(0.4, 0.9 * g);   // rem: thinner in proportion to |Γ|, never too thin to show it is hollow
      var hd = head(); hd.style.width = hd.style.height = (0.7 + 0.9 * g) + 'rem';
      refl = h('div', { class: 'sw-wave sw-refl' },
        h('span', { class: 'sw-name' }, t('refl'), ' · Γ = ', data(gammaText(s.gamma))),
        h('div', { class: 'sw-arrow' }, h('span', { class: 'sw-bar', style: { height: th + 'rem' } }), hd));
    }
    return h('div', { class: 'sw-waves' }, fwd, refl);
  }

  /** Two maxima next to each other near the middle of the line, for the λ/2 dimension (none when flat). */
  function dimPair(s) {
    var xs = s.maxima;
    if (xs.length < 2) return null;
    var mid = L.LEN / 2, best = 0;
    for (var i = 0; i + 1 < xs.length; i++) if (Math.abs((xs[i] + xs[i + 1]) / 2 - mid) < Math.abs((xs[best] + xs[best + 1]) / 2 - mid)) best = i;
    return [xs[best], xs[best + 1]];
  }
  /** The extreme to label: the one nearest the middle of the line. */
  function nearestMid(xs) {
    return xs.reduce(function (b, x) { return b === null || Math.abs(x - L.LEN / 2) < Math.abs(b - L.LEN / 2) ? x : b; }, null);
  }

  function plot(s, p) {
    var root = svg('svg', { viewBox: '0 0 ' + W + ' 100', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var ns = { 'vector-effect': 'non-scaling-stroke' };
    var line = function (cls, x1, y1, x2, y2) { root.append(svg('line', Object.assign({ class: cls, x1: x1, y1: y1, x2: x2, y2: y2 }, ns))); };
    line('sw-axis', 0, MID, W, MID);
    line('sw-unit', 0, yOf(1), W, yOf(1));
    line('sw-unit', 0, yOf(-1), W, yOf(-1));
    var pair = dimPair(s);
    if (pair) pair.forEach(function (x) { line('sw-guide', W * x / L.LEN, yOf(s.umax), W * x / L.LEN, 100); });
    root.append(svg('path', Object.assign({ class: 'sw-env-low', d: pathOf(s.envelope, -1) }, ns)));
    root.append(svg('path', Object.assign({ class: 'sw-env', d: pathOf(s.envelope, 1) }, ns)));
    instPath = null;
    gammaNow = s.gamma;
    if (animating(p)) {
      instPath = svg('path', Object.assign({ class: 'sw-inst', d: pathOf(L.instant(s.gamma, 0, 161), 1) }, ns));
      root.append(instPath);
    }

    var kids = [root, h('span', { class: 'sw-vlabel', style: { top: MID + '%' } }, t('axisV'))];
    if (s.flat) {
      kids.push(h('span', { class: 'sw-flat', style: { top: yOf(1) + '%' } }, sym('U', 'max'), ' = ', sym('U', 'min'), data(' = 1')));
    } else {
      s.maxima.forEach(function (x) { kids.push(mark(x, s.umax, 'max', null)); });
      s.minima.forEach(function (x) { kids.push(mark(x, s.umin, 'min', null)); });
      var xm = nearestMid(s.maxima), xn = nearestMid(s.minima);
      kids.push(mark(xm, s.umax, 'max', h('b', null, sym('U', 'max'), data(' = ' + num(s.umax, 2)))));
      kids.push(h('span', { class: 'sw-minlabel', style: { left: pctX(xn), top: yOf(s.umin) + '%' } }, sym('U', 'min'), data(' = ' + num(s.umin, 2))));
    }
    return h('div', { class: 'sw-plot' }, kids);
  }
  /** ▲ just above a maximum of the upper envelope, ▼ just above a minimum; with a label above when given. */
  function mark(x, v, kind, label) {
    return h('span', { class: 'sw-mark', dataset: { kind: kind }, style: { left: pctX(x), top: 'calc(' + yOf(v) + '% - 0.35rem)', zIndex: label ? 2 : 1 } },
      label, h('i', { 'aria-hidden': 'true' }, kind === 'max' ? '▲' : '▼'));
  }

  function loadSymbol(end) {
    var e = svg('svg', { viewBox: '0 0 44 32', 'aria-hidden': 'true' });
    if (end === 'load') e.append(svg('polyline', { class: 'sw-sym', points: '2,16 9,16 12,6 18,26 24,6 30,26 33,16 42,16' }));
    else if (end === 'open') { e.append(svg('line', { class: 'sw-sym', x1: 2, y1: 8, x2: 22, y2: 8 })); e.append(svg('line', { class: 'sw-sym', x1: 2, y1: 24, x2: 22, y2: 24 })); }
    else { e.append(svg('polyline', { class: 'sw-sym', points: '2,6 30,6 30,26 2,26' })); }
    return e;
  }
  function ends(s) {
    var tx = h('div', { class: 'sw-end sw-tx' }, h('div', { class: 'sw-box', 'aria-hidden': 'true' }, '∿'), h('b', null, t('tx')),
      h('small', null, sym('P', 'V'), data(' = ' + wText(L.P_FWD))));
    var what = s.end === 'load' ? h('span', { class: 'sw-val', translate: 'no' }, 'R = ' + num(s.R, 2) + ' Ω')
      : h('small', null, t(s.end === 'open' ? 'openEnd' : 'shortEnd'));
    var ld = h('div', { class: 'sw-end sw-ld' }, h('div', { class: 'sw-box' }, loadSymbol(s.end)), h('b', null, t('load')), what,
      h('small', { translate: 'no' }, 'Z₀ = ' + s.Z0 + ' Ω'));
    return [tx, ld];
  }
  function cable(s) {
    var kids = [h('span', { class: 'sw-wire' }), h('span', { class: 'sw-wire' })];
    if (s.lossDb > 0) kids.push(h('span', { class: 'sw-loss' }, t('lossNote', { L: num(s.lossDb, 1) })));
    return h('div', { class: 'sw-cable' }, kids);
  }
  function dims(s) {
    var pair = dimPair(s), kids = [];
    if (pair) kids.push(h('span', { class: 'sw-dim', style: { left: pctX(pair[0]), width: pctX(pair[1] - pair[0]) } }, h('b', { translate: 'no' }, 'λ/2')));
    return h('div', { class: 'sw-dims' }, kids);
  }

  function meter(m, title, changed) {
    var cls = changed ? 'sd-changed' : null;
    var row = function (key, label, value) { return [h('dt', null, label), h('dd', { class: cls, dataset: { k: key }, translate: 'no' }, value)]; };
    return h('section', { class: 'sw-meter' }, h('h3', null, title),
      h('dl', null,
        row('pv', [t('mPv'), ' ', sym('P', 'V')], wText(m.pv)),
        row('pr', [t('mPr'), ' ', sym('P', 'R')], wText(m.pr)),
        row('swr', t('mSwr'), swrText(m.swr)),
        row('refl', t('mRefl'), pctText(m.reflPct))));
  }

  function stage(c) {
    var s = c.state, p = c.params;
    var e = ends(s);
    var scene = h('div', { class: 'sw-scene' }, waves(s), plot(s, p), e[0], e[1], cable(s), dims(s));
    var meters = h('div', { class: 'sw-meters' },
      meter(s.meter.tx, t('meterTx'), marks.tx),
      meter(s.meter.load, t('meterLoad'), marks.load));
    return h('div', { class: 'sw' }, scene, meters);
  }

  // ── caption ──
  function caption(s) {
    var out;
    if (s.end === 'open') out = t('capOpen');
    else if (s.end === 'short') out = t('capShort');
    else {
      var v = { r: num(s.R, 2), z: String(s.Z0), s: swrText(s.swrLoad), pct: pctText(s.reflPct) };
      out = t(s.flat ? 'capMatched' : s.R > s.Z0 ? 'capHigh' : 'capLow', v);
    }
    if (s.lossDb > 0 && !s.flat) {
      out += ' ' + t('capLoss', { L: num(s.lossDb, 1), pct: pctText(s.meter.tx.reflPct), s: swrText(s.meter.tx.swr), sl: swrText(s.swrLoad) });
    }
    return out;
  }

  function key(id) { return id.replace(/-/g, '_'); }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'end', type: 'choice', label: t('end'), options: [['load', t('opt_load')], ['open', t('opt_open')], ['short', t('opt_short')]] },
      { key: 'r', type: 'range', label: t('r'), hint: t('rHint'), min: 0, max: L.R_VALUES.length - 1, step: 1,
        format: function (i) { return num(L.R_VALUES[i], 2) + ' Ω'; },
        disabled: function (p) { return p.end !== 'load' ? t('rOff') : false; } },
      { key: 'z0', type: 'choice', label: t('z0'), options: L.Z0_CHOICES.map(function (z) { return [z, z + ' Ω']; }) },
      { key: 'lossDb', type: 'range', label: t('lossDb'), min: L.LOSS_MIN, max: L.LOSS_MAX, step: 0.5,
        format: function (v) { return num(v, 1) + ' dB'; } },
      { key: 'animate', type: 'toggle', label: t('animate'),
        disabled: function () { return Simdeck.reducedMotion() ? t('animOff') : false; } }
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t('preset_' + key(x.id)), hint: t('hint_' + key(x.id)), params: x.params };
    }),

    legend: [
      { shape: 'sw-fwd', label: t('legFwd') },
      { shape: 'sw-refl', label: t('legRefl') },
      { shape: 'sw-env', label: t('legEnv') },
      { shape: 'sw-inst', label: t('legInst') },
      { shape: 'sw-ext', label: t('legExt') },
      { shape: 'sw-half', label: t('legHalf') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      track(c.state);
      c.stage.replaceChildren(stage(c));
      if (instPath) startAnim();
    },

    caption: function (c) { return caption(c.state); }
  });
})();
</script>
</body>
</html>
