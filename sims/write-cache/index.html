<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (labels, LBAs, times) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { class: 'sd-mono', translate: 'no' }, String(text)); }
  /** A time in ms with the language's decimal mark, at most one decimal: 8, 0,1, 25,5. */
  function num(v) { var x = (Math.round(v * 10) / 10).toFixed(1); if (x.slice(-2) === '.0') x = x.slice(0, -2); return x.replace('.', t('dec')); }

  function opOf(s, id) { for (var i = 0; i < s.ops.length; i++) if (s.ops[i].id === id) return s.ops[i]; return null; }
  function wName(o) { return h('b', { translate: 'no' }, o.label + ' (LBA ' + o.lba + ')'); }
  var JNAME = { X: 'wX', D: 'wD', C: 'wC' };

  /** Caption parts from t(key) or, with n, t.n(key, n): node placeholders are put back where they land (cloned, so a
      node may appear twice), and *English term* becomes <em lang="en"> (the Croatian term rule, for terms the glossary
      lacks). From sims/ssd-internals/index.html (originally sims/lnx-cow-filesystem/index.html). */
  var MARK = '\u0001';
  function rich(key, vars, n) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var text = n === undefined ? t(key, flat) : t.n(key, n, flat);
    var out = [];
    text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
      if (!bit) return;
      bit.split(MARK).forEach(function (piece, j) {
        if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
        else if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }
  function span(parts) { return h('span', null, parts); }

  /** The kind of a write's chip: lost, on disk, dirty (in cache, not on disk), never sent. */
  function kindOf(s, o) {
    if (s.lost.indexOf(o.id) >= 0) return 'lost';
    if (o.durableAt !== null) return 'clean';
    if (o.supersededBy !== null) return 'old';
    if (o.issuedAt === null) return 'never';
    var inCache = s.cache.some(function (c) { return c.id === o.id; });
    return inCache ? 'dirty' : 'noack'; // issued, gone at the cut, never acknowledged: the application knows
  }
  function evIds(s, type) { return s.ev.filter(function (e) { return e.type === type; }).map(function (e) { return e.id; }); }

  var LEGEND = [
    { shape: 'wc-dirty', label: t('legDirty') },
    { shape: 'wc-clean', label: t('legClean') },
    { shape: 'wc-ack', label: t('legAck') },
    { shape: 'wc-lost', label: t('legLost') },
    { shape: 'wc-bat', label: t('legBattery') },
    { shape: 'hl', label: t('legChanged') }
  ];

  // ── stage ──

  function appBox(c) {
    var s = c.state;
    var acked = evIds(s, 'ack');
    return h('section', { class: 'wc-box' }, h('h2', null, t('appTitle')),
      h('ol', { class: 'wc-list' }, s.ops.map(function (o) {
        if (o.kind === 'flush') {
          var st = o.doneAt !== null ? t('flushDone') : o.issuedAt !== null ? t('flushWaits') : t('notYet');

          return h('li', { class: 'wc-row' }, h('span', { class: 'wc-blk', dataset: { k: 'flush' } }, t('flushOp')),

        }
        var k = kindOf(s, o), status;
        if (k === 'lost') status = h('span', { class: 'wc-lost' }, '✕ ', t('legLost'));
        else if (o.ackAt !== null) status = h('span', { class: 'wc-ack', translate: 'no' }, '✓ ', t('ms', { v: num(o.ackAt) }));
        else if (o.issuedAt === null) status = h('span', { class: 'wc-muted' }, s.power === 'on' ? (o.dep === 'flush' ? t('waitFlush') : t('notYet')) : t('neverSent'));
        else status = h('span', { class: 'wc-muted' }, s.power === 'on' ? t('wait') : t('unackedShort'));
        var nowAck = acked.indexOf(o.id) >= 0 || (s.ev.some(function (e) { return e.type === 'cut'; }) && k === 'lost');
        return h('li', { class: 'wc-row' },
          h('span', { class: 'wc-blk', dataset: { k: k } }, data(o.label)),
          h('span', { class: 'wc-lba', translate: 'no' }, String(o.lba)),
          h('span', { class: 'wc-st' + (nowAck ? ' sd-changed' : '') }, status));
      })));
  }

  function cacheBox(c) {
    var s = c.state, p = c.params;
    var issued = evIds(s, 'issue').concat(evIds(s, 'supersede'));
    var body;
    if (s.power !== 'on' && !s.cache.length && p.bbu !== 'on') {
      body = h('p', { class: 'wc-emptied' }, t('cacheEmptied'));
    } else {
      var slots = s.cache.map(function (e) {
        var writing = s.busy && s.busy.id === e.id;
        return h('div', { class: 'wc-slot' },
          h('span', { class: 'wc-blk' + (issued.indexOf(e.id) >= 0 ? ' sd-changed' : ''), dataset: Object.assign({ k: e.dirty ? 'dirty' : 'clean' }, writing ? { writing: 'true' } : {}) }, data(e.label)),
          h('span', { class: 'wc-lba', translate: 'no' }, String(e.lba)),
          writing ? h('span', { class: 'wc-muted', title: t('writing'), 'aria-label': t('writing') }, '→') : null);
      });
      while (slots.length < Math.max(3, L.lbasOf(p).length)) slots.push(h('div', { class: 'wc-slot' }, h('span', { class: 'wc-blk' })));
      body = h('div', { class: 'wc-slots' }, slots);
    }
    var batS = p.bbu === 'on' ? 'on' : p.bbu === 'failed' ? 'failed' : 'off';
    var bat = h('span', { class: 'wc-mod', dataset: batS === 'failed' ? { bad: 'true' } : {} },
      h('span', { class: 'wc-bat', dataset: { s: batS }, 'aria-hidden': 'true' }),
      t(batS === 'on' ? 'bbuOk' : batS === 'failed' ? 'bbuBad' : 'bbuNone'),
      batS === 'failed' && p.policy === 'wb' ? h('span', null, ': ', t('runsWT')) : null);
    var pw = h('span', { class: 'wc-mod', dataset: s.power === 'off' ? { off: 'true' } : {} }, '⏻ ',
      t(s.power === 'on' ? 'powerOn' : s.power === 'off' ? 'powerOff' : 'powerBack'));
    return h('section', { class: 'wc-box' }, h('h2', null, t('cacheTitle')), body, h('div', { class: 'wc-mods' }, bat, pw));
  }

  function diskBox(c) {
    var s = c.state, p = c.params;
    var done = evIds(s, 'durable').map(function (id) { return opOf(s, id).lba; });
    return h('section', { class: 'wc-box' }, h('h2', null, t('diskTitle')),
      h('ol', { class: 'wc-list' }, L.lbasOf(p).map(function (lba) {
        var lab = s.disk[String(lba)];
        var writing = s.busy && s.busy.lba === lba;
        return h('li', { class: 'wc-row' },
          h('span', { class: 'wc-lba', translate: 'no' }, String(lba)),
          h('span', { class: 'wc-blk' + (done.indexOf(lba) >= 0 ? ' sd-changed' : ''), dataset: { k: lab ? 'clean' : 'old' } }, lab ? data(lab) : t('old')),
          writing ? h('span', { class: 'wc-muted' }, '← ', data(opOf(s, s.busy.id).label)) : null,
          s.head === lba ? h('span', { class: 'wc-head' }, '◀ ', t('head')) : null);
      })));
  }

  /** The end of the full run, for the timeline's scale: the last event time, rounded up to 10 ms. */
  function scaleOf(c) {
    var end = Simdeck.stateAt(L, c.params, c.steps);
    var last = Math.max(end.t, c.params.cutAt <= end.t ? c.params.cutAt : 0);
    return Math.max(20, Math.ceil((last + 2) / 10) * 10);
  }

  function timeline(c) {
    var s = c.state, p = c.params;
    var T = scaleOf(c);
    var pos = function (x) { return (Math.min(x, T) / T * 100) + '%'; };
    var now = s.t < 0 ? 0 : s.t;
    var stop = s.cutAt !== null ? s.cutAt : now;
    var acked = evIds(s, 'ack'), durable = evIds(s, 'durable');
    var cutNow = s.ev.some(function (e) { return e.type === 'cut'; });
    /** The cut (a red line, labelled in the first row) or the clock (a dashed line), drawn in every row. */
    var vline = function (first) {
      if (s.cutAt !== null) return h('span', { class: 'wc-vline', style: { left: pos(s.cutAt) } },
        first ? h('span', { class: 'wc-vlbl', dataset: s.cutAt > T * 0.7 ? { left: 'true' } : {} }, '⚡ ', t('cutMark')) : null);
      return s.t >= 0 ? h('span', { class: 'wc-vline', dataset: { v: 'now' }, style: { left: pos(now) } }) : null;
    };
    var cells = [];
    s.ops.forEach(function (o) {
      if (o.kind !== 'write') return;
      var marks = [];
      if (o.issuedAt !== null) {
        // the application waits until the ack, or until the cut (nobody waits after it)
        var ackEnd = o.ackAt !== null ? o.ackAt : (s.cutAt !== null ? s.cutAt : (o.durableAt !== null ? o.durableAt : stop));
        if (ackEnd > o.issuedAt) marks.push(h('span', { class: 'wc-bar', dataset: { b: o.ackAt !== null ? 'done' : 'wait' }, style: { left: pos(o.issuedAt), width: 'calc(' + pos(ackEnd) + ' - ' + pos(o.issuedAt) + ')' } }));
        if (o.ackAt !== null) {
          var riskEnd = o.durableAt !== null ? o.durableAt : (o.supersededBy !== null ? null : stop);
          if (riskEnd !== null && riskEnd > o.ackAt) marks.push(h('span', { class: 'wc-bar', dataset: { b: 'risk' }, style: { left: pos(o.ackAt), width: 'calc(' + pos(riskEnd) + ' - ' + pos(o.ackAt) + ')' } }));
        }
        marks.push(h('span', { class: 'wc-mk', dataset: { m: 'issue' }, style: { left: pos(o.issuedAt) } }));
        if (o.ackAt !== null) marks.push(h('span', { class: 'wc-mk' + (acked.indexOf(o.id) >= 0 ? ' sd-changed' : ''), dataset: { m: 'ack' }, style: { left: pos(o.ackAt) }, 'aria-hidden': 'true' }, '✓'));
        if (o.durableAt !== null) marks.push(h('span', { class: 'wc-mk' + (durable.indexOf(o.id) >= 0 ? ' sd-changed' : ''), dataset: { m: 'disk' }, style: { left: pos(o.durableAt) } }));
        if (s.lost.indexOf(o.id) >= 0) marks.push(h('span', { class: 'wc-mk' + (cutNow ? ' sd-changed' : ''), dataset: { m: 'lost' }, style: { left: pos(s.cutAt) }, 'aria-hidden': 'true' }, '✕'));
      }
      marks.push(vline(!cells.length));
      cells.push(h('div', { class: 'wc-tl-lbl' }, h('span', { class: 'wc-blk', dataset: { k: kindOf(s, o) } }, data(o.label)),
        JNAME[o.label] && p.pattern === 'journal' ? h('span', { class: 'wc-name' }, t(JNAME[o.label])) : null));
      cells.push(h('div', { class: 'wc-track' }, marks));
    });
    var ticks = [];
    var stepT = T > 60 ? 20 : 10;
    for (var x = 0; x <= T; x += stepT) ticks.push(h('span', { class: 'wc-tick', translate: 'no', style: { left: pos(x) } }, String(x)));
    cells.push(h('div', { class: 'wc-tl-lbl wc-muted' }, t('axis')));
    cells.push(h('div', { class: 'wc-axis' }, ticks));
    var nRows = cells.length / 2 - 1;
    return h('section', { class: 'wc-time' }, h('h2', null, t('timeTitle')),
      h('div', { class: 'wc-tl', style: { gridTemplateRows: 'repeat(' + nRows + ', minmax(2.1rem, 3rem)) 1.7rem' } }, cells));
  }

  function card(c) {
    var s = c.state, pr = c.prev;
    var k = L.tally(s), was = pr ? L.tally(pr) : null;
    var row = function (key, v, wv, opt) {
      opt = opt || {};
      if (opt.hideZero && !v && !(wv)) return null;
      return h('tr', { dataset: opt.bad && v ? { bad: 'true' } : {} }, h('th', null, t(key)),
        h('td', { class: was && wv !== v ? 'sd-changed' : null }, opt.text !== undefined ? opt.text : String(v)));
    };
    var mean = L.meanAck(s), wmean = pr ? L.meanAck(pr) : null;
    var meanTxt = mean === null ? '–' : t('ms', { v: num(mean) });
    var rows = [
      row('rAck', k.ack, was && was.ack),
      row('rDisk', k.disk, was && was.disk),
      row('rDiskNoAck', k.diskNoAck, was && was.diskNoAck, { hideZero: true }),
      row('rLost', k.lost, was && was.lost, { bad: true }),
      s.power !== 'on' ? row('rUnacked', k.unacked, was && was.unacked, { hideZero: true }) : null,
      row('rWaiting', k.waiting, was && was.waiting, { hideZero: true }),
      row('rReplaced', k.replaced, was && was.replaced, { hideZero: true }),
      s.power !== 'on' ? row('rNever', k.never, was && was.never, { hideZero: true }) : null,
      h('tr', null, h('th', null, t('rMean')), h('td', { class: was && wmean !== mean ? 'sd-changed' : null, translate: 'no' }, meanTxt))
    ];
    var out = [h('h2', null, t(s.power === 'on' ? 'cardSoFar' : s.power === 'off' ? 'cardCut' : 'cardAfter')), h('table', { class: 'wc-table' }, h('tbody', null, rows))];
    if (c.params.pattern === 'journal') {
      var j = L.journalOf(s), fin = s.power !== 'on' || c.last;
      out.push(h('h2', null, t('jTitle')),
        h('p', { class: 'wc-j', dataset: { j: fin ? j : 'pending' } }, t(fin ? (j === 'corrupt' ? 'jCorrupt' : j === 'new' ? 'jNew' : 'jOld') : 'jPending')));
    }
    return h('aside', { class: 'wc-card' }, out);
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'wc' },
      h('div', { class: 'wc-left' },
        h('div', { class: 'wc-path' }, appBox(c), h('span', { class: 'wc-arrow', 'aria-hidden': 'true' }, '→'), cacheBox(c),
          h('span', { class: 'wc-arrow', 'aria-hidden': 'true' }, '→'), diskBox(c)),
        timeline(c)),
      card(c)));
  }

  // ── captions ──

  function capEvents(c) {
    var s = c.state, out = [];
    var add = function (parts) { if (parts && parts.length) { if (out.length) out.push(' '); out = out.concat(parts); } };
    var acked = evIds(s, 'ack');
    s.ev.forEach(function (e) {
      var o = e.id ? opOf(s, e.id) : null;
      if (e.type === 'issue') {
        if (o.fua) add(rich('capFua', { w: wName(o) }));
        else if (o.ackAt !== null) add(rich('capAckWB', { w: wName(o) }));
        else add(rich('capFwd', { w: wName(o) }));
      } else if (e.type === 'supersede') {
        add(rich('capSupersede', { w: wName(o), old: wName(opOf(s, e.old)) }));
      } else if (e.type === 'flush') {
        add(rich('capFlush'));
      } else if (e.type === 'flushDone') {
        if (!s.ev.some(function (x) { return x.type === 'flush' && x.id === e.id; })) add(rich('capFlushDone'));
      } else if (e.type === 'durable') {
        if (acked.indexOf(o.id) >= 0 && s.ev.every(function (x) { return !(x.type === 'issue' && x.id === o.id); }))
          add(rich('capDurableAck', { w: wName(o), lat: ms(o.ackAt - o.issuedAt) }));
        else add(rich('capDurable', { w: wName(o) }));
      } else if (e.type === 'start' && e.of > 1) {
        add(rich(e.wrap ? 'capStartWrap' : 'capStart', { w: wName(o) }));
      }
    });
    return out;
  }

  function capCut(c) {
    var s = c.state, k = L.tally(s);
    var tt = ms(s.cutAt);
    if (k.lost) return rich('capCutWB', { t: tt, n: span(t.n('nAcked', k.ack)), d: span(k.disk ? t.n('nOnDisk', k.disk) : t('nOnDisk0')), lost: span(t.n('nLost', k.lost)) });
    if (k.waiting) return rich('capCutBBU', { t: tt, k: span(t.n('nBlocks', k.waiting)) });
    if (k.unacked) return rich('capCutWT', { t: tt }, k.unacked);
    return rich('capCutClean', { t: tt });
  }

  function capJournal(s) {
    var j = L.journalOf(s);
    if (j === null) return [];
    return rich(j === 'corrupt' ? 'capJCorrupt' : j === 'new' ? 'capJNew' : 'capJOld');
  }

  function caption(c) {
    var s = c.state, p = c.params;
    if (c.first) {
      var nw = span(t.n('nWrites', s.ops.filter(function (o) { return o.kind === 'write'; }).length));
      if (p.policy === 'wb' && s.eff === 'wt') return rich('cap0Fallback', { n: nw });
      return rich(s.eff === 'wb' ? 'cap0WB' : 'cap0WT', { n: nw });
    }
    var types = s.ev.map(function (e) { return e.type; });
    var out = [];
    if (types.indexOf('restore') >= 0) {
      var k = L.tally(s);
      if (k.lost) out = rich('capRestore', { lost: data(s.lost.map(function (id) { return opOf(s, id).label; }).join(', ')) });
      else if (k.waiting) out = rich('capRestoreBBUn', {}, k.waiting);
      else out = rich('capRestoreNone');
      var j = capJournal(s);
      if (j.length) out = out.concat(' ', j);
      return out;
    }
    var ev = capEvents(c);
    if (ev.length) out = rich('capT', { t: ms(s.t) }).concat(' ', ev);
    if (types.indexOf('cut') >= 0) out = out.concat(out.length ? ' ' : [], capCut(c));
    if (c.last && s.power === 'restored') {
      out = out.concat(out.length ? ' ' : [], rich(L.tally(s).never ? 'capDoneSent' : 'capDone'));
      var jj = capJournal(s);
      if (jj.length) out = out.concat(' ', jj);
    }
    return out;
  }

  // ── controls ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'policy', type: 'choice', label: t('policy'), options: [['wt', t('polWT')], ['wb', t('polWB')]] },
      { key: 'bbu', type: 'choice', label: t('bbu'), options: [['off', t('bbuOff')], ['on', t('bbuOn')], ['failed', t('bbuFailed')]] },
      // `pattern` is set by the presets; its choice is hidden to keep the panel on one screen (NOTES.md, Decisions).
      { key: 'pattern', type: 'choice', label: t('pattern'), resets: true, visible: function () { return false; }, options: [['six', t('patSix')], ['journal', t('patJournal')], ['rewrite', t('patRewrite')]] },
      { key: 'flush', type: 'toggle', label: t('flush'), visible: function (p) { return p.pattern === 'journal'; } },
      // `diskMs` is hidden too (one screen); it stays in the model and the URL (NOTES.md, Deviations).
      { key: 'diskMs', type: 'choice', label: t('diskMs'), visible: function () { return false; }, options: [4, 8, 12].map(function (v) { return [v, t('ms', { v: v })]; }) },
      { key: 'cutAt', type: 'range', label: t('cutAt'), min: 0, max: 80, step: 1, format: function (v) { return t('ms', { v: v }); } },
      // the cut takes effect in the next step: at the end of the next millisecond (step 0: at the end of ms 0)
      { type: 'button', label: t('cutNow'), key: 'x', run: function (sim) {
        var s = sim.state;
        if (s.power !== 'on') return;
        sim.set({ cutAt: s.t < 0 ? 0 : s.t + 1 });
      } }
    ],

    presets: [
      { id: 'write-through', label: t('presetWT'), params: { policy: 'wt', cutAt: 30 }, hint: t('presetWTHint') },
      { id: 'write-back-cut', label: t('presetWB'), params: { policy: 'wb', cutAt: 25 }, hint: t('presetWBHint') },
      { id: 'write-back-bbu', label: t('presetBBU'), params: { policy: 'wb', bbu: 'on', cutAt: 25 }, hint: t('presetBBUHint') },
      { id: 'reorder', label: t('presetReorder'), params: { policy: 'wb', pattern: 'journal', cutAt: 20 }, hint: t('presetReorderHint') },
      { id: 'battery-failed', label: t('presetFailed'), params: { policy: 'wb', bbu: 'failed', cutAt: 30 }, hint: t('presetFailedHint') }
    ],

    legend: LEGEND,
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
