     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  /** Data (HTML, paths, cookies, host names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'xs-mono' : cls || null }, String(text)); }
  function inp(text) { return h('span', { translate: 'no', class: 'xs-mono xs-in' }, String(text)); }
  function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function fresh(c, key) { return c.state.changed.indexOf(key) >= 0; }
  function put(el, items) {
    var out = [];
    (function walk(x) { if (Array.isArray(x)) x.forEach(walk); else if (x !== null && x !== undefined) out.push(x); })(items);
    el.replaceChildren.apply(el, out);
  }
  function encName(e) { return t(e === 'none' ? 'encNone' : e === 'htmlEncode' ? 'encHtml' : 'encText'); }
  function cookieChip(safe) { return h('span', { class: 'xs-cookie', dataset: { safe: String(!!safe) }, translate: 'no' }, L.SID); }
  function flag(on, label) { return h('span', { class: 'xs-flag', dataset: { on: String(!!on) } }, label, ' ', t(on ? 'on' : 'off')); }
  function whatOf(r) {
    if (r.how === 'script') return t('whatScript');
    if (r.how === 'url') return t('whatUrl', { tag: r.tag });
    return t('whatHandler', { event: r.event, tag: r.tag });
  }

  // ── the chart (K1) ──

  var NOTE_KEY = { ran: 'noteRan', csp: 'noteCsp', armed: 'noteArmed', markup: 'noteMarkup', text: 'noteText',
    'cookie-empty': 'noteCookieEmpty', read: 'noteRead', fix: 'noteFix', reflect: 'noteReflect' };

  function renderChart(c) {
    var s = c.state;
    var rows = s.events.map(function (e) {
      var changed = e.n === c.n;
      var time = String(e.n);
      if (e.kind === 'note') {
        var text = e.what === 'saved' ? t('noteSaved', { id: e.id }) : t(NOTE_KEY[e.what]);
        var k = e.what === 'ran' ? 'fill' : 'solid';
        return { kind: 'note', lane: e.lane, text: h('span', { class: e.lane === 'V' ? 'xs-nv' : null }, text), k: k, time: time, changed: changed };
      }
      if (e.what === 'post') return { from: 'A', to: 'S', c: 2, label: e.line, fields: inp(trunc(e.data, 26)), time: time, changed: changed };
      if (e.what === 'link') return { from: 'A', to: 'V', c: 2, label: h('span', null, t('rowLink')), fields: h('span', null, data(e.line), inp(trunc(e.data, 22))), time: time, changed: changed };
      if (e.what === 'get-q') return { from: 'V', to: 'S', c: 1, label: e.line, fields: inp(trunc(e.data, 22)), time: time, changed: changed };
      if (e.what === 'get') return { from: 'V', to: 'S', c: 1, label: e.line, fields: data('Cookie: ' + L.SID), time: time, changed: changed };
      if (e.what === 'response') return { from: 'S', to: 'V', c: 6, label: e.line, fields: e.csp ? data("CSP: script-src 'self'") : h('span', null, t('fieldsHtml')), time: time, changed: changed };
      // exfil: the cookie leaves the victim's browser
      return { from: 'V', to: 'A', c: 2, label: 'GET ' + L.EVIL, place: 'mid', fields: cookieChip(false), time: time, changed: changed };
    });
    var p = c.params;
    var lanes = [
      { id: 'A', mark: t('markA'), c: 2, shape: 'square', name: t('laneA'), tags: data(L.EVIL, 'xs-mono xs-sm'),
        body: h('div', { class: 'xs-card' }, h('p', { class: fresh(c, 'attacker') ? 'sd-changed' + anim(c) : null },
          h('span', { class: 'xs-muted' }, t('aHas'), ' '), s.attackerHas ? cookieChip(false) : t('aNothing'))) },
      { id: 'S', mark: t('markS'), c: 6, name: t('laneS'),
        body: h('div', { class: 'xs-card' },
          h('p', null, h('span', { class: 'xs-muted' }, t('sOutput'), ' '), h('b', null, encName(p.encoding))),
          h('p', { class: fresh(c, 'store') ? 'sd-changed' + anim(c) : null }, p.kind === 'stored' ? t.n('sComments', s.stored.length) : t('sSavesNothing'))) },
      { id: 'V', mark: t('markV'), c: 1, name: t('laneV'),
        body: h('div', { class: 'xs-card' },
          h('p', null, h('span', { class: 'xs-muted' }, t('vCookie'), ' '), cookieChip(true), ' ', p.httpOnly ? data('HttpOnly', 'xs-flag') : null),
          h('p', { class: fresh(c, 'cookie') ? 'sd-changed' + anim(c) : null }, h('span', { class: 'xs-muted' }, t('vReads'), ' '),
            s.cookieRead === null ? '—' : s.cookieRead === '' ? h('b', null, t('vEmpty')) : data(s.cookieRead))) }
    ];
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '2.6rem',
      lanes: lanes,
      rows: rows,
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── right: the form and the store or link ──

  var ui = null;

  function build(stage) {
    var field = h('input', { id: 'xs-field', type: 'text', class: 'xs-field', maxlength: '60', spellcheck: 'false',
      autocomplete: 'off', autocapitalize: 'off', translate: 'no', title: t('fieldHint') });
    field.addEventListener('input', function () { if (sim) sim.set({ comment: field.value, payload: 'own' }); });
    var label = h('label', { for: 'xs-field' });
    var formTitle = h('h2');
    var below = h('div');
    var form = h('section', { class: 'xs-box' }, formTitle, h('div', { class: 'xs-form' }, label, field), below);
    var textBox = h('section', { class: 'xs-box' });
    var treeBox = h('section', { class: 'xs-box' });
    var logBox = h('section', { class: 'xs-box' });
    var mid = h('div', { class: 'xs-col xs-mid' });
    var root = h('div', { class: 'xs' }, h('div', { class: 'xs-col' }, mid, logBox), h('div', { class: 'xs-col' }, form, textBox, treeBox));
    stage.replaceChildren(root);
    return { root: root, mid: mid, field: field, label: label, formTitle: formTitle, below: below, textBox: textBox, treeBox: treeBox, logBox: logBox };
  }

  function fillForm(c) {
    var s = c.state, p = c.params, stored = p.kind === 'stored';
    put(ui.formTitle, t(stored ? 'formStored' : 'formReflected'));
    put(ui.label, t(stored ? 'fieldLabelStored' : 'fieldLabelReflected'));
    if (document.activeElement !== ui.field && ui.field.value !== s.input) ui.field.value = s.input;
    var items = [];
    if (stored) {
      items.push(h('div', { class: 'xs-sm xs-muted' }, t('storeTitle')));
      items.push(h('ul', { class: 'xs-store' }, s.stored.map(function (cm) {
        var mine = cm.author === L.ATTACKER;
        return h('li', { class: mine && fresh(c, 'store') ? 'xs-hl' + anim(c) : null },
          data('#' + cm.id, 'xs-who'), data(cm.author, 'xs-who'),
          mine ? inp(cm.body === '' ? ' ' : cm.body) : data(cm.body, 'xs-body'),
          cm.bad ? h('span', { class: 'xs-bad' }, t('markupMark')) : null);
      })));
    } else {
      items.push(h('div', { class: 'xs-sm xs-muted' }, t('linkTitle')));
      items.push(h('p', { class: 'xs-link' + (fresh(c, 'input') ? ' xs-hl' + anim(c) : '') }, s.link ? [data(L.SEARCH), inp(s.input)] : '—'));
    }
    var reach = s.reach;
    if (!reach) items.push(h('p', { class: 'xs-reach xs-muted' }, t('reachNone')));
    else items.push(h('p', { class: 'xs-reach' + (fresh(c, 'reach') || fresh(c, 'store') ? ' xs-hl' + anim(c) : ''), dataset: { r: reach.other ? 'every' : 'link' } },
      t.parts(reach.other ? 'reachEvery' : 'reachLink', { path: data(L.PAGE) })));
    put(ui.below, items);
  }

  // ── right: the response as text and the tree ──

  function textLines(r, hl) {
    var out = r.asText.lines.map(function (line) {
      var hasIn = line.some(function (sg) { return sg.input; });
      return h('div', { class: hasIn && hl ? 'xs-hl' : null }, line.map(function (sg) { return sg.input ? inp(sg.s) : data(sg.s, null); }));
    });
    if (r.asText.data.length) {
      out.push(h('div', { class: 'xs-sub' }, t('dataLine')));
      r.asText.data.forEach(function (d) {
        out.push(h('div', { class: d.input && hl ? 'xs-hl' : null }, data(d.slot + '.textContent = ', null), d.input ? inp(JSON.stringify(d.value)) : data(JSON.stringify(d.value), null)));
      });
    }
    return out;
  }

  function attrText(el) {
    var id = null, rest = [];
    el.attrs.forEach(function (a) { if (a[0] === 'id' && !el.input) id = a[1]; else rest.push(a[1] === '' ? a[0] : a[0] + '=' + a[1]); });
    return el.tag + (id ? '#' + id : '') + (rest.length ? ' ' + rest.join(' ') : '');
  }

  function treeLines(c, nodes, runs) {
    var s = c.state, out = [], idx = -1; // idx: the element's place in document order, as the model's runs record it
    function markFor(el, at) {
      if (!el.input || !runs) return null;
      var mine = runs.filter(function (r) { return r.idx === at && r.input; });
      if (!mine.length) return null;
      var r = mine[0];
      var m = r.auto && !r.blocked ? 'ran' : r.auto ? 'csp' : 'armed';
      return h('span', { class: 'xs-mark', dataset: { m: m } }, m === 'ran' ? '▶' : m === 'csp' ? '⛔' : '◇');
    }
    function textNode(x) {
      var q = '"' + x.text + '"';
      return x.input ? h('span', { class: 'xs-txt' }, inp(q)) : data(q, 'xs-mono xs-txt');
    }
    function textRow(ind, x) {
      return h('div', { class: x.input && fresh(c, 'tree') ? 'xs-hl' : null }, ind, textNode(x));
    }
    function walk(list, depth) {
      list.forEach(function (x) {
        if (x.t === 'text' && !x.text.trim()) return;
        var ind = h('span', { class: 'xs-ind', 'aria-hidden': 'true' }, depth ? new Array(depth).join('  ') + '└ ' : '');
        if (x.t === 'text') { out.push(textRow(ind, x)); return; }
        var kids = x.kids.filter(function (k) { return k.t !== 'text' || k.text.trim(); });
        var inline = kids.length === 1 && kids[0].t === 'text';
        var node = h('span', { class: 'xs-node xs-mono', dataset: { live: String(!!x.input) }, translate: 'no' }, attrText(x));
        var hl = (x.input || (inline && kids[0].input)) && fresh(c, 'tree');
        idx++;
        out.push(h('div', { class: hl ? 'xs-hl' : null }, ind, node, inline ? textNode(kids[0]) : null, markFor(x, idx)));
        if (!inline) walk(kids, depth + 1);
      });
    }
    walk(nodes, 0);
    return out;
  }

  function fillPanes(c) {
    var s = c.state, r = s.fix || s.rendered, isFix = !!s.fix;
    var head = function (title, sub) {
      return h('h2', null, t(title), isFix ? h('span', { class: 'xs-fixhead' + (fresh(c, 'text') ? anim(c) : '') }, t('fixTitle')) : h('span', null, t(sub)));
    };
    if (!r) {
      put(ui.textBox, [head('textTitle', 'textSub'), h('p', { class: 'xs-muted xs-sm' }, t('paneEmpty'))]);
      put(ui.treeBox, [head('treeTitle', 'treeSub'), h('p', { class: 'xs-muted xs-sm' }, t('paneEmpty'))]);
      return;
    }
    put(ui.textBox, [head('textTitle', 'textSub'), h('div', { class: 'xs-code' }, textLines(r, fresh(c, 'text')))]);
    var runs = isFix ? [] : (s.phase === 'response' ? null : s.runs);
    put(ui.treeBox, [head('treeTitle', 'treeSub'), h('div', { class: 'xs-code xs-tree' }, treeLines(c, r.nodes, runs))]);
  }

  function logText(l) {
    var what = l.how ? whatOf(l) : '';
    switch (l.code) {
      case 'ran': return t.parts('logRan', { what: what, code: data(l.src) });
      case 'csp': return t.parts('logCsp', { what: what, code: data(l.src) });
      case 'armed': return t.parts('logArmed', { what: what, code: data(l.src) });
      case 'markup': return t.parts('logMarkup', { tags: data(l.tags.map(function (x) { return '<' + x + '>'; }).join(' ')) });
      case 'text': return t('logText');
      case 'sent': return t.parts('logSent', { sid: cookieChip(false), host: data(L.EVIL) });
      case 'read': return t.parts('logRead', { sid: data(l.value) });
      case 'cookie-empty': return t('logCookieEmpty');
      case 'nothing-ran': return t('logNothingRan');
      case 'ran-no-cookie': return t('logRanNoCookie');
      default: return t('logFix');
    }
  }

  function fillLog(c) {
    var s = c.state, p = c.params;
    var flags = h('span', null, flag(p.csp, 'CSP'));
    var items = s.log.length ? h('ul', { class: 'xs-log' }, s.log.map(function (l) {
      return h('li', { class: l.n === c.n ? 'xs-hl' + anim(c) : null, dataset: { code: l.code } }, logText(l));
    })) : h('p', { class: 'xs-muted xs-sm' }, t('logEmpty'));
    put(ui.logBox, [h('h2', null, t('logTitle'), flags), items]);
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, p = c.params;
    switch (s.phase) {
      case 'start': return t.parts(p.kind === 'stored' ? 'capStart' : 'capStartRefl', { input: inp(s.input === '' ? ' ' : s.input) });
      case 'post': return t.parts('capPost', { req: data('POST ' + L.PAGE) });
      case 'link': return t('capLink');
      case 'store': return t.parts('capStore', { id: data(s.stored[s.stored.length - 1].id, '') });
      case 'click': return t('capClick');
      case 'open': return t('capOpen');
      case 'reflect': return t('capReflect');
      case 'response': {
        var parts = p.encoding === 'none' ? [t('capRespNone')] : p.encoding === 'htmlEncode' ? [t('capRespHtml')]
          : t.parts('capRespText', { slot: data(p.kind === 'stored' ? 'c3' : 'q') });
        if (p.csp) parts.push(' ', t('capCspHeader'));
        return parts;
      }
      case 'run': {
        var more;
        if (s.note === 'ran') {
          var ran = s.runs.filter(function (r) { return r.auto && !r.blocked; });
          var byScript = ran.some(function (r) { return r.how === 'script'; });
          var onerror = ran.some(function (r) { return r.event === 'onerror'; });
          more = byScript ? t('capRan')
            : [onerror ? t('capRanImg') : t.parts('capRanHandler', { event: data(ran[0].event) }), ' ', t('capRan')];
        } else if (s.note === 'csp') more = t('capCsp');
        else if (s.note === 'armed') more = t('capArmed');
        else more = t('capMarkup');
        return [h('span', { class: 'sd-hl' }, t(p.kind === 'stored' ? 'capRanLead' : 'capRanLeadRefl')), ' ', more];
      }
      case 'text': {
        var key = p.encoding === 'htmlEncode' ? 'capTextHtml' : p.encoding === 'textContent' ? 'capTextContent' : 'capTextPlain';
        return h('span', { class: p.encoding === 'none' ? null : 'sd-hl' }, t(key));
      }
      case 'exfil':
        if (s.note === 'stolen') return t.parts('capStolen', { sid: cookieChip(false), host: data(L.EVIL) });
        if (s.note === 'httponly') return t('capHttpOnly');
        if (s.note === 'read') return t.parts('capRead', { sid: data(L.SID) });
        return t(s.note === 'nothing-ran' ? 'capNothingRan' : 'capRanNoCookie');
      default: return h('span', { class: 'sd-hl' }, t('capFix'));
    }
  }

  var labels = { 'stored-raw': 'presetStoredRaw', reflected: 'presetReflected', 'img-onerror': 'presetImg', encoded: 'presetEncoded', httponly: 'presetHttpOnly' };

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'kind', type: 'choice', label: t('kind'), resets: true, value: L.defaults.kind,
        options: [['stored', t('kindStored')], ['reflected', t('kindReflected')]] },
      { key: 'encoding', type: 'choice', label: t('encoding'), value: L.defaults.encoding,
        options: [['none', t('encNone')], ['htmlEncode', t('encHtml')], ['textContent', t('encText')]] },
      { key: 'payload', type: 'choice', label: t('payload'), hint: t('payloadHint'), value: L.defaults.payload,
        options: [['script', t('payScript')], ['img', t('payImg')], ['plain', t('payPlain')], ['own', t('payOwn')]] },
      { key: 'httpOnly', type: 'toggle', label: t('httpOnly') },
      { key: 'csp', type: 'toggle', label: t('csp'), hint: t('cspHint') }
    ],

    presets: [
      { id: 'stored-raw', params: { kind: 'stored', encoding: 'none', payload: 'script' } },
      { id: 'reflected', params: { kind: 'reflected', encoding: 'none', payload: 'script' } },
      { id: 'img-onerror', params: { kind: 'stored', encoding: 'none', payload: 'img' } },
      { id: 'encoded', params: { kind: 'stored', encoding: 'htmlEncode', payload: 'script' } },
      { id: 'httponly', params: { kind: 'stored', encoding: 'none', payload: 'script', httpOnly: true } }
    ].map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),

    legend: [
      { shape: 'xs-in', label: t('legendInput') },
      { shape: 'xs-live', label: t('legendLive') },
      { shape: 'xs-text', label: t('legendText') },
      { shape: 'xs-ran', label: t('legendRan') },
      { shape: 'xs-cookie', label: t('legendCookie') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      if (!ui || !c.stage.contains(ui.root)) ui = build(c.stage);
      var chart = renderChart(c);
      ui.mid.replaceChildren(chart);
      fillForm(c);
      fillPanes(c);
      fillLog(c);
      chart.fit();
    },

    caption: caption
  });

  // ---- the typed text survives a reload (the language switch reloads the page; text is not in the URL) ----
  // Saved on leaving, restored once and only into the same address apart from ?lang=, so a later link to another
  // preset never gets old text. Storage may be unavailable (private mode, file://): then the field starts fresh.
  var KEEP = 'simdeck.xss.text';
  function here() { var u = new URLSearchParams(window.location.search); u.delete('lang'); return window.location.pathname + '?' + u.toString(); }
  window.addEventListener('pagehide', function () {
    try { window.sessionStorage.setItem(KEEP, JSON.stringify({ at: here(), comment: sim.params.comment })); } catch (e) { /* no storage */ }
  });
  try {
    var kept = JSON.parse(window.sessionStorage.getItem(KEEP) || 'null');
    window.sessionStorage.removeItem(KEEP);
    if (kept && kept.at === here() && typeof kept.comment === 'string' && kept.comment !== sim.params.comment) sim.set({ comment: kept.comment });
  } catch (e) { /* no storage */ }
})();
</script>
</body>
