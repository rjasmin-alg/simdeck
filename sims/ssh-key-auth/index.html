<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (host names, fingerprints, file names, method names, what the client prints) is not language. */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'sk-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text)); }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function short(fp) { return fp.slice(0, 13) + '…'; }
  /** A fingerprint with its icon: srv = the server's host key, usr = the user's key (rule 8). */
  function fpTag(fp, kind, full) {
    return h('span', { class: 'sk-fp' + (full ? ' sk-fp-full' : ''), translate: 'no' },
      h('span', { class: 'sk-ic', dataset: { k: kind }, 'aria-hidden': 'true' }), full ? fp : short(fp));
  }
  var KH = '~/.ssh/known_hosts', AK = '~/.ssh/authorized_keys';

  // ── the question badges ──

  function questions(c) {
    var s = c.state, cn = s.conn, inConn = s.act && s.act.a === 'connect' && cn;
    var q1 = ['idle', '•', 'qIdle'], q2 = ['idle', '•', 'qIdle'];
    if (inConn) {
      if (cn.phase === 'kex') q1 = ['now', '•', 'qNow'];
      else if (cn.hostCheck === 'mismatch') q1 = ['bad', '✕', 'qRefused'];
      else if (cn.outcome === 'declined') q1 = ['bad', '✕', 'qDeclined'];
      else if (cn.hostCheck === 'unknown' && cn.phase === 'check') q1 = ['ask', '?', 'qAsk'];
      else if (cn.hostCheck === 'unknown') q1 = ['ok', '✓', 'qStored'];
      else if (cn.hostCheck === 'known') q1 = ['ok', '✓', 'qKnown'];
      if (cn.outcome === 'refused' || cn.outcome === 'declined') q2 = ['idle', '–', 'qNever'];
      else if (cn.phase === 'auth' && s.prompt) q2 = ['ask', '?', 'qAsk'];
      else if (cn.userAuth === 'publickey') q2 = ['ok', '✓', 'qKey'];
      else if (cn.userAuth === 'password') q2 = ['ok', '✓', 'qPassword'];
      else if (cn.userAuth === 'denied') q2 = ['bad', '✕', 'qDenied'];
    }
    function badge(key, q) {
      return h('div', { class: 'sk-q', dataset: { st: q[0] } },
        h('span', { class: 'sk-q-sym', 'aria-hidden': 'true' }, q[1]), h('b', null, t(key)), h('span', { class: 'sk-q-st' }, t(q[2])));
    }
    return h('div', { class: 'sk-qs' }, badge('q1', q1), badge('q2', q2));
  }

  // ── the chart (K1) ──

  function rowOf(r, c) {
    // the time column numbers the connections, on each connection's first row
    var changed = r.n === c.n, time = r.k === 'kex' ? String(r.conn) : undefined;
    switch (r.k) {
      case 'kex': return { from: 'C', to: 'S', c: 1, label: 'SSH', fields: h('span', null, t.parts('rowKex', { port: data(':22', '') })), time: time, changed: changed };
      case 'hostkey': return { from: 'S', to: 'C', c: 6, label: fpTag(r.fp, 'srv'), fields: h('span', null, t('rowSig')), time: time, changed: changed };
      case 'check':
        return { kind: 'note', lane: 'C', k: r.res === 'mismatch' ? 'fill' : 'solid', time: time, changed: changed,
          text: r.res === 'known' ? h('span', null, '✓ ', t('noteKnown', { line: r.line }))
            : r.res === 'unknown' ? h('span', null, '? ', t('noteUnknown')) : h('span', null, '✕ ', t('noteMismatch', { line: r.line })) };
      case 'answer': return { kind: 'note', lane: 'C', k: r.yes ? 'solid' : 'fill', time: time, changed: changed, text: h('span', null, t(r.yes ? 'noteYes' : 'noteNo')) };
      case 'publickey': return { from: 'C', to: 'S', c: 1, lock: true, label: 'publickey', fields: fpTag(r.fp, 'usr'), time: time, changed: changed };
      case 'none': return { from: 'C', to: 'S', c: 1, lock: true, label: 'none', fields: h('span', null, t('rowNone')), time: time, changed: changed };
      case 'password': return { from: 'C', to: 'S', c: 1, lock: true, label: 'password', fields: h('span', null, t('rowPw')), time: time, changed: changed };
      case 'success': return { from: 'S', to: 'C', c: 6, lock: true, label: 'success', time: time, changed: changed };
      // the chart shows whether password is still listed; the full list is in the terminal and the caption
      case 'failure': return { from: 'S', to: 'C', c: 6, lock: true, label: 'failure', time: time, changed: changed,
        fields: !r.list ? undefined : r.list.indexOf('password') >= 0 ? 'publickey,…,password' : h('span', null, t('rowNoPw')) };
      case 'session': return { kind: 'note', lane: 'S', k: 'solid', time: time, changed: changed, text: h('span', null, '✓ ', t('noteSession'), ': ', data(L.SERVER_FQDN, '')) };
      case 'denied': return { kind: 'note', lane: 'C', k: 'fill', time: time, changed: changed, text: h('span', null, '✕ ', data('Permission denied', '')) };
      case 'reinstall': return { kind: 'note', lane: 'S', k: 'fill', changed: changed, text: h('span', null, t('noteReinstall'), ' ', fpTag(r.fp, 'srv')) };
      case 'keygen': return { kind: 'note', lane: 'C', k: 'solid', changed: changed, text: h('span', null, t('noteKeygen'), ' ', fpTag(r.fp, 'usr')) };
      case 'install': return { from: 'C', to: 'S', c: 1, line: 'dashed', label: 'id_ed25519.pub', changed: changed, lost: r.refused ? ['S'] : undefined,
        fields: h('span', null, t(r.refused ? 'rowInstallRefused' : r.dup ? 'rowInstallDup' : 'rowInstall')) };
      case 'pwset': return { kind: 'note', lane: 'S', k: 'solid', changed: changed, text: data('PasswordAuthentication ' + (r.on ? 'yes' : 'no'), '') };
      case 'forget': return { kind: 'note', lane: 'C', k: 'solid', changed: changed, text: h('span', null, r.count ? t.n('noteForget', r.count) : t('noteForgetNone')) };
    }
    return null;
  }

  function renderChart(c) {
    var s = c.state;
    var cliBody = [h('p', { class: 'sk-muted' }, t.parts('cliRole', { user: data(L.USER, '') }))];
    if (s.prompt) cliBody.push(h('p', null, h('span', { class: 'sk-bubble' + (s.prompt && c.prev && !c.prev.prompt ? anim(c) : '') },
      t(s.prompt.kind === 'host' ? 'waitsHost' : 'waitsPassword'))));
    var lanes = [
      { id: 'C', mark: 'K', c: 1, shape: 'square', name: t('laneClient'), tags: data(L.CLIENT, 'sk-mono sk-sm'), body: h('div', { class: 'sk-card' }, cliBody) },
      { id: 'S', mark: 'P', c: 6, name: t('laneServer'), tags: data(L.SERVER + ' · ' + L.HOST, 'sk-mono sk-sm'),
        body: h('div', { class: 'sk-card' }, h('p', { class: 'sk-muted' }, t('srvRole'))) }
    ];
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '3rem',
      lanes: lanes,
      rows: s.rows.map(function (r) { return rowOf(r, c); }).filter(Boolean),
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── the terminal ──

  function renderTerm(c) {
    var s = c.state, lines = s.transcript;
    // the changed-key warning is long: the terminal grows while it is the step's news
    var tall = s.conn && s.conn.outcome === 'refused' && s.ev.kind === 'check';
    var box = h('section', { class: 'sk-box sk-term', dataset: tall ? { tall: '1' } : {} }, h('h2', null, t('termTitle'), ' ', data(L.CLIENT, 'sk-mono sk-muted sk-sm')));
    box.append(h('div', { class: 'sk-term-lines', translate: 'no' }, lines.length ? lines.map(function (l) {
      var ds = {};
      if (l.n === c.n && c.n > 0) ds.new = '1';
      if (l.prompt && c.state.prompt) ds.prompt = '1';
      return h('span', { class: 'sk-tl', dataset: ds }, l.text || ' ');
    }) : h('span', { class: 'sk-muted sk-sm', translate: 'yes' }, t('termEmpty'))));
    return box;
  }

  // ── right: the client's and the server's files ──

  function renderClient(c) {
    var s = c.state, cli = s.client, m = s.marks || {}, cn = s.conn;
    var checking = cn && s.act && s.act.a === 'connect' && cn.phase === 'check' && cn.line;
    var box = h('section', { class: 'sk-box' }, h('h2', null, t.parts('boxClient', { host: data(L.CLIENT, '') })));
    box.append(h('h3', null, t.parts('khTitle', { file: data(KH, 'sk-mono') })));
    var rows = cli.knownHosts.map(function (e, i) {
      var st = checking && cn.line === i + 1 ? (cn.hostCheck === 'mismatch' ? 'bad' : 'hit') : 'other';
      var marked = m.kh && m.kh.indexOf(i + 1) >= 0;
      return h('tr', { class: marked ? 'sd-changed' + anim(c) : null, dataset: { st: st } },
        h('td', null, data(i + 1, '')), h('td', null, data(e.host)), h('td', null, data(e.type)), h('td', null, fpTag(e.fp, 'srv')));
    }).concat((m.removed || []).map(function (e) {
      return h('tr', { dataset: { st: 'removed' } },
        h('td', null, '✕'), h('td', null, data(e.host)), h('td', null, data(e.type)), h('td', null, fpTag(e.fp, 'srv'), ' ', h('span', { class: 'sk-sm' }, t('khRemoved'))));
    }));
    box.append(rows.length
      ? h('table', { class: 'sk-tab' },
        h('thead', null, h('tr', null, h('th', null, t('colLine')), h('th', null, t('colHost')), h('th', null, t('colType')), h('th', null, t('colFp')))),
        h('tbody', null, rows))
      : h('p', { class: 'sk-empty' }, t('khEmpty')));
    box.append(h('h3', null, t('kpTitle')));
    box.append(cli.keyPair
      ? h('dl', { class: 'sk-kv' + (m.keyPair ? ' sd-changed' + anim(c) : '') },
        h('dt', null, data('id_ed25519', 'sk-mono')), h('dd', null, t('kpPriv')),
        h('dt', null, data('id_ed25519.pub', 'sk-mono')), h('dd', null, t('kpPub'), ' ', fpTag(cli.keyPair.fp, 'usr')))
      : h('p', { class: 'sk-empty' }, t('kpNone')));
    return box;
  }

  function renderServer(c) {
    var s = c.state, srv = s.server, m = s.marks || {}, cn = s.conn;
    var authing = cn && s.act && s.act.a === 'connect' && cn.phase === 'auth' && s.ev.kind === 'auth' && s.ev.tried === 'publickey';
    var box = h('section', { class: 'sk-box' }, h('h2', null, t.parts('boxServer', { host: data(L.SERVER + ' (' + L.HOST + ')', '') })));
    box.append(h('h3', null, t('hkTitle')));
    box.append(h('p', { class: m.hostKey ? 'sd-changed' + anim(c) : null }, data(srv.hostKey.type), ' ', fpTag(srv.hostKey.fp, 'srv', true)));
    box.append(h('p', { class: 'sk-sm sk-muted' }, t('hkOob')));
    box.append(h('h3', null, t.parts('akTitle', { file: data(AK, 'sk-mono'), user: data(L.USER, '') })));
    box.append(srv.authorizedKeys.length
      ? h('table', { class: 'sk-tab' }, h('tbody', null, srv.authorizedKeys.map(function (fp, i) {
        var marked = m.ak && m.ak.indexOf(i + 1) >= 0;
        var hit = authing && s.ev.fp === fp;
        return h('tr', { class: marked ? 'sd-changed' + anim(c) : null, dataset: { st: hit ? 'hit' : 'other' } },
          h('td', null, data(i + 1, '')), h('td', null, data('ssh-ed25519'), ' ', fpTag(fp, 'usr')));
      })))
      : h('p', { class: 'sk-empty' }, t('akEmpty')));
    box.append(h('dl', { class: 'sk-kv sk-pw' },
      h('dt', null, t('pwTitle')),
      h('dd', { class: m.pw ? 'sd-changed' + anim(c) : null }, data('PasswordAuthentication ' + (srv.passwordAuth ? 'yes' : 'no')))));
    return box;
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, ev = s.ev, out = [];
    var kh = data('known_hosts', 'sk-mono'), ak = data('authorized_keys', 'sk-mono');
    switch (ev.kind) {
      case 'start': {
        var su = L.SCRIPTS[ev.script] ? ev.script : 'first-connection';
        var srvFp = B(short(s.server.hostKey.fp)), stored = s.client.knownHosts[0];
        out = {
          'first-connection': function () { return t.parts('capStartFirst', { host: B(L.HOST), file: kh }); },
          'second-connection': function () { return t.parts('capStartSecond', { fp: srvFp, file: kh }); },
          'host-key-changed': function () { return t.parts('capStartChanged', { host: B(L.SERVER), fp: srvFp, old: B(short(stored.fp)) }); },
          'key-login': function () { return [t('capStartKey')]; },
          'password-off': function () { return t.parts('capStartPwOff', { fp: B(short(L.USER_FP)), file: ak, pw: B('PasswordAuthentication no') }); }
        }[su]();
        break;
      }
      case 'kex': out = t.parts(ev.offer === 'password' && ev.keyPair ? 'capKexPw' : 'capKex', { n: B(ev.conn), fp: B(short(ev.fp)) }); break;
      case 'check':
        if (ev.res === 'known') out = t.parts('capKnown', { fp: B(short(ev.fp)), line: B(ev.line), file: kh });
        else if (ev.res === 'mismatch') out = t.parts('capMismatch', { fp: B(short(ev.fp)), line: B(ev.line), old: B(short(ev.stored)) });
        else out = t.parts(ev.again ? 'capUnknownAgain' : 'capUnknown', { fp: B(short(ev.fp)) });
        break;
      case 'answer': out = ev.yes ? t.parts('capYes', { fp: B(short(ev.fp)), line: B(ev.line), file: kh }) : [t('capNo')]; break;
      case 'auth':
        if (ev.out === 'publickey') out = t.parts('capAuthKey', { fp: B(short(ev.fp)), file: ak });
        else if (ev.out === 'password-prompt') out = ev.tried === 'publickey' ? t.parts('capAuthKeyFailPw', { fp: B(short(ev.fp)), file: ak })
          : [t(ev.keyPair ? 'capAuthRefusePw' : 'capAuthNonePw')];
        else out = ev.tried === 'publickey' ? t.parts('capAuthDeniedKey', { fp: B(short(ev.fp)), file: ak, list: B(ev.list.join(',')) })
          : t.parts(ev.keyPair ? 'capAuthDenied' : 'capAuthDeniedNoKey', { list: B(ev.list.join(',')) });
        break;
      case 'password': out = t.parts('capPassword', { out: B(L.SERVER_FQDN) }); break;
      case 'reinstall': out = t.parts('capReinstall', { fp: B(short(ev.fp)), old: B(short(ev.old)) }); break;
      case 'keygen': out = t.parts('capKeygen', { fp: B(short(ev.fp)), host: B(short(ev.hostFp)) }); break;
      case 'install': out = t.parts(ev.refused ? 'capInstallRefused' : ev.dup ? 'capInstallDup' : 'capInstall', { fp: B(short(ev.fp)), file: ak }); break;
      case 'pwset': out = [t(ev.on ? 'capPwOn' : 'capPwOff')]; break;
      case 'forget': out = !ev.count ? t.parts('capForgetNone', { file: kh })
        : t.parts(ev.changed ? 'capForget' : 'capForgetSame', { fp: B(short(ev.fp)), file: kh }); break;
    }
    if (c.last) out = out.concat(' ', t(Object.keys(L.QUEUE).some(function (ch) { return L.canQueue(c.params, ch); }) ? 'capMore' : 'capFull'));
    return out;
  }

  // ── controls ──

  var never = function () { return false; };
  function queueBtn(label, key, ch) {
    return { type: 'button', label: t(label), key: key, run: function (sim) {
      var letter = typeof ch === 'function' ? ch(sim.params) : ch;
      if (!L.canQueue(sim.params, letter)) { sim.render(); return; }
      sim.set({ queue: String(sim.params.queue || '') + letter });
    } };
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'script', type: 'choice', label: t('presetFirst'), visible: never, resets: true,
        options: [['first-connection', '1'], ['second-connection', '2'], ['host-key-changed', '3'], ['key-login', '4'], ['password-off', '5']] },
      // `queue` (the actions added with the buttons) is a model param without a control: the kit keeps only controls
      // in the URL (NOTES.md, Shared requests, as http-exchange's `sent`).
      { key: 'answer', type: 'choice', label: t('answer'), options: [['yes', data('yes', '')], ['no', data('no', '')]] },
      { key: 'offer', type: 'choice', label: t('offer'), options: [['any', t('offerAny')], ['password', t('offerPassword')]] },
      queueBtn('btnConnect', 's', function (p) { return p.offer === 'password' ? 'W' : 'S'; }),
      queueBtn('btnReinstall', 'n', 'N'),
      queueBtn('btnKey', 'k', 'K'),
      queueBtn('btnPw', 'p', 'P'),
      queueBtn('btnForget', 'd', 'D')
    ],

    presets: [
      { id: 'first-connection', label: t('presetFirst'), hint: t('presetFirstHint'), params: { script: 'first-connection' } },
      { id: 'second-connection', label: t('presetSecond'), hint: t('presetSecondHint'), params: { script: 'second-connection' } },
      { id: 'host-key-changed', label: t('presetChanged'), hint: t('presetChangedHint'), params: { script: 'host-key-changed' } },
      { id: 'key-login', label: t('presetKey'), hint: t('presetKeyHint'), params: { script: 'key-login' } },
      { id: 'password-off', label: t('presetPwOff'), hint: t('presetPwOffHint'), params: { script: 'password-off' } }
    ],

    legend: [
      { shape: 'srv', label: t('legSrvFp') },
      { shape: 'usr', label: t('legUsrFp') },
      { shape: 'lock', label: t('legLock') },
      { shape: 'bubble', label: t('legPrompt') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'sk' },
        h('div', { class: 'sk-col sk-mid' }, questions(c), chart, renderTerm(c)),
        h('div', { class: 'sk-col' }, renderClient(c), renderServer(c))));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
