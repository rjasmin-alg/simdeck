<!-- cmp-shared-responsibility: moving a workload from own servers to rented infrastructure, a platform or a finished
     application hands controls to the provider layer by layer; data, accounts, access and backups stay with the
     customer; a gap opens where each side assumes the other runs a control; the provider's report proves its own
     part only.
     The stage: the counts at the top (provider, customer, gaps, double work, and the report as a button); below, a
     table of twelve controls in five layers: the owner under each of the four models (a staircase; a header button
     moves the system), the team's belief (a button per row), the outcome and what the report says.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var N = L.CONTROLS.length;

  function b(text) { return h('b', { class: 'sr-num' }, String(text)); }
  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // after a keyboard press, focus goes back to the same button
  function press(sel, patch) {
    return function (e) { refocus = e.detail === 0 ? sel : null; sim.set(patch); };
  }
  function who(o) { return t(o === 'provider' ? 'chipProv' : 'chipCust'); }

  // ── the counts ──

  function top(s) {
    function k(title, n, sub, hot) {
      return h('div', { class: 'sr-k', dataset: hot ? { hot: hot } : {} },
        h('span', { class: 'sr-kt' }, title), h('span', { class: 'sr-kb' }, b(n), h('span', { class: 'sr-ks' }, sub)));
    }
    var r = s.report, state = !r ? t('kRepClosed') : s.p.model === 'own' ? t('kRepNone')
      : t('kRepOpen', { p: r.proven, k: r.carved, y: r.yours });
    return h('div', { class: 'sr-top' },
      k(t('kProv'), s.provider, t('kOf', { n: N })),
      k(t('kCust'), s.customer, t('kOf', { n: N })),
      k(t('kGap'), s.gaps.length, t('kGapSub'), s.gaps.length ? 'gap' : null),
      k(t('kExtra'), s.extra.length, t('kExtraSub'), s.extra.length ? 'extra' : null),
      h('button', {
        type: 'button', class: 'sr-k', 'aria-pressed': String(!!r), dataset: { sel: 'rep' },
        'aria-label': t('kRepAria', { state: state }), onmousedown: noFocus, onclick: press('rep', { report: !r })
      }, h('span', { class: 'sr-kt' }, t('kRep')), h('span', { class: 'sr-ks' }, state)));
  }

  // ── the table ──

  var COL = { layer: 1, name: 2, model0: 3, belief: 7, outcome: 8, report: 9 };
  var O_MARK = { ok: '✓', gap: '✗', extra: '≈' };
  var E_MARK = { proven: '✓', carved: '⧉', yours: '–', none: '–' };

  function table(s) {
    var p = s.p, kids = [], cur = L.MODELS.indexOf(p.model);
    // the chosen model's column, behind its cells
    kids.push(h('div', { class: 'sr-colband', 'aria-hidden': 'true', style: { gridColumn: String(COL.model0 + cur), gridRow: '1 / -1' } }));
    // headers
    function hd(col, text, extra) {
      return h('div', Object.assign({ class: 'sr-h', style: { gridColumn: String(col), gridRow: '1' } }, extra || {}), text);
    }
    kids.push(hd(COL.layer, t('hLayer')), hd(COL.name, t('hControl')));
    L.MODELS.forEach(function (m, i) {
      kids.push(h('button', {
        type: 'button', class: 'sr-h', 'aria-pressed': String(m === p.model), dataset: { sel: 'm-' + m },
        'aria-label': t('mShow', { name: t('ms_' + m) }), style: { gridColumn: String(COL.model0 + i), gridRow: '1' },
        onmousedown: noFocus, onclick: press('m-' + m, { model: m })
      }, h('span', null, t('m_' + m)), h('small', null, t('mw_' + m))));
    });
    kids.push(hd(COL.belief, t('hBelief')), hd(COL.outcome, t('hOutcome')),
      hd(COL.report, [t('hReport'), p.report ? null : h('small', null, t('repClosed'))], { dataset: { closed: String(!p.report) } }));

    // layers, then rows
    var start = 0;
    s.rows.forEach(function (r, k) {
      var gr = String(k + 2);
      if (k === 0 || s.rows[k - 1].layer !== r.layer) {
        start = k;
        var n = s.rows.filter(function (x) { return x.layer === r.layer; }).length;
        kids.push(h('div', { class: 'sr-layer', dataset: { l: r.layer }, style: { gridColumn: String(COL.layer), gridRow: (start + 2) + ' / span ' + n } },
          t('l_' + r.layer)));
      }
      kids.push(h('div', { class: 'sr-band', dataset: { o: r.outcome }, 'aria-hidden': 'true', style: { gridColumn: '2 / -1', gridRow: gr } }));
      var name = t('c_' + r.id), believed = r.assumed ? 'provider' : 'customer';
      var sub = r.outcome === 'gap' ? h('span', { class: 'sr-sub', dataset: { o: 'gap' } }, t('g_' + r.id))
        : r.outcome === 'extra' ? h('span', { class: 'sr-sub', dataset: { o: 'extra' } }, t('x_' + r.id)) : null;
      var cells = [h('div', { class: 'sr-c sr-name', style: { gridColumn: String(COL.name), gridRow: gr } }, h('span', null, name), sub)];
      L.MODELS.forEach(function (m, i) {
        cells.push(h('div', { class: 'sr-c sr-m', dataset: { cur: String(m === p.model) }, style: { gridColumn: String(COL.model0 + i), gridRow: gr } },
          h('span', { class: 'sr-chip', dataset: { o: r.by[m] }, title: t('ms_' + m) }, who(r.by[m]))));
      });
      cells.push(h('div', { class: 'sr-c', style: { gridColumn: String(COL.belief), gridRow: gr } },
        h('button', {
          type: 'button', class: 'sr-chip sr-belief', dataset: { o: believed, sel: 'b-' + r.id }, 'aria-pressed': String(r.assumed),
          'aria-label': t('beliefAria', { name: name, who: who(believed) }), onmousedown: noFocus,
          onclick: press('b-' + r.id, { mask: L.toggle(p.mask, r.k) })
        }, who(believed))));
      cells.push(h('div', { class: 'sr-c sr-o', dataset: { o: r.outcome }, style: { gridColumn: String(COL.outcome), gridRow: gr } },
        h('b', { 'aria-hidden': 'true' }, O_MARK[r.outcome]), t('o_' + r.outcome)));
      cells.push(h('div', { class: 'sr-c sr-e', dataset: { e: r.evidence || 'closed' }, style: { gridColumn: String(COL.report), gridRow: gr } },
        r.evidence ? [h('b', { 'aria-hidden': 'true' }, E_MARK[r.evidence]), t('e_' + r.evidence)] : null));
      var aria = t('rowAria', { name: name, layer: t('l_' + r.layer), owner: who(r.owner), who: who(believed), outcome: t('o_' + r.outcome) }) +
        (r.evidence ? ' ' + t('rowAriaRep', { ev: t('e_' + r.evidence) }) : '');
      kids.push(h('div', { class: 'sr-row', role: 'group', 'aria-label': aria, dataset: { o: r.outcome } }, cells));
    });
    return h('div', { class: 'sr-tab' }, kids);
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    c.stage.replaceChildren(h('div', { class: 'sr' }, top(s), table(s), h('p', { class: 'sr-foot' }, t('foot'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, p = s.p, k = L.captionKey(s), r = s.report;
    var out = t.parts(k.key, { m: b(t('ms_' + p.model)), p: b(s.provider), c: b(s.customer) });
    k.notes.forEach(function (key) {
      var v = {};
      if (key === 'nGap') v = { n: s.gaps.length, name: b(t('c_' + s.gaps[0])), what: t('g_' + s.gaps[0]) };
      else if (key === 'nExtra') v = { n: s.extra.length, name: b(t('c_' + s.extra[0])) };
      else if (key === 'nReport') v = { p: b(r.proven), c: b(r.yours) };
      else if (key === 'nCarve') v = { p: b(r.proven), k: b(r.carved), c: b(r.yours) };
      out.push(' ');
      out = out.concat(t.parts(key, v));
    });
    return out;
  }

  var labels = { own: 'pOwn', iaas: 'pIaas', iaasOs: 'pIaasOs', saasAll: 'pSaasAll', saasReport: 'pSaasReport', carve: 'pCarve' };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'model', type: 'choice', label: t('model'),
        options: L.MODELS.map(function (m) { return [m, t('opt_' + m)]; }) },
      // the team's beliefs: a bit per control, set by the stage's buttons; hidden, kept in the URL
      { key: 'mask', type: 'range', label: t('mask'), min: 0, max: L.MASK_MAX, step: 1, visible: function () { return false; } },
      { type: 'button', label: t('match'), run: function (api) { api.set({ mask: L.contractMask(api.params.model) }); } },
      { key: 'report', type: 'toggle', label: t('report') },
      { key: 'carve', type: 'toggle', label: t('carve'), visible: function (q) { return !!q.report; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'sr-prov', label: t('legProv') },
      { shape: 'sr-cust', label: t('legCust') },
      { shape: 'sr-gap', label: t('legGap') },
      { shape: 'sr-extra', label: t('legExtra') },
      { shape: 'sr-proven', label: t('legProven') },
      { shape: 'sr-carved', label: t('legCarved') },
      { shape: 'sr-yours', label: t('legYours') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
