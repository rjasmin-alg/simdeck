<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { A: '1', B: '2', C: '3' };
  var MSG = { init: 'Initiation', resp: 'Response', data: 'Data' };

  /** Data (addresses, keys, prefixes, message names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'wg-mono' : cls || null }, String(text)); }
  function short(key) { return key.slice(0, 6) + '…'; }
  function has(s, id) { return s.changed.indexOf(id) >= 0; }
  function chg(on) { return on ? ' sd-changed' : ''; }
  function keyIcon(eph) { return h('span', { class: 'wg-key', dataset: eph ? { eph: '' } : {}, 'aria-hidden': 'true' }); }
  function pin() { return h('span', { class: 'wg-pin', 'aria-hidden': 'true' }); }
  function lock() { return h('span', { class: 'sd-seq-lock', 'aria-hidden': 'true' }); }
  function none(key) { return h('span', { class: 'wg-none' }, t(key || 'kNone')); }
  function keyChip(pub, changed) { return h('span', { class: 'wg-chip' + chg(changed), title: pub }, keyIcon(), data(short(pub))); }
  function pinChip(ep, changed, k) { return h('span', { class: 'wg-chip' + chg(changed), dataset: k ? { k: k } : {} }, pin(), data(ep)); }

  // ── lane cards ──
  function card(s, side) {
    var n = side === 'a' ? s.a : s.b, other = side === 'a' ? 'B' : 'A';
    var peer = L.peerOf(n, other);
    var roamedAway = side === 'b' && s.roamed && peer && peer.endpoint && peer.endpoint !== s.a.endpoint;
    var epChanged = side === 'a' ? has(s, 'a.endpoint') : false;
    var peerChanged = has(s, side + '.peers');
    var learned = side === 'b' && has(s, 'b.endpointA');
    var rows = [
      h('dt', null, t('kAddr')), h('dd', null, pinChip(n.endpoint, epChanged)),
      h('dt', null, t('kKeys')), h('dd', null,
        h('span', { class: 'wg-chip', dataset: { k: 'priv' } }, lock(), t('kPriv')), keyChip(n.staticPub)),
      h('dt', null, t('kPeer', { p: other })), h('dd', null, peer
        ? [keyChip(peer.pub, peerChanged),
          peer.endpoint ? pinChip(peer.endpoint, learned || peerChanged, roamedAway ? 'stale' : null)
            : h('span', { class: 'wg-none' + chg(peerChanged) }, pin(), ' ', t(side === 'b' ? 'kUnknown' : 'kNone'))]
        : none()),
      h('dt', null, t('kSession')), h('dd', null, n.session
        ? h('span', { class: 'wg-chip' + chg(has(s, side + '.session')) }, lock(),
          h('span', null, t('kSend', { k: n.session.send })), h('span', { class: 'wg-muted' }, '·'), h('span', null, t('kRecv', { k: n.session.recv })))
        : none())
    ];
    return h('dl', { class: 'wg-card' }, rows);
  }

  // ── chart rows ──
  function noteText(r) {
    switch (r.what) {
      case 'keys': return h('span', null, lock(), t('noteKeys'));
      case 'lookup': return h('span', null, t.parts('noteLookup', { ip: data(r.ip) }), ' → ', r.peer ? data(r.peer) : t('noteNoPeer'));
      case 'noPeer': return t('noteNoPeer');
      case 'otherPeer': return t('noteOther');
      case 'noEndpoint': return t('noteNoEp');
      case 'delivered': return t('noteOk');
      case 'dropped': return t('noteDrop');
      case 'roam': return h('span', null, pin(), ' ', t('noteRoam'), ' ', data(r.endpoint));
    }
    return '';
  }
  function chart(c) {
    var s = c.state, shown = {};
    var rows = s.rows.map(function (r) {
      var changed = r.step === c.n;
      var time = shown[r.step] ? null : String(r.step);
      shown[r.step] = true;
      if (r.kind === 'note') {
        var bad = r.what === 'dropped' || r.what === 'noPeer' || r.what === 'noEndpoint';
        return { kind: 'note', lane: r.lane, text: noteText(r), k: bad ? 'fill' : r.what === 'keys' || r.what === 'delivered' ? 'solid' : null,
          time: time, changed: changed };
      }
      var re = {};
      if (r.msg === 'init' && r.recognised) re.B = t('reKnows');
      if (r.msg === 'data' && r.learned) re.B = t('reNewAddr');
      var fields = r.msg === 'data' ? t('ctr', { n: r.counter }) : null;   // the handshake's fields are in the packet card
      return { from: r.from, to: r.to, label: MSG[r.msg], c: COLOUR[r.from], fields: fields, lock: !!r.lock, re: re,
        time: time, changed: changed };
    });
    return Simdeck.sequence({
      dir: c.dir,
      lanes: [
        { id: 'A', c: COLOUR.A, shape: 'square', name: t('peerA'), tags: h('span', { class: 'wg-muted' }, t('initiator')), body: card(s, 'a') },
        { id: 'B', c: COLOUR.B, name: t('peerB'), tags: h('span', { class: 'wg-muted' }, t('responder')), body: card(s, 'b') }
      ],
      rows: rows,
      timeWidth: '2.2rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── AllowedIPs tables (K4, most specific) ──
  function verdict(ok, text) { return h('span', { class: 'sd-rt-verdict', dataset: { ok: String(ok) } }, ok ? '✓ ' : '✕ ', text); }
  function allowedTable(c, side) {
    var s = c.state;
    var table = side === 'a' ? s.routing : s.routingB;
    var res = side === 'a' ? s.lookup : s.check;
    var touched = has(s, side === 'a' ? 'tableA' : 'tableB');
    var rows = table.map(function (r, i) {
      return { no: i + 1, cells: { prefix: r.prefix }, action: r.peer + ' · ' + short(L.KEYS[r.peer]), rank: r.len, hit: res ? res.hits[i] : null,
        tags: r.peer === 'C' ? [{ k: 'muted', text: t('notDrawn') }] : null };
    });
    var mark = res ? data((side === 'a' ? '→ ' : '← ') + res.ip) : t('markIdle');   // A: the destination; B: the inner source
    return RT({
      dir: c.dir,
      mode: 'specific',
      title: h('span', { class: 'wg-hl' + chg(touched) }, t(side === 'a' ? 'tabA' : 'tabB')),
      columns: [{ key: 'prefix', label: t('colPrefix') }],
      actionLabel: t('colPeer'),
      markLabel: mark,
      rows: rows,
      implicit: side === 'a' ? { text: t('implA'), action: t('implAAct') } : { text: t('implB'), action: t('implBAct') },
      at: res ? 'all' : -1,
      done: !!res,
      outcome: function (i) {
        if (i >= table.length) return verdict(false, side === 'a' ? t('outNone') : t('outDrop'));
        return side === 'a' ? verdict(true, t('outEncrypt', { p: table[i].peer })) : verdict(res.ok, res.ok ? t('outAccept') : t('outDrop'));
      },
      words: { win: t('wWin'), beaten: t('wBeaten') },
      changed: false
    });
  }

  // ── packet card ──
  function split(ep) { var i = ep.lastIndexOf(':'); return [ep.slice(0, i), ep.slice(i + 1)]; }
  function outer(p) {
    var src = split(p.outerSrc), dst = split(p.outerDst);
    return h('div', { class: 'wg-hdr' },
      h('span', null, h('b', { translate: 'no' }, 'IP'), ' ', data(src[0] + ' → ' + dst[0])),
      h('span', null, h('b', { translate: 'no' }, 'UDP'), ' ', data(src[1] + ' → ' + dst[1])));
  }
  function innerLine(p) { return h('span', null, h('b', { translate: 'no' }, 'IP'), ' ', data(p.innerSrc + ' → ' + p.innerDst), ' · ', t('pkData')); }
  function packet(c) {
    var s = c.state, p = s.packet;
    var title, body = [];
    if (!p) { title = t('pkTitle'); body.push(h('p', { class: 'wg-muted', style: { margin: 0 } }, t('pkNone'))); }
    else if (p.kind === 'init' || p.kind === 'resp') {
      title = t('pkWire');
      var f = p.kind === 'init'
        ? [h('span', { class: 'wg-chip', dataset: { k: 'eph' } }, keyIcon(true), t('pkEph'), ' ', data('eA')),
          h('span', { class: 'wg-chip wg-enc' }, lock(), t('pkStatic')),
          h('span', { class: 'wg-chip wg-enc' }, lock(), t('pkTime'))]
        : [h('span', { class: 'wg-chip', dataset: { k: 'eph' } }, keyIcon(true), t('pkEph'), ' ', data('eB')),
          h('span', { class: 'wg-chip wg-enc' }, lock(), t('pkEmpty'))];
      body.push(h('div', { class: 'wg-env' }, outer(p), h('div', { class: 'wg-msg' }, data(MSG[p.kind], ''), h('div', { class: 'wg-fields' }, f))));
    } else if (p.where === 'atA') {
      title = t('pkAtA');
      body.push(h('div', { class: 'wg-inner' }, innerLine(p)));
      if (p.dropReason) body.push(h('p', { class: 'wg-verdict', dataset: { ok: 'false' } }, p.dropReason === 'otherPeer' ? t('pkForC') : t('pkNotSent')));
    } else if (p.where === 'wire') {
      title = t('pkWire');
      body.push(h('div', { class: 'wg-env' }, outer(p),
        h('div', { class: 'wg-msg' }, data(MSG.data, ''), ' ', h('span', { class: 'wg-muted' }, t('pkRecv', { n: p.counter })),
          h('div', { class: 'wg-inner wg-enc' }, h('span', { class: 'wg-cap' }, lock(), ' ', t('pkEncWith', { k: 'k1' })), innerLine(p)))));
      if (p.dropReason === 'allowedIPs') body.push(h('p', { class: 'wg-verdict', dataset: { ok: 'false' } }, t.parts('pkDropped', { src: data(p.innerSrc) })));
      else if (p.delivered) body.push(h('p', { class: 'wg-verdict', dataset: { ok: 'true' } }, t.parts('pkDelivered', { dst: data(p.innerDst) })));
    } else {
      title = t('pkAtB');
      body.push(h('div', { class: 'wg-inner' }, innerLine(p)));
      body.push(p.delivered
        ? h('p', { class: 'wg-verdict', dataset: { ok: 'true' } }, t.parts('pkDelivered', { dst: data(p.innerDst) }))
        : h('p', { class: 'wg-verdict', dataset: { ok: 'false' } }, t.parts('pkDropped', { src: data(p.innerSrc) })));
    }
    return h('section', { class: 'wg-pk' }, h('h2', null, h('span', { class: 'wg-hl' + chg(has(s, 'packet')) }, title)), body);
  }

  function render(c) {
    var ch = chart(c);
    c.stage.replaceChildren(h('div', { class: 'wg' }, ch,
      h('div', { class: 'wg-side' }, allowedTable(c, 'a'), packet(c), allowedTable(c, 'b'))));
    ch.fit();
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = s.packet;
    var oldA = L.SCENE.A.endpoint;
    switch (s.phase) {
      case 'start': return t('capStart');
      case 'configure': return c.params.endpointKnown ? t('cap1') : [t('cap1'), ' ', t('cap1NoEp')];
      case 'initiation': return s.handshake.init ? t.parts('cap2', { ep: data(oldA) }) : t('cap2NoEp');
      case 'response': return s.handshake.resp ? t('cap3') : t('cap3None');
      case 'keys': return s.handshake.established ? t('cap4') : t('cap4None');
      case 'lookup':
        var lk = s.lookup;
        if (lk.win < 0) return t.parts('cap5None', { dst: data(lk.ip) });
        var out = t.parts('cap5', { dst: data(lk.ip), prefix: data(s.routing[lk.win].prefix), peer: data(lk.peer) });
        var other = lk.hits.map(function (hit, i) { return hit && i !== lk.win ? i : -1; }).filter(function (i) { return i >= 0; })[0];
        if (other != null) out = out.concat(' ', t.parts('cap5Beaten', { other: data(s.routing[other].prefix) }));
        return out;
      case 'send':
        if (p.dropReason === 'noPeer') return t.parts('cap6NoPeer', { dst: data(p.innerDst) });
        if (p.dropReason === 'otherPeer') return t('cap6Other');
        if (p.dropReason === 'noEndpoint') return t('cap6NoEp');
        return t.parts('cap6', { dst: data(p.innerDst), ep: data(p.outerDst) });
      case 'check':
        if (!s.check) return t('cap7None');
        return s.check.ok ? t.parts('cap7', { src: data(p.innerSrc), dst: data(p.innerDst) }) : t.parts('cap7Drop', { src: data(p.innerSrc) });
      case 'roam':
        var had = L.peerOf(s.b, 'A').endpoint;
        return had ? t.parts('cap8', { ep: data(s.a.endpoint), old: data(had) }) : t.parts('cap8Unknown', { ep: data(s.a.endpoint) });
      case 'learn':
        if (has(s, 'b.endpointA')) {
          var parts = t.parts('cap9', { ep: data(s.lastSeenEndpoint) });
          if (p.dropReason === 'allowedIPs') parts = parts.concat(' ', t.parts('cap9Drop', { src: data(p.innerSrc) }));
          return parts;
        }
        var known = L.peerOf(s.b, 'A').endpoint;
        return known ? t.parts('cap9None', { old: data(known) }) : t('cap9NoneUnknown');
    }
    return '';
  }

  var sendOnly = function (p) { return p.action === 'handshake' ? t('onlyWithSend') : false; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'action', type: 'choice', label: t('action'), resets: true,
        options: [['handshake', t('actHandshake')], ['send', t('actSend')], ['roam', t('actRoam')]] },
      { key: 'innerDst', type: 'select', label: t('innerDst'), hint: t('innerDstHint'),
        options: L.INNER_DSTS.map(function (ip) { return [ip, ip]; }), disabled: sendOnly },
      { key: 'allowedOk', type: 'toggle', label: t('allowedOk'), hint: t('allowedOkHint'), disabled: sendOnly },
      { key: 'endpointKnown', type: 'toggle', label: t('endpointKnown'), hint: t('endpointKnownHint') }
    ],

    presets: [
      { id: 'handshake', label: t('presetHandshake'), params: { action: 'handshake' }, hint: t('presetHandshakeHint') },
      { id: 'routing', label: t('presetRouting'), params: { action: 'send', innerDst: '10.0.0.2' }, hint: t('presetRoutingHint') },
      { id: 'allowedips-drop', label: t('presetDrop'), params: { action: 'send', allowedOk: false }, hint: t('presetDropHint') },
      { id: 'roaming', label: t('presetRoaming'), params: { action: 'roam' }, hint: t('presetRoamingHint') }
    ],

    legend: [
      { shape: 'wg-key', label: t('legKey') },
      { shape: 'wg-eph', label: t('legEph') },
      { shape: 'wg-lock', label: t('legSession') },
      { shape: 'wg-env', label: t('legTunnel') },
      { shape: 'wg-match', label: t('legMatch') },
      { shape: 'wg-pin', label: t('legPin') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
