<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var KIND = { local: 'L', site: 'S', domain: 'D', ou: 'OU', cn: 'CN' };
  var PRESET_WORDS = {
    lsdou: 'presetLsdou', 'link-order': 'presetLinkOrder', block: 'presetBlock',
    'enforced-vs-block': 'presetEnfBlock', 'two-enforced': 'presetTwoEnf', 'computers-container': 'presetCn'
  };

  /** Data (GPO, container and computer names, numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sentence(key, vars) { return [' '].concat(rich(key, vars)); }
  function list(items) {
    items = items.slice();
    if (items.length === 1) return items[0];
    var last = items.pop();
    var head = items.reduce(function (acc, it) { return acc === null ? it : t('listMore', { a: acc, b: it }); }, null);
    return t('list2', { a: head, b: last });
  }

  function containerOf(scene, id) { return scene.containers.filter(function (c) { return c.id === id; })[0]; }
  function gpoName(e) { return e.gpo === 'local' ? t('localGpo') : L.sceneOf(L.defaults).gpos[e.gpo].name; }
  function gpoNode(e) { return e.gpo === 'local' ? h('span', null, t('localGpo')) : data(gpoName(e)); }
  function gpoBold(e) { return h('b', null, gpoNode(e)); }
  function valueText(v, setting) {
    if (v == null) return t('nc');
    return setting === 'lock' ? t('min', { n: v }) : t('valOn');
  }
  function valueNode(v, setting) {
    if (v == null) return h('span', { class: 'gp-muted' }, t('nc'));
    return setting === 'lock' ? data(t('min', { n: v })) : h('span', null, t('valOn'));
  }
  function valueOf(scene, gpo, setting) {
    var vals = scene.gpos[gpo].values;
    return Object.prototype.hasOwnProperty.call(vals, setting) ? vals[setting] : null;
  }
  function lockIcon() { return h('span', { class: 'gp-lock', 'aria-hidden': 'true' }); }
  function enforcedTag() { return h('span', { class: 'sd-rt-tag gp-enf', dataset: { k: 'dashed' } }, lockIcon(), t('enforcedTag')); }
  function containerName(c) {
    if (c.kind === 'local') return h('span', null, t('localName'));
    if (c.kind === 'site') return h('span', null, t.parts('siteName', { name: data(c.name) }));
    if (c.kind === 'domain') return h('span', null, t.parts('domainName', { name: data(c.name) }));
    return data(c.name);
  }
  function whyText(e, scene) {
    if (e.status === 'blocked') return t.parts('whyBlocked', { ou: data(containerOf(scene, e.by).name) });
    if (e.status === 'link-off') return [t('whyLinkOff')];
    if (e.status === 'half-off') return [t('whyHalfOff')];
    return [];
  }

  // ── left: the containers on the path ──

  function renderPath(c) {
    var s = c.state, scene = L.sceneOf(c.params);
    var rows = (s.event && s.event.rows) || [];
    var box = h('section', { class: 'gp-path' }, h('h2', null, t.parts('pathTitle', { target: data(s.target) })));
    var depth = 0;
    scene.containers.forEach(function (ct) {
      if (ct.kind === 'ou') depth++;
      var links = ct.links.slice().sort(function (a, b) { return a.order - b.order; });
      var items = links.map(function (l) {
        var i = -1;
        s.list.forEach(function (e, k) { if (e.gpo === l.gpo && e.container === ct.id) i = k; });
        var e = s.list[i], seen = s.seen[i];
        var changed = rows.indexOf(i) >= 0;
        return h('li', {
          class: 'gp-link' + (changed ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''),
          dataset: { seen: seen || 'pending' }
        },
          ct.kind === 'local' ? null : h('span', { class: 'gp-order', translate: 'no', title: t('legOrder') }, String(l.order)),
          h('span', { class: 'gp-name' }, gpoNode(e)),
          e.enforced ? lockIcon() : null,
          h('span', { class: 'gp-val' }, valueNode(valueOf(scene, l.gpo, s.setting), s.setting)),
          seen === 'skipped' ? h('span', { class: 'gp-why' }, whyText(e, scene)) : null);
      });
      box.append(h('div', { class: 'gp-box', dataset: { kind: ct.kind, block: ct.block ? 'true' : 'false' }, style: { '--depth': String(depth) } },
        h('div', { class: 'gp-head' }, data(KIND[ct.kind], 'gp-kind'), containerName(ct),
          ct.block ? h('span', { class: 'gp-blocktag' }, h('span', { class: 'gp-wall', 'aria-hidden': 'true' }), t('blockTag')) : null),
        items.length ? h('ul', { class: 'gp-links' }, items) : h('div', { class: 'gp-none' }, t('noLinks'))));
      if (ct.kind === 'domain' && scene.where === 'cn-computers') {
        box.append(h('div', { class: 'gp-box', dataset: { kind: 'cn' }, style: { '--depth': '1' } },
          h('div', { class: 'gp-head' }, data('CN', 'gp-kind'), data('CN=Computers')),
          h('div', { class: 'gp-none' }, t('cnComputers'))));
        depth = 1;
      }
    });
    box.append(h('div', { class: 'gp-pc', style: { '--depth': String(depth + 1) } }, data(s.target), h('small', null, t('computer'))));
    return box;
  }

  // ── right: the processing order as a rule table ──

  function renderTable(c) {
    var s = c.state, scene = L.sceneOf(c.params);
    var done = s.winner !== null;
    var rows = s.event ? s.event.rows : [];
    var at = !s.event ? -1 : done ? (s.winner >= 0 ? s.list.length - 1 : s.list.length) : rows[rows.length - 1];
    return Simdeck.ruleTable({
      dir: c.dir,
      mode: 'specific',
      title: t('tableTitle', { setting: t(s.setting === 'lock' ? 'setLock' : 'setUsb') }),
      columns: [{ key: 'gpo', label: t('colGpo'), wrap: true }, { key: 'where', label: t('colWhere'), wrap: true }, { key: 'link', label: t('colLink') }],
      actionLabel: t('colValue'), markLabel: t('colMark'),
      rows: s.list.map(function (e, i) {
        var seen = s.seen[i], ct = containerOf(scene, e.container);
        var mark = null;
        if (seen === 'skipped') mark = 'skip';
        else if (!done && seen === 'applied') mark = 'hit';
        else if (!done && seen === 'overwritten') mark = 'beaten';
        var note = null;
        if (seen === 'skipped') note = [{ k: 'muted', text: t(e.status === 'blocked' ? 'whyBlockedShort' : e.status === 'link-off' ? 'whyLinkOff' : 'whyHalfOff') }];
        else if (seen === 'nc') note = [{ k: 'muted', text: t('whyNc') }];
        return {
          no: i + 1,
          cells: {
            gpo: e.enforced ? h('span', null, gpoNode(e), enforcedTag()) : gpoNode(e),
            where: ct.kind === 'local' ? 'L' : ct.kind === 'site' ? 'S ' + ct.name : ct.kind === 'domain' ? 'D' : ct.name,
            link: ct.kind === 'local' ? '–' : e.order
          },
          action: valueOf(scene, e.gpo, s.setting) == null ? '—' : valueNode(valueOf(scene, e.gpo, s.setting), s.setting),
          hit: seen === 'applied' || seen === 'overwritten' ? true : seen === 'nc' ? false : null,
          rank: i,
          mark: mark,
          note: note
        };
      }),
      implicit: { text: t('implicit') },
      at: at,
      subject: s.event ? { mark: s.target, c: 1 } : null,
      done: done,
      changed: !done || s.winner < 0,
      outcome: function (i) {
        if (i >= s.list.length) return h('b', null, t('resultNone'));
        return Simdeck.ruleTable.verdict(true, valueText(s.list[i].value, s.setting));
      },
      words: { hit: t('markStands'), beaten: t('markOver'), win: t('markWin'), skip: t('markSkip') }
    });
  }

  function renderResult(c) {
    var s = c.state, done = s.winner !== null;
    var cur = done ? s.winner : s.current;
    var changed = c.prev && (c.prev.current !== s.current || done);
    var body;
    if (cur >= 0) {
      var e = s.list[cur];
      body = [done ? Simdeck.ruleTable.verdict(true, valueText(e.value, s.setting)) : h('b', null, valueNode(e.value, s.setting)),
        h('span', null, '(', t.parts('resultFrom', { gpo: gpoNode(e) }), ')')];
    } else body = [h('b', { class: 'gp-muted' }, t('resultNone'))];
    return h('section', { class: 'gp-result' + (done ? ' gp-final' : '') + (changed ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : '') },
      h('span', null, t(done ? 'resultWinner' : 'resultNow'), ' · ', data(s.target), ' · ', t(s.setting === 'lock' ? 'setLock' : 'setUsb'), ':'),
      body);
  }

  // ── captions ──

  function captionStart(s, scene) {
    if (scene.where === 'cn-computers') {
      var cnOut = rich('capStartCn', { target: data(s.target) });
      return s.list.some(function (e) { return e.enforced; }) ? cnOut.concat(sentence('capStartEnf')) : cnOut;
    }
    var out = rich('capStart', { target: data(s.target), where: data('OU=Workstations') });
    var blocker = scene.containers.filter(function (ct) { return ct.block; })[0];
    if (blocker) out = out.concat(sentence('capStartBlock', { ou: data(blocker.name) }));
    if (s.list.some(function (e) { return e.enforced; })) out = out.concat(sentence('capStartEnf'));
    return out;
  }

  function captionEvent(c) {
    var s = c.state, scene = L.sceneOf(c.params), ev = s.event, n = c.n;
    var e = s.list[ev.rows[0]];
    if (ev.kind === 'blocked') {
      var dropped = ev.rows.map(function (i) { return gpoName(s.list[i]); });
      var ou = containerOf(scene, e.by).name;
      var out = rich(dropped.length > 1 ? 'capBlocked' : 'capBlockedOne', { n: n, ou: data(ou), list: data(list(dropped)) });
      if (s.list.some(function (x) { return x.enforced && x.depth < containerIndex(scene, e.by); })) out = out.concat(sentence('capBlockedEnf'));
      if (s.list[0].kind === 'local') out = out.concat(sentence('capBlockedLocal'));
      return out;
    }
    if (ev.kind === 'link-off') return rich('capLinkOff', { n: n, gpo: gpoBold(e) });
    if (ev.kind === 'half-off') return rich('capHalfOff', { n: n, gpo: gpoBold(e) });
    var cur = ev.prev >= 0 ? s.list[ev.prev] : null;
    if (ev.kind === 'nc') {
      return cur ? rich('capNc', { n: n, gpo: gpoBold(e), v: h('b', null, valueNode(cur.value, s.setting)) }) : rich('capNcNone', { n: n, gpo: gpoBold(e) });
    }
    // apply
    var v = h('b', null, valueNode(e.value, s.setting));
    var out2 = cur ? rich('capApply', { n: n, gpo: gpoBold(e), v: v, old: valueNode(cur.value, s.setting), prev: gpoNode(cur) })
      : rich('capApplyFirst', { n: n, gpo: gpoBold(e), v: v });
    var ct = containerOf(scene, e.container);
    if (e.enforced) {
      out2 = out2.concat(sentence('capEnf', { gpo: gpoNode(e) }));
      var lowerEnf = s.list.some(function (x) { return x.enforced && x.depth > e.depth; });
      if (lowerEnf) out2 = out2.concat(sentence('capEnfHigh'));
      if (s.list.some(function (x) { return x.status === 'blocked'; }) && e.depth < blockIndex(scene)) out2 = out2.concat(sentence('capEnfBlock'));
    } else if (ct.kind !== 'local' && ct.links.length > 1) {
      var laterSame = s.list.slice(ev.rows[0] + 1).some(function (x) { return x.container === e.container; });
      out2 = out2.concat(e.order !== 1 ? sentence('capOrderHigh', { k: data(e.order) }) : sentence(laterSame ? 'capOrderOneNe' : 'capOrderOne'));
    }
    return out2;
  }
  function containerIndex(scene, id) { var k = -1; scene.containers.forEach(function (ct, i) { if (ct.id === id) k = i; }); return k; }
  function blockIndex(scene) { var k = -1; scene.containers.forEach(function (ct, i) { if (ct.block) k = i; }); return k; }

  function captionWinner(c) {
    var s = c.state, scene = L.sceneOf(c.params);
    if (s.winner < 0) {
      var setters = s.list.filter(function (x) { return x.value != null || (x.status === 'blocked' && valueOf(scene, x.gpo, s.setting) != null); });
      var out = rich('capWinNone');
      var blockedSetter = s.list.filter(function (x) { return x.status === 'blocked' && valueOf(scene, x.gpo, s.setting) != null; })[0];
      if (blockedSetter && setters.length === 1) out = out.concat(sentence('capWinNoneBlocked', { gpo: gpoBold(blockedSetter) }));
      return out;
    }
    var w = s.list[s.winner], ct = containerOf(scene, w.container);
    var v = h('b', null, valueNode(w.value, s.setting));
    if (w.enforced) {
      if (w.kind === 'domain' && blockIndex(scene) > w.depth) return rich('capWinEnfBlock', { v: v });
      return rich('capWinEnf', { gpo: gpoBold(w), v: v });
    }
    var laterSameW = s.list.slice(s.winner + 1).some(function (x) { return x.container === w.container; });
    if (ct.kind !== 'local' && w.order === 1 && ct.links.length > 1 && !laterSameW) return rich('capWinOrder', { gpo: gpoBold(w), v: v });
    return rich('capWin', { gpo: gpoBold(w), v: v });
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'setting', type: 'select', label: t('setting'), resets: true, options: [['lock', t('setLock')], ['usb', t('setUsb')]] },
      { key: 'cn', type: 'toggle', label: t('cn'), resets: true },
      { key: 'blockWs', type: 'toggle', label: t('blockWs'), resets: true },
      { key: 'enforceDomain', type: 'toggle', label: t('enforceDomain'), resets: true },
      { key: 'enforceOu', type: 'toggle', label: t('enforceOu'), resets: true },
      { key: 'swapOrder', type: 'toggle', label: t('swapOrder'), resets: true }
    ],

    presets: L.presets.map(function (pr) {
      var w = PRESET_WORDS[pr.id];
      return { id: pr.id, label: t(w), params: pr.params, hint: t(w + 'Hint') };
    }),

    legend: [
      { shape: 'gp-box', label: t('legBox') },
      { shape: 'gp-order', label: t('legOrder') },
      { shape: 'gp-lock', label: t('legLock') },
      { shape: 'gp-wall', label: t('legWall') },
      { shape: 'rt-beaten', label: t('legOver') },
      { shape: 'rt-skip', label: t('legSkip') },
      { shape: 'rt-win', label: t('legWin') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'gp' }, renderPath(c), h('div', { class: 'gp-right' }, renderTable(c), renderResult(c))));
    },

    caption: function (c) {
      var s = c.state;
      if (!s.event) return captionStart(s, L.sceneOf(c.params));
      if (s.event.kind === 'winner') return captionWinner(c);
      return captionEvent(c);
    }
  });
})();
</script>
</body>
</html>
