<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (SSIDs, BSSIDs, channels, frame names, numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'wa-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text, '')); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      // a placeholder used twice is the same node: clone it, or appending moves it
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function dbm(n) { return String(n).replace('-', '−') + ' dBm'; }
  function secOf(ap, p) { return ap.sec || p.security; }
  var SEC = { open: 'secOpen', wpa2: 'secWpa2', wpa3: 'secWpa3' };
  function badge(sec) { return h('span', { class: 'wa-sec', dataset: { sec: sec } }, t(SEC[sec])); }
  function bars(rssi) {
    var on = rssi >= -50 ? 4 : rssi >= -60 ? 3 : rssi >= -70 ? 2 : 1;
    return h('span', { class: 'wa-sig', 'aria-hidden': 'true' }, [1, 2, 3, 4].map(function (k) { return h('i', { dataset: k <= on ? { on: '' } : {} }); }));
  }
  var COLOR = { STA: 1, AP1: 2, AP2: 3, AP3: 4 };

  // ── the chart (K1) ──

  /** Chip, fields and time-column word per frame. Frames from STA run right, into open space: their fields sit beside
      the chip. Frames to STA run left, towards the time column: no fields; the status goes under the channel. */
  function chips(f) {
    switch (f.type) {
      case 'probe-req': return { label: 'Probe Request', fields: h('span', null, t('anySsid')), line: 'dashed', time: t('chans', { list: f.ch.join(',') }) };
      case 'probe-resp': return { label: 'Probe Response' };
      case 'beacon': return { label: 'Beacon', line: 'dashed' };
      case 'auth': {
        var what = f.alg === 'open' ? 'Open System' : f.seq === 1 ? 'SAE Commit' : 'SAE Confirm';
        if (f.from === 'STA') return { label: 'Authentication', fields: what };
        return { label: 'Authentication', cause: data(f.alg === 'open' ? t('fStatus', { n: f.status }) : f.seq === 1 ? 'Commit' : 'Confirm', '') };
      }
      case 'assoc-req': return { label: 'Association Request', fields: f.ssid };
      case 'assoc-resp': return { label: 'Association Response', cause: data(t('fStatus', { n: f.status }), '') };
      case 'hs': return { label: h('span', null, t('hsChip')), re: { STA: t('reKeys') } };
      case 'data': return { label: 'Data', lock: f.enc, re: f.enc ? {} : { AP: t('reClear') } };
    }
    return {};
  }

  function renderChart(c) {
    var s = c.state, fresh = c.prev ? c.prev.frames.length : 0;
    var rows = s.frames.map(function (f, i) {
      var changed = i >= fresh;
      if (f.type === 'ds') return { kind: 'note', lane: f.at, k: 'solid', text: t('noteDs'), changed: changed };
      var x = chips(f);
      var re = x.re || {};
      if (re.AP) { re[f.to] = re.AP; delete re.AP; }
      return {
        from: f.from, to: f.to, c: COLOR[f.from], label: x.label, fields: x.fields, line: x.line, lock: x.lock || undefined,
        re: re, time: x.time || t('chan', { n: f.ch }), cause: x.cause, changed: changed
      };
    });
    var lanes = [{ id: 'STA', c: 1, shape: 'square', name: t('laneSta'), body: staCard(c) }].concat(L.APS.map(function (a) {
      return { id: a.id, c: COLOR[a.id], name: h('span', { class: 'wa-ssid', translate: 'no' }, a.ssid), tags: badge(secOf(a, c.params)),
        state: s.chosen === a.id ? 'active' : null, changed: c.prev && c.prev.pair[a.id] !== s.pair[a.id], body: apCard(c, a) };
    }));
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '6rem',
      lanes: lanes,
      rows: rows,
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  function staCard(c) {
    var s = c.state, ch = s.chosen ? L.apOf(s.chosen).ch : null;
    var scanning = !s.chosen && s.n > 0;
    return h('div', { class: 'wa-card' },
      h('p', null, h('span', { class: 'wa-muted' }, t('cardWants'), ' '), h('span', { class: 'wa-ssid', translate: 'no' }, L.WANT)),
      h('p', null, ch ? [h('span', { class: 'wa-muted' }, t('cardOn'), ' '), data(ch, '')] : scanning ? t('cardOff') : '—'),
      h('p', null, s.aid ? data('AID ' + s.aid) : ' '));
  }
  function apCard(c, a) {
    var k = c.state.pair[a.id];
    return h('div', { class: 'wa-card' },
      h('p', null, data(t('chan', { n: a.ch }) + ' · ' + dbm(a.rssi), '')),
      h('p', { class: 'wa-bssid' }, data(a.bssid)),
      h('p', { class: 'wa-pair' }, data('STA:', 'wa-muted'), ' ', t('pair' + k)));
  }

  // ── left: the station ──

  /** The status an AP refused the station with (its Association Response), for the list. */
  function refusedStatus(s, ap) {
    var f = s.frames.filter(function (x) { return x.type === 'assoc-resp' && x.from === ap && x.status !== L.OK; })[0];
    return f ? f.status : '';
  }

  function renderSta(c) {
    var s = c.state, p = c.params, box = h('section', { class: 'wa-box' });
    box.append(h('h2', null, t('staTitle')));
    box.append(h('p', { class: 'wa-want' }, h('span', { class: 'wa-muted' }, t('wants')), B(L.WANT), badge(p.security),
      h('span', { class: 'wa-sm wa-muted' }, t(p.security === 'open' ? 'pwNone' : 'pwSaved'))));

    box.append(h('h3', null, t('listTitle')));
    if (!s.heard.length) box.append(h('p', { class: 'wa-empty wa-sm wa-muted' }, t('listEmpty')));
    else {
      var before = c.prev ? c.prev.heard.length : 0;
      var head = h('tr', null, h('th', null, ''), h('th', null, t('colSsid')), h('th', null, t('colCh')), h('th', null, t('colSig')), h('th', null, t('colSec')));
      box.append(h('table', { class: 'wa-nets' }, h('thead', null, head), h('tbody', null, s.heard.map(function (n, i) {
        var st = s.refused.indexOf(n.ap) >= 0 ? 'refused' : s.chosen === n.ap ? 'chosen' : 'other';
        var was = c.prev ? (c.prev.refused.indexOf(n.ap) >= 0 ? 'refused' : c.prev.chosen === n.ap ? 'chosen' : 'other') : st;
        var ch = i >= before || was !== st;
        var word = st === 'chosen' ? t('rowChosen') : st === 'refused' ? t('rowRefused') + ' (' + refusedStatus(s, n.ap) + ')' : t(n.via === 'probe' ? 'viaProbe' : 'viaBeacon');
        return h('tr', { class: 'wa-net' + (ch ? ' sd-changed' + anim(c) : ''), dataset: { st: st } },
          h('td', { 'aria-hidden': 'true' }, st === 'chosen' ? '▶' : st === 'refused' ? '✕' : ''),
          h('td', null, h('b', { translate: 'no' }, n.ssid), h('span', { class: 'wa-net-st' + (st === 'other' ? ' wa-muted' : '') }, word)),
          h('td', null, data(n.ch, '')),
          h('td', null, bars(n.rssi), data(String(n.rssi).replace('-', '−'), '')),
          h('td', null, badge(n.sec)));
      }))));
    }

    var tgt = s.chosen, k = L.LADDER.indexOf(s.staState);
    var retarget = c.prev && c.prev.chosen !== tgt;
    box.append(h('h3', { class: retarget ? 'sd-changed' + anim(c) : null }, tgt ? t('ladderTitle', { ap: tgt }) : t('ladderNone')));
    var KEYS = { none: 'rungNone', auth: 'rungAuth', assoc: 'rungAssoc', keys: 'rungKeys', data: 'rungData' };
    var was = c.prev && !retarget ? L.LADDER.indexOf(c.prev.staState) : -1;
    box.append(h('ol', { class: 'wa-ladder' }, L.LADDER.map(function (r, i) {
      var na = r === 'keys' && p.security === 'open';
      var st = na ? 'na' : i <= k ? 'on' : 'off';
      var ch = !na && i === k && was >= 0 && was !== k;
      return h('li', { class: 'wa-rung' + (ch ? ' sd-changed' + anim(c) : ''), dataset: { st: st } },
        h('span', { class: 'wa-mark', 'aria-hidden': 'true' }, st === 'on' ? '✓' : ''),
        h('span', null, t(na ? 'rungNa' : KEYS[r])),
        h('span', null, r === 'assoc' && s.aid && i <= k ? data(t('aidIs', { n: s.aid }), '') : ''));
    })));
    return box;
  }

  // ── captions ──

  function apB(id) { return B(id); }
  function caption(c) {
    var s = c.state, p = c.params, ev = s.ev;
    switch (ev.kind) {
      case 'start':
        return rich('capStart', { sec: t(SEC[p.security]), scan: t(p.scan === 'passive' ? 'capStartPassive' : 'capStartActive') });
      case 'probe': return rich('capProbe');
      case 'responses': return rich('capResponses');
      case 'beacon': {
        var a = L.apOf(ev.ap);
        var out = rich('capBeacon', { ch: B(a.ch), ap: apB(a.id), ssid: B(a.ssid) });
        return ev.last ? out.concat(' ', rich('capBeaconLast')) : out;
      }
      case 'choose': {
        var pick = L.apOf(ev.ap), other = L.APS.filter(function (x) { return x.ssid === L.WANT && x.id !== ev.ap; })[0];
        return rich('capChoose', { who: t(s.heard[0].via === 'beacon' ? 'capWhoBeacon' : 'capWhoProbe'), ap: apB(pick.id), rssi: data(dbm(pick.rssi).replace(' dBm', ''), ''), other: data(dbm(other.rssi).replace(' dBm', ''), '') });
      }
      case 'auth':
        return rich('capAuthOpen', { ap: apB(ev.ap) }).concat(' ', rich(p.security === 'open' ? 'capAuthOpenOpen' : 'capAuthOpenWpa'));
      case 'sae-commit': return rich('capSaeCommit');
      case 'sae-confirm': return rich('capSaeConfirm', { ap: apB(ev.ap) });
      case 'assoc-req': return rich('capAssocReq', { ap: apB(ev.ap) });
      case 'assoc':
        return rich('capAssoc', { ap: apB(ev.ap), aid: B('AID ' + ev.aid) }).concat(' ', rich(p.security === 'open' ? 'capAssocOpen' : 'capAssocWpa'));
      case 'refused': return rich('capRefused', { ap: apB(ev.ap), status: B(s.status), next: apB(ev.next) });
      case 'keys': {
        var link = h('a', { href: '../wpa-handshake/index.html?lang=' + Simdeck.lang }, t('linkHs'));
        return rich('capKeys', { ap: apB(ev.ap), pmk: t(p.security === 'wpa3' ? 'pmkWpa3' : 'pmkWpa2'), link: link });
      }
      case 'data': return rich(ev.enc ? 'capDataEnc' : 'capDataOpen');
    }
    return [];
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scan', type: 'choice', label: t('scan'), resets: true, options: [['active', t('scanActive')], ['passive', t('scanPassive')]] },
      { key: 'security', type: 'choice', label: t('security'), resets: true, options: [['open', t('secOpen')], ['wpa2', t('secWpa2')], ['wpa3', t('secWpa3')]] },
      { key: 'reject', type: 'toggle', label: t('reject') }
    ],

    presets: [
      { id: 'book-order', label: t('presetBook'), hint: t('presetBookHint'), params: {} },
      { id: 'passive', label: t('presetPassive'), hint: t('presetPassiveHint'), params: { scan: 'passive' } },
      { id: 'choose-best', label: t('presetChoose'), hint: t('presetChooseHint'), params: {}, step: 2 },
      { id: 'open-network', label: t('presetOpen'), hint: t('presetOpenHint'), params: { security: 'open' } },
      { id: 'wpa3', label: t('presetWpa3'), hint: t('presetWpa3Hint'), params: { security: 'wpa3' } },
      { id: 'rejected', label: t('presetReject'), hint: t('presetRejectHint'), params: { reject: true } }
    ],

    legend: [
      { shape: 'line', label: t('legFrame') },
      { shape: 'dash', label: t('legProbe') },
      { shape: 'lock', label: t('legLock') },
      { shape: 'badge', label: t('legBadge') },
      { shape: 'rung', label: t('legRung') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'wa' },
        h('div', { class: 'wa-col' }, renderSta(c)),
        h('div', { class: 'wa-col wa-mid' }, chart)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
