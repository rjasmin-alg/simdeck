<title>Radiofrekvencijski spektar — EU/HR Bandplan</title>

<style>
:root {
  --bg: #060a12;
  --bg-panel: #0c1220;
  --bg-hover: #162035;
  --border: rgba(255,255,255,0.07);
  --text: #c8cdd8;
  --text-dim: #5a6478;
  --text-bright: #eef0f5;

  --cat-mobile: #e63946;
  --cat-wlan: #457b9d;
  --cat-iot: #2a9d8f;
  --cat-sat: #8338ec;
  --cat-broadcast: #fb8500;
  --cat-ham: #06d6a0;
  --cat-pmr: #ef476f;
  --cat-fixed: #118ab2;
  --cat-radar: #ffd166;

  --band-primary: rgba(255,255,255,0.025);
  --band-secondary: rgba(255,255,255,0.012);
  --itu-label: rgba(255,255,255,0.18);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; }

/* ===== TOP BAR ===== */
.topbar {
  height: 48px;
  display: flex;
  align-items: center;
  padding: 0 24px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  gap: 16px;
  z-index: 100;
  position: relative;
}

.topbar h1 {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-bright);
  white-space: nowrap;
}

.topbar h1 span {
  font-weight: 400;
  color: var(--text-dim);
  font-size: 12px;
  margin-left: 8px;
  font-family: 'JetBrains Mono', monospace;
}

.tb-sep { width:1px; height:24px; background:var(--border); flex-shrink:0; }

.tb-btn {
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  padding:5px 12px;
  border:1px solid var(--border);
  border-radius:4px;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
}
.tb-btn:hover { background:var(--bg-hover); color:var(--text-bright); border-color:rgba(255,255,255,0.15); }
.tb-btn.active { background:#457b9d; border-color:#457b9d; color:#fff; }

.zoom-info {
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text-dim);
  min-width:60px;
  text-align:center;
}

.cat-toggles {
  display:flex;
  gap:6px;
  margin-left:auto;
  flex-wrap:nowrap;
  overflow-x:auto;
}

.cat-tog {
  display:flex;
  align-items:center;
  gap:4px;
  font-size:10px;
  font-family:'JetBrains Mono',monospace;
  color:var(--text-dim);
  cursor:pointer;
  white-space:nowrap;
  padding:3px 8px;
  border-radius:3px;
  border:1px solid transparent;
  transition:all .15s;
  user-select:none;
}
.cat-tog:hover { border-color:var(--border); }
.cat-tog.off { opacity:0.3; }
.cat-tog .dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }

/* ===== CANVAS AREA ===== */
.canvas-area {
  position: relative;
  width: 100%;
  height: calc(100vh - 48px);
  overflow: hidden;
  cursor: grab;
}
.canvas-area.dragging { cursor: grabbing; }

canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* ===== TOOLTIP ===== */
.tt {
  position:fixed;
  display:none;
  background:rgba(8,12,24,0.96);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:8px;
  padding:12px 16px;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--text);
  pointer-events:none;
  z-index:200;
  box-shadow:0 12px 48px rgba(0,0,0,0.7);
  max-width:360px;
  line-height:1.5;
}
.tt-name { font-weight:700; font-size:14px; color:var(--text-bright); margin-bottom:2px; }
.tt-freq { color:var(--text-dim); font-size:11px; }
.tt-cat { font-size:10px; text-transform:uppercase; letter-spacing:1px; margin-top:3px; }
.tt-note { font-family:'Outfit',sans-serif; font-size:12px; color:var(--text-dim); margin-top:5px; font-style:italic; }
.tt-band { margin-top:6px; padding-top:6px; border-top:1px solid var(--border); font-size:11px; }
.tt-band strong { color:var(--text-bright); }

/* ===== MINIMAP ===== */
.minimap {
  position:absolute;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  height:32px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:6px;
  overflow:hidden;
  cursor:pointer;
  z-index:50;
}
.minimap canvas { width:100%; height:100%; }
.minimap-viewport {
  position:absolute;
  top:0;
  height:100%;
  background:rgba(69,123,157,0.2);
  border:1px solid rgba(69,123,157,0.6);
  border-radius:3px;
  pointer-events:none;
}

/* ===== HELP OVERLAY ===== */
.help-box {
  position:absolute;
  bottom:60px;
  right:16px;
  background:var(--bg-panel);
  border:1px solid var(--border);
  border-radius:8px;
  padding:14px 18px;
  font-size:12px;
  line-height:1.7;
  color:var(--text-dim);
  z-index:50;
  display:none;
  min-width:240px;
}
.help-box.visible { display:block; }
.help-box kbd {
  background:rgba(255,255,255,0.06);
  border:1px solid var(--border);
  border-radius:3px;
  padding:1px 5px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--text);
}
</style>
</head>

  {fMin:1710,fMax:1880,label:'GSM/LTE 1800',service:'mobile',note:'DCS/Band 3'},
  {fMin:1880,fMax:1900,label:'DECT',service:'gov',note:'Bežični telefoni'},
  {fMin:1920,fMax:2170,label:'UMTS/5G 2100',service:'mobile',note:'Band 1'},
  {fMin:2300,fMax:2450,label:'13cm HAM / ISM',service:'ham',note:'Sekundarni / ISM'},
  {fMin:2400,fMax:2483.5,label:'ISM 2.4G',service:'iot',note:'Wi-Fi, BT, Zigbee'},
  {fMin:2500,fMax:2690,label:'LTE 2600',service:'mobile',note:'Band 7/38'},
  // S/C-band
  {fMin:3300,fMax:3800,label:'5G C-band',service:'mobile',note:'n78, glavni 5G band EU'},
  {fMin:5150,fMax:5725,label:'RLAN 5 GHz',service:'iot',note:'Wi-Fi UNII'},
  {fMin:5725,fMax:5875,label:'ISM 5.8G',service:'iot',note:'ISM'},
  {fMin:5925,fMax:6425,label:'Wi-Fi 6E',service:'iot',note:'EU lower 6 GHz'},
  // Higher bands (simplified)
  {fMin:10700,fMax:12750,label:'FSS Ku DL',service:'sat',note:'DTH satelitska'},
  {fMin:13750,fMax:14500,label:'FSS Ku UL',service:'sat',note:'VSAT uplink'},
  {fMin:17700,fMax:19700,label:'FSS Ka DL',service:'sat',note:'Starlink/HTS'},
  {fMin:24250,fMax:27500,label:'5G mmWave',service:'mobile',note:'26 GHz band, n258'},
  {fMin:57000,fMax:66000,label:'60 GHz ISM',service:'iot',note:'WiGig/V-band'},
  {fMin:76000,fMax:81000,label:'Auto Radar',service:'radar',note:'77 GHz ADAS'},
];

const SERVICE_COLORS = {
  ham: '#06d6a0',
  mobile: '#e63946',
  broadcast: '#fb8500',
  pmr: '#ef476f',
  nav: '#ffd166',
  sat: '#8338ec',
  iot: '#2a9d8f',
  gov: '#5a6478',
  radar: '#ffd166',
};

// ================================================================
// STATE
// ================================================================
const state = {
  // Frequency range in MHz (log scale)
  fMinLog: Math.log10(0.009),  // 9 kHz
  fMaxLog: Math.log10(300000), // 300 GHz

  // Viewport in log-frequency space
  viewMinLog: Math.log10(0.009),
  viewMaxLog: Math.log10(300000),

  // Interaction
  isDragging: false,
  dragStartX: 0,
  dragStartViewMin: 0,

  // Toggles
  hiddenCats: new Set(),
  showBandplan: true,

  // Layout constants
  headerH: 30,
  bandplanH: 28,
  rowH: 18,
  rowGap: 2,
  groupGap: 8,
  axisH: 36,
  paddingL: 10,
  paddingR: 10,
  paddingTop: 8,
};

// ================================================================
// CANVAS SETUP
// ================================================================
const canvasArea = document.getElementById('canvasArea');
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('minimapCanvas');
const mmCtx = mmCanvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

function resize() {
  const w = canvasArea.clientWidth;
  const h = canvasArea.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Minimap
  const mmW = Math.min(w * 0.6, 700);
  const mmH = 32;
  document.getElementById('minimap').style.width = mmW + 'px';
  mmCanvas.width = mmW * dpr;
  mmCanvas.height = mmH * dpr;
  mmCanvas.style.width = mmW + 'px';
  mmCanvas.style.height = mmH + 'px';
  mmCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// ================================================================
// COORDINATE HELPERS
// ================================================================
function logFreq(fMHz) { return Math.log10(Math.max(fMHz, 0.001)); }

function freqToX(fMHz) {
  const w = canvasArea.clientWidth;
  const lf = logFreq(fMHz);
  return state.paddingL + ((lf - state.viewMinLog) / (state.viewMaxLog - state.viewMinLog)) * (w - state.paddingL - state.paddingR);
}

function xToLogFreq(x) {
  const w = canvasArea.clientWidth;
  return state.viewMinLog + ((x - state.paddingL) / (w - state.paddingL - state.paddingR)) * (state.viewMaxLog - state.viewMinLog);
}

function formatFreq(fMHz) {
  if (fMHz >= 1000) return (fMHz/1000).toFixed(fMHz >= 10000 ? 0 : (fMHz >= 1000 ? 1 : 2)) + ' GHz';
  if (fMHz >= 1) return fMHz.toFixed(fMHz < 10 ? (fMHz < 1 ? 3 : 2) : (fMHz < 100 ? 1 : 0)) + ' MHz';
  if (fMHz >= 0.001) return (fMHz * 1000).toFixed(fMHz * 1000 < 100 ? 1 : 0) + ' kHz';
  return (fMHz * 1e6).toFixed(0) + ' Hz';
}

function zoomLevel() {
  const fullRange = state.fMaxLog - state.fMinLog;
  const viewRange = state.viewMaxLog - state.viewMinLog;
  return fullRange / viewRange;
}

// ================================================================
// DRAWING
// ================================================================
function draw() {
  const W = canvasArea.clientWidth;
  const H = canvasArea.clientHeight;
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#060a12';
  ctx.fillRect(0, 0, W, H);

  const plotTop = state.paddingTop;
  let y = plotTop;

  // --- ITU Band backgrounds ---
  const ituBands = [
    {name:'VLF',fMin:0.003,fMax:0.03},
    {name:'LF',fMin:0.03,fMax:0.3},
    {name:'MF',fMin:0.3,fMax:3},
    {name:'HF',fMin:3,fMax:30},
    {name:'VHF',fMin:30,fMax:300},
    {name:'UHF',fMin:300,fMax:3000},
    {name:'SHF',fMin:3000,fMax:30000},
    {name:'EHF',fMin:30000,fMax:300000},
  ];

  ituBands.forEach((band, i) => {
    const x1 = freqToX(band.fMin);
    const x2 = freqToX(band.fMax);
    if (x2 < 0 || x1 > W) return;
    const cx1 = Math.max(x1, 0);
    const cx2 = Math.min(x2, W);
    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.015)' : 'rgba(255,255,255,0.03)';
    ctx.fillRect(cx1, 0, cx2 - cx1, H);

    // Label at top
    const cx = (Math.max(x1, state.paddingL) + Math.min(x2, W - state.paddingR)) / 2;
    if (cx > state.paddingL && cx < W - state.paddingR && (cx2 - cx1) > 30) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.font = '600 10px "JetBrains Mono"';
      ctx.textAlign = 'center';
      ctx.fillText(band.name, cx, 14);
    }
  });

  y = 22;

  // --- EU/HR Bandplan row ---
  if (state.showBandplan) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(0, y, W, state.bandplanH + 4);

    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '600 9px "JetBrains Mono"';
    ctx.textAlign = 'left';
    ctx.fillText('EU/HR BANDPLAN', state.paddingL, y + 10);

    y += 14;

    EU_BANDPLAN.forEach(band => {
      const x1 = freqToX(band.fMin);
      const x2 = freqToX(band.fMax);
      if (x2 < 0 || x1 > W) return;
      const cx1 = Math.max(x1, 0);
      const cx2 = Math.min(x2, W);
      const bw = cx2 - cx1;
      if (bw < 1) return;

      const col = SERVICE_COLORS[band.service] || '#5a6478';
      ctx.fillStyle = col;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(cx1, y, bw, state.bandplanH - 4);
      ctx.globalAlpha = 1;

      // Border
      ctx.strokeStyle = col;
      ctx.globalAlpha = 0.5;
      ctx.lineWidth = 0.5;
      ctx.strokeRect(cx1, y, bw, state.bandplanH - 4);
      ctx.globalAlpha = 1;

      // Label if wide enough
      if (bw > 40) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '500 8px "JetBrains Mono"';
        ctx.textAlign = 'center';
        const label = bw > 80 ? band.label : band.label.substring(0, Math.floor(bw / 6));
        ctx.fillText(label, cx1 + bw / 2, y + (state.bandplanH - 4) / 2 + 3, bw - 4);
      }
    });

    y += state.bandplanH + 4;
  }

  y += 4;

  // --- Technology rows by category ---
  const visibleCats = CATEGORIES.filter(c => !state.hiddenCats.has(c.id));

  // Store bar positions for hit testing
  window._bars = [];

  visibleCats.forEach(cat => {
    // Category label
    ctx.fillStyle = cat.color;
    ctx.globalAlpha = 0.6;
    ctx.font = '700 10px "JetBrains Mono"';
    ctx.textAlign = 'left';
    ctx.fillText(cat.name.toUpperCase(), state.paddingL, y + 10);
    ctx.globalAlpha = 1;
    y += 14;

    cat.techs.forEach(tech => {
      const x1 = freqToX(tech.fMin);
      const x2 = freqToX(tech.fMax);
      const bx1 = Math.max(x1, 0);
      const bx2 = Math.min(x2, W);

      if (bx2 < 0 || bx1 > W) {
        y += state.rowH + state.rowGap;
        return;
      }

      let bw = bx2 - bx1;
      // For narrowband: show at least 4px
      const drawX = bw < 4 ? (x1 + x2) / 2 - 2 : bx1;
      const drawW = bw < 4 ? 4 : bw;

      // Bar
      ctx.fillStyle = cat.color;
      ctx.globalAlpha = 0.7;
      const r = Math.min(3, drawW / 2);
      roundRect(ctx, drawX, y, drawW, state.rowH, r);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Label
      const labelW = ctx.measureText(tech.name).width;
      ctx.font = '500 10px "JetBrains Mono"';
      if (drawW > labelW + 8) {
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'left';
        ctx.fillText(tech.name, drawX + 4, y + 12);
      } else if (drawX + drawW + labelW + 8 < W) {
        ctx.fillStyle = cat.color;
        ctx.globalAlpha = 0.8;
        ctx.textAlign = 'left';
        ctx.fillText(tech.name, drawX + drawW + 4, y + 12);
        ctx.globalAlpha = 1;
      }

      // Store for hit testing
      window._bars.push({
        x: drawX, y: y, w: drawW, h: state.rowH,
        tech, cat
      });

      y += state.rowH + state.rowGap;
    });

    y += state.groupGap;
  });

  // --- Frequency axis ---
  const axisY = H - state.axisH;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(state.paddingL, axisY);
  ctx.lineTo(W - state.paddingR, axisY);
  ctx.stroke();

  // Dynamic tick generation based on zoom level
  const ticks = generateTicks(state.viewMinLog, state.viewMaxLog);
  ticks.forEach(fMHz => {
    const x = freqToX(fMHz);
    if (x < state.paddingL || x > W - state.paddingR) return;

    // Vertical grid line
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, axisY);
    ctx.stroke();

    // Tick
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(x, axisY);
    ctx.lineTo(x, axisY + 6);
    ctx.stroke();

    // Label
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '400 10px "JetBrains Mono"';
    ctx.textAlign = 'center';
    ctx.fillText(formatFreq(fMHz), x, axisY + 18);
  });

  // Axis label
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '400 10px "JetBrains Mono"';
  ctx.textAlign = 'center';
  ctx.fillText('Frekvencija', W / 2, H - 4);

  // Update zoom display
  document.getElementById('zoomInfo').textContent = zoomLevel().toFixed(1) + '×';

  // Draw minimap
  drawMinimap();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function generateTicks(logMin, logMax) {
  const range = logMax - logMin;
  const ticks = [];

  // Major decades
  const decadeStart = Math.floor(logMin);
  const decadeEnd = Math.ceil(logMax);

  for (let d = decadeStart; d <= decadeEnd; d++) {
    const f = Math.pow(10, d);
    if (logFreq(f) >= logMin && logFreq(f) <= logMax) ticks.push(f);

    // Sub-decade ticks depending on zoom
    if (range < 3) {
      // Show 2, 3, 5 subdivisions
      [2, 3, 5].forEach(m => {
        const sf = f * m;
        if (logFreq(sf) >= logMin && logFreq(sf) <= logMax) ticks.push(sf);
      });
    }
    if (range < 1.5) {
      [1.5, 4, 6, 8].forEach(m => {
        const sf = f * m;
        if (logFreq(sf) >= logMin && logFreq(sf) <= logMax) ticks.push(sf);
      });
    }
    if (range < 0.7) {
      for (let m = 1.1; m < 10; m += 0.5) {
        const sf = f * m;
        if (logFreq(sf) >= logMin && logFreq(sf) <= logMax) ticks.push(sf);
      }
    }
  }

  return [...new Set(ticks)].sort((a, b) => a - b);
}

// ================================================================
// MINIMAP
// ================================================================
function drawMinimap() {
  const mmEl = document.getElementById('minimap');
  const mmW = mmEl.clientWidth;
  const mmH = 32;
  mmCtx.clearRect(0, 0, mmW, mmH);
  mmCtx.fillStyle = '#0c1220';
  mmCtx.fillRect(0, 0, mmW, mmH);

  // Draw simplified bars
  const fullRange = state.fMaxLog - state.fMinLog;
  CATEGORIES.forEach(cat => {
    if (state.hiddenCats.has(cat.id)) return;
    cat.techs.forEach(tech => {
      const x1 = ((logFreq(tech.fMin) - state.fMinLog) / fullRange) * mmW;
      const x2 = ((logFreq(tech.fMax) - state.fMinLog) / fullRange) * mmW;
      const w = Math.max(x2 - x1, 1);
      mmCtx.fillStyle = cat.color;
      mmCtx.globalAlpha = 0.5;
      mmCtx.fillRect(x1, 2, w, mmH - 4);
      mmCtx.globalAlpha = 1;
    });
  });

  // Viewport indicator
  const vpEl = document.getElementById('minimapVP');
  const vpLeft = ((state.viewMinLog - state.fMinLog) / fullRange) * mmW;
  const vpRight = ((state.viewMaxLog - state.fMinLog) / fullRange) * mmW;
  vpEl.style.left = vpLeft + 'px';
  vpEl.style.width = Math.max(vpRight - vpLeft, 4) + 'px';
}

// ================================================================
// INTERACTIONS
// ================================================================

// Zoom
function zoom(delta, centerX) {
  const logCenter = xToLogFreq(centerX);
  const range = state.viewMaxLog - state.viewMinLog;
  const factor = delta > 0 ? 0.85 : 1.18;
  const newRange = Math.max(0.15, Math.min(state.fMaxLog - state.fMinLog, range * factor));

  const ratio = (logCenter - state.viewMinLog) / range;
  state.viewMinLog = logCenter - ratio * newRange;
  state.viewMaxLog = logCenter + (1 - ratio) * newRange;

  // Clamp
  if (state.viewMinLog < state.fMinLog) {
    state.viewMaxLog += state.fMinLog - state.viewMinLog;
    state.viewMinLog = state.fMinLog;
  }
  if (state.viewMaxLog > state.fMaxLog) {
    state.viewMinLog -= state.viewMaxLog - state.fMaxLog;
    state.viewMaxLog = state.fMaxLog;
  }

  draw();
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1 : -1, e.offsetX);
}, { passive: false });

// Pan
canvas.addEventListener('mousedown', e => {
  state.isDragging = true;
  state.dragStartX = e.clientX;
  state.dragStartViewMin = state.viewMinLog;
  state.dragStartViewMax = state.viewMaxLog;
  canvasArea.classList.add('dragging');
});

window.addEventListener('mousemove', e => {
  if (state.isDragging) {
    const dx = e.clientX - state.dragStartX;
    const W = canvasArea.clientWidth - state.paddingL - state.paddingR;
    const range = state.dragStartViewMax - state.dragStartViewMin;
    const dLog = -(dx / W) * range;

    let newMin = state.dragStartViewMin + dLog;
    let newMax = state.dragStartViewMax + dLog;

    if (newMin < state.fMinLog) { newMax += state.fMinLog - newMin; newMin = state.fMinLog; }
    if (newMax > state.fMaxLog) { newMin -= newMax - state.fMaxLog; newMax = state.fMaxLog; }

    state.viewMinLog = newMin;
    state.viewMaxLog = newMax;
    draw();
  }

  // Tooltip
  if (!state.isDragging) {
    handleHover(e);
  }
});

window.addEventListener('mouseup', () => {
  state.isDragging = false;
  canvasArea.classList.remove('dragging');
});

// Double-click to zoom in
canvas.addEventListener('dblclick', e => {
  zoom(1, e.offsetX);
  zoom(1, e.offsetX);
});

// Hover / tooltip
function handleHover(e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const tt = document.getElementById('tooltip');

  if (!window._bars) return;

  let hit = null;
  for (const bar of window._bars) {
    if (mx >= bar.x && mx <= bar.x + bar.w && my >= bar.y && my <= bar.y + bar.h) {
      hit = bar;
      break;
    }
  }

  // Also check bandplan
  let bandHit = null;
  if (state.showBandplan) {
    const bpY = 36; // approximate
    const bpH = state.bandplanH - 4;
    if (my >= bpY && my <= bpY + bpH) {
      const hoverLogF = xToLogFreq(mx);
      const hoverF = Math.pow(10, hoverLogF);
      for (const band of EU_BANDPLAN) {
        if (hoverF >= band.fMin && hoverF <= band.fMax) {
          bandHit = band;
          break;
        }
      }
    }
  }

  if (hit) {
    tt.style.display = 'block';
    tt.style.left = (e.clientX + 16) + 'px';
    tt.style.top = (e.clientY - 8) + 'px';
    let html = `<div class="tt-name">${hit.tech.name}</div>`;
    html += `<div class="tt-freq">${formatFreq(hit.tech.fMin)}${hit.tech.fMin !== hit.tech.fMax ? ' — ' + formatFreq(hit.tech.fMax) : ''}</div>`;
    html += `<div class="tt-cat" style="color:${hit.cat.color}">${hit.cat.name}</div>`;
    html += `<div class="tt-note">${hit.tech.note}</div>`;

    // Find matching bandplan entries
    const matchBands = EU_BANDPLAN.filter(b =>
      (hit.tech.fMin <= b.fMax && hit.tech.fMax >= b.fMin)
    );
    if (matchBands.length > 0) {
      html += `<div class="tt-band"><strong>Bandplan:</strong> ${matchBands.map(b => b.label).join(', ')}</div>`;
    }

    tt.innerHTML = html;
  } else if (bandHit) {
    tt.style.display = 'block';
    tt.style.left = (e.clientX + 16) + 'px';
    tt.style.top = (e.clientY - 8) + 'px';
    tt.innerHTML = `
      <div class="tt-name">${bandHit.label}</div>
      <div class="tt-freq">${formatFreq(bandHit.fMin)} — ${formatFreq(bandHit.fMax)}</div>
      <div class="tt-cat" style="color:${SERVICE_COLORS[bandHit.service] || '#888'}">${bandHit.service.toUpperCase()}</div>
      <div class="tt-note">${bandHit.note}</div>
    `;
  } else {
    tt.style.display = 'none';
  }
}

canvas.addEventListener('mouseleave', () => {
  document.getElementById('tooltip').style.display = 'none';
});

// Minimap click
document.getElementById('minimap').addEventListener('click', e => {
  const mmEl = document.getElementById('minimap');
  const rect = mmEl.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const ratio = mx / mmEl.clientWidth;
  const fullRange = state.fMaxLog - state.fMinLog;
  const viewRange = state.viewMaxLog - state.viewMinLog;
  const center = state.fMinLog + ratio * fullRange;
  state.viewMinLog = center - viewRange / 2;
  state.viewMaxLog = center + viewRange / 2;

  if (state.viewMinLog < state.fMinLog) { state.viewMaxLog += state.fMinLog - state.viewMinLog; state.viewMinLog = state.fMinLog; }
  if (state.viewMaxLog > state.fMaxLog) { state.viewMinLog -= state.viewMaxLog - state.fMaxLog; state.viewMaxLog = state.fMaxLog; }

  draw();
});

// Toolbar buttons
document.getElementById('btnZoomIn').addEventListener('click', () => zoom(1, canvasArea.clientWidth / 2));
document.getElementById('btnZoomOut').addEventListener('click', () => zoom(-1, canvasArea.clientWidth / 2));
document.getElementById('btnFitAll').addEventListener('click', () => {
  state.viewMinLog = state.fMinLog;
  state.viewMaxLog = state.fMaxLog;
  draw();
});

document.getElementById('btnBandplan').addEventListener('click', function() {
  state.showBandplan = !state.showBandplan;
  this.classList.toggle('active', state.showBandplan);
  draw();
});

document.getElementById('btnHelp').addEventListener('click', () => {
  document.getElementById('helpBox').classList.toggle('visible');
});

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') {
    state.viewMinLog = state.fMinLog;
    state.viewMaxLog = state.fMaxLog;
    draw();
  }
  if (e.key === 'b' || e.key === 'B') {
    state.showBandplan = !state.showBandplan;
    document.getElementById('btnBandplan').classList.toggle('active', state.showBandplan);
    draw();
  }
  if (e.key >= '1' && e.key <= '9') {
    const idx = parseInt(e.key) - 1;
    if (idx < CATEGORIES.length) {
      const cat = CATEGORIES[idx];
      if (state.hiddenCats.has(cat.id)) state.hiddenCats.delete(cat.id);
      else state.hiddenCats.add(cat.id);
      buildCatToggles();
      draw();
    }
  }
  if (e.key === '+' || e.key === '=') zoom(1, canvasArea.clientWidth / 2);
  if (e.key === '-') zoom(-1, canvasArea.clientWidth / 2);
});

// Touch support
let lastTouchDist = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    state.isDragging = true;
    state.dragStartX = e.touches[0].clientX;
    state.dragStartViewMin = state.viewMinLog;
    state.dragStartViewMax = state.viewMaxLog;
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && state.isDragging) {
    const dx = e.touches[0].clientX - state.dragStartX;
    const W = canvasArea.clientWidth - state.paddingL - state.paddingR;
    const range = state.dragStartViewMax - state.dragStartViewMin;
    const dLog = -(dx / W) * range;
    let newMin = state.dragStartViewMin + dLog;
    let newMax = state.dragStartViewMax + dLog;
    if (newMin < state.fMinLog) { newMax += state.fMinLog - newMin; newMin = state.fMinLog; }
    if (newMax > state.fMaxLog) { newMin -= newMax - state.fMaxLog; newMax = state.fMaxLog; }
    state.viewMinLog = newMin;
    state.viewMaxLog = newMax;
    draw();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - canvas.getBoundingClientRect().left;
    if (dist > lastTouchDist + 5) { zoom(1, centerX); lastTouchDist = dist; }
    else if (dist < lastTouchDist - 5) { zoom(-1, centerX); lastTouchDist = dist; }
  }
}, { passive: false });

canvas.addEventListener('touchend', () => { state.isDragging = false; });

// ================================================================
// CATEGORY TOGGLES
// ================================================================
function buildCatToggles() {
  const container = document.getElementById('catToggles');
  container.innerHTML = '';
  CATEGORIES.forEach((cat, i) => {
    const el = document.createElement('div');
    el.className = `cat-tog ${state.hiddenCats.has(cat.id) ? 'off' : ''}`;
    el.innerHTML = `<span class="dot" style="background:${cat.color}"></span>${cat.name}`;
    el.title = `Toggle [${i+1}]`;
    el.addEventListener('click', () => {
      if (state.hiddenCats.has(cat.id)) state.hiddenCats.delete(cat.id);
      else state.hiddenCats.add(cat.id);
      buildCatToggles();
      draw();
    });
    container.appendChild(el);
  });
}

// ================================================================
// INIT
// ================================================================
window.addEventListener('resize', () => { resize(); draw(); });
resize();
buildCatToggles();
document.getElementById('btnBandplan').classList.add('active');
draw();
</script>
