<!-- cmp-privileged-access: standing administrator rights are exposed every hour of the year; just-in-time elevation
     (requested, approved, limited in time, logged) shrinks the window in which a stolen credential is an admin one;
     a break-glass account for when the identity system itself is down stays sealed, alerts when used and is reviewed
     afterwards.
     The stage: the thefts and two bars (the same thefts under standing rights and just in time); the team's week, one
     row per administrator, the working hours shaded, the admin windows filled, every theft marked ✕ (with rights) or
     ○ (without); the break-glass account's six stages with the password, the alert and the outcome.
     Week, windows, thefts and stages: privileged.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var M = window.SimdeckModels['privileged-access'];
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var JITTER = [0.5, 0.25, 0.75, 0.38, 0.62];         // a theft mark's height in its row, by theft index (page only)

  function who(i) { return t('n_' + i); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function int(x) { return new Intl.NumberFormat(LOCALE).format(x); }
  function pct(x) {
    var v = x * 100;
    return new Intl.NumberFormat(LOCALE, { maximumFractionDigits: v > 0 && v < 10 && v !== Math.round(v) ? 1 : 0 }).format(v) + ' %';
  }
  function at(hour) { return (hour / M.WEEK * 100) + '%'; }

  var sim = null;
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to the same button
  function btn(attrs, run, label, extra) {
    var sel = label;
    return h('button', Object.assign({ type: 'button', class: 'pa-b', onmousedown: noFocus, dataset: { sel: sel },
      onclick: function (e) { refocus = e.detail === 0 ? sel : null; run(); } }, attrs), label, extra || null);
  }
  function newThefts() { sim.set({ seed: L.nextSeed(sim.params.seed) }); }

  // ── the numbers ──

  function bar(on, label, k, total, share, hours) {
    var lab = t('barOf', { k: int(k), t: int(total), pct: pct(k / total) });
    return h('div', { class: 'pa-bar', dataset: { on: String(on) } },
      h('span', { class: 'pa-blabel' }, label),
      h('span', { class: 'pa-track', 'aria-hidden': 'true' },
        h('span', { class: 'pa-fill', style: { width: (k / total * 100) + '%' } }),
        h('span', { class: 'pa-exp', style: { left: Math.min(100, share * 100) + '%' } })),
      h('span', { class: 'pa-btext pa-num' }, b(lab), ' · ', t('barExp', { e: pct(share) }),
        h('small', null, t('barHours', { h: int(hours) }))));
  }

  function numbers(s) {
    var jit = s.p.mode === 'jit';
    return h('div', { class: 'pa-sum' },
      h('div', { class: 'pa-k pa-tk' }, h('span', null, t('kThefts')),
        h('span', { class: 'pa-seg', role: 'group', 'aria-label': t('thefts') }, L.COUNTS.map(function (x) {
          return btn({ 'aria-pressed': String(s.p.thefts === x), class: 'pa-b pa-n' }, function () { sim.set({ thefts: x }); }, int(x));
        })),
        btn({ 'aria-keyshortcuts': 'N' }, newThefts, t('newThefts'), h('kbd', { 'aria-hidden': 'true' }, 'N'))),
      h('div', { class: 'pa-bars' },
        bar(!jit, t('barStanding'), s.standingHits, s.p.thefts, 1, M.YEAR),
        bar(jit, t('barJit'), s.jitHits, s.p.thefts, s.jitShare, s.jitHours)),
      h('div', { class: 'pa-k' }, h('span', null, t('kElev')),
        b(jit ? int(s.elevations) : t('kNone')), h('small', null, t('kElevSub'))));
  }

  // ── the week ──

  function week(s) {
    var n = s.p.team;
    var kids = [s.glass.idpDown ? h('p', { class: 'pa-head pa-down', role: 'status' }, t('idpDown')) : h('p', { class: 'pa-head' }, t('headWeek'))];
    var days = [];
    for (var d = 0; d < 7; d++) days.push(h('span', { class: 'pa-day' }, t('d_' + d)));
    kids.push(h('div', { class: 'pa-days', style: { gridRow: '2' } }, days));
    var byPerson = [];
    for (var i = 0; i < n; i++) byPerson.push([]);
    s.thefts.forEach(function (x, j) { byPerson[x.person].push({ hour: x.hour, admin: x.admin, j: j }); });
    for (var i2 = 0; i2 < n; i2++) (function (i) {
      var mine = byPerson[i], k = mine.filter(function (x) { return x.admin; }).length;
      var row = String(3 + i);
      kids.push(h('div', { class: 'pa-name', style: { gridRow: row } }, h('span', { translate: 'no' }, who(i)),
        h('small', { class: 'pa-num', translate: 'no' }, k + ' ✕ / ' + mine.length)));
      var parts = [];
      for (var d = 0; d < M.WORK_DAYS; d++) {
        parts.push(h('span', { class: 'pa-work', style: { left: at(d * 24 + M.WORK_START), width: at(M.WORK_LEN) } }));
      }
      for (var e = 1; e < 7; e++) parts.push(h('span', { class: 'pa-sep', style: { left: at(e * 24) } }));
      if (s.p.mode === 'standing') {
        parts.push(h('span', { class: 'pa-win sd-fill', dataset: { c: '1' }, style: { left: '0', width: '100%' } }, h('span', null, t('rowStanding'))));
      } else {
        s.sched[i].forEach(function (st) {
          parts.push(h('span', { class: 'pa-win sd-fill', dataset: { c: '1' }, style: { left: at(st), width: at(s.p.len) } }));
        });
      }
      // misses first, hits on top
      mine.filter(function (x) { return !x.admin; }).concat(mine.filter(function (x) { return x.admin; })).forEach(function (x) {
        parts.push(h('span', { class: 'pa-mark', dataset: { hit: String(x.admin) }, 'aria-hidden': 'true',
          style: { left: at(x.hour + 0.5), top: (JITTER[x.j % JITTER.length] * 100) + '%' } }, x.admin ? '✕' : '○'));
      });
      kids.push(h('div', { class: 'pa-row', role: 'img', style: { gridRow: row },
        'aria-label': t('rowLabel', { who: who(i), n: mine.length, k: k }) }, parts));
    })(i2);
    return h('div', { class: 'pa-week', style: { '--n': String(n) } }, kids);
  }

  // ── the break-glass account: its controls are on the stage, next to what they change ──

  function nextStage() { sim.set({ glass: (sim.params.glass + 1) % M.STAGES.length }); }

  function glass(s) {
    var g = s.glass;
    var items = M.STAGES.map(function (name, i) {
      var label = t(L.stageKey(i, s.p.outage, s.p.alert));
      var st = i < g.stage ? 'done' : i === g.stage ? 'now' : 'next';
      return h('li', { class: 'pa-st', dataset: { s: st },
        'aria-label': t('stageLabel', { i: i + 1, name: label }) + (st === 'now' ? ', ' + t('stNow') : ''),
        'aria-current': st === 'now' ? 'step' : null },
        h('b', { 'aria-hidden': 'true' }, st === 'done' ? '✓' : String(i + 1)), h('span', null, label));
    });
    var pass = g.resealed ? 'fPassNew' : g.open ? 'fPassOut' : 'fPassSafe';
    var alert = g.stage < 3 ? 'fAlertNone' : g.alerted ? 'fAlertSent' : 'fAlertOff';
    var facts = [
      h('span', { class: 'pa-fact' }, h('span', null, t('fPass')), h('b', { dataset: { bad: String(g.open && g.stage >= 5) } }, t(pass))),
      h('span', { class: 'pa-fact' }, h('span', null, t('fAlert')), h('b', { dataset: { bad: String(alert === 'fAlertOff') } }, t(alert)))
    ];
    if (g.outcome) facts.push(h('span', { class: 'pa-verdict', dataset: { v: g.outcome } }, t('o_' + g.outcome)));
    return h('div', { class: 'pa-glass' },
      h('div', { class: 'pa-ghead' },
        h('p', { class: 'pa-head' }, t('headGlass')),
        btn({ 'aria-keyshortcuts': 'G' }, nextStage, t('nextStage'), h('kbd', { 'aria-hidden': 'true' }, 'G')),
        btn({ 'aria-pressed': String(s.p.outage) }, function () { sim.set({ outage: !s.p.outage }); }, t('outage')),
        btn({ 'aria-pressed': String(s.p.alert) }, function () { sim.set({ alert: !s.p.alert }); }, t('alert'))),
      h('ol', { class: 'pa-stages' }, items),
      h('div', { class: 'pa-facts' }, facts));
  }

  function render(c) {
    var s = c.state;
    // a shortcut (N, G) re-renders the stage: a focused stage button keeps its focus
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    c.stage.replaceChildren(h('div', { class: 'pa' }, numbers(s), week(s), glass(s), h('p', { class: 'pa-foot' }, t('foot'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var out = t.parts(k.key, {
      t: b(t.n('nThefts', s.p.thefts, { c: int(s.p.thefts) })),
      h: b(int(s.adminHours)), y: b(int(M.YEAR)), j: b(t('barOf', { k: int(s.jitHits), t: int(s.p.thefts), pct: pct(s.jitHits / s.p.thefts) })),
      k: b(int(s.hits)), pct: b(pct(s.hits / s.p.thefts)), e: b(pct(s.share))
    });
    k.notes.forEach(function (key) { out.push(' '); out = out.concat(t.parts(key, {})); });
    return out;
  }

  var hidden = function () { return false; };
  var standing = function (p) { return p.mode === 'standing' ? t('noWindows') : false; };
  var labels = { standing: 'pStanding', jit: 'pJit', work: 'pWork', 'all-day': 'pAllDay', glass: 'pGlass', quiet: 'pQuiet' };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: [['standing', t('modeStanding')], ['jit', t('modeJit')]] },
      { key: 'team', type: 'range', label: t('team'), min: M.MIN_TEAM, max: M.MAX_TEAM, step: 1, visible: hidden },
      { key: 'per', type: 'range', label: t('per'), min: 1, max: function (p) { return M.maxPer(p.len); }, step: 1, disabled: standing },
      { key: 'len', type: 'choice', label: t('len'), disabled: standing,
        options: M.LENGTHS.map(function (x) { return [x, t('hours', { h: x })]; }) },
      { key: 'work', type: 'toggle', label: t('work') },
      { key: 'thefts', type: 'choice', label: t('thefts'), options: L.COUNTS.map(function (x) { return [x, int(x)]; }), visible: hidden },
      { key: 'seed', type: 'range', label: t('newThefts'), min: 1, max: L.SEED_MAX, step: 1, visible: hidden },
      { key: 'glass', type: 'range', label: t('glass'), min: 0, max: M.STAGES.length - 1, step: 1, visible: hidden },
      { key: 'outage', type: 'toggle', label: t('outage'), visible: hidden },
      { key: 'alert', type: 'toggle', label: t('alert'), visible: hidden }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'pa-win', label: t('legWindow') },
      { shape: 'pa-work', label: t('legWork') },
      { shape: 'pa-hit', label: t('legHit') },
      { shape: 'pa-miss', label: t('legMiss') }
    ],
    keys: [
      { key: 'n', label: t('newThefts'), run: function () { newThefts(); } },
      { key: 'g', label: t('nextStage'), run: function () { nextStage(); } }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
