<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var REC = window.AuroraRecording;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var SG_FLOOR = -32;                 // dB: the spectrogram's quietest shade (the receiver's noise sits below it)
  var SPEC_LO = -40;                  // dB: the bottom of the spectrum plot
  var sim = null;

  function dec(str) { return String(str).replace('.', t('dec')); }
  function secs(v) { return t('s', { v: dec(v.toFixed(1)) }); }
  function hz(v) { return t('hz', { v: String(v) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function text(svg, x, y, str, cls, attrs) {
    svg.append(s('text', Object.assign({ class: 'au-halo' + (cls ? ' ' + cls : ''), x: x, y: y, translate: 'no' }, attrs || {}), str));
  }
  // a path's marker: a round dot via the aurora, a square for the own signal (colour is not the only carrier)
  function marker(svg, path, x, y, r) {
    if (path === 'aurora') svg.append(s('circle', { class: 'au-dot aurora', cx: x, cy: y, r: r }));
    else svg.append(s('rect', { class: 'au-dot own', x: x - r, y: y - r, width: 2 * r, height: 2 * r }));
  }

  // ── the analysis, once: the WAV decoded from the data: URI, its spectrogram and each path's spectrum ──
  var wav = (function () {
    var b64 = REC.audio.slice(REC.audio.indexOf(',') + 1), bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return L.decodeWav(bytes);
  })();
  var SG = L.spectrogram(wav, 256, 160, SG_FLOOR);
  var SPEC = { aurora: L.pathSpectrum(wav, 'aurora', 1024), own: L.pathSpectrum(wav, 'own', 1024) };
  var W_AURORA = Math.round(SPEC.aurora.width / 10) * 10;          // shown to 10 Hz
  var W_OWN = Math.ceil(SPEC.own.width / 10) * 10;                  // an upper bound: the analysis's limit
  var F_TONE = Math.round((SPEC.aurora.peak + SPEC.own.peak) / 20) * 10;

  // The spectrogram's pixels, cols × bins, coloured from the theme's tokens: --bg (quiet) → --c1 → --ink (loud).
  var sgCanvas = null, sgTheme = '';
  function rgb(hex) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(hex.trim());
    return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [128, 128, 128];
  }
  function sgImage() {
    var stops = [Simdeck.cssVar('--bg'), Simdeck.cssVar('--c1'), Simdeck.cssVar('--ink')], key = stops.join();
    if (sgCanvas && key === sgTheme) return sgCanvas;
    var cs = stops.map(rgb), c = document.createElement('canvas');
    c.width = SG.cols; c.height = SG.bins;
    var ctx = c.getContext('2d'), img = ctx.createImageData(SG.cols, SG.bins), d = img.data;
    for (var x = 0; x < SG.cols; x++) {
      for (var k = 0; k < SG.bins; k++) {
        var v = (SG.db[x * SG.bins + k] - SG_FLOOR) / -SG_FLOOR, seg = v < 0.5 ? 0 : 1, f = v < 0.5 ? v * 2 : v * 2 - 1;
        var a = cs[seg], b = cs[seg + 1], o = ((SG.bins - 1 - k) * SG.cols + x) * 4;
        d[o] = a[0] + (b[0] - a[0]) * f; d[o + 1] = a[1] + (b[1] - a[1]) * f; d[o + 2] = a[2] + (b[2] - a[2]) * f; d[o + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    sgCanvas = c; sgTheme = key;
    return c;
  }

  // ── playback: the recording through an <audio>. Not part of the state. ──
  var playing = false, head = null, audio = null, playT = null;
  function every() { return Simdeck.reducedMotion() ? 500 : 100; }   // ms between cursor redraws

  function stop(keepT) {
    if (!playing) return;
    playing = false; head = null;
    audio.pause();
    if (keepT !== false) sim.set({ t: L.snapT(audio.currentTime) });
    sim.render();
  }

  function play() {
    if (!audio) {
      audio = new Audio(REC.audio);
      audio.preload = 'auto';
      audio.addEventListener('ended', function () { if (playing) { stop(false); sim.set({ t: L.REC_MAX }); } });
    }
    var p = sim.params, from = p.t >= L.REC_MAX ? 0 : p.t;
    audio.currentTime = from;
    playing = true; head = from; playT = from;
    if (from !== p.t) sim.set({ t: from });
    var started = audio.play();
    if (started && started.catch) started.catch(function () { stop(); });
    var last = 0;
    (function frame(now) {
      if (!playing) return;
      if (now - last >= every()) { last = now; head = audio.currentTime; sim.render(); }
      requestAnimationFrame(frame);
    })(0);
  }

  function toggle() { if (playing) stop(); else play(); }

  // ── drawing: the spectrogram of the whole recording, the overs above it, the cursor. Clicking jumps. ──
  function sgPlot(box, pos) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 3.6 * rem, right = 1.2 * rem, top = 2.0 * rem, bottom = 2.0 * rem;
    var cw = W - left - right, ch = H - top - bottom;
    var X = function (sec) { return left + sec / L.REC_DURATION * cw; };
    var Y = function (f) { return top + (1 - f / L.FMAX) * ch; };
    var img = sgImage();
    img.style.left = left + 'px'; img.style.top = top + 'px'; img.style.width = cw + 'px'; img.style.height = ch + 'px';
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'au-frame', x: left, y: top, width: cw, height: ch }));
    for (var f = 0; f <= L.FMAX; f += 500) {
      svg.append(s('line', { class: 'au-tick', x1: left - 0.3 * rem, x2: left, y1: Y(f), y2: Y(f) }));
      text(svg, left - 0.4 * rem, Y(f) + 0.35 * rem, String(f), null, { 'text-anchor': 'end' });
    }
    text(svg, left - 0.4 * rem, top - 0.5 * rem, t('axisF'), null, { 'text-anchor': 'end' });
    for (var k = 0; k <= 35; k += 5) {
      svg.append(s('line', { class: 'au-tick', x1: X(k), x2: X(k), y1: top + ch, y2: top + ch + 0.3 * rem }));
      text(svg, X(k), top + ch + 1.4 * rem, String(k), null, { 'text-anchor': k === 0 ? 'start' : 'middle' });
    }
    text(svg, W - right, top + ch + 1.4 * rem, t('axisT'), null, { 'text-anchor': 'end' });
    // the overs: a bracket each above the plot, with the station's marker and call sign where it fits
    var now = L.overAt(pos);
    L.OVERS.forEach(function (o, i) {
      var a = X(o.from) + 2, b = X(i + 1 < L.OVERS.length ? L.OVERS[i + 1].from : L.REC_DURATION) - 2, y = top - 0.6 * rem;
      svg.append(s('path', { class: 'au-over' + (o === now ? ' now' : ''), d: 'M' + a + ',' + (y + 0.4 * rem) + 'V' + y + 'H' + b + 'V' + (y + 0.4 * rem) }));
      var label = o.station, room = b - a, need = (label.length * 0.55 + 1.6) * rem;
      if (room >= need) {
        var cx = (a + b) / 2;
        marker(svg, o.path, cx - need / 2 + 0.5 * rem, y - 0.45 * rem, 0.3 * rem);
        text(svg, cx - need / 2 + 1.2 * rem, y - 0.2 * rem, label, o === now ? 'au-ink' : null);
      } else marker(svg, o.path, (a + b) / 2, y - 0.45 * rem, 0.3 * rem);
    });
    if (pos > 0 || playing) {
      var xh = X(pos);
      svg.append(s('line', { class: 'au-head', x1: xh, x2: xh, y1: top, y2: top + ch }));
      svg.append(s('path', { class: 'au-headtip', d: 'M' + (xh - 0.45 * rem) + ',' + (top + ch + 0.6 * rem) + 'L' + (xh + 0.45 * rem) + ',' + (top + ch + 0.6 * rem) + 'L' + xh + ',' + (top + ch - 0.2 * rem) + 'Z' }));
    }
    box.replaceChildren(img, svg);
    box.onclick = function (ev) {
      var r = box.getBoundingClientRect();
      sim.set({ t: L.snapT((ev.clientX - r.left - left) / cw * L.REC_DURATION) });
    };
  }

  // ── each path's spectrum (dB below its own peak), its −10 dB width as a bar; the path sounding now drawn bold ──
  function specPlot(box, pos) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 3.6 * rem, right = 1.2 * rem, top = 1.4 * rem, bottom = 2.0 * rem;
    var cw = W - left - right, ch = H - top - bottom;
    var X = function (f) { return left + f / L.FMAX * cw; };
    var Y = function (db) { return top + (Math.min(0, Math.max(SPEC_LO, db)) / SPEC_LO) * ch; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    for (var db = 0; db >= SPEC_LO; db -= 10) {
      svg.append(s('line', { class: db === -L.WIDTH_DB ? 'au-ref' : 'au-grid', x1: left, x2: left + cw, y1: Y(db), y2: Y(db) }));
      text(svg, left - 0.4 * rem, Y(db) + 0.35 * rem, db < 0 ? '−' + (-db) : '0', null, { 'text-anchor': 'end' });
    }
    text(svg, left - 0.4 * rem, top - 0.8 * rem, t('axisDb'), null, { 'text-anchor': 'end' });
    svg.append(s('line', { class: 'au-axis', x1: left, x2: left + cw, y1: top + ch, y2: top + ch }));
    for (var f = 0; f <= L.FMAX; f += 250) {
      svg.append(s('line', { class: 'au-tick', x1: X(f), x2: X(f), y1: top + ch, y2: top + ch + 0.3 * rem }));
      if (f % 500 === 0 && f < L.FMAX) text(svg, X(f), top + ch + 1.4 * rem, String(f), null, { 'text-anchor': f === 0 ? 'start' : 'middle' });
    }
    text(svg, left + cw, top + ch + 1.4 * rem, t('axisF'), null, { 'text-anchor': 'end' });
    var now = L.overAt(pos).path;
    ['aurora', 'own'].forEach(function (path) {
      var sp = SPEC[path], pts = [];
      sp.db.forEach(function (v, i) { pts.push(X(i * sp.df).toFixed(1) + ',' + Y(v).toFixed(1)); });
      svg.append(s('polyline', { class: 'au-spec ' + path + (path === now ? '' : ' thin'), points: pts.join(' ') }));
    });
    // the widths, as bars on the −10 dB line, the own one on top (it is narrower), and markers at the peaks
    ['aurora', 'own'].forEach(function (path) {
      var sp = SPEC[path], y = Y(-L.WIDTH_DB) + (path === 'own' ? -0.35 : 0.35) * rem;
      svg.append(s('line', { class: 'au-span ' + path, x1: X(sp.lo - sp.df / 2), x2: X(sp.hi + sp.df / 2), y1: y, y2: y }));
      marker(svg, path, X(sp.peak), Y(0), (path === now ? 0.36 : 0.26) * rem);
    });
    box.replaceChildren(svg);
  }

  var presetKeys = { aurora: 'presetAurora', own: 'presetOwn', last: 'presetLast' };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { type: 'button', label: t('play'), key: 'p', run: function () { toggle(); } },
      { key: 't', type: 'range', label: t('t'), hint: t('tHint'), min: 0, max: L.REC_MAX, step: 0.1, format: function (v) { return secs(L.snapT(v)); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: 0 }; }),
    legend: [
      { c: 1, shape: 'round', label: t('legendAurora') },
      { c: 4, label: t('legendOwn') },
      { c: 3, label: t('legendHead') }
    ],

    render: function (c) {
      var pos = head != null ? head : c.state.t, now = L.overAt(pos);
      var lines = L.OVERS.map(function (o) {
        return [
          h('span', { class: 'au-label' }, h('span', { class: 'au-mark ' + o.path }),
            h('span', { translate: 'no' }, o.station), h('span', null, '· ' + t(o.path === 'aurora' ? 'pathAurora' : 'pathOwn'))),
          h('span', { class: 'au-msg' + (o === now ? ' now' : ''), translate: 'no' }, L.transcript(REC.events, pos, o.bubble))
        ];
      });
      var sg = h('div', { class: 'au-plot click' }), sp = h('div', { class: 'au-plot' });
      c.stage.replaceChildren(h('div', { class: 'au' },
        h('p', { class: 'au-text' }, lines),
        h('div', { class: 'au-fig sg' },
          h('h2', null, h('span', null, t('plotSg')),
            h('span', { class: 'au-scale' }, t('weak'), h('i', { class: 'au-ramp' }), t('strong'))), sg),
        h('div', { class: 'au-fig sp' }, h('h2', null, h('span', null, t('plotSpec')),
          h('span', { class: 'au-keys' },
            h('span', { class: now.path === 'aurora' ? 'now' : '' }, h('span', { class: 'au-mark aurora' }),
              h('span', { translate: 'no' }, 'GM4YXI'), h('span', null, t('pathAurora') + ': ' + t('widthLabel', { w: hz(W_AURORA) }))),
            h('span', { class: now.path === 'own' ? 'now' : '' }, h('span', { class: 'au-mark own' }),
              h('span', { translate: 'no' }, 'OK/DF7TR/P'), h('span', null, t('pathOwn') + ': < ' + hz(W_OWN))))), sp)));
      sgPlot(sg, pos);
      specPlot(sp, pos);
    },

    caption: function (c) {
      var o = L.overAt(c.state.t);
      var b = function (x) { return h('b', { translate: 'no' }, x); };
      return [
        t.parts('captionPos', { t: b(secs(c.state.t)), d: b(secs(L.REC_DURATION)) }),
        o.path === 'aurora'
          ? t.parts('nowAurora', { who: b(o.station), w: b(hz(W_AURORA)) })
          : t.parts('nowOwn', { who: b(o.station), w: b(hz(W_OWN)) }),
        t.parts('captionNote', { f: b(hz(F_TONE)) })
      ];
    }
  });

  // After each render: moving the position while the recording plays seeks.
  sim.on(function (c) {
    if (playing && c.state.t !== playT) { playT = c.state.t; audio.currentTime = c.state.t; head = c.state.t; }
  });
  // A theme change recolours the spectrogram (sgImage re-reads the tokens).
  Simdeck.onTheme(function () { sim.render(); });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
