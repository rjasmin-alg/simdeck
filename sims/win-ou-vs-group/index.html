<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PRESET_WORDS = { basic: 'presetBasic', quiz: 'presetQuiz', quillmoor: 'presetQuillmoor' };
  var BIN_WORDS = { ou: 'binOu', group: 'binGroup', both: 'binBoth', neither: 'binNeither' };
  var VERDICT_WORDS = { right: 'vRight', half: 'vHalf', wrong: 'vWrong', skipped: 'vSkipped' };
  var VERDICT_MARK = { right: '✓', half: '½', wrong: '✗', skipped: '–' };
  var RIGHT_WORDS = { read: 'rightRead', 'reset-password': 'rightReset' };

  /** Data (OU, group, GPO, user and share names, SIDs) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function nameOf(id) { var n = L.node(id); return n ? n.name : id; }
  function key(cardId) { return cardId.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); }); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(k, vars) {
    var out = [], seen = [];
    t.parts(k, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sentence(k, vars) { return [' '].concat(rich(k, vars)); }
  function linkIcon() { return h('span', { class: 'og-link', 'aria-hidden': 'true' }); }
  function keyIcon() { return h('span', { class: 'og-key', 'aria-hidden': 'true' }); }

  /** The placeholders of a card's strings, from its need and its mechanism (every value is data). */
  function varsOf(need) {
    var r = L.classify(need), m = r.mech || {};
    var v = { user: data('ana') };
    if (need.gpo) v.gpo = data(need.gpo);
    if (m.at) v.ou = data(nameOf(m.at));
    if (need.on) v.ou = data(nameOf(need.on));
    if (m.moveTo) v.ou = data(nameOf(m.moveTo));
    if (need.boxes) {
      v.a = data(nameOf(need.boxes[0]));
      if (need.boxes[1]) v.b = data(nameOf(need.boxes[1]));
      var cn = need.boxes.filter(function (b) { return L.kindOf(b) === 'container'; })[0];
      if (cn) v.cn = data(nameOf(cn));
    }
    if (need.filter) v.group = data(nameOf(need.filter));
    if (need.trustee) { v.group = data(nameOf(need.trustee)); v.sid = data(L.sidOf(need.trustee) || '—'); }
    if (need.group) v.group = data(nameOf(need.group));
    if (need.resource) v.share = data(need.resource);
    if (need.kind === 'membership') v.ou = data(nameOf(L.placement()[need.obj]));
    return v;
  }

  // ── left: the OU tree ──

  function renderTree(c) {
    var s = c.state;
    var now = s.lit.filter(function (m) { return m.now; })[0] || null;
    var nowReach = now && now.type === 'gpo-link' ? now.reach : [];
    var place = L.placement();
    var aceNow = !!(now && now.type === 'ace');
    // The estate deck shows only the estate's boxes (OU=Kiosks is invented for the basic deck).
    var boxes = L.BOXES.filter(function (b) { return !(b.invented && s.deck === 'quillmoor'); });
    var rows = boxes.map(function (b) {
      var depth = L.pathTo(b.id).length - 1;
      var counts = [];
      if (b.users) counts.push(t.n('users', b.users));
      if (b.computers) counts.push(t.n('computers', b.computers));
      var end = [];
      s.lit.forEach(function (m) {
        var cls = 'og-chip' + (m.now ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : '');
        if (m.type === 'gpo-link' && m.at === b.id) {
          end.push(h('span', { class: cls, dataset: { line: m.filter ? 'filter-' + m.card : null } }, linkIcon(), h('b', null, data(m.gpo))));
        } else if (m.type === 'link-refused' && m.at === b.id) {
          end.push(h('span', { class: cls, dataset: { k: 'refused' } }, h('span', { 'aria-hidden': 'true' }, '✕'), h('s', null, data(m.gpo)), t('chipRefused')));
        } else if (m.type === 'delegation' && m.on === b.id) {
          end.push(h('span', { class: cls, dataset: { line: 'delegation-' + m.card } }, keyIcon(), h('b', null, data(nameOf(m.trustee))),
            t('chipDelegated', { right: t(RIGHT_WORDS[m.right]) })));
        }
      });
      Object.keys(place).forEach(function (u) {
        if (place[u] !== b.id) return;
        var hot = !!(now && now.type === 'membership' && now.obj === u);
        end.push(h('span', { class: 'og-user' + (hot ? ' sd-changed' : ''), dataset: { line: 'user-' + u } }, data(u)));
      });
      var kindWord = b.kind === 'ou' ? 'kindOu' : b.kind === 'container' ? 'kindCn' : 'kindDomain';
      return h('li', { class: 'og-row', style: { '--depth': depth }, dataset: { kind: b.kind, box: b.id,
        reach: String(nowReach.indexOf(b.id) >= 0), now: String(!!(now && (now.at === b.id || now.on === b.id))) } },
        h('span', { class: 'og-tab', dataset: { kind: b.kind }, title: t(kindWord + 'Long') }, t(kindWord)),
        h('span', { class: 'og-name' }, data(b.name)),
        counts.length ? h('span', { class: 'og-count' }, counts.join(' · ')) : null,
        aceNow && b.kind !== 'domain' ? h('span', { class: 'og-count og-nosid' }, t('noSid')) : null,
        end.length ? h('span', { class: 'og-end' }, end) : null);
    });
    return h('section', { class: 'og-col' }, h('h2', null, t('treeTitle')), h('ul', { class: 'og-tree' }, rows));
  }

  // ── middle: groups and the shares' ACLs ──

  function renderGroups(c) {
    var s = c.state;
    var now = s.lit.filter(function (m) { return m.now; })[0] || null;
    var groups = L.GROUPS.map(function (g) {
      var chips = [];
      var hot = false;
      L.membersOf(g.id).forEach(function (u) {
        var on = !!(now && now.type === 'membership' && now.obj === u);
        hot = hot || on;
        chips.push(h('span', { class: 'og-chip' + (on ? ' sd-changed' : '') }, t('member'), h('b', null, data(u))));
      });
      s.lit.forEach(function (m) {
        var cls = 'og-chip' + (m.now ? ' sd-changed' : '');
        if (m.type === 'ace' && m.trustee === g.id) {
          chips.push(h('span', { class: cls }, keyIcon(), h('span', null, t.parts('chipAce', { share: data(m.on), right: t(RIGHT_WORDS[m.right]) }))));
          hot = hot || m.now;
        } else if (m.type === 'delegation' && m.trustee === g.id) {
          chips.push(h('span', { class: cls }, keyIcon(), h('span', null, t.parts('chipTrustee', { right: t(RIGHT_WORDS[m.right]), ou: data(nameOf(m.on)) }))));
          hot = hot || m.now;
        } else if (m.type === 'gpo-link' && m.filter === g.id) {
          chips.push(h('span', { class: cls }, h('span', null, t.parts('chipFilter', { gpo: data(m.gpo) }))));
          hot = hot || m.now;
        } else if (m.type === 'mail' && m.group === g.id) {
          chips.push(h('span', { class: cls }, t('chipMail')));
          hot = hot || m.now;
        }
      });
      var sid = L.sidOf(g.id);
      return h('li', { class: 'og-group' + (hot ? ' sd-changed' : ''), dataset: { type: g.type, group: g.id } },
        h('b', null, data(g.name)),
        h('span', { class: 'og-small og-muted' }, t(g.type === 'security' ? 'typeSecurity' : 'typeDistribution')),
        sid ? h('span', { class: 'og-sid og-muted' }, data(sid)) : null,
        chips.length ? h('span', { class: 'og-line2' }, chips) : null);
    });
    var aces = s.lit.filter(function (m) { return m.type === 'ace'; }).map(function (m) {
      return h('li', { class: 'og-ace' + (m.now ? ' sd-changed' : '') },
        h('b', null, data(m.on)), keyIcon(), data(nameOf(m.trustee)), h('span', { class: 'og-sid' }, data(m.sid)),
        h('span', null, t(RIGHT_WORDS[m.right])));
    });
    return h('section', { class: 'og-col' },
      h('h2', null, t('groupsTitle')),
      h('ul', { class: 'og-groups' }, groups),
      h('div', { class: 'og-acl' }, h('h2', null, t('aclTitle')),
        aces.length ? h('ul', null, aces) : h('div', { class: 'og-small og-muted' }, t('aclNone'))));
  }

  // ── right: the deck and the bins ──

  function binIcon(a) {
    if (a === 'ou') return h('span', { class: 'og-bin-icon', 'aria-hidden': 'true' }, h('span', { class: 'og-tab', dataset: { kind: 'ou' } }, ''));
    if (a === 'group') return h('span', { class: 'og-bin-icon', 'aria-hidden': 'true' }, h('span', { class: 'og-pill' }));
    if (a === 'both') return h('span', { class: 'og-bin-icon', 'aria-hidden': 'true' }, h('span', { class: 'og-tab', dataset: { kind: 'ou' } }, ''), '+', h('span', { class: 'og-pill' }));
    return h('span', { class: 'og-bin-icon og-x', 'aria-hidden': 'true' }, '✕');
  }

  function renderDeck(c) {
    var s = c.state, total = s.cards.length, top = s.cursor < total ? s.cursor : -1;
    var quiz = s.mode === 'quiz';
    var deck = L.cardsOf(c.params);
    var card;
    if (top >= 0) {
      card = h('div', { class: 'og-card' },
        h('div', { class: 'og-small og-muted' }, t('cardOf', { k: top + 1, n: total })),
        h('div', { class: 'og-card-q' }, t.parts('q_' + key(deck[top].id), varsOf(deck[top].need))),
        h('div', { class: 'og-card-hint' }, t(quiz ? 'hintQuiz' : 'hintShow')));
    } else {
      card = h('div', { class: 'og-card', dataset: { done: 'true' } }, h('div', { class: 'og-card-q' }, t('deckDone')),
        quiz ? h('div', { class: 'og-score' }, t('score', { r: s.score.right, h: s.score.half, w: s.score.wrong, s: s.score.skipped })) : null);
    }
    var bins = L.ANSWERS.map(function (a) {
      var items = L.binOf(s, a).map(function (k) {
        var cd = s.cards[k];
        return h('li', { class: 'og-item' + (k === s.last ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : '') },
          h('span', { class: 'og-num', translate: 'no' }, String(k + 1)),
          h('span', { class: 'og-item-t' }, t.parts('s_' + key(cd.id), varsOf(deck[k].need))),
          quiz && cd.verdict ? h('span', { class: 'og-verdict', dataset: { v: cd.verdict } }, VERDICT_MARK[cd.verdict] + ' ', t(VERDICT_WORDS[cd.verdict])) : null);
      });
      var body = [
        h('span', { class: 'og-bin-head' }, binIcon(a), t(BIN_WORDS[a])),
        h('span', { class: 'og-bin-why' }, t(BIN_WORDS[a] + 'Why')),
        items.length ? h('ol', null, items) : null
      ];
      if (quiz && top >= 0) {
        return h('button', {
          type: 'button', class: 'og-bin', dataset: { bin: a }, 'aria-label': t('binPick', { bin: t(BIN_WORDS[a]) }),
          onmousedown: function (e) { e.preventDefault(); },
          onclick: function () {
            var patch = {};
            patch['g' + (top + 1)] = a;
            window.simdeck.set(patch);
            window.simdeck.next();
          }
        }, body);
      }
      return h('div', { class: 'og-bin', dataset: { bin: a } }, body);
    });
    return h('section', { class: 'og-col' }, card, h('div', { class: 'og-bins' }, bins));
  }

  // ── lines: ana to her groups, a delegation's OU to its group, a filtered link to its group ──

  function drawLines(c, wrap) {
    var svg = wrap.querySelector('.og-lines');
    if (!svg || getComputedStyle(svg).display === 'none') return;
    var box = wrap.getBoundingClientRect();
    var paths = [];
    function from(sel) { var e = wrap.querySelector(sel); return e ? e.getBoundingClientRect() : null; }
    function link(a, groupId, k, now) {
      var g = from('[data-group="' + groupId + '"]');
      if (!a || !g) return;
      var x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top;
      var x2 = g.left - box.left, y2 = g.top + g.height / 2 - box.top;
      var mx = (x1 + x2) / 2;
      paths.push(h('path', { d: 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2, 'data-k': k, 'data-now': String(!!now) }));
      paths.push(h('circle', { cx: x2, cy: y2, r: 4 }));
    }
    var s = c.state;
    var now = s.lit.filter(function (m) { return m.now; })[0] || null;
    var u = L.USERS[0];
    u.memberOf.forEach(function (g) { link(from('[data-line="user-' + u.id + '"]'), g, 'member', now && now.type === 'membership'); });
    s.lit.forEach(function (m) {
      if (m.type === 'delegation') link(from('[data-line="delegation-' + m.card + '"]'), m.trustee, 'delegation', m.now);
      if (m.type === 'gpo-link' && m.filter) link(from('[data-line="filter-' + m.card + '"]'), m.filter, 'filter', m.now);
    });
    var NS = 'http://www.w3.org/2000/svg';
    svg.replaceChildren();
    paths.forEach(function (p) {
      var el = document.createElementNS(NS, p.tagName.toLowerCase());
      Array.prototype.forEach.call(p.attributes, function (at) { el.setAttribute(at.name, at.value); });
      svg.appendChild(el);
    });
  }

  // ── captions ──

  function captionStart(s) {
    var out = s.deck === 'quillmoor'
      ? rich('capStartQuillmoor', { cu: data('CN=Users'), cc: data('CN=Computers') })
      : rich('capStart', { domain: data(L.DOMAIN.name), user: data('ana') });
    if (s.mode === 'quiz') out = out.concat(sentence('capStartQuiz'));
    return out;
  }
  function captionCard(c) {
    var s = c.state, k = s.last, cd = s.cards[k], need = L.cardsOf(c.params)[k].need, v = varsOf(need);
    var out = [];
    if (s.mode === 'quiz') {
      out = out.concat(cd.guess ? rich('capGuess', { guess: t(BIN_WORDS[cd.guess]), verdict: t(VERDICT_WORDS[cd.verdict]) }) : rich('capNoGuess'), [' ']);
    }
    out.push(h('b', null, String(k + 1) + '. ', t.parts('s_' + key(cd.id), v)));
    out = out.concat(sentence('binIs', { bin: h('b', null, t(BIN_WORDS[cd.answer])) }), sentence('r_' + key(cd.id), v));
    if (c.last) {
      out = out.concat(sentence('capEnd'));
      if (s.mode === 'quiz') out = out.concat(sentence('capEndScore', { score: t('score', { r: s.score.right, h: s.score.half, w: s.score.wrong, s: s.score.skipped }) }));
    }
    return out;
  }

  var stageWrap = null;
  function hiddenGuess(i) {
    return { key: 'g' + i, type: 'select', label: t('hidden'), visible: function () { return false; },
      options: [['', '—']].concat(L.ANSWERS.map(function (a) { return [a, t(BIN_WORDS[a])]; })) };
  }
  var params = [
    { key: 'deck', type: 'choice', label: t('deck'), resets: true, options: [['basic', t('deckBasic')], ['quillmoor', t('deckQuillmoor')]] },
    { key: 'mode', type: 'choice', label: t('mode'), resets: true, hint: t('modeHint'), options: [['show', t('modeShow')], ['quiz', t('modeQuiz')]] }
  ];
  for (var gi = 1; gi <= L.MAX_CARDS; gi++) params.push(hiddenGuess(gi));

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,

    presets: L.presets.map(function (pr) {
      var w = PRESET_WORDS[pr.id];
      return { id: pr.id, label: t(w), params: pr.params, hint: t(w + 'Hint') };
    }),

    legend: [
      { shape: 'og-ou', label: t('legOu') },
      { shape: 'og-cn', label: t('legCn') },
      { shape: 'og-group', label: t('legGroup') },
      { shape: 'og-link', label: t('legLink') },
      { shape: 'og-key', label: t('legAce') },
      { shape: 'og-line', label: t('legLine') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'og-lines');
      svg.setAttribute('aria-hidden', 'true');
      stageWrap = h('div', { class: 'og' }, renderTree(c), renderGroups(c), renderDeck(c));
      stageWrap.appendChild(svg);
      c.stage.replaceChildren(stageWrap);
      drawLines(c, stageWrap);
    },

    caption: function (c) {
      if (!c.state.cards.some(function (x) { return x.revealed; })) return captionStart(c.state);
      return captionCard(c);
    }
  });

  window.addEventListener('resize', function () { if (window.simdeck) window.simdeck.render(); });
})();
</script>
</body>
</html>
