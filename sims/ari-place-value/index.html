/* Page CSS: every selector starts with [data-sim="ari-place-value"]; colours only from kit tokens.
   A block's shape says its place (a unit square, a rod of b, a flat of b × b, a cube with its value on it), its colour
   repeats it; a full place has a dashed red frame and its count struck on the paper; a block added by the last move has

[data-sim="ari-place-value"] .pv {
  display: grid;
  grid-template-rows: minmax(0, 1fr) 31cqh;
  gap: 1.4cqh 1.4cqw;

[data-sim="ari-place-value"] .pv-box { min-width: 0; min-height: 0; padding: 0.45em 0.7em; border: var(--line-w) solid var(--line); border-radius: var(--radius); background: var(--bg); }
[data-sim="ari-place-value"] .pv-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.2em 0.6em; font-weight: 700; }

/* ── the place-value chart ── */
[data-sim="ari-place-value"] .pv-mat {
  display: grid;
  grid-template-columns: repeat(var(--w), minmax(0, 1fr));
  min-height: 0;
  padding: 0;
  overflow: hidden;
}
[data-sim="ari-place-value"] .pv-col {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  min-width: 0;
  min-height: 0;
  border-left: var(--line-w) solid var(--line);
}
[data-sim="ari-place-value"] .pv-col:first-child { border-left: 0; }
[data-sim="ari-place-value"] .pv-ch { display: grid; justify-items: center; padding: 0.25em 0.2em; border-bottom: var(--line-w) solid var(--line); background: var(--panel); }

[data-sim="ari-place-value"] .pv-blocks {
  --u: 0.6rem;
  display: grid;
  grid-template-columns: repeat(var(--cpr, 3), auto);
  gap: calc(var(--u) * var(--g, 0.5));

[data-sim="ari-place-value"] .pv-same { color: var(--muted); margin-top: auto; }

/* ── mistake card ── */
[data-sim="ari-place-value"] .pv-mc { display: flex; flex-direction: column; gap: 0.25em; border-style: dashed; border-color: var(--danger); border-width: 0.18rem; }
[data-sim="ari-place-value"] .pv-mc .sd-paper-box { flex: 1 1 0; min-height: 2.5rem; place-items: center start; }
[data-sim="ari-place-value"] .pv-mc .sd-paper { --pc-fill-h: 96cqh; --pc-max: 2.6rem; }
[data-sim="ari-place-value"] .pv-mres { font-weight: 700; }
[data-sim="ari-place-value"] .pv-mres .pv-bad { color: var(--danger); text-decoration: line-through 0.12em; }
[data-sim="ari-place-value"] .pv-why { }

/* ── panel: number field, quick bases ── */
[data-sim="ari-place-value"] .pv-field { display: grid; gap: 0.3rem; }
[data-sim="ari-place-value"] .pv-input {
  width: 100%; min-height: var(--hit); padding: 0 0.6rem;
  border: var(--line-w) solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--ink); font: inherit; font-family: var(--mono); font-size: 1.15rem;
}
[data-sim="ari-place-value"] .pv-input:focus-visible { outline: 0.25rem solid var(--focus); outline-offset: 0.1rem; }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {

}
</style>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var P = Simdeck.paperColumns;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var PRESET_KEY = { 'build-347': 'pBuild', 'thirteen-ones': 'pThirteen', 'zero-place': 'pZero', 'base-2': 'pBin',
    'base-8-full': 'pOct', 'base-16': 'pHex' };
  var MISTAKE_KEY = { none: 'mNone', squash: 'mSquash', zero: 'mZero', decimal: 'mDecimal' };
  var MISTAKE_TITLE = { squash: 'mtSquash', zero: 'mtZero', decimal: 'mtDecimal' };
  var NA_KEY = { nofull: 'naNofull', nozero: 'naNozero', base10: 'naBase10', letters: 'naLetters' };
  var REFUSAL_KEY = { place: 'rPlace', full: 'rFull', max: 'rMax', empty: 'rEmpty', few: 'rFew', ones: 'rOnes' };
  var QUICK = [2, 8, 10, 16];
  var NAMED = { 2: 'baseName2', 8: 'baseName8', 10: 'baseName10', 16: 'baseName16' };

  var audience = 'teacher';
  var notice = null;     // a refused move, said once in the caption
  var move = null;       // the last move on the chart: { action, k, sig } (sig: the params it produced)
  var shown = null;      // what the last render showed: { base, n, counts }
  var view = null;       // what this render worked out, for the caption

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }

  // ── words for places ──
  function named(b, k) { return k === 0 || (b === 10 && k <= 3); }
  function units(b, k, n) { return named(b, k) ? t.n('u' + k, n) : t.n('uGen', n, { v: L.pow(b, k) }); }
  function one(b, k) { return named(b, k) ? t('one' + k) : t('oneGen', { v: L.pow(b, k) }); }
  function blocksN(n) { return t.n('blocks', n); }
  function colHead(b, k) { return named(b, k) ? t('col' + k) : t('colGen', { v: L.pow(b, k) }); }
  function colOf(b, k) { return named(b, k) ? t('colOf' + k) : t('colOfGen', { v: L.pow(b, k) }); }
  function placeLabel(b, k) { return b === 10 && k <= 3 ? t('place' + k) : P.power(b, k); }

  // ── numbers as data ──
  function num(text, b) {
    return h('span', { class: 'pv-num', translate: 'no' }, String(text), b !== 10 && audience !== 'child' ? h('sub', null, String(b)) : null);
  }
  function plain(text) { return h('span', { class: 'pv-num', translate: 'no' }, String(text)); }
  function sigOf(p) { return [p.base, p.n].concat(L.KEYS.map(function (k) { return p[k]; })).join(','); }

  // ── a column's blocks ──
  function footprint(b, k) {
    if (k === 0) return { fw: 1, fh: 1 };
    if (k === 1) return { fw: 1, fh: b };
    return { fw: Math.max(b, 2), fh: Math.max(b, 2) };
  }
  function blockNode(b, k, isNew) {
    var f = footprint(b, k);
    return h('span', { class: 'pv-blk' + (isNew ? ' sd-changed' : ''), dataset: { k: String(Math.min(k, 3)) },
      style: { '--fw': String(f.fw), '--fh': String(f.fh) } },
      k >= 3 ? h('b', { translate: 'no' }, String(L.pow(b, k))) : null);
  }
  /** Fit the blocks of each column into its box: the column count per row that gives the largest blocks. */
  function fitBlocks(root) {
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    root.querySelectorAll('.pv-body').forEach(function (body) {
      var g = body.firstChild;
      if (!g) return;
      var n = Number(g.dataset.n), fw = Number(g.dataset.fw), fh = Number(g.dataset.fh), gap = Number(g.dataset.g);
      if (!n) return;
      var cs = getComputedStyle(body);
      var W = body.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var H = body.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      if (!(W > 0 && H > 0)) return;
      var extra = fw === fh && fw > 1 && Number(g.dataset.k) >= 3 ? 0.5 : 0;   // a cube's depth
      var best = { u: 0, cpr: 1 };
      for (var cpr = 1; cpr <= n; cpr++) {
        var rows = Math.ceil(n / cpr);
        var tw = cpr * (fw + extra) + (cpr - 1) * gap + 0.3;
        var th = rows * (fh + extra) + (rows - 1) * gap + 0.3;
        var u = Math.min(W / tw, H / th);
        if (u > best.u + 1e-9) best = { u: u, cpr: cpr };
      }
      var cap = Math.min(2.6 * rem, 10 * rem / Math.max(fw, fh));
      g.style.setProperty('--cpr', String(best.cpr));
      g.style.setProperty('--u', Math.max(2, Math.min(cap, best.u)).toFixed(2) + 'px');
    });
  }

  function moveButton(action, k, p, b, sym, label) {
    var why = L.refusal(p, action, k);
    var reason = why ? refusalText(why, b, k, action, p) : null;
    return noFocus(h('button', { type: 'button', dataset: { act: action }, 'aria-label': label, title: label + (reason ? ' — ' + reason : ''),
      'aria-disabled': why ? 'true' : 'false',
      onclick: function () { doMove(action, k); } }, sym));
  }
  function refusalText(why, b, k, action, p) {
    var c = L.blocksOf(p), cap = blocksN(L.capOf(b));
    if (why === 'full' && action === 'break') return t('rFullRight', { col: colOf(b, k - 1), after: blocksN(c[k - 1] + b), cap: cap });
    if (why === 'full' && action === 'regroup') return t('rFull', { col: colOf(b, k + 1), cap: cap });
    if (why === 'few') return t('rFew', { need: blocksN(b), have: blocksN(c[k]) });
    return t(REFUSAL_KEY[why], { b: b, col: colOf(b, k), cap: cap });
  }
  function regroupAll() {
    var patch = L.regroupAll(sim.params);
    move = { action: 'all', k: 0, sig: sigOf(Object.assign({}, sim.params, patch)) };
    sim.set(patch);
  }
  function doMove(action, k) {
    var p = sim.params;
    var r = L.act(p, action, k);
    if (r.error) { notice = refusalText(r.error, p.base, k, action, p); sim.render(); return; }
    var next = Object.assign({}, p, r.params);
    move = { action: action, k: k, sig: sigOf(next) };
    sim.set(r.params);
  }

  // ── render ──
  function render(c) {
    var p = c.params, s = c.state, b = s.base, aud = audience;
    var W = s.places;
    // what changed since the last render: new blocks are marked; a base change with the same quantity is said
    var sameBase = shown && shown.base === b;
    var grown = {};
    var mv = move && move.sig === sigOf(p) ? move : null;
    var marks = !!(mv && sameBase);   // only a move on the chart marks what it changed, not a preset or a typed number
    if (marks) s.counts.forEach(function (n, k) { if (n > shown.counts[k]) grown[k] = n - shown.counts[k]; });
    view = { move: mv, rebased: rebasing || !!(shown && !sameBase && shown.n === s.n && !mv), grown: grown };
    rebasing = false;
    if (!mv) move = null;
    shown = { base: b, n: s.n, counts: s.counts.slice() };

    // the chart
    var cols = [];
    for (var k = W - 1; k >= 0; k--) {
      var n = s.counts[k], f = footprint(b, k);
      var blocks = [];
      for (var i = 0; i < n; i++) blocks.push(blockNode(b, k, grown[k] && i >= n - grown[k]));
      var over = n >= b;
      var gap = k === 0 ? 0.35 : k === 1 ? 0.6 : Math.max(0.6, f.fw * 0.12);
      var unitsLabel = t('colBlocks', { col: colHead(b, k), u: units(b, k, n) });
      cols.push(h('div', { class: 'pv-col', dataset: over ? { over: '' } : {} },
        h('div', { class: 'pv-ch', title: named(b, k) ? t('placeName' + k) : t('placeName', { v: L.pow(b, k) }) },
          h('span', { class: 'pv-pl' }, placeLabel(b, k)),
          h('span', { class: 'pv-pv', translate: 'no' }, String(L.pow(b, k)))),
        h('div', { class: 'pv-body', role: 'img', 'aria-label': unitsLabel },
          n ? h('div', { class: 'pv-blocks', dataset: { n: String(n), fw: String(f.fw), fh: String(f.fh), g: String(gap), k: String(k) },
            style: { '--g': String(gap) } }, blocks) : null),
        h('div', { class: 'pv-cf' },
          h('span', { class: 'pv-count', translate: 'no' }, String(n)),
          aud === 'child' ? null : h('span', { class: 'pv-worth', translate: 'no' }, '= ' + (n * L.pow(b, k)))),
        h('div', { class: 'pv-btns' },
          moveButton('add', k, p, b, '+', t('btnAdd', { u: units(b, k, 1) })),
          moveButton('remove', k, p, b, '−', t('btnRemove', { u: units(b, k, 1) })),
          k + 1 < L.placesFor(b) ? moveButton('regroup', k, p, b, '⇐', t('btnRegroup', { from: units(b, k, b), to: one(b, k + 1) })) : h('span', { class: 'pv-gap' }),
          k > 0 ? moveButton('break', k, p, b, '⇒', t('btnBreak', { from: one(b, k), to: units(b, k - 1, b) })) : h('span', { class: 'pv-gap' }))));
    }
    var mat = h('section', { class: 'pv-box pv-mat', 'aria-label': t('mat'), style: { '--w': String(W) } }, cols);

    // the number on paper (K5)
    var cells = [];
    var top = -1;
    s.counts.forEach(function (n, k) { if (n > 0) top = k; });
    for (var j = 0; j < W; j++) {
      var cn = s.counts[j];
      if (j > top && !(j === 0 && top < 0)) { cells.push(null); continue; }
      if (cn >= b) cells.push({ text: L.textOf(cn, b), x: 'wrong', label: t('overCell', { c: cn }) });   // the count as written in the base: two digits
      // a digit that changed since the last render (same base) gets the changed mark
      else cells.push({ text: L.DIGITS[cn], now: !!(marks && prevDigit[j] !== undefined && prevDigit[j] !== L.DIGITS[cn]) });
    }
    prevDigit = cells.map(function (cell) { return cell ? cell.text : null; });
    var showDec = b !== 10 && aud !== 'child';
    var labels = [];
    for (var q = 0; q < W; q++) labels.push(placeLabel(b, q));
    var paper = P({
      cols: W, big: aud === 'child', label: t('paper'), places: labels,
      rows: [{ kind: 'result', cells: cells, aside: showDec ? '= ' + s.n : null }],
      asideHead: showDec ? t('decimal') : null
    });
    var written = h('section', { class: 'pv-box pv-written' },
      h('div', { class: 'pv-head' }, h('span', null, t('paperHead')),
        s.numeral != null && aud !== 'child' ? h('span', { class: 'pv-small' }, num(s.numeral, b)) : null),
      h('div', { class: 'sd-paper-box' }, paper),
      s.over.length ? h('p', { class: 'pv-note' }, t('overNote'), ' ',
        noFocus(h('button', { type: 'button', class: 'sd-btn pv-all', title: t('regroupAllHint') + ' (G)', 'aria-keyshortcuts': 'g',
          onclick: regroupAll }, t('regroupAll'), h('kbd', null, 'G')))) : null);

    var bottom = [written];
    if (aud === 'teacher' && p.mistake !== 'none') bottom.push(mistakeCard(p, s));
    else if (aud !== 'child') bottom.push(basesCard(s));

    var root = h('div', { class: 'pv', dataset: { aud: aud } }, mat, h('div', { class: 'pv-bottom' }, bottom));
    c.stage.replaceChildren(root);
    fitBlocks(root);
    syncPanel(c);
  }
  var prevDigit = [];
  var rebasing = false;
  /** The base changed alone (slider, quick button, child view): write the regrouped blocks into the params, so the
      URL and a later base change start from them (SPEC rule 3). */
  function writeBack(c) {
    var stale = L.KEYS.some(function (key, k) { return c.params[key] !== c.state.counts[k]; });
    if (!stale) return;
    rebasing = !!(view && view.rebased);
    sim.set(L.paramsFor(c.state.n, c.state.counts), { preset: c.preset });
  }

  function basesCard(s) {
    var rows = [];
    s.bases.forEach(function (x) {
      var cur = x.current ? { cur: '' } : {};
      rows.push(h('dt', { dataset: cur }, t('bBase', { b: x.base })),
        h('dd', { dataset: cur, style: { margin: '0' } }, h('span', { class: 'pv-num', translate: 'no' }, x.text)),
        h('dd', { dataset: cur, style: { margin: '0' } }, x.current ? h('span', { class: 'pv-here' }, t('bHere')) : ''));
    });
    return h('section', { class: 'pv-box pv-bases' },
      h('div', { class: 'pv-head' }, h('span', null, t('bTitle'))),
      h('dl', { class: 'pv-blist' }, rows),
      h('p', { class: 'pv-same' }, t('bSame', { nU: units(10, 0, s.n) })));
  }

  function alignedCells(text, other) {
    // digits by place (ones first); a digit that differs from the other numeral at the same place is crossed
    var a = text.split('').reverse(), o = other.split('').reverse();
    return a.map(function (ch, k) { return ch === o[k] ? ch : { text: ch, x: 'wrong', label: t('wrongCell', { w: ch }) }; });
  }
  /** Place values from the highest down, the last four only on a long numeral ("…, 8, 4, 2, 1"). */
  function lastPlaces(list) {
    var r = list.slice().reverse();
    return (r.length > 4 ? '…, ' + r.slice(-4).join(', ') : r.join(', '));
  }
  function mistakeCard(p, s) {
    var b = s.base;
    var m = L.mistakeOf(p, p.mistake);
    var kids = [h('div', { class: 'pv-head' }, h('span', null, t('mtHead')), h('span', { class: 'pv-small' }, t(MISTAKE_TITLE[m.kind])))];
    if (!m.applies) {
      kids.push(h('p', { class: 'pv-why' }, t(NA_KEY[m.reason], { b: b })));
      return h('section', { class: 'pv-box pv-mc' }, kids);
    }
    var paper;
    if (m.kind === 'decimal') {
      var len = m.rightText.length, pvs = [], tens = [];
      for (var k = 0; k < len; k++) { pvs.push(String(L.pow(b, k))); tens.push(String(L.pow(10, k))); }
      // more than six places: the values are in the text below, the squares keep their size
      paper = P({ cols: len, places: len <= 6 ? pvs : null, label: t('mtHead'),
        rows: [{ cells: m.rightText.split('').reverse(), aside: '= ' + s.n }] });
      kids.push(h('div', { class: 'sd-paper-box' }, paper));
      if (!m.same) kids.push(h('p', { class: 'pv-mres' }, h('span', { class: 'pv-bad' }, plain(m.wrongValue)), ' ', t.parts('mtInstead', { res: plain(s.n) })));
      kids.push(h('p', { class: 'pv-why' }, m.same ? t('whyDecimalSame') : t('whyDecimal', { b: b, pv: lastPlaces(pvs), tens: lastPlaces(tens) })));
      return h('section', { class: 'pv-box pv-mc' }, kids);
    }
    var cols = Math.max(m.wrongText.length, m.rightText.length);
    paper = P({ cols: cols, label: t('mtHead'),
      rows: [{ cells: m.same ? m.wrongText.split('').reverse() : alignedCells(m.wrongText, m.rightText) },
        { kind: 'result', cells: m.rightText.split('').reverse() }] });
    kids.push(h('div', { class: 'sd-paper-box' }, paper));
    if (!m.same) kids.push(h('p', { class: 'pv-mres' }, h('span', { class: 'pv-bad' }, num(m.wrongText, b)), ' ', t.parts('mtInstead', { res: num(m.rightText, b) })));
    var why;
    if (m.kind === 'squash') {
      var k0 = m.over[0];
      why = m.same ? t('whySquashSame') : t('whySquash', { col: colOf(b, k0), ct: L.textOf(s.counts[k0], b), b: b });
    } else why = t('whyZero');
    kids.push(h('p', { class: 'pv-why' }, why));
    return h('section', { class: 'pv-box pv-mc' }, kids);
  }

  // ── caption ──
  function caption(c) {
    var s = c.state, b = s.base, aud = audience;
    var X = aud === 'teacher' ? 'T' : aud === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(t.parts('cRefused', { why: notice })); notice = null; }

    var mv = view && view.move;
    if (mv) {
      var k = mv.k;
      if (mv.action === 'add' || mv.action === 'remove') {
        var key = mv.action === 'add' ? 'cAdd' : 'cRemove';
        add(t.parts(key + (X === 'C' ? 'C' : 'T'), { u: units(b, k, 1), v: plain(L.pow(b, k)) }));
      } else if (mv.action === 'regroup' || mv.action === 'break') {
        var from = mv.action === 'regroup' ? units(b, k, b) : units(b, k, 1);
        var to = mv.action === 'regroup' ? units(b, k + 1, 1) : units(b, k - 1, b);
        var base = mv.action === 'regroup' ? 'cRegroup' : 'cBreak';
        if (X === 'C') add(t.parts('cRegroupC', { from: from, to: to }));
        else {
          add(t.parts(base + 'T', { from: from, to: to, n: plain(s.n) }));
          if (X === 'A') add(t.parts(base + 'A', { from: from, to: to, b: plain(b) }));
        }
      } else if (mv.action === 'all') {
        if (X !== 'C') add(t.parts('cAllT', { b: plain(b) }));
      }
    } else if (view && view.rebased && X !== 'C') {
      add(t.parts('cBaseT', { b: String(b), nU: units(10, 0, s.n) }));
      if (X === 'A') add(t('cBaseA'));
    } else if (!notice && out.length === 0) {
      if (X === 'C') add(t('cStartC'));
      else if (X === 'A') add(t.parts('cStartA', { b: plain(b) }));
      else add(t('cStartT'));
    }

    // the number
    if (s.over.length) {
      var k0 = s.over[0], c0 = s.counts[k0];
      if (X === 'C') addHl(t.parts('cOverC', { u: units(b, k0, c0), b: plain(b) }));
      else {
        addHl(t.parts('cOverT', { col: colHead(b, k0), c: blocksN(c0), max: plain(b - 1), b: plain(b) }));
        var ex = expansionNodes(s, b);
        add(t.parts(ex.one ? 'cBlocks1' : 'cBlocks', { terms: ex.terms, worths: ex.worths, n: plain(s.n) }));
      }
    } else if (X === 'C') {
      var parts = [];
      s.expansion.forEach(function (x, i) {
        if (i) parts.push(i === s.expansion.length - 1 ? t('cAnd') : ', ');
        parts.push(units(b, x.k, x.d));
      });
      add(t.parts('cChild', { num: plain(s.numeral), parts: h('span', null, parts) }));
    } else {
      var e = expansionNodes(s, b);
      add(t.parts((b === 10 ? 'cExpand' : 'cExpandDec') + (e.one ? '1' : ''), { num: num(s.numeral, b), terms: e.terms, worths: e.worths, n: plain(s.n) }));
    }
    return out;
  }
  function expansionNodes(s, b) {
    var list = s.expansion;
    if (list.length > 6) list = list.filter(function (x) { return x.d > 0; });
    if (!list.length) list = s.expansion.slice(-1);
    return {
      one: list.length === 1,
      terms: plain(list.map(function (x) { return x.d + ' · ' + x.pv; }).join(' + ')),
      worths: plain(list.map(function (x) { return x.worth; }).join(' + '))
    };
  }

  // ── the panel: the number field and the quick bases; the header: the audience switch ──
  var field = null, quick = null;
  function buildNumber() {
    var host = document.querySelector('[data-pv-number]');
    var label = h('label', { class: 'sd-ctl-label', for: 'pv-num' }, h('span', null, ''));
    var input = h('input', { id: 'pv-num', type: 'text', class: 'pv-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', 'aria-describedby': 'pv-num-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'pv-num-msg', role: 'status' }, t('numsHint'));
    input.addEventListener('input', function () {
      var r = L.parseNumber(input.value, sim.params.base);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t({ digit: 'errDigit', max: 'errMax', empty: 'errEmpty' }[r.error], { at: r.at, b: sim.params.base });
        msg.className = 'pv-err';
        return;
      }
      input.removeAttribute('aria-invalid');
      msg.textContent = t('numsHint');
      msg.className = 'sd-hint';
      sim.set(L.paramsFor(r.value, L.digitsOf(r.value, sim.params.base)));
    });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { input.removeAttribute('aria-invalid'); msg.textContent = t('numsHint'); msg.className = 'sd-hint'; sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('numsTitle') },
      h('div', { class: 'pv-field' }, label, input, msg)));
    field = { input: input, label: label.firstChild, msg: msg };
  }
  function buildQuick() {
    var wrap = document.querySelector('[data-sd-controls] [data-key="base"]');
    if (!wrap) return;
    quick = QUICK.map(function (qb) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { sim.set({ base: qb }); } }, String(qb)));
    });
    wrap.append(h('div', { class: 'sd-seg pv-quick', role: 'group', 'aria-label': t('baseQuick'), title: t('baseHint') }, quick));
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints,
      onChange: function (a) { audience = a; if (!enforceChild()) sim.render(); } });
    audience = ctl.value;
  }
  /** The child view hides the presets in other bases (it works in base 10). */
  function syncChildPresets() {
    var btns = document.querySelectorAll('[data-sd-presets] .sd-preset');
    L.PRESETS.forEach(function (pr, i) { if (btns[i]) btns[i].hidden = audience === 'child' && pr.params.base !== 10; });
  }
  /** The child view works in base 10 only; the quantity stays. Returns true when it changed the base. */
  function enforceChild() {
    if (audience !== 'child' || sim.params.base === 10) return false;
    sim.set({ base: 10 });
    return true;
  }
  function syncPanel(c) {
    var p = c.params;
    if (field) {
      field.label.textContent = t('numsLabel', { b: p.base });
      var r = L.parseNumber(field.input.value, p.base);
      if (document.activeElement !== field.input || r.error || r.value !== c.state.n) {
        if (document.activeElement !== field.input || !r.error) {
          field.input.value = L.textOf(c.state.n, p.base);
          field.input.removeAttribute('aria-invalid');
          field.msg.textContent = t('numsHint');
          field.msg.className = 'sd-hint';
        }
      }
    }
    if (quick) quick.forEach(function (btn, i) { btn.setAttribute('aria-pressed', String(p.base === QUICK[i])); });
  }

  buildAudience();
  buildNumber();

  var hidden = function (key, max) {
    return { key: key, type: 'range', label: t('numsTitle'), value: L.defaults[key], min: 0, max: max, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'base', type: 'range', label: t('base'), value: L.defaults.base, min: L.MIN_BASE, max: L.MAX_BASE,
        format: function (v) { return NAMED[v] ? v + ' (' + t(NAMED[v]) + ')' : String(v); },
        visible: function () { return audience !== 'child'; } },
      { key: 'mistake', type: 'select', label: t('mistake'), value: L.defaults.mistake,
        options: L.MISTAKES.map(function (m) { return [m, t(MISTAKE_KEY[m])]; }),
        visible: function () { return audience === 'teacher'; } },
      // the quantity and the blocks: set from the chart and the field, kept here so the URL and the language switch carry them
      hidden('n', L.MAX_VALUE)
    ].concat(L.KEYS.map(function (key) { return hidden(key, L.MAX_COUNT); })),

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    keys: [{ key: 'g', label: t('regroupAllHint'), run: function () { regroupAll(); } }],

    legend: [
      { shape: 'pv-over', label: t('legOver') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
  buildQuick();
  sim.on(function (c) {
    if (audience === 'child' && c.params.base !== 10) { enforceChild(); return; }
    writeBack(c);
    syncChildPresets();
  });
  enforceChild();
  sim.render();
  if (window.ResizeObserver) {
    var stage = document.querySelector('[data-sd-stage]');
    new ResizeObserver(function () { var r = stage.querySelector('.pv'); if (r) fitBlocks(r); }).observe(stage);
  }
})();
</script>
</body>
</html>
