<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Series colour per party; grid places [col, row] in an 8-column grid, cards span 3. */
  var COLOUR = { 'PC-A': '1', 'PC-B': '2', phone: '3', DC01: '4', DC02: '5' };
  var POS = { 'PC-A': [0, 0], phone: [0, 1], 'PC-B': [0, 2], DC02: [4, 0], DC01: [4, 2] };
  var LINKS = [['PC-A', 'DC02'], ['phone', 'DC02'], ['PC-B', 'DC01'], ['DC02', 'DC01']];
  var USER = 'ana';

  /** Data (host names, attribute names, password labels, times) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { class: 'lk-d' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  function min(n) { return data('t = ' + n + ' min'); }
  /** A client's name in a sentence: PC-A and PC-B are data, the phone is a word. */
  function who(id) { return id === 'phone' ? h('span', null, t('phoneShort')) : data(id); }
  /** A password label: P0…P3 are data, a typo is a word. */
  function pwd(pw) { return pw === 'typo' ? h('span', null, t('typoWord')) : data(pw); }
  /** Parts of a string with *English term* turned into <em lang="en"> (the Croatian term rule). Placeholder nodes are
      cloned, so one vars object may serve several sentences. */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p.cloneNode(true)); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function join(list) {
    var out = [];
    list.forEach(function (x, i) { if (i) out.push(' '); out = out.concat(x); });
    return out;
  }
  /** Highlight a value that differs from the step before. */
  function ch(c, get) {
    if (!c.prev || c.n === 0) return false;
    return JSON.stringify(get(c.state)) !== JSON.stringify(get(c.prev));
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function lockIcon() {
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'lk-lock');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', 'M7 10V7a5 5 0 0 1 10 0v3h1.5A1.5 1.5 0 0 1 20 11.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 20.5v-9A1.5 1.5 0 0 1 5.5 10zm2.5 0h5V7a2.5 2.5 0 0 0-5 0z');
    s.append(p);
    return s;
  }
  function eff(p) { return Object.assign({}, p, { resetMin: L.resetOf(p) }); }

  // ── the strip on top ──

  function kv(label, value, changed) {
    return h('span', { class: 'lk-kv' }, h('span', null, label), h('b', { class: changed ? 'lk-ch' : null, translate: 'no' }, value));
  }
  function strip(c) {
    var p = eff(c.params), s = c.state;
    var thr = p.threshold === 0 ? '0 (' + t('never') + ')' : String(p.threshold);
    var dur = p.durationMin === 0 ? '0 (' + t('untilAdmin') + ')' : p.durationMin + ' min';
    var pol = h('div', { class: 'lk-box lk-pol', 'aria-label': t('policy') },
      kv(t('polThreshold'), thr), kv(t('polReset'), p.resetMin + ' min'), kv(t('polDuration'), dur),
      h('span', { class: 'lk-kv' }, h('span', null, t('polHistory')), h('b', null, t(p.historyCheck ? 'on' : 'off'))));
    var locked = !!s.locked;
    var acct = h('div', { class: 'lk-box lk-acct' }, h('b', null, t('account'), ' ', data(USER)),
      kv(t('pwdNow'), s.pwd.current, ch(c, function (x) { return x.pwd.current; })),
      kv(t('pwdHistory'), s.pwd.history.join(' '), ch(c, function (x) { return x.pwd.history; })),
      h('span', { class: 'lk-state' + (ch(c, function (x) { return !!x.locked; }) ? ' lk-ch' : ''), dataset: { k: locked ? 'locked' : 'open' } },
        locked ? lockIcon() : null, t(locked ? 'stateLocked' : 'stateOpen')));
    var clock = h('div', { class: 'lk-box lk-clock' }, h('span', null, t('clock')), h('b', { translate: 'no', class: ch(c, function (x) { return x.t; }) ? 'lk-ch' : null }, 't = ' + s.t + ' min'));
    return h('div', { class: 'lk-top' }, clock, pol, acct);
  }

  // ── the cards (kit view K2) ──

  /** A card's head beside the mark: the name, a muted role and this step's badges, in one block. */
  function head(name, role, badges) {
    return h('div', { class: 'lk-head' }, h('div', { class: 'lk-title' }, name, h('span', { class: 'lk-role' }, role)),
      h('div', { class: 'lk-badges' }, badges.map(function (b) { return h('span', { class: 'sd-topo-badge', dataset: { k: b.k } }, b.text); })));
  }

  function clientBadges(c, id) {
    var s = c.state, e = s.last, out = [];
    if (e && e.client === id) {
      if (e.kind === 'change') out.push({ text: t('bChange'), k: 'fill' });
      else if (e.typed === 'typo') out.push({ text: t('bTypo'), k: 'fill' });
      else out.push({ text: t('bTypes', { pw: e.typed }), k: 'fill' });
    }
    if (id === 'phone') {
      var ss = s.sessions[0];
      out.push(ss ? { text: t('bStale', { pw: ss.pwdUsed, r: ss.retryMin }), k: 'dashed' } : { text: t('bNoSession'), k: 'muted' });
    }
    return out;
  }

  function dcBadges(c, id) {
    var e = c.state.last, out = [];
    if (id === L.PDC) out.push({ text: t('pdc'), k: 'solid' });
    if (!e || e.kind === 'tick') { if (e && e.unlocked) out.push({ text: t('bUnlocked'), k: 'dashed' }); return out; }
    if (e.unlocked) out.push({ text: t('bUnlocked'), k: 'dashed' });
    var mine = e.dc === id, pdcHere = id === L.PDC && e.chained;
    if (e.kind === 'change') { if (mine) out.push({ text: t('bForwards'), k: 'fill' }); return out; }
    if (e.result === 'locked' && mine) out.push({ text: t('bLockedOut'), k: 'fill' });
    if (e.result === 'ok' && mine) out.push({ text: t('bAccepts'), k: 'fill' });
    if ((e.result === 'bad' || e.result === 'old') && (mine || pdcHere)) {
      out.push({ text: t('bRejects'), k: 'fill' });
      if (e.result === 'bad') out.push({ text: t('bCounts'), k: 'solid' });
      else out.push({ text: t('bNotCounted'), k: 'dashed' });
      if (e.lockedBy === id) out.push({ text: t('bLocks'), k: 'fill' });
    }
    return out;
  }

  function dcExtra(c, id) {
    var p = c.params, d = c.state.dcs[id];
    var full = p.threshold > 0 && d.bad >= p.threshold;
    var numCh = ch(c, function (x) { return x.dcs[id].bad; });
    return h('div', { class: 'lk-extra' },
      h('div', { class: 'lk-count' },
        h('span', { class: 'lk-attr', translate: 'no' }, 'badPwdCount'),
        h('b', { class: 'lk-num' + (numCh ? ' lk-ch' : ''), translate: 'no', dataset: { k: full ? 'full' : 'below' } }, String(d.bad)),
        h('span', null, p.threshold > 0 ? t('ofThreshold', { th: p.threshold }) : t('noLimit'))),
      h('div', { class: 'lk-times' },
      h('span', { class: 'lk-attr', translate: 'no' }, 'badPasswordTime'),
      h('span', { class: 'lk-val' + (ch(c, function (x) { return x.dcs[id].lastBad; }) ? ' lk-ch' : '') },
        d.lastBad === null ? t('none') : min(d.lastBad)),
      h('span', { class: 'lk-attr', translate: 'no' }, 'lockoutTime'),
      h('span', { class: 'lk-val' + (ch(c, function (x) { return x.dcs[id].lockoutTime; }) ? ' lk-ch' : ''), dataset: { k: d.lockoutTime !== null ? 'locked' : 'none' } },
        d.lockoutTime === null ? t('none') : [lockIcon(), min(d.lockoutTime)])));
  }

  function topo(c) {
    var s = c.state, e = s.last;
    var active = [];
    if (e && e.client) active.push(e.client, e.dc);
    if (e && (e.chained || e.pdcReset)) active.push(L.PDC);
    var nodes = L.CLIENTS.map(function (id) {
      var role = t(id === 'phone' ? 'phoneName' : id === 'PC-A' ? 'pcaName' : 'pcbName') + ' · ' + t('via', { dc: L.DC_OF[id] });
      return { id: id, kind: 'host', col: POS[id][0], row: POS[id][1], span: 3, c: COLOUR[id], mark: id === 'phone' ? t('phoneMark') : id.slice(-1),
        name: head(id === 'phone' ? h('b', null, t('phoneShort')) : h('b', null, data(id)), role, clientBadges(c, id)),
        state: active.indexOf(id) >= 0 ? 'active' : null };
    }).concat(L.DCS.map(function (id) {
      return { id: id, kind: 'server', col: POS[id][0], row: POS[id][1], span: 4, c: COLOUR[id], mark: id.slice(-1),
        name: head(h('b', null, data(id)), t('dcName'), dcBadges(c, id)),
        state: active.indexOf(id) >= 0 ? 'active' : null, extra: dcExtra(c, id) };
    }));
    var links = LINKS.map(function (l) {
      var on = e && e.client && ((l[0] === e.client && l[1] === e.dc) || (l[0] === 'DC02' && (e.chained || e.pdcReset || !!e.lockedBy)));
      return { id: l.join('-'), a: l[0], b: l[1], state: 'up', active: !!on };
    });
    var packets = [];
    if (e && e.client) {
      var label;
      if (e.kind === 'change') label = t('chipChange', { pw: e.typed });
      else if (e.result === 'locked') label = t('chipLocked');
      else if (e.result === 'ok') label = t('chipOk', { pw: e.typed });
      else if (e.typed === 'typo') label = t('chipTypo');
      else label = t('chipBad', { pw: e.typed });
      packets.push({ from: e.client, to: e.dc, label: label, c: COLOUR[e.client], at: 0.5 });
      if (e.chained) packets.push({ from: e.dc, to: L.PDC, label: t(e.kind === 'change' ? 'chipChainPwd' : 'chipChain'), c: COLOUR[e.dc], cast: 'broadcast', at: 0.5 });
      if (e.pdcReset) packets.push({ from: e.dc, to: L.PDC, label: t('chipZero'), c: COLOUR[e.dc], cast: 'broadcast', at: 0.5 });
      if (e.lockedBy) {
        var other = e.lockedBy === 'DC01' ? 'DC02' : 'DC01';
        packets.push({ from: e.lockedBy, to: other, label: t('chipLock'), c: COLOUR[e.lockedBy], at: 0.5 });
      }
    }
    return Simdeck.topology({ cols: 8, rows: ['auto', 'auto', 'auto'], dir: c.dir, nodes: nodes, links: links, packets: packets, gap: '1cqw' });
  }

  // ── the timeline ──

  var SYM = { bad: '✕', old: '–', ok: '✓', locked: '✕', changed: '⇄', tick: '…' };
  function timeline(c) {
    var s = c.state;
    var items = s.log.map(function (x, i) {
      var head = [data('t=' + x.t), ' '];
      if (x.kind === 'tick') head.push(h('span', null, t('tlPause')));
      else if (x.kind === 'change') head.push(h('span', null, t('tlChange')));
      else head.push(x.client === 'phone' ? h('span', null, t('phoneShort')) : data(x.client), ' ', h('span', { class: 'lk-sym', 'aria-hidden': 'true' }, SYM[x.result]));
      return h('li', { class: i === s.log.length - 1 ? 'lk-now' : null, dataset: { k: x.result } },
        h('span', null, head),
        h('span', null, x.locked ? lockIcon() : null, data(x.DC02 + ' · ' + x.DC01)));
    });
    return h('div', { class: 'lk-tl' }, h('b', null, t('timeline'), ' ', data('(DC02 · DC01)')),
      items.length ? h('ol', null, items) : h('span', { class: 'lk-empty' }, t('tlStart')));
  }

  // ── captions ──

  function capStart(c) {
    var p = eff(c.params);
    var key = { 'one-pc': 'startOnePc', 'two-pcs': 'startTwoPcs', 'stale-phone': 'startStale', 'old-password': 'startOld', 'reset-window': 'startReset' }[p.scenario];
    var out = [rich(key, { th: data(p.threshold), r: data(p.scenario === 'stale-phone' ? p.retryMin : p.resetMin), pw: data('P1') })];
    if (p.scenario === 'two-pcs' && p.threshold === 5) out.push(rich('startTwoPcsAsk', {}));
    out.push(rich('startCommon', {}));
    if (p.threshold === 0) out.push(rich('startNever', {}));
    if (!p.historyCheck && (p.scenario === 'stale-phone' || p.scenario === 'old-password')) out.push(rich('startHistoryOff', {}));
    return join(out);
  }

  function capAttempt(c) {
    var p = eff(c.params), s = c.state, e = s.last;
    var a = data(s.dcs.DC02.bad), b = data(s.dcs.DC01.bad), th = data(p.threshold);
    var v = { c: who(e.client), dc: data(e.dc), pw: e.typed === 'typo' ? null : data(e.typed), a: a, b: b, th: th };
    var out = [];
    if (e.unlocked) out.push(rich('unlockedNow', { s: data(c.prev.locked.since), d: data(p.durationMin) }));
    if (e.reset.length && e.result === 'locked') out.push(rich('resetLocked', { r: data(p.resetMin) }));
    else if (e.reset.length) out.push(rich(e.reset.length > 1 ? 'resetFirstBoth' : 'resetFirst', { r: data(p.resetMin), dc: data(e.reset[0]) }));
    var send = e.kind === 'retry' ? 'sendRetry' : e.typed === 'typo' ? 'sendTypo' : e.result === 'ok' || e.typed === s.pwd.current ? 'sendRight' : 'sendOld';
    if (e.result === 'locked') {
      out.push(rich(send, v));
      out.push(rich(e.typed === s.pwd.current ? 'refusedRight' : 'refused', { dc: data(e.dc), s: data(s.locked.since) }));
      out.push(rich(p.durationMin > 0 ? 'unlockAt' : 'unlockAdmin', { u: data(s.locked.since + p.durationMin) }));
      if (s.sessions.length) out.push(rich('relock', {}));
      return join(out);
    }
    if (e.result === 'ok') {
      var had = c.prev.dcs[e.dc].bad > 0 && e.reset.indexOf(e.dc) < 0;
      out.push(rich(send, v), rich(had ? 'okDone' : 'okZero', v));
      if (e.pdcReset) out.push(rich('okPdc', v));
      if (s.sessions.length && p.historyCheck && p.threshold > 0) {
        // only when the same run without the check would have locked the account
        var off = Simdeck.stateAt(L, Object.assign({}, c.params, { historyCheck: false }), c.n);
        if (off.log.some(function (x) { return x.locked; })) out.push(rich('noLockHistory', { pw: data(s.sessions[0].pwdUsed) }));
      }
      return join(out);
    }
    out.push(rich(send, v));
    if (e.result === 'old') {
      out.push(rich(e.chained ? 'oldChainedPdc' : 'atPdc', v), rich('oldNotCounted', v));
      return join(out);
    }
    var before = c.prev.log.some(function (x) { return x.client && L.DC_OF[x.client] !== L.PDC && (x.result === 'bad' || x.result === 'old'); });
    out.push(rich(!e.chained ? 'atPdc' : before ? 'chainedAgain' : 'chained', v));
    if (e.lockedBy) {
      // the task's caption counts the phone's failures: only when every one of them is still in the count
      var phoneBad = s.log.filter(function (x) { return x.client === 'phone' && x.result === 'bad'; }).length;
      if (e.kind === 'retry' && phoneBad === s.dcs[e.lockedBy].bad && phoneBad <= 10) out.push(rich('lockedStale', { r: data(p.retryMin), t: data(e.t), k: h('span', null, t('ordinals').split(',')[phoneBad - 1]) }));
      else if (e.lockedBy === L.PDC && s.dcs.DC02.bad < p.threshold) out.push(rich('lockedSplit', v));
      else out.push(rich('lockedPlain', { dc: data(e.lockedBy), th: th }));
      out.push(rich(e.kind === 'retry' ? 'lockSpreadMail' : 'lockSpread', { t: data(e.t) }));
    } else {
      out.push(rich(p.threshold === 0 ? 'countedNever' : 'counted', v));
    }
    return join(out);
  }

  function capTick(c) {
    var p = eff(c.params), s = c.state, e = s.last, prev = c.prev;
    var last = prev.dcs.DC01.lastBad;
    if (last === null) return rich('tickNothing', { t: data(e.t) });
    var vars = { t: data(e.t), last: data(last), d: data(e.t - last), r: data(p.resetMin), a: data(s.dcs.DC02.bad), b: data(s.dcs.DC01.bad) };
    var out = [];
    if (e.unlocked) out.push(rich('unlockedNow', { s: data(prev.locked.since), d: data(p.durationMin) }));
    if (prev.dcs.DC01.bad === 0 && prev.dcs.DC02.bad === 0) out.push(rich('tickNothing', vars));
    else out.push(rich(e.reset.length ? 'tickReset' : 'tickKeep', vars));
    return join(out);
  }

  function caption(c) {
    var s = c.state, e = s.last;
    if (!e) return capStart(c);
    var out;
    if (e.kind === 'tick') out = capTick(c);
    else if (e.kind === 'change') out = rich('changeDone', { old: data(e.old), 'new': data(e.typed) });
    else out = capAttempt(c);
    if (c.last && !s.log.some(function (x) { return x.locked; })) {
      var max = 0;
      s.log.forEach(function (x) { max = Math.max(max, x.DC01, x.DC02); });
      if (c.params.threshold > 0 && e.result !== 'ok') out = join([out, rich('endOpen', { max: data(max), th: data(c.params.threshold) })]);
    }
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scenario', type: 'select', label: t('stage'), options: L.SCENARIOS.map(function (x) { return [x, x]; }), resets: true,
        visible: function () { return false; } },
      { key: 'threshold', type: 'range', label: t('threshold'), min: 0, max: 10,
        format: function (v) { return v === 0 ? '0 (' + t('never') + ')' : String(v); } },
      { key: 'durationMin', type: 'range', label: t('durationMin'), min: 0, max: 60,
        format: function (v) { return v === 0 ? t('untilAdmin') : t('minutes', { n: v }); } },
      { key: 'resetMin', type: 'range', label: t('resetMin'), hint: t('resetHint'), min: 1,
        max: function (p) { return p.durationMin > 0 ? p.durationMin : 60; },
        format: function (v) { return t('minutes', { n: v }); } },
      { key: 'retryMin', type: 'range', label: t('retryMin'), min: 1, max: 30, resets: true,
        format: function (v) { return t('minutes', { n: v }); },
        visible: function (p) { return p.scenario === 'stale-phone'; } },
      { key: 'historyCheck', type: 'toggle', label: t('historyCheck'), hint: t('historyHint') }
    ],

    presets: [
      { id: 'one-pc', label: t('presetOnePc'), hint: t('presetOnePcHint'), params: { scenario: 'one-pc' } },
      { id: 'two-pcs', label: t('presetTwoPcs'), hint: t('presetTwoPcsHint'), params: { scenario: 'two-pcs' } },
      { id: 'stale-phone', label: t('presetStale'), hint: t('presetStaleHint'), params: { scenario: 'stale-phone', historyCheck: false } },
      { id: 'old-password', label: t('presetOld'), hint: t('presetOldHint'), params: { scenario: 'old-password' } },
      { id: 'reset-window', label: t('presetReset'), hint: t('presetResetHint'), params: { scenario: 'reset-window' } }
    ],

    legend: [
      { shape: 'line', label: t('legendTry') },
      { shape: 'dash', label: t('legendChain') },
      { shape: 'lk-count', label: t('legendCount') },
      { shape: 'lk-lock', label: t('legendLock') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'lk' }, strip(c), topo(c), timeline(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
