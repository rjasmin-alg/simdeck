        return h('span', { class: 'dp-share' + ch(was && !has(was.shares, x)), translate: 'no' }, hand(), x);
      })) : h('span', { class: 'dp-muted dp-sm' }, t('noShares')),
      d.sysvol.map(function (id) {
        var g = L.GPOS.filter(function (x) { return x.id === id; })[0];
        return h('span', { class: 'dp-gpo' + ch(was && !has(was.sysvol, id)), translate: 'no' }, g.name, h('small', null, g.id.slice(0, 9) + '…}'));
      }));
    var roles = h('div', { class: 'dp-panel' }, h('h3', null, t('pRoles')),
      d.fsmo.length || d.gc ? h('div', { class: 'dp-row' },
        d.fsmo.map(function (f) { return h('span', { class: 'dp-fsmo' + ch(was && !has(was.fsmo, f)) }, t(FSMO_KEY[f])); }),
        d.gc ? h('span', { class: 'dp-gc' + ch(was && !was.gc) }, t('gc')) : null)
        : h('span', { class: 'dp-muted dp-sm' }, t('noRoles')));
    return h('div', { class: 'dp-panels' }, h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.35rem' } }, db, roles),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.35rem' } }, dns, sys));
  }
  function queryCard(s) {
    var q = s.query;
    var ans = q.answer === 'found'
      ? h('div', null, t('queryFound'), ' ', data('0 100 389 ' + q.target.toLowerCase() + '.' + L.DOMAIN + '.', 'dp-mono'), ' → ', data(L.IP[q.target], 'dp-mono'))
      : h('div', null, h('b', null, '✕ '), t(q.answer === 'nxdomain' ? 'queryNx' : 'queryNone'));
    var stop = s.result === 'stopped'
      ? h('div', { class: 'dp-stop sd-changed' }, h('b', null, '✕ ', t('stopped')), h('div', null, t('stopMsg'))) : null;
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0.4rem' } },
      h('div', { class: 'dp-query' + (q.answer === 'found' ? '' : ' dp-bad') + ch(!stop) },
        h('b', null, t('queryTitle')),
        h('div', null, t.parts('queryAsk', { from: data(q.from), server: data(q.server, 'dp-mono') })),
        h('div', null, dnsName(q.name), ' ', data('SRV', 'dp-mono')),
        ans),
      stop);
  }

  // ── the replication column ──
  function arrow(from, label, once, fresh) {
    var ltr = from === 'DC01';
    return h('div', { class: 'dp-arrow' + (once ? ' dp-once' : '') + ch(fresh) },
      h('span', null, label),
      h('div', { class: 'dp-line', 'aria-hidden': 'true' }, ltr ? null : h('b', null, '◀'), h('i'), ltr ? h('b', null, '▶') : null),
      h('span', { class: 'dp-muted', translate: 'no' }, ltr ? 'DC01 → DC02' : 'DC02 → DC01'));
  }
  function replColumn(c) {
    var s = c.state;
    var items = s.flows.map(function (f) { return arrow(f.from, t(f.kind === 'initial' ? 'flowInitial' : 'flowSysvol'), true, true); });
    var fresh = c.prev && !c.prev.connections.length;
    s.connections.forEach(function (x) { items.push(arrow(x.from, t('connection'), false, fresh)); });
    return h('div', { class: 'dp-repl', role: 'group', 'aria-label': t('replTitle') }, h('h3', null, t('replTitle')),
      items.length ? items : h('span', { class: 'dp-muted dp-sm' }, t('noRepl')));
  }

  // ── the zones ──
  function zoneSource(s) {
    for (var i = 0; i < DCS.length; i++) if (s.servers[DCS[i]].dnsServer) return s.servers[DCS[i]];
    return null;
  }
  function target(r, failed, fresh) {
    var label = r.type === 'SRV' ? [h('b', null, r.dc.toLowerCase()), ':' + r.port] : r.type === 'A' ? [r.data] : [h('b', null, r.dc.toLowerCase()), '.' + L.DOMAIN + '.'];
    return h('span', { class: 'dp-target' + ch(fresh), translate: 'no', style: { '--sw': DC_C[r.dc] } }, failed ? '✕ ' : null, label);
  }
  function recRows(recs, before, failed, failedNow) {
    return h('div', { class: 'dp-recs' }, L.groups(recs).map(function (g) {
      var isNew = function (r) { return !failed && !!before && !before[key(r)]; };
      var fresh = failed ? failedNow : g.recs.every(isNew);
      return h('div', { class: 'dp-rec' + (failed ? ' dp-failed' : ''), dataset: { type: g.type } },
        h('span', { class: 'dp-rname' + ch(fresh), translate: 'no', title: g.name }, recName(g)),
        h('span', { class: 'dp-rtype', translate: 'no' }, g.type),
        h('span', { class: 'dp-targets' }, g.recs.map(function (r) { return target(r, failed, isNew(r)); })));
    }));
  }
  function zonesArea(c) {
    var s = c.state;
    var src = zoneSource(s);
    var before = null;
    if (c.prev) {
      before = {};
      var ps = zoneSource(c.prev);
      if (ps) Object.keys(ps.zones).forEach(function (z) { ps.zones[z].forEach(function (r) { before[key(r)] = true; }); });
    }
    var failed = [], failedBy = null;
    DCS.forEach(function (d) { if (s.servers[d].failed.length) failedBy = d; failed = failed.concat(s.servers[d].failed); });
    var failedNow = !!c.prev && !!failedBy && !c.prev.servers[failedBy].failed.length;
    if (!src && !failed.length) return h('div', { class: 'dp-zones dp-one' }, h('p', { class: 'dp-none' }, t('zoneNone')));
    return h('div', { class: 'dp-zones' }, L.ZONES.map(function (z) {
      var held = src && src.zones[z];
      var recs = held ? src.zones[z] : failed.filter(function (r) { return r.zone === z; });
      var heading = h('h3', null, h('span', { class: 'dp-folder' + (held ? '' : ' dp-missing'), 'aria-hidden': 'true', style: { fontSize: '1rem' } }),
        dnsName(z), held ? h('span', null, t('zoneIn'), ' ', data(PART_DATA[L.ZONE_STORE[z]]), ' · ', t.n('nRecords', recs.length)) : null);
      var body = held && !recs.length ? h('p', { class: 'dp-note dp-muted' }, t('zoneEmpty'))
        : recRows(recs, held ? before : null, !held, failedNow);
      var note = !held && z === L.DOMAIN && failed.length
        ? h('p', { class: 'dp-note' + ch(failedNow) }, h('b', null, t('failedTitle')), ' ', t.parts('failedWhy', { dns: data(s.servers[failedBy].dnsClient, 'dp-mono'), zone: dnsName(L.DOMAIN) })) : null;
      return h('section', { class: 'dp-ztab' + (held ? '' : ' dp-missing') }, heading, note, body);
    }));
  }

  // ── captions ──
  function captionFor(c) {
    var s = c.state, p = c.params;
    var dc = p.server === 'dc02' ? 'DC02' : 'DC01';
    var dcEl = data(dc);
    var dom = data(L.DOMAIN, 'dp-mono');
    if (c.first) {
      if (p.server === 'dc02') return rich('capStart2', { domain: dom, dns: data(s.servers.DC02.dnsClient, 'dp-mono') });
      return rich('capStart1');
    }
    var phase = s.log[s.log.length - 1];
    var d = s.servers[dc];
    switch (phase) {
      case 'role': return rich('capRole', { n: c.n, dc: dcEl });
      case 'forest': return rich('capForest', { dc: dcEl, domain: dom, netbios: data(L.NETBIOS) });
      case 'database': return rich('capDatabase', { dc: dcEl, ntds: data('NTDS.dit', 'dp-mono'), domain: dom });
      case 'dns': return rich('capDns', { domain: dom, msdcs: data(L.MSDCS, 'dp-mono'), ddz: data('DomainDnsZones'), fdz: data('ForestDnsZones'), lo: data(L.LOOPBACK, 'dp-mono') });
      case 'sysvol':
        if (dc === 'DC02') return rich('capSysvol2', { dc: dcEl });
        return rich('capSysvol1', { dc: dcEl, path: data('C:\\Windows\\SYSVOL', 'dp-mono'), sysvol: data('SYSVOL'), netlogon: data('NETLOGON') });
      case 'reboot':
        if (dc === 'DC02') return rich(d.gc ? 'capReboot2Gc' : 'capReboot2NoGc', { dc: dcEl });
        return rich('capReboot1', { dc: dcEl });
      case 'register': {
        var mine = L.dcRecords(dc, { gc: d.gc, pdc: has(d.fsmo, 'pdc') }).length;
        if (s.result === 'unregistered') return rich('capRegisterFail', { n: t.n('nRec', mine), dns: data(d.dnsClient, 'dp-mono'), domain: dom });
        if (dc === 'DC02') return rich('capRegister2', { dc: dcEl, n: t.n('nRec', mine), total: t.n('nRec', L.recordCount(s.servers.DC01)), locator: dnsName(L.LOCATOR) });
        return rich('capRegister', { dc: dcEl, n: t.n('nRec', mine), locator: dnsName(L.LOCATOR) });
      }
      case 'locate': {
        var q = s.query;
        var v = { dc: dcEl, server: data(q.server, 'dp-mono'), locator: dnsName(L.LOCATOR), domain: dom };
        if (q.answer === 'found') return rich('capLocateFound', Object.assign(v, { target: data(q.target.toLowerCase() + '.' + L.DOMAIN, 'dp-mono') }));
        return rich(q.answer === 'nxdomain' ? 'capLocateNx' : 'capLocateNone', v);
      }
      case 'stop': return rich(s.query.answer === 'nxdomain' ? 'capStopNx' : 'capStopNone', { domain: dom });
      case 'replicate': return rich('capReplicate', { dc: dcEl, n: t.n('nPart', d.partitions.length) });
    }
    return '';
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'server', type: 'choice', label: t('paramServer'), resets: true, options: [['dc01', t('serverDc01')], ['dc02', t('serverDc02')]] },
      { key: 'dns', type: 'toggle', label: t('paramDns'), hint: t('paramDnsHint'), resets: true },
      { key: 'dc2Dns', type: 'choice', label: t('paramDc2Dns'), resets: true, options: [['dc01', t('dc2DnsDc01')], ['public', t('dc2DnsPublic')]],
        visible: function (p) { return p.server === 'dc02'; } },
      { key: 'gc2', type: 'toggle', label: t('paramGc2'), visible: function (p) { return p.server === 'dc02'; } }
    ],

    presets: [
      { id: 'first-dc', label: t('presetFirst'), hint: t('presetFirstHint'), params: { server: 'dc01', dns: true } },
      { id: 'second-dc', label: t('presetSecond'), hint: t('presetSecondHint'), params: { server: 'dc02', dns: true, dc2Dns: 'dc01', gc2: true } },
      { id: 'wrong-dns', label: t('presetWrongDns'), hint: t('presetWrongDnsHint'), params: { server: 'dc02', dns: true, dc2Dns: 'public' } },
      { id: 'no-dns-role', label: t('presetNoDns'), hint: t('presetNoDnsHint'), params: { server: 'dc01', dns: false } }
    ],

    legend: [
      { shape: 'dp-part', label: t('legPartition') },
      { shape: 'dp-zone', label: t('legZone') },
      { shape: 'dp-rec', label: t('legRecord') },
      { shape: 'dp-share', label: t('legShare') },
      { shape: 'dp-fsmo', label: t('legFsmo') },
      { shape: 'dp-repl', label: t('legRepl') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'dp' },
        serverBox(c, 'DC01'), replColumn(c), serverBox(c, 'DC02'), zonesArea(c)));
    },

    caption: captionFor
  });
})();
</script>
</body>
</html>
