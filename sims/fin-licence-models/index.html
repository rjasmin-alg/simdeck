<!-- fin-licence-models: the same software as a perpetual licence or a subscription. On top, the scoreboard: per option
     the cash paid by the end of the horizon (the lesser ticked), what was expensed, what is still on the balance sheet,
     and the crossing year. Then the stage's choices (metric, hardware refresh, a maintenance lapse), the licences each
     metric counts year by year, and two charts: the cash paid so far (the crossing year marked) and each year's
     expense (amortisation, maintenance, back-fees; the subscription). Ledger: ledger.js (copied from fin-capex-opex);
     licensing: licensing.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var Lg = window.SimdeckModels.ledger;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { perp: '1', sub: '2' };
  var NAME = { perp: 'optPerp', sub: 'optSub' };
  var sim = null;
  var refocus = null;   // the stage button to give focus back to after a render

  // ── numbers in the page's language ──

  function dec(x, d) {
    var s = x.toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? '\u00a0' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 12); minus is U+2212. */
  function money(x) {
    var r = Lg.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  /** A percentage with as many decimals as it needs (0 or 1). */
  function pct(v) { return t('pct', { n: dec(v, v % 1 ? 1 : 0) }); }
  function glyph(o) { return h('span', { class: 'lm-g', dataset: { o: o, c: COLOUR[o] } }); }

  // ── the scoreboard ──

  function board(s, chg) {
    var th = function (k, title, sub, extra) {
      return h('div', Object.assign({ class: 'lm-th', dataset: { k: k } }, extra || {}), title, sub ? h('span', null, sub) : null);
    };
    var cells = [
      th('opt', t('thOption'), null, { class: 'lm-th lm-top' }),
      th('paid', t('thPaid'), t('thPaidSub', { h: s.H }), { class: 'lm-th lm-top' }),
      th('exp', t('thExp'), t('thExpSub'), { class: 'lm-th lm-top', dataset: { k: 'exp', col: 'exp' } }),
      th('book', t('thBook'), t('thBookSub'), { class: 'lm-th lm-top', dataset: { k: 'book', col: 'book' } }),
      th('cross', t('thCross'), null, { class: 'lm-th lm-top', dataset: { k: 'cross' } })
    ];
    var picked = chg.indexOf('pick') >= 0;
    ['perp', 'sub'].forEach(function (o, i) {
      var at = s[o].at;
      var win = s.pick.indexOf(o) >= 0;
      var sub = o === 'perp'
        ? t('subPerp', { price: money(s.price), mf: money(s.maintFee) })
        : t('subSub', { fee: money(s.fee) });
      cells.push(h('div', { class: 'lm-name' }, glyph(o), h('div', null, h('b', null, t(NAME[o])), h('span', null, sub))));
      cells.push(h('div', { class: 'lm-val' + (win ? ' lm-win' : '') + (win && picked ? ' sd-changed' : ''), translate: 'no' }, money(at.cash)));
      cells.push(h('div', { class: 'lm-val', translate: 'no', dataset: { soft: 'true', col: 'exp' } }, money(at.expense)));
      cells.push(h('div', { class: 'lm-val', translate: 'no', dataset: { soft: 'true', col: 'book' } }, money(at.book)));
      if (i === 0) {
        var changed = chg.indexOf('cross') >= 0 ? ' sd-changed' : '';
        cells.push(s.cross
          ? h('div', { class: 'lm-cross' + changed }, h('b', null, t('crossYear', { n: s.cross })), h('span', null, t('crossWhat')))
          : h('div', { class: 'lm-cross' + changed, dataset: { none: 'true' } }, h('b', null, t('crossNone', { h: s.H }))));
      }
    });
    return h('div', { class: 'lm-board' }, cells);
  }

  // ── the licences counted each year ──

  function counts(s) {
    var head = [h('div', { class: 'lm-chead' }, '')];
    var users = [h('div', { class: 'lm-rlabel', dataset: s.p.metric === 'user' ? { counted: 'true' } : {} }, h('b', null, t('rowUsers')))];
    var cores = [h('div', { class: 'lm-rlabel', dataset: s.p.metric === 'core' ? { counted: 'true' } : {} },
      h('b', null, t('rowCores')), h('span', null, t('rowCoresSub')))];
    s.years.forEach(function (y, i) {
      var prev = i > 0 ? s.years[i - 1] : null;
      head.push(h('div', { class: 'lm-chead', dataset: s.refreshIn === y.y ? { refresh: 'true' } : {} },
        s.refreshIn === y.y
          ? [h('span', { class: 'lm-rw' }, t('refreshMark')), h('span', { class: 'lm-ry' }, t('yearN', { n: y.y }))]
          : t('yearN', { n: y.y })));
      var cu = s.p.metric === 'user' ? { counted: 'true' } : {};
      var cc = s.p.metric === 'core' ? { counted: 'true' } : {};
      if (prev && y.perServer > prev.perServer) cc.jump = 'true';
      users.push(h('div', { class: 'lm-cnt', translate: 'no', dataset: cu }, group(y.users)));
      cores.push(h('div', { class: 'lm-cnt', translate: 'no', dataset: cc, title: y.servers + ' × ' + y.perServer }, group(y.cores)));
    });
    return h('div', { class: 'lm-counts', style: { '--h': String(s.H) }, role: 'table', 'aria-label': t('cntTitle') }, head, users, cores);
  }

  // ── scales ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step that keeps the axis to about four grid lines. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }
  function domainOf(max) {
    var step = niceStep(Math.max(max, 1000) / 4);
    return { top: Math.max(step, Math.ceil(max / step) * step), step: step };
  }
  function yOf(dom) { return function (v) { return (100 * (dom.top - v) / dom.top) + '%'; }; }
  function axis(dom, y) {
    var ticks = [], lines = [];
    for (var v = 0; v <= dom.top + 1e-6; v += dom.step) {
      ticks.push(h('span', { class: 'lm-tick', translate: 'no', style: { top: y(v) } }, money(v)));
      if (v > 0) lines.push(h('div', { class: 'lm-gl', style: { top: y(v) } }));
    }
    return { ticks: h('div', { class: 'lm-axis' }, ticks), lines: lines };
  }

  /** The year columns behind a chart: the crossing year outlined (with its label on the cash chart), lapsed years
      hatched. */
  function columns(s, label) {
    return h('div', { class: 'lm-cols' }, s.years.map(function (y) {
      var d = {};
      if (y.y === s.cross) d.cross = 'true';
      if (y.lapsed) d.lapsed = 'true';
      if (y.y > s.H / 2) d.late = 'true';
      return h('div', { class: 'lm-col', dataset: d },
        label && y.y === s.cross ? h('span', { class: 'lm-crosslabel' }, t('crossLabel', { n: y.y })) : null);
    }));
  }
  function xlabels(s) {
    return h('div', { class: 'lm-xaxis' }, h('div', { class: 'lm-xlabels' }, s.years.map(function (y) {
      return h('span', { dataset: y.y === s.cross ? { cross: 'true' } : {} }, t('yearN', { n: y.y }));
    })));
  }

  // ── cash paid so far: a step at the start of each year ──

  function cashChart(s) {
    var H = s.H;
    var dom = domainOf(Math.max(s.perp.at.cash, s.sub.at.cash));
    var y = yOf(dom);
    var ax = axis(dom, y);
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    var yNum = function (v) { return (1000 * (dom.top - v) / dom.top).toFixed(1); };
    var xNum = function (k) { return (1000 * k / H).toFixed(1); };
    var marks = [];
    ['perp', 'sub'].forEach(function (o) {
      var cum = s[o].cum, pts = [xNum(0) + ',' + yNum(0)];
      for (var k = 1; k <= H; k++) pts.push(xNum(k - 1) + ',' + yNum(cum[k]), xNum(k) + ',' + yNum(cum[k]));
      var pl = document.createElementNS(NS, 'polyline');
      pl.setAttribute('class', 'lm-line');
      pl.setAttribute('data-o', o);
      pl.setAttribute('data-c', COLOUR[o]);
      pl.setAttribute('points', pts.join(' '));
      svg.appendChild(pl);
      marks.push(h('span', { class: 'lm-endmark', style: { left: '100%', top: y(cum[H]) } }, glyph(o)));
    });
    return h('div', { class: 'lm-panel' },
      h('p', { class: 'lm-title' }, t('cashTitle')),
      h('div', { class: 'lm-plotgrid' }, ax.ticks,
        h('div', { class: 'lm-plot' }, columns(s, true), ax.lines, svg, marks),
        xlabels(s)));
  }

  // ── expense in each year ──

  var KINDS = [['amort', 'kAmort'], ['maint', 'kMaint'], ['back', 'kBack']];

  function stack(o, parts, total, top, title) {
    if (total <= 0.5) return h('div', { class: 'lm-barcol', title: title });
    var segs = parts.filter(function (x) { return x[1] > 0.5; }).map(function (x) {
      return h('div', { class: 'lm-seg', dataset: { k: x[0] }, style: { height: (100 * x[1] / total) + '%' } });
    });
    return h('div', { class: 'lm-barcol', title: title },
      h('div', { class: 'lm-stack', dataset: { c: COLOUR[o] }, style: { height: (100 * total / top) + '%' } }, segs, glyph(o)));
  }

  function expenseChart(s) {
    var max = 0;
    s.years.forEach(function (y) { max = Math.max(max, y.perp.total, y.sub.total); });
    var dom = domainOf(max);
    var y = yOf(dom);
    var ax = axis(dom, y);
    var years = s.years.map(function (yr) {
      var lab = function (o, v) { return t(NAME[o]) + ', ' + t('yearN', { n: yr.y }) + ': ' + money(v); };
      return h('div', { class: 'lm-year' },
        stack('perp', KINDS.map(function (k) { return [k[0], yr.perp[k[0]]]; }), yr.perp.total, dom.top, lab('perp', yr.perp.total)),
        stack('sub', [['fee', yr.sub.fee]], yr.sub.total, dom.top, lab('sub', yr.sub.total)));
    });
    var key = KINDS.map(function (k) { return h('span', { class: 'lm-key' }, h('i', { dataset: { k: k[0] } }), t(k[1])); });
    if (s.lapse) key.push(h('span', { class: 'lm-key' }, h('i', { dataset: { k: 'lapsed' } }), t('kLapsed')));
    return h('div', { class: 'lm-panel' },
      h('p', { class: 'lm-title' }, h('span', null, t('expTitle')), key),
      h('div', { class: 'lm-plotgrid' }, ax.ticks,
        h('div', { class: 'lm-plot' }, columns(s, false), ax.lines, h('div', { class: 'lm-years' }, years)),
        xlabels(s)));
  }

  // ── render; the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  // ── the stage's own controls: metric, hardware refresh, a maintenance lapse ──

  function buttons(label, key, options, current) {
    return h('div', { class: 'lm-tool', role: 'group', 'aria-label': label },
      h('span', { class: 'lm-tool-l' }, label),
      h('div', { class: 'sd-seg' }, options.map(function (o) {
        return h('button', {
          type: 'button', 'aria-pressed': String(o[0] === current), dataset: { key: key + ':' + o[0] },
          onclick: function () {
            var patch = {};
            patch[key] = o[0];
            refocus = key + ':' + o[0];
            sim.set(patch);
          }
        }, o[1]);
      })));
  }

  function tools(s) {
    var p = s.p, H = s.H;
    var refresh = [[0, t('refreshNone')]], lapse = [[0, t('lapseNone')]], gap = [];
    for (var y = 3; y <= Math.min(5, H); y++) refresh.push([y, t('yearOrd', { n: y })]);
    if (s.refreshIn > 0 && !refresh.some(function (o) { return o[0] === s.refreshIn; })) refresh.push([s.refreshIn, t('yearOrd', { n: s.refreshIn })]);
    for (y = 2; y <= Math.min(5, H - 1); y++) lapse.push([y, t('yearOrd', { n: y })]);
    if (p.lapse > 0 && !lapse.some(function (o) { return o[0] === p.lapse; })) lapse.push([p.lapse, t('yearOrd', { n: p.lapse })]);
    for (var g = 1; g <= Math.min(3, H - Math.max(p.lapse, 1)); g++) gap.push([g, t.n('gapN', g)]);
    return h('div', { class: 'lm-tools' },
      buttons(t('metric'), 'metric', [['user', t('metricUser')], ['core', t('metricCore')]], p.metric),
      buttons(t('refresh'), 'refresh', refresh, s.refreshIn),
      buttons(t('lapse'), 'lapse', lapse, p.lapse),
      p.lapse > 0 ? buttons(t('gap'), 'gap', gap, p.gap) : null);
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'lm' }, board(s, chg), tools(s), counts(s),
      h('div', { class: 'lm-charts' }, cashChart(s), expenseChart(s)),
      h('p', { class: 'lm-foot' }, t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-key="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, p = s.p;
    var k = L.captionKey(s);
    var b = function (x) { return h('b', { translate: 'no' }, String(x)); };
    var out = k.key === 'capCross'
      ? t.parts('capCross', { y: b(s.cross), h: b(s.H), s: b(money(s.sub.at.cash)), p: b(money(s.perp.at.cash)) })
      : t.parts('capNever', { h: b(s.H), s: b(money(s.sub.at.cash)), p: b(money(s.perp.at.cash)) });
    var sp = s.span;
    k.notes.forEach(function (key) {
      var vars;
      if (key === 'nLapse') {
        var lp = s.lapse;
        var years = lp.from === lp.to ? t('yrsOne', { a: lp.from }) : t('yrsMany', { a: lp.from, b: lp.to });
        vars = { years: years, skip: b(money(lp.skipped)), r: b(lp.back), q: b(lp.back), paid: b(money(lp.paid)), fee: b(pct(100 * L.C.fee)), extra: b(money(lp.extra)) };
      } else if (key === 'nExpense') {
        vars = { cash: b(money(s.perp.first.cash)), exp: b(money(s.perp.first.expense)), life: b(L.C.life) };
      } else {
        vars = { u1: b(group(sp.u1)), uH: b(group(sp.uH)), c1: b(group(sp.c1)), cH: b(group(sp.cH)), r: b(s.refreshIn) };
      }
      out.push(' ');
      out = out.concat(t.parts(key, vars));
    });
    return out;
  }

  var labels = {
    'crossing': 'pCrossing', 'flat': 'pFlat', 'lapse': 'pLapse',
    'per-core': 'pPerCore', 'core-no-refresh': 'pCoreNoRefresh', 'short': 'pShort'
  };
  var R = L.LIM;
  var never = function () { return false; };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'growth', type: 'range', label: t('growth'), min: R.growth.min, max: R.growth.max, step: R.growth.step, format: pct },
      { key: 'maint', type: 'range', label: t('maint'), min: R.maint.min, max: R.maint.max, step: R.maint.step, format: pct },
      { key: 'rise', type: 'range', label: t('rise'), min: R.rise.min, max: R.rise.max, step: R.rise.step, format: pct },
      { key: 'horizon', type: 'range', label: t('horizon'), min: R.horizon.min, max: R.horizon.max, step: R.horizon.step, format: function (v) { return t.n('horizonN', v); } },
      // set on the stage (the button groups) or fixed (the subscription price); hidden here, kept in the URL and clamped
      { key: 'sub', type: 'range', label: t('sub'), min: R.sub.min, max: R.sub.max, step: R.sub.step, visible: never },
      { key: 'metric', type: 'choice', label: t('metric'), options: [['user', t('metricUser')], ['core', t('metricCore')]], visible: never },
      { key: 'refresh', type: 'range', label: t('refresh'), min: R.refresh.min, max: R.refresh.max, step: 1, visible: never },
      { key: 'lapse', type: 'range', label: t('lapse'), min: R.lapse.min, max: R.lapse.max, step: 1, visible: never },
      { key: 'gap', type: 'range', label: t('gap'), min: R.gap.min, max: R.gap.max, step: 1, visible: never }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'lm-perp', c: 1, label: t('legPerp') },
      { shape: 'lm-sub', c: 2, label: t('legSub') },
      { shape: 'lm-best', label: t('legBest') },
      { shape: 'lm-cross', label: t('legCross') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
