<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (PIDs, signal names, commands, what bash prints) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }

  /** Caption parts: t.parts (vars may be nodes; [[terms]] in the kit's style), then *English term* in <em lang="en">
      for terms the glossary lacks. */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars || {}).forEach(function (p) {
      var text = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (text === null) { out.push(p); return; }
      text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }

  function prompt(user) { return '[' + user + '@' + L.HOST + ' ~]' + (user === 'root' ? '# ' : '$ '); }
  function sigName(sig) { return 'SIG' + sig; }

  // ── stage: the signals of this step ──

  var ACT = { terminated: 'actTerminated', ignored: 'actIgnored', handler: 'actHandler', handlerAgain: 'actHandlerAgain',
    resend: 'actResend', shellCatch: 'actShellCatch', refused: 'actRefused', nosuch: 'actNosuch', nojob: 'actNojob' };
  var DISP = { default: 'dispDefault', ignore: 'dispIgnore', catch: 'dispCatch' };
  var DICON = { default: '·', ignore: '⊘', catch: '↪' };

  function fromLabel(d, s) {
    if (d.from === 'terminal') return t('fromTerminal');
    if (d.from === 'shell') {
      var tgt = L.find(s, d.target);
      return t('fromShell', { pid: tgt ? tgt.ppid === 1 ? s.shell : tgt.ppid : s.shell });
    }
    return d.from;
  }

  /** A phase chip: "(a) permission: yes". The letter is a mark, not a word. */
  function phase(label, value, cls) {
    var m = /^(\([a-d]\) )(.*)$/.exec(label);
    return h('span', { class: 'sg-ph' + (cls ? ' ' + cls : '') }, h('i', null, data(m[1]), m[2]), h('b', null, value));
  }

  function delivery(d, s) {
    var p = L.find(s, d.target);
    var reached = d.act !== 'nosuch' && d.act !== 'nojob';
    var ph = [
      reached ? phase('(a) ' + t('phA'), d.perm ? '✓ ' + t('permOk') : '✕ ' + t('permNo'), d.perm ? null : 'sg-ph-no')
        : phase('(a) ' + t('phA'), '—', 'sg-ph-skip'),
      d.disp ? phase('(b) ' + t('phB'), DICON[d.disp] + ' ' + t(DISP[d.disp])) : phase('(b) ' + t('phB'), '—', 'sg-ph-skip'),
      phase('(c) ' + t('phC'), t(ACT[d.act]), d.act === 'refused' || !reached ? 'sg-ph-no' : null)
    ];
    var res;
    if (!reached || d.act === 'refused' || d.act === 'ignored' || d.act === 'handlerAgain' || d.act === 'shellCatch') res = t('resNothing');
    else if (p && !p.alive && p.sig === d.sig) res = t('resGone', { n: p.exit });
    else res = t('resAlive');
    ph.push(phase('(d) ' + t('phD'), res, 'sg-ph-end'));
    return h('div', { class: 'sg-del' + (d.act === 'refused' ? ' sg-del-no' : '') },
      h('span', { class: 'sg-env' }, h('span', { class: 'sg-env-icon', 'aria-hidden': 'true' }, d.act === 'refused' ? '✕' : '✉'),
        data(sigName(d.sig) + ' ' + d.num, 'sg-env-sig')),
      h('span', { class: 'sg-route' }, h('b', null, fromLabel(d, s)), h('span', { 'aria-hidden': 'true' }, ' → '),

      h('span', { class: 'sg-phases' }, ph));
  }

  function signals(s) {
    if (!s.deliveries.length) return h('div', { class: 'sg-sigs' }, h('p', { class: 'sg-none' }, t('sigNone')));
    return h('div', { class: 'sg-sigs' }, s.deliveries.map(function (d) { return delivery(d, s); }));
  }

  // ── stage: the terminal ──

  var MAX_LINES = 17;

  function terminal(s) {
    var now = {};
    s.out.forEach(function (i) { now[i] = true; });
    var first = Math.max(0, s.term.length - MAX_LINES);
    var lines = s.term.slice(first).map(function (l, k) {
      var i = first + k, cls = 'sg-ln' + (now[i] ? ' sg-ln-now' : '');
      if (l.kind === 'sep') return h('div', { class: cls + ' sg-sep' }, '— ' + t(l.text === 'closed' ? 'termClosed' : 'newTerm') + ' —');
      if (l.kind === 'cmd') return h('div', { class: cls + ' sg-ln-cmd', translate: 'no' }, h('span', { class: 'sg-prompt' }, prompt(l.user)), l.text);
      return h('div', { class: cls + (l.kind === 'err' ? ' sg-ln-err' : ''), translate: 'no' }, l.text || ' ');
    });
    var closed = s.terminal === 'closed' && !s.newTerm;
    return h('div', { class: 'sg-term' + (closed ? ' sg-term-closed' : '') },
      h('div', { class: 'sg-term-bar' }, t('termTitle'), data('student@' + L.HOST)),
      h('div', { class: 'sg-lines' }, lines));
  }

  // ── stage: the process cards ──

  function looked(s, pid) {
    var out = {};
    s.deliveries.forEach(function (d) { if (d.target === pid && d.disp) out[d.sig] = true; });
    return out;
  }

  function card(s, p) {
    var changed = s.changed.indexOf(p.pid) >= 0, look = looked(s, p.pid);
    var head = [data(p.cmd, 'sg-cmd')];
    if (p.cmd === 'bash') head.push(h('span', { class: 'sg-tag' }, t('shellTag')));
    if (p.job) head.push(data('%' + p.job, 'sg-tag'));
    if (p.nohup) head.push(data('nohup', 'sg-tag'));
    var meta = data('PID ' + p.pid + ' · PPID ' + p.ppid + ' · ' + p.user + (p.alive ? ' · ' + p.stat : ''), 'sg-meta');
    var cells = L.SIGS.map(function (sig) {
      var d = p.disp[sig];
      return h('span', { class: 'sg-dcell' + (look[sig] ? ' sg-looked' : ''), dataset: { d: d } },

        h('span', null, h('span', { class: 'sg-dico', 'aria-hidden': 'true' }, DICON[d] + ' '), h('i', null, t(DISP[d]))));
    });

        p.inHandler ? t(p.handler === 'hang' && s.ev.some(function (e) { return e.kind === 'hanging'; }) ? 'stateHanging' : 'stateHandler') : t('stateRun')));
    } else {
      st.push(h('b', null, '— ', p.sig ? t.parts('stateSig', { sig: data(sigName(p.sig)) }) : t.parts('stateExit', { code: data(p.exit) })));
      st.push(h('span', null, t('status', { n: p.exit })));
      st.push(h('span', { class: 'sg-muted' }, p.reporter ? t('reportBy', { pid: p.reporter }) : t('reportNone')));
    }
    return h('div', { class: 'sg-card' + (p.alive ? '' : ' sg-ended') + (changed ? ' sd-changed' : '') },
      h('div', { class: 'sg-head' }, head), meta, h('div', { class: 'sg-disp' }, cells), h('div', { class: 'sg-state' }, st));
  }

  function fileRow(s, key, name, state, opts) {
    return h('div', { class: 'sg-file' + (s.changed.indexOf(key) >= 0 ? ' sd-changed' : '') + (opts.gone ? ' sg-file-gone' : '') +
      (opts.left ? ' sg-file-left' : '') },
      data(name, 'sg-fname'), h('span', null, state), opts.left ? h('span', { class: 'sg-warn' }, '⚠ ' + t('legLeft')) : null);
  }

  function files(s) {
    var f = s.files, rows = [];
    var prog = s.procs.filter(function (p) { return p.prog; })[0];
    var dead = prog && !prog.alive;
    if (f.lock !== null) {
      rows.push(fileRow(s, 'lock', 'zapis.lock', t(f.lock ? (dead ? 'lockLeft' : 'lockHeld') : 'lockGone'), { gone: !f.lock, left: f.lock && dead }));
      rows.push(fileRow(s, 'data', 'zapis.dat', t(f.data === 'open' ? 'dataOpen' : f.data === 'closed' ? 'dataClosed' : 'dataHalf'), { left: f.data === 'half' }));
    }
    if (f.nohupOut) rows.push(fileRow(s, 'nohupOut', 'nohup.out', t('nohupHas'), {}));
    if (!rows.length) return null;
    return h('div', { class: 'sg-files' }, h('h3', null, t('filesTitle')), rows);
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'sg' },
      signals(s),
      h('div', { class: 'sg-body' },
        h('div', { class: 'sg-left' }, terminal(s), files(s)),
        h('div', { class: 'sg-procs' }, h('h3', null, t('procsTitle')), s.procs.map(function (p) { return card(s, p); })))));
  }

  // ── captions ──

  var START = { 'book-primjer1': 'capStartBook', 'handler-cleans': 'capStartCleans', stubborn: 'capStartStubborn',
    'nohup-and-hangup': 'capStartNohup', 'not-yours': 'capStartNotYours' };

  function caption(c) {
    var s = c.state, ev = s.ev, o = L.norm(c.params);
    var find = function (kind) { for (var i = 0; i < ev.length; i++) if (ev[i].kind === kind) return ev[i]; return null; };
    if (c.n === 0) return rich(START[o.script]);
    var e;
    if ((e = find('close'))) {
      var survived = s.procs.some(function (p) { return p.alive && p.ppid === 1; });
      return rich(survived ? 'capClose' : 'capCloseNoNohup');
    }
    if ((e = find('kill'))) {
      var p = L.find(s, e.target);
      if (e.act === 'refused') return rich('capRefused');
      if (e.act === 'nosuch' || e.act === 'nojob') return rich('capNoSuch', { pid: data(e.target) });
      if (e.act === 'handler' || e.act === 'handlerAgain') return rich('capHandler', { cmd: code(p.cmd) });
      if (e.act === 'terminated') {
        if (e.sig === 'KILL') return p.prog ? rich('capKillLeft', { n: data(p.exit) }) : rich('capKillPlain', { pid: data(p.pid) });
        if (e.from === 'root' && p.user !== 'root' && p.user !== 'student') return rich('capTermRoot', { n: data(p.exit) });
        return rich('capTerm', { cmd: code(p.cmd) });
      }
      return rich('capOther');
    }
    if ((e = find('cleaned'))) return rich('capCleaned');
    if ((e = find('hanging'))) return rich('capHanging', { pid: data(e.pid) });
    if ((e = find('start'))) {
      if (e.nohup) return rich('capJobNohup');
      var j = L.find(s, e.pid);
      return rich(find('ps') ? 'capJob' : 'capJobPlain', { cmd: code(j.cmd + ' &'), job: data('%' + e.job), pid: data(e.pid) });
    }
    if ((e = find('ps'))) {
      var q = L.find(s, e.pids[0]);
      if (q && !q.alive && q.sig) return rich('capGone', { n: data(q.exit), num: data(L.NUM[q.sig]) });
    }
    return rich('capOther');
  }

  // ── mount ──

  function unused(key, reason) {
    return function (p) { return L.uses(L.norm(p).script, key) ? false : t(reason); };
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      // the scenario is chosen with the presets; the select stays hidden so the panel fits
      { key: 'script', type: 'select', label: t('script'), resets: true, visible: function () { return false; }, options: [
        ['book-primjer1', t('presetBook')], ['nohup-and-hangup', t('presetNohup')], ['handler-cleans', t('presetCleans')],
        ['stubborn', t('presetStubborn')], ['not-yours', t('presetNotYours')]] },
      { key: 'handler', type: 'choice', label: t('handler'), disabled: unused('handler', 'notUsedHandler'),
        options: [['finish', t('handlerFinish')], ['hang', t('handlerHang')]] },
      { key: 'sender', type: 'choice', label: t('sender'), disabled: unused('sender', 'notUsedSender'),
        options: [['student', t('senderStudent')], ['root', t('senderRoot')]] }
    ],

    presets: [
      { id: 'book-primjer1', label: t('presetBook'), params: { script: 'book-primjer1' }, hint: t('presetBookHint') },
      { id: 'nohup-and-hangup', label: t('presetNohup'), params: { script: 'nohup-and-hangup' }, hint: t('presetNohupHint') },
      { id: 'handler-cleans', label: t('presetCleans'), params: { script: 'handler-cleans', handler: 'finish' }, hint: t('presetCleansHint') },
      { id: 'stubborn', label: t('presetStubborn'), params: { script: 'stubborn', handler: 'hang' }, hint: t('presetStubbornHint') },
      { id: 'not-yours', label: t('presetNotYours'), params: { script: 'not-yours' }, hint: t('presetNotYoursHint') }
    ],

    legend: [
      { shape: 'hl', label: t('legChanged') },
      { shape: 'sg-alive', label: t('legAlive') },
      { shape: 'sg-ended', label: t('legEnded') },
      { shape: 'sg-default', label: t('legDefault') },
      { shape: 'sg-ign', label: t('legIgnore') },
      { shape: 'sg-catch', label: t('legCatch') },
      { shape: 'sg-env', label: t('legSignal') },
      { shape: 'sg-refused', label: t('legRefused') },
      { shape: 'sg-left', label: t('legLeft') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
