          return h('th', { class: 'sb-side', dataset: { c: String(sideOf(k)) }, translate: 'no' }, k + ' · ' + s.servers[k].name);
        }))),
        h('tbody', null, SB.names.map(function (q, i) {
          return h('tr', null, h('td', { translate: 'no' }, q + ' A?'), SIDES.map(function (k) {
            var a = s.direct ? s.direct[k][i] : null;
            return h('td', { class: 'sb-side', dataset: { c: String(sideOf(k)), srv: k } }, !a ? h('span', { class: 'se-muted se-sm' }, t('sbDirectNot'))
              : [a.rcode === 'NOERROR' ? h('span', { translate: 'no' }, a.value) : h('span', { dataset: { k: 'NXDOMAIN' } }, t('sbNx')),
                h('span', { class: 'sb-flag', translate: 'no' }, 'aa')]);
          }));
        })))));
    c.stage.setAttribute('aria-label', t('sbStage'));
    c.stage.replaceChildren(h('div', { class: 'sb' }, kids));
  }

  function captionSplit(c) {
    var s = c.state, e = s.ev, out = [];
    function say(x) { if (out.length) out.push(' '); out.push.apply(out, x); }
    var P1 = b('P1'), P2 = b('P2'), apex = SB.names[0], app = SB.names[1];
    function ans(g, i) { return s.groups[g].answers ? s.groups[g].answers[i] : null; }
    if (c.first) {
      if (s.scene === 'retire') say(parts('capRtStart', { p1: P1, p2: P2, apex: b(apex), h: sbValue(ans('H', 0)), d: sbValue(ans('D', 0)) }));
      else say(parts('capSbStart', { p1: P1, p2: P2, zone: b(SB.zone) }));
      say([t('capPress')]);
    } else if (e.kind === 'ask') {
      var g = e.group, other = g === 'H' ? 'D' : 'H', srv = s.servers[e.server], mine = s.groups[g].answers;
      var before = c.prev.groups[g].answers, theirs = s.groups[other].answers;
      say(parts('capSbAsk', { g: b(g), p: b(e.server), apex: b(apex), app: b(app), v1: sbValue(mine[0]), v2: sbValue(mine[1]) }));
      var master = srv.master ? s.servers[srv.master] : null;
      if (master && JSON.stringify(master.records) !== JSON.stringify(srv.records)) say(parts('capRtNotYet', { p1: b(e.server) }));
      else if (theirs && JSON.stringify(theirs) === JSON.stringify(mine)) say([t('capRtSame')]);
      else if (theirs && !before && theirs[0].value !== mine[0].value) say(parts('capSbOther', { g: b(other), apex: b(apex), v: sbValue(theirs[0]) }));
      else if (before && JSON.stringify(before) === JSON.stringify(mine) && theirs && theirs[1].rcode !== mine[1].rcode) {
        say(parts('capSbStill', { p1: b(e.server), p2: b(s.groups[other].resolver) }));
      } else if (before && JSON.stringify(before) !== JSON.stringify(mine) && theirs && theirs[1].rcode !== mine[1].rcode) {
        say(parts('capSbOnly', { g: b(g) }));
      }
    } else if (e.kind === 'edit') {
      say(parts('capSbEdit', { app: b(SB.edit.name), v: b(SB.edit.value), p2: b(e.server), serial: b(s.servers[e.server].serial), p1: P1 }));
    } else if (e.kind === 'convert') {
      say(parts('capRtConvert', { p1: b(e.server), p2: b(e.master), s1: b(s.servers[e.server].serial), s2: b(s.servers[e.master].serial),
        at: when(LAB, s.nextRefresh) }));
    } else if (e.kind === 'refresh') {
      say(parts(e.outcome === 'transfer' ? 'capRtRefresh' : 'capCurrent', { t: upper(when(LAB, s.t)), p1: b(e.server), p2: b(s.servers[e.server].master),
        s1: b(e.serialS), s2: b(e.serialM), sp: b(e.serialM), p: b(s.servers[e.server].master), s: b(e.server) }));
    } else if (e.kind === 'direct') {
      say(s.scene === 'retire' ? parts('capRtDirect', { p1: P1, p2: P2 }) : [t('capSbDirect')]);
    }
    if (s.done && !c.first) say([t(s.scene === 'retire' ? 'capEndUpR' : 'capSbEnd')]);
    if (note) { out.unshift(note, ' '); note = null; }
    return out;
  }

  // ── buttons: an action at the moment shown, processed as the next step; later scheduled actions are dropped ──
  function act(sim, kind) {
    var s = sim.state, p = sim.params, why = null;
    if (s.split) why = 'noteSplit';
    else if (kind === 'kill' && !s.primary.up) why = 'noteKillDown';
    else if (kind === 'revive' && s.primary.up) why = 'noteReviveUp';
    else if (kind === 'edit' && !s.primary.up) why = 'noteEditDown';
    else if (s.acted.indexOf(kind) >= 0) why = 'noteOnce';
    else if (sim.n >= L.MAX_STEPS) why = 'noteLimit';
    if (why) { note = t(why); sim.render(); return; }
    // after an action at this same moment the new one comes a second later, so the steps shown so far stay as they are
    var at = s.lastActionAt === s.t ? s.t + 1 : s.t;
    var patch = {};
    ACTS.forEach(function (k) { if (s.acted.indexOf(k) < 0 && p[k + 'At'] !== L.NONE) patch[k + 'At'] = L.NONE; });
    patch[kind + 'At'] = at;
    sim.set(patch, { preset: sim.preset });
    sim.next();
  }

  var hidden = function () { return false; };
  /** The SOA params belong to the one-primary scenes; the split-brain scenes hide them (retire keeps its REFRESH). */
  var oneP = function (p) { return !L.isSplit(p.scene); };
  var atParam = function (key, label) {
    return { key: key, type: 'range', label: t(label), min: L.NONE, max: 99999999, step: 1, visible: hidden };
  };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'refresh', type: 'range', label: t('pRefresh'), min: 900, max: 86400, step: 300, format: secs, resets: true, visible: oneP },
      { key: 'retry', type: 'range', label: t('pRetry'), min: 300, max: 7200, step: 300, format: secs, resets: true, visible: oneP },
      { key: 'expire', type: 'choice', label: t('pExpire'), resets: true, options: [[604800, secs(604800)], [1209600, secs(1209600)]], visible: oneP },
      { key: 'bumpSerial', type: 'toggle', label: t('pBump'), resets: true, visible: oneP },
      { type: 'button', label: t('bEdit'), hint: t('bHint'), key: 'e', run: function (sim) { act(sim, 'edit'); } },
      { type: 'button', label: t('bKill'), hint: t('bHint'), key: 'k', run: function (sim) { act(sim, 'kill'); } },
      { type: 'button', label: t('bRevive'), hint: t('bHint'), key: 'v', run: function (sim) { act(sim, 'revive'); } },
      // the zone and the actions (set by presets and the buttons): hidden, but kept in the URL so a link, a reload or
      // L keeps a run the buttons made
      { key: 'scene', type: 'choice', label: t('pScene'), resets: true, visible: hidden, options: [['lab', 'lab.example'], ['estate', 'qm.internal'], ['split', 'corp.example'], ['retire', 'corp.example']] },
      atParam('editAt', 'pEditAt'),
      atParam('killAt', 'pKillAt'),
      atParam('reviveAt', 'pReviveAt')
    ],

    presets: [
      { id: 'book-edit', label: t('prEdit'), hint: t('prEditHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: 600, killAt: -1, reviveAt: -1 } },
      { id: 'no-serial-bump', label: t('prNoBump'), hint: t('prNoBumpHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: false, editAt: 600, killAt: -1, reviveAt: -1 } },
      { id: 'primary-dies', label: t('prDies'), hint: t('prDiesHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: -1, killAt: 0, reviveAt: -1 } },
      { id: 'estate-14-days', label: t('prEstate'), hint: t('prEstateHint'),
        params: { scene: 'estate', refresh: 10800, retry: 3600, expire: 1209600, bumpSerial: true, editAt: -1, killAt: 10680, reviveAt: -1 } },
      { id: 'revived-in-time', label: t('prRevived'), hint: t('prRevivedHint'),
        params: { scene: 'lab', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: -1, killAt: 0, reviveAt: 432000 } },
      // split brain (task dns-split-brain): two primaries, no transfer; the fix makes P1 a secondary of P2 (REFRESH 3600)
      { id: 'split-brain', label: t('prSplit'), hint: t('prSplitHint'),
        params: { scene: 'split', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: -1, killAt: -1, reviveAt: -1 } },
      { id: 'split-brain-retire', label: t('prRetire'), hint: t('prRetireHint'),
        params: { scene: 'retire', refresh: 3600, retry: 900, expire: 604800, bumpSerial: true, editAt: -1, killAt: -1, reviveAt: -1 } }
    ],

    legend: [
      { shape: 'se-refresh', label: t('lgdRefresh') },
      { shape: 'se-retry', label: t('lgdRetry') },
      { shape: 'se-expire', label: t('lgdExpire') },
      { shape: 'se-expired', label: t('lgdExpired') },
      { c: 1, label: t('lgdP1') },
      { c: 2, label: t('lgdP2') },
      { shape: 'sb-primary', label: t('lgdPrimary') },
      { shape: 'sb-secondary', label: t('lgdSecondary') },
      { shape: 'sb-zone', label: t('lgdZone') },
      { shape: 'hl', label: t('lgdChanged') }
    ],

    render: function (c) {
      // the legend and the explanation follow the scene (CSS on data-se-mode)
      if (c.state.split) { document.documentElement.dataset.seMode = 'split'; renderSplit(c); return; }
      delete document.documentElement.dataset.seMode;
      c.stage.setAttribute('aria-label', t('stage'));
      var s = c.state, sc = L.SCENES[s.scene], prev = c.first ? null : c.prev;
      c.stage.replaceChildren(h('div', { class: 'se' },
        primaryCard(c, sc, s, prev), checkLink(c, s), secondaryCard(c, sc, s, prev), queryLink(s), clientCard(c, sc, s),
        log(c, sc, s)));
    },

    caption: caption
  });
})();
</script>
