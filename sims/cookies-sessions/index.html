<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var VERSION = 'HTTP/1.1';
  var LANE_C = { D: 4, B: 1, S: 6 };
  var pressedAt = null;   // { n, acts }: the action key pressed at step n (the browser card marks "Next")

  /** Data (host names, paths, cookie names and values, times) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'cs-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text)); }
  /** t.parts, with a placeholder node used twice cloned (appending the same node twice would move it). */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (p) {
      if (typeof p === 'string' || p.nodeType === 3) return p;
      var out = seen.indexOf(p) >= 0 ? p.cloneNode(true) : p;
      seen.push(p);
      return out;
    });
  }
  function pad(x) { return (x < 10 ? '0' : '') + x; }
  /** Seconds since 10:00:00 as a clock time. */
  function clock(sec) { var m = 600 + Math.floor(sec / 60); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function actName(k) { return t('act' + k); }
  function nextKey(c) { return L.actsOf(c.params)[c.n] || null; }
  function siteLane(domain) { return domain === L.OTHER ? 'D' : 'S'; }

  var NS = 'http://www.w3.org/2000/svg';
  var ICON = {
    lock: 'M7 11V8a5 5 0 0 1 10 0v3 M5 11h14v10H5z',
    eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z M12 9.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5z M3 3l18 18'
  };
  function svgIcon(name) {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'cs-ico');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', ICON[name]);
    s.append(p);
    return s;
  }
  function flag(name, label) { return h('span', { class: 'cs-flag', role: 'img', 'aria-label': label, title: label }, svgIcon(name)); }

  // ── the chart (K1) ──

  /** The cookies of a request as chips: filled when sent, hollow when the browser held them back; a dash for none. */
  function chips(r) {
    var sent = r.cookie ? r.cookie.split('; ') : [];
    if (!sent.length && !r.held.length) return h('span', { class: 'cs-muted', translate: 'no' }, '—');
    function chip(x, st) { return h('span', { class: 'cs-chip cs-chip--sm', dataset: { st: st, site: r.to }, translate: 'no' }, x); }
    return h('span', null, sent.map(function (x) { return chip(x, 'sent'); }), r.held.map(function (x) { return chip(x, 'kept'); }));
  }

  function renderChart(c) {
    var s = c.state;
    var rows = s.log.map(function (r) {
      var changed = r.n === c.n;
      if (r.k === 'note') return { kind: 'note', lane: 'B', text: t('noteClose'), k: 'solid', time: clock(r.t), changed: changed };
      if (r.k === 'req') {
        return { from: 'B', to: r.to, c: 1, label: r.method + ' ' + r.path, time: clock(r.t), changed: changed,
          fields: chips(r),
          cause: r.cross ? h('span', null, t('cross')) : undefined };
      }
      return { from: r.from, to: 'B', c: LANE_C[r.from], label: String(r.status), place: 'mid', changed: changed,
        fields: r.setCookie.length ? 'Set-Cookie: ' + r.setCookie.map(function (x) { return x.split(';')[0]; }).join(', ') : undefined };
    });
    var lanes = [
      { id: 'D', mark: 'D', c: 4, name: t('laneOther'), tags: data(L.OTHER, 'cs-mono cs-sm'),
        body: h('div', { class: 'cs-card' }, h('p', { class: 'cs-muted' }, t('cardOther'))) },
      { id: 'B', mark: t('markBrowser'), c: 1, shape: 'square', name: t('laneBrowser'), body: browserCard(c) },
      { id: 'S', mark: 'T', c: 6, name: t('laneShop'), tags: data(L.SHOP, 'cs-mono cs-sm'), body: shopCard(c) }
    ];
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '4.2rem',
      lanes: lanes,
      rows: rows,
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  function browserCard(c) {
    var s = c.state, pg = s.page, pp = c.prev && c.prev.page;
    var who = pg ? (pg.user ? t.parts('cardUser', { user: B(pg.user) }) : t('cardAnon')) : null;
    var whoChanged = pg && (!pp || pp.user !== pg.user || pp.cart !== pg.cart);
    var vis = pg ? L.scriptVisible(s.jar, pg.site, 'https') : [];
    var k = nextKey(c);
    var queued = pressedAt && pressedAt.n === c.n && pressedAt.acts === c.params.acts;
    return h('div', { class: 'cs-card' },
      h('p', null, h('span', { class: 'cs-muted' }, t('cardPage'), ' '), pg ? [data(pg.site), h('wbr'), data(pg.path)] : t('cardBlank')),
      pg ? h('p', { class: whoChanged && c.n ? 'sd-changed' + anim(c) : null }, who,
        pg.user && pg.cart !== null ? [' · ', t.n('cardCart', pg.cart)] : null) : null,
      h('p', null, h('span', { class: 'cs-muted' }, t('cardScripts'), ' '), vis.length ? data(vis.join('; ')) : t('cardNothing')),
      h('p', { class: queued ? 'sd-changed' : null }, h('span', { class: 'cs-muted' }, t('cardNext'), ' '),
        k ? [h('kbd', null, k), ' ', actName(k)] : t(c.n >= L.MAX_STEPS ? 'cardFull' : 'cardEnd')));
  }

  function shopCard(c) {
    var s = c.state, e = s.ev, line;
    var sid = function (x) { return data(x, 'cs-mono'); };
    if (!s.lastRequest || e.kind === 'close') line = t('srvIdle');
    else if (e.why === 'created') line = parts('srvCreated', { sid: sid(e.sid), user: data(e.user, '') });
    else if (e.why === 'deleted') line = parts('srvDeleted', { sid: sid(e.deleted) });
    else if (e.stale) line = parts('srvStale', { sid: sid(e.sid) });
    else if (e.user) line = parts('srvKnown', { sid: sid(e.sid), user: data(e.user, '') });
    else line = t('srvAnon');
    var fresh = s.lastRequest && e.kind !== 'close';
    return h('div', { class: 'cs-card' },
      h('p', { class: fresh ? 'sd-changed' + anim(c) : null }, line),
      h('p', { class: 'cs-muted' }, t.n('srvRows', Object.keys(s.sessions).length)));
  }

  // ── right: this step's request to the shop ──

  function line(text) { return h('span', { class: 'cs-line', translate: 'no' }, text); }
  function none(key) { return h('span', { class: 'cs-none' }, t(key)); }

  function renderMsg(c) {
    var s = c.state, r = s.lastRequest;
    var box = h('section', { class: 'cs-box' }, h('h2', null, t('msgTitle')));
    if (!r) { box.append(h('p', { class: 'cs-muted' }, t(s.n ? 'msgNone' : 'msgStart'))); return box; }
    var res = s.log.filter(function (x) { return x.k === 'res' && x.from === 'S' && x.n === c.n; })[0];
    var kind = { navigation: 'kindNavigation', form: 'kindForm', subresource: 'kindSubresource' }[r.kind];
    box.append(
      h('p', { class: 'cs-dir' }, t('initBy'), ' ', r.initiator ? data(r.initiator) : t('initTyped'), ' · ',
        h('b', null, t(r.crossSite ? 'crossWord' : 'sameSiteWord')), ' · ', t(kind)),
      line(r.method + ' ' + r.path + ' ' + VERSION),
      line('Host: ' + r.to),
      r.header ? line([h('b', null, 'Cookie:'), ' ' + r.header]) : none('noCookieLine'),
      h('p', { class: 'cs-dir' }, '↓'),
      line(VERSION + ' ' + res.status + ' OK'),
      res.setCookie.length ? h('span', null, res.setCookie.map(function (x) { return line([h('b', null, 'Set-Cookie:'), ' ' + x]); })) : none('noSetCookie'));
    // the SameSite comparison only when the jar held the shop's sid before this request
    var hadSid = r.decisions.some(function (d) { return d.name === 'sid' && d.domain === L.SHOP; });
    if (!hadSid) return box;
    var v = s.verdicts, cur = c.params.sameSite;
    box.append(h('div', { class: 'cs-verdicts' }, h('span', { class: 'cs-sm' }, t('verdict')),
      L.SAMESITE.map(function (x) {
        return h('span', { class: 'cs-pill', dataset: { ok: v[x] ? '1' : '0', on: x === cur ? '1' : '0' } },
          data(x, ''), h('span', { 'aria-hidden': 'true', translate: 'no' }, v[x] ? '✓' : '✗'), t(v[x] ? 'verdictYes' : 'verdictNo'));
      })));
    return box;
  }

  // ── right: the cookie jar ──

  function reason(d, cookie, fresh) {
    if (fresh) return t('whyNew');
    if (!d) return t('whyNoRequest');
    if (d.sent) return t('sent');
    if (d.why === 'samesite') return parts('whySamesite', { ss: data(L.effectiveSameSite(cookie), '') });
    return t({ domain: 'whyDomain', path: 'whyPath', secure: 'whySecure', expired: 'whyExpired' }[d.why]);
  }

  function renderJar(c) {
    var s = c.state, r = s.lastRequest;
    var gone = s.gone.jar.map(function (g) {
      var o = (c.prev ? c.prev.jar : []).filter(function (x) { return x.name === g.name && x.domain === g.domain && x.path === g.path; })[0];
      return o ? { c: o, why: g.why } : null;
    }).filter(Boolean);
    var box = h('section', { class: 'cs-box cs-jar' }, h('h2', null, t('jarTitle')));
    if (!s.jar.length && !gone.length) { box.append(h('p', { class: 'cs-muted' }, t('jarEmpty'))); return box; }
    function row(ck, st, why) {
      var d = r && st !== 'gone' ? r.decisions.filter(function (x) { return x.name === ck.name && x.domain === ck.domain && x.path === ck.path; })[0] : null;
      // set by this step's answer: it was not in the jar when the request left
      var fresh = st !== 'gone' && ((ck.domain === L.SHOP ? s.ev.setCookie : s.ev.otherSet) || []).indexOf(ck.name) >= 0;
      if (fresh) d = null;
      var state = st === 'gone' ? 'gone' : d && d.sent ? 'sent' : 'kept';
      var changed = st !== 'gone' && s.changed.jar.indexOf(ck.name) >= 0;
      var ss = ck.sameSite ? data(ck.sameSite, '') : h('span', { class: 'cs-muted', title: t('ssDefault') }, '(', data('Lax', ''), ')');
      return h('tr', { class: changed ? 'sd-changed' + anim(c) : null, dataset: { st: st === 'gone' ? 'gone' : 'jar' } },
        h('td', null, h('span', { class: 'cs-chip', dataset: { st: state, site: siteLane(ck.domain) }, translate: 'no' }, ck.name + '=' + ck.value)),
        h('td', { class: 'cs-strike' }, data(ck.domain)),
        h('td', { class: 'cs-opt' }, data(ck.path)),
        h('td', null, h('span', { class: 'cs-flags' },
          ck.secure ? flag('lock', t('secureLabel')) : null, ck.httpOnly ? flag('eye', t('httpOnlyLabel')) : null, ss)),
        h('td', null, ck.expires === null ? t('expSession') : data(clock(ck.expires))),
        h('td', null, st === 'gone' ? t(why === 'expired' ? 'whyExpired' : 'whyClosed') : reason(d, ck, fresh)));
    }
    box.append(h('table', { class: 'cs-tab' },
      h('thead', null, h('tr', null, h('th', null, t('colCookie')), h('th', null, t('colDomain')), h('th', { class: 'cs-opt' }, t('colPath')),
        h('th', null, t('colFlags')), h('th', null, t('colExpires')), h('th', null, t('colSent')))),
      h('tbody', null, s.jar.map(function (ck) { return row(ck, 'jar'); }), gone.map(function (g) { return row(g.c, 'gone', g.why); }))));
    return box;
  }

  // ── right: the shop's session table ──

  function renderSessions(c) {
    var s = c.state, e = s.ev;
    var box = h('section', { class: 'cs-box' }, h('h2', null, t.parts('sessTitle', { srv: data(L.SHOP, '') })));
    var ids = Object.keys(s.sessions);
    if (!ids.length && !s.gone.sessions.length) { box.append(h('p', { class: 'cs-muted' }, t('sessEmpty'))); return box; }
    var hit = s.lastRequest && e.kind !== 'close' && e.user && !e.stale ? e.sid : null;
    box.append(h('table', { class: 'cs-tab' },
      h('thead', null, h('tr', null, h('th', null, t('colSid')), h('th', null, t('colUser')), h('th', null, t('colCart')))),
      h('tbody', null,
        ids.map(function (id) {
          var row = s.sessions[id];
          return h('tr', { class: s.changed.sessions.indexOf(id) >= 0 ? 'sd-changed' + anim(c) : null, dataset: { st: id === hit ? 'hit' : 'row' } },
            h('td', null, data(id)), h('td', null, data(row.user, '')), h('td', null, data(row.cart.length ? row.cart.join(', ') : '0')));
        }),
        s.gone.sessions.map(function (g) {
          return h('tr', { dataset: { st: 'gone' } },
            h('td', { class: 'cs-strike' }, data(g.sid)), h('td', { class: 'cs-strike' }, data(g.row.user, '')), h('td', null, t('whyDeleted')));
        }))));
    return box;
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, e = s.ev, p = c.params, r = s.lastRequest, out = [];
    var V = {
      line: r ? B(r.method + ' ' + r.path) : '', cookie: r && r.header ? B('Cookie: ' + r.header) : '',
      sid: B(e.sid || ''), user: B(e.user || ''), ss: B(e.sameSite || p.sameSite)
    };
    switch (e.kind) {
      case 'start': {
        var k = nextKey(c);
        out = k ? parts('capStart', { act: h('b', null, actName(k)) }) : [];
        break;
      }
      case 'browse':
        out = e.why === 'known' ? parts('capBrowseKnown', V) : e.stale ? parts('capStale', V) : parts('capBrowseAnon', V);
        break;
      case 'link':
        if (e.why === 'known') out = parts('capLinkSent', V);
        else if (e.stale) out = parts('capStale', V);
        else if (e.sidWhy === 'samesite') {
          out = parts('capLinkStrict', V);
          if (e.jarSid && s.sessions[e.jarSid]) out = out.concat(parts('capStillThere', { sid: B(e.jarSid) }));
        } else out = parts('capLinkNone', V);
        break;
      case 'form':
        if (e.why === 'added') out = parts('capFormSent', V);
        else if (e.stale) out = parts('capStale', V);
        else if (e.sidWhy === 'samesite') out = parts('capFormBlocked', V);
        else out = parts('capFormNone', V);
        break;
      case 'cart':
        if (e.why === 'added') out = parts('capCartKnown', V).concat(t.n('cartNow', e.cart));
        else if (e.stale) out = parts('capStale', V);
        else out = parts('capCartAnon', V);
        break;
      case 'login': {
        if (e.why === 'already') { out = parts('capLoginAlready', V); break; }
        var set = s.log.filter(function (x) { return x.k === 'res' && x.from === 'S' && x.n === c.n; })[0].setCookie[0];
        var ck = s.jar.filter(function (x) { return x.name === 'sid' && x.domain === L.SHOP; })[0];
        out = parts('capLogin', Object.assign({}, V, { set: B('Set-Cookie: ' + set) }))
          .concat(ck && ck.expires !== null ? parts('capLoginPersistent', { exp: B(clock(ck.expires)) }) : t('capLoginSession'));
        break;
      }
      case 'logout':
        out = e.why === 'deleted' ? parts('capLogout', { sid: B(e.deleted) }) : e.stale ? parts('capStale', V) : t('capLogoutAnon');
        break;
      case 'close': {
        var before = c.prev ? c.prev.jar : [];
        var sidGone = before.filter(function (x) { return x.name === 'sid' && x.domain === L.SHOP && e.dropped.indexOf('sid') >= 0; })[0];
        var sidKept = s.jar.filter(function (x) { return x.name === 'sid' && x.domain === L.SHOP; })[0];
        out = e.dropped.length ? parts('capClose', { names: B(e.dropped.join(', ')) }) : [t('capCloseNone')];
        if (sidKept && sidKept.expires !== null) out = out.concat(parts('capCloseKept', { exp: B(clock(sidKept.expires)) }));
        if (sidGone && s.sessions[sidGone.value]) out = out.concat(parts('capCloseServer', { sid: B(sidGone.value) }));
        break;
      }
      default: out = [];
    }
    if (e.expired && e.expired.length) out = out.concat(parts('capExpired', { names: B(e.expired.join(', ')) }));
    if (e.otherSet && e.otherSet.length) out = out.concat(t('capOtherSet'));
    // the other `persistent` setting at the same step (lesson: show each variant's outcome)
    if (c.n && (e.kind === 'close' || r)) {
      var alt = Simdeck.stateAt(L, Object.assign({}, p, { persistent: !p.persistent }), c.n);
      if (e.kind === 'close') {
        var had = e.dropped.indexOf('sid') >= 0 || e.kept.indexOf('sid') >= 0;
        var altKeeps = alt.ev.kept.indexOf('sid') >= 0;
        if (had && altKeeps !== (e.kept.indexOf('sid') >= 0)) out = out.concat(t(altKeeps ? 'capAltCloseOn' : 'capAltCloseOff'));
      } else if (alt.page && s.page && alt.page.user !== s.page.user && e.kind !== 'login') {
        out = out.concat(alt.page.user ? parts('capAltPersist', { user: B(alt.page.user) }) : t('capAltSession'));
      }
    }
    if (c.last) out = out.concat(t(c.n >= L.MAX_STEPS ? 'capFull' : 'capMore'));
    return out;
  }

  // ── controls ──

  function actionButton(k) {
    return { type: 'button', key: k.toLowerCase(), label: actName(k), run: function (sim) {
      var a = L.press(sim.params.acts, sim.n, k);
      if (a === null) { sim.render(); return; }
      pressedAt = { n: sim.n, acts: a };
      sim.set({ acts: a }, { preset: sim.preset });
    } };
  }

  var sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    // `acts` (the run, one letter per action) is a model param without a control: the presets set it and the action
    // keys replace the rest of it from the next step (NOTES.md, Shared requests).
    params: [
      { key: 'sameSite', type: 'choice', label: t('sameSite'), hint: t('sameSiteHint'),
        options: L.SAMESITE.map(function (v) { return [v, data(v, '')]; }) },
      { key: 'persistent', type: 'toggle', label: t('persistent'), hint: t('persistentHint') }
    ].concat(L.KEYS.map(actionButton)),

    presets: [
      { id: 'login-browse', label: t('presetLogin'), hint: t('presetLoginHint'), params: L.PRESETS['login-browse'] },
      { id: 'lax-link-vs-form', label: t('presetLax'), hint: t('presetLaxHint'), params: L.PRESETS['lax-link-vs-form'] },
      { id: 'strict', label: t('presetStrict'), hint: t('presetStrictHint'), params: L.PRESETS.strict },
      { id: 'browser-closed', label: t('presetClosed'), hint: t('presetClosedHint'), params: L.PRESETS['browser-closed'] },
      { id: 'logout', label: t('presetLogout'), hint: t('presetLogoutHint'), params: L.PRESETS.logout }
    ],

    legend: [
      { shape: 'ck-sent', label: t('legSent') },
      { shape: 'ck-kept', label: t('legKept') },
      { shape: 'ck-gone', label: t('legGone') },
      { shape: 'ck-lock', label: t('legSecure') },
      { shape: 'ck-eye', label: t('legHttpOnly') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'cs' },
        h('div', { class: 'cs-col cs-mid' }, chart, renderJar(c)),
        h('div', { class: 'cs-col' }, renderMsg(c), renderSessions(c))));
      chart.fit();
    },

    caption: caption
  });

  // the legend's icon swatches
  [['ck-lock', 'lock'], ['ck-eye', 'eye']].forEach(function (x) {
    var sw = document.querySelector('.sd-legend .sd-swatch[data-shape="' + x[0] + '"]');
    if (sw && !sw.firstChild) sw.append(svgIcon(x[1]));
  });
  void sim;
})();
</script>
</body>
</html>
