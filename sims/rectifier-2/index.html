<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Mosni ispravljač</h1>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var PI = Math.PI;
  var sim = null;

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function text(x, y, str, cls, attrs) {
    return s('text', Object.assign({ class: cls || null, x: x, y: y, translate: 'no' }, attrs || {}), str);
  }
  // "U" with a subscript (s, a, e), as in the figures; pre is put before it ("~")
  function uText(x, y, sub, cls, anchor, pre) {
    return s('text', { class: cls || null, x: x, y: y, translate: 'no', 'text-anchor': anchor || null },
      (pre || '') + 'U', s('tspan', { dy: '0.3em' }, sub), s('tspan', { dy: '-0.3em' }, ''));
  }
  // U with a subscript for the {us}, {ua} placeholders of the captions
  function uNode(sub) { return h('span', { translate: 'no' }, 'U', h('sub', null, sub)); }
  // a small arrowhead at (x, y) pointing in direction (dx, dy), for the direction of the current
  function arrow(x, y, dx, dy, size, cls) {
    var len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    var px = -dy, py = dx;
    var pts = [[x + dx * size, y + dy * size], [x - dx * size * 0.6 + px * size * 0.75, y - dy * size * 0.6 + py * size * 0.75],
      [x - dx * size * 0.6 - px * size * 0.75, y - dy * size * 0.6 - py * size * 0.75]];
    return s('polygon', { class: cls, points: pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') });
  }
  // a vertical coil from y0 to y1 at x, n turns of half-ellipses bulging rx to the right (dir 1) or left (dir 0)
  function coil(x, y0, y1, n, dir, rx) {
    var d = 'M' + x + ',' + y0, hh = (y1 - y0) / n;
    for (var i = 0; i < n; i++) d += 'a' + rx + ',' + (hh / 2) + ' 0 0 ' + dir + ' 0,' + hh;
    return d;
  }

  var presetKeys = { half1: 'presetHalf1', half2: 'presetHalf2', both: 'presetBoth' };

  // ── the circuit, after figures 962–964: input terminals and primary, the core, the secondary, its two ends (~) at
  //    the top and bottom corners of the bridge, + on the right corner and − on the left, R between + and the rail
  //    from −. The wire from − down to the rail hops over the wire from the secondary's bottom end (a crossing, not a
  //    junction). Every diode points from its anode towards +. ──
  function drawCircuit(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), compact = W < 30 * rem;
    var xIn = (compact ? 3.4 : 4.4) * rem, xP = xIn + 1.4 * rem, xS = xP + 2.4 * rem;
    var span = W - (compact ? 2.4 : 3.6) * rem - xS;
    // narrow (phone): the bridge sits further right and slimmer, clear of the ~Us label and of R
    var xB = xS + (compact ? 0.52 : 0.44) * span, dx = Math.min((compact ? 0.2 : 0.25) * span, 7 * rem);
    var xR = xS + (compact ? 0.9 : 0.84) * span, xO = xS + span;
    var xPl = xB + dx, xMn = xB - dx;
    var yT = 2.2 * rem, yL = H - 1.4 * rem, yB = yL - 2.6 * rem, yM = (yT + yB) / 2;
    var pq = (yM - yT) * 0.4, yPT = yT + pq, yPB = yB - pq;    // the primary is shorter, centred
    var hop = 0.5 * rem, ds = (compact ? 0.6 : 0.72) * rem;    // the hop's radius, half a diode's height
    var rh = Math.min(3.4 * rem, (yL - yM) * 0.55), rw = 1 * rem; // the resistor's box
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var cr = 0.7 * rem, sec = coil(xS, yT, yB, 8, 0, cr);
    var top = [xB, yT], bot = [xB, yB], pl = [xPl, yM], mn = [xMn, yM];
    // the four diodes: [name, anode, cathode, half-period it conducts in]
    var diodes = [['D1', top, pl, 1], ['D2', mn, bot, 1], ['D3', bot, pl, 2], ['D4', mn, top, 2]];
    // from − down to the rail, hopping (to the left) over the bottom wire at yB; and back up
    var mnDown = 'M' + xMn + ',' + yM + 'V' + (yB - hop) + 'a' + hop + ',' + hop + ' 0 0 0 0,' + (2 * hop) + 'V' + yL;
    var mnUp = 'M' + xMn + ',' + yL + 'V' + (yB + hop) + 'a' + hop + ',' + hop + ' 0 0 1 0,' + (-2 * hop) + 'V' + yM;
    var line = function (a, b) { return 'M' + a[0] + ',' + a[1] + 'L' + b[0] + ',' + b[1]; };
    var mid = function (a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };

    // current paths first, under the wires; each with arrows in the direction of the current. Half-period 1 leaves
    // the secondary at the top end, through D1, R and D2 back to the bottom end; half-period 2 the other way round.
    var as = 0.55 * rem;
    st.paths.forEach(function (half) {
      var one = half === 1, cls = 'rc-path rc-path' + half, acls = 'rc-arrow' + half;
      var from = one ? top : bot, to = one ? bot : top, yFrom = from[1], yTo = to[1];
      var path = sec + 'M' + xS + ',' + yFrom + 'H' + xB + line(from, pl) + 'M' + xPl + ',' + yM + 'H' + xR + 'V' + yL + 'H' + xMn +
        mnUp + line(mn, to) + 'M' + xB + ',' + yTo + 'H' + xS;
      svg.append(s('path', { class: cls, d: path }));
      var m1 = mid(from, pl), m2 = mid(mn, to);
      svg.append(arrow((xS + xMn) / 2, yFrom, 1, 0, as, acls),
        arrow(m1[0] + (pl[0] - from[0]) * 0.28, m1[1] + (pl[1] - from[1]) * 0.28, pl[0] - from[0], pl[1] - from[1], as, acls),
        arrow(xR, yM + (yL - yM) * 0.12, 0, 1, as, acls),
        arrow((xMn + xR) / 2, yL, -1, 0, as, acls),
        arrow(m2[0] + (to[0] - mn[0]) * 0.28, m2[1] + (to[1] - mn[1]) * 0.28, to[0] - mn[0], to[1] - mn[1], as, acls),
        arrow((xS + xMn) / 2, yTo, -1, 0, as, acls));
    });

    // wires
    var wires = 'M' + xIn + ',' + yPT + 'H' + xP + coil(xP, yPT, yPB, 5, 1, cr).replace(/^M[^a]*/, '') + 'H' + xIn +
      sec + 'M' + xS + ',' + yT + 'H' + xB + 'M' + xS + ',' + yB + 'H' + xB +   // secondary and its two ends
      line(top, pl) + line(pl, bot) + line(bot, mn) + line(mn, top) +           // the bridge
      'M' + xPl + ',' + yM + 'H' + xO +                                          // + → R and the + terminal
      'M' + xR + ',' + yM + 'V' + yL +                                           // R
      mnDown + 'H' + xO;                                                         // − → rail → the − terminal
    svg.append(s('path', { class: 'rc-wire', d: wires }));
    // the core between primary and secondary
    var cx = (xP + xS) / 2;
    svg.append(s('line', { class: 'rc-core', x1: cx - 0.2 * rem, y1: yT - 0.3 * rem, x2: cx - 0.2 * rem, y2: yB + 0.3 * rem }),
      s('line', { class: 'rc-core', x1: cx + 0.2 * rem, y1: yT - 0.3 * rem, x2: cx + 0.2 * rem, y2: yB + 0.3 * rem }));
    // the resistor
    var yRc = (yM + yL) / 2;
    svg.append(s('rect', { class: 'rc-res', x: xR - rw / 2, y: yRc - rh / 2, width: rw, height: rh }),
      compact ? text(xR, yRc - rh / 2 - 0.5 * rem, t('load'), 'rc-name', { 'text-anchor': 'middle' })
        : text(xR - rw / 2 - 0.4 * rem, yRc + 0.35 * rem, t('load'), 'rc-name', { 'text-anchor': 'end' }));
    // junctions and terminals
    [top, bot, pl, mn, [xR, yM], [xR, yL]].forEach(function (p) { svg.append(s('circle', { class: 'rc-dot', cx: p[0], cy: p[1], r: 0.22 * rem })); });
    [[xIn, yPT], [xIn, yPB], [xO, yM], [xO, yL]].forEach(function (p) { svg.append(s('circle', { class: 'rc-term', cx: p[0], cy: p[1], r: 0.3 * rem })); });

    // the diodes on the bridge's edges: a triangle from anode to cathode and the bar at the cathode, filled while they
    // conduct; the name and state outside the bridge
    diodes.forEach(function (d) {
      var a = d[1], k = d[2], m = mid(a, k);
      var ux = k[0] - a[0], uy = k[1] - a[1], len = Math.hypot(ux, uy);
      ux /= len; uy /= len;
      var nx = -uy, ny = ux;
      var v = st.diodes[d[0]], on = v === 'conducts' || v === 'alternate';
      var tip = [m[0] + ux * ds, m[1] + uy * ds];
      var b1 = [m[0] - ux * ds + nx * ds, m[1] - uy * ds + ny * ds], b2 = [m[0] - ux * ds - nx * ds, m[1] - uy * ds - ny * ds];
      svg.append(s('polygon', { class: 'rc-diode' + (on ? ' rc-on' + d[3] : ''), points: [b1, b2, tip].map(function (p) { return p.join(','); }).join(' ') }),
        s('line', { class: 'rc-wire', x1: tip[0] + nx * ds, y1: tip[1] + ny * ds, x2: tip[0] - nx * ds, y2: tip[1] - ny * ds }));
      // outward from the bridge's centre
      var ox = m[0] - xB, oy = m[1] - yM, ol = Math.hypot(ox, oy);
      ox /= ol; oy /= ol;
      var lx = m[0] + ox * (ds + 0.9 * rem), ly = m[1] + oy * (ds + 0.6 * rem) + 0.35 * rem;
      // the lower-left labels stay left of the wire from − down to the rail
      if (ox < 0 && oy > 0) lx = Math.min(lx, xMn - 0.5 * rem);
      var anchor = ox > 0 ? 'start' : 'end';
      var up = oy < 0;   // the name nearest the diode, the state further out
      var yName = up ? ly - 0.55 * rem : ly, yState = up ? ly - 1.95 * rem : ly + 1.4 * rem;
      svg.append(text(lx, yName, d[0], 'rc-name', { 'text-anchor': anchor }));
      // narrow: no room for the state beside each diode; the fill and the readout below carry it
      if (!compact && (v === 'conducts' || v === 'blocks')) {
        svg.append(text(lx, yState, t(v), v === 'conducts' ? 'rc-t' + d[3] : 'rc-ink', { 'text-anchor': anchor }));
      }
    });

    // voltages, the bridge's corners and the output
    svg.append(uText(xIn - 0.5 * rem, (yPT + yPB) / 2 + 0.35 * rem, 'e', 'rc-name', 'end', '~'),
      uText(xS + 0.6 * rem, yM + 0.35 * rem, 's', 'rc-name', null, '~'),
      text(xB, yT - 0.55 * rem, '~', 'rc-sign', { 'text-anchor': 'middle' }),
      text(xB, yB + 1.55 * rem, '~', 'rc-sign', { 'text-anchor': 'middle' }),
      text(xPl - 0.55 * rem, yM + 0.45 * rem, '+', 'rc-sign', { 'text-anchor': 'end' }),
      text(xMn + 0.55 * rem, yM + 0.45 * rem, '−', 'rc-sign'),
      text(xO + 0.5 * rem, yM + 0.45 * rem, '+', 'rc-sign'),
      text(xO + 0.5 * rem, yL + 0.45 * rem, '−', 'rc-sign'),
      uText(xO + 0.2 * rem, yRc + 0.35 * rem, 'a', 'rc-name'));
    // the polarity of the secondary's ends in the step's half-period
    if (st.top) {
      svg.append(text(xS - 0.5 * rem, yT - 0.5 * rem, st.top === '+' ? '+' : '−', 'rc-sign', { 'text-anchor': 'end' }),
        text(xS - 0.5 * rem, yB + 1.4 * rem, st.bottom === '+' ? '+' : '−', 'rc-sign', { 'text-anchor': 'end' }));
    }
    box.replaceChildren(svg);
  }

  // ── Us and Ua against time, θ from 0 to 2.5π as in the figures; the step's half-periods shaded, and in them the
  //    part of Us and the hump of Ua in the colour of the conducting pair ──
  function drawPlots(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var l = 3 * rem, r = 1.6 * rem, top = 0.3 * rem, bot = 1.9 * rem, gap = 1.2 * rem;
    var ph = (H - top - bot - gap) / 2;
    var X = function (th) { return l + th / L.T_MAX * (W - l - r); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var plots = [['s', L.us], ['a', L.ua]];
    var c = 240;

    // vertical guides at T/2 and T through both plots, and their ticks below
    [PI, 2 * PI].forEach(function (th, i) {
      svg.append(s('line', { class: 'rc-grid', x1: X(th), y1: top, x2: X(th), y2: H - bot }),
        text(X(th), H - 0.3 * rem, t(i ? 'tickFull' : 'tickHalf'), 'rc-ink', { 'text-anchor': 'middle' }));
    });

    plots.forEach(function (p, i) {
      var y0 = top + i * (ph + gap);
      var Y = function (v) { return y0 + ph / 2 - v * (ph / 2 - 0.2 * rem); };
      var pts = function (fn, a, b) {
        var out = [];
        for (var k = 0; k <= c; k++) { var th = a + (b - a) * k / c; out.push(X(th).toFixed(1) + ',' + Y(fn(th)).toFixed(1)); }
        return out.join(' ');
      };
      st.windows.forEach(function (w) {
        svg.append(s('rect', { class: 'rc-win' + w.half, x: X(w.from), y: y0, width: X(w.to) - X(w.from), height: ph }));
      });
      svg.append(s('line', { class: 'rc-axis', x1: X(0), y1: Y(0), x2: X(L.T_MAX) + 0.5 * rem, y2: Y(0) }),
        s('line', { class: 'rc-axis', x1: X(0), y1: y0, x2: X(0), y2: y0 + ph }),
        s('polyline', { class: 'rc-curve' + (i ? ' rc-curve-a' : ''), points: pts(p[1], 0, L.T_MAX) }),
        uText(X(0) - 0.4 * rem, Y(0) + 0.35 * rem, p[0], 'rc-name', 'end'),
        text(X(L.T_MAX) + 0.7 * rem, Y(0) + 0.35 * rem, t('axisT'), 'rc-ink'));
      st.windows.forEach(function (w) {
        svg.append(s('polyline', { class: 'rc-seg' + w.half, points: pts(p[1], w.from, w.to) }));
        // on Ua at step 3: which pair gave each hump
        if (i === 1 && st.half === 'both' && w.to - w.from > PI / 2) {
          svg.append(text((X(w.from) + X(w.to)) / 2, Y(0) - 0.3 * rem, t('rowPair' + w.half), 'rc-t' + w.half, { 'text-anchor': 'middle' }));
        }
      });
      // over Us at steps 1 and 2: the window's name, on the side of the zero line that Us leaves free
      if (i === 0 && st.half !== 'both') {
        st.windows.forEach(function (w) {
          svg.append(text((X(w.from) + X(w.to)) / 2, Y(w.half === 1 ? -0.55 : 0.45), t('half' + w.half), 'rc-t' + w.half, { 'text-anchor': 'middle' }));
        });
      }
    });
    box.replaceChildren(svg);
  }

  function readout(st) {
    var row = function (dt, dd, name) { return [h('dt', name ? { translate: 'no' } : null, dt), h('dd', null, dd)]; };
    var d = function (v, alt) { return t(v == null ? 'dNone' : v === 'alternate' ? alt : v === 'conducts' ? 'dConduct' : 'dBlock'); };
    var half = t(st.half == null ? 'halfNone' : st.half === 'both' ? 'halfBoth' : st.half === 1 ? 'halfOne' : 'halfTwo');
    return h('dl', { class: 'rc-read' }, h('h2', null, t('readTitle')),
      row(t('rowHalf'), half), row(t('rowPair1'), d(st.diodes.D1, 'pair1Alt'), true), row(t('rowPair2'), d(st.diodes.D3, 'pair2Alt'), true),
      row(t('rowLoad'), t(st.load ? 'loadDown' : 'loadNone')));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: x.step }; }),
    legend: [
      { c: 1, label: t('legendHalf1') },
      { c: 2, shape: 'hollow', label: t('legendHalf2') }
    ],

    render: function (c) {
      var st = c.state;
      var circ = h('div', { class: 'rc-circ' }), plots = h('div', { class: 'rc-plots' });
      c.stage.replaceChildren(h('div', { class: 'rc' }, circ, plots, readout(st)));
      drawCircuit(circ, st);
      drawPlots(plots, st);
    },

    caption: function (c) { return t.parts('caption' + c.state.n, { us: uNode('s'), ua: uNode('a') }); }
  });

  // The drawings are in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
