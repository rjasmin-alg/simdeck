<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);

  var LETTER = { read: 'R', readExecute: 'X', write: 'W', modify: 'M', full: 'F' };
  var AP_KEY = { 'this': 'ap_this', 'this+sub+files': 'ap_tsf', 'sub+files': 'ap_sf', 'files': 'ap_files' };
  var PRESET_KEY = {
    'basic': 'presetBasic', 'explicit-beats-inherited': 'presetExplicit', 'disable-convert': 'presetDisable',
    'copy-vs-move': 'presetCopyMove', 'cross-volume': 'presetCross'
  };

  /** Data (names, paths, flags) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  /** Parts of a string with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sentence(key, vars) { return h('span', null, rich(key, vars)); }

  // ── icons: inline SVG, no text inside ──
  var NS = 'http://www.w3.org/2000/svg';
  var PATHS = {
    folder: 'M2 6.5h7l2 2.2h11V20H2z',
    file: 'M5 2h10l5 5v15H5z M15 2v5h5',
    chain: 'M10.5 13.5l-3 3a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0 M13.5 10.5l3-3a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0 M9 15l6-6',
    broken: 'M8.5 13.5l-2 2a3.2 3.2 0 0 1-4.5-4.5l2.5-2.5a3.2 3.2 0 0 1 4.5 0 M15.5 10.5l2-2a3.2 3.2 0 0 1 4.5 4.5l-2.5 2.5a3.2 3.2 0 0 1-4.5 0 M11 3.5l0.6 3 M13 20.5l-0.6-3 M3.5 21l3-3 M20.5 3l-3 3'
  };
  function icon(name) {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'ni-ico');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', PATHS[name]);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', 'currentColor');
    p.setAttribute('stroke-width', '2');
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    s.appendChild(p);
    return s;
  }

  function levelWords(names) {
    if (!names.length) return h('span', null, t('noAccess'));
    return names.map(function (l) { return h('span', null, t('lv_' + l)); })
      .reduce(function (a, b) { return h('span', null, t.parts('plus', { a: a, b: b })); });
  }
  function heldLetters(names) {
    var on = L.levelsOf([].concat.apply([], names.map(function (l) { return L.NTFS_MASK[l]; })));
    var held = L.LEVELS.filter(function (l) { return on[l]; }).map(function (l) { return LETTER[l]; });
    return held.length ? data(held.join('')) : h('span', null, t('noAccessShort'));
  }
  function appliesText(r, kind, flags) {
    if (flags) return data(L.FLAGS[r.appliesTo].join(' ') || '—');
    return h('span', null, t(kind === 'file' ? 'ap_object' : AP_KEY[r.appliesTo]));
  }
  function nodeById(v, id) { return v.nodes.filter(function (n) { return n.id === id; })[0]; }
  function pathOf(s, id) { return L.pathOf(s.tree, id); }
  function nameOf(s, id) { var x = s.tree.filter(function (n) { return n.id === id; })[0]; return x ? x.name : id; }

  // ── left: the tree ──
  function treeBox(s, v, ch) {
    var items = v.nodes.map(function (n) {
      var cls = 'ni-node' + (ch.nodes.indexOf(n.id) >= 0 ? ' sd-changed' : '');
      var badges = [];
      if (!n.inherit) badges.push(h('span', { class: 'ni-b ni-b-off', title: t('offLong'), 'aria-label': t('offLong') }, icon('broken')));
      if (n.kept) badges.push(h('span', { class: 'ni-b ni-b-i ni-b-k', title: t('keptLong'), 'aria-label': t('keptLong') }, t('keptTag')));
      badges.push(h('span', { class: 'ni-b', title: t.n('nExplicit', n.explicit), 'aria-label': t.n('nExplicit', n.explicit) }, data(n.explicit)));
      badges.push(h('span', { class: 'ni-b ni-b-i', title: t.n('nInherited', n.inherited), 'aria-label': t.n('nInherited', n.inherited) }, icon('chain'), data(n.inherited)));
      return h('li', null, h('button', {
        type: 'button', class: cls, style: { '--depth': String(n.depth) }, 'aria-current': n.id === v.shown ? 'true' : 'false',
        onclick: function () { window.simdeck.set({ pick: n.id === s.selected ? '' : n.id }); }
      }, icon(n.kind === 'file' ? 'file' : 'folder'), h('span', { class: 'ni-name' }, data(n.name)),
        h('span', { class: 'ni-badges' }, badges),
        h('span', { class: 'ni-acc' }, heldLetters(n.access))));
    });
    return h('section', { class: 'ni-box' },
      h('div', { class: 'ni-treehead' }, h('h2', null, t('treeTitle'), ' ', h('span', { class: 'ni-sub' }, t('treeHint'))),
        h('span', { class: 'ni-sub' }, t.parts('treeAccess', { user: data(v.user) }))),
      h('ul', { class: 'ni-tree' }, items));
  }

  // ── right: the DACL as a rule table ──
  function outcomeOf(type, levels) {
    var ok = type !== 'deny';
    return h('span', { class: 'sd-rt-verdict', dataset: { ok: String(ok) } }, (ok ? '✓ ' : '✕ ') + t(ok ? 'outGrants' : 'outDenies'),
      levels.length ? ' ' : null, levels.length ? data(levels.map(function (l) { return LETTER[l]; }).join(' ')) : null);
  }
  function sourceCell(s, r) {
    if (r.explicit) return h('span', null, t('explicit'));
    // the folder's name (a top's name is its path); the full path in the tooltip
    return h('span', { class: 'ni-src', title: pathOf(s, r.from) }, icon('chain'), h('span', null, t.parts(r.kept ? 'keptFrom' : 'inheritedFrom', { from: data(nameOf(s, r.from)) })));
  }
  function daclTable(s, v, p, ch) {
    var a = v.access, kind = v.node.kind;
    var table = RT({
      mode: 'deny',
      title: h('span', null, t.parts('daclTitle', { path: data(v.node.path) })),
      columns: [{ key: 'who', label: t('colTrustee') }, { key: 'rights', label: t('colRights') },
        { key: 'applies', label: t('colApplies'), wrap: true }, { key: 'src', label: t('colSource'), wrap: true }],
      actionLabel: t('colType'),
      markLabel: data(v.user),
      rows: v.dacl.map(function (r, i) {
        return {
          no: i + 1,
          cells: { who: r.trustee, rights: h('span', null, t('lv_' + r.rights)), applies: appliesText(r, kind, p.showFlags), src: sourceCell(s, r) },
          // the symbol alone (the legend names it), the word for screen readers and the tooltip
          action: h('span', { class: 'ni-type', title: t(r.type === 'deny' ? 'deny' : 'allow'), 'aria-label': t(r.type === 'deny' ? 'deny' : 'allow') }, r.type === 'deny' ? '✕' : '✓'), effect: r.type,
          hit: a.rows[i].match, mark: a.rows[i].mark
        };
      }),
      implicit: { text: v.dacl.length ? t('implicit') : t('emptyDacl'), action: h('span', { class: 'ni-type', title: t('noAccess'), 'aria-label': t('noAccess') }, '✕'), effect: 'deny' },
      at: 'all',
      done: true,
      outcome: function (i) { return i < v.dacl.length ? outcomeOf(v.dacl[i].type, a.rows[i].levels) : RT.verdict(false, t('noAccess')); },
      words: { win: t('wordWin'), beaten: t('wordBeaten'), skip: t('wordSkip') },
      stickyMark: true
    });
    var trs = table.querySelectorAll('tbody tr');
    v.dacl.forEach(function (r, i) {
      if (!trs[i]) return;
      if (!r.explicit) trs[i].classList.add('ni-inh');
      if (ch.rows.indexOf(i) >= 0) trs[i].classList.add('ni-chg');
    });
    return table;
  }
  function statusLine(s, v, ch) {
    var n = v.node, x = s.tree.filter(function (o) { return o.id === n.id; })[0];
    var bits = [];
    if (!n.inherit) bits.push(h('span', { class: 'ni-off' }, icon('broken'), ' ', t('inheritOff')));
    else if (!x.parent) bits.push(h('span', null, icon('chain'), ' ', t.parts('sep', { a: t('inheritOn'), b: t('topOfTree') })));
    else bits.push(h('span', null, icon('chain'), ' ', t('inheritOn')));
    bits.push(counts(n));
    if (ch.removed) bits.push(h('b', { class: 'ni-removed' }, t.n('nRemoved', ch.removed)));
    if (v.picked) {
      bits.push(h('b', null, t('picked')));
      bits.push(h('button', { type: 'button', class: 'ni-back', onclick: function () { window.simdeck.set({ pick: '' }); } }, t('backToStep')));
    }
    return h('div', { class: 'ni-status' }, bits);
  }
  function effCard(v) {
    var a = v.access;
    var chips = L.LEVELS.map(function (l) {
      var on = !!a.levels[l];
      var d = a.deciders[l];
      return h('span', { class: 'ni-chip', dataset: { on: on ? 'true' : 'false' }, 'aria-label': t(on ? 'chipOn' : 'chipOff', { chip: t('lv_' + l) }) },
        h('span', { class: 'ni-chip-top' }, h('b', { translate: 'no' }, LETTER[l]), h('span', { 'aria-hidden': 'true' }, on ? '✓' : '✕')),
        h('small', null, data(d.length ? d.map(function (i) { return '#' + (i + 1); }).join(' ') : t('noAce'))));
    });
    return h('section', { class: 'ni-box' },
      h('div', { class: 'ni-eff' },
        h('h2', null, t.parts('effTitle', { user: data(v.user), name: data(v.node.name) })),
        h('div', { class: 'ni-chips' }, chips),
        h('span', { class: 'ni-effname' }, levelWords(a.name))),
      h('div', { class: 'ni-key' }, rich('chipKey')));
  }

  // ── captions ──
  function joined(nodes) { return nodes.reduce(function (a, b) { return h('span', null, t.parts('join', { a: a, b: b })); }); }
  function counts(n) { return h('span', null, t.parts('counts', { e: t.n('nExplicit', n.explicit), i: t.n('nInherited', n.inherited) })); }
  /** Order clauses on the step's object: the explicit allow before an inherited deny, the nearer folder's allow
      before a farther deny, an inherited deny that decides Write, an allow that does not travel up. */
  function orderClauses(s, p, prev) {
    var v = L.view(s, Object.assign({}, p, { pick: '' }));
    var out = [];
    var rows = v.dacl, a = v.access;
    var w = a.by.w;
    var denyRow = rows.map(function (r, i) { return i; }).filter(function (i) { return rows[i].type === 'deny' && a.rows[i].match && L.NTFS_MASK[rows[i].rights].indexOf('w') >= 0; })[0];
    if (denyRow === undefined) return out;
    var dr = rows[denyRow];
    if (w >= 0 && w !== denyRow && rows[w].type === 'allow') {
      var ar = rows[w];
      if (ar.explicit && !dr.explicit) out.push(sentence('capExplicitBeats', { trustee: data(ar.trustee), user: data(v.user) }));
      else if (!ar.explicit && !dr.explicit && ar.lvl < dr.lvl) out.push(sentence('capNearer', { near: data(pathOf(s, ar.from)), far: data(pathOf(s, dr.from)), user: data(v.user) }));
    } else if (w === denyRow && !dr.explicit) {
      out.push(sentence('capInheritedDeny', { from: data(pathOf(s, dr.from)), user: data(v.user) }));
      // an explicit allow for Write exists below this object (an earlier step added it): it does not travel up
      var below = s.tree.filter(function (x) { return x.aces.some(function (e) { return e.type === 'allow' && L.NTFS_MASK[e.rights].indexOf('w') >= 0 && e.trustee === dr.trustee; }); })
        .filter(function (x) { return L.pathOf(s.tree, x.id).indexOf(v.node.path + '\\') === 0; })[0];
      if (below) out.push(sentence('capUpward', { name: data(below.name) }));
    }
    return out;
  }

  Simdeck.mount({
    defaults: L.defaults,
    steps: L.steps,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'script', type: 'choice', label: t('pScript'), options: L.SCRIPT_IDS.map(function (id) { return [id, t(PRESET_KEY[id])]; }), visible: function () { return false; }, resets: true },
      { key: 'user', type: 'choice', label: t('pUser'), options: [['ana', data('ana')], ['marko', data('marko')], ['vanjski', data('vanjski')]] },
      { key: 'showFlags', type: 'toggle', label: t('pShowFlags'), hint: t('pShowFlagsHint') },
      { key: 'disable', type: 'choice', label: t('pDisable'), options: [['convert', t('optConvert')], ['remove', t('optRemove')]],
        disabled: function (p) { return p.script === 'disable-convert' ? false : t('offDisable'); } }
    ],

    presets: L.SCRIPT_IDS.map(function (id) {
      return { id: id, label: t(PRESET_KEY[id]), hint: t(PRESET_KEY[id] + 'Hint'), params: { script: id, user: L.SCRIPTS[id].user } };
    }),

    legend: [
      { shape: 'ni-exp', label: t('legExplicit') },
      { shape: 'ni-inh', label: t('legInherited') },
      { shape: 'ni-allow', label: t('legAllow') },
      { shape: 'ni-deny', label: t('legDeny') },
      { shape: 'ni-off', label: t('legOff') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state, p = c.params;
      var v = L.view(s, p);
      var ch = L.changes(c.prev, s, v.shown);
      c.stage.replaceChildren(h('div', { class: 'ni' },
        h('div', { class: 'ni-col' }, treeBox(s, v, ch)),
        h('div', { class: 'ni-col' }, statusLine(s, v, ch), daclTable(s, v, p, ch), effCard(v))));
    },

    caption: function (c) {
      var s = c.state, p = c.params, e = s.event;
      var v = L.view(s, Object.assign({}, p, { pick: '' }));
      var out = [];
      function add(node) { if (out.length) out.push(' '); out.push(node); }
      var path = function (id) { return data(pathOf(s, id)); };
      var name = function (id) { return data(nameOf(s, id)); };
      if (!e) {
        add(sentence('capStart', { path: path(s.selected), counts: counts(v.node) }));
        return out;
      }
      if (!e.ok) { add(sentence('capRejected', { reason: t('rej_' + e.reason) })); return out; }
      var prev = c.prev;
      var below = function (id) { return L.order(s.tree).map(function (o) { return o.id; }).filter(function (k) { return k !== id && L.pathOf(s.tree, k).indexOf(L.pathOf(s.tree, id) + '\\') === 0; }); };
      var blocked = function (id) { return below(id).filter(function (k) { return !nodeById(v, k).inherit; }); };
      if (e.kind === 'add' || e.kind === 'remove') {
        if (e.kind === 'add') {
          add(sentence('capAdd', { path: path(e.target), ace: h('span', null, t.parts('aceText', {
            trustee: data(e.ace.trustee), type: t(e.ace.type === 'deny' ? 'typeDeny' : 'typeAllow'), rights: t('lv_' + e.ace.rights) })) }));
          var all = L.dacls(s.tree);
          var reached = below(e.target).filter(function (k) { return all[k].some(function (r) { return !r.explicit && r.id === e.ace.id; }); }).length;
          if (reached) add(h('span', null, t.n('capReached', reached)));
          if (e.ace.type === 'deny' && v.dacl[0] && v.dacl[0].id === e.ace.id && v.dacl.length > 1) add(h('span', null, t('capResorted')));
        } else {
          add(sentence('capRemove', { path: path(e.target), trustee: data(e.trustee) }));
        }
        blocked(e.target).forEach(function (k) { add(sentence('capBlocked', { name: name(k) })); });
        // kept sets that this change replaced (rule 7)
        if (prev) prev.tree.forEach(function (x) {
          var now = s.tree.filter(function (y) { return y.id === x.id; })[0];
          if (x.kept && now && !now.kept) add(sentence('capKeptDropped', { name: name(x.id), dest: path(now.parent) }));
        });
      } else if (e.kind === 'disable') {
        add(h('span', null, t(e.mode === 'remove' ? 'capRemoveAll' : 'capConvert')));
      } else if (e.kind === 'copy') {
        add(sentence('capCopy', { dest: path(e.dest) }));
        var orig = prev && prev.tree.filter(function (x) { return x.id === e.target; })[0];
        if (orig && orig.aces.length) add(sentence('capLostExplicit', { trustee: joined(orig.aces.map(function (a) { return data(a.trustee); })) }));
      } else if (e.kind === 'move') {
        if (e.cross) {
          add(sentence('capMoveCross', { name: name(e.target), dest: path(e.dest) }));
          var was = prev && prev.tree.filter(function (x) { return x.id === e.target; })[0];
          if (was && was.aces.length) add(sentence('capLostExplicit', { trustee: joined(was.aces.map(function (a) { return data(a.trustee); })) }));
        } else {
          var olds = v.dacl.filter(function (r) { return r.kept; }).map(function (r) { return r.from; });
          add(sentence('capMoveSame', { name: name(e.target), old: path(olds[0] || e.from), dest: path(e.dest) }));
        }
      } else if (e.kind === 'select') {
        var n = v.node, x = s.tree.filter(function (o) { return o.id === n.id; })[0];
        var froms = v.dacl.filter(function (r) { return !r.explicit; }).map(function (r) { return r.from; })
          .filter(function (f, i, arr) { return arr.indexOf(f) === i; });
        if (!n.inherit) add(sentence(n.explicit ? 'capOff' : 'capOffEmpty', { name: name(n.id) }));
        else if (x.kept) add(sentence('capKept', { name: name(n.id), old: path(froms[0]), dest: path(x.parent) }));
        else if (!n.explicit && froms.length === 1) add(sentence('capAllFrom', { name: name(n.id), from: path(froms[0]) }));
        else if (!n.explicit && froms.length) add(sentence('capAllInherited', { name: name(n.id) }));
        else add(sentence('capSelect', { path: path(n.id), counts: counts(n) }));
      }
      orderClauses(s, p, prev).forEach(add);
      return out;
    }
  });

  // The legend's chain icons (the kit draws plain swatches; the page adds its icons once).
  var put = function (shape, name) {
    var sw = document.querySelector('[data-sd-legend] .sd-swatch[data-shape="' + shape + '"]');
    if (sw && !sw.firstChild) sw.appendChild(icon(name));
  };
  put('ni-inh', 'chain');
  put('ni-off', 'broken');
})();
</script>
</body>
</html>
