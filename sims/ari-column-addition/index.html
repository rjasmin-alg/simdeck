/* Page CSS: every selector starts with [data-sim="ari-column-addition"]; colours only from kit tokens.
   The current column is a tinted band with a thick ink frame; a carry is a small bold digit in the carry row; a digit
   written in this step has the kit's changed mark; a wrong digit in the mistake card is crossed out. */
[data-sim="ari-column-addition"] .ac {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
  gap: 1.6cqh 1.5cqw;
  height: 100%;
  padding: 1.6cqh 1.5cqw;
  font-size: max(1rem, min(2.6cqh, 1.25cqw));
  line-height: 1.3;
}
[data-sim="ari-column-addition"] .ac[data-aud='child'] { grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); }
[data-sim="ari-column-addition"] .ac-box { min-width: 0; min-height: 0; padding: 0.5em 0.7em; border: var(--line-w) solid var(--line); border-radius: var(--radius); background: var(--bg); }
[data-sim="ari-column-addition"] .ac-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.2em 0.6em; font-weight: 700; }
[data-sim="ari-column-addition"] .ac-small { color: var(--muted); font-size: max(16px, 0.8em); font-weight: 400; }
[data-sim="ari-column-addition"] .ac-num { font-family: var(--mono); white-space: nowrap; }
[data-sim="ari-column-addition"] .ac-num sub { font-size: max(16px, 0.62em); }

/* ── the paper: kit view K5 (kit/papercolumns.js); here only its boxes ── */
[data-sim="ari-column-addition"] .ac-paperbox { padding: 0; }
[data-sim="ari-column-addition"] .sd-caption .ac-num { font-family: inherit; }

/* ── regrouping box ── */
[data-sim="ari-column-addition"] .ac-side { display: flex; flex-direction: column; gap: 1.6cqh; min-height: 0; }
[data-sim="ari-column-addition"] .ac-rg { flex: 1 1 0; display: flex; flex-direction: column; gap: 0.35em; }
[data-sim="ari-column-addition"] .ac-key { display: flex; flex-wrap: wrap; gap: 0.2em 1em; }
[data-sim="ari-column-addition"] .ac-key span { display: inline-flex; align-items: center; gap: 0.35em; }
[data-sim="ari-column-addition"] .ac-key i { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; border: 0.16em solid var(--c1); background: var(--c1); }
[data-sim="ari-column-addition"] .ac-key i[data-carry] { background: var(--bg); border-color: var(--c2); border-style: solid; }
[data-sim="ari-column-addition"] .ac-dots { flex: 1 1 0; min-height: 4rem; container-type: size; display: grid; place-items: center; }
[data-sim="ari-column-addition"] .ac-frames {
  --u: min(calc(100cqw / var(--dw)), calc(100cqh / var(--dh)), 3.4rem);
  display: grid;
  grid-template-columns: repeat(var(--fpr), auto);
  gap: calc(var(--u) * 0.6);
  justify-content: center;
}
[data-sim="ari-column-addition"] .ac-frame {
  display: grid;
  grid-template-columns: repeat(var(--fc), var(--u));
  grid-auto-rows: var(--u);
  padding: calc(var(--u) * 0.4);
  border: max(2px, calc(var(--u) * 0.08)) solid transparent;
  border-radius: calc(var(--u) * 0.45);
  position: relative;
}
[data-sim="ari-column-addition"] .ac-frame[data-full] { border-color: var(--ink); border-style: dashed; }
[data-sim="ari-column-addition"] .ac-frame[data-full] > b {
  position: absolute; top: calc(var(--u) * -0.55); left: calc(var(--u) * -0.35);
  display: grid; place-items: center; width: max(1.3rem, calc(var(--u) * 0.85)); height: max(1.3rem, calc(var(--u) * 0.85));
  border-radius: 50%; background: var(--ink); color: var(--bg); font-size: max(16px, calc(var(--u) * 0.55)); line-height: 1;
}
[data-sim="ari-column-addition"] .ac-dot { place-self: center; width: 78%; height: 78%; border-radius: 50%; background: var(--c1); border: max(2px, calc(var(--u) * 0.1)) solid var(--c1); }
[data-sim="ari-column-addition"] .ac-dot[data-carry] { background: var(--bg); border-color: var(--c2); }
[data-sim="ari-column-addition"] .ac-split { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.2em 1.2em; font-weight: 700; }
[data-sim="ari-column-addition"] .ac-math { text-align: center; font-family: var(--mono); font-weight: 700; }
[data-sim="ari-column-addition"] .ac-units { text-align: center; font-weight: 700; }
[data-sim="ari-column-addition"] .ac-note { color: var(--muted); }

/* ── mistake card ── */

[data-sim="ari-column-addition"] .ac-mc .ac-paperbox { flex: 1 1 0; min-height: 3rem; border: 0; place-items: center start; }
[data-sim="ari-column-addition"] .ac-mc .sd-paper { --pc-fill-h: 96cqh; --pc-max: 3.2rem; }
[data-sim="ari-column-addition"] .ac-mres { font-weight: 700; }
[data-sim="ari-column-addition"] .ac-mres .ac-bad { color: var(--danger); text-decoration: line-through 0.12em; }
[data-sim="ari-column-addition"] .ac-why { font-size: max(16px, 0.86em); }

/* ── panel: numbers field, quick bases (the audience switch in the header is the kit's) ── */
[data-sim="ari-column-addition"] .ac-field { display: grid; gap: 0.3rem; }
[data-sim="ari-column-addition"] .ac-input {

}

/* legend swatch (the band and the carry are the kit's pc-band, pc-carry) */

@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ari-column-addition"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="ari-column-addition"] .ac,
  [data-sim="ari-column-addition"] .ac[data-aud='child'] { display: flex; flex-direction: column; height: auto; font-size: 1rem; gap: 0.8rem; padding: 0.7rem; }
  [data-sim="ari-column-addition"] .ac-paperbox { container-type: inline-size; padding: 0.4rem 0; overflow-x: auto; }
  [data-sim="ari-column-addition"] .ac-mc .ac-paperbox { flex: none; }
  [data-sim="ari-column-addition"] .ac-dots { flex: none; height: 12rem; }
  [data-sim="ari-column-addition"] .ac-mc, [data-sim="ari-column-addition"] .ac-rg { flex: none; }
}
</style>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var PRESET_KEY = { 'two-numbers': 'pTwo', 'reaches-base': 'pReach', 'four-numbers': 'pFour', 'left-aligned': 'pLeft',
    'base-2': 'pBin', 'base-16': 'pHex' };
  var MISTAKE_KEY = { none: 'mNone', nocarry: 'mNocarry', whole: 'mWhole', left: 'mLeft' };
  var MISTAKE_TITLE = { nocarry: 'mtNocarry', whole: 'mtWhole', left: 'mtLeft' };
  var QUICK = [2, 8, 10, 16];

  // ── audience: the kit's switch (?audience= first, then the choice remembered across the ari- pages, then teacher) ──
  var AUDS = Simdeck.paperColumns.AUDIENCES;
  var audCtl = null;
  var audience = 'teacher';
  var notice = null; // a refused action, said once in the caption

  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }

  // ── numbers as text ──
  function glyphs(v, b) { return L.textOf(v, b); }
  /** A numeral as data: digits, and the base as a subscript when it is not 10 (child view: never). */
  function num(text, b) {
    return h('span', { class: 'ac-num', translate: 'no' }, String(text), b !== 10 && audience !== 'child' ? h('sub', null, String(b)) : null);
  }
  function plain(text) { return h('span', { class: 'ac-num', translate: 'no' }, String(text)); }
  function pow(b, k) { return Math.pow(b, k); }
  function named(b, k) { return k === 0 || (b === 10 && k <= 3); }
  function units(b, k, n) { return named(b, k) ? t.n('u' + k, n) : t.n('uGen', n, { v: pow(b, k) }); }
  function colName(b, k) { return named(b, k) ? t('col' + k) : t('colGen', { v: pow(b, k) }); }
  function headName(b, k) { return named(b, k) ? t('head' + k) : t('headGen', { v: pow(b, k) }); }

  // ── K5: the paper is the kit's (Simdeck.paperColumns); rows by place, k = 0 the ones ──
  var P = Simdeck.paperColumns;
  function carryRow(texts, now) {
    return { kind: 'carry', cells: texts.map(function (c, k) { return c == null ? null : { text: c, now: !!(now && now[k]), label: t('carryCell', { c: c }) }; }) };
  }
  function numberRows(rows, asides) {
    return rows.map(function (r, i) { return { cells: r, sign: i === rows.length - 1 ? '+' : null, aside: asides ? asides[i] : null }; });
  }

  // ── the dots of a column sum, grouped by the base ──
  function frameShape(b) {
    var fc = b <= 5 ? b : b === 10 ? 5 : Math.ceil(Math.sqrt(b));
    return { fc: fc, fr: Math.ceil(b / fc) };
  }
  function dotsNode(fromDigits, fromCarry, b, grouped, label) {
    var total = fromDigits + fromCarry;
    var sh = frameShape(b);
    var F = Math.max(1, Math.ceil(total / b));
    var best = null;
    for (var fpr = 1; fpr <= F; fpr++) {
      var rowsF = Math.ceil(F / fpr);
      var dw = fpr * (sh.fc + 1) + (fpr - 1) * 0.6;
      var dh = rowsF * (sh.fr + 1) + (rowsF - 1) * 0.6;
      var score = Math.min(1.7 / dw, 1 / dh);
      if (!best || score > best.score) best = { fpr: fpr, dw: dw, dh: dh, score: score };
    }
    var frames = [];
    for (var f = 0; f < F; f++) {
      var dots = [];
      for (var i = f * b; i < Math.min(total, (f + 1) * b); i++) {
        dots.push(h('span', { class: 'ac-dot', dataset: i >= fromDigits ? { carry: '' } : {} }));
      }
      var full = grouped && (f + 1) * b <= total;
      frames.push(h('div', { class: 'ac-frame', dataset: full ? { full: '' } : {}, style: { '--fc': String(sh.fc) } },
        full ? h('b', { 'aria-hidden': 'true' }, '←') : null, dots));
    }
    return h('div', { class: 'ac-dots', role: 'img', 'aria-label': label },
      h('div', { class: 'ac-frames', style: { '--fpr': String(best.fpr), '--dw': String(best.dw), '--dh': String(best.dh) } }, frames));
  }

  // ── what the page shows, from the params and the state ──
  function placeLabels(b, W, aud) {
    var out = [], titles = [];
    for (var k = 0; k < W; k++) {
      if (b === 10 && k <= 8) { out.push(t('place' + k)); titles.push(k <= 3 ? t('placeName' + k) : t('placeName', { v: pow(b, k) })); }
      else { out.push(h('span', { translate: 'no' }, String(b), h('sup', null, String(k)))); titles.push(t('placeName', { v: pow(b, k) })); }
    }
    return { labels: out, titles: titles };
  }

  function written(s, cols) { var w = 0; for (var k = 0; k < cols; k++) if (s.resultRow[k] != null) w = k + 1; return w; }

  function render(c) {
    var p = c.params, s = c.state, prev = c.prev;
    var b = p.base;
    var plan = L.planOf(p);
    var W = plan.cols + plan.finalDigits.length;
    var lit = c.n > 0;
    var aud = audience;

    // the paper
    var band = s.phase === 'sum' || s.phase === 'write' ? [s.col] : s.phase === 'final' ? plan.finalDigits.map(function (_, i) { return plan.cols + i; }) : [];
    var changed = {}, carryChanged = {};
    if (lit && prev) {
      s.resultRow.forEach(function (d, k) { if (d != null && prev.resultRow[k] == null) changed[k] = true; });
      s.carryRow.forEach(function (d, k) { if (d != null && prev.carryRow[k] == null) carryChanged[k] = true; });
    }
    var pl = placeLabels(b, W, aud);
    var showDec = b !== 10 && aud !== 'child';
    // the decimal aside is as wide as its longest text without "= " (the total counts once it is written)
    var decLongest = showDec ? plan.values.map(String).concat([c.last ? String(plan.total) : '', t('decimal')]).reduce(function (m, x) { return Math.max(m, x.length); }, 0) : 0;
    var paper = P({
      cols: W, big: aud === 'child', label: t('paper'),
      places: pl.labels, placeTitles: pl.titles, band: band,
      rows: [carryRow(s.carryRow.map(function (cv) { return cv == null ? null : glyphs(cv, b); }), carryChanged)]
        .concat(numberRows(plan.rows.map(function (r) { return r.map(function (d) { return L.DIGITS[d]; }); }),
          showDec ? plan.values.map(function (v) { return '= ' + v; }) : null))
        .concat([{ kind: 'result', rule: true, aside: showDec && c.last ? '= ' + plan.total : null,
          cells: s.resultRow.map(function (d, k) { return d == null ? null : { text: L.DIGITS[d], now: !!changed[k] }; }) }]),
      asideHead: showDec ? t('decimal') : null,
      asideWidth: showDec ? 1 + decLongest * 0.4 : null
    });
    var paperBox = h('section', { class: 'ac-box ac-paperbox sd-paper-box' }, paper);

    // the regrouping box
    var rg = [h('div', { class: 'ac-head' }, h('span', null, t('rgTitle')),
      s.phase === 'start' ? null : h('span', { class: 'ac-small' }, s.phase === 'final' ? t('rgFinal') : t('rgCol', { col: colName(b, s.col) })))];
    if (s.phase === 'start') {
      rg.push(h('p', { class: 'ac-note' }, t('rgStart')));
    } else {
      var colInfo = s.phase === 'final' ? { digitSum: 0, carryIn: plan.final, sum: plan.final } : plan.columns[s.col];
      var k = s.col;
      var grouped = s.phase !== 'sum';
      rg.push(h('div', { class: 'ac-key ac-small' },
        colInfo.digitSum > 0 ? h('span', null, h('i', { 'aria-hidden': 'true' }), t('rgFromDigits')) : null,
        colInfo.carryIn > 0 ? h('span', null, h('i', { 'aria-hidden': 'true', dataset: { carry: '' } }), t('rgFromCarry')) : null));
      rg.push(dotsNode(colInfo.digitSum, colInfo.carryIn, b, grouped, t.n('rgDots', colInfo.sum)));
      var q = Math.floor(colInfo.sum / b), r = colInfo.sum % b;
      if (!grouped) {
        rg.push(h('p', { class: 'ac-units' }, units(b, k, colInfo.sum)));
      } else if (q > 0) {
        rg.push(h('p', { class: 'ac-math', translate: 'no' }, colInfo.sum + ' = ' + q + ' × ' + b + ' + ' + r));
        rg.push(h('p', { class: 'ac-split' }, h('span', null, t('rgLeft', { q: units(b, k + 1, q) })), h('span', null, t('rgStays', { r: units(b, k, r) }))));
      } else {
        rg.push(h('p', { class: 'ac-units' }, units(b, k, colInfo.sum)));
        rg.push(h('p', { class: 'ac-split' }, t('rgFits', { b: b })));
      }
    }
    var side = [h('section', { class: 'ac-box ac-rg' }, rg)];

    // the typical mistake, teacher view
    if (aud === 'teacher' && p.mistake !== 'none') side.push(mistakeCard(p, s, plan, c));

    c.stage.replaceChildren(h('div', { class: 'ac', dataset: { aud: aud } }, paperBox, h('div', { class: 'ac-side' }, side)));
    syncPanel(c);
  }

  function mistakeCard(p, s, plan, c) {
    var b = p.base;
    var m = L.mistakeOf(p, p.mistake);
    var w = written(s, plan.cols);
    var W = Math.max(plan.cols + (m.finalText ? m.finalText.length : 0), plan.cols);
    var result = [], crossed = {};
    for (var k = 0; k < plan.cols; k++) {
      if (k < w) { result.push(m.cells[k]); if (m.differs[k]) crossed[k] = true; } else result.push(null);
    }
    if (c.last && m.finalText) m.finalText.split('').reverse().forEach(function (ch) { result.push(ch); });
    var carries = [];
    if (m.kind === 'left') for (var j = 0; j < plan.cols; j++) carries.push(j > 0 && j - 1 < w && m.carries[j - 1] > 0 ? glyphs(m.carries[j - 1], b) : null);
    var paper = P({
      cols: W, label: t('mtHead'),
      rows: [carryRow(carries)]
        .concat(numberRows(m.rows.map(function (r) { var out = []; for (var i = 0; i < W; i++) out.push(i < r.length && r[i] != null ? L.DIGITS[r[i]] : null); return out; })))
        .concat([{ kind: 'result', rule: true, cells: result.map(function (d, k) {
          return d == null ? null : crossed[k] ? { text: d, x: 'wrong', label: t('wrongCell', { w: d }) } : d;
        }) }])
    });
    var kids = [h('div', { class: 'ac-head' }, h('span', null, t('mtHead')), h('span', { class: 'ac-small' }, t(MISTAKE_TITLE[m.kind]))),
      h('div', { class: 'ac-paperbox sd-paper-box' }, paper)];
    if (c.last && !m.same) {
      kids.push(h('p', { class: 'ac-mres' }, h('span', { class: 'ac-bad' }, num(m.text, b)), ' ', t.parts('mtInstead', { res: num(m.rightText, b) })));
    }
    var why;
    if (m.same) {
      if (m.kind === 'left') why = t(m.equalLengths ? 'sameLeft' : 'sameAny');
      else if (m.kind === 'whole') why = t(m.anyReach ? 'sameWholeLast' : 'sameWhole');
      else why = t('sameNocarry');
    }
    else if (m.kind === 'nocarry') why = t.parts('whyNocarry', { lost: lostNode(m.lost, b) });
    else if (m.kind === 'whole') {
      var first = plan.columns.filter(function (col) { return col.digitSum >= b; })[0];
      why = t.parts('whyWhole', { s: num(glyphs(first.digitSum, b), b) });
    } else {
      var short = plan.rows.map(function (r, i) { return { r: r, i: i }; }).filter(function (x) { return x.r.length < plan.cols; })[0];
      why = t.parts('whyLeft', { num: num(glyphs(plan.values[short.i], b), b), mis: num(m.misread[short.i], b) });
    }
    kids.push(h('p', { class: 'ac-why' }, why));
    return h('section', { class: 'ac-box ac-mc' }, kids);
  }
  function lostNode(v, b) {
    if (b === 10) return num(String(v), 10);
    return h('span', null, num(glyphs(v, b), b), ' = ', plain(String(v)));
  }

  // ── captions ──
  function exprOf(plan, k, b) {
    var col = plan.columns[k];
    var ds = plan.rows.filter(function (r) { return k < r.length; }).map(function (r) { return r[k]; });
    var parts = ds.map(function (d) { return L.DIGITS[d]; });
    var vals = ds.slice();
    if (col.carryIn > 0) { parts.push(String(col.carryIn)); vals.push(col.carryIn); }
    var text = parts.join(' + ');
    if (ds.some(function (d) { return d >= 10; })) text += ' = ' + vals.join(' + ');
    return plain(text);
  }
  function digitNode(d) { return plain(d >= 10 ? L.DIGITS[d] + ' (' + d + ')' : L.DIGITS[d]); }
  function sumExpr(plan, b) {
    return h('span', null, plan.values.map(function (v, i) { return [i ? ' + ' : '', num(glyphs(v, b), b)]; }));
  }

  function caption(c) {
    var p = c.params, s = c.state, b = p.base;
    var plan = L.planOf(p);
    var aud = audience;
    var X = aud === 'teacher' ? 'T' : aud === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(t.parts('cRefused', { b: plain(notice.b), why: notice.why })); notice = null; }

    function resText() { return num(L.textOf(plan.total, b), b); }
    if (s.phase === 'start') {
      if (X === 'A') add(t.parts('cStartA', { b: plain(b) }));
      else add(t.parts('cStart' + X));
    } else if (s.phase === 'sum') {
      var col = plan.columns[s.col];
      var alone = plan.rows.filter(function (r) { return s.col < r.length; }).length + (col.carryIn > 0 ? 1 : 0) === 1;
      if (alone) add(t.parts('cSumOne' + X, { head: headName(b, s.col), d: digitNode(col.sum) }));
      else if (X === 'C') add(t.parts('cSumC', { expr: exprOf(plan, s.col, b), sum: plain(col.sum) }));
      else if (X === 'T') {
        add(t.parts('cSumT', { head: headName(b, s.col), expr: exprOf(plan, s.col, b), sum: plain(col.sum) }));
        add(t.parts(col.sum >= b ? 'cReachT' : 'cBelowT', { sum: plain(col.sum), b: plain(b) }));
      } else {
        add(t.parts('cSumA', { head: headName(b, s.col), expr: exprOf(plan, s.col, b), sumU: units(b, s.col, col.sum) }));
        if (col.carryIn > 0) add(t.parts('cSumCarryA'));
      }
    } else if (s.phase === 'write') {
      var cw = plan.columns[s.col];
      var cy = cw.carryOut;
      var nextName = colName(b, s.col + 1);
      if (X === 'C') add(t.parts(cy ? 'cWriteC' : 'cWriteNoC', { d: digitNode(cw.digit), c: plain(cy) }));
      else if (X === 'T') add(t.parts(cy ? 'cWriteT' : 'cWriteNoT', { d: digitNode(cw.digit), c: plain(cy), next: nextName }));
      else if (cy) add(t.parts('cWriteA', { sumU: units(b, s.col, cw.sum), qU: units(b, s.col + 1, cy), rU: units(b, s.col, cw.digit), r: digitNode(cw.digit), next: nextName }));
      else add(t.parts('cWriteNoA', { sumU: units(b, s.col, cw.sum), b: plain(b), r: digitNode(cw.digit) }));
      if (cy >= b && X !== 'C') add(t.parts('cCarryDigits', { b: plain(b), c: plain(cy), ct: num(glyphs(cy, b), b) }));
      if (X === 'T' && p.mistake !== 'none') mistakeNote(p, s, plan, add);
    } else if (s.phase === 'final') {
      var fc = plan.final;
      if (X === 'C') add(t.parts('cFinalC', { c: plain(fc) }));
      else if (X === 'T') add(t.parts('cFinalT', { c: plain(fc) }));
      else add(t.parts('cFinalA', { cU: units(b, plan.cols, fc) }));
      if (fc >= b && X !== 'C') add(t.parts('cCarryDigits', { b: plain(b), c: plain(fc), ct: num(glyphs(fc, b), b) }));
    }
    if (c.last && s.phase !== 'start') {
      if (X === 'C') addHl(t.parts('cDoneC', { res: resText() }));
      else {
        addHl(t.parts('cResultT', { expr: sumExpr(plan, b), res: resText() }));
        if (b !== 10) add(t.parts('cDecimal', { expr: h('span', null, plan.values.map(function (v, i) { return [i ? ' + ' : '', plain(v)]; })), res: plain(plan.total) }));
        if (X === 'T' && p.mistake !== 'none') {
          var m = L.mistakeOf(p, p.mistake);
          if (!m.same) add(t.parts('cMEnd', { wrong: num(m.text, b), res: resText() }));
        }
      }
    }
    return out;
  }
  function mistakeNote(p, s, plan, add) {
    var m = L.mistakeOf(p, p.mistake);
    if (m.same || !m.differs[s.col]) return;
    var key = { nocarry: 'cMNocarry', whole: 'cMWhole', left: 'cMLeft' }[m.kind];
    add(t.parts(key, { w: plain(m.cells[s.col]) }));
  }

  // ── the panel: the numbers field and the quick bases; the header: the audience switch ──
  var field = null, quick = null;
  function buildNumbers() {
    var host = document.querySelector('[data-ac-numbers]');
    var label = h('label', { class: 'sd-ctl-label', for: 'ac-nums' }, h('span', null, ''));
    var input = h('input', { id: 'ac-nums', type: 'text', class: 'ac-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', 'aria-describedby': 'ac-nums-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'ac-nums-msg', role: 'status' }, t('numsHint'));
    input.addEventListener('input', function () {
      var r = L.parseList(input.value, sim.params.base);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        var keyOf = { digit: 'errDigit', long: 'errLong', count: 'errCount', empty: 'errEmpty' };
        msg.textContent = t(keyOf[r.error], { at: r.at, b: sim.params.base });
        msg.className = 'ac-err';
        return;
      }
      input.removeAttribute('aria-invalid');
      msg.textContent = t('numsHint');
      msg.className = 'sd-hint';
      sim.set(L.paramsFor(r.values));
      sim.first();
    });
    // Enter or Esc hands the keys back to the clicker
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { input.removeAttribute('aria-invalid'); msg.textContent = t('numsHint'); msg.className = 'sd-hint'; sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('numsTitle') },
      h('div', { class: 'ac-field' }, label, input, msg)));
    field = { input: input, label: label.firstChild, msg: msg };
  }
  function buildQuick() {
    var wrap = document.querySelector('[data-sd-controls] [data-key="base"]');
    if (!wrap) return;
    var btns = QUICK.map(function (qb) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { pickBase(qb); } }, String(qb)));
    });
    quick = btns;
    wrap.append(h('div', { class: 'sd-seg ac-quick', role: 'group', 'aria-label': t('baseQuick'), title: t('baseHint') }, btns));
  }
  function tooLong(nb, p) {
    var vals = L.numbersOf(p);
    var bad = vals.filter(function (v) { return L.digitsOf(v, nb).length > L.MAX_DIGITS; })[0];
    return bad === undefined ? null : t('baseTooLong', { b: nb, num: L.textOf(bad, p.base) });
  }
  function pickBase(nb) {
    var why = tooLong(nb, sim.params);
    if (why) { notice = { b: nb, why: why }; sim.render(); return; }
    sim.set({ base: nb });
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    AUDS.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    audCtl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints,
      onChange: function (a) { audience = a; enforceChild(); sim.render(); } });
    audience = audCtl.value;
  }
  /** The child view works in base 10 only. */
  function enforceChild() {
    if (audience !== 'child' || sim.params.base === 10) return;
    if (L.fitsIn(L.numbersOf(sim.params), 10)) sim.set({ base: 10 });
    else sim.set(Object.assign(L.paramsFor(L.numbersOf(L.defaults)), { base: 10 }));
  }

  function syncPanel(c) {
    var p = c.params;
    if (field) {
      field.label.textContent = t('numsLabel', { b: p.base });
      var shown = L.parseList(field.input.value, p.base);
      var same = !shown.error && shown.values.join(',') === L.numbersOf(p).join(',');
      // typing keeps its text; a preset or a base change under a focused field rewrites it and clears an error
      if (document.activeElement !== field.input || !same) {
        field.input.value = L.numbersOf(p).map(function (v) { return L.textOf(v, p.base); }).join(' + ');
        field.input.removeAttribute('aria-invalid');
        field.msg.textContent = t('numsHint');
        field.msg.className = 'sd-hint';
      }
    }
    if (quick) {
      quick.forEach(function (btn, i) {
        var why = tooLong(QUICK[i], p);
        btn.setAttribute('aria-pressed', String(p.base === QUICK[i]));
        btn.setAttribute('aria-disabled', why ? 'true' : 'false');
        btn.title = why || '';
      });
    }
  }

  buildAudience();
  buildNumbers();

  var NAMED = { 2: 'baseName2', 8: 'baseName8', 10: 'baseName10', 16: 'baseName16' };
  var hiddenRange = function (key) {
    return { key: key, type: 'range', label: t('numsTitle'), value: L.defaults[key], min: 0, max: L.MAX_VALUE, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'base', type: 'range', label: t('base'), value: L.defaults.base, min: function (p) { return Math.min(L.MAX_BASE, L.minBase(L.numbersOf(p))); }, max: L.MAX_BASE,
        format: function (v) { return NAMED[v] ? v + ' (' + t(NAMED[v]) + ')' : String(v); },
        visible: function () { return audience !== 'child'; } },
      { key: 'mistake', type: 'select', label: t('mistake'), value: L.defaults.mistake,
        options: L.MISTAKES.map(function (m) { return [m, t(MISTAKE_KEY[m])]; }),
        visible: function () { return audience === 'teacher'; } },
      // the numbers: set from the field above, kept here so the URL and the language switch carry them
      { key: 'count', type: 'range', label: t('numsTitle'), value: L.defaults.count, min: L.MIN_NUMBERS, max: L.MAX_NUMBERS, visible: function () { return false; } },
      hiddenRange('a'), hiddenRange('b'), hiddenRange('c'), hiddenRange('d')
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    legend: [
      { shape: 'pc-band', label: t('legCol') },
      { shape: 'pc-carry', label: t('legCarry') },
      { shape: 'hl', label: t('legChanged') },
      { shape: 'ac-group', label: t('legGroup') }
    ],

    render: render,
    caption: caption
  });
  buildQuick();
  sim.on(function (c) { if (audience === 'child' && c.params.base !== 10) enforceChild(); });
  enforceChild();
  sim.render();
})();
</script>
</body>
</html>
