<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { A: '1', B: '2', R1: '4', R2: '5', SW: '3' };
  var LANE = { R1: 'var(--c4)', R2: 'var(--c5)' };   // the routers' series colours, for the time line
  var MACS = {};
  L.HOSTS.concat(L.ROUTERS).forEach(function (d) { MACS[d.mac] = d.id; });

  /** Data (addresses, MACs, router names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'sd-mono' : cls || null }, String(text)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  /** Seconds from centiseconds: 2 decimals at 1 s adverts, 3 at 0.1 s, trailing zeros dropped; a comma in Croatian. */
  function sec(cs, adv) {
    var v = (cs / 100).toFixed(adv === 10 ? 3 : 2).replace(/\.?0+$/, '');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function R(s, id) { return s.routers.filter(function (r) { return r.id === id; })[0]; }

  /** The whole run for these params (for the time line), cached by params. */
  var runKey = null, runStates = null;
  function runOf(p) {
    var key = JSON.stringify(p);
    if (key === runKey) return runStates;
    var s = L.initial(p), out = [s], n = L.steps(p);
    for (var i = 1; i <= n; i++) { s = L.step(s, i, p); out.push(s); }
    runKey = key; runStates = out;
    return out;
  }

  // ── top: time line and status ──

  function renderClock(c) {
    var s = c.state, adv = s.advInterval;
    var run = runOf(c.params);
    var end = run[run.length - 1].t;
    var H = end + adv;
    function x(tt) { return (100 * tt / H).toFixed(3) + '%'; }
    function lane(segs, ticks) {
      return h('div', { class: 'vr-lane' }, segs, ticks, h('span', { class: 'vr-nowline', style: { left: x(s.t) } }));
    }
    function routerLane(id) {
      var segs = [];
      for (var i = 0; i < c.n; i++) {
        var a = run[i].t, b = run[i + 1].t;
        if (b <= a) continue;
        var st = R(run[i], id).state;
        segs.push(h('span', { class: 'vr-seg' + (st === 'init' ? ' sd-hatch' : ''), dataset: { st: st },
          style: { left: x(a), width: x(b - a), '--sw': LANE[id] } }));
      }
      var ticks = s.log.filter(function (e) { return e.who === id && (e.kind === 'advert') && e.t <= s.t; })
        .map(function (e) { return h('span', { class: 'vr-tick', dataset: e.lost ? { lost: '' } : {}, style: { left: x(e.t) } }); });
      return lane(segs, ticks);
    }
    function trafficLane() {
      var segs = [];
      for (var i = 0; i < c.n; i++) {
        var a = run[i].t, b = run[i + 1].t;
        if (b <= a) continue;
        var ok = run[i].fw !== null;
        segs.push(h('span', { class: 'vr-seg' + (ok ? '' : ' sd-hatch'), dataset: { st: ok ? 'ok' : 'lost' }, style: { left: x(a), width: x(b - a) } }));
      }
      return lane(segs, null);
    }
    var axis = [];
    for (var k = 0; k * adv <= H; k++) axis.push(h('span', { style: { left: x(k * adv) } }, sec(k * adv, adv)));
    var lost = s.lost + (s.lostFrom !== null ? s.t - s.lostFrom : 0);
    var status = [
      h('span', { class: s.fw ? null : 'vr-bad' }, s.fw ? t.parts('fwOk', { r: data(s.fw, '') }) : s.gw === null && s.event === 'start' ? t('fwNone') : t('fwLost')),
      h('span', null, t.parts('lostSoFar', { s: data(sec(lost, adv), '') })),
      h('span', null, t.n('changes', s.gwChanges))];
    return h('section', { class: 'vr-box vr-clock' },
      h('div', { class: 'vr-head' }, h('span', null, t('clockTitle')), h('span', { class: 'vr-now', translate: 'no' }, t('now', { t: sec(s.t, adv) })), status),
      h('div', { class: 'vr-tl' },
        data('R1', ''), routerLane('R1'),
        data('R2', ''), routerLane('R2'),
        h('span', null, t('laneTraffic')), trafficLane(),
        h('span'), h('div', { class: 'vr-axis', translate: 'no' }, axis)));
  }

  function renderFrame(c) {
    var s = c.state, f = s.frame, adv = s.advInterval;
    var box = h('section', { class: 'vr-box vr-frame' }, h('h2', null, t('frameTitle')));
    if (!f) { box.append(h('p', { class: 'vr-none' }, t('frameNone'))); return box; }
    var layers;
    if (f.kind === 'advert') {
      layers = [
        { title: t('ethernet'), fields: [[t('dstMac'), f.dstMac], [t('srcMac'), f.srcMac, { changed: true }]] },
        { title: t('vrrp'), c: COLOUR[f.from], fields: [[t('srcIp'), f.srcIp], [t('dstIp'), f.dstIp],
          [t('prio'), String(f.prio), { changed: f.prio === 0 }], [t('vipField'), f.vip]] }
      ];
    } else if (f.kind === 'garp') {
      layers = [
        { dashed: true, title: t('ethernet'), fields: [[t('dstMac'), [data(f.dstMac, ''), h('span', null, ' (' + t('broadcastAll') + ')')]], [t('srcMac'), f.srcMac, { changed: true }]] },
        { title: t('garpTitle'), c: COLOUR[f.from], body: h('span', { class: 'sd-mono' }, t.parts('isAt', { ip: data(f.senderIp, ''), mac: data(f.senderMac, '') })) }
      ];
    } else {
      layers = [
        { title: t('ethernet'), fields: [[t('dstMac'), f.dstMac, { changed: true }], [t('srcMac'), f.srcMac]] },
        { title: t('ipPacket'), c: COLOUR.A, fields: [[t('srcIp'), f.srcIp], [t('dstIp'), f.dstIp]] }
      ];
    }
    box.append(Simdeck.topology.headers(layers, c.dir === 'forward' ? 'forward' : null));
    return box;
  }

  // ── topology ──

  var BADGE = { sends: ['bSends', 'fill'], reset: ['bHears', 'dashed'], skew: ['bHears', 'dashed'], discard: ['bDiscards', 'muted'],
    lost: ['bLost', 'muted'], stepdown: ['bStepdown', 'solid'], assert: ['bAsserts', 'solid'], fails: ['bFails', 'muted'],
    receives: ['bReceives', 'solid'], learns: ['bLearns', 'solid'], hears: ['bHears', 'dashed'] };
  function badge(k) { return { text: t(BADGE[k][0]), k: BADGE[k][1], anim: true }; }

  function routerExtra(c, r) {
    var s = c.state, adv = s.advInterval, fwd = c.dir === 'forward';
    var stKey = r.state === 'master' ? 'stMaster' : r.state === 'backup' ? 'stBackup' : 'stInit';
    var kids = [h('div', { class: 'vr-line' },
      h('span', { class: 'vr-st' + (r.changed ? ' sd-changed' : '') + (r.changed && fwd ? ' sd-anim-in' : ''), dataset: { st: r.up ? r.state : 'init' } }, t(stKey)),
      h('span', null, t('prioLine', { p: r.prio })))];
    if (r.up && r.state === 'backup' && r.downAt !== null) {
      var rem = Math.max(0, r.downAt - s.t);
      var skewOnly = r.heard === 'skew' || (s.event === 'shutdown' && s.phase !== 'advert' && r.downLen < 3 * adv);
      kids.push(h('span', null, skewOnly ? t.parts('timerSkew', { r: data(sec(rem, adv), '') })
        : t.parts('timer', { r: data(sec(rem, adv), ''), d: data(sec(r.downLen, adv), '') })));
      kids.push(h('span', { class: 'vr-bar', role: 'img', 'aria-label': sec(rem, adv) + ' s' },
        h('i', { style: { width: (100 * rem / r.downLen).toFixed(1) + '%' } })));
    } else if (r.up && r.state === 'master') {
      kids.push(h('span', null, t('advEvery', { a: sec(adv, adv) })));
      kids.push(h('span', { class: 'vr-vip', translate: 'no' }, t('vipLabel', { ip: L.VIP })));
    }
    return h('div', { class: 'vr-rx' }, kids);
  }

  function routerBadges(s, r) {
    var out = [];
    if (r.changed && !r.up && s.phase === 'fail') out.push('fails');
    if (r.sent) out.push('sends');
    if (r.heard && r.heard !== 'deaf' && !(r.sent && r.heard === 'assert')) out.push(r.heard);
    if (s.phase === 'frame' && s.frame && s.frame.via === r.id) out.push('receives');
    return out.map(badge);
  }

  function arpTable(c, id) {
    var s = c.state;
    return Simdeck.topology.table({
      title: t('arpTable'), empty: t('empty'),
      rows: s.arp[id].map(function (e) {
        return { cells: [e.ip, e.mac], c: s.fw ? COLOUR[s.fw] : null, mark: e.state === 'refreshed' ? 'refreshed' : null,
          note: e.state === 'refreshed' ? t('entrySame') : null };
      })
    }, c.dir);
  }

  function macTable(c) {
    var s = c.state;
    var rows = [];
    // only the virtual MAC's row: the hosts' rows never change here (SPEC.md "Scene")
    [L.VMAC].filter(function (mac) { return s.switchMac[mac] !== undefined; }).forEach(function (mac) {
      var port = s.switchMac[mac];
      var owner = mac === L.VMAC ? L.idAtPort(port) : MACS[mac];
      var isV = mac === L.VMAC;
      rows.push({ cells: [mac, '→ ' + port], c: owner ? COLOUR[owner] : null,
        mark: isV && s.switchChanged ? 'new' : null,
        note: isV && s.flap ? t('entryFlap') : null });
    });
    return h('div', { class: 'vr-tab' }, Simdeck.topology.table({ title: t('macTable'), empty: t('empty'), rows: rows }, c.dir));
  }

  function renderTopo(c) {
    var s = c.state, adv = s.advInterval;
    var hostBadges = function (id) {
      var b = [];
      if (s.phase === 'frame' && id === 'A') b.push(badge('sends'));
      if (s.phase === 'flood') b.push(badge('hears'));
      return b;
    };
    var nodes = [];
    var POS = { A: [0, 0], B: [0, 1] };
    L.HOSTS.forEach(function (d) {
      nodes.push({ id: d.id, kind: 'host', col: POS[d.id][0], row: POS[d.id][1], c: COLOUR[d.id],
        lines: [{ text: d.ip, kind: 'addr' }],
        badges: hostBadges(d.id), state: s.phase === 'frame' && d.id === 'A' ? 'active' : null,
        extra: h('div', { class: 'vr-rx' }, arpTable(c, d.id)) });
    });
    nodes.push({ id: 'SW', kind: 'switch', col: 1, row: 0, c: COLOUR.SW, mark: t('swMark'), name: t('switchName'),
      badges: s.switchChanged ? [badge('learns')] : [], extra: h('div', { class: 'vr-rx' }, macTable(c)) });
    var RPOS = { R1: [2, 0], R2: [2, 1] };
    s.routers.forEach(function (r) {
      var bs = routerBadges(s, r);
      nodes.push({ id: r.id, kind: 'router', col: RPOS[r.id][0], row: RPOS[r.id][1], c: COLOUR[r.id],
        lines: [{ text: r.ip, kind: 'addr' }],
        badges: bs, state: !r.up ? 'down' : r.sent ? 'active' : null, changed: r.changed && r.up,
        extra: routerExtra(c, r) });
    });
    nodes.push({ id: 'cloud', kind: 'cloud', col: 3, row: 0, name: t('cloud'),
      lines: [{ text: t('cloudSub'), kind: 'role' }, s.phase === 'frame' ? { text: L.FAR, kind: 'addr' } : null] });

    var via = s.phase === 'frame' && s.frame ? s.frame.via : null;
    var links = [
      { id: 'sa', a: 'SW', b: 'A', ends: { a: '1' }, active: !!via },
      { id: 'sb', a: 'SW', b: 'B', ends: { a: '2' } }
    ];
    s.routers.forEach(function (r) {
      links.push({ id: 's' + r.id, a: 'SW', b: r.id, ends: { a: String(r.port) }, state: r.up ? 'up' : 'off', active: via === r.id });
      links.push({ id: 'c' + r.id, a: r.id, b: 'cloud', state: r.up ? 'up' : 'off', active: via === r.id });
    });

    // packets of this step, one per link and direction
    var seen = {}, packets = [];
    var origin = s.frame ? s.frame.from : null;
    s.packets.forEach(function (k) {
      var key = k.from + '>' + k.to + ':' + k.kind;
      if (seen[key]) return;
      seen[key] = true;
      var col = COLOUR[k.from === 'SW' ? (k.kind === 'ip' ? 'A' : origin) : k.from];
      var label = k.kind === 'advert' || k.kind === 'advert0' ? t('chipAdvert', { p: k.prio })
        : k.kind === 'announce' ? t('chipAnnounce') : k.kind === 'garp' ? t('chipGarp') : t('chipPing');
      // chips into the switch stop early, chips out of it late: clear of the port labels and of each other
      packets.push({ from: k.from, to: k.to, label: label, c: col, cast: k.kind === 'garp' ? 'broadcast' : 'unicast', drop: !!k.drop,
        at: k.to === 'SW' ? 0.35 : k.from === 'SW' ? 0.55 : 0.5 });
    });

    return Simdeck.topology({
      cols: 4, rows: ['auto', 'auto'], gap: '5.5cqw', dir: c.dir,
      nodes: nodes, links: links, packets: packets
    });
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, p = c.params, adv = s.advInterval;
    var D = function (v) { return data(v); };
    var B = function (v) { return h('b', null, data(v)); };
    var S = function (cs) { return data(sec(cs, adv)); };
    var M = s.m ? R(s, s.m) : null, K = s.k ? R(s, s.k) : null;
    var out = [];
    var add = function (key, vars) { if (out.length) out.push(' '); out = out.concat(rich(key, vars)); };
    switch (s.phase) {
      case 'start0':
        if (s.event === 'start') add('capIntroStart');
        else if (s.event === 'restore') add('capIntroRestore');
        else {
          add('capIntro', { m: D(M.id), pm: D(M.prio), k: D(K.id), pk: D(K.prio), vip: D(L.VIP), port: D(M.port) });
          if (s.event === 'fail') add('capIntroFail', { r: D('R1') });
          if (s.event === 'shutdown') add('capIntroShutdown', { r: D('R1') });
          if (s.event === 'cut') add('capIntroCut');
        }
        break;
      case 'advert':
        if (!K.up) add('capAdvertDeaf', { m: D(M.id), p: D(M.prio) });
        else add('capAdvert', { m: D(M.id), p: D(M.prio), k: D(K.id), d: S(K.downLen) });
        break;
      case 'fail':
        add(s.m === 'R1' ? 'capFail' : 'capFailBackup', { port: D(R(s, 'R1').port) });
        break;
      case 'shutdown':
        if (s.frame) add('capShutdown', { d: B(sec(R(s, 'R2').downLen, adv)) });
        else add('capShutdownBackup');
        break;
      case 'restore':
        add('capRestore', { d: S(R(s, 'R1').downLen) });
        break;
      case 'cut':
        add('capCut');
        break;
      case 'wait': {
        var rem = function (r) { return B(sec(r.downAt - s.t, adv)); };
        if (s.event === 'fail') add('capWaitFail', { t: D(sec(s.t, adv)), k: D(K.id), r: rem(K) });
        else if (s.event === 'cut') add('capWaitCut', { m: D(M.id), k: D(K.id), r: rem(K) });
        else {
          var r1 = R(s, 'R1'), r2 = R(s, 'R2');
          if (r1.heard === 'discard') add('capWaitDiscard', { p: D(r2.prio), r: rem(r1) });
          else add('capWaitReset', { why: s.preempt ? t('whyLower', { p1: r1.prio, p2: r2.prio }) : t('whyNoPreempt') });
        }
        break;
      }
      case 'expire':
        if (s.takers.length > 1) add('capExpireTie', { t: B(sec(s.t, adv)) });
        else {
          var tk = R(s, s.takers[0]);
          var port = s.switchMac[L.VMAC];
          if (port === undefined) add('capExpireFirst', { k: D(tk.id), t: B(sec(s.t, adv)) });
          else add('capExpire', { k: D(tk.id), t: B(sec(s.t, adv)), port: D(port) });
        }
        break;
      case 'announce':
        if (s.takers.length > 1) add('capAnnounceTie', { to: B(s.switchMac[L.VMAC]) });
        else add(c.prev && c.prev.switchMac[L.VMAC] === undefined ? 'capAnnounceFirst' : 'capAnnounce',
          { k: D(s.takers[0]), vip: D(L.VIP), mac: D(L.VMAC), to: B(s.switchMac[L.VMAC]) });
        break;
      case 'flood': {
        add(s.arp.A.length ? 'capFlood' : 'capFloodEmpty', { vip: D(L.VIP) });
        if (s.takers.length > 1) { add('capFloodTie'); break; }
        var o = R(s, s.takers[0] === 'R1' ? 'R2' : 'R1'), tkr = R(s, s.takers[0]);
        if (!o.up) add('capFloodDown');
        else if (o.heard === 'lost') add('capFloodCut', { o: D(o.id) });
        else if (o.heard === 'stepdown') add('capFloodStepdown', { o: D(o.id), p: D(tkr.prio) });
        else add('capFloodReset', { o: D(o.id), p: D(tkr.prio) });
        break;
      }
      case 'flap':
        add('capFlap', { t: B(sec(s.t, adv)), m: D(M.id), port: B(M.port) });
        break;
      case 'frame':
        add('capFrame', { far: D(L.FAR), mac: D(L.VMAC), port: B(s.switchMac[L.VMAC]), r: D(s.frame.via) });
        break;
      case 'summary': {
        var lost = B(sec(s.lost, adv));
        if (s.event === 'fail') {
          if (s.m !== 'R1') add('capSumBackup');
          else add(adv === 10 ? 'capSumFailFast' : 'capSumFail', { lost: lost });
        } else if (s.event === 'restore') add(R(s, 'R1').state === 'master' ? 'capSumBack' : 'capSumStay');
        else if (s.event === 'shutdown') {
          if (s.m !== 'R1') add('capShutdownBackup');
          else add('capSumShutdown', { lost: lost, mdi: D(sec(L.downInterval(R(s, 'R2').prio, adv), adv)) });
        } else if (s.event === 'start') {
          if (R(s, 'R1').prio === R(s, 'R2').prio) add('capSumTie');
          else { var w = s.routers.filter(function (r) { return r.state === 'master'; })[0]; add('capSumStart', { m: D(w.id), p: D(w.prio) }); }
        } else if (s.event === 'cut') add('capSumCut');
        break;
      }
    }
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'event', type: 'select', label: t('event'), resets: true,
        options: [['fail', t('evFail')], ['restore', t('evRestore')], ['shutdown', t('evShutdown')], ['start', t('evStart')], ['cut', t('evCut')]] },
      { key: 'prioR1', type: 'range', label: t('prioR1'), min: 1, max: 254, step: 1, resets: true },
      { key: 'prioR2', type: 'range', label: t('prioR2'), min: 1, max: 254, step: 1, resets: true },
      { key: 'preempt', type: 'toggle', label: t('preempt'), resets: true },
      { key: 'advInterval', type: 'choice', label: t('advInterval'), options: [[100, t('adv1')], [10, t('adv01')]], resets: true }
    ],

    presets: [
      { id: 'master-fails', label: t('presetFails'), params: { event: 'fail' }, hint: t('presetFailsHint') },
      { id: 'preempt-back', label: t('presetBack'), params: { event: 'restore' } },
      { id: 'no-preempt', label: t('presetNoPreempt'), params: { event: 'restore', preempt: false } },
      { id: 'tie', label: t('presetTie'), params: { event: 'start', prioR1: 100, prioR2: 100 }, hint: t('presetTieHint') },
      { id: 'clean-shutdown', label: t('presetShutdown'), params: { event: 'shutdown' } },
      { id: 'fast-adverts', label: t('presetFast'), params: { event: 'fail', advInterval: 10 } },
      { id: 'split', label: t('presetSplit'), params: { event: 'cut' }, hint: t('presetSplitHint') }
    ],

    legend: [
      { shape: 'bar', label: t('legTimer') },
      { shape: 'line', label: t('legAdvert') },
      { shape: 'dash', label: t('legGarp') },
      { shape: 'vip', label: t('legVip') },
      { shape: 'lost', label: t('legLost') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'vr' },
        h('div', { class: 'vr-top' }, renderClock(c), renderFrame(c)),
        renderTopo(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
