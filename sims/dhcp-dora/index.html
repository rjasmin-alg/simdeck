<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHCP: DORA</title>
<style>
  /* Placeholder only: the real look comes from the kit. */
  body { font: 24px/1.4 system-ui, sans-serif; margin: 2rem; }
  .step { font-size: 40px; margin: 2rem 0; }
</style>
</head>
<body>
<a id="back" href="../../index.html">← simdeck</a>
<h1 id="title"></h1>
<p>Korak <span id="n">0</span> / <span id="total"></span></p>
<p class="step" id="text">Pritisni → za prvi korak.</p>
<p>→ / PgDn naprijed · ← / PgUp natrag · Home ili R ispočetka</p>
<script src="steps.js"></script>
<script>
  // Placeholder stepper. The kit's controller replaces all of this; only the meta read stays.
  const meta = JSON.parse(document.getElementById('simdeck-meta')?.textContent ?? '{}');
  const STEPS = window.DORA_STEPS;
  let n = 0;
  document.getElementById('title').textContent = meta.title ?? document.title;
  document.getElementById('total').textContent = STEPS.length;
  const show = () => {
    document.getElementById('n').textContent = n;
    document.getElementById('text').textContent = n ? STEPS[n - 1] : 'Pritisni → za prvi korak.';
  };
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') n = Math.min(n + 1, STEPS.length);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') n = Math.max(n - 1, 0);
    else if (e.key === 'Home' || e.key === 'r' || e.key === 'R') n = 0;
    else return;
    e.preventDefault();
    show();
  });
  show();
</script>
</body>
</html>
