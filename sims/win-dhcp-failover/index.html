    var s = c.state;
    var k = !L.isFailover(s) ? 'none' : L.server(s, 'DHCP1').up && L.server(s, 'DHCP2').up ? 'up' : 'down';
    return h('div', { class: 'fo-link', dataset: { k: k } },
      h('div', { class: 'fo-wire' }, k === 'down' ? h('span', { class: 'fo-cut', 'aria-hidden': 'true', translate: 'no' }, '✕') : null),
      h('span', { class: 'fo-sub' }, t(k === 'up' ? 'linkUp' : k === 'down' ? 'linkDown' : 'linkNone')));
  }
  function renderServers(c) {
    return h('div', { class: 'fo-servers' }, renderServer(c, 'DHCP1'), renderLink(c), renderServer(c, 'DHCP2'));
  }

  // ── clients ──
  function sig(co) { return co ? [co.phase, co.server, co.expires].join('|') : 'off'; }
  function renderClients(c) {
    var s = c.state, lb = s.mode === 'loadBalance';
    var head = ['colClient'].concat(lb ? ['colBucket'] : []).concat(['colAddr', 'colFrom', 'colUntil', 'colState']);
    var rows = L.NAMED.map(function (x) {
      var co = L.named(s, x.name), pco = c.prev ? L.named(c.prev, x.name) : co;
      var ph = co ? co.phase : 'off';
      var has = co && co.octets && co.octets.length;
      var changed = c.n > 0 && sig(co) !== sig(pco);
      var cells = [h('td', null, data(x.name, ''))];
      if (lb) cells.push(h('td', null, data(x.bucket), ' ', h('span', { class: 'fo-sub' }, '→ ', data(L.bucketOwner(x.bucket, s.share).slice(-1), ''))));
      cells.push(h('td', null, has ? data(L.ip(co.octets[0])) : h('span', { class: 'fo-sub' }, '—')));
      cells.push(h('td', null, has && co.server ? tag(co.server) : h('span', { class: 'fo-sub' }, '—')));
      cells.push(h('td', null, has && co.expires !== null ? data(hms(co.expires)) : h('span', { class: 'fo-sub' }, '—')));
      cells.push(h('td', null, t(PHASE[ph])));
      return h('tr', { class: changed ? 'sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : null, dataset: { ph: ph } }, cells);
    });
    var table = h('table', { class: 'fo-table' },
      h('thead', null, h('tr', null, head.map(function (k) { return h('th', null, t(k)); }))),
      h('tbody', null, rows));
    return h('section', { class: 'fo-box fo-clients' }, h('h2', null, t('clientsTitle')), table, agg(c, 'others'), agg(c, 'new'));
  }
  /** One line per unnamed group: how many hold an address from each server, how many wait. */
  function aggOf(s, kind) {
    var out = { DHCP1: 0, DHCP2: 0, wait: 0, n: 0, until: null };
    s.cohorts.forEach(function (co) {
      if (co.kind !== kind) return;
      out.n += co.n;
      if (co.phase === 'waiting' || co.phase === 'init') out.wait += co.n;
      else { out[co.server] += co.n; if (out.until === null || co.expires < out.until) out.until = co.expires; }
    });
    return out;
  }
  function agg(c, kind) {
    var s = c.state, a = aggOf(s, kind), pa = c.prev ? aggOf(c.prev, kind) : a;
    var changed = c.n > 0 && JSON.stringify(a) !== JSON.stringify(pa);
    var label = h('b', null, t(kind === 'others' ? 'aggOthers' : 'aggNew'));
    if (!a.n) {
      var expected = kind === 'others' ? L.OTHERS[s.mode] : s.newClients;
      if (!expected) return null;
      return h('div', { class: 'fo-agg' }, label, data('×' + expected, ''), h('span', { class: 'fo-sub' }, t('aggNone')));
    }
    var bits = [label, data('×' + a.n, '')];
    L.SERVERS.forEach(function (id) { if (a[id]) bits.push(h('span', { class: 'fo-tag' }, mark(id), data(a[id], ''))); });
    if (a.wait) bits.push(h('span', null, t('aggWait'), ' ', q(a.wait)));
    if (a.until !== null) bits.push(h('span', { class: 'fo-sub' }, t('colUntil'), ' ', data(hms(a.until), '')));
    return h('div', { class: 'fo-agg' + (changed ? ' sd-changed' : '') }, bits);
  }

  // ── chart ──
  function lanes(c) {
    var s = c.state, e = last(c), b = L.bound(s);
    var act = {};
    if (e) e.items.forEach(function (x) {
      if (x.server) act[x.server] = true;
      if (x.from) { act[x.from] = true; act[x.to] = true; }
      if (x.k === 'discover' || x.k === 'renew' || x.k === 'rebind') act.C = true;
      if (x.served) Object.keys(x.served).forEach(function (k) { act[k] = true; });
    });
    var out = [{ id: 'C', mark: 'C', c: COLOUR.C, shape: 'square', name: t('laneClients'), state: act.C ? 'active' : null,
      body: [h('div', { class: 'fo-line' }, t('laneBound'), q(b.DHCP1 + b.DHCP2)), h('div', { class: 'fo-line' }, t('laneWaiting'), q(b.waiting))] }];
    L.SERVERS.forEach(function (id) {
      var x = L.server(s, id);
      out.push({ id: id, mark: id.slice(-1), c: COLOUR[id], name: data(id, ''), state: !x.up ? 'down' : act[id] ? 'active' : null,
        tags: badge(x),
        body: [h('div', { class: 'fo-line' }, t('laneFree'), q(x.up ? L.freeFor(s, id) : 0)), h('div', { class: 'fo-line fo-sub' }, ' ')] });
    });
    return out;
  }
  function cnt(n, len) { return data('×' + n + (len ? ' · ' + dur(len) : ''), ''); }
  function chart(c) {
    var s = c.state, out = [], timers = [];
    var downFrom = null, pdRow = null, pdEnd = null;
    s.msgs.forEach(function (e) {
      var ch = e.n === c.n, time = hms(e.t);
      var down = downFrom !== null ? ['DHCP1'] : [];
      if (e.folded) {
        var f = e.folded;
        out.push({ kind: 'note', lane: 'C', k: 'solid', changed: ch, down: down, time: hms(f.times[0]) + '–',
          text: [data('↻ ', ''), t('noteFolded'), ' ', data('×' + f.times.length + ' · ' + dur(f.len), '')] });
      }
      e.items.forEach(function (x) {
        var row;
        if (x.k === 'state') {
          if (x.what === 'down') { out.push({ kind: 'note', lane: 'DHCP1', text: t('noteDown'), k: 'fill', time: time, changed: ch, down: down }); downFrom = e.n; }
          else if (x.what === 'commInt') out.push({ kind: 'note', lane: 'DHCP2', text: data('COMM-INT', ''), k: 'solid', time: time, changed: ch, down: down });
          else if (x.what === 'pd') { pdRow = out.length; out.push({ kind: 'note', lane: 'DHCP2', text: data('PARTNER DOWN', ''), k: 'solid', time: time, cause: t(x.by === 'admin' ? 'causeAdmin' : 'causeAuto'), changed: ch, down: down }); }
          else if (x.what === 'takeover') { pdEnd = out.length; out.push({ kind: 'note', lane: 'DHCP2', text: t('noteTakeover'), k: 'solid', time: time, cause: data('MCLT', ''), changed: ch, down: down }); }
          return;
        }
        if (x.k === 'bnd') {
          out.push({ from: x.from, to: x.to, label: 'BNDUPD', c: COLOUR[x.from], fields: cnt(x.n), time: time, changed: ch, down: down });
          out.push({ from: x.to, to: x.from, label: 'BNDACK', c: COLOUR[x.to], weight: 'thin', time: time, changed: ch, down: down });
          return;
        }
        if (x.k === 'renew') {
          row = { from: 'C', to: x.server, label: 'REQUEST', c: COLOUR.C, fields: cnt(x.n), time: time, cause: data('T1', ''), changed: ch, down: down };
          if (x.lost) { row.lost = [x.server]; row.re = {}; row.re[x.server] = t('reDown'); }
          out.push(row);
          if (!x.lost) out.push({ from: x.server, to: 'C', label: 'ACK', c: COLOUR[x.server], fields: cnt(x.n, x.len), time: time, changed: ch, down: down });
          return;
        }
        var to = ['DHCP1', 'DHCP2'];
        if (x.k === 'rebind') {
          row = { from: 'C', to: to, label: 'REQUEST', c: COLOUR.C, line: 'dashed', fields: cnt(x.n), time: time, cause: data('T2', ''), changed: ch, down: down, lost: x.lost.slice() };
          // a broadcast: the down lane has its ✕ and dotted lifeline; a word only where a server that is up stays silent
          var re = {};
          x.silent.forEach(function (id) { re[id] = t('reSilent'); });
          if (Object.keys(re).length) row.re = re;
          out.push(row);
          Object.keys(x.served).forEach(function (id) { out.push({ from: id, to: 'C', label: 'ACK', c: COLOUR[id], line: 'dashed', fields: cnt(x.served[id].n, x.served[id].len), time: time, changed: ch, down: down }); });
          if (x.none.n) out.push({ kind: 'note', lane: 'C', text: [t('phRebinding'), ' ', data('×' + x.none.n, '')], k: 'solid', time: time, changed: ch, down: down });
          return;
        }
        if (x.k === 'discover') {
          var lost = to.filter(function (id) { return x.to.indexOf(id) < 0; });
          row = { from: 'C', to: to, label: 'DISCOVER', c: COLOUR.C, line: 'dashed', fields: cnt(x.n), time: time, changed: ch, down: down, lost: lost };
          if (x.why !== 'arrive') row.cause = t(x.why === 'retry' ? 'causeRetry' : 'causeExpiry');
          var re2 = {};
          Object.keys(x.full).forEach(function (id) { re2[id] = t('reEmpty'); });
          if (Object.keys(re2).length) row.re = re2;
          out.push(row);
          Object.keys(x.served).forEach(function (id) { out.push({ from: id, to: 'C', label: 'ACK', c: COLOUR[id], line: 'dashed', fields: cnt(x.served[id].n, x.served[id].len), time: time, changed: ch, down: down }); });
          if (x.none.n) out.push({ kind: 'note', lane: 'C', text: [t('noteNone'), ' ', data('×' + x.none.n, '')], k: 'fill', time: time, changed: ch, down: down });
        }
      });
    });
    if (pdRow !== null) {
      var tm = { lane: 'DHCP2', from: pdRow, label: data('MCLT ' + dur(s.mclt), '') };
      if (pdEnd !== null) { tm.to = pdEnd; tm.end = 'stopped'; }
      timers.push(tm);
    }
    return { rows: out, timers: timers };
  }
  function renderChart(c) {
    var ch = chart(c);
    return Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(c),
      rows: ch.rows,
      timers: ch.timers,
      timeWidth: '6.6rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = c.params;
    if (c.first) {
      var n0 = L.NAMED.length + L.OTHERS[s.mode];
      if (s.mode === 'loadBalance') return rich('capStart_loadBalance', { a: q(s.share), b: q(100 - s.share), fa: q(s.pools.A.length), fb: q(s.pools.B.length), n: q(n0) });
      if (s.mode === 'hotStandby') return rich('capStart_hotStandby', { r: q(s.pools.B.length), pct: q(s.reserve), n: q(n0) });
      return rich('capStart_splitScope', { n: q(n0) });
    }
    var e = last(c), out = rich('capAt', { n: c.n, time: q(hms(e.t)) });
    function add(key, vars) { out.push(' '); out = out.concat(rich(key, vars)); }
    var b = L.server(s, 'DHCP2');
    if (e.folded) {
      var f = e.folded;
      var times = f.times.length > 3 ? hms(f.times[0]) + ' … ' + hms(f.times[f.times.length - 1]) : f.times.map(hms).join(', ');
      add('sFolded', { times: q(times), srv: q(f.by.join(', ')), len: q(dur(f.len)) });
      var servedNow = e.items.some(function (x) { return x.k === 'discover' && x.why === 'retry' && Object.keys(x.served).length; });
      if (f.retry && !servedNow) add('sFoldedRetry');
    }
    var bndTotal = 0, bndFrom = [];
    e.items.forEach(function (x) {
      if (x.k === 'state') {
        if (x.what === 'down') { add('sDown'); if (!L.isFailover(s)) add('sSplitDown'); }
        else if (x.what === 'commInt') { add('sCommInt'); if (x.switchAt !== null) add('sSwitchAt', { when: q(hms(x.switchAt)) }); else add('sNoSwitch'); }
        else if (x.what === 'pd') {
          if (x.by === 'admin') add('sPdAdmin', { mclt: q(dur(s.mclt)), until: q(hms(x.until)) });
          else add('sPdAuto', { sw: q(dur(s.switchover)), mclt: q(dur(s.mclt)), until: q(hms(x.until)) });
        } else if (x.what === 'takeover') add('sTakeover', { pd: q(hms(x.pdAt)), now: q(hms(e.t)) });
        return;
      }
      if (x.k === 'bnd') { bndTotal += x.n; bndFrom.push(x.from); return; }
      if (x.k === 'renew') {
        if (x.lost) add('sRenewLost', { n: x.n, srv: q(x.server) });
        else if (!L.isFailover(s)) add('sRenewSplit', { n: x.n, srv: q(x.server), len: q(dur(x.len)) });
        else if (x.len === L.LEASE) add('sRenewFull', { n: x.n, srv: q(x.server), len: q(dur(x.len)) });
        else add('sRenewMclt', { n: x.n, srv: q(x.server), len: q(dur(x.len)) });
        return;
      }
      if (x.k === 'rebind') {
        var by = Object.keys(x.served);
        // a rebind follows a lost renewal, so one server is down (rule 9's both-up case is never reached here)
        if (!by.length) add(L.isFailover(s) ? 'sRebindNone' : 'sRebindSplit', { n: x.n });
        else if (b.state === 'partnerDown') add('sRebindPd', { n: x.n, len: q(dur(x.served[by[0]].len)) });
        else add('sRebindTask', { n: x.n, len: q(dur(x.served[by[0]].len)) });
        return;
      }
      if (x.k === 'discover') {
        add(x.why === 'arrive' ? 'sHeadArrive' : x.why === 'retry' ? 'sHeadRetry' : 'sHeadExpired', { n: x.n });
        var sv = x.served, ids = Object.keys(sv);
        var both = L.isFailover(s) && x.to.length === 2;
        if (ids.length) {
          if (!L.isFailover(s)) {
            if (ids[0] === 'DHCP1') add('sSplit1', { n: q(sv.DHCP1.n), len: q(dur(sv.DHCP1.len)) });
            else add('sSplit2', { n: sv.DHCP2.n });
          } else if (both && s.mode === 'loadBalance') add('sHash', { a: q(sv.DHCP1 ? sv.DHCP1.n : 0), b: q(sv.DHCP2 ? sv.DHCP2.n : 0), len: q(dur(s.mclt)) });
          else if (both) add('sActive', { n: q(sv.DHCP1 ? sv.DHCP1.n : 0), len: q(dur(s.mclt)) });
          else add('sSurvivor', { srv: q(ids[0]), n: sv[ids[0]].n, len: q(dur(sv[ids[0]].len)) });
        }
        if (x.none.n) add(x.to.length ? 'sNone' : 'sNoServer', { n: x.none.n });
      }
    });
    if (bndFrom.length > 1) add('sBnd', { n: q(L.known(s, 'DHCP1').own + L.known(s, 'DHCP1').partner) });
    else if (bndFrom.length) add('sBndOne', { n: bndTotal, from: q(bndFrom[0]), to: q(bndFrom[0] === 'DHCP1' ? 'DHCP2' : 'DHCP1') });
    if (c.last) {
      var a1 = L.server(s, 'DHCP1');
      var waiting = L.bound(s).waiting;
      if (a1.up && p.failAt < 0) add('sHintFail');
      else if (L.isFailover(s) && b.state === 'commInt') { if (waiting) add('sHintWait'); add('sHintPd'); }
    }
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('pMode'), resets: true,
        options: [['loadBalance', t('optLB')], ['hotStandby', t('optHS')], ['splitScope', t('optSplit')]] },
      { key: 'share', type: 'range', label: t('pShare'), min: 10, max: 90, step: 10, unit: '%', resets: true,
        visible: function (p) { return p.mode !== 'hotStandby'; },
        disabled: function (p) { return p.mode === 'splitScope' ? t('pNoSwitch') : false; } },
      { key: 'reserve', type: 'range', label: t('pReserve'), min: 1, max: 20, step: 1, unit: '%', resets: true,
        visible: function (p) { return p.mode === 'hotStandby'; } },
      { key: 'mclt', type: 'choice', label: t('pMclt'), resets: true,
        options: [[15, t('opt15')], [60, t('opt60')], [240, t('opt240')]],
        disabled: function (p) { return p.mode === 'splitScope' ? t('pNoMclt') : false; } },
      { key: 'switchover', type: 'choice', label: t('pSwitch'), resets: true,
        options: [[0, t('optByHand')], [60, t('optAfter60')]],
        disabled: function (p) { return p.mode === 'splitScope' ? t('pNoSwitch') : false; } },
      { key: 'newClients', type: 'range', label: t('pNew'), min: 0, max: 60, step: 1, resets: true },
      // failAt and pdAt (in the model's defaults, no control of their own): the step after which the action lands
      { type: 'button', label: t('bFail'), hint: t('bFailHint'), key: 'd',
        disabled: function (p) { return p.failAt >= 0 ? t('bFailDone') : false; },
        run: function (sim) { if (sim.params.failAt < 0) sim.set({ failAt: sim.n }, { preset: sim.preset }); } },
      { type: 'button', label: t('bPd'), hint: t('bPdHint'), key: 'p',
        disabled: function (p) { return p.mode === 'splitScope' ? t('bPdSplit') : p.failAt < 0 ? t('bPdFirst') : p.pdAt >= 0 ? t('bPdDone') : false; },
        run: function (sim) { var p = sim.params; if (p.mode !== 'splitScope' && p.failAt >= 0 && p.pdAt < 0) sim.set({ pdAt: sim.n }, { preset: sim.preset }); } }
    ],

    presets: [
      { id: 'lb-normal', label: t('presetNormal'), hint: t('presetNormalHint'), params: {} },
      { id: 'lb-interrupted', label: t('presetInterrupted'), hint: t('presetInterruptedHint'), params: { failAt: 2 } },
      { id: 'lb-partner-down', label: t('presetPartnerDown'), hint: t('presetPartnerDownHint'), params: { failAt: 2, pdAt: 4, newClients: 60 } },
      { id: 'hs-reserve-runs-out', label: t('presetReserve'), hint: t('presetReserveHint'), params: { mode: 'hotStandby', failAt: 2, newClients: 12 } },
      { id: 'split-80-20', label: t('presetSplit'), hint: t('presetSplitHint'), params: { mode: 'splitScope', failAt: 1, newClients: 0 } }
    ],

    legend: [
      { shape: 'st-normal', label: t('legNormal') },
      { shape: 'st-commint', label: t('legCommInt') },
      { shape: 'st-pd', label: t('legPd') },
      { c: 3, label: t('legOwn') },
      { shape: 'partner', label: t('legPartner') },
      { shape: 'dash', label: t('legBroadcast') },
      { shape: 'line', label: t('legUnicast') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var ch = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'fo' },
        h('div', { class: 'fo-left' }, h('section', { class: 'fo-box' }, renderTop(c)), renderServers(c), renderClients(c)), ch));
      ch.fit();
    },

    caption: caption
  });
})();
</script>
</body>
