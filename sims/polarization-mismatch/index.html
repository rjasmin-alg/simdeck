<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var D2R = Math.PI / 180;
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function deg(v) { return t('deg', { v: num(v, Math.abs(v - Math.round(v)) < 1e-9 ? 0 : 1) }); }
  function pct(v) { var q = Math.abs(v * 100); return t('pctVal', { v: num(v * 100, q > 0 && q < 9.95 ? 1 : 0) }); }
  function dB(v) { return v === null ? t('dbNone') : t('dbVal', { v: num(v, Math.abs(v) < 100 ? 2 : 1) }); }
  function desc(d) {
    if (d.kind === 'lin') return t('d_lin', { tilt: deg(d.tilt) });
    if (d.kind === 'circ') return t(d.sense > 0 ? 'd_circ_r' : 'd_circ_l');
    return t(d.sense > 0 ? 'd_ell_r' : 'd_ell_l', { tilt: deg(d.tilt), ar: dB(d.arDb) });
  }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    (function add(list) {
      for (var i = 0; i < list.length; i++) {
        if (Array.isArray(list[i])) add(list[i]);
        else if (list[i] != null) e.append(list[i]);
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function arrowHead(x, y, ux, uy, size, cls) {
    var hw = 0.55 * size;
    return s('polygon', { class: cls, points: pts([
      [x, y], [x - ux * size - uy * hw, y - uy * size + ux * hw], [x - ux * size + uy * hw, y - uy * size - ux * hw]]) });
  }
  function add3(a, b, k) { return [a[0] + b[0] * k, a[1] + b[1] * k, a[2] + b[2] * k]; }
  function comb(u, a, v, b) { return [u[0] * a + v[0] * b, u[1] * a + v[1] * b, u[2] * a + v[2] * b]; }
  function tiltOf(type, rot) { return L.BASE[type] + rot; }

  // ── the path in an oblique view: x right (Tx → Rx), z up, y (across) receding up and to the right ──
  var ZH = 0.5 * Math.tan(L.BETA * D2R);               // antenna height; the bounce legs meet the surface at x = ½
  var HW = 0.13, AMP = 0.17, LR = 0.09;                // half a wire, wave amplitude, loop radius (world)
  var KY = 0.5, GY = 35 * D2R;                         // cabinet projection of y: half length, 35° up
  function view(W, H) {
    var x0 = -0.32, x1 = 1.45, z0 = -0.2, z1 = ZH + 0.34;
    var sc = Math.min(W / (x1 - x0), H / (z1 - z0));
    var ox = (W - (x1 - x0) * sc) / 2 - x0 * sc, oy = H - (H - (z1 - z0) * sc) / 2 + z0 * sc;
    return { sc: sc, P: function (p) { return [ox + sc * (p[0] + KY * p[1] * Math.cos(GY)), oy - sc * (p[2] + KY * p[1] * Math.sin(GY))]; } };
  }
  function base(path, f) {
    if (path !== 'bounce') return [f, 0, ZH];
    return [f, 0, ZH * Math.abs(1 - 2 * f)];
  }

  /** An antenna in 3-D at c, in the frame fr of its leg: a wire, crossed wires or a ring. */
  function antenna(svg, P, c, fr, type, rot, sending, r0, narrow) {
    var tau = tiltOf(type, rot), u = comb(L.H, Math.cos(tau * D2R), fr.v, Math.sin(tau * D2R));
    function wire(dir) {
      var a = P(add3(c, dir, -HW)), b = P(add3(c, dir, HW));
      svg.append(s('line', { class: 'pm-wirehalo', x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
      svg.append(s('line', { class: 'pm-wire', x1: a[0], y1: a[1], x2: b[0], y2: b[1] }));
    }
    if (type === 'loop') {
      var ring = [];
      for (var a = 0; a <= 360; a += 10) ring.push(P(add3(add3(c, fr.k, LR * Math.cos(a * D2R)), u, LR * Math.sin(a * D2R))));
      svg.append(s('polyline', { class: 'pm-wirehalo', points: pts(ring) }));
      svg.append(s('polyline', { class: 'pm-wire', points: pts(ring) }));
    } else if (L.isCirc(type)) {
      wire(u);
      wire(comb(L.H, Math.cos((tau + 90) * D2R), fr.v, Math.sin((tau + 90) * D2R)));
      var lp = P(add3(add3(c, u, HW * 0.75), comb(L.H, Math.cos((tau + 90) * D2R), fr.v, Math.sin((tau + 90) * D2R)), HW * 0.75));
      if (!narrow) svg.append(s('text', { class: 'pm-halo', x: lp[0] + 0.3 * r0, y: lp[1] - 0.2 * r0 }, t('ninety')));
    } else {
      wire(u);
    }
    var pc = P(type === 'loop' ? add3(c, u, LR) : c);
    svg.append(s('circle', { class: sending ? 'pm-send' : 'pm-feed', cx: pc[0], cy: pc[1], r: 0.42 * r0 }));
  }

  function drawPicture(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), v = view(W, H), P = v.P, sc = v.sc, path = st.path;
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var narrow = W <= 30 * r0;

    if (path === 'bounce') {             // the conducting surface, z = 0
      var g = [[-0.15, -0.35], [1.15, -0.35], [1.15, 0.35], [-0.15, 0.35]].map(function (q) { return P([q[0], q[1], 0]); });
      svg.append(s('polygon', { class: 'pm-ground', points: pts(g) }));
      var gl = P([-0.15, -0.35, 0]);
      svg.append(s('text', { class: 'pm-mute', x: gl[0] + 0.3 * r0, y: gl[1] + 1.3 * r0 }, t('surface')));
    }
    if (path === 'iono') {               // the stretch inside the ionosphere
      var a0 = P([L.IONO[0], 0, ZH - 0.25]), a1 = P([L.IONO[1], 0, ZH + 0.25]);
      svg.append(s('rect', { class: 'pm-ionob', x: a0[0], y: a1[1], width: a1[0] - a0[0], height: a0[1] - a1[1] }));
      svg.append(s('text', { class: 'pm-halo pm-title', x: (a0[0] + a1[0]) / 2, y: a1[1] - 0.5 * r0, 'text-anchor': 'middle' }, t('iono', { v: deg(st.om) })));
    }

    // the path
    var sight = [0, 0.5, 1].map(function (f) { return P(base(path, f)); });
    svg.append(s('polyline', { class: 'pm-sight', points: pts(sight) }));
    if (path === 'bounce') {
      var bp = P(base(path, 0.5));
      svg.append(s('circle', { class: 'pm-bouncept', cx: bp[0], cy: bp[1], r: 0.4 * r0 }));
      if (!narrow) svg.append(s('text', { class: 'pm-halo pm-title', x: bp[0], y: bp[1] - 1.0 * r0 - AMP * sc, 'text-anchor': 'middle' }, t('bounceNote')));
    }

    // the wave: E sticks along the path, the curve through their tips (a helix for a circle)
    var n = 12 * L.WAVES, tips = [];
    for (var i = 0; i <= n; i++) {
      var f = 0.1 + 0.8 * i / n, fa = L.fieldAt(st, f, st.t), fr = L.leg(path, fa.leg), b3 = base(path, f);
      var tip3 = add3(b3, comb(L.H, fa.h, fr.v, fa.v), AMP), pb = P(b3), pt = P(tip3);
      if (path === 'bounce' && i > 0 && fa.leg === 2 && L.fieldAt(st, 0.1 + 0.8 * (i - 1) / n, st.t).leg === 1) {
        svg.append(s('polyline', { class: 'pm-curve', points: pts(tips) })); tips = [];
      }
      tips.push(pt);
      var len = Math.hypot(fa.h, fa.v);
      if (len > 0.02) svg.append(s('line', { class: 'pm-stick', x1: pb[0], y1: pb[1], x2: pt[0], y2: pt[1] }));
      if (i % 3 === 0 && len > 0.45) {
        var dx = pt[0] - pb[0], dy = pt[1] - pb[1], nn = Math.hypot(dx, dy);
        if (nn > 0.5 * r0) svg.append(arrowHead(pt[0], pt[1], dx / nn, dy / nn, 0.5 * r0, 'pm-head'));
      }
    }
    svg.append(s('polyline', { class: 'pm-curve', points: pts(tips) }));
    // the direction of travel, near Rx
    var m0 = P(base(path, 0.9)), m1 = P(base(path, 0.95)), md = Math.hypot(m1[0] - m0[0], m1[1] - m0[1]) || 1;
    svg.append(arrowHead(m1[0], m1[1], (m1[0] - m0[0]) / md, (m1[1] - m0[1]) / md, 0.85 * r0, 'pm-inkhead'));

    // the two antennas
    var cT = base(path, 0), cR = base(path, 1);
    antenna(svg, P, cT, L.leg(path, 1), st.tx, st.txRot, true, r0, narrow);
    antenna(svg, P, cR, L.leg(path, 2), st.rx, st.rxRot, false, r0, narrow);
    var pT = P(cT), pR = P(cR), off = HW * sc + 0.9 * r0;
    // a phone: names under the antennas, centred; else Tx's to its left and Rx's to its right
    var txX = narrow ? Math.max(2.5 * r0, pT[0]) : pT[0] - off, txY = narrow ? pT[1] + HW * sc + 1.6 * r0 : pT[1] + 0.5 * r0;
    svg.append(s('text', { class: 'pm-halo pm-big', x: txX, y: txY, 'text-anchor': narrow ? 'middle' : 'end' }, t('nameTx')));
    svg.append(s('text', { class: 'pm-halo', x: txX, y: txY + 1.4 * r0, 'text-anchor': narrow ? 'middle' : 'end' }, t('roleSend')));
    var rxX = narrow ? Math.min(W - 3.5 * r0, pR[0]) : pR[0] + off, rxA = narrow ? 'middle' : 'start', rxY = narrow ? pR[1] + HW * sc + 1.6 * r0 : pR[1] - 0.6 * r0;
    if (!narrow && rxX + 6 * r0 > W) { rxX = pR[0] - off; rxA = 'end'; }
    svg.append(s('text', { class: 'pm-halo pm-big', x: rxX, y: rxY, 'text-anchor': rxA }, t('nameRx')));
    svg.append(s('text', { class: 'pm-halo', x: rxX, y: rxY + 1.4 * r0, 'text-anchor': rxA }, t('roleRecv')));
    svg.append(s('text', { class: 'pm-halo pm-title', x: rxX, y: rxY + 2.8 * r0, 'text-anchor': rxA }, t('voltNow', { v: num(st.uNow * 100, 0) })));

    svg.append(s('text', { class: 'pm-halo pm-mute', x: W - 0.5 * r0, y: H - 0.6 * r0, 'text-anchor': 'end' }, t('scaleNote')));
    box.replaceChildren(svg);
  }

  // ── the two views from behind the wave: up = v, right = h ──
  function drawView(box, st, side) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var top = 1.8 * r0, Rv = Math.max(2 * r0, Math.min((H - top - 1.6 * r0) / 2, W / 2 - 1.2 * r0)), cx = W / 2, cy = top + 0.3 * r0 + Rv;
    function at(hh, vv, k) { return [cx + hh * k, cy - vv * k]; }
    function dir(tau, k) { return at(Math.cos(tau * D2R), Math.sin(tau * D2R), k); }
    svg.append(s('text', { class: 'pm-title', x: 0.2 * r0, y: 1.2 * r0 }, t(side === 'tx' ? 'viewTx' : 'viewRx')));
    svg.append(s('circle', { class: 'pm-ring', cx: cx, cy: cy, r: Rv }));
    svg.append(s('line', { class: 'pm-ref', x1: cx, y1: cy - Rv, x2: cx, y2: cy + Rv }));
    svg.append(s('line', { class: 'pm-ref', x1: cx - Rv, y1: cy, x2: cx + Rv, y2: cy }));
    svg.append(s('text', { class: 'pm-mute', x: cx - 0.3 * r0, y: cy - Rv + 1.0 * r0, 'text-anchor': 'end' }, t('viewUp')));
    svg.append(s('text', { class: 'pm-mute', x: cx + Rv - 0.2 * r0, y: cy - 0.4 * r0, 'text-anchor': 'end' }, t('viewRight')));

    var type = side === 'tx' ? st.tx : st.rx, rot = side === 'tx' ? st.txRot : st.rxRot, tau = tiltOf(type, rot);
    // the antenna, seen along the path
    if (L.isCirc(type)) {
      [tau, tau + 90].forEach(function (a) { var p = dir(a, -0.92 * Rv), q = dir(a, 0.92 * Rv); svg.append(s('line', { class: 'pm-rthin', x1: p[0], y1: p[1], x2: q[0], y2: q[1] })); });
      if (side === 'rx') {                // the wave it takes in full: a circle with its sense
        var rr = 0.62 * Rv, sg = st.rxPol.sense;
        svg.append(s('circle', { class: 'pm-rcirc', cx: cx, cy: cy, r: rr }));
        var ang = 45 * D2R, px = cx + rr * Math.cos(ang), py = cy - rr * Math.sin(ang);
        // right-hand turns clockwise in this view: the tangent at angle a, clockwise, is (sin a, cos a) on screen
        var ux = sg > 0 ? Math.sin(ang) : -Math.sin(ang), uy = sg > 0 ? Math.cos(ang) : -Math.cos(ang);
        svg.append(arrowHead(px + ux * 0.6 * r0, py + uy * 0.6 * r0, ux, uy, 1.1 * r0, 'pm-inkhead'));
      }
    } else {
      var w1 = dir(tau, -0.92 * Rv), w2 = dir(tau, 0.92 * Rv);
      svg.append(s('line', { class: side === 'rx' ? 'pm-rwire' : 'pm-rthin', x1: w1[0], y1: w1[1], x2: w2[0], y2: w2[1] }));
      if (type === 'loop') {
        svg.append(s('ellipse', { class: 'pm-rthin', cx: cx, cy: cy, rx: 0.45 * Rv, ry: 0.12 * Rv, transform: 'rotate(' + (-tau) + ' ' + cx + ' ' + cy + ')' }));
      }
    }

    // the wave: its ellipse (dashed), its sense, the field now
    var e = side === 'tx' ? st.eTx : st.eArr, pol = side === 'tx' ? st.txPol : st.arrPol, K = 0.85 * Rv, ell = [];
    for (var a = 0; a <= 360; a += 6) { var q = L.instant2(e, a); ell.push(at(q[0], q[1], K)); }
    svg.append(s('polyline', { class: 'pm-ell', points: pts(ell) }));
    if (pol.kind !== 'lin') {                         // the sense: where the tip goes as time runs
      var q0 = L.instant2(e, st.t + 60), q1 = L.instant2(e, st.t + 70);
      var p0 = at(q0[0], q0[1], K), p1 = at(q1[0], q1[1], K), dn = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1;
      svg.append(arrowHead(p1[0], p1[1], (p1[0] - p0[0]) / dn, (p1[1] - p0[1]) / dn, 1.0 * r0, 'pm-head'));
    }
    var now = side === 'tx' ? st.eTxNow : st.eNow, tip = at(now[0], now[1], K), nl = Math.hypot(now[0], now[1]) * K;
    if (nl > 0.08 * Rv) {
      svg.append(s('line', { class: 'pm-earrow', x1: cx, y1: cy, x2: tip[0], y2: tip[1] }));
      var ex = (tip[0] - cx) / nl, ey = (tip[1] - cy) / nl;
      svg.append(arrowHead(tip[0] + ex * 0.3 * r0, tip[1] + ey * 0.3 * r0, ex, ey, 0.9 * r0, 'pm-head'));
      // beside the tip, a quarter turn clockwise from the arrow, so it clears the "up" and "right" labels at the ring
      svg.append(s('text', { class: 'pm-halo pm-big', x: tip[0] - ey * 1.1 * r0 - ex * 0.2 * r0, y: tip[1] + ex * 1.1 * r0 + 0.45 * r0, 'text-anchor': 'middle' }, t('viewE')));
    }
    // at Rx, a linear antenna: the part of E along its wire is the voltage now
    if (side === 'rx' && !L.isCirc(type)) {
      var c = Math.cos(tau * D2R), sn = Math.sin(tau * D2R), along = now[0] * c + now[1] * sn;
      var foot = at(along * c, along * sn, K);
      if (nl > 0.08 * Rv && Math.abs(Math.hypot(now[0], now[1]) - Math.abs(along)) > 0.01) svg.append(s('line', { class: 'pm-drop', x1: tip[0], y1: tip[1], x2: foot[0], y2: foot[1] }));
      if (Math.abs(along) * K > 0.02 * Rv) svg.append(s('line', { class: 'pm-proj', x1: cx, y1: cy, x2: foot[0], y2: foot[1] }));
      svg.append(s('circle', { class: 'pm-projdot', cx: foot[0], cy: foot[1], r: 0.3 * r0 }));
    }
    if (side === 'rx') svg.append(s('text', { class: 'pm-halo pm-title', x: W - 0.2 * r0, y: H - 0.3 * r0, 'text-anchor': 'end' }, t('voltNow', { v: num(st.uNow * 100, 0) })));
    box.replaceChildren(svg);
  }

  // ── plot: PLF in dB against the Rx turn, or against Ω ──
  var FLOOR = -30;
  function drawSweep(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), w = L.sweep(st), xmax = w.axis === 'om' ? 360 : 180;
    var pad = { l: 3.0 * r0, r: 0.8 * r0, t: 1.8 * r0, b: 1.5 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (x) { return pad.l + x / xmax * cw; };
    var Y = function (d) { var y = d === null || d < FLOOR ? FLOOR : d; return pad.t + ch * (-y / -FLOOR); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'pm-title', x: 0.2 * r0, y: 1.2 * r0 }, t(w.axis === 'om' ? 'plotOm' : 'plotRot')));
    svg.append(s('rect', { class: 'pm-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    var ticks = w.axis === 'om' ? [0, 90, 180, 270, 360] : [0, 45, 90, 135, 180];
    ticks.forEach(function (x, k) {
      if (k && k < ticks.length - 1) svg.append(s('line', { class: 'pm-grid', x1: X(x), x2: X(x), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(x), y: H - 0.15 * r0, 'text-anchor': k === ticks.length - 1 ? 'end' : k ? 'middle' : 'start' }, t('degVal', { v: String(x) })));
    });
    [[0, '0'], [-3, num(-3, 0)], [-10, num(-10, 0)], [-20, num(-20, 0)], [FLOOR, t('inf')]].forEach(function (yv) {
      if (yv[0] < 0 && yv[0] > FLOOR) svg.append(s('line', { class: yv[0] === -3 ? 'pm-grid3' : 'pm-grid', x1: pad.l, x2: pad.l + cw, y1: Y(yv[0]), y2: Y(yv[0]) }));
      svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(yv[0]) + 0.32 * r0, 'text-anchor': 'end' }, yv[1]));
    });
    if (w.alt) svg.append(s('polyline', { class: 'pm-sAlt', points: pts(w.alt.map(function (q) { return [X(q.x), Y(q.db)]; })) }));
    svg.append(s('polyline', { class: 'pm-sNow', points: pts(w.pts.map(function (q) { return [X(q.x), Y(q.db)]; })) }));
    var xn = w.axis === 'om' ? st.om : L.isCirc(st.rx) ? 0 : st.rxRot;   // a circular Rx has no turn (its slider is hidden)
    svg.append(s('line', { class: 'pm-now', x1: X(xn), x2: X(xn), y1: pad.t, y2: pad.t + ch }));
    svg.append(s('circle', { class: 'pm-nowdot', cx: X(xn), cy: Y(st.plfDb), r: 0.32 * r0 }));
    box.replaceChildren(svg);
  }

  /** The loop sentence only where it is true: a flat loop at one end, a vertical line at the other (SPEC §6). */
  function flatLoopVsVertical(st) {
    var dipole = function (k) { return k === 'v' || k === 'h' || k === 's'; };
    if (st.path === 'iono') return false;                       // there the wave reaching Rx is not the Tx dipole's
    if (st.rx === 'loop' && L.line180(st.rxRot) === 0) return dipole(st.tx) && st.txPol.tilt === 90;
    if (st.tx === 'loop' && L.line180(st.txRot) === 0) return dipole(st.rx) && st.rxPol.tilt === 90;
    return false;
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'pm-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var pathTxt = st.path === 'iono' ? t('pathRow_iono', { v: deg(st.om) }) : t('pathRow_' + st.path);
    return h('table', { class: 'pm-table' }, h('tbody', null,
      row(t('rowTx'), desc(st.txPol)),
      row(t('rowPath'), pathTxt),
      row(t('rowArr'), desc(st.arrPol)),
      row(t('rowRx'), desc(st.rxPol)),
      row(t('rowPlf'), t('pctDb', { p: pct(st.plf), d: dB(st.plfDb) }), true),
      row(t('rowV'), t('ofBest', { p: pct(st.volt) }), true)));
  }

  // ── play: time runs round the period; on the ionospheric path Ω drifts too. Page state, not model state. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v, om) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    var patch = {};
    if (v !== sim.params.t) patch.t = v;
    if (om !== undefined) { om = ((Math.round(om) % 360) + 360) % 360; if (om !== sim.params.om) patch.om = om; }
    if (Object.keys(patch).length) { ownSet = true; sim.set(patch); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      var rm = Simdeck.reducedMotion();
      setT(sim.params.t + (rm ? 45 : L.T_STEP), sim.params.path === 'iono' ? sim.params.om + (rm ? 15 : 1) : undefined);
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  var angle = function (v) { return t('degVal', { v: num(v, 0) }); };
  var types = L.TYPES.map(function (k) { return [k, t('type_' + k)]; });
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'tx', type: 'select', label: t('tx'), options: types },
      { key: 'rx', type: 'select', label: t('rx'), options: types },
      { key: 'txRot', type: 'range', label: t('txRot'), min: 0, max: 180, step: L.ANG_STEP, format: angle },
      { key: 'rxRot', type: 'range', label: t('rxRot'), min: 0, max: 180, step: L.ANG_STEP, format: angle, visible: function (p) { return !L.isCirc(p.rx); } },
      { key: 'amp', type: 'range', label: t('amp'), min: 0, max: 100, step: L.ANG_STEP, format: function (v) { return t('pctVal', { v: num(v, 0) }); },
        visible: function (p) { return L.isCirc(p.tx); } },
      { key: 'ph', type: 'range', label: t('ph'), min: 0, max: 180, step: L.ANG_STEP, format: angle, visible: function (p) { return L.isCirc(p.tx); } },
      { key: 'path', type: 'choice', label: t('path'), options: L.PATHS.map(function (k) { return [k, t('path_' + k)]; }) },
      { key: 'om', type: 'range', label: t('om'), min: 0, max: 359, step: 1, format: angle, visible: function (p) { return p.path === 'iono'; } },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'pm-wave', label: t('legendWave') },
      { shape: 'pm-rx', label: t('legendRx') },
      { shape: 'pm-proj', label: t('legendProj') }
    ],

    render: function (c) {
      var pic = h('div', { class: 'pm-pic' }), vt = h('div', { class: 'pm-box' }), vr = h('div', { class: 'pm-box' }), pl = h('div', { class: 'pm-box' });
      var w = L.sweep(c.state);
      var keys = h('p', { class: 'pm-keys' },
        h('span', null, h('span', { class: 'pm-key-now' }), t('seriesNow')),
        w.alt ? h('span', null, h('span', { class: 'pm-key-alt' }), t('seriesAlt_' + w.altRx)) : null);
      c.stage.replaceChildren(h('div', { class: 'pm' },
        h('div', { class: 'pm-left' }, pic, h('div', { class: 'pm-views' }, vt, vr), h('p', { class: 'pm-keys' }, t('viewNote'))),
        h('div', { class: 'pm-side' }, table(c.state), keys, pl)));
      drawPicture(pic, c.state);
      drawView(vt, c.state, 'tx');
      drawView(vr, c.state, 'rx');
      drawSweep(pl, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var tp = st.txPol, ap = st.arrPol;
      var vars = {
        tilt: b(tp.tilt === null ? '' : deg(tp.tilt)), ar: b(tp.arDb === null ? '' : dB(tp.arDb)),
        arr: b(desc(ap)), rx: b(desc(st.rxPol)), om: b(deg(st.om)),
        plf: b(pct(st.plf)), db: b(dB(st.plfDb)), v: b(pct(st.volt))
      };
      var sg = tp.sense > 0 ? 'r' : 'l';
      var parts = t.parts(tp.kind === 'lin' ? 'cap_tx_lin' : 'cap_tx_' + tp.kind + '_' + sg, vars);
      function more(key) { parts.push(' '); parts = parts.concat(t.parts(key, vars)); }
      if (st.path === 'bounce') more(st.flipped ? 'cap_bounce' : 'cap_bounce_lin');
      if (st.path === 'iono') more(tp.kind === 'circ' ? 'cap_iono_circ' : 'cap_iono');
      if (st.kind === 'crossed') {
        if (st.rxPol.kind === 'circ' && ap.kind === 'circ') more('cap_crossed_circ');
        else if (flatLoopVsVertical(st)) more('cap_crossed_loop');
        else more('cap_crossed');
      } else more('cap_' + st.kind);
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
