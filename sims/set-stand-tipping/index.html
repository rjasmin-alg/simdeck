<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var NS = 'http://www.w3.org/2000/svg';
  var S = 100;          // side and plan views: SVG units per metre
  var TILT = 14;        // degrees: how far the side view draws a stand that tips
  var VMAX = 16;        // the wind scale's end, m/s
  var C = { wind: 1, offset: 5, standHead: 2, bags: 3, hold: 6 };

  /** Numbers in the page's language: a decimal comma in Croatian; trailing zeros dropped when trim. */
  function num(x, d, trim) {
    var s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
    if (trim && s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function nm(x) { return num(x, 0); }
  function force(f) { return f === 0 ? '0' : num(f, f < 10 ? 1 : 0); }
  function m(x) { return num(x, 3, true); }
  function kmh(v) { return num(v * 3.6, 0); }

  function svg(viewBox, label) {
    var e = document.createElementNS(NS, 'svg');
    e.setAttribute('viewBox', viewBox);
    e.setAttribute('preserveAspectRatio', 'xMidYMax meet');
    e.setAttribute('aria-hidden', 'true');
    return e;
  }
  function el(parent, name, attrs) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    parent.appendChild(e);
    return e;
  }

  // ── the side view ──

  /** The stand, drawn into group g: legs to each foot's position along the wind (feet that coincide are one line),
   *  the column, the arm, the head, the bags on the legs and the centre of gravity. */
  function drawStand(g, s) {
    var p = s.params, top = -p.height * S, collar = -45, hx = p.arm * S;
    var xs = [];
    s.feet.forEach(function (f) {
      var x = Math.round(f.x * S * 10) / 10;
      if (xs.indexOf(x) < 0) xs.push(x);
    });
    xs.forEach(function (x) { el(g, 'line', { x1: 0, y1: collar, x2: x, y2: 0, class: 'sv-leg' }); });
    el(g, 'line', { x1: 0, y1: collar, x2: 0, y2: top, class: 'sv-col' });
    if (p.arm > 0) el(g, 'line', { x1: 0, y1: top, x2: hx, y2: top, class: 'sv-arm' });
    var hd = s.head;
    if (hd.id === 'lamp') {
      el(g, 'rect', { x: hx - 22, y: top - 20, width: 44, height: 40, rx: 5, class: 'sv-lamp' });
      el(g, 'circle', { cx: hx + 16, cy: top, r: 11, class: 'sv-lens' });
    } else {
      var w = hd.w * S, hh = hd.hgt * S;
      el(g, 'rect', { x: hx - w / 2, y: top - hh / 2, width: w, height: hh, class: 'sv-cloth' });
      for (var i = 1; i < 4; i++) el(g, 'line', { x1: hx - w / 2 + 6, y1: top - hh / 2 + i * hh / 4, x2: hx + w / 2 - 6, y2: top - hh / 2 + i * hh / 4, class: 'sv-clothline' });
    }
    s.bags.forEach(function (b) {
      if (!b.onLeg) return;
      var x = b.x * S, y = collar * (1 - L.BAG.along);
      el(g, 'rect', { x: x - 16, y: y - 10, width: 32, height: 20, rx: 7, class: 'sv-bag' });
    });
    // centre of gravity: a quartered circle
    var cx = s.cgX * S, cy = -s.cgZ * S;
    el(g, 'circle', { cx: cx, cy: cy, r: 11, class: 'sv-cg' });
    el(g, 'path', { d: 'M' + cx + ' ' + cy + 'h11a11 11 0 0 0 -11 -11z M' + cx + ' ' + cy + 'h-11a11 11 0 0 0 11 11z', class: 'sv-cgq' });
  }

  function sideView(s) {
    var p = s.params;
    var v = svg('-265 -500 600 530');
    // ground with a hatch under it
    el(v, 'line', { x1: -265, y1: 0, x2: 335, y2: 0, class: 'sv-ground' });
    for (var x = -250; x < 340; x += 26) el(v, 'line', { x1: x, y1: 4, x2: x - 14, y2: 20, class: 'sv-hatch' });
    // the lever of the stand's weight: from the column to the tipping edge, along the ground
    var ex = s.edge.cross * S;
    el(v, 'line', { x1: 0, y1: -6, x2: ex, y2: -6, class: 'sv-lever' });
    // bags on the ground, beside their foot
    s.bags.forEach(function (b, i) {
      if (b.onLeg) return;
      el(v, 'rect', { x: b.x * S - 18 + (i % 2) * 10 - 34, y: -18 - 3 * Math.floor(i / 2), width: 34, height: 18, rx: 7, class: 'sv-bagground' });
    });
    if (s.tips) {
      var ghost = el(v, 'g', { class: 'sv-ghost' });
      drawStand(ghost, s);
      var g = el(v, 'g', { transform: 'rotate(' + TILT + ' ' + ex + ' 0)' });
      drawStand(g, s);
    } else drawStand(el(v, 'g', {}), s);
    // the tipping edge: a triangle on the ground
    el(v, 'path', { d: 'M' + ex + ' 0l-13 24h26z', class: 'sv-edge' });
    // the wind: arrows at the head's height, longer with the force
    if (s.force > 0) {
      var len = Math.min(150, 30 + 0.6 * s.force);
      var x1 = (p.arm - s.head.w / 2) * S - 18;
      var zs = s.head.sail && s.head.hgt > 0.5 ? [-s.head.hgt / 3, 0, s.head.hgt / 3] : [0];
      zs.forEach(function (dz) {
        var y = -(p.height + dz) * S;
        el(v, 'line', { x1: x1 - len, y1: y, x2: x1 - 14, y2: y, class: 'sv-wind' });
        el(v, 'path', { d: 'M' + x1 + ' ' + y + 'l-20 -12v24z', class: 'sv-windtip' });
      });
    }
    return v;
  }

  // ── the view from above ──

  function planView(s) {
    var v = svg('-112 -100 224 200');
    v.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    var feet = s.feet.map(function (f) { return { leg: f.leg, x: f.x * S, y: -f.y * S }; });
    var A = feet.filter(function (f) { return f.leg === s.edge.a; })[0], B = feet.filter(function (f) { return f.leg === s.edge.b; })[0];
    el(v, 'line', { x1: A.x, y1: A.y, x2: B.x, y2: B.y, class: 'pv-edge' });
    feet.forEach(function (f) {
      el(v, 'line', { x1: 0, y1: 0, x2: f.x, y2: f.y, class: 'pv-leg' });
      el(v, 'circle', { cx: f.x, cy: f.y, r: 6, class: 'pv-foot' });
    });
    s.bags.forEach(function (b, i) {
      if (b.onLeg) {
        var n = s.bags.slice(0, i).filter(function (c) { return c.onLeg && c.leg === b.leg; }).length;
        el(v, 'rect', { x: b.x * S - 9 + n * 6, y: -b.y * S - 9 - n * 6, width: 18, height: 18, rx: 4, class: 'sv-bag' });
      } else {
        var k = s.bags.slice(0, i).filter(function (c) { return c.leg === b.leg; }).length;
        el(v, 'rect', { x: b.x * S + 4 + k * 6, y: -b.y * S + 4 + k * 6, width: 18, height: 18, rx: 4, class: 'sv-bagground' });
      }
    });
    el(v, 'circle', { cx: 0, cy: 0, r: 8, class: 'pv-col' });
    if (s.params.arm > 0) el(v, 'rect', { x: s.params.arm * S - 6, y: -6, width: 12, height: 12, class: 'pv-head', transform: 'rotate(45 ' + s.params.arm * S + ' 0)' });
    // the wind, from the left
    el(v, 'line', { x1: -110, y1: -88, x2: -72, y2: -88, class: 'sv-wind' });
    el(v, 'path', { d: 'M-60 -88l-16 -10v20z', class: 'sv-windtip' });
    return v;
  }

  // ── the balance ──

  function bar(segs, scale, mark) {
    var left = 0, kids = segs.filter(function (x) { return x.v > 0; }).map(function (x) {
      var w = 100 * x.v / scale, d = h('div', { class: 'st-seg sd-fill' + (x.hatch ? ' sd-hatch' : ''), dataset: { c: String(x.c) }, style: { left: left + '%', width: w + '%' } });
      left += w;
      return d;
    });
    if (mark !== null) kids.push(h('div', { class: 'st-mark', style: { left: (100 * mark / scale) + '%' } }));
    return h('div', { class: 'st-bar' }, kids);
  }
  function part(c, text, hatch) {
    return h('li', null, h('span', { class: 'st-dot sd-fill' + (hatch ? ' sd-hatch' : ''), dataset: { c: String(c) } }), h('span', null, text));
  }

  function balance(s) {
    var p = s.params, pa = s.parts, scale = 1.1 * Math.max(s.overturn, s.restoring, 1);
    var wHead = s.head.m * L.statics.G, wSH = (L.STAND.m + s.head.m) * L.statics.G, wBag = L.BAG.m * L.statics.G;
    var overParts = [part(C.wind, t('partWind', { f: force(s.force), h: m(p.height) }) + ' = ' + nm(pa.wind))];
    if (pa.offset > 0) overParts.push(part(C.offset, t('partOffset', { w: nm(wHead), d: m(p.arm) }) + ' = ' + nm(pa.offset), true));
    var restParts = [part(C.standHead, t('partStandHead', { w: nm(wSH), l: m(pa.standHead / wSH) }) + ' = ' + nm(pa.standHead))];
    var ground = 0;
    s.bags.forEach(function (b, i) {
      if (!b.onLeg) { ground++; return; }
      restParts.push(part(C.bags, t('partBag', { n: i + 1, w: nm(wBag), l: m(pa.bags[i] / wBag) }) + ' = ' + nm(pa.bags[i]), true));
    });
    if (ground) restParts.push(h('li', null, h('span', { class: 'st-dot', style: { borderStyle: 'dashed' } }), h('span', null, t.n('partBagsGround', ground, { n: ground }))));
    if (pa.hold > 0) restParts.push(part(C.hold, t('partHold') + ' = ' + nm(pa.hold)));
    var bagsSum = pa.bags.reduce(function (a, x) { return a + x; }, 0);
    return h('section', { class: 'st-card', 'aria-label': t('overTitle') + ', ' + t('restTitle') },
      h('div', { class: 'st-row' }, h('span', { class: 'st-name' }, t('overTitle')), h('span', { class: 'st-num' }, nm(s.overturn) + ' N·m')),
      bar([{ v: pa.wind, c: C.wind }, { v: pa.offset, c: C.offset, hatch: true }], scale, s.restoring),
      h('ul', { class: 'st-parts' }, overParts),
      h('div', { class: 'st-row' }, h('span', { class: 'st-name' }, t('restTitle')), h('span', { class: 'st-num' }, nm(s.restoring) + ' N·m')),
      bar([{ v: pa.standHead, c: C.standHead }, { v: bagsSum, c: C.bags, hatch: true }, { v: pa.hold, c: C.hold }], scale, null),
      h('ul', { class: 'st-parts' }, restParts));
  }

  function readouts(s) {
    var p = s.params, crit = s.vCrit > 0 ? t('readCritVal', { v: num(s.vCrit, 1) }) : t('readCritNone');
    return h('section', { class: 'st-card st-reads' },
      h('div', { class: 'st-read' }, h('span', null, t('readWind')), h('span', { class: 'st-num' }, force(s.force) + ' N'),
        h('span', { class: 'st-small' }, t('readWindSub', { a: num(s.head.area, 2), v: num(p.wind, 1, true), kmh: kmh(p.wind) }))),
      h('div', { class: 'st-read' }, h('span', null, t('readCrit')), h('span', { class: s.vCrit > 0 ? 'st-num' : 'st-name' }, crit),
        s.vCrit > 0 ? h('span', { class: 'st-small' }, t('readCritSub', { kmh: kmh(s.vCrit) })) : null),
      h('div', { class: 'st-read' }, h('span', null, t('readLean') + ' ', h('span', { class: 'st-num' }, num(s.lean, 0) + '°')),
        h('span', { class: 'st-small' }, t('readLeanSub'))));
  }

  function scale(s) {
    var p = s.params, pct = function (v) { return 100 * Math.min(v, VMAX) / VMAX + '%'; };
    var kids = [h('div', { class: 'st-wfill', style: { width: pct(p.wind) } }),
      h('div', { class: 'st-limit', style: { left: pct(p.limit) } })];
    [0, 4, 8, 12, 16].forEach(function (x) { kids.push(h('span', { class: 'st-tick', translate: 'no', style: { left: pct(x) } }, String(x))); });
    if (s.vCrit > 0 && s.vCrit <= VMAX) kids.push(h('span', { class: 'st-crit', style: { left: pct(s.vCrit) } }, '▲'));
    return h('section', { class: 'st-card' },
      h('div', { class: 'st-row' }, h('span', { class: 'st-name' }, t('scaleTitle')),
        h('span', { class: 'st-small' }, '▮ ' + t('scaleLimit', { v: num(p.limit, 1, true) }) + (s.vCrit > 0 && s.vCrit <= VMAX ? ' · ▲ ' + t('scaleCrit') : ''))),
      h('div', { class: 'st-scale', role: 'img', 'aria-label': t('readWindSub', { a: num(s.head.area, 2), v: num(p.wind, 1, true), kmh: kmh(p.wind) }) }, kids));
  }

  // ── caption (SPEC.md "Legend and captions") ──

  function caption(s) {
    var p = s.params, out = [];
    var o = nm(s.overturn), r = nm(s.restoring);
    if (s.tips) {
      out.push(t('capTips', { o: o, r: r }));
      if (s.parts.wind >= s.parts.offset && s.parts.wind > 0) out.push(t('capCauseWind', { f: force(s.force), h: m(p.height), m: nm(s.parts.wind) }));
      else if (s.parts.offset > 0) out.push(t('capCauseOffset', { w: nm(s.head.m * L.statics.G), d: m(p.arm), m: nm(s.parts.offset) }));
      out.push(s.vCrit > 0 ? t('capHeldTo', { v: num(s.vCrit, 1) }) : t('capNoWind'));
    } else {
      out.push(t('capStands', { o: o, r: r, pct: num(100 * s.ratio, 0) }));
      if (isFinite(s.vCrit)) out.push(t('capTipsAt', { v: num(s.vCrit, 1), kmh: kmh(s.vCrit) }));
    }
    var ground = s.bags.some(function (b) { return !b.onLeg; });
    if (s.overLimit) out.push(t(s.tips ? 'capLimitTipped' : 'capLimit', { v: num(p.wind, 1, true), lim: num(p.limit, 1, true) }));
    else if (ground) out.push(t('capGround'));
    else if (s.head.sail && !s.critOverLimit) out.push(t(s.tips ? 'capBelowLimit' : 'capBelowLimitStands', { lim: num(p.limit, 1, true) }));
    else if (p.hold && s.head.sail) out.push(t('capHold'));
    return out.join(' ');
  }

  function range(key, unit, d) {
    var r = L.RANGES[key];
    return { key: key, type: 'range', label: t(key), min: r.min, max: r.max, step: r.step, unit: unit,
      format: function (v) { return num(v, d, true) + (unit ? ' ' + unit : ''); } };
  }
  var params = [
    { key: 'head', type: 'select', label: t('head'), options: L.HEAD_IDS.map(function (x) { return [x, t('head_' + x)]; }) },
    range('height', 'm', 2),
    range('arm', 'm', 1),
    Object.assign(range('reach', 'cm', 0), { format: function (v) { return t('cm', { v: num(v * 100, 0) }); } }),
    range('bags', '', 0),
    { key: 'bagOn', type: 'choice', label: t('bagOn'), options: [['load', t('bagOn_load')], ['back', t('bagOn_back')], ['ground', t('bagOn_ground')]] },
    range('wind', 'm/s', 1),
    range('limit', 'm/s', 1),
    { key: 'orient', type: 'choice', label: t('orient'), options: [['leg', t('orient_leg')], ['gap', t('orient_gap')]] },
    { key: 'hold', type: 'toggle', label: t('hold') }
  ];

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'st-wind', label: t('legWind') },
      { shape: 'st-edge', label: t('legEdge') },
      { shape: 'st-bag', label: t('legBagLeg') },
      { shape: 'st-bagground', label: t('legBagGround') },
      { shape: 'st-cg', label: t('legCg') },
      { c: C.wind, label: t('legOver') },
      { c: C.standHead, label: t('legRest') },
      { shape: 'st-tip', label: t('legTip') },
      { shape: 'st-limit', label: t('legLimit') }
    ],
    render: function (c) {
      var s = c.state, p = s.params;
      var head = h('div', { class: 'st-sidehead' },
        h('span', { class: 'st-small' }, t('side')),
        h('span', { class: 'st-verdict', dataset: s.tips ? { tips: '' } : {} },
          s.tips ? t('verdictTips') : t('verdictStands') + ' · ' + t('share', { pct: num(100 * s.ratio, 0) })));
      c.stage.replaceChildren(h('div', { class: 'st' },
        h('p', { class: 'st-top' }, h('span', { class: 'st-formula', translate: 'no' }, t('formula'))),
        h('div', { class: 'st-body' },
          h('div', { class: 'st-side' }, head, s.overLimit ? h('div', { class: 'st-banner' }, t('banner')) : null, sideView(s)),
          h('div', { class: 'st-right' },
            balance(s),
            h('div', { class: 'st-mid' },
              readouts(s),
              h('section', { class: 'st-card st-plan', 'aria-label': t('planTitle') },
                h('span', { class: 'st-name' }, t('planTitle')), planView(s), h('span', { class: 'st-small' }, t('planNote')))),
            scale(s))),
        h('p', { class: 'st-foot' }, t('foot'))));
    },
    caption: function (c) { return caption(c.state); }
  });
})();
</script>
</body>
