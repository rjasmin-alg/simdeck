<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Politika, standard, procedura, zapis: trag kojim ide revizor</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="trail.js"></script>
<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var LAYERS = ['policy', 'standard', 'procedure'];
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function reqName(r) { return t('req' + cap(r.id)); }
  function b(text) { return h('b', null, text); }
  function num(n) { return h('b', { translate: 'no' }, String(n)); }

  /** The words on a layer card: the statement, its vague form, or "no …". */
  function layerText(r, layer) {
    var st = r.checks[LAYERS.indexOf(layer)].status;
    if (st === 'missing') return t('no' + cap(layer));
    if (st === 'vague') return t(r.id + 'Vague');
    return t(r.id + cap(layer));
  }

  /** Connector above layer j (0 policy … 3 records): plain until walked, then on, break (✗) or off. */
  function linkState(r, j) {
    if (r.seen <= j) return 'plain';
    var bi = r.breakAt === null ? null : LAYERS.indexOf(r.breakAt);
    if (bi === null || j <= bi) return 'on';
    return j === bi + 1 ? 'break' : 'off';
  }
  function link(r, j) {
    var k = linkState(r, j);
    return h('div', { class: 'pr-link', dataset: { k: k }, 'aria-hidden': 'true' }, k === 'break' ? h('span', { class: 'pr-x' }, '✗') : null);
  }

  function tagOf(c) {
    if (!c.inTrail) return t('tagOut');
    return t(c.status === 'ok' ? 'tagOk' : c.status === 'vague' ? 'tagVague' : 'tagMissing');
  }

  function card(r, j, now) {
    var c = r.checks[j], layer = LAYERS[j], seen = r.seen > j;
    return h('div', { class: 'pr-card', dataset: { st: c.status, out: seen && !c.inTrail ? '1' : '', now: now ? '1' : '' } },
      h('div', { class: 'pr-lbl' }, h('span', null, t('l' + cap(layer))), seen ? h('span', { class: 'pr-tag' }, tagOf(c)) : null),
      h('div', { class: 'pr-text' }, layerText(r, layer)));
  }

  function records(r, now) {
    var c = r.checks[3], seen = r.seen > 3, f = r.finding;
    var count = null;
    if (seen) {
      count = f.expected === null
        ? t.n('recFound', f.found) + ' · ' + t('recNoExpect')
        : t('recCount', { found: f.found, expected: f.expected });
    }
    var n = r.periods.length;
    var cells = [];
    r.coverage.forEach(function (p) {
      cells.push(h('span', { class: 'pr-mlab', translate: 'no', style: { gridRow: '1' } }, p.from === p.to ? String(p.from) : p.from + '–' + p.to));
    });
    r.coverage.forEach(function (p) {
      cells.push(h('span', { class: 'pr-cell', dataset: { r: p.ok ? '1' : '0' }, style: { gridRow: '2' }, 'aria-hidden': 'true' },
        p.ok ? '✓' : seen ? '✗' : ''));
    });
    return h('div', { class: 'pr-card pr-rec', dataset: { st: c.status, out: seen && !c.inTrail ? '1' : '', now: now ? '1' : '' } },
      h('div', { class: 'pr-lbl' }, h('span', null, t('lRecords')), seen && !c.inTrail ? h('span', { class: 'pr-tag' }, t('tagOut')) : null),
      h('div', { class: 'pr-cells', style: { gridTemplateColumns: 'repeat(' + n + ', minmax(0, 1fr))' } }, cells),
      h('div', { class: 'pr-count' }, count || ' '));
  }

  var REASON = { 'no-standard': 'rNoStandard', 'vague-standard': 'rVague', 'no-procedure': 'rNoProcedure', 'not-operating': 'rPaper', gaps: 'rGaps' };
  function reasonKey(f) {
    if (!f.reason) return 'rNone';
    if (f.reason === 'no-policy') return f.found > 0 ? 'rNoMandate' : 'rNoPolicy';
    return REASON[f.reason];
  }
  function finding(r, now) {
    if (!r.revealed) return h('div', { class: 'pr-find', dataset: { k: 'pending' } }, h('span', null, t('lFinding')), h('b', null, t('fPending')));
    var f = r.finding;
    var kind = f.kind === 'none' ? t('fNone') : t(f.kind === 'design' ? 'fDesign' : 'fOperation');
    return h('div', { class: 'pr-find', dataset: { k: f.kind, now: now ? '1' : '' } }, h('b', null, kind), h('span', null, t(reasonKey(f))));
  }

  function column(s, r, i) {
    var cur = s.cursor;
    var here = cur.kind === 'walk' && cur.req === i ? cur.stage : null;
    var kids = [h('div', { class: 'pr-head', dataset: { now: here ? '1' : '' } }, h('span', null, t('reqNo', { i: i + 1 })), h('b', null, reqName(r)))];
    LAYERS.forEach(function (layer, j) {
      kids.push(link(r, j));
      kids.push(card(r, j, here === layer));
    });
    kids.push(link(r, 3));
    kids.push(records(r, here === 'records'));
    kids.push(finding(r, here === 'finding'));
    return h('div', { class: 'pr-col' }, kids);
  }

  function summary(s) {
    var c = s.counts;
    return h('p', { class: 'pr-sum' }, t('sumTitle'), ' ',
      h('span', null, t.n('sumDesign', c.design)), ' · ',
      h('span', null, t.n('sumOperation', c.operation)), ' · ',
      h('span', null, t.n('sumNone', c.none)));
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'pr' },
      h('div', { class: 'pr-cols' }, s.reqs.map(function (r, i) { return column(s, r, i); })),
      s.report ? summary(s) : null,
      h('p', { class: 'pr-foot' }, t('foot'))));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var v = {};
    if (k.req !== undefined) {
      var r = s.reqs[k.req], f = r.finding, stage = s.cursor.stage;
      v.req = b(reqName(r));
      if (LAYERS.indexOf(stage) >= 0) v.text = layerText(r, stage);
      v.due = t(r.freq === 'quarterly' ? 'dueQ' : 'dueM');
      v.found = num(f.found);
      v.expected = num(f.expected === null ? '?' : f.expected);
      v.month = f.last ? b(t('mg' + f.last)) : '';
      v.recs = b(t.n('recFound', f.found));
      v.missing = b(t.n('missingN', f.missing.length));
    }
    if (k.key === 'cReport') {
      v.d = b(t.n('sumDesign', s.counts.design));
      v.o = b(t.n('sumOperation', s.counts.operation));
      v.z = b(t.n('sumNone', s.counts.none));
    }
    return t.parts(k.key, v);
  }

  // ── controls ──

  var params = [];
  L.REQS.forEach(function (r, i) {
    var name = t('short' + cap(r.id)), max = L.periodCount(i), plural = r.freq === 'quarterly' ? 'gapsQ' : 'gapsM';
    params.push({ key: 'r' + (i + 1), type: 'select', label: t('pChain', { name: name }),
      options: L.CHAINS.map(function (c) {
        return [c, t({ complete: 'oComplete', 'no-policy': 'oNoPolicy', vague: 'oVague', 'no-standard': 'oNoStandard', 'no-procedure': 'oNoProcedure' }[c])];
      }) });
    params.push({ key: 'g' + (i + 1), type: 'range', label: t('pGaps', { name: name }), min: 0, max: max, step: 1,
      format: function (v) { return v === 0 ? t('gapsNone') : t.n(plural, v); } });
  });

  var labels = { 'audit-day': 'prAuditDay', 'whole-trail': 'prWholeTrail', paper: 'prPaper', 'no-mandate': 'prNoMandate', weak: 'prWeak', gaps: 'prGaps' };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
      { c: 1, label: t('legRecord') },
      { shape: 'hollow', label: t('legNoRecord') },
      { shape: 'pr-out', label: t('legOut') },
      { shape: 'hl', label: t('legHere') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
