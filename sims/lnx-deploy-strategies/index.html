<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var HR = document.documentElement.lang === 'hr';
  var PER_INSTANCE_MAX = L.REQUESTS / 4; // the widest pipe: a quarter of the traffic
  var GLYPH = { idle: '', deploying: '→', rollingBack: '↩', rolledBack: '↩', done: '✓', stalled: '⏸' };
  // caption headline: the lane whose event ranks highest; ties go to more failed requests, then lane order. So
  // blue-green's deploy, the canary's advance and stall and a done lane serving never make the headline (no strings)
  var RANK = { trip: 6, refused: 5, stalled: 5, rolledBack: 4, done: 3, back: 2, advance: 1, deploy: 1, serving: 0, waiting: -1, idle: -1, start: -1 };

  /** Numbers in the page's language: hr 2,25 and 2000; en 2.25 and 2,000. */
  function num(v) {
    var r = Math.round(v * 100) / 100;
    if (HR) return String(r).replace('.', ',');
    return r >= 1000 ? r.toLocaleString('en') : String(r);
  }
  function pct(v) { return t('pct', { v: num(v) }); }
  function data(text) { return h('span', { translate: 'no', class: 'ds-mono' }, String(text)); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  /** A lane or concept name: italic; on the Croatian page with the Croatian in parentheses (the term rule). */
  function term(k) {
    return HR ? h('span', null, h('i', null, t(k)), ' (' + t(k + 'Hr') + ')') : h('i', null, t(k));
  }

  // ── one lane ──
  function slotsOf(k, x) {
    var byId = {};
    x.instances.forEach(function (i) { byId[i.id] = i; });
    var ids = k === 'rolling' ? ['r1', 'r2', 'r3', 'r4', 'r5'] : k === 'blueGreen' ? ['b1', 'b2', 'b3', 'b4', 'g1', 'g2', 'g3', 'g4'] : ['c1', 'c2', 'c3', 'c4', 'k1', 'k2', 'k3', 'k4'];
    return ids.map(function (id) { return { id: id, inst: byId[id] || null }; });
  }
  function groupsOf(k, x) {
    if (k === 'rolling') return [{ label: t('groupRolling'), col: 1, span: 4, live: true }, { label: t('groupSurge'), col: 5, span: 1, live: false }];
    if (k === 'blueGreen') return [{ label: t('groupBlue'), col: 1, span: 4, live: x.live === 'blue' }, { label: t('groupGreen'), col: 5, span: 4, live: x.live === 'green' }];
    return [{ label: t('groupBase'), col: 1, span: 4, live: x.v2Share < 100 }, { label: t('groupCanary'), col: 5, span: 4, live: x.v2Share > 0 }];
  }
  function fleet(k, x, dir) {
    var slots = slotsOf(k, x), req = L.traffic(x);
    var g = h('div', { class: 'ds-fleet', style: { '--cols': String(slots.length) } });
    groupsOf(k, x).forEach(function (gr) {
      g.append(h('div', { class: 'ds-group', dataset: gr.live ? { live: '' } : {}, style: { gridColumn: gr.col + ' / span ' + gr.span } },
        gr.label, gr.live ? h('span', { class: 'ds-livetxt' }, ' · ' + t('live')) : null));
    });
    slots.forEach(function (sl, i) {
      var col = String(i + 1), x2 = sl.inst;
      var r = x2 ? req[x2.id] : 0;
      var pipe = h('span', { dataset: Object.assign({ v: x2 ? String(x2.ver) : '1' }, r ? {} : { none: '' }), style: { width: (r / PER_INSTANCE_MAX * 100) + '%' } });
      g.append(h('div', { class: 'ds-pipe', style: { gridColumn: col } }, x2 ? pipe : null));
      if (!x2) {
        g.append(h('div', { class: 'ds-box', dataset: { empty: '' }, style: { gridColumn: col }, 'aria-hidden': 'true' }));
        g.append(h('div', { class: 'ds-req', style: { gridColumn: col } }, ''));
        return;
      }
      var changed = x.changed.indexOf(x2.id) >= 0;
      var label = !x2.ready ? t('instNotReady', { id: x2.id }) : t(x2.ver === 1 ? 'instV1' : 'instV2', { id: x2.id, req: num(r) });
      g.append(h('div', {
        class: 'ds-box' + (changed ? ' sd-changed' : '') + (changed && dir === 'forward' ? ' sd-anim-in' : ''),
        dataset: Object.assign({ v: String(x2.ver) }, x2.ready ? {} : { notready: '' }),
        style: { gridColumn: col }, role: 'img', 'aria-label': label, translate: 'no'
      }, 'v' + x2.ver));
      g.append(h('div', { class: 'ds-req', translate: 'no', dataset: r ? { on: '' } : {}, style: { gridColumn: col } }, num(r)));
    });
    return g;
  }
  function check(k, x, p) {
    var ran = ['advance', 'trip', 'done', 'deploy'].indexOf(x.event) >= 0;
    if (!ran) return h('div', { class: 'ds-check', dataset: { none: '' } }, t('checkNone'));
    var rate = x.rate; // exact, as the check reads it: the canary's own rate, the others the service-wide one
    var trip = x.event === 'trip';
    return h('div', { class: 'ds-check' },
      t.parts(k === 'canary' ? 'checkOwn' : 'checkAll', { rate: b(pct(rate)) }), ' ',
      h('b', { translate: 'no', dataset: trip ? { trip: '' } : {} }, (trip ? '> ' : '≤ ') + pct(p.threshold) + (trip ? ' ↩' : '')));
  }
  function lane(k, c) {
    var x = c.state.lanes[k], pr = c.prev && c.prev.lanes[k], p = c.params;
    var phaseChanged = pr && pr.phase !== x.phase;
    var splitChanged = pr && pr.v2Share !== x.v2Share;
    return h('section', { class: 'ds-lane', dataset: { lane: k } },
      h('div', { class: 'ds-head' },
        h('div', null, h('div', { class: 'ds-name' }, term(k)), h('div', { class: 'ds-sub' }, t(k + 'Sub'))),
        h('span', { class: 'ds-phase' + (phaseChanged ? ' sd-changed' : ''), dataset: { p: x.phase } },
          (GLYPH[x.phase] ? GLYPH[x.phase] + ' ' : '') + t('phase_' + x.phase))),
      h('div', { class: 'ds-lb' }, t('lb'), h('small', null, t('lbReq'))),
      fleet(k, x, c.dir),
      h('div', { class: 'ds-split' + (splitChanged ? ' sd-changed' : ''), role: 'img', 'aria-label': t('splitLabel', { p: pct(x.v2Share) }) },
        h('i', { style: { width: x.v2Share + '%' } }),
        h('span', null, t('split'), ' ', b(pct(x.v2Share)))),
      h('div', { class: 'ds-stats' },
        h('span', { class: 'ds-stat' }, t('thisMinute'), ' ', h('b', { translate: 'no', dataset: x.failed ? { bad: '' } : {} }, '✗ ' + num(x.failed))),
        h('span', { class: 'ds-stat' }, t('total'), ' ', h('b', { translate: 'no', dataset: x.total ? { bad: '' } : {} }, 'Σ ' + num(x.total)))),
      check(k, x, p));
  }

  // ── the shared strip: failed requests per minute and lane ──
  function strip(c, n) {
    var p = c.params, hist = [], s = L.initial(p);
    for (var i = 1; i <= n; i++) { s = L.step(s, i, p); hist.push(s); }
    var g = h('div', { class: 'ds-strip', style: { '--n': String(n) } },
      h('div', { class: 'ds-sl' }, h('b', null, t('strip'))));
    for (i = 1; i <= n; i++) g.append(h('div', { class: 'ds-sh', translate: 'no', dataset: i === c.n ? { now: '' } : {} }, String(i)));
    g.append(h('div', { class: 'ds-sh' }, t('stripTotal')));
    L.LANES.forEach(function (k) {
      g.append(h('div', { class: 'ds-sl' }, t('strip' + k.charAt(0).toUpperCase() + k.slice(1))));
      for (var m = 1; m <= n; m++) {
        if (m > c.n) { g.append(h('div', { class: 'ds-cell', dataset: { future: '' } })); continue; }
        var x = hist[m - 1].lanes[k];
        // a glyph only where the minute changed something: the trip and rollback (↩), done (✓), stalled (⏸)
        var glyph = x.event === 'trip' || x.event === 'back' || x.event === 'rolledBack' ? '↩' : x.event === 'done' ? '✓' : x.event === 'stalled' || x.event === 'refused' ? '⏸' : '';
        g.append(h('div', { class: 'ds-cell', translate: 'no',
          dataset: Object.assign({}, x.failed ? { bad: '' } : {}, x.event === 'trip' ? { trip: '' } : {}, m === c.n ? { now: '' } : {}) },
          glyph ? h('small', null, glyph) : null, num(x.failed)));
      }
      g.append(h('div', { class: 'ds-cell ds-tot', translate: 'no' }, 'Σ ' + num(c.state.lanes[k].total)));
    });
    return g;
  }

  // ── caption ──
  function headline(s) {
    var best = null;
    L.LANES.forEach(function (k, i) {
      var x = s.lanes[k], r = RANK[x.event];
      if (best === null || r > best.r || (r === best.r && x.failed > best.failed)) best = { k: k, r: r, failed: x.failed, i: i };
    });
    return best;
  }
  var KEY = {
    rolling: { advance: 'rAdvance', trip: 'rTrip', back: 'rBack', rolledBack: 'rRolledBack', done: 'rDone', stalled: 'rStalled' },
    blueGreen: { done: 'bDone', trip: 'bTrip', rolledBack: 'bRolledBack', refused: 'bRefused' },
    canary: { trip: 'cTrip', rolledBack: 'cRolledBack', done: 'cDone' }
  };
  function caption(c) {
    var s = c.state, p = c.params;
    if (c.first) return !p.v2Ready ? [t('capStartCrash')] : p.v2Error ? t.parts('capStart', { err: b(pct(p.v2Error)) }) : [t('capStartGood')];
    var parts = [t('capMin', { n: c.n })];
    var top = headline(s);
    var k = top.k, x = s.lanes[k];
    var vars = {
      lane: term(k), health: term('health'), healthAcc: term('healthAcc'),
      share: b(pct(x.v2Share)), failed: b(num(x.failed)), total: b(num(x.total)), thr: b(pct(p.threshold)),
      nFailed: b(t.n('nFailed', x.failed, { c: num(x.failed) })), nTotal: b(t.n('nFailed', x.total, { c: num(x.total) })),
      rate: b(pct(x.rate)), deadline: b(x.deadlineAt)
    };
    var key = KEY[k][x.event];
    if (!key && L.LANES.every(function (j) { return s.lanes[j].phase === 'stalled'; })) key = 'capWaiting';
    if (!key) key = 'capQuiet';
    parts = parts.concat(t.parts(key, vars));
    // the end of a run where every lane completed on a v2 that still fails (below-threshold)
    if (c.last && L.LANES.every(function (j) { return s.lanes[j].phase === 'done' && s.lanes[j].failed > 0; })) parts.push(t('capUnseen'));
    return parts;
  }

  var pctFormat = function (v) { return pct(v); };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'v2Error', type: 'range', label: t('v2Error'), min: 0, max: 100, step: 0.5, format: pctFormat, resets: true },
      { key: 'v2Ready', type: 'toggle', label: t('v2Ready'), hint: t('v2ReadyHint'), resets: true },
      { key: 'threshold', type: 'range', label: t('threshold'), hint: t('thresholdHint'), min: 1, max: 10, step: 0.5, format: pctFormat, resets: true }
    ],

    presets: [
      { id: 'all-errors', label: t('presetAll'), hint: t('presetAllHint'), params: { v2Error: 100, v2Ready: true, threshold: 2 } },
      { id: 'subtle-bug', label: t('presetSubtle'), hint: t('presetSubtleHint'), params: { v2Error: 3, v2Ready: true, threshold: 2 } },
      { id: 'below-threshold', label: t('presetBelow'), hint: t('presetBelowHint'), params: { v2Error: 1.5, v2Ready: true, threshold: 2 } },
      { id: 'crash', label: t('presetCrash'), hint: t('presetCrashHint'), params: { v2Error: 100, v2Ready: false, threshold: 2 } },
      { id: 'good-release', label: t('presetGood'), hint: t('presetGoodHint'), params: { v2Error: 0, v2Ready: true, threshold: 2 } }
    ],

    legend: [
      { shape: 'v1', label: t('legV1') },
      { shape: 'v2', label: t('legV2') },
      { shape: 'notready', label: t('legNotReady') },
      { shape: 'pipe', label: t('legPipe') },
      { shape: 'fail', label: t('legFailed') },
      { shape: 'back', label: t('legBack') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var n = L.steps(c.params);
      c.stage.replaceChildren(h('div', { class: 'ds' },
        h('div', { class: 'ds-lanes' }, L.LANES.map(function (k) { return lane(k, c); })),
        strip(c, n)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
