<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills

<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">CapEx ili OpEx: jedna kupnja, tri pogleda</h1>
      <p class="sd-subtitle"></p>
    </div>

    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

<script src="ledger.js"></script>
<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var Lg = window.SimdeckModels.ledger;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVGNS = 'http://www.w3.org/2000/svg';

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (30 000 / 30,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 8). Minus is U+2212. */
  function money(x) {
    var r = Lg.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  function data(text, tag) { return h(tag || 'span', { translate: 'no' }, String(text)); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function monthLabel(m) { return m === 0 ? t('cursorDay') : t('cursorMonth', { m: m }); }

  // ── the chart ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step at or above x. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }

  function svg(tag, attrs) {
    var el = document.createElementNS(SVGNS, tag);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  var KEYS = [['cash', '1'], ['expense', '2'], ['book', '3']];

  function chart(s, side, dom) {
    var N = s.N, m = s.p.month, lines = s.lines[side];
    var X = function (k) { return 1000 * k / N; };
    var Y = function (v) { return 1000 * (1 - v / dom.top); };
    var pct = function (v) { return (100 * (1 - v / dom.top)) + '%'; };
    var pts = function (arr, from, to) {
      var d = '';
      for (var k = from; k <= to; k++) d += (k === from ? 'M' : 'L') + X(k).toFixed(2) + ' ' + Y(arr[k]).toFixed(2);
      return d;
    };

    var ticks = [], grid = [];
    for (var v = 0; v <= dom.top + 1e-6; v += dom.step) {
      ticks.push(h('span', { class: 'cx-tick', translate: 'no', style: { top: pct(v) } }, money(v)));
      if (v > 0) grid.push(h('div', { class: 'cx-gl', style: { top: pct(v) } }));
    }
    var years = [];
    for (var y = 1; y <= s.p.life; y++) {
      if (y < s.p.life) grid.push(h('div', { class: 'cx-yl', style: { left: (100 * y * 12 / N) + '%' } }));
      years.push(h('span', { class: 'cx-year', style: { left: (100 * (y - 0.5) * 12 / N) + '%' } },
        h('span', { class: 'cx-ylong' }, t('yearN', { n: y })), h('span', { class: 'cx-yshort', translate: 'no' }, String(y))));
    }

    var g = svg('svg', { class: 'cx-svg', viewBox: '0 0 1000 1000', preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    // the book value's area, then each line: faint over the whole life, strong up to the cursor
    var area = pts(lines.book, 0, N) + 'L1000 1000L0 1000Z';
    g.appendChild(svg('path', { class: 'cx-area', d: area }));
    KEYS.forEach(function (kc) {
      var k = kc[0], arr = lines[k];
      g.appendChild(svg('path', { class: 'cx-l cx-future', 'data-k': k, 'data-c': kc[1], d: pts(arr, 0, N) }));
      if (m > 0) g.appendChild(svg('path', { class: 'cx-l', 'data-k': k, 'data-c': kc[1], d: pts(arr, 0, m) }));
    });

    var left = (100 * m / N) + '%';
    var dots = KEYS.map(function (kc) {
      return h('span', { class: 'cx-dot', dataset: { k: kc[0], c: kc[1] }, style: { left: left, top: pct(lines[kc[0]][m]) } });
    });

    return h('div', { class: 'cx-chart' },
      h('div', { class: 'cx-axis' }, ticks),
      h('div', { class: 'cx-plot' }, grid, g,
        h('div', { class: 'cx-cursor', style: { left: left } }),
        h('span', { class: 'cx-curlabel', style: { left: left } }, monthLabel(m)),
        dots),
      h('div', { class: 'cx-years' }, years));
  }

  // ── one panel ──

  function rows(a) {
    var row = function (k, c, label, value) {
      return [
        h('dt', null,
          h('span', { class: 'cx-mark', dataset: { k: k, c: c } }),
          h('span', { class: 'cx-rowlabel', dataset: { k: k } }, label)),
        h('dd', { translate: 'no', dataset: { k: k } }, value)
      ];
    };
    return h('dl', { class: 'cx-rows' },
      row('cash', '1', t('rowCash'), money(a.cash)),
      row('expense', '2', t('rowExpense'), money(a.expense)),
      row('book', '3', t('rowBook'), money(a.book)),
      row('ebitda', '8', t('rowEbitda'), money(a.ebitda)));
  }

  function panel(s, side, dom, chg) {
    var p = s.p, head;
    if (side === 'buy') {
      head = h('div', { class: 'cx-head' + (chg.indexOf('class') >= 0 ? ' sd-changed' : '') },
        h('h2', { class: 'cx-title' }, t('buyTitle'), ' ', h('span', { class: 'cx-kind' }, '· ', t(s.cap ? 'kindCapex' : 'kindOpex'))),
        h('p', { class: 'cx-line' }, s.cap
          ? t.parts('classCap', { price: b(money(p.price)), thr: b(money(p.threshold)), dep: b(money(s.perMonth)) })
          : t.parts('classExp', { price: b(money(p.price)), thr: b(money(p.threshold)) })),
        h('p', { class: 'cx-line cx-budget', dataset: { b: s.budget.buy } },
          t.parts(s.cap ? 'budgetCapital' : 'budgetOpOnce', { x: data(money(p.price)) })));
    } else {
      head = h('div', { class: 'cx-head' },
        h('h2', { class: 'cx-title' }, t('svcTitle'), ' ', h('span', { class: 'cx-kind' }, '· ', t('kindOpex'))),
        h('p', { class: 'cx-line' }, t.parts('svcSub', { fee: b(money(s.perMonth)), months: data(t.n('nMonths', s.N)) })),
        h('p', { class: 'cx-line cx-budget', dataset: { b: s.budget.svc } },
          t.parts('budgetOpYear', { x: data(money(s.perYear)) })));
    }
    return h('section', { class: 'cx-panel', dataset: { side: side } }, head, chart(s, side, dom), rows(s.at[side]));
  }

  // ── render; the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function render(c) {
    track(c);
    var s = c.state;
    var step = niceStep(s.p.price / 4);
    var dom = { step: step, top: Math.max(step, Math.ceil(s.p.price / step) * step) };   // one scale for both panels
    c.stage.replaceChildren(h('div', { class: 'cx' },
      h('div', { class: 'cx-panels' }, panel(s, 'buy', dom, chg), panel(s, 'svc', dom, chg)),
      h('p', { class: 'cx-foot' }, t('illustrative'))));
  }

  function caption(c) {
    var s = c.state, p = s.p;
    var k = L.captionKey(s);
    var when = p.month === 0 ? t('dayOne') : t('monthOf', { m: p.month, n: s.N });
    var out = t.parts(k.buy, {
      when: data(when, 'b'), price: b(money(p.price)), thr: b(money(p.threshold)),
      exp: b(money(s.at.buy.expense)), book: b(money(s.at.buy.book))
    });
    out.push(' ');
    out = out.concat(t.parts(k.svc, { svc: b(money(s.at.svc.cash)) }));
    if (k.note) out.push(' ', t.parts(k.note, { x: b(money(Math.abs(s.ebitdaGap))) }));
    return out;
  }

  var labels = {
    'server': 'pServer', 'day-one': 'pDayOne', 'end-of-life': 'pEndOfLife', 'small-purchase': 'pSmallPurchase',
    'at-threshold': 'pAtThreshold'
  };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'month', type: 'range', label: t('month'), min: 0,
        max: function (p) { return L.monthsOf(p.life); }, step: 1, format: monthLabel },
      { key: 'price', type: 'range', label: t('price'), hint: t('priceHint'), min: L.PRICE_MIN, max: L.PRICE_MAX, step: L.PRICE_STEP, format: money },
      { key: 'threshold', type: 'range', label: t('threshold'), hint: t('thresholdHint'), min: 0, max: L.THR_MAX, step: L.THR_STEP, format: money },
      { key: 'life', type: 'range', label: t('life'), min: L.LIFE_MIN, max: L.LIFE_MAX, step: 1, format: function (v) { return t.n('nYears', v); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cx-cash', c: 1, label: t('legCash') },
      { shape: 'cx-expense', c: 2, label: t('legExpense') },
      { shape: 'cx-book', c: 3, label: t('legBook') },
      { shape: 'cx-cursor', label: t('legCursor') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
