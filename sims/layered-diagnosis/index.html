     bottom-up, top-down and divide and conquer look for the same faulty layer side by side.
     The model is in sim.js, the words in strings.js. -->

<link rel="stylesheet" href="../../kit/kit.css">

{
  "id": "layered-diagnosis",
  "title": {
    "hr": "Dijagnostika po slojevima",
    "en": "Layer-by-layer troubleshooting"
  },
  "concept": {
    "hr": "Odozdo prema gore, odozgo prema dolje i podjela napola kroz isti OSI stog",
    "en": "Bottom-up, top-down and divide and conquer through the same OSI stack"
  },
  "summary": {
    "hr": "Tri redoslijeda provjera traže isti kvar, korak po korak. Test dostupnosti na mrežnom sloju odmah isključi pola slojeva, pa podjela napola obično završi prva.",

  },

  ],
  "class": "stepper",

<style>

  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2.5cqh;
  height: 100%;
  padding: 2cqh 2cqw;

[data-sim="layered-diagnosis"] .ld-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2cqw; }
[data-sim="layered-diagnosis"] .ld-col { display: flex; flex-direction: column; gap: 0.8cqh; min-width: 0; }
[data-sim="layered-diagnosis"] .ld-head {
  display: flex;

  gap: 0.5rem;
  padding: 0.2rem 0.6rem;

}

[data-sim="layered-diagnosis"] .ld-ord.ld-plan { border: var(--line-w) dotted var(--muted); color: var(--muted); }
[data-sim="layered-diagnosis"] .ld-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-sim="layered-diagnosis"] .ld-name b { font-family: var(--mono); }

[data-sim="layered-diagnosis"] .ld-cell.ld-ok .ld-mark { color: var(--ok); }
[data-sim="layered-diagnosis"] .ld-cell.ld-testfail { border: 0.2rem dashed var(--danger); }

[data-sim="layered-diagnosis"] .ld-cell.ld-fault .ld-mark { color: var(--danger); }

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Dijagnostika po slojevima</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var COLOR = { bu: '1', td: '2', dc: '3' };
  var NAME = { bu: 'apBu', td: 'apTd', dc: 'apDc' };
  var DIR = { bu: 'dirBu', td: 'dirTd', dc: 'dirDc' };
  function data(text) { return h('b', { translate: 'no' }, String(text)); }
  function avg(a) { return L.average(a).toFixed(1).replace(/\.0$/, '').replace('.', Simdeck.lang === 'hr' ? ',' : '.'); }

  var faults = [];
  for (var f = 7; f >= 1; f--) faults.push([f, f + ' · ' + t('name' + f)]);

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { fault: 7 } },
    { id: 'down', label: t('presetDown'), hint: t('presetDownHint'), params: { fault: 1 } },
    { id: 'transport', label: t('presetMid'), hint: t('presetMidHint'), params: { fault: 4 } },
    { id: 'network', label: t('presetNet'), hint: t('presetNetHint'), params: { fault: 3 } }
  ];

  // the status line under a column: the last thing that approach did
  function status(a, run) {
    if (run.found) {
      var k = run.found.elim ? 'stElim' : 'stFound';
      return t(k, { layer: t('layer' + run.found.layer + 'L'), checks: t.n('checks', run.found.checks) });
    }
    var last = run.checks[run.checks.length - 1];
    if (!last) return t('stWait');
    if (last.test) return t(last.ok ? 'stTestOk' : 'stTestFail');
    return t('stCheck', { k: run.checks.length, layer: t('layer' + last.layer) });
  }

  function column(a, s, fresh) {
    var run = s.runs[a];
    var plan = L.plan(a, a === 'dc' ? s.ping : null);
    var out = a === 'dc' ? L.excluded(s.ping) : [];
    var cells = [];
    for (var layer = L.layers; layer >= 1; layer--) {
      var idx = -1;
      run.checks.forEach(function (c, i) { if (c.layer === layer) idx = i; });
      var check = idx >= 0 ? run.checks[idx] : null;
      var order = plan.indexOf(layer);
      var cls = 'ld-cell', mark = null;
      if (run.found && run.found.layer === layer) { cls += ' ld-fault'; mark = '✗ ' + t('markFault'); }
      else if (check && check.test) { cls += check.ok ? ' ld-ok' : ' ld-testfail'; mark = (check.ok ? '✓ ' : '✗ ') + t('test'); }
      else if (check) { cls += ' ld-ok'; mark = '✓ ' + t('markOk'); }
      else if (out.indexOf(layer) >= 0) { cls += ' ld-out'; mark = t('markOut'); }
      if (fresh && idx === run.checks.length - 1) cls += ' sd-changed sd-anim-in';
      cells.push(h('div', { class: cls },
        order >= 0 ? h('span', { class: 'ld-ord' + (check ? ' sd-fill' : ' ld-plan'), dataset: { c: COLOR[a] }, translate: 'no' }, String(order + 1)) : h('span'),
        h('span', { class: 'ld-name' }, h('b', { translate: 'no' }, layer + ' · '), t('name' + layer)),
        h('span', { class: 'ld-mark' }, mark)));
    }
    return h('div', { class: 'ld-col' },
      h('div', { class: 'ld-head', dataset: { c: COLOR[a] } },
        h('span', null, t(NAME[a])), h('span', { class: 'ld-count' }, t.n('count', run.checks.length))),
      h('div', { class: 'ld-dir' }, t(DIR[a])),
      cells,
      h('div', { class: 'ld-status' + (run.found ? ' ld-done' : '') }, status(a, run)));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'fault', type: 'select', label: t('fault'), hint: t('faultHint'), options: faults }
    ],

    presets: presets,

    legend: [
      { shape: 'ok', label: t('legendOk') },
      { shape: 'cross', label: t('legendFault') },
      { shape: 'hatch', label: t('legendOut') },
      { shape: 'hl', label: t('legendNow') }
    ],

    render: function (c) {
      var s = c.state, fwd = c.dir === 'forward' && !c.first;
      var done = L.approaches.every(function (a) { return s.runs[a].found; });
      var facts = h('div', { class: 'ld-facts' + (done ? '' : ' ld-hidden') },
        h('div', { class: 'ld-box' }, t('factAvg'),
          L.approaches.map(function (a) { return h('span', null, t(NAME[a]) + ' ', data(avg(a))); })));
      c.stage.replaceChildren(h('div', { class: 'ld' },
        h('div', { class: 'ld-cols' }, L.approaches.map(function (a) {
          return column(a, s, fwd && s.events.some(function (e) { return e.a === a; }));
        })),
        facts));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      if (c.n === 0) return t.parts('captionStart', { layer: t('layer' + p.fault + 'L') });
      var out = [];
      function add(key, vars) { if (out.length) out.push(' '); out = out.concat(t.parts(key, vars)); }
      s.events.forEach(function (e) {
        var ap = t(NAME[e.a]);
        if (e.e === 'test') add(e.ok ? 'evTestOk' : 'evTestFail', { ap: ap });
        else if (e.e === 'found') add(e.elim ? 'evElim' : 'evFound', { ap: ap, layer: t('layer' + e.layer + 'L'), checks: t.n('checks', e.checks) });
        else if (e.e === 'check' && e.ok && !(e.a === 'dc' && e.layer === 1 && s.ping === false)) add('evCheck', { ap: ap, layer: t('layer' + e.layer) });
      });
      var done = L.approaches.every(function (a) { return s.runs[a].found; });
      if (done && (!out.length || c.n === c.steps)) {
        add('evDone', { bu: data(s.runs.bu.found.checks), td: data(s.runs.td.found.checks), dc: data(s.runs.dc.found.checks) });
      }
      return out;
    }
  });
})();
</script>
</body>
</html>
