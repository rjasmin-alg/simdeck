<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // ── numbers in the page's language: a decimal comma in Croatian, a real minus, thin-space thousands ──
  function loc(s) { s = s.replace('-', '−'); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  // Thousands grouped from five digits on (2400, but 10 000).
  function group(n) { var r = String(Math.round(n)); return r.length < 5 ? r : r.replace(/\B(?=(\d{3})+(?!\d))/g, '\u202f'); }
  function sig3(x) { return x >= 1000 ? group(x) : loc(x.toPrecision(3)); }
  function trim(x) { return loc(String(Math.round(x * 1000) / 1000)); }
  // An SI prefix for a value; `exact` trims (grid values: 2.4 kHz), otherwise three significant digits (8.30 kbit/s).
  function withPrefix(x, keys, exact) {
    var i = x >= 1e9 ? 3 : x >= 1e6 ? 2 : x >= 1e3 ? 1 : 0;
    if (i >= keys.length) i = keys.length - 1;
    var v = x / Math.pow(1000, i);
    return t(keys[i], { v: exact ? trim(v) : sig3(v) });
  }
  function hz(x) { return withPrefix(x, ['hz', 'khz', 'mhz'], true); }
  function rate(x, exact) { return withPrefix(x, ['bps', 'kbps', 'mbps', 'gbps'], exact); }
  function lin(x) { return x >= 1000 ? group(x) : loc(x.toPrecision(3)); }
  // The slider's short form: three significant digits without trailing zeros (×0.001, ×10, ×2.51).
  function short(x) { return x >= 1000 ? group(x) : loc(String(Number(x.toPrecision(3)))); }
  // A linear power ratio given in dB, readable at both ends: 10^x with a superscript outside 0.001 … 10^6 (the
  // required S/N reaches 10^(3·10^7) for 1 Gbit/s in 10 Hz, so it is built from the dB value, never computed).
  function ratio(dB) {
    if (dB >= 60 || dB < -30) {
      var e = Math.floor(dB / 10), m = Math.pow(10, dB / 10 - e);
      if (m >= 9.995) { m /= 10; e += 1; }
      return loc(m.toFixed(2)) + '·10' + String(e).split('').map(function (c) { return SUP[c]; }).join('');
    }
    return short(Math.pow(10, dB / 10));
  }
  var SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  function sci(x) {
    var e = Math.floor(Math.log10(x)), m = x / Math.pow(10, e);
    return loc(m.toFixed(2)) + '·10' + String(e).split('').map(function (c) { return SUP[c]; }).join('');
  }
  function db(x, d) {
    if (Math.abs(x) >= 1e4) return t('db', { v: sci(x) });
    return t('db', { v: loc(x.toFixed(d == null ? 1 : d)) });
  }
  function dbInt(x) { return t('db', { v: loc(String(x)) }); }

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function text(x, y, str, cls, anchor) {
    return s('text', { x: x, y: y, class: cls || '', 'text-anchor': anchor || 'start' }, str);
  }

  // ── the changed mark: C's power of ten against the one drawn for the previous state ──
  var lastDecade = null, changed = false;
  // Keyed on the params, so a redraw of the same state (a resize) keeps the mark and any other change clears it.
  var lastKey = null;
  function track(st, params) {
    var key = JSON.stringify(params);
    if (key === lastKey) return;
    changed = lastDecade !== null && st.decade !== lastDecade;
    lastDecade = st.decade;
    lastKey = key;
  }

  // ── left: the rectangle B × log2(1 + S/N) ──
  function drawRect(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var pad = { l: 3 * rem, r: 1 * rem, t: 2.2 * rem, b: 4.4 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (b) { return pad.l + (b / st.axis) * cw; };
    var Y = function (v) { return pad.t + ch * (1 - v / L.Y_MAX); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'sh-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    for (var v = 2; v <= L.Y_MAX; v += 2) svg.append(s('line', { class: 'sh-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) }));
    for (v = 0; v <= L.Y_MAX; v += 2) svg.append(text(pad.l - 0.5 * rem, Y(v) + 0.35 * rem, String(v), '', 'end'));
    svg.append(text(pad.l, pad.t - 0.6 * rem, t('axisH'), 'sh-strong'));
    var p = st.axis / Math.pow(10, Math.floor(Math.log10(st.axis) + 1e-9));
    var div = p === 2 ? 4 : 5;
    for (var i = 0; i <= div; i++) {
      var bx = (st.axis * i) / div;
      if (i > 0 && i < div) svg.append(s('line', { class: 'sh-grid', x1: X(bx), x2: X(bx), y1: pad.t, y2: pad.t + ch }));
      // every tick labelled when there is room (about 4.5 rem each), else only both ends (a phone)
      if (cw / div >= 4.5 * rem || i === 0 || i === div) {
        svg.append(text(X(bx), pad.t + ch + 1.3 * rem, i === 0 ? '0' : hz(bx), '', i === 0 ? 'start' : i === div ? 'end' : 'middle'));
      }
    }
    // the rectangle: width B, height log2(1 + S/N); at least 2 px tall so −30 dB is still a visible sliver
    var top = Math.min(Y(st.bitsPerHz), Y(0) - 2);
    svg.append(s('rect', { class: 'sh-rect', x: X(0), y: top, width: X(st.B) - X(0), height: Y(0) - top }));
    svg.append(s('line', { class: 'sh-axis', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    svg.append(s('line', { class: 'sh-axis', x1: pad.l, x2: pad.l, y1: pad.t, y2: Y(0) }));
    // 0 dB: height 1, so the area is B
    svg.append(s('line', { class: 'sh-zero', x1: pad.l, x2: pad.l + cw, y1: Y(1), y2: Y(1) }));
    // under the line when the plot is tall enough, else above it (a phone)
    var zeroBelow = Y(0) - Y(1) > 2.6 * rem;
    svg.append(text(pad.l + cw - 0.4 * rem, zeroBelow ? Y(1) + 1.25 * rem : Y(1) - 0.4 * rem, t('zeroLine'), 'sh-halo', 'end'));
    // width: an arrow under the axis labels, B written on it
    var ay = pad.t + ch + 2.9 * rem;
    svg.append(s('line', { class: 'sh-arrow', x1: X(0) + 6, x2: X(st.B) - 6, y1: ay, y2: ay }));
    svg.append(s('path', { class: 'sh-head', d: 'M' + X(0) + ',' + ay + ' l10,-6 v12 z' }));
    svg.append(s('path', { class: 'sh-head', d: 'M' + X(st.B) + ',' + ay + ' l-10,-6 v12 z' }));
    svg.append(text((X(0) + X(st.B)) / 2, ay + 0.35 * rem, t('rectB', { b: hz(st.B) }), 'sh-strong sh-halo', 'middle'));
    // height: written above the top edge
    svg.append(text(X(0) + 0.5 * rem, top - 0.5 * rem, '↕ ' + t('rectH', { v: lin(st.bitsPerHz) }), 'sh-strong sh-halo'));
    // the target rate: a dashed line at R/B, or an arrow off the top. A narrow plot (a phone) names it only; the
    // numbers are in the formula box under it.
    var narrow = cw < 24 * rem;
    if (st.target != null) {
      if (st.rateRatio <= L.Y_MAX) {
        svg.append(s('line', { class: 'sh-tline', x1: pad.l, x2: pad.l + cw, y1: Y(st.rateRatio), y2: Y(st.rateRatio) }));
        // above its line, or under it when that would cover the 0 dB label
        var ty = Y(st.rateRatio), clash = !zeroBelow && Math.abs(ty - Y(1)) < 1.6 * rem;
        svg.append(text(pad.l + cw - 0.4 * rem, clash ? ty + 1.3 * rem : ty - 0.5 * rem,
          narrow ? t('legendTarget') : t('targetLine', { r: rate(st.target, true), db: db(st.requiredSnrDb) }), 'sh-target sh-halo', 'end'));
      } else {
        svg.append(text(pad.l + cw - 0.4 * rem, pad.t + 1.3 * rem,
          narrow ? '↑ ' + t('legendTarget') : t('targetOver', { r: rate(st.target, true), x: short(st.rateRatio), db: db(st.requiredSnrDb) }),
          'sh-target sh-halo', 'end'));
      }
    }
    // C inside the rectangle, or above it when the rectangle is too low for it
    var hRect = Y(0) - top;
    var label = h('span', { class: 'sh-c' + (changed ? ' sd-changed' : '') }, t('rectC', { c: rate(st.C) }));
    if (hRect > 3.2 * rem) {
      label.style.left = ((X(0) + X(st.B)) / 2) + 'px';
      label.style.top = ((top + Y(0)) / 2 + 0.4 * rem) + 'px';
    } else {
      label.dataset.at = 'above';
      label.style.left = (X(0) + 0.5 * rem) + 'px';
      label.style.top = (top - 2 * rem) + 'px';
    }
    box.replaceChildren(svg, label);
  }

  // ── right: the curve C/B against S/N in dB ──
  function drawCurve(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var pad = { l: 2.4 * rem, r: 1 * rem, t: 0.6 * rem, b: 2.8 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (d) { return pad.l + ((d - L.SNR_MIN) / (L.SNR_MAX - L.SNR_MIN)) * cw; };
    var Y = function (v) { return pad.t + ch * (1 - v / L.Y_MAX); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'sh-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    for (var d = L.SNR_MIN; d <= L.SNR_MAX; d += 10) {
      svg.append(s('line', { class: 'sh-grid', x1: X(d), x2: X(d), y1: pad.t, y2: pad.t + ch }));
      svg.append(text(X(d), pad.t + ch + 1.2 * rem, loc(String(d)), '', 'middle'));
    }
    [0, 5, 10].forEach(function (v) {
      if (v) svg.append(s('line', { class: 'sh-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) }));
      svg.append(text(pad.l - 0.4 * rem, Y(v) + 0.35 * rem, String(v), '', 'end'));
    });
    svg.append(text(pad.l + cw, pad.t + ch + 2.5 * rem, t('curveX'), 'sh-strong', 'end'));
    var pts = [];
    for (var k = 0; k <= 140; k++) { var x = L.SNR_MIN + k * 0.5; pts.push(X(x).toFixed(1) + ',' + Y(L.bitsPerHz(L.dbToLin(x))).toFixed(1)); }
    svg.append(s('polyline', { class: 'sh-curve', points: pts.join(' ') }));
    // example systems: a dot and a short name below-right, in the open space under the curve; FT8's above-right (it
    // sits on the floor)
    st.examples.forEach(function (e) {
      var ex = X(e.snrDb), ey = Y(e.bitsPerHz);
      svg.append(s('circle', { class: 'sh-ex', cx: ex, cy: ey, r: 0.42 * rem }));
      if (e.id === 'ft8') svg.append(text(ex + 0.5 * rem, ey - 0.7 * rem, t('exShort_' + e.id), 'sh-halo'));
      else svg.append(text(ex + 0.6 * rem, ey + 1.2 * rem, t('exShort_' + e.id), 'sh-halo'));
    });
    // "now" and "needed" above the curve: the left one of the two to the left, the other to the right
    var cx = X(st.snrDb), cy = Y(st.bitsPerHz);
    var marks = [{ x: cx, y: cy, key: 'curveNow', cls: 'sh-strong sh-halo' }];
    // the target's required S/N, when it lies on the drawn part of the curve
    if (st.target != null && st.rateRatio <= L.Y_MAX && st.requiredSnrDb >= L.SNR_MIN) {
      var nx = X(st.requiredSnrDb), ny = Y(st.rateRatio), r = 0.6 * rem;
      svg.append(s('path', { class: 'sh-need', d: 'M' + nx + ',' + (ny - r) + ' L' + (nx + r) + ',' + (ny + r * 0.8) + ' L' + (nx - r) + ',' + (ny + r * 0.8) + ' Z' }));
      marks.push({ x: nx, y: ny, key: 'curveNeed', cls: 'sh-target sh-halo' });
    }
    // the current point, drawn last so it stays on top
    svg.append(s('line', { class: 'sh-drop', x1: cx, x2: cx, y1: cy, y2: Y(0) }));
    svg.append(s('circle', { class: 'sh-now', cx: cx, cy: cy, r: 0.55 * rem }));
    marks.sort(function (m1, m2) { return m1.x - m2.x || (m1.key < m2.key ? -1 : 1); });
    marks.forEach(function (m, i) {
      var right = marks.length > 1 ? i === 1 : m.x < pad.l + 2.5 * rem;
      svg.append(text(m.x + (right ? 0.7 : -0.7) * rem, m.y - 0.7 * rem, t(m.key), m.cls, right ? 'start' : 'end'));
    });
    box.replaceChildren(svg);
  }

  function formula(st) {
    var mono = function (str, cls) { return h('p', { class: 'sh-f' + (cls ? ' ' + cls : ''), translate: 'no' }, str); };
    var Bs = hz(st.B);
    var rows = [
      h('h2', null, t('formulaTitle')),
      mono('C = B · log₂(1 + S/N)'),
      mono('  = ' + Bs + ' · log₂(1 + ' + lin(st.snrLin) + ')'),
      mono('  = ' + Bs + ' · ' + lin(st.bitsPerHz)),
      h('p', { class: 'sh-f sh-f-res', translate: 'no' }, '  = ', h('span', { class: changed ? 'sd-changed' : '' }, rate(st.C))),
      h('p', { class: 'sh-f sh-f-sm', translate: 'no' }, t('fLin', { db: dbInt(st.snrDb), lin: lin(st.snrLin) }))
    ];
    if (st.target != null) {
      var needLin = ratio(st.requiredSnrDb);
      rows.push(h('p', { class: 'sh-f sh-f-sm', translate: 'no' },
        t('fNeed', { r: rate(st.target, true), lin: needLin, db: db(st.requiredSnrDb) }),
        h('span', { class: 'sh-verdict', dataset: { v: st.verdict } }, t('verdict_' + st.verdict))));
    }
    return h('div', { class: 'sh-box' }, rows);
  }

  function examples(st) {
    var cell = function (str, cls) { return h('span', { class: cls || '' }, str); };
    var head = h('div', { class: 'sh-ex-row sh-ex-head' }, cell(t('exSystem')), cell('B'), cell('S/N'), cell(t('exC')));
    var rows = st.examples.map(function (e) {
      var name = t('ex_' + e.id);
      return h('button', {
        type: 'button', class: 'sh-ex-row', 'aria-pressed': e.B === st.B && e.snrDb === st.snrDb ? 'true' : 'false',
        'aria-label': t('exLoad', { name: name, b: hz(e.B), snr: dbInt(e.snrDb) }),
        onclick: function () { load(e); }
      }, cell(name, 'sh-ex-name'), cell(hz(e.B)), cell(dbInt(e.snrDb)), cell(rate(e.C)));
    });
    return h('div', { class: 'sh-box' },
      h('div', { class: 'sh-ex-head-line' }, h('h2', null, t('exTitle')), h('span', null, t('exHint'))),
      h('div', { class: 'sh-ex-list' }, head, rows),
      h('p', { class: 'sh-ex-note' }, t('exRefNote')));
  }
  function load(e) { sim.set({ b: L.gridIndex(e.B), snr: e.snrDb }); }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'b', type: 'range', label: t('b'), min: L.B_MIN, max: L.B_MAX, step: 1,
        format: function (v) { return hz(L.GRID[v]); } },
      { key: 'snr', type: 'range', label: t('snr'), hint: t('snrHint'), min: L.SNR_MIN, max: L.SNR_MAX, step: 1,
        format: function (v) { return t('snrValue', { db: dbInt(v), lin: short(L.dbToLin(v)) }); } },
      { key: 'target', type: 'toggle', label: t('target'), hint: t('targetHint') },
      { key: 'rate', type: 'range', label: t('rate'), min: L.RATE_MIN, max: L.RATE_MAX, step: 1,
        visible: function (p) { return !!p.target; },
        format: function (v) { return rate(L.GRID[v], true); } }
    ],
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params };
    }),
    legend: [
      { shape: 'sh-w', label: t('legendWidth') },
      { shape: 'sh-h', label: t('legendHeight') },
      { c: 1, label: t('legendArea') },
      { c: 3, shape: 'round', label: t('legendExample') },
      { shape: 'sh-t', label: t('legendTarget') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var st = c.state;
      track(st, c.params);
      var rect = h('div', { class: 'sh-plot' });
      var curve = h('div', { class: 'sh-plot' });
      c.stage.replaceChildren(h('div', { class: 'sh' },
        h('div', { class: 'sh-left' }, rect),
        h('div', { class: 'sh-right' },
          formula(st),
          h('div', { class: 'sh-box sh-curvebox' }, h('h2', null, t('curveTitle')), curve),
          examples(st))));
      drawRect(rect, st);
      drawCurve(curve, st);
    },

    caption: function (c) {
      var st = c.state;
      var b = h('b', null, hz(st.B)), snr = dbInt(st.snrDb);
      var parts;
      if (st.snrDb === 0) parts = t.parts('captionZero', { b: b, c: h('b', null, t('bps', { v: group(st.C) })) });
      else parts = t.parts('captionMain', { b: b, snr: snr, lin: lin(st.snrLin), bph: lin(st.bitsPerHz), c: h('b', null, rate(st.C)) })
        .map(function (x, i, all) { return x instanceof Node && all.indexOf(x) !== i ? x.cloneNode(true) : x; });
      if (st.target != null) {
        parts = parts.concat(' ', t.parts('captionTarget', { r: rate(st.target, true), need: h('b', null, db(st.requiredSnrDb)) }));
        var key = st.verdict === 'below' ? 'captionBelow' : st.verdict === 'limit' ? 'captionLimit' : 'captionAbove';
        parts.push(' ', h('span', { class: st.verdict === 'above' ? 'sd-hl' : '' }, t(key, { snr: snr })));
        if (st.rateRatio > 4) parts.push(' ', t('captionSteep', { x: short(st.rateRatio) }));
      }
      return parts;
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
