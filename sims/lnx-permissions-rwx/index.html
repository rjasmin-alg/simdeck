<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var GROUPS = ['gOwner', 'gGroup', 'gOther'];
  var OF = ['ofOwner', 'ofGroup', 'ofOther'];

  function data(text) { return h('b', { translate: 'no' }, String(text)); }
  function code(text) { return h('code', null, String(text)); }
  function permKey(i, kind) { return ['permR', 'permW', kind === 'dir' ? 'permS' : 'permX'][i % 3]; }
  function bitName(i, kind) {
    return t('bitName', { perm: t(['bitR', 'bitW', kind === 'dir' ? 'bitS' : 'bitX'][i % 3]), who: t(OF[Math.floor(i / 3)]) });
  }

  /** One strip: label line, the type character and three groups of three cells.
      o: { view, kind, label, mask, head, digits, cls(i) → [classes], click(i) or null, written[] } */
  function strip(o) {
    var v = o.view;
    var groups = [0, 1, 2].map(function (g) {
      var cells = [0, 1, 2].map(function (k) {
        var i = 3 * g + k, on = v.bits[i] === 1;
        var cls = ['lp-cell', on ? 'lp-on' : 'lp-off'].concat(o.cls ? o.cls(i, on) : []);
        if (o.written && o.written.indexOf(i) >= 0) cls.push('lp-w');
        var text = h('span', { translate: 'no', 'aria-hidden': 'true' }, on ? 'rwx'[k] : '-');
        if (!o.click) return h('span', { class: cls.join(' ') }, text);
        var label = t(on ? 'cellOn' : 'cellOff', { who: t(GROUPS[g]), perm: t(permKey(i, o.kind)) });
        return h('button', {
          type: 'button', class: cls.join(' '), 'aria-label': t('cellClick', { label: label }), title: label,
          onmousedown: function (e) { e.preventDefault(); }, onclick: function () { o.click(i); }
        }, text);
      });
      var d = v.digits[g];
      return h('div', { class: 'lp-group' },
        o.head ? h('div', { class: 'lp-gh' }, t(GROUPS[g])) : null,
        h('div', { class: 'lp-cells' }, cells),
        o.digits ? h('div', { class: 'lp-dg', translate: 'no' }, d.r + '+' + d.w + '+' + d.x + ' = ' + d.sum) : null);
    });
    var type = h('span', { class: 'lp-cell lp-type', translate: 'no' }, v.ls[0]);
    return h('div', { class: 'lp-block' },
      h('div', { class: 'lp-lbl' }, h('span', null, o.label), data(v.octal)),
      h('div', { class: 'lp-strip' + (o.mask ? ' lp-mask' : '') + (o.written ? ' lp-written' : '') }, type, groups));
  }

  function notations(v) {
    var row = function (key, val) { return [h('span', { class: 'lp-k' }, t(key)), h('span', { class: 'lp-v', translate: 'no' }, val), h('span')]; };
    return h('div', { class: 'lp-nots' }, row('nLs', v.ls), row('nOctal', v.octal), row('nSymbolic', v.symbolic));
  }

  /** The controller, looked up when a cell is clicked (the first render runs before mount returns). */
  function ctl() { return sim || window.simdeck; }
  function flip(mode, i) { var s = ctl(); s.set(L.clickPatch(s.params, mode, i)); }

  function chmodPanel(st) {
    var dir = st.kind === 'dir';
    var name = t(dir ? 'dirName' : 'fileName');
    var changed = function (i) { return st.changedBits.indexOf(i) >= 0 ? ['lp-chg'] : []; };
    var cmd = st.form === 'none'
      ? h('div', { class: 'lp-cmd lp-none' }, t('noCmd'))
      : h('div', { class: 'lp-cmd', translate: 'no' }, '$ chmod ' + st.cmd + ' ' + name);
    var form = st.form === 'octal' ? t('formOctal') : st.form === 'symbolic' ? t.n('formSymbolic', st.written.length) : null;
    return h('div', { class: 'lp-panel' },
      h('div', { class: 'lp-title' }, t(dir ? 'chmodDir' : 'chmodFile')),
      strip({ view: st.views.before, kind: st.kind, label: t('stripBefore'), click: function (i) { flip(st.before, i); } }),
      h('div', { class: 'lp-cmds' }, cmd, form ? h('div', { class: 'lp-note' }, form) : null),
      strip({ view: st.views.after, kind: st.kind, label: t('stripAfter'), head: true, digits: true, cls: changed,
        written: st.form === 'none' ? null : st.written, click: function (i) { flip(st.after, i); } }),
      notations(st.views.after),
      h('div', { class: 'lp-x' }, t(dir ? 'xDir' : 'xFile')));
  }

  function createPanel(st) {
    var dir = st.kind === 'dir';
    var v = st.views;
    var cleared = function (i) { return st.cleared.indexOf(i) >= 0 ? ['lp-chg', 'lp-masked', 'sd-hatch'] : []; };
    var noEff = function (i) { return st.noEffect.indexOf(i) >= 0 ? ['lp-noeff'] : []; };
    var math = h('div', { class: 'lp-nots' },
      h('span', { class: 'lp-k' }, t('mathClear')),
      h('span', { class: 'lp-v', translate: 'no' }, v.base.octal + ' & ~' + v.umask.octal + ' = ' + v.created.octal),
      h('span', { class: 'lp-verdict lp-good', 'aria-hidden': 'true' }, '✓'),
      st.difference == null ? null : [
        h('span', { class: 'lp-k' }, t('mathSub')),
        h('span', { class: 'lp-v' + (st.differenceAgrees ? '' : ' lp-struck'), translate: 'no' }, v.base.octal + ' − ' + v.umask.octal + ' = ' + L.octal(st.difference)),
        st.differenceAgrees ? h('span', { class: 'lp-verdict' }, t('subAgrees')) : h('span', { class: 'lp-verdict lp-bad' }, '✗ ' + t('subWrong'))
      ]);
    return h('div', { class: 'lp-panel' },
      h('div', { class: 'lp-title' }, t(dir ? 'createDir' : 'createFile')),
      h('div', { class: 'lp-cmds', translate: 'no' },
        h('div', { class: 'lp-cmd' }, '$ umask ' + v.umask.octal),
        h('div', { class: 'lp-cmd' }, '$ ' + (dir ? 'mkdir ' : 'touch ') + t('newName'))),
      strip({ view: v.base, kind: st.kind, label: t(dir ? 'stripBaseDir' : 'stripBaseFile') }),
      h('div', null,
        strip({ view: v.umask, kind: st.kind, label: t('stripMask'), mask: true, cls: noEff }),
        st.noEffect.length ? h('div', { class: 'lp-note' }, t('noEffect', { base: v.base.octal })) : null),
      strip({ view: v.created, kind: st.kind, label: t(dir ? 'stripCreatedDir' : 'stripCreatedFile'), head: true, digits: true, cls: cleared }),
      notations(v.created),
      math);
  }

  // ---- captions: the panel whose params changed last speaks (sim.js nextFocus, captionKey; SPEC.md, Captions) ----
  var focus = null, last = null, lastPreset = null;
  function track(c) {
    var reset = L.clearsToggled(last, c.params);
    focus = L.nextFocus(focus, last, c.params, c.preset, lastPreset);
    last = Object.assign({}, c.params);
    lastPreset = c.preset;
    return reset;
  }

  function chmodCaption(st, k) {
    var cmd = code('chmod ' + st.cmd);
    var v = st.views.after;
    if (k.key === 'cNone') return t.parts('cNone', { name: code(t(st.kind === 'dir' ? 'dirName' : 'fileName')), ls: data(v.ls), oct: data(v.octal), sym: data(v.symbolic) });
    if (k.key === 'cOctalLost') return t.parts('cOctalLost', { cmd: cmd, bit: h('span', { class: 'sd-hl' }, bitName(k.bit, st.kind)) });
    if (k.key === 'cOctalKeep') return t.parts('cOctalKeep', { cmd: cmd, oct: data(v.octal) });
    return t.parts(k.key, { cmd: cmd, n: k.n });
  }

  function createCaption(st, k) {
    var v = st.views;
    var out = t.parts(k.key, { n: k.n, mask: data(v.umask.octal), base: data(v.base.octal), created: h('b', { class: 'sd-hl', translate: 'no' }, v.created.octal), thing: t(st.kind === 'dir' ? 'thingDir' : 'thingFile') });
    if (k.noEffect) { out.push(' '); out = out.concat(t.parts('cNoEffect', { base: data(v.base.octal) })); }
    return out;
  }

  var labels = { 'touch-default': 'presetTouch', 'chmod-640': 'presetChmod640', symbolic: 'presetSymbolic', 'octal-erases': 'presetOctalErases', 'umask-077': 'presetUmask077', 'dir-umask': 'presetDir' };
  var sim;

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'kind', type: 'choice', label: t('kind'), options: [['file', t('kindFile')], ['dir', t('kindDir')]] },
      { key: 'before', type: 'select', label: t('before'), hint: t('beforeHint'), options: L.BEFORE.map(function (b) { return [b, b]; }) },
      { key: 'cmd', type: 'select', label: t('cmd'), options: L.CMDS.map(function (c) { return [c, c === 'none' ? t('cmdNone') : t('cmdLabel', { op: c })]; }) },
      { key: 'umask', type: 'choice', label: t('umask'), hint: t('umaskHint'), options: L.UMASKS.map(function (u) { return [u, u]; }) },
      { key: 'toggled', type: 'range', label: t('before'), min: 0, max: 511, step: 1, visible: function () { return false; } }
    ],

    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),

    legend: [
      { c: 1, label: t('legendSet') },
      { shape: 'hollow', label: t('legendClear') },
      { shape: 'hl', label: t('legendChanged') },
      { shape: 'lp-masked', label: t('legendMasked') }
    ],

    render: function (c) {
      if (track(c)) Promise.resolve().then(function () { ctl().set({ toggled: 0 }); });
      c.stage.replaceChildren(h('div', { class: 'lp' }, chmodPanel(c.state), createPanel(c.state)));
    },

    caption: function (c) {
      var k = L.captionKey(c.state, focus);
      return focus === 'chmod' ? chmodCaption(c.state, k) : createCaption(c.state, k);
    }
  });
})();
</script>
