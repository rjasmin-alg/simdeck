<!-- Shortening IPv6 addresses: adopted from the URM book's web edition (uvod-u-racunalne-mreze,
     ugradbeno/skracivanje-zapisa-ipv6-adrese.html) into the simdeck kit (docs/sim-ui.md). A stepper through chapter
     10's rules: lowercase, leading zeros, the longest zero run, "::" once, the check of eight groups. The model is in
     sim.js, the words in strings.js. -->
<html lang="hr" data-sim="ipv6-shorten">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skraćivanje zapisa IPv6 adrese · simdeck</title>
<meta name="description" content="Puna IPv6 adresa korak po korak do jedinog propisanog kratkog oblika: mala slova, vodeće nule, najdulji niz nula, :: jednom.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "ipv6-shorten",
  "class": "stepper",
  "steps": 5,
  "title": { "hr": "Skraćivanje zapisa IPv6 adrese", "en": "Shortening IPv6 addresses" },
  "concept": { "hr": "Vodeće nule van, najdulji niz nula-skupina postaje ::, i to samo jednom", "en": "Leading zeros go, the longest run of zero groups becomes ::, and only once" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="ipv6-shorten"]; colours only from kit tokens. */
[data-sim="ipv6-shorten"] .v6 {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 3cqh;
  height: 100%;
  padding: 2cqh 2cqw;
  --labw: 12rem;
  --colw: 1.4rem;
  --gw: min(calc((100cqw - var(--labw) - 4cqw - 7 * var(--colw)) / 8), 22cqh);
  --gfs: max(16px, min(calc(var(--gw) / 2.9), 6.5cqh));
}

/* the table: a label column, then group, colon, group, … (15 columns) */
[data-sim="ipv6-shorten"] .v6-table {
  display: grid;
  grid-template-columns: var(--labw) repeat(7, var(--gw) var(--colw)) var(--gw);
  row-gap: 1.2cqh;
  align-items: center;
  justify-content: center;
}
/* --r is the table row; on a phone every label takes its own row above its groups (rows 2r − 1 and 2r) */
[data-sim="ipv6-shorten"] .v6-table > * { grid-row: var(--r); }
[data-sim="ipv6-shorten"] .v6-label { grid-column: 1; font-size: var(--fs-md); font-weight: 700; padding-right: 0.8rem; line-height: 1.15; }
[data-sim="ipv6-shorten"] .v6-new { background: var(--hl); color: var(--on-hl); padding: 0 0.2rem; border-radius: var(--radius-sm); justify-self: start; }
[data-sim="ipv6-shorten"] .v6-num { text-align: center; font-family: var(--mono); font-size: var(--fs-sm); color: var(--muted); }
[data-sim="ipv6-shorten"] .v6-g {
  display: grid;
  place-items: center;
  height: calc(var(--gfs) * 1.7);
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: var(--gfs);
  font-weight: 700;
  line-height: 1;
}
/* a zero group that stays: dashed and empty; the run "::" replaces: solid series fill (.sd-fill) */
[data-sim="ipv6-shorten"] .v6-g.v6-zero { border: var(--line-w) dashed var(--ink); background: var(--bg); }
[data-sim="ipv6-shorten"] .v6-g.sd-changed { background: var(--hl); color: var(--on-hl); }
[data-sim="ipv6-shorten"] .v6-colon { text-align: center; font-family: var(--mono); font-size: var(--gfs); font-weight: 700; }
/* brackets under the runs: solid and thick for the chosen run, dashed for the ones that stay */
[data-sim="ipv6-shorten"] .v6-run {
  border-top: 0.35rem solid var(--ink);
  padding-top: 0.25rem;
  text-align: center;
  font-size: var(--fs-sm);
  font-weight: 700;
  line-height: 1.2;
  align-self: start;
}
[data-sim="ipv6-shorten"] .v6-run.v6-stays { border-top-style: dashed; border-top-width: var(--line-w); font-weight: 400; }
[data-sim="ipv6-shorten"] .v6-norun { grid-column: 2 / -1; text-align: center; font-size: var(--fs-md); color: var(--muted); }
[data-sim="ipv6-shorten"] .v6-short {
  grid-column: 2 / -1;
  text-align: center;
  font-family: var(--mono);
  font-size: calc(var(--gfs) * 1.15);
  font-weight: 700;
  overflow-wrap: anywhere;
}
[data-sim="ipv6-shorten"] .v6-short .v6-dc { background: var(--hl); color: var(--on-hl); outline: var(--line-w) solid var(--ink); border-radius: var(--radius-sm); padding: 0 0.1em; }
[data-sim="ipv6-shorten"] .v6-later { visibility: hidden; }

/* below the table: the check, the length and the type */
[data-sim="ipv6-shorten"] .v6-facts { display: flex; flex-wrap: wrap; gap: 1rem 1.4rem; justify-content: center; align-items: stretch; }
[data-sim="ipv6-shorten"] .v6-box {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0.2rem;
  padding: 0.5rem 1rem;
  border: var(--line-w) solid var(--line);
  border-left: 0.4rem solid var(--accent);
  border-radius: var(--radius-sm);
  background: var(--panel);
  font-size: var(--fs-stage);
  line-height: 1.2;
}
[data-sim="ipv6-shorten"] .v6-box small { font-size: var(--fs-md); color: var(--muted); }
[data-sim="ipv6-shorten"] .v6-box b { font-family: var(--mono); }
[data-sim="ipv6-shorten"] .v6-box.v6-ok { border-left-color: var(--ok); }

/* Phone and portrait: the stage grows with its content; the labels go above their groups. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ipv6-shorten"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="ipv6-shorten"] .v6 { height: auto; gap: 1rem; padding: 0.6rem 0.3rem; --labw: 0px; --colw: 0.45rem; --gw: calc((100cqw - 0.6rem - 7 * var(--colw)) / 8); --gfs: 14px; }
  [data-sim="ipv6-shorten"] .v6-table { row-gap: 0.3rem; }
  [data-sim="ipv6-shorten"] .v6-table > * { grid-row: calc(var(--r) * 2); }
  [data-sim="ipv6-shorten"] .v6-table > .v6-label { grid-row: calc(var(--r) * 2 - 1); grid-column: 2 / -1; padding: 0.3rem 0 0; }
  [data-sim="ipv6-shorten"] .v6-g { border-width: 1px; height: 1.6rem; letter-spacing: -0.03em; }
  [data-sim="ipv6-shorten"] .v6-colon { font-size: 14px; }
  [data-sim="ipv6-shorten"] .v6-run, [data-sim="ipv6-shorten"] .v6-num { font-size: 14px; }
  [data-sim="ipv6-shorten"] .v6-short { font-size: 1rem; }
}
</style>
</head>
<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Skraćivanje zapisa IPv6 adrese</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PH = L.phases;

  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, text); }
  function bold(text) { return h('b', { translate: 'no' }, text); }
  function gcol(i) { return 2 + 2 * i; } // grid column of group i (0 = leftmost); its colon is the next column

  // One row of groups: a label, then eight cells and the colons between them.
  function row(r, key, groups, o) {
    var cells = [h('div', { class: 'v6-label' + (o.fresh ? ' v6-new' : '') + (o.later ? ' v6-later' : ''), style: { '--r': String(r) } }, t(key))];
    for (var i = 0; i < 8; i++) {
      var inRun = o.chosen && i >= o.chosen.start && i < o.chosen.start + o.chosen.len;
      var zero = o.zeros && parseInt(groups[i], 16) === 0;
      var changed = o.changed && o.changed[i];
      cells.push(h('span', {
        class: 'v6-g' + (inRun ? ' sd-fill' : zero ? ' v6-zero' : '') + (changed ? ' sd-changed' : '') +
          (changed && o.forward ? ' sd-anim-in' : '') + (o.later ? ' v6-later' : ''),
        dataset: inRun ? { c: '1' } : null, translate: 'no',
        style: { gridColumn: String(gcol(i)), '--r': String(r) }
      }, groups[i]));
      if (i < 7) cells.push(h('span', { class: 'v6-colon' + (o.later ? ' v6-later' : ''), translate: 'no', 'aria-hidden': 'true',
        style: { gridColumn: String(gcol(i) + 1), '--r': String(r) } }, ':'));
    }
    return cells;
  }

  var RUN_KEY = { chosen: 'runChosen', single: 'runSingle', later: 'runLater', shorter: 'runShorter' };
  var TYPE_KEY = { global: 'typeGlobal', linkLocal: 'typeLinkLocal', uniqueLocal: 'typeUniqueLocal', multicast: 'typeMulticast',
    loopback: 'typeLoopback', unspecified: 'typeUnspecified' };

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { addr: 'fe80:0000:0000:0000:0204:61ff:fe9d:f156' } },
    { id: 'longest', label: t('presetLongest'), hint: t('presetLongestHint'), params: { addr: '2001:0db8:0000:0000:0000:ff00:0042:8329' } },
    { id: 'single', label: t('presetSingle'), hint: t('presetSingleHint'), params: { addr: '2001:0db8:0000:0001:0001:0001:0001:0001' } },
    { id: 'tie', label: t('presetTie'), hint: t('presetTieHint'), params: { addr: '2001:0db8:0000:0000:0001:0000:0000:0001' } },
    { id: 'unspecified', label: t('presetUnspecified'), hint: t('presetUnspecifiedHint'), params: { addr: '0000:0000:0000:0000:0000:0000:0000:0000' } },
    { id: 'loopback', label: t('presetLoopback'), hint: t('presetLoopbackHint'), params: { addr: '0000:0000:0000:0000:0000:0000:0000:0001' } },
    { id: 'uppercase', label: t('presetUpper'), hint: t('presetUpperHint'), params: { addr: 'ABCD:EF01:2345:6789:ABCD:EF01:2345:6789' } }
  ];

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'addr', type: 'select', label: t('addr'), options: L.addrs.map(function (a) { return [a, a]; }) }
    ],

    presets: presets,

    legend: [
      { c: 1, label: t('legendChosen') },
      { shape: 'hollow', label: t('legendZero') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state, at = PH.indexOf(s.phase), fwd = c.dir === 'forward';
      var fresh = function (k) { return at === k && !c.first; };
      var cells = [];
      for (var i = 0; i < 8; i++) cells.push(h('span', { class: 'v6-num', translate: 'no', 'aria-hidden': 'true',
        style: { gridColumn: String(gcol(i)), '--r': '1' } }, String(i + 1)));
      cells = cells.concat(
        row(2, 'rowFull', s.full, {}),
        row(3, 'rowLower', s.lower, { later: at < 1, fresh: fresh(1), changed: at === 1 ? s.lowerChanged : null, forward: fwd }),
        row(4, 'rowStrip', s.stripped, { later: at < 2, fresh: fresh(2), changed: at === 2 ? s.stripChanged : null, forward: fwd,
          zeros: at >= 3, chosen: at >= 3 ? s.chosen : null }));

      // row 5: a bracket under every run of zero groups, with what happens to it
      cells.push(h('div', { class: 'v6-label' + (fresh(3) ? ' v6-new' : '') + (at < 3 ? ' v6-later' : ''), style: { '--r': '5' } }, t('rowRuns')));
      if (!s.runs.length) cells.push(h('div', { class: 'v6-norun' + (at < 3 ? ' v6-later' : ''), style: { '--r': '5' } }, t('noRuns')));
      s.runs.forEach(function (r, k) {
        var v = s.verdicts[k];
        cells.push(h('div', { class: 'v6-run' + (v === 'chosen' ? '' : ' v6-stays') + (at < 3 ? ' v6-later' : ''),
          style: { gridColumn: gcol(r.start) + ' / ' + (gcol(r.start + r.len - 1) + 1), '--r': '5' } },
          data(r.len + ' × 0'), ' ', t(RUN_KEY[v])));
      });

      // row 6: the short form, the part "::" stands for highlighted
      var shortParts = s.chosen ? (function () {
        var cut = s.short.indexOf('::');
        return [s.short.slice(0, cut), h('span', { class: 'v6-dc' + (fwd && at === 4 ? ' sd-anim-in' : '') }, '::'), s.short.slice(cut + 2)];
      })() : [s.short];
      cells.push(h('div', { class: 'v6-label' + (fresh(4) ? ' v6-new' : '') + (at < 4 ? ' v6-later' : ''), style: { '--r': '6' } }, t('rowShort')));
      cells.push(h('div', { class: 'v6-short' + (at < 4 ? ' v6-later' : ''), translate: 'no', style: { '--r': '6' } }, shortParts));

      var later = at < 5 ? ' v6-later' : '';
      var facts = [
        h('div', { class: 'v6-box v6-ok' + later },
          h('small', null, t('checkTitle')),
          bold(s.chosen ? s.kept + ' + ' + s.chosen.len + ' = 8' : '8 = 8'),
          h('small', null, t(s.chosen ? 'checkNote' : 'checkNoneNote'))),
        h('div', { class: 'v6-box' + later },
          h('small', null, t('lengthTitle')),
          bold(s.fullLength + ' → ' + s.short.length),
          h('small', null, t.n('saved', s.fullLength - s.short.length))),
        h('div', { class: 'v6-box' + later },
          h('small', null, t('typeTitle')),
          s.prefix ? bold(s.prefix) : null,
          h('span', null, t(s.type ? TYPE_KEY[s.type] : 'typeNone')))
      ];

      c.stage.replaceChildren(h('div', { class: 'v6' },
        h('div', { class: 'v6-table' }, cells),
        h('div', { class: 'v6-facts' }, facts)));
    },

    caption: function (c) {
      var s = c.state;
      var v = { full: bold(s.full.join(':')), lower: bold(s.lower.join(':')), stripped: bold(s.stripped.join(':')), short: bold(s.short) };
      switch (s.phase) {
        case 'start': return t.parts('captionStart', v);
        case 'lowercase': return t.parts(s.lowerChanged.indexOf(true) >= 0 ? 'captionLowerChanged' : 'captionLowerSame', v);
        case 'leading': return t.parts(s.stripChanged.indexOf(true) >= 0 ? 'captionLeading' : 'captionLeadingNone', v);
        case 'runs':
          if (!s.runs.length) return t.parts('captionRunsNone', v);
          if (!s.chosen) return t.parts('captionRunsSingle', v);
          v.pos = bold(String(s.chosen.start + 1));
          v.span = h('b', null, t.n('span', s.chosen.len));
          if (s.ties > 1) return t.parts('captionRunsTie', v);
          return t.parts('captionRuns', v).concat(s.runs.length > 1 ? [' ', t('captionRunsOthers')] : []);
        case 'compress': return t.parts(s.chosen ? 'captionCompress' : 'captionCompressNone', v);
        default:
          var out = s.chosen
            ? t.parts('captionCheck', { kept: t.n('kept', s.kept), replaced: t.n('replaced', s.chosen.len) })
            : t.parts('captionCheckNone', v);
          var p = { prefix: bold(s.prefix || ''), type: h('b', null, t(s.type ? TYPE_KEY[s.type] : 'typeNone')) };
          var typeKey = !s.type ? 'captionTypeNone' : (s.type === 'loopback' || s.type === 'unspecified') ? 'captionTypeSpecial' : 'captionType';
          return out.concat([' '], t.parts(typeKey, p));
      }
    }
  });
})();
</script>
</body>
</html>
