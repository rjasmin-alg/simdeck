<style>
/* Page CSS: every selector starts with [data-sim="rect-pulse-spectrum"]; colours only from kit tokens. */
[data-sim="rect-pulse-spectrum"] .rp {
  display: grid;
  grid-template-rows: minmax(0, 3fr) minmax(0, 2fr);
  gap: 1.6cqh;
  height: 100%;
  padding: 1.6cqh 1.6cqw;
}
[data-sim="rect-pulse-spectrum"] .rp-panel { display: flex; flex-direction: column; min-height: 0; gap: 0.2rem; }
[data-sim="rect-pulse-spectrum"] .rp-head { display: flex; align-items: baseline; gap: 0.6rem 1.4rem; flex-wrap: wrap; }
[data-sim="rect-pulse-spectrum"] .rp-label { font-weight: 700; }
[data-sim="rect-pulse-spectrum"] .rp-note { font-size: var(--fs-sm); color: var(--muted); }
[data-sim="rect-pulse-spectrum"] .rp-badge {
  margin-left: auto;
  padding: 0 0.6rem;
  border: var(--line-w) solid currentColor;
  border-radius: var(--radius-sm);
  font-weight: 700;
  color: var(--c2);
}
[data-sim="rect-pulse-spectrum"] .rp-plot { position: relative; flex: 1; min-height: 6rem; }
[data-sim="rect-pulse-spectrum"] .rp-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="rect-pulse-spectrum"] .rp-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="rect-pulse-spectrum"] .rp-plot text.rp-peak-label { fill: var(--c2); font-weight: 700; }
[data-sim="rect-pulse-spectrum"] .rp-plot text.rp-bar-label { fill: var(--c3); }
[data-sim="rect-pulse-spectrum"] .rp-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="rect-pulse-spectrum"] .rp-grid { stroke: var(--line); stroke-width: 1; opacity: 0.5; }
[data-sim="rect-pulse-spectrum"] .rp-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="rect-pulse-spectrum"] .rp-line { fill: none; stroke-linejoin: round; }
[data-sim="rect-pulse-spectrum"] .rp-line[data-line="ideal"] { stroke: var(--c2); stroke-width: 2.5; stroke-dasharray: 10 7; }
[data-sim="rect-pulse-spectrum"] .rp-line[data-line="sum"] { stroke: var(--c1); stroke-width: 3.5; }
[data-sim="rect-pulse-spectrum"] .rp-peak-guide { stroke: var(--c2); stroke-width: 1.5; stroke-dasharray: 3 4; }
[data-sim="rect-pulse-spectrum"] .rp-peak { fill: var(--bg); stroke: var(--c2); stroke-width: 3; }
[data-sim="rect-pulse-spectrum"] .rp-bar { fill: var(--c3); }

[data-sim="rect-pulse-spectrum"] .rp-envelope { fill: none; stroke: var(--c3); stroke-width: 1.5; stroke-dasharray: 2 5; opacity: 0.8; }
/* The browser shrinks <sub> to "smaller" (13 px on a phone); the subscripts stay above the text floor. */

  [data-sim="rect-pulse-spectrum"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="rect-pulse-spectrum"] .rp { height: auto; grid-template-rows: none; gap: 0.8rem; padding: 0.6rem; }
  [data-sim="rect-pulse-spectrum"] .rp-plot { flex: none; height: 12rem; }
  [data-sim="rect-pulse-spectrum"] .rp-credit { text-align: left; }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Spektar pravokutnog signala</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="rp-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x, d) { var s = x.toFixed(d); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function frame(box, padB) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return null;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 3.2 * rem, r: 0.8 * rem, t: 0.6 * rem, b: padB * rem };
    return { W: W, H: H, rem: rem, pad: pad, cw: W - pad.l - pad.r, ch: H - pad.t - pad.b,
      svg: s('svg', { width: W, height: H, 'aria-hidden': 'true' }) };
  }

  var labels = {
    fundamental: 'presetFundamental', three: 'presetThree', five: 'presetFive', nine: 'presetNine',
    'twenty-five': 'presetTwentyFive', 'ninety-nine': 'presetNinetyNine', max: 'presetMax'
  };

  // ── time domain: the ideal square wave and the Fourier sum over −3π/2 … 3π/2 ──
  // Tick labels are multiples of π/2: symbols, not words (translate="no").
  var PI_TICKS = ['−3π/2', '−π', '−π/2', '0', 'π/2', 'π', '3π/2'];
  function drawTime(box, st) {
    var f = frame(box, 1.6);
    if (!f) return;
    var pad = f.pad, cw = f.cw, ch = f.ch, rem = f.rem, svg = f.svg;
    var yMax = 1.4;
    var X = function (x) { return pad.l + ((x - L.X_MIN) / (L.X_MAX - L.X_MIN)) * cw; };
    var Y = function (y) { return pad.t + ch * (1 - (y + yMax) / (2 * yMax)); };
    svg.append(s('rect', { class: 'rp-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    var ticks = s('g', { translate: 'no' });
    [-1, 1].forEach(function (v) { svg.append(s('line', { class: 'rp-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) })); });
    // On a narrow plot (a phone) only the jumps −π, 0 and π are labelled, or the labels run into each other.
    var sparse = cw / (PI_TICKS.length - 1) < 3.6 * rem;
    PI_TICKS.forEach(function (label, i) {
      var x = X(L.X_MIN + i * Math.PI / 2);
      if (i > 0 && i < PI_TICKS.length - 1) svg.append(s('line', { class: 'rp-grid', x1: x, x2: x, y1: pad.t, y2: pad.t + ch }));
      if (sparse && i % 2 === 0) return;
      var anchor = i === 0 ? 'start' : i === PI_TICKS.length - 1 ? 'end' : 'middle';
      ticks.append(s('text', { x: x, y: f.H - 0.3 * rem, 'text-anchor': anchor }, label));
    });
    svg.append(s('line', { class: 'rp-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    [-1, 0, 1].forEach(function (v) {
      ticks.append(s('text', { x: pad.l - 0.6 * rem, y: Y(v) + 0.35 * rem, 'text-anchor': 'end' }, v < 0 ? '−1' : String(v)));
    });
    svg.append(ticks);
    var poly = function (kind, pts) {
      return s('polyline', { class: 'rp-line', 'data-line': kind,
        points: pts.map(function (p) { return X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ') });
    };
    svg.append(poly('ideal', L.idealCorners()));
    svg.append(poly('sum', L.curve(st.n, L.pointsFor(st.n))));
    // The first peak after the jump at 0: a dotted level line to the right edge, a ring and its height.
    var px = X(st.peak.x), py = Y(st.peak.y);
    svg.append(s('line', { class: 'rp-peak-guide', x1: px, x2: pad.l + cw, y1: py, y2: py }));
    svg.append(s('circle', { class: 'rp-peak', cx: px, cy: py, r: 0.45 * rem }));
    svg.append(s('text', { class: 'rp-peak-label', x: X(Math.PI / 2), y: py - 0.5 * rem, 'text-anchor': 'middle' }, num(st.peak.y, 3)));
    box.replaceChildren(svg);
  }

  // ── spectrum: one bar per odd harmonic in the sum, outlines for the odd ones still missing ──
  function drawSpectrum(box, st) {
    var f = frame(box, 1.6);
    if (!f) return;
    var pad = f.pad, cw = f.cw, ch = f.ch, rem = f.rem, svg = f.svg;
    var kMax = Math.max(st.n, 15) + 1, aMax = 1.45;
    var X = function (k) { return pad.l + (k / kMax) * cw; };
    var Y = function (a) { return pad.t + ch * (1 - a / aMax); };
    var gap = X(2) - X(0);   // distance between two odd harmonics
    var bw = Math.max(1.5, Math.min(gap * 0.55, 1.4 * rem));
    svg.append(s('rect', { class: 'rp-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    var ticks = s('g', { translate: 'no' });
    [0.5, 1].forEach(function (v) { svg.append(s('line', { class: 'rp-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) })); });
    [0, 0.5, 1].forEach(function (v) {
      ticks.append(s('text', { x: pad.l - 0.6 * rem, y: Y(v) + 0.35 * rem, 'text-anchor': 'end' }, v === 0 ? '0' : num(v, 1)));
    });
    var every = kMax <= 32 ? 2 : kMax <= 130 ? 10 : 50;
    for (var k = every === 2 ? 1 : 0; k <= kMax - (every === 2 ? 1 : 0); k += every) {
      ticks.append(s('text', { x: X(k), y: f.H - 0.3 * rem, 'text-anchor': 'middle' }, String(k)));
    }
    svg.append(ticks);
    // 4/(kπ) as a dotted curve over the bars: the 1/k fall of the amplitudes.
    var env = [];
    for (var i = 0; i <= 200; i++) { var kk = 1 + (i / 200) * (kMax - 1); env.push(X(kk).toFixed(1) + ',' + Y(L.amplitude(1) / kk).toFixed(1)); }
    svg.append(s('polyline', { class: 'rp-envelope', points: env.join(' ') }));
    for (var g = st.n + 2; g < kMax; g += 2) {
      svg.append(s('rect', { class: 'rp-ghost', x: X(g) - bw / 2, y: Y(L.amplitude(g)), width: bw, height: Y(0) - Y(L.amplitude(g)) }));
    }
    var labelled = gap > 3 * rem;
    st.harmonics.forEach(function (hm) {
      svg.append(s('rect', { class: 'rp-bar', x: X(hm.k) - bw / 2, y: Y(hm.a), width: bw, height: Y(0) - Y(hm.a) }));
      if (labelled) svg.append(s('text', { class: 'rp-bar-label', x: X(hm.k), y: Y(hm.a) - 0.3 * rem, 'text-anchor': 'middle' }, num(hm.a, 2)));
    });
    svg.append(s('line', { class: 'rp-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    box.replaceChildren(svg);
  }

  function panel(label, note, extra) {
    var plot = h('div', { class: 'rp-plot' });
    return { plot: plot, el: h('div', { class: 'rp-panel' },
      h('div', { class: 'rp-head' }, h('span', { class: 'rp-label' }, label), note ? h('span', { class: 'rp-note' }, note) : null, extra || null),
      plot) };
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'n', type: 'range', label: t('n'), hint: t('nHint'), min: L.N_MIN, max: L.N_MAX, step: L.N_STEP,
        format: function (v) { return 'N = ' + v; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 2, shape: 'hollow', label: t('legendIdeal') },
      { c: 1, label: t('legendSum') },
      { c: 3, label: t('legendBars') }
    ],

    render: function (c) {
      var st = c.state;
      var badge = h('span', { class: 'rp-badge' }, t('overshoot', { v: num(st.overshoot * 100, 1) }));
      var a = panel(t('panelTime'), t('panelTimeNote'), badge);
      var b = panel(t('panelSpectrum'), t('panelSpectrumNote'), h('span', { class: 'rp-note' },
        t.n('harmonicsInSum', st.count), st.n < 15 ? t('ghostNote') : ''));
      c.stage.replaceChildren(h('div', { class: 'rp' }, a.el, b.el));
      drawTime(a.plot, st);
      drawSpectrum(b.plot, st);
    },

    caption: function (c) {
      var st = c.state;
      var n = h('b', null, String(st.n));
      var o = num(st.overshoot * 100, 1);
      if (st.n === 1) return t.parts('captionOne', { n: n });
      if (st.n === 3) return t.parts('captionThree', { n: n, o: o });
      if (st.n < 49) return t.parts('captionFew', { n: n, k: String(st.n), o: o });
      return t.parts('captionMany', { n: n, o: o, count: t.n('harmonicsInSum', st.count) });
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
