     joining user's quota, the machine password p0, the restart and the secure channel. Or: a snapshot of the joined
     PC07, password changes every 30 days, the revert, the secure channel checked against the object's current and
     previous password, and the administrator's reset. A stepper, one message or one event per step.

     password pair) and the joining user (quota) or the administrator; for the revert a day timeline under it.
     Below: kit view K1 (message sequence chart, kit/sequence.js) with the lanes PC07, DNS and DC01.

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { cl: '1', dc: '2', dns: '3' };

  /** Data (names, addresses, DNs, accounts, passwords, codes) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'dj-mono' : cls || null }, String(text)); }
  function q(text) { return h('b', { translate: 'no' }, String(text)); }
  /** A long name (DN, SRV name) that may break after each comma or dot. */
  function breakable(text) {
    var out = [];
    String(text).split(/(?<=[,.])/).forEach(function (part, i) { if (i) out.push(h('wbr')); out.push(part); });
    return out;
  }
  function qLong(text) { return h('b', { translate: 'no' }, breakable(text)); }
  function sub(text) { return h('span', { class: 'dj-sub' }, text); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function acc(name) { return L.NETBIOS + '\\' + name; }
  function last(c) { return c.n > 0 ? c.state.log[c.state.log.length - 1] : null; }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }

  /** A password chip; `was` is the same slot one step earlier (changed → highlighted); `match` 'yes' | 'no'. */
  function pw(c, label, was, match) {
    var ds = {};
    if (label === null || label === undefined) ds.empty = '';
    if (match) ds.match = match;
    var changed = c.prev && was !== undefined && was !== label && label !== null;
    return h('span', { class: 'dj-pw' + (changed ? ' sd-changed' + anim(c) : ''), translate: 'no', dataset: ds },
      label === null || label === undefined ? '—' : label,
      match === 'yes' ? h('span', { class: 'dj-mk', 'aria-hidden': 'true' }, '✓') : null);
  }
  function pair(c, now, before, marks) {
    marks = marks || {};
    return h('span', { class: 'dj-pair' },
      sub(t('cur')), pw(c, now.cur, before ? before.cur : undefined, marks.cur),
      sub(t('prev')), pw(c, now.prev, before ? before.prev : undefined, marks.prev));
  }

  // ── strip ──
  function renderClient(c) {
    var s = c.state, cl = s.client, e = last(c), b = c.prev && c.prev.client;
    var tags = [h('span', { class: 'dj-tag' }, t(cl.joined ? 'roleMember' : 'roleWorkgroup'))];
    if (cl.restart) tags.push(h('span', { class: 'dj-tag', dataset: { k: 'warn' } }, t('restartTag')));
    var active = e && ['srvQuery', 'ping', 'create', 'setPwd', 'restart', 'channel', 'logon', 'snapshot', 'change', 'revert', 'reset', 'fail'].indexOf(e.kind) >= 0;
    var box = h('section', { class: 'dj-box', dataset: active ? { active: '' } : {} },
      h('h2', null, data(cl.name, ''), data(cl.ip, 'dj-sub dj-mono'), tags),
      h('div', { class: 'dj-line' }, sub(t('dnsLine')), data(cl.dns), sub(cl.dns === L.DC.ip ? t('dnsOnDc') : t('dnsPublic'))),
      h('div', { class: 'dj-line' }, sub(t('lsa')), pair(c, cl.pwd, b && b.pwd)));
    if (cl.snapshot) box.append(h('div', { class: 'dj-line' }, sub(t('snapLine', { d: cl.snapshot.day })), pw(c, cl.snapshot.pwd.cur)));
    return box;
  }
  function renderChannel(c) {
    var s = c.state, e = last(c);
    var k = s.secureChannel;
    var changed = c.prev && c.prev.secureChannel !== k;
    var box = h('section', { class: 'dj-box dj-ch' + (changed ? ' sd-changed' : '') },
      h('h2', null, t('chanTitle')),
      h('div', { class: 'dj-ch-bar', dataset: { k: k } }, h('span', { class: 'dj-ch-sym', 'aria-hidden': 'true', translate: 'no' }, { none: '–', ok: '✓', broken: '✕' }[k])),
      h('span', { class: 'dj-ch-word' }, t({ none: 'chanNone', ok: 'chanOk', broken: 'chanBroken' }[k])));
    if (e && e.kind === 'channel') box.append(sub(t(e.match === 'cur' ? 'matchCur' : e.match === 'prev' ? 'matchPrev' : 'matchNone')));
    return box;
  }
  function renderObject(c) {
    var s = c.state, o = s.dc.objects.PC07, e = last(c);
    var bo = c.prev && c.prev.dc.objects.PC07;
    var active = e && ['ping', 'pong', 'create', 'setPwd', 'channel', 'logon', 'change', 'reset'].indexOf(e.kind) >= 0;
    var box = h('section', { class: 'dj-box', dataset: active ? { active: '' } : {} }, h('h2', null, data(L.DC.name, ''), h('span', { class: 'dj-sub' }, t('objTitle'))));
    if (!o) {
      box.append(h('div', { class: 'dj-line' }, h('span', { class: 'dj-tag dj-none' }, t('objNone')), data('CN=PC07', 'dj-sub dj-mono')));
      return box;
    }
    var marks = {};
    if (e && e.kind === 'channel') {
      if (e.match) marks[e.match] = 'yes';
      else { marks.cur = 'no'; if (o.pwd.prev !== null) marks.prev = 'no'; }
    }
    var created = c.prev && !bo;
    box.append(h('div', { class: 'dj-line' }, h('span', { class: 'dj-dn' + (created ? ' sd-changed' + anim(c) : ''), translate: 'no' }, breakable(o.dn))));
    box.append(h('div', { class: 'dj-line' }, sub(t('objPwd')), pair(c, o.pwd, bo ? bo.pwd : (c.prev ? { cur: null, prev: null } : undefined), marks)));
    return box;
  }
  function renderUser(c) {
    var s = c.state, e = last(c), qd = s.dc.quota;
    if (s.scenario === 'revert') {
      var on = e && e.kind === 'reset';
      return h('section', { class: 'dj-box', dataset: on ? { active: '' } : {} },
        h('h2', null, t('adminTitle')),
        h('div', { class: 'dj-line' }, data(acc(L.ADMIN)), sub(t('adminLine'))),
        h('div', { class: 'dj-line' }, data(acc(L.USER)), sub(t('userOrdinary'))));
    }
    var was = c.prev ? c.prev.dc.quota.count : qd.count;
    var refused = e && e.kind === 'create' && !e.ok;
    var cells = [];
    for (var i = 0; i < qd.max; i++) {
      var ds = {};
      if (i < qd.count) ds.on = '';
      if (i >= was && i < qd.count) ds['new'] = '';
      cells.push(h('span', { dataset: ds }));
    }
    var meter = h('span', { class: 'dj-quota', 'aria-hidden': 'true', dataset: refused ? { fullRefused: '' } : {} }, cells);
    return h('section', { class: 'dj-box', dataset: e && e.kind === 'create' ? { active: '' } : {} },
      h('h2', null, t('userTitle')),
      h('div', { class: 'dj-line' }, data(acc(L.USER)), sub(t('userOrdinary'))),
      h('div', { class: 'dj-line' }, sub(t('joinedCount')), meter, data(qd.count + ' / ' + qd.max), refused ? h('span', { class: 'dj-mk', dataset: { k: 'no' }, 'aria-hidden': 'true' }, '✕') : null),
      h('div', { class: 'dj-line' }, data('ms-DS-MachineAccountQuota = ' + qd.max, 'dj-sub dj-mono')));
  }

  // ── timeline (revert) ──
  function renderTimeline(c) {
    var s = c.state, p = c.params, e = last(c);
    var MAXD = 90;
    function x(d) { return (d / MAXD * 100) + '%'; }
    function anchor(d) { return d <= 8 ? 'start' : d >= 82 ? 'end' : 'mid'; }
    var track = h('div', { class: 'dj-tl-track' }, h('div', { class: 'dj-tl-axis' }));
    [0, 30, 60, 90].forEach(function (d) {
      track.append(h('span', { class: 'dj-tl-tick', style: 'left:' + x(d) }));
      track.append(h('span', { class: 'dj-tl-num', style: 'left:' + x(d), translate: 'no' }, String(d)));
    });
    var done = s.log.filter(function (ev) { return ev.kind === 'change' && !ev.afterRevert; });
    // the snapshot (day 0) and the due changes before the revert, above the axis; planned ones dashed
    var snapDone = !!s.client.snapshot;
    track.append(h('span', { class: 'dj-tl-mark', style: 'left:' + x(0), dataset: Object.assign({ row: 'up', anchor: 'start' }, snapDone ? {} : { plan: '' }) },
      h('span', { class: 'dj-tl-flag' + (e && e.kind === 'snapshot' ? ' sd-changed' : '') }, t('tlSnap')), pw({ prev: null }, 'p0')));
    for (var d = 30, k = 1; d <= p.snapshotAge; d += 30, k++) {
      var ev = done[k - 1];
      var now = e && e.kind === 'change' && ev && e.n === ev.n;
      track.append(h('span', { class: 'dj-tl-mark', style: 'left:' + x(d), dataset: Object.assign({ row: 'up', anchor: anchor(d) }, ev ? {} : { plan: '' }) },
        h('span', { class: 'dj-pw' + (now ? ' sd-changed' : ''), translate: 'no', dataset: ev ? {} : { empty: '' } }, ev ? ev.label : '?')));
    }
    var rev = s.client.reverted;
    track.append(h('span', { class: 'dj-tl-mark', style: 'left:' + x(p.snapshotAge), dataset: Object.assign({ row: 'down', anchor: anchor(p.snapshotAge) }, rev ? {} : { plan: '' }) },
      h('span', { class: 'dj-tl-flag' + (e && e.kind === 'revert' ? ' sd-changed' : ''), translate: 'no' }, '↶'), h('span', null, t('tlRevert')),
      // the passwords set on the revert day after the revert (the client's own change, or the admin's reset)
      s.log.filter(function (x) { return (x.kind === 'change' && x.afterRevert) || x.kind === 'reset'; }).map(function (x) {
        return h('span', { class: 'dj-pw' + (e && e.n === x.n ? ' sd-changed' : ''), translate: 'no' }, x.label);
      })));
    // the days that have passed: a thick bar along the axis
    track.append(h('span', { class: 'dj-tl-done', style: 'width:' + x(s.day), 'aria-hidden': 'true' }));
    return h('section', { class: 'dj-box dj-tl' }, h('h2', null, t('tlTitle'), sub([t('tlToday'), ': ', t('dayN', { d: s.day })])), track);
  }

  // ── chart ──
  function lanes(c) {
    var s = c.state, cl = s.client, e = last(c);
    function on(id) {
      if (!e) return null;
      var who = { srvQuery: ['cl', 'dns'], srvAnswer: ['cl', 'dns'], fail: ['cl'], ping: ['cl', 'dc'], pong: ['cl', 'dc'], create: ['cl', 'dc'],
        setPwd: ['cl', 'dc'], restart: ['cl'], channel: ['cl', 'dc'], logon: e.ok ? ['cl', 'dc'] : ['cl'], snapshot: ['cl'],
        change: ['cl', 'dc'], revert: ['cl'], reset: ['cl', 'dc'] }[e.kind] || [];
      return who.indexOf(id) >= 0 ? 'active' : null;
    }
    var out = [{ id: 'cl', mark: 'P', c: COLOUR.cl, shape: 'square', name: data(cl.name, ''), state: on('cl'),
      tags: sub(t('laneClient')), body: [h('div', { class: 'dj-line' }, data(cl.ip))] }];
    if (s.scenario === 'join') {
      var pub = cl.dns !== L.DC.ip;
      out.push({ id: 'dns', mark: 'N', c: COLOUR.dns, name: data('DNS', ''), state: on('dns'),
        tags: sub(t(pub ? 'dnsPublic' : 'dnsOnDc')), body: [h('div', { class: 'dj-line' }, data(cl.dns))] });
    }
    out.push({ id: 'dc', mark: 'D', c: COLOUR.dc, name: data(L.DC.name, ''), state: on('dc'),
      tags: sub(t('laneDc')), body: [h('div', { class: 'dj-line' }, data(L.DC.ip))] });
    return out;
  }
  function rows(c) {
    var out = [];
    c.state.log.forEach(function (e) {
      var r = null, ch = e.n === c.n;
      var time = h('span', null, t('dayN', { d: e.day }));
      switch (e.kind) {
        case 'srvQuery': r = { from: 'cl', to: 'dns', label: 'SRV?', c: COLOUR.cl, line: 'dotted', fields: data('_ldap._tcp.dc._msdcs', 'dj-long dj-mono') }; break;
        case 'srvAnswer':
          r = e.rcode === 'NOERROR'
            ? { from: 'dns', to: 'cl', label: 'SRV', c: COLOUR.dns, line: 'dotted', fields: data('DC01:' + e.port) }
            : { from: 'dns', to: 'cl', label: 'NXDOMAIN', c: COLOUR.dns, line: 'dotted', fields: data('✕') };
          break;
        case 'fail': r = { kind: 'note', lane: 'cl', text: t('noteNoDc'), k: 'fill' }; break;
        case 'ping': r = { from: 'cl', to: 'dc', label: 'LDAP ping', c: COLOUR.cl, fields: data('UDP ' + e.port) }; break;
        case 'pong': r = { from: 'dc', to: 'cl', label: h('span', null, t('pongLabel')), c: COLOUR.dc, fields: data(e.dc + ' · ' + e.netbios) }; break;
        case 'create':
          r = { from: 'cl', to: 'dc', label: 'LDAP add', c: COLOUR.cl, fields: data('CN=PC07'),
            re: { dc: e.ok ? h('span', null, t('reCreated')) : h('span', null, t('reQuota'), ' ', data(e.count + '/' + e.max, '')) } };
          if (!e.ok) r.lost = ['dc'];
          break;
        case 'setPwd': r = { from: 'cl', to: 'dc', label: 'SAMR', c: COLOUR.cl, fields: data(e.label), re: { dc: h('span', null, t('reSet')) } }; break;
        case 'restart': r = { kind: 'note', lane: 'cl', text: t('noteRestart'), k: 'solid' }; break;
        case 'channel':
          r = { from: 'cl', to: 'dc', label: 'Netlogon', c: COLOUR.cl, lock: true, fields: data(e.pwd),
            re: { dc: e.ok ? h('span', null, '✓ ', t(e.match === 'cur' ? 'matchCur' : 'matchPrev'))
              : data(e.pwd + ' ∉ {' + e.obj.cur + (e.obj.prev ? ', ' + e.obj.prev : '') + '}') } };
          if (!e.ok) r.lost = ['dc'];
          break;
        case 'logon':
          r = e.ok ? { from: 'cl', to: 'dc', label: h('span', null, t('logonField')), c: COLOUR.cl, fields: data(e.user), re: { dc: data('✓', '') } }
            : { kind: 'note', lane: 'cl', text: t('noteTrust'), k: 'fill' };
          break;
        case 'snapshot': r = { kind: 'note', lane: 'cl', text: h('span', null, t('noteSnapshot'), ' ', data(e.pwd.cur, '')), k: 'solid' }; break;
        case 'change': r = { from: 'cl', to: 'dc', label: 'Netlogon', c: COLOUR.cl, lock: true, fields: data(e.from + ' → ' + e.label), re: { dc: h('span', null, t('reSet')) } }; break;
        case 'revert': r = { kind: 'note', lane: 'cl', text: h('span', null, t('noteRevert'), ' ', data(e.before.cur + ' → ' + e.after.cur, '')), k: 'solid' }; break;
        case 'reset': r = { from: 'cl', to: 'dc', label: 'SAMR', c: COLOUR.cl, fields: h('span', null, data(e.label), h('span', { class: 'dj-long' }, ' ', sub(t('adminTitle')))), re: { dc: h('span', null, t('reSet')) } }; break;
      }
      if (!r) return;
      r.time = time;
      r.changed = ch;
      out.push(r);
    });
    return out;
  }
  function renderChart(c) {
    return Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(c),
      rows: rows(c),
      timeWidth: '6rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── captions ──
  function known(o) { return o.prev ? o.cur + ', ' + o.prev : o.cur; }
  function caption(c) {
    var s = c.state, p = c.params, cl = s.client, n = c.n;
    var C = q(cl.name), D = q(L.DOMAIN), U = q(acc(L.USER));
    if (c.first) {
      if (s.scenario === 'revert') return rich('capStart_revert', { c: C, p: q('p0'), a: q(p.snapshotAge) });
      var start = rich('capStart_join', { c: C, dns: q(cl.dns), u: U, d: D });
      if (cl.dns !== L.DC.ip) start.push(t('capStartPublicTail'));
      if (s.dc.quota.count > 0) start.push(t.n('capStartQuotaTail', s.dc.quota.count, { u: acc(L.USER) }));
      return start;
    }
    var e = last(c), o = s.dc.objects.PC07;
    switch (e.kind) {
      case 'srvQuery': return rich('capSrvQuery', { n: n, c: C, dns: q(e.server), q: qLong(e.q) });
      case 'srvAnswer':
        if (e.rcode === 'NOERROR') return rich('capSrvAnswer', { n: n, c: C, target: qLong(e.target), ip: q(e.ip) });
        return rich('capNx', { n: n, d: D });
      case 'fail': return rich('capFail', { n: n });
      case 'ping': return rich('capPing', { n: n, d: D });
      case 'pong': return rich('capPong', { n: n, d: D, nb: q(e.netbios) });
      case 'create':
        if (e.ok) return rich('capCreate', { n: n, u: U, dn: qLong(e.dn), k: q(e.count + 1), max: q(e.max) });
        return rich('capQuota', { n: n, u: U, max: q(e.max), attr: q('ms-DS-MachineAccountQuota') });
      case 'setPwd': return rich('capSetPwd', { n: n, c: C, p: q(e.label) });
      case 'restart': return rich('capRestart', { n: n, c: C, d: D });
      case 'channel':
        if (s.scenario === 'join') return rich('capChannelJoin', { n: n, p: q(e.pwd) });
        if (!e.ok) return rich('capChannelBroken', { n: n, c: C, p: q(e.pwd), cur: q(e.obj.cur), prev: q(e.obj.prev) });
        if (s.result === 'repairing') return rich('capChannelRepaired', { n: n, p: q(e.pwd) });
        return rich(e.match === 'prev' ? 'capChannelPrev' : 'capChannelCur', { n: n, p: q(e.pwd) });
      case 'logon': {
        if (!e.ok) return rich('capLogonRefused', { n: n, u: U });
        var ok = rich('capLogonOk', { n: n, u: U });
        if (c.last && s.result === 'ok' && !s.log.some(function (x) { return x.kind === 'change'; })) ok.push(t('capEndQuiet'));
        return ok;
      }
      case 'snapshot': return rich('capSnapshot', { n: n, p: q(e.pwd.cur) });
      case 'change':
        if (e.afterRevert) return rich('capChangeAfter', { n: n, c: C, age: q(e.day - (c.prev ? c.prev.client.lastSet : 0)), from: q(e.from), to: q(e.label) });
        return rich('capChange', { n: n, day: q(e.day), c: C, from: q(e.from), to: q(e.label) });
      case 'revert': return rich('capRevert', { n: n, day: q(e.day), c: C, p: q(e.after.cur), known: q(known(o.pwd)) });
      case 'reset': return rich('capReset', { n: n, adm: q(acc(e.by)), c: C, p: q(e.label) });
      default: return '';
    }
  }

  function notJoin(p) { return p.scenario === 'revert' ? t('offJoin') : false; }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scenario', type: 'choice', label: t('pScenario'), options: [['join', t('scJoin')], ['revert', t('scRevert')]] },
      { key: 'dnsServer', type: 'choice', label: t('pDns'), options: [['dc01', t('optDc01')], ['public', t('optPublic')]], disabled: notJoin },
      { key: 'joinsByUser', type: 'range', label: t('pJoins'), min: 0, max: 10, step: 1, disabled: notJoin },
      { key: 'snapshotAge', type: 'range', label: t('pAge'), min: 0, max: 90, step: 5,
        format: function (v) { return t('dayN', { d: v }); }, disabled: function (p) { return p.scenario === 'join' ? t('offRevert') : false; } }
    ],

    presets: [
      { id: 'join', label: t('presetJoin'), hint: t('presetJoinHint'), params: {} },
      { id: 'revert-65-days', label: t('presetRevert65'), hint: t('presetRevert65Hint'), params: { scenario: 'revert', snapshotAge: 65 } },
      { id: 'revert-35-days', label: t('presetRevert35'), hint: t('presetRevert35Hint'), params: { scenario: 'revert', snapshotAge: 35 } },
      { id: 'wrong-dns', label: t('presetWrongDns'), hint: t('presetWrongDnsHint'), params: { dnsServer: 'public' } },
      { id: 'quota', label: t('presetQuota'), hint: t('presetQuotaHint'), params: { joinsByUser: 10 } }
    ],

    legend: [
      { shape: 'dot', label: t('legDns') },
      { shape: 'line', label: t('legLdap') },
      { shape: 'double', label: t('legNetlogon') },
      { shape: 'pw', label: t('legPw') },
      { shape: 'broken', label: t('legBroken') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      var strip = h('div', { class: 'dj-strip' }, renderClient(c), renderChannel(c), renderObject(c), renderUser(c));
      var parts = [strip];
      if (c.state.scenario === 'revert') parts.push(renderTimeline(c));
      parts.push(chart);
      c.stage.replaceChildren(h('div', { class: 'dj' }, parts));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
</html>
