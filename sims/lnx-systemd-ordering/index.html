<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVGNS = 'http://www.w3.org/2000/svg';

  var SYM = { active: '●', failed: '✗', dependency: '⊘', none: '○' };
  var ST = { active: 'stActive', failed: 'stFailed', dependency: 'stDependency', none: 'stNone' };
  var AREA = {};
  AREA[L.MU] = 'mu'; AREA[L.APP] = 'app'; AREA[L.DB] = 'db'; AREA[L.NET] = 'net';

  /** Text with `code` spans: the tables mark unit names and directives with backticks. */
  function coded(text) {
    return String(text).split('`').map(function (part, i) { return i % 2 ? h('code', { translate: 'no' }, part) : part; })
      .filter(function (x) { return x !== ''; });
  }
  function svg(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function stateOf(s, id) {
    if (s.cycle && s.result[id] !== 'none') return 'cycle';
    if (shown != null && s.result[id] !== 'none' && s.slots[id] > shown) return 'wait';   // the replay has not got there
    return s.result[id];
  }
  /** A unit name that may break after its dots and dashes (the phone's narrow cards and lanes). */
  function unitName(id) {
    var out = [];
    String(id).split(/(?<=[.-])/).forEach(function (part, i) { if (i) out.push(h('wbr')); out.push(part); });
    return out;
  }

  // ── replay: an animation over the computed timeline, not model steps ──
  var shown = null, replayKey = null, replayTimer = 0;
  function stopReplay() { if (replayTimer) window.clearTimeout(replayTimer); replayTimer = 0; shown = null; replayKey = null; }
  function replay(sim) {
    stopReplay();
    var s = sim.state;
    if (s.cycle || !s.nSlots || Simdeck.reducedMotion()) { sim.render(); return; }
    replayKey = JSON.stringify(sim.params);
    shown = 1;
    var tick = function () {
      if (shown == null) return;
      if (shown >= s.nSlots) { stopReplay(); sim.render(); return; }
      shown++;
      sim.render();
      replayTimer = window.setTimeout(tick, 1100);
    };
    sim.render();
    replayTimer = window.setTimeout(tick, 1100);
  }

  // ── the graph ──

  function unitFile(p) {
    var lines = [h('span', { class: 'so-sec' }, '[Unit]')];
    var add = function (s) { lines.push('\n' + s); };
    if (p.appToDb === 'wants' && p.appToNet === 'wants') add('Wants=' + L.DB + ' ' + L.NET);
    else {
      if (p.appToDb === 'wants') add('Wants=' + L.DB);
      if (p.appToNet === 'wants') add('Wants=' + L.NET);
    }
    if (p.appToDb === 'requires') add('Requires=' + L.DB);
    var after = [p.appAfterDb ? L.DB : null, p.appAfterNet ? L.NET : null].filter(Boolean);
    if (after.length) add('After=' + after.join(' '));
    lines.push('\n', h('span', { class: 'so-sec' }, '[Install]'), '\nWantedBy=' + L.MU);
    return h('pre', { class: 'so-file', translate: 'no' }, lines);
  }

  function card(s, p, id, chg) {
    var st = stateOf(s, id);
    var u = s.units.filter(function (x) { return x.id === id; })[0];
    var kids = [h('div', { class: 'so-name', translate: 'no' }, unitName(id))];
    if (id === L.MU) kids.push(h('div', { class: 'so-sub' }, t('defaultTarget')));
    if (id === L.APP) kids.push(h('div', { class: 'so-sub' }, t('unitFile')), unitFile(p));
    if (id === L.DB) {
      kids.push(h('div', { class: 'so-sub' }, h('span', { translate: 'no' }, 'WantedBy=' + L.MU)));
      kids.push(h('div', { class: 'so-sub' }, t(u.enabled ? 'enabled' : 'disabled') + (u.fails ? ' · ' + t('willFail') : '')));
    }
    if (st === 'wait') kids.push(h('div', { class: 'so-state' }, t('waiting')));
    else if (st !== 'cycle') kids.push(h('div', { class: 'so-state' }, h('span', { class: 'so-sym', 'aria-hidden': 'true' }, SYM[st]), h('span', { class: 'so-word' }, t(ST[st]))));
    return h('div', { class: 'so-card' + (chg ? ' sd-changed' : ''), dataset: { area: AREA[id], st: st, id: id } }, kids);
  }

  function centre(r) { return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  function edgePoint(r, p, gap) {
    var c = centre(r), dx = p.x - c.x, dy = p.y - c.y;
    var hw = r.width / 2 + gap, hh = r.height / 2 + gap;
    if (!dx && !dy) return c;
    var k = Math.min(dx ? hw / Math.abs(dx) : Infinity, dy ? hh / Math.abs(dy) : Infinity, 1);
    return { x: c.x + dx * k, y: c.y + dy * k };
  }

  /** Draws the edges of s over the cards in el (CSS pixels, 1:1, so labels stay HTML and full size). */
  function drawEdges(el, s) {
    var R = el.getBoundingClientRect();
    if (!R.width) return;
    var u = rem();
    var box = {};
    Array.prototype.forEach.call(el.querySelectorAll('.so-card'), function (c) {
      var r = c.getBoundingClientRect();
      box[c.dataset.id] = { left: r.left - R.left, top: r.top - R.top, width: r.width, height: r.height };
    });
    var layer = svg('svg', { class: 'so-edges', 'aria-hidden': 'true' });
    var labels = [];
    var tag = function (at, off, node) { node._at = at; if (off) node.classList.add('so-l-off'); return node; };
    // one line per relation; a pair's requirement and ordering lines sit side by side
    var pairs = {};
    // a `depends` relation (win-services) is drawn as what it is: a requirement and an ordering
    var drawn = [];
    s.edges.forEach(function (e) {
      if (e.kind !== 'depends') drawn.push(e);
      else drawn.push({ from: e.from, to: e.to, kind: 'requires', via: e.via }, { from: e.from, to: e.to, kind: 'after', via: e.via });
    });
    drawn.forEach(function (e) {
      var key = [e.from, e.to].sort().join('|');
      (pairs[key] = pairs[key] || []).push(e);
    });
    Object.keys(pairs).forEach(function (key) {
      var list = pairs[key];
      var a0 = list[0].from < list[0].to ? list[0].from : list[0].to;
      var b0 = a0 === list[0].from ? list[0].to : list[0].from;
      var A = box[a0], B = box[b0];
      if (!A || !B) return;
      var ca = centre(A), cb = centre(B);
      var len = Math.hypot(cb.x - ca.x, cb.y - ca.y) || 1;
      var n = { x: -(cb.y - ca.y) / len, y: (cb.x - ca.x) / len };
      var gap = 0.75 * u;
      list.forEach(function (e) {
        var ordering = e.kind === 'after' || e.kind === 'before';
        var side = (ordering ? 1 : -1) * gap;   // fixed sides, so a line does not move when its partner appears
        var from = ordering ? (e.kind === 'after' ? e.to : e.from) : e.from;   // ordering: earlier → later
        var to = ordering ? (e.kind === 'after' ? e.from : e.to) : e.to;
        var mv = function (r) { return { left: r.left + n.x * side, top: r.top + n.y * side, width: r.width, height: r.height }; };
        var F = mv(box[from]), T = mv(box[to]);
        var p0 = edgePoint(F, centre(T), 0.2 * u), p1 = edgePoint(T, centre(F), 0.2 * u);
        var L2 = Math.hypot(p1.x - p0.x, p1.y - p0.y) || 1;
        var d = { x: (p1.x - p0.x) / L2, y: (p1.y - p0.y) / L2 };
        var mid = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
        // an edge to a unit outside the transaction does nothing (rule 5): drawn muted
        var off = s.txn.indexOf(e.from) < 0 || s.txn.indexOf(e.to) < 0;
        var g = svg('g', { class: (e.via === 'target' ? 'so-auto' : '') + (off ? ' so-off' : '') });
        // labels staggered along the pair (requirement nearer its first id, ordering nearer the second), so the
        // labels of two lines that meet at one card do not collide
        var f = ordering ? 0.62 : 0.38, at = from === a0 ? f : 1 - f;
        var labelAt = { x: p0.x + (p1.x - p0.x) * at, y: p0.y + (p1.y - p0.y) * at, n: n, sign: side >= 0 ? 1 : -1 };
        if (ordering) {
          var hb = { x: p1.x - d.x * 0.9 * u, y: p1.y - d.y * 0.9 * u };
          g.append(svg('line', { x1: p0.x, y1: p0.y, x2: hb.x, y2: hb.y, class: 'so-ord' }));
          g.append(svg('polygon', { class: 'so-head', points: [p1.x, p1.y, hb.x + d.y * 0.5 * u, hb.y - d.x * 0.5 * u, hb.x - d.y * 0.5 * u, hb.y + d.x * 0.5 * u].join(' ') }));
          var r = 0.55 * u, clock = svg('g', { class: 'so-clock' });
          clock.append(svg('circle', { cx: mid.x, cy: mid.y, r: r }));
          clock.append(svg('line', { x1: mid.x, y1: mid.y, x2: mid.x, y2: mid.y - r * 0.65 }));
          clock.append(svg('line', { x1: mid.x, y1: mid.y, x2: mid.x + r * 0.5, y2: mid.y }));
          g.append(clock);
          labels.push(tag(labelAt, off, e.via === 'target'
            ? h('span', { class: 'so-elabel so-l-auto', style: { left: labelAt.x + 'px', top: labelAt.y + 'px' } }, h('code', { translate: 'no' }, 'After='), ' ' + t('auto'))
            : h('span', { class: 'so-elabel so-l-ord', translate: 'no', style: { left: labelAt.x + 'px', top: labelAt.y + 'px' } }, e.kind === 'after' ? 'After=' : 'Before=')));
        } else {
          g.append(svg('line', { x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, class: 'so-req so-' + (e.kind === 'wants' ? 'wants' : 'requires') }));
          var tip = { x: p1.x - d.x * 0.2 * u, y: p1.y - d.y * 0.2 * u }, back = { x: tip.x - d.x * 0.8 * u, y: tip.y - d.y * 0.8 * u };
          g.append(svg('polyline', { class: 'so-chev', points: [back.x + d.y * 0.6 * u, back.y - d.x * 0.6 * u, tip.x, tip.y, back.x - d.y * 0.6 * u, back.y + d.x * 0.6 * u].join(' ') }));
          var text = e.via === 'install' ? 'WantedBy=' : e.kind === 'wants' ? 'Wants=' : 'Requires=';
          labels.push(tag(labelAt, off, h('span', { class: 'so-elabel', translate: 'no', style: { left: labelAt.x + 'px', top: labelAt.y + 'px' } }, text)));
        }
        layer.append(g);
      });
    });
    Array.prototype.forEach.call(el.querySelectorAll('.so-edges, .so-elabel'), function (x) { x.remove(); });
    el.prepend(layer);
    labels.forEach(function (x) {
      el.append(x);
      // push the label out from its line until its box clears it, on the line's own side
      var a = x._at, w = x.offsetWidth, ht = x.offsetHeight;
      var dist = Math.abs(a.n.x) * w / 2 + Math.abs(a.n.y) * ht / 2 + 0.3 * u;
      var lx = a.x + a.n.x * a.sign * dist;
      x.style.left = Math.max(w / 2, Math.min(R.width - w / 2, lx)) + 'px';   // never past the graph's edges
      x.style.top = (a.y + a.n.y * a.sign * dist) + 'px';
    });
  }

  function graphPanel(s, p, chg) {
    var g = h('div', { class: 'so-graph' }, [L.MU, L.APP, L.DB, L.NET].map(function (id) { return card(s, p, id, chg.indexOf(id) >= 0); }));
    var draw = function () { if (g.isConnected) drawEdges(g, s); };
    if (typeof ResizeObserver === 'function') {
      var ro = new ResizeObserver(function () { if (!g.isConnected) { ro.disconnect(); return; } draw(); });
      ro.observe(g);
    } else requestAnimationFrame(draw);
    var out = unitFile(p);
    out.classList.add('so-file-out');
    return h('div', { class: 'so-panel' }, h('div', { class: 'so-title' }, t('graphTitle')), g, out);
  }

  // ── the timeline ──

  function timeline(s, chg) {
    if (s.cycle) {
      return h('div', { class: 'so-panel' }, h('div', { class: 'so-title' }, t('timeTitle')),
        h('div', { class: 'so-banner' }, t('cycleBanner')),
        h('div', null, coded('`' + s.loop.join('`, `') + '`')));
    }
    var n = s.nSlots, limit = shown == null ? n : shown;
    var rows = [h('div', { class: 'so-th' }, t('lane'))];
    for (var k = 1; k <= n; k++) rows.push(h('div', { class: 'so-th' + (shown === k ? ' so-now' : '') }, t('slot', { n: k })));
    rows.push(h('div', { class: 'so-th so-th-res' }, t('result')));
    s.order.forEach(function (id) {
      var st = s.result[id], slot = s.slots[id];
      var c = chg.indexOf(id) >= 0 ? ' so-row-chg' : '';
      rows.push(h('div', { class: 'so-lane' + c, translate: 'no', dataset: { st: st } }, unitName(id)));
      for (var k = 1; k <= n; k++) {
        var cell = h('div', { class: 'so-cell' + (st === 'active' && slot < k && k <= limit ? ' so-run' : '') });
        if (slot === k && k <= limit) {
          cell.append(h('div', { class: 'so-bar' + (st === 'failed' ? ' sd-hatch' : ''), dataset: { st: st }, 'aria-label': t('unitLabel', { unit: id, state: t(ST[st]) }) },
            h('span', { class: 'so-sym', 'aria-hidden': 'true' }, SYM[st])));
        }
        rows.push(cell);
      }
      var known = st === 'none' || slot <= limit;
      rows.push(h('div', { class: 'so-res', dataset: { st: known ? st : 'wait' } }, known
        ? [h('span', { class: 'so-sym', 'aria-hidden': 'true' }, SYM[st]), h('span', { class: 'so-word' }, t(ST[st]))]
        : h('span', null, t('waiting'))));
    });
    return h('div', { class: 'so-panel' }, h('div', { class: 'so-title' }, t('timeTitle')),
      h('div', { class: 'so-tl', style: { '--slots': String(n) } }, rows));
  }

  // ── captions: the relation whose params changed last speaks (sim.js nextFocus, captionKey) ──
  var focus = null, lastParams = null, lastPreset = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (replayKey && key !== replayKey) stopReplay();
    var same = lastParams && JSON.stringify(lastParams) === key && lastPreset === c.preset;
    if (!same) {
      focus = L.nextFocus(focus, lastParams, c.params, c.preset, lastPreset);
      chg = lastState ? L.changed(lastState, c.state) : [];
      lastParams = Object.assign({}, c.params);
      lastPreset = c.preset;
      lastState = c.state;
    }
  }

  var labels = { 'network-online': 'presetNet', 'requires-no-after': 'presetReqNoAfter', 'requires-after': 'presetReqAfter', 'wants-after': 'presetWantsAfter', 'after-only': 'presetAfterOnly' };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'appToDb', type: 'choice', label: t('appToDb'), options: [['none', t('optNone')], ['wants', t('optWants')], ['requires', t('optRequires')]] },
      { key: 'appAfterDb', type: 'toggle', label: t('appAfterDb') },
      { key: 'appToNet', type: 'choice', label: t('appToNet'), options: [['none', t('optNone')], ['wants', t('optWants')]] },
      { key: 'appAfterNet', type: 'toggle', label: t('appAfterNet') },
      { key: 'dbFails', type: 'toggle', label: t('dbFails') },
      { key: 'dbEnabled', type: 'toggle', label: t('dbEnabled') },
      { type: 'button', label: t('boot'), hint: t('bootHint'), key: 'p', run: replay }
    ],

    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),

    legend: [
      { shape: 'so-wants', label: t('legendWants') },
      { shape: 'so-requires', label: t('legendRequires') },
      { shape: 'so-after', label: t('legendAfter') },
      { shape: 'so-st-active', label: t('legendActive') },
      { shape: 'so-st-failed', label: t('legendFailed') },
      { shape: 'so-st-dep', label: t('legendDependency') },
      { shape: 'so-st-none', label: t('legendNone') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      track(c);
      c.stage.replaceChildren(h('div', { class: 'so' }, graphPanel(c.state, c.params, chg), timeline(c.state, chg)));
    },

    caption: function (c) {
      var s = c.state;
      if (shown != null) {
        var ids = s.order.filter(function (id) { return s.slots[id] === shown; });
        return coded(t.n('cReplay', ids.length, { k: shown, total: s.nSlots, units: '`' + ids.join('`, `') + '`' }));
      }
      var k = L.captionKey(s, c.params, focus);
      var vars = Object.assign({}, k, { units: s.cycle ? '`' + s.loop.join('`, `') + '`' : '' });
      return coded(t(k.key, vars));
    }
  });
})();
</script>
</body>
