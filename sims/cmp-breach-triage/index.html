<!-- cmp-breach-triage: one personal-data breach of a small firm, triaged question by question. Left, the case card:
     what happened, the data, the people, awareness, and the three losses (confidentiality, integrity, availability),
     each lost, contained or not hit. Right, the questions: is it a breach, encrypted with the key safe, recovered in
     time, how big is the risk (a score meter with the record / notify / inform zones). Below, the three outcomes as a
     ladder: record (always), notify the supervisory authority (72 h, the GDPR clock of clocks.js), inform the people;
     at the summary, a dashed tag marks what the same breach would need without the controls.
     Clock model: clocks.js (copied from cmp-incident-clocks); triage: sim.js; rules: SPEC.md; words: strings.js. -->

/* the outcome ladder */
[data-sim="cmp-breach-triage"] .bt-out { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 0.5rem; }
[data-sim="cmp-breach-triage"] .bt-arrow { align-self: center; font-size: var(--fs-lg); font-weight: 700; color: var(--muted); }

}
[data-sim="cmp-breach-triage"] .bt-box > span { font-size: 1rem; }
[data-sim="cmp-breach-triage"] .bt-st { font-weight: 700; }
[data-sim="cmp-breach-triage"] .bt-box[data-st="yes"] {

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Povreda osobnih podataka: evidencija, prijava, obavijest</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="clocks.js"></script>
<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var C = window.SimdeckModels.clocks;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function time(hr) {
    var m = C.moment(hr, L.WEEK0);
    return t('timeFmt', { wd: t('wd' + m.wd), d: m.d, mon: t('mo' + m.m), hh: pad(m.hour) });
  }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, t('thou')); }
  function people(n) { return t.n('peopleN', n, { num: num(n) }); }
  function b(text) { return h('b', null, text); }
  function seen(s, stage) { return L.STAGES.indexOf(s.stage) >= L.STAGES.indexOf(stage); }
  function hasLoss(id, kind) { return L.CASES[id].losses.indexOf(kind) >= 0; }
  /** The case's own meaning of each control, only where the case has that loss (no missing-string lookups). */
  function encText(id) { return hasLoss(id, 'C') ? t('enc' + cap(id)) : ''; }
  function recText(id) { return hasLoss(id, 'A') || hasLoss(id, 'I') ? t('rec' + cap(id)) : ''; }
  function lossList(kinds) {
    var w = kinds.map(function (k) { return t('kind' + k).toLowerCase(); });
    return w.length > 1 ? w.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + w[w.length - 1] : w.join('');
  }

  // ── the case card ──

  function caseCard(s) {
    var q = s.params;
    var stLabel = { none: 'stNone', unknown: 'stUnknown', lost: 'stLost', contained: 'stContained' };
    return h('section', { class: 'bt-case' },
      h('h3', { class: 'bt-h' }, t('case' + cap(q.case))),
      h('p', { class: 'bt-what' }, t('what' + cap(q.case))),
      h('dl', { class: 'bt-facts' },
        h('dt', null, t('fData')), h('dd', null, t('data' + cap(q.data)), h('span', null, ' (' + t('dataS' + cap(q.data)) + ')')),
        h('dt', null, t('fPeople')), h('dd', null, people(q.people)),
        h('dt', null, t('fAware')), h('dd', { translate: 'no' }, time(s.clock.aware))),
      h('div', { class: 'bt-cia' }, s.losses.map(function (l) {
        return h('div', { class: 'bt-loss', dataset: { st: l.status } }, b(t('kind' + l.kind)), h('span', null, t(stLabel[l.status])));
      })));
  }

  // ── the questions ──

  function question(no, key, answer, now, extra) {
    return h('li', { class: 'bt-q', dataset: { now: now ? '1' : '' } },
      h('span', { class: 'bt-num' }, String(no)),
      b(t(key)),
      h('span', { class: 'bt-a', dataset: { wait: answer === null ? '1' : '' } }, answer === null ? t('aWait') : answer),
      extra || null);
  }

  function zoneOf(score) { return score >= L.HIGH ? 'inform' : score >= L.RISK ? 'notify' : 'record'; }

  function meter(s) {
    var shown = seen(s, 'risk');
    var ghost = shown && s.without.score !== s.score ? s.without.score : null;
    var cells = [0, 1, 2, 3, 4].map(function (k) {
      return h('span', { class: 'bt-cell', dataset: { z: zoneOf(k), on: shown && k === s.score ? '1' : '', ghost: k === ghost ? '1' : '' } }, String(k));
    });
    var zones = [
      h('span', { class: 'bt-zone', style: { gridColumn: '1 / span 2' } }, t('zRecord')),
      h('span', { class: 'bt-zone', style: { gridColumn: '3 / span 1' } }, t('zNotify')),
      h('span', { class: 'bt-zone', style: { gridColumn: '4 / span 2' } }, t('zInform'))
    ];
    var parts = !shown ? null : s.remaining.length
      ? h('span', { class: 'bt-parts' }, t('mParts', { data: t('data' + cap(s.params.data)), dataPts: s.dataPts, scale: t('mScale'), scalePts: s.scalePts, score: s.score }))
      : h('span', { class: 'bt-parts' }, t('mNothing'));
    return h('div', { class: 'bt-meter' },
      h('div', { class: 'bt-cells' }, cells, zones),
      h('div', null, parts, ghost !== null ? [' ', h('span', { class: 'bt-gtag' }, '▽ ' + t('mWithout') + ': ' + ghost)] : null));
  }

  function questions(s) {
    var q = s.params, id = q.case;
    var a1 = seen(s, 'breach') ? t('aBreach', { losses: lossList(L.CASES[id].losses.slice().sort(function (x, y) { return L.KINDS.indexOf(x) - L.KINDS.indexOf(y); })) }) : null;
    var a2 = !seen(s, 'conf') ? null : !s.hasC ? t('aConfNone')
      : q.enc === 'safe' ? t('aConfSafe', { enc: encText(id) }) : q.enc === 'lost' ? t('aConfLost') : t('aConfPlain');
    var a3 = !seen(s, 'avail') ? null : !s.hasIA ? t('aAvailNone')
      : q.recovered ? t('aAvailBack', { rec: recText(id) }) : t('aAvailGone');
    var a4 = seen(s, 'risk') ? t('aRisk', { level: t('lvl' + cap(s.level)) }) : null;
    return h('ol', { class: 'bt-qs' },
      question(1, 'qBreach', a1, s.stage === 'breach'),
      question(2, 'qConf', a2, s.stage === 'conf'),
      question(3, 'qAvail', a3, s.stage === 'avail'),
      question(4, 'qRisk', a4, s.stage === 'risk', meter(s)));
  }

  // ── the outcome ladder ──

  function box(s, key, val, now, detail) {
    var st = val === null ? 'wait' : val ? 'yes' : 'no';
    var word = val === null ? t('bPending') : val ? (key === 'record' ? t('bRecorded') : t('bYes')) : t('bNo');
    var ghost = s.report && s.without.decision === key && s.without.decision !== s.decision;
    return h('div', { class: 'bt-box', dataset: { st: st, now: now ? '1' : '', final: s.report && s.decision === key ? '1' : '' } },
      h('h3', { class: 'bt-h' }, t('out' + cap(key))),
      h('span', null, t('out' + cap(key) + 'Sub')),
      h('span', { class: 'bt-st' }, word),
      val ? detail : null,
      ghost ? h('span', { class: 'bt-gtag' }, '▽ ' + t('mWithout')) : null);
  }

  function ladder(s) {
    var o = s.outcome, k = s.clock;
    var notifyDetail = k.running ? h('span', { translate: 'no' }, t('bDue', { due: time(k.due) }) + ' · ' + t('bFiled', { filed: time(k.filed) })) : null;
    var arrow = function () { return h('span', { class: 'bt-arrow', 'aria-hidden': 'true' }, '→'); };
    return h('div', { class: 'bt-out' },
      box(s, 'record', o.record, s.stage === 'breach', null),
      arrow(),
      box(s, 'notify', o.notify, s.stage === 'notify', notifyDetail),
      arrow(),
      box(s, 'inform', o.inform, s.stage === 'inform', h('span', null, t('bInform'))));
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'bt' },
      caseCard(s), questions(s), ladder(s),
      h('p', { class: 'bt-foot' }, t('foot'))));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, q = s.params, id = q.case;
    var v = {
      attack: b(time(s.clock.attack)), aware: b(time(s.clock.aware)),
      data: b(t('data' + cap(q.data))), people: b(t.n('peopleAcc', q.people, { num: num(q.people) })),
      losses: b(lossList(L.KINDS.filter(function (k) { return hasLoss(id, k); }))),
      dataPts: b(String(s.dataPts)), scalePts: b(String(s.scalePts)), score: b(String(s.score)),
      without: b(t('dec' + cap(s.without.decision))), with: b(t('dec' + cap(s.withBoth.decision)))
    };
    if (hasLoss(id, 'C')) v.enc = encText(id);
    if (hasLoss(id, 'A') || hasLoss(id, 'I')) v.rec = recText(id);
    if (s.clock.running) { v.due = b(time(s.clock.due)); v.filed = b(time(s.clock.filed)); }
    var out = [];
    L.captionKeys(s).forEach(function (k, i) {
      if (i) out.push(' ');
      out = out.concat(t.parts(k, v));
    });
    return out;
  }

  // ── controls ──

  var params = [
    { key: 'case', type: 'select', label: t('pCase'), options: L.CASE_IDS.map(function (x) { return [x, t('case' + cap(x))]; }) },
    { key: 'enc', type: 'choice', label: t('pEnc'), options: L.ENC.map(function (x) { return [x, t('oEnc' + cap(x))]; }) },
    { key: 'recovered', type: 'toggle', label: t('pRecovered') },
    { key: 'data', type: 'select', label: t('pData'), options: L.DATA_IDS.map(function (x) { return [x, t('data' + cap(x))]; }) },
    { key: 'people', type: 'select', label: t('pPeople'), options: L.PEOPLE.map(function (n) { return [n, num(n)]; }) }
  ];

  function presetKey(id) { return 'pr' + id.split('-').map(cap).join(''); }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(presetKey(x.id)), hint: t(presetKey(x.id) + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
      { shape: 'bt-lost', label: '✗ ' + t('legLost') },
      { shape: 'bt-ok', label: '✓ ' + t('legContained') },
      { shape: 'bt-ghost', label: '▽ ' + t('legWithout') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
