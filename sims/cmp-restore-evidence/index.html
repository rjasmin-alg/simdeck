<!-- cmp-restore-evidence: a backup policy is proven by restore tests, not by job reports; with a few test slots a
     quarter, the order decides which systems are never tested; each test record (date, scope, time taken against the
     RTO, result, sign-off) is the evidence, and a restore slower than the RTO is a finding even when it succeeds.
     The stage: the year's plan, twelve systems × four quarters, each test with its result, beside a column of backup
     job reports that are green all year; on the right the numbers (job reports, systems tested, failures found,
     restores slower than the RTO), one record as the auditor receives it, and the auditor's findings.
     Model: sim.js (the evidence trail in trail.js); rules: SPEC.md; words: strings.js. -->

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Testovi obnove kao dokaz: cijelo okruženje u godini dana</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="trail.js"></script>
<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var MAX_NAMES = 4;                                  // the findings name at most four systems, then "and N more"

  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function int(x) { return new Intl.NumberFormat(LOCALE).format(Math.round(x)); }
  function hrs(x) { return t('hours', { h: int(x) }); }
  function sysName(i) { return t('sys_' + L.SYSTEMS[i].id); }
  function qName(q) { return t('q', { n: q + 1 }); }
  function dateOf(r) { return t('date', { d: r.day, mon: t('mon_' + r.month) }); }
  function names(list) {
    var shown = list.slice(0, MAX_NAMES).map(sysName).join(', ');
    return list.length > MAX_NAMES ? shown + ' ' + t('andMore', { n: list.length - MAX_NAMES }) : shown;
  }

  var sim = null;
  var rejected = null;                                // { why, q, at }: a click the plan refused, shown in the caption
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to the same cell

  function click(sys, q, viaKey) {
    var r = L.toggle(sim.params, sys, q);
    refocus = viaKey ? sys + '-' + q : null;
    if (r.reject) {
      rejected = { why: r.reject, q: r.q, at: JSON.stringify(sim.params) };
      sim.render();
      return;
    }
    rejected = null;
    sim.set(r.params);
  }

  // ── the plan ──

  function cellOf(s, sys, q) {
    var rec = null;
    s.recs.forEach(function (r) { if (r.sys === sys && r.q === q) rec = r; });
    var label = t(rec ? 'cellRemove' : 'cellAdd', { sys: sysName(sys), q: qName(q) });
    var res = !rec ? 'none' : rec.res === 'fail' ? 'fail' : !rec.complete ? 'done' : rec.res;
    var text = null;
    if (res === 'ok') text = ['✓ ', h('span', { class: 're-ct' }, hrs(rec.time))];
    else if (res === 'slow') text = ['⏱ ', h('span', { class: 're-ct' }, hrs(rec.time))];
    else if (res === 'fail') text = '✗';
    else if (res === 'done') text = ['✓ ', h('span', { class: 're-ct' }, '?')];
    return h('button', { type: 'button', class: 're-cell re-num', 'aria-label': label, 'aria-pressed': String(!!rec),
      dataset: { res: res, sel: sys + '-' + q }, onmousedown: noFocus,
      onclick: function (e) { click(sys, q, e.detail === 0); } }, text);
  }

  function yearOf(s, sys) {
    var y = s.years[sys], sy = L.SYSTEMS[sys], kids;
    if (y.status === 'never') {
      var truth = sy.fails ? t('yTruthFail') : sy.time > sy.rto ? t('yTruthSlow', { t: hrs(sy.time) }) : null;
      kids = [h('span', { class: 're-yt' }, t('yNever')), truth ? h('small', null, truth) : null];
    } else {
      kids = [h('span', { class: 're-yt' }, t({ ok: 'yOk', slow: 'ySlow', fail: 'yFail', done: 'yDone' }[y.status]))];
    }
    return h('div', { class: 're-year' + (y.status === 'never' ? ' sd-hatch' : ''), dataset: { st: y.status } }, kids);
  }

  function grid(s) {
    var cells = [
      h('div', { class: 're-th' }, t('colSystem')),
      h('div', { class: 're-th re-c-rto' }, t('colRto')),
      h('div', { class: 're-th re-c-jobs' }, t('colJobs'))
    ];
    for (var q = 0; q < L.QUARTERS; q++) {
      cells.push(h('div', { class: 're-th', dataset: { full: String(s.perQ[q] >= s.p.slots) } },
        h('span', { class: 're-ql' }, qName(q)), h('span', { class: 're-qs', 'aria-hidden': 'true' }, String(q + 1)),
        h('small', { class: 're-num' }, t('slotsUsed', { n: s.perQ[q], s: s.p.slots }))));
    }
    cells.push(h('div', { class: 're-th' }, h('span', { class: 're-ql' }, t('colYear'))));
    L.SYSTEMS.forEach(function (sy, i) {
      cells.push(h('div', { class: 're-name', title: t('tier_' + sy.tier) },
        h('span', { class: 're-tier', dataset: { tier: String(sy.tier) }, 'aria-label': t('tier_' + sy.tier) }, String(sy.tier)),
        h('span', null, sysName(i))));
      cells.push(h('div', { class: 're-td re-num re-c-rto' }, hrs(sy.rto)));
      cells.push(h('div', { class: 're-td re-jobs re-num re-c-jobs' }, t('jobsCell')));
      for (var q = 0; q < L.QUARTERS; q++) cells.push(cellOf(s, i, q));
      cells.push(yearOf(s, i));
    });
    return h('div', { class: 're-plan' }, h('div', { class: 're-grid', role: 'group', 'aria-label': t('stage') }, cells),
      h('p', { class: 're-ghint' }, t('gridHint')));
  }

  // ── the side ──

  function tile(kind, label, value, sub) {
    return h('div', { class: 're-k', dataset: { kind: kind } }, h('span', null, label), h('b', { class: 're-num', translate: 'no' }, value), sub);
  }

  function tiles(s) {
    var m = s.m;
    return h('div', { class: 're-tiles' },
      tile('green', t('kJobs'), '100 %', h('small', null, t('kJobsSub', { n: int(m.jobs) }))),
      tile(m.never.length ? 'gap' : 'plain', t('kTested'), int(m.tested) + ' / ' + int(L.N),
        h('small', null, t('kTestedSub', { n: int(m.never.length), c: int(m.neverCrit) }))),
      tile(m.found.length < m.fails ? 'gap' : 'plain', t('kFail'), int(m.found.length) + ' / ' + int(m.fails),
        h('small', null, t('kFailSub'))),
      m.record === 'ticket' && m.tests > 0
        ? tile('gap', t('kSlow'), '?', h('small', null, t('kSlowTicket')))
        : tile(m.slowSeen.length < m.slowTrue ? 'gap' : 'plain', t('kSlow'), int(m.slowSeen.length) + ' / ' + int(m.slowTrue),
          h('small', null, t('kSlowSub'))));
  }

  function field(name, value, flags) {
    return [h('dt', null, name), h('dd', { dataset: flags || {} }, value)];
  }

  function record(s) {
    if (s.shown === null) return h('div', { class: 're-rec', dataset: { kind: 'none' } }, t('recNone'));
    var r = s.recs[s.shown];
    var miss = { miss: 'true' };
    var result = r.res === 'fail' ? t('vFail') : r.complete ? t('vOk') : t('vDone');
    var rows = [
      field(t('fDate'), dateOf(r)),
      field(t('fSystem'), sysName(r.sys)),
      r.complete ? field(t('fScope'), t('vScope')) : field(t('fScope'), t('vMissing'), miss),
      r.complete && r.res !== 'fail'
        ? field(t('fTime'), t('vTime', { t: hrs(r.time), rto: hrs(r.rto) }), r.res === 'slow' ? { slow: 'true' } : null)
        : r.complete ? field(t('fTime'), '—') : field(t('fTime'), t('vMissing'), miss),
      field(t('fResult'), result),
      r.complete ? field(t('fSign'), t('vSign')) : field(t('fSign'), t('vMissing'), miss)
    ];
    return h('div', { class: 're-rec', dataset: { kind: r.complete ? 'full' : 'ticket' } },
      h('p', null, t(r.complete ? 'recFull' : 'recTicket')), h('dl', null, rows));
  }

  function findings(s) {
    var m = s.m;
    var items = m.findings.map(function (f) {
      var text;
      if (f.kind === 'never') {
        var crit = f.systems.filter(function (i) { return L.SYSTEMS[i].tier === 1; }).length;
        text = [b(t.n('fNever', f.systems.length, { n: int(f.systems.length) })),
          crit ? ' (' + t('fNeverCrit', { c: int(crit) }) + ')' : '', ': ', h('span', null, names(f.systems))];
      } else if (f.kind === 'failed') {
        text = [b(t('fFailed')), ': ', h('span', null, names(f.systems))];
      } else if (f.kind === 'slow') {
        text = [b(t('fSlow')), ': ', h('span', null, f.systems.map(function (i) {
          return sysName(i) + ' ' + hrs(L.SYSTEMS[i].time) + ' / ' + hrs(L.SYSTEMS[i].rto);
        }).join(', '))];
      } else {
        text = [b(t.n('fUnproven', f.records, { n: int(f.records) }))];
      }
      return h('li', { dataset: { kind: f.kind } }, text);
    });
    if (!items.length) items.push(h('li', { dataset: { kind: 'none' } }, t('fNone')));
    return h('ul', { class: 're-find' }, items);
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    c.stage.replaceChildren(h('div', { class: 're' },
      grid(s),
      h('div', { class: 're-side' },
        tiles(s),
        h('p', { class: 're-head' }, t('recHead')), record(s),
        h('p', { class: 're-head' }, t('findHead')), findings(s),
        h('p', { class: 're-foot' }, t('foot')))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, m = s.m;
    if (rejected && rejected.at === JSON.stringify(c.params)) {
      return rejected.why === 'noSlots' ? t('rejNone') : t('rejFull', { q: qName(rejected.q), s: s.p.slots });
    }
    rejected = null;
    var k = L.captionKey(s);
    var out = t.parts(k.key, {
      jobs: b(int(m.jobs)), n: b(int(L.N)), tested: b(int(m.tested)), never: b(int(m.never.length)),
      crit: b(int(m.neverCrit)), tests: b(t.n('nTests', m.tests, { n: int(m.tests) }))
    });
    k.notes.forEach(function (key) {
      var sys = key === 'nHidden' ? m.hidden[0] : key === 'nFound' ? m.found[0].sys
        : key === 'nSlow' ? m.slowSeen[0] : key === 'nSlowHidden' ? m.slowNever[0] : null;
      var sy = sys === null ? null : L.SYSTEMS[sys];
      out.push(' ');
      out = out.concat(t.parts(key, {
        name: sy ? b(sysName(sys)) : '',
        q: key === 'nFound' ? b(t('qLong', { n: m.found[0].q + 1 })) : '',
        t: sy ? b(hrs(sy.time)) : '', rto: sy ? b(hrs(sy.rto)) : ''
      }));
    });
    return out;
  }

  var labels = { jobs: 'pJobs', list: 'pList', crit: 'pCrit', easy: 'pEasy', all: 'pAll', ticket: 'pTicket' };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'slots', type: 'range', label: t('slots'), min: 0, max: L.SLOTS_MAX, step: 1 },
      { key: 'order', type: 'choice', label: t('order'),
        options: [['crit', t('orderCrit')], ['list', t('orderList')], ['easy', t('orderEasy')], ['own', t('orderOwn')]] },
      { key: 'record', type: 'choice', label: t('record'), options: [['full', t('recordFull')], ['ticket', t('recordTicket')]] },
      { key: 'plan', type: 'range', label: t('orderOwn'), min: 0, max: L.PLAN_MAX, step: 1, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 're-ok', label: t('legOk') },
      { shape: 're-slow', label: t('legSlow') },
      { shape: 're-fail', label: t('legFail') },
      { shape: 're-done', label: t('legDone') },
      { shape: 're-never', label: t('legNever') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
