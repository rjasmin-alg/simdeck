}

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings); // picks the language; every visible word goes through t
  var NS = 'http://www.w3.org/2000/svg';
  var COLOUR = { alice: 1, mallory: 5, bob: 3 };

  // ---- icons (24 × 24, stroked; .f parts are filled) ----
  function rosette() {
    var pts = [];
    for (var i = 0; i < 24; i++) {
      var r = i % 2 ? 8.6 : 10.8, a = Math.PI * i / 12;
      pts.push((12 + r * Math.sin(a)).toFixed(2) + ',' + (12 - r * Math.cos(a)).toFixed(2));
    }
    return pts.join(' ');
  }
  var ICONS = {
    // private key: the bow hatched
    priv: [['circle', { cx: 7, cy: 12, r: 5 }], ['path', { class: 't', d: 'M3.6 13.6l5-5M4.8 15.8l6.4-6.4M7.4 16.6l3.9-3.9' }],
      ['path', { d: 'M12 12h10.5M18.5 12v4M21.5 12v3' }]],
    // public key: an open padlock
    pub: [['rect', { x: 4.5, y: 11, width: 15, height: 10.5, rx: 2, class: 'f' }], ['path', { d: 'M8 11V6.5a4 4 0 0 1 8 0' }]],
    msg: [['rect', { x: 3, y: 5, width: 18, height: 14, rx: 2 }], ['path', { d: 'M7 10h10M7 14h6' }]],
    sig: [['polygon', { points: rosette() }], ['circle', { cx: 12, cy: 12, r: 4.2, class: 'f' }]],
    ok: [['path', { d: 'M4 12.5l5 5L20 6.5' }]],
    bad: [['path', { d: 'M6 6l12 12M18 6L6 18' }]],
    eye: [['path', { d: 'M1.5 12C5.5 5 18.5 5 22.5 12 18.5 19 5.5 19 1.5 12z' }], ['circle', { cx: 12, cy: 12, r: 3.3, class: 'f' }]]
  };
  function S(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    return e;
  }
  function icon(kind) {
    var svg = S('svg', { class: 'ds-ic', viewBox: '0 0 24 24', 'aria-hidden': 'true' });
    ICONS[kind].forEach(function (p) { svg.appendChild(S(p[0], p[1])); });
    return svg;
  }

  // ---- notation: data, not words ----
  function powText(b, e, n) { return b + '^' + e + ' mod ' + n; } // the task's notation; superscripts in mono are hard to read
  function data(text, cls) { return h('span', { class: cls === undefined ? 'ds-data' : cls || null, translate: 'no' }, text); }
  function shortHex(x) { return x.slice(0, 6) + '…' + x.slice(-4); }
  function has(list, x) { return list.indexOf(x) >= 0; }
  function keyOf(s, who) { return s.keys[who]; }

  /** The formulas of the page, with numbers or as symbols (showNumbers off). */
  var F = {
    hash: function (s, num, digest, n, h, prime) {
      var hs = prime ? 'h\'' : 'h', m = prime ? 'm\'' : 'm';
      return num ? ['SHA-256(' + m + ') = ' + shortHex(digest), hs + ' = … mod ' + n + ' = ' + h]
        : [hs + ' = SHA-256(' + m + ') mod n'];
    },
    sign: function (num, h, d, n, s) { return num ? ['s = ' + powText(h, d, n), '= ' + s] : ['s = h^d mod n']; },
    recover: function (num, sig, e, n, v) { return num ? ['v = ' + powText(sig, e, n), '= ' + v] : ['v = s^e mod n']; }
  };

  // ---- the cards in the topology: keys ----
  function keyChip(kind, label, values, opts) {
    opts = opts || {};
    return h('span', { class: 'ds-key' + (opts.changed ? ' sd-changed' : ''), dataset: { kind: kind } },
      icon(kind), h('span', null, label), data(values), opts.more || null);
  }
  function keysOf(s, p, who) {
    var num = p.showNumbers, k = keyOf(s, who);
    if (who === 'bob') {
      var kb = keyOf(s, s.bobTrusts), swapped = s.bobTrusts !== 'alice';
      return h('div', { class: 'ds-keys' }, keyChip('pub', t('bobKey'), num ? 'e = ' + kb.e + ', n = ' + kb.n : 'e, n',
        { changed: has(s.changed, 'bob-key'), more: swapped ? h('span', { class: 'ds-tag' }, t('reallyMallory')) : null }));
    }
    return h('div', { class: 'ds-keys' },
      keyChip('priv', t('privKey'), num ? 'd = ' + k.d : 'd'),
      keyChip('pub', t('pubKey'), num ? 'e = ' + k.e + ', n = ' + k.n : 'e, n'));
  }

  // ---- the work strips (kit table rows: label + data lines) ----
  function row(label, lines, opts) {
    opts = opts || {};
    var cells = [h('span', { class: 'ds-k' }, label)];
    if (lines == null) cells.push(t('notYet'));
    else lines.forEach(function (x) { cells.push(x); });
    return { cells: cells, c: opts.c, mark: opts.changed ? 'new' : opts.diff ? 'diff' : null };
  }
  function words(text) { return h('span', { class: 'ds-w' }, text); }

  function aliceWork(c) {
    var s = c.state, p = c.params, num = p.showNumbers, A = s.keys.alice, ch = s.changed;
    return Simdeck.topology.table({ title: t('workAlice'), rows: [
      row(t('rowMsg'), s.msg ? [s.msg] : null, { changed: has(ch, 'alice-msg'), c: COLOUR.alice }),
      row(t('rowHash'), s.hashSent != null ? F.hash(s, num, s.digest, A.n, s.hashSent) : null, { changed: has(ch, 'alice-hash'), c: COLOUR.alice }),
      row(t('rowSig'), s.sig != null ? F.sign(num, s.hashSent, A.d, A.n, s.sig) : null, { changed: has(ch, 'alice-sig'), c: COLOUR.alice })
    ] }, c.dir);
  }

  function malloryWork(c) {
    var s = c.state, p = c.params, num = p.showNumbers, M = s.keys.mallory, ch = s.changed;
    var q = L.norm(p), signs = q.attack === 'resign' || q.attack === 'swapkey';
    var does = { none: 'doesNone', edit: 'doesEdit', resign: 'doesResign', swapkey: 'doesSwap' };
    var rows = [
      row(t('rowSees'), s.mallorySaw ? [s.mallorySaw] : null, { changed: has(ch, 'mallory-saw'), c: COLOUR.mallory }),
      row(t('rowDoes'), [words(s.malloryDid ? t(does[s.malloryDid]) : t('waiting'))], { changed: has(ch, 'mallory-act'), c: COLOUR.mallory })
    ];
    if (signs) {
      var mh = s.malloryDid ? L.toyHash(s.recvMsg, M.n) : null;
      rows.push(row(t('rowHerHash'), s.malloryDid ? (num ? ['h = SHA-256(m) mod ' + M.n, '= ' + mh] : ['h = SHA-256(m) mod n']) : null, { changed: has(ch, 'mallory-act'), c: COLOUR.mallory }));
      rows.push(row(t('rowHerSig'), s.malloryDid ? F.sign(num, mh, M.d, M.n, s.recvSig) : null, { changed: has(ch, 'mallory-act'), c: COLOUR.mallory }));
    }
    return Simdeck.topology.table({ title: t('workMallory'), rows: rows }, c.dir);
  }

  function bobWork(c) {
    var s = c.state, p = c.params, num = p.showNumbers, ch = s.changed;
    var K = keyOf(s, s.bobTrusts);
    var edited = s.recvMsg != null && s.recvMsg !== s.msg;
    return Simdeck.topology.table({ title: t('workBob'), rows: [
      row(t('rowRecv'), s.recvMsg ? [s.recvMsg] : null, { changed: has(ch, 'bob-recv'), diff: edited, c: COLOUR.bob }),
      row(t('rowHashRecv'), s.hashRecv != null ? F.hash(s, num, s.digestRecv, K.n, s.hashRecv, true) : null, { changed: has(ch, 'bob-hash'), c: COLOUR.bob }),
      row(t('rowRecovered'), s.recovered != null ? F.recover(num, s.recvSig, K.e, K.n, s.recovered) : null, { changed: has(ch, 'bob-recover'), c: COLOUR.bob })
    ] }, c.dir);
  }

  // ---- top left: the message and its signature, where they are now ----
  function pairBox(c) {
    var s = c.state, p = c.params, num = p.showNumbers, ph = s.phase;
    var at = ph === 'start' ? null : ph === 'send' ? 'pairOnNet' : ph === 'mallory' ? 'pairToBob' : s.recvMsg ? 'pairAtBob' : 'pairAtAlice';
    var box = h('section', { class: 'ds-box' }, h('h2', null, t('pairTitle'), at ? h('small', null, t(at)) : null));
    if (!s.msg) { box.append(h('p', { class: 'ds-muted' }, t('pairNone'))); return box; }
    var atBob = s.recvMsg != null;
    var m = atBob ? s.recvMsg : s.msg, sig = atBob ? s.recvSig : s.sig;
    var from = atBob ? s.sigFrom : 'alice';
    var mChanged = ph === 'write' || (ph === 'mallory' && s.wire.edited);
    var sChanged = ph === 'sign' || (ph === 'mallory' && s.wire.resigned);
    var msgCard = h('div', { class: 'ds-card' + (mChanged ? ' sd-changed' : ''), dataset: { kind: 'msg' } },
      h('span', { class: 'ds-lbl' }, icon('msg'), t('cardMsg')),
      h('span', { class: 'ds-val', translate: 'no' }, m),
      atBob && m !== s.msg ? h('span', { class: 'ds-was' }, t('wasMsg'), ': ', h('s', { translate: 'no' }, s.msg)) : null,
      s.mallorySaw ? h('span', { class: 'ds-lbl' }, icon('eye'), t('readable')) : null);
    var sigCard = sig == null
      ? h('div', { class: 'ds-card', 'data-empty': '', dataset: { kind: 'sig' } }, h('span', { class: 'ds-lbl' }, icon('sig'), t('cardSig')), h('span', null, t('unsigned')))
      : h('div', { class: 'ds-card' + (sChanged ? ' sd-changed' : ''), dataset: { kind: 'sig' } },
        h('span', { class: 'ds-lbl' }, icon('sig'), t('cardSig')),
        h('span', { class: 'ds-val', translate: 'no' }, num ? 's = ' + sig : 's'),
        h('span', { class: 'ds-muted' }, t(from === 'alice' ? 'sigFromAlice' : 'sigFromMallory')));
    box.append(h('div', { class: 'ds-pair' }, msgCard, sigCard));
    return box;
  }

  // ---- top right: Bob's check and what he can conclude ----
  var CONCL = {
    authentic: { yes: ['canAuthentic1', 'canAuthentic2', 'canAuthentic3'], no: ['cannotAuthentic1'] },
    reject: { yes: ['canReject1', 'canReject2'], no: ['cannotReject1'] },
    wrongKey: { yes: ['canWrong1'], no: ['cannotWrong1'] },
    collision: { yes: ['canToy1'], no: ['cannotToy1'] },
    chance: { yes: ['canToy1'], no: ['cannotToy1'] }
  };
  function verdict(valid) {
    return h('span', { class: 'ds-verdict', dataset: { v: valid ? 'ok' : 'bad' } }, icon(valid ? 'ok' : 'bad'), t(valid ? 'valid' : 'invalid'));
  }
  function list(keys, kind) {
    return h('ul', null, keys.map(function (key) { return h('li', { dataset: { k: kind } }, icon(kind === 'yes' ? 'ok' : 'bad'), h('span', null, t(key))); }));
  }
  function checkBox(c) {
    var s = c.state, num = c.params.showNumbers;
    var box = h('section', { class: 'ds-box' }, h('h2', null, t('checkTitle')));
    if (s.valid == null) { box.append(h('p', { class: 'ds-muted' }, t('checkWait'))); return box; }
    var eq = s.valid ? '=' : '≠';
    box.append(h('div', { class: 'ds-cmp' + (s.phase === 'compare' ? ' sd-changed' : '') },
      num ? data('v = ' + s.recovered + ',', 'ds-data ds-n') : null, num ? data('h\' = ' + s.hashRecv, 'ds-data ds-n') : null,
      data((num ? '→ ' : '') + 'v ' + eq + ' h\''), verdict(s.valid)));
    if (s.conclusion) {
      var k = CONCL[s.conclusion];
      box.append(h('div', { class: 'ds-concl' + (s.phase === 'conclude' ? ' sd-changed' : '') },
        h('div', null, h('h3', null, t('canTitle')), list(k.yes, 'yes')),
        h('div', null, h('h3', null, t('cannotTitle')), list(k.no, 'no'))));
      if (s.conclusion === 'collision' || s.conclusion === 'chance') {
        box.append(h('p', { class: 'ds-toy' }, t(s.conclusion === 'collision' ? 'toyCollision' : 'toyChance')));
      }
    }
    return box;
  }

  // ---- the topology: Alice — Mallory — Bob ----
  var ACTS = { alice: ['write', 'hash', 'sign', 'send'], mallory: ['mallory'], bob: ['bobHash', 'recover', 'compare', 'conclude'] };
  function renderTopo(c) {
    var s = c.state, p = c.params;
    function node(id, col, role, work) {
      return { id: id, kind: 'host', col: col, row: 0, c: COLOUR[id], mark: t(id).charAt(0), name: t(id),
        lines: [{ text: t(role), kind: 'role' }], extra: keysOf(s, p, id),
        state: has(ACTS[id], s.phase) ? 'active' : null, table: work(c), tableRow: 1 };
    }
    var packets = [];
    if (s.wire) {
      packets.push({ from: s.wire.from, to: s.wire.to, label: t('chip'), c: s.wire.resigned ? COLOUR.mallory : COLOUR.alice });
    }
    return Simdeck.topology({
      cols: 3, rows: ['auto', 'auto'], gap: '9cqw', dir: c.dir,
      nodes: [node('alice', 0, 'roleAlice', aliceWork), node('mallory', 1, 'roleMallory', malloryWork), node('bob', 2, 'roleBob', bobWork)],
      links: [{ id: 'am', a: 'alice', b: 'mallory', active: !!s.wire && s.wire.from === 'alice' },
        { id: 'mb', a: 'mallory', b: 'bob', active: !!s.wire && s.wire.to === 'bob' }],
      packets: packets
    });
  }

  // ---- captions ----
  function caption(c) {
    var s = c.state, p = c.params, num = p.showNumbers, q = L.norm(p);
    function d(text) { return h('span', { translate: 'no' }, text); } // notation in the caption keeps the caption's font
    function quoted(m) { return h('span', null, t.parts('quoted', { m: d(m) })); }
    function cap(key, vars) { return t.parts(key, vars || {}); }
    var A = s.keys.alice, M = s.keys.mallory, K = keyOf(s, s.bobTrusts);
    switch (s.phase) {
      case 'start': return cap('capStart');
      case 'write': return cap('capWrite', { msg: quoted(s.msg) });
      case 'hash': return cap('capHash', { expr: d(num ? 'h = ' + s.hashSent : 'h = SHA-256(m) mod n') });
      case 'sign': return cap('capSign', { expr: d(num ? 's = ' + powText(s.hashSent, A.d, A.n) + ' = ' + s.sig : 's = h^d mod n') });
      case 'send': return cap('capSend', { msg: quoted(s.msg) });
      case 'mallory':
        if (q.attack === 'none') return cap('capNone');
        if (q.attack === 'edit') return cap('capEdit', { msg: quoted(s.recvMsg), sig: d(num ? 's = ' + s.recvSig : 's') });
        var mh = L.toyHash(s.recvMsg, M.n);
        return cap(q.attack === 'resign' ? 'capResign' : 'capSwap', { msg: quoted(s.recvMsg),
          expr: d(num ? 's = ' + powText(mh, M.d, M.n) + ' = ' + s.recvSig : 's = h^d mod n') });
      case 'bobHash': return cap('capBobHash', { expr: d(num ? 'h\' = ' + s.hashRecv : 'h\' = SHA-256(m\') mod n') });
      case 'recover': return cap(s.bobTrusts === 'alice' ? 'capRecover' : 'capRecoverMallory',
        { expr: d(num ? 'v = ' + powText(s.recvSig, K.e, K.n) + ' = ' + s.recovered : 'v = s^e mod n') });
      case 'compare':
        var cmp = d(num ? 'v = ' + s.recovered + ', h\' = ' + s.hashRecv : 'v = h\'');
        var how = L.explain(s);
        if (!s.valid) return cap(s.sigFrom === 'alice' ? 'capInvalidEdit' : 'capInvalidResign',
          { v: d(num ? String(s.recovered) : 'v'), h: d(num ? String(s.hashRecv) : 'h\'') });
        if (how === 'wrongKey') return cap('capValidWrong', { cmp: cmp });
        if (how === 'collision' || how === 'chance') return cap('capValidToy', { cmp: cmp, why: t(how === 'collision' ? 'toyCollision' : 'toyChance') });
        return cap('capValid', { cmp: cmp });
      case 'conclude':
        switch (s.conclusion) {
          case 'authentic': return cap('capConcludeAuthentic');
          case 'reject': return cap('capConcludeReject');
          case 'wrongKey': return cap('capConcludeWrong', { msg: quoted(s.recvMsg) });
          default: return cap('capConcludeToy', { why: t(s.conclusion === 'collision' ? 'toyCollision' : 'toyChance') });
        }
    }
    return '';
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'msg', type: 'choice', value: L.defaults.msg, label: t('msg'), options: [[L.MESSAGES[0], t('msg100')], [L.MESSAGES[1], t('msg900')]] },
      { key: 'attack', type: 'choice', value: L.defaults.attack, label: t('attack'), hint: t('attackHint'),
        options: [['none', t('attackNone')], ['edit', t('attackEdit')], ['resign', t('attackResign')], ['swapkey', t('attackSwap')]] },
      { key: 'showNumbers', type: 'toggle', value: L.defaults.showNumbers, label: t('showNumbers') }
    ],

    presets: [
      { id: 'honest', label: t('presetHonest'), params: { attack: 'none' }, hint: t('presetHonestHint') },
      { id: 'tamper', label: t('presetTamper'), params: { attack: 'edit' }, hint: t('presetTamperHint') },
      { id: 'resign', label: t('presetResign'), params: { attack: 'resign' }, hint: t('presetResignHint') },
      { id: 'swapkey', label: t('presetSwap'), params: { attack: 'swapkey' }, hint: t('presetSwapHint') }
    ],

    legend: [
      { shape: 'ds-priv', label: t('legendPriv') },
      { shape: 'ds-pub', label: t('legendPub') },
      { shape: 'ds-msg', label: t('legendMsg') },
      { shape: 'ds-sig', label: t('legendSig') },
      { shape: 'ds-ok', label: t('legendOk') },
      { shape: 'ds-bad', label: t('legendBad') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'ds' },
        h('div', { class: 'ds-top' }, pairBox(c), checkBox(c)),
        renderTopo(c)));
    },

    caption: caption
  });

  // legend swatches: the same icons as the stage
  document.querySelectorAll('[data-sim="digital-signature"] .sd-swatch[data-shape^="ds-"]').forEach(function (sw) {
    sw.replaceChildren(icon(sw.dataset.shape.slice(3)));
  });
})();
</script>
</body>
</html>
