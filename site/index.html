<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{CSS}}</style>
<script>{{LANGJS}}</script>
<script>/* ?set= is the lecture view, not the finder: hide the finder before it paints */ if (/[?&]set=/.test(location.search)) document.documentElement.classList.add('is-set');</script>
</head>
<body data-site-url="{{SITE_URL}}">
<div id="home">
<header class="hero">
  <div class="brand">
    <a class="to-tree" data-lang-link href="../index.html">← {{TREE_LINK}}</a>
    <h1>{{TITLE}}</h1>
    <p class="lead">{{TAGLINE}}</p>
    <p class="count">{{COUNT}}</p>
  </div>
  {{SWITCH}}
</header>
<div class="bar">
  <div class="search"><input id="q" type="search" placeholder="{{SEARCH}}" aria-label="{{SEARCH}}" data-t-attr="placeholder aria-label" data-hr="{{SEARCH_HR}}" data-en="{{SEARCH_EN}}" autocomplete="off" spellcheck="false" autofocus><span class="shown" id="shown" aria-live="polite"></span><kbd aria-hidden="true">/</kbd></div>
  <nav class="chips" id="chips" aria-label="{{TOPICS_NAV}}">{{CHIPS}}</nav>
</div>
<main id="list">{{LIST}}</main>
<p id="none" hidden>{{NONE}}</p>
<footer>{{FOOTER}}</footer>
<aside class="tray" id="tray" aria-label="{{TRAY_LABEL}}">
  <div class="tray-bar">
    <button type="button" class="tray-title" data-tray-toggle aria-expanded="false" aria-controls="tray-body">{{TRAY}} <span class="badge" id="tray-n">0</span> <span class="caret" aria-hidden="true">▴</span></button>
    <div class="tray-actions">
      <button type="button" class="btn primary" data-tray-act="lecture">▶ {{LECTURE}}</button>
      <button type="button" class="btn" data-tray-act="handout">{{HANDOUT}}</button>
      <button type="button" class="btn" data-tray-act="copy">{{COPY}}</button>
      <button type="button" class="btn quiet" data-tray-act="clear">{{CLEAR}}</button>
    </div>
  </div>
  <div class="tray-body" id="tray-body">
    <p id="tray-empty">{{TRAY_EMPTY}}</p>
    <ol class="tray-list" id="tray-list"></ol>
  </div>
</aside>
</div>
<div id="set" hidden></div>
<div id="toast" role="status"></div>
<script>{{SCRIPT}}</script>
</body>
</html>
