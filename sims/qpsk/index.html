<!-- QPSK constellation: adopted from 50ohm-contents-hr/contents/html/applet_qpsk.html (QPSK transmission with noise

     (docs/sim-ui.md), translated and changed. A stepper: one step sends one symbol; the model is in sim.js, the page
     draws the constellation as SVG; the words are in strings.js. -->
<html lang="hr" data-sim="qpsk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QPSK konstelacija · simdeck</title>
<meta name="description" content="QPSK sa šumom: primljene točke u konstelacijskom dijagramu, područja odluke prijamnika i pogrešni simboli.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "qpsk",
  "class": "stepper",
  "steps": 16,
  "title": { "hr": "QPSK u konstelacijskom dijagramu", "en": "QPSK in the constellation diagram" },
  "concept": { "hr": "Šum pomiče primljene točke; prijamnik bira simbol po kvadrantu", "en": "Noise moves the received points; the receiver picks the symbol by quadrant" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="qpsk"]; colours only from kit tokens. */
[data-sim="qpsk"] .qp { height: 100%; padding: 1.5cqh 1.5cqw; display: flex; gap: 2.5cqw; align-items: stretch; }
[data-sim="qpsk"] .qp-plot { position: relative; height: 100%; aspect-ratio: 1 / 1; flex: none; max-width: 62cqw; }
[data-sim="qpsk"] .qp-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="qpsk"] .qp-plot text { font-family: var(--mono); font-size: var(--fs-stage); font-weight: 700; fill: var(--ink); }
[data-sim="qpsk"] .qp-plot text.qp-axis { font-family: var(--sans); fill: var(--muted); }
[data-sim="qpsk"] .qp-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="qpsk"] .qp-region { opacity: 0.1; }
[data-sim="qpsk"] .qp-axisline { stroke: var(--muted); stroke-width: 2; }
[data-sim="qpsk"] .qp-circle { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 6; }
[data-sim="qpsk"] .qp-cross { stroke-width: 4; stroke-linecap: round; }
[data-sim="qpsk"] .qp-pt { stroke: var(--bg); stroke-width: 1.5; }
[data-sim="qpsk"] .qp-old { opacity: 0.75; }
[data-sim="qpsk"] .qp-halo { fill: var(--hl); stroke: var(--ink); stroke-width: 2.5; }
[data-sim="qpsk"] .qp-arrow { stroke-width: 3; }
/* fill and stroke of a symbol's marks: c2, c3, c4, c6 (as the original's orange, green, purple, teal) */
[data-sim="qpsk"] [data-s="11"] { fill: var(--c2); stroke: var(--c2); }
[data-sim="qpsk"] [data-s="01"] { fill: var(--c3); stroke: var(--c3); }
[data-sim="qpsk"] [data-s="00"] { fill: var(--c4); stroke: var(--c4); }
[data-sim="qpsk"] [data-s="10"] { fill: var(--c6); stroke: var(--c6); }
[data-sim="qpsk"] .qp-pt[data-s] { stroke: var(--bg); }
/* The kit's .sd-ctl display beats [hidden]: keep the hidden seed slider hidden (as sims/fourier and sims/amdahl). */
[data-sim="qpsk"] .sd-ctl[hidden] { display: none; }
/* the side: the bit string and the tally */
[data-sim="qpsk"] .qp-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1.2rem; justify-content: center; }
[data-sim="qpsk"] .qp-rowhead { display: flex; gap: 0.6rem; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="qpsk"] .qp-stream { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.5rem; }
[data-sim="qpsk"] .qp-chip { border: 2px solid var(--line); border-radius: var(--radius-sm); padding: 0.15rem 0.3rem; text-align: center; font-family: var(--mono); line-height: 1.3; background: var(--bg); color: var(--muted); }
[data-sim="qpsk"] .qp-chip b { display: block; font-size: var(--fs-stage); }
[data-sim="qpsk"] .qp-chip span { display: block; min-height: 1.3em; }
[data-sim="qpsk"] .qp-chip.qp-done { color: var(--ink); border-color: var(--ink); }
[data-sim="qpsk"] .qp-chip.qp-wrong { border-style: dashed; border-width: 3px; }
[data-sim="qpsk"] .qp-chip.qp-wrong span { background: var(--hl); color: var(--on-hl); font-weight: 700; }
[data-sim="qpsk"] .qp-chip.qp-now { outline: 4px solid var(--accent); outline-offset: 2px; }
[data-sim="qpsk"] .qp-tally { display: grid; grid-template-columns: auto auto; gap: 0.3rem 1.2rem; justify-content: start; font-size: var(--fs-md); }
[data-sim="qpsk"] .qp-tally b { font-family: var(--mono); font-size: var(--fs-lg); }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the transport. */
[data-sim="qpsk"] .qp-credit { order: 9; flex: 1 1 100%; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="qpsk"] .qp-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="qpsk"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="qpsk"] .qp { height: auto; flex-direction: column; padding: 0.6rem; gap: 1rem; }
  [data-sim="qpsk"] .qp-plot { height: auto; width: 100%; max-width: none; }
  [data-sim="qpsk"] .qp-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover too much of the screen. */
  [data-sim="qpsk"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">QPSK u konstelacijskom dijagramu</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="qp-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var LIMIT = 2.1;   // the plot shows I and Q from −LIMIT to +LIMIT; points beyond are clipped at the frame
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

  var labels = { clean: 'presetClean', original: 'presetOriginal', strong: 'presetStrong', max: 'presetMax', twoBits: 'presetTwoBits' };

  // A received point: each sent symbol has its own shape as well as its colour (grayscale keeps them apart).
  function marker(bits, x, y, r, cls) {
    var a = { class: 'qp-pt' + (cls ? ' ' + cls : ''), 'data-s': bits };
    if (bits === '11') return s('circle', Object.assign(a, { cx: x, cy: y, r: r }));
    if (bits === '01') return s('rect', Object.assign(a, { x: x - 0.9 * r, y: y - 0.9 * r, width: 1.8 * r, height: 1.8 * r }));
    if (bits === '00') return s('polygon', Object.assign(a, { points: [x, y - 1.2 * r, x + 1.1 * r, y + 0.8 * r, x - 1.1 * r, y + 0.8 * r].join(' ') }));
    return s('polygon', Object.assign(a, { points: [x, y - 1.25 * r, x + 1.25 * r, y, x, y + 1.25 * r, x - 1.25 * r, y].join(' ') }));
  }

  // ── the constellation: decision regions, circle, axes, ideal crosses, received points, the current pointer ──
  function drawPlot(box, st, n) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), size = Math.min(W, H), pad = 0.4 * r;
    var unit = (size - 2 * pad) / (2 * LIMIT), cx = W / 2, cy = H / 2, half = LIMIT * unit;
    var X = function (i) { return cx + Math.max(-LIMIT, Math.min(LIMIT, i)) * unit; };
    var Y = function (q) { return cy - Math.max(-LIMIT, Math.min(LIMIT, q)) * unit; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'qp-frame', x: cx - half, y: cy - half, width: 2 * half, height: 2 * half }));
    L.ORDER.forEach(function (bits) {
      var m = L.MAPPING[bits];
      svg.append(s('rect', { class: 'qp-region', 'data-s': bits, x: m.i > 0 ? cx : cx - half, y: m.q > 0 ? cy - half : cy, width: half, height: half }));
    });
    svg.append(s('circle', { class: 'qp-circle', cx: cx, cy: cy, r: Math.SQRT2 * unit }));
    svg.append(s('line', { class: 'qp-axisline', x1: cx - half, x2: cx + half, y1: cy, y2: cy }));
    svg.append(s('line', { class: 'qp-axisline', x1: cx, x2: cx, y1: cy - half, y2: cy + half }));
    svg.append(s('text', { class: 'qp-axis', x: cx + half - 0.4 * r, y: cy - 0.4 * r, 'text-anchor': 'end' }, t('axisI')));
    svg.append(s('text', { class: 'qp-axis', x: cx + 0.5 * r, y: cy - half + 1.4 * r }, t('axisQ')));
    var arm = 0.45 * r;
    L.ORDER.forEach(function (bits) {
      var m = L.MAPPING[bits], x = X(m.i), y = Y(m.q);
      svg.append(s('line', { class: 'qp-cross', 'data-s': bits, x1: x - arm, y1: y - arm, x2: x + arm, y2: y + arm }));
      svg.append(s('line', { class: 'qp-cross', 'data-s': bits, x1: x - arm, y1: y + arm, x2: x + arm, y2: y - arm }));
      // the bit pair outside the cross, away from both axes
      svg.append(s('text', { x: x + (m.i > 0 ? 1 : -1) * 1.0 * r, y: y + (m.q > 0 ? -0.6 * r : 1.6 * r), 'text-anchor': m.i > 0 ? 'start' : 'end' }, bits));
    });
    var pts = st.received, last = pts.length - 1, pr = 0.5 * r;
    pts.forEach(function (p, k) {
      if (k === last) return;
      if (p.bitErrors) svg.append(s('circle', { class: 'qp-halo qp-old', cx: X(p.i), cy: Y(p.q), r: 1.9 * pr }));
      svg.append(marker(p.bits, X(p.i), Y(p.q), pr, 'qp-old'));
    });
    if (last >= 0) {
      var p = pts[last], x = X(p.i), y = Y(p.q);
      var len = Math.hypot(x - cx, y - cy), head = 0.7 * r;
      if (len > head * 1.5) {
        var ux = (x - cx) / len, uy = (y - cy) / len, bx = x - ux * head * 1.4, by = y - uy * head * 1.4;
        svg.append(s('line', { class: 'qp-arrow', 'data-s': p.bits, x1: cx, y1: cy, x2: bx, y2: by }));
        svg.append(s('polygon', { 'data-s': p.bits, points: [x - ux * head * 0.9, y - uy * head * 0.9,
          bx - uy * head * 0.5, by + ux * head * 0.5, bx + uy * head * 0.5, by - ux * head * 0.5].join(' ') }));
      }
      if (p.bitErrors) svg.append(s('circle', { class: 'qp-halo', cx: x, cy: y, r: 2.3 * pr }));
      svg.append(marker(p.bits, x, y, pr * 1.4));
    }
    box.replaceChildren(svg);
  }

  // ── the bit string: what was sent, what the receiver decided; and the running tally ──
  function side(st, n, dir) {
    var chips = st.sent.map(function (bits, k) {
      var p = st.received[k], cls = 'qp-chip';
      if (p) cls += ' qp-done' + (p.bitErrors ? ' qp-wrong' : '');
      if (k === n - 1) cls += ' qp-now' + (dir === 'forward' ? ' sd-anim-in' : '');
      return h('div', { class: cls, translate: 'no', 'aria-label': p && p.bitErrors ? bits + ' → ' + p.decided + ', ' + t('chipWrong') : null },
        h('b', null, bits), h('span', null, p ? p.decided : ' '));
    });
    return h('div', { class: 'qp-side' },
      h('div', null,
        h('div', { class: 'qp-rowhead' }, h('span', null, t('streamSent')), h('span', { 'aria-hidden': 'true' }, '/'), h('span', null, t('streamGot'))),
        h('div', { class: 'qp-stream' }, chips)),
      h('div', { class: 'qp-tally' },
        h('span', null, t('tallySymbols')), h('b', null, t('of', { a: st.symbolErrors, b: st.sent.length })),
        h('span', null, t('tallyBits')), h('b', null, t('of', { a: st.bitErrors, b: 2 * st.sent.length }))));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'noise', type: 'range', label: t('noise'), hint: t('noiseHint'), min: 0, max: L.NOISE_MAX, step: 1,
        format: function (v) { return t('pct', { v: v }); } },
      { key: 'seed', type: 'range', label: t('newBits'), min: 1, max: 999, visible: function () { return false; }, resets: true },
      { type: 'button', label: t('newBits'), key: 'n', run: function (sm) { sm.set({ seed: sm.params.seed % 999 + 1 }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'hollow', label: t('legendIdeal') },
      { shape: 'round', label: t('legendPoint') },
      { shape: 'hl', label: t('legendWrong') }
    ],

    render: function (c) {
      var plot = h('div', { class: 'qp-plot' });
      c.stage.replaceChildren(h('div', { class: 'qp' }, plot, side(c.state, c.n, c.dir)));
      drawPlot(plot, c.state, c.n);
    },

    caption: function (c) {
      var st = c.state, b = function (x) { return h('b', { translate: 'no' }, x); };
      var total = st.sent.length;
      if (c.first) return t.parts('captionStart', { n: b(String(total)), noise: b(t('pct', { v: Math.round(st.sigma * 100) })) });
      var p = st.received[st.received.length - 1];
      var parts = t.parts('captionStep', {
        k: b(String(c.n)), total: total, bits: b(p.bits), angle: t('deg', { v: L.MAPPING[p.bits].angle }),
        phase: b(t('deg', { v: num(Math.round(p.phase)) })), got: b(p.decided)
      });
      parts = parts.concat(p.bitErrors ? h('span', { class: 'sd-hl' }, t.n('captionWrong', p.bitErrors)) : t('captionOk'));
      if (c.last) parts = parts.concat(t.parts('captionEnd', { se: b(String(st.symbolErrors)), total: total, be: b(String(st.bitErrors)), nb: 2 * total }));
      return parts;
    }
  });

  // The plot is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var lastSize = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== lastSize) { lastSize = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
