    var att = h('div', { class: 'rw-box' }, h('h3', null, t('sideAttacker')), h('div', { class: 'rw-creds' }, creds));
    var paper = L.ticks(s.checklist.paper), real = L.ticks(s.checklist.real);
    var rows = [['copies', 'chkCopies'], ['media', 'chkMedia'], ['offsite', 'chkOffsite'], ['offlineOrImmutable', 'chkOffline']];
    function mark(ok, n) { return h('span', { class: 'rw-mark', dataset: { ok: String(ok) }, 'aria-label': n + ': ' + t(ok ? 'chkYes' : 'chkNo') }, String(n)); }
    var revealed = s.done, fresh = revealed && e && e.kind === 'count';
    var table = h('table', { class: 'rw-chk' },
      h('thead', null, h('tr', null, h('th', null, t('chkRule')), h('th', null, t('chkPaper')), revealed ? h('th', null, t('chkReal')) : null)),
      h('tbody', null, rows.map(function (r) {
        var diff = revealed && paper[r[0]] !== real[r[0]];
        return h('tr', null, h('td', null, t(r[1])), h('td', null, mark(paper[r[0]], s.checklist.paper[r[0]])),
          revealed ? h('td', { class: fresh && diff ? 'sd-changed' : null }, mark(real[r[0]], s.checklist.real[r[0]])) : null);
      })));
    var kids = [clock, att, h('div', { class: 'rw-box' }, h('h3', null, t('chkTitle')), table)];
    if (s.done) {
      var k = s.last, ok = k.best !== null;
      var lines = [h('b', null, t.n('outSurvivors', k.survivors.length))];
      if (k.sourceIntact) lines.push(h('span', null, t('outIntact')));
      else if (ok) {
        lines.push(h('span', null, P('outRestore', { copy: nameOf(k.best) })));
        lines.push(h('span', null, t('outNewest', { time: when(k.bestT) })));
        lines.push(h('span', null, t('outLost', { dur: dur(k.lostMinutes) })));
      } else lines.push(h('span', null, t('outTotal')));
      kids.push(h('div', { class: 'rw-out', dataset: { ok: String(ok) } }, lines));
    }
    return h('div', { class: 'rw-side' }, kids);
  }

  // ── captions ──
  function hitOf(e, id) { return e.hits.filter(function (x) { return x.id === id; })[0]; }
  function eventCaption(c) {
    var s = c.state, e = s.last, out;
    switch (e.kind) {
      case 'blocked': return P('capBlocked', {});
      case 'logon': return P('capLogon', {});
      case 'localAdmin': return P('capLocalAdmin', {});
      case 'findCred': return P(e.found ? 'capFound' : 'capNotFound', {});
      case 'encryptSource': return P('capSource', { path: data(DATA.src) });
      case 'encryptMirror': return P(e.hits[0].effect === 'encrypted' ? 'capMirror' : 'capMirrorOut', {});
      case 'encryptUsb': return P('capUsb', {});
      case 'deleteShadows': return P(e.hits[0].effect === 'off' ? 'capVssOff' : 'capVss', {});
      case 'backups': {
        out = P('capBackups', {});
        if (!e.hits.length) return out.concat([' '], P('capBackupsNone', {}));
        var repo = hitOf(e, 'repo'), cloud = hitOf(e, 'cloud'), tape = hitOf(e, 'tape');
        if (repo && repo.effect === 'unreachable') out = out.concat([' '], P(cloud ? 'capBackupsOut' : 'capBackupsOutRepo', {}));
        else if (repo) out = out.concat([' '], P('capRepoDeleted', {}));
        if (cloud && cloud.effect === 'deleted') out = out.concat([' '], P('capCloudDeleted', {}));
        if (cloud && cloud.effect === 'locked') out = out.concat([' '], P('capCloudLocked', { date: dateOf(L.copyOf(s, 'cloud').immutableUntil) }));
        if (tape) out = out.concat([' '], P('capTapeOff', {}));
        return out;
      }
      case 'jobs': {
        out = P('capJobs', {});
        var mirrorHit = s.log.some(function (l) { return l.kind === 'encryptMirror' && l.hits[0].effect === 'encrypted'; });
        e.hits.forEach(function (x) {
          var key = x.id === 'mirror' ? (mirrorHit ? 'capJobMirrorAgain' : 'capJobMirror')
            : x.effect === 'failed' ? (x.id === 'repo' ? 'capJobFailed' : null)   // the cloud copy fails with it
            : x.id === 'repo' ? 'capJobAdded' : 'capJobCloud';
          if (key) out = out.concat([' '], P(key, {}));
        });
        return out;
      }
      case 'discovery': return P('capDiscovery', {});
      case 'count': {
        out = P('capCount', {});
        if (e.sourceIntact) return out.concat([' '], P('capCountIntact', {}));
        if (e.best === null) {
          out = out.concat([' '], P('capCountNone', {}));
          var ck = s.checklist, pt = L.ticks(ck.paper);
          if (pt.copies && pt.media && pt.offsite) out = out.concat([' '], P('noteOnPaper', {}));
          return out;
        }
        out = out.concat([' '], P('capCountSome', { copy: nameOf(e.best), time: when(e.bestT), dur: dur(e.lostMinutes) }));
        if (e.tie) out = out.concat([' '], P('noteTie', { a: nameOf(e.best), b: nameOf(e.tie) }));
        return out;
      }
    }
    return [];
  }
  function caption(c) {
    if (c.first) return P('capStart', {});
    var e = c.state.last;
    return P('capStep', { n: c.n, time: whenFull(e.t) }).concat([' '], eventCaption(c));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'design', type: 'choice', label: t('design'), hint: t('designHint'),
        options: [['estate', t('designEstate')], ['321-online', t('design321')], ['immutable', t('designImm')], ['offline-tape', t('designTape')]] },
      { key: 'mfaOnVpn', type: 'toggle', label: t('mfaOnVpn'), hint: t('mfaHint') },
      { key: 'credOnServer', type: 'toggle', label: t('credOnServer'), hint: t('credHint') }
    ],

    presets: [
      { id: 'estate', label: t('presetEstate'), hint: t('presetEstateHint'), params: {} },
      { id: '321-online', label: t('preset321'), hint: t('preset321Hint'), params: { design: '321-online' } },
      { id: 'immutable', label: t('presetImm'), hint: t('presetImmHint'), params: { design: 'immutable' } },
      { id: 'offline-tape', label: t('presetTape'), hint: t('presetTapeHint'), params: { design: 'offline-tape' } },
      { id: 'mfa', label: t('presetMfa'), hint: t('presetMfaHint'), params: { mfaOnVpn: true } }
    ],

    legend: [
      { shape: 'rw-clean', label: t('legendClean') },
      { shape: 'rw-enc', label: t('legendEnc') },
      { shape: 'rw-del', label: t('legendDel') },
      { shape: 'rw-imm', label: t('legendImm') },
      { shape: 'rw-off', label: t('legendOff') },
      { shape: 'rw-att', label: t('legendAtt') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var e = c.n > 0 ? c.state.last : null;
      c.stage.replaceChildren(h('div', { class: 'rw' }, renderZones(c.state, e), renderSide(c)));
    },

    caption: caption
  });

  // the legend's icons: the kit draws plain swatches; the page adds its icons once
  var SW_ICON = { 'rw-enc': 'lock', 'rw-imm': 'shield', 'rw-off': 'plug', 'rw-att': 'token' };
  Object.keys(SW_ICON).forEach(function (k) {
    var sw = document.querySelector('.sd-swatch[data-shape="' + k + '"]');
    if (sw) sw.appendChild(icon(SW_ICON[k]));
  });
})();
</script>
</body>
