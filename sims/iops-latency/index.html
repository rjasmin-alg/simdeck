<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var MAX_QUEUE = 40;          // queued squares drawn; the rest is "+n"
  var Q_MAX = 256;             // the charts' x axis: 1 … 256 (log₂)
  var sim = null;

  // ── numbers in the page's language ──
  function sep(s) {
    var parts = s.split('.'), int = parts[0];
    if (int.replace('-', '').length > 4) int = int.replace(/\B(?=(\d{3})+(?!\d))/g, t('thou'));
    return int + (parts.length > 1 ? t('dec') + parts[1] : '');
  }
  /** IOPS: whole numbers, thousands separated from five digits. */
  function iopsN(v) { return sep(String(Math.round(v))); }
  /** ms: two significant digits below 100 (0.081, 5.2, 13), whole from 100. */
  function msN(v) { return t('ms', { v: v === 0 ? '0' : sep(v >= 100 ? String(Math.round(v)) : v.toPrecision(2)) }); }
  /** MB/s: one decimal below 10, whole from 10. */
  function mbN(v) { return t('mbs', { v: sep(v < 10 ? v.toFixed(1) : String(Math.round(v))) }); }
  function bsN(k) { return k >= 1024 ? t('mib', { n: String(k / 1024) }) : t('kib', { n: String(k) }); }
  function devN(id) { return t('dev-' + id); }
  /** Axis tick: up to three significant digits, thousands separated. */
  function tick(v) { return sep(String(parseFloat(v.toPrecision(3)))); }
  function b(x) { return h('b', null, x); }

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }

  // ── what changed with the last change: the params before it (caption) and the bound before it (marks) ──
  var lastKey = null, lastP = null, prevP = null;
  function track(p) {
    var key = JSON.stringify(p);
    if (key === lastKey) return;            // a redraw of the same state (theme, resize) keeps the last change
    prevP = lastP; lastP = p; lastKey = key;
  }

  /** A nice upper bound for an axis: 1, 2, 2.5 or 5 × 10^k at or above v. */
  function nice(v) {
    var e = Math.pow(10, Math.floor(Math.log10(v)));
    var m = [1, 2, 2.5, 5, 10].filter(function (x) { return x * e >= v - 1e-12; })[0];
    return m * e;
  }

  // ── one chart: a metric against queue depth (log₂ 1…256) for the current device and block ──
  var FIELD = { iops: 'iops', mbps: 'mbps', lat: 'latMs' };
  function draw(box, g, st, p) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var fs = Math.max(16, 0.8 * rem);
    var key = FIELD[g];
    var top = 0;
    for (var i = 0; i <= 64; i++) top = Math.max(top, L.curveAt(p, Math.pow(2, i / 8))[key]);
    if (g === 'mbps') top = Math.max(top, st.bwMBps);
    var ymax = nice(top * 1.08);
    var labels = [0, ymax / 2, ymax].map(tick);
    var lw = 0, probe = s('text', null, labels[2]);
    var svg = s('svg', { width: W, height: H, role: 'img', 'aria-label': t(g === 'iops' ? 'plotIops' : g === 'mbps' ? 'plotMbps' : 'plotLat') });
    box.replaceChildren(svg);
    svg.append(probe); lw = probe.getComputedTextLength(); probe.remove();
    var m = { l: lw + 0.6 * rem, r: 0.9 * rem, t: 1.3 * fs, b: 2.6 * fs };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    if (pw < 40 || ph < 30) return;
    var X = function (q) { return m.l + Math.log2(q) / Math.log2(Q_MAX) * pw; };
    var Y = function (v) { return m.t + ph - Math.min(v, ymax) / ymax * ph; };

    // grid, ticks and axes
    for (var k = 0; k <= 8; k++) {
      var x = X(Math.pow(2, k));
      svg.append(s('line', { class: 'il-grid', x1: x, x2: x, y1: m.t, y2: m.t + ph }));
      if (pw > 22 * rem || k % 2 === 0) svg.append(s('text', { x: x, y: m.t + ph + 1.1 * fs, 'text-anchor': 'middle' }, String(Math.pow(2, k))));
    }
    [0, 1, 2].forEach(function (j) {
      var y = Y(ymax * j / 2);
      if (j) svg.append(s('line', { class: 'il-grid', x1: m.l, x2: m.l + pw, y1: y, y2: y }));
      svg.append(s('text', { x: m.l - 0.3 * rem, y: y + 0.35 * fs, 'text-anchor': 'end' }, labels[j]));
    });
    svg.append(s('line', { class: 'il-axis', x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph }));
    svg.append(s('line', { class: 'il-axis', x1: m.l, x2: m.l, y1: m.t, y2: m.t + ph }));
    svg.append(s('text', { x: m.l + pw, y: m.t + ph + 2.3 * fs, 'text-anchor': 'end', class: 'il-muted' }, t('axisQd')));

    // QD = P (every lane busy) and, on the throughput chart, the bandwidth ceiling
    var xp = X(st.lanes);
    svg.append(s('line', { class: 'il-pline', x1: xp, x2: xp, y1: m.t - 0.2 * fs, y2: m.t + ph }));
    var right = st.lanes >= 64;
    svg.append(s('text', { x: xp + (right ? -0.3 : 0.3) * rem, y: m.t - 0.25 * fs, 'text-anchor': right ? 'end' : 'start', class: 'il-muted' }, t('lanesMark', { n: String(st.lanes) })));
    if (g === 'mbps') {
      var yc = Y(st.bwMBps);
      svg.append(s('line', { class: 'il-ceil', x1: m.l, x2: m.l + pw, y1: yc, y2: yc }));
      svg.append(s('text', { x: m.l + pw, y: yc - 0.35 * fs, 'text-anchor': 'end' }, t('ceilMark')));
    }

    // the curve
    var pts = [];
    for (var n = 0; n <= 400; n++) {
      var q = Math.pow(2, n / 50);
      pts.push(X(q).toFixed(1) + ' ' + Y(L.curveAt(p, q)[key]).toFixed(1));
    }
    svg.append(s('path', { class: 'il-curve', 'data-g': g, d: 'M' + pts.join(' L') }));

    // the current point
    var xq = X(st.qd), yq = Y(st[key]);
    svg.append(s('line', { class: 'il-guide', x1: xq, x2: xq, y1: yq, y2: m.t + ph }));
    svg.append(s('circle', { class: 'il-ring', cx: xq, cy: yq, r: 0.55 * rem }));
    svg.append(s('circle', { class: 'il-ring-dot', cx: xq, cy: yq, r: 0.2 * rem }));

    // click or drag on a chart to set the queue depth (powers of two, 1…128)
    svg.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      var rect = svg.getBoundingClientRect();
      function set(e) {
        var f = Math.max(0, Math.min(1, (e.clientX - rect.left - m.l) / pw));
        var qd = Math.pow(2, Math.min(7, Math.round(f * Math.log2(Q_MAX))));
        if (qd !== sim.params.qd) sim.set({ qd: qd });
      }
      function up() { window.removeEventListener('pointermove', set); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); }
      set(ev);
      window.addEventListener('pointermove', set);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    });
  }

  // ── the scene (HTML) ──
  function scene(st, marks) {
    var waiting = st.waiting, shown = Math.min(waiting, MAX_QUEUE), slots = [];
    if (waiting > shown) slots.push(h('span', { class: 'il-q-more' }, t('queueMore', { n: String(waiting - shown) })));
    for (var i = 0; i < shown; i++) slots.push(h('span', { class: 'il-q-req' }));
    var lanes = [];
    for (var j = 0; j < st.lanes; j++) lanes.push(h('span', j < st.busy ? { class: 'il-lane', 'data-busy': '' } : { class: 'il-lane' }));
    var used = Math.min(1, st.mbps / st.bwMBps);
    var boundWord = st.bound === 'parallelism' && st.lanes === 1 ? 'bound-arm' : 'bound-' + st.bound;
    return [
      h('span', { class: 'il-q-title' }, t('queueTitle')),
      h('div', { class: 'il-q-line' },
        h('div', { class: 'il-q-slots' }, slots),
        h('div', { class: 'il-q-note' }, waiting ? t.n('waiting', waiting) : t('queueNone'))),
      h('span', { class: 'il-arrow', 'aria-hidden': 'true' }, '→'),
      h('div', { class: 'il-dev' },
        h('span', { class: 'il-dev-name' }, devN(st.device)),
        h('div', { class: 'il-lanes', style: { '--cols': String(Math.min(st.lanes, 16)) } }, lanes),
        h('span', { class: 'il-dev-sub' }, t('lanesBusy', { busy: String(st.busy), p: String(st.lanes) })),
        h('span', { class: 'il-dev-sub' }, t('svc', { v: msN(st.svcMs), acc: msN(st.accessMs), xfer: msN(st.xferMs) })),
        st.capped && st.laneMs > st.svcMs * (1 + 1e-9) ? h('span', { class: 'il-dev-sub' }, b(t('laneShared', { v: msN(st.laneMs) }))) : null),
      h('span', { class: 'il-arrow', 'aria-hidden': 'true' }, '→'),
      h('div', { class: 'il-pipe' },
        h('div', used >= 1 - 1e-9 ? { class: 'il-pipe-bar', 'data-full': '', style: { '--used': '100%' } } : { class: 'il-pipe-bar', style: { '--used': (used * 100).toFixed(1) + '%' } }),
        h('span', { class: 'il-pipe-label' }, t('pipe', { v: mbN(st.mbps), max: mbN(st.bwMBps) }))),
      h('div', { class: 'il-badge' + (marks.length ? ' sd-changed' : ''), dataset: { bound: st.bound } },
        t('limit'), ' ', h('b', null, t(boundWord)))
    ];
  }

  function card(g, label, val, sub, changed) {
    var plot = h('div', { class: 'il-plot' });
    return { el: h('div', { class: 'il-card' + (changed ? ' sd-changed' : ''), dataset: { g: g } },
      h('div', { class: 'il-g-label' }, label),
      h('div', { class: 'il-g-val' }, val),
      h('div', { class: 'il-g-sub' }, sub),
      plot), plot: plot };
  }
  function cards(st, marks) {
    var bs = bsN(st.bs);
    return [
      card('iops', t('gIops'), iopsN(st.iops),
        st.capped ? t('gIopsCap', { bw: mbN(st.bwMBps), bs: bs }) : t('gIopsSub', { busy: String(st.busy), svc: msN(st.svcMs) }), marks.indexOf('iops') >= 0),
      card('mbps', t('gMbps'), mbN(st.mbps), t('gMbpsSub', { bs: bs }), marks.indexOf('mbps') >= 0),
      card('lat', t('gLat'), msN(st.latMs), t('gLatSub', { qd: String(st.qd) }), marks.indexOf('lat') >= 0)
    ];
  }

  // ── captions: what the last change did, then which limit binds now ──
  function caption(c) {
    track(c.params);
    var st = c.state, ck = L.captionKey(st, prevP), out = [];
    if (ck.change) {
      var was = L.compute(prevP);
      var vars = { i0: iopsN(was.iops), i1: b(iopsN(st.iops)), l0: msN(was.latMs), l1: b(msN(st.latMs)), m0: mbN(was.mbps), m1: b(mbN(st.mbps)) };
      if (ck.change === 'qd') { vars.a = String(was.qd); vars.b = String(st.qd); out = out.concat(t.parts('chQd', vars)); }
      else if (ck.change === 'bs') { vars.a = bsN(was.bs); vars.b = bsN(st.bs); out = out.concat(t.parts('chBs', vars)); }
      else { vars.a = devN(was.device); vars.b = devN(st.device); out = out.concat(t.parts('chDevice', vars)); }
      out.push(' ');
    }
    return out.concat(t.parts(ck.key, {
      iops: b(iopsN(st.iops)), lat: b(msN(st.latMs)), mbps: mbN(st.mbps), svc: msN(st.svcMs), acc: msN(st.accessMs),
      xfer: msN(st.xferMs), bs: bsN(st.bs), bw: b(mbN(st.bwMBps)), qd: String(st.qd), busy: String(st.busy),
      p: String(st.lanes), w: t.n('reqs', st.waiting)
    }));
  }

  var labels = { 'hdd-random': 'presetHddRandom', 'hdd-sequential': 'presetHddSeq', 'nvme-qd': 'presetNvmeQd', 'nvme-big-blocks': 'presetNvmeBig', 'sata-vs-nvme': 'presetSata' };
  var stageBox = null, sceneBox = null, colsBox = null, plots = null, last = null;
  function drawAll() { if (last) ['iops', 'mbps', 'lat'].forEach(function (g, i) { draw(plots[i], g, last.state, last.params); }); }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'device', type: 'choice', label: t('device'), options: L.DEVICE_IDS.map(function (d) { return [d, devN(d)]; }) },
      { key: 'bs', type: 'choice', label: t('bs'), options: L.BLOCKS.map(function (k) { return [k, bsN(k)]; }) },
      { key: 'qd', type: 'select', label: t('qd'), hint: t('qdHint'), options: L.DEPTHS.map(function (q) { return [q, String(q)]; }) }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'il-queued', label: t('legendQueued') },
      { shape: 'il-lane', label: t('legendLane') },
      { shape: 'il-slot', label: t('legendSlot') },
      { shape: 'il-ring', label: t('legendPoint') },
      { shape: 'hl', label: t('legendChanged') }
    ],
    render: function (c) {
      if (!stageBox) {
        sceneBox = h('div', { class: 'il-scene' });
        colsBox = h('div', { class: 'il-cols' });
        stageBox = h('div', { class: 'il' }, sceneBox, colsBox);
        c.stage.replaceChildren(stageBox);
        new ResizeObserver(function () { drawAll(); }).observe(colsBox);
      }
      track(c.params);
      var marks = prevP ? L.changed(c.state, L.compute(prevP)) : [];
      last = { state: c.state, params: c.params };
      sceneBox.replaceChildren.apply(sceneBox, scene(c.state, marks));
      var cs = cards(c.state, marks);
      colsBox.replaceChildren.apply(colsBox, cs.map(function (x) { return x.el; }));
      plots = cs.map(function (x) { return x.plot; });
      drawAll();
    },
    caption: caption
  });
})();
</script>
</body>
</html>
