<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  // ── numbers in the page's language: a decimal comma, a true minus sign, thousands in groups ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    var neg = v.charAt(0) === '-';
    if (neg) v = v.slice(1);
    var parts = v.split('.');
    if (parts[0].length > 4) parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    v = parts.join(Simdeck.lang === 'hr' ? ',' : '.');
    return (neg ? '−' : '') + v;
  }
  function sig(x) {                                  // three significant digits, no trailing zeros past the point
    var a = Math.abs(x);
    if (a >= 999.5) return num(Number(x.toPrecision(3)), 0);
    return num(x, a >= 99.5 ? 0 : a >= 9.995 ? 1 : 2);
  }
  function dbm(v) { return t('dbm', { v: num(v, 1) }); }
  function dbv(v) { return t('db', { v: num(v, 1) }); }
  function dbi(v) { return t('dbi', { v: num(v, 1) }); }
  function watts(w) {
    var u = [[1, 'wW'], [1e-3, 'wMw'], [1e-6, 'wUw'], [1e-9, 'wNw'], [1e-12, 'wPw'], [1e-15, 'wFw'], [1e-18, 'wAw']];
    if (w < 0.9995e-18) return t('wTiny');            // below the smallest prefix
    for (var i = 0; i < u.length; i++) if (w >= u[i][0] * 0.9995) return t(u[i][1], { v: sig(w / u[i][0]) });
  }
  function microvolts(uv) {
    if (uv >= 999.5) return t('vMv', { v: sig(uv / 1000) });
    if (uv >= 0.9995) return t('vUv', { v: sig(uv) });
    return uv * 1000 < 0.00995 ? t('vTiny') : t('vNv', { v: sig(uv * 1000) });
  }
  function km(x) { return x < 0.9995 ? t('meter', { v: sig(x * 1000) }) : t('km', { v: sig(x) }); }
  function lamText(m) { return m < 0.9995 ? t('cm', { v: sig(m * 100) }) : t('meter', { v: sig(m) }); }
  function areaText(a) { return a < 0.01 ? t('sqcm', { v: sig(a * 1e4) }) : t('sqm', { v: sig(a) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }

  // ── the budget as a ladder in dBm: levels as bars from the axis, changes as floating bars ──
  function ladder(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('defs', null,
      s('pattern', { id: 'lb-hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
        s('line', { class: 'lb-hatchline', x1: 0, y1: 0, x2: 0, y2: 8 })),
      s('pattern', { id: 'lb-fadehatch', width: 9, height: 9, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(-45)' },
        s('line', { class: 'lb-fadeline', x1: 0, y1: 0, x2: 0, y2: 9 }))));
    svg.append(s('text', { class: 'lb-title', x: 0.2 * r0, y: 1.2 * r0 }, t('ladTitle')));
    var rows = [
      { label: t('ladTx', { w: watts(Math.pow(10, (p.ptx - 30) / 10)) }), level: p.ptx },
      { label: t('ladCableTx'), step: -st.ltx },
      { label: t('ladGt'), step: st.gt },
      { label: t('ladEirp'), level: st.eirp, key: true },
      { header: t('ladPath', { v: dbv(st.path) }) },
      { label: t('ladSpread'), step: -st.spread, band: true },
      { label: t('ladArea'), step: st.aIso, band: true },
      { label: t('ladGr'), step: st.gr },
      { label: t('ladPol'), step: st.pol === null ? null : -st.pol, pol: true },
      { label: t('ladCableRx'), step: -st.lrx },
      { label: t('ladRx'), level: st.prx, key: true, rx: true },
      { label: t('ladMargin'), margin: true }
    ];
    // the running level after each row (null once crossed)
    var lv = [], cur = 0, dead = false;
    rows.forEach(function (r) {
      if (r.header || r.margin) { lv.push(dead ? null : cur); return; }
      if (r.level !== undefined) { if (r.level === null) dead = true; else cur = r.level; }
      else if (r.step === null) dead = true;
      else if (!dead) cur += r.step;
      lv.push(dead ? null : cur);
    });
    var vals = lv.filter(function (v) { return v !== null; }).concat([p.sens, p.sens + p.fade, p.ptx]);
    var lo = 10 * Math.floor((Math.min.apply(null, vals) - 4) / 10), hi = 10 * Math.ceil((Math.max.apply(null, vals) + 4) / 10);
    var tick = hi - lo > 150 ? 50 : hi - lo > 70 ? 20 : 10;
    var narrow = W < 30 * r0;
    var labW = narrow ? 1.2 * r0 : Math.min(15.5 * r0, 0.38 * W), valW = narrow ? 1.4 * r0 : 8.6 * r0;
    var x0 = labW, x1 = W - valW, rowH = (H - 4.4 * r0) / rows.length, y0 = 2.9 * r0;
    function X(v) { return x0 + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (x1 - x0); }
    // the path-loss band behind its header and its two rows
    var bi = rows.findIndex(function (r) { return r.header; });
    svg.append(s('rect', { class: 'lb-band', x: 0, y: y0 + bi * rowH, width: W, height: 3 * rowH, rx: 6 }));
    for (var g = Math.ceil(lo / tick) * tick; g <= hi; g += tick) {
      svg.append(s('line', { class: 'lb-grid', x1: X(g), x2: X(g), y1: y0, y2: y0 + rows.length * rowH }));
      svg.append(s('text', { class: 'lb-mute', x: X(g), y: H - 0.3 * r0, 'text-anchor': 'middle' }, num(g, 0)));
    }
    svg.append(s('text', { class: 'lb-mute', x: narrow ? W - 0.3 * r0 : labW - 1.6 * r0, y: H - (narrow ? 1.5 : 0.3) * r0, 'text-anchor': 'end' }, t('dbmTick')));
    // the fade reserve behind the received and margin rows, the sensitivity through the whole ladder
    var yr = y0 + (rows.length - 2) * rowH;
    svg.append(s('rect', { class: 'lb-fade', x: X(p.sens), y: yr + 0.08 * rowH, width: Math.max(0, X(p.sens + p.fade) - X(p.sens)), height: 1.84 * rowH }));
    var prev = null;
    rows.forEach(function (r, i) {
      var y = y0 + i * rowH, bh = Math.max(4, rowH * (narrow ? 0.3 : 0.58)), by = narrow ? y + rowH - bh - 0.1 * rowH : y + (rowH - bh) / 2;
      var ty = narrow ? y + 1.0 * r0 : y + rowH / 2 + 0.35 * r0, vx = narrow ? W - 0.3 * r0 : x1 + 0.5 * r0, va = narrow ? 'end' : 'start';
      if (r.header) {
        svg.append(s('text', { class: 'lb-title lb-halo', x: narrow ? 0.3 * r0 : labW - 0.4 * r0, y: ty, 'text-anchor': narrow ? 'start' : 'end' }, r.header));
        return;
      }
      svg.append(s('text', { class: (r.key ? 'lb-title ' : '') + 'lb-halo', x: narrow ? 0.3 * r0 : labW - 0.4 * r0, y: ty, 'text-anchor': narrow ? 'start' : 'end' }, r.label));
      if (r.margin) {
        if (st.margin === null) { svg.append(s('text', { class: 'lb-mono lb-halo', x: vx, y: ty, 'text-anchor': va }, t('ladNone'))); return; }
        var ma = X(p.sens), mb = X(st.prx);
        if (Math.abs(mb - ma) >= 1) svg.append(s('rect', { class: st.margin >= 0 ? 'lb-up' : 'lb-down', x: Math.min(ma, mb), y: by, width: Math.abs(mb - ma), height: bh }));
        svg.append(s('text', { class: 'lb-mono lb-halo lb-title' + (st.status === 'works' ? '' : ' lb-bad'), x: vx, y: ty, 'text-anchor': va },
          st.margin >= 0 ? t('dbPlus', { v: num(st.margin, 1) }) : dbv(st.margin)));
        return;
      }
      if (r.level !== undefined) {
        if (r.level === null) {
          svg.append(s('text', { class: 'lb-mono lb-halo lb-title lb-bad', x: vx, y: ty, 'text-anchor': va }, t('ladNothing')));
        } else {
          svg.append(s('rect', { class: 'lb-level', x: X(lo), y: by, width: Math.max(1, X(r.level) - X(lo)), height: bh }));
          svg.append(s('text', { class: 'lb-mono lb-halo' + (r.key ? ' lb-title' : ''), x: vx, y: ty, 'text-anchor': va }, dbm(r.level)));
        }
      } else if (prev === null) {
        svg.append(s('text', { class: 'lb-mono lb-halo', x: vx, y: ty, 'text-anchor': va }, t('ladNone')));
      } else if (r.step === null) {
        // crossed: the polarization takes everything, an arrow off the chart
        var ax = X(prev), ay = by + bh / 2;
        svg.append(s('line', { class: 'lb-link', x1: ax, x2: ax, y1: y - 0.1 * rowH, y2: by }));
        svg.append(s('path', { class: 'lb-arrow', d: 'M' + ax + ',' + ay + ' H' + (X(lo) + 2) + ' m' + (0.7 * r0) + ',' + (-0.5 * r0) + ' l' + (-0.7 * r0) + ',' + (0.5 * r0) + ' l' + (0.7 * r0) + ',' + (0.5 * r0) }));
        svg.append(s('text', { class: 'lb-mono lb-halo lb-bad', x: vx, y: ty, 'text-anchor': va }, t('ladInf')));
      } else {
        var a = X(prev), b = X(lv[i]), up = lv[i] >= prev;
        svg.append(s('line', { class: 'lb-link', x1: a, x2: a, y1: y - 0.1 * rowH, y2: by }));
        if (Math.abs(b - a) >= 1) svg.append(s('rect', { class: up ? 'lb-up' : 'lb-down', x: Math.min(a, b), y: by, width: Math.abs(b - a), height: bh }));
        var sv = Math.abs(r.step) < 0.05 ? 0 : r.step;
        svg.append(s('text', { class: 'lb-mono lb-halo', x: vx, y: ty, 'text-anchor': va }, sv > 0 ? t('dbPlus', { v: num(sv, 1) }) : dbv(sv)));
      }
      prev = lv[i];
    });
    svg.append(s('line', { class: 'lb-sens', x1: X(p.sens), x2: X(p.sens), y1: y0 - 0.2 * r0, y2: y0 + rows.length * rowH }));
    svg.append(s('text', { class: 'lb-halo', x: X(p.sens) + 0.3 * r0, y: y0 - 0.4 * r0, 'text-anchor': 'start' }, t('ladSens')));
    box.replaceChildren(svg);
  }

  // ── the received power against distance, log distance: a line falling 6 dB per doubling ──
  var XLO = -1, XHI = Math.log10(400000);
  function plot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('defs', null,
      s('pattern', { id: 'lb-fadehatch2', width: 9, height: 9, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(-45)' },
        s('line', { class: 'lb-fadeline', x1: 0, y1: 0, x2: 0, y2: 9 })),
      s('clipPath', { id: 'lb-clip' }, s('rect', { x: 0, y: 0, width: 1, height: 1, id: 'lb-cliprect' }))));
    svg.append(s('text', { class: 'lb-title', x: 0.2 * r0, y: 1.2 * r0 }, t('plotTitle')));
    var left = 3.6 * r0, right = W - 1.2 * r0, top = 3.0 * r0, bottom = H - 2.4 * r0;
    if (right - left < 40 || bottom - top < 40) { box.replaceChildren(svg); return; }
    svg.querySelector('#lb-cliprect').setAttribute('x', left);
    svg.querySelector('#lb-cliprect').setAttribute('y', top);
    svg.querySelector('#lb-cliprect').setAttribute('width', right - left);
    svg.querySelector('#lb-cliprect').setAttribute('height', bottom - top);
    var ylo = p.sens - 30, yhi = p.sens + 100;
    function X(km) { return left + (Math.log10(km) - XLO) / (XHI - XLO) * (right - left); }
    function Y(v) { return bottom - (v - ylo) / (yhi - ylo) * (bottom - top); }
    var every = right - left < 32 * r0 ? 2 : 1;      // a narrow plot labels every other decade
    for (var e = -1; e <= 5; e++) {
      var gx = X(Math.pow(10, e));
      svg.append(s('line', { class: 'lb-grid', x1: gx, x2: gx, y1: top, y2: bottom }));
      if ((e + 1) % every === 0) svg.append(s('text', { class: 'lb-mute', x: gx, y: bottom + 1.3 * r0, 'text-anchor': 'middle' }, num(Math.pow(10, e), e < 0 ? 1 : 0)));
    }
    svg.append(s('text', { class: 'lb-mute', x: right, y: bottom + 2.2 * r0, 'text-anchor': 'end' }, t('plotKm')));
    for (var v = ylo + 10; v <= yhi; v += 20) {
      svg.append(s('line', { class: 'lb-grid', x1: left, x2: right, y1: Y(v), y2: Y(v) }));
      svg.append(s('text', { class: 'lb-mute', x: left - 0.3 * r0, y: Y(v) + 0.35 * r0, 'text-anchor': 'end' }, num(v, 0)));
    }
    svg.append(s('text', { class: 'lb-mute', x: left + 0.3 * r0, y: top - 0.5 * r0, 'text-anchor': 'start' }, t('dbmTick')));
    svg.append(s('line', { class: 'lb-axis', x1: left, x2: left, y1: top, y2: bottom }));
    svg.append(s('line', { class: 'lb-axis', x1: left, x2: right, y1: bottom, y2: bottom }));
    // the fade reserve and the sensitivity
    svg.append(s('rect', { class: 'lb-fade lb-fade2', x: left, y: Y(p.sens + p.fade), width: right - left, height: Math.max(0, Y(p.sens) - Y(p.sens + p.fade)) }));
    svg.append(s('line', { class: 'lb-sens', x1: left, x2: right, y1: Y(p.sens), y2: Y(p.sens) }));
    svg.append(s('text', { class: 'lb-halo', x: right - 0.3 * r0, y: Y(p.sens) + 1.2 * r0, 'text-anchor': 'end' }, t('plotSens')));
    if (st.prx !== null) {
      var clip = s('g', { 'clip-path': 'url(#lb-clip)' });
      var x0 = Math.pow(10, XLO), x1 = Math.pow(10, XHI);
      clip.append(s('line', { class: 'lb-line', x1: X(x0), y1: Y(L.prxAt(st, x0)), x2: X(x1), y2: Y(L.prxAt(st, x1)) }));
      // the step triangle: twice as far, 6 dB less
      var d2 = st.dKm * 2;
      var tx0 = X(st.dKm), ty0 = Y(st.prx);
      if (d2 <= x1) {
        var tx1 = X(d2), ty1 = Y(st.prx - 20 * Math.log10(2));
        clip.append(s('path', { class: 'lb-tri', d: 'M' + tx0 + ',' + ty0 + ' H' + tx1 + ' V' + ty1 }));
        clip.append(s('text', { class: 'lb-halo', x: tx1 + 0.3 * r0, y: ty0 + 0.4 * r0 }, t('plotDouble')));
      }
      // the longest distances: with the reserve (solid, above the band) and with none (dashed, below the line)
      // each label on the side away from the current point (and inside the plot): with the reserve at the top of a
      // full-height line, where the falling line is far to the left; with none at the bottom
      function marker(dist, cls, label, top_) {
        var mx = X(Math.max(x0, Math.min(x1, dist)));
        clip.append(s('line', { class: cls, x1: mx, x2: mx, y1: top_ ? top : Y(p.sens), y2: bottom }));
        var anchor = dist < st.dKm ? 'end' : 'start';
        if (mx - left < 14 * r0) anchor = 'start';
        if (right - mx < 14 * r0) anchor = 'end';
        svg.append(s('text', { class: 'lb-halo', x: mx + (anchor === 'end' ? -0.3 : 0.3) * r0, y: top_ ? top + 1.2 * r0 : bottom - 0.5 * r0, 'text-anchor': anchor }, label));
      }
      marker(st.dMax, 'lb-max', t('plotMax') + ' ' + km(st.dMax), true);
      if (p.fade > 0) marker(st.dEdge, 'lb-edge', t('plotEdge') + ' ' + km(st.dEdge), false);
      svg.append(clip);
      {                                           // off the plot: the dot sits on its edge, at the right distance
        ty0 = Math.max(top, Math.min(bottom, ty0));
        svg.append(s('circle', { class: 'lb-dot', cx: tx0, cy: ty0, r: 0.4 * r0 }));
        var atLeft = tx0 - left < 4 * r0;        // no room to the left: above and to the right (the line falls to the right)
        svg.append(s('text', { class: 'lb-halo lb-title', x: tx0 + (atLeft ? 0.5 : -0.5) * r0, y: ty0 - 0.6 * r0, 'text-anchor': atLeft ? 'start' : 'end' }, t('plotNow')));
      }
    } else {
      svg.append(s('text', { class: 'lb-halo lb-title lb-bad', x: (left + right) / 2, y: (top + bottom) / 2, 'text-anchor': 'middle' }, t('ladNothing')));
    }
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'lb-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var dash = t('ladNone');
    return h('table', { class: 'lb-table' }, h('tbody', null,
      row(t('rowLam'), lamText(st.lam)),
      row(t('rowPath'), dbv(st.path)),
      row(t('rowArea'), areaText(st.aEff)),
      row(t('rowPrx'), st.prx === null ? t('ladNothing') : t('dbmW', { v: num(st.prx, 1), w: watts(st.prxW) }), true),
      row(t('rowUv'), st.prx === null ? dash : microvolts(st.uv)),
      row(t('rowMargin'), st.margin === null ? dash : dbv(st.margin), true),
      row(t('rowLeft'), st.left === null ? dash : dbv(st.left)),
      row(t('rowMax'), st.dMax === null ? dash : km(st.dMax), true),
      row(t('rowEdge'), st.dEdge === null ? dash : km(st.dEdge))));
  }

  var isDish = function (p) { return p.dish; };
  var isGain = function (p) { return !p.dish; };
  function mFmt(v) { return t('meter', { v: num(v, v % 1 ? 1 : 0) }); }
  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'f', type: 'choice', label: t('f'), options: L.FREQS.map(function (f) { return [f, num(f, 0)]; }) },
      { key: 'ptx', type: 'range', label: t('ptx'), min: 0, max: 50, step: 1, format: function (v) { return t('dbm', { v: num(v, 0) }); } },
      { key: 'dk', type: 'range', label: t('dk'), min: -10, max: 56, step: 1, format: function (v) { return km(L.distanceKm(v)); } },
      { key: 'psi', type: 'range', label: t('psi'), min: 0, max: 90, step: 5, format: function (v) { return t('deg', { v: num(v, 0) }); } },
      { key: 'dish', type: 'toggle', label: t('dish') },
      { key: 'gt', type: 'range', label: t('gt'), min: -10, max: 40, step: 0.5, visible: isGain, format: function (v) { return dbi(v); } },
      { key: 'gr', type: 'range', label: t('gr'), min: -10, max: 40, step: 0.5, visible: isGain, format: function (v) { return dbi(v); } },
      { key: 'dt', type: 'range', label: t('dt'), min: 0.3, max: 3, step: 0.1, visible: isDish, format: mFmt },
      { key: 'dr', type: 'range', label: t('dr'), min: 0.3, max: 3, step: 0.1, visible: isDish, format: mFmt },
      { key: 'lt', type: 'range', label: t('lt'), min: 0, max: 50, step: 1, format: mFmt },
      { key: 'lr', type: 'range', label: t('lr'), min: 0, max: 50, step: 1, format: mFmt },
      { key: 'sens', type: 'range', label: t('sens'), min: -150, max: -80, step: 1, format: function (v) { return t('dbm', { v: num(v, 0) }); } },
      { key: 'fade', type: 'range', label: t('fade'), min: 0, max: 30, step: 1, format: function (v) { return t('db', { v: num(v, 0) }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'lb-level', label: t('legendLevel') },
      { shape: 'lb-up', label: t('legendUp') },
      { shape: 'lb-down', label: t('legendDown') },
      { shape: 'lb-sens', label: t('legendSens') },
      { shape: 'lb-fade', label: t('legendFade') }
    ],

    render: function (c) {
      var lad = h('div', { class: 'lb-lad' }), pl = h('div', { class: 'lb-plot' });
      c.stage.replaceChildren(h('div', { class: 'lb' }, lad, pl,
        h('div', { class: 'lb-read' }, table(c.state), h('p', { class: 'lb-units' }, t('units')))));
      ladder(lad, c.state);
      plot(pl, c.state);
    },

    caption: function (c) {
      var st = c.state, p = st.p;
      var b = function (x) { return h('b', null, x); };
      function mk() { return {   // fresh nodes for each sentence: a node can sit in one place only
        prx: b(st.prx === null ? '' : dbm(st.prx)), margin: b(st.margin === null ? '' : dbv(st.margin)),
        fade: b(dbv(p.fade)), left: b(st.left === null ? '' : dbv(st.left)), sens: b(dbm(p.sens)),
        short: b(st.margin === null ? '' : dbv(-st.margin)),
        d: b(km(st.dKm)), path: b(dbv(st.path)), spread: b(dbv(st.spread)), area: b(dbv(-st.aIso)),
        lam: b(lamText(st.lam)), aiso: b(areaText(Math.pow(10, st.aIso / 10))),
        gr: b(dbi(st.gr)), gt: b(dbi(st.gt)), aeff: b(areaText(st.aEff)),
        far: b(st.farKm === null ? '' : km(st.farKm)),
        psi: b(t('deg', { v: num(p.psi, 0) })), pol: b(st.pol === null ? '' : dbv(st.pol)),
        dmax: b(st.dMax === null ? '' : km(st.dMax)), dedge: b(st.dEdge === null ? '' : km(st.dEdge))
      }; }
      var parts = [];
      function say(key) { if (parts.length) parts.push(' '); parts = parts.concat(t.parts(key, mk())); }
      say(st.status === 'works' && p.fade === 0 ? 'status_worksBare' : 'status_' + st.status);
      say('path');
      say(st.dish ? 'ant_dish' : 'ant_gain');
      if (st.small) say('dish_small');
      if (st.near) say('dish_near');
      if (st.status === 'crossed') return parts;
      if (p.psi > 0) say('pol');
      say(st.status === 'works' ? 'dist_works' : 'dist_short');
      if (st.status === 'works' && st.dMax > 100) say('free_note');
      return parts;
    }
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; window.simdeck.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { window.simdeck.render(); });
})();
</script>
</body>
</html>
