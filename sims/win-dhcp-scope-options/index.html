<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);

  var LEVEL_C = { server: '1', serverClass: '1', scope: '6', scopeClass: '6', reservation: '3' };
  var GLYPH = { server: '■', serverClass: '■', scope: '◆', scopeClass: '◆', reservation: '●' };
  var NAME_KEY = { laptop: 'nameLaptop', printer: 'namePrinter', phone: 'namePhone' };
  var PRESET_KEY = {
    'server-and-scope': 'presetServerScope', 'scope-overrides': 'presetScopeOverrides', reservation: 'presetReservation',
    'class-option': 'presetClassOption', 'change-needs-renew': 'presetChangeNeedsRenew'
  };

  /** Data (addresses, codes, MACs, class names) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  /** Parts of a string with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function list(items) {
    if (items.length === 1) return items[0];
    var head = items.slice(0, -1).reduce(function (acc, it) { return acc === null ? it : h('span', null, t.parts('listMore', { a: acc, b: it })); }, null);
    return h('span', null, t.parts('list2', { a: head, b: items[items.length - 1] }));
  }
  function clientName(s) { return t(NAME_KEY[s.client.name]); }
  function octet(addr) { return Number(String(addr).split('.')[3]); }

  /** A value as the client sees it: 051 in days, the rest as written. */
  function valueText(code, v) { return code === '051' ? t.n('days', v / L.DAY) : String(v); }
  function valueNode(code, v) { return v === null ? h('span', { class: 'wd-none' }, t('notSent')) : code === '051' ? h('span', null, valueText(code, v)) : data(v); }
  function optLabel(code) { return [data(code), ' ', h('span', null, t('opt' + code))]; }
  function chip(level) {
    return h('span', { class: 'wd-chip', dataset: { c: LEVEL_C[level] } }, h('span', { class: 'wd-glyph', 'aria-hidden': 'true' }, GLYPH[level]),
      h('span', null, rich('lvl_' + level)));
  }

  // ── left: the server as nested level boxes ──
  function optionRows(opts, classOpts) {
    var rows = [];
    L.CODES.forEach(function (code) {
      if (Object.prototype.hasOwnProperty.call(opts, code)) rows.push(h('dt', null, data(code)), h('dd', null, valueNode(code, opts[code])));
    });
    (classOpts || []).forEach(function (c) {
      rows.push(h('dt', null, data(c.code)), h('dd', null, valueNode(c.code, c.value), ' ',
        h('span', { class: 'wd-tag' }, t.parts('classTag', { cls: data(c.class) }))));
    });
    return rows.length ? h('dl', { class: 'wd-rows' }, rows) : h('div', { class: 'wd-off' }, t('noOptions'));
  }
  function serverBox(s) {
    var sc = s.scope, res = sc.reservations[0];
    var leased = s.leases.filter(function (l) { return l.ip; }).map(function (l) {
      return h('span', { style: { whiteSpace: 'nowrap' } }, t(NAME_KEY[l.name]), ' ', data(l.ip));
    });
    var leasedNodes = [];
    leased.forEach(function (n, i) { if (i) leasedNodes.push(', '); leasedNodes.push(n); });
    return h('section', { class: 'wd-lvl', dataset: { c: '1' } },
      h('h2', { class: 'wd-lvl-h' }, h('span', { class: 'wd-glyph', 'aria-hidden': 'true' }, '■'), data('DHCP1'), h('span', null, t('boxServer'))),
      optionRows(s.server.options, s.server.classOptions),
      h('section', { class: 'wd-lvl', dataset: { c: '6' } },
        h('h3', { class: 'wd-lvl-h' }, h('span', { class: 'wd-glyph', 'aria-hidden': 'true' }, '◆'), h('span', null, rich('boxScope', { subnet: data(sc.subnet) }))),
        h('dl', { class: 'wd-rows' },
          h('dt', null, t('range')), h('dd', null, data(sc.range[0] + '–' + sc.range[1])),
          h('dt', null, t('exclusionRow')), h('dd', null, sc.exclusions.length ? data(sc.exclusions.map(function (x) { return x[0] + '–' + x[1]; }).join(', ')) : h('span', { class: 'wd-off' }, t('noExclusion'))),
          h('dt', null, t('leasedRow')), h('dd', null, leasedNodes),
          h('dt', null, t('nextFree')), h('dd', null, s.nextFree ? data(s.nextFree) : h('span', { class: 'wd-off' }, t('poolEmpty')))),
        optionRows(sc.options, sc.classOptions),
        h('section', { class: 'wd-lvl', dataset: { c: '3' } },
          h('h3', { class: 'wd-lvl-h' }, h('span', { class: 'wd-glyph', 'aria-hidden': 'true' }, '●'), h('span', null, t('boxReservations'))),
          h('div', null, t.parts('boxReservation', { name: t('namePrinter'), mac: data(res.mac), ip: data(res.ip) })),
          optionRows(res.options))));
  }

  function clientCard(s) {
    var c = s.client;
    var stale = s.stale.indexOf('ip') >= 0;
    return h('section', { class: 'wd-box wd-client' },
      h('h2', null, t('clientTitle', { name: clientName(s) })),
      h('dl', { class: 'wd-rows' },
        h('dt', null, t('mac')), h('dd', null, data(c.mac)),
        h('dt', null, t('vendorClass')), h('dd', null, c.vendorClass ? data(c.vendorClass) : h('span', { class: 'wd-off' }, t('noClass'))),
        h('dt', null, t('address')), h('dd', null,
          stale ? h('span', { class: 'wd-stale' }, '⚠', data(s.has.ip), h('span', null, t('staleTag')), '→') : null, ' ',
          h('span', { class: 'wd-big' }, data(s.offer || '—')), ' ',
          h('span', { class: 'wd-tag', dataset: { c: c.reserved ? '3' : '6' } }, t(c.reserved ? 'reservedTag' : 'dynamicTag')))));
  }

  // ── right: what the client gets, and the rule table for one option ──
  function effTable(s, p, changed) {
    var name = clientName(s);
    return h('section', { class: 'wd-box wd-eff' },
      h('h2', null, t('effTitle', { name: name })),
      h('table', null,
        h('thead', null, h('tr', null, h('th', null, t('colOption')), h('th', null, t('colValue')), h('th', null, t('colHas')))),
        h('tbody', null, s.effective.map(function (e) {
          var focus = e.code === p.focus;
          var has = s.has.options[e.code];
          var isStale = s.stale.indexOf(e.code) >= 0;
          return h('tr', { class: focus ? 'wd-focus' : null },
            h('td', { class: 'wd-optcell' }, h('button', { type: 'button', class: 'wd-opt', 'aria-pressed': focus ? 'true' : 'false',
              'aria-label': t('showInTable', { opt: e.code }), onclick: function () { window.simdeck.set({ focus: e.code }); } },
              h('span', { class: 'wd-ptr', 'aria-hidden': 'true' }, focus ? '▶' : ''), optLabel(e.code))),
            h('td', { class: 'wd-val' + (changed.indexOf(e.code) >= 0 ? ' sd-changed' : '') }, valueNode(e.code, e.value), e.level ? ' ' : null, e.level ? chip(e.level) : null,
              e.overridden.map(function (o) { return h('span', { class: 'wd-struck' }, valueNode(e.code, o.value), ' ', chip(o.level)); })),
            h('td', null, isStale ? h('span', { class: 'wd-stale' }, '⚠', valueNode(e.code, has), h('span', null, t('staleTag'))) : valueNode(e.code, has)));
        }))));
  }

  function ruleTable(s, p) {
    var code = p.focus, rows = s.ladders[code], name = clientName(s);
    return RT({
      mode: 'specific',
      title: h('span', null, t.parts('rtTitle', { opt: h('span', null, optLabel(code)) })),
      columns: [{ key: 'level', label: t('colLevel') }, { key: 'cls', label: t('colClass') }],
      actionLabel: t('colVal'),
      markLabel: name,
      rows: rows.map(function (r, i) {
        var note = null;
        if (r.miss.indexOf('cls') >= 0) note = [{ k: 'dashed', text: t('noteClass', { cls: r.cls }) }];
        if (r.miss.indexOf('level') >= 0) note = [{ k: 'dashed', text: t('noteRes', { name: t('namePrinter') }) }];
        return {
          no: i + 1,
          cells: { level: chip(r.level), cls: r.cls === null ? '—' : r.cls },
          action: r.value === null ? '—' : (code === '051' ? h('span', null, valueText(code, r.value)) : r.value),
          rank: r.rank,
          hit: r.hit,
          miss: r.miss,
          note: note
        };
      }),
      implicit: { text: t('implicit'), action: '—' },
      at: 'all',
      done: true,
      outcome: function (i) { return i < rows.length ? RT.verdict(true, t('outSent')) : RT.verdict(false, t('outNotSent')); },
      words: { hit: t('wordHit'), win: t('wordWin'), beaten: t('wordBeaten') },
      stickyMark: true
    });
  }

  // "Changed" marks the options whose effective value or level changed with the last param change (not a focus change).
  // Renders while the page loads (preset, then the URL's params) mark nothing.
  var last = { key: null, state: null, changed: [] }, loaded = false;
  setTimeout(function () { loaded = true; }, 0);
  function changedFor(s, p) {
    var q = Object.assign({}, p); delete q.focus;
    var key = JSON.stringify(q);
    if (key !== last.key) {
      last.changed = loaded && last.state ? L.changedCodes(last.state, s) : [];
      last.key = key; last.state = s;
    }
    return last.changed;
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'client', type: 'choice', label: t('client'),
        options: [['laptop', t('nameLaptop')], ['printer', t('namePrinter')], ['phone', t('namePhone')]] },
      { key: 'scope006', type: 'toggle', label: t('scope006') },
      { key: 'resOption003', type: 'toggle', label: t('resOption003') },
      { key: 'exclusion', type: 'toggle', label: t('exclusion') },
      { key: 'classNtp', type: 'toggle', label: t('classNtp') },
      { key: 'focus', type: 'choice', label: t('focus'), options: L.CODES.map(function (c) { return [c, c]; }), visible: function () { return false; } },
      { key: 'held', type: 'range', label: t('held'), min: 0, max: 15, visible: function () { return false; } },
      { type: 'button', label: t('renew'), hint: t('renewHint'), key: 'o', run: function (sim) { sim.set({ held: L.renewMask(sim.params) }); } }
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(PRESET_KEY[x.id]), hint: t(PRESET_KEY[x.id] + 'Hint'), params: x.params };
    }),

    legend: [
      { shape: 'rt-win', label: t('legWin') },
      { shape: 'rt-beaten', label: t('legBeaten') },
      { shape: 'rt-no', label: t('legNo') },
      { shape: 'rt-warn', label: t('legStale') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state, p = c.params;
      var changed = changedFor(s, p);
      c.stage.replaceChildren(h('div', { class: 'wd' },
        h('div', { class: 'wd-col' }, serverBox(s), clientCard(s)),
        h('div', { class: 'wd-col' }, effTable(s, p, changed), ruleTable(s, p))));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      var code = p.focus, name = clientName(s);
      var e = s.effective.filter(function (x) { return x.code === code; })[0];
      var rows = s.ladders[code];
      var classRow = rows.filter(function (r) { return r.cls !== null && r.value !== null; })[0];
      var resRow = rows.filter(function (r) { return r.level === 'reservation'; })[0];
      var out = [];
      function add(parts) { if (out.length) out.push(' '); out = out.concat(parts); }
      if (s.client.reserved) add(rich('capResHas', { ip: data(s.offer) }));
      if (e.value === null) {
        if (classRow && !classRow.applies) add(rich('capClassNo', { opt: data(code), cls: data(classRow.cls), name: name }));
        else add(rich('capNone', { opt: data(code), name: name }));
      } else {
        var vars = { opt: data(code), at: h('span', null, rich('at_' + e.level)), name: name, v: h('b', null, valueNode(code, e.value)) };
        if (e.overridden.length) {
          vars.lo = list(e.overridden.slice().reverse().map(function (o) { return h('span', null, rich('at_' + o.level)); }));
          vars.win = h('span', null, rich('win_' + e.level));
          add(rich('capBeat', vars));
        } else add(rich('capOnly', vars));
        if (e.level === 'scopeClass' || e.level === 'serverClass') {
          var plain = e.level === 'scopeClass' ? 'scope' : 'server';
          add(rich('capClassYes', { name: name, cls: data(classRow.cls) }));
          if (e.overridden.some(function (o) { return o.level === plain; })) add(rich('capClassBeats'));
        }
      }
      if (resRow.value !== null && !resRow.applies) add(rich('capResOther', { opt: data(code) }));
      if (s.stale.length) {
        var now = {};
        s.effective.forEach(function (x) { now[x.code] = x.value; });
        var items = s.stale.map(function (k) {
          if (k === 'ip') return h('span', null, t.parts('staleItem', { what: t('staleAddr'), old: data(s.has.ip), now: data(s.offer) }));
          return h('span', null, t.parts('staleItem', { what: data(k), old: valueNode(k, s.has.options[k]), now: valueNode(k, now[k]) }));
        });
        add(rich(items.length === 1 ? 'capStale1' : 'capStale', { name: name, list: list(items), t1: t.n('days', s.t1 / L.DAY), lease: t.n('days', s.scope.lease / L.DAY) }));
      }
      if (!s.client.reserved && s.stale.indexOf('ip') < 0 && s.nextFree && octet(s.nextFree) < octet(s.offer)) {
        add(rich('capKeep', { name: name, ip: data(s.offer), free: data(s.nextFree) }));
      }
      return out;
    }
  });
})();
