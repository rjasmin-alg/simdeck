<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var RANGE = 1.5;                 // the constellation plot shows −1.5 … 1.5 on I and Q for every M (same energy)
  var LOBES = 4;                   // each subcarrier's sinc is drawn over ± 4 Δf
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian; at most d decimals, trailing zeros dropped.
  function num(x, d) {
    var s = String(Number(x.toFixed(d == null ? 2 : d)));
    if (s.indexOf('-') === 0) s = '−' + s.slice(1);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function fixed(x, d) {
    var s = x.toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function sup(n) { return String(n).replace('-', '⁻').replace(/\d/g, function (d) { return '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]; }); }
  /** A rate as a percentage when ≥ 0.1 %, else as m·10⁻ᵏ; 0 as 0. */
  function rate(x) {
    if (x === 0) return '0';
    if (x < 1e-12) return '< 10' + sup(-12);
    if (x >= 0.001) return t('pct', { v: num(x * 100, x >= 0.1 ? 0 : x >= 0.01 ? 1 : 2) });
    var k = Math.floor(Math.log10(x)), m = x / Math.pow(10, k);
    if (m >= 9.95) { m = 1; k += 1; }
    return fixed(m, 1) + '·10' + sup(k);
  }
  function dB(v) { return t('dB', { v: num(v, 0) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  /** A tick step of 1, 2 or 5 × 10^k giving about n ticks over span. */
  function niceStep(span, n) {
    var raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function hatch() {
    return s('defs', {}, s('pattern', { id: 'qo-hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
      s('line', { class: 'qo-hatch-line', x1: 0, y1: 0, x2: 0, y2: 8 })));
  }

  // ── QAM: the constellation diagram ──
  function drawQam(box, st, noteEl) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), pad = 1.6 * r, side = Math.min(W, H) - 2 * pad;
    var x0 = (W - side) / 2, y0 = (H - side) / 2, k = side / (2 * RANGE), M = st.M, g = L.grid(M);
    var X = function (v) { return x0 + (Math.max(-RANGE, Math.min(RANGE, v)) + RANGE) * k; };
    var Y = function (v) { return y0 + (RANGE - Math.max(-RANGE, Math.min(RANGE, v))) * k; };
    var svg = s('svg', { width: W, height: H, role: 'img', 'aria-label': t('stage') });
    svg.append(s('rect', { class: 'qo-box', x: x0, y: y0, width: side, height: side }));
    g.thresholds.forEach(function (th) {
      if (Math.abs(th) < 1e-12) return;   // the axes are the middle boundary
      svg.append(s('line', { class: 'qo-bound', x1: X(th), x2: X(th), y1: y0, y2: y0 + side }));
      svg.append(s('line', { class: 'qo-bound', x1: x0, x2: x0 + side, y1: Y(th), y2: Y(th) }));
    });
    svg.append(s('line', { class: 'qo-axis', x1: X(0), x2: X(0), y1: y0, y2: y0 + side }));
    svg.append(s('line', { class: 'qo-axis', x1: x0, x2: x0 + side, y1: Y(0), y2: Y(0) }));
    svg.append(s('text', { class: 'qo-ax', x: x0 + side + 0.3 * r, y: Y(0) + 0.35 * r }, t('axisI')));
    svg.append(s('text', { class: 'qo-ax', x: X(0), y: y0 - 0.4 * r, 'text-anchor': 'middle' }, t('axisQ')));
    [-1, 1].forEach(function (v) {
      svg.append(s('text', { x: X(v), y: y0 + side + 1.2 * r, 'text-anchor': 'middle' }, num(v, 0)));
      svg.append(s('text', { x: x0 - 0.3 * r, y: Y(v) + 0.35 * r, 'text-anchor': 'end' }, num(v, 0)));
    });
    // received points: correct dots first, wrong rings with × on top
    var dot = Math.max(2, Math.min(4, k * L.dmin(M) * 0.07)), ring = Math.max(5, dot + 2.5);
    var good = s('g', {}), bad = s('g', {});
    st.points.forEach(function (p) {
      var cx = X(p.i), cy = Y(p.q);
      if (p.ok) good.append(s('circle', { class: 'qo-ok', cx: cx, cy: cy, r: dot }));
      else {
        var a = ring * 0.55;
        bad.append(s('circle', { class: 'qo-bad', cx: cx, cy: cy, r: ring }),
          s('path', { class: 'qo-badx', d: 'M' + (cx - a) + ' ' + (cy - a) + 'L' + (cx + a) + ' ' + (cy + a) + 'M' + (cx + a) + ' ' + (cy - a) + 'L' + (cx - a) + ' ' + (cy + a) }));
      }
    });
    svg.append(good, bad);
    // ideal points (crosses) with their bits: all for M ≤ 16, the upper-right quadrant for 64, on hover for 256,
    // and only when a decision cell is wide enough for the label (a monospace digit is about 0.62 em)
    var fsPx = Math.max(16, 0.8 * r);                       // --fs-sm
    var fits = k * L.dmin(M) >= L.bitsPerSymbol(M) * 0.62 * fsPx + 0.5 * r;
    var mode = !fits || M > 64 ? 'hover' : M === 64 ? 'quad' : 'all';
    noteEl.textContent = t(mode === 'all' ? 'noteLabelsAll' : mode === 'quad' ? 'noteLabelsQuad' : 'noteLabelsHover');
    var arm = Math.max(4, Math.min(0.45 * r, k * L.dmin(M) * 0.18)), crosses = s('g', {});
    for (var idx = 0; idx < M; idx++) {
      var p = L.pointOf(idx, M), cx = X(p.i), cy = Y(p.q), bits = L.bitsOf(idx, M);
      var one = s('g', {}, s('title', {}, bits),
        s('circle', { class: 'qo-hit-area', cx: cx, cy: cy, r: Math.max(arm, k * L.dmin(M) * 0.45) }),
        s('path', { class: 'qo-cross', d: 'M' + (cx - arm) + ' ' + (cy - arm) + 'L' + (cx + arm) + ' ' + (cy + arm) + 'M' + (cx + arm) + ' ' + (cy - arm) + 'L' + (cx - arm) + ' ' + (cy + arm) }));
      var label = mode === 'all' || (mode === 'quad' && p.i > 0 && p.q > 0);
      // in the top-left corner of the point's decision cell, clear of the cloud around the cross
      var half = k * L.dmin(M) / 2;
      if (label) one.append(s('text', { class: 'qo-bits', x: cx - half + 0.2 * r, y: cy - half + 0.95 * r }, bits));
      crosses.append(one);
    }
    svg.append(crosses);
    box.replaceChildren(svg);
  }

  // ── OFDM: the subcarrier comb and the wrong symbols per carrier ──
  function drawOfdm(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var o = st.ofdm, n = o.n, r = rem();
    var left = 5.2 * r, right = 0.8 * r, top = 2.2 * r, specH = (H - top) * 0.55, gap = 3.6 * r, barH = H - top - specH - gap - 2.8 * r;
    var u0 = -n / 2 - 1.5, u1 = n / 2 + 1.5, pw = W - left - right;
    var X = function (u) { return left + (u - u0) / (u1 - u0) * pw; };   // u: frequency in units of Δf
    var Ys = function (a) { return top + (1.15 - a) / 1.45 * specH; };    // sinc −0.3 … 1.15
    var svg = s('svg', { width: W, height: H, role: 'img', 'aria-label': t('stage') }, hatch());
    svg.append(s('rect', { class: 'qo-box', x: left, y: top, width: pw, height: specH }));
    svg.append(s('line', { class: 'qo-zero', x1: left, x2: left + pw, y1: Ys(0), y2: Ys(0) }));
    var uOf = function (c) { return c - (n + 1) / 2; };
    // the hit carrier's main lobe, hatched, under the curves
    if (o.interfererAt) {
      var uc = uOf(o.interfererAt), d = 'M' + X(uc - 1) + ' ' + Ys(0);
      for (var a = -1; a <= 1.0001; a += 0.05) d += 'L' + X(uc + a) + ' ' + Ys(L.sinc(a));
      svg.append(s('path', { class: 'qo-hitfill', d: d + 'Z' }));
    }
    // centres: every other carrier passes through zero here
    o.carriers.forEach(function (cr) {
      svg.append(s('line', { class: 'qo-centre', x1: X(uOf(cr.c)), x2: X(uOf(cr.c)), y1: Ys(1), y2: Ys(-0.25) }));
    });
    o.carriers.forEach(function (cr) {
      var uc = uOf(cr.c), pts = [], alt = cr.c % 2 === 0;
      for (var a = -LOBES; a <= LOBES + 1e-9; a += 0.05) {
        var u = uc + a;
        if (u < u0 || u > u1) continue;
        pts.push(X(u).toFixed(1) + ',' + Ys(L.sinc(a)).toFixed(1));
      }
      var grp = s('g', { 'data-c': alt ? '3' : '1' });
      grp.append(s('polyline', { class: 'qo-sub' + (alt ? ' qo-alt' : ''), points: pts.join(' ') }));
      grp.append(s('circle', { class: 'qo-peak', cx: X(uc), cy: Ys(1), r: Math.max(3, 0.18 * r) }));
      svg.append(grp);
    });
    // frequency ticks (kHz) at round values
    var f0 = u0 * o.spacingKHz, f1 = u1 * o.spacingKHz, fs = niceStep(f1 - f0, Math.max(3, Math.min(8, Math.floor(pw / (3.5 * r)))));
    for (var f = Math.ceil(f0 / fs) * fs; f <= f1 + 1e-9; f += fs) {
      var xf = X(f / o.spacingKHz);
      svg.append(s('line', { class: 'qo-zero', x1: xf, x2: xf, y1: top + specH, y2: top + specH + 0.35 * r }));
      svg.append(s('text', { x: xf, y: top + specH + 1.3 * r, 'text-anchor': 'middle' }, num(Math.abs(f) < 1e-9 ? 0 : f, 2)));
    }
    svg.append(s('text', { x: W - 2, y: top + specH + 2.4 * r, 'text-anchor': 'end' }, t('axisF')));
    // the interferer: a narrow spike above the hit carrier
    if (o.interfererAt) {
      var xj = X(uOf(o.interfererAt)), yTop = top - 0.2 * r;
      svg.append(s('line', { class: 'qo-jamline', x1: xj, x2: xj, y1: Ys(0), y2: yTop + 0.6 * r }));
      svg.append(s('path', { class: 'qo-jamhead', d: 'M' + (xj - 0.4 * r) + ' ' + (yTop + 0.7 * r) + 'L' + xj + ' ' + yTop + 'L' + (xj + 0.4 * r) + ' ' + (yTop + 0.7 * r) + 'Z' }));
      var right1 = xj + 6 * r < left + pw;
      svg.append(s('text', { class: 'qo-jam', x: right1 ? xj + 0.6 * r : xj - 0.6 * r, y: yTop + 0.8 * r, 'text-anchor': right1 ? 'start' : 'end' }, t('interfererMark')));
    }
    // the wrong symbols per carrier
    var by = top + specH + gap, slot = pw / (u1 - u0), bw = Math.max(4, slot * 0.6);
    svg.append(s('text', { x: 0, y: by - 0.5 * r }, t('axisErr', { k: o.perCarrier[0] })));
    // narrow slots: carrier numbers only for 1, every 4th and the hit one; counts only for the hit carrier
    var compact = slot < 1.5 * r;
    svg.append(s('text', { x: left - 0.5 * r, y: by + barH + 1.15 * r, 'text-anchor': 'end' }, t('rowWrong')));
    svg.append(s('text', { x: left - 0.5 * r, y: by + barH + 2.35 * r, 'text-anchor': 'end' }, t('carrierNo')));
    o.carriers.forEach(function (cr) {
      var i = cr.c - 1, e = o.errorsPerCarrier[i], k = o.perCarrier[i], xc = X(uOf(cr.c)), hit = cr.c === o.interfererAt;
      var hh = barH * e / k;
      svg.append(s('rect', { class: 'qo-track', x: xc - bw / 2, y: by, width: bw, height: barH }));
      if (e > 0) svg.append(s('rect', { class: 'qo-bar' + (hit ? ' qo-barhit' : ''), x: xc - bw / 2, y: by + barH - hh, width: bw, height: hh }));
      if (!compact || hit) svg.append(s('text', { class: 'qo-num', x: xc, y: by + barH + 1.15 * r, 'text-anchor': 'middle' }, String(e)));
      if (!compact || hit || cr.c === 1 || cr.c % 4 === 0) {
        var near = compact && !hit && o.interfererAt && Math.abs(cr.c - o.interfererAt) < 3;
        if (!near) svg.append(s('text', { class: hit ? 'qo-jam' : 'qo-cno', x: xc, y: by + barH + 2.35 * r, 'text-anchor': 'middle' }, String(cr.c)));
      }
    });
    box.replaceChildren(svg);
  }

  // ── "changed": the error count when its class (0, < 1 %, ≥ 1 %) changes with the params, in the same mode ──
  var lastKey = null, lastState = null, mark = false;
  function cls(st) { return st.mode === 'ofdm' ? st.ofdm.errorClass : st.errorClass; }
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key === lastKey) return;
    mark = !!lastState && lastState.mode === c.state.mode && cls(lastState) !== cls(c.state);
    lastKey = key;
    lastState = c.state;
  }

  function kv(k, v, extra) {
    return h('div', { class: extra || null }, h('span', { class: 'qo-k' }, k), h('span', { class: 'qo-v' }, v));
  }
  function count(text) { return h('span', { class: 'qo-v qo-count' + (mark ? ' sd-changed' : '') }, text); }

  function sideQam(st) {
    var card = h('div', { class: 'qo-card' },
      kv('', t('cardHead', { m: st.M === 4 ? 'QPSK (4-QAM)' : st.M + '-QAM', snr: dB(st.snrDb) }), 'qo-head'),
      kv(t('cardBits'), String(st.bitsPerSymbol)),
      kv(t('cardLevels'), t.n('cardLevelsVal', st.M, { l: st.levels })),
      kv(t('cardDmin'), fixed(st.dmin, 3)),
      kv(t('cardSigma'), fixed(st.sigma, 3)),
      h('div', null, h('span', { class: 'qo-k' }, t('cardErrors')), count(t('of', { a: st.errors, b: st.sent }))),
      kv(t('cardBitErrors'), t('of', { a: st.bitErrors, b: st.sent * st.bitsPerSymbol })),
      kv(t('cardSer'), rate(st.ser)),
      kv(t('cardTheory'), h('span', null, rate(st.serTheory), ' ', h('small', null, t('cardExpect', { v: num(st.serTheory * st.sent, 1), n: st.sent })))));
    var head = h('tr', null, h('th', { scope: 'col' }, t('thM')), h('th', { scope: 'col' }, t('thBits')), h('th', { scope: 'col' }, t('thDmin')),
      h('th', { scope: 'col' }, t('thSer', { snr: dB(st.snrDb) })));
    var rows = st.table.map(function (rw) {
      var now = rw.M === st.M;
      return h('tr', { class: now ? 'qo-now' : null, 'aria-current': now ? 'true' : null },
        h('td', null, h('button', { type: 'button', onclick: function () { sim.set({ M: rw.M }); } }, rw.M === 4 ? 'QPSK' : rw.M + '-QAM')),
        h('td', null, String(rw.bits)), h('td', null, fixed(rw.dmin, 3)), h('td', null, rate(rw.ser)));
    });
    return h('div', { class: 'qo-right' }, card, h('table', { class: 'qo-table' }, h('thead', null, head), h('tbody', null, rows)));
  }

  function sideOfdm(st) {
    var o = st.ofdm, at = o.interfererAt, hitE = at ? o.errorsPerCarrier[at - 1] : 0;
    var card = h('div', { class: 'qo-card' },
      kv('', t('ofdmHead', { n: o.n, m: st.M, snr: dB(st.snrDb) }), 'qo-head'),
      kv(t('cardT'), t('ms', { v: num(o.symbolMs, 2) })),
      kv(t('cardSpacing'), t('kHz', { v: num(o.spacingKHz, 2) })),
      kv(t('cardRate'), t('kBd', { v: num(o.rateKBd, 2) })),
      kv(t('cardTotal', { n: o.n, r: t('kBd', { v: num(o.rateKBd, 2) }) }), t('kBd', { v: num(o.totalKBd, 2) })),
      kv(t('cardEcho'), h('span', null, t('cardEchoVal', { v: t('pct', { v: num(o.echoShare * 100, 0) }) }), ' ', h('small', null, t('cardEchoOne'))), 'qo-wide'),
      h('div', null, h('span', { class: 'qo-k' }, t('cardErrors')), count(t('of', { a: o.errors, b: o.sent }))),
      kv(t('cardSer'), rate(o.errors / o.sent)),
      kv(t('cardHit'), at ? t('cardHitVal', { e: hitE, k: o.perCarrier[at - 1], th: rate(o.serTheoryHit) }) : t('cardHitNone')),
      kv(t('cardOthers'), t('of', { a: o.errors - hitE, b: o.sent - (at ? o.perCarrier[at - 1] : 0) })));
    return h('div', { class: 'qo-right' }, card);
  }

  // Legend items per mode: 0–3 QAM, 4–5 OFDM, 6 both.
  var LEGEND_MODE = ['qam', 'qam', 'qam', 'qam', 'ofdm', 'ofdm', null];
  function legendFor(mode) {
    var items = document.querySelectorAll('[data-sd-legend] > li');
    for (var i = 0; i < items.length; i++) items[i].hidden = LEGEND_MODE[i] != null && LEGEND_MODE[i] !== mode;
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      // the mode stays a param (URL, presets); its switch is above the plot, to keep the panel on one screen
      { key: 'mode', type: 'choice', label: t('mode'), options: L.MODES.map(function (m) { return [m, t('mode_' + m)]; }), visible: function () { return false; } },
      { key: 'M', type: 'choice', label: t('M'), options: L.ORDERS.map(function (m) { return [m, String(m)]; }) },
      { key: 'snr', type: 'range', label: t('snr'), min: L.SNR_MIN, max: L.SNR_MAX, step: 1, format: function (v) { return dB(v); } },
      { key: 'seed', type: 'range', label: t('seed'), min: L.SEED_MIN, max: L.SEED_MAX, step: 1 },
      { key: 'n', type: 'choice', label: t('n'), options: L.NS.map(function (n) { return [n, String(n)]; }), visible: function (p) { return p.mode === 'ofdm'; } },
      { key: 'interferer', type: 'range', label: t('interferer'), min: 0, max: function (p) { return p.n; }, step: 1,
        format: function (v) { return v === 0 ? t('off') : String(v); }, visible: function (p) { return p.mode === 'ofdm'; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'qo-cross', label: t('legendIdeal') },
      { shape: 'qo-ok', label: t('legendOk') },
      { shape: 'qo-bad', label: t('legendWrong') },
      { shape: 'qo-bound', label: t('legendBound') },
      { shape: 'qo-sub', label: t('legendSub') },
      { shape: 'qo-hit', label: t('legendHit') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var st = c.state;
      track(c);
      legendFor(st.mode);
      var plot = h('div', { class: 'qo-plot' + (st.mode === 'ofdm' ? ' qo-wide-plot' : '') }), left, root;
      var modes = h('span', { class: 'qo-modes', role: 'group', 'aria-label': t('mode') }, L.MODES.map(function (m) {
        return h('button', { type: 'button', class: 'qo-mode', 'aria-pressed': String(st.mode === m), onclick: function () { sim.set({ mode: m }); } }, t('mode_' + m));
      }));
      if (st.mode === 'qam') {
        var noteEl = h('p', { class: 'qo-note' });
        left = h('div', { class: 'qo-left' }, h('div', { class: 'qo-top' }, modes, noteEl), plot);
        root = h('div', { class: 'qo' }, left, sideQam(st));
        c.stage.replaceChildren(root);
        drawQam(plot, st, noteEl);
      } else {
        left = h('div', { class: 'qo-left' }, h('div', { class: 'qo-top' }, modes, h('p', { class: 'qo-note' }, t('noteOfdm'))), plot);
        root = h('div', { class: 'qo qo-ofdm' }, left, sideOfdm(st));
        c.stage.replaceChildren(root);
        drawOfdm(plot, st);
      }
    },

    caption: function (c) {
      var st = c.state;
      if (st.mode === 'ofdm') {
        var o = st.ofdm, at = o.interfererAt;
        var out = t.n('capOfdm', o.n, { r: t('kBd', { v: num(o.rateKBd, 2) }), T: t('ms', { v: num(o.symbolMs, 2) }),
          df: t('kHz', { v: num(o.spacingKHz, 2) }), echo: t('pct', { v: num(o.echoShare * 100, 0) }) });
        if (!at) return out + t('capOfdmClean', { e: o.errors, of: o.sent });
        var hitE = o.errorsPerCarrier[at - 1], rest = o.errors - hitE, restN = o.sent - o.perCarrier[at - 1];
        var few = rest / restN < 0.01;
        out += t(hitE ? 'capHit' : 'capHitZero', { c: at, e: hitE, k: o.perCarrier[at - 1], th: rate(o.serTheoryHit) });
        out += rest === 0 ? t('capRestNone') : t.n(few ? 'capRestFew' : 'capRestNoise', rest);
        return out + (hitE && few ? t('capFec') : '');
      }
      var head = st.M === 4 ? t('capHeadQpsk', { d: fixed(st.dmin, 3) })
        : t('capHead', { m: st.M, b: t.n('bitsN', st.bitsPerSymbol), x: num(L.dmin(4) / st.dmin, 1), d: fixed(st.dmin, 3) });
      var vars = { snr: dB(st.snrDb), of: st.sent, ser: rate(st.ser), th: rate(st.serTheory) };
      var tail = st.errors === 0 ? t('capNone', vars) : t.n('capSome', st.errors, vars);
      return head + tail + (st.errors >= 3 && st.bitErrors < 1.5 * st.errors ? t('capGray') : '');
    }
  });

  // The plots are in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var lastSize = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== lastSize) { lastSize = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
