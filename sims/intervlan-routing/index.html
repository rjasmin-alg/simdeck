<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var VLAN_C = { 10: '1', 20: '2' };
  var NODE_C = { P1: '1', P2: '1', Q1: '2', R1: '4', SW1: '8' };
  var OWNER = {};
  Object.keys(L.MAC).forEach(function (k) { OWNER[L.MAC[k]] = k; });

  /** Data (addresses, MACs, port names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'sd-mono' : cls || null }, String(text)); }
  function b(text) { return h('b', null, data(text)); }
  /** A MAC as the page shows it: the last octet. */
  function short(mac) { return '…:' + mac.slice(-2); }
  function vlanC(v) { return VLAN_C[v] || '8'; }
  /** t.parts, but a placeholder used twice is cloned (the same node appended twice would move). */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (p) {
      if (typeof p === 'string' || !p.nodeType || p.nodeType === 3) return p;
      var out = seen.indexOf(p) >= 0 ? p.cloneNode(true) : p;
      seen.push(p);
      return out;
    });
  }
  function hostOf(scene, id) { return scene.hosts.filter(function (x) { return x.id === id; })[0]; }
  /** The two ends of a link as the page names them: "P1", "SW1 Fa0/1". */
  function endsOf(scene, id) {
    var l = scene.links[id];
    return { a: l.a + (l.aPort ? ' ' + l.aPort : ''), b: l.b + (l.bPort ? ' ' + l.bPort : '') };
  }
  /** The VLAN a frame on a link belongs to (for its colour): the tag's, else the access port's. */
  function vlanOnLink(scene, link, frame) {
    if (frame.vid !== null) return frame.vid;
    if (link === 'trunk') return 10;
    return scene.hosts.filter(function (x) { return x.link === link; })[0].vlan;
  }

  // ── field strip ──

  function field(label, value, o) {
    o = o || {};
    var mark = o.old != null ? h('s', { class: 'ir-old', translate: 'no' }, o.old) : null;
    return h('div', { class: 'ir-f' + (o.changed ? ' sd-changed' : '') },
      h('span', { class: 'ir-fl' }, h('span', null, label), mark),
      h('span', { class: 'ir-fv' }, value, o.sub ? h('small', null, o.sub) : null));
  }
  function tagEl(vid) {
    if (vid === null) return h('span', { class: 'ir-tag', dataset: { none: '1' } }, t('tagNone'));
    return h('span', { class: 'ir-tag sd-fill', dataset: { c: vlanC(vid) } }, t('tagVid', { v: vid }));
  }

  function renderStrip(c, scene) {
    var s = c.state, f = s.frame;
    var box = h('section', { class: 'ir-box ir-strip' });
    var title;
    if (!f) title = t.parts('stripNone', { dst: data(hostOf(scene, scene.target).ip) });
    else if (s.outcome === 'dropped') title = t.parts('stripDropped', { d: data(s.at, '') });
    else if (s.phase === 'wire') { var e = endsOf(scene, s.at); title = t.parts('stripOnLink', { a: data(e.a, ''), b: data(e.b, '') }); }
    else if (s.vlan) title = t.parts('stripInVlan', { d: data(s.at, ''), v: data(s.vlan, '') });
    else title = t.parts('stripInDev', { d: data(s.at, '') });
    box.append(h('h2', { dataset: s.outcome === 'dropped' ? { dead: '1' } : {} }, title));
    if (!f) { box.append(h('p', { class: 'ir-none' }, t('hostIdle'))); return box; }
    var old = c.prev && c.prev.frame;
    var ch = s.changed;
    var cmp = function (k, fmt) {
      if (ch.indexOf(k) < 0 || !old) return {};
      return { changed: true, old: fmt ? fmt(old[k]) : String(old[k]) };
    };
    var tagOld = ch.indexOf('vid') >= 0 && old ? { changed: true } : {};
    box.append(h('div', { class: 'ir-frame', dataset: s.outcome === 'dropped' ? { dead: '1' } : {} },
      field(t('fDstMac'), data(short(f.dstMac), ''), Object.assign({ sub: data(OWNER[f.dstMac], '') }, cmp('dstMac', short))),
      field(t('fSrcMac'), data(short(f.srcMac), ''), Object.assign({ sub: data(OWNER[f.srcMac], '') }, cmp('srcMac', short))),
      field(t('fTag'), tagEl(f.vid), tagOld),
      field(t('fSrcIp'), data(f.srcIp, ''), cmp('srcIp')),
      field(t('fDstIp'), data(f.dstIp, ''), cmp('dstIp')),
      field(t('fTtl'), data(f.ttl, ''), cmp('ttl')),
      field(t('fSize'), t('bytes', { n: f.size }), cmp('size'))));
    return box;
  }

  // ── the column beside the drawing ──

  function renderHost(c) {
    var s = c.state, d = s.decision;
    var box = h('section', { class: 'ir-box ir-host', dataset: d && c.n > 1 ? { past: '1' } : {} }, h('h2', null, t('hostTitle')));
    if (!d) { box.append(h('p', null, t('hostIdle'))); return box; }
    var gw = '192.168.1.1';
    box.append(
      h('p', null, t.parts('hostAnd', { dst: b(s.frame ? s.frame.dstIp : ''), mask: data(d.mask), theirs: b(d.theirs) })),
      h('p', null, d.local ? t.parts('hostLocal', { own: b(d.own) }) : t.parts('hostRemote', { own: b(d.own), gw: b(gw) })));
    return box;
  }

  function row(cells, o) {
    var ds = {};
    if (o.c) ds.c = o.c;
    if (o.hit) ds.hit = '1';
    if (o.other) ds.other = '1';
    return h('tr', { class: 'ir-row', dataset: ds }, cells.map(function (x) { return h('td', x && x.bad ? { dataset: { bad: '1' } } : null, x && x.node ? x.node : x); }));
  }

  function renderMac(c, scene) {
    var s = c.state, lk = s.lookup;
    var vlanNow = lk && lk.table === 'mac' ? lk.vlan : s.macHit ? s.macHit.vlan : null;
    var hitRow = lk && lk.table === 'mac' ? lk.row : s.macHit ? s.macHit.row : null;
    var rows = scene.sw.macTable.map(function (r, i) {
      return row([data(r.vlan, ''), [data(short(r.mac), ''), h('small', null, data(OWNER[r.mac], ''))],
        r.self ? t.parts('selfPort', { p: data(r.port, '') }) : data(r.port, '')],
        { c: vlanC(r.vlan), hit: i === hitRow, other: vlanNow !== null && r.vlan !== vlanNow });
    });
    var box = h('section', { class: 'ir-box ir-mac' }, h('h2', null, t('macTitle')),
      h('div', { class: 'ir-tab-wrap' }, h('table', { class: 'ir-tab' },
        h('thead', null, h('tr', null, h('th', null, t('colVlan')), h('th', null, t('colMac')), h('th', null, t('colPort')))),
        h('tbody', null, rows))));
    if (s.dropReason === 'unknown-vlan') box.append(h('p', { class: 'ir-note', dataset: { dead: '1' } }, parts('noVlan', { v: data(s.frame.vid, '') })));
    return box;
  }

  function renderRouter(c, scene) {
    var s = c.state, lk = s.lookup;
    var roas = scene.mode === 'roas';
    var ifs = roas ? scene.router.subifs : scene.sw.svis;
    var rows = ifs.map(function (f, i) {
      var name = roas ? f.name : 'vlan ' + f.vlan;
      var vid = roas ? f.vid : f.vlan;
      var hit = lk && ((lk.table === 'subif' && lk.row === i) || (lk.table === 'route' && lk.iface === i));
      var cells = [data(name, ''), { node: data(vid, ''), bad: roas && f.vid !== Number(f.name.split('.')[1]) }, data(f.ip + '/' + f.prefix, '')];
      return row(roas ? cells : [cells[0], cells[2]], { c: vlanC(roas ? Number(f.name.split('.')[1]) : f.vlan), hit: !!hit });
    });
    var head = roas ? [t('colSubif'), t('colVid'), t('colAddr')] : [t('colSvi'), t('colAddr')];
    var box = h('section', { class: 'ir-box ir-router' }, h('h2', null, t(roas ? 'subifTitle' : 'sviTitle')),
      h('div', { class: 'ir-tab-wrap' }, h('table', { class: 'ir-tab' },
        h('thead', null, h('tr', null, head.map(function (x) { return h('th', null, x); }))),
        h('tbody', null, rows))));
    if (lk && lk.table === 'route') box.append(h('p', { class: 'ir-note' }, t.parts('routeHit', { dst: data(s.frame.dstIp, ''), net: data(lk.net, '') })));
    if (s.dropReason === 'untagged') box.append(h('p', { class: 'ir-note', dataset: { dead: '1' } }, t('noMatch')));
    return box;
  }

  function renderCount(c, scene) {
    var s = c.state;
    var order = ['p1', 'trunk', 'q1', 'p2'].filter(function (k) { return k in s.linkUses; });
    return h('section', { class: 'ir-box ir-count' }, h('h2', null, t('countTitle')),
      h('ul', null, order.map(function (k) {
        var e = endsOf(scene, k), n = s.linkUses[k];
        var ds = n ? {} : { zero: '1' };
        return h('li', { class: s.linkChanged === k ? 'sd-changed' : null, dataset: ds },
          data(e.a + ' – ' + e.b, ''), h('b', { translate: 'no' }, '×' + n));
      })));
  }

  // ── topology (kit view K2) ──

  var BADGE = { bSends: 'fill', bTakes: 'solid', bVlan: 'solid', bRoutes: 'fill', bDrops: 'solid', bGot: 'solid' };
  function badgesFor(id, s, scene) {
    var out = [];
    if (s.phase === 'wire' && s.hops.length === 1 && id === 'P1') out.push(['bSends']);
    if (s.at === id && s.outcome === 'dropped') out.push(['bDrops']);
    else if (s.at === id && s.outcome === 'delivered') out.push(['bGot']);
    else if (s.at === id && s.phase === 'switched' && s.lookup.table === 'mac') out.push(['bVlan', { v: s.vlan }]);
    else if (s.at === id && s.phase === 'to-svi') out.push(['bVlan', { v: s.vlan }]);
    else if (s.at === id && s.phase === 'switched') out.push(['bRoutes']);
    else if (s.at === id && s.phase === 'received') out.push(['bTakes']);
    if (s.phase === 'wire' && s.at === 'trunk' && id === 'R1' && s.toward.node === 'SW1') out.push(['bRoutes']);
    return out;
  }

  function renderTopo(c, scene) {
    var s = c.state, roas = scene.mode === 'roas';
    var off = roas ? 2 : 0;
    var nodes = [];
    if (roas) nodes.push({ id: 'R1', kind: 'router', col: 1, row: 0, c: NODE_C.R1,
      lines: [{ text: t('roleRouter'), kind: 'role' }, { text: 'Gi0/0 · MAC ' + short(L.MAC.R1), kind: 'sub' }] });
    var gi = roas ? L.parseLink(scene.sw.ports['Gi0/1']) : null;
    nodes.push({ id: 'SW1', kind: 'switch', col: 1, row: off, c: NODE_C.SW1,
      lines: [{ text: t(roas ? 'roleSwitch' : 'roleL3'), kind: 'role' },
        roas ? { text: t.parts(gi.mode === 'trunk' ? 'portToR1Trunk' : 'portToR1Access', { p: data('Gi0/1', ''), v: data(gi.vlan, '') }), kind: 'role' }
          : { text: 'MAC ' + short(L.MAC.SW1), kind: 'sub' }] });
    ['P1', 'P2', 'Q1'].forEach(function (id, i) {
      var x = hostOf(scene, id);
      nodes.push({ id: id, kind: 'host', col: i === 2 ? 2 : i, row: off + 2, c: NODE_C[id], name: t(x.vlan === 10 ? 'nameP' : 'nameQ'),
        lines: [{ text: x.ip + '/' + x.prefix, kind: 'addr' }, { text: 'VLAN ' + x.vlan + ' · MAC ' + short(x.mac), kind: 'sub' }] });
    });
    nodes.forEach(function (n) {
      var bs = badgesFor(n.id, s, scene);
      n.badges = bs.map(function (x) { return { text: t(x[0], x[1]), k: BADGE[x[0]] }; });
      n.state = bs.length ? 'active' : null;
    });
    var links = scene.hosts.map(function (x) {
      return { id: x.link, a: x.id, b: 'SW1', active: s.phase === 'wire' && s.at === x.link, ends: { b: data(x.port, '') } };
    });
    if (roas) links.push({ id: 'trunk', a: 'SW1', b: 'R1', active: s.phase === 'wire' && s.at === 'trunk' });
    var packets = [];
    if (s.phase === 'wire') {
      var l = scene.links[s.at], from = l.a === s.toward.node ? l.b : l.a;
      // the short vertical link to P2: the chip keeps clear of the port label at SW1
      packets.push({ from: from, to: s.toward.node, at: s.at === 'p2' && from === 'SW1' ? 0.75 : 0.5, c: vlanC(vlanOnLink(scene, s.at, s.frame)),
        label: s.frame.vid === null ? t('chipUntagged') : t('chipTag', { v: s.frame.vid }) });
    } else if (s.outcome === 'dropped' && c.prev && c.prev.phase === 'wire') {
      var pl = scene.links[c.prev.at], pf = pl.a === s.at ? pl.b : pl.a;
      packets.push({ from: pf, to: s.at, drop: true, move: false, at: 0.5, c: vlanC(vlanOnLink(scene, c.prev.at, s.frame)),
        label: s.frame.vid === null ? t('chipUntagged') : t('chipTag', { v: s.frame.vid }) });
    }
    return Simdeck.topology({ cols: 3, rows: roas ? ['auto', '4.5rem', 'auto', '5rem', 'auto'] : ['auto', '5rem', 'auto'],
      dir: c.dir, nodes: nodes, links: links, packets: packets });
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: [['roas', t('modeRoas')], ['l3', t('modeL3')]], resets: true },
      { key: 'dst', type: 'choice', label: t('dst'), options: [['q1', t('dstQ1')], ['p2', t('dstP2')]], resets: true },
      { key: 'fault', type: 'choice', label: t('fault'), hint: t('faultHint'), resets: true,
        options: [['none', t('faultNone')], ['access-port', t('faultAccess')], ['vid-mismatch', t('faultVid')]],
        visible: function (p) { return p.mode === 'roas'; } }
    ],

    presets: [
      { id: 'roas', label: t('presetRoas'), params: { mode: 'roas', dst: 'q1', fault: 'none' } },
      { id: 'l3-svi', label: t('presetL3'), params: { mode: 'l3', dst: 'q1', fault: 'none' } },
      { id: 'same-vlan', label: t('presetSame'), params: { mode: 'roas', dst: 'p2', fault: 'none' } },
      { id: 'access-port', label: t('presetAccess'), params: { mode: 'roas', dst: 'q1', fault: 'access-port' }, hint: t('presetAccessHint') },
      { id: 'vid-mismatch', label: t('presetVid'), params: { mode: 'roas', dst: 'q1', fault: 'vid-mismatch' }, hint: t('presetVidHint') }
    ],

    legend: [
      { c: 1, label: t('legV10') },
      { shape: 'v20', label: t('legV20') },
      { shape: 'hollow', label: t('legUntagged') },
      { shape: 'tag', label: t('legTagged') },
      { shape: 'x', label: t('legDrop') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var scene = L.sceneOf(c.params);
      c.stage.replaceChildren(h('div', { class: 'ir' },
        renderStrip(c, scene),
        h('div', { class: 'ir-main' },
          renderTopo(c, scene),
          h('div', { class: 'ir-side' }, renderHost(c), renderMac(c, scene), renderRouter(c, scene), renderCount(c, scene)))));
    },

    caption: function (c) {
      var s = c.state, p = c.params, scene = L.sceneOf(p), f = s.frame, n = c.n;
      var D = function (v) { return data(v); };
      var N = function (v) { return data(v, ''); };
      var target = hostOf(scene, scene.target);
      if (n === 0) return parts('capStart', { dst: D(target.ip) });
      if (s.outcome === 'dropped') {
        if (s.dropReason === 'untagged') return parts('capDropUntagged', { n: N(n) });
        if (s.dropReason === 'unknown-vlan') return parts('capDropVid', { n: N(n), v: b(f.vid) });
        return parts('capDrop', { n: N(n), d: N(s.at) });
      }
      if (s.outcome === 'delivered') {
        var key = s.decision.local ? 'capDeliverLocal' : scene.mode === 'roas' ? 'capDeliverRoas' : 'capDeliverL3';
        return parts(key, { n: N(n), host: N(s.at), ttl: b(f.ttl), k: b(s.linkUses.trunk || 0) });
      }
      if (n === 1) {
        var d = s.decision;
        return d.local
          ? parts('capSendLocal', { dst: D(target.ip), own: D(d.own), mac: b(short(f.dstMac)) })
          : parts('capSendRemote', { dst: D(target.ip), theirs: b(d.theirs), own: D(d.own), gw: D(d.nextHop), mac: b(short(f.dstMac)) });
      }
      if (s.at === 'SW1' && s.phase === 'to-svi') return parts('capSwInSelf', { n: N(n), port: N(s.inPort), v: N(s.vlan), mac: b(short(f.dstMac)) });
      if (s.at === 'SW1' && s.phase === 'switched' && s.lookup && s.lookup.table === 'mac') {
        var trunkIn = L.parseLink(scene.sw.ports[s.inPort]).mode === 'trunk';
        return parts(trunkIn ? 'capSwInTrunk' : 'capSwInAccess', { n: N(n), port: N(s.inPort), v: N(s.vlan), mac: b(short(f.dstMac)), out: b(s.outPort) });
      }
      if (s.at === 'SW1' && s.phase === 'switched') {
        return parts('capSviRoute', { n: N(n), dst: D(f.dstIp), net: b(s.lookup.net), v: N(s.vlan), a: D(c.prev.frame.ttl), b: b(f.ttl),
          mac: D(short(f.dstMac)), out: b(s.outPort) });
      }
      if (s.at === 'R1' && s.phase === 'received') return parts('capR1In', { n: N(n), v: b(f.vid), subif: b(scene.router.subifs[s.inSubif].name) });
      if (s.phase === 'wire' && s.at === 'trunk' && s.toward.node === 'SW1') {
        return parts('capR1Route', { n: N(n), subif: b(scene.router.subifs[s.outSubif].name), a: D(c.prev.frame.ttl), b: b(f.ttl), v: b(f.vid) });
      }
      if (s.phase === 'wire') {
        var prev = c.prev, port = prev.outPort, to = s.toward.node;
        if (f.vid !== null) return parts('capSwOutTag', { n: N(n), port: b(port), v: b(f.vid) });
        if (prev.frame.vid !== null) return parts('capSwOutUntag', { n: N(n), port: b(port), v: N(prev.frame.vid), to: N(to) });
        return parts('capSwOutPlain', { n: N(n), port: b(port), v: N(prev.vlan), to: N(to) });
      }
      return '';
    }
  });
})();
</script>
</body>
</html>
