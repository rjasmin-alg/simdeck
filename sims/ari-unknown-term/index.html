     an inequality (its two halves, a number line whose numbers are clicked to mark them, the solutions and the check).

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var NL = window.SimdeckModels['number-line'];
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';

  var SIGN = { add: '+', sub: '−', mul: '·', div: ':' };
  var F = L.fmt;

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node twice). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function num(v) { return h('span', { class: 'ut-num', translate: 'no' }, String(v)); }
  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  function sent(a, op, b, c) { return a + ' ' + SIGN[op] + ' ' + b + ' = ' + c; }
  function list(vs) { return vs.map(F).join(', '); }
  function numList(vs) { return h('span', { class: 'ut-num ut-list', translate: 'no' }, list(vs)); }
  /** A list for the caption: a long one as its first three, …, its last two. */
  function shortList(vs) { return vs.length > 8 ? list(vs.slice(0, 3)) + ', …, ' + list(vs.slice(-2)) : list(vs); }
  function capList(vs) { return h('span', { class: 'ut-num ut-list', translate: 'no' }, shortList(vs)); }
  /** The phone layout (the media query below): the line scrolls inside its box instead. */
  function narrowStage() { return window.matchMedia('(max-width: 900px), (max-aspect-ratio: 1/1)').matches; }

  // ── a sentence: names and texts ──
  function termName(op, i) { return t('term_' + op + '_' + i); }
  function roleName(s, role) { return termName(s.op, s.roles.indexOf(role)); }
  /** A number of the fact, or the letter where the unknown stands. */
  function shown(s, role) { return role === s.role ? s.letter : F(s[role]); }
  function invText(s) { return s.letter + ' = ' + F(s.inverse.x) + ' ' + SIGN[s.inverse.op] + ' ' + F(s.inverse.y); }
  function rightText(s) { return s.letter + ' = ' + F(s.inverse.x) + ' ' + SIGN[s.inverse.right] + ' ' + F(s.inverse.y); }
  function calcText(s) { return F(s.inverse.x) + ' ' + SIGN[s.inverse.op] + ' ' + F(s.inverse.y) + ' = ' + F(s.value); }
  function readingText(s, r) { return sent(shown(s, r.roles[0]), r.op, shown(s, r.roles[1]), shown(s, r.roles[2])); }
  function checkText(s) {
    var c = s.check, tm = c.terms;
    if (c.left == null) return F(tm[0]) + ' ' + SIGN[s.op] + ' ' + F(tm[1]);
    return sent(F(tm[0]), s.op, F(tm[1]), F(c.left));
  }

  function sentenceBox(s) {
    var child = audience === 'child';
    var cells = [];
    s.values.forEach(function (v, i) {
      if (i === 1) cells.push(h('span', { class: 'ut-big', translate: 'no' }, SIGN[s.op]));
      if (i === 2) cells.push(h('span', { class: 'ut-big', translate: 'no' }, '='));
      cells.push(h('span', { class: 'ut-big' + (i === s.u ? ' ut-unk ut-x' : ''), translate: 'no' }, i === s.u ? s.letter : F(v)));
    });
    // the term names are the buttons that choose the unknown
    s.values.forEach(function (v, i) {
      if (i) cells.push(h('span'));
      cells.push(noFocus(h('button', { type: 'button', class: 'sd-btn ut-term', 'aria-pressed': String(i === s.u),

    var p = c.params, s = c.state;
    if (s.mode === 'eq') {
      var f = L.factOf(p);
      if (f.fam === 'add' && (p.pa !== f.p || p.qa !== f.q)) { sim.set({ pa: f.p, qa: f.q }); return; }
      if (f.fam === 'mul' && (p.pm !== f.p || p.qm !== f.q)) { sim.set({ pm: f.p, qm: f.q }); return; }
    } else if (p.lo !== s.lo || p.hi !== s.hi) { sim.set({ lo: s.lo, hi: s.hi, marks: 0 }); return; }
  });
  sim.render();
})();
</script>
