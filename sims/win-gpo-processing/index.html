<!-- win-gpo-processing: an administrator edits one setting of the GPO "Workstation Settings" at t = 0, and the host
     (PC07, or DC01) applies it only in its own next processing pass: a background refresh every 90 min + a random
     0–30 min offset (DC: 5 min), gpupdate, a logon or a restart. Folder Redirection and Software Installation apply
     only in a synchronous foreground pass, which fast logon optimisation delays to the second logon or restart.
     A stepper, one event per step. Top: the GPO card (three settings, a lamp each for the GPO and the host) and the
     host card (time, next refresh, next logon and startup mode). Middle: the time axis (foreground passes tall,
     background passes short, the random offset as a bracket). Bottom: kit view K4 (kit/ruletable.js) with the
     client-side extensions of this step's pass, the marks set by the page.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var GPO = 'Workstation Settings';
  var HOST = { pc07: 'PC07', dc01: 'DC01' };
  var USER = { pc07: 'ana', dc01: 'admin' };
  var SET_KEY = { screensaver: 'setScreensaver', lock: 'setLock', folders: 'setFolders', msi: 'setMsi' };
  var CSE_KEY = { registry: 'cseRegistry', security: 'cseSecurity', folders: 'cseFolders', software: 'cseSoftware' };
  /** Each setting's value at version 4 and 5: a string is data, a key in braces a word from the table. */
  var VALUE = {
    screensaver: ['900 s', '300 s'],
    lock: ['900 s', '900 s'],
    folders: ['{valLocal}', '\\\\hq-fs01\\home$'],
    msi: ['{valNone}', 'viewer.msi']
  };
  var SHOWN = ['screensaver', 'folders', 'msi'];

  /** Data (names, paths, versions, times, commands) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'gp-mono' : cls || null }, String(text)); }
  function q(text) { return h('b', { translate: 'no' }, String(text)); }
  function sub(text) { return h('span', { class: 'gp-sub' }, text); }
  function word(text) { return h('span', null, text); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      // always a copy: the same node may be passed to several captions of one step
      if (s === null) { out.push(p.cloneNode(true)); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function valueNode(setting, v) {
    var x = VALUE[setting][v === L.V_NEW ? 1 : 0];
    var m = /^\{(\w+)\}$/.exec(x);
    return m ? h('span', { class: 'gp-val' }, t(m[1])) : data(x, 'gp-val');
  }
  function partOf(setting) { return L.cseOf(setting).part; }
  function hostName(s) { return HOST[s.host]; }
  function userName(s) { return USER[s.host]; }
  /** A time with a real minus sign, as in the captions. */
  function num(v) { return v < 0 ? '−' + (-v) : String(v); }
  function tm(x) { return 't = ' + num(x); }

  /** The main event of this step (not a collapsed quiet refresh), and the collapsed ones before it. */
  function stepEvents(c) {
    var all = c.state.events.filter(function (e) { return e.n === c.n && c.n > 0; });
    return { main: all.length ? all[all.length - 1] : null, quiet: all.filter(function (e) { return e.collapsed; }) };
  }

  /** The axis range of this run (the whole run, so the scale does not change between steps). */
  var rangeCache = {};
  function range(p) {
    var key = JSON.stringify(p);
    if (rangeCache[key]) return rangeCache[key];
    // every event of the run, and the dashed next refresh and planned action of every step before the end
    var hi = 0, n = L.steps(p), s = L.initial(p);
    for (var i = 0; i <= n; i++) {
      if (i > 0) s = L.step(s, i, p);
      hi = Math.max(hi, s.events[s.events.length - 1].t);
      if (s.phase !== 'done') hi = Math.max(hi, s.nextRefresh.t, s.plan.length ? s.plan[0].t : 0);
    }
    hi += 5;
    var lo = -15;
    var stepT = hi - lo <= 75 ? 10 : 30;
    hi = Math.ceil(hi / stepT) * stepT;
    return (rangeCache[key] = { lo: lo, hi: hi, step: stepT });
  }

  // ── GPO card ──
  function renderGpo(c) {
    var s = c.state, prev = c.prev;
    var head = h('h2', null, t('gpoTitle'), data(GPO, ''), sub(t('gpoVersion')),
      data(s.gpo[s.change] === L.V_NEW ? L.V_OLD + ' → ' + L.V_NEW : String(L.V_OLD)));
    var grid = [
      h('span', { class: 'gp-head' }, t('colSetting')),
      h('span', { class: 'gp-head', dataset: { wide: '' } }),
      h('span', { class: 'gp-head' }, t('colInGpo')),
      h('span', { class: 'gp-head' }, t('colOnHost', { h: hostName(s) })),
      h('span', { class: 'gp-head', dataset: { wide: '' } })
    ];
    SHOWN.forEach(function (k) {
      var edited = s.change === k && s.gpo[k] === L.V_NEW;
      var gpoOn = s.gpo[k] === L.V_NEW, hostOn = s.applied[k] === L.V_NEW;
      var gpoChanged = prev && prev.gpo[k] !== s.gpo[k];
      var hostChanged = prev && prev.applied[k] !== s.applied[k];
      var val = edited ? h('span', { class: 'gp-val' }, valueNode(k, L.V_OLD), data(' → ', ''), valueNode(k, L.V_NEW)) : valueNode(k, s.gpo[k]);
      var st, kind;
      if (!edited) { st = t('stSame'); kind = 'same'; }
      else if (hostOn) { st = '✓ ' + t('stApplied'); kind = 'ok'; }
      else if (s.pending.syncNext[partOf(k)] && L.cseOf(k).sync) { st = t(partOf(k) === 'user' ? 'stWaitsLogon' : 'stWaitsStartup'); kind = 'sync'; }
      else { st = t('stEdited'); kind = 'wait'; }
      grid.push(
        h('span', { dataset: edited ? { edited: '' } : {} }, t(SET_KEY[k])),
        val,
        h('span', { class: 'gp-lampcell' + (gpoChanged ? ' sd-changed' : '') },
          h('span', { class: 'gp-lamp', dataset: gpoOn ? { on: '' } : {}, 'aria-hidden': 'true' }), data('v' + s.gpo[k], '')),
        h('span', { class: 'gp-lampcell' + (hostChanged ? ' sd-changed' : '') },
          h('span', { class: 'gp-lamp', dataset: hostOn ? { on: '' } : {}, 'aria-hidden': 'true' }), data('v' + s.applied[k], '')),
        h('span', { class: 'gp-st', dataset: { k: kind } }, st));
    });
    return h('section', { class: 'gp-box gp-gpo' }, head, h('div', { class: 'gp-set' }, grid));
  }

  // ── host card ──
  function renderHost(c) {
    var s = c.state, prev = c.prev;
    var nr = s.nextRefresh;
    var lines = [h('h2', null, data(hostName(s), ''), sub(t(s.dc ? 'hostDc' : 'hostClient')), h('span', { class: 'gp-sub' }, t.parts('loggedOn', { u: data(userName(s), '') })))];
    lines.push(h('div', { class: 'gp-line' }, sub(t('now')), data(tm(s.t))));
    lines.push(h('div', { class: 'gp-line' }, sub(t('nextRefresh')), data(tm(nr.t)),
      s.dc ? sub('(' + t('everyFive') + ')') : data('(' + nr.base + ' + ' + nr.off + ')', 'gp-sub gp-mono')));
    lines.push(h('div', { class: 'gp-line' }, sub(t(s.dc ? 'fastDc' : s.fastLogon ? 'fastOn' : 'fastOff'))));
    [['user', 'nextLogon'], ['computer', 'nextStartup']].forEach(function (x) {
      var sync = L.syncForeground(s, x[0]);
      var was = prev ? L.syncForeground(prev, x[0]) : sync;
      lines.push(h('div', { class: 'gp-line' }, sub(t(x[1])),
        h('b', { class: was !== sync ? 'gp-hlw' : null }, t(sync ? 'sync' : 'async'))));
    });
    return h('section', { class: 'gp-box gp-host' }, lines);
  }

  // ── time axis ──
  function evWord(e) {
    switch (e.kind) {
      case 'refresh': return t('evRefresh');
      case 'gpupdate': return null;
      case 'force': return null;
      case 'logon': return t('evLogon');
      case 'restart': return e.history ? t('evStart') : t('evRestart');
      case 'edit': return t('evEdit');
      default: return '';
    }
  }
  function labelFor(e, extra) {
    var w = evWord(e);
    var parts = [];
    if (w) parts.push(w, ' ');
    if (e.kind === 'gpupdate') parts.push(data('gpupdate ', ''));
    if (e.kind === 'force') parts.push(data('gpupdate /force ', ''));
    parts.push(data(num(e.t), ''));
    if (e.mode) {
      var m = e.mode.computer || e.mode.user;
      parts.push(' (', t(m === 'sync' ? 'sync' : 'async'), ')');
    }
    if (extra) parts.push(' ', extra);
    return parts;
  }
  function renderTimeline(c) {
    var s = c.state, R = range(c.params), cur = stepEvents(c);
    function x(v) { return ((v - R.lo) / (R.hi - R.lo) * 100) + '%'; }
    var track = h('div', { class: 'gp-track' }, h('div', { class: 'gp-axis' }));
    for (var v = Math.ceil(R.lo / R.step) * R.step; v <= R.hi; v += R.step) {
      track.append(h('span', { class: 'gp-tick', style: 'left:' + x(v) }), h('span', { class: 'gp-num', style: 'left:' + x(v), translate: 'no' }, num(v)));
    }
    var labels = [];
    function label(e, nodes, ds) {
      var el = h('span', { class: 'gp-lab' + (ds.now ? ' sd-changed' : ''), dataset: ds.plan ? { plan: '' } : ds.old ? { old: '' } : {} }, nodes);
      el._x = (e.t - R.lo) / (R.hi - R.lo);
      labels.push(el);
      track.append(el);
    }
    function bracket(base, at, off, plan) {
      if (s.dc) return;
      if (at - base < 3) {   // a bracket of a minute or two reads as a glyph: the label alone
        track.append(h('span', { class: 'gp-brk-lab', dataset: plan ? { plan: '' } : {}, translate: 'no', style: 'left:' + x(at) }, '+' + off));
        return;
      }
      var ds = plan ? { plan: '' } : {};
      track.append(h('span', { class: 'gp-brk', dataset: ds, style: 'left:' + x(base) + ';width:calc(' + x(at) + ' - ' + x(base) + ')' }));
      track.append(h('span', { class: 'gp-brk-lab', dataset: ds, translate: 'no', style: 'left:' + x((base + at) / 2) }, '+' + off));
    }
    s.events.forEach(function (e) {
      var now = cur.main === e;
      if (e.kind === 'edit') {
        track.append(h('span', { class: 'gp-bar', dataset: { k: 'edit' }, style: 'left:' + x(e.t) }));
        track.append(h('span', { class: 'gp-diamond', style: 'left:' + x(e.t), translate: 'no', 'aria-hidden': 'true' }, '◆'));
        label(e, labelFor(e), { now: now });
        return;
      }
      if (e.quiet && (e.collapsed || e.history)) {
        track.append(h('span', { class: 'gp-bar', dataset: { k: 'quiet' }, style: 'left:' + x(e.t) }));
        return;
      }
      var k = e.kind === 'logon' || e.kind === 'restart' ? 'fg' : 'bg';
      var ds = { k: k };
      if (e.history || (e.results && e.results[L.cseOf(s.change).id] === 'applied')) ds.fill = '';
      if (now) ds.now = '';
      track.append(h('span', { class: 'gp-bar', dataset: ds, style: 'left:' + x(e.t) }));
      label(e, labelFor(e), { now: now, old: !now && !e.history });
      if (e.kind === 'refresh' && !e.history) bracket(e.base, e.t, e.off, false);
    });
    // what comes next: the planned action and the scheduled refresh, dashed
    if (s.phase !== 'done') {
      var nr = s.nextRefresh;
      var nextIsPlan = s.plan.length && s.plan[0].t <= nr.t;
      if (s.phase === 'run' || s.phase === 'edit') {
        if (nr.t <= R.hi) {
          track.append(h('span', { class: 'gp-bar', dataset: { k: 'bg', plan: '' }, style: 'left:' + x(nr.t) }));
          if (!nextIsPlan || s.plan[0].t !== nr.t) label({ t: nr.t }, [t('evNext'), ' ', data(nr.t, '')], { plan: true });
          bracket(nr.base, nr.t, nr.off, true);
        }
        s.plan.slice(0, 1).forEach(function (pa) {
          var kk = pa.kind === 'logon' || pa.kind === 'restart' ? 'fg' : 'bg';
          track.append(h('span', { class: 'gp-bar', dataset: { k: kk, plan: '' }, style: 'left:' + x(pa.t) }));
          label(pa, [t('evPlanned'), ': '].concat(labelFor({ kind: pa.kind, t: pa.t })), { plan: true });
        });
      }
    }
    track.append(h('span', { class: 'gp-unit' }, t('axisUnit')));
    var box = h('section', { class: 'gp-box gp-tl' }, track);
    box._labels = labels;
    box._track = track;
    return box;
  }
  /** Put the labels in rows so that none overlaps another (measured after layout). */
  function layoutLabels(box) {
    var track = box._track, W = track.clientWidth;
    if (!W) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var rowH = 1.3 * rem, gap = 0.4 * rem, rows = [], used = 1;
    for (var k = 0; k < (W < 40 * rem ? 6 : 4); k++) rows.push(-Infinity);
    box._labels.slice().sort(function (a, b) { return a._x - b._x; }).forEach(function (el) {
      var w = el.offsetWidth;
      var left = Math.max(-0.8 * rem, Math.min(W + 0.8 * rem - w, el._x * W - w / 2));
      var r = 0;
      while (r < rows.length && rows[r] + gap > left) r++;
      if (r === rows.length) { r = 0; for (var i = 1; i < rows.length; i++) if (rows[i] < rows[r]) r = i; }
      rows[r] = left + w;
      used = Math.max(used, r + 1);
      el.style.left = left + 'px';
      el.style.top = (r * rowH) + 'px';
    });
    track.style.setProperty('--lab', (used * rowH) + 'px');
  }

  // ── K4: the client-side extensions of this step's pass ──
  function markLabel(c, e) {
    var s = c.state;
    if (!e) return t('markNone');
    if (e.kind === 'edit') return t('markEdit', { h: hostName(s) });
    var when = data(tm(e.t) + ' · ', '');
    if (e.kind === 'refresh') return h('span', null, when, t('markRefresh'));
    if (e.kind === 'gpupdate' || e.kind === 'force') return h('span', null, when, data(e.kind === 'force' ? 'gpupdate /force' : 'gpupdate', ''), ': ', t('markGpupdate'));
    var word2 = function (m) { return t(m === 'sync' ? 'sync' : 'async'); };
    if (e.kind === 'logon') return h('span', null, when, t('markLogon', { m: word2(e.mode.user) }));
    return h('span', null, when, t('markRestart', { c: word2(e.mode.computer), u: word2(e.mode.user) }));
  }
  function renderTable(c) {
    var s = c.state, e = stepEvents(c).main;
    var results = e && e.results;
    return Simdeck.ruleTable({
      dir: c.dir,
      title: t('tableTitle'),
      columns: [{ key: 'cse', label: t('colCse'), wrap: true }, { key: 'part', label: t('colPart') }, { key: 'bg', label: t('colBg'), wrap: true }],
      actionLabel: t('colHolds'),
      markLabel: markLabel(c, e),
      rows: L.CSES.map(function (x, i) {
        var r = results ? results[x.id] : null;
        var mark = null, note = null;
        if (r === 'applied') mark = 'win';
        else if (r === 'reapplied') { mark = 'win'; note = [{ k: 'muted', text: t('noteReapplied') }]; }
        else if (r === 'signal') { mark = 'hit'; note = [{ k: 'dashed', text: t(x.part === 'user' ? 'noteSyncLogon' : 'noteSyncStartup') }]; }
        else if (r === 'unchanged') { mark = 'no'; note = [{ k: 'muted', text: t('noteNothingNew') }]; }
        else if (r === 'notRun') mark = 'skip';
        var edited = x.setting === s.change && s.gpo[x.setting] === L.V_NEW;
        return {
          no: i + 1,
          tags: edited ? [{ k: 'hl', text: t('tagEdited') }] : null,
          cells: {
            cse: word(t(CSE_KEY[x.id])),
            part: word(t(x.part === 'user' ? 'partUser' : 'partComputer')),
            bg: word(t(x.sync ? 'bgSignals' : 'bgApplies'))
          },
          action: word(t(SET_KEY[x.setting])),
          hit: null,
          mark: mark,
          note: note
        };
      }),
      at: -1,
      words: { win: t('wordWin'), hit: t('wordHit'), skip: t('wordSkip') },
      stickyMark: true
    });
  }

  // ── captions ──
  function flaggedAt(s, part, upto) {
    var f = null, was = false;
    s.events.forEach(function (e) {
      if (e === upto || !e.flags) return;
      if (s.events.indexOf(e) > s.events.indexOf(upto)) return;
      if (e.flags[part] && !was) f = e;
      was = e.flags[part];
    });
    return f;
  }
  function caption(c) {
    var s = c.state;
    var H = q(hostName(s)), U = q(userName(s)), G = q(GPO);
    if (c.first) {
      var out = s.dc ? rich('capStartDc', { h: H, g: G, v: q(L.V_OLD) })
        : rich('capStartPc', { h: H, u: U, g: G, v: q(L.V_OLD), next: q(s.nextRefresh.t), off: q(s.nextRefresh.off) });
      if (!s.dc && !s.fastLogon) out.push(t('capStartNoFast'));
      return out;
    }
    var se = stepEvents(c), e = se.main;
    var part = partOf(s.change), P = part === 'user' ? 'User' : 'Computer';
    var cse = L.cseOf(s.change).id;
    var r = e.results ? e.results[cse] : null;
    var T = q(e.t);
    var cmd = q(e.kind === 'force' || s.action === 'force' ? 'gpupdate /force' : 'gpupdate');
    var out2;
    switch (e.kind) {
      case 'edit':
        out2 = rich('capEdit', { s: t(SET_KEY[s.change]), g: G, v: q(L.V_NEW), h: H });
        if (s.action === 'wait') out2.push(t('capPlanWait'));
        else if (s.action === 'relog') out2 = out2.concat(rich(part === 'user' ? 'capPlanLogon' : 'capPlanRestart', { u: U, h: H }));
        else out2 = out2.concat(rich('capPlanGpupdate', { u: U, cmd: cmd }));
        return out2;
      case 'refresh':
        if (r === 'applied') {
          out2 = s.dc ? rich('capRefreshAppliedDc', { t: T, d: q(e.t) }) : rich('capRefreshApplied', { t: T, off: q(e.off) });
          if (s.plan.length) out2.push(t('capPlanMoot'));
        }
        else if (e.quiet) out2 = rich('capRefreshQuiet' + P, { t: T });
        else out2 = rich('capRefreshSignal' + P, { t: T });
        break;
      case 'gpupdate':
        out2 = r === 'applied' ? rich('capGpupdateApplied', { t: T, u: U, cmd: cmd }) : rich('capGpupdateSignal' + P, { t: T, cmd: cmd });
        break;
      case 'force':
        out2 = r === 'applied' ? rich('capForceApplied', { t: T, cmd: cmd }) : rich('capForceSignal' + P, { t: T, cmd: cmd });
        break;
      default: {
        var vars = { t: T, u: U, h: H };
        if (s.change === 'screensaver') out2 = rich('capFgRegistry', vars);
        else if (r === 'signal') out2 = rich('capFgSignal' + P, vars);
        else if (s.dc) out2 = rich('capFgDc' + P, vars);
        else if (!s.fastLogon) out2 = rich('capFgNoFast' + P, vars);
        else {
          var f = flaggedAt(s, part, e);
          if (f && (f.kind === 'logon' || f.kind === 'restart')) out2 = rich('capFgSecond' + P, vars);
          else out2 = rich('capFgFlagged' + P, Object.assign(vars, { f: q(f ? f.t : '?') }));
        }
      }
    }
    if (se.quiet.length) out2.push(t.n('capCollapsed', se.quiet.length, { list: se.quiet.map(function (x) { return x.t; }).join(', ') }));
    return out2;
  }

  var sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'dc', type: 'toggle', label: t('pDc') },
      { key: 'change', type: 'choice', label: t('pChange'), options: [['screensaver', t('optScreensaver')], ['folders', t('optFolders')], ['msi', t('optMsi')]] },
      { key: 'action', type: 'choice', label: t('pAction'), options: [['wait', t('optWait')], ['gpupdate', t('optGpupdate')], ['force', t('optForce')], ['relog', t('optRelog')]] },
      { key: 'fastLogon', type: 'toggle', label: t('pFast'), disabled: function (p) { return p.dc ? t('offDcFast') : false; } },
      { key: 'seed', type: 'range', label: t('pSeed'), min: 1, max: 9, step: 1, disabled: function (p) { return p.dc ? t('offDcSeed') : false; } }
    ],

    presets: [
      { id: 'background', label: t('presetBackground'), hint: t('presetBackgroundHint'), params: {} },
      { id: 'gpupdate', label: t('presetGpupdate'), hint: t('presetGpupdateHint'), params: { action: 'gpupdate' } },
      { id: 'folder-redirection', label: t('presetFolders'), hint: t('presetFoldersHint'), params: { change: 'folders', action: 'relog' } },
      { id: 'msi-two-reboots', label: t('presetMsi'), hint: t('presetMsiHint'), params: { change: 'msi', action: 'relog' } },
      { id: 'dc', label: t('presetDc'), hint: t('presetDcHint'), params: { dc: true } },
      { id: 'force-folders', label: t('presetForce'), hint: t('presetForceHint'), params: { change: 'folders', action: 'force' } }
    ],

    legend: [
      { shape: 'gp-tall', label: t('legFg') },
      { shape: 'gp-short', label: t('legBg') },
      { shape: 'bg-bracket', label: t('legOffset') },
      { shape: 'rt-win', label: t('legApplied') },
      { shape: 'rt-hit', label: t('legWaits') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var tl = renderTimeline(c);
      c.stage.replaceChildren(h('div', { class: 'gp' }, h('div', { class: 'gp-top' }, renderGpo(c), renderHost(c)), tl, renderTable(c)));
      layoutLabels(tl);
    },

    caption: caption
  });
  window.addEventListener('resize', function () { sim.render(); });
})();
</script>
</body>
