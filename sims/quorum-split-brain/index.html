<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  /** Node positions per node count: [col, row] in a 10-column grid, cards span 2, the witness 4 (SPEC.md "Scene": a ring). */
  var POS = {
    2: { A: [0, 1], B: [8, 1], W: [3, 2] },
    3: { A: [0, 0], B: [8, 0], C: [4, 2], W: [3, 1] },
    4: { A: [0, 0], B: [8, 0], C: [8, 2], D: [0, 2], W: [3, 1] },
    5: { A: [4, 0], B: [8, 1], C: [6, 2], D: [2, 2], E: [0, 1], W: [3, 1] }
  };

  /** Data (node ids, numbers, x = 1) is not language: the word check skips translate="no". */
  function data(text) { return h('b', { translate: 'no' }, String(text)); }
  function mono(text) { return h('span', { translate: 'no' }, String(text)); }
  function join(list) {
    var out = [];
    list.forEach(function (x, i) { if (i) out.push(' '); out = out.concat(x); });
    return out;
  }
  function keyIcon() {
    var s = document.createElementNS(SVG, 'svg');
    s.setAttribute('viewBox', '0 0 24 12');
    s.setAttribute('class', 'qs-key');
    s.setAttribute('aria-hidden', 'true');
    [['circle', { cx: 5, cy: 6, r: 3.6 }], ['path', { d: 'M8.6 6H22.5M18.5 6v4M21.5 6v3' }]].forEach(function (e) {
      var el = document.createElementNS(SVG, e[0]);
      Object.keys(e[1]).forEach(function (k) { el.setAttribute(k, e[1][k]); });
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', 'currentColor');
      el.setAttribute('stroke-width', '2.4');
      s.append(el);
    });
    return s;
  }

  function sceneOf(p) { return p.scene === 'win' || p.scene === 'ceph' ? p.scene : 'ha'; }
  function res(p) { return t('res_' + sceneOf(p)); }
  function resA(p) { return t('resA_' + sceneOf(p)); }
  function membersText(sd) { return sd.members.join(''); }
  function upNode(s, id) { return s.nodes.filter(function (x) { return x.id === id; })[0].up; }
  function counted(sd) { return !!sd.counted; }
  function qOf(sd) { return !counted(sd) ? 'pending' : sd.quorum ? 'yes' : 'no'; }

  // ── the drawing (kit view K2) ──

  function renderTopo(c) {
    var s = c.state, p = c.params, prev = c.prev;
    var pos = POS[s.n];
    var single = s.phase === 'start' || s.phase === 'heal';
    var colourOf = function (id) {
      var i = L.sideOfNode(s.sides, id);
      return String(single ? 1 : i + 1);
    };
    var wasRunning = prev ? prev.resource.runningOn : s.resource.runningOn;
    var lastWrite = s.phase === 'write' ? s.writes[s.writes.length - 1] : null;
    var nodes = s.nodes.map(function (nd) {
      var i = L.sideOfNode(s.sides, nd.id);
      var sd = s.sides[i];
      var runs = s.resource.runningOn.indexOf(nd.id) >= 0;
      var badges = [];
      if (!nd.up) badges.push({ text: t('bDown'), k: 'muted' });
      if (runs) badges.push({ text: [keyIcon(), res(p)], k: 'fill' });
      if (runs && s.writes.length) badges.push({ text: mono('x = ' + (sd.copies ? sd.copies.filter(function (cp) { return cp.node === nd.id; })[0].value : sd.value)), k: 'solid' });
      var changed = c.n > 0 && ((runs !== (wasRunning.indexOf(nd.id) >= 0)) || (lastWrite && lastWrite.node === nd.id));
      return { id: nd.id, kind: 'host', col: pos[nd.id][0], row: pos[nd.id][1], span: 2, c: colourOf(nd.id),
        name: t('node_' + sceneOf(p)), lines: [!single && nd.up ? { text: t('sideN', { k: i + 1 }), kind: 'role' } : null],
        badges: badges, state: nd.up ? null : 'down', changed: changed, align: 'center' };
    });
    var links = s.links.map(function (l) {
      var dead = !upNode(s, l.a) || !upNode(s, l.b);
      return { id: l.a + l.b, a: l.a, b: l.b, state: l.up ? 'up' : dead ? 'off' : 'down' };
    });
    var packets = [];
    if (s.phase === 'count') s.links.forEach(function (l) { if (l.up) packets.push({ from: l.a, to: l.b, chip: false, c: colourOf(l.a) }); });
    if (s.witness) {
      var w = s.witness;
      var wSide = w.reach ? L.sideOfNode(s.sides, w.reach) : -1;
      nodes.push({ id: 'W', kind: 'host', mark: t('wMark'), col: pos.W[0], row: pos.W[1], span: 4, align: 'center',
        c: wSide >= 0 ? String(single ? 1 : wSide + 1) : null, name: t('wit_' + sceneOf(p)), lines: [],
        badges: [w.reach ? { text: t('bVote', { k: wSide + 1 }), k: 'solid' } : { text: t('bNoVote'), k: 'muted' }] });
      s.nodes.forEach(function (nd) {
        var reach = nd.up && wSide >= 0 && L.sideOfNode(s.sides, nd.id) === wSide;
        links.push({ id: 'W' + nd.id, a: 'W', b: nd.id, state: reach ? 'up' : nd.up ? 'down' : 'off', style: 'dashed' });
        if (reach && s.phase === 'count') packets.push({ from: 'W', to: nd.id, chip: false, c: String(wSide + 1) });
      });
    }
    // phone order: A, B, …, then the witness
    return Simdeck.topology({ cols: 10, rows: ['auto', 'minmax(2rem, 1fr)', 'auto'], dir: c.dir, nodes: nodes, links: links, packets: packets, gap: '1cqw' });
  }

  // ── the side column ──

  function resLine(s, sd, p) {
    var r = res(p), ra = resA(p), node = sd.node ? mono(sd.node) : null;
    var line = function (text, attrs, icon) { return h('div', Object.assign({ class: 'qs-res' }, attrs || {}), icon ? [keyIcon()] : null, text); };
    if (sd.down) return sd.node ? line(t.parts('actLost', { node: node }), { dataset: { bad: '1' } }) : line(t('actOff'), { dataset: { off: '1' } });
    var act = s.phase === 'act' || s.phase === 'write' || (s.phase === 'heal') ? sd.act : null;
    if (act === 'conflict') {
      var nodes = sd.copies.map(function (cp) { return cp.node; }).join(', ');
      return h('div', { class: 'qs-res', dataset: { bad: '1' } }, sd.copies.map(function () { return keyIcon(); }), h('span', { class: 'qs-bang', 'aria-hidden': 'true' }, '!'),
        h('span', null, t.parts('actConflict', { nodes: mono(nodes) })));
    }
    if (act === 'start') return line(t.parts('actStart', { ra: ra, node: node }), null, true);
    if (act === 'stop') return line(t.parts('actStop', { ra: ra, node: node }), { dataset: { off: '1' } });
    if (act === 'keep' && s.phase !== 'heal') return line(t.parts('actKeep', { ra: ra, node: node }), null, true);
    if (sd.running) return line(t.parts('running', { r: r, node: node }), null, true);
    return line(t('actOff'), { dataset: { off: '1' } });
  }

  function dataLine(sd) {
    if (sd.down) return h('div', { class: 'qs-data' }, t('dataLost'));
    if (sd.copies && sd.copies.length > 1 && sd.diverged) {
      var list = sd.copies.map(function (cp) { return cp.node + ': x = ' + cp.value; }).join(', ');
      return h('div', { class: 'qs-data' }, t.parts('dataDiff', { list: mono(list) }));
    }
    return h('div', { class: 'qs-data' }, t.parts('data', { x: mono('x = ' + sd.value) }));
  }

  function renderSides(c) {
    var s = c.state, p = c.params;
    var single = s.phase === 'start' || s.phase === 'heal';
    var out = [h('h2', null, t('sidesTitle'))];
    s.sides.forEach(function (sd, i) {
      var q = qOf(sd);
      var cls = 'qs-side' + (counted(sd) && !sd.quorum ? ' sd-hatch' : '') + (s.changed.indexOf(i) >= 0 && c.n > 0 ? ' sd-changed' : '');
      var ds = { c: sd.down ? '' : String(single ? 1 : i + 1), q: q };
      if (sd.down) ds.down = '1';
      out.push(h('section', { class: cls, dataset: ds }, h('div', { class: 'qs-in' },
        h('div', { class: 'qs-head' },
          h('b', null, sd.down ? t('failed') : t('sideHead', { k: i + 1 })),
          h('span', { class: 'qs-members', translate: 'no' }, sd.members.join(' ')),
          h('span', { class: 'qs-status', dataset: { q: q } }, q === 'pending' ? t('stUncounted') : sd.quorum ? t('stQuorum') : t('stNoQuorum'))),
        counted(sd) ? h('div', { class: 'qs-votes' }, t.parts('votes', { v: data(sd.votes), n: data(sd.total) }), ' · ',
          t.parts('needs', { k: data(sd.needed) }), sd.witness ? [' · ', t('plusW')] : null) : null,
        resLine(s, sd, p),
        sceneOf(p) === 'ceph' ? null : dataLine(sd))));
    });
    return out;
  }

  // ── captions ──

  function sideName(sd) { return data(membersText(sd)); }

  function capStart(s, p) {
    var ceph = sceneOf(p) === 'ceph';
    return t.parts('capStart', { nodes: t.n(ceph ? 'monsN' : 'nodesN', s.n), w: s.witness ? t('andW') : '', r: res(p), a: data('A'),
      total: data(s.total), needed: data(L.neededOf(s.total)) });
  }

  function capPartition(s) {
    var out = [];
    var down = s.sides.filter(function (sd) { return sd.down; })[0];
    if (down) {
      out.push(t.parts('capFail', { node: data(down.members[0]) }));
      if (s.n > 2) out.push(t('capFailRest'));
    }
    else out.push(t.parts('capSplit', { sides: t.n('sidesN', s.sides.length), list: data(s.sides.map(membersText).join(' | ')) }));
    if (s.witness) out.push(s.witness.reach ? t.parts('capWit', { node: data(s.witness.reach) }) : t.parts('capWitGone', { node: data(s.witness.at) }));
    return join(out);
  }

  function capCount(s) {
    var list = s.sides.map(function (sd) { return membersText(sd) + ' ' + sd.votes; }).join(', ');
    var out = [t.parts('capCount', { list: data(list), needed: data(L.neededOf(s.total)), total: data(s.total) })];
    var q = s.sides.filter(function (sd) { return sd.quorum; })[0];
    out.push(q ? t.parts('oneHas', { m: sideName(q) }) : t('noneHas'));
    if (q && q.witness && q.votes - 1 < q.needed) out.push(t.parts('witHelped', { v: data(q.votes - 1), total: data(s.total) }));
    return join(out);
  }

  function capAct(s, p) {
    var out = [];
    var q = s.sides.filter(function (sd) { return sd.quorum; })[0];
    var lost = s.sides.filter(function (sd) { return sd.act === 'lost'; });
    lost.forEach(function (sd) { out.push(t.parts('aLost', { node: data(sd.node), r: res(p) })); });
    if (s.n === 4 && !s.witness && s.policy === 'stop' && s.split === 'AB|CD') {
      return t.parts('capFour', { q: h('i', { lang: 'en' }, t('wQuorum')), r: res(p) });
    }
    if (s.policy === 'ignore' && s.splitBrain) {
      out.push(t.parts('aIgnore', { ra: resA(p), copies: t.n('copiesN', s.resource.runningOn.length) }));
      return join(out);
    }
    if (!q && s.policy === 'stop') {
      if (sceneOf(p) === 'ceph') out.push(t('aCeph'));
      else out.push(t.parts(lost.length || s.sides.some(function (sd) { return sd.down; }) ? 'aNone' : 'aNoneHealthy', { r: res(p) }));
      return join(out);
    }
    s.sides.forEach(function (sd) {
      var vars = { m: sideName(sd), ra: resA(p), node: sd.node ? data(sd.node) : '' };
      // quorum ignored with a single live side: it runs without quorum, and the caption says so
      if (sd.act === 'keep') out.push(t.parts(sd.quorum ? 'aKeep' : 'aKeepIgn', vars));
      if (sd.act === 'start') {
        out.push(t.parts(sd.quorum ? 'aStart' : 'aStartIgn', vars));
        // Ceph monitors do not fence: the lost monitor simply drops out of the quorum
        if (s.policy === 'stop' && sceneOf(p) !== 'ceph') out.push(t('aFence'));
      }
      if (sd.act === 'stop') out.push(t.parts('aStop', vars));
    });
    return join(out);
  }

  function capWrite(s) {
    var w = s.writes[s.writes.length - 1];
    return t.parts(s.writes.length === 1 ? 'capWrite1' : 'capWriteN', { m: sideName(s.sides[w.side]), x: data('x = ' + w.value) });
  }

  function capHeal(s, p) {
    var sd = s.sides[0];
    var vars = { m: sideName(sd), v: data(sd.votes), total: data(s.total), node: sd.node ? data(sd.node) : '', r: res(p), ra: resA(p) };
    if (sd.act === 'conflict') return sd.copies.length === 2 ? t.parts('capHealTwo', { ra: resA(p) }) : t.parts('capHealMany', { copies: t.n('copiesN', sd.copies.length) });
    // after a node failure no link was cut: the last step sums up instead of healing the network
    var F = s.split.indexOf('!') >= 0 ? 'F' : '';
    if (sd.act === 'keep') return t.parts('capHealKeep' + F, vars);
    if (sd.act === 'start') return t.parts('capHealStart' + F, vars);
    return t.parts('capHealOff' + F, vars);
  }

  var SPLIT_PARAMS = [2, 3, 4, 5].map(function (n) {
    return { key: 'split' + n, type: 'choice', label: t('pSplit'), hint: t('pSplitHint'), resets: true,
      options: L.SPLITS[n].map(function (sp) { return [sp, t('sp:' + sp)]; }),
      visible: function (p) { return Number(p.nodes) === n; } };
  });

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [{ key: 'nodes', type: 'range', label: t('pNodes'), min: 2, max: 5, step: 1, resets: true }].concat(SPLIT_PARAMS, [
      { key: 'witness', type: 'toggle', label: t('pWitness'), resets: true, visible: function (p) { return p.scene !== 'ceph'; } },
      { key: 'witnessAt', type: 'choice', label: t('pWitnessAt'), resets: true, options: [['first', t('wFirst')], ['last', t('wLast')]],
        visible: function (p) { return p.scene !== 'ceph' && p.witness; } },
      { key: 'policy', type: 'choice', label: t('pPolicy'), resets: true, options: [['stop', t('polStop')], ['ignore', t('polIgnore')]],
        visible: function (p) { return p.scene !== 'ceph'; } }
    ]),

    presets: [
      { id: 'three-nodes', label: t('prThree'), params: { scene: 'ha', nodes: 3, split3: 'AB|C', witness: false, witnessAt: 'first', policy: 'stop' } },
      { id: 'four-nodes', label: t('prFour'), params: { scene: 'ha', nodes: 4, split4: 'AB|CD', witness: false, witnessAt: 'first', policy: 'stop' } },
      { id: 'two-plus-witness', label: t('prWitness'), params: { scene: 'win', nodes: 2, split2: 'A|B', witness: true, witnessAt: 'first', policy: 'stop' } },
      { id: 'five-three-way', label: t('prFive'), params: { scene: 'ha', nodes: 5, split5: 'AB|CD|E', witness: false, witnessAt: 'first', policy: 'stop' } },
      { id: 'split-brain', label: t('prSplitBrain'), params: { scene: 'ha', nodes: 2, split2: 'A|B', witness: false, witnessAt: 'first', policy: 'ignore' } },
      { id: 'ceph-mons', label: t('prCeph'), hint: t('prCephHint'), params: { scene: 'ceph', nodes: 3, split3: 'A|B|C', witness: false, witnessAt: 'first', policy: 'stop' } }
    ],

    legend: [
      { shape: 'round', c: 1, label: t('lgNode') },
      { shape: 'qs-witness', label: t('lgWitness') },
      { shape: 'qs-q', label: t('lgQuorum') },
      { shape: 'qs-nq', label: t('lgNoQuorum') },
      { shape: 'qs-key', label: t('lgRes') },
      { shape: 'qs-two', label: t('lgTwo') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'qs' },
        h('div', { class: 'qs-draw' }, h('p', { class: 'qs-scene' }, t('scene_' + sceneOf(c.params))), renderTopo(c)),
        h('div', { class: 'qs-sides' }, renderSides(c))));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      switch (s.phase) {
        case 'start': return capStart(s, p);
        case 'partition': return capPartition(s);
        case 'count': return capCount(s);
        case 'act': return capAct(s, p);
        case 'write': return capWrite(s);
        default: return capHeal(s, p);
      }
    }
  });
})();
</script>
</body>
