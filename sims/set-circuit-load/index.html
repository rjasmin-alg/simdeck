<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { electric: '1', camera: '2', makeup: '4' };
  var THERM_MAX = 200; // °C, the right end of the drum's thermometer

  /** Numbers in the page's language: a decimal comma in Croatian. */
  function num(x, d) {
    var s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function A(x) { return num(x, 1); }
  function kW(w) { return num(w / 1000, 1); }
  function T(x) { return x > THERM_MAX ? '> ' + THERM_MAX : String(Math.round(x)); }
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function joinAnd(words) {
    if (words.length < 2) return words.join('');
    return words.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + words[words.length - 1];
  }
  function circuitOf(s, id) { return s.circuits.filter(function (c) { return c.id === id; })[0]; }
  function plugAt(s, slot) { return s.plugs.filter(function (x) { return x.slot === slot; })[0] || null; }
  function defOf(id) { return L.CIRCUITS.filter(function (c) { return c.id === id; })[0]; }

  // ── "changed": against the params and state before the last input (SPEC.md rule 8) ──
  var lastParams = null, lastState = null, lastPreset = null;
  var delta = { slots: [], trips: [], reel: false, fresh: true };
  function sameParams(a, b) { return Object.keys(L.defaults).every(function (k) { return a[k] === b[k]; }); }
  function track(c) {
    if (lastParams && sameParams(lastParams, c.params)) return;
    var presetLoad = c.preset && c.preset !== lastPreset;
    delta = lastParams && !presetLoad
      ? { slots: L.changedSlots(lastParams, c.params), trips: L.changedTrips(lastState, c.state), reel: lastParams.reel !== c.params.reel, fresh: false }
      : { slots: [], trips: [], reel: false, fresh: true };
    lastParams = Object.assign({}, c.params);
    lastState = c.state;
    lastPreset = c.preset;
  }

  // ── stage ──

  var focusSlot = null;
  function press(slot) {
    var sim = window.simdeck;
    focusSlot = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.slot === slot ? slot : null;
    sim.set(L.click(sim.params, slot));
  }

  function socket(s, p, slot) {
    var x = plugAt(s, slot), changed = delta.slots.indexOf(slot) >= 0;
    var attrs = {
      type: 'button', class: 'cl-sock' + (x ? ' sd-fill' : '') + (changed ? ' sd-changed' : ''), dataset: { slot: slot },
      onmousedown: function (e) { e.preventDefault(); }, onclick: function () { press(slot); }
    };
    if (!x) {
      attrs.dataset.empty = '';
      attrs['aria-label'] = t('plugEmptyLabel', { id: slot, dev: t('dev_' + p.hand) });
      return h('button', attrs, h('b', null, '+ ' + t('hand_' + p.hand)), h('span', null, t('empty')));
    }
    attrs.dataset.c = COLOUR[x.dept];
    if (!x.live) attrs.dataset.dark = '';
    attrs['aria-label'] = t('plugLabel', { id: slot, what: t('plugTitle', { dev: t('dev_' + x.device), w: x.w, a: A(x.amps) }) });
    return h('button', attrs,
      h('b', { class: x.live ? null : 'cl-dark' }, t('dev_' + x.device)),
      h('span', { class: 'cl-num' }, x.w + ' W · ' + A(x.amps) + ' A'),
      x.offPlan ? h('span', { class: 'cl-off' }, t('offPlan')) : null);
  }

  function fixedChip(s, x) {
    return h('div', { class: 'cl-chip sd-fill', dataset: x.live ? { c: COLOUR[x.dept] } : { c: COLOUR[x.dept], dark: '' } },
      h('b', { class: x.live ? null : 'cl-dark' }, t('dev_' + x.device)),
      h('span', { class: 'cl-num' }, x.w + ' W · ' + A(x.amps) + ' A'),
      h('span', null, t('fixed')));
  }

  function meter(s, c) {
    var scale = Math.max(1.5 * c.limitW, c.watts), left = 0;
    var segs = s.plugs.filter(function (x) { return x.circuit === c.id; }).map(function (x) {
      var w = 100 * x.w / scale, seg = h('div', {
        class: 'cl-seg sd-fill' + (x.live ? '' : ' sd-hatch'), dataset: { c: COLOUR[x.dept] },
        style: { left: left + '%', width: w + '%' }, translate: 'no'
      }, w >= 11 ? kW(x.w) + ' kW' : '');
      left += w;
      return seg;
    });
    var lim = 100 * c.limitW / scale;
    if (c.watts > c.limitW) segs.push(h('div', { class: 'cl-over sd-hatch', style: { left: lim + '%', width: (100 * c.watts / scale - lim) + '%' } }));
    segs.push(h('div', { class: 'cl-limit', style: { left: lim + '%' } }));
    return h('div', { class: 'cl-meter', role: 'img', 'aria-label': t('ofRating', { a: A(c.amps), r: c.rating }) }, segs);
  }

  function card(s, p, c) {
    var def = defOf(c.id), kids = [];
    s.plugs.filter(function (x) { return x.circuit === c.id && x.fixed; }).forEach(function (x) { kids.push(fixedChip(s, x)); });
    def.slots.forEach(function (slot) { kids.push(socket(s, p, slot)); });
    if (def.reel.length) {
      var drumW = s.plugs.filter(function (x) { return L.REEL_SLOTS.indexOf(x.slot) >= 0; }).reduce(function (a, x) { return a + x.w; }, 0);
      kids.push(h('div', { class: 'cl-chip cl-drumchip' + (c.tripped ? ' cl-dark' : '') }, h('span', null, t('drumChip', { kw: kW(drumW) }))));
    }
    var tripChanged = delta.trips.indexOf(c.id) >= 0;
    return h('section', { class: 'cl-card', dataset: c.tripped ? { tripped: '' } : {}, 'aria-label': t('room_' + c.room) },
      h('div', { class: 'cl-head' },
        h('span', null, h('span', { class: 'cl-room' }, t('room_' + c.room)), ' ', h('span', { class: 'cl-plan' }, t('planOf', { dept: t('dept_' + c.dept) }))),
        h('span', { class: 'cl-brk' + (c.tripped ? ' cl-trip' : '') + (tripChanged ? ' sd-changed' : '') },
          c.tripped ? '✕ ' + t('tripped') : t('breaker', { a: c.rating }))),
      h('div', { class: 'cl-socks' }, kids),
      meter(s, c),
      h('p', { class: 'cl-read' },
        h('span', { class: 'cl-a' }, t('ofRating', { a: A(c.amps), r: c.rating })),
        h('span', { class: 'cl-w' }, t('wattsOf', { w: c.watts, lim: c.limitW }))));
  }

  function drumPic(mode) {
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 40 40');
    svg.setAttribute('aria-hidden', 'true');
    var rings = mode === 'coiled' ? [18, 15, 12, 9, 6] : [6];
    rings.forEach(function (r) {
      var e = document.createElementNS(ns, 'circle');
      e.setAttribute('cx', '20'); e.setAttribute('cy', '20'); e.setAttribute('r', String(r));
      svg.appendChild(e);
    });
    var hub = document.createElementNS(ns, 'circle');
    hub.setAttribute('cx', '20'); hub.setAttribute('cy', '20'); hub.setAttribute('r', '3'); hub.setAttribute('class', 'cl-hub');
    svg.appendChild(hub);
    return svg;
  }

  function drum(s, p) {
    var r = s.reel, k = L.CABLE, c = circuitOf(s, r.circuit);
    var span = THERM_MAX - k.ambient;
    var fill = Math.max(0, Math.min(100, 100 * (r.temp - k.ambient) / span));
    var limitAt = 100 * (k.limit - k.ambient) / span;
    var verdict = c.tripped ? h('span', { class: 'cl-small' }, t('drumDark'))
      : h('span', { class: 'cl-verdict', dataset: { k: r.over ? 'over' : 'ok' } }, t(r.over ? 'drumOver' : 'drumOk', { limit: k.limit }));
    return h('section', { class: 'cl-card cl-drum', dataset: r.over ? { over: '' } : {}, 'aria-label': t('drumTitle') },
      h('span', { class: 'cl-room' }, t('drumTitle')),
      h('div', { class: 'cl-pic' }, drumPic(r.mode), r.mode === 'unwound' ? h('span', { class: 'cl-run' }) : null,
        h('span', { class: 'cl-mode' + (delta.reel ? ' sd-hl' : '') }, t('drumMode_' + r.mode))),
      h('div', { class: 'cl-socks' }, L.REEL_SLOTS.map(function (slot) { return socket(s, p, slot); })),
      h('div', null, h('span', null, t('drumNow', { a: A(r.amps) })), '  ', h('span', { class: 'cl-temp' }, t('tempScale', { t: T(r.temp) }))),
      h('div', { class: 'cl-therm', role: 'img', 'aria-label': t('tempScale', { t: T(r.temp) }) },
        h('div', { class: 'cl-fill' + (r.over ? ' sd-hatch' : ''), style: { width: fill + '%' } }),
        h('div', { class: 'cl-limit', style: { left: limitAt + '%' } })),
      h('div', { class: 'cl-scale' }, data(k.ambient + ' °C'), h('span', null, t('tempLimit', { limit: k.limit })), data(THERM_MAX + ' °C')),
      verdict,
      h('span', { class: 'cl-small' }, t('drumMax', { a: A(r.maxAmps), kw: kW(r.maxW) })));
  }

  function board(s) {
    return h('section', { class: 'cl-card cl-board', 'aria-label': t('board') },
      h('span', { class: 'cl-room cl-lock' }, t('board')),
      h('ul', null, s.circuits.map(function (c) {
        return h('li', null, h('span', { class: 'cl-sw', dataset: c.tripped ? { off: '' } : { on: '' } }, c.tripped ? '✕' : '▮'),
          h('span', null, data(c.rating + ' A'), ' ', c.tripped ? t('boardOff') : t('boardOn')));
      })),
      h('span', { class: 'cl-small' }, t('boardNote')));
  }

  // ── caption (SPEC.md "Legend and captions") ──

  function caption(c) {
    var s = c.state, p = c.params, out = [], trip = null;
    if (s.tripped.length) {
      var hit = delta.slots.length === 1 ? L.SLOT_CIRCUIT[delta.slots[0]] : null;
      trip = circuitOf(s, s.tripped.indexOf(hit) >= 0 ? hit : s.tripped[0]);
    }
    if (delta.slots.length === 1) {
      var slot = delta.slots[0], cid = L.SLOT_CIRCUIT[slot], ci = circuitOf(s, cid), x = plugAt(s, slot), dev = prevDevice(slot);
      if (x) out.push(t('capDev', { dev: t('dev_' + x.device), w: x.w, a: A(x.amps) }));
      else if (dev) out.push(t('capUnplug', { dev: t('dev_' + dev) }));
      if (!(trip && trip.id === cid)) out.push(t('capCirc', { room: t('room_' + ci.room), sum: A(ci.amps), r: ci.rating }));
    } else if (delta.slots.length > 1 && !s.plugs.some(function (x) { return !x.fixed; })) out.push(t('capUnplugAll'));
    if (delta.reel && !s.reel.watts) out.push(t('capReelMode', { mode: t('drumMode_' + s.reel.mode) }));
    delta.trips.forEach(function (id) {
      var ci = circuitOf(s, id);
      if (!ci.tripped) out.push(t('capReset', { room: t('room_' + ci.room) }));
    });

    if (trip) {
      out.push(t('capTrip', { room: t('room_' + trip.room), sum: A(trip.amps), r: trip.rating,
        depts: joinAnd(trip.dark.map(function (d) { return t('dept_' + d); })) }));
      if (trip.dark.indexOf('camera') >= 0) out.push(t('capCamera'));
      else if (trip.offPlan) out.push(t.n('capOffPlanN', trip.offPlan));
    } else if (s.reel.over) {
      var rc = circuitOf(s, s.reel.circuit);
      out.push(t('capReelOver', { temp: T(s.reel.temp), limit: L.CABLE.limit, a: A(rc.amps), r: rc.rating }));
    } else if (s.reel.watts > 0 && (delta.reel || delta.slots.some(function (x) { return L.REEL_SLOTS.indexOf(x) >= 0; }))) {
      out.push(t('capReelOk', { mode: t('drumMode_' + s.reel.mode), temp: T(s.reel.temp), limit: L.CABLE.limit }));
    } else if (out.length < 2 && s.plugs.some(function (x) { return !x.fixed; })) {
      var loaded = s.circuits.filter(function (ci) { return s.plugs.some(function (x) { return x.circuit === ci.id && !x.fixed; }); });
      var least = loaded.sort(function (a, b) { return a.headroomW - b.headroomW || (a.id < b.id ? -1 : 1); })[0];
      out.push(t('capOk', { kw: kW(s.totalW), room: t('room_' + least.room), spare: least.headroomW }));
    } else if (!out.length) out.push(t('capStart'));
    return out.join(' ');
  }

  /** The device a socket held before the last input (for "unplugged: …"). */
  var prevParams = null;
  function prevDevice(slot) { return prevParams ? prevParams[slot] : null; }

  var hidden = function () { return false; };
  var slotOptions = [['', t('empty')]].concat(L.PLUGGABLE.map(function (d) { return [d, t('dev_' + d)]; }));
  var params = [
    { key: 'hand', type: 'choice', label: t('hand'), hint: t('handHint'), options: L.PLUGGABLE.map(function (d) { return [d, t('hand_' + d)]; }) },
    { key: 'reel', type: 'choice', label: t('reel'), options: L.REEL_MODES.map(function (m) { return [m, t('reel_' + m)]; }) },
    { type: 'button', label: t('unplugAll'), key: 'u', run: function (sim) {
        var patch = {};
        L.SLOTS.forEach(function (id) { patch[id] = ''; });
        sim.set(patch);
      } }
  ].concat(L.SLOTS.map(function (id) {
    return { key: id, type: 'select', label: t('slotParam', { id: id }), options: slotOptions, visible: hidden };
  }));

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { c: 1, label: t('legLamp') },
      { c: 4, label: t('legMakeup') },
      { shape: 'cl-camera', label: t('legCamera') },
      { shape: 'cl-off', label: t('legOffPlan') },
      { shape: 'cl-trip', label: t('legTripped') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      if (!lastParams || !sameParams(lastParams, c.params)) prevParams = lastParams;
      track(c);
      var s = c.state, p = c.params;
      c.stage.replaceChildren(h('div', { class: 'cl' },
        h('p', { class: 'cl-top' }, data(t('formula'), 'cl-formula'), h('span', { class: 'cl-total' }, t.parts('total', { kw: h('b', null, kW(s.totalW)) }))),
        h('div', { class: 'cl-body' },
          h('div', { class: 'cl-circs' }, s.circuits.map(function (ci) { return card(s, p, ci); })),
          h('div', { class: 'cl-side' }, drum(s, p), board(s))),
        h('p', { class: 'cl-foot' }, t('foot'))));
      if (focusSlot) {
        var b = c.stage.querySelector('[data-slot="' + focusSlot + '"]');
        if (b) b.focus();
        focusSlot = null;
      }
    },
    caption: function (c) {
      track(c);
      return caption(c);
    }
  });
})();
</script>
</body>
</html>
