<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  function s(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    for (var k in attrs || {}) if (attrs[k] != null) el.setAttribute(k, attrs[k]);

  }
  function num(x, d) {

  function data(text, cls) { return h('span', { translate: 'no', class: 'sr-data' + (cls ? ' ' + cls : '') }, text); }

  }

  // ── circuits: coordinates in a 400 × 300 box; the SVG draws the lines, HTML the labels ──
  var W = 400, H = 300;
  function draw(parts, labels) {
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    parts.forEach(function (p) { svg.append(p); });
    var box = h('div', { class: 'sr-draw', style: { '--ar': W + ' / ' + H } }, svg);
    labels.forEach(function (l) {
      box.append(h('span', { class: 'sr-lbl' + (l.inside ? ' sr-in' : ''), translate: 'no', style: { left: (l.x / W * 100) + '%', top: (l.y / H * 100) + '%' } }, l.text));
    });
    return h('div', { class: 'sr-circ' }, box);
  }
  function line(x1, y1, x2, y2, cls) { return s('line', { x1: x1, y1: y1, x2: x2, y2: y2, class: cls || 'sr-wire' }); }
  function fet(cx, cy, on) { return s('rect', { x: cx - 24, y: cy - 15, width: 48, height: 30, rx: 4, class: 'sr-fet' + (on ? ' sr-on' : '') }); }

  function sramCircuit(S) {
    var wl = S.wl ? ' sr-on' : '';
    var bl = S.bl !== 'pre' ? ' sr-on' : '', blb = S.blb !== 'pre' ? ' sr-on' : '';
    var node = function (q) { return 'sr-node' + (q === null ? ' sr-unk' : q ? ' sr-one' : ''); };
    var qb = S.q === null ? null : 1 - S.q;
    var parts = [
      line(110, 28, 290, 28, 'sr-rail'), line(110, 272, 290, 272, 'sr-rail'),
      // left inverter P1 over N1, right inverter P2 over N2
      line(135, 28, 135, 57), line(135, 87, 135, 145), line(135, 175, 135, 272),
      line(265, 28, 265, 57), line(265, 87, 265, 145), line(265, 175, 265, 272),
      // cross-coupling: Q drives the gates of P2/N2, Q̄ those of P1/N1
      line(241, 72, 241, 160), line(159, 72, 159, 160),
      line(135, 116, 241, 140), line(265, 116, 159, 140),
      // access transistors N3, N4 between Q / Q̄ and the bitlines
      line(60, 116, 135, 116), line(60, 116, 60, 191), line(265, 116, 340, 116), line(340, 116, 340, 191),
      line(36, 206, 22, 206), line(364, 206, 378, 206),
      line(60, 221, 60, 240), line(340, 221, 340, 240),
      s('path', { d: 'M 22 240 H 378', class: 'sr-wl' + wl }),
      line(22, 150, 22, 290, 'sr-bl' + bl), line(378, 150, 378, 290, 'sr-bl' + blb),
      fet(135, 72), fet(135, 160), fet(265, 72), fet(265, 160), fet(60, 206, S.wl), fet(340, 206, S.wl),
      s('circle', { cx: 135, cy: 116, r: 9, class: node(S.q) }), s('circle', { cx: 265, cy: 116, r: 9, class: node(qb) })
    ];
    return draw(parts, [
      { x: 200, y: 12, text: 'V_DD' }, { x: 200, y: 288, text: 'GND' },
      { x: 135, y: 72, text: 'P1', inside: true }, { x: 135, y: 160, text: 'N1', inside: true },
      { x: 265, y: 72, text: 'P2', inside: true }, { x: 265, y: 160, text: 'N2', inside: true },
      { x: 60, y: 206, text: 'N3', inside: true }, { x: 340, y: 206, text: 'N4', inside: true },

    var parts = [
      line(150, 20, 150, 100, 'sr-bl' + (D.bl !== 'pre' ? ' sr-on' : '')),
      s('path', { d: 'M 30 117 H 119', class: 'sr-wl' + (D.wl ? ' sr-on' : '') }),

      line(110, 240, 190, 240, 'sr-rail'),
      s('rect', { x: 120, y: 100, width: 60, height: 34, rx: 4, class: 'sr-fet' + (D.wl ? ' sr-on' : ''), style: '--sw: var(--c2)' }),
      line(150, 50, 260, 50, 'sr-wire'),
      s('rect', { x: 260, y: 26, width: 110, height: 48, rx: 6, class: 'sr-sa' + (D.sa !== null ? ' sr-on' : '') })
    ];
    return draw(parts, [
      { x: 150, y: 10, text: 'BL' }, { x: 60, y: 100, text: 'WL' }, { x: 150, y: 117, text: 'N', inside: true },
      { x: 225, y: 185, text: 'C_s' }, { x: 150, y: 258, text: 'V_DD/2' },
      { x: 315, y: 50, text: D.sa === null ? 'SA' : 'SA → ' + D.sa, inside: true }
    ]);
  }

  // ── the two cells ──
  function row(label, value, cls) { return h('div', { class: 'sr-row' }, h('span', null, label), h('span', { class: cls || '' }, value)); }

  function sramCell(c) {
    var S = c.state.sram, ev = c.state.ev, wrote = ev && ev.op === 'write';
    return h('div', { class: 'sr-cell', style: { '--sw': 'var(--c1)' } },
      h('div', { class: 'sr-head' }, h('span', { class: 'sr-mark sr-round', 'aria-hidden': 'true' }), t('sramTitle')),
      sramCircuit(S),
      h('div', { class: 'sr-read' },
        h('div', { class: 'sr-key' },
          h('span', { class: 'sr-small' }, t('stored')),
          h('span', { class: 'sr-big' + changed(wrote && ev.sram.was !== S.q), translate: 'no' }, 'Q = ' + (S.q === null ? '?' : S.q)),
          h('span', { class: 'sr-small' }, S.q === null ? t('noValue') : t('holds'))),
        h('div', { class: 'sr-rows' },
          h('span', { class: 'sr-small' }, t('latchSub')),

          row(data('BL'), level(S.bl)),
          row(data('BL̄'), level(S.blb)))));
  }

    var D = c.state.dram, ev = c.state.ev, lost = L.lost(D);

    var read = ev && (ev.op === 'read' || ev.op === 'refresh');
    var fillEl = h('div', { class: 'sr-level', style: { height: Math.max(0, Math.min(100, D.charge)) + '%' } });
    return h('div', { class: 'sr-cell' + (lost ? ' sr-lost sd-hatch' : ''), style: { '--sw': 'var(--c2)' } },
      h('div', { class: 'sr-head' }, h('span', { class: 'sr-mark', 'aria-hidden': 'true' }), t('dramTitle'),
        lost ? h('span', { class: 'sr-tag' }, t('lost')) : null),
      dramCircuit(D),
      h('div', { class: 'sr-read' },
        h('div', { class: 'sr-key' },
          h('span', { class: 'sr-small' }, t('charge')),
          h('div', { class: 'sr-gauge' },
            h('div', { class: 'sr-tank', 'aria-hidden': 'true' }, fillEl, h('div', { class: 'sr-mid' })),
            h('span', { class: 'sr-big' + changed(moved), translate: 'no' }, pct(D.charge)))),
        h('div', { class: 'sr-rows' },
          row(t('written'), data(D.bit === null ? '?' : String(D.bit))),
          row(t('since'), data(ms(D.since))),
          row(t('dv'), read ? data(mv(ev.dram.dv)) : t('noDv'), read ? 'sd-hl' : ''),
          row(t('senseAmp'), D.sa === null ? t('saOff') : t('saSensed', { bit: String(D.sa) })))));
  }

  // ── charge over time ──
  function drawChart(box, trace, n) {
    var Wp = box.clientWidth, Hp = box.clientHeight;
    if (!Wp || !Hp) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 3.6 * rem, r: 1 * rem, t: 0.6 * rem, b: 1.8 * rem };
    var cw = Wp - pad.l - pad.r, ch = Hp - pad.t - pad.b;
    var T = 4 * L.WAIT;
    var X = function (ms) { return pad.l + ms / T * cw; };
    var Y = function (c) { return pad.t + (1 - c / 100) * ch; };
    var svg = s('svg', { width: Wp, height: Hp, role: 'img', 'aria-label': t('chartTitle') });
    [0, 50, 100].forEach(function (c) {
      svg.append(s('line', { class: 'sr-grid', x1: pad.l, x2: pad.l + cw, y1: Y(c), y2: Y(c) }));
      var tx = s('text', { x: pad.l - 0.4 * rem, y: Y(c) + 0.35 * rem, 'text-anchor': 'end' });
      tx.textContent = c + ' %';
      svg.append(tx);

      svg.append(tick);
    }
    svg.append(s('line', { class: 'sr-win', x1: X(L.WINDOW), x2: X(L.WINDOW), y1: pad.t, y2: pad.t + ch }));
    var win = s('text', { x: X(L.WINDOW) + 0.4 * rem, y: pad.t + 1 * rem });
    win.textContent = t('window');
    svg.append(win);
    svg.append(s('line', { class: 'sr-thr', x1: pad.l, x2: pad.l + cw, y1: Y(50), y2: Y(50) }));
    var thr = s('text', { x: pad.l + cw - 0.3 * rem, y: Y(50) - 0.4 * rem, 'text-anchor': 'end' });
    thr.textContent = 'V_DD/2: ' + t('threshold');
    svg.append(thr);
    svg.append(s('line', { class: 'sr-axis', x1: pad.l, x2: pad.l, y1: pad.t, y2: pad.t + ch }));
    svg.append(s('line', { class: 'sr-axis', x1: pad.l, x2: pad.l + cw, y1: pad.t + ch, y2: pad.t + ch }));
    var d = trace.map(function (p, i) { return (i ? 'L ' : 'M ') + X(p.t).toFixed(1) + ' ' + Y(p.charge).toFixed(1); }).join(' ');
    svg.append(s('path', { class: 'sr-curve', d: d }));
    var last = trace[trace.length - 1];
    svg.append(s('circle', { class: 'sr-dot', cx: X(last.t), cy: Y(last.charge), r: 0.45 * rem }));
    box.replaceChildren(svg);
  }

  // ── comparison table ──
  function table() {
    var cols = [t('paramCol'), t('sramCol'), t('dramCol')];
    var head = h('tr', null,
      h('th', null, cols[0]),
      h('th', null, h('span', { class: 'sr-colhead' }, h('span', { class: 'sr-mark sr-round', style: { '--sw': 'var(--c1)' } }), cols[1])),
      h('th', null, h('span', { class: 'sr-colhead' }, h('span', { class: 'sr-mark', style: { '--sw': 'var(--c2)' } }), cols[2])));
    var rows = [];
    for (var i = 1; i <= 16; i++) {
      var cells = t('cmp' + i).split(' | ');
      rows.push(h('tr', null, cells.map(function (x, k) { return h('td', { dataset: k ? { k: cols[k] } : null }, x); })));
    }
    return h('div', { class: 'sr-tablebox' }, h('table', { class: 'sr-table' }, h('thead', null, head), h('tbody', null, rows)));
  }

  function opName(st) {
    var e = st.ev;
    if (!e) return t('opStart');
    if (e.op === 'write') return t('opWrite', { bit: String(e.bit) });
    if (e.op === 'wait') return t('opWait', { ms: String(L.WAIT) });
    return t({ read: 'opRead', restore: 'opRestore', refresh: 'opRefresh', skip: 'opSkip' }[e.op]);
  }

  var sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'view', type: 'choice', label: t('view'), options: [['cells', t('viewCells')], ['table', t('viewTable')]] },
      { key: 'bit', type: 'choice', label: t('bit'), options: [['1', '1'], ['0', '0']] },
      { key: 'refresh', type: 'toggle', label: t('refresh'), hint: t('refreshHint') }
    ],

    presets: [
      { id: 'refresh', label: t('presetRefresh'), hint: t('presetRefreshHint'), params: { bit: '1', refresh: true } },
      { id: 'no-refresh', label: t('presetNoRefresh'), hint: t('presetNoRefreshHint'), params: { bit: '1', refresh: false } },
      { id: 'zero', label: t('presetZero'), hint: t('presetZeroHint'), params: { bit: '0', refresh: false } },
      { id: 'table', label: t('presetTable'), params: { view: 'table' } }
    ],

    legend: [
      { c: 1, shape: 'round', label: t('legendSram') },
      { c: 2, label: t('legendDram') },
      { shape: 'hl', label: t('legendChanged') },
      { shape: 'hollow', label: t('legendLost') }
    ],

    render: function (c) {
      var st = c.state;
      var top = h('div', { class: 'sr-top' },
        h('span', { class: 'sr-time', translate: 'no' }, 't = ' + ms(st.t)),
        h('span', { class: 'sr-op' + changed(c.n > 0) }, opName(st)));
      if (c.params.view === 'table') { c.stage.replaceChildren(h('div', { class: 'sr' }, top, table())); return; }
      var chart = h('div', { class: 'sr-chart' });
      c.stage.replaceChildren(h('div', { class: 'sr' }, top, h('div', { class: 'sr-cells' }, sramCell(c), dramCell(c)), chart));
      drawChart(chart, st.trace, c.n);
    },

    caption: function (c) {
      var st = c.state, e = st.ev, S = st.sram, D = e && e.dram;
      if (!e) return t.parts('captionStart', { bit: bold(c.params.bit) });
      var sp = function (key, v) { return t.parts(key, v); };
      var out = [];
      var add = function (parts) { if (out.length) out.push(' '); out = out.concat(parts); };
      var bitOf = bold(String(st.dram.bit));
      if (e.op === 'write') {
        var b = e.bit;
        add(sp(e.sram.was !== null && e.sram.was !== b ? 'captionWriteSramFlip' : 'captionWriteSram',
          { bl: bold(b ? 'V_DD' : 'GND'), blb: bold(b ? 'GND' : 'V_DD'), bit: bold(String(b)) }));
        add(sp('captionWriteDram', { bl: bold(b ? 'V_DD' : 'GND'), after: bold(pct(D.after)) }));
      } else if (e.op === 'read') {
        add(sp('captionReadSram', { q: bold(String(S.q)), read: bold(String(e.sram.read)) }));
        add(sp('captionReadDram', { dv: bold(mv(D.dv)), sensed: bold(String(D.sensed)), after: bold(pct(D.after)) }));
        if (D.wrong) add([h('span', { class: 'sd-hl' }, sp('captionReadWrong', { bit: bitOf }))]);
      } else if (e.op === 'restore') {
        if (D.wrong) add([h('span', { class: 'sd-hl' }, sp('captionRestoreWrong', { sensed: bold(String(D.sensed)) }))]);
        else add(sp('captionRestoreDram', { sensed: bold(String(D.sensed)), after: bold(pct(D.after)) }));
        add(sp('captionRestoreSram', {}));
      } else if (e.op === 'wait') {
        add(sp('captionWaitSram', { ms: bold(String(L.WAIT)), q: bold(String(S.q)) }));
        if (D.before === 0 && D.after === 0) add(sp('captionWaitEmpty', { after: bold(pct(D.after)) }));
        else add(sp('captionWaitDram', { before: bold(pct(D.before)), after: bold(pct(D.after)), since: bold(ms(st.dram.since)) }));
        if (D.overdue) add(sp('captionOverdue', {}));
      } else if (e.op === 'refresh') {
        add(sp('captionRefresh', { sensed: bold(String(D.sensed)), before: bold(pct(D.before)), after: bold(pct(D.after)) }));
      } else {
        add(sp('captionSkip', { before: bold(pct(D.before)) }));
      }
      return out;
    }
  });

  // The chart is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var r = es[0].contentRect, key = Math.round(r.width) + 'x' + Math.round(r.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
