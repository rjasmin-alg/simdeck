<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { STA: '1', SW: '2', AS: '3' };

  /** Data (message and attribute names, the identity, VLAN and UDP numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'ax-mono' : cls || null }, text); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function wifi(s) { return s.medium === 'wifi'; }

  // ── lane cards ──
  function kv(pairs) {
    return h('dl', { class: 'ax-kv' }, pairs.map(function (p) { return [h('dt', null, p[0]), h('dd', null, p[1])]; }));
  }
  function gate(s, changed) {
    var open = s.port === 'authorized';
    return h('span', { class: 'ax-port' + (changed ? ' sd-changed' : '') },
      h('span', { class: 'ax-gate', dataset: open ? { open: '' } : {}, 'aria-hidden': 'true' }),
      open ? h('span', null, t('portOpen'), ' · ', data('VLAN ' + s.vlan, '')) : h('span', null, t('portClosed')));
  }
  function lanes(s) {
    var tls = s.method === 'tls', wrong = s.credentials === 'wrong';
    var cred = h('span', { class: wrong ? 'ax-bad' : null }, data('••••••', ''), ' ',
      t(tls ? (wrong ? 'certWrong' : 'certOk') : (wrong ? 'credWrong' : 'credOk')), wrong ? ' ✕' : null);
    var portChanged = s.changed.indexOf('port') >= 0;
    return [
      { id: 'STA', c: COLOUR.STA, shape: 'square', name: t('sta'), tags: h('span', { class: 'ax-role' }, rich('staRole')),
        body: kv([[t('kId'), data(L.USER, '')], [t(tls ? 'kCert' : 'kPass'), cred]]) },
      { id: 'SW', c: COLOUR.SW, name: t(wifi(s) ? 'ap' : 'sw'), tags: h('span', { class: 'ax-role' }, t('swRole')), changed: portChanged,
        body: kv([[t('kPort'), gate(s, portChanged)], [t('kSecret'), t('swNoSecret')]]) },
      { id: 'AS', c: COLOUR.AS, name: t('as'), state: s.server ? null : 'down',
        tags: s.server ? h('span', { class: 'ax-role' }, t('asRole')) : h('span', { class: 'ax-down' }, t('asDown')),
        body: kv([[t('kUser'), h('span', null, data(L.USER, ''), ' ', t('userRule', { vlan: L.VLAN }))],
          [t('kUdp'), t('udpRule', { auth: L.UDP_AUTH, acct: L.UDP_ACCT })]]) }
    ];
  }

  // ── chart rows ──
  var AAA_WORD = { I: 'aI', A1: 'aA1', A2: 'aA2', A3: 'aA3' };
  /** Rule 6 / SPEC, "AAA marks per message". */
  function aaaOf(m) {
    if (m.round === 'identity' && m.eap === 'Response') return 'I';
    if (m.round && m.round !== 'identity') return 'A1';
    if (m.name === 'Access-Accept' || m.name === 'Access-Reject') return 'A2';
    if (/^Accounting/.test(m.name)) return 'A3';
    return null;
  }
  function aaaCell(k, bad) {
    if (!k) return null;
    return h('span', { class: 'ax-aaa', dataset: bad ? { bad: '' } : {} },
      h('span', { class: 'ax-badge', translate: 'no', dataset: { k: k.charAt(0) }, 'aria-hidden': 'true' }, k.charAt(0)),
      t(AAA_WORD[k]), bad ? h('span', null, '\u00a0✕') : null);
  }
  function fieldsOf(s, m) {
    if (m.round) {
      // RADIUS rows name only what they carry; what is inside is on the EAPOL row beside them (rule 2)
      return m.proto === 'RADIUS' ? data('EAP', '') : h('span', null, t('r_' + m.round));
    }
    if (m.name === 'Access-Accept') {
      return h('span', null, t('fVlan', { vlan: L.VLAN }), m.attrs.some(function (a) { return a.name === 'PMK'; }) ? [' · ', data('PMK', '')] : null);
    }
    if (m.name === 'Access-Reject') return data('EAP-Failure', '');
    if (m.name === 'Accounting-Request') return data('Start · UDP ' + m.udp, '');
    if (m.name === '4-way handshake') return t('fHandshake');
    return null;
  }
  function rows(s, cur) {
    var out = [], shown = {};
    var items = s.msgs.map(function (m) { return { m: m }; }).concat(s.notes.map(function (x) { return { note: x }; }));
    items.sort(function (a, b) { return (a.m || a.note).step - (b.m || b.note).step || (a.m ? 0 : 1) - (b.m ? 0 : 1); });
    items.forEach(function (it) {
      var x = it.m || it.note, changed = x.step === cur;
      var time = shown[x.step] ? null : String(x.step);
      shown[x.step] = true;
      if (it.note) {
        var key = { linkUp: 'noteLinkUp', associated: 'noteAssociated', portUp: 'notePortUp', noReply: 'noteNoReply' }[x.what];
        out.push({ kind: 'note', lane: x.lane, text: t(key, { vlan: L.VLAN }), k: x.what === 'noReply' ? 'fill' : x.what === 'portUp' ? 'solid' : null,
          time: time, changed: changed, down: s.server ? null : ['AS'], ref: x.what });
        return;
      }
      var m = x, re = {};
      if (m.dropped) re.SW = t('reDropped');
      else if (m.proto === 'DHCP') re.SW = t('rePasses', { vlan: L.VLAN });
      if (m.verdict === 'ok') re.AS = t('reOk');
      if (m.verdict === 'wrong') re.AS = t(s.method === 'tls' ? 'reWrongCert' : 'reWrongPass');
      var aaa = aaaOf(m);
      out.push({
        from: m.from, to: m.to, label: m.name === '4-way handshake' ? h('span', null, Simdeck.term('4-way handshake', { later: true })) : m.name,
        c: COLOUR[m.from], fields: fieldsOf(s, m),
        line: m.proto === 'RADIUS' ? 'dashed' : m.proto === 'DHCP' ? 'dotted' : null,
        weight: m.name === 'Accounting-Response' ? 'thin' : null,
        lost: m.dropped ? ['SW'] : m.lost ? ['AS'] : null,
        re: re, time: time, changed: changed,
        cause: m.retry ? t('causeRetry') : null,
        down: s.server ? null : ['AS'],
        seen: aaaCell(aaa, m.verdict === 'wrong' || m.name === 'Access-Reject'),
        ref: m.lost && !m.retry ? 'firstLost' : null
      });
    });
    return out;
  }
  function timers(rs) {
    var from = -1, to;
    rs.forEach(function (r, i) {
      if (r.ref === 'firstLost') from = i;
      if (r.ref === 'noReply') to = i;
    });
    if (from < 0) return [];
    return [{ lane: 'SW', from: from, to: to, label: t('timerWait'), end: to === undefined ? null : 'expired' }];
  }

  // ── the strip: the book's four steps ──
  var STRIP = [['identified', 'aI', 'sI', 'I'], ['authenticated', 'aA1', 'sA1', 'A'], ['authorized', 'aA2', 'sA2', 'A'], ['accounted', 'aA3', 'sA3', 'A']];
  function statusOf(s, key) {
    var v = s.aaa[key];
    if (v) return v.ok ? { st: 'done', text: t('stDone', { n: v.step }), mark: '✓' }
      : { st: 'fail', text: t(key === 'authorized' ? 'stDenied' : 'stFailed', { n: v.step }), mark: '✕' };
    if (s.outcome === 'noReply' && key !== 'identified') return { st: 'never', text: t('stNoServer'), mark: '–' };
    if (s.outcome === 'rejected' && key === 'accounted') return { st: 'never', text: t('stNever'), mark: '–' };
    return { st: 'wait', text: t('stWait'), mark: '…' };
  }
  function strip(s) {
    var boxes = STRIP.map(function (x) {
      var st = statusOf(s, x[0]);
      var changed = s.changed.indexOf('aaa.' + x[0]) >= 0 || (s.outcome && s.last && (s.last.did === 'timeout' || s.last.did === 'failure') && st.st === 'never');
      return h('div', { class: 'ax-box' + (changed ? ' sd-changed' : ''), dataset: { st: st.st } },
        h('span', { class: 'ax-mark', 'aria-hidden': 'true' }, st.mark),
        h('h3', null, h('span', { class: 'ax-badge', translate: 'no', dataset: { k: x[3] }, 'aria-hidden': 'true' }, x[3]), t(x[1])),
        h('p', null, t(x[2]), ' · ', h('strong', null, st.text)));
    });
    return h('section', { class: 'ax-strip' },
      h('div', { class: 'ax-bracket' }, h('strong', { translate: 'no' }, t('stripAaa')), h('span', null, rich('stripAaaLong'))), boxes);
  }

  // ── render ──
  function render(c) {
    var s = c.state, cur = c.n > 0 && s.last ? s.last.step : -1;
    var rs = rows(s, cur);
    var el = Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(s),
      rows: rs.map(function (r) { var o = Object.assign({}, r); delete o.ref; return o; }),
      timers: timers(rs),
      timeWidth: s.server ? '2.6rem' : '5.4rem',     // room for the retry badge
      eve: { title: t('aaaTitle'), width: '11.5rem' },
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
    c.stage.replaceChildren(h('div', { class: 'ax' }, el, strip(s)));
    el.fit();
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = c.params;
    if (!s.last) return rich('capStart');
    var did = s.last.did, round = /^round(\d)$/.exec(did);
    if (round) {
      var r = +round[1], m = L.METHODS[s.method];
      var out = rich('capRound', { r: r, of: m.rounds.length }).concat(' ', rich('capRound_' + s.method + r));
      if (r === m.check) out = out.concat(' ', rich(s.credentials === 'wrong' ? 'capCheckWrong' : 'capCheckOk'));
      return out;
    }
    switch (did) {
      case 'link': return rich(wifi(s) ? 'capAssociated' : 'capLink');
      case 'dhcpDrop': return rich(c.n === 2 ? 'capDhcpDrop' : 'capDhcpAgain');
      case 'reqId': return rich(wifi(s) ? 'capReqIdAp' : 'capReqId');
      case 'respId': return rich('capRespId', { user: data(L.USER) });
      case 'accessReq': return rich(s.method === 'tls' ? 'capAccessReqCert' : 'capAccessReq', { who: t(wifi(s) ? 'whoAp' : 'whoSw') }).concat(' ',
        p.server ? rich('capAccessReqTail', { udp: data(String(L.UDP_AUTH)) }) : rich('capAccessReqLost'));
      case 'retry': return rich('capRetry');
      case 'timeout': return rich('capTimeout');
      case 'accept': return rich('capAccept', { vlan: data(String(L.VLAN)) }).concat(wifi(s) ? [' '].concat(rich('capAcceptPmk')) : []);
      case 'reject': return rich('capReject');
      case 'success': return rich('capSuccess');
      case 'failure': return rich('capFailure');
      case 'portUp': return rich('capPortUp', { vlan: data(String(L.VLAN)) });
      case 'handshake': return rich('capHandshake', { vlan: data(String(L.VLAN)) });
      case 'dhcpPass': return rich('capDhcpPass', { vlan: data(String(L.VLAN)) });
      case 'acct': return rich('capAcct', { udp: data(String(L.UDP_ACCT)) });
      default: return [];
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'medium', type: 'choice', label: t('medium'), resets: true, options: [['wired', t('mWired')], ['wifi', t('mWifi')]] },
      { key: 'credentials', type: 'choice', label: t('credentials'), resets: true, options: [['correct', t('cCorrect')], ['wrong', t('cWrong')]] },
      { key: 'server', type: 'toggle', label: t('server'), hint: t('serverHint'), resets: true },
      { key: 'method', type: 'choice', label: t('method'), resets: true, options: [['peap', 'PEAP'], ['tls', 'EAP-TLS']] }
    ],

    presets: [
      { id: 'book', label: t('presetBook'), params: {}, hint: t('presetBookHint') },
      { id: 'reject', label: t('presetReject'), params: { credentials: 'wrong' }, hint: t('presetRejectHint') },
      { id: 'server-down', label: t('presetDown'), params: { server: false }, hint: t('presetDownHint') },
      { id: 'wifi', label: t('presetWifi'), params: { medium: 'wifi' }, hint: t('presetWifiHint') }
    ],

    legend: [
      { shape: 'line', label: t('legEapol') },
      { shape: 'dash', label: t('legRadius') },
      { shape: 'ax-dot', label: t('legOther') },
      { shape: 'ax-x', label: t('legDropped') },
      { shape: 'ax-gate', label: t('legGate') },
      { shape: 'ax-badge', label: t('legBadge') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
