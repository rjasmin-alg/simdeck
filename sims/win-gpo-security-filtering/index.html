<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PC = 'PC07', GPO = 'Sales Drive Maps', OU = 'OU=Staff';
  var PRESET_WORDS = {
    'default': 'presetDefault', 'sales-only-broken': 'presetSalesBroken', 'sales-fixed': 'presetSalesFixed',
    'deny-managers': 'presetDenyManagers', 'wmi-laptops': 'presetWmi'
  };
  var CHECK_WORDS = { scope: 'chkScope', pcRead: 'chkPcRead', allow: 'chkAllow', deny: 'chkDeny', wmi: 'chkWmi' };
  var RESULT_WORDS = { inaccessible: 'resInaccessible', security: 'resSecurity', wmi: 'resWmi', scope: 'resScope' };

  /** Data (GPO, group, user, computer names, the query) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sentence(key, vars) { return [' '].concat(rich(key, vars)); }
  /** "a, b and c" over strings, as one data node. */
  function names(items) {
    if (!items.length) return h('span', null, t('nobody'));
    items = items.slice();
    if (items.length === 1) return data(items[0]);
    var last = items.pop();
    var head = items.reduce(function (acc, it) { return acc === null ? it : t('listMore', { a: acc, b: it }); }, null);
    return h('span', null, t.parts('list2', { a: data(head), b: data(last) }));
  }
  function userOf(name) { return L.USERS.filter(function (u) { return u.name === name; })[0]; }
  function verdictOf(d) {
    return Simdeck.ruleTable.verdict(d.applied, t(d.applied ? 'resApplied' : RESULT_WORDS[d.reason]));
  }

  // ── left: GPO, computer, WMI filter ──

  function renderSide(c) {
    var s = c.state, pc = s.pc;
    var admin = s.event === 'admin';
    var gpo = h('section', { class: 'sf-card' },
      h('div', { class: 'sf-head' }, h('span', { class: 'sf-kind' }, t('gpoKind')), data(GPO)),
      h('div', { class: 'sf-line' }, t('gpoUser'), ' ', data('S: → \\\\FS01\\Sales')),
      h('div', { class: 'sf-line' }, t.parts('linkedTo', { ou: data(OU) })));
    var comp = h('section', { class: 'sf-card' },
      h('div', { class: 'sf-head' }, h('span', { class: 'sf-kind' }, t('pcKind')), data(pc.name)),
      h('div', { class: 'sf-line' }, t(pc.chassis === 3 ? 'pcDesktop' : 'pcLaptop')),
      h('div', { class: 'sf-line' }, t('pcToken'), ' ', data(L.pcToken(pc).join(', '))));
    var wmi;
    if (!s.wmi) wmi = h('section', { class: 'sf-card sf-off' }, h('div', { class: 'sf-head' }, t('wmiTitle')), h('div', { class: 'sf-line' }, t('wmiNone')));
    else {
      var ok = s.wmi.chassis.indexOf(pc.chassis) >= 0;
      wmi = h('section', { class: 'sf-card' + (admin ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : '') },
        h('div', { class: 'sf-head' }, t('wmiTitle'), data(s.wmi.name)),
        data(s.wmi.query, 'sf-query'),
        h('div', { class: 'sf-line' }, t.parts('wmiOn', { pc: data(pc.name) }), ' ',
          h('span', { class: 'sf-wmival' }, Simdeck.ruleTable.verdict(ok, t(ok ? 'wmiTrue' : 'wmiFalse')))));
    }
    return h('div', { class: 'sf-side' }, gpo, comp, wmi);
  }

  // ── right: the delegation list as a rule table ──

  /** A note under a row's mark: who the row matches and for which right (the name is data). */
  function noteTag(key, who) { return h('span', { class: 'sd-rt-tag', dataset: { k: 'muted' } }, t.parts(key, { who: data(who) })); }

  function renderTable(c) {
    var s = c.state, admin = s.event === 'admin';
    var name = s.cursor >= 0 ? s.targets[s.cursor] : null;
    var d = name ? s.results[name] : null;
    var u = name ? userOf(name) : null;
    var pt = L.pcToken(s.pc), ut = u ? L.userToken(u) : [];
    var denied = d && d.reason === 'security' && d.path[3].pass === false;
    function yes(v) { return v ? '✓' : '–'; }
    return Simdeck.ruleTable({
      dir: c.dir,
      mode: 'deny',
      title: h('span', null, t('tableTitle'), ' · ', data(GPO)),
      columns: [{ key: 'who', label: t('colPrincipal') }, { key: 'read', label: t('colRead') }, { key: 'apply', label: t('colApply') }],
      actionLabel: t('colType'),
      markLabel: name ? t.parts('colMark', { user: data(name), pc: data(PC) }) : t('colMarkNone'),
      rows: s.rows.map(function (r, i) {
        var removed = r.status === 'removed';
        var tags = null;
        if (admin && r.status !== 'kept') tags = [{ k: 'hl', text: t(removed ? 'tagRemoved' : 'tagAdded') }];
        var mark = removed && !admin ? 'skip' : null, note = null;
        if (d && !removed) {
          var forPc = pt.indexOf(r.principal) >= 0 && r.read, forUser = ut.indexOf(r.principal) >= 0 && (r.read || r.apply);
          var who = [];
          if (forPc) who.push(noteTag(r.deny ? 'noteDeny' : 'noteRead', PC));
          if (forUser) who.push(noteTag(r.deny ? 'noteDeny' : r.read && r.apply ? 'noteBoth' : r.read ? 'noteRead' : 'noteApply', name));
          if (r.deny && forUser && denied) mark = 'win';
          else if (forUser && denied) mark = 'beaten';
          else if (forPc || forUser) mark = 'hit';
          else mark = 'no';
          note = who.length ? who : null;
        }
        return {
          no: i + 1,
          cells: { who: r.principal, read: yes(r.read), apply: yes(r.apply) },
          action: r.deny ? h('span', { class: 'sf-deny' }, h('span', { class: 'sf-noentry', 'aria-hidden': 'true' }), t('typeDeny')) : h('span', null, t('typeAllow')),
          effect: r.deny ? 'deny' : 'allow',
          hit: null,
          mark: mark,
          tags: tags,
          note: note
        };
      }),
      at: d ? 'all' : -1,
      done: !!denied,
      changed: false,
      outcome: function () { return Simdeck.ruleTable.verdict(false, t('resSecurity')); },
      words: { hit: t('markHit'), win: t('markWin'), beaten: t('markBeaten'), skip: t('markSkip') }
    });
  }

  // ── below: the decision path per user ──

  function renderPath(c) {
    var s = c.state;
    var cells = [h('div', { class: 'sf-th' }, t('colUser'))];
    L.CHECKS.forEach(function (id, i) {
      cells.push(h('div', { class: 'sf-th' }, h('span', { class: 'sf-num', translate: 'no' }, String(i + 1)),
        id === 'pcRead' ? t.parts('chkPcRead', { pc: data(PC) }) : t(CHECK_WORDS[id])));
    });
    cells.push(h('div', { class: 'sf-th' }, t('colResult')));
    s.targets.forEach(function (name, k) {
      var u = userOf(name), d = s.results[name], now = k === s.cursor && s.event === 'target';
      var rowCls = now ? ' sf-row-now' : '';
      cells.push(h('div', { class: 'sf-user' + rowCls }, data(name),
        h('small', null, u.groups.length ? data(u.groups.join(', ')) : t('noGroups'))));
      var prev = null;
      L.CHECKS.forEach(function (id, i) {
        var chk = d ? d.path[i] : null;
        var st = !chk ? 'pending' : chk.pass === true ? 'pass' : chk.pass === false ? 'stop' : 'unreached';
        var via = null;
        if (chk && chk.pass !== null) {
          if (id === 'wmi' && !chk.via.length) via = t('noFilter');
          else if (id === 'scope') via = data(chk.via.join(', '));
          else if (id === 'wmi') via = h('span', null, t(chk.pass ? 'wmiTrue' : 'wmiFalse'));
          else if (chk.via.length) via = data(chk.via.join(', '));
          else if (!chk.pass) via = t('nobody');
        } else if (st === 'unreached') via = t('notReached');
        cells.push(h('div', { class: 'sf-chk' + rowCls, dataset: { st: st, from: prev || 'none' } },
          h('span', { class: 'sf-dia', dataset: { st: st }, 'aria-hidden': 'true' }, h('span', null, st === 'pass' ? '✓' : st === 'stop' ? '✕' : '')),
          via != null ? h('span', { class: 'sf-via' }, via) : null));
        prev = st;
      });
      cells.push(h('div', { class: 'sf-res' + rowCls + (now ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : '') },
        d ? verdictOf(d) : h('span', { class: 'sf-wait' }, t('resWaiting'))));
    });
    return h('section', { class: 'sf-path' }, h('h2', null, t.parts('pathTitle', { pc: data(PC) })), h('div', { class: 'sf-grid' }, cells));
  }

  // ── captions ──

  function captionAdmin(p) {
    var out = rich('capAdmin');
    if (p.aclMode === 'sales') out = out.concat(sentence('capAdminSales'));
    if (p.aclMode === 'sales-dc') out = out.concat(sentence('capAdminSalesDc'));
    if (p.denyManagers) out = out.concat(sentence('capAdminDeny'));
    if (p.wmi === 'laptops') out = out.concat(sentence('capAdminWmi', { wmi: data(L.LAPTOPS.name) }));
    return out;
  }

  function captionTarget(c) {
    var s = c.state, n = c.n, name = s.targets[s.cursor], d = s.results[name];
    var who = data(name), pc = data(PC);
    var last = s.cursor === s.targets.length - 1;
    var out;
    if (d.applied) {
      out = rich('capApplied', { n: n, user: who, pc: pc, pcVia: names(d.path[1].via), via: names(d.path[2].via) });
      if (s.wmi) out = out.concat(sentence('capWmiTrue', { pc: data(PC) }));
      return out;
    }
    if (d.reason === 'scope') return rich('capScope', { n: n, user: who, ou: data(OU) });
    if (d.reason === 'inaccessible') {
      var firstInacc = !s.targets.slice(0, s.cursor).some(function (x) { return s.results[x].reason === 'inaccessible'; });
      out = firstInacc && d.userOk && userOf(name).groups.indexOf('Sales') >= 0
        ? rich('capInaccSales', { n: n, user: who })
        : rich('capInacc', { n: n, user: who, pc: pc });
      if (last) out = out.concat(sentence('capInaccFix'));
    } else if (d.reason === 'security') {
      out = d.path[3].pass === false
        ? rich('capDeny', { n: n, user: who, via: names(d.path[2].via), deny: names(d.path[3].via) })
        : rich('capNoApply', { n: n, user: who });
    } else {
      var firstWmi = !s.targets.slice(0, s.cursor).some(function (x) { return s.results[x].reason === 'wmi'; });
      return firstWmi ? rich('capWmiFirst', { n: n, pc: pc }) : rich('capWmiAgain', { n: n, user: who, pc: pc });
    }
    if (d.alsoWmi) out = out.concat(sentence('capAlsoWmi'));
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'aclMode', type: 'select', label: t('aclMode'), resets: true,
        options: [['default', t('aclDefault')], ['sales', t('aclSales')], ['sales-dc', t('aclSalesDc')]] },
      { key: 'denyManagers', type: 'toggle', label: t('denyManagers'), resets: true },
      { key: 'wmi', type: 'select', label: t('wmi'), resets: true, options: [['none', t('wmiOptNone')], ['laptops', t('wmiOptLaptops')]] },
      { key: 'pc07Laptop', type: 'toggle', label: t('pc07Laptop'), resets: true }
    ],

    presets: L.presets.map(function (pr) {
      var w = PRESET_WORDS[pr.id];
      return { id: pr.id, label: t(w), params: pr.params, hint: t(w + 'Hint') };
    }),

    legend: [
      { shape: 'sf-dia', label: t('legDiamond') },
      { shape: 'sf-dia-pass', label: t('legPass') },
      { shape: 'sf-dia-stop', label: t('legStop') },
      { shape: 'sf-row', label: t('legRow') },
      { shape: 'sf-noentry', label: t('legDeny') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'sf' }, renderSide(c), renderTable(c), renderPath(c)));
    },

    caption: function (c) {
      var s = c.state;
      if (!s.event) {
        var out = rich('capStart', { gpo: data(GPO), ou: data(OU), pc: data(PC) });
        return L.hasChange(c.params) ? out.concat(sentence('capStartChange')) : out;
      }
      if (s.event === 'admin') return captionAdmin(c.params);
      return captionTarget(c);
    }
  });
})();
</script>
