<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var A = window.SimdeckModels.asset;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (12 000 / 12,000), the Croatian space non-breaking. */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro. Minus is U+2212. */
  function money(x) {
    var r = A.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function cap(id) { return id.charAt(0).toUpperCase() + id.slice(1); }
  /** The option's label (table) and its name in a sentence; gate 0 has its own words. */
  function optLabel(id, g) { return t('o' + cap(id) + (g === 0 ? '0' : '')); }
  function optName(id, g) { return t('n' + cap(id) + (g === 0 ? '0' : '')); }
  var MARK = { 'continue': '▶', 'switch': '↪', stop: '■', none: '·', pending: '?' };
  function rowOf(tb, id) { return tb.rows.filter(function (r) { return r.id === id; })[0]; }

  // ── the lanes ──

  /** Grid slots: G0, months 1-3, G1, 4-6, G2, 7-9, G3, 10-12, then "later"; column 1 is the lane name. */
  var SLOTS = [];
  (function () {
    for (var m = 0; m <= L.END; m++) {
      var g = L.GATES.indexOf(m);
      if (m > 0) SLOTS.push({ k: 'month', m: m });
      if (g >= 0) SLOTS.push({ k: 'gate', g: g, m: m });
    }
    SLOTS.push({ k: 'later' });
  })();
  function col(i) { return { gridColumn: String(i + 2) }; }

  function lanes(s) {
    var out = [h('span', { class: 'sc-head sc-corner', style: { gridColumn: '1' } }, t('monthHead'))];
    SLOTS.forEach(function (sl, i) {
      var now = sl.k === 'gate' && s.atGate && sl.g === s.gate ? '1' : '';
      out.push(h('span', { class: 'sc-head', translate: 'no', dataset: { k: sl.k, now: now }, style: col(i) },
        sl.k === 'gate' ? t('gateShort', { g: sl.g }) : sl.k === 'month' ? String(sl.m) : ''));
    });
    L.RULES.forEach(function (r, ri) {
      var ln = s.lanes[r], row = String(2 * ri + 3);
      out.push(h('div', { class: 'sc-pname', style: { gridColumn: '1 / -1', gridRow: String(2 * ri + 2) } },
        t(r === 'sunk' ? 'laneSunk' : 'laneFwd')));
      out.push(h('div', { class: 'sc-name', style: { gridColumn: '1', gridRow: row } },
        h('b', null, t(r === 'sunk' ? 'laneSunk' : 'laneFwd')), h('span', null, t(r === 'sunk' ? 'laneSunkSub' : 'laneFwdSub'))));
      SLOTS.forEach(function (sl, i) {
        var st = { gridColumn: String(i + 2), gridRow: row };
        if (sl.k === 'month') {
          var a = sl.m <= s.month ? ln.months[sl.m] : null;
          var star = ln.live === sl.m;
          out.push(h('div', { class: 'sc-cell', dataset: { a: a || '', star: star ? '1' : '' }, style: st, 'aria-hidden': 'true' }, star ? '★' : ''));
        } else if (sl.k === 'gate') {
          var c = ln.choices[sl.g];
          if (c === null && s.atGate && s.phase === 'open' && sl.g === s.gate && s.facing.indexOf(r) >= 0) c = 'pending';
          var now = s.atGate && sl.g === s.gate ? '1' : '';
          out.push(h('div', { class: 'sc-gate', dataset: { c: c || '', now: now }, style: st },
            c ? h('span', { translate: 'no' }, MARK[c]) : null));
        } else {
          var later = s.last && s.final[r].live !== null && s.final[r].live > L.END ? s.final[r].live : null;
          out.push(h('div', { class: 'sc-later', translate: 'no', style: st, title: later ? t('laterLong', { m: later }) : null },
            later ? t('laterLive', { m: later }) : ''));
        }
      });
      out.push(h('div', { class: 'sc-tot', style: { gridColumn: String(SLOTS.length + 2), gridRow: row } },
        h('span', null, t.parts('totCash', { c: b(money(ln.cash)) })),
        h('span', null, t.n('totTeam', ln.team)),
        h('span', null, t.parts('totBenefit', { b: b(money(ln.benefit)) }))));
    });
    return h('div', { class: 'sc-lanes' }, out);
  }

  // ── the gate table ──

  function gateBlock(s) {
    var tb = s.table, g = s.gate;
    if (!tb) return [h('p', { class: 'sc-title' }, t('noGate'))];
    var open = s.phase === 'open';
    var title = g === 0
      ? t.parts('tTitle0', { w: b(money(tb.book)) })
      : t.parts('tTitle', { g: String(g), m: String(tb.month), e: t.n('nMonths', tb.est), r: String(tb.rem), s: b(money(tb.spent)), w: b(money(tb.book)) });
    var head1 = h('tr', { class: 'sc-groups' },
      h('th', null, ''),
      h('th', { colspan: '4' }, t('gComing')),
      h('th', { colspan: '3', 'data-g': 'sunk' }, t('gSunk')));
    var head2 = h('tr', null,
      h('th', null, t('hOption')),
      h('th', { class: 'sc-detail' }, t('hBenefit')),
      h('th', { class: 'sc-detail' }, t('hCash')),
      h('th', { class: 'sc-detail' }, t('hPeople')),
      h('th', null, t('hFwd')),
      h('th', { class: 'sc-detail', 'data-g': 'sunk' }, t('hSpent')),
      h('th', { class: 'sc-detail', 'data-g': 'sunk' }, t('hBook')),
      h('th', { 'data-g': 'sunk' }, t('hSunk')));
    var body = tb.rows.map(function (r) {
      var z = g === 0 ? '0' : '';
      var sub = r.id === 'continue' ? t.n('sContinue' + z, tb.rem) : r.id === 'switch' ? t('sSwitch') : t('sStop' + z);
      function neg(x) { return x === 0 ? h('td', { class: 'sc-detail sc-x', translate: 'no', 'data-g': 'sunk' }, '—')
        : h('td', { class: 'sc-detail', translate: 'no', 'data-g': 'sunk' }, money(-x)); }
      function score(x, pick, grp) {
        if (open) return h('td', { class: 'sc-score sc-hide', 'data-g': grp }, t('hidden'));
        return h('td', { class: 'sc-score', translate: 'no', 'data-g': grp, dataset: { pick: pick ? '1' : '' } }, money(x));
      }
      return h('tr', null,
        h('td', { class: 'sc-opt' }, h('b', null, optLabel(r.id, g)), h('span', null, sub)),
        h('td', { class: 'sc-detail', translate: 'no' }, money(r.benefit)),
        h('td', { class: 'sc-detail', translate: 'no' }, money(-r.cash)),
        h('td', { class: 'sc-detail', translate: 'no' }, money(-r.people)),
        score(r.fwd, tb.fwd === r.id, null),
        neg(r.lostSpent),
        neg(r.lostBook),
        score(r.sunk, tb.sunk === r.id, 'sunk'));
    });
    var out = [h('p', { class: 'sc-title' }, title), h('table', { class: 'sc-tab' }, h('thead', null, head1, head2), h('tbody', null, body))];
    if (!s.params.product) out.push(h('p', { class: 'sc-note' }, '↪ ', t('noProduct')));
    if (open) out.push(h('p', { class: 'sc-note' }, t('voteHint')));
    else if (tb.spent > 0) {
      var list = [];
      tb.rows.forEach(function (r, i) {
        if (i) list.push(', ');
        list.push(optName(r.id, g), ' ', b(money(r.whole)));
      });
      out.push(h('p', { class: 'sc-note' }, t.parts('whole', { s: b(money(tb.spent)), list: h('span', null, list) })));
    }
    return out;
  }

  // ── the outcome, each lane to its own end ──

  function finalBlock(s) {
    var f = s.final;
    var head = h('tr', null,
      h('th', null, ''), h('th', { class: 'sc-detail' }, t('fPath')), h('th', null, t('fLive')),
      h('th', { class: 'sc-detail' }, t('fBenefit')), h('th', { class: 'sc-detail' }, t('fCash')),
      h('th', { class: 'sc-detail' }, t('fPeople')), h('th', null, t('fNet')), h('th', { class: 'sc-detail' }, t('fOld')));
    var best = Math.max(f.sunk.net, f.fwd.net);
    var rows = L.RULES.map(function (r) {
      var o = f[r];
      var path = o.choices.map(function (c) { return MARK[c || 'none']; }).join('');
      return h('tr', null,
        h('td', { class: 'sc-opt' }, h('b', null, t(r === 'sunk' ? 'laneSunk' : 'laneFwd'))),
        h('td', { class: 'sc-path sc-detail', translate: 'no' }, path),
        h('td', null, o.live === null ? t('liveNever') : t('liveIn', { m: o.live })),
        h('td', { class: 'sc-detail', translate: 'no' }, money(o.benefit)),
        h('td', { class: 'sc-detail', translate: 'no' }, money(-o.cash)),
        h('td', { class: 'sc-detail', translate: 'no' }, money(-o.people)),
        h('td', { class: 'sc-score', translate: 'no', dataset: { pick: o.net === best && f.sunk.net !== f.fwd.net ? '1' : '' } }, money(o.net)),
        h('td', { class: 'sc-detail' }, o.live === null ? t('oldKept', { w: money(o.kept) }) : t('oldWritten', { m: o.live, w: money(o.writeOff) })));
    });
    return [
      h('p', { class: 'sc-title' }, t('fTitle')),
      h('table', { class: 'sc-tab' }, h('thead', null, head), h('tbody', null, rows)),
      h('p', { class: 'sc-note' }, t.parts('fOldNote', { w: b(money(s.params.old)) }))
    ];
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'sc' },
      lanes(s),
      h('section', { class: 'sc-low' }, s.last ? finalBlock(s) : gateBlock(s)),
      h('p', { class: 'sc-foot' }, t('illustrative'))));
  }

  // ── caption ──

  function phrase(ln, m) { return h('span', null, phraseParts(ln, m)); }
  function phraseParts(ln, m) {
    if (ln.event === 'build') return t.parts('pBuild', { c: b(money(L.BUILD.cash)), s: b(money(ln.cash)) });
    if (ln.event === 'setup') return t.parts('pSetup', { k: String(ln.setup), s: b(money(ln.cash)) });
    if (ln.event === 'golive') {
      return t.parts(ln.liveKind === 'build' ? 'pGoliveBuild' : 'pGoliveSwitch', {
        bn: b(money(ln.liveKind === 'build' ? L.BUILD.benefit : L.PRODUCT.benefit)), w: b(money(ln.writeOff)) });
    }
    if (ln.phase === 'live') return t.parts(ln.liveKind === 'build' ? 'pLive' : 'pLiveSwitch', { l: String(ln.live) });
    return t.parts('pKept', {});
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s), tb = s.table, g = s.gate;
    var v = { g: String(g), m: String(s.month) };
    if (k.lead === 'cOpen0' || k.lead === 'cOpen0NoProduct') {
      v.p = t.n('nMonths', s.est[0]);
      v.w = b(money(s.book));
    } else if (k.lead === 'cOpenGrew' || k.lead === 'cOpenHeld') {
      v.a = t.n('nMonths', tb.prevEst);
      v.b = b(t.n('nMonths', tb.est));
      v.s = b(money(tb.spent));
    } else if (k.lead === 'cAgree') {
      var sorted = tb.rows.map(function (r) { return r.fwd; }).sort(function (x, y) { return y - x; });
      v.opt = h('b', null, optName(tb.fwd, g));
      v.f = b(money(rowOf(tb, tb.fwd).fwd));
      v.d = b(money(rowOf(tb, tb.fwd).fwd - sorted[1]));
    } else if (k.lead === 'cDiffer') {
      v.optS = h('b', null, optName(tb.sunk, g));
      v.optF = h('b', null, optName(tb.fwd, g));
      v.f = b(money(rowOf(tb, tb.fwd).fwd));
      v.f2 = b(money(rowOf(tb, tb.sunk).fwd));
      v.s = b(money(tb.spent));
      v.w = b(money(tb.book));
    } else if (k.lead === 'cMonthSame') {
      v.p = phrase(s.lanes.sunk, s.month);
    } else if (k.lead === 'cMonthDiffer') {
      v.a = phrase(s.lanes.sunk, s.month);
      v.b = phrase(s.lanes.fwd, s.month);
    } else if (k.lead === 'cEndSame') {
      v.net = b(money(s.final.fwd.net));
    } else if (k.lead === 'cEnd') {
      v.a = b(money(s.final.sunk.net));
      v.b = b(money(s.final.fwd.net));
      v.g = String(s.final.parted);
      v.d = b(money(Math.abs(s.final.diff)));
    }
    var out = t.parts(k.lead, v);
    if (k.gap) out.push(' ', t.parts(k.gap, v));
    if (k.only) out.push(' ', t.parts(k.only, v));
    if (k.live) {
      out.push(' ', t.parts('gLive', { lane: h('b', null, t(k.live === 'sunk' ? 'laneSunk' : 'laneFwd')), p: phrase(s.lanes[k.live], s.month) }));
    }
    return out;
  }

  var labels = { overrun: 'prOverrun', 'on-track': 'prOnTrack', 'team-free': 'prTeamFree', 'old-books': 'prOldBooks', 'no-way-out': 'prNoWayOut' };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'overrun', type: 'choice', label: t('pOverrun'),
        options: [['none', t('ovNone')], ['moderate', t('ovModerate')], ['severe', t('ovSevere')]] },
      { key: 'value', type: 'range', label: t('pValue'), min: L.RANGE.value.min, max: L.RANGE.value.max,
        step: L.RANGE.value.step, format: money },
      { key: 'old', type: 'range', label: t('pOld'), min: L.RANGE.old.min, max: L.RANGE.old.max,
        step: L.RANGE.old.step, format: money },
      { key: 'product', type: 'toggle', label: t('pProduct') }
    ],
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
      { c: 1, label: t('legBuild') },
      { shape: 'sc-setup', label: t('legSetup') },
      { shape: 'sc-live', label: t('legLive') },
      { shape: 'hollow', label: t('legKept') },
      { shape: 'sc-none', label: t('legChoices') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
