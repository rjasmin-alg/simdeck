<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';
  var svgNS = 'http://www.w3.org/2000/svg';
  // the sheet with a margin of 0.6 × 0.3 (keeps 2 : 1)
  var VIEW = { x0: -0.6, y0: -0.3, x1: L.W + 0.6, y1: L.H + 0.3 };

  function svg(tag, attrs) {
    var el = document.createElementNS(svgNS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function norm(v) { var l = Math.hypot(v[0], v[1]); return l ? [v[0] / l, v[1] / l] : [1, 0]; }
  function add(a, v, s) { return [a[0] + v[0] * s, a[1] + v[1] * s]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
  function mid(a, b) { return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; }
  function cm(n) { return t('cmFmt', { n: n }); }
  function lenText(d) {
    if (d.exact) return t('lenCm', { cm: d.cm });
    return d.mm ? t('lenAbout', { cm: d.cm, mm: d.mm }) : t('lenAboutCm', { cm: d.cm });
  }
  function camel(id) { return id.replace(/-(\w)/g, function (m, c) { return c.toUpperCase(); }); }
  /** The phone layout (the page CSS's query): the paper is small, so lengths go to the top box, not beside the sides. */
  function narrow() { return window.matchMedia('(max-width: 900px), (max-aspect-ratio: 1/1)').matches; }
  function cap(x) { return x.charAt(0).toUpperCase() + x.slice(1); }

  // ── the paper: paper coordinates (y up) to the SVG (y down) and to % for the HTML labels ──
  function Paper(grid) {
    var view = VIEW, w = view.x1 - view.x0, hh = view.y1 - view.y0;
    var el = svg('svg', { viewBox: view.x0 + ' ' + (-view.y1) + ' ' + w + ' ' + hh, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var labs = [];
    var api = {
      el: el, labs: labs,
      line: function (a, b, cls, data) {
        var l = svg('line', { class: cls, x1: a[0], y1: -a[1], x2: b[0], y2: -b[1] });
        Object.keys(data || {}).forEach(function (k) { l.setAttribute(k, data[k]); });
        el.append(l);
      },
      poly: function (pts, cls) {
        el.append(svg('polygon', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      path: function (pts, cls) {
        el.append(svg('polyline', { class: cls, points: pts.map(function (p) { return p[0] + ',' + (-p[1]); }).join(' ') }));
      },
      /** An arc of the circle (c, r) from angle a0 to a1 (radians, anticlockwise on the paper). */
      arc: function (c, r, a0, a1, cls) {
        var p0 = [c[0] + r * Math.cos(a0), c[1] + r * Math.sin(a0)], p1 = [c[0] + r * Math.cos(a1), c[1] + r * Math.sin(a1)];
        var large = a1 - a0 > Math.PI ? 1 : 0;
        el.append(svg('path', { class: cls, d: 'M' + p0[0] + ' ' + (-p0[1]) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p1[0] + ' ' + (-p1[1]) }));
      },
      dot: function (p, attrs, size) {
        var c = svg('circle', { class: 'gt-pt', cx: p[0], cy: -p[1], r: size || 0.24 });
        Object.keys(attrs || {}).forEach(function (k) { c.setAttribute(k, attrs[k]); });
        el.append(c);
      },
      /** An HTML label at a point of the paper, shifted by (dx, dy) in rem (y down). */
      lab: function (p, text, dx, dy, data) {
        var left = Math.min(97, Math.max(3, (p[0] - view.x0) / w * 100)), top = Math.min(96, Math.max(4, (view.y1 - p[1]) / hh * 100));
        labs.push(h('span', { class: 'gt-lab', translate: 'no', dataset: data || {},
          style: { left: 'calc(' + left.toFixed(3) + '% + ' + (dx || 0) + 'rem)', top: 'calc(' + top.toFixed(3) + '% + ' + (dy || 0) + 'rem)' } }, text));
      },
      rightAngle: function (at, d1, d2) {
        var a = 0.6, e1 = norm(d1), e2 = norm(d2);
        api.path([add(at, e1, a), add(add(at, e1, a), e2, a), add(at, e2, a)], 'gt-rt');
      },
      /** The compass from above: the needle in `needle`, the pencil in `pencil`, the hinge to the left of the way
          (side -1: to the right). */
      compass: function (needle, pencil, side) {
        var d = sub(pencil, needle), len = Math.hypot(d[0], d[1]), sg = side || 1;
        var e = norm(d), n = [-e[1] * sg, e[0] * sg], up = Math.max(1.2, 0.45 * len);
        var hinge = add(add(needle, d, 0.5), n, up);
        var top = add(hinge, n, 0.9);
        if (top[0] < 0 || top[0] > L.W || top[1] < 0 || top[1] > L.H) { n = [-n[0], -n[1]]; hinge = add(add(needle, d, 0.5), n, up); }
        api.line(needle, hinge, 'gt-leg');
        api.line(hinge, pencil, 'gt-leg');
        el.append(svg('circle', { class: 'gt-hinge', cx: hinge[0], cy: -hinge[1], r: 0.32 }));
        api.line(hinge, add(hinge, n, 0.9), 'gt-leg');
        el.append(svg('circle', { class: 'gt-tip', cx: pencil[0], cy: -pencil[1], r: 0.2 }));
      },
      /** A ruler from a to b, on the side `side` (a unit vector), a tick each cm counted from a; numbers at `numbers`. */
      ruler: function (a, b, side, numbers) {
        var e = norm(sub(b, a)), len = Math.hypot(b[0] - a[0], b[1] - a[1]);
        var o = add(a, e, -0.6), q = add(b, e, 0.6);
        api.poly([o, q, add(q, side, 1), add(o, side, 1)], 'gt-ruler');
        for (var i = 0; i <= len + 1e-9; i++) {
          var tk = add(a, e, i);
          api.line(tk, add(tk, side, i % 5 === 0 ? 0.45 : 0.28), 'gt-rtick');
        }
        (numbers || []).forEach(function (i) { api.lab(add(add(a, e, i), side, 0.72), String(i), 0, 0, { len: '' }); });
      }
    };
    if (grid) {
      for (var x = 0; x <= L.W; x++) api.line([x, 0], [x, L.H], 'gt-grid');
      for (var y = 0; y <= L.H; y++) api.line([0, y], [L.W, y], 'gt-grid');
    }
    return api;
  }

  // ── the triangle's parts, shared by both modes ──
  function vertices(s) { return { A: s.A, B: s.B, C: s.C }; }
  function centroid(s) { return [(s.A[0] + s.B[0] + s.C[0]) / 3, (s.A[1] + s.B[1] + s.C[1]) / 3]; }
  var ENDS = { a: ['B', 'C'], b: ['C', 'A'], c: ['A', 'B'] };
  /** The side names (and, in build, their lengths) beside the sides, away from the middle of the triangle. */
  function sideLabels(pp, s, text) {
    var V = vertices(s), G = centroid(s);
    ['a', 'b', 'c'].forEach(function (k) {
      var M = mid(V[ENDS[k][0]], V[ENDS[k][1]]), e = norm(sub(M, G));
      var lab = text(k);
      // far enough out that the label's box (about 0.21 cm of paper per character at 1920 × 1080) clears the side
      var off = 0.5 + Math.abs(e[0]) * 0.12 * lab.length + Math.abs(e[1]) * 0.3;
      pp.lab(add(M, e, off), lab, 0, 0, { c: '3' });
    });
  }
  function vertexLabels(pp, s, names) {
    var V = vertices(s), G = centroid(s);
    names.forEach(function (k) {
      var e = s.flat ? [0, 1] : norm(sub(V[k], G));
      pp.lab(V[k], k, e[0] * 1.2, -e[1] * 1.2, { big: '' });
    });
  }
  function ticks(pp, s, list) {
    var V = vertices(s);
    list.forEach(function (k) {
      var p = V[ENDS[k][0]], q = V[ENDS[k][1]], M = mid(p, q), e = norm(sub(q, p)), n = [-e[1], e[0]];
      pp.line(add(M, n, -0.38), add(M, n, 0.38), 'gt-tick');
    });
  }
  /** The set square: its corner in the vertex `at`, one leg along the side to `along`, the other on the triangle's side. */
  function setSquare(pp, s, k) {
    var V = vertices(s), O = V[k.square.at];
    var e1 = norm(sub(V[k.square.along], O)), n = [-e1[1], e1[0]], w = sub(V[k.square.toward], O);
    if (n[0] * w[0] + n[1] * w[1] < 0) n = [-n[0], -n[1]];
    pp.poly([O, add(O, e1, 3.2), add(O, n, 2.4)], 'gt-sq');
    if (k.right) pp.rightAngle(O, e1, n);
  }

  // ── mode build ──
  function others(long) { return ['a', 'b', 'c'].filter(function (k) { return k !== long; }); }
  function sayBuild(s) {
    var id = s.stepId;
    if (id === 'meet' || id === 'join') {
      if (s.exists === 'yes') return t('b_' + id + '_yes');
      if (id === 'meet') return t('b_meet_' + s.exists);
      var o = others(s.long);
      return t('b_join_' + s.exists, { s1: o[0], s2: o[1], sum: cm(s.sum), L: s.long, Lv: cm(s[s.long]), gap: cm(s.gap) });
    }
    if (id === 'kind') return s.exists === 'yes' ? bothText(s.kind) : t('b_kind_no');
    return t('b_' + id);
  }
  function questionBuild(s) {
    var id = s.stepId, ok = s.exists === 'yes';
    if (id === 'meet' && s.exists === 'flat') return t('q_meet_flat');
    if (id === 'meet' || id === 'join') return t('q_' + id + (ok ? '_yes' : '_no'));
    return t('q_' + id);
  }
  /** The set square's sentence: the right angle, or the biggest angle (one of the biggest on a tie). */
  function rightText(k) {
    if (k.right) return t('ck_right_yes', { v: k.right });
    return t(k.bigTie ? 'ck_right_no_tie' : 'ck_right_no', { v: k.biggest, angle: t('ang_' + k.angle) });
  }
  function bothText(k) { return t('both_' + k.sides + '_' + (k.right ? 'yes' : 'no')); }
  function kindChips(k) {
    return [chip(t('chipSides'), t('kn_' + k.sides)), chip(t('chipRight'), t(k.right ? 'yes' : 'no'))];
  }
  /** The stage's switch to the other mode (it resets to step 0, like the mode param). */
  function modeBtn(s) {
    var other = s.mode === 'kind' ? 'build' : 'kind';
    var b = h('button', { type: 'button', class: 'sd-btn gt-modebtn', title: t('mode'),
      onclick: function () { sim.set({ mode: other }); } }, t('mode_' + other) + ' ▸');
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    return b;
  }
  function chip(key, val, bad) {
    return h('span', { class: 'gt-chip', dataset: bad ? { bad: '' } : {} }, key ? h('span', { class: 'gt-k' }, key) : null, h('span', null, val));
  }

  function drawBuild(s, pp) {
    var A = s.A, B = s.B, C = s.C, Y = L.Y0;
    var thA = C && s.exists === 'yes' ? Math.atan2(C[1] - A[1], C[0] - A[0]) : Math.PI / 3;
    var thB = C && s.exists === 'yes' ? Math.atan2(C[1] - B[1], C[0] - B[0]) : 2 * Math.PI / 3;
    if (s.sides) pp.poly([A, B, C], 'gt-fill');
    if (s.compare) pp.line([0.3, Y], [L.W - 0.3, Y], 'gt-base');
    // the arcs: half circles above AB while C is looked for (every point b from A, a from B); once C is joined, only
    // the short arcs through C, as the books leave them
    var w = 0.32;
    if (s.sides) { pp.arc(A, s.b, thA - w, thA + w, 'gt-arc'); pp.arc(B, s.a, thB - w, thB + w, 'gt-arc'); }
    else {
      if (s.arcA) pp.arc(A, s.b, 0, Math.PI, 'gt-arc');
      if (s.arcB) pp.arc(B, s.a, 0, Math.PI, 'gt-arc');
    }
    if (s.base) pp.line(A, B, 'gt-side');
    if (s.sides) { pp.line(B, C, 'gt-side'); pp.line(C, A, 'gt-side'); }
    if (s.compare) {
      // the radii laid along line AB towards each other, and the gap between their ends (SPEC rule 6)
      var fa = s.feet.fa, fb = s.feet.fb;
      // b just above the line and a just below it, so neither hides the other when they overlap (a or b too long)
      var up = [0, 0.2], dn = [0, -0.2];
      pp.line(add(A, up, 1), add(fa, up, 1), 'gt-rad', { 'data-b': '' });
      pp.line(add(B, dn, 1), add(fb, dn, 1), 'gt-rad');
      pp.lab(mid(A, fa), 'b', 0, -1.2, { c: '4' });
      pp.lab(mid(B, fb), 'a', 0, 1.2, { c: '1' });
      if (s.gap > 0) {
        pp.line(fa, fb, 'gt-gap');
        pp.lab(mid(fa, fb), cm(s.gap), 0, s.long === 'c' ? -1.2 : 1.2, { bad: '' });
      }
    }
    // the ruler and the compass of this step
    if (s.ruler === 'AB') { pp.ruler([A[0], Y - 0.05], [B[0], Y - 0.05], [0, -1], [0, s.c]); pp.lab([A[0] - 2.4, Y - 0.6], t('wRuler'), 0, 0, { word: '' }); }
    if (s.ruler === 'A') pp.ruler([A[0], Y - 0.05], [A[0] + s.b, Y - 0.05], [0, -1], [0, s.b]);
    if (s.ruler === 'B') pp.ruler([B[0], Y - 0.05], [B[0] - s.a, Y - 0.05], [0, -1], [0, s.a]);
    if (s.compass) {
      // the pencil straight up from the needle: drawing the arc, not yet knowing where C is
      var O = s.compass.needle === 'A' ? A : B, th = Math.PI / 2, r = s.compass.open;
      var pen = [O[0] + r * Math.cos(th), O[1] + r * Math.sin(th)];
      pp.line(O, pen, 'gt-radius');
      var e = norm(sub(pen, O));
      pp.lab(add(add(O, e, r / 2), [e[1], -e[0]], s.compass.needle === 'A' ? 0.7 : -0.7), s.compass.needle === 'A' ? 'b' : 'a', 0, 0, { len: '' });
      pp.compass(O, pen, s.compass.needle === 'A' ? 1 : -1);
    }
    if (s.kind) { ticks(pp, s, s.kind.equal); setSquare(pp, s, s.kind); }
    if (s.sides) sideLabels(pp, s, function (k) { return narrow() ? k : k + ' = ' + cm(s[k]); });
    else if (s.base && !s.compare) pp.lab(mid(A, B), 'c', 0, s.ruler ? -1.0 : 1.0, { c: '3' });
    if (s.base) {
      pp.dot(A); pp.dot(B);
      pp.lab(A, 'A', -1.1, s.compare ? 1.0 : 0.2, { big: '' });
      pp.lab(B, 'B', 1.1, s.compare ? 1.0 : 0.2, { big: '' });
    }
    if (s.apex) {
      if (s.exists === 'yes') { pp.dot(C, { 'data-c': '' }); pp.lab(C, 'C', 0, -1.2, { big: '' }); }
      else { pp.dot(C, { 'data-bad': '' }); pp.lab(C, 'C?', 0, -1.2, { big: '', bad: '' }); }
    }
  }

  function topBuild(s) {
    var col = [h('div', { class: 'gt-say' }, sayBuild(s))];
    if (audience !== 'child') {
      col.push(h('div', { class: 'gt-sub', translate: 'no' }, t('given', { a: cm(s.a), b: cm(s.b), c: cm(s.c) })));
      if (!s.last) col.push(h('div', { class: 'gt-sub gt-q' }, questionBuild(s)));
      else col.push(h('div', { class: 'gt-sub gt-q' }, t('q_kind')));
    }
    var side = [];
    if (s.kind) side = kindChips(s.kind);
    else if (s.last) side.push(chip(null, t('none'), true));
    side.push(modeBtn(s));
    return [h('div', { class: 'gt-col' }, col), h('div', { class: 'gt-side' }, side)];
  }

  // ── mode kind ──
  function sayKind(s) {
    if (s.flat) return t('k_flat');
    var k = s.kind;
    switch (s.stepId) {
      case 'sides': return t('k_sides_' + k.sides);
      case 'right': return k.right ? t('k_right_yes', { v: k.right }) : t('k_right_no');
      case 'both': return bothText(k);
      default: return t('k_' + s.stepId);
    }
  }
  function drawKind(s, pp) {
    var A = s.A, B = s.B, C = s.C;
    if (!s.flat) pp.poly([A, B, C], 'gt-fill');
    pp.line(A, B, 'gt-side'); pp.line(B, C, 'gt-side'); pp.line(C, A, 'gt-side');
    if (s.bySides) ticks(pp, s, s.kind.equal);
    if (s.byAngle) setSquare(pp, s, s.kind);
    if (s.names) sideLabels(pp, s, function (k) { return s.measure && !narrow() ? k + ' = ' + lenText(s.len[k]) : k; });
    pp.dot(A); pp.dot(B); pp.dot(C);
    vertexLabels(pp, s, ['A', 'B', 'C']);
  }
  function topKind(s) {
    var col = [h('div', { class: 'gt-say' }, sayKind(s))];
    if (audience !== 'child') {
      var q = s.flat ? t('q_flat') : t('q_' + s.stepId);
      col.push(h('div', { class: 'gt-sub gt-q' }, q));
    }
    var side = [];
    if (s.measure && narrow()) ['a', 'b', 'c'].forEach(function (k) { side.push(chip(null, k + ' = ' + lenText(s.len[k]))); });
    if (s.bySides) side.push(chip(t('chipSides'), t('kn_' + s.kind.sides)));
    if (s.byAngle) side.push(chip(t('chipRight'), t(s.kind.right ? 'yes' : 'no')));
    side.push(modeBtn(s));
    return [h('div', { class: 'gt-col' }, col), h('div', { class: 'gt-side' }, side)];
  }

  function render(c) {
    var s = c.state;
    var pp = Paper(s.mode === 'kind');
    var top;
    if (s.mode === 'kind') { drawKind(s, pp); top = topKind(s); }
    else { drawBuild(s, pp); top = topBuild(s); }
    var say = s.mode === 'kind' ? sayKind(s) : sayBuild(s);
    var field = h('div', { class: 'gt-field', role: 'img', title: s.mode === 'kind' ? t('dragHint') : null, 'aria-label': say,
      dataset: s.mode === 'kind' ? { drag: '' } : {} }, [pp.el].concat(pp.labs));
    c.stage.replaceChildren(h('div', { class: 'gt', dataset: { aud: audience, mode: s.mode } },
      h('section', { class: 'gt-box gt-top' }, top),
      h('section', { class: 'gt-box gt-paperbox' }, h('div', { class: 'gt-wrap' }, field))));
  }

  // ── captions (SPEC, Legend and captions) ──
  function caption(c) {
    var s = c.state, A = audience;
    var out = [];
    function put(text) { if (out.length) out.push(' '); out.push(h('span', null, text)); }
    function putHl(text) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, text)); }
    var ex = s.exists, id = s.stepId;
    if (s.mode === 'build') {
      var suf = id === 'meet' || id === 'join' ? '_' + ex : id === 'kind' ? (ex === 'yes' ? '_yes' : '_no') : '';
      if (A === 'child') { put(id === 'kind' && ex === 'yes' ? t('cc_both') : t('cc_' + id + (id === 'kind' ? '_no' : suf))); return out; }
      if (s.mistake) putHl(t('m_' + s.mistake));
      var oth = s.long ? others(s.long) : ['', ''];
      put(t('cb_' + id + suf, { L: s.long || '', s1: oth[0], s2: oth[1] }));
      if (s.kind) put(rightText(s.kind));
      if (A === 'adult') {
        if (ex !== 'yes' && s.n >= 4) put(t('why_no', { L: s.long, s1: oth[0], s2: oth[1] }));
        else if (s.n >= 2 && s.n <= 4) put(t('why_arc'));
        else if (s.n >= 5) put(t('why_yes'));
      }
      return out;
    }
    if (s.flat) { put(t(A === 'child' ? 'cc_flat' : 'ck_flat')); return out; }
    var k = s.kind;
    if (A === 'child') {
      if (id === 'sides') put(t('cc_sides_' + k.sides));
      else if (id === 'right') put(k.right ? t('cc_right_yes', { v: k.right }) : t('cc_right_no'));
      else if (id === 'both') put(t('cc_both'));
      else put(t('cc_' + id));
      return out;
    }
    if (s.mistake) putHl(t('m_' + s.mistake));
    if (id === 'sides') { put(t('ck_sides_' + k.sides)); if (s.nearEq) put(t('ck_noEqui')); }
    else if (id === 'right') put(rightText(k));
    else if (id === 'measure') put(t(['a', 'b', 'c'].some(function (j) { return !s.len[j].exact; }) ? 'ck_measure' : 'ck_measure_exact'));
    else {
      put(t('ck_' + id));
      if (id === 'name' && !s.anticlockwise) put(t('ck_clockwise'));
    }
    if (A === 'adult') put(t(id === 'draw' || id === 'both' ? 'why_kind' : 'why_k_' + id));
    return out;
  }

  // ── the header: the audience switch ──
  function buildAudience() {
    var key = function (a) { return 'aud' + cap(a); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }
  buildAudience();

  var hidden = function () { return false; };
  var isBuild = function (prm) { return prm.mode !== 'kind'; };
  sim = Simdeck.mount({
    defaults: L.defaults,
    steps: L.steps,
    initial: L.initial,
    step: L.step,

    params: [
      // the mode: the presets and the stage's switch set it (the panel has no room for it at 1920 × 1080); here so the
      // URL carries it
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode, resets: true, visible: hidden,
        options: L.MODES.map(function (m) { return [m, t('mode_' + m)]; }) },
      { key: 'a', type: 'range', label: t('a'), value: L.defaults.a, min: L.S_MIN, max: L.S_MAX, format: cm, visible: isBuild },
      { key: 'b', type: 'range', label: t('b'), value: L.defaults.b, min: L.S_MIN, max: L.S_MAX, format: cm, visible: isBuild },
      { key: 'c', type: 'range', label: t('c'), value: L.defaults.c, min: L.S_MIN, max: L.S_MAX, format: cm, visible: isBuild },
      // the vertices: dragged on the paper or set by the presets; here so the URL carries them
      { key: 'ax', type: 'range', label: 'A x', value: L.defaults.ax, min: 0, max: L.W, visible: hidden },
      { key: 'ay', type: 'range', label: 'A y', value: L.defaults.ay, min: 0, max: L.H, visible: hidden },
      { key: 'bx', type: 'range', label: 'B x', value: L.defaults.bx, min: 0, max: L.W, visible: hidden },
      { key: 'by', type: 'range', label: 'B y', value: L.defaults.by, min: 0, max: L.H, visible: hidden },
      { key: 'cx', type: 'range', label: 'C x', value: L.defaults.cx, min: 0, max: L.W, visible: hidden },
      { key: 'cy', type: 'range', label: 'C y', value: L.defaults.cy, min: 0, max: L.H, visible: hidden }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + camel(pr.id)), hint: t('ph_' + camel(pr.id)), params: pr.params };
    }),

    legend: [
      { c: 3, shape: 'line', label: t('legSides') },
      { c: 1, shape: 'line', label: t('legArcs') },
      { label: t('legSquare') }
    ],

    render: render,
    caption: caption
  });

  // ── dragging the vertices (mode kind); the step stays, so the kind follows the drag ──
  var drag = null;
  function paperXY(e) {
    var f = document.querySelector('[data-sim="geo-triangles"] .gt-field');
    if (!f) return null;
    var r = f.getBoundingClientRect();
    return [VIEW.x0 + (e.clientX - r.left) / r.width * (VIEW.x1 - VIEW.x0), VIEW.y1 - (e.clientY - r.top) / r.height * (VIEW.y1 - VIEW.y0)];
  }
  function moveTo(key, xy) {
    var c = L.cornerAt(xy[0], xy[1]), k = key.toLowerCase();
    if (sim.params[k + 'x'] === c[0] && sim.params[k + 'y'] === c[1]) return;
    var patch = {};
    patch[k + 'x'] = c[0]; patch[k + 'y'] = c[1];
    sim.set(patch);
  }
  var stage = document.querySelector('[data-sd-stage]');
  stage.addEventListener('pointerdown', function (e) {
    if (!e.target.closest || !e.target.closest('.gt-field')) return;
    var s = sim.state;
    if (s.mode !== 'kind') return;
    var xy = paperXY(e);
    if (!xy) return;
    var best = null, bd = 0.9;
    [['C', s.C], ['B', s.B], ['A', s.A]].forEach(function (hd) {
      var d = Math.hypot(hd[1][0] - xy[0], hd[1][1] - xy[1]);
      if (d < bd) { bd = d; best = hd[0]; }
    });
    drag = best;
    if (!drag) return;
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* not capturable */ }
    e.preventDefault();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var xy = paperXY(e);
    if (xy) moveTo(drag, xy);
  });
  function end() { drag = null; }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  window.addEventListener('resize', function () { sim.render(); });
  sim.render();
})();
</script>
</body>
</html>
