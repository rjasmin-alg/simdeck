<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // A voltage with its sign (a real minus), two decimals and the language's decimal mark.
  function volt(x) {
    var v = L.roundV(x), s = v > 0 ? '+' : v < 0 ? '−' : '';
    return t('volt', { v: s + Math.abs(v).toFixed(2).replace('.', t('dec')) });
  }
  function peak(x) { return t('volt', { v: String(x).replace('.', t('dec')) }); }
  function ratio(x) { return t('ratio', { v: String(x) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function pts(list) { return list.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }

  var presetKeys = { start: 'presetStart', coarse: 'presetCoarse', none: 'presetNone', large: 'presetLarge' };

  // ── the circuit, in units (y down), after figure 1122: T1 on the left, the diode ring, T2 on the right, the
  //    oscillator U2 between the two centre taps below. The ring's nodes: N (T1's upper end), S (its lower end),
  //    W (to T2's upper end A1, over the top), E (to T2's lower end A2). ──
  var N = [4.45, 1], S_ = [4.45, 3], W = [2.75, 2], E = [6.15, 2];
  var X0 = -0.8, X1 = 9.95, Y0 = 0, Y1 = 5.4;
  // each diode from anode to cathode, and which side its label goes
  var DIODES = { d1: [N, E, 1], d2: [E, S_, 1], d3: [S_, W, 1], d4: [W, N, 1] };

  // A coil of six half turns from (x, y0) to (x, y1), bulging towards `dir` (+1 right, −1 left).
  function coil(P, x, y0, y1, dir) {
    var n = 6, a = 0.25, h0 = (y1 - y0 - n * a) / 2, d = 'M' + P(x, y0).join(',') + 'L' + P(x, y0 + h0).join(',');
    var rr = P(0, a / 2)[1] - P(0, 0)[1];
    for (var i = 0; i < n; i++) d += 'A' + rr + ',' + rr + ' 0 0,' + (dir > 0 ? 1 : 0) + ' ' + P(x, y0 + h0 + (i + 1) * a).join(',');
    return d + 'L' + P(x, y1).join(',');
  }

  function drawCircuit(box, st) {
    var W_ = box.clientWidth, H_ = box.clientHeight;
    if (!W_ || !H_) return;
    var rem = remPx();
    var k = Math.min(W_ / (X1 - X0), H_ / (Y1 - Y0));
    var ox = (W_ - k * (X1 - X0)) / 2 - k * X0, oy = (H_ - k * (Y1 - Y0)) / 2 - k * Y0;
    var P = function (x, y) { return [ox + k * x, oy + k * y]; };
    var svg = s('svg', { width: W_, height: H_, 'aria-hidden': 'true' });
    var kase = st.kase;
    // which path each ring wire belongs to in this case (null at rest)
    var pathOf = { wN: kase ? 'up' : null, wS: kase ? 'lo' : null,
      wE: kase === 1 ? 'up' : kase === 2 ? 'lo' : null, wW: kase === 1 ? 'lo' : kase === 2 ? 'up' : null };
    function wire(list, path) {
      svg.append(s('polyline', { class: 'rm-w', 'data-path': path, points: pts(list.map(function (p) { return P(p[0], p[1]); })) }));
    }
    function dot(p) { svg.append(s('circle', { class: 'rm-dot', cx: P(p[0], p[1])[0], cy: P(p[0], p[1])[1], r: Math.max(3, 0.07 * k) })); }
    function term(p) { svg.append(s('circle', { class: 'rm-term', cx: P(p[0], p[1])[0], cy: P(p[0], p[1])[1], r: Math.max(4, 0.09 * k) })); }
    function text(p, str, attrs) {
      var a = Object.assign({ class: 'rm-halo', x: P(p[0], p[1])[0], y: P(p[0], p[1])[1] }, attrs || {});
      svg.append(s('text', a, str));
    }

    // input and T1
    wire([[0.2, 1], [1, 1]]); wire([[0.2, 3], [1, 3]]);
    svg.append(s('path', { class: 'rm-w', d: coil(P, 1, 1, 3, 1) }));
    svg.append(s('line', { class: 'rm-core', x1: P(1.35, 1.1)[0], y1: P(1.35, 1.1)[1], x2: P(1.35, 2.9)[0], y2: P(1.35, 2.9)[1] }));
    svg.append(s('line', { class: 'rm-core', x1: P(1.45, 1.1)[0], y1: P(1.45, 1.1)[1], x2: P(1.45, 2.9)[0], y2: P(1.45, 2.9)[1] }));
    svg.append(s('path', { class: 'rm-w', d: coil(P, 1.8, 1, 3, -1) }));
    // T2 and output
    svg.append(s('path', { class: 'rm-w', d: coil(P, 7.55, 1, 3, 1) }));
    svg.append(s('line', { class: 'rm-core', x1: P(7.9, 1.1)[0], y1: P(7.9, 1.1)[1], x2: P(7.9, 2.9)[0], y2: P(7.9, 2.9)[1] }));
    svg.append(s('line', { class: 'rm-core', x1: P(8, 1.1)[0], y1: P(8, 1.1)[1], x2: P(8, 2.9)[0], y2: P(8, 2.9)[1] }));
    svg.append(s('path', { class: 'rm-w', d: coil(P, 8.35, 1, 3, -1) }));
    wire([[8.35, 1], [9.15, 1]]); wire([[8.35, 3], [9.15, 3]]);
    // centre taps and the oscillator
    wire([[1.8, 2], [2.15, 2], [2.15, 4.6], [4.17, 4.6]]);
    wire([[4.93, 4.6], [7.2, 4.6], [7.2, 2], [7.55, 2]]);
    var g = P(4.55, 4.6), gr = 0.38 * k;
    svg.append(s('circle', { class: 'rm-gen', cx: g[0], cy: g[1], r: gr }));
    var q = gr * 0.45;
    svg.append(s('polyline', { class: 'rm-w', points: pts([[g[0] - 1.2 * q, g[1] + q * 0.6], [g[0] - 1.2 * q, g[1] - q * 0.6], [g[0], g[1] - q * 0.6],
      [g[0], g[1] + q * 0.6], [g[0] + 1.2 * q, g[1] + q * 0.6], [g[0] + 1.2 * q, g[1] - q * 0.6]]) }));
    // the ring wires: T1's ends to N and S, W over the top to A1, E down to A2
    wire([[1.8, 1], N], pathOf.wN);
    wire([[1.8, 3], S_], pathOf.wS);
    wire([W, [2.75, 0.35], [7.55, 0.35], [7.55, 1]], pathOf.wW);
    wire([E, [6.15, 3], [7.55, 3]], pathOf.wE);
    // the four diodes
    Object.keys(DIODES).forEach(function (id) {
      var a = P(DIODES[id][0][0], DIODES[id][0][1]), c = P(DIODES[id][1][0], DIODES[id][1][1]);
      var dx = c[0] - a[0], dy = c[1] - a[1], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
      var sz = Math.max(9, 0.2 * k), mx = (a[0] + c[0]) / 2, my = (a[1] + c[1]) / 2;
      var b0 = [mx - ux * sz, my - uy * sz], tip = [mx + ux * sz, my + uy * sz];
      var on = st.on.indexOf(id) >= 0;
      // a conducting diode takes the path of the T1 end it starts from: N's diodes (D1, D4 towards it) are "up"
      var path = !kase || !on ? null : (id === 'd1' || id === 'd4') ? 'up' : 'lo';
      var grp = s('g', { class: 'rm-d' + (kase && !on ? ' rm-blocked' : ''), 'data-path': path });
      grp.append(s('polyline', { class: 'rm-w', 'data-path': path, points: pts([a, b0]) }));
      grp.append(s('polyline', { class: 'rm-w', 'data-path': path, points: pts([tip, c]) }));
      grp.append(s('path', { class: 'rm-tri', d: 'M' + tip.join(',') + 'L' + (b0[0] - uy * sz) + ',' + (b0[1] + ux * sz) + 'L' + (b0[0] + uy * sz) + ',' + (b0[1] - ux * sz) + 'Z' }));
      grp.append(s('line', { class: 'rm-bar', x1: tip[0] - uy * sz, y1: tip[1] + ux * sz, x2: tip[0] + uy * sz, y2: tip[1] - ux * sz }));
      svg.append(grp);
      // the label, outside the ring
      // along the diode's normal, away from the ring's centre, clear of the symbol, and half a label to the side
      var cx = P(4.45, 2), nx = -uy, ny = ux;
      if (nx * (mx - cx[0]) + ny * (my - cx[1]) < 0) { nx = -nx; ny = -ny; }
      var lx = mx + nx * (sz + 0.5 * rem) + Math.sign(nx) * 0.8 * rem, ly = my + ny * (sz + 0.5 * rem) + 0.35 * rem + (ny > 0 ? 0.4 * rem : -0.1 * rem);
      svg.append(s('text', { class: 'rm-halo rm-big' + (kase && !on ? ' rm-off' : ''), 'data-path': path, x: lx, y: ly, 'text-anchor': 'middle', translate: 'no' }, t(id)));
      if (kase && !on) {
        var xs = 0.35 * rem;
        svg.append(s('line', { class: 'rm-x', x1: mx - xs, y1: my - xs, x2: mx + xs, y2: my + xs }));
        svg.append(s('line', { class: 'rm-x', x1: mx - xs, y1: my + xs, x2: mx + xs, y2: my - xs }));
      }
    });
    [N, S_, W, E, [1.8, 2], [7.55, 2]].forEach(dot);
    [[0.2, 1], [0.2, 3], [9.15, 1], [9.15, 3]].forEach(term);

    // names: transformers, the three voltages
    text([1.4, 0.75], t('t1'), { 'text-anchor': 'middle', translate: 'no' });
    text([7.95, 0.75], t('t2'), { 'text-anchor': 'middle', translate: 'no' });
    text([0.05, 2], t('nameU1'), { class: 'rm-halo rm-big', 'text-anchor': 'end', dy: '0.35em', translate: 'no' });
    text([9.3, 2], t('nameU3'), { class: 'rm-halo rm-big', dy: '0.35em', translate: 'no' });
    text([4.55, 5.0], t('nameU2'), { class: 'rm-halo rm-big', 'text-anchor': 'middle', dy: '1em', translate: 'no' });

    // node voltages in this case, after figures 1123 and 1124 (only where they fit next to the wires)
    if (kase && k >= 3.5 * rem) {
      var sg = st.s > 0 ? '+' : '−';
      var lN = t('plusHalf', { s: sg }), lS = t('minusHalf', { s: sg });
      text([3.6, 0.8], lN, { 'data-path': 'up', 'text-anchor': 'middle', translate: 'no' });
      text([3.6, 3.25], lS, { 'data-path': 'lo', 'text-anchor': 'middle', dy: '0.8em', translate: 'no' });
      // A1 and A2 carry the voltage of the T1 end that reaches them
      text([7.4, 0.8], st.nTo === 'a1' ? lN : lS, { 'data-path': st.nTo === 'a1' ? 'up' : 'lo', 'text-anchor': 'end', translate: 'no' });
      text([7.05, 3.25], st.nTo === 'a2' ? lN : lS, { 'data-path': st.nTo === 'a2' ? 'up' : 'lo', 'text-anchor': 'end', dy: '0.8em', translate: 'no' });
      text([2.3, 4.35], t('tap1', { s: sg }), { translate: 'no' });
      text([7.05, 4.35], t('tap2'), { 'text-anchor': 'end', translate: 'no' });
    }
    box.replaceChildren(svg);
  }

  // An axis line with an arrow head at (x1, y1).
  function axis(svg, x0, y0, x1, y1, d) {
    var len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    svg.append(s('line', { class: 'rm-axis', x1: x0, y1: y0, x2: x1 - ux * d, y2: y1 - uy * d }));
    svg.append(s('path', { class: 'rm-axhead', d: 'M' + x1 + ',' + y1 + 'L' + (x1 - ux * d - uy * d * 0.45) + ',' + (y1 - uy * d + ux * d * 0.45) +
      'L' + (x1 - ux * d + uy * d * 0.45) + ',' + (y1 - uy * d - ux * d * 0.45) + 'Z' }));
  }

  // ── the waveforms, after the figures: U2 on top, U1 in the middle, U3 below, on one time axis of 12 half periods.
  //    The current half period is a band through all three; U3 is drawn bold up to its end, with U1 dotted behind it. ──
  function drawPlot(box, st) {
    var W_ = box.clientWidth, H_ = box.clientHeight;
    if (!W_ || !H_) return;
    var rem = remPx(), left = 3.2 * rem, right = 1.2 * rem, top = 1.6 * rem, gap = 1.6 * rem;
    var sh = (H_ - top - 2 * gap - 1.4 * rem) / 3, amp = sh / 2 / 1.15;
    var X = function (tt) { return left + tt / L.steps * (W_ - left - right); };
    var svg = s('svg', { width: W_, height: H_, 'aria-hidden': 'true' });
    var tr = L.trace(st.u1, st.r);
    var rows = ['u2', 'u1', 'u3'], names = { u2: t('nameU2'), u1: t('nameU1'), u3: t('nameU3') };
    var mid = {};
    rows.forEach(function (row, i) { mid[row] = top + i * (sh + gap) + sh / 2; });
    if (st.kase) {
      svg.append(s('rect', { class: 'rm-now', x: X(st.n - 1), y: top - 0.6 * rem, width: X(st.n) - X(st.n - 1), height: 3 * sh + 2 * gap + 0.6 * rem }));
      svg.append(s('text', { class: 'rm-halo', x: (X(st.n - 1) + X(st.n)) / 2, y: top - 0.8 * rem, 'text-anchor': 'middle', translate: 'no' }, String(st.n)));
    }
    rows.forEach(function (row) {
      var y0 = mid[row], Y = function (v) { return y0 - v * amp; };
      svg.append(s('line', { class: 'rm-grid', x1: left, x2: W_ - right, y1: Y(1), y2: Y(1) }));
      svg.append(s('line', { class: 'rm-grid', x1: left, x2: W_ - right, y1: Y(-1), y2: Y(-1) }));
      svg.append(s('line', { class: 'rm-axis', x1: left, x2: left, y1: Y(1.15), y2: Y(-1.15) }));
      axis(svg, left, y0, W_ - right + 0.6 * rem, y0, 0.6 * rem);
      svg.append(s('text', { class: 'rm-halo rm-big', x: left - 0.5 * rem, y: y0, dy: '0.35em', 'text-anchor': 'end', translate: 'no' }, names[row]));
      svg.append(s('text', { class: 'rm-halo', x: W_ - right + 0.6 * rem, y: y0 + 1.3 * rem, 'text-anchor': 'end', translate: 'no' }, t('tTime')));
      var line = function (list, cls) { svg.append(s('polyline', { class: 'rm-wave' + (cls ? ' ' + cls : ''), 'data-row': row, points: pts(list.map(function (p) { return [X(p.t), Y(p[row])]; })) })); };
      if (row === 'u3') {
        line(tr, 'rm-rest');
        svg.append(s('polyline', { class: 'rm-wave rm-ghost', points: pts(tr.map(function (p) { return [X(p.t), Y(p.u1)]; })) }));
        var done = tr.slice(0, st.n * (L.POINTS + 1));   // up to the end of the current half period, before its edge
        if (done.length > 1) line(done);
      } else {
        line(tr);
      }
      if (st.kase) {
        var v = row === 'u2' ? st.s * L.U2 : row === 'u1' ? st.u : st.u3;
        svg.append(s('circle', { class: 'rm-cur', 'data-row': row, cx: X(st.t), cy: Y(v), r: 0.42 * rem }));
      }
    });
    // ±1 V on the top strip's scale
    svg.append(s('text', { class: 'rm-halo', x: left - 0.4 * rem, y: mid.u2 - amp, dy: '0.35em', 'text-anchor': 'end', translate: 'no' }, peak(1)));
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'u1', type: 'range', label: t('u1'), hint: t('u1Hint'), min: L.U1_MIN, max: L.U1_MAX, step: L.U1_STEP, format: function (v) { return peak(L.snap(v, L.U1_MIN, L.U1_MAX, L.U1_STEP, 0)); } },
      { key: 'r', type: 'range', label: t('r'), hint: t('rHint'), min: L.R_MIN, max: L.R_MAX, step: L.R_STEP, format: ratio }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: 0 }; }),
    legend: [
      { c: 1, label: t('legendUpper') },
      { c: 3, shape: 'hollow', label: t('legendLower') },
      { shape: 'hl', label: t('legendNow') }
    ],

    render: function (c) {
      var st = c.state;
      var circ = h('div', { class: 'rm-circ' });
      var plot = h('div', { class: 'rm-plot' });
      var read = st.kase
        ? h('div', { class: 'rm-read' },
          h('h2', null, t(st.kase === 1 ? 'case1Title' : 'case2Title')),
          h('p', { translate: 'no' }, t(st.kase === 1 ? 'formula1' : 'formula2')),
          h('p', { class: 'rm-num', translate: 'no' }, t('readNow', { u: volt(st.u), u3: volt(st.u3) })))
        : h('div', { class: 'rm-read' }, h('h2', null, t('restTitle')), h('p', null, t('restText')));
      c.stage.replaceChildren(h('div', { class: 'rm' }, h('div', { class: 'rm-left' }, circ, read), plot));
      drawCircuit(circ, st);
      drawPlot(plot, st);
    },

    caption: function (c) {
      var st = c.state;
      if (!st.kase) return t('captionRest');
      var b = function (x) { return h('b', null, x); };
      var parts = t.parts(st.kase === 1 ? 'caption1' : 'caption2', { n: b(String(st.n)), u3: b(volt(st.u3)) });
      var out = [parts];
      if (st.u1 === 0) out.push(t('captionNone'));
      if (st.last) out.push(t('captionLast'));
      return out;
    }
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
