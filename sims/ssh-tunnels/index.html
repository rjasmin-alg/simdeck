<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Data (host names, addresses, ports, message names) is not language. */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'tn-mono' : cls || null }, String(text)); }
  function B(text) { return h('b', null, data(text)); }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function ap(a, port) { return a + ':' + port; }
  var SVC = { ssh: 'svcSsh', web: 'svcWeb', db: 'svcDb' };

  /** The forwarding as a spec, without any tool's syntax: "8080 → localhost:80", "1080" for dynamic. */
  function specOf(s, p) {
    var bind = L.listener(s.kind, s.target || {}, !!p.remoteBindAny);
    return s.kind === 'D' ? String(bind.port) : bind.port + ' → ' + ap(s.target.host, s.target.port);
  }
  /** Where the target of this run lands (rule 7), before the far end tries it: for the lane card. */
  function landing(s) {
    if (s.kind === 'D') return null;
    return L.resolve(L.ends(s.kind).far, s.target);
  }
  function dstText(d) { return d.addr ? ap(d.addr, d.port) : ap(d.host, d.port); }

  // ── the chart (K1) ──

  function lanes(c) {
    var s = c.state, tun = s.tunnels[0], kind = s.kind, ln = L.lanesFor(kind);
    var bind = tun ? tun.bind : null, land = landing(s);
    var appName = kind === 'D' || (s.target && s.target.port === 80) ? 'laneBrowser' : 'laneProgram';
    function card(x) { return h('div', { class: 'tn-card' }, x); }
    var listenAt = bind ? card(t.parts('bodyListens', { addr: data(ap(bind.addr, bind.port), '') })) : card(t('bodyIdle'));
    var opens = card(t('bodyOpensTarget'));
    var landed = s.flows[0] && s.flows[0].dst;
    var tgtTags = kind === 'D' ? h('span', { class: 'tn-sm' }, t('hostSitesNote'))
      : s.mixup && !landed ? data(ap(s.target.host, s.target.port), 'tn-mono tn-sm')
      : data(land.host + (land.addr ? ' ' + ap(land.addr, land.port) : ''), 'tn-mono tn-sm');
    var tgtBody = card(t.parts('bodyReachedFrom', { host: data(L.ends(kind).far, '') }));
    var appBody = bind ? card(t.parts('bodyConnects', { addr: data(ap(L.LOOP, bind.port), '') })) : card(t('bodyIdle'));
    var out = {};
    out[ln.near] = { id: ln.near, mark: ln.near, c: ln.near === 'C' ? 1 : 6, shape: 'square',
      name: t(ln.near === 'C' ? 'laneClient' : 'laneServer'), tags: data(ln.near === 'C' ? L.CLIENT : L.SERVER + ' · ' + L.HOST, 'tn-mono tn-sm'), body: listenAt };
    out[ln.far] = { id: ln.far, mark: ln.far, c: ln.far === 'C' ? 1 : 6, shape: 'square',
      name: t(ln.far === 'C' ? 'laneClient' : 'laneServer'), tags: data(ln.far === 'C' ? L.CLIENT : L.SERVER + ' · ' + L.HOST, 'tn-mono tn-sm'), body: opens };
    out[ln.app] = { id: ln.app, mark: ln.app, c: 2, name: t(kind === 'R' ? 'laneProgram' : appName),
      tags: data(kind === 'R' ? L.SERVER : L.CLIENT, 'tn-mono tn-sm'), body: appBody };
    out[ln.tgt] = { id: ln.tgt, mark: ln.tgt, c: 4, name: t('laneTarget'), tags: tgtTags, body: tgtBody };
    return ['A', 'C', 'S', 'B'].map(function (id) { return out[id]; });
  }

  function rowOf(r, c) {
    var changed = r.n === c.n;
    var m = { from: r.from, to: r.to, changed: changed };
    switch (r.k) {
      case 'session': return Object.assign(m, { c: 1, label: 'SSH', fields: h('span', null, data(':22', ''), ' ', t('rowSession')) });
      case 'fwdReq': return Object.assign(m, { c: 1, lock: true, label: 'tcpip-forward', fields: data(r.host + ' ' + r.port, '') });
      case 'fwdOk': return Object.assign(m, { c: 6, lock: true, label: 'REQUEST_SUCCESS' });
      case 'listen': return { kind: 'note', lane: r.lane, k: 'solid', changed: changed,
        text: h('span', null, t.parts(r.socks ? 'rowListenSocks' : 'rowListen', { addr: data(ap(r.addr, r.port), '') })) };
      case 'connect': return Object.assign(m, { c: 2, label: 'TCP', time: h('span', null, t('chShort', { n: r.ch })),
        fields: h('span', null, t('rowConnect'), ' ', data(ap(r.addr, r.port), '')) });
      case 'socks': return Object.assign(m, { c: 2, label: 'SOCKS CONNECT', fields: data(ap(r.host, r.port), '') });
      case 'open': return Object.assign(m, { c: r.from === 'C' ? 1 : 6, lock: true, label: 'CHANNEL_OPEN', fields: data(r.type === 'direct-tcpip' ? r.type + ' ' + ap(r.host, r.port) : r.type, '') });
      case 'tconnect': return r.fail
        ? Object.assign(m, { c: 1, label: 'TCP', drop: true, line: 'dashed', re: (function () { var o = {}; o[r.to] = t('rowNoRoute'); return o; })() })
        : Object.assign(m, { c: r.from === 'C' ? 1 : 6, label: 'TCP', fields: h('span', null, t('rowConnect'), ' ', data(ap(r.host, r.port), '')) });
      case 'confirm': return Object.assign(m, { c: r.from === 'C' ? 1 : 6, lock: true, label: 'CHANNEL_OPEN_CONFIRMATION' });
      case 'openFail': return Object.assign(m, { c: 1, lock: true, label: 'CHANNEL_OPEN_FAILURE' });
      case 'close': return Object.assign(m, { c: 6, label: 'TCP', line: 'dashed', fields: h('span', null, t('rowClose')) });
      case 'data': return Object.assign(m, { c: r.seg === 0 ? 2 : r.from === 'C' ? 1 : 6, label: h('span', null, t('rowData')) });
      case 'chdata': return Object.assign(m, { c: r.from === 'C' ? 1 : 6, lock: true, label: 'CHANNEL_DATA' });
    }
    return null;
  }

  function renderChart(c) {
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '5.6rem',
      lanes: lanes(c),
      rows: c.state.rows.map(function (r) { return rowOf(r, c); }).filter(Boolean),
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── the scene ──

  /** Channels whose connection landed on host:port (the target's socket in the host card). */
  function hits(c, host, port) {
    return c.state.flows.filter(function (f) { return f.dst && !f.fail && f.dst.host === host && f.dst.port === port; })
      .map(function (f) { return f.ch; });
  }
  function svcLine(c, host, x, roleWord) {
    var s = c.state, f0 = s.flows[0], chs = hits(c, host, x.port), st = '', mark = null;
    if (chs.length) { st = 'hit'; mark = h('span', { class: 'tn-mark' }, '✓ ', t.n('markHit', chs.length, { chs: chs.join(', ') })); }
    else if (s.mixup && f0 && f0.dst && host === L.CLIENT && x.role === 'web') { st = 'meant'; mark = h('span', { class: 'tn-mark' }, '✕ ', t('meant')); }
    return h('li', { class: 'tn-sock', dataset: { own: 'svc', st: st } },
      h('span', { class: 'tn-plug', 'aria-hidden': 'true' }), data(ap(x.addr, x.port)), roleWord,
      x.addr === L.LOOP ? h('span', { class: 'tn-reach' }, t('reachLocal')) : null, mark);
  }

  function sockets(c, host) {
    var s = c.state, tun = s.tunnels[0];
    var list = (L.SERVICES[host] || []).map(function (x) { return svcLine(c, host, x, h('span', null, t(SVC[x.role]))); });
    if (tun && tun.bind.host === host) {
      var b = tun.bind;
      list.push(h('li', { class: 'tn-sock' + (tun.n === c.n ? ' sd-changed' + anim(c) : ''), dataset: { own: 'tun' } },
        h('span', { class: 'tn-plug', 'aria-hidden': 'true' }), data(ap(b.addr, b.port)), h('span'),
        h('span', { class: 'tn-reach' }, t(s.kind === 'D' ? 'svcSocks' : s.kind === 'R' ? 'svcFwdSrv' : 'svcFwdCli'), ' · ',
          t(L.reach(b.addr) === 'local' ? 'reachLocal' : 'reachAny'))));
    }
    return h('ul', { class: 'tn-socks' }, list);
  }

  function hostCards(c) {
    var s = c.state;
    var cli = h('section', { class: 'tn-host', dataset: { h: 'cli' }, style: { gridColumn: '1', gridRow: '1' } },
      h('h2', null, data(L.CLIENT, ''), ' ', h('span', { class: 'tn-sm' }, t('hostClient'))), sockets(c, L.CLIENT));
    var srv = h('section', { class: 'tn-host', dataset: { h: 'srv' }, style: { gridColumn: '3', gridRow: '1' } },
      h('h2', null, data(L.SERVER, ''), ' ', h('span', { class: 'tn-sm' }, data(L.HOST, ''), ' · ', t('hostServer'))), sockets(c, L.SERVER));
    var far = s.kind === 'D'
      ? h('section', { class: 'tn-host', dataset: { h: 'far' }, style: { gridColumn: '5', gridRow: '1' } },
        h('h2', null, t('hostSites')),
        h('ul', { class: 'tn-socks' }, L.SITES.map(function (x) { return svcLine(c, x, { addr: x, port: 80 }, null); })))
      : h('section', { class: 'tn-host', dataset: { h: 'far' }, style: { gridColumn: '5', gridRow: '1' } },
        h('h2', null, data(L.DB, ''), ' ', h('span', { class: 'tn-sm' }, data(L.DB_ADDR, ''))),
        sockets(c, L.DB), h('p', { class: 'tn-note' }, t('hostInternal')));
    var pipeHead = h('div', { class: 'tn-head', style: { gridColumn: '2' } }, s.session
      ? [h('b', null, h('span', { class: 'tn-lock', 'aria-hidden': 'true' }), t('pipeTitle')), h('span', { class: 'tn-sm' }, data(L.HOST + ':22', ''))]
      : h('span', { class: 'tn-sm' }, t('pipeNone')));
    var netHead = h('div', { class: 'tn-head', style: { gridColumn: '4' } }, h('span', { class: 'tn-sm' }, t('netTitle')));
    return [cli, pipeHead, srv, netHead, far];
  }

  /** One segment drawn in a cell: a line with its tag; dir puts the arrow head; edge runs it into the next column. */
  function seg(c, g, f, edge, noArrow, noTag) {
    var tag = noTag ? '' : g.kind === 'ssh' ? h('span', null, h('span', { class: 'tn-lock', 'aria-hidden': 'true' }), t('channel', { n: f.ch }))
      : g.kind === 'net' ? t('tagPlain') : g.kind === 'fail' ? '✕ ' + t('tagFail') : t('tagLoop');
    var ds = { dir: g.dir, edge: edge || '' };
    if (noArrow) ds.noarrow = '1';
    if (f.phase === 'data') ds.flow = '1';
    return h('div', { class: 'tn-seg' + (g.n === c.n ? ' sd-changed' + anim(c) : ''), dataset: { k: g.kind } },
      h('span', { class: 'tn-tag' }, tag), h('span', { class: 'tn-line', dataset: ds }));
  }
  function end(c, n, text, fail) {
    return h('span', { class: 'tn-end' + (n === c.n ? ' sd-changed' + anim(c) : ''), dataset: fail ? { fail: '1' } : {} }, text);
  }

  /** The cells of one connection, one per column. */
  function flowCells(c, f, row) {
    var s = c.state, kind = s.kind, cells = { cli: [], pipe: [], srv: [], net: [], far: [] };
    var segs = {};
    f.segs.forEach(function (g, i) { segs[i] = g; });
    var g0 = segs[0], gs = segs[1], gt = segs[2];
    var lst = data(ap(f.listener.addr === L.ANY ? L.ANY : f.listener.addr, f.listener.port));
    var appWord = kind === 'R' ? t('appProgram') : (kind === 'D' || (s.target && s.target.port === 80) ? t('appBrowser') : t('appProgram'));
    if (kind !== 'R') {
      // client side: app → listener (loopback); server side: SSH server → target
      cells.cli.push(end(c, g0.n, appWord), seg(c, g0, f), end(c, g0.n, lst));
      if (gs) cells.pipe.push(seg(c, gs, f, 'l r'));
      if (gt && gt.kind === 'loop') {
        cells.srv.push(end(c, gt.n, t('endSshSrv')), seg(c, gt, f), end(c, gt.n, data(dstText(f.dst))));
      } else if (gt) {
        cells.srv.push(end(c, gt.n, t('endSshSrv')), seg(c, gt, f, 'r', true));
        cells.net.push(seg(c, gt, f, 'l r', true, true));
        cells.far.push(seg(c, gt, f, 'l', false, true), end(c, gt.n, data(dstText(f.dst))));
      }
    } else {
      // server side: program → listener (loopback), drawn right to left; client side: SSH client → target
      if (gt && gt.kind === 'fail') cells.cli.push(end(c, gt.n, data(ap(f.dst.host, f.dst.port)), true), seg(c, gt, f), end(c, gt.n, t('endSshCli')));
      else if (gt) cells.cli.push(end(c, gt.n, data(dstText(f.dst))), seg(c, gt, f), end(c, gt.n, t('endSshCli')));
      if (gs) cells.pipe.push(seg(c, gs, f, 'l r'));
      cells.srv.push(end(c, g0.n, lst), seg(c, g0, f), end(c, g0.n, appWord));
    }
    var cols = ['cli', 'pipe', 'srv', 'net', 'far'];
    return [h('div', { class: 'tn-flowhead', style: { gridRow: String(row) } }, t('chShort', { n: f.ch }))].concat(cols.map(function (k, i) {
      return h('div', { class: 'tn-cell', dataset: { c: k }, style: { gridColumn: String(i + 1), gridRow: String(row) } }, cells[k]);
    }));
  }

  function renderScene(c) {
    var s = c.state, rows = Math.max(2, s.flows.length + 1);
    var kids = hostCards(c);
    kids.unshift(h('div', { class: 'tn-pipe', dataset: s.session ? {} : { off: '1' }, style: { gridRow: '1 / ' + (rows + 1) }, 'aria-hidden': 'true' }));
    s.flows.forEach(function (f, i) { kids = kids.concat(flowCells(c, f, i + 2)); });
    return h('div', { class: 'tn-scene' }, kids);
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, ev = s.ev, p = c.params, out = [];
    var spec = B(specOf(s, p));
    switch (ev.kind) {
      case 'start':
        if (s.mixup) out = t.parts('capStartMixup', { spec: spec });
        else if (s.kind === 'D') out = t.parts('capStartD', { spec: spec });
        else if (s.kind === 'R') out = t.parts('capStartR', { spec: spec });
        else if (s.target.host === 'localhost' && s.target.port === 80) out = t.parts('capStartLoop', { web: B(ap(L.LOOP, 80)), spec: spec });
        else if (s.target.host === L.DB_ADDR) out = t.parts('capStartInternal', { db: B(L.DB + ' ' + ap(L.DB_ADDR, 5432)), spec: spec });
        else out = t.parts('capStartL', { spec: spec });
        break;
      case 'setup': {
        var lst = B(ap(ev.listener.addr, ev.listener.port)), host = B(L.HOST + ':22');
        if (s.kind === 'R') {
          out = t.parts('capSetupR', { host: host, req: B('tcpip-forward localhost ' + ev.listener.port), listen: lst })
            .concat(' ', ev.reach === 'local' ? t('capReachLocal') : t.parts('capReachAny', { port: B(ev.listener.port) }));
        } else out = t.parts(s.kind === 'D' ? 'capSetupD' : 'capSetupL', { host: host, listen: lst });
        break;
      }
      case 'connect': {
        var l = B(ap(ev.listener.addr === L.ANY ? L.LOOP : ev.listener.addr, ev.listener.port));
        if (s.kind === 'D') out = t.parts('capConnectD', { listen: l, dest: B(ap(ev.req.host, ev.req.port)) });
        else if (s.kind === 'R') out = t.parts('capConnectR', { listen: l });
        else if (s.target.port === 80) out = t.parts('capConnectBrowser', { url: B('http://localhost:' + ev.listener.port + '/') });
        else out = t.parts('capConnectL', { listen: l });
        break;
      }
      case 'open':
        out = s.kind === 'R'
          ? t.parts('capOpenR', { n: B(ev.ch), msg: B('CHANNEL_OPEN forwarded-tcpip'), listen: B(ap('localhost', ev.listener.port)) })
          : t.parts('capOpenL', { n: B(ev.ch), msg: B('CHANNEL_OPEN direct-tcpip'), req: B(ap(ev.req.host, ev.req.port)) });
        break;
      case 'target': {
        var d = ev.dst;
        if (ev.fail) out = t.parts('capTargetFail', { dst: B(ap(d.addr, d.port)), msg: B('CHANNEL_OPEN_FAILURE') });
        else if (ev.mixup) out = t.parts('capTargetMixup', { dst: B(dstText(d)) });
        else if (d.seg === 'loop') out = t.parts('capTargetLoop', { host: B(d.host), dst: B(dstText(d)) });
        else if (d.role === 'site') out = t.parts('capTargetSite', { dst: B(dstText(d)) });
        else out = t.parts('capTargetNet', { dst: B(dstText(d)), host: B(d.host) });
        if (!ev.fail && !ev.mixup && d.seg === 'loop' && d.host === L.SERVER && d.role === 'web') out = out.concat(' ', t('capLoopWeb'));
        break;
      }
      case 'data':
        if (ev.fail) out = [t('capDataFail')];
        else if (ev.mixup) out = t.parts('capDataMixup', { own: B('http://localhost/') });
        else if (ev.plainOnWire) out = t.parts('capDataNet', { n: B(ev.ch), dst: B(dstText(ev.dst)) });
        else out = t.parts('capDataLoop', { n: B(ev.ch) });
        break;
      case 'more':
        if (ev.fail) out = t.parts('capMoreFail', { n: B(ev.ch), dst: B(ap(ev.dst.addr, ev.dst.port)) });
        else if (s.kind === 'D') out = t.parts('capMoreD', { n: B(ev.ch), dest: B(ap(ev.req.host, ev.req.port)) });
        else out = t.parts('capMore', { n: B(ev.ch), msg: B('CHANNEL_OPEN') }).concat(ev.plainOnWire ? [' ', t('capPlainTail')] : []);
        break;
    }
    if (c.last && c.n > 0) out = out.concat(' ', t(L.canSend(p) ? 'capSend' : 'capFull'));
    return out;
  }

  // ── controls ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      // `mixup` (set by the mix-up preset) and `extra` (T presses) are model params without a control: the kit keeps
      // only controls in the URL (NOTES.md, Shared requests, as ssh-key-auth's `queue`).
      { key: 'kind', type: 'choice', label: t('kind'), resets: true, options: [['L', t('kindL')], ['R', t('kindR')], ['D', t('kindD')]] },
      { key: 'target', type: 'choice', label: t('target'), resets: true, visible: function (p) { return p.kind !== 'D'; },
        options: [['localhost:80', data('localhost:80', '')], ['localhost:22', data('localhost:22', '')], ['db1:5432', data('db1:5432', '')]] },
      { key: 'remoteBindAny', type: 'toggle', label: t('remoteBindAny'), hint: t('remoteBindAnyHint'), visible: function (p) { return p.kind === 'R'; } },
      { type: 'button', label: t('btnSend'), hint: t('btnSendHint'), key: 't', run: function (sim) {
        if (!L.canSend(sim.params)) { sim.render(); return; }
        var atEnd = sim.n === sim.steps;
        sim.set({ extra: L.sendMore(sim.params) });
        if (atEnd) sim.go(sim.steps);
      } }
    ],

    presets: [
      { id: 'local-to-loopback', label: t('presetLoop'), hint: t('presetLoopHint'), params: L.PRESETS['local-to-loopback'] },
      { id: 'local-to-internal', label: t('presetInternal'), hint: t('presetInternalHint'), params: L.PRESETS['local-to-internal'] },
      { id: 'remote', label: t('presetRemote'), hint: t('presetRemoteHint'), params: L.PRESETS['remote'] },
      { id: 'dynamic', label: t('presetDynamic'), hint: t('presetDynamicHint'), params: L.PRESETS['dynamic'] },
      { id: 'localhost-mixup', label: t('presetMixup'), hint: t('presetMixupHint'), params: L.PRESETS['localhost-mixup'] }
    ],

    legend: [
      { shape: 'pipe', label: t('legPipe') },
      { shape: 'plain', label: t('legPlain') },
      { shape: 'loop', label: t('legLoop') },
      { shape: 'plug', label: t('legPlug') },
      { shape: 'arrow', label: t('legArrow') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'tn' }, chart, renderScene(c)));
      chart.fit();
    },

    caption: caption
  });

  // `mixup` belongs to the mix-up preset: once a param is changed by hand (the preset is no longer active), drop it.
  window.simdeck.on(function (c) {
    if (c.params.mixup && c.preset !== 'localhost-mixup') Promise.resolve().then(function () { window.simdeck.set({ mixup: false }); });
  });
})();
</script>
</body>
</html>
