<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SCALE = 45;                                     // days on the deadline strip

  function b(text) { return h('b', null, text); }
  function pct(x) { return (Math.max(0, Math.min(1, x)) * 100).toFixed(3) + '%'; }
  /** A day number as a calendar date, in the page's language. */
  function date(day) {
    var x = L.dateOf(day);
    return t('date', { d: x.d, m: t('monthNames').split(',')[x.m - 1], y: x.y });
  }
  function days(n) { return t.n('daysN', n); }

  // ── the request and the deadline ──

  function request(s) {
    var er = s.params.kind === 'erasure';
    return h('div', { class: 'ds-req' },
      b(t('reqTitle')),
      h('q', null, t(er ? 'reqErasure' : 'reqAccess')),
      h('span', null, t('reqWho', { date: date(0) })));
  }

  function clock(s) {
    var q = s.params, x = function (d) { return pct(d / SCALE); };
    var kids = [h('div', { class: 'ds-axis' })];
    var now = s.done ? s.answer : s.day;
    var wait = Math.min(q.noticed, now);
    if (wait > 0) kids.push(h('div', { class: 'ds-fill', dataset: { k: 'wait' }, style: { left: x(0), width: x(wait) } }));
    var inTime = Math.min(now, s.due);
    if (inTime > wait) kids.push(h('div', { class: 'ds-fill', style: { left: x(wait), width: x(inTime - wait) } }));
    if (now > s.due) kids.push(h('div', { class: 'ds-fill', dataset: { k: 'over' }, style: { left: x(s.due), width: x(now - s.due) } }));
    kids.push(h('span', { class: 'ds-mark', dataset: { m: 'due' }, style: { left: x(s.due) } }));
    kids.push(h('span', { class: 'ds-ml', dataset: { row: 'top', side: 'l' }, style: { left: x(s.due) } }, t('mDue', { date: date(s.due) })));
    if (s.done) {
      kids.push(h('span', { class: 'ds-mark', dataset: { m: 'answer' }, style: { left: x(s.answer) } }));
      kids.push(h('span', { class: 'ds-ml', dataset: { row: 'bot', side: s.answer / SCALE > 0.5 ? 'l' : '' }, style: { left: x(s.answer) } }, t('mAnswer', { d: s.answer })));
    } else if (s.n > 0) {
      kids.push(h('span', { class: 'ds-ml', dataset: { row: 'bot', side: now / SCALE > 0.5 ? 'l' : '' }, style: { left: x(now) } }, '▲ ' + t('dayN', { d: now })));
    } else {
      kids.push(h('span', { class: 'ds-ml', dataset: { row: 'bot' }, style: { left: '0' } }, t('mReceived')));
    }
    return h('div', { class: 'ds-clock' },
      h('div', { class: 'ds-lab' }, b(t('laneClock')), h('span', null, t('laneClockSub'))),
      h('div', null, h('div', { class: 'ds-track' }, kids), h('div', { class: 'ds-ext' }, t('mExt', { date: date(s.ext) }))));
  }

  // ── the places ──

  var GROUP = { wait: 'wait', found: 'ok', erased: 'ok', processor: 'ok', aged: 'ok', noted: 'info', kept: 'kept',
    agedPart: 'backup', recorded: 'backup', unrecorded: 'backup', missed: 'bad', still: 'bad' };

  /** What a card says now: the model's status, with the erasure's backups and the "afterwards" view. */
  function shown(s, x) {
    if (x.status === 'wait') return 'wait';
    var er = s.params.kind === 'erasure', after = s.stage === 'after';
    if (x.id === 'backups' && er) return after ? (s.still > 0 ? 'agedPart' : 'aged') : x.onList ? 'recorded' : 'unrecorded';
    if (x.status === 'missed') return er && after ? 'still' : 'missed';
    return x.status;
  }

  function card(s, x, i) {
    var st = shown(s, x);
    var label = t('st_' + st, { date: s.gone !== null ? date(s.gone) : '' });
    var day = x.onList && st !== 'wait' ? h('span', { class: 'ds-day' }, t('dayN', { d: x.day })) : null;
    return h('section', { class: 'ds-card', dataset: { on: x.onList ? '1' : '0', cur: s.at === i ? '1' : '' } },
      h('div', { class: 'ds-head' }, h('span', { class: 'ds-no', translate: 'no' }, String(i + 1)), b(t('pl_' + x.id))),
      h('div', { class: 'ds-what' }, t('wh_' + x.id, { b: t.n('monthsN', s.params.backup) })),
      h('span', { class: 'ds-tag', dataset: { on: x.onList ? '1' : '0' } }, t(x.onList ? 'onList' : 'offList')),
      h('div', { class: 'ds-st', dataset: { g: GROUP[st] } }, h('span', null, label), day));
  }

  // ── the summary ──

  function chip(g, label, value) {
    return h('span', { class: 'ds-chip', dataset: { g: g } }, h('span', null, label), b(value));
  }

  function summary(s) {
    var er = s.params.kind === 'erasure';
    var seen = s.places.filter(function (x) { return x.status !== 'wait' && x.onList; }).length;
    var kids = [chip(s.done && s.missed > 0 ? 'bad' : '', t('sumFound'), seen + ' / 8')];
    if (!s.done) {
      kids.push(h('span', { class: 'ds-chip', dataset: { g: 'wait' } }, t('sumWait')));
      return h('div', { class: 'ds-sum' }, kids);
    }
    kids.push(chip(s.onTime ? 'ok' : 'bad', t('sumAnswer'), date(s.answer) + ' · ' + (s.onTime ? t('sumOnTime') : t('sumLate', { d: days(s.late) }))));
    if (er) {
      kids.push(chip('ok', t('sumErased'), String(s.erased)));
      kids.push(chip('kept', t('sumKept'), String(s.kept)));
      if (s.gone !== null) kids.push(chip('backup', t('sumBackups'), date(s.gone)));
      kids.push(chip(s.still > 0 ? 'bad' : '', t('sumStill'), String(s.still)));
    }
    return h('div', { class: 'ds-sum' }, kids);
  }

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'ds' },
      h('div', { class: 'ds-top' }, request(s), clock(s)),
      h('div', { class: 'ds-places' }, s.places.map(function (x, i) { return card(s, x, i); })),
      summary(s),
      h('p', { class: 'ds-foot' }, t('foot'))));
  }

  // ── caption ──

  function caption(c) {
    var s = c.state, q = s.params;
    var x = s.at !== null ? s.places[s.at] : null;
    var v = {
      date: b(date(s.stage === 'received' ? 0 : s.day)),
      due: b(date(s.due)),
      noticed: b(days(q.noticed)),
      place: b(x ? t('pl_' + x.id) : ''),
      d: b(days(x ? x.took : 0)),
      b: b(t.n('monthsN', q.backup)),
      gone: b(s.gone !== null ? date(s.gone) : ''),
      day: b(String(s.day)),
      left: b(days(Math.max(0, s.due - s.day))),
      over: b(days(Math.max(0, s.day - s.due))),
      found: b(String(s.found)),
      erased: b(t.n('placesLocN', s.erased)),
      still: b(t.n('placesLocN', s.still)),
      notGot: b(t.n('placesGenN', s.still))
    };
    var out = [];
    L.captionKeys(s).forEach(function (k, i) {
      if (i) out.push(' ');
      out = out.concat(t.parts(k, v));
    });
    return out;
  }

  // ── controls ──

  var params = [
    { key: 'kind', type: 'choice', label: t('pKind'), options: [['access', t('oAccess')], ['erasure', t('oErasure')]] },
    { key: 'map', type: 'choice', label: t('pMap'), options: [['good', t('oGood')], ['partial', t('oPartial')], ['none', t('oNone')]] },
    { key: 'noticed', type: 'range', label: t('pNoticed'), min: L.NOTICED[0], max: L.NOTICED[1], step: 1, format: days },
    { key: 'backup', type: 'choice', label: t('pBackup'), options: L.BACKUPS.map(function (n) { return [n, t.n('monthsN', n)]; }) }
  ];

  var labels = { good: 'prGood', partial: 'prPartial', none: 'prNone', late: 'prLate',
    'erase-good': 'prEraseGood', 'erase-none': 'prEraseNone' };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: params,
    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params, step: x.step };
    }),
    legend: [
