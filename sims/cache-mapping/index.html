<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LETTER = { hit: 'H', compulsory: 'C', capacity: 'P', conflict: 'K' };
  var FIELD_C = { tag: 2, set: 3, offset: 5 };

  function hex(a) { return '0x' + ('00' + a.toString(16).toUpperCase()).slice(-3); }
  function nd(text) { return h('span', { class: 'cm-mono', translate: 'no' }, String(text)); }
  function shapeOf(g) { return g.ways === 1 ? t('shapeDM') : g.sets === 1 ? t('shapeFA') : t('shapeSA', { n: g.ways }); }
  var SERIES = { 1: 'var(--c1)', 2: 'var(--c2)', 3: 'var(--c3)', 5: 'var(--c5)' };
  function sw(c) { return { '--sw': SERIES[c] }; }

  function mark(letter, fa) {
    var kids = fa ? [t('m' + letter)] : letter === 'H' ? ['✓', t('mH')] : ['✕', t('m' + letter)];
    return h('span', { class: 'cm-mark' + (fa ? ' cm-mark--fa' : ''), dataset: { m: letter } }, kids);
  }

  // ── the address strip ──
  function addrStrip(p, g, addr, next, n) {
    var a = L.split(addr, p);
    var bits = [];
    for (var i = g.addrBits - 1; i >= 0; i--) bits.push((addr >> i) & 1);
    var fields = [['tag', g.tagBits], ['set', g.setBits], ['offset', g.offsetBits]];
    var at = 0;
    var parts = fields.map(function (f) {
      var key = f[0], w = f[1];
      var own = bits.slice(at, at + w);
      at += w;
      var val = key === 'tag' ? a.tag : key === 'set' ? a.set : a.offset;
      var boxes = w ? own.map(function (b) {
        return h('span', { class: 'cm-bit' + (key === 'set' && !next ? ' sd-changed' : ''), style: sw(FIELD_C[key]), translate: 'no' }, String(b));
      }) : [h('span', { class: 'cm-bit cm-bit--none', translate: 'no' }, '–')];
      return h('div', { class: 'cm-field' },
        h('span', { class: 'cm-flabel', style: sw(FIELD_C[key]) }, t(key === 'tag' ? 'fTag' : key === 'set' ? 'fSet' : 'fOffset'), ' · ', t.n('bitsN', w)),
        h('div', { class: 'cm-bits' }, boxes),
        h('span', { class: 'cm-fval', translate: 'no' }, '= ' + val));
    });
    return h('div', { class: 'cm-addr', dataset: next ? { next: '1' } : {} },
      h('div', { class: 'cm-addr-line' },
        h('span', { class: 'cm-head' }, next ? t('addrNext') : t('addrNow')),
        h('span', { class: 'cm-addr-hex', translate: 'no' }, hex(addr)),
        n ? h('span', { class: 'cm-small', translate: 'no' }, '#' + n) : null),
      h('div', { class: 'cm-fields' }, parts),
      h('div', { class: 'cm-derive' }, t.parts('derive', { block: nd(a.block), set: nd(a.set), tag: nd(a.tag), offset: nd(a.offset) })));
  }

  // ── the cache ──
  function cacheGrid(c, g) {
    var s = c.state, last = s.log.length ? s.log[s.log.length - 1] : null;
    var kids = [h('span', null, '')];
    for (var w = 0; w < g.ways; w++) kids.push(h('span', { class: 'cm-colhead' }, t('wayCol', { n: w })));
    for (var set = 0; set < g.sets; set++) {
      var now = last && last.set === set;
      kids.push(h('span', { class: 'cm-setlabel' + (now ? ' cm-setlabel--now' : '') }, t('setRow', { n: set })));
      s.lines.filter(function (l) { return l.set === set; }).forEach(function (l) {
        var touched = now && last.way === l.way;
        var body = l.valid ? [
          h('span', { class: 'cm-kv cm-kv--tag' }, t('cellTag'), ' ', h('b', { translate: 'no' }, String(l.tag))),
          h('span', { class: 'cm-kv' }, t('cellBlock'), ' ', h('b', { translate: 'no' }, String(l.block))),
          h('span', { class: 'cm-kv' }, t('cellAge'), ' ', h('b', { translate: 'no' }, String(s.i - l.lastUse)))
        ] : [h('span', { class: 'cm-kv cm-kv--tag' }, t('cellEmpty'))];
        if (touched) {
          body.push(mark(LETTER[last.result]));
          if (last.victim != null) body.push(h('span', { class: 'cm-victim' }, t('victim', { b: last.victim })));
        }
        kids.push(h('div', {
          class: 'cm-line' + (l.valid ? '' : ' cm-line--empty') + (touched ? ' sd-changed' : '') + (touched && c.dir === 'forward' ? ' sd-anim-in' : ''),
          style: l.valid ? sw(1) : null,
          'aria-label': t('cellLabel', { set: l.set, way: l.way })
        }, body));
      });
    }
    return h('div', { class: 'cm-cache' },
      h('div', { class: 'cm-head' }, t('cacheHead', { shape: shapeOf(g), sets: t.n('setsN', g.sets), ways: t.n('waysN', g.ways) })),
      h('div', { class: 'cm-grid', style: { '--ways': String(g.ways), '--sets': String(g.sets) } }, kids));
  }

  // ── the trace with this cache's marks and the fully associative reference ──
  function traceList(c) {
    var s = c.state, trace = L.traceOf(c.params);
    var cols = 1, rows = trace.length;
    var head = function () {
      return h('div', { class: 'cm-row cm-row--head' }, h('span', null, ''), h('span', null, ''), h('span', null, t('colThis')), h('span', null, t('colFa')));
    };
    var kids = [];
    trace.forEach(function (addr, i) {
      if (i % rows === 0) kids.push(head());
      var e = s.log[i];
      var current = i === s.log.length - 1;
      kids.push(h('div', { class: 'cm-row' + (e ? '' : ' cm-row--future') + (current ? ' cm-row--now' : '') },
        h('span', { class: 'cm-idx', translate: 'no' }, String(i + 1)),
        h('span', { class: 'cm-a', translate: 'no' }, hex(addr)),
        e ? mark(LETTER[e.result]) : h('span', { class: 'cm-mark cm-mark--todo', translate: 'no' }, '·'),
        e ? mark(e.faHit ? 'H' : 'M', true) : h('span', { class: 'cm-mark cm-mark--todo cm-mark--fa', translate: 'no' }, '·')));
    });
    var m = s.misses;
    return h('div', { class: 'cm-trace' },
      h('div', { class: 'cm-head' }, t('accHead')),
      h('div', { class: 'cm-list' + (trace.length > 10 ? ' cm-list--long' : ''), style: { '--rows': String(rows + 1), '--cols': String(cols) } }, kids),
      h('div', { class: 'cm-counts' },
        h('span', { class: 'cm-count' }, t('cntThis', { h: s.hits, c: m.compulsory, p: m.capacity, k: m.conflict })),
        h('span', { class: 'cm-count cm-count--fa' }, t('cntFa', { h: s.faHits, m: s.i - s.faHits })),
        h('span', { class: 'cm-small' }, t('faNote'))));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'trace', type: 'choice', label: t('trace'), hint: t('traceHint'), resets: true,
        options: [['ping-pong', t('trPing')], ['three-way', t('trThree')], ['locality', t('trLocality')], ['capacity', t('trCapacity')]] },
      { key: 'ways', type: 'choice', label: t('ways'), hint: t('waysHint'),
        options: [[1, t('waysOne')], [2, '2'], [4, '4'], [8, t('waysAll')]] },
      { key: 'block', type: 'choice', label: t('block'),
        options: [[8, t('bytes', { n: 8 })], [16, t('bytes', { n: 16 })], [32, t('bytes', { n: 32 })]] }
    ],

    presets: [
      { id: 'ping-pong', label: t('prPing'), hint: t('prPingHint'), params: { trace: 'ping-pong', ways: 1 } },
      { id: 'three-way', label: t('prThree'), hint: t('prThreeHint'), params: { trace: 'three-way', ways: 1 } },
      { id: 'locality', label: t('prLocality'), hint: t('prLocalityHint'), params: { trace: 'locality', ways: 1 } },
      { id: 'capacity', label: t('prCapacity'), hint: t('prCapacityHint'), params: { trace: 'capacity', ways: 1 } }
    ],

    legend: [
      { c: 1, label: t('legValid') },
      { shape: 'hollow', label: t('legInvalid') },
      { shape: 'rt-verdict', label: t('legHit') },
      { shape: 'bg-bad', label: t('legMiss') },
      { shape: 'bg-dead', label: t('legVictim') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var p = c.params, s = c.state, g = L.geometry(p), trace = L.traceOf(p);
      var current = s.i > 0 ? trace[s.i - 1] : null;
      var strip = s.i > 0 ? addrStrip(p, g, current, false, s.i) : addrStrip(p, g, trace[0], true, 0);
      c.stage.replaceChildren(h('div', { class: 'cm' }, strip, cacheGrid(c, g), traceList(c)));
    },

    caption: function (c) {
      var p = c.params, s = c.state, g = L.geometry(p), trace = L.traceOf(p);
      if (c.first) {
        return t.parts('capStart', { shape: shapeOf(g), sets: t.n('setsN', g.sets), ways: t.n('waysN', g.ways), block: g.block, addr: nd(hex(trace[0])) });
      }
      var e = s.log[s.log.length - 1];
      var parts = t.parts('capAddr', { addr: nd(hex(e.addr)), block: e.block, sets: g.sets, set: e.set, tag: e.tag });
      parts.push(' ');
      parts.push(e.held.length ? t.n('capHeld', e.held.length, { set: e.set, tags: e.held.join(', ') }) : t('capEmpty', { set: e.set }));
      parts.push(' ');
      var res;
      if (e.result === 'hit') res = t('capHit', { way: e.way });
      else if (e.result === 'compulsory') res = e.victim == null ? t('capCompFill', { block: e.block, way: e.way }) : t('capCompEvict', { block: e.block, victim: e.victim });
