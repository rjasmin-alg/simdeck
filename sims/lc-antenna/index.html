<!-- From resonant circuit to antenna: adopted from 50ohm-contents-hr/contents/html/applet_schwingkreis_antenne.html and
     its figures 925–930 (a closed resonant circuit opened up into a dipole, with its electric field) (CC BY 4.0,
     50ohm.de-Autorenteam, AJW-Referat des DARC e.V.; figures by DL9MJ) into the simdeck kit (docs/sim-ui.md),
     translated and changed. A stepper: step n is the n-th shape, from the closed circuit (0) to the dipole (5). The
     model and the shapes' geometry are in sim.js, the words in strings.js. The original's six pictures in a 1-second
     loop are now one drawing at 1:1 plus six thumbnails (nothing vendored: the original loads jQuery and Chart.js from
     50ohm.de but uses neither). -->
<html lang="hr" data-sim="lc-antenna">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Od titrajnog kruga do antene · simdeck</title>
<meta name="description" content="Od titrajnog kruga do antene: otvaranjem titrajnog kruga njegovo električno polje izlazi u prostor i nastaje dipol.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "lc-antenna",
  "class": "stepper",
  "steps": 5,
  "title": { "hr": "Od titrajnog kruga do antene", "en": "From resonant circuit to antenna" },
  "concept": { "hr": "Otvoreni titrajni krug pušta polje u prostor: nastaje dipol", "en": "Opening up a resonant circuit lets its field out into space: a dipole" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="lc-antenna"]; colours only from kit tokens. */
[data-sim="lc-antenna"] .la { display: grid; grid-template-columns: 1.15fr 1fr; gap: 1.4rem; height: 100%; padding: 0.4rem 0.6rem; box-sizing: border-box; }
[data-sim="lc-antenna"] .la-main { position: relative; min-height: 0; }
[data-sim="lc-antenna"] .la-main svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="lc-antenna"] .la-right { display: flex; flex-direction: column; gap: 0.6rem; min-height: 0; }
[data-sim="lc-antenna"] h2 { margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
/* the six thumbnails */
[data-sim="lc-antenna"] .la-strip { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 0.5rem; }
[data-sim="lc-antenna"] .la-thumb { display: flex; flex-direction: column; min-height: 0; padding: 0.2rem; border: 2px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); color: var(--muted); font: inherit; font-size: var(--fs-sm); cursor: pointer; }
[data-sim="lc-antenna"] .la-thumb[aria-current="step"] { border: 4px solid var(--accent); color: var(--ink); font-weight: 700; }
[data-sim="lc-antenna"] .la-thumb[aria-current="step"] .la-tlabel::before { content: '▸ '; }
[data-sim="lc-antenna"] .la-tdraw { position: relative; flex: 1 1 auto; min-height: 3rem; }
[data-sim="lc-antenna"] .la-tdraw svg { position: absolute; inset: 0; }
[data-sim="lc-antenna"] .la-tlabel { text-align: center; }
/* SVG */
[data-sim="lc-antenna"] svg text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
[data-sim="lc-antenna"] svg text.la-big { font-size: var(--fs-lg); font-weight: 700; fill: var(--ink); }
[data-sim="lc-antenna"] svg text.la-c2 { fill: var(--c2); font-weight: 700; font-size: var(--fs-md); }
[data-sim="lc-antenna"] svg text.la-q { fill: var(--ink); font-weight: 700; font-size: var(--fs-lg); }
[data-sim="lc-antenna"] .la-wire { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
[data-sim="lc-antenna"] .la-plate { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
[data-sim="lc-antenna"] .la-efield { fill: none; stroke: var(--c2); stroke-width: 2.5; }
[data-sim="lc-antenna"] .la-ehead { fill: var(--c2); }
[data-sim="lc-antenna"] .la-end { fill: var(--ink); }
[data-sim="lc-antenna"] .la-term { fill: var(--bg); stroke: var(--ink); stroke-width: 2.5; }
[data-sim="lc-antenna"] .la-lead { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="lc-antenna"] .la-thumb .la-wire { stroke-width: 1.5; }
[data-sim="lc-antenna"] .la-thumb .la-plate { stroke-width: 3; }
[data-sim="lc-antenna"] .la-thumb .la-efield { stroke-width: 1.2; }
/* readout */
[data-sim="lc-antenna"] .la-read { margin: 0; padding: 0.4rem 0.8rem; border: 2px solid var(--line); border-radius: var(--radius-sm); display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.8rem; font-size: var(--fs-md); line-height: 1.35; }
[data-sim="lc-antenna"] .la-read h2 { grid-column: 1 / -1; }
[data-sim="lc-antenna"] .la-read dt { font-weight: 700; }
[data-sim="lc-antenna"] .la-read dd { margin: 0; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's transport. */
[data-sim="lc-antenna"] .la-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="lc-antenna"] .la-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content; drawing, thumbnails and readout stack. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="lc-antenna"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="lc-antenna"] .la { display: block; height: auto; padding: 0.3rem 0.3rem 0.6rem; }
  [data-sim="lc-antenna"] .la-main { aspect-ratio: 1 / 1; }
  [data-sim="lc-antenna"] .la-right { margin-top: 0.8rem; }
  [data-sim="lc-antenna"] .la-strip { flex: none; }
  [data-sim="lc-antenna"] .la-tdraw { flex: none; aspect-ratio: 1 / 1; }
  [data-sim="lc-antenna"] .la-read { grid-template-columns: 1fr; }
  [data-sim="lc-antenna"] .la-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="lc-antenna"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Od titrajnog kruga do antene</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="la-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var BOX = L.bounds();
  var sim = null;

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  // A filled triangle with its tip at (x, y), pointing along (dx, dy), length d.
  function head(x, y, dx, dy, d, cls) {
    var len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, w = d * 0.5;
    return s('path', { class: cls, d: 'M' + x + ',' + y + 'L' + (x - ux * d - uy * w) + ',' + (y - uy * d + ux * w) +
      'L' + (x - ux * d + uy * w) + ',' + (y - uy * d - ux * w) + 'Z' });
  }
  function text(x, y, str, cls, attrs) {
    return s('text', Object.assign({ class: cls || null, x: x, y: y, translate: 'no' }, attrs || {}), str);
  }

  var presetKeys = { closed: 'presetClosed', opened: 'presetOpened', open: 'presetOpen', dipole: 'presetDipole' };

  // ── one shape, after figures 925–930, drawn from L.geometry in the figures' units, all shapes at the same scale in
  //    the box L.bounds() so nothing jumps between steps. Text stays at its CSS size; thumbnails have none. ──
  function drawShape(box, n, sign, labels) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), pad = labels ? 2.4 * rem : 0.15 * rem;
    var bw = BOX[2] - BOX[0], bh = BOX[3] - BOX[1];
    var k = Math.min((W - 2 * pad) / bw, (H - 2 * pad) / bh);
    var ox = (W - bw * k) / 2, oy = (H - bh * k) / 2;
    var X = function (x) { return ox + (x - BOX[0]) * k; }, Y = function (y) { return oy + (BOX[3] - y) * k; };
    var P = function (p) { return X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); };
    var g = L.geometry(n), st = L.at({ flip: sign < 0 }, n);
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var dh = labels ? 0.6 * rem : Math.max(4, 0.09 * k);

    // the electric field: from + to −; the arrow at the − end, at the + end half a period later
    g.field.forEach(function (line) {
      var pts = sign > 0 ? line : line.slice().reverse();
      svg.append(s('polyline', { class: 'la-efield', points: pts.map(P).join(' ') }));
      // the arrow sits on the line a little before its end, pointing along it
      var m = pts.length, a = pts[m - 1], b = pts[Math.max(0, m - 3)];
      var ax = X(a[0]), ay = Y(a[1]), bx = X(b[0]), by = Y(b[1]);
      if (g.kind === 'wire' || g.kind === 'dipole') {
        // on the loops the end is the wire itself; put the arrow at the loop's outer point instead
        var mid = pts[Math.floor(m / 2)], pre = pts[Math.floor(m / 2) - 1];
        ax = X(mid[0]); ay = Y(mid[1]); bx = X(pre[0]); by = Y(pre[1]);
      }
      svg.append(head(ax, ay, ax - bx, ay - by, dh, 'la-ehead'));
    });

    // wires, coil, plates
    g.wires.forEach(function (w) { svg.append(s('polyline', { class: 'la-wire', points: w.map(P).join(' ') })); });
    if (g.coil) {
      var c = g.coil, pitch = (c.y1 - c.y2) / c.turns, d = 'M' + P([c.x, c.y1]);
      for (var i = 0; i < c.turns; i++) d += 'A' + (0.22 * k) + ',' + (pitch / 2 * k) + ' 0 0 0 ' + P([c.x, c.y1 - (i + 1) * pitch]);
      svg.append(s('path', { class: 'la-wire', d: d }));
    }
    g.plates.forEach(function (p) { svg.append(s('line', { class: 'la-plate', x1: X(p[0][0]), y1: Y(p[0][1]), x2: X(p[1][0]), y2: Y(p[1][1]) })); });
    if (g.ends) g.ends.forEach(function (p) { svg.append(s('circle', { class: 'la-end', cx: X(p[0]), cy: Y(p[1]), r: labels ? 0.32 * rem : 2.5 })); });
    if (g.feed) g.feed.forEach(function (p) { svg.append(s('circle', { class: 'la-term', cx: X(p[0]), cy: Y(p[1]), r: labels ? 0.3 * rem : 2.5 })); });

    if (labels) {
      // the charges: + where the field starts, − where it ends
      [g.plus, g.minus].forEach(function (q) {
        var up = q[2] * sign > 0, str = up ? '+' : '−', x = X(q[0]), y = Y(q[1]);
        if (g.kind === 'parallel') svg.append(text(x + 0.7 * rem, y + 0.45 * rem, str, 'la-q'));
        else if (g.kind === 'fan') svg.append(text(x + 0.5 * rem, y + (q[2] > 0 ? -0.3 : 1.2) * rem, str, 'la-q'));
        else svg.append(text(x + 0.8 * rem, y + (q[2] > 0 ? -0.4 : 1.3) * rem, str, 'la-q'));
      });
      // L left of the coil's turns (they bulge 0.22 to the left), C left of the capacitor
      if (g.coil) svg.append(text(X(g.coil.x) - 0.22 * k - 0.5 * rem, Y(-1) + 0.45 * rem, t('nameL'), 'la-big', { 'text-anchor': 'end' }));
      if (g.kind === 'parallel' || g.kind === 'fan') svg.append(text(X(g.kind === 'fan' ? 1.8 : 1.55) - 0.4 * rem, Y(-1) + 0.45 * rem, t('nameC'), 'la-big', { 'text-anchor': 'end' }));
      // E next to the outermost field line, halfway along it
      var outer = g.field[g.field.length - 1], o0 = outer[0], o1 = outer[outer.length - 1];
      var om = outer.length > 2 ? outer[Math.floor(outer.length / 2)] : [(o0[0] + o1[0]) / 2, (o0[1] + o1[1]) / 2];
      svg.append(text(X(om[0]) + 0.6 * rem, Y(om[1]) + 0.4 * rem, t('nameE'), 'la-c2'));
      if (g.feed) {
        var fx = X(g.feed[0][0]), fy = (Y(g.feed[0][1]) + Y(g.feed[1][1])) / 2, lx = X(BOX[0]) + 0.2 * rem;
        svg.append(s('line', { class: 'la-lead', x1: fx - 0.5 * rem, y1: fy, x2: lx + 0.2 * rem, y2: fy }));
        svg.append(text(lx, fy - 0.5 * rem, t('feed'), null));
      }
    }
    box.replaceChildren(svg);
  }

  function strip(c) {
    var thumbs = [];
    var grid = h('div', { class: 'la-strip' });
    for (var n = 0; n <= L.steps; n++) {
      var draw = h('div', { class: 'la-tdraw' });
      thumbs.push([draw, n]);
      grid.append(h('button', {
        type: 'button', class: 'la-thumb', 'aria-current': n === c.n ? 'step' : null,
        onclick: (function (m) { return function () { sim.go(m); }; })(n)
      }, draw, h('span', { class: 'la-tlabel' }, t('shapeN', { n: String(n) }))));
    }
    return { el: grid, thumbs: thumbs };
  }

  function readout(st) {
    var row = function (dt, dd) { return [h('dt', null, dt), h('dd', null, dd)]; };
    var f0 = st.n === 0 ? t('f0Start') : st.lDown ? t('f0Both') : t('f0C');
    var field = { inside: 'fieldInside', bulge: 'fieldBulge', space: 'fieldSpace' }[st.field];
    return h('dl', { class: 'la-read' }, h('h2', null, t('readTitle')),
      row(t('rowCoil'), st.coil ? t.n('turns', st.turns) : t('coilNone')),
      row(t('rowCap'), t('cap' + st.n)),
      row(t('rowField'), t(field)),
      row(h('span', { translate: 'no' }, t('rowF0')), f0));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'flip', type: 'toggle', label: t('flip'), hint: t('flipHint') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: x.step }; }),
    legend: [
      { c: 2, label: t('legendE') }
    ],

    render: function (c) {
      var st = c.state;
      var main = h('div', { class: 'la-main' }), sp = strip(c);
      c.stage.replaceChildren(h('div', { class: 'la' }, main,
        h('div', { class: 'la-right' }, h('h2', null, t('shapesTitle')), sp.el, readout(st))));
      drawShape(main, st.n, st.sign, true);
      sp.thumbs.forEach(function (p) { drawShape(p[0], p[1], st.sign, false); });
    },

    caption: function (c) {
      var out = [t('caption' + c.state.n)];
      if (c.state.sign < 0) out.push(t('captionFlip'));
      return out;
    }
  });

  // The drawings are in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
