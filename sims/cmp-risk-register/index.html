     residual risk at a cost; the appetite line decides who signs the acceptance; multiplying ordinal scores misleads,
     which the money view exposes. The stage: the matrix (cells hatched above the appetite, a thick staircase line,
     numbered markers: hollow before treatment, filled after, an arrow between; click a cell to place the selected
     risk), the register in rank order of the view, the selected risk's treatments and the totals.
     Scoring: scoring.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var M = window.SimdeckModels.scoring;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var SVG = 'http://www.w3.org/2000/svg';

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (88 000 / 88,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  function dec(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function moneyF(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  /** Compact money for cells and rows: €500, €7.5k, €1.8M. */
  function compact(x) {
    if (x < 1000) return t('eur', { n: group(x) });
    if (x < 1e6) return t('eurK', { n: dec(Math.round(x / 100) / 10) });
    return t('eurM', { n: dec(Math.round(x / 1e5) / 10) });
  }
  function riskName(id) { return t('r_' + id); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function list(ids) { return ids.map(riskName).join(', '); }

  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // the control to give focus back to after a render (keyboard)
  function btn(cls, attrs, sel, apply, children) {
    return h('button', Object.assign({
      type: 'button', class: cls, onmousedown: noFocus,
      onclick: function (e) { e.stopPropagation(); refocus = e.detail === 0 ? sel : null; apply(); }
    }, attrs, { dataset: Object.assign({ sel: sel }, attrs.dataset || {}) }), children);
  }

  // ── the matrix ──

  /** Markers per cell: for each risk, a hollow ring before treatment and a filled disc after it (one disc when they
      coincide), in register order. Returns [{ id, n, k: 'in' | 'res' | 'same' | 'avoid', l, i, slot, cols }]. */
  function markers(s) {
    var byCell = {}, out = [];
    function add(m) {
      var key = m.l + ':' + m.i;
      (byCell[key] = byCell[key] || []).push(m);
      out.push(m);
    }
    s.risks.forEach(function (x) {
      if (x.t === 'avoid') add({ id: x.id, n: x.n, k: 'avoid', l: x.l0, i: x.i0 });
      else if (x.l1 === x.l0 && x.i1 === x.i0) add({ id: x.id, n: x.n, k: 'same', l: x.l0, i: x.i0 });
      else {
        add({ id: x.id, n: x.n, k: 'in', l: x.l0, i: x.i0 });
        add({ id: x.id, n: x.n, k: 'res', l: x.l1, i: x.i1 });
      }
    });
    Object.keys(byCell).forEach(function (key) {
      var ms = byCell[key], cols = ms.length > 9 ? 4 : 3;
      ms.forEach(function (m, k) { m.slot = k; m.cols = cols; });
    });
    return out;
  }
  /** A marker's centre in % of the matrix (impact to the right, likelihood upwards). */
  function centre(m) {
    var row = Math.floor(m.slot / m.cols), col = m.slot % m.cols;
    return { x: 20 * (m.i - 1 + (col + 0.5) / m.cols), y: 20 * (5 - m.l + (row + 0.5) / m.cols), r: 0.42 * 20 / m.cols };
  }

  function matrix(s) {
    var money = s.view === 'money', sel = s.sel;
    var cells = s.cells.map(function (c) {
      return btn('rr-cell', {
        dataset: { above: String(c.above), el: String(c.edgeL), eb: String(c.edgeB) },
        'aria-label': t('cellLabel', { risk: riskName(sel), l: c.l, i: c.i })
      }, 'cell-' + c.l + '-' + c.i, function () {
        var patch = {};
        patch[sel + 'L'] = c.l;
        patch[sel + 'I'] = c.i;
        sim.set(patch);
      }, h('span', { class: 'rr-cv rr-num', translate: 'no' }, money ? compact(c.eur) : String(c.score)));
    });
    var ms = markers(s);
    var pos = {};
    ms.forEach(function (m) { pos[m.id + ':' + m.k] = centre(m); });
    // arrows: from the ring before treatment to the disc after it, shortened by both radii
    var svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('class', 'rr-arrows');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('aria-hidden', 'true');
    var defs = document.createElementNS(SVG, 'defs');
    ['rr-head', 'rr-head-on'].forEach(function (id) {
      var mk = document.createElementNS(SVG, 'marker');
      mk.setAttribute('id', id);
      mk.setAttribute('viewBox', '0 0 10 10');
      mk.setAttribute('refX', '9');
      mk.setAttribute('refY', '5');
      mk.setAttribute('markerWidth', '5');
      mk.setAttribute('markerHeight', '5');
      mk.setAttribute('orient', 'auto');
      var p = document.createElementNS(SVG, 'path');
      p.setAttribute('d', 'M0,0 L10,5 L0,10 z');
      mk.appendChild(p);
      defs.appendChild(mk);
    });
    svg.appendChild(defs);
    // the selected risk's arrow last, so it is drawn on top
    s.risks.slice().sort(function (a, c) { return (a.id === sel) - (c.id === sel); }).forEach(function (x) {
      var a = pos[x.id + ':in'], c = pos[x.id + ':res'];
      if (!a || !c) return;
      var dx = c.x - a.x, dy = c.y - a.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d <= a.r + c.r) return;
      var ln = document.createElementNS(SVG, 'line');
      ln.setAttribute('x1', a.x + dx * a.r / d);
      ln.setAttribute('y1', a.y + dy * a.r / d);
      ln.setAttribute('x2', c.x - dx * (c.r + 0.4) / d);
      ln.setAttribute('y2', c.y - dy * (c.r + 0.4) / d);
      ln.setAttribute('marker-end', 'url(#' + (x.id === sel ? 'rr-head-on' : 'rr-head') + ')');
      ln.dataset.on = String(x.id === sel);
      svg.appendChild(ln);
    });
    var marks = ms.map(function (m) {
      var c = pos[m.id + ':' + m.k];
      var label = m.k === 'res' || m.k === 'same'
        ? t('markRes', { risk: riskName(m.id), l: m.l, i: m.i })
        : t('markIn', { risk: riskName(m.id), l: m.l, i: m.i });
      return btn('rr-mk', {
        dataset: { k: m.k, on: String(m.id === sel) }, 'aria-label': label, title: riskName(m.id),
        style: { left: c.x + '%', top: c.y + '%', width: (2 * c.r) + '%', height: (2 * c.r) + '%' }
      }, 'mk-' + m.id + '-' + m.k, function () { sim.set({ risk: m.id }); }, h('span', { translate: 'no' }, String(m.n)));
    });
    var levels = [5, 4, 3, 2, 1];
    return h('div', { class: 'rr-left' }, h('div', { class: 'rr-matgrid' },
      h('p', { class: 'rr-head rr-ytitle' }, '↑ ', t('axisL')),
      h('div', { class: 'rr-yaxis' }, levels.map(function (l) {
        return h('div', null, h('span', { class: 'rr-axname' }, h('span', { translate: 'no' }, l + ' '), h('span', { class: 'rr-lv' }, t('l' + l))),
          h('span', { class: 'rr-axsub' }, t('lf' + l)));
      })),
      h('div', { class: 'rr-mat' }, h('div', { class: 'rr-cells' }, cells), svg, h('div', { class: 'rr-marks' }, marks)),
      h('div', { class: 'rr-xaxis' }, [1, 2, 3, 4, 5].map(function (i) {
        return h('div', null, h('span', { class: 'rr-axname' }, h('span', { translate: 'no' }, i + ' '), h('span', { class: 'rr-lv' }, t('i' + i))),
          h('span', { class: 'rr-axsub rr-num', translate: 'no' }, compact(M.SCALE.eur[i - 1])));
      })),
      h('p', { class: 'rr-head rr-xtitle' }, t('axisI'), ' →'),
      h('p', { class: 'rr-foot' }, t('foot'))));
  }

  // ── the register ──

  function val(x, money) {
    if (money) return compact(x.e0) + ' → ' + (x.t === 'avoid' ? '0' : compact(x.e1));
    return x.s0 + ' → ' + (x.t === 'avoid' ? '0' : x.s1);
  }

  function register(s) {
    var money = s.view === 'money';
    var byId = {};
    s.risks.forEach(function (x) { byId[x.id] = x; });
    var rows = s.order.map(function (id) {
      var x = byId[id], on = id === s.sel;
      var move = x.move > 0 ? '▲' + x.move : x.move < 0 ? '▼' + (-x.move) : '';
      return btn('rr-row' + (chg.indexOf(id) >= 0 ? ' sd-changed' : ''), {
        dataset: { t: x.t }, 'aria-pressed': String(on), 'aria-label': t('rowLabel', { risk: riskName(id) })
      }, 'row-' + id, function () { sim.set({ risk: id }); }, [
        h('span', { class: 'rr-rank rr-num', translate: 'no' }, (x.tied ? '=' : '') + x.rank,
          move ? h('span', { class: 'rr-move' }, move) : null),
        h('span', { class: 'rr-badge', translate: 'no' }, String(x.n)),
        h('span', { class: 'rr-name', title: riskName(id) }, riskName(id)),
        h('span', { class: 'rr-tr' }, t('t_' + x.t)),
        h('span', { class: 'rr-val rr-num', translate: 'no' }, val(x, money)),
        h('span', { class: 'rr-sig', dataset: { s: x.signer } }, t('sig_' + x.signer))
      ]);
    });
    return h('div', { class: 'rr-reg' },
      h('p', { class: 'rr-head' }, t(money ? 'headMoney' : 'headScore')),
      h('div', { class: 'rr-hrow', 'aria-hidden': 'true' },
        h('span', null, '#'), h('span'), h('span', null, t('colRisk')), h('span', null, t('colTreat')),
        h('span', { class: 'rr-val' }, t(money ? 'colMoney' : 'colScore')), h('span', { class: 'rr-sig' }, t('colSig'))),
      rows);
  }

  function selected(s) {
    var x = s.risks.filter(function (r) { return r.id === s.sel; })[0];
    var id = x.id, money = s.view === 'money';
    var ded = M.SCALE.eur[M.TRANSFER.level - 1];
    var what;
    switch (x.t) {
      case 'reduce': what = t('dReduce', { ctrl: t('c_' + id), c: moneyF(x.cost) }); break;
      case 'transfer': what = x.noEffect ? t('dTransferNone', { d: moneyF(ded) }) : t('dTransfer', { c: moneyF(x.cost), d: moneyF(ded) }); break;
      case 'avoid': what = t('dAvoid', { avoid: t('a_' + id), c: moneyF(x.cost) }); break;
      default: what = t('dAccept');
    }
    var vals = x.t === 'avoid'
      ? t('dValsAvoid', { s0: x.s0, e0: moneyF(x.e0) })
      : t('dVals', { s0: x.s0, s1: x.s1, e0: moneyF(x.e0), e1: moneyF(x.e1) });
    var verdict = null;
    if (money && x.verdict !== 'none') {
      var vk = { worth: 'vWorth', even: 'vEven', not: 'vNot' }[x.verdict];
      verdict = h('span', { class: 'rr-v', dataset: { v: x.verdict } }, ' · ', t(vk, { n: moneyF(x.net) }));
    }
    var sigKey = { owner: 'sigOwnerLong', board: 'sigBoardLong', avoided: 'sigAvoidedLong' }[x.signer];
    return h('div', { class: 'rr-sel' },
      h('span', { class: 'rr-selname' }, t('selRisk', { n: x.n, risk: riskName(id) })),
      h('span', { class: 'rr-desc' }, t('d_' + id)),
      h('span', { class: 'rr-tbs', role: 'group', 'aria-label': t('treat') }, L.TREATMENTS.map(function (tr) {
        return btn('rr-tb', { 'aria-pressed': String(x.t === tr), 'aria-label': t('treatLabel', { risk: riskName(id), t: t('t_' + tr) }) },
          'treat-' + tr, function () { var p = {}; p[id + 'T'] = tr; sim.set(p); }, t('t_' + tr));
      })),
      h('span', null, what, x.noEffect && x.t === 'reduce' ? ' ' + t('dNoEffect') : ''),
      h('span', null, h('span', { class: 'rr-tab', translate: 'no' }, vals), verdict),
      h('span', { class: 'rr-signs', dataset: { s: x.signer } }, t(sigKey)));
  }

  function totals(s) {
    var money = s.view === 'money';
    return h('p', { class: 'rr-tot' },
      h('span', null, t('totNeed', { a: s.tot.need, b: s.tot.board })),
      h('span', null, t('totCost', { c: moneyF(s.tot.cost) })),
      money ? h('span', null, t('totLoss', { e0: moneyF(s.tot.e0), e1: moneyF(s.tot.e1), x: moneyF(s.tot.exp) })) : null);
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'rr' },
      matrix(s),
      h('div', { class: 'rr-right' }, register(s), selected(s), totals(s))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state, money = s.view === 'money';
    var k = L.captionKey(s);
    var app = money ? moneyF(s.app) : t.n('ptsGen', s.app, { n: s.app });
    var appNom = money ? app : t.n('ptsNom', s.app, { n: s.app });
    var top = s.risks.filter(function (x) { return x.id === s.top; })[0];
    var out = t.parts(k.key, {
      a: b(app), an: b(appNom), n: b(t.n('nRisks', s.tot.board, { n: s.tot.board })), c: b(moneyF(s.tot.cost)),
      top: b(riskName(s.top)), v: b(moneyF(top.e0)), e0: b(moneyF(s.tot.e0)), e1: b(moneyF(s.tot.e1))
    });
    var byId = {};
    s.risks.forEach(function (x) { byId[x.id] = x; });
    k.notes.forEach(function (key) {
      var vars;
      if (key === 'nTie') {
        var x = byId[s.tie.a], y = byId[s.tie.b];
        vars = { x: b(riskName(x.id)), y: b(riskName(y.id)), s: b(s.tie.s), ex: b(moneyF(x.e0)), ey: b(moneyF(y.e0)) };
      } else {
        var ids = { nUp: s.up, nDown: s.down, nNotWorth: s.notWorth, nNoEffect: s.noEffect }[key];
        vars = { list: b(list(ids)) };
      }
      out.push(' ');
      out = out.concat(t.parts(key, vars));
    });
    return out;
  }

  var labels = { register: 'pRegister', treated: 'pTreated', money: 'pMoney', 'by-money': 'pByMoney', insure: 'pInsure' };
  function isSel(id) { return function (p) { return p.risk === id; }; }
  var levelOpts = L.LEVELS.map(function (n) { return [n, String(n)]; });
  var riskParams = [];
  L.RISKS.forEach(function (id) {
    riskParams.push(
      { key: id + 'L', type: 'choice', label: t('levL'), options: levelOpts, visible: isSel(id) },
      { key: id + 'I', type: 'choice', label: t('levI'), options: levelOpts, visible: isSel(id) },
      // the treatment is chosen on the stage (the selected risk's buttons); hidden here, kept in the URL
      { key: id + 'T', type: 'choice', label: t('treat'), options: L.TREATMENTS.map(function (v) { return [v, t('t_' + v)]; }),
        visible: function () { return false; } });
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'view', type: 'choice', label: t('view'), options: [['score', t('vScore')], ['money', t('vMoney')]] },
      { key: 'appS', type: 'range', label: t('appS'), min: L.APP_S[0], max: L.APP_S[1], step: 1,
        visible: function (p) { return p.view === 'score'; } },
      { key: 'appM', type: 'choice', label: t('appM'), options: L.APP_M.map(function (v) { return [v, compact(v)]; }),
        visible: function (p) { return p.view === 'money'; } },
      { key: 'risk', type: 'select', label: t('risk'),
        options: L.RISKS.map(function (id, k) { return [id, (k + 1) + '. ' + riskName(id)]; }) }
    ].concat(riskParams),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'rr-in', label: t('legIn') },
      { shape: 'rr-res', label: t('legRes') },
      { shape: 'rr-arrow', label: t('legArrow') },
      { shape: 'rr-avoid', label: t('legAvoid') },
      { shape: 'rr-above', label: t('legAbove') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
