<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings); // picks the language; every visible word goes through t
  var NS = 'http://www.w3.org/2000/svg';

  // ---- icons (24 × 24, stroked; .f parts are filled) ----
  var ICONS = {
    lock: [['rect', { x: 4.5, y: 10.5, width: 15, height: 11, rx: 2, class: 'f' }], ['path', { d: 'M8 10.5V7a4 4 0 0 1 8 0v3.5' }]],
    eye: [['path', { d: 'M1.5 12C5.5 5 18.5 5 22.5 12 18.5 19 5.5 19 1.5 12z' }], ['circle', { cx: 12, cy: 12, r: 3.3, class: 'f' }]],
    key: [['circle', { cx: 6.5, cy: 12, r: 4.5 }], ['path', { d: 'M11 12h11.5M18.5 12v4.5M21.5 12v3.5' }]],
    card: [['rect', { x: 3, y: 5, width: 18, height: 14, rx: 2 }]],
    hatch: [['rect', { x: 3, y: 5, width: 18, height: 14, rx: 2 }], ['path', { d: 'M3 12l7-7M3 19L17 5M10 19l11-11M17 19l4-4' }]],
    shared: [['rect', { x: 2, y: 4, width: 20, height: 16, rx: 2 }], ['rect', { x: 5, y: 7, width: 14, height: 10, rx: 1 }]],
    right: [['path', { d: 'M3 12h17M13 5l7 7-7 7' }]],
    left: [['path', { d: 'M21 12H4M11 5l-7 7 7 7' }]],
    arrow: [['path', { d: 'M2 12h18M14 6l6 6-6 6' }]]
  };
  function S(tag, attrs, kids) {
    var e = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    (kids || []).forEach(function (k) { if (k) e.appendChild(k); });
    return e;
  }
  function icon(kind, cls) {
    return S('svg', { class: cls || 'dh-ic', viewBox: '0 0 24 24', 'aria-hidden': 'true' },
      ICONS[kind].map(function (p) { return S(p[0], p[1]); }));
  }

  // ---- notation: data, not words ----
  var SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function sup(n) { return String(n).split('').map(function (d) { return SUP[+d]; }).join(''); }
  function pow(b, e, p) { return b + sup(e) + ' mod ' + p; }
  function data(text) { return h('span', { class: 'dh-data', translate: 'no' }, text); }
  function has(list, x) { return list.indexOf(x) >= 0; }

  // ---- paint: averaged colour from kit tokens (color-mix), recipe in words ----
  var PAINT = { Y: 'var(--dh-Y)', R: 'var(--dh-R)', T: 'var(--dh-T)', V: 'var(--dh-V)' };
  function units(m) {
    var out = [];
    L.PAINTS.forEach(function (id) { for (var k = 0; k < (m[id] || 0); k++) out.push(id); });
    return out;
  }
  function mixColour(m) {
    var u = units(m), c = PAINT[u[0]];
    for (var k = 1; k < u.length; k++) c = 'color-mix(in srgb, ' + c + ', ' + PAINT[u[k]] + ' ' + (100 / (k + 1)).toFixed(2) + '%)';
    return c;
  }
  function recipe(m) {
    return L.PAINTS.filter(function (id) { return m[id]; }).map(function (id) {
      return (m[id] > 1 ? m[id] + ' × ' : '') + t('paint' + id);
    }).join(' + ');
  }
  function swatch(m) { return h('span', { class: 'dh-sw', style: { background: mixColour(m) } }); }
  function paintRow(m, extra) { return h('div', { class: 'dh-paint' }, swatch(m), h('small', null, recipe(m)), extra); }

  // ---- cards ----
  /** kind: public | secret | shared; lbl: words; num: notation line or null; paint: mixture or null. */
  function card(o) {
    var c = o.changed ? ' sd-changed' : '', kind = o.kind;
    if (o.empty) {
      return h('div', { class: 'dh-card' + (o.wide ? ' dh-wide' : ''), 'data-empty': '', dataset: { kind: kind } },
        h('span', { class: 'dh-lbl' }, o.lbl), h('span', { class: 'dh-muted' }, t('empty')));
    }
    var mark = kind === 'public' ? (o.copy ? icon('eye') : null) : kind === 'shared' ? icon('key') : icon('lock');
    return h('div', { class: 'dh-card' + c + (kind !== 'public' ? ' sd-hatch' : '') + (o.wide ? ' dh-wide' : ''), dataset: { kind: kind } },
      h('span', { class: 'dh-lbl' }, mark, o.lbl, o.copy && kind !== 'public' ? icon('eye') : null),
      o.num != null ? h('span', { class: 'dh-num', translate: 'no' }, o.num) : null,
      o.numExtra || null,
      o.paint ? paintRow(o.paint, o.paintExtra) : null,
      o.more || null);
  }
  function rows(p) { return { num: p.mode !== 'paint', paint: p.mode !== 'numbers' }; }

  function sideColumn(s, p, who) {
    var me = s[who], R = rows(p), ch = s.changed, mall = s.mallory.active;
    var sym = who === 'alice' ? { sec: 'a', mine: 'A', theirs: 'B' } : { sec: 'b', mine: 'B', theirs: 'A' };
    function known(slot) { return has(s.known[who], slot); }
    function changed(slot) { return has(ch, who + '-' + slot); }
    var q = L.norm(p);
    var e = who === 'alice' ? q.a : q.b;
    var cards = [];
    cards.push(card({ kind: 'public', lbl: t('cardPub'), empty: !known('pub'), changed: changed('pub'),
      num: R.num ? 'p = ' + s.pub.p + ', g = ' + s.pub.g : null, paint: R.paint ? s.pub.paint : null,
      paintExtra: R.num ? null : h('small', { class: 'dh-muted' }, '(' + t('paintCommon') + ')') }));
    cards.push(card({ kind: 'secret', lbl: [t('cardSecret'), ' ', data(sym.sec)], empty: !known('secret'), changed: changed('secret'),
      num: R.num && me.secret ? sym.sec + ' = ' + me.secret.num : null, paint: R.paint && me.secret ? me.secret.paint : null }));
    cards.push(card({ kind: 'public', lbl: [t('cardMine'), ' ', data(sym.mine)], empty: !known('mine'), changed: changed('mine'),
      num: R.num && me.sent ? sym.mine + ' = ' + pow(s.pub.g, e, s.pub.p) + ' = ' + me.sent.num : null,
      paint: R.paint && me.sent ? me.sent.paint : null }));
    var forged = mall && me.received;
    cards.push(card({ kind: 'public', lbl: [t('cardTheirs'), ' ', data(sym.theirs)], empty: !known('theirs'), changed: changed('theirs'),
      num: R.num && me.received ? sym.theirs + ' = ' + me.received.num : null, paint: R.paint && me.received ? me.received.paint : null,
      more: forged ? h('span', null, h('span', { class: 'dh-tag' }, t('reallyM'))) : null }));
    var sh = me.shared;
    cards.push(card({ kind: 'shared', lbl: [t('cardShared'), ' ', data('s')], empty: !known('shared'), changed: changed('shared'),
      num: R.num && sh ? 's = ' + pow(me.received.num, e, s.pub.p) + ' = ' + sh.num : null, paint: R.paint && sh ? sh.paint : null }));
    return h('div', { class: 'dh-col', dataset: { who: who } },
      h('div', { class: 'dh-head' }, h('h3', null, t(who)), h('span', null, t('knows'))),
      h('div', { class: 'dh-slots' }, cards));
  }

  function eveCards(s, p) {
    var R = rows(p), ch = s.changed, seen = s.eve.seen, E = s.eve;
    function copy(id, sym, v, wide, lbl) {
      return card({ kind: 'public', copy: true, wide: wide, lbl: [lbl || t('cardCopy'), ' ', data(sym)], empty: !has(seen, id), changed: has(ch, 'eve-' + id),
        num: R.num && v ? (id === 'pub' ? 'p = ' + s.pub.p + ', g = ' + s.pub.g : sym + ' = ' + v.num) : null,
        paint: R.paint && v ? v.paint : null });
    }
    var caught = s.mallory.active ? t('cardCaught') : null;
    var out = [copy('pub', 'p, g', s.pub, true), copy('A', 'A', s.alice.sent, false, caught), copy('B', 'B', s.bob.sent, false, caught)];
    if (s.mallory.active) return out;
    var pr = E.product, P = s.pub.p;
    out.push(card({ kind: 'public', wide: true, lbl: [t('cardProduct'), ' ', data('A·B')], empty: !pr, changed: has(ch, 'mid-product'),
      num: R.num && pr ? s.alice.sent.num + '·' + s.bob.sent.num + ' mod ' + P + ' = ' + pr.num : null,
      numExtra: R.num && pr ? h('span', null, pr.equalsS ? h('span', { class: 'dh-tag' }, t('isSByChance'))
        : h('span', { class: 'dh-ok' }, data(t('notS') + ' (s = ' + s.alice.shared.num + ')'))) : null,
      paint: R.paint && pr ? pr.paint : null,
      paintExtra: R.paint && pr ? h('span', { class: 'dh-ok' }, data('≠'), swatch(s.alice.shared.paint), data('s')) : null }));
    var se = E.search;
    var more = null;
    if (se) {
      var lines = [];
      if (R.num) {
        lines.push(h('div', { class: 'dh-num', translate: 'no' }, s.pub.g + 'ˣ mod ' + P + ' = ' + s.alice.sent.num + ' → x = ' + se.x));
        lines.push(h('div', { class: 'dh-bar', role: 'img', 'aria-label': t('tries', { tries: se.tries, space: se.space }) },
          h('i', { style: { width: (100 * se.tries / se.space) + '%' } })));
        lines.push(h('small', null, t('tries', { tries: se.tries, space: se.space })));
        lines.push(h('div', { class: 'dh-num', translate: 'no' }, pow(s.bob.sent.num, se.x, P) + ' = ' + se.s + ' = s'));
        if (!se.isA) lines.push(h('span', { class: 'dh-muted' }, t('notA')));
        lines.push(h('small', null, t('orderLine', { n: E.order }) + ' · ' + t('realSize')));
      }
      if (R.paint) lines.push(h('small', null, '✕ ' + t('unmix')));
      more = h('div', { class: 'dh-lines' }, lines);
    }
    out.push(card({ kind: 'public', wide: true, lbl: [t('cardSearch'), ' ', data('a')], empty: !se, changed: has(ch, 'mid-search'), more: more }));
    return out;
  }

  function malloryCards(s, p) {
    var R = rows(p), ch = s.changed, M = s.mallory, P = s.pub.p, out = [];
    function k(slot) { return has(s.known.mid, slot); }
    out.push(card({ kind: 'secret', lbl: [t('cardSecret'), ' ', data('m')], empty: !k('m'), changed: has(ch, 'mid-m'),
      num: R.num && M.m ? 'm = ' + M.m.num : null, paint: R.paint && M.m ? M.m.paint : null }));
    out.push(card({ kind: 'public', lbl: [t('cardForged'), ' ', data('M')], empty: !k('M'), changed: has(ch, 'mid-M'),
      num: R.num && M.M ? 'M = ' + pow(s.pub.g, L.MALLORY_M, P) + ' = ' + M.M.num : null, paint: R.paint && M.M ? M.M.paint : null }));
    out.push(card({ kind: 'shared', lbl: t('cardKeyAlice'), empty: !k('aliceSide'), changed: has(ch, 'mid-aliceSide'),
      num: R.num && M.aliceSide ? pow(s.alice.sent.num, L.MALLORY_M, P) + ' = ' + M.aliceSide.num : null, paint: R.paint && M.aliceSide ? M.aliceSide.paint : null }));
    out.push(card({ kind: 'shared', lbl: t('cardKeyBob'), empty: !k('bobSide'), changed: has(ch, 'mid-bobSide'),
      num: R.num && M.bobSide ? pow(s.bob.sent.num, L.MALLORY_M, P) + ' = ' + M.bobSide.num : null, paint: R.paint && M.bobSide ? M.bobSide.paint : null }));
    return out;
  }

  // ---- the wire ----
  function valueText(s, p, what) {
    var R = rows(p), v = what === 'A' ? s.alice.sent : what === 'B' ? s.bob.sent : what === 'M' ? s.mallory.M : null;
    var kids = [];
    if (what === 'pub') {
      if (R.num) kids.push(data('p = ' + s.pub.p + ', g = ' + s.pub.g));
      if (R.paint) kids.push(h('span', { class: 'dh-sw', style: { background: mixColour(s.pub.paint) } }));
    } else {
      if (R.num) kids.push(data(what + ' = ' + v.num));
      else kids.push(data(what));
      if (R.paint) kids.push(h('span', { class: 'dh-sw', style: { background: mixColour(v.paint) } }));
    }
    return kids;
  }
  function wire(s, p) {
    var w = s.wire, mid = s.mallory.active ? 'mallory' : 'eve';
    // the comparison is the sim's view, not a message: no arrow, no channel title, s never crosses
    var title = s.compare ? h('div', { class: 'dh-wire-title' }, t('compareTitle')) : h('div', { class: 'dh-wire-title' }, icon('arrow'), t('channel'));
    var lane;
    if (s.compare) {
      var c = s.compare, numView = p.mode !== 'paint', eq = numView ? c.equalNum : c.equalPaint;
      var aTxt = numView ? data(String(s.alice.shared.num)) : h('span', { class: 'dh-sw', style: { background: mixColour(s.alice.shared.paint) } });
      var bTxt = numView ? data(String(s.bob.shared.num)) : h('span', { class: 'dh-sw', style: { background: mixColour(s.bob.shared.paint) } });
      lane = h('div', { class: 'dh-lane', 'data-compare': '' },
        h('span', { class: 'dh-chip', 'data-calm': s.phase === 'compare' ? null : '' }, t('alice'), aTxt, data(eq ? '=' : '≠'), bTxt, t('bob'),
          h('small', null, eq ? '✓ ' + t('equal') : '✕ ' + t('different'))));
    } else if (w) {
      var chip = h('span', { class: 'dh-chip' }, valueText(s, p, w.what),
        w.what === 'pub' ? h('small', null, t('bothWays')) : null,
        w.from === 'mallory' ? h('small', null, t(w.to === 'bob' ? 'asA' : 'asB')) : null,
        !s.mallory.active && w.what !== 'M' ? icon('eye') : null);
      var toRight = w.to === 'bob';
      if (w.caughtBy) {
        // from the sender to the middle; the rest of the line is not travelled
        var x = h('span', { class: 'dh-x', 'aria-label': t('caught') }, '✕');
        lane = toRight
          ? h('div', { class: 'dh-lane' }, h('span', { class: 'dh-seg', 'data-on': '' }), chip, x, h('span', { class: 'dh-seg' }))
          : h('div', { class: 'dh-lane' }, h('span', { class: 'dh-seg' }), x, chip, h('span', { class: 'dh-seg', 'data-on': '' }));
      } else if (w.from === 'mallory') {
        lane = toRight
          ? h('div', { class: 'dh-lane' }, h('span', { class: 'dh-seg' }), chip, h('span', { class: 'dh-seg', 'data-on': '' }), icon('right', 'dh-head-ar'))
          : h('div', { class: 'dh-lane' }, icon('left', 'dh-head-ar'), h('span', { class: 'dh-seg', 'data-on': '' }), chip, h('span', { class: 'dh-seg' }));
      } else if (w.what === 'pub') {
        lane = h('div', { class: 'dh-lane' }, icon('left', 'dh-head-ar'), h('span', { class: 'dh-seg', 'data-on': '' }), chip,
          h('span', { class: 'dh-seg', 'data-on': '' }), icon('right', 'dh-head-ar'));
      } else {
        lane = toRight
          ? h('div', { class: 'dh-lane' }, h('span', { class: 'dh-seg', 'data-on': '' }), chip, h('span', { class: 'dh-seg', 'data-on': '' }), icon('right', 'dh-head-ar'))
          : h('div', { class: 'dh-lane' }, icon('left', 'dh-head-ar'), h('span', { class: 'dh-seg', 'data-on': '' }), chip, h('span', { class: 'dh-seg', 'data-on': '' }));
      }
    } else {
      lane = h('div', { class: 'dh-lane' }, h('span', { class: 'dh-seg' }), h('span', { class: 'dh-muted' }, t('empty')), h('span', { class: 'dh-seg' }));
    }
    return h('div', { class: 'dh-wire', 'data-mid': mid }, title, lane);
  }

  function midColumn(s, p) {
    var mall = s.mallory.active;
    var cards = eveCards(s, p);
    if (mall) cards = cards.concat(malloryCards(s, p));
    return h('div', { class: 'dh-mid' }, wire(s, p),
      h('div', { class: 'dh-col', dataset: { who: mall ? 'mallory' : 'eve' } },
        h('div', { class: 'dh-head' }, h('h3', null, icon('eye'), t(mall ? 'mallory' : 'eve')), h('span', null, t(mall ? 'malloryRole' : 'eveRole'))),
        h('div', { class: 'dh-slots' }, cards)));
  }

  // ---- captions ----
  function caption(c) {
    function data(text) { return h('span', { translate: 'no' }, text); } // notation in the caption keeps the caption's font
    var s = c.state, p = c.params, q = L.norm(p), paint = p.mode === 'paint', mall = s.mallory.active;
    var P = s.pub.p, G = s.pub.g;
    var key = paint ? 'capPaint' : 'cap';
    function cap(k, vars) { return t.parts(key + k, vars || {}); }
    if (c.first) return cap(mall ? 'StartMallory' : 'Start');
    var A = s.alice, B = s.bob, M = s.mallory;
    switch (s.phase) {
      case 'agree': return cap('Agree', { pub: data('p = ' + P + ', g = ' + G), who: t(mall ? 'mallory' : 'eve') });
      case 'alicePick': return cap('AlicePick', { val: data('a = ' + q.a) });
      case 'bobPick': return cap('BobPick', { val: data('b = ' + q.b) });
      case 'aliceCompute': return cap('AliceCompute', { expr: data('A = ' + pow(G, q.a, P) + ' = ' + A.sent.num) });
      case 'bobCompute': return cap('BobCompute', { expr: data('B = ' + pow(G, q.b, P) + ' = ' + B.sent.num) });
      case 'sendA': return cap('SendA', { val: data('A = ' + A.sent.num) });
      case 'sendB': return cap('SendB', { val: data('B = ' + B.sent.num) });
      case 'aliceShared': return cap(mall ? 'AliceSharedM' : 'AliceShared', { expr: data('s = ' + pow(A.received.num, q.a, P) + ' = ' + A.shared.num) });
      case 'bobShared': return cap(mall ? 'BobSharedM' : 'BobShared', { expr: data('s = ' + pow(B.received.num, q.b, P) + ' = ' + B.shared.num) });
      case 'compare':
        if (mall) {
          var same = paint ? s.compare.equalPaint : s.compare.equalNum;
          return cap(same ? 'CompareMSame' : 'CompareM', { sa: data(String(A.shared.num)), sb: data(String(B.shared.num)) });
        }
        return cap('Compare', { s: data(String(A.shared.num)), why: data('(' + G + sup(q.b) + ')' + sup(q.a) + ' = (' + G + sup(q.a) + ')' + sup(q.b) + ' mod ' + P) });
      case 'eveView':
        var e = s.eve;
        if (paint) return cap('EveView');
        var note = (e.order < P - 1 ? t('noteOrder', { n: e.order }) : '') + (e.search.isA ? '' : t('noteX', { x: e.search.x }));
        return cap(e.product.equalsS ? 'EveViewChance' : 'EveView', { prod: data(String(e.product.num)),
          tries: t('tries', { tries: e.search.tries, space: e.search.space }), note: note });
      case 'catchA': return cap('CatchA', { A: data(String(A.sent.num)) });
      case 'forgeToBob': return cap('ForgeToBob', { m: data(String(M.m.num)), expr: data('M = ' + pow(G, L.MALLORY_M, P) + ' = ' + M.M.num) });
      case 'catchB': return cap('CatchB', { B: data(String(B.sent.num)) });
      case 'forgeToAlice': return cap('ForgeToAlice', { M: data(String(M.M.num)) });
      case 'malloryView': return cap('MalloryView', { ka: data(pow(A.sent.num, L.MALLORY_M, P) + ' = ' + M.aliceSide.num),
        kb: data(pow(B.sent.num, L.MALLORY_M, P) + ' = ' + M.bobSide.num) });
    }
    return '';
  }

  function withNumbers(p) { return p.mode !== 'paint'; } // the paints are fixed: red, teal, violet

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: [['numbers', t('modeNumbers')], ['both', t('modeBoth')], ['paint', t('modePaint')]] },
      { key: 'p', type: 'choice', label: t('p'), options: [[23, '23'], [97, '97']], visible: withNumbers },
      { key: 'g', type: 'choice', label: t('g'), options: [[5, '5'], [2, '2'], [22, '22']], visible: withNumbers },
      { key: 'a', type: 'range', label: t('a'), min: 2, max: function (p) { return p.p - 2; }, visible: withNumbers },
      { key: 'b', type: 'range', label: t('b'), min: 2, max: function (p) { return p.p - 2; }, visible: withNumbers },
      { key: 'mallory', type: 'toggle', label: t('malloryParam'), resets: true }
    ],

    presets: [
      { id: 'paint', label: t('presetPaint'), params: { mode: 'paint' }, hint: t('presetPaintHint') },
      { id: 'textbook', label: t('presetTextbook'), params: { p: 23, g: 5, a: 6, b: 15 }, hint: t('presetTextbookHint') },
      { id: 'small-a', label: t('presetSmall'), params: { p: 23, g: 5, a: 4, b: 3 }, hint: t('presetSmallHint') },
      { id: 'bad-g', label: t('presetBadG'), params: { p: 23, g: 22 }, hint: t('presetBadGHint') },
      { id: 'bigger', label: t('presetBigger'), params: { p: 97, g: 5, a: 36, b: 58 }, hint: t('presetBiggerHint') },
      { id: 'mallory', label: t('presetMallory'), params: { p: 23, g: 5, a: 6, b: 15, mallory: true }, hint: t('presetMalloryHint') }
    ],

    legend: [
      { shape: 'dh-card', label: t('legendPublic') },
      { shape: 'dh-hatch', label: t('legendSecret') },
      { shape: 'dh-shared', label: t('legendShared') },
      { shape: 'dh-arrow', label: t('legendSent') },
      { shape: 'dh-eye', label: t('legendEve') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state, p = c.params;
      c.stage.replaceChildren(h('div', { class: 'dh' },
        sideColumn(s, p, 'alice'), midColumn(s, p), sideColumn(s, p, 'bob')));
    },

    caption: caption
  });

  // legend swatches: the same icons as the stage
  document.querySelectorAll('[data-sim="diffie-hellman"] .sd-swatch[data-shape^="dh-"]').forEach(function (sw) {
    sw.replaceChildren(icon(sw.dataset.shape.slice(3)));
  });
})();
</script>
</body>
</html>
