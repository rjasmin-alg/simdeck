<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SET_WORDS = { wallpaper: 'setWallpaper', drive: 'setDrive', hideCp: 'setHideCp' };
  var WHY = { unused: 'whyUnused', replaced: 'whyReplaced', filtered: 'whyFiltered', blocked: 'whyBlocked', 'link-off': 'whyLinkOff', 'half-off': 'whyHalfOff' };
  var PRESET_WORDS = { 'no-loopback': 'presetOff', merge: 'presetMerge', replace: 'presetReplace', filtered: 'presetFiltered' };

  /** Data (user, computer, GPO, OU and file names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }   // a placeholder used twice
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sentence(key, vars) { return [' '].concat(rich(key, vars)); }
  /** "a, b and c" from nodes. */
  function listOf(items) {
    items = items.slice();
    if (items.length === 1) return items[0];
    var last = items.pop();
    var head = items.reduce(function (acc, it) { return acc === null ? it : h('span', null, t.parts('listMore', { a: acc, b: it })); }, null);
    return h('span', null, t.parts('list2', { a: head, b: last }));
  }

  function scene(c) { return L.sceneOf(c.params); }
  function gpoName(sc, id) { return sc.gpos[id].name; }
  function icon(path) { return h('span', { class: path === 'user' ? 'lb-person' : 'lb-monitor', 'aria-hidden': 'true' }); }
  function gpoNode(sc, id) { return data(gpoName(sc, id)); }
  function gpoBold(sc, id) { return h('b', null, gpoNode(sc, id)); }
  function valueNode(setting, v) {
    if (setting === 'hideCp') return h('span', null, t('valOn'));
    return data(v);
  }
  function settingNode(setting) { return h('span', null, setting == null ? t('setNone') : t(SET_WORDS[setting])); }
  function modeWord(m) { return t(m === 'merge' ? 'modeMerge' : m === 'replace' ? 'modeReplace' : 'modeOff'); }
  function ouOf(sc, path) { var p = sc[path === 'user' ? 'userPath' : 'computerPath']; return p[p.length - 1].name; }
  function entryIndex(s, gpo, path) { var k = -1; s.entries.forEach(function (e, i) { if (e.gpo === gpo && e.path === path) k = i; }); return k; }
  /** What a processed entry did: null (not yet), 'apply' or 'dropped'. */
  function entrySeen(s, i) {
    if (i < 0) return null;
    var done = s.done || (s.event && s.event.entry >= i);
    if (!done) return null;
    return s.entries[i].status === 'apply' ? 'apply' : 'dropped';
  }

  // ── left: the domain with the user's and the computer's OU ──

  function gpoCard(c, sc, id, path, withComputer) {
    var s = c.state, i = entryIndex(s, id, path), seen = entrySeen(s, i);
    var changed = s.event && s.event.entry === i;
    var g = sc.gpos[id];
    var userItems = L.SETTINGS.filter(function (k) { return Object.prototype.hasOwnProperty.call(g.user, k); }).map(function (k) {
      return h('li', null, settingNode(k), ': ', valueNode(k, g.user[k]));
    });
    return h('div', {
      class: 'lb-gpo' + (changed ? ' sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : '') : ''),
      dataset: { seen: seen || 'pending' }
    },
      h('div', { class: 'lb-gtitle' }, icon(path), h('span', { class: 'lb-gname' }, data(g.name)),
        seen === 'dropped' ? h('span', { class: 'lb-why' }, '✕ ', t(WHY[s.entries[i].status])) : null),
      h('div', { class: 'lb-half' }, h('span', null, t('halfUser')), h('ul', null, userItems)),
      withComputer ? h('div', { class: 'lb-half' }, h('span', null, t('halfComputer')),
        h('ul', null,
          h('li', null, t('setLoopback'), ': ', h('b', null, modeWord(c.params.mode))),
          h('li', null, t('readUsers'), ': ', h('b', null, g.read.users ? '✓ ' + t('readYes') : '✕ ' + t('readNo'))))) : null);
  }

  function renderScene(c) {
    var s = c.state, sc = scene(c);
    return h('section', { class: 'lb-scene' },
      h('h2', null, t.parts('domainName', { name: data(sc.userPath[0].name) })),
      h('div', { class: 'lb-ou' },
        h('div', { class: 'lb-head' }, data('OU', 'lb-kind'), data(ouOf(sc, 'user')),
          h('span', { class: 'lb-obj' }, icon('user'), data(s.user), h('small', null, t('user')))),
        s.userGpos.map(function (id) { return gpoCard(c, sc, id, 'user', false); })),
      h('div', { class: 'lb-ou' },
        h('div', { class: 'lb-head' }, data('OU', 'lb-kind'), data(ouOf(sc, 'computer')),
          h('span', { class: 'lb-obj' }, icon('computer'), data(s.computer), h('small', null, t('computer')))),
        s.computerGpos.map(function (id) { return gpoCard(c, sc, id, 'computer', true); })),
      h('div', { class: 'lb-logon' }, icon('user'), ' → ', icon('computer'),
        h('span', null, t.parts('logon', { user: data(s.user), pc: data(s.computer) }))));
  }

  // ── right: the user settings in processing order as a rule table, then the result ──

  /** The settings no applied GPO sets (they keep the default). */
  function defaults(s) { return L.SETTINGS.filter(function (k) { return !s.result[k]; }); }
  var DEFAULT_WORDS = { wallpaper: ['resWallpaper', 'resDefault'], drive: ['resDrive', 'resNotMapped'], hideCp: ['resCp', 'resVisible'] };

  function renderTable(c) {
    var s = c.state, sc = scene(c), done = s.done;
    var ev = s.event, rows = ev ? ev.rows : [], over = ev ? ev.over : [];
    var implicitWins = done && defaults(s).length > 0;
    var at = !ev ? -1 : done ? (implicitWins ? s.list.length : s.list.length - 1) : rows[rows.length - 1];
    return Simdeck.ruleTable({
      dir: c.dir,
      mode: 'specific',
      title: t.parts('tableTitle', { user: data(s.user), pc: data(s.computer) }),
      columns: [{ key: 'gpo', label: t('colGpo'), wrap: true }, { key: 'setting', label: t('colSetting'), wrap: true }],
      actionLabel: t('colValue'), markLabel: t('colMark'),
      rows: s.list.map(function (r, i) {
        var seen = s.seen[i], e = s.entries[r.entry];
        var mark = null;
        if (seen === 'dropped') mark = 'skip';
        else if (seen === 'overwritten') mark = 'beaten';
        else if (seen === 'applied') mark = done ? 'win' : 'hit';
        var chg = rows.indexOf(i) >= 0 || over.indexOf(i) >= 0;
        var val = r.setting == null ? '—' : valueNode(r.setting, r.value);
        return {
          no: i + 1,
          cells: {
            gpo: h('span', { class: 'lb-gcell', title: t(r.path === 'user' ? 'legUser' : 'legComputer') }, icon(r.path), gpoNode(sc, r.gpo)),
            setting: settingNode(r.setting)
          },
          action: chg && !done ? h('span', { class: 'lb-chg' }, val) : val,
          hit: done && !implicitWins && seen === 'applied' ? true : null,
          rank: i,
          mark: mark,
          note: seen === 'dropped' ? [{ k: 'muted', text: t(WHY[e.status]) }] : null
        };
      }),
      implicit: { text: t('implicit') },
      at: at,
      subject: ev ? { mark: s.user, c: 1 } : null,
      done: done,
      changed: !done || implicitWins,
      outcome: function (i) {
        if (i < s.list.length) return null;
        var d = defaults(s);
        if (d.length === L.SETTINGS.length) return h('b', null, t('implicitAll'));
        return h('b', null, listOf(d.map(function (k) { return h('span', null, t(DEFAULT_WORDS[k][0]), ' ', t(DEFAULT_WORDS[k][1])); })));
      },
      words: { hit: t('markStands'), beaten: t('markOver'), win: t('markWin'), skip: t('markSkip') },
      stickyMark: true
    });
  }

  function resultValue(k, r) {
    if (!r) return h('span', { class: 'lb-val lb-default' }, t(DEFAULT_WORDS[k][1]));
    if (k === 'wallpaper') return h('b', { class: 'lb-val' }, data(r.value));
    return h('b', { class: 'lb-val' }, t(k === 'drive' ? 'resMapped' : 'resHidden'));
  }

  function renderResult(c) {
    var s = c.state, sc = scene(c), ev = s.event;
    var touched = {};
    if (ev && !s.done) ev.rows.concat(ev.over).forEach(function (i) { var r = s.list[i]; if (r.setting && s.seen[i] === 'applied') touched[r.setting] = true; });
    var cells = [];
    L.SETTINGS.forEach(function (k) {
      var r = s.result[k];
      var v = resultValue(k, r);
      cells.push(h('span', null, t(DEFAULT_WORDS[k][0])),
        touched[k] ? h('span', { class: 'lb-chg' + (c.dir === 'forward' ? ' sd-anim-in' : '') }, v) : v,
        h('span', { class: 'lb-src' }, r ? h('span', { class: 'lb-gcell' }, icon(s.entries[s.list[r.row].entry].path), t.parts('resFrom', { gpo: gpoNode(sc, r.from) })) : t('resFromDefault')));
    });
    return h('section', { class: 'lb-result' + (s.done ? ' lb-final' : '') },
      h('h2', null, s.done ? t.parts('resultFinal', { user: data(s.user), pc: data(s.computer) }) : t.parts('resultNow', { user: data(s.user) })),
      cells);
  }

  // ── captions ──

  function captionStart(s, sc) {
    var kiosk = s.computerGpos[0];
    if (s.mode === 'off') return rich('capStartOff', { user: data(s.user), pc: data(s.computer), ou: data(ouOf(sc, 'user')) });
    var out = rich(s.mode === 'merge' ? 'capStartMerge' : 'capStartReplace', { user: data(s.user), pc: data(s.computer), gpo: gpoBold(sc, kiosk) });
    if (!s.kioskReadableByUsers) out = out.concat(sentence('capStartNoRead', { gpo: gpoNode(sc, kiosk) }));
    return out;
  }

  function captionEntry(c) {
    var s = c.state, sc = scene(c), ev = s.event, n = c.n, e = s.entries[ev.entry];
    var g = gpoBold(sc, e.gpo);
    if (ev.kind === 'unused') return rich('capUnused', { n: n, gpo: g, ou: data(ouOf(sc, 'computer')), user: data(s.user) });
    if (ev.kind === 'replaced') return rich('capReplaced', { n: n, gpo: g });
    if (ev.kind === 'filtered') return rich('capFiltered', { n: n, gpo: g, user: data(s.user) });
    if (ev.kind !== 'apply') return rich('capSkipped', { n: n, gpo: g, why: t(WHY[ev.kind]) });
    var added = ev.rows.filter(function (i) { return s.list[i].setting != null; }).map(function (i) {
      var r = s.list[i];
      return h('span', null, t.parts('pair', { setting: t(SET_WORDS[r.setting]), value: h('b', null, valueNode(r.setting, r.value)) }));
    });
    var earlier = s.entries.slice(0, ev.entry).some(function (x) { return x.status === 'apply'; });
    var out = rich(earlier ? 'capApplyLater' : 'capApplyFirst', { n: n, gpo: g, path: t(e.path === 'user' ? 'pathUser' : 'pathComputer'),
      list: added.length ? listOf(added) : t('setNone') });
    ev.over.forEach(function (o) {
      var old = s.list[o], now = ev.rows.filter(function (i) { return s.list[i].setting === old.setting; })[0];
      out = out.concat(sentence('capOver', { v: h('b', null, valueNode(old.setting, s.list[now].value)), old: valueNode(old.setting, old.value), prev: gpoNode(sc, old.gpo) }));
    });
    return out;
  }

  function captionResult(c) {
    var s = c.state, sc = scene(c), kiosk = s.computerGpos[0];
    var fromComputer = s.entries.some(function (e) { return e.path === 'computer' && e.status === 'apply'; });
    if (s.mode === 'off') return rich('capResOff', { user: data(s.user), gpo: gpoBold(sc, kiosk), pc: data(s.computer) });
    if (s.mode === 'merge') return fromComputer ? rich('capResMerge') : rich('capResMergeNoRead', { user: data(s.user), gpo: gpoBold(sc, kiosk) });
    return fromComputer ? rich('capResReplace') : rich('capResReplaceNone', { user: data(s.user), gpo: gpoBold(sc, kiosk) });
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), resets: true, options: [['off', t('optOff')], ['merge', t('optMerge')], ['replace', t('optReplace')]] },
      { key: 'usersCanRead', type: 'toggle', label: t('usersCanRead'), resets: true }
    ],

    presets: L.presets.map(function (pr) {
      var w = PRESET_WORDS[pr.id];
      return { id: pr.id, label: t(w), params: pr.params, hint: t(w + 'Hint') };
    }),

    legend: [
      { shape: 'lb-person', label: t('legUser') },
      { shape: 'lb-monitor', label: t('legComputer') },
      { shape: 'rt-beaten', label: t('legOver') },
      { shape: 'rt-skip', label: t('legSkip') },
      { shape: 'rt-win', label: t('legWin') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'lb' }, renderScene(c), h('div', { class: 'lb-right' }, renderTable(c), renderResult(c))));
    },

    caption: function (c) {
      var s = c.state;
      if (!s.event) return captionStart(s, scene(c));
      if (s.event.kind === 'result') return captionResult(c);
      return captionEntry(c);
    }
  });
})();
</script>
</body>
