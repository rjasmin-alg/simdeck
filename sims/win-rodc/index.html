<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var PC = L.PCS[0];
  var ALL = L.ACCOUNTS.length;

  /** Data (host names, account and group names, addresses) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { class: 'ro-d' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  /** Parts of a string with *English term* turned into <em lang="en"> (the Croatian term rule). Placeholder nodes are
      cloned, so one vars object may serve several sentences. */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars || {}).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p.cloneNode(true)); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function join(list) {
    var out = [];
    list.forEach(function (x, i) { if (i) out.push(' '); out = out.concat(x); });
    return out;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function icon(d, cls) {
    var s = document.createElementNS(SVGNS, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'ro-ico' + (cls ? ' ' + cls : ''));
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', d);
    s.append(p);
    return s;
  }
  function keyIcon() { return icon('M7.5 17a5.5 5.5 0 1 1 5.2-7.3H23v3.6h-2.4V16h-3.2v-2.7h-4.7A5.5 5.5 0 0 1 7.5 17zm0-3.4a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2z', 'ro-key'); }
  function deny() { return h('span', { 'aria-hidden': 'true' }, '⛔'); }

  function users(s) { return s.filter(function (id) { return L.kindOf(id) === 'user'; }); }
  function computers(s) { return s.filter(function (id) { return L.kindOf(id) === 'computer'; }); }
  function forwarded(r) { return r && (r.result === 'cached' || r.result === 'forwarded'); }
  function newlyCached(c) { return c.prev ? c.state.rodc.cached.filter(function (id) { return c.prev.rodc.cached.indexOf(id) < 0; }) : []; }

  // ── the drawing (kit view K2) ──

  function head(name, role) { return h('span', { class: 'ro-head' }, h('b', null, data(name)), h('span', { class: 'ro-role' }, role)); }

  function topo(c) {
    var s = c.state, e = s.last;
    var logon = e && e.kind === 'logon' && !e.gone ? e : null;
    var fwd = logon && (forwarded(logon.pcRes) || forwarded(logon.userRes));
    var fresh = newlyCached(c);
    var bDC = [], bWan = [], bRodc = [], bPc = [];
    bWan.push({ text: t(s.wan ? 'wanUp' : 'wanDown'), k: s.wan ? 'solid' : 'fill' });
    if (fwd) { bDC.push({ text: t('bChecks'), k: 'fill' }); if (fresh.length) bDC.push({ text: t('bSends'), k: 'solid' }); }
    if (e && e.kind === 'list') bDC.push({ text: t('bLists'), k: 'fill' });
    if (e && e.kind === 'delete') bDC.push({ text: t('bDeletes'), k: 'fill' });
    if (e && (e.kind === 'resetUsers' || e.kind === 'resetComputers')) bDC.push({ text: t('bResets'), k: 'fill' });
    if (s.stolen) bRodc.push({ text: t('bStolen'), k: 'fill' });
    if (logon) {
      var results = [logon.pcRes.result, logon.userRes ? logon.userRes.result : 'local'];
      if (results.indexOf('failed') >= 0) bRodc.push({ text: t('bFails'), k: 'fill' });
      else if (fwd) bRodc.push({ text: t('bForwards'), k: 'fill' });
      else bRodc.push({ text: t('bAnswers'), k: 'fill' });
      if (fresh.length) bRodc.push({ text: t('bCaches'), k: 'solid' });
      bPc.push({ text: [data(logon.user), ' ', t('logsOn')], k: 'fill' });
      if (logon.ok) bPc.push({ text: t('bOk'), k: 'solid' });
      else bPc.push({ text: t('chipFail'), k: 'dashed' });
      if (logon.pcLocal) bPc.push({ text: t('bLocalLogon'), k: 'dashed' });
    }
    var act = function (id) {
      if (id === 'RODC01' && s.stolen) return 'down';
      if (!e) return null;
      if (logon) return id === 'DC01' ? (fwd ? 'active' : null) : id === 'WAN' ? (fwd ? 'active' : null) : 'active';
      if (e.kind === 'steal') return id === 'RODC01' ? 'down' : null;
      if (e.kind === 'cut') return id === 'WAN' ? 'active' : null;
      return id === 'DC01' ? 'active' : null;
    };
    var nodes = [
      { id: 'DC01', kind: 'server', col: 0, row: 0, span: 4, c: 1, mark: 'DC', name: head('DC01', t('dcRole')),
        lines: [{ text: '10.10.0.10', kind: 'sub' }], badges: bDC, state: act('DC01') },
      { id: 'WAN', kind: 'cloud', col: 6, row: 0, span: 3, name: t('wanName'), badges: bWan, state: act('WAN'),
        changed: !!(c.prev && c.n > 0 && c.prev.wan !== s.wan) },
      { id: 'RODC01', kind: 'server', col: 11, row: 0, span: 4, c: 2, mark: 'RO', name: head('RODC01', t('rodcRole')),
        lines: [{ text: '10.20.0.10', kind: 'sub' }], badges: bRodc, state: act('RODC01'),
        changed: !!(e && e.kind === 'steal') },
      { id: PC, kind: 'host', col: 17, row: 0, span: 3, c: 3, mark: 'PC', name: head(PC, t('pcRole')), badges: bPc, state: act(PC) }
    ];
    var wanState = s.wan ? 'up' : 'down';
    var links = [
      { id: 'hq', a: 'DC01', b: 'WAN', state: wanState, active: !!fwd },
      { id: 'br', a: 'WAN', b: 'RODC01', state: wanState, active: !!fwd },
      { id: 'lan', a: 'RODC01', b: PC, state: s.stolen ? 'off' : 'up', active: !!logon }
    ];
    var packets = [];
    if (logon) {
      packets.push({ from: PC, to: 'RODC01', label: t('chipLogon'), c: 3, drop: !logon.ok && !fwd, at: 0.5 });
      if (fwd) {
        packets.push({ from: 'RODC01', to: 'WAN', label: t('chipFwd'), c: 2, cast: 'broadcast', at: 0.5 });
        packets.push({ from: 'WAN', to: 'DC01', chip: false, c: 2, cast: 'broadcast' });
      }
      if (fresh.length) {
        packets.push({ from: 'DC01', to: 'WAN', label: [keyIcon(), ' ', data(fresh.join(' + '))], c: 1, at: 0.5 });
        packets.push({ from: 'WAN', to: 'RODC01', chip: false, c: 1 });
      }
    }
    return Simdeck.topology({ cols: 20, rows: ['auto'], dir: c.dir, nodes: nodes, links: links, packets: packets, gap: '0.4cqw' });
  }

  // ── the PRP card ──

  function grp(name, hit) { return h('span', { class: 'ro-chip ro-grp', translate: 'no', dataset: hit ? { hit: hit } : {} }, name); }

  function prpCard(c) {
    var p = c.params, e = c.state.last;
    var checks = [];
    if (e && e.kind === 'logon' && !e.gone) [e.pcRes, e.userRes].forEach(function (r) { if (r && r.prp) checks.push(r); });
    function hitOf(g) {
      var out = null;
      checks.forEach(function (r) {
        if (r.prp.by === g) out = r.prp.verdict === 'deny' ? 'deny' : 'allow';
        if (r.prp.alsoAllowed === g) out = 'beaten';
      });
      return out;
    }
    var allow = L.ALLOW_OF[p.allowGroup];
    var allowRow = h('div', { class: 'ro-row' }, h('span', { class: 'ro-side' }, '✓ ', t('allowed')),
      grp('Allowed RODC Password Replication Group'), h('span', { 'aria-hidden': 'true' }, '⊃'),
      allow.length ? allow.map(function (g) { return grp(g, hitOf(g)); }) : h('span', { class: 'ro-muted' }, t('noMembers')));
    var denyRow = h('div', { class: 'ro-row' }, h('span', { class: 'ro-side' }, deny(), ' ', t('denied')),
      grp('Denied RODC Password Replication Group'), h('span', { 'aria-hidden': 'true' }, '⊃'),
      L.DENIED_GROUP.map(function (g) { return grp(g, hitOf(g)); }), h('span', { class: 'ro-lab' }, t('andPolicy')),
      L.DENIED_POLICY.map(function (g) { return grp(g, hitOf(g)); }));
    var check = h('div', { class: 'ro-check' }, checks.length ? h('span', { class: 'ro-lab' }, t('prpChecked')) : null, checks.length ? checks.map(function (r) {
      var v = r.prp.verdict;
      return h('div', { class: 'ro-row' }, h('b', null, data(r.id)),
        r.prp.by ? ['→', grp(r.prp.by)] : null,
        h('span', { class: v === 'allow' ? null : 'ro-note' }, v === 'deny' ? [deny(), ' ', t('vDeny')] : t(v === 'allow' ? 'vAllow' : 'vNone')),
        r.prp.alsoAllowed ? h('span', null, '(', t('vDenyWins'), ')') : null);
    }) : h('span', { class: 'ro-muted' }, t('prpIdle')));
    return h('div', { class: 'ro-card' }, h('h3', null, t('prpTitle')), allowRow, denyRow, check);
  }

  // ── the accounts card ──

  function acctChip(c, id) {
    var s = c.state, prev = c.prev;
    var cached = s.rodc.cached.indexOf(id) >= 0;
    var denied = L.prp(id, c.params).verdict === 'deny';
    var exp = s.exposed.indexOf(id) >= 0;
    var changed = c.n > 0 && prev && ((cached && prev.rodc.cached.indexOf(id) < 0) || s.pwdVer[id] !== prev.pwdVer[id]);
    return h('span', { class: 'ro-chip' + (changed ? ' ro-ch' : ''), dataset: { k: cached ? 'cached' : denied ? 'deny' : 'plain', exp: exp ? '1' : '0' } },
      cached ? keyIcon() : null, denied ? deny() : null, data(id), h('small', { translate: 'no' }, 'v' + s.pwdVer[id]),
      exp ? h('span', { class: 'ro-tag' }, '!') : null);
  }

  function acctCard(c) {
    var s = c.state;
    function row(label, ids) {
      return h('div', { class: 'ro-row' }, h('span', { class: 'ro-lab', translate: 'no' }, label), ids.map(function (id) { return acctChip(c, id); }));
    }
    var rodcKeyGone = !s.rodc.account;
    var keyChanged = c.n > 0 && c.prev && c.prev.rodc.account !== s.rodc.account;
    var keyRow = h('div', { class: 'ro-row' }, h('span', { class: 'ro-lab' }, t('keys')),
      acctChip(c, 'krbtgt'), h('span', { class: 'ro-muted' }, t('domainKey')),
      h('span', { class: 'ro-chip' + (keyChanged ? ' ro-ch' : ''), dataset: { k: rodcKeyGone ? 'gone' : 'cached', exp: s.stolen ? '1' : '0' } },
        keyIcon(), data('RODC01$ · ' + L.RODC_KRBTGT)),
      h('span', { class: 'ro-muted' }, rodcKeyGone ? t('deleted') : t('rodcKey')));
    return h('div', { class: 'ro-card' }, h('h3', null, t('acctTitle'), h('small', null, t('verHint'))),
      row('BRK-Staff', L.BRANCH_USERS), row('HQ-Staff', ['marko']), row('Domain Admins · BRK-Staff', ['tbrennan']),
      row('BRK-PCs', L.PCS), keyRow);
  }

  // ── what RODC01 holds ──

  function rodcCard(c) {
    var s = c.state;
    var fresh = newlyCached(c);
    var order = L.ACCOUNTS.map(function (a) { return a.id; }).filter(function (id) { return s.rodc.cached.indexOf(id) >= 0; });
    var chips = order.map(function (id) {
      var reset = s.reset.indexOf(id) >= 0;
      var justReset = reset && c.prev && c.prev.reset.indexOf(id) < 0;
      return h('span', { class: 'ro-chip' + (fresh.indexOf(id) >= 0 || justReset ? ' ro-ch' : ''), dataset: { k: 'cached', exp: s.stolen ? '1' : '0' } },
        keyIcon(), data(id), reset ? h('span', { class: 'ro-tag', dataset: { k: 'reset' }, 'aria-hidden': 'true' }, '↻') : null);
    });
    var keyGone = !s.rodc.account;
    return h('div', { class: 'ro-card', dataset: { k: s.stolen ? 'stolen' : 'held' } },
      h('h3', null, t('rodcTitle'), s.stolen ? h('span', { class: 'ro-note' }, t('stolenNote')) : null),
      h('div', { class: 'ro-row ro-muted' }, t('rodcCopy')),
      h('div', { class: 'ro-row' }, h('b', null, t('cachedTitle')), data('msDS-RevealedList', 'ro-muted'),
        h('span', { class: 'ro-muted' }, t('ofAccounts', { n: order.length, all: ALL })),
        s.reset.length ? h('span', { class: 'ro-tag', dataset: { k: 'reset' } }, '↻ ', t('reset'), ' ', data(s.reset.length)) : null),
      h('div', { class: 'ro-row' }, chips.length ? chips : h('span', { class: 'ro-muted' }, t('none'))),
      h('div', { class: 'ro-row' }, h('b', null, t('ownKey')),
        h('span', { class: 'ro-chip', dataset: { k: keyGone ? 'gone' : 'cached', exp: s.stolen ? '1' : '0' } }, keyIcon(), data(L.RODC_KRBTGT)),
        keyGone ? h('span', { class: 'ro-muted' }, t('deleted')) : null));
  }

  // ── the log ──

  var RES = { local: 'rLocal', cached: 'rCached', forwarded: 'rForwarded', failed: 'rFailed' };
  var KIND = { cut: 'logCut', steal: 'logSteal', list: 'logList', 'delete': 'logDelete', resetUsers: 'logResetU', resetComputers: 'logResetC' };
  function logLine(c) {
    var s = c.state;
    var items = s.log.map(function (x, i) {
      var body;
      if (x.kind === 'logon') body = [data(x.user || t('logPcOnly')), ' ', x.ok ? '✓ ' : '✕ ', t(RES[x.result] || 'rFailed')];
      else body = t(KIND[x.kind]);
      return h('li', { class: i === s.log.length - 1 ? 'ro-now' : null, dataset: { k: x.kind === 'logon' ? (x.ok ? 'ok' : 'fail') : 'act' } },
        data(x.n + '.'), ' ', body);
    });
    return h('div', { class: 'ro-log' }, h('b', null, t('logTitle')), items.length ? h('ol', null, items) : h('span', { class: 'ro-muted' }, t('logStart')));
  }

  // ── captions ──

  function counts(list) { return { u: t.n('nUsers', users(list).length), c: t.n('nComputers', computers(list).length) }; }

  function capStart(c) {
    var p = c.params, s = c.state, U = data(p.user);
    var out = [rich('startCommon')];
    if (p.scenario === 'stolen') out.push(rich('startStolen', counts(s.rodc.cached)));
    else if (!p.wan) out.push(rich('startNoWan'));
    else if (p.scenario === 'wan-down') out.push(rich('startWan', { u: U }));
    else if (p.scenario === 'first-logon') out.push(rich('startFirst', { u: U }));
    else out.push(rich('startTwice', { u: U }));
    if (p.user === 'tbrennan' && p.scenario !== 'stolen') out.push(rich('startAdmin'));
    if (p.allowGroup === 'empty') out.push(rich('startEmpty'));
    return join(out);
  }

  function before(c, user, result) {
    return c.prev.log.some(function (x) { return x.kind === 'logon' && x.user === user && x.result === result; });
  }

  function capLogon(c) {
    var s = c.state, e = s.last, p = c.params;
    if (e.gone) return rich('gone');
    var U = data(e.user), pr = e.pcRes, ur = e.userRes, out = [];
    if (!s.wan) {
      if (e.ok) out.push(rich('wanOkLocal', { u: U }));
      else if (pr.result === 'failed' && ur.result === 'failed') out.push(rich('wanFailAll', { u: U }));
      else if (pr.result === 'failed') out.push(rich('wanFailPc', { u: U }));
      else out.push(rich('wanFailUser', { u: U }));
      if (e.pcLocal) out.push(rich('pcLocalLogon'));
      return join(out);
    }
    if (ur.result === 'cached') out.push(rich('firstCached', { u: U, g: data(ur.prp.by) }));
    else if (ur.result === 'local') out.push(rich('userLocal', { u: U }));
    else if (ur.prp.verdict === 'deny') {
      if (before(c, e.user, 'forwarded')) out.push(rich('userDenyAgain', { u: U }));
      else out.push(rich(ur.prp.alsoAllowed ? 'userDeny' : 'userDenyPlain', { u: U, g: data(ur.prp.by), a: data(ur.prp.alsoAllowed || '') }));
    } else if (p.allowGroup === 'empty') out.push(rich('userNoneEmpty', { u: U }));
    else if (before(c, e.user, 'forwarded')) out.push(rich('userNoneAgain', { u: U }));
    else out.push(rich('userNone', { u: U }));
    if (pr.result === 'cached') out.push(rich(ur.result === 'cached' ? 'pcCached' : 'pcCachedAlone', { g: data(pr.prp.by) }));
    else if (pr.result === 'forwarded' && !before(c, e.user, 'forwarded')) out.push(rich('pcNoneEmpty'));
    return join(out);
  }

  function caption(c) {
    var s = c.state, e = s.last;
    if (!e) return capStart(c);
    switch (e.kind) {
      case 'logon': return capLogon(c);
      case 'cut': return e.already ? rich('cutAlready') : rich('cut', { n: t.n('nPasswords', s.rodc.cached.length) });
      case 'steal': return s.exposed.length ? rich('steal', counts(s.exposed)) : rich('stealNone');
      case 'list': return rich('list', { n: t.n('nAccounts', s.toReset.length) });
      case 'delete': return rich('del');
      case 'resetUsers': return e.done.length ? rich('resetU', { u: t.n('nUsers', e.done.length) }) : rich('resetNone');
      case 'resetComputers':
        if (!s.exposed.length) return rich('resetNone');
        return join([e.done.length ? rich('resetC', { c: t.n('nComputers', e.done.length) }) : [], rich('stolenEnd', counts(s.exposed))]);
      default: return '';
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scenario', type: 'select', label: t('scenario'), options: L.SCENARIOS.map(function (x) { return [x, x]; }), resets: true,
        visible: function () { return false; } },
      { key: 'allowGroup', type: 'choice', label: t('allowGroup'), hint: t('allowHint'),
        options: [['empty', t('allowEmpty')], ['brk', t('allowBrk')]] },
      { key: 'user', type: 'choice', label: t('user'), hint: t('userHint'),
        options: [['ana', t('uAna')], ['marko', t('uMarko')], ['tbrennan', t('uTbrennan')]],
        visible: function (p) { return p.scenario !== 'stolen'; } },
      { key: 'wan', type: 'toggle', label: t('wan') }
    ],

    presets: [
      { id: 'first-logon', label: t('presetFirst'), hint: t('presetFirstHint'), params: { scenario: 'first-logon' } },
      { id: 'wan-down', label: t('presetWan'), hint: t('presetWanHint'), params: { scenario: 'wan-down' } },
      { id: 'admin-at-branch', label: t('presetAdmin'), hint: t('presetAdminHint'), params: { scenario: 'admin-at-branch', user: 'tbrennan' } },
      { id: 'default-empty', label: t('presetEmpty'), hint: t('presetEmptyHint'), params: { scenario: 'default-empty', allowGroup: 'empty' } },
      { id: 'stolen', label: t('presetStolen'), hint: t('presetStolenHint'), params: { scenario: 'stolen' } }
    ],

    legend: [
      { shape: 'ro-dc', label: t('legendDc') },
      { shape: 'ro-rodc', label: t('legendRodc') },
      { shape: 'ro-gkey', label: t('legendKey') },
      { shape: 'ro-gdeny', label: t('legendDeny') },
      { shape: 'dash', label: t('legendFwd') },
      { shape: 'ro-exp', label: t('legendExposed') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'ro' }, topo(c), h('div', { class: 'ro-cards' }, prpCard(c), acctCard(c), rodcCard(c)), logLine(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
