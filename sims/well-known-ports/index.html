/* Page CSS: every selector starts with [data-sim="well-known-ports"]; colours only from kit tokens. */
[data-sim="well-known-ports"] { --panel-w: 16rem; }
[data-sim="well-known-ports"] .wk {

[data-sim="well-known-ports"] .wk-seg {
  position: absolute;
  top: 0;
  bottom: 0;
  border: var(--line-w) solid var(--ink);
  background: color-mix(in srgb, var(--sw) 30%, var(--panel));
}
[data-sim="well-known-ports"] .wk-seg.is-user { background-image: repeating-linear-gradient(135deg, transparent 0 0.35rem, color-mix(in srgb, var(--sw) 45%, transparent) 0.35rem 0.6rem); }
[data-sim="well-known-ports"] .wk-seg.is-dynamic { background-image: radial-gradient(color-mix(in srgb, var(--sw) 70%, transparent) 22%, transparent 26%); background-size: 0.5rem 0.5rem; }
[data-sim="well-known-ports"] .wk-seg.is-hl { border-width: 0.25rem; border-color: var(--accent); background-color: color-mix(in srgb, var(--sw) 55%, var(--panel)); }

/* A card: the edge style is the transport (solid TCP, dashed UDP, double both); the left stripe is the range. */
[data-sim="well-known-ports"] .wk-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 0 0.45rem;

}
[data-sim="well-known-ports"] .wk-card.is-udp { border-style: dashed; border-left-style: solid; }
[data-sim="well-known-ports"] .wk-card.is-both { border-width: 0.3rem; border-style: double; border-left-width: 0.5rem; border-left-style: solid; }
[data-sim="well-known-ports"] .wk-card.is-user { border-left-style: dotted; }
[data-sim="well-known-ports"] .wk-card:hover { background-color: color-mix(in srgb, var(--sw) 24%, var(--panel)); }
[data-sim="well-known-ports"] .wk-port { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; line-height: 1.12; }
[data-sim="well-known-ports"] .wk-name { min-width: 0; font-size: max(16px, 0.9rem); font-weight: 700; line-height: 1.15; }
[data-sim="well-known-ports"] .wk-tr { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700; line-height: 1.15; }
[data-sim="well-known-ports"] .wk-mean { grid-column: 1 / -1; min-width: 0; font-size: var(--fs-sm); line-height: 1.15; }
[data-sim="well-known-ports"] .wk-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0 0.5rem; white-space: pre; font-size: var(--fs-sm); line-height: 1.15; }
[data-sim="well-known-ports"] .wk-ch { margin-left: auto; color: var(--muted); font-family: var(--mono); }
[data-sim="well-known-ports"] .wk-none { margin-left: auto; color: var(--muted); font-style: italic; }

[data-sim="well-known-ports"] .wks-big .wk-mean { display: none; }
/* Dimmed: muted text, plain background, the edge kept (it carries the transport); never hidden, still clickable. */
[data-sim="well-known-ports"] .wk-card.is-dim { border-color: var(--line); border-left-color: var(--line); background: var(--bg); color: var(--muted); }
[data-sim="well-known-ports"] .wk-card.is-dim .wk-ch { color: var(--muted); }
[data-sim="well-known-ports"] .wk-card.is-dim .wk-port,
[data-sim="well-known-ports"] .wk-card.is-dim .wk-name { font-weight: 400; }
[data-sim="well-known-ports"] .wk-card.is-dim:hover { background: var(--panel); }
[data-sim="well-known-ports"] .wk-card.sd-changed { background: var(--hl); color: var(--on-hl); }
[data-sim="well-known-ports"] .wk-card.sd-changed .wk-ch { color: var(--on-hl); }
[data-sim="well-known-ports"] .wk-card.is-sel { outline: 0.3rem solid var(--accent); outline-offset: 0.08rem; }
[data-sim="well-known-ports"] .wk-card.is-pair { outline: 0.3rem dashed var(--accent); outline-offset: 0.08rem; }

/* Legend shapes of this page. */
[data-sim="well-known-ports"] .sd-swatch[data-shape^='wk-'] { position: relative; background: var(--panel); border: 0.2rem solid var(--ink); }
[data-sim="well-known-ports"] .sd-swatch[data-shape='wk-udp'] { border-style: dashed; }
[data-sim="well-known-ports"] .sd-swatch[data-shape='wk-both'] { border-width: 0.3rem; border-style: double; }
[data-sim="well-known-ports"] .sd-swatch[data-shape='wk-lock'] { border: 0; background: transparent; }
[data-sim="well-known-ports"] .sd-swatch[data-shape='wk-lock']::before { content: ''; position: absolute; left: 22%; right: 22%; top: 8%; height: 45%; border: 0.15em solid var(--ink); border-bottom: 0; border-radius: 0.4em 0.4em 0 0; }
[data-sim="well-known-ports"] .sd-swatch[data-shape='wk-lock']::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: 5%; height: 48%; border-radius: 0.1em; background: var(--ink); }
[data-sim="well-known-ports"] .sd-swatch[data-shape='wk-range'] { border: 0; border-left: 0.45em solid var(--sw); background: color-mix(in srgb, var(--sw) 30%, var(--panel)); }

/* The hidden params (view, sel): kit.css gives .sd-ctl display: flex, which beats [hidden]. */
[data-sim="well-known-ports"] .sd-ctl[hidden] { display: none; }

/* Phones and portrait screens: the columns stack, the page scrolls. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="well-known-ports"] .sd-stage { height: auto; container-type: inline-size; overflow: visible; }
  [data-sim="well-known-ports"] .wk { height: auto; grid-template-rows: auto auto; }
  [data-sim="well-known-ports"] .wk-grid { grid-template-columns: minmax(0, 1fr); gap: 0.8rem; }
  /* the labels leave the axis and sit in a row: system left, user middle, dynamic right */
  [data-sim="well-known-ports"] .wk-labels,
  [data-sim="well-known-ports"] .wk-bars.is-big .wk-labels { display: flex; justify-content: space-between; gap: 0.4rem; height: auto; }
  [data-sim="well-known-ports"] .wk-label { position: static; flex: 1 1 0; white-space: normal; }

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // Series colour per range; the stripe pattern (solid, dotted) and the number carry the range too.
  var RANGE_C = { system: 1, user: 3, dynamic: 5 };
  // Columns of the grid in family order (SPEC.md §2; the tallest columns have 6 cards).
  var COLUMNS = [['web', 'remote'], ['name'], ['mail'], ['files', 'directory'], ['time', 'db']];
  var TR = { tcp: 'trTcp', udp: 'trUdp', both: 'trBoth' };

  var svgNs = 'http://www.w3.org/2000/svg';
  function lock() {
    var s = document.createElementNS(svgNs, 'svg');
    s.setAttribute('viewBox', '0 0 16 16');
    s.setAttribute('class', 'wk-lock');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(svgNs, 'path');
    p.setAttribute('d', 'M4.5 8V5.5a3.5 3.5 0 0 1 7 0V8');
    var r = document.createElementNS(svgNs, 'rect');
    r.setAttribute('x', '2'); r.setAttribute('y', '7.5'); r.setAttribute('width', '12'); r.setAttribute('height', '8'); r.setAttribute('rx', '1.5');
    s.append(p, r);
    return s;
  }
  function data(text, cls) { return h('span', { class: cls, translate: 'no' }, text); }
  function noSteal(e) { e.preventDefault(); }
  function cardOf(s, port) { return s.cards.filter(function (c) { return c.port === port; })[0]; }
  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  function chText(c) {
    return L.COURSES.filter(function (k) { return c.ch[k]; }).map(function (k) { return k + ' ' + c.ch[k].join('·'); }).join('  ');
  }

  var sim;
  function pick(port) {
    var v = String(port);
    sim.set({ sel: sim.params.sel === v ? '' : v }, { preset: sim.preset }); // a click keeps the active preset
  }

  // "Changed": the cards that appeared with the last change of the active set (SPEC.md §4). The renders before
  // mount returns (the kit's preset and URL passes) only set the starting point: the first view marks nothing.
  var ready = false, last = null, lastKey = null, changed = [];
  function changedOf(s) {
    var key = s.active.slice().sort(function (a, b) { return a - b; }).join(',');
    if (!ready) { last = s; lastKey = key; changed = []; return changed; }
    if (key !== lastKey) { changed = L.appeared(last, s); last = s; lastKey = key; }
    return changed;
  }

  // ── the bar ──

  function axis(s, kind) {
    var pos = kind === 'log' ? L.logPos : L.linPos;
    var track = h('div', { class: 'wk-track' });
    s.bar.forEach(function (r) {
      var a = r[kind][0], b = r[kind][1];
      track.append(h('div', {
        class: 'wk-seg sd-soft is-' + r.id + (s.range === r.id ? ' is-hl' : ''), 'data-c': String(RANGE_C[r.id]),
        style: { left: pct(a), width: pct(b - a) }
      }));
    });
    if (kind === 'log') s.cards.forEach(function (c) {
      track.append(h('div', { class: 'wk-tick' + (c.visible ? ' is-on' : ''), style: { left: 'calc(' + pct(pos(c.port)) + ' - 1px)' }, 'aria-hidden': 'true' }));
    });
    var marks = [];
    if (s.highlight !== null) marks.push({ port: s.highlight, cls: '' });
    if (s.pair !== null) marks.push({ port: s.pair, cls: ' is-pair' });
    s.examples.forEach(function (e) {
      if (e.port === s.highlight || e.port === s.pair) return;
      // the client's words go on the linear axis only, where the dynamic range is wide
      marks.push({ port: e.port, cls: ' is-ex', text: e.role === 'client' && kind === 'lin' ? e.port + ' · ' + t('exNote') : null });
    });
    // Two marks close together (22 and 23): the left one writes its number to the left of its line.
    var near = marks.length > 1 && Math.abs(pos(marks[0].port) - pos(marks[1].port)) < 0.04 ? Math.min(marks[0].port, marks[1].port) : null;
    marks.forEach(function (m) {
      var x = pos(m.port);
      track.append(h('div', { class: 'wk-mark' + m.cls + (x > 0.6 || m.port === near ? ' is-end' : ''), style: { left: pct(x) } },
        h('span', null, m.text || String(m.port))));
    });
    var labels = h('div', { class: 'wk-labels' }, s.bar.map(function (r, i) {
      var end = i === 2;
      var x = r[kind][0];
      var style = end ? { right: '0' } : { left: pct(x) };
      if (kind === 'lin' && i === 1) style = { left: pct(0.25) };
      return h('div', { class: 'wk-label' + (end ? ' is-end' : ''), style: style },
        data(r.from + '–' + r.to, 'wk-num'), ' ', t('r_' + r.id),
        s.big ? h('small', null, t('rs_' + r.id)) : null);
    }));
    return h('div', { class: 'wk-axis' },
      s.big ? h('p', { class: 'wk-axisname' }, t(kind === 'log' ? 'logAxis' : 'linAxis')) : null,
      track, labels);
  }

  function bars(s) {
    return h('div', { class: 'wk-bars' + (s.big ? ' is-big' : '') },
      axis(s, 'log'),
      s.big ? axis(s, 'lin') : null,
      h('p', { class: 'wk-rule' }, t('convention')));
  }

  // ── the cards ──

  function cardEl(c, ch) {
    var cls = 'wk-card is-' + c.transport + (c.range === 'user' ? ' is-user' : '') + (c.visible ? '' : ' is-dim') +
      (ch.indexOf(c.port) >= 0 ? ' sd-changed' : '') + (c.selected ? ' is-sel' : '') + (c.paired ? ' is-pair' : '');
    var sec = null;
    if (c.secureOf !== null) sec = h('span', { class: 'wk-sec', title: t('secureOf', { p: c.secureOf, via: c.via }) }, lock(), data(c.via + ' ← ' + c.secureOf, ''));
    else if (c.secure !== null) sec = h('span', { class: 'wk-sec', title: t('secureIs', { p: c.secure }) }, data('→ ' + c.secure, ''), lock());
    var chs = chText(c);
    return h('button', {
      type: 'button', class: cls, 'data-c': String(RANGE_C[c.range]), 'aria-pressed': c.selected ? 'true' : 'false',
      'data-port': String(c.port), onmousedown: noSteal, onclick: function () { pick(c.port); }
    },
      data(String(c.port), 'wk-port'),
      h('span', { class: 'wk-name' }, t('n' + c.port)),
      data(t(c.transport), 'wk-tr'),
      h('span', { class: 'wk-mean' }, t('m' + c.port)),
      h('span', { class: 'wk-foot' },
        sec || h('span', null),
        chs ? h('span', { class: 'wk-ch', translate: 'no', title: t('chapters') }, chs) : h('span', { class: 'wk-none' }, t('noCourse'))));
  }

  function family(f, s, ch) {
    var cards = s.cards.filter(function (c) { return c.family === f; });
    var on = s.filter.family === 'all' || s.filter.family === f;
    return h('section', { class: 'wk-fam' + (on ? '' : ' is-off') },
      h('h2', { class: 'wk-famname' }, t('f_' + f)),
      h('ul', { class: 'wk-cards' }, cards.map(function (c) { return h('li', null, cardEl(c, ch)); })));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'transport', type: 'choice', label: t('transport'), value: 'all',
        options: [['all', t('tAll')], ['tcp', t('tcp')], ['udp', t('udp')]] },
      { key: 'family', type: 'select', label: t('family'), value: 'all',
        options: [['all', t('fAll')]].concat(L.FAMILIES.map(function (f) { return [f, t('f_' + f)]; })) },
      { key: 'range', type: 'select', label: t('range'), value: 'all',
        options: [['all', t('rAll')]].concat(L.RANGES.map(function (r) { return [r.id, t('r_' + r.id) + ' ' + r.from + '–' + r.to]; })) },
      { key: 'course', type: 'choice', label: t('course'), hint: t('courseHint'), value: 'all',
        options: [['all', t('cAll')], ['URM', 'URM'], ['UL', 'UL']] },
      { key: 'view', type: 'select', label: t('viewParam'), value: 'none', options: L.VIEW_IDS.map(function (v) { return [v, v]; }),
        visible: function () { return false; } },
      { key: 'sel', type: 'select', label: t('selParam'), value: '', options: [['', '']].concat(L.CARDS.map(function (c) { return [String(c.port), String(c.port)]; })),
        visible: function () { return false; } }
    ],

    presets: [
      { id: 'book-five', label: t('pBook'), params: { view: 'book-five' }, hint: t('pBookHint') },
      { id: 'udp-only', label: t('pUdp'), params: { transport: 'udp', view: 'udp-only' }, hint: t('pUdpHint') },
      { id: 'secure-pairs', label: t('pPairs'), params: { view: 'secure-pairs' }, hint: t('pPairsHint') },
      { id: 'linux-services', label: t('pLinux'), params: { view: 'linux-services' }, hint: t('pLinuxHint') },
      { id: 'ranges', label: t('pRanges'), params: { view: 'ranges' }, hint: t('pRangesHint') }
    ],

    legend: [
      { shape: 'wk-tcp', label: t('legTcp') },
      { shape: 'wk-udp', label: t('legUdp') },
      { shape: 'wk-both', label: t('legBoth') },
      { shape: 'wk-lock', label: t('legSecure') },
      { shape: 'wk-range', c: 1, label: t('legRange') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var ch = changedOf(s);
      // A filter ended the view (SPEC.md §5): clear the hidden param too, so setting the filter back does not revive it.
      if (c.params.view !== 'none' && s.view === null) queueMicrotask(function () { sim.set({ view: 'none' }); });
      c.stage.replaceChildren(h('div', { class: 'wk' + (s.big ? ' wks-big' : '') },
        bars(s),
        h('div', { class: 'wk-grid' }, COLUMNS.map(function (col) {
          return h('div', { class: 'wk-col' }, col.map(function (f) { return family(f, s, ch); }));
        }))));
    },

    caption: function (c) {
      var s = c.state;
      if (s.highlight !== null) {
        var k = cardOf(s, s.highlight);
        var r = L.RANGES.filter(function (x) { return x.id === k.range; })[0];
        return t.parts('capSel', {
          port: data(String(k.port), 'wk-capport'), name: t('n' + k.port), tr: t(TR[k.transport]),
          range: t('rangeSpan', { range: t('r_' + k.range) }), span: data(r.from + '–' + r.to, ''), note: t('x' + k.port)
        });
      }
      if (s.view) return t('cap_' + s.view);
      var f = s.filter;
      var filtered = f.transport !== 'all' || f.family !== 'all' || f.range !== 'all' || f.course !== 'all';
      if (f.range === 'dynamic') return t('capDynamic');
      if (filtered) return s.active.length ? t('capCount', { n: s.active.length, total: s.cards.length }) : t('capEmpty');
      var hr = Simdeck.lang === 'hr';
      return t.parts('cap_none', { P: h(hr ? 'i' : 'span', null, t('wPortCap')), p: h(hr ? 'i' : 'span', null, t('wPort')) });
    }
  });
  ready = true;
})();
</script>
