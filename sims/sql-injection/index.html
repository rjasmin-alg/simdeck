<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var CODE = { keyword: 1, ident: 1, op: 1, other: 1 };
  var KIND = { select: 'SELECT', delete: 'DELETE', drop: 'DROP TABLE' };
  var ERR = { syntax: 'errSyntax', column: 'errColumn', table: 'errTable', denied: 'errDenied' };

  function ctl() { return sim || window.simdeck; }
  function data(text, cls) { return h('b', { translate: 'no', class: cls || null }, String(text)); }
  function sym(s) { return h('span', { class: 'qi-sym', 'aria-hidden': 'true' }, s); }
  /** Replace el's children with items, nested arrays flattened and nulls dropped. */
  function put(el, items) {
    var out = [];
    (function walk(x) { if (Array.isArray(x)) x.forEach(walk); else if (x !== null && x !== undefined) out.push(x); })(items);
    el.replaceChildren.apply(el, out);
  }

  // ---- the stage is built once and updated in place, so the fields keep their caret and focus while typing ----
  var ui = null;

  function field(key, label) {
    var id = 'qi-' + key;
    var input = h('input', {
      id: id, type: 'text', class: 'qi-input', maxlength: '60', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', title: t('fieldHint')
    });
    input.addEventListener('input', function () {
      ctl().set(key === 'user' ? { user: input.value, payload: 'none' } : { pass: input.value });
    });
    return { input: input, el: h('div', { class: 'qi-field' }, h('label', { for: id }, t(label)), input) };
  }

  function build(stage) {
    var user = field('user', 'fieldUser'), pass = field('pass', 'fieldPass');
    var res = h('div', { class: 'qi-res', role: 'status' });
    var form = h('section', { class: 'qi-box' }, h('div', { class: 'qi-h' }, t('formTitle')), user.el, pass.el, res);

    var codeSub = h('div', { class: 'qi-sub' });
    var code = h('pre', { class: 'qi-code', translate: 'no' });
    var sentSub = h('div', { class: 'qi-sub' });
    var sql = h('pre', { class: 'qi-sql', translate: 'no' });
    var tag = h('div', { class: 'qi-tag' });
    var vals = h('div', { class: 'qi-vals' });
    var valsBox = h('div', null, h('div', { class: 'qi-sub' }, t('valuesTitle')), vals);
    var run = h('ol', { class: 'qi-run' });
    var app = h('section', { class: 'qi-box' },
      h('div', { class: 'qi-h' }, t('codeTitle')), codeSub, code, sentSub, sql, tag, valsBox,
      h('div', { class: 'qi-sub' }, t('runTitle')), run);

    var head = h('tr', null, h('th', { class: 'qi-mark' }), h('th', { translate: 'no' }, 'id'), h('th', { translate: 'no' }, 'name'), h('th', { translate: 'no' }, 'pass'));
    var body = h('tbody');
    var wrap = h('div', { class: 'qi-tablewrap' }, h('table', { class: 'qi-table' }, h('thead', null, head), body));
    var count = h('div', { class: 'qi-count' });
    var db = h('section', { class: 'qi-box' },
      h('div', { class: 'qi-h' }, t.parts('tableTitle', { name: h('code', { class: 'qi-mono', translate: 'no' }, 'users') })),
      wrap, count, h('div', { class: 'qi-sub qi-plain' }, t('tablePlain')));

    var root = h('div', { class: 'qi' }, form, app, db);
    stage.replaceChildren(root);
    return { root: root, user: user.input, pass: pass.input, res: res, codeSub: codeSub, code: code, sentSub: sentSub, sql: sql,
      tag: tag, vals: vals, valsBox: valsBox, run: run, body: body, wrap: wrap, count: count };
  }

  function fillForm(s) {
    if (ui.user.value !== s.inputs.user) ui.user.value = s.inputs.user;
    if (ui.pass.value !== s.inputs.pass) ui.pass.value = s.inputs.pass;
    var r = ui.res;
    if (s.outcome === 'login') {
      var bad = s.injected;
      r.className = 'qi-res ' + (bad ? 'qi-bad' : 'qi-ok');
      put(r, [sym(bad ? '⚠' : '✓'), t.parts(bad ? 'resLoginInjected' : 'resLogin', { name: data(s.authenticated) })]);
    } else if (s.outcome === 'nomatch') {
      r.className = 'qi-res';
      r.replaceChildren(sym('✗'), t('resNoMatch'));
    } else {
      r.className = 'qi-res qi-bad';
      r.replaceChildren(sym('⚠'), t('resError'), h('span', { class: 'qi-sub' }, t(ERR[s.error])));
    }
  }

  // tokens that differ from the last render: everything between the common head and the common tail
  var lastTokens = null;
  function changedRange(prev, next) {
    if (!prev) return [next.length, next.length];
    var same = function (a, b) { return a.text === b.text && a.role === b.role && a.origin === b.origin; };
    var i = 0;
    while (i < prev.length && i < next.length && same(prev[i], next[i])) i++;
    var j = 0;
    while (j < prev.length - i && j < next.length - i && same(prev[prev.length - 1 - j], next[next.length - 1 - j])) j++;
    return [i, next.length - j];
  }

  function fillApp(s) {
    var param = s.mode === 'param';
    ui.codeSub.textContent = t(param ? 'codeParam' : 'codeConcat');
    if (param) {
      ui.code.replaceChildren('q = prepare("' + s.template[0].code + '")\nq.run(', h('span', { class: 'qi-var' }, 'user'), ', ', h('span', { class: 'qi-var' }, 'pass'), ')');
    } else {
      put(ui.code, ['q = '].concat(s.template.map(function (part, i) {
        var plus = i ? ' + ' : '';
        return part.code !== undefined ? plus + JSON.stringify(part.code) : [plus, h('span', { class: 'qi-var' }, part.field)];
      })));
    }
    ui.sentSub.textContent = t(param ? 'sentParam' : 'sentConcat');
    var range = changedRange(lastTokens, s.tokens);
    ui.sql.replaceChildren.apply(ui.sql, s.tokens.map(function (tok, i) {
      if (tok.role === 'space') return tok.text;
      var cls = 'qi-t qi-' + tok.role + (tok.origin === 'data' ? ' qi-data' : '') + (CODE[tok.role] ? ' qi-code-t' : '') +
        (i >= range[0] && i < range[1] ? ' qi-chg' : '');
      return h('span', { class: cls, title: tok.role === 'comment' ? t('tagIgnored') : null }, tok.text);
    }));
    lastTokens = s.tokens;
    ui.tag.className = 'qi-tag ' + (s.injected ? 'qi-bad' : 'qi-good');
    var hidden = s.tokens.some(function (x) { return x.role === 'comment' && x.origin === 'code'; });
    put(ui.tag, [sym(s.injected ? '⚠' : '✓'), t(s.injected ? 'tagInjected' : 'tagValue'),
      hidden ? h('span', { class: 'qi-sub' }, t('tagIgnored')) : null]);
    ui.valsBox.hidden = !param;
    if (param) {
      ui.vals.replaceChildren.apply(ui.vals, s.values.map(function (v, i) {
        return [h('span', { class: 'qi-sub' }, t('valueFor', { i: i + 1 })), h('span', { class: 'qi-mono', translate: 'no' }, i ? 'pass' : 'name'),
          h('span', { class: 'qi-val' + (v ? '' : ' qi-empty'), translate: 'no' }, v)];
      }).reduce(function (a, b) { return a.concat(b); }, []));
    }
    if (!s.statements.length) {
      ui.run.replaceChildren(h('li', null, h('span', { class: 'qi-st qi-bad' }, sym('⚠'), t('stNothing'))));
      return;
    }
    ui.run.replaceChildren.apply(ui.run, s.statements.map(function (st, i) {
      var text, cls;
      if (st.status === 'ran') {
        cls = st.kind === 'select' ? 'qi-good' : 'qi-bad';
        text = st.kind === 'select' ? t.n('stRows', st.rows) : st.kind === 'drop' ? t('stDropped') : t.n('stDeleted', st.rows);
      } else if (st.status === 'denied') { cls = 'qi-good'; text = t('stDenied'); }
      else if (st.status === 'error') { cls = 'qi-bad'; text = t('stError'); }
      else { cls = 'qi-off'; text = t('stSkipped'); }
      return h('li', null, h('span', { class: 'qi-n' }, (i + 1) + '.'), h('code', { class: 'qi-mono', translate: 'no' }, KIND[st.kind]),
        h('span', { class: 'qi-st ' + cls }, '→ ', text));
    }));
  }

  var lastRet = null;
  function fillTable(s) {
    var rows = [];
    s.rows.forEach(function (r) {
      var was = lastRet && lastRet[r.id];
      var now = (r.returned ? 'r' : '') + (r.deleted ? 'd' : '');
      var mark = h('td', { class: 'qi-mark' + (lastRet && was !== now ? ' sd-changed' : '') },
        r.returned ? h('span', { 'aria-label': t('returnedTag'), title: t('returnedTag') }, '▶') : r.deleted ? h('span', { title: t('deletedTag') }, '✗') : '');
      rows.push(h('tr', { class: (r.returned ? 'qi-ret' : '') + (r.deleted || s.dropped ? ' qi-gone' : '') },
        mark, h('td', { translate: 'no' }, String(r.id)), h('td', { translate: 'no' }, r.name), h('td', { translate: 'no' }, r.pass)));
      if (r.first) rows.push(h('tr', { class: 'qi-first' }, h('td', { colspan: '4', class: 'qi-firsttag' }, '▲ ' + t('firstTag'))));
    });
    lastRet = {};
    s.rows.forEach(function (r) { lastRet[r.id] = (r.returned ? 'r' : '') + (r.deleted ? 'd' : ''); });
    ui.body.replaceChildren.apply(ui.body, rows);
    ui.wrap.classList.toggle('qi-dropped', s.dropped);
    var banner = ui.wrap.querySelector('.qi-dropbanner');
    if (s.dropped && !banner) ui.wrap.appendChild(h('div', { class: 'qi-dropbanner' }, '✗ ' + t('dropped')));
    if (!s.dropped && banner) banner.remove();
    ui.count.textContent = s.returned.length ? t.n('rowsReturned', s.returned.length) : t('rowsNone');
  }

  function stackedDetail(s) {
    // the statement that matters: the first later one that writes (DROP, DELETE), else the second
    var later = s.statements.slice(1);
    var second = later.filter(function (x) { return x.kind !== 'select'; })[0] || later[0];
    var stmt = h('code', { translate: 'no' }, KIND[second.kind]);
    if (second.status === 'denied') return t.parts('capStackedDenied', { stmt: stmt });
    if (second.status === 'ran' && second.kind !== 'select') {
      var what = second.kind === 'drop' ? t('stDropped') : t.n('stDeleted', second.rows);
      return t.parts('capStackedRan', { stmt: stmt, what: what });
    }
    return t.parts('capStackedOk', { stmt: stmt });
  }

  function caption(s) {
    var name = s.authenticated ? data(s.authenticated, 'sd-hl') : null;
    switch (s.note) {
      case 'normal': return t.parts('capNormal', { name: name });
      case 'wrong': return t.parts('capWrong');
      case 'error': return t.parts('capError');
      case 'paramMatch': return t.parts('capParamMatch', { name: name });
      case 'paramFixed': return t.parts('capParamFixed');
      case 'paramNoMatch': return t.parts('capParamNoMatch');
    }
    var detail;
    if (s.note === 'stacked') detail = stackedDetail(s);
    else if (s.outcome !== 'login') detail = t.parts('capNone');
    else if (s.note === 'comment') detail = t.parts('capComment', { name: name });
    else detail = t.parts('capRows', { n: s.returned.length, count: data(s.returned.length), name: name });
    return t.parts('capQuote').concat(' ', detail);
  }

  var labels = { normal: 'presetNormal', 'or-true': 'presetOrTrue', 'admin-comment': 'presetAdminComment', stacked: 'presetStacked', fixed: 'presetFixed' };
  var payloadLabel = { none: 'optNone', 'or-true': 'optOrTrue', 'admin-comment': 'optAdminComment', stacked: 'optStacked' };
  var sim;

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      // value: what a bad URL value falls back to (the kit's coerce and normalise use the spec's value)
      { key: 'mode', type: 'choice', label: t('mode'), value: L.defaults.mode,
        options: [['concat', t('optConcat')], ['param', t('optParam')]] },
      { key: 'payload', type: 'choice', label: t('payload'), hint: t('payloadHint'), value: L.defaults.payload,
        options: L.PAYLOAD_IDS.map(function (id) { return [id, t(payloadLabel[id])]; }) },
      { key: 'role', type: 'choice', label: t('role'), hint: t('roleHint'), value: L.defaults.role,
        options: [['login', t('optLogin')], ['owner', t('optOwner')]] }
    ],

    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),

    legend: [
      { shape: 'qi-data', label: t('legendData') },
      { shape: 'qi-code', label: t('legendCode') },
      { shape: 'qi-quote', label: t('legendQuote') },
      { shape: 'qi-ret', label: t('legendReturned') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var s = c.state;
      if (!ui || !c.stage.contains(ui.root)) { ui = build(c.stage); lastTokens = null; lastRet = null; }
      fillForm(s);
      fillApp(s);
      fillTable(s);
    },

    caption: function (c) { return caption(c.state); }
  });

  // ---- the typed fields survive a reload (the language switch reloads the page; text is not in the URL) ----
  // Saved on leaving, restored once and only into the same address apart from ?lang=, so a later link to another
  // preset never gets old text. Storage may be unavailable (private mode, file://): then the fields start fresh.
  var KEEP = 'simdeck.sql-injection.text';
  function here() { var u = new URLSearchParams(window.location.search); u.delete('lang'); return window.location.pathname + '?' + u.toString(); }
  window.addEventListener('pagehide', function () {
    try { window.sessionStorage.setItem(KEEP, JSON.stringify({ at: here(), user: sim.params.user, pass: sim.params.pass })); } catch (e) { /* no storage */ }
  });
  try {
    var kept = JSON.parse(window.sessionStorage.getItem(KEEP) || 'null');
    window.sessionStorage.removeItem(KEEP);
    if (kept && kept.at === here() && typeof kept.user === 'string' && typeof kept.pass === 'string' &&
        (kept.user !== sim.params.user || kept.pass !== sim.params.pass)) {
      lastTokens = null; lastRet = null;
      sim.set({ user: kept.user, pass: kept.pass });
    }
  } catch (e) { /* no storage */ }
})();
</script>
</body>
</html>
