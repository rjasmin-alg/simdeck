<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { incr: '1', diff: '2', full: '3' };   // series colour per lane; lanes also differ by title and place
  var BLOCK_IDS = [0, 1, 2, 3, 4, 5, 6, 7];

  function days(key) { return t(key).split('|'); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function nom(d) { return days('daysNom')[d]; }
  function gen(d) { return days('daysGen')[d]; }
  function acc(d) { return days('daysAcc')[d]; }
  function short(d) { return days('daysShort')[d]; }
  /** Data (block numbers, content labels) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  /** "0, 1, 3, 4 i 6": the last two joined by the word "and". */
  function joinList(items) {
    if (items.length < 2) return items.join('');
    return items.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + items[items.length - 1];
  }
  function blocksList(idx) { return data(joinList(idx.map(String))); }
  function sp(parts) { return [' '].concat(parts); }
  /** After a lane name and a colon a Croatian sentence goes on in lower case (English day names keep their capital). */
  function lowerFirst(parts) {
    var first = parts[0];
    var text = typeof first === 'string' ? first : first && first.nodeType === 3 ? first.textContent : null;
    if (document.documentElement.lang !== 'hr' || text === null) return parts;
    return [text.charAt(0).toLowerCase() + text.slice(1)].concat(parts.slice(1));
  }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule, for terms the glossary lacks). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function richN(key, n, vars) { return rich(key, Object.assign({ n: n }, vars || {})); }

  function laneName(mode) { return t(mode === 'incr' ? 'laneIncr' : mode === 'diff' ? 'laneDiff' : 'laneFull'); }
  function laneShort(mode) { return t(mode === 'incr' ? 'lnIncr' : mode === 'diff' ? 'lnDiff' : 'lnFull'); }
  function tag(set) { return t(set.day === 0 ? 'tagLevel0' : set.kind === 'incr' ? 'tagIncr' : set.kind === 'diff' ? 'tagDiff' : 'tagFull'); }
  /** The kind of a night's set as a term: first mention on the first night of that kind, later mentions after. */
  function kindTerm(kind, day) {
    if (kind === 'incr') return Simdeck.term('incremental backup', { later: day > 1 });
    if (kind === 'diff') return h('span', null, rich(day > 1 ? 'termDiffLater' : 'termDiff'));
    return Simdeck.term('full backup', { later: day > 0 });
  }
  function storedIdx(set) { return Object.keys(set.blocks).map(Number).sort(function (a, b) { return a - b; }); }

  // ── stage ──

  function diskGrid(c) {
    var s = c.state;
    var restoring = s.phase === 'target' || s.phase === 'restore';
    var disk = restoring ? s.history[s.target] : s.disk;
    var day = restoring ? s.target : s.day;
    var meta = s.phase === 'start' ? [t('diskEmpty')] : [t(restoring ? 'diskTarget' : 'diskToday', { day: nom(day) })];
    var count = s.phase === 'start' || restoring ? null
      : { text: t('cntChanged', { a: s.changed.sinceLast.length, b: s.day === 0 ? 0 : s.changed.sinceFull.length }) };
    return Simdeck.blockGrid({
      dir: c.dir,
      title: t('diskTitle'), meta: meta, count: count,
      colLabels: BLOCK_IDS.map(String),
      rows: [{
        id: 'disk', label: h('span', null, day >= 0 ? short(day) : '·'),
        cells: disk.map(function (b, i) {
          return { text: b, now: s.phase === 'write' && s.written.indexOf(i) >= 0 };
        })
      }]
    });
  }

  function laneGrid(c, k) {
    var s = c.state, l = s.lanes[k], r = l.restore, col = COLOUR[l.mode];
    var rows = [];
    for (var d = 0; d < L.DAYS; d++) {
      var set = l.sets[d];
      var lost = set && s.lost === d;
      var nowSet = set && s.phase === 'backup' && s.day === d;
      rows.push({
        id: 'd' + d,
        label: h('span', null, short(d)),
        aside: set ? h('span', { class: lost ? 'bd-bad' : null }, lost ? t('tagLost') : tag(set)) : '',
        cells: BLOCK_IDS.map(function (i) {
          if (!set) return null;                      // the night has not come yet
          if (!(i in set.blocks)) return {};          // not stored: an empty slot
          return { text: set.blocks[i], kind: lost ? 'bad' : 'fill', c: col, now: nowSet };
        })
      });
    }
    var aside = '';
    if (r && r.done) {
      aside = r.ok ? h('span', { class: 'bd-ok' }, '✓ ' + t('asideOk'))
        : h('span', { class: 'bd-bad' }, r.reached === null ? t('asideNothing') : t('asideGap', { day: short(r.reached) }));
    }
    rows.push({
      id: 'rest', label: h('span', null, t('rowRest')), aside: aside,
      cells: BLOCK_IDS.map(function (i) {
        if (!r) return null;
        if (r.result[i] === null) return {};
        var stale = r.done && r.wrong.indexOf(i) >= 0;
        return { text: r.result[i], sub: h('span', null, short(r.from[i])), kind: stale ? 'dead' : 'soft', c: col, now: r.now.indexOf(i) >= 0 };
      })
    });
    // the set applied in this step: one arrow down its first block's column (lines pass under the cells)
    var links = [];
    if (r && r.step === 'apply') links.push({ from: { row: 'd' + r.plan[r.applied - 1], cell: r.now[0] }, to: { row: 'rest', cell: r.now[0] }, now: true });
    var meta = h('span', { class: 'bd-rest', dataset: r ? { on: 'true' } : null },
      r ? t('restLine', { a: r.applied, b: r.plan.length, r: r.read }) : t('restNone'));
    return Simdeck.blockGrid({
      dir: c.dir,
      className: 'bd-lane',
      title: laneName(l.mode),
      meta: [meta],
      count: { text: t.n('cntStored', l.stored), hl: s.phase === 'backup' },
      cellHeight: '2.8rem',
      rows: rows, links: links
    });
  }

  // ── captions ──

  function capWrite(s) {
    if (s.day === 0) return t.parts('capWriteSun');
    var out = t.parts('capWrite', { n: s.written.length, day: cap(nom(s.day)), list: blocksList(s.written) });
    s.twice.forEach(function (i) {
      out = out.concat(sp(t.parts('capTwice', { i: data(i), a: data(L.label(i, s.ver[i] - 1)), b: data(L.label(i, s.ver[i])), c: data(L.label(i, s.ver[i])) })));
    });
    return out;
  }

  function capNight(s) {
    var d = s.day;
    if (d === 0) return t.parts('capFullSun');
    if (s.lanes.length > 1) {
      var sz = s.lanes.map(function (l) { return storedIdx(l.sets[d]).length; });
      return t.parts('capCmpNight', { day: cap(nom(d)), a: sz[0], b: sz[1], sa: s.lanes[0].stored, sb: s.lanes[1].stored });
    }
    var l = s.lanes[0], set = l.sets[d], idx = storedIdx(set), out;
    var v = { day: cap(nom(d)), kind: kindTerm(set.kind, d), list: blocksList(idx) };
    if (set.kind === 'incr') {
      out = richN('capIncr', idx.length, Object.assign(v, { prev: gen(d - 1) }));
      return out.concat(sp(t.parts('capIncrNeed', { n: d + 1, day: acc(d) })));
    }
    if (set.kind === 'diff') {
      out = richN('capDiff', idx.length, v);
      if (d >= 2) {
        var again = storedIdx(l.sets[d - 1]).filter(function (i) { return i in set.blocks; });
        if (again.length) out = out.concat(sp(t.parts('capDiffAgain', { n: again.length, list: blocksList(again) })));
      }
      return out.concat(sp(t.parts('capDiffNeed', { day: acc(d) })));
    }
    return rich('capFullNight', { day: cap(nom(d)), kind: kindTerm('full', d), target: acc(d) });
  }

  function capTarget(s) {
    var out = t.parts('capTarget', { day: acc(s.target) });
    s.lanes.forEach(function (l) {
      var plan = l.restore.plan;
      out = out.concat(sp(t.parts(l.mode === 'incr' ? 'planN' : 'planOnly',
        { n: plan.length, lane: laneShort(l.mode), days: joinList(plan.map(nom)) })));
    });
    if (s.lost !== null) out = out.concat(sp(t.parts('capLostSet', { lost: gen(s.lost) })));
    return out;
  }

  function capApply(c, k) {
    var s = c.state, l = s.lanes[k], r = l.restore;
    var d = r.plan[r.applied - 1], set = l.sets[d];
    var v = { day: cap(nom(d)), kind: tag(set), list: blocksList(r.now) };
    var out = r.now.length === BLOCK_IDS.length ? t.parts('capApplyAll', v) : t.parts('capApply', Object.assign({ n: r.now.length }, v));
    var before = c.prev.lanes[k].restore.result;
    var newer = r.now.filter(function (i) { return before[i] !== null && before[i] !== r.result[i]; });
    if (newer.length) {
      var chg = newer.map(function (i) { return before[i] + ' → ' + r.result[i]; }).join(', ');
      out = out.concat(sp(t.parts('capNewer', { n: newer.length, list: blocksList(newer), chg: data(chg) })));
    }
    return out;
  }

  /** What a restore that skipped the missing set would hand back wrongly, as if it were current (rule 6). */
  function skipWrong(l, r, lost) {
    var res = [null, null, null, null, null, null, null, null];
    r.plan.forEach(function (d) {
      if (d === lost) return;
      storedIdx(l.sets[d]).forEach(function (i) { res[i] = l.sets[d].blocks[i]; });
    });
    return res;
  }

  function capGap(s, k, alone) {
    var l = s.lanes[k], r = l.restore;
    var out = t.parts('capGap', { lost: gen(s.lost) });
    if (r.reached === null) out = out.concat(sp(t.parts('capGapNothing')));
    else out = out.concat(sp(t.parts('capGapReached', { n: r.wrong.length, reached: gen(r.reached), target: gen(r.target), list: blocksList(r.wrong) })));
    if (l.mode === 'incr' && r.plan.indexOf(s.lost) < r.plan.length - 1) {
      var res = skipWrong(l, r, s.lost), target = s.history[r.target];
      var old = BLOCK_IDS.filter(function (i) { return res[i] !== target[i]; });
      if (old.length) out = out.concat(sp(t.parts('capGapSkip', { n: old.length, list: blocksList(old), old: data(joinList(old.map(function (i) { return res[i]; }))) })));
    }
    if (r.newest !== r.reached) out = out.concat(sp(r.newest >= 0 ? t.parts('capGapNewest', { day: nom(r.newest) }) : t.parts('capGapNone')));
    if (l.mode === 'incr' && r.target > s.lost) out = out.concat(sp(t.parts('capGapChain', { from: gen(s.lost), to: gen(r.target) })));
    if (alone && l.mode === 'incr' && r.target !== s.lost) {
      out = out.concat(sp(t.parts('capGapDiffHint', { lost: acc(s.lost), target: acc(r.target), targetGen: gen(r.target) })));
    }
    return out;
  }

  function capCompare(s, k, alone) {
    var l = s.lanes[k], r = l.restore;
    var out = t.parts('capOk', { n: r.applied, day: gen(r.target), r: r.read });
    if (alone && l.mode === 'incr' && r.plan.length <= 2) out = out.concat(sp(t.parts('capCostShort')));
    else if (alone) out = out.concat(sp(t.parts(l.mode === 'incr' ? 'capCostIncr' : l.mode === 'diff' ? 'capCostDiff' : 'capCostFull', { s: l.stored })));
    return out;
  }

  function capRestore(c) {
    var s = c.state, alone = s.lanes.length === 1, out = [];
    s.lanes.forEach(function (l, k) {
      var r = l.restore, part;
      if (r.step === 'apply') part = capApply(c, k);
      else if (r.step === 'gap') part = capGap(s, k, alone);
      else if (r.step === 'compare') part = capCompare(s, k, alone);
      else if (r.end === 'gap') part = t.parts('capStopped', { lane: laneShort(l.mode), state: r.reached === null ? t('asideNothing') : nom(r.reached) });
      else part = t.parts('capWait', { lane: laneShort(l.mode) });
      if (!alone && r.step) part = [laneShort(l.mode) + ': '].concat(lowerFirst(part));
      out = out.concat(out.length ? sp(part) : part);
    });
    if (!alone && c.last && s.lanes.every(function (l) { return l.restore.ok; })) {
      var a = s.lanes[0], b = s.lanes[1];
      out = out.concat(sp(a.restore.applied === b.restore.applied ? t.parts('capVerdictSame', { day: acc(s.target) })
        : t.parts('capVerdict', { sa: a.stored, na: a.restore.applied, sb: b.stored, nb: b.restore.applied })));
    }
    return out;
  }

  // ── lnx-send-receive (param repl): two machines, snapshots, the stream of each send ──

  var SNAP = ['@mon', '@tue', '@wed'];                 // snapshot names are data (the same in both languages)
  function isSend(p) { return L.normRepl(p).id !== null; }
  function snapName(d) { return data(SNAP[d]); }
  function snapList(ds) { return data(joinList(ds.map(function (d) { return SNAP[d]; }))); }
  /** Send days 0–2 are Monday–Wednesday: the host's day lists start on Sunday. */
  function sDay(d) { return d + 1; }

  // The legend of both scenes; setMode hides the other scene's items (data-only, CSS above).
  var LEGEND = [
    { shape: 'hl', label: t('legChanged'), only: 'host' },
    { shape: 'bg-fill', c: 1, label: t('legStored'), only: 'host' },
    { shape: 'slot', label: t('legSlot'), only: 'host' },
    { shape: 'bg-soft', c: 1, label: t('legRestored'), only: 'host' },
    { shape: 'bg-link', label: t('legLink'), only: 'host' },
    { shape: 'bg-bad', label: t('legLost'), only: 'host' },
    { shape: 'bg-dead', label: t('legStale'), only: 'host' },
    { shape: 'hl', label: t('legSrNow'), only: 'send' },
    { shape: 'flag', label: t('legSrFlag'), only: 'send' },
    { shape: 'bg-fill', c: 1, label: t('legSrBlock'), only: 'send' },
    { shape: 'bg-soft', c: 1, label: t('legSrShared'), only: 'send' },
    { shape: 'bg-bracket', label: t('legSrStream'), only: 'send' },
    { shape: 'slot', label: t('legSrSlot'), only: 'send' },
    { shape: 'bg-link', label: t('legSrLink'), only: 'send' },
    { shape: 'bg-bad', label: t('legSrRefused'), only: 'send' },
    { shape: 'common', label: t('legSrCommon'), only: 'send' },
    { shape: 'bg-dead', label: t('legSrGone'), only: 'send' }
  ];
  function setMode(p) {
    var send = isSend(p);
    document.documentElement.dataset.mode = send ? 'send' : 'host';
    var sub = document.querySelector('.sd-subtitle');
    if (sub) {
      if (sub.dataset.host === undefined) sub.dataset.host = sub.textContent;
      sub.textContent = send ? t('srSubtitle') : sub.dataset.host;
    }
    var stage = document.querySelector('[data-sd-stage]');
    if (stage) stage.setAttribute('aria-label', t(send ? 'srStage' : 'stage'));
    var lis = document.querySelectorAll('[data-sd-legend] > li');
    LEGEND.forEach(function (it, i) { if (lis[i]) lis[i].dataset.only = it.only; });
  }

  /** The tags beside a snapshot row: common (on both sides), the parent of this step's send, the snapshot sent. */
  function snapTags(s, d, sideKey) {
    var bits = [];
    var both = L.snapOf(s.src, d) && L.snapOf(s.tgt, d);
    if (both) bits.push('⇄');
    if (s.stream && s.stream.parent === d) bits.push(t('srParent'));
    if (sideKey === 'src' && s.stream && s.stream.day === d) bits.push(t('srSent'));
    return bits.length ? h('span', { class: 'bd-tag' }, bits.join(' ')) : '';
  }

  function snapRows(s, sideKey, col) {
    var side = s[sideKey], rows = [];
    for (var d = 0; d < SNAP.length; d++) {
      var snap = L.snapOf(side, d), gone = side.gone.indexOf(d) >= 0;
      var got = s.stream && !s.check && s.stream.day === d && sideKey === 'tgt';
      rows.push({
        id: sideKey + d, label: '⚑ ' + SNAP[d],
        aside: gone ? h('span', { class: 'bd-bad' }, t('srGone')) : snap ? snapTags(s, d, sideKey) : '',
        cells: BLOCK_IDS.map(function (i) {
          if (gone) return { text: s.history[d][i], kind: 'dead' };
          if (!snap) return null;                      // not taken (or not received) yet
          var b = snap.blocks[i], refs = L.refsOf(side, i, b);
          return { text: b, kind: refs > 1 ? 'soft' : 'fill', refs: refs, c: col, now: got && s.stream.carried.indexOf(i) >= 0 };
        })
      });
    }
    return rows;
  }

  function srcGrid(c) {
    var s = c.state;
    var rows = [{
      id: 'live', label: h('span', null, t('srLive')),
      cells: s.src.live.map(function (b, i) { return { text: b, kind: 'fill', c: 1, now: s.op === 'send' && s.written.indexOf(i) >= 0 }; })
    }].concat(snapRows(s, 'src', 1));
    return Simdeck.blockGrid({
      dir: c.dir, className: 'bd-lane',
      title: t('srSrc'), meta: [t('diskToday', { day: nom(sDay(s.day)) })],
      count: { text: t.n('srStored', L.storedOn(s.src)), hl: s.op === 'del' && s.deleted.side === 'src' },
      colLabels: BLOCK_IDS.map(String), cellHeight: '2.9rem', rows: rows
    });
  }

  function tgtGrid(c) {
    var s = c.state, st = s.stream, refused = st && s.check !== null;
    var pair = st ? (st.kind === 'full' ? '⚑ ' + SNAP[st.day] : SNAP[st.parent] + ' → ' + SNAP[st.day]) : null;
    var rows = [{
      id: 'stream', label: h('span', null, t('srStream')),
      aside: !st ? '' : refused ? h('span', { class: 'bd-bad' }, '✕ ' + t('srRefused'))
        : h('span', { class: 'bd-tag' }, t(st.kind === 'full' ? 'srFullTag' : 'srIncrTag')),
      brackets: st ? [{ from: 0, len: L.BLOCKS, label: data(pair) }] : [],
      cells: BLOCK_IDS.map(function (i) {
        if (!st) return null;
        if (!(i in st.blocks)) return {};             // not carried: an empty slot
        return { text: st.blocks[i], kind: refused ? 'bad' : 'fill', c: 2, now: !refused };
      })
    }].concat(snapRows(s, 'tgt', 2));
    var tl = s.tgt.live;
    rows.push({
      id: 'tlive', label: h('span', null, t('srLive')),
      aside: s.tgt.modified ? h('span', { class: 'bd-bad' }, t('srChanged'))
        : s.lostWrites.length ? h('span', { class: 'bd-bad' }, t('srRolledBack')) : '',
      cells: BLOCK_IDS.map(function (i) {
        if (!tl) return {};                            // the target holds nothing yet
        var mine = s.tgt.touched.indexOf(i) >= 0;
        if (s.lostWrites.indexOf(i) >= 0) return { text: tl[i], sub: data(c.prev.tgt.live[i]), kind: 'fill', c: 2, now: true };
        return { text: tl[i], kind: 'fill', c: mine ? 3 : 2, now: s.op === 'touch' && mine };
      })
    });
    if (L.REPL[s.repl].some(function (o) { return o.op === 'restore'; })) {
      var r = s.restore;
      rows.push({
        id: 'rest', label: h('span', null, t('srRest')),
        aside: r && r.ok ? h('span', { class: 'bd-ok' }, '✓ ' + t('srSame')) : '',
        cells: BLOCK_IDS.map(function (i) { return r ? { text: r.result[i], sub: data(SNAP[r.day]), kind: 'soft', c: 2, now: true } : null; })
      });
    }
    var links = [];
    if (st && !refused) links.push({ from: { row: 'stream', cell: st.carried[0] }, to: { row: 'tgt' + st.day, cell: st.carried[0] }, now: true });
    if (s.restore) links.push({ from: { row: 'tgt' + s.restore.day, cell: 0 }, to: { row: 'rest', cell: 0 }, now: true });
    return Simdeck.blockGrid({
      dir: c.dir, className: 'bd-lane',
      title: t('srTgt'), meta: s.tgt.live ? [t.n('srSnaps', s.tgt.snaps.length)] : [t('srEmpty')],
      count: { text: t.n('srStored', L.storedOn(s.tgt)), hl: !!st && !refused },
      colLabels: BLOCK_IDS.map(String), cellHeight: '2.9rem', rows: rows, links: links
    });
  }

  function srRender(c) {
    c.stage.replaceChildren(h('div', { class: 'bd' }, h('div', { class: 'bd-lanes' }, srcGrid(c), tgtGrid(c))));
  }

  function srCapSend(c) {
    var s = c.state, st = s.stream, prev = c.prev, out = [];
    if (s.op === 'send') {
      if (!s.written.length) out = out.concat(t.parts('srCapDaySnap', { day: cap(nom(sDay(s.day))), snap: snapName(st.day) }), [' ']);
      else out = out.concat(t.parts('capWrite', { n: s.written.length, day: cap(nom(sDay(s.day))), list: blocksList(s.written) }), [' '],
        t.parts('srCapSnap', { snap: snapName(st.day) }), [' ']);
    }
    if (s.check === 'no-parent') return out.concat(t.parts('srCapNoParent', { parent: snapName(st.parent) }));
    if (s.check === 'modified') return out.concat(t.parts('srCapModified', { parent: snapName(st.parent), parent2: snapName(st.parent) }));
    if (st.kind === 'full') return out.concat(t.parts(s.op === 'resend' ? 'srCapResend' : 'srCapFull', { snap: snapName(st.day), snap2: snapName(st.day) }));
    var common = L.commonSnaps(prev.src, prev.tgt);
    if (common.length > 1) out = out.concat(t.parts('srCapTie', { list: snapList(common), parent: snapName(st.parent) }), [' ']);
    var goneSrc = prev.src.gone.filter(function (d) { return L.snapOf(prev.tgt, d); });
    if (goneSrc.length) out = out.concat(t.parts('srCapKept', { gone: snapList(goneSrc), parent: snapName(st.parent) }), [' ']);
    out = out.concat(t.parts('srCapIncr', { n: st.carried.length, parent: snapName(st.parent), snap: snapName(st.day), list: blocksList(st.carried) }), [' ']);
    if (s.lostWrites.length) {
      var i = s.lostWrites[0];
      return out.concat(t.parts('srCapForced', { parent: snapName(st.parent), i: data(i), c: data(prev.tgt.live[i]), snap: snapName(st.day) }));
    }
    return out.concat(t.parts('srCapWhole', { snap: snapName(st.day), day: gen(sDay(st.day)) }));
  }

  function srCaption(c) {
    var s = c.state;
    if (s.phase === 'start') return rich('srCapStart');
    if (s.op === 'send' || s.op === 'resend') return srCapSend(c);
    if (s.op === 'del') {
      if (s.deleted.side === 'tgt') return t.parts('srCapDelTgt', { snap: snapName(s.deleted.day), snap2: snapName(s.deleted.day) });
      var later = s.src.snaps.map(function (x) { return x.day; }).filter(function (d) { return d > s.deleted.day; });
      return t.parts('srCapDelSrc', { snap: snapName(s.deleted.day), later: snapList(later) });
    }
    if (s.op === 'touch') {
      var tgtSnaps = s.tgt.snaps;
      return t.parts('srCapTouch', { i: data(s.written[0]), c: data(s.tgt.live[s.written[0]]), snap: snapName(tgtSnaps[tgtSnaps.length - 1].day) });
    }
    var r = s.restore;
    return t.parts('srCapRestore', { day: gen(sDay(r.day)), snap: snapName(r.day), snap2: snapName(r.day), r: r.read });
  }

  var dayChoices = [1, 2, 3, 4].map(function (d) { return [d, short(d)]; });
  function host(q) { return !isSend(q); }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'select', label: t('mode'), resets: true,
        options: [['incr', t('modeIncr')], ['diff', t('modeDiff')], ['full', t('modeFull')]], visible: host },
      { key: 'compare', type: 'toggle', label: t('compare'), hint: t('compareHint'), resets: true, visible: host },
      { key: 'restoreDay', type: 'choice', label: t('restoreDay'), resets: true, options: dayChoices, visible: host },
      { key: 'lose', type: 'choice', label: t('lose'), resets: true, options: [[0, t('loseNone')]].concat(dayChoices.slice(0, 3)), visible: host },
      // lnx-send-receive: the case is chosen by its preset; force only matters where the target was written to
      { key: 'repl', type: 'select', label: t('repl'), resets: true,
        options: [['off', t('replOff')], ['chain', t('presetChain')], ['missing', t('presetMissing')], ['common', t('presetCommon')],
          ['touched', t('presetTouched')]],
        visible: function () { return false; } },
      { key: 'force', type: 'toggle', label: t('force'), hint: t('forceHint'),
        visible: function (q) { return L.normRepl(q).id === 'touched'; } }
    ],

    presets: [
      { id: 'week-incremental', label: t('presetIncr'), params: { mode: 'incr' }, hint: t('presetIncrHint') },
      { id: 'week-differential', label: t('presetDiff'), params: { mode: 'diff' }, hint: t('presetDiffHint') },
      { id: 'full-nightly', label: t('presetFull'), params: { mode: 'full' }, hint: t('presetFullHint') },
      { id: 'lost-tuesday', label: t('presetLost'), params: { mode: 'incr', lose: 2 }, hint: t('presetLostHint') },
      { id: 'compare', label: t('presetCompare'), params: { compare: true }, hint: t('presetCompareHint') },
      { id: 'send-chain', label: t('presetChain'), params: { repl: 'chain' }, hint: t('presetChainHint') },
      { id: 'missing-parent', label: t('presetMissing'), params: { repl: 'missing' }, hint: t('presetMissingHint') },
      { id: 'common-kept', label: t('presetCommon'), params: { repl: 'common' }, hint: t('presetCommonHint') },
      { id: 'target-touched', label: t('presetTouched'), params: { repl: 'touched' }, hint: t('presetTouchedHint') }
    ],

    legend: LEGEND,

    render: function (c) {
      setMode(c.params);
      if (isSend(c.params)) { srRender(c); return; }
      var lanes = c.state.lanes.map(function (l, k) { return laneGrid(c, k); });
      c.stage.replaceChildren(h('div', { class: 'bd' }, diskGrid(c), h('div', { class: 'bd-lanes' }, lanes)));
    },

    caption: function (c) {
      var s = c.state;
      if (isSend(c.params)) return srCaption(c);
      if (s.phase === 'start') return t.parts('capStart');
      if (s.phase === 'write') return capWrite(s);
      if (s.phase === 'backup') return capNight(s);
      if (s.phase === 'target') return capTarget(s);
      return capRestore(c);
    }
  });
})();
</script>
</body>
</html>
