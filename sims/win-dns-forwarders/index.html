<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { PC: '1', DC: '2', partner: '6', fwd: '3', root: '4', tld: '5', auth: '7' };
  var MARK = { PC: 'P', DC: 'D', partner: 'p', fwd: 'F', root: '.', tld: 'o', auth: 'e' };
  var LANE_KEYS = { PC: 'PC', DC: 'DC', partner: 'Partner', fwd: 'Fwd', root: 'Root', tld: 'Tld', auth: 'Auth' };
  var BADGE = { cache: 'badgeCache', zone: 'badgeZone', cond: 'badgeCond', fwd: 'badgeFwd', hints: 'badgeHints', fail: 'badgeFail' };

  /** Data (names, addresses, flags, rcodes, times) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sec(v) { return t('sec', { v: v }); }
  function secData(v) { return data(sec(v)); }
  function q(name) { return h('b', { translate: 'no' }, name); }
  /** The address behind a lane, or the server a message names. */
  function addr(lane) { return L.HOSTS[lane] ? L.HOSTS[lane].ip : lane; }

  /** The rule that sent the current lookup where it went (the badge on DC1's card), once DC1 has decided. */
  function ruleNow(s) { return s.route && s.msgs.length ? s.route.kind : null; }

  // ── lanes ──
  function lanes(c) {
    var s = c.state, cur = s.msgs[s.msgs.length - 1];
    var fresh = c.prev && s.msgs.length > c.prev.msgs.length;
    var rule = ruleNow(s), prevRule = c.prev ? ruleNow(c.prev) : null;
    return L.lanes(c.params).map(function (id) {
      var k = LANE_KEYS[id];
      var active = fresh && cur && (cur.from === id || cur.to === id);
      var down = id === 'fwd' && !c.params.forwarderUp;
      var tags = null;
      if (id === 'DC' && rule) {
        tags = h('span', { class: 'fw-badge' + (rule !== prevRule || (cur && cur.n === c.n && cur.from === 'PC') ? ' sd-changed' : ''), dataset: { k: rule } }, rich(BADGE[rule]));
      }
      if (down) tags = h('span', { class: 'fw-badge', dataset: { k: 'down' } }, t('down'));
      var name = id === 'tld' || id === 'auth' || id === 'PC' || id === 'DC' ? data(t('lane' + k)) : t('lane' + k);
      return { id: id, mark: MARK[id], c: COLOUR[id], shape: id === 'PC' ? 'square' : null, name: name, tags: tags,
        state: down ? 'down' : active ? 'active' : null,
        body: [h('div', { class: 'fw-sub' }, rich('role' + k)), h('div', { class: 'fw-sub' }, data(addr(id)))] };
    });
  }

  // ── chart rows ──
  function chipOf(m) {
    if (m.kind === 'nxdomain') return 'NXDOMAIN';
    if (m.kind === 'servfail') return 'SERVFAIL';
    return h('span', null, t({ query: 'kQuery', referral: 'kReferral', answer: 'kAnswer' }[m.kind]));
  }
  function fieldsOf(m) {
    if (m.kind === 'query') return m.rd ? 'rd' : null;
    if (m.kind === 'referral') return 'NS ' + m.zone;
    if (m.kind === 'servfail') return m.ra ? 'ra' : null;
    var bits = [];
    if (m.aa) bits.push(h('span', { class: 'fw-aa' }, 'aa'), ' ');
    if (m.ra) bits.push('ra ');
    if (m.ttl != null) bits.push(sec(m.ttl));
    return h('span', { translate: 'no' }, bits);
  }
  function rows(c) {
    var s = c.state, out = [], bold = [], timers = [], openLost = null;
    var down = c.params.forwarderUp ? null : ['fwd'];
    s.msgs.forEach(function (m) {
      if (m.lookup === 2 && m.from === 'PC') {
        out.push({ kind: 'note', lane: 'PC', text: t('noteLater', { adv: sec(L.ADVANCE) }), k: 'solid', time: sec(m.t), changed: m.n === c.n, down: down });
      }
      if (openLost) { timers.push({ lane: 'DC', from: openLost.row, to: out.length, label: t('timer', { s: sec(openLost.wait) }), end: 'expired' }); openLost = null; }
      if (m.to === 'PC' && m.kind !== 'query') bold.push(out.length);
      var row = { from: m.from, to: m.to, label: chipOf(m), c: COLOUR[m.from], fields: fieldsOf(m), line: m.kind === 'referral' ? 'dotted' : null,
        time: sec(m.t), changed: m.n === c.n, down: down };
      if (m.lost) { row.lost = [m.to]; openLost = { row: out.length, wait: m.wait }; }
      out.push(row);
    });
    if (openLost) timers.push({ lane: 'DC', from: openLost.row, label: t('timer', { s: sec(openLost.wait) }) });
    return { rows: out, bold: bold, timers: timers };
  }
  function renderChart(c) {
    var r = rows(c);
    var chart = Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(c),
      rows: r.rows,
      timers: r.timers,
      timeWidth: '3.6rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
    var rowEls = chart.querySelectorAll('.sd-seq-row');
    r.bold.forEach(function (i) { var a = rowEls[i] && rowEls[i].querySelector('.sd-seq-arrow'); if (a) a.dataset.weight = 'bold'; });
    return chart;
  }

  // ── DC1's decision table (K4) ──
  function renderTable(c) {
    var s = c.state, tb = s.table, fi = 0;
    var rowsSpec = tb.rows.map(function (r) {
      // # = the check and, under it, what it applies to; one column = where it sends the query (the table must fit
      // beside a six-lane chart, so the K4 action column stays empty)
      var no, scope, to, tags = [], note = null;
      switch (r.kind) {
        case 'cache': no = t('rCache'); scope = h('span', null, t('mCacheName')); to = h('span', null, t('aCache')); break;
        case 'zone': no = t('rZone'); scope = data(r.domain); to = h('span', null, t('aZone')); break;
        case 'cond': no = t('rCond'); scope = data(r.domain); to = data(r.targets.join(', ')); break;
        case 'fwd': fi++; no = t('rFwd', { i: fi }); scope = h('span', null, t('mAny')); to = data(r.ip); break;
        default: no = rich('rHints'); scope = h('span', null, t('mAfterFwd')); to = h('span', null, t('aHints')); break;
      }
      tags.push(h('span', { class: 'sd-rt-tag fw-scope' }, scope));
      if (r.note === 'off') tags.push({ k: 'muted', text: t('tagOff') });
      if (r.note === 'norec') tags.push({ k: 'muted', text: t('tagNorec') });
      if (r.note === 'shorter') note = [{ k: 'dashed', text: t('noteShorter') }];
      if (r.note === 'same') note = [{ k: 'dashed', text: t('noteSame') }];
      if (r.note === 'timeout') note = [{ k: 'dashed', text: t('noteTimeout', { s: sec(r.kind === 'cond' ? L.COND_TIMEOUT : L.FWD_TIMEOUT) }) }];
      var row = { no: h('span', null, no), cells: { to: to }, action: '', hit: r.hit, tags: tags, note: note };
      if (r.mark) row.mark = r.mark;
      return row;
    });
    var res = tb.result;
    return Simdeck.ruleTable({
      dir: c.dir,
      mode: 'first',
      title: t('tableTitle'),
      noLabel: t('colMatch'),
      columns: [{ key: 'to', label: t('colAction'), wrap: true }],
      actionLabel: '',
      markLabel: t('colMark'),
      rows: rowsSpec,
      implicit: { text: h('span', null, t('implicit'), ' → ', data('SERVFAIL')), action: '', effect: 'deny' },
      at: tb.at,
      subject: { mark: String(s.lookup), c: 1 },
      done: tb.at >= 0,
      outcome: function () {
        if (!res) return h('span', { class: 'fw-wait' }, t('waiting'));
        var v = Simdeck.ruleTable.verdict(res.kind === 'answer', res.kind === 'answer' ? res.ip : res.kind.toUpperCase());
        v.setAttribute('translate', 'no');
        return v;
      },
      words: { skip: t('wSkip'), beaten: t('wBeaten') },
      stickyMark: true,
      changed: c.n > 0 && s.msgs.length > 0 && (s.msgs[s.msgs.length - 1].from === 'PC' || (c.prev && c.prev.table.at !== tb.at))
    });
  }

  // ── cache ──
  function renderCache(c) {
    var s = c.state, touched = {};
    if (c.n > 0) s.touched.forEach(function (x) { if (!touched[x.key]) touched[x.key] = x.how; });
    var box = h('section', { class: 'fw-box fw-cache' },
      h('h2', null, t('cacheTitle'), h('span', { class: 'fw-muted' }, t.parts('cacheAt', { t: secData(s.t) }))));
    var list = h('ul', { class: 'fw-rows' });
    // the root hints: one row for the NS set and its addresses
    list.append(h('li', { class: 'fw-row', dataset: { hint: '' } },
      h('span', { class: 'fw-row-name' }, data('.'), data('NS', 'fw-type')), h('span', { class: 'fw-row-ttl' }),
      h('span', { class: 'fw-row-data' }, rich('cacheHint'))));
    s.cache.forEach(function (e) {
      if (e.hint || (e.type === 'A' && e.glue)) return;
      var key = L.keyOf(e.name, e.type), how = touched[key], leftNow = L.left(e, s.t);
      if (!L.valid(e, s.t)) return;
      var ds = {};
      if (e.negative) ds.neg = '';
      if (how) ds.how = how;
      var name = h('span', { class: 'fw-row-name' }, e.negative ? h('span', { class: 'fw-neg', 'aria-hidden': 'true' }, '⊘') : null,
        data(e.name), e.negative ? null : data(e.type, 'fw-type'));
      var body = e.negative ? h('span', { class: 'fw-row-data' }, h('span', { class: 'fw-sans' }, t('cacheNx')))
        : h('span', { class: 'fw-row-data' }, data(e.data.join(', ')), e.type === 'NS' ? [' ', h('span', { class: 'fw-sans' }, t('cacheGlue'))] : null);
      list.append(h('li', { class: 'fw-row' + (how ? ' sd-changed' + (how === 'added' && c.dir === 'forward' ? ' sd-anim-in' : '') : ''), dataset: ds },
        name, h('span', { class: 'fw-row-ttl' }, data(sec(leftNow) + ' / ' + sec(e.ttl))), body,
        h('div', { class: 'fw-bar' }, h('span', { style: { width: (Math.round(leftNow / e.ttl * 1000) / 10) + '%' } }))));
    });
    box.append(list);
    return box;
  }

  // ── captions ──
  /** The decision DC1 made when the query arrived (one sentence after the client's query). */
  function decision(s, p) {
    var m = s.msgs[s.msgs.length - 1], rule = s.route.kind;
    if (rule === 'cache') {
      var hit = L.cachedAnswer(s.cache, m.q.name, 'A', s.t);
      return t.parts('decCache', { left: secData(L.left(hit.entry, s.t)) });
    }
    if (rule === 'zone') return t('decZone');
    if (rule === 'cond') return t('decCond');
    if (rule === 'fwd') return L.inDomain(m.q.name, 'partner.example') && !p.condFwd ? t('decFwdCondOff') : t('decFwd');
    if (rule === 'hints') return t('decHints');
    return s.dc.recursion ? t('decFail') : t('decNorec');
  }
  function caption(c) {
    var s = c.state, p = c.params, n = c.n;
    if (c.first) return t.parts('capStart', { name: q(L.NAMES[p.name]) });
    var m = s.msgs[s.msgs.length - 1], parts;
    if (m.from === 'PC') {
      parts = m.lookup === 1 ? t.parts('capQuery', { n: n, name: q(m.q.name) }) : t.parts('capQueryAgain', { n: n, adv: sec(L.ADVANCE), name: q(m.q.name) });
      parts.push(' ', decision(s, p));
      return parts;
    }
    if (m.from === 'DC' && m.to !== 'PC') {
      var prevMsg = s.msgs[s.msgs.length - 2];
      if (m.rule === 'cond') parts = rich('capCondSend', { n: n, name: q(m.q.name), ip: q(m.server) });
      else if (m.rule === 'fwd') parts = t.parts('capFwdSend', { n: n, ip: q(m.server) });
      else if (prevMsg && prevMsg.lost) parts = rich('capHintsStart', { n: n, s: secData(prevMsg.wait) });
      else parts = t.parts('capAsk', { n: n, server: q(m.server) });
      if (m.lost) parts.push(' ', t.parts('capLost', { s: secData(m.wait) }));
      return parts;
    }
    if (m.to === 'DC') {
      if (m.kind === 'referral') return t.parts('capReferral', { n: n, server: q(m.server), zone: q(m.zone), ttl: secData(m.ttl) });
      var cached = L.find(s.cache, m.kind === 'answer' ? m.rr.name : m.q.name, m.kind === 'answer' ? 'A' : 'NXDOMAIN');
      if (m.rule === 'cond') {
        return m.kind === 'answer' ? t.parts('capCondAnswer', { n: n, ip: q(m.rr.data[0]), ttl: secData(cached.ttl) })
          : t.parts('capCondNx', { n: n, ttl: secData(cached.ttl) });
      }
      if (m.rule === 'fwd') {
        if (m.kind === 'answer') return t.parts('capFwdAnswer', { n: n, ip: q(m.rr.data[0]), ttl: secData(cached.ttl) });
        parts = t.parts('capFwdNx', { n: n });
        if (L.inDomain(m.q.name, 'partner.example')) parts.push(' ', t('capFwdNxWhy'));
        parts.push(' ', t.parts('capNegCached', { ttl: secData(cached.ttl), soa: data(Math.min(m.soa.ttl, m.soa.minimum) + ' s') }));
        return parts;
      }
      if (m.kind === 'answer') return t.parts('capAuthAnswer', { n: n, server: q(m.server), ip: q(m.rr.data[0]), ttl: secData(m.ttl) });
      return t.parts('capRootNx', { n: n, ttl: secData(cached.ttl) });
    }
    // DC1's reply to PC-07
    var o = s.outcome[s.outcome.length - 1];
    if (m.kind === 'servfail') {
      var lostMsg = s.msgs.filter(function (x) { return x.lookup === m.lookup && x.lost; })[0];
      if (!s.dc.recursion) parts = t.parts('capReplyNorec', { n: n });
      else if (lostMsg && lostMsg.rule === 'cond') parts = t.parts('capReplyCondDown', { n: n, s: secData(o.end - o.start) });
      else if (lostMsg) parts = rich('capReplyNoHints', { n: n, s: secData(o.end - o.start) });
      else parts = t.parts('capReplyFail', { n: n });
    } else if (m.source === 'zone') parts = t.parts('capReplyZone', { n: n, ip: q(m.rr.data[0]) });
    else if (m.fromCache) parts = m.kind === 'nxdomain' ? t.parts('capReplyCacheNx', { n: n, left: secData(m.ttl) }) : t.parts('capReplyCache', { n: n, ip: q(m.rr.data[0]), left: secData(m.ttl) });
    else {
      parts = m.kind === 'nxdomain' ? t.parts('capReplyNx', { n: n }) : t.parts('capReply', { n: n, ip: q(m.rr.data[0]) });
      if (o.end > o.start) parts.push(' ', t.parts('capSlower', { s: secData(o.end - o.start) }));
    }
    if (o.lookup === 2) parts.push(' ', t.n('capCompare', s.outcome[0].msgs, { b: o.msgs }));
    return parts;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'name', type: 'choice', label: t('pName'), resets: true, options: [['fs1', L.NAMES.fs1], ['crm', L.NAMES.crm], ['www', L.NAMES.www]] },
      { key: 'condFwd', type: 'toggle', label: t('pCond'), resets: true },
      { key: 'forwarderUp', type: 'toggle', label: t('pFwdUp'), resets: true },
      { key: 'rootHints', type: 'toggle', label: t('pHints'), resets: true },
      { key: 'recursion', type: 'toggle', label: t('pRec'), resets: true },
      { key: 'repeat', type: 'toggle', label: t('pRepeat'), resets: true }
    ],

    presets: [
      { id: 'internal', label: t('prInternal'), hint: t('prInternalHint'), params: { name: 'fs1' } },
      { id: 'partner', label: t('prPartner'), hint: t('prPartnerHint'), params: { name: 'crm' } },
      { id: 'internet', label: t('prInternet'), hint: t('prInternetHint'), params: { name: 'www', repeat: true } },
      { id: 'forwarder-down', label: t('prFwdDown'), hint: t('prFwdDownHint'), params: { name: 'www', forwarderUp: false } },
      { id: 'no-cond-fwd', label: t('prNoCond'), hint: t('prNoCondHint'), params: { name: 'crm', condFwd: false } },
      { id: 'no-fallback', label: t('prNoFallback'), hint: t('prNoFallbackHint'), params: { name: 'www', forwarderUp: false, rootHints: false } },
      { id: 'no-recursion', label: t('prNoRec'), hint: t('prNoRecHint'), params: { name: 'crm', recursion: false } }
    ],

    legend: [
      { shape: 'line', label: t('legendQuery') },
      { shape: 'dot', label: t('legendReferral') },
      { shape: 'bold', label: t('legendAnswer') },
      { shape: 'tmo', label: t('legendTimeout') },
      { shape: 'rt-win', label: t('legendWin') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'fw' }, chart, renderTable(c), renderCache(c)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
