<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CephSim — checks</title>
<style>
  body { font: 13px/1.5 system-ui, sans-serif; background: #10151f; color: #e6edf7;
         margin: 0; padding: 20px 24px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
       color: #7d8ba1; margin: 18px 0 6px; }
  #summary { font-size: 15px; font-weight: 700; margin: 10px 0 16px; padding: 8px 12px;
             border-radius: 6px; display: inline-block; }
  .ok { background: #14532d; color: #bbf7d0; }
  .bad { background: #7f1d1d; color: #fecaca; }
  ol { padding-left: 22px; margin: 0; }
  li { padding: 2px 0; }
  li.pass::marker { color: #4ade80; }
  li.fail { color: #fca5a5; }
  li.fail::marker { color: #f87171; }
  code { background: #1c2739; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<h1>CephSim — checks</h1>
<p style="color:#7d8ba1;margin:2px 0 0">Properties of a randomised algorithm, not fixtures.
Statistical checks use fixed placement values, so a pass is reproducible.<br>
  Same checks run from a terminal with <code>node tests/run.mjs</code>, which adds a source-wiring group this page cannot run (it reads files).</p>
<div id="summary">running…</div>
<div id="results"></div>

<script type="module">
import { results as engine } from './engine-checks.js';
import { results as model } from './model-checks.js';
import { results as view } from './view-checks.js';
import { results as text } from './crushtext-checks.js';
import { results as net } from './net-checks.js';
import { results as recovery } from './recovery-checks.js';
import { results as clients } from './client-checks.js';

// tests/wiring-checks.mjs is deliberately absent: it reads source files off
// disk, so it only runs under `node tests/run.mjs`.
const groups = [
  ['Engine', engine],
  ['Model + compiler', model],
  ['Geometry, samples + markup', view],
  ['crushtool text format', text],
  ['network + health', net],
  ['recovery', recovery],
  ['clients + console', clients],
];

const all = groups.flatMap(([, r]) => r);
const failed = all.filter((r) => !r.pass);
document.querySelector('#results').innerHTML = groups.map(([title, results]) => `
  <h2>${title}</h2>
  <ol>${results.map((r) =>
    `<li class="${r.pass ? 'pass' : 'fail'}">${r.name}${r.detail ? ` &mdash; <code>${r.detail}</code>` : ''}</li>`
  ).join('')}</ol>`).join('');
const summary = document.querySelector('#summary');
summary.className = failed.length ? 'bad' : 'ok';
summary.textContent = failed.length
  ? `${failed.length} of ${all.length} checks FAILED`
  : `all ${all.length} checks passed`;
document.title = failed.length ? `FAIL (${failed.length})` : 'PASS';
</script>
</body>
</html>
