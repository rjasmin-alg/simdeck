     The model is in sim.js (rules in SPEC.md), the words in strings.js. No kit view fits (a time bar), so the page
     draws in HTML and CSS. -->

<style>
/* Page CSS: every selector starts with [data-sim="delay-components"]; colours only from kit tokens. */
[data-sim="delay-components"] .sd-legend { flex: 0 1 48rem; justify-content: flex-end; }
/* Five presets and the settings in two columns, so the panel fits at 1920×1080 without its own scroll. */
[data-sim="delay-components"] .sd-presets { grid-template-columns: 1fr 1fr; }
[data-sim="delay-components"] .sd-preset { line-height: 1.15; }
[data-sim="delay-components"] .sd-panel { gap: 0.5rem; }
[data-sim="delay-components"] [data-sd-controls] .sd-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.25rem 0.9rem; align-items: end; }
[data-sim="delay-components"] [data-sd-controls] .sd-group > * { grid-column: auto; }
[data-sim="delay-components"] [data-sd-controls] .sd-group > .sd-group-title,
[data-sim="delay-components"] [data-sd-controls] .sd-group > .sd-ctl-choice,
[data-sim="delay-components"] [data-sd-controls] .sd-group > .sd-ctl-range { grid-column: 1 / -1; }
/* The settings' reset button repeats the transport bar's (an explorer's only transport button, same R key). */
[data-sim="delay-components"] [data-sd-controls] .sd-group > .sd-btn { display: none; }

[data-sim="delay-components"] .dc {
  display: grid;
  grid-template-rows: auto auto auto;
  align-content: space-evenly;
  gap: 1.2cqh;
  height: 100%;
  padding: 1cqh 1.6cqw;
}

/* ── the one-hop scene ── */
[data-sim="delay-components"] .dc-scene {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr) auto;
  align-items: center;
}
[data-sim="delay-components"] .dc-node {
  display: grid;
  justify-items: center;
  gap: 0.3rem;
  min-width: 9rem;
  padding: 0.5rem 0.8rem;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--radius-sm, 0.4rem);
  background: var(--panel);
  text-align: center;
}
[data-sim="delay-components"] .dc-node b { font-size: var(--fs-md); }
[data-sim="delay-components"] .dc-sub { font-size: var(--fs-sm); color: var(--muted); }
[data-sim="delay-components"] .dc-pc { width: 2.6rem; height: 1.8rem; border: 3px solid var(--ink); border-radius: 0.2rem; background: var(--bg); position: relative; margin-bottom: 0.35rem; }
[data-sim="delay-components"] .dc-pc::after { content: ''; position: absolute; left: 30%; right: 30%; bottom: -0.45rem; height: 0.3rem; background: var(--ink); }
[data-sim="delay-components"] .dc-rt { width: 2.6rem; height: 2.6rem; border: 3px solid var(--ink); border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: var(--fs-lg); }
[data-sim="delay-components"] .dc-router { gap: 0.4rem; min-width: 13rem; }
[data-sim="delay-components"] .dc-rrow { display: flex; align-items: center; gap: 0.5rem; }
[data-sim="delay-components"] .dc-queue { display: flex; align-items: center; gap: 0.2rem; min-height: 1.4rem; }
[data-sim="delay-components"] .dc-qpkt { width: 0.75rem; height: 1.2rem; border: var(--line-w) solid var(--c4); background: var(--bg); }
[data-sim="delay-components"] .dc-qmore { font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700; }

[data-sim="delay-components"] .dc-link { display: grid; grid-template-rows: auto 0.4rem auto; gap: 0.35rem; padding: 0 0.3rem; min-width: 0; }
[data-sim="delay-components"] .dc-wire { background: var(--ink); border-radius: 0.2rem; }
[data-sim="delay-components"] .dc-wire[data-m='copper'] { background: repeating-linear-gradient(90deg, var(--ink) 0 1.2rem, var(--bg) 1.2rem 1.5rem); }
[data-sim="delay-components"] .dc-wire[data-m='radio'] { background: repeating-linear-gradient(90deg, var(--ink) 0 0.4rem, transparent 0.4rem 0.8rem); }
[data-sim="delay-components"] .dc-ltop { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; }
[data-sim="delay-components"] .dc-ltop > span { font-weight: 700; }
[data-sim="delay-components"] .dc-lbot { text-align: center; font-size: var(--fs-sm); overflow-wrap: anywhere; }
[data-sim="delay-components"] .dc-lbot b { font-family: var(--mono); }

/* numbered badges, one per segment, styled by kind (also in the bar and the cells) */
[data-sim="delay-components"] .dc-badge {
  display: inline-grid; place-items: center; flex: none;
  width: 1.7rem; height: 1.7rem; border-radius: 50%;
  border: var(--line-w) solid var(--ink); background: var(--bg); color: var(--ink);
  font-weight: 700; font-size: var(--fs-sm); line-height: 1;
}
[data-sim="delay-components"] .dc-badge[data-k='trans'] { background: var(--c1); color: var(--on-series); }
[data-sim="delay-components"] .dc-badge[data-k='prop'] { border-color: var(--c2); border-width: 3px; }
[data-sim="delay-components"] .dc-badge[data-k='proc'] { border-color: var(--c3); border-width: 3px; border-style: dotted; }
[data-sim="delay-components"] .dc-badge[data-k='queue'] { border-color: var(--c4); border-width: 3px; border-style: dashed; }

/* ── the time bars ── */
[data-sim="delay-components"] .dc-time { display: grid; grid-template-columns: 5rem minmax(0, 1fr) 7.5rem; column-gap: 0.8rem; row-gap: 0.4rem; align-items: center; }
[data-sim="delay-components"] .dc-head { font-size: var(--fs-sm); color: var(--muted); }
[data-sim="delay-components"] .dc-head-total { text-align: right; }
[data-sim="delay-components"] .dc-rowlbl { font-size: var(--fs-sm); font-weight: 700; text-align: right; }
[data-sim="delay-components"] .dc-total { font-family: var(--mono); font-size: var(--fs-md); font-weight: 700; text-align: right; white-space: nowrap; }
[data-sim="delay-components"] .dc-total-big { font-size: var(--fs-lg); }
[data-sim="delay-components"] .dc-ghost-row { opacity: 0.55; }
[data-sim="delay-components"] .dc-track { position: relative; min-width: 0; }
[data-sim="delay-components"] .dc-bar { display: flex; height: 3.2rem; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }
[data-sim="delay-components"] .dc-ghost-row .dc-bar { height: 2.2rem; }
[data-sim="delay-components"] .dc-seg { position: relative; display: grid; place-items: center; min-width: 0; border: var(--line-w) solid var(--ink); margin-left: calc(-1 * var(--line-w)); }
[data-sim="delay-components"] .dc-seg:last-child { flex-grow: 1; }
[data-sim="delay-components"] .dc-seg { grid-auto-flow: column; justify-content: center; align-items: center; gap: 0.35rem; }
[data-sim="delay-components"] .dc-segval { padding: 0 0.35rem; border: var(--line-w) solid var(--ink); border-radius: 0.3rem; background: var(--bg); color: var(--ink); font-family: var(--mono); font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; }
[data-sim="delay-components"] .dc-seg[data-k='trans'] { background: var(--c1); }
[data-sim="delay-components"] .dc-seg[data-k='prop'] { background: repeating-linear-gradient(45deg, var(--c2) 0 0.22rem, var(--bg) 0.22rem 0.55rem); }
[data-sim="delay-components"] .dc-seg[data-k='proc'] { background: radial-gradient(circle, var(--c3) 0 0.16rem, transparent 0.18rem) 0 0 / 0.55rem 0.55rem, var(--bg); }
[data-sim="delay-components"] .dc-seg[data-k='queue'] { background: var(--bg); border: 3px dashed var(--c4); }
[data-sim="delay-components"] .dc-seg .dc-badge { width: 1.5rem; height: 1.5rem; background: var(--bg); color: var(--ink); border-color: var(--ink); border-style: solid; border-width: var(--line-w); }
[data-sim="delay-components"] .dc-ghost-row .dc-seg .dc-badge { display: none; }
[data-sim="delay-components"] .dc-seg.dc-ch::after { content: ''; position: absolute; left: 0; right: 0; bottom: -0.75rem; height: 0.5rem; background: var(--hl); border: var(--line-w) solid var(--ink); }
[data-sim="delay-components"] .dc-axis { position: relative; height: 1.6rem; margin-top: 0.5rem; font-size: var(--fs-sm); }
[data-sim="delay-components"] .dc-axis span { position: absolute; top: 0; white-space: nowrap; }
[data-sim="delay-components"] .dc-scale { grid-column: 2 / 4; font-size: var(--fs-sm); color: var(--muted); font-style: italic; }

/* ── the six cells ── */
[data-sim="delay-components"] .dc-cells { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.6rem; }
[data-sim="delay-components"] .dc-cell { display: grid; align-content: start; gap: 0.2rem; padding: 0.45rem 0.6rem; border: var(--line-w) solid var(--line); border-radius: var(--radius-sm, 0.4rem); background: var(--bg); min-width: 0; }
[data-sim="delay-components"] .dc-cell-h { display: flex; align-items: center; gap: 0.4rem; font-size: var(--fs-md); font-weight: 700; line-height: 1.2; }
[data-sim="delay-components"] .dc-cell-h > span:last-child { min-width: 0; overflow-wrap: anywhere; }
[data-sim="delay-components"] .dc-val { font-family: var(--mono); font-size: var(--fs-lg); font-weight: 700; white-space: nowrap; }
[data-sim="delay-components"] .dc-f { font-size: var(--fs-sm); color: var(--muted); overflow-wrap: anywhere; }
[data-sim="delay-components"] .dc-was { font-size: var(--fs-sm); }

/* Legend swatches: the same patterns as the bar, so they read in grayscale too. */
[data-sim="delay-components"] .sd-swatch[data-shape='dc-trans'] { background: var(--c1); }
[data-sim="delay-components"] .sd-swatch[data-shape='dc-prop'] { background: repeating-linear-gradient(45deg, var(--c2) 0 0.15em, var(--bg) 0.15em 0.36em); }
[data-sim="delay-components"] .sd-swatch[data-shape='dc-proc'] { background: radial-gradient(circle, var(--c3) 0 0.1em, transparent 0.12em) 0 0 / 0.36em 0.36em, var(--bg); }
[data-sim="delay-components"] .sd-swatch[data-shape='dc-queue'] { background: var(--bg); border: 0.15em dashed var(--c4); }

/* Phone and portrait: the stage grows with its content; the scene stacks. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="delay-components"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="delay-components"] .dc { height: auto; padding: 0.4rem; gap: 1rem; }
  [data-sim="delay-components"] .dc-scene { grid-template-columns: minmax(0, 1fr); gap: 0.4rem; }
  [data-sim="delay-components"] .dc-node { min-width: 0; }
  [data-sim="delay-components"] .dc-time { grid-template-columns: 3rem minmax(0, 1fr) 6.6rem; column-gap: 0.4rem; }
  [data-sim="delay-components"] .dc-total, [data-sim="delay-components"] .dc-total-big { font-size: var(--fs-sm); }
  [data-sim="delay-components"] .dc-axis { height: 3.1rem; }
  [data-sim="delay-components"] .dc-axis .dc-recv { top: 1.5rem; }
  [data-sim="delay-components"] .dc-cells { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-sim="delay-components"] [data-sd-controls] .sd-group { grid-template-columns: minmax(0, 1fr); }
  [data-sim="delay-components"] [data-sd-controls] .sd-group > * { grid-column: 1 / -1 !important; }
  [data-sim="delay-components"] .sd-presets { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Četiri vrste kašnjenja</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var DEC = t('dec');
  var NAME = { trans: 'segTrans', prop: 'segProp', proc: 'segProc', queue: 'segQueue' };

  // ── numbers in the page's language ──
  /** '35786.5' → '35 786,5' (a no-break space between thousands from five digits up, the language's decimal mark). */
  function num(str) {
    var p = String(str).split('.');
    if (p[0].replace('-', '').length > 4) p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return p.length > 1 ? p[0] + DEC + p[1] : p[0];
  }
  function msv(sec) { return num(L.msText(sec)); }
  function rateText(mb) { return mb >= 1000 ? t('gbps', { v: num(mb / 1000) }) : t('mbps', { v: num(mb) }); }
  function distText(km) { return km < 1 ? t('metres', { v: num(Math.round(km * 1000)) }) : t('km', { v: num(km) }); }
  function speedText(s) { return num(Number((s / 1000).toPrecision(3))); }
  function aheadText(x) { return num(x >= 10 ? Math.round(x) : Number(x.toFixed(1))); }

  // ── the ghost bar: the preset's "before", or the settings before the current run of changes (L.nextGhost) ──
  var lastParams = null, ghost = { before: null, run: null }, before = null;
  function same(a, b) { return Object.keys(L.defaults).every(function (k) { return a[k] === b[k]; }); }
  function track(c) {
    var pr = c.preset && L.presets.filter(function (x) { return x.id === c.preset; })[0];
    if (pr && same(c.params, L.withDefaults(pr.params))) ghost = { before: L.withDefaults(pr.before), run: null };
    else ghost = L.nextGhost(ghost, lastParams, c.params);
    before = ghost.before;
    lastParams = Object.assign({}, c.params);
  }

  function badge(seg, changed) {
    return h('span', { class: 'dc-badge' + (changed ? ' sd-changed' : ''), dataset: { k: seg.kind } }, String(seg.n));
  }

  // ── the scene: source, link 1, router, link 2, destination ──
  function scene(st, p, ch) {
    var S = st.segments;
    var isCh = function (n) { return ch.indexOf(n) >= 0; };
    function link(n, sTrans, sProp) {
      return h('div', { class: 'dc-link' },
        h('div', { class: 'dc-ltop' }, badge(sTrans, isCh(sTrans.n)), h('span', null, t('link', { n: n })), badge(sProp, isCh(sProp.n))),
        h('div', { class: 'dc-wire', dataset: { m: p.medium } }),
        h('div', { class: 'dc-lbot' }, h('b', null, distText(st.km)), ' · ', t(p.medium), ' · ', h('b', null, rateText(p.rate))));
    }
    var shown = Math.min(10, Math.round(st.ahead));
    var queue = [];
    for (var i = 0; i < shown; i++) queue.push(h('span', { class: 'dc-qpkt' }));
    if (Math.round(st.ahead) > shown) queue.push(h('span', { class: 'dc-qmore' }, t('aheadMore', { n: Math.round(st.ahead) - shown })));
    return h('div', { class: 'dc-scene' },
      h('div', { class: 'dc-node' }, h('span', { class: 'dc-pc', 'aria-hidden': 'true' }), h('b', null, t('src'))),
      link(1, S[0], S[1]),
      h('div', { class: 'dc-node dc-router' },
        h('div', { class: 'dc-rrow' }, h('span', { class: 'dc-rt', 'aria-hidden': 'true' }, '⇄'),
          h('b', null, t('router')), p.medium === 'radio' && st.km === 35786 ? h('span', { class: 'dc-sub' }, '(' + t('satellite') + ')') : null),
        h('div', { class: 'dc-rrow' }, badge(S[2], isCh(3)), badge(S[3], isCh(4)), h('span', { class: 'dc-queue' }, queue)),
        h('span', { class: 'dc-sub' }, t('ahead', { n: aheadText(st.ahead) }))),
      link(2, S[4], S[5]),
      h('div', { class: 'dc-node' }, h('span', { class: 'dc-pc', 'aria-hidden': 'true' }), h('b', null, t('dst'))));
  }

  // ── the time bars ──
  var MIN_REM = 2.1;     // room for a segment's number
  function bar(st, share, minShare, ch, barPx, rem) {
    var widths = L.barLayout(st.segments.map(function (x) { return x.t; }), minShare);
    var VAL_REM = 7.5;     // room for the number and the value; narrower segments keep the number only
    return h('div', { class: 'dc-bar', style: { width: (100 * share) + '%' } }, st.segments.map(function (x, i) {
      return h('div', { class: 'dc-seg' + (ch && ch.indexOf(x.n) >= 0 ? ' dc-ch' : ''), dataset: { k: x.kind },
        style: { flex: '0 0 ' + (100 * widths[i]) + '%' }, title: t(NAME[x.kind]) + ': ' + t('ms', { v: msv(x.t) }) },
        h('span', { class: 'dc-badge' }, String(x.n)),
        ch && widths[i] * barPx >= VAL_REM * rem ? h('span', { class: 'dc-segval' }, t('ms', { v: msv(x.t) })) : null);
    }));
  }
  function timeBars(st, bst, ch, trackPx, rem) {
    var big = Math.max(st.total, bst ? bst.total : 0);
    var minLen = Math.min(1, (6 * MIN_REM + 2) * rem / trackPx);
    function len(x) { return big > 0 ? Math.max(x.total / big, minLen) : 1; }
    function minShareFor(share) { return MIN_REM * rem / (trackPx * share); }
    var nowShare = len(st), out = [];
    var clamped = bst && (st.total / big < minLen || bst.total / big < minLen);
    out.push(h('span', { class: 'dc-head' }), h('span', { class: 'dc-head' }, t('timeline') + ' →'),
      h('span', { class: 'dc-head dc-head-total' }, t('total')));
    if (bst) {
      var bShare = len(bst);
      out.push(h('span', { class: 'dc-rowlbl dc-ghost-row' }, t('before')),
        h('div', { class: 'dc-track dc-ghost-row' }, bar(bst, bShare, minShareFor(bShare), null, 0, rem)),
        h('span', { class: 'dc-total dc-ghost-row' }, t('ms', { v: msv(bst.total) })));
    }
    var right = nowShare > 0.6;
    out.push(h('span', { class: 'dc-rowlbl' }, t('now')),
      h('div', { class: 'dc-track' }, bar(st, nowShare, minShareFor(nowShare), ch, trackPx * nowShare, rem),
        h('div', { class: 'dc-axis' },
          h('span', { style: { left: '0' } }, '▲ ' + t('sent')),
          h('span', { class: 'dc-recv', style: right ? { right: (100 - 100 * nowShare) + '%' } : { left: 'calc(' + (100 * nowShare) + '% + 0.6rem)' } },
            right ? t('received') + ' ▲' : '◀ ' + t('received')))),
      h('span', { class: 'dc-total dc-total-big' }, t('ms', { v: msv(st.total) })));
    if (clamped) out.push(h('span'), h('span', { class: 'dc-scale' }, t('notToScale')));
    return out;
  }

  // ── the six cells ──
  function cells(st, bst, p, ch) {
    return h('div', { class: 'dc-cells' }, st.segments.map(function (x, i) {
      var f;
      if (x.kind === 'trans') f = t('fTrans', { bits: num(st.L), rate: rateText(p.rate) });
      else if (x.kind === 'prop') f = t('fProp', { d: distText(st.km), s: speedText(st.s) });
      else if (x.kind === 'proc') f = t('fProc');
      else f = st.atCap ? t('fQueueCap') : t('fQueue', { n: aheadText(st.ahead), t: msv(st.trans), u: p.load });
      var changed = ch.indexOf(x.n) >= 0;
      return h('div', { class: 'dc-cell' + (changed ? ' sd-changed' : '') },
        h('div', { class: 'dc-cell-h' }, badge(x, false), h('span', null, t(NAME[x.kind]))),
        h('div', { class: 'dc-val' }, t('ms', { v: msv(x.t) }) + (x.kind === 'queue' && st.atCap ? ' → ∞' : '')),
        h('div', { class: 'dc-f' }, f),
        changed ? h('div', { class: 'dc-was' }, t('was', { v: msv(bst.segments[i].t) })) : null);
    }));
  }

  // ── captions ──
  function term(key) { var s = h('span'); s.innerHTML = t.html(key); return s; }
  function caption(c) {
    var st = c.state, bst = before ? L.delays(before) : null;
    var key = L.captionKey(before, c.params);
    if (key === 'capTotal') {
      return t.parts(key, { total: msv(st.total), tr: term('termTr'), pr: term('termPr'), pc: term('termPc'), qu: term('termQu'),
        a: msv(st.trans), b: msv(st.prop), c: msv(st.proc), d: msv(st.queue) });
    }
    if (/^cap(Faster|Slower|Smaller|Bigger)$/.test(key)) {
      var out = t.parts(key, { tr: term('termTr'), pr: term('termPr'), a: msv(bst.trans), b: msv(st.trans), p: msv(st.prop) });
      if (Math.abs(st.queue - bst.queue) > 1e-12) out = out.concat(' ', t.parts('capQueueToo', { a: msv(bst.queue), b: msv(st.queue) }));
      return out;
    }
    if (/^cap(Path|Medium|Farther|Nearer)$/.test(key)) {
      return t.parts(key, { tr: term('termTr'), pr: term('termPr'), a: msv(bst.prop), b: msv(st.prop), t: msv(st.trans), s: speedText(st.s), ow: msv(2 * st.prop) });
    }
    if (/^capLoad/.test(key)) return t.parts(key, { u: c.params.load, q: msv(st.queue), qu: term('termQu') });
    if (key === 'capProc') return t.parts(key, { pc: term('termPc'), a: msv(bst.proc), b: msv(st.proc) });
    return t.parts('capMany', { a: msv(bst.total), b: msv(st.total) });
  }

  var view = null, lastCtx = null;
  function draw(c) {
    var st = c.state, bst = before ? L.delays(before) : null;
    var ch = L.changed(bst, st);
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var probe = view.time.querySelector('.dc-track');
    var trackPx = probe && probe.clientWidth > 0 ? probe.clientWidth : Math.max(200, c.stage.clientWidth - 16 * rem);
    view.scene.replaceChildren(scene(st, c.params, ch));
    view.time.replaceChildren.apply(view.time, timeBars(st, bst, ch, trackPx, rem));
    view.cells.replaceChildren(cells(st, bst, c.params, ch));
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'size', type: 'select', label: t('size'), options: L.SIZES.map(function (v) { return [v, t('bytes', { v: num(v) })]; }) },
      { key: 'rate', type: 'select', label: t('rate'), options: L.RATES.map(function (v) { return [v, rateText(v)]; }) },
      { key: 'distance', type: 'range', label: t('distance'), min: 0, max: L.DISTANCES.length - 1, step: 1, format: function (i) { return distText(L.DISTANCES[i]); } },
      { key: 'medium', type: 'choice', label: t('medium'), options: L.MEDIA.map(function (m) { return [m, t(m)]; }) },
      { key: 'load', type: 'range', label: t('load'), min: 0, max: L.LOAD_CAP, step: 5, format: function (v) { return t('percent', { v: v }); } },
      { key: 'proc', type: 'range', label: t('proc'), min: 0, max: 1000, step: 10, format: function (v) { return t('ms', { v: msv(v / 1e6) }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'dc-trans', label: t('legTrans') },
      { shape: 'dc-prop', label: t('legProp') },
      { shape: 'dc-proc', label: t('legProc') },
      { shape: 'dc-queue', label: t('legQueue') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      if (!view) {
        view = { scene: h('div'), time: h('div', { class: 'dc-time' }), cells: h('div') };
        c.stage.replaceChildren(h('div', { class: 'dc' }, view.scene, view.time, view.cells));
        var w = 0;
        new ResizeObserver(function () {
          var nw = c.stage.clientWidth;
          if (lastCtx && nw !== w) { w = nw; draw(lastCtx); }
        }).observe(c.stage);
      }
      track(c);
      lastCtx = c;
      draw(c);
    },
    caption: caption
  });
})();
</script>
</body>
</html>
