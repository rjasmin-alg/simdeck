<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PRESET_KEY = { 'book-ciscenje': 'pCiscenje', 'book-ciscenje2': 'pCiscenje2', 'cd-in-subshell': 'pCd',
    'pipe-loses-var': 'pPipe', 'trap-in-subshell': 'pTrapSub' };
  var HL = ['cExitSubTrapMain', 'cPwdBack', 'cCdGroup', 'cEchoLost', 'cEchoStatus', 'cTrapRunExit', 'cTrapRunEnd', 'cTrapRunSub'];

  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function envOf(s, id) { return s.envs.filter(function (e) { return e.id === id; })[0] || null; }
  function srcOf(p, line) { return L.scriptOf(p).lines[line - 1].src; }
  function pcText(p, s) { return s.pc ? srcOf(p, s.pc.line).slice(s.pc.from, s.pc.to) : ''; }

  /** A status badge: 0 filled with a check, non-zero hollow with the number. */
  function badge(st, lit) {
    var a = { class: 'st-st' + (lit ? ' st-hlv' : ''), translate: 'no' };
    if (st !== 0) { a.dataset = { fail: '' }; return h('span', a, String(st)); }
    return h('span', a, h('span', { 'aria-hidden': 'true' }, '✓'), '0');
  }
  function hook(off) { return h('span', { class: 'st-hook', dataset: off ? { off: '' } : {}, 'aria-hidden': 'true' }, h('i')); }
  function door(text, pending, lit) {
    return h('span', { class: 'st-door' + (lit ? ' sd-changed' : ''), dataset: pending ? { pending: '' } : {} }, h('i', { 'aria-hidden': 'true' }), h('span', null, text));
  }

  // ── captions ──

  function caption(c) {
    var p = c.params, s = c.state, ev = s.lastEvent, prev = c.prev;
    if (ev.code === 'start') return t.parts('cStart', { file: code(s.file), cwd: code(L.HOME) });
    var env = envOf(s, ev.env);
    var main = envOf(s, 'main');
    var parent = env && env.parent ? envOf(s, env.parent) : null;
    var cmdText = pcText(p, s);
    var out = [];
    function add(key, vars) {
      if (out.length) out.push(' ');
      var parts = t.parts(key, vars || {});
      out.push(HL.indexOf(key) >= 0 ? h('span', { class: 'sd-hl' }, parts) : h('span', null, parts));
    }
    var newOut = prev ? s.out.slice(prev.out.length) : [];
    var lastOut = newOut.length ? newOut[newOut.length - 1].text : '';
    /** A subshell that ended in the previous step (its box is gone now). */
    var gone = prev ? prev.envs.filter(function (e) { return e.ended && e.kind === 'subshell'; }) : [];
    var isMain = env && env.kind === 'main';

    if (ev.code === 'cmd') {
      if (ev.t === 'assign') {
        var name = cmdText.split('=')[0];
        var val = env.vars[name];
        if (ev.entered.length && isMain) add('cAssignSub', { cmd: code(cmdText.slice(name.length + 1)), val: code(val), name: code(name) });
        else add(isMain ? 'cAssign' : 'cAssignInSub', { name: code(name), val: code(val) });
      } else if (ev.t === 'cd') {
        if (ev.group && isMain) add('cCdGroup', { cmd: code(cmdText) });
        else if (isMain) add('cCdMain', { cmd: code(cmdText) });
        else add('cCdSub', { cmd: code(cmdText), parent: code(parent.cwd) });
      } else if (ev.t === 'pwd') {
        var back = isMain && gone.some(function (e) { return e.cwd !== env.cwd; });
        add(back ? 'cPwdBack' : 'cPwd', { cwd: code(env.cwd) });
      } else if (ev.t === 'echo') {
        add(isMain ? 'cEcho' : 'cEchoSub', { text: code(lastOut) });
        if (isMain && gone.length) {
          var g = gone[gone.length - 1];
          var lost = Object.keys(g.vars).filter(function (k) { return cmdText.indexOf('$' + k) >= 0 && g.vars[k] !== env.vars[k]; })
            .filter(function (k) { return env.vars[k] !== undefined; })[0];
          if (lost) add('cEchoLost', { name: code('$' + lost), val: code(env.vars[lost]) });
          else if (cmdText.indexOf('$?') >= 0) add('cEchoStatus', { st: code(g.ended.status) });
        }
      } else if (ev.t === 'lsd') {
        var dir = env.vars.rad || '';
        add(ev.status === 0 ? 'cLs' : 'cLsMissing', { dir: code(dir), st: code(ev.status) });
      } else if (ev.t === 'trap') {
        if (!env.traps.EXIT && newOut.length) add('cTrapPrint');
        else add(isMain ? 'cTrapSet' : 'cTrapSetSub', { act: code(env.traps.EXIT ? env.traps.EXIT.action : '') });
      } else {
        add('cCmd', { cmd: code(cmdText), st: code(ev.status) });
      }
      if (ev.entered.some(function (id) { var e = envOf(s, id); return e && e.reset && !e.ended; })) add('cEnteredReset');
      ev.ended.forEach(function (id) {
        var e = envOf(s, id);
        if (e && e.kind === 'subshell' && !(ev.t === 'assign' && ev.entered.indexOf(id) >= 0)) add('cSubEnded', { st: code(e.ended.status) });
      });
    } else if (ev.code === 'exit') {
      var exitVars = { cmd: code(cmdText), st: code(ev.status) };
      if (isMain) add(main.traps.EXIT ? 'cExitMainTrap' : 'cExitMain', exitVars);
      else if (env.exiting) add('cExitSubOwn', exitVars);
      else if (parent && parent.traps.EXIT) add('cExitSubTrapMain', exitVars);
      else add('cExitSub', exitVars);
    } else if (ev.code === 'trap') {
      if (isMain) {
        add(ev.how === 'exit' ? 'cTrapRunExit' : 'cTrapRunEnd', { st: code(ev.status), cmd: code(ev.exitCmd || '') });
        Object.keys(s.files).forEach(function (f) { if (!s.files[f] && prev && prev.files[f]) add('cTrapRemoved', { dir: code(f) }); });
      } else {
        add('cTrapRunSub', { st: code(ev.status) });
      }
    } else if (ev.code === 'printf') {
      add('cPrintf');
    } else if (ev.code === 'pass') {
      add('cPass', { val: code(ev.value), n: code(env.vars.n) });
      if (ev.last) add('cPassLast');
    }
    if (ev.final !== undefined) {
      if (ev.code !== 'trap' && !(ev.code === 'exit' && isMain)) add('cFinal', { st: code(ev.final) });
      if (main.cwd !== L.HOME) add('cCaller', { home: code(L.HOME) });
    }
    return out;
  }

  // ── the stage ──

  function render(c) {
    var p = c.params, s = c.state, prev = c.prev;
    var sc = L.scriptOf(p);
    var ch = L.changes(prev, s);
    var lit = c.n > 0; // step 0 marks nothing

    // the listing, the command of this step marked inside its line
    var listing = h('div', { class: 'st-box' },
      h('div', { class: 'st-head' }, h('span', null, t.parts('listing', { file: code(s.file) }))),
      h('div', { class: 'st-lines' }, sc.lines.map(function (ln, i) {
        var no = i + 1;
        var now = s.pc && s.pc.line === no && !(s.lastEvent.code === 'start');
        var src = now ? [ln.src.slice(0, s.pc.from), h('span', { class: 'st-cur' }, ln.src.slice(s.pc.from, s.pc.to)), ln.src.slice(s.pc.to)] : ln.src;
        return h('div', { class: 'st-ln', dataset: Object.assign({}, now ? { now: '' } : {}, ln.cmds.length ? {} : { meta: '' }) },
          h('span', { class: 'st-ptr', 'aria-label': now ? t('lineNow', { no: no }) : null }, now ? '▶' : ''),
          h('span', { class: 'st-no' }, String(no)),
          h('span', { class: 'st-src', translate: 'no' }, src));
      })));

    // the environments: main, with its subshells inside
    function boxLabel(e) {
      if (e.kind === 'main') return t('boxMain');
      if (e.via === 'cmdsub') return t('boxCmdsub');
      if (e.via === 'pipe') return t('boxPipe', { k: e.member });

    }
    function envBox(e) {
      var cg = ch[e.id] || {};
      var par = e.parent ? envOf(s, e.parent) : null;
      var showAll = e.kind === 'main' || p.showCopy || !par;
      var rows = [];
      function row(k, v, hl) { rows.push(h('span', { class: 'st-k' }, k), h('span', { class: 'st-v' + (hl ? ' st-hlv' : '') }, v)); }

      var names = Object.keys(e.vars).sort();
      if (!showAll) names = names.filter(function (k) { return par.vars[k] !== e.vars[k]; });
      if (showAll || names.length) {
        row(t('vars'), names.length ? h('span', { class: 'st-vars' }, names.map(function (k) {
          return h('span', { class: 'st-var' + (lit && cg.vars && cg.vars.indexOf(k) >= 0 ? ' st-hlv' : ''), translate: 'no' }, k + '=' + e.vars[k]);
        })) : h('span', { class: 'st-none' }, t('varsNone')), false);
      }
      var tr = e.traps.EXIT;
      if (showAll || tr || e.reset) {
        row(t('trapExit'), h('span', { class: 'st-trap' }, tr ? hook(false) : e.reset ? hook(true) : null,
          tr ? code(tr.action) : h('span', { class: 'st-none' }, t(e.reset ? 'trapReset' : 'trapNone'))), lit && cg.trap);
      }
      if (showAll || e.status !== par.status) row(h('code', { translate: 'no' }, '$?'), badge(e.status, lit && cg.status), false);
      var head = [h('span', { class: 'st-ename' }, h('span', null, boxLabel(e)), e.kind === 'subshell' ? h('span', { class: 'st-tag' }, t('copyTag')) : null)];
      if (e.ended) head.push(door(t(e.kind === 'main' ? 'doorMainEnded' : 'doorEnded', { st: e.ended.status }), false, lit && cg.ended));
      else if (e.exiting) head.push(door(t('doorExiting', { st: e.exiting.status }), true, lit));
      var kids = s.envs.filter(function (k) { return k.parent === e.id; });
      var kidNodes = [];
      kids.forEach(function (k) {
        if (s.pipe && s.pipe.to === k.id) {
          kidNodes.push(h('div', { class: 'st-pipe' }, h('b', { 'aria-hidden': 'true' }, '|'), h('span', { class: 'st-small' }, t('pipeLabel')), h('span', { 'aria-hidden': 'true' }, '↓'),
            s.pipe.lines.length ? h('span', { class: 'st-in', translate: 'no' }, s.pipe.lines.join(' ')) : h('span', { class: 'st-none' }, t('pipeEmpty'))));
        }
        kidNodes.push(envBox(k));
      });
      return h('div', { class: 'st-env' + (lit && cg.created ? ' sd-changed' : ''), dataset: Object.assign({ kind: e.kind }, e.ended ? { ended: '' } : {}) },
        h('div', { class: 'st-head' }, head),
        h('div', { class: 'st-kv' }, rows),
        !showAll ? h('div', { class: 'st-rest' }, t('restCopied')) : null,
        kidNodes.length ? h('div', { class: 'st-kids', dataset: s.pipe && kids.some(function (k) { return k.via === 'pipe'; }) ? { pipe: '' } : {} }, kidNodes) : null);
    }
    var envs = h('div', { class: 'st-box st-envs' }, h('div', { class: 'st-head' }, h('span', null, t('envs'))), envBox(envOf(s, 'main')));

    // the terminal: the caller's command line, the output (each line with the box it came from), the final status
    var newFrom = prev ? prev.out.length : s.out.length;
    var tl = [h('div', { class: 'st-tl', dataset: { prompt: '' } }, h('span', { translate: 'no' }, '$ ' + s.file + '; echo "' + t('callerSays') + ': $?"'))];
    s.out.forEach(function (o, i) {
      var from = o.trap ? 'trap' : o.env === 'main' ? 'main' : 'sub';
      var mark = from === 'trap' ? h('span', { class: 'st-from', dataset: { from: 'trap' }, role: 'img', 'aria-label': t('outTrap'), title: t('outTrap') }, hook(false))
        : h('span', { class: 'st-from', dataset: { from: from }, role: 'img', 'aria-label': t(from === 'main' ? 'outMain' : 'outSub'), title: t(from === 'main' ? 'outMain' : 'outSub') });
      tl.push(h('div', { class: 'st-tl' + (lit && i >= newFrom ? ' st-new' : '') }, mark, h('span', { translate: 'no' }, o.text)));
    });
    if (s.exitStatus !== null) tl.push(h('div', { class: 'st-tl' + (lit ? ' st-new' : ''), dataset: { final: '' } }, h('span', { translate: 'no' }, t('callerSays') + ': ' + s.exitStatus)));
    var side = [h('div', { class: 'st-box st-term' }, h('div', { class: 'st-head' }, h('span', null, t('terminal'))), h('div', { class: 'st-tlines' }, tl))];

    // the temporary directory, for the script that makes one
    if (sc.lines.some(function (ln) { return /mktemp/.test(ln.src); })) {
      var there = s.files[L.TMPDIR];
      var was = prev ? prev.files[L.TMPDIR] : undefined;
      side.push(h('div', { class: 'st-box' }, h('div', { class: 'st-head' }, h('span', null, t('tmpdir'))),
        h('div', { class: 'st-dir' + (lit && there !== was ? ' st-new' : ''), dataset: there === false ? { gone: '' } : {} },
          h('span', { class: 'st-mono', translate: 'no' }, L.TMPDIR),
          h('span', { class: 'st-small' }, t(there === undefined ? 'tmpNotYet' : there ? 'tmpExists' : 'tmpRemoved')))));
    }

    c.stage.replaceChildren(h('div', { class: 'st' }, listing, envs, h('div', { class: 'st-side' }, side)));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'showCopy', type: 'toggle', label: t('showCopy'), hint: t('showCopyHint') }

      { shape: 'st-main', label: t('legendMain') },
      { shape: 'st-sub', label: t('legendSub') },
      { shape: 'hl', label: t('legendChanged') },
      { shape: 'st-hook', label: t('legendTrap') },
