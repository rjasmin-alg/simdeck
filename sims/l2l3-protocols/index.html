<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var table = window.SimStrings[Simdeck.lang] || window.SimStrings.hr;

  function data(text) { return h('span', { translate: 'no', class: 'lp-data' }, text); }
  function bold(text) { return h('b', { translate: 'no' }, String(text)); }
  function bytes(n) { return n + ' B'; }
  /** A field's text in this frame: d_<frame>_<field> when the frame has its own, else d_<field>. */
  function fieldText(prefix, frame, f) {
    var own = prefix + '_' + frame + '_' + f;
    return table[own] !== undefined ? t(own) : t(prefix + '_' + f);
  }
  /** Box width: grows with the log of the bytes, so a 1500 B payload is wide but a 2 B field still readable. */
  function weight(b) { return 1 + Math.log(1 + b) / Math.LN2; }

  /** The field shown in the detail card; the frame's own default until a field is clicked. Page state, not a param. */
  var FOCUS = {
    eth: 'etype', dot1q: 'tci', qinq: 'stpid', macsec: 'sectag', ipv4: 'flags', ipv6: 'nh', mpls: 'labelBottom',
    ipip: 'oip', gre: 'gre', vxlan: 'vxlan', geneve: 'gopts', esp: 'esphdr', 'vxlan-dot1q': 'itag', 'gre-ipsec': 'gip'
  };
  var pick = { frame: null, f: null };
  function selected(fr) {
    if (pick.frame !== fr.id) { pick.frame = fr.id; pick.f = FOCUS[fr.id]; }
    return pick.f;
  }

  function segEl(x, frameId, sel) {
    return h('button', {
      type: 'button',
      class: 'lp-seg' + (x.enc ? ' lp-enc' : '') + (x.b === 0 ? ' lp-zero' : ''),
      dataset: { k: x.k },
      style: { flex: weight(x.b) + ' 1 auto' },
      'aria-pressed': x.f === sel ? 'true' : 'false',
      onmousedown: function (e) { e.preventDefault(); },
      onclick: function () { pick.f = x.f; window.simdeck.render(); }
    },
      h('span', null, t('s_' + x.f)),
      x.v ? h('span', { class: 'lp-v', translate: 'no' }, x.v) : null,
      h('span', { class: 'lp-b', translate: 'no' }, bytes(x.b)));
  }

  function frameEl(fr, sel) {
    return h('div', { class: 'lp-frame' }, fr.groups.map(function (g) {
      var w = g.segs.reduce(function (a, x) { return a + weight(x.b); }, 0);
      return h('div', { class: 'lp-grp', style: { flex: w + ' 1 auto' } },
        h('div', { class: 'lp-segs' }, g.segs.map(function (x) { return segEl(x, fr.id, sel); })),
        h('div', { class: 'lp-glabel' }, t(g.g), ' · ', data(bytes(g.bytes))));
    }));
  }

  function detailEl(fr, sel) {
    var seg = null;
    fr.groups.forEach(function (g) { g.segs.forEach(function (x) { if (!seg && x.f === sel) seg = x; }); });
    if (!seg) return h('div', { class: 'lp-detail' }, t('clickField'));
    return h('div', { class: 'lp-detail', dataset: { k: seg.k } },
      h('div', { class: 'lp-dhead' },
        h('span', { class: 'lp-name' }, fieldText('n', fr.id, seg.f)),
        h('span', { class: 'lp-b', translate: 'no' }, bytes(seg.b)),
        seg.v ? h('span', { class: 'lp-v', translate: 'no' }, seg.v) : null),
      h('div', { class: 'lp-desc' }, fieldText('d', fr.id, seg.f)));
  }

  /** Where the frame's bytes go, at the largest inner packet: header, encapsulation, inner part, trailer. */
  function budgetEl(fr, p) {
    var all = [].concat.apply([], fr.groups.map(function (g) { return g.segs; }));
    var firstIn = all.findIndex(function (x) { return x.z !== 'l2' && x.z !== 'phy'; });
    var head = 0, trail = 0;
    all.forEach(function (x, i) { if (x.z === 'l2') { if (firstIn < 0 || i < firstIn) head += x.b; else trail += x.b; } });
    var inner = fr.kind === 'hdr' ? 'barData' : 'barInner';
    var part = function (cls, n, label) {
      return n > 0 ? h('div', { class: 'lp-part ' + cls, style: { flex: n + ' 1 0' } }, h('span', null, label), data(bytes(n))) : null;
    };
    var mtu = h('div', { class: 'lp-mtu', style: { flex: (fr.over + fr.inner) + ' 1 0' } },
      h('div', { class: 'lp-scale' }, t('linkMtu', { mtu: p.mtu })),
      h('div', { class: 'lp-mtu-parts' }, part('lp-over', fr.over, t('barOver')), part('lp-in', fr.inner, t(inner))));
    var extra = fr.extra > 0 ? h('div', { class: 'lp-part lp-extra', style: { flex: '0 0 auto' } }, t('barExtra', { extra: fr.extra })) : null;
    return h('div', { class: 'lp-budget' },
      h('div', { class: 'lp-bar' }, part('lp-l2', head, t('barHead')), mtu, part('lp-l2', trail, t('barTrail')), extra));
  }

  function compareEl(st, p) {
    var max = p.mtu + st.rows.reduce(function (a, r) { return Math.max(a, r.extra); }, 0);
    var cells = [
      h('span', { class: 'lp-cmp-h' }, t('colFrame')), h('span', { class: 'lp-cmp-h lp-hide' }, t('linkMtu', { mtu: p.mtu })),
      h('span', { class: 'lp-cmp-h lp-num' }, t('colOver')), h('span', { class: 'lp-cmp-h lp-num' }, t('colInner')),
      h('span', { class: 'lp-cmp-h lp-num lp-hide' }, t('colLen'))
    ];
    st.rows.forEach(function (r) {
      cells.push(
        h('button', {
          type: 'button', class: 'lp-row', 'aria-pressed': r.id === p.frame ? 'true' : 'false',
          onmousedown: function (e) { e.preventDefault(); },
          onclick: function () { window.simdeck.set({ frame: r.id }); }
        }, t('f_' + r.id)),
        h('div', { class: 'lp-track', 'aria-hidden': 'true' },
          r.over ? h('span', { class: 'lp-t-over', style: { width: (r.over / max * 100) + '%' } }) : null,
          h('span', { class: 'lp-t-in', style: { width: (r.inner / max * 100) + '%' } }),
          r.extra ? h('span', { class: 'lp-t-extra', style: { width: (r.extra / max * 100) + '%' } }) : null),
        h('span', { class: 'lp-num' }, data(r.over ? '−' + r.over + ' B' : '0 B')),
        h('span', { class: 'lp-num' }, data(bytes(r.inner))),
        h('span', { class: 'lp-num lp-hide' }, data(bytes(r.frame) + (r.extra ? ' (+' + r.extra + ')' : ''))));
    });
    return h('div', { class: 'lp-cmp' }, cells);
  }

  var labels = {
    ethernet: 'presetEthernet', qinq: 'presetQinq', ipv4: 'presetIpv4', ipv6: 'presetIpv6', 'mpls-vpn': 'presetMpls',
    vxlan: 'presetVxlan', geneve: 'presetGeneve', ipsec: 'presetIpsec', compare: 'presetCompare'
  };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'view', type: 'choice', label: t('view'), options: [['frame', t('viewFrame')], ['compare', t('viewCompare')]] },
      { key: 'frame', type: 'select', label: t('frame'), options: L.FRAME_IDS.map(function (id) { return [id, t('f_' + id)]; }) },
      { key: 'mtu', type: 'range', label: t('mtu'), min: L.MTU_MIN, max: L.MTU_MAX, step: 4, hint: t('mtuHint'), format: bytes },
      { key: 'labels', type: 'range', label: t('labels'), min: 1, max: L.LABELS_MAX, step: 1,
        visible: function (p) { return p.frame === 'mpls'; } },
      { key: 'opts', type: 'range', label: t('opts'), min: 0, max: L.OPTS_MAX, step: 4, format: bytes,
        visible: function (p) { return p.frame === 'geneve'; } }
    ],

    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), params: x.params }; }),

    legend: [
      { c: 1, label: t('legendEth') },
      { c: 2, label: t('legendTag') },
      { c: 3, label: t('legendIp') },
      { c: 4, label: t('legendTun') },
      { c: 5, label: t('legendSec') },
      { shape: 'hollow', label: t('legendPay') },
      { shape: 'hatch', label: t('legendEnc') }
    ],

    render: function (c) {
      var p = c.params, st = c.state, fr = st.frame;
      if (p.view === 'compare') {
        c.stage.replaceChildren(h('div', { class: 'lp' }, compareEl(st, p)));
        return;
      }
      var sel = selected(fr);
      c.stage.replaceChildren(h('div', { class: 'lp' },
        h('div', null, h('div', { class: 'lp-name' }, t('f_' + fr.id)), h('div', { class: 'lp-about' }, t('a_' + fr.id))),
        frameEl(fr, sel),
        detailEl(fr, sel),
        budgetEl(fr, p)));
    },

    caption: function (c) {
      var p = c.params, fr = c.state.frame;
      // A node can stand in one place only: captionTag names the extra bytes twice, as {extra} and {extra2}.
      var v = { mtu: bold(p.mtu), frame: bold(fr.frame), extra: bold(fr.extra), extra2: bold(fr.extra), over: bold(fr.over), inner: bold(fr.inner), waste: bold(fr.waste) };
      if (p.view === 'compare') return t.parts('captionCompare', { mtu: bold(p.mtu), name: t('f_' + fr.id), inner: bold(fr.inner) });
      if (!fr.fits) return t.parts('captionNoFit', v);
      var out;
      if (fr.kind === 'hdr') out = t.parts('captionHdr', v);
      else if (fr.kind === 'l2') out = t.parts(fr.extra ? 'captionTag' : 'captionEth', v);
      else out = t.parts('captionTunnel', v);
      if (fr.waste) out = out.concat([' '], t.parts('captionWaste', v));
      return out;
    }
  });
})();
</script>
