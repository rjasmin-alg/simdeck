<!-- ipv4-header: the IPv4 header, field by field. An explorer: click a field (or pick it) to read its role; pick a
     situation (role, hop, fragmenting, NAT) and the fields R1 changes are lit with before → after. On top a small
     path A → R1 → B, in the middle the field strip (five 32-bit rows, widths in bits), at the bottom the selected
     field's card and the situation box. Model: sim.js; rules: SPEC.md; words: strings.js. -->
<html lang="hr" data-sim="ipv4-header">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polja IPv4 zaglavlja · simdeck</title>
<meta name="description" content="Klikni polje IPv4 zaglavlja i pročitaj čemu služi. Pogledaj koja se polja mijenjaju na skoku, pri cijepanju paketa i kroz NAT.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>
<script src="../../kit/glossary.js"></script>

<!-- #simdeck-meta placeholder, written from sim.json; the build replaces it. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "ipv4-header",
  "title": {
    "hr": "Polja IPv4 zaglavlja",
    "en": "IPv4 header fields"
  },
  "concept": {
    "hr": "Čemu služi svako polje i koja se polja mijenjaju na putu",
    "en": "What each field does and which fields change in transit"
  },
  "summary": {
    "hr": "Klikni polje IPv4 zaglavlja i pročitaj čemu služi. Pogledaj koja se polja mijenjaju na skoku, pri cijepanju paketa i kroz NAT.",
    "en": "Click a field of the IPv4 header to read its role. See which fields change at a hop, when a packet is fragmented and through NAT."

}

<style>
/* Page CSS: every selector starts with [data-sim="ipv4-header"]; colours only from kit tokens.
   Layout: the path on top, the field strip in the middle, the card and the situation box at the bottom. */
/* Workaround: kit.css gives .sd-ctl display: flex, which beats the hidden attribute a param's visible() sets
   (as in sims/amdahl and sims/ethernet-frame; shared request there). */
[data-sim="ipv4-header"] .sd-ctl[hidden] { display: none; }
[data-sim="ipv4-header"] .ih {
  display: flex;
  flex-direction: column;
  gap: 1.6cqh;
  height: 100%;
  padding: 1.8cqh 1.6cqw;
  font-size: 1rem;
}

/* ── path ── */
[data-sim="ipv4-header"] .ih-path { display: flex; align-items: center; gap: 0.4rem; }
[data-sim="ipv4-header"] .ih-node {
  flex: none;
  padding: 0.2rem 0.7rem;
  border: var(--line-w) solid var(--ink);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-weight: 700;
  text-align: center;
  line-height: 1.15;
}
[data-sim="ipv4-header"] .ih-node small { display: block; font-family: var(--mono); font-weight: 400; font-size: max(16px, 0.85rem); }
[data-sim="ipv4-header"] .ih-node[data-router] { border-radius: 999px; }
[data-sim="ipv4-header"] .ih-node[data-bad] { border: 0.25rem solid var(--danger); }
[data-sim="ipv4-header"] .ih-link { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; min-width: 0; }
[data-sim="ipv4-header"] .ih-link-lbl { font-size: max(16px, 0.85rem); color: var(--muted); white-space: nowrap; }
[data-sim="ipv4-header"] .ih-wire { align-self: stretch; height: 0; border-top: 0.2rem solid var(--ink); }
[data-sim="ipv4-header"] .ih-link[data-narrow] .ih-wire { border-top-style: dashed; }
[data-sim="ipv4-header"] .ih-chip {
  padding: 0 0.5rem;
  border: 0.14rem solid var(--ink);
  border-radius: 999px;
  font-size: max(16px, 0.85rem);
  font-weight: 700;
  background: var(--bg);
  white-space: nowrap;
}
[data-sim="ipv4-header"] .ih-chip[data-bad] { border-color: var(--danger); color: var(--danger); }

/* ── field strip: one 32-column grid, a cell spans its bits ── */
[data-sim="ipv4-header"] .ih-stripwrap { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; padding: 0.6rem; margin: -0.6rem; }
[data-sim="ipv4-header"] .ih-strip {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: repeat(32, minmax(0, 1fr));
  grid-template-rows: auto;
  grid-auto-rows: minmax(0, 1fr);
  gap: 0.3rem;
  min-width: 52rem;
}
[data-sim="ipv4-header"] .ih-strip[data-options] { grid-template-rows: auto repeat(5, minmax(0, 1fr)) minmax(2.4rem, auto); }
[data-sim="ipv4-header"] .ih-cell[data-key="options"] { flex-direction: row; flex-wrap: wrap; column-gap: 0.8rem; }
[data-sim="ipv4-header"] .ih-ruler { font-family: var(--mono); font-size: max(16px, 0.8rem); color: var(--muted); }
[data-sim="ipv4-header"] .ih-ruler[data-end] { text-align: right; }
[data-sim="ipv4-header"] .ih-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 0;
  min-width: 0;
  min-height: 0;
  padding: 0 0.3rem;
  border: var(--line-w) solid;
  border-radius: var(--radius-sm);
  font: inherit;
  text-align: center;
  line-height: 1.05;
  cursor: pointer;
  overflow: hidden;
}
[data-sim="ipv4-header"] .ih-cell[data-group="frag"] { border-style: dashed; border-width: 0.18rem; }
[data-sim="ipv4-header"] .ih-cell[data-group="life"] { border-style: double; border-width: 0.27rem; }
[data-sim="ipv4-header"] .ih-cell[data-group="format"] { border-style: solid; }
[data-sim="ipv4-header"] .ih-cell b { font-size: 1rem; overflow-wrap: anywhere; }
[data-sim="ipv4-header"] .ih-cell .ih-bits { font-size: max(16px, 0.8rem); color: var(--muted); }
[data-sim="ipv4-header"] .ih-cell .ih-val { font-family: var(--mono); font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
[data-sim="ipv4-header"] .ih-cell .ih-new { font-family: var(--mono); font-size: 1rem; font-weight: 700; overflow-wrap: anywhere; }
[data-sim="ipv4-header"] .ih-cell .ih-old { text-decoration: line-through; font-weight: 400; }
[data-sim="ipv4-header"] .ih-cell .ih-flag { font-family: var(--mono); font-size: max(16px, 0.8rem); font-weight: 700; white-space: nowrap; line-height: 1.05; }
[data-sim="ipv4-header"] .ih-cell[data-key="flags"] { padding: 0 0.1rem; gap: 0; line-height: 1.05; }
[data-sim="ipv4-header"] .ih-cell[aria-pressed="true"] { border-bottom: 0.45rem solid var(--ink); }
[data-sim="ipv4-header"] .ih-cell[aria-pressed="true"] b::before { content: '▶ '; }
[data-sim="ipv4-header"] .ih-cell.sd-changed { z-index: 1; box-shadow: 0 0 0 max(6px, 0.45rem) var(--hl); }
[data-sim="ipv4-header"] .ih-cell[data-bad] { outline: 0.25rem solid var(--danger); outline-offset: 0.12rem; }
[data-sim="ipv4-header"] .ih-cell .ih-tos { display: flex; gap: 0.4rem; font-family: var(--mono); font-size: max(16px, 0.85rem); }
[data-sim="ipv4-header"] .ih-cell .ih-tos span + span { border-left: 0.12rem solid currentColor; padding-left: 0.4rem; }
[data-sim="ipv4-header"] .ih-cell[data-key="options"] { background-image: repeating-linear-gradient(45deg, transparent 0 0.35em, color-mix(in srgb, var(--ink) 18%, transparent) 0.35em 0.5em); }

/* ── bottom: card and situation box ── */
[data-sim="ipv4-header"] .ih-bottom { flex: none; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0.8rem; }
[data-sim="ipv4-header"] .ih-box {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.5rem 0.8rem;
  border: var(--line-w) solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
  min-width: 0;
}
[data-sim="ipv4-header"] .ih-box h3 { margin: 0; font-size: 1.1rem; }
[data-sim="ipv4-header"] .ih-box p { margin: 0; }
[data-sim="ipv4-header"] .ih-card { border-left: 0.5rem solid var(--sw, var(--line)); }
[data-sim="ipv4-header"] .ih-card .ih-meta { color: var(--muted); }
[data-sim="ipv4-header"] .ih-card .ih-here b { font-family: var(--mono); }
[data-sim="ipv4-header"] .ih-card .ih-sits { font-weight: 700; }
[data-sim="ipv4-header"] .ih-card .ih-mis { font-style: italic; }
[data-sim="ipv4-header"] .ih-box table { border-collapse: collapse; font-size: 1rem; }
[data-sim="ipv4-header"] .ih[data-view="fragment"] .ih-bottom { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }
[data-sim="ipv4-header"] .ih[data-view="fragment"] .ih-box th, [data-sim="ipv4-header"] .ih[data-view="fragment"] .ih-box td { padding-inline: 0.3rem; }
[data-sim="ipv4-header"] .ih-box th, [data-sim="ipv4-header"] .ih-box td { padding: 0.05rem 0.5rem; text-align: left; border-bottom: 0.1rem solid var(--line); white-space: nowrap; }
[data-sim="ipv4-header"] .ih-box th { font-weight: 700; }
[data-sim="ipv4-header"] .ih-box td[data-mono] { font-family: var(--mono); }
[data-sim="ipv4-header"] .ih-box td.sd-changed { outline-width: 0.12rem; outline-offset: -0.12rem; box-shadow: none; background: var(--hl); color: var(--on-hl); }
[data-sim="ipv4-header"] .ih-box td[data-same] { color: var(--muted); }
[data-sim="ipv4-header"] .ih-bar { display: flex; height: 1.6rem; border: var(--line-w) solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
[data-sim="ipv4-header"] .ih-bar span { height: 100%; }
[data-sim="ipv4-header"] .ih-bar span[data-kind="data"] { flex: 1 1 auto; }
[data-sim="ipv4-header"] .ih-bar span[data-kind="opt"] { flex: none; }
[data-sim="ipv4-header"] .ih-drop { border: 0.25rem solid var(--danger); }
[data-sim="ipv4-header"] .ih-drop h3 i { font-style: normal; color: var(--danger); margin-right: 0.3rem; }

/* legend swatches */
[data-sim="ipv4-header"] .sd-swatch[data-shape="ih-soft"] { background: color-mix(in srgb, var(--sw) 16%, var(--bg)); border-color: var(--sw); }
[data-sim="ipv4-header"] .sd-swatch[data-shape="ih-frag"] { background: color-mix(in srgb, var(--sw) 16%, var(--bg)); border-color: var(--sw); border-style: dashed; }
[data-sim="ipv4-header"] .sd-swatch[data-shape="ih-life"] { background: color-mix(in srgb, var(--sw) 16%, var(--bg)); border-color: var(--sw); border-style: double; border-width: 0.25rem; }
[data-sim="ipv4-header"] .sd-swatch[data-shape="ih-sel"] { background: var(--bg); box-shadow: inset 0 -0.3rem 0 var(--ink); }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="ipv4-header"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="ipv4-header"] .ih { height: auto; padding: 0.5rem; gap: 0.8rem; }
  [data-sim="ipv4-header"] .ih-strip { grid-auto-rows: 6rem; }
  [data-sim="ipv4-header"] .ih-cell .ih-flag { white-space: normal; }
  [data-sim="ipv4-header"] .ih-bottom,
  [data-sim="ipv4-header"] .ih[data-view] .ih-bottom { grid-template-columns: minmax(0, 1fr); }
  [data-sim="ipv4-header"] .ih-link-lbl { white-space: normal; text-align: center; }
  [data-sim="ipv4-header"] .ih-box { overflow-x: auto; }
  [data-sim="ipv4-header"] .ih-path { gap: 0.2rem; }
  [data-sim="ipv4-header"] .ih-node { padding: 0.1rem 0.4rem; }
  [data-sim="ipv4-header"] .ih-node small { display: none; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Polja IPv4 zaglavlja</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var ctl = null;

  /** Series colour and border per group (legend: addressing c1, fragmentation c2, lifetime c3, format c4). */
  var GROUP_C = { addr: '1', frag: '2', life: '3', format: '4' };
  var GROUP_OF = { options: 'format' };
  L.FIELDS.forEach(function (f) { GROUP_OF[f.key] = f.group; });
  var BITS_OF = { options: 32 };
  L.FIELDS.forEach(function (f) { BITS_OF[f.key] = f.bits; });

  /** Data (addresses, numbers, hex) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function bold(s) { return h('b', null, s); }
  function oct(n) { return t.n('octets', n); }
  function bit(b) { return b ? 1 : 0; }
  /** t.parts with *word* turned into an English term in italics (term pairs not in the glossary yet). */
  function rich(k, vars) {
    var out = [];
    t.parts(k, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (piece, i) {
        if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }

  /** The value a field shows for one packet, as language-neutral text. */
  function valueOf(key, pk) {
    switch (key) {
      case 'version': return String(pk.version);
      case 'ihl': return String(pk.ihl);
      case 'tos': return 'DSCP ' + pk.dscp + ' · ECN ' + ('0' + pk.ecn.toString(2)).slice(-2);
      case 'totalLength': return String(pk.totalLength);
      case 'id': return L.hex4(pk.id);
      case 'flags': return 'DF ' + bit(pk.df) + ' · MF ' + bit(pk.mf);
      case 'fragOffset': return String(pk.fragOffset);
      case 'ttl': return String(pk.ttl);
      case 'protocol': return pk.protocol + (L.PROTOCOLS[pk.protocol] ? ' ' + L.PROTOCOLS[pk.protocol] : '');
      case 'checksum': return L.hex4(pk.checksum);
      case 'src': return pk.src;
      case 'dst': return pk.dst;
      case 'options': return '';
    }
    return '';
  }
  /** The after-values of a changed field: one value, or one per fragment when they differ. */
  function afterText(key, s) {
    var vals = s.after.map(function (a) { return valueOf(key, a); });
    var same = vals.every(function (v) { return v === vals[0]; });
    return same ? vals[0] : vals.join(' · ');
  }

  // ── path ──
  function path(c) {
    var s = c.state, v = s.view;
    var node = function (name, sub, ds) { return h('div', { class: 'ih-node', dataset: ds || {} }, data(name), sub ? h('small', { translate: 'no' }, sub) : null); };
    var link = function (n, mtu, chip, ds) {
      var lbl = [t('pathSeg', { n: n })];
      if (mtu) lbl.push(' · ', t('pathMtu', { n: mtu }));
      return h('div', { class: 'ih-link', dataset: ds || {} }, h('span', { class: 'ih-link-lbl' }, lbl), h('span', { class: 'ih-wire' }), chip);
    };
    var chip = function (k, bad) { return h('span', { class: 'ih-chip', dataset: bad ? { bad: '' } : {} }, t(k)); };
    var frag = v === 'fragment', nat = v === 'nat';
    var r1 = h('div', { class: 'ih-node', dataset: Object.assign({ router: '' }, s.dropped ? { bad: '' } : {}) },
      data('R1'), nat ? h('small', null, t('pathNat')) : null);
    var b = nat ? node('8.8.8.8', null) : node('B', s.packet.dst);
    var c1 = v === 'role' ? chip('chipPacket') : chip('chipBefore');
    var c2 = v === 'role' ? null : s.dropped ? chip('chipDropped', true) : chip('chipAfter');
    return h('div', { class: 'ih-path' },
      node('A', s.packet.src),
      link(1, frag ? L.MTU.seg1 : null, c1),
      r1,
      link(2, frag ? L.MTU.seg2 : null, c2, frag ? { narrow: '' } : null),
      nat ? h('div', { class: 'ih-node' }, t('pathNet')) : null,
      nat ? h('div', { class: 'ih-link' }, h('span', { class: 'ih-wire' })) : null,
      b);
  }

  // ── field strip ──
  function cell(key, s, row, col) {
    var pk = s.packet, bits = BITS_OF[key];
    var changed = s.changed.indexOf(key) >= 0;
    var kids = [bold(t('short_' + key)), h('span', { class: 'ih-bits' }, t.n('bits', key === 'options' ? s.header.optionBytes * 8 : bits))];
    if (key === 'tos') kids.push(h('span', { class: 'ih-tos', translate: 'no' }, h('span', null, 'DSCP ' + pk.dscp), h('span', null, 'ECN ' + ('0' + pk.ecn.toString(2)).slice(-2))));
    else if (key === 'options') kids.push(h('span', null, t('val_options', { n: s.header.optionBytes, ihl: pk.ihl })));
    else if (key === 'flags') {
      // 3 bits wide: DF and MF on a line each; MF shows its after-values when the view changes it
      if (changed) {
        // each flag on its own line; a flag the model changed shows its after-values (one per packet R1 sends)
        ['df', 'mf'].forEach(function (f) {
          var name = f.toUpperCase() + ' ', now = bit(pk[f]);
          var after = s.after.map(function (a) { return bit(a[f]); });
          kids.push(after.every(function (v) { return v === now; })
            ? data(name + now, 'ih-flag')
            : h('span', { class: 'ih-flag', translate: 'no' }, h('span', { class: 'ih-old' }, name + now), '→', after.join('·')));
        });
      } else kids.push(data('DF ' + bit(pk.df) + ' MF ' + bit(pk.mf), 'ih-flag'));
    }
    else if (changed) kids.push(h('span', { class: 'ih-new', translate: 'no' }, h('span', { class: 'ih-old' }, valueOf(key, pk)), ' → ', afterText(key, s)));
    else kids.push(data(valueOf(key, pk), 'ih-val'));
    var ds = { key: key, group: GROUP_OF[key], c: GROUP_C[GROUP_OF[key]] };
    if (key === 'flags' && s.dropped) ds.bad = '';
    return h('button', {
      type: 'button',
      class: 'ih-cell sd-soft' + (changed ? ' sd-changed' : ''),
      dataset: ds,
      'aria-pressed': String(s.selected === key),
      'aria-label': t('short_' + key),
      style: { gridColumn: col + ' / span ' + bits, gridRow: String(row) },
      onclick: function () { if (ctl) ctl.set({ field: key }); }
    }, kids);
  }

  function strip(c) {
    var s = c.state;
    var kids = [
      h('span', { class: 'ih-ruler', translate: 'no', style: { gridColumn: '1 / span 8', gridRow: '1' } }, '0'),
      h('span', { class: 'ih-ruler', translate: 'no', style: { gridColumn: '9 / span 8', gridRow: '1' } }, '8'),
      h('span', { class: 'ih-ruler', translate: 'no', style: { gridColumn: '17 / span 8', gridRow: '1' } }, '16'),
      h('span', { class: 'ih-ruler', translate: 'no', style: { gridColumn: '25 / span 7', gridRow: '1' } }, '24'),
      h('span', { class: 'ih-ruler', translate: 'no', dataset: { end: '' }, style: { gridColumn: '32', gridRow: '1' } }, '31')
    ];
    L.rows().forEach(function (keys, r) {
      var col = 1;
      keys.forEach(function (k) { kids.push(cell(k, s, r + 2, col)); col += BITS_OF[k]; });
    });
    if (s.header.optionBytes > 0) kids.push(cell('options', s, 7, 1));
    return h('div', { class: 'ih-stripwrap' }, h('div', { class: 'ih-strip', dataset: s.header.optionBytes > 0 ? { options: '' } : {} }, kids));
  }

  // ── card for the selected field ──
  function card(c) {
    var s = c.state, pk = s.packet, k = s.selected, hd = s.header;
    var vars = { ihl: pk.ihl, hdr: hd.headerBytes, total: pk.totalLength, data: hd.dataBytes, dscp: pk.dscp,
      ecn: ('0' + pk.ecn.toString(2)).slice(-2), df: bit(pk.df), mf: bit(pk.mf), dfText: t('df_' + bit(pk.df)),
      mfText: t('mf_' + bit(pk.mf)), off: pk.fragOffset, octets: pk.fragOffset * 8, n: pk.protocol,
      name: s.protocolName || '?' };
    var here;
    if (k === 'options') here = hd.optionBytes ? t('val_options', { n: hd.optionBytes, ihl: pk.ihl }) : t('val_optionsNone');
    else here = [data(valueOf(k, pk)), ' — ', t('val_' + k, vars)];
    var sits = s.situations.length
      ? [t('changesIn'), ' ', s.situations.map(function (v) { return t('sit_' + v); }).join(', ')]
      : [t('changesNever')];
    var mis = { ihl: 'mis_ihl', ttl: 'mis_ttl', src: 'mis_src' }[k];
    var g = GROUP_OF[k];
    return h('div', { class: 'ih-box ih-card', dataset: { c: GROUP_C[g] } },
      h('h3', null, rich('f_' + k)),
      h('p', { class: 'ih-meta' }, k === 'options' && !hd.optionBytes ? null : [t.n('bits', k === 'options' ? hd.optionBytes * 8 : BITS_OF[k]), ' · '], t('grp_' + g)),
      h('p', null, t('role_' + k)),
      h('p', { class: 'ih-here' }, bold(t('here')), ' ', here),
      h('p', { class: 'ih-sits' }, sits),
      mis ? h('p', { class: 'ih-mis' }, t(mis)) : null);
  }

  // ── situation box ──
  function td(text, opts) {
    opts = opts || {};
    var ds = opts.mono === false ? {} : { mono: '' };
    if (opts.same) ds.same = '';
    return h('td', { translate: 'no', class: opts.changed ? 'sd-changed' : null, dataset: ds }, String(text));
  }
  function box(c) {
    var s = c.state, pk = s.packet, hd = s.header;
    if (s.view === 'role') {
      var pct = function (n) { return (100 * n / pk.totalLength) + '%'; };
      var segs = [h('span', { class: 'sd-fill', dataset: { c: '4' }, style: { width: pct(hd.headerBytes - hd.optionBytes), minWidth: '2rem', flex: 'none' } })];
      if (hd.optionBytes) segs.push(h('span', { class: 'sd-hatch', dataset: { kind: 'opt' }, style: { width: pct(hd.optionBytes), minWidth: '1rem' } }));
      segs.push(h('span', { class: 'sd-soft', dataset: { kind: 'data', c: '8' } }));
      return h('div', { class: 'ih-box' },
        h('h3', null, t('sbRole')),
        h('div', { class: 'ih-bar', role: 'img', 'aria-label': t('sbHeader', { n: oct(hd.headerBytes) }) + ', ' + t('sbData', { n: oct(hd.dataBytes) }) }, segs),
        h('p', null, t.parts('sbHeader', { n: bold(oct(hd.headerBytes)) }), hd.optionBytes ? [' (', t.parts('sbOptions', { n: bold(oct(hd.optionBytes)) }), ')'] : null),
        h('p', null, t.parts('sbData', { n: bold(oct(hd.dataBytes)) })),
        h('p', null, t.parts('sbTotal', { n: bold(oct(pk.totalLength)) })));
    }
    if (s.dropped) {
      return h('div', { class: 'ih-box ih-drop' },
        h('h3', null, h('i', { 'aria-hidden': 'true' }, '✗'), t('dropTitle')),
        h('p', null, t('dropText', { total: pk.totalLength, mtu: L.MTU.seg2 })),
        h('p', null, t('dropMore')));
    }
    if (s.view === 'fragment') {
      var head = h('tr', null, h('th', null, '#'), h('th', null, t('thLen')), h('th', null, t('thId')), h('th', null, t('thMf')),
        h('th', null, t('thOff')), h('th', null, t('thTtl')), h('th', null, t('thSum')));
      var row = function (label, f, orig) {
        var ch = function (k, v) { return !orig && v !== pk[k]; };
        return h('tr', null, h('td', { dataset: orig ? {} : { mono: '' }, translate: orig ? null : 'no' }, label),
          td(f.totalLength, { changed: ch('totalLength', f.totalLength) }),
          td(L.hex4(f.id), { changed: ch('id', f.id), same: !orig && !ch('id', f.id) }),
          td(bit(f.mf), { changed: ch('mf', f.mf) }),
          td(f.fragOffset + ' (' + f.fragOffset * 8 + ')', { changed: ch('fragOffset', f.fragOffset) }),
          td(f.ttl, { changed: ch('ttl', f.ttl) }),
          td(L.hex4(f.checksum), { changed: ch('checksum', f.checksum) }));
      };
      return h('div', { class: 'ih-box' },
        h('h3', null, t('sbFrag', { mtu: L.MTU.seg2 })),
        h('table', null, h('thead', null, head),
          h('tbody', null, row(t('thOrig'), pk, true), s.after.map(function (f, i) { return row(String(i + 1), f, false); }))));
    }
    // hop and nat: before / after on the fields that matter
    var a = s.after[0];
    var keys = s.view === 'nat' ? ['src', 'dst', 'ttl', 'checksum'] : ['ttl', 'checksum', 'src', 'dst'];
    return h('div', { class: 'ih-box' },
      h('h3', null, t(s.view === 'nat' ? 'sbNat' : 'sbHop')),
      h('table', null,
        h('thead', null, h('tr', null, h('th', null, t('thField')), h('th', null, t('thBefore')), h('th', null, t('thAfter')))),
        h('tbody', null, keys.map(function (k) {
          var b = valueOf(k, pk), x = valueOf(k, a), ch = b !== x;
          return h('tr', null, h('td', null, t('short_' + k)), td(b), ch ? td(x, { changed: true }) : td('=', { same: true }));
        }))));
  }

  var lastFocus = null;
  ctl = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'field', type: 'select', label: t('field'), options: L.FIELD_KEYS.map(function (k) { return [k, t('short_' + k)]; }) },
      { key: 'view', type: 'choice', label: t('view'), options: L.VIEWS.map(function (v) { return [v, t('view_' + v)]; }) },
      { key: 'df', type: 'toggle', label: t('df'), visible: function (p) { return p.view === 'fragment'; } },
      { key: 'ihl', type: 'range', label: t('ihl'), min: L.MIN_IHL, max: L.MAX_IHL, step: 1,
        format: function (v) { return v + ' × 4 = ' + oct(v * 4); }, visible: function (p) { return p.view === 'role'; } }
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params };
    }),

    legend: [
      { c: 1, shape: 'ih-soft', label: t('legAddr') },
      { c: 2, shape: 'ih-frag', label: t('legFrag') },
      { c: 3, shape: 'ih-life', label: t('legLife') },
      { c: 4, shape: 'ih-soft', label: t('legFormat') },
      { shape: 'hl', label: t('legChanged') },
      { shape: 'ih-sel', label: t('legSelected') }
    ],

    render: function (c) {
      var a = document.activeElement;
      lastFocus = a && a.classList && a.classList.contains('ih-cell') ? a.dataset.key : null;
      c.stage.replaceChildren(h('div', { class: 'ih', dataset: { view: c.state.view } }, path(c), strip(c), h('div', { class: 'ih-bottom' }, card(c), box(c))));
      if (lastFocus) {
        var el = c.stage.querySelector('.ih-cell[data-key="' + lastFocus + '"]');
        if (el) el.focus();
      }
    },

    caption: function (c) {
      var s = c.state, pk = s.packet, hd = s.header;
      if (s.view === 'hop') return rich('cap_hop', { a: data(pk.ttl), b: data(s.after[0].ttl) });
      if (s.view === 'nat') return rich('cap_nat', { a: data(pk.src), b: data(s.after[0].src) });
      if (s.view === 'fragment' && s.dropped) return rich('cap_df', { mtu: L.MTU.seg2 });
      if (s.view === 'fragment') return rich('cap_fragment', { total: pk.totalLength, n: bold(t.n('fragments', s.after.length)), mtu: L.MTU.seg2 });
      return rich('cap_role', { ihl: pk.ihl, hdr: hd.headerBytes, total: pk.totalLength, data: bold(String(hd.dataBytes)) });
    }
  });
})();
</script>
</body>
</html>
