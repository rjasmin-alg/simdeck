<script>
(function () {

  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function sig(x, n) {                       // n significant digits, trailing zeros kept, never exponent notation
    var a = Math.abs(x);

    var d = Math.max(0, n - 1 - Math.floor(Math.log10(a) + 1e-9));
    return num(x, Math.min(d, 8));
  }
  var PREFIX = { '-18': 'a', '-15': 'f', '-12': 'p', '-9': 'n', '-6': 'µ', '-3': 'm', '0': '', '3': 'k', '6': 'M' };
  /** A value with an SI prefix and 3 significant digits: 0.000434 V → "434 µV". */
  function si(v, unit, n) {

  function hertz(f) { return f >= 1e6 ? clean(f / 1e6) + ' MHz' : clean(f / 1e3) + ' kHz'; }
  function len(m) { return m >= 1000 ? sig(m / 1000, 3) + ' km' : m >= 1 ? sig(m, 3) + ' m' : sig(m * 100, 3) + ' cm'; }
  function signedDeg(v) { var s = num(v, Math.abs(v) < 10 && Math.abs(v) > 0.05 ? 1 : 0); return t('deg', { v: v > 0.05 ? '+' + s : s }); }

  // ── the main plot: |V| against r, log–log, both geometries, the chosen one's asymptotes, zones and the receiver ──
  var profKey = '', profData = null;
  function drawMain(box, c) {
    var W = box.clientWidth, H = box.clientHeight;

    var r0 = rem(), st = c.state, p = c.params;
    var key = p.f + ':' + st.inf;
    if (profKey !== key) { profKey = key; profData = L.profile(p.f, st.inf); }
    var data = profData, lo = Infinity, hi = -Infinity;
    data.forEach(function (d) { lo = Math.min(lo, d.side, d.axis); hi = Math.max(hi, d.side, d.axis); });
    var y0 = Math.floor(Math.log10(lo)), y1 = Math.ceil(Math.log10(hi) + 0.3);
    var pad = { l: 4.2 * r0, r: 1 * r0, t: 3.6 * r0, b: 2.4 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var rA = L.R_TABLE[0], rB = L.R_TABLE[L.R_TABLE.length - 1], lrA = Math.log10(rA), lrB = Math.log10(rB);

    var Y = function (v) { return pad.t + ch * (1 - (Math.log10(v) - y0) / (y1 - y0)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var clipId = 'nf-clip';
    svg.append(s('defs', null, s('clipPath', { id: clipId }, s('rect', { x: pad.l, y: pad.t, width: cw, height: ch }))));

    // grid: every decade of r; volts every decade, labelled every factor of 1000
    var span = y1 - y0;
    for (var e = y0; e <= y1; e++) {
      var lab = ((e % 3) + 3) % 3 === 0;
      if (span > 12 && !lab) continue;
      if (e > y0 && e < y1) svg.append(s('line', { class: 'nf-grid', x1: pad.l, x2: pad.l + cw, y1: Y(Math.pow(10, e)), y2: Y(Math.pow(10, e)) }));
      if (lab) svg.append(s('text', { x: pad.l - 0.35 * r0, y: Y(Math.pow(10, e)) + 0.32 * r0, 'text-anchor': 'end', translate: 'no' }, si(Math.pow(10, e), 'V', 1)));
    }
    var few = cw < 26 * r0;                                // phone: every other decade labelled
    [0.1, 1, 10, 100, 1000].forEach(function (r) {
      if (few && (r === 1 || r === 100)) { svg.append(s('line', { class: 'nf-grid', x1: X(r), x2: X(r), y1: pad.t, y2: pad.t + ch })); return; }
      if (r < 1000) svg.append(s('line', { class: 'nf-grid', x1: X(r), x2: X(r), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(r), y: H - 0.9 * r0, 'text-anchor': r === 1000 ? 'end' : 'middle', translate: 'no' }, metres(r)));
    });
    svg.append(s('rect', { class: 'nf-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    svg.append(s('text', { class: 'nf-title', x: pad.l, y: 1.2 * r0 }, t(W - pad.l < 0.52 * r0 * t('plotTitle').length ? 'plotTitleShort' : 'plotTitle')));

        svg.append(s('text', { class: 'nf-halo nf-title', x: x, y: pad.t - 0.6 * r0, 'text-anchor': 'middle' }, t(z[2])));

    function label(d, k, text, anchor, dx) {

  // ── the schematic: the two loops edge-on, the transmitting loop's H lines (near-field shape), current and voltage ──

    var sign = st.i > 0.05 ? 1 : st.i < -0.05 ? -1 : 0;

    if (sign) svg.append(arrowHead(tx[0], (axis ? (tx[1] + rx[1]) / 2 : tx[1] - 1.5 * r0) - sign * 0.3 * r0, 0, -sign, 0.55 * r0, 'nf-hhead'));
    // the loops (edge-on ellipses), the current's arrowhead on the near side of the transmitting loop, the voltage bar
    [tx, rx].forEach(function (q) { svg.append(s('ellipse', { class: 'nf-loop', cx: q[0], cy: q[1], rx: lr, ry: ly })); });
    if (Math.abs(st.i) > 0.05) svg.append(arrowHead(tx[0] + st.i * 0.7 * r0, tx[1] + ly, st.i > 0 ? 1 : -1, 0, (0.35 + 0.45 * Math.abs(st.i)) * r0, 'nf-ihead'));
    var bx = rx[0] + lr + 1.0 * r0, bh = 1.5 * r0 * st.v;
    svg.append(s('line', { class: 'nf-vbase', x1: bx - 0.6 * r0, x2: bx + 0.6 * r0, y1: rx[1], y2: rx[1] }));
    if (Math.abs(bh) > 0.5) svg.append(s('rect', { class: 'nf-vbar', x: bx - 0.35 * r0, y: Math.min(rx[1], rx[1] - bh), width: 0.7 * r0, height: Math.abs(bh) }));
    svg.append(s('text', { class: 'nf-halo nf-title', x: bx + 0.8 * r0, y: rx[1] + 0.35 * r0 }, t('schV')));
    svg.append(s('text', { class: 'nf-halo nf-title', x: tx[0] - lr - 0.5 * r0, y: tx[1] + 0.35 * r0, 'text-anchor': 'end' }, t('schI')));
    box.replaceChildren(svg);
  }

  // ── the period plot: current and voltage over one period, each over its own amplitude ──
  function drawPeriod(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), data = L.period(st.phase);
    var pad = { l: 3.4 * r0, r: 0.6 * r0, t: 2.0 * r0, b: 1.4 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (d) { return pad.l + d / 360 * cw; }, Y = function (y) { return pad.t + ch * (1 - (y + 1.1) / 2.2); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'nf-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [0, 90, 180, 270].forEach(function (d) {
      if (d) svg.append(s('line', { class: 'nf-grid', x1: X(d), x2: X(d), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(d), y: H - 0.15 * r0, 'text-anchor': 'middle' }, String(d)));
    });
    svg.append(s('text', { x: pad.l + cw, y: H - 0.15 * r0, 'text-anchor': 'end' }, t('plotDeg')));
    svg.append(s('line', { class: 'nf-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    [[1, t('max')], [-1, t('min')]].forEach(function (yv) { svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(yv[0]) + 0.32 * r0, 'text-anchor': 'end' }, yv[1])); });
    svg.append(s('text', { class: 'nf-title', x: pad.l, y: pad.t - 0.75 * r0 }, t('plotTime')));
    svg.append(poly(data.map(function (q) { return [X(q.t), Y(q.i)]; }), 'nf-sI'));
    svg.append(poly(data.map(function (q) { return [X(q.t), Y(q.v)]; }), 'nf-sV'));
    svg.append(s('line', { class: 'nf-now', x1: X(st.t), x2: X(st.t), y1: pad.t, y2: pad.t + ch }));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function zoneName(st) { return st.inf ? t('zoneAll') : t(st.zone === 'near' ? 'zoneNear' : st.zone === 'mid' ? 'zoneMid' : 'zoneFar'); }
  function table(st) {
    function row(label, value, key, word) {
      return h('tr', { class: key ? 'nf-key' : null }, h('th', { scope: 'row' }, label), h('td', { class: word ? 'nf-word' : null, translate: word ? null : 'no' }, value));
    }
    return h('table', { class: 'nf-table' }, h('tbody', null,
      row(t('rowF'), st.inf ? hertz(st.f) : t('valF', { f: hertz(st.f), l: len(st.lambda) })),   // c infinite: no λ
      row(t('rowCross'), st.inf ? '—' : len(st.cross)),
      row(t('rowR'), st.inf ? metres(st.r) : t('valR', { m: metres(st.r), rl: sig(st.rl, 3) })),
      row(t('rowZone'), zoneName(st), false, true),
      row(t('rowV'), si(st.V, 'V'), true),
      row(t('rowN'), num(st.n, 2), true),
      row(t('rowPh'), signedDeg(st.phase)),
      row(t('rowRatio'), sig(st.axisOverSide, 3)),
      row(t('rowP'), si(st.Prad, 'W')),
      row(t('rowQ'), si(st.Q, 'W'))));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'f', type: 'range', label: t('f'), min: 0, max: L.F_TABLE.length - 1, step: 1,
        format: function (v) { return hertz(L.F_TABLE[v]); } },
      { key: 'r', type: 'range', label: t('r'), min: 0, max: L.R_TABLE.length - 1, step: 1,
        format: function (v) { return metres(L.R_TABLE[v]); } },
      { key: 'geom', type: 'choice', label: t('geom'), options: [['side', t('geom_side')], ['axis', t('geom_axis')]] },
      { key: 'c', type: 'choice', label: t('c'), options: [['finite', t('c_finite')], ['inf', t('c_inf')]] },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'nf-side', label: t('legendSide') },
      { shape: 'nf-axis', label: t('legendAxis') },
      { shape: 'nf-asym', label: t('legendAsym') },
      { shape: 'nf-rx', label: t('legendRx') }
    ],

    render: function (c) {
      var main = h('div', { class: 'nf-main' }), sch = h('div', { class: 'nf-sch' }), per = h('div', { class: 'nf-per' });
      var keys = h('p', { class: 'nf-keys' },
        h('span', null, h('span', { class: 'nf-key-i' }), t('seriesI')),
        h('span', null, h('span', { class: 'nf-key-v' }), t('seriesV')));
      c.stage.replaceChildren(h('div', { class: 'nf' }, main,
        h('div', { class: 'nf-side' }, sch, h('p', { class: 'nf-units' }, t('schKey')), table(c.state), h('p', { class: 'nf-units' }, t('units')), keys, per)));
      drawMain(main, c);
      drawSchematic(sch, c.state);
      drawPeriod(per, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', { translate: 'no' }, x); };
      var vars = {
        r: b(metres(st.r)), V: b(si(st.V, 'V')), n: b(num(st.n, 2)), div: b(num(st.div, 1)),
        cross: b(len(st.cross)), ph: b(signedDeg(st.phase)), Q: b(si(st.Q, 'W')), P: b(si(st.Prad, 'W')),
        ratio: b(t('times', { v: num(st.axisOverSide, 2) }))
      };
      var parts = t.parts('cap_main', vars).concat([' ']);
      var axis = st.geom === 'axis';
      var note = axis && st.axisOverSide > 1 && (st.inf || st.zone === 'near');   // the pattern-null sentence
      // close in the voltage follows the current with no delay; from kr = 0.5 (95°) the 1/r part shows in the phase
      var near = note ? 'p_nearShort' : st.kr < 0.5 ? 'p_near' : 'p_nearEdge';
      var key = st.inf ? 'p_inf' : st.zone === 'near' ? near : st.zone === 'mid' ? (axis ? 'p_midAxis' : 'p_mid') : axis ? 'p_farAxis' : 'p_far';
      parts = parts.concat(t.parts(key, vars));
      if (note) parts = parts.concat([' '], t.parts('cap_axisNear', vars));
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
