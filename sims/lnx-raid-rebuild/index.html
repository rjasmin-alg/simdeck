<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var C_DISK = 1, C_SPARE = 2, C_WIN = 3;          // series colours: data on the disks, the spare, the window bar
  var URE = '⚡︎';                         // the lightning mark, text presentation

  /** Data (disk names, numbers, mdstat) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function sp(parts) { return [' '].concat(parts); }

  /** Numbers: one decimal, a trailing ",0" dropped; percentages; 9,6 × 10¹³. */
  function num(x) { var r = Math.round(x * 10) / 10; return String(r).replace('.', t('dec')); }
  function hrs(x) { return t('hours', { h: num(x) }); }
  function pct(p) {
    var v = p * 100;
    if (v >= 99.95 && v < 100) return t('pct', { p: '> ' + num(99.9) });
    return t('pct', { p: (v > 0 && v < 1) || (v >= 99.5 && v < 100) ? num(v) : String(Math.round(v)) });
  }
  var SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
  function sci(x) {
    if (!x) return '0';
    var e = Math.floor(Math.log10(x) + 1e-9), m = Math.round(x / Math.pow(10, e) * 100) / 100;
    if (m >= 10) { m = m / 10; e += 1; }
    var sup = String(e).split('').map(function (d) { return SUP[Number(d)]; }).join('');
    return String(m).replace('.', t('dec')) + ' ' + t('times') + ' 10' + sup;
  }

  /** Caption parts from t(key) or, with n, t.n(key, n): node placeholders are put back where they land (cloned, so a
      node may appear twice), and *English term* becomes <em lang="en"> (the Croatian term rule, for terms the glossary
      lacks). */
  var MARK = '\u0001';
  function rich(key, vars, n) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var text = n === undefined ? t(key, flat) : t.n(key, n, flat);
    var out = [];
    text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
      if (!bit) return;
      bit.split(MARK).forEach(function (piece, j) {
        if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
        else if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }

  function box(s) { return '[' + s.mdstat.n + '/' + s.mdstat.active + '] [' + s.mdstat.map + ']'; }
  function bandLabel(b) { return t('band', { a: (b - 1) * 10, b: b * 10 }); }
  function failedDisk(s, name) { return s.disks.filter(function (d) { return d.name === name; })[0]; }
  function statusChanged(s, prev, i) { return !!prev && prev.disks[i].status !== s.disks[i].status; }

  // ── stage ──

  function mdstatPre(s, prev) {
    var key = function (line) { return /recovery =/.test(line) ? 'rec' : line.trim().split(/\s+/)[0] === 'md0' ? 'md0' : 'blocks'; };
    var now = L.mdstatLines(s.mdstat).slice(1, -1), was = prev ? L.mdstatLines(prev.mdstat).slice(1, -1) : null;
    var kids = [];
    now.forEach(function (line, i) {
      if (i) kids.push('\n');
      if (!was) { kids.push(line); return; }
      var old = was.filter(function (x) { return key(x) === key(line); })[0];
      if (old === undefined) { kids.push(h('span', { class: 'rr-now' }, line)); return; }
      if (old === line) { kids.push(line); return; }
      var a = line.split(/( +)/), b = old.split(/( +)/);
      a.forEach(function (tok, j) { kids.push(tok.trim() && tok !== b[j] ? h('span', { class: 'rr-now' }, tok) : tok); });
    });
    return h('div', { class: 'rr-md' }, h('h3', null, data('$ cat /proc/mdstat')), h('pre', { translate: 'no' }, kids));
  }

  function stateWord(s) {
    var k = { optimal: 'stOptimal', rebuilding: 'stRebuilding', degraded: 'stDegraded', failed: 'stFailed' }[s.array];
    var cls = s.array === 'failed' ? 'rr-st-bad' : s.array === 'optimal' ? 'rr-st-ok' : 'rr-st-warn';
    return h('span', { class: 'rr-st ' + cls }, (s.array === 'failed' ? '✕ ' : '') + t(k));
  }

  function grid(c) {
    var s = c.state, ev = s.ev, prev = c.prev, n = s.n;
    var thisBand = ev && ev.kind === 'band' ? ev.band : 0;
    var ureAt = {};
    s.ures.forEach(function (u) { ureAt[u.disk + ':' + u.band] = u.result; });

    var status = s.disks.map(function (d, i) {
      return { text: d.status === 'failed' ? 'F' : 'U', now: statusChanged(s, prev, i) };
    });
    var sp0 = s.spare.status;
    var spText = sp0 === 'spare' ? 'S' : sp0 === 'rebuilding' ? '↻' : sp0 === 'in' ? 'U' : '✕';
    status.push(null, { text: spText, now: !!prev && (prev.spare.status !== sp0 || sp0 === 'rebuilding') });
    var rows = [{ id: 'st', label: h('span', null, t('rowStatus')), cells: status,
      aside: h('span', null, h('span', { class: prev && prev.array !== s.array ? 'rr-now' : null }, stateWord(s)),
        sp0 === 'rebuilding' ? h('span', { translate: 'no' }, ' · ' + pct(s.progress)) : null) }];

    for (var b = 1; b <= L.BANDS; b++) {
      var cells = s.disks.map(function (d) {
        var u = ureAt[d.name + ':' + b];
        if (u) return { text: URE, kind: 'fill', c: C_DISK, now: !!(ev && ev.ures.some(function (x) { return x.disk === d.name; }) && b === thisBand) };
        if (d.status === 'failed') return { kind: 'dead' };
        return { kind: 'fill', c: C_DISK };
      });
      var sb = s.spare.bands[b - 1], here = b === thisBand && s.band === b;
      var spCell = !sb ? { kind: 'ghost' } : sb === 'lost' ? { kind: 'bad', now: here } : here ? { kind: 'soft', c: C_SPARE, now: true } : { kind: 'fill', c: C_SPARE };
      cells.push(null, spCell);

      var asides = [];
      if (b === thisBand) ev.fails.forEach(function (f) { asides.push(h('span', { class: 'rr-ev-bad' }, t('asFail', { d: f.disk }))); });
      s.ures.filter(function (u) { return u.band === b; }).forEach(function (u) {
        var k = { fixed: 'asFixed', lost: 'asLost', abort: 'asAbort' }[u.result];
        asides.push(h('span', { class: u.result === 'fixed' ? null : 'rr-ev-bad' }, t(k, { d: u.disk })));
      });
      var parts = [];
      asides.forEach(function (a, i) { if (i) parts.push(' · '); parts.push(a); });
      rows.push({ id: 'b' + b, label: h('span', null, bandLabel(b)), cells: cells,
        aside: parts.length ? h('span', null, parts) : '',
        spans: b === thisBand ? [{ from: 0, len: n }] : [] });
    }

    var cols = s.disks.map(function (d) { return d.name; });
    cols.push('', s.spare.name);
    var failed = s.array === 'failed';
    return Simdeck.blockGrid({
      dir: c.dir,
      className: failed ? 'rr-dead' : null,
      title: h('span', null, t('gridTitle'), ' ', data('· raid' + s.level)),
      meta: [failed ? h('span', { class: 'rr-banner' }, '✕ ' + t('failedTitle')) : t('gridMeta')],
      count: { text: data(box(s)), hl: !!prev && box(prev) !== box(s) },
      cols: n + 2,
      cellHeight: '1.6rem',
      colLabels: cols,
      rows: rows
    });
  }

  function card(c) {
    var s = c.state, o = L.norm(c.params);
    var failedName = s.disks[L.FIRST].name;
    var clock = h('div', { class: 'rr-sec' },
      h('h3', null, t('clockTitle')),
      h('div', { class: 'rr-big' + (s.array === 'failed' ? ' rr-bad' : '') }, data(hrs(s.hours))),
      h('div', { class: 'rr-muted' }, c.n ? rich('clockSince', { d: data(failedName) }) : t('clockBefore')));
    var win = h('div', { class: 'rr-sec' },
      h('h3', null, t('windowTitle')),
      Simdeck.blockGrid.meter({ total: o.totalHours, parts: [{ n: Math.min(s.hours, o.totalHours), kind: s.array === 'failed' ? 'bad' : 'fill', c: C_WIN }],
        text: t('windowText', { h: hrs(s.hours), t: hrs(o.totalHours) }) }),
      h('div', { class: 'rr-muted' }, rich('atSpeed', { speed: data(o.speed + ' MB/s'), load: t(o.speed === 200 ? 'loadIdle' : 'loadBusy') })),
      h('div', { class: 'rr-muted' }, t('parityLeft', { k: s.parityLeft, of: o.parity })));
    var rate = o.ureRate === '1e14' ? '10¹⁴' : '10¹⁵';
    var budget = h('div', { class: 'rr-sec' },
      h('h3', null, t('budgetTitle')),
      Simdeck.blockGrid.meter({ total: o.plannedBits, parts: [{ n: s.bitsRead, kind: 'fill', c: C_DISK }] }),
      h('div', { class: 'rr-muted' }, rich('readText', { a: data(sci(s.bitsRead)), b: data(sci(o.plannedBits)) })),
      h('div', { class: 'rr-row' }, h('span', null, t('pAll')), h('b', { translate: 'no' }, pct(o.pUre))),
      h('div', { class: 'rr-row' }, h('span', null, t('pNow')), h('b', { translate: 'no' }, pct(s.pSoFar))),
      h('div', { class: 'rr-muted' }, rich('ureCount', {}, s.ures.length)),
      h('div', { class: 'rr-note' }, rich('specNote', { r: data(rate), kind: t(o.ureRate === '1e14' ? 'disk14' : 'disk15') })));
    return h('div', { class: 'rr-card' }, clock, win, budget);
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'rr' },
      h('div', { class: 'rr-main' }, mdstatPre(c.state, c.prev), grid(c)),
      card(c)));
  }

  // ── captions ──

  /** Whether the same run at 200 MB/s ends with the array alive (no URE or failure stops it first). */
  function idleSurvives(params) {
    var p = Object.assign({}, params, { speed: 200 });
    return Simdeck.stateAt(L, p, L.steps(p)).array !== 'failed';
  }

  function caption(c) {
    var s = c.state, ev = s.ev, o = L.norm(c.params);
    var BOX = code(box(s)), SPARE = data(s.spare.name), LVL = t(s.level === 5 ? 'lvl5' : 'lvl6');
    var WHY = t(s.level === 5 ? 'why5' : 'why6');
    if (!ev) return rich('capStart', { lvl: LVL, disks: t.n('disksN', s.n), size: t('tb', { n: o.sizeTB }), spare: SPARE, box: BOX })
      .concat(sp(rich('capOdds', { bits: data(sci(o.plannedBits)), p: data(pct(o.pUre)) })));
    if (ev.kind === 'fail') {
      return rich('capFail', { d: data(ev.disk), box: BOX, spare: SPARE, bits: data(sci(o.plannedBits)),
        h: hrs(o.totalHours), speed: data(o.speed + ' MB/s') })
        .concat(sp(rich(s.level === 5 ? 'capFail5' : 'capFail6')));
    }
    var out = [];
    var add = function (parts) { out = out.concat(out.length ? sp(parts) : parts); };
    ev.fails.forEach(function (f) {
      var k = f.nth >= 3 ? 'capFail3' : s.level === 5 ? 'capFail2r5' : o.onUre === 'abort' ? 'capFail2r6abort' : 'capFail2r6';
      add(rich(k, { h: hrs(f.hours), d: data(f.disk) }));
      var idle = o.devBytes / 200e6 / 3600;
      if (ev.failed && ev.cause === 'fail' && o.speed !== 200 && f.hours > idle && idleSurvives(c.params)) add(rich('capFailIdle', { t: hrs(idle) }));
    });
    if (ev.failed && ev.cause === 'fail') return out;
    // the parity left is the same for every URE of one band (failures come first), so they share one outcome
    var on = function (u) { return u.disk; };
    var disks = function (list) { return data(list.map(on).filter(function (d, i, a) { return a.indexOf(d) === i; }).join(', ')); };
    var abort = ev.ures.filter(function (u) { return u.result === 'abort'; })[0];
    if (abort) { add(rich('capAbort', { pct: data(pct(s.progress)), d: data(abort.disk), why: WHY })); return out; }
    var alive = s.disks.filter(function (d) { return d.status !== 'failed'; }).length;
    if (ev.done) add(rich('capDone', { h: hrs(s.hours), spare: SPARE, box: BOX }));
    else add(rich('capBand', { band: bandLabel(ev.band), from: t.n('readFrom', alive), spare: SPARE, h: hrs(s.hours) }));
    var fixed = ev.ures.filter(function (u) { return u.result === 'fixed'; }), lost = ev.ures.filter(function (u) { return u.result === 'lost'; });
    if (fixed.length) add(rich('capFixed', { d: disks(fixed), lvl: LVL }, fixed.length));
    if (lost.length) add(rich('capLost', { d: disks(lost), why: WHY }, lost.length));
    if (ev.done) {
      if (s.lostStripes) add(rich('capDoneLost', {}, s.lostStripes));
      var still = s.disks.filter(function (d, i) { return d.status === 'failed' && i !== L.FIRST; });
      if (s.array === 'degraded' && still.length) add(rich('capDoneDegraded', { d: data(still.map(function (d) { return d.name; }).join(', ')) }));
      if (ev.after.length > 1 && s.level === 5) add(rich('capAfter2', { h: hrs(ev.after[0]), h2: hrs(ev.after[1]) }));
      else if (ev.after.length) add(rich('capAfter', { h: hrs(ev.after[0]) }));
    }
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
