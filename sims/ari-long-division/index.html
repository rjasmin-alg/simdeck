<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  var PRESET_KEY = { 'three-digit': 'pThree', 'first-two': 'pFirst', zero: 'pZero', remainder: 'pRem',
    'two-digit': 'pTwo', 'base-2': 'pBin' };
  var MISTAKE_KEY = { none: 'mNone', zero: 'mZero', dropped: 'mDropped' };
  var MISTAKE_TITLE = { zero: 'mtZero', dropped: 'mtDropped' };
  var QUICK = [2, 8, 10, 16];

  var AUDS = P.AUDIENCES;
  var audience = 'teacher';
  var notice = null; // a refused action, said once in the caption

  /** t.parts, but a node that fills two placeholders is cloned for the second ("{q} … pišem {q}"):
      the kit's t.parts returns the same node twice, and appending it again would move it. */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }

  // ── numbers as text (data, translate="no") ──
  /** A numeral, with the base as a subscript when it is not 10 (child view: never). */
  function num(text, b) {
    return h('span', { class: 'ld-num', translate: 'no' }, String(text), b !== 10 && audience !== 'child' ? h('sub', null, String(b)) : null);
  }
  function plain(text) { return h('span', { class: 'ld-num', translate: 'no' }, String(text)); }
  /** A quantity (24, or 1E (30) in base 16): its numeral in the base, the decimal value when it differs. */
  function qtyText(v, b) { var n = L.textOf(v, b); return n === String(v) ? n : n + ' (' + v + ')'; }
  function qty(v, b) { return plain(qtyText(v, b)); }
  function pow(b, k) { return Math.pow(b, k); }
  /** n units of place k: "2 stotice" in base 10 (k ≤ 5), "2 jedinice mjesta ×16" otherwise. */
  function units(b, k, n) { return k === 0 || (b === 10 && k <= 5) ? t.n('u' + k, n) : t.n('uGen', n, { v: pow(b, k) }); }
  /** "the tens digit" of the quotient, for place k. */
  function qPlace(b, k) { return k === 0 || (b === 10 && k <= 5) ? t('qPlace' + k) : t('qPlaceGen', { v: pow(b, k) }); }
  /** A quotient, with its remainder when the remainders are what differs ("10₂, ostatak 0"). */
  function result(qText, r, b, withRest) {
    return withRest ? h('span', null, tp('withRest', { q: num(qText, b), r: num(L.textOf(r, b), b) })) : num(qText, b);
  }
  /** Digits (ones first) as a numeral. */
  function rowText(ds) { return ds.slice().reverse().map(function (d) { return L.DIGITS[d]; }).join(''); }

  function placeLabels(b, W) {
    var out = [], titles = [];
    for (var k = 0; k < W; k++) {
      if (b === 10) { out.push(t('place' + k)); titles.push(t('placeName' + k)); }
      else { out.push(P.power(b, k)); titles.push(t('placeName', { v: pow(b, k) })); }
    }
    return { labels: out, titles: titles };
  }

  /** The paper's geometry: e (divisor digits), right (squares right of the ones: ":", the divisor, "=", the quotient). */
  function geo(plan) {
    var e = plan.D.length;
    return { e: e, right: 2 + e + plan.Q, qAt: function (i) { return -3 - e - i; } };
  }

  /** The line "846:3=28": cells by place from −right; written quotient digits from quot, each a cell (or a string). */
  function lineRow(plan, quotCells) {
    var G = geo(plan);
    var cells = [];
    for (var k = -G.right; k < plan.n; k++) cells.push(null);
    var put = function (k, c) { cells[k + G.right] = c; };
    plan.A.forEach(function (d, j) { put(plan.n - 1 - j, L.DIGITS[d]); });
    put(-1, ':');
    plan.D.forEach(function (d, j) { put(-2 - j, L.DIGITS[d]); });
    put(-2 - G.e, '=');
    quotCells.forEach(function (c, i) { put(G.qAt(i), c); });
    return { at: -G.right, cells: cells };
  }

  /** Row i + 1 of the working: the remainder (ones first) ending at end, the digit brought down at end − 1. */
  function workRow(end, rest, down) {
    var cells = [down].concat(rest || []);
    return { at: end - 1, cells: cells };
  }

  // ── the paper (kit view K5) ──
  function paper(c, plan) {
    var s = c.state, b = c.params.base;
    var G = geo(plan);
    var quotCells = s.quot.map(function (q, i) {
      return { text: L.DIGITS[q], now: s.phase === 'ask' && s.i === i, label: t('cellQuot', { v: L.DIGITS[q] }) };
    });
    var rows = [lineRow(plan, quotCells)];
    plan.steps.forEach(function (st, i) {
      var r = s.rows[i];
      // a row not written yet keeps its height with a blank square (an empty row would collapse)
      if (!r.rest) { rows.push({ cells: [' '] }); return; }
      var restText = rowText(r.rest);
      var rest = r.rest.map(function (d) {
        return { text: L.DIGITS[d], now: s.phase === 'sub' && s.i === i, label: t('cellRest', { v: restText }) };
      });
      var down = r.down == null ? null : { text: L.DIGITS[r.down], now: s.phase === 'down' && s.i === i, label: t('cellDown', { v: L.DIGITS[r.down] }) };
      var row = workRow(st.end, rest, down);
      if (i === plan.Q - 1) row.kind = 'result';
      rows.push(row);
    });
    // the band: what this step works on
    var band = [];
    if (s.phase !== 'start') {
      var st = plan.steps[s.i];
      var numRow = s.i === 0 ? 0 : s.i;
      // the number divided: on the line (digit 0) or the remainder before it and the digit brought down
      var numLo = st.end, numHi = s.i === 0 ? plan.n - 1 : st.end + L.digitsOf(plan.steps[s.i - 1].rest, b).length;
      if (s.phase === 'ask' || s.phase === 'sub') {
        var to = s.phase === 'sub' ? s.i + 1 : numRow;
        for (var k = numLo; k <= numHi; k++) band.push({ k: k, from: numRow, to: to });
        for (var j = 0; j < G.e; j++) band.push({ k: -2 - j, from: 0, to: 0 });
        band.push({ k: G.qAt(s.i), from: 0, to: 0 });
      } else {
        band.push({ k: st.end - 1, from: 0, to: s.i + 1 });
      }
    }
    var pl = placeLabels(b, plan.n);
    return P({
      cols: plan.n, right: G.right, big: audience === 'child', label: t('paper'),
      places: pl.labels, placeTitles: pl.titles, band: band, rows: rows
    });
  }

  // ── "how many times?": the multiples of the divisor, and what is divided so far ──
  function whyBox(c, plan) {
    var p = c.params, s = c.state, b = p.base;
    // the question of this step: ask and sub answer digit i; at the start and after a bring-down the next one is asked
    var asking = s.phase === 'start' || s.phase === 'down';
    var j = s.phase === 'start' ? 0 : s.phase === 'down' ? s.i + 1 : s.i;
    var st = plan.steps[j];
    var kids = [h('div', { class: 'ld-head' },
      h('span', null, tp('boxTitle', { d: plain(L.textOf(plan.d, b)), n: plain(L.textOf(st.num, b)) })),
      h('span', { class: 'ld-small' }, asking ? t('boxNext') : b !== 10 ? t('boxInBase', { b: b }) : ''))];
    // the question lists every digit's multiple, unmarked (stopping at q + 1 would give the answer away);
    // the answer stops at the first that is too big, each marked ✓ or ✗ (and struck): never colour alone
    var ms = asking
      ? Array.apply(null, Array(b - 1)).map(function (x, i) { return { k: i + 1, value: (i + 1) * plan.d }; })
      : L.multiplesOf(p, j);
    if (!asking && st.q === 0) ms = [{ k: 0, value: 0, fits: true }].concat(ms);
    kids.push(h('div', { class: 'ld-mult', role: 'img', 'aria-label': t('boxLabel') },
      ms.map(function (m) {
        var cur = !asking && m.k === st.q;
        return h('div', { class: cur ? 'ld-cur' : null, dataset: asking ? {} : { fit: m.fits ? 'yes' : 'no' } },
          h('span', { translate: 'no' }, L.DIGITS[m.k] + '·' + L.textOf(plan.d, b) + '='),
          h('span', { class: 'ld-v', translate: 'no' }, L.textOf(m.value, b)),
          asking ? null : h('span', { class: 'ld-mark', 'aria-label': m.fits ? t('boxFits') : t('boxTooBig') }, m.fits ? '✓' : '✗'));
      })));
    if (!asking) kids.push(h('div', { class: 'ld-small' }, t('boxKey')));
    if (s.phase === 'sub') {
      kids.push(h('div', { class: 'ld-rest' }, tp('boxRest', { n: plain(L.textOf(st.num, b)), p: plain(L.textOf(st.prod, b)),
        r: plain(L.textOf(st.rest, b)), d: plain(L.textOf(plan.d, b)) })));
    }
    // the invariant: dividend = divisor · divided + still to divide, after the last subtraction
    var inv = L.invariantOf(p, s.phase === 'start' ? -1 : s.phase === 'ask' ? s.i - 1 : s.i);
    kids.push(h('div', { class: 'ld-inv' },
      h('div', { class: 'ld-small' }, t('invHead')),
      h('div', { class: 'ld-invline' + (c.last ? ' ld-done' : ''), translate: 'no' },
        L.textOf(plan.a, b) + ' = ' + L.textOf(plan.d, b) + ' · ' + L.textOf(inv.done, b) + ' + ' + L.textOf(inv.left, b)),
      h('div', { class: 'ld-small' }, t('invNames'))));
    return h('section', { class: 'ld-box ld-why' }, kids);
  }

  // ── the typical mistake, teacher view ──
  function mistakeCard(c, plan) {
    var p = c.params, s = c.state, b = p.base;
    var m = L.mistakeOf(p, p.mistake);
    var written = s.quot.length;
    // the wrong quotient as far as the right one is written: zero leaves out the 0s, dropped has its own digits
    var wrongQ = p.mistake === 'zero'
      ? plan.quot.slice(0, written).filter(function (q, j) { return m.keep[j]; })
      : m.quot.slice(0, written);
    var quotCells = wrongQ.map(function (q, j) {
      var text = L.DIGITS[q];
      // compared from the left, as written after "=" (the model's differs)
      return m.differs[j] ? { text: text, x: 'wrong', label: t('wrongCell', { w: text }) } : text;
    });
    var rows = [lineRow(plan, quotCells)];
    plan.steps.forEach(function (st, i) {
      if (!s.rows[i].rest) { rows.push({ cells: [' '] }); return; }
      var ws = m.steps[i];
      var lastRow = i === plan.Q - 1;
      var badRest = lastRow && m.remainder !== plan.remainder;
      var leftBehind = p.mistake === 'dropped' && !lastRow && ws.rest > 0 && s.rows[i].down != null;
      var rest = L.digitsOf(ws.rest, b).map(function (d) {
        var text = L.DIGITS[d];
        // dropped: the remainder is left behind (struck in ink) and the next number is the digit alone
        if (badRest) return { text: text, x: 'wrong', label: t('wrongCell', { w: text }) };
        return leftBehind ? { text: text, x: true } : text;
      });
      var down = s.rows[i].down == null ? null : L.DIGITS[s.rows[i].down];
      var row = workRow(st.end, rest, down);
      if (i === plan.Q - 1) row.kind = 'result';
      rows.push(row);
    });
    var pap = P({ cols: plan.n, right: geo(plan).right, label: t('mtHead'), rows: rows });
    var text = [];
    if (c.last && !m.same) {
      text.push(h('p', { class: 'ld-mres' }, h('span', { class: 'ld-bad' }, result(m.text, m.remainder, b, m.remainder !== plan.remainder)), ' ',
        tp('mtInstead', { res: result(m.rightText, plan.remainder, b, m.remainder !== plan.remainder) })));
      text.push(h('p', null, tp('mtCheck', { q: plain(m.text), d: plain(L.textOf(plan.d, b)), r: plain(L.textOf(m.remainder, b)),
        c: plain(L.textOf(m.check, b)), a: plain(L.textOf(plan.a, b)) })));
    }
    var why;
    if (m.same) why = t(m.kind === 'zero' ? 'sameZero' : 'sameDropped');
    else if (m.kind === 'zero') {
      why = tp('whyZero', { n: plain(L.textOf(m.first.num, b)), d: plain(L.textOf(plan.d, b)), pw: qPlace(b, m.first.end) });
    } else {
      var f = m.first, k = f.end;
      why = tp('whyDropped', { r: plain(L.textOf(f.rest, b)), ru: units(b, k, f.rest), rdu: units(b, k - 1, f.rest * b),
        xu: units(b, k - 1, f.down), right: plain(L.textOf(f.right, b)), wrong: plain(L.textOf(f.wrong, b)), d: plain(L.textOf(plan.d, b)) });
    }
    text.push(h('p', { class: 'ld-mwhy' }, why));
    return h('section', { class: 'ld-box ld-mc' },
      h('div', { class: 'ld-head' }, h('span', null, t('mtHead')), h('span', { class: 'ld-small' }, t(MISTAKE_TITLE[m.kind]))),
      h('div', { class: 'ld-paperbox sd-paper-box' }, pap),
      h('div', { class: 'ld-mtext' }, text));
  }

  // ── what the stage shows ──
  function render(c) {
    var p = c.params;
    var plan = L.planOf(p);
    var showWhy = audience !== 'child' && p.why;
    var showMistake = audience === 'teacher' && p.mistake !== 'none';
    var side = [];
    if (showWhy) side.push(whyBox(c, plan));
    if (showMistake) side.push(mistakeCard(c, plan));
    var kids = [h('section', { class: 'ld-box ld-paper' }, h('div', { class: 'ld-paperbox sd-paper-box' }, paper(c, plan)))];
    if (side.length) kids.push(h('div', { class: 'ld-side' }, side));
    c.stage.replaceChildren(h('div', { class: 'ld', dataset: { aud: audience, side: side.length ? 'yes' : 'none' } }, kids));
    syncPanel(c);
  }

  // ── captions ──
  function caption(c) {
    var p = c.params, s = c.state, b = p.base;
    var plan = L.planOf(p);
    var X = audience === 'teacher' ? 'T' : audience === 'adult' ? 'A' : 'C';
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    if (notice) { addHl(tp('cRefused', { b: plain(notice.b), why: notice.why })); notice = null; }
    var dT = function () { return plain(L.textOf(plan.d, b)); };
    var expr = function () { return h('span', null, num(L.textOf(plan.a, b), b), ' : ', num(L.textOf(plan.d, b), b)); };

    if (s.phase === 'start') {
      if (X === 'A') add(tp('cStartA', { b: plain(b) }));
      else add(tp('cStart' + X, { expr: expr(), d: dT() }));
      return out;
    }
    var st = plan.steps[s.i];
    var nT = function () { return plain(L.textOf(st.num, b)); };
    if (s.phase === 'ask') {
      var all = plan.Q === 1 && st.q === 0;
      if (all) add(tp(X === 'C' ? 'askZeroC' : 'askAll' + X, { n: nT(), d: dT() }));
      else if (s.i > 0 && st.q === 0) {
        add(tp('askZero' + X, { n: nT(), d: dT(), nu: units(b, st.end, st.num), pw: qPlace(b, st.end) }));
        if (X === 'T' && p.mistake === 'zero') add(tp('cMZero'));
      } else {
        if (s.i === 0 && plan.g > 1) {
          var lead = Math.floor(st.num / b);
          add(tp('askFirst' + X, { lead: plain(L.textOf(lead, b)), d: dT(), n: nT(), nu: units(b, st.end, st.num) }));
        }
        if (X === 'A') {
          add(tp('askA', { nu: units(b, st.end, st.num), d: dT(), qu: units(b, st.end, st.q), q: qty(st.q, b), p: plain(L.textOf(st.prod, b)),
            n: nT(), q1: qty(st.q + 1, b), p1: plain(L.textOf((st.q + 1) * plan.d, b)) }));
        } else add(tp('ask' + X, { n: nT(), d: dT(), q: plain(L.DIGITS[st.q]) }));
      }
    } else if (s.phase === 'sub') {
      var args = { q: plain(L.DIGITS[st.q]), d: dT(), p: plain(L.textOf(st.prod, b)), n: nT(), r: plain(L.textOf(st.rest, b)),
        nu: units(b, st.end, st.num), ru: units(b, st.end, st.rest), pu: units(b, st.end, st.prod) };
      if (X === 'T') add(tp(s.i === plan.Q - 1 ? 'subLastT' : 'subT', args));
      else add(tp(st.q === 0 ? 'subZero' + X : 'sub' + X, args));
    } else if (s.phase === 'down') {
      var k = st.end - 1, mv = st.rest * b + st.down;
      if (X === 'A') {
        add(tp(st.rest === 0 ? 'downZeroA' : 'downA', { ru: units(b, st.end, st.rest), rdu: units(b, k, st.rest * b),
          xu: units(b, k, st.down), mu: units(b, k, mv) }));
      } else add(tp('down' + X, { x: plain(L.DIGITS[st.down]), m: plain(L.textOf(st.rest, b) + L.DIGITS[st.down]) }));
      if (X === 'T' && p.mistake === 'dropped') {
        var md = L.mistakeOf(p, 'dropped');
        if (md.first && md.first.i === s.i) add(tp('cMDropped', { r: plain(L.textOf(st.rest, b)), x: plain(L.DIGITS[st.down]) }));
      }
    }
    if (c.last) {
      var qN = function () { return num(L.textOf(plan.quotient, b), b); };
      var rN = function () { return num(L.textOf(plan.remainder, b), b); };
      if (X === 'C') addHl(tp(plan.remainder ? 'cDoneRC' : 'cDoneC', { q: qN(), r: rN() }));
      else {
        addHl(tp(plan.remainder ? 'cResultT' : 'cResultT0', { expr: expr(), q: qN(), r: rN() }));
        add(tp('cCheck', { q: plain(L.textOf(plan.quotient, b)), d: dT(), r: plain(L.textOf(plan.remainder, b)), a: plain(L.textOf(plan.a, b)) }));
        if (b !== 10) add(tp('cDecimal', { expr: plain(plan.a + ' : ' + plan.d), q: plain(plan.quotient), r: plain(plan.remainder) }));
        if (b === 2) add(tp('cBinary'));
        if (X === 'T' && p.mistake !== 'none') {
          var me = L.mistakeOf(p, p.mistake);
          if (!me.same) {
            var rd = me.remainder !== plan.remainder;
            add(tp('cMEnd', { wrong: result(me.text, me.remainder, b, rd), res: result(L.textOf(plan.quotient, b), plan.remainder, b, rd) }));
          }
        }
      }
    }
    return out;
  }

  // ── the panel: the numbers field and the quick bases; the header: the audience switch ──
  var field = null, quick = null;
  function fieldText(p) { return L.numbersOf(p).map(function (v) { return L.textOf(v, p.base); }).join(' : '); }
  function buildNumbers() {
    var host = document.querySelector('[data-ld-numbers]');
    var label = h('label', { class: 'sd-ctl-label', for: 'ld-nums' }, h('span', null, ''));
    var input = h('input', { id: 'ld-nums', type: 'text', class: 'ld-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', title: t('numsHint'), 'aria-describedby': 'ld-nums-msg' });
    // the hint is the field's tooltip; the line under it shows only a refusal (the panel must fit at 1920×1080)
    var msg = h('small', { class: 'sd-hint', id: 'ld-nums-msg', role: 'status' }, '');
    var keyOf = { digit: 'errDigit', long: 'errLong', count: 'errCount', empty: 'errEmpty', zero: 'errZero' };
    function clear() { input.removeAttribute('aria-invalid'); msg.textContent = ''; msg.className = 'sd-hint'; }
    input.addEventListener('input', function () {
      var r = L.parseList(input.value, sim.params.base);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t(keyOf[r.error], { at: r.at, b: sim.params.base });
        msg.className = 'ld-err';
        return;
      }
      clear();
      sim.set(L.paramsFor(r.values));
      sim.first();
    });
    // Enter or Esc hands the keys back to the clicker
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { clear(); sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('numsTitle') },
      h('div', { class: 'ld-field' }, label, input, msg)));
    field = { input: input, label: label.firstChild, msg: msg, clear: clear };
  }
  function buildQuick() {
    var wrap = document.querySelector('[data-sd-controls] [data-key="base"]');
    if (!wrap) return;
    quick = QUICK.map(function (qb) {
      return noFocus(h('button', { type: 'button', 'aria-pressed': 'false', onclick: function () { pickBase(qb); } }, String(qb)));
    });
    wrap.append(h('div', { class: 'sd-seg ld-quick', role: 'group', 'aria-label': t('baseQuick'), title: t('baseHint') }, quick));
  }
  function tooLong(nb, p) {
    var v = L.numbersOf(p);
    if (L.fitsIn(v, nb)) return null;
    var bad = L.digitsOf(v[0], nb).length > L.MAX_DIVIDEND ? v[0] : v[1];
    return t('baseTooLong', { b: nb, num: L.textOf(bad, p.base) });
  }
  function pickBase(nb) {
    var why = tooLong(nb, sim.params);
    if (why) { notice = { b: nb, why: why }; sim.render(); return; }
    sim.set({ base: nb });
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    AUDS.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints,
      onChange: function (a) { audience = a; enforceChild(); sim.render(); } });
    audience = ctl.value;
  }
  /** The child view works in base 10 only. */
  function enforceChild() {
    if (audience !== 'child' || sim.params.base === 10) return;
    if (L.fitsIn(L.numbersOf(sim.params), 10)) sim.set({ base: 10 });
    else sim.set(Object.assign(L.paramsFor(L.numbersOf(L.defaults)), { base: 10 }));
  }

  function syncPanel(c) {
    var p = c.params;
    if (field) {
      field.label.textContent = t('numsLabel', { b: p.base });
      var shown = L.parseList(field.input.value, p.base);
      var same = !shown.error && shown.values.join(',') === L.numbersOf(p).join(',');
      // typing keeps its text; a preset or a base change under a focused field rewrites it and clears an error
      if (document.activeElement !== field.input || !same) {
        if (document.activeElement !== field.input || !field.input.getAttribute('aria-invalid')) {
          field.input.value = fieldText(p);
          field.clear();
        }
      }
    }
    if (quick) {
      quick.forEach(function (btn, i) {
        var why = tooLong(QUICK[i], p);
        btn.setAttribute('aria-pressed', String(p.base === QUICK[i]));
        btn.setAttribute('aria-disabled', why ? 'true' : 'false');
        btn.title = why || '';
      });
    }
  }

  buildAudience();
  buildNumbers();

  var NAMED = { 2: 'baseName2', 8: 'baseName8', 10: 'baseName10', 16: 'baseName16' };
  var hiddenRange = function (key, min, max) {
    return { key: key, type: 'range', label: t('numsTitle'), value: L.defaults[key], min: min, max: max, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'base', type: 'range', label: t('base'), value: L.defaults.base, min: function (p) { return Math.min(L.MAX_BASE, L.minBase(L.numbersOf(p))); }, max: L.MAX_BASE,
        format: function (v) { return NAMED[v] ? v + ' (' + t(NAMED[v]) + ')' : String(v); },
        visible: function () { return audience !== 'child'; } },
      { key: 'why', type: 'toggle', label: t('why'), value: L.defaults.why,
        visible: function () { return audience !== 'child'; } },
      { key: 'mistake', type: 'select', label: t('mistake'), value: L.defaults.mistake,
        options: L.MISTAKES.map(function (m) { return [m, t(MISTAKE_KEY[m])]; }),
        visible: function () { return audience === 'teacher'; } },
      // the numbers: set from the field above, kept here so the URL and the language switch carry them
      hiddenRange('a', 0, L.MAX_A), hiddenRange('b', 1, L.MAX_B)
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t(PRESET_KEY[pr.id]), hint: t(PRESET_KEY[pr.id] + 'Hint'), params: pr.params };
    }),

    legend: [
      { shape: 'pc-band', label: t('legBand') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
  buildQuick();
  // a URL value the kit clamped to the range (?a=Infinity) may not fit the base: keep the quantity the page shows
  var nn = L.numbersOf(sim.params);
  if (nn[0] !== sim.params.a || nn[1] !== sim.params.b) sim.set(L.paramsFor(nn));
  sim.on(function (c) { if (audience === 'child' && c.params.base !== 10) enforceChild(); });
  enforceChild();
  sim.render();
})();
</script>
</body>
</html>
