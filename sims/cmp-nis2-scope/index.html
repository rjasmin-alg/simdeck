<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var N = window.SimdeckModels.nis2;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var sim = null;
  var last = null;                                    // the state drawn last, for the changed marks (SPEC rule 10)
  var P = {};                                         // the params of the state being drawn

  function int(x) { return new Intl.NumberFormat(LOCALE).format(x); }
  function eur(x) { return t('eurM', { v: new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 1 }).format(x / 1e6) }); }
  function b(text) { return h('b', null, String(text)); }
  function low(x) { return x.charAt(0).toLowerCase() + x.slice(1); }

  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to the same button

  // ── the organisation: rulers on a log scale ──

  var RULERS = [
    { key: 'staff', label: 'rStaff', min: 2, max: 5000, cuts: N.CEILINGS.map(function (c) { return c.staff; }), strict: true },
    { key: 'turnover', label: 'rTurnover', min: 3e5, max: 2.5e9, cuts: N.CEILINGS.map(function (c) { return c.turnover; }), strict: false },
    { key: 'balance', label: 'rBalance', min: 3e5, max: 2.5e9, cuts: N.CEILINGS.map(function (c) { return c.balance; }), strict: false }
  ];
  function pos(r, v) { return 100 * Math.log(v / r.min) / Math.log(r.max / r.min); }
  /** The zone a single figure falls in: staff at a cut is over it ("fewer than"), money at a cut is within. */
  function zoneOf(r, v) { return r.cuts.filter(function (c) { return r.strict ? v >= c : v > c; }).length; }

  function ruler(r, s) {
    var v = s[r.key], z = zoneOf(r, v), edges = [0].concat(r.cuts.map(function (c) { return pos(r, c); }), [100]);
    var zones = N.SIZES.map(function (id, k) {
      return h('div', { class: 'ns-zone', dataset: { z: String(k), on: String(k === z) }, style: { width: (edges[k + 1] - edges[k]) + '%' } },
        h('span', null, t('z_' + id)));
    });
    var x = pos(r, v);
    r.cuts.forEach(function (c) { if (c === v) x += (r.strict ? 1 : -1); });   // a value on a cut sits inside its own zone
    var fmt = r.key === 'staff' ? int : eur;
    var ticks = r.cuts.map(function (c) {
      return h('span', { class: 'ns-tick ns-num', style: { left: pos(r, c) + '%' } }, r.key === 'staff' ? int(c) : int(c / 1e6));
    });
    return h('div', null,
      h('div', { class: 'ns-rl' }, h('span', null, t(r.label)), h('b', { class: 'ns-num' }, fmt(v))),
      h('div', { class: 'ns-track', role: 'img', 'aria-label': t(r.label) + ': ' + fmt(v) + ', ' + low(t('z_' + N.SIZES[z])) },
        zones, h('span', { class: 'ns-mark', style: { left: x + '%' } })),
      h('div', { class: 'ns-ticks', 'aria-hidden': 'true' }, ticks));
  }

  function ceilLine(s) {
    var k = Math.min(s.size, 2), c = N.CEILINGS[k], w = s.ceilings[k];
    function part(key, vars, ok) { return h('span', { class: 'ns-t', dataset: { ok: String(ok) }, 'aria-label': t(key, vars) + ': ' + t(ok ? 'yes' : 'no') }, t(key, vars)); }
    return h('span', { class: 'ns-ceil' },
      t(s.size === 3 ? 'ceilOver' : 'ceil' + k), ' ',
      part('ceilStaff', { n: int(c.staff) }, w.staff), ' ', t('and'), ' (',
      part('ceilTurnover', { v: eur(c.turnover) }, w.turnover), ' ', t('or'), ' ',
      part('ceilBalance', { v: eur(c.balance) }, w.balance), ')');
  }

  function organisation(s, ch) {
    return h('div', { class: 'ns-col' },
      h('p', { class: 'ns-head' }, t('headOrg')),
      h('div', { class: 'ns-sector' },
        h('p', { class: 'ns-sname' }, t('s_' + s.sector)),
        h('span', { class: 'ns-tag', dataset: { g: s.group } }, t('g_' + s.group))),
      h('div', { class: 'ns-rulers' }, RULERS.map(function (r) { return ruler(r, s); })),
      h('div', { class: 'ns-size' + (ch.size ? ' sd-changed' : '') },
        h('span', { class: 'ns-head' }, t('headSize')),
        h('span', { class: 'ns-sword' }, t('zw_' + s.sizeId)),
        ceilLine(s)));
  }

  // ── the scope table ──

  function rowHead(row, ch) {
    var cls = 'ns-rh' + (ch.rows.indexOf(row.id) >= 0 ? ' sd-changed' : '');
    if (row.kind === 'role') {
      var on = P[row.id] === true;
      return h('button', {
        type: 'button', class: cls, onmousedown: noFocus, 'aria-pressed': String(on), dataset: { sel: row.id, on: String(row.applies), idle: String(row.idle) },
        onclick: function (e) { refocus = e.detail === 0 ? row.id : null; var o = {}; o[row.id] = !on; sim.set(o); }
      }, h('span', { class: 'ns-box', 'aria-hidden': 'true' }), h('span', null, t('r_' + row.id)));
    }
    return h('div', { class: cls, dataset: { on: String(row.applies) } },
      h('span', { class: 'ns-dot', 'aria-hidden': 'true' }), h('span', null, t('r_' + row.id)));
  }

  function table(s, ch) {
    var kids = [h('span', { class: 'ns-head' }, t('colRow'))];
    N.SIZES.forEach(function (id, k) {
      kids.push(h('span', { class: 'ns-ch', dataset: { on: String(k === s.size) } },
        h('span', { class: 'ns-long' }, t('z_' + id)), h('span', { class: 'ns-short' }, t('zs_' + id))));
    });
    s.rows.forEach(function (row, j) {
      if (j === 0) kids.push(h('p', { class: 'ns-sub' }, t('groupSector')));
      if (row.kind === 'role' && s.rows[j - 1].kind === 'sector') kids.push(h('p', { class: 'ns-sub' }, t('groupRoles')));
      kids.push(rowHead(row, ch));
      row.cells.forEach(function (c, k) {
        var cls = N.CLASSES[c], hit = row.applies && k === s.size;
        kids.push(h('div', {
          class: 'ns-cell', role: 'img', 'aria-label': t('cellLabel', { row: t('r_' + row.id), size: t('z_' + N.SIZES[k]), cls: t('cl_' + cls) }),
          dataset: { c: cls, on: String(row.applies), hit: String(hit && c > 0), decide: String(hit && s.decider === row.id) }
        }, h('span', null, t('c_' + cls))));
      });
    });
    kids.push(h('div', { class: 'ns-colmark', style: { '--col': String(s.size) }, 'aria-hidden': 'true' }));
    return h('div', { class: 'ns-table' }, kids);
  }

  function verdict(s, ch) {
    var why = s.cls === 'out' ? t('outBy_' + s.outWhy) : t('decidedBy', { row: t('r_' + s.decider), size: low(t('z_' + s.sizeId)) });
    return h('div', { class: 'ns-v' + (ch.cls ? ' sd-changed' : ''), dataset: { c: s.cls } },
      h('span', { class: 'ns-vicon', 'aria-hidden': 'true' }, t('c_' + s.cls)),
      h('span', null, h('span', { class: 'ns-vword' }, t('cl_' + s.cls)), h('span', { class: 'ns-vwhy' }, why)));
  }

  // ── what follows ──

  function follows(s) {
    var K = ['essential', 'important'];
    var mine = K.indexOf(s.cls);
    var kids = K.map(function (c) { return h('p', { class: 'ns-you' }, c === s.cls ? t('youHere') : ''); });
    kids = kids.concat(K.map(function (c) { return h('p', { class: 'ns-kh', dataset: { c: c } }, t('cl_' + c)); }));
    kids.push(h('p', { class: 'ns-rowh' }, t('fSup')));
    kids.push(h('p', { class: 'ns-k' }, t('supE')), h('p', { class: 'ns-k' }, t('supI')));
    kids.push(h('p', { class: 'ns-rowh' }, t('fObl')));
    kids.push(h('p', { class: 'ns-both' }, t('oblBoth')));
    kids.push(h('p', { class: 'ns-rowh' }, t('fFine')));
    kids.push(h('p', { class: 'ns-k' }, t('fineE')), h('p', { class: 'ns-k' }, t('fineI')));
    kids.push(h('p', { class: 'ns-rowh' }, t('fFineOrg', { t: eur(s.turnover) })));
    if (s.publicBody) kids.push(h('p', { class: 'ns-both' }, t('publicFine')));
    else {
      K.forEach(function (c) {
        var f = s.fines[c];
        kids.push(h('p', { class: 'ns-k' },
          h('span', { class: 'ns-big ns-num' }, eur(f.ceiling)),
          f.by === 'pct' ? t('byPct', { p: t(c === 'essential' ? 'pctE' : 'pctI') }) : t('byFixed')));
      });
    }
    kids.push(h('p', { class: 'ns-rowh' }, t('fMgr')));
    if (s.publicBody) kids.push(h('p', { class: 'ns-both' }, t('mgrPublic')));
    else kids.push(h('p', { class: 'ns-k' }, t('mgrE')), h('p', { class: 'ns-k' }, t('mgrI')));
    if (mine >= 0) kids.push(h('div', { class: 'ns-cmark', style: { '--col': String(mine) }, 'aria-hidden': 'true' }));
    return h('div', { class: 'ns-col' },
      h('p', { class: 'ns-head' }, t('headFollows')),
      s.cls === 'out' ? h('p', { class: 'ns-out' }, t('outBox')) : null,
      h('div', { class: 'ns-cmp', dataset: { out: String(s.cls === 'out') } }, kids));
  }

  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    var ch = L.flipped(last, s);
    last = s;
    P = s.p;
    c.stage.replaceChildren(h('div', { class: 'ns' },
      organisation(s, ch),
      h('div', { class: 'ns-col' }, h('p', { class: 'ns-head' }, t('headScope')), table(s, ch), verdict(s, ch)),
      follows(s),
      h('p', { class: 'ns-foot' }, t('foot'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s);
    var cls = function (x) { return b(low(t('cl_' + x))); };
    var size = t('zw_' + s.sizeId);
    var out = t.parts(k.key, { cls: cls(s.cls), size: Simdeck.lang === 'en' ? low(size) : size });   // en: 'A {size}'
    k.notes.forEach(function (key) {
      out.push(' ');
      var target = key.indexOf('nUp') === 0 ? s.byCol[s.up] : key.indexOf('nDown') === 0 ? s.byCol[s.down] : null;
      out = out.concat(t.parts(key, { cls: target ? cls(target) : '' }));
    });
    return out;
  }

  var hidden = function () { return false; };
  var labels = { water: 'pWater', msp: 'pMsp', machines: 'pMachines', shop: 'pShop', dns: 'pDns', agency: 'pAgency' };
  var params = [
    { key: 'sector', type: 'select', label: t('pSector'),
      options: L.SECTORS.map(function (x) { return [x[0], t('s_' + x[0]) + ' · ' + t('gs_' + x[1])]; }) },
    { key: 'staff', type: 'range', label: t('pStaff'), min: 0, max: L.LADDERS.staff.length - 1, step: 1,
      format: function (v) { return int(L.LADDERS.staff[v]); } },
    { key: 'turnover', type: 'range', label: t('pTurnover'), min: 0, max: L.LADDERS.turnover.length - 1, step: 1,
      format: function (v) { return eur(L.LADDERS.turnover[v]); } },
    { key: 'balance', type: 'range', label: t('pBalance'), min: 0, max: L.LADDERS.balance.length - 1, step: 1,
      format: function (v) { return eur(L.LADDERS.balance[v]); } }
  ].concat(N.ROLES.map(function (r) { return { key: r, type: 'toggle', label: t('r_' + r), visible: hidden }; }));

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'ns-e', label: t('legE') },
      { shape: 'ns-i', label: t('legI') },
      { shape: 'ns-out', label: t('legOut') },
      { shape: 'ns-ring', label: t('legDecide') },
      { shape: 'ns-col', label: t('legCol') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
