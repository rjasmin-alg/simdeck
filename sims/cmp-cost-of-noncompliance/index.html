<!-- cmp-cost-of-noncompliance: the fine ceiling is the higher of a fixed sum and a share of worldwide yearly turnover,
     so for a large firm the percentage decides and for a small one the fixed sum; the expected yearly cost is incident
     likelihood × (incident cost + chance of a fine × fine), compared with what the measures cost each year; under NIS2
     the management body answers for the measures.
     The stage: left, a log-log chart of the ceiling against turnover (fixed sum dashed, percentage dotted, the ceiling
     as the thick upper envelope, the whole turnover as a thin line, the firm as a dot) and the same turnover under the
     three regimes; right, two stacked bars of the expected yearly cost without and with the measures, each with its
     formula filled in, the verdict, and who answers under the chosen regime.
     Model: fines.js and sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var NS = 'http://www.w3.org/2000/svg';

  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function dec(x, d) { return new Intl.NumberFormat(LOCALE, { maximumFractionDigits: d }).format(x); }
  function pct(x) { return new Intl.NumberFormat(LOCALE, { style: 'percent', maximumFractionDigits: 1 }).format(x); }
  /** whole euros, grouped */
  function eur(n) { return t('eur', { n: dec(n, 0) }); }
  /** short euros for axes and options: 50 tis. €, 2,5 mil. €, 1 mlrd. € */
  function short(n) {
    if (n >= 1e9) return t('bEur', { n: dec(n / 1e9, 1) });
    if (n >= 1e6) return t('mEur', { n: dec(n / 1e6, 1) });
    if (n >= 1e3) return t('kEur', { n: dec(n / 1e3, 1) });
    return t('eur', { n: dec(n, 0) });
  }
  /** a rate in per mille as a percentage: 40 → 4 %, 14 → 1,4 % */
  function rate(r) { return pct(r / 1000); }
  /** the reduced likelihood and chance of a fine can be quarter-percents: two decimals so the formula adds up */
  function pct2(x) { return new Intl.NumberFormat(LOCALE, { style: 'percent', maximumFractionDigits: 2 }).format(x); }

  function svg(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, String(attrs[k])); });
    return el;
  }

  // ── the chart: log-log, turnover 1 M€ … 10 000 M€, ceiling 10 000 € … 1 000 M€ ──

  var X0 = 6, X1 = 10, Y0 = 4, Y1 = 9, W = 1000, H = 1000;
  function px(v) { return (Math.log10(v) - X0) / (X1 - X0) * W; }
  function py(v) { return H - (Math.log10(v) - Y0) / (Y1 - Y0) * H; }
  function pctX(v) { return px(v) / W * 100; }
  function pctY(v) { return py(v) / H * 100; }
  function line(cls, x1, y1, x2, y2) {
    return svg('line', { class: cls, x1: px(x1), y1: py(y1), x2: px(x2), y2: py(y2), 'vector-effect': 'non-scaling-stroke' });
  }
  function lab(kind, text, left, top, shift) {
    return h('span', { class: 'cn-lab', dataset: { k: kind },
      style: { left: left + '%', top: top + '%', transform: shift || 'translate(-50%, -50%)' } }, text);
  }

  function chart(s) {
    var c = s.ceiling, T = s.turnover;
    var g = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    var e;
    for (e = X0; e <= X1; e++) g.append(line('cn-grid', Math.pow(10, e), Math.pow(10, Y0), Math.pow(10, e), Math.pow(10, Y1)));
    for (e = Y0; e <= Y1; e++) g.append(line('cn-grid', Math.pow(10, X0), Math.pow(10, e), Math.pow(10, X1), Math.pow(10, e)));
    var xc = c.crossover * 1e6, top = c.rate * 1e7;      // the share part at 10 000 M€
    g.append(line('cn-turn', 1e6, 1e6, 1e9, 1e9));
    g.append(line('cn-cross', xc, Math.pow(10, Y0), xc, c.fixed));
    g.append(line('cn-fixed', 1e6, c.fixed, 1e10, c.fixed));
    g.append(line('cn-pct', 1e6, c.rate * 1000, 1e10, top));
    g.append(svg('polyline', { class: 'cn-ceil', 'vector-effect': 'non-scaling-stroke',
      points: [px(1e6), py(c.fixed), px(xc), py(c.fixed), px(1e10), py(top)].join(' ') }));
    g.append(line('cn-drop', T, Math.pow(10, Y0), T, c.ceiling));
    g.append(svg('rect', { class: 'cn-frame', x: 0, y: 0, width: W, height: H, 'vector-effect': 'non-scaling-stroke' }));

    var ticks = [];
    for (e = Y0; e <= Y1; e++) ticks.push(h('span', { class: 'cn-tick cn-num', translate: 'no', dataset: { ax: 'y' }, style: { top: pctY(Math.pow(10, e)) + '%' } }, short(Math.pow(10, e))));
    for (e = X0; e <= X1; e++) {
      ticks.push(h('span', { class: 'cn-tick cn-num', translate: 'no', dataset: { ax: 'x', minor: String(e === 7 || e === 9) },
        style: { left: pctX(Math.pow(10, e)) + '%', transform: e === X1 ? 'translateX(-100%)' : e === X0 ? 'translateX(-15%)' : null } }, short(Math.pow(10, e))));
    }
    var firmLeft = pctX(T), firmTop = pctY(c.ceiling);
    var labels = [
      // the fixed-sum label keeps clear of the firm: at the crossover when the firm sits left, at the left end otherwise
      firmLeft < 45
        ? lab('fixed', t('lnFixed') + ' ' + short(c.fixed), pctX(xc) - 1, pctY(c.fixed), 'translate(-100%, -125%)')
        : lab('fixed', t('lnFixed') + ' ' + short(c.fixed), 2, pctY(c.fixed), 'translate(0, -125%)'),
      lab('pct', t('lnPct', { r: rate(c.rate) }), 97, pctY(top), 'translate(-100%, 20%)'),
      lab('turn', t('lnTurn'), pctX(1.4e6), pctY(1.4e6), 'translate(0.7rem, -30%)'),
      lab('cross', t('lnCross') + ' ' + short(xc), pctX(xc), 96, 'translate(-50%, -100%)'),
      h('span', { class: 'cn-dot', style: { left: firmLeft + '%', top: firmTop + '%' } }),
      lab('firm', short(c.ceiling), firmLeft, firmTop, firmLeft > 70 ? 'translate(-115%, 30%)' : 'translate(25%, 30%)')
    ];
    return h('div', { class: 'cn-cbox', role: 'img',
      'aria-label': t('chartLabel', { f: short(c.fixed), r: rate(c.rate), t: short(T), c: short(c.ceiling) }) },
      g, ticks, labels);
  }

  function compare(s) {
    var head = h('div', { class: 'cn-cr' },
      h('span', { class: 'cn-th' }, t('cmpLaw')), h('span', { class: 'cn-th cn-hide' }, t('cmpFixed')),
      h('span', { class: 'cn-th cn-hide' }, t('cmpPct')), h('span', { class: 'cn-th' }, t('cmpCeil')), h('span', { class: 'cn-th' }, t('cmpFine')));
    var rows = s.compare.map(function (x) {
      return h('div', { class: 'cn-cr', dataset: { chosen: String(x.chosen) } },
        h('span', null, t('lawShort_' + x.id)),
        h('span', { class: 'cn-num cn-hide' + (x.decides !== 'pct' ? ' cn-win' : '') }, short(x.fixed)),
        h('span', { class: 'cn-num cn-hide' + (x.decides !== 'fixed' ? ' cn-win' : '') }, rate(x.rate) + ' = ' + short(x.pct)),
        h('span', { class: 'cn-num' }, short(x.ceiling), ' ',
          h('span', { class: 'cn-dec' }, '(' + t(x.decides === 'fixed' ? 'dFixed' : x.decides === 'pct' ? 'dPct' : 'dEqual') + ')')),
        h('span', { class: 'cn-num' }, short(x.fine)));
    });
    return [h('p', { class: 'cn-head' }, t('headCmp', { t: short(s.turnover), k: pct(s.p.k / 100) })),
      h('div', { class: 'cn-cmp' }, head, rows)];
  }

  // ── the costs ──

  function seg(kind, v, max) {
    return v > 0 ? h('span', { class: 'cn-seg', dataset: { seg: kind }, style: { width: (v / max * 100) + '%' } }) : null;
  }
  function part(kind, label, v) {
    return h('span', null, h('span', { class: 'cn-sw', dataset: { seg: kind } }), label + ' ', b(eur(v)));
  }

  // the model's assumptions, set on the stage (the panel keeps turnover, regime, likelihood and price)
  var qs = [];
  for (var qi = 0; qi <= 100; qi += L.Q_STEP) qs.push(qi);
  function pick(st, key, list, fmt) {
    var cur = st.p[key];
    return h('label', null, t(key),
      h('select', { class: 'sd-select', dataset: { sel: key },
        onchange: function (e) { var patch = {}; patch[key] = Number(e.target.value); refocus = key; sim.set(patch); } },
        list.map(function (v) { return h('option', { value: String(v), selected: String(v) === String(cur) ? '' : null }, fmt(v)); })));
  }

  function costs(s) {
    var x = s.cost, p = s.p, max = Math.max(x.e0, x.t1, 1);
    var without = h('div', { class: 'cn-row' },
      h('div', { class: 'cn-rh' }, h('span', null, t('rowWithout')),
        h('span', { class: 'cn-parts' }, part('inc', t('segInc'), x.inc0), part('fine', t('segFine'), x.fin0)), b(eur(x.e0))),
      h('div', { class: 'cn-bar', 'aria-hidden': 'true' }, seg('inc', x.inc0, max), seg('fine', x.fin0, max)),
      h('p', { class: 'cn-formula', translate: 'no' }, t('formula0', { p: pct(p.p / 100), i: eur(p.inc), q: pct(p.q / 100), f: eur(s.fine), e: eur(x.e0) })));
    var withM = h('div', { class: 'cn-row' },
      h('div', { class: 'cn-rh' }, h('span', null, t('rowWith')),
        h('span', { class: 'cn-parts' }, part('spend', t('segSpend'), x.spend), part('inc', t('segInc'), x.inc1), part('fine', t('segFine'), x.fin1)), b(eur(x.t1))),
      h('div', { class: 'cn-bar', 'aria-hidden': 'true' }, seg('spend', x.spend, max), seg('inc', x.inc1, max), seg('fine', x.fin1, max)),
      h('p', { class: 'cn-formula', translate: 'no' }, t('formula1', { p: pct2(x.p1 / 100), i: eur(p.inc), q: pct2(x.q1 / 100), f: eur(s.fine), s: eur(x.spend), e: eur(x.t1) })));
    var vk = x.verdict === 'worth' ? 'vWorth' : x.verdict === 'even' ? 'vEven' : 'vNot';
    var verdict = h('p', { class: 'cn-verdict', dataset: { v: x.verdict } },
      t.parts(vk, { x: b(eur(x.saved)), s: b(eur(x.spend)), n: b(eur(Math.abs(x.net))) }));
    var asm = h('div', { class: 'cn-asm' }, h('p', { class: 'cn-head' }, t('headAsm')),
      pick(s, 'inc', L.INCS, eur), pick(s, 'q', qs, function (v) { return pct(v / 100); }),
      pick(s, 'k', L.KS, function (v) { return pct(v / 100); }), pick(s, 'eff', L.EFFS, function (v) { return pct(v / 100); }));
    var who = h('div', { class: 'cn-who' }, h('p', { class: 'cn-head' }, t('headWho') + ' · ' + t('law_' + p.law)), h('p', null, t('who_' + p.law)));
    return h('div', { class: 'cn-col' }, h('p', { class: 'cn-head' }, t('headCost')), without, withM, verdict, asm, who);
  }

  var sim = null;
  var refocus = null;                                 // after a stage select changes, focus goes back to it
  function render(c) {
    var s = c.state;
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset.sel;
    c.stage.replaceChildren(h('div', { class: 'cn' },
      h('div', { class: 'cn-col' }, h('p', { class: 'cn-head' }, t('headCeiling')), chart(s), compare(s), h('p', { class: 'cn-foot' }, t('foot'))),
      costs(s)));
    var sel = refocus || had;
    if (sel) {
      var el = c.stage.querySelector('[data-sel="' + sel + '"]');
      if (el) el.focus();
    }
    refocus = null;
  }

  function caption(c) {
    var s = c.state, k = L.captionKey(s), x = s.cost, ce = s.ceiling;
    var out = t.parts(k.ceiling, { F: b(short(ce.fixed)), r: b(rate(ce.rate)), T: b(short(s.turnover)), P: b(short(ce.pct)),
      C: b(short(ce.ceiling)), s: b(pct(ce.share)) });
    out.push(' ');
    out = out.concat(t.parts(k.verdict, { e0: b(eur(x.e0)), e1: b(eur(x.e1)), s: b(eur(x.spend)), t1: b(eur(x.t1)), n: b(eur(Math.abs(x.net))) }));
    k.notes.forEach(function (key) { out.push(' '); out = out.concat(t.parts(key, {})); });
    return out;
  }

  var labels = { 'small-fixed': 'pSmallFixed', 'large-pct': 'pLargePct', crossover: 'pCrossover', 'tiny-firm': 'pTinyFirm', 'break-even': 'pBreakEven' };
  function money(list) { return list.map(function (v) { return [v, short(v)]; }); }

  var hidden = function () { return false; };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'turn', type: 'select', label: t('turn'), options: L.TURNS.map(function (v) { return [v, short(v * 1e6)]; }) },
      { key: 'law', type: 'choice', label: t('law'), options: L.LAW_IDS.map(function (id) { return [id, t('lawBtn_' + id)]; }) },
      { key: 'p', type: 'range', label: t('p'), min: L.P_MIN, max: L.P_MAX, step: 1, format: function (v) { return pct(v / 100); } },
      { key: 'inc', type: 'select', label: t('inc'), options: money(L.INCS), visible: hidden },
      { key: 'q', type: 'range', label: t('q'), min: 0, max: 100, step: L.Q_STEP, format: function (v) { return pct(v / 100); }, visible: hidden },
      { key: 'k', type: 'choice', label: t('k'), options: L.KS.map(function (v) { return [v, pct(v / 100)]; }), visible: hidden },
      { key: 'spend', type: 'select', label: t('spend'), options: money(L.SPENDS) },
      { key: 'eff', type: 'choice', label: t('eff'), options: L.EFFS.map(function (v) { return [v, pct(v / 100)]; }), visible: hidden }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cn-ceil', label: t('legCeil') },
      { shape: 'cn-fixed', label: t('legFixed') },
      { shape: 'cn-pct', label: t('legPct') },
      { shape: 'cn-turn', label: t('legTurn') },
      { shape: 'cn-firm', label: t('legFirm') },
      { shape: 'cn-inc', label: t('legInc') },
      { shape: 'cn-fine', label: t('legFine') },
      { shape: 'cn-spend', label: t('legSpend') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
