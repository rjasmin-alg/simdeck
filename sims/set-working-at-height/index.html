<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var NS = 'http://www.w3.org/2000/svg';
  var S = 50;            // side view: SVG units per metre
  var PS = 30;           // view from above: SVG units per metre
  var EMIN = 1, EMAX = 300;   // the energy scale, J (log)

  /** Numbers in the page's language: a decimal comma in Croatian; trailing zeros dropped when trim. */
  function num(x, d, trim) {
    var s = (Math.round(x * Math.pow(10, d)) / Math.pow(10, d)).toFixed(d);
    if (trim && s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function joules(e) { return num(e, e < 10 ? 1 : 0); }

  function svg(viewBox, aspect) {
    var e = document.createElementNS(NS, 'svg');
    e.setAttribute('viewBox', viewBox);
    e.setAttribute('preserveAspectRatio', aspect || 'xMidYMax meet');
    e.setAttribute('aria-hidden', 'true');
    return e;
  }
  function el(parent, name, attrs) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs).forEach(function (k) { e.setAttribute(k, String(attrs[k])); });
    parent.appendChild(e);
    return e;
  }
  function X(m) { return m * S; }
  function Y(m) { return -m * S; }

  // ── the side view ──

  /** A standing figure: feet at (x, y) in metres, facing right; arm to (hx, hy) when given. */
  function figure(g, x, y, cls, headCls, hand) {
    var hip = y + 0.9, sh = y + 1.45, hd = y + 1.68;
    el(g, 'path', { d: 'M' + X(x - 0.18) + ' ' + Y(y) + 'L' + X(x) + ' ' + Y(hip) + 'L' + X(x + 0.18) + ' ' + Y(y) +
      'M' + X(x) + ' ' + Y(hip) + 'L' + X(x) + ' ' + Y(sh), class: cls });
    if (hand) el(g, 'path', { d: 'M' + X(x) + ' ' + Y(sh) + 'L' + X(hand[0]) + ' ' + Y(hand[1]), class: cls });
    else el(g, 'path', { d: 'M' + X(x - 0.2) + ' ' + Y(y + 1.0) + 'L' + X(x) + ' ' + Y(sh) + 'L' + X(x + 0.2) + ' ' + Y(y + 1.0), class: cls });
    el(g, 'circle', { cx: X(x), cy: Y(hd), r: 0.17 * S, class: headCls });
  }

  /** The access: a ladder against a set wall, a platform tower with rails and toe boards, or a lift with a basket.
   *  The worker's hands are at (0, height); the platform's deck and the lift's basket floor 1.3 m below. */
  function access(g, s, up) {
    var p = s.params, hgt = p.height, deck = hgt - 1.3, feetX = -0.5;
    if (p.access === 'ladder') {
      var top = hgt + 0.5, wall = feetX - 0.2 - (top - deck) / 4, foot = wall + top / 4;
      el(g, 'rect', { x: X(wall - 0.5), y: Y(top + 0.6), width: 0.5 * S, height: (top + 0.6) * S, class: 'sv-wall' });
      [-0.06, 0.06].forEach(function (o) { el(g, 'line', { x1: X(foot + o), y1: 0, x2: X(wall + o + 0.03), y2: Y(top), class: 'sv-rail' }); });
      for (var y = 0.3; y < top; y += 0.3) {
        var xr = wall + (top - y) / 4;
        el(g, 'line', { x1: X(xr - 0.1), y1: Y(y), x2: X(xr + 0.1), y2: Y(y), class: 'sv-rung' });
      }
      if (up) figure(g, wall + (top - deck) / 4 + 0.22, deck, 'sv-worker', 'sv-head', [0, hgt]);
    } else if (p.access === 'platform') {
      var l = -2.1, r = -0.25;
      [l, r].forEach(function (x) { el(g, 'line', { x1: X(x), y1: 0, x2: X(x), y2: Y(deck + 1.1), class: 'sv-frame' }); });
      for (var k = 1; deck - k * 1.8 > 0.3; k++) el(g, 'line', { x1: X(l), y1: Y(deck - k * 1.8 + 0.9), x2: X(r), y2: Y(deck - k * 1.8), class: 'sv-frame' });
      el(g, 'line', { x1: X(l), y1: Y(0.3), x2: X(r), y2: Y(0.3), class: 'sv-frame' });
      el(g, 'rect', { x: X(l - 0.05), y: Y(deck), width: (r - l + 0.1) * S, height: 0.12 * S, class: 'sv-deck' });
      el(g, 'rect', { x: X(r - 0.03), y: Y(deck + 0.18), width: 0.08 * S, height: 0.18 * S, class: 'sv-toe' });
      el(g, 'line', { x1: X(l), y1: Y(deck + 1.1), x2: X(r), y2: Y(deck + 1.1), class: 'sv-guard' });
      el(g, 'line', { x1: X(l), y1: Y(deck + 0.55), x2: X(r), y2: Y(deck + 0.55), class: 'sv-guard' });
      if (up) figure(g, feetX - 0.3, deck + 0.06, 'sv-worker', 'sv-head', [0, hgt]);
    } else {
      var a = -2.2, b = -0.25, base = 0.45, n = Math.max(1, Math.round((deck - base) / 1.1)), seg = (deck - base) / n;
      el(g, 'rect', { x: X(a), y: Y(base), width: (b - a) * S, height: (base - 0.15) * S, class: 'sv-deck' });
      [a + 0.3, b - 0.3].forEach(function (x) { el(g, 'circle', { cx: X(x), cy: Y(0.15), r: 0.15 * S, class: 'sv-wheel' }); });
      for (var i = 0; i < n; i++) {
        var y0 = base + i * seg, y1 = y0 + seg;
        el(g, 'path', { d: 'M' + X(a + 0.2) + ' ' + Y(y0) + 'L' + X(b - 0.2) + ' ' + Y(y1) + 'M' + X(b - 0.2) + ' ' + Y(y0) + 'L' + X(a + 0.2) + ' ' + Y(y1), class: 'sv-frame' });
      }
      el(g, 'rect', { x: X(a), y: Y(deck), width: (b - a) * S, height: 0.15 * S, class: 'sv-deck' });
      el(g, 'rect', { x: X(b - 0.05), y: Y(deck + 0.18), width: 0.08 * S, height: 0.18 * S, class: 'sv-toe' });
      [a, b].forEach(function (x) { el(g, 'line', { x1: X(x), y1: Y(deck), x2: X(x), y2: Y(deck + 1.1), class: 'sv-guard' }); });
      el(g, 'line', { x1: X(a), y1: Y(deck + 1.1), x2: X(b), y2: Y(deck + 1.1), class: 'sv-guard' });
      el(g, 'line', { x1: X(a), y1: Y(deck + 0.55), x2: X(b), y2: Y(deck + 0.55), class: 'sv-guard' });
      if (up) {
        figure(g, feetX - 0.3, deck + 0.08, 'sv-worker', 'sv-head', [0, hgt]);
        el(g, 'path', { d: 'M' + X(feetX - 0.3) + ' ' + Y(deck + 0.95) + 'Q' + X(-1.4) + ' ' + Y(deck + 0.4) + ' ' + X(-1.9) + ' ' + Y(deck + 0.15), class: 'sv-harness' });
      }
    }
  }

  /** Where the people below stand: open, anywhere along the route (one under the work); taped, one still inside; closed,
   *  all outside the zone. Decorative: the count follows how often people pass. */
  function people(s) {
    var p = s.params, n = { few: 1, busy: 2, through: 4 }[p.traffic];
    var spots = [0.25, 2.6, -3.0, 3.6];
    if (p.zone !== 'open') {
      var out = p.zoneR + 0.45;
      spots = p.zone === 'taped' ? [0.3, out, -out, out + 1.0] : [out, -out, out + 1.0, -out - 1.0];
    }
    return spots.slice(0, n);
  }

  function sideView(s) {
    var p = s.params, hgt = p.height, R = s.landR;
    var half = Math.max(R, p.zone !== 'open' ? p.zoneR : 0, 3.2) + 1.0, top = Math.max(hgt + 2.3, 5);
    var v = svg(X(-half) + ' ' + Y(top) + ' ' + X(2 * half) + ' ' + (X(top) + 30));
    // floor with a hatch under it
    el(v, 'line', { x1: X(-half), y1: 0, x2: X(half), y2: 0, class: 'sv-floor' });
    for (var x = X(-half) + 10; x < X(half) + 14; x += 26) el(v, 'line', { x1: x, y1: 4, x2: x - 14, y2: 22, class: 'sv-hatch' });
    // where it lands: a flat dashed ellipse on the floor
    el(v, 'ellipse', { cx: 0, cy: -4, rx: X(R), ry: 0.3 * S, class: 'sv-land' });
    // the zone: posts at ±zoneR with tape, or barriers
    if (p.zone !== 'open') {
      [-1, 1].forEach(function (sg) {
        var zx = X(sg * p.zoneR);
        el(v, 'line', { x1: zx, y1: 0, x2: zx, y2: Y(1.0), class: 'sv-post' });
        if (p.zone === 'closed') el(v, 'rect', { x: zx - (sg > 0 ? 0 : 0.3 * S), y: Y(1.0), width: 0.3 * S, height: 1.0 * S, class: 'sv-barrier' });
      });
      if (p.zone === 'taped') el(v, 'line', { x1: X(-p.zoneR), y1: Y(0.9), x2: X(p.zoneR), y2: Y(0.9), class: 'sv-tape' });
    }
    var g = el(v, 'g', {});
    access(g, s, !s.blocked);
    if (s.blocked) figure(g, -2.6, 0, 'sv-worker', 'sv-head');
    people(s).forEach(function (x) { if (Math.abs(x) < half - 0.3) figure(g, x, 0, 'sv-person', 'sv-phead'); });
    if (!s.blocked) {
      // what they hold, its tether, and the line it falls along
      var sz = 0.12 + 0.07 * L.ITEMS[p.item].m;
      if (p.tether) el(v, 'path', { d: 'M' + X(-0.3) + ' ' + Y(hgt + 0.1) + 'Q' + X(-0.25) + ' ' + Y(hgt - 0.5) + ' ' + X(0) + ' ' + Y(hgt - sz), class: 'sv-tether' });
      el(v, 'line', { x1: 0, y1: Y(hgt - sz - 0.1), x2: 0, y2: -8, class: 'sv-drop' });
      el(v, 'rect', { x: X(-sz), y: Y(hgt + sz), width: 2 * sz * S, height: 2 * sz * S, rx: 4, class: 'sv-item' });
      // the height: a dimension line at the right
      var dx = X(half - 0.4);
      el(v, 'line', { x1: dx, y1: -2, x2: dx, y2: Y(hgt) + 2, class: 'sv-dim' });
      el(v, 'path', { d: 'M' + dx + ' ' + Y(hgt) + 'l-9 18h18z', class: 'sv-dimtip' });
      el(v, 'path', { d: 'M' + dx + ' 0l-9 -18h18z', class: 'sv-dimtip' });
      el(v, 'line', { x1: 12, y1: Y(hgt), x2: dx + 12, y2: Y(hgt), class: 'sv-rung' });
    }
    return v;
  }

  // ── the energy scale ──

  function pos(e) { return 100 * (Math.log(Math.min(Math.max(e, EMIN), EMAX)) - Math.log(EMIN)) / (Math.log(EMAX) - Math.log(EMIN)) + '%'; }

  function energyCard(s) {
    var b = L.BANDS, segs = [[EMIN, b[0], 0], [b[0], b[1], 1], [b[1], EMAX, 2]];
    var kids = segs.map(function (x) {
      return h('div', { class: 'wh-bseg', dataset: { b: String(x[2]) }, style: { left: pos(x[0]), width: 'calc(' + pos(x[1]) + ' - ' + pos(x[0]) + ')' } });
    });
    [[1, 'start'], [10, 'mid'], [100, 'mid'], [300, 'end']].forEach(function (x) {
      kids.push(h('span', { class: 'wh-tick', translate: 'no', dataset: { at: x[1] }, style: { left: pos(x[0]) } }, String(x[0]) + (x[0] === 300 ? ' J' : '')));
    });
    if (!s.blocked) kids.push(h('span', { class: 'wh-emark', style: { left: pos(s.energy) } }));
    return h('section', { class: 'wh-card' },
      h('div', { class: 'wh-row' }, h('span', { class: 'wh-name' }, t('bandScale')),
        s.blocked ? null : h('span', { class: 'wh-band', dataset: { b: String(s.band) } }, joules(s.energy) + ' J: ' + t('band_' + s.band))),
      h('div', { class: 'wh-scale', role: 'img', 'aria-label': t('bandScale') }, kids));
  }

  // ── the week ──

  function outcome(d) { return d.stop ? d.stop : d.hit ? 'hit' : 'clear'; }

  function weekCard(s) {
    var c = s.counts, per = L.HOURS / L.DAYS;
    function count(k, label, n) {
      return h('div', { class: 'wh-count', dataset: { k: k } }, h('span', { class: 'wh-num' }, s.blocked ? '–' : String(n)), h('span', { class: 'wh-small' }, label));
    }
    var days = [];
    for (var d = 0; d < L.DAYS; d++) {
      var lanes = ['hit', 'clear', 'stop'].map(function (lane) {
        var marks = s.drops.filter(function (x) {
          var o = outcome(x);
          return x.day === d && (lane === 'stop' ? (o === 'tether' || o === 'toeboard') : o === lane);
        }).map(function (x) {
          return h('span', { class: 'wh-m', dataset: { o: outcome(x) }, style: { left: (100 * (x.t - d * per) / per) + '%' } });
        });
        return h('div', { class: 'wh-lane' }, marks);
      });
      days.push(h('div', { class: 'wh-day' }, lanes, h('span', { class: 'wh-dayname' }, t('day', { n: d + 1 }))));
    }
    return h('section', { class: 'wh-card', 'aria-label': t('weekTitle') },
      h('div', { class: 'wh-row' }, h('span', { class: 'wh-name' }, t('weekTitle')),
        h('button', { type: 'button', class: 'sd-btn wh-week', title: t('newWeekHint'), onclick: function () { window.simdeck.set(L.nextSeed(window.simdeck.params)); } },
          t('newWeek') + ' · ' + t('weekSeed', { n: s.params.seed }))),
      h('div', { class: 'wh-counts' },
        count('dropped', t('cDropped'), c.dropped),
        count('caught', t('cCaught'), c.caught),
        count('stopped', t('cStopped'), c.stopped),
        count('landed', t('cLanded'), c.landed),
        count('hits', t('cHits'), c.hits)),
      h('div', { class: 'wh-row' }, h('span', { class: 'wh-small' }, s.blocked ? '' : t('avg', { x: num(s.expected, 1) }))),
      h('div', { class: 'wh-strip' }, days));
  }

  // ── the view from above ──

  function planView(s) {
    var p = s.params, W = (Math.max(s.landR, p.zone !== 'open' ? p.zoneR : 0, 2.3) + 0.4) * PS;
    var v = svg((-W) + ' ' + (-W) + ' ' + (2 * W) + ' ' + (2 * W), 'xMidYMid meet');
    el(v, 'rect', { x: -W, y: -1.2 * PS, width: 2 * W, height: 2.4 * PS, class: 'pv-route' });
    if (p.zone !== 'open') {
      var z = el(v, 'circle', { cx: 0, cy: 0, r: p.zoneR * PS, class: 'pv-zone' });
      if (p.zone === 'closed') z.setAttribute('data-closed', '');
    }
    el(v, 'circle', { cx: 0, cy: 0, r: s.landR * PS, class: 'sv-land' });
    el(v, 'rect', { x: -2.1 * PS, y: -0.8 * PS, width: 1.85 * PS, height: 1.6 * PS, class: 'pv-access' });
    s.drops.forEach(function (d) {
      if (d.stop || d.hit) return;
      el(v, 'circle', { cx: d.x * PS, cy: -d.y * PS, r: 6, class: 'pv-clear' });
    });
    s.drops.forEach(function (d) {
      if (!d.hit) return;
      var x = d.x * PS, y = -d.y * PS;
      el(v, 'path', { d: 'M' + (x - 8) + ' ' + (y - 8) + 'L' + (x + 8) + ' ' + (y + 8) + 'M' + (x + 8) + ' ' + (y - 8) + 'L' + (x - 8) + ' ' + (y + 8), class: 'pv-hit' });
    });
    el(v, 'circle', { cx: 0, cy: 0, r: 7, class: 'pv-centre' });
    return h('section', { class: 'wh-card wh-plan', 'aria-label': t('planTitle') },
      h('span', { class: 'wh-name' }, t('planTitle')), v, h('span', { class: 'wh-small' }, t('planNote')));
  }

  function fallCard(s) {
    var p = s.params;
    return h('section', { class: 'wh-card wh-fall' },
      h('span', { class: 'wh-name' }, t('fallTitle')),
      h('span', { class: 'wh-num', translate: 'no' }, t('fallLine', { h: num(p.height, 1, true), e: num(s.fall, 0) })),
      h('span', { class: 'wh-stop', dataset: s.fallStop.length ? {} : { none: '' } }, t('fallStop_' + p.access)),
      h('span', { class: 'wh-small' }, t('speedLine', { v: num(s.speed, 1), kmh: num(s.speed * 3.6, 0) })));
  }

  // ── caption (SPEC.md "Legend and captions") ──

  function caption(s) {
    var p = s.params, c = s.counts;
    if (s.blocked) return t('capBlocked');
    var out = [t('capWeek', { d: c.dropped, l: c.landed, n: c.hits, x: num(s.expected, 1) })];
    if (c.landed === 0) out.push(t('capNone'));
    if (p.zone === 'closed' && p.zoneR < s.landR - L.EPS) out.push(t('capSmall', { z: num(p.zoneR, 1, true), h: num(p.height, 1, true), r: num(s.landR, 1, true) }));
    else if (p.zone === 'closed') { if (c.landed > 0) out.push(t('capHeld')); }
    else if (p.zone === 'taped') out.push(t('capTaped'));
    else if (p.access === 'ladder' && !p.tether) out.push(t('capOpen'));
    else if (p.access === 'ladder') out.push(t('capEdge'));
    else if (!p.tether) out.push(t('capHand'));
    else out.push(t('capPass'));
    out.push(t('capEnergy', { m: num(s.m, 1, true), h: num(p.height, 1, true), e: joules(s.energy), band: t('band_' + s.band) }));
    if (p.height <= 3) out.push(t('capFall', { h: num(p.height, 1, true), f: num(s.fall, 0) }));
    return out.join(' ');
  }

  var params = [
    { key: 'access', type: 'choice', label: t('access'), options: L.ACCESS_IDS.map(function (x) { return [x, t('access_' + x)]; }) },
    { key: 'item', type: 'choice', label: t('item'), options: L.ITEM_IDS.map(function (x) { return [x, t('item_' + x)]; }) },
    { key: 'traffic', type: 'choice', label: t('traffic'), options: L.TRAFFIC_IDS.map(function (x) { return [x, t('traffic_' + x)]; }) },
    { key: 'zone', type: 'choice', label: t('zone'), options: L.ZONE_IDS.map(function (x) { return [x, t('zone_' + x)]; }) },
    { key: 'height', type: 'range', label: t('height'), min: L.RANGES.height.min, max: L.RANGES.height.max, step: L.RANGES.height.step, unit: 'm',
      format: function (v) { return num(v, 1, true) + ' m'; } },
    { key: 'zoneR', type: 'range', label: t('zoneR'), min: L.RANGES.zoneR.min, max: L.RANGES.zoneR.max, step: L.RANGES.zoneR.step, unit: 'm',
      format: function (v) { return num(v, 1, true) + ' m'; } },
    { key: 'trained', type: 'toggle', label: t('trained') },
    { key: 'tether', type: 'toggle', label: t('tether') },
    { key: 'seed', type: 'range', label: t('seedParam'), min: 1, max: L.SEEDS, step: 1, visible: function () { return false; } },
    { type: 'button', label: t('newWeek'), hint: t('newWeekHint'), key: 'n', run: function (sim) { sim.set(L.nextSeed(sim.params)); } }
  ];

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'wh-land', label: t('legLand') },
      { shape: 'wh-tape', label: t('legTape') },
      { shape: 'wh-closed', label: t('legClosed') },
      { shape: 'wh-hit', label: t('legHit') },
      { shape: 'wh-clear', label: t('legClear') },
      { shape: 'wh-tether', label: t('legCaught') },
      { shape: 'wh-toe', label: t('legStopped') },
      { shape: 'wh-person', label: t('legPerson') }
    ],
    render: function (c) {
      var s = c.state, p = s.params;
      var tags = [h('span', { class: 'wh-small' }, t('side')), h('span', { class: 'wh-tag' }, num(p.height, 1, true) + ' m'),
        h('span', { class: 'wh-tag' }, t('landR', { r: num(s.landR, 1, true) }))];
      if (p.zone !== 'open') tags.push(h('span', { class: 'wh-tag' }, t('zoneTag_' + p.zone, { z: num(p.zoneR, 1, true) })));
      c.stage.replaceChildren(h('div', { class: 'wh' },
        h('p', { class: 'wh-top' },
          h('span', { class: 'wh-formula', translate: 'no' }, t('formula')),
          h('span', { class: 'wh-eline', translate: 'no' }, t('eLine', { m: num(s.m, 1, true), h: num(p.height, 1, true), e: joules(s.energy) }))),
        h('div', { class: 'wh-body' },
          h('div', { class: 'wh-side' }, h('div', { class: 'wh-sidehead' }, tags),
            s.blocked ? h('div', { class: 'wh-banner' }, t('blocked_' + p.access), h('span', null, t('blockedSub'))) : null,
            sideView(s)),
          h('div', { class: 'wh-right' },
            energyCard(s),
            weekCard(s),
            h('div', { class: 'wh-low' }, planView(s), fallCard(s)))),
        h('p', { class: 'wh-foot' }, t('foot'))));
    },
    caption: function (c) { return caption(c.state); }
  });
})();
</script>
</body>
</html>
