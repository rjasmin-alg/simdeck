<!-- dns-resolution: the stub resolver asks the recursive resolver once (rd); the resolver walks root → .hr → grafo.hr
     with iterative queries, caches every RRset for its TTL, and a second lookup later starts from what is still cached.
     A stepper, one message per step. Drawn with kit view K1 (message sequence chart, kit/sequence.js): five lanes, the
     chips name the message kind, the fields its flags and TTL. Beside the chart the message card (flags, question, the
     records it carries) and the resolver's cache. Model: sim.js; rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { S: '1', R: '2', root: '3', tld: '4', auth: '5' };
  var MARK = { S: 'S', R: 'R', root: '.', tld: 'hr', auth: 'g' };

  /** Data (names, addresses, types, flags, times) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'dn-mono' : cls || null }, String(text)); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function sec(v) { return t('sec', { v: v }); }
  function secData(v) { return data(sec(v), ''); }
  function advText(v) { return v === 86400 ? t('day') : sec(v); }

  /** The host behind a lane: its address, or the server asked in that zone. */
  function serverOf(lane) {
    return { root: 'a.root-servers.net', tld: 'a.ns.hr', auth: 'ns1.grafo.hr' }[lane];
  }
  /** Server name → address, from the fixed hierarchy (root hints and the glue of both delegations). */
  var IP = (function () {
    var z = L.zones(L.defaults), out = {};
    [z['.'].glue, z['.'].cuts.hr.glue, z.hr.cuts['grafo.hr'].glue].forEach(function (g) { Object.keys(g).forEach(function (k) { out[k] = g[k]; }); });
    return out;
  })();
  function addrOf(lane, m) {
    if (lane === 'S' || lane === 'R') return L.HOSTS[lane].ip;
    var name = (m && m.server) || serverOf(lane);
    return name + ' ' + IP[name];
  }

  // ── lanes ──
  var LANE_KEYS = { S: ['laneS', 'roleS'], R: ['laneR', 'roleR'], root: ['laneRoot', 'roleRoot'], tld: ['laneTld', 'roleTld'], auth: ['laneAuth', 'roleAuth'] };
  function lanes(c) {
    var cur = c.state.msgs[c.state.msgs.length - 1];
    var fresh = c.prev && c.state.msgs.length > c.prev.msgs.length;
    return L.LANES.map(function (id) {
      var k = LANE_KEYS[id];
      var host = id === 'S' || id === 'R' ? L.HOSTS[id].ip : IP[serverOf(id)];
      var active = fresh && cur && (cur.from === id || cur.to === id);
      return { id: id, mark: MARK[id], c: COLOUR[id], shape: id === 'S' ? 'square' : null, name: id === 'auth' ? data(t(k[0]), '') : t(k[0]),
        state: active ? 'active' : null,
        body: [h('div', { class: 'dn-sub' }, rich(k[1])), h('div', { class: 'dn-sub' }, data(host))] };
    });
  }

  // ── chart rows ──
  function chipOf(m) {
    if (m.kind === 'nxdomain') return 'NXDOMAIN';
    return h('span', null, t({ query: 'kQuery', referral: 'kReferral', answer: 'kAnswer' }[m.kind]));
  }
  function fieldsOf(m) {
    if (m.kind === 'query') return m.rd ? data('rd', '') : null;
    if (m.kind === 'referral') return data('NS ' + m.zone, '');
    var flag = m.aa ? h('span', { class: 'dn-aa', translate: 'no' }, 'aa') : data('ra', '');
    return h('span', { translate: 'no' }, flag, ' ' + sec(m.ttl));
  }
  function rows(c) {
    var s = c.state, out = [], bold = [];
    s.msgs.forEach(function (m) {
      if (m.lookup === 2 && m.from === 'S') {
        out.push({ kind: 'note', lane: 'S', text: t('noteLater', { adv: advText(c.params.advance) }), k: 'solid', time: sec(m.t), changed: m.n === c.n });
      }
      if (m.kind === 'answer' || m.kind === 'nxdomain') bold.push(out.length);
      out.push({ from: m.from, to: m.to, label: chipOf(m), c: COLOUR[m.from], fields: fieldsOf(m), line: m.kind === 'referral' ? 'dotted' : null,
        time: sec(m.t), changed: m.n === c.n });
    });
    return { rows: out, bold: bold };
  }
  function renderChart(c) {
    var r = rows(c);
    var chart = Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(c),
      rows: r.rows,
      timeWidth: '5.6rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
    var rowEls = chart.querySelectorAll('.sd-seq-row');
    r.bold.forEach(function (i) { var a = rowEls[i] && rowEls[i].querySelector('.sd-seq-arrow'); if (a) a.dataset.weight = 'bold'; });
    return chart;
  }

  // ── message card ──
  function renderMsg(c) {
    var s = c.state, m = s.msgs[s.msgs.length - 1];
    var box = h('section', { class: 'dn-box dn-msg' });
    if (!m) { box.append(h('h2', null, t('msgNone'))); return box; }
    var fresh = c.n === m.n;
    box.append(h('h2', null, t('msgTitle', { n: m.n }), ' ',
      h('b', { class: 'dn-chip sd-fill' + (fresh && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { c: COLOUR[m.from] } }, chipOf(m))));
    var flags = h('div', { class: 'dn-flags' });
    var on = [];
    ['rd', 'ra', 'aa'].forEach(function (f) {
      flags.append(h('span', { class: 'dn-flag', dataset: m[f] ? { on: '', f: f } : { f: f }, translate: 'no' }, f));
      if (m[f]) on.push(t({ rd: 'flagRd', ra: 'flagRa', aa: 'flagAa' }[f]));
    });
    flags.append(h('span', { class: 'dn-sub' }, on.length ? on.join(', ') : t('flagsNone')));
    box.append(flags);
    var kv = [
      h('dt', null, t('msgFrom')), h('dd', null, data(addrOf(m.from, m), '')),
      h('dt', null, t('msgTo')), h('dd', null, data(addrOf(m.to, m), '')),
      h('dt', null, t('msgQ')), h('dd', null, data(m.q.name + ' A', ''))
    ];
    if (m.kind === 'answer') kv.push(h('dt', null, t('msgAns')), h('dd', null, data(m.rr.name + ' A ' + m.rr.data[0] + ' · TTL ' + sec(m.rr.ttl), '')));
    if (m.kind === 'referral') {
      kv.push(h('dt', null, t('msgNs')), h('dd', null, m.ns.map(function (n) { return h('div', null, data(m.zone + ' NS ' + n, '')); })));
      kv.push(h('dt', null, rich('msgGlue')), h('dd', null, m.glue.map(function (g) { return h('div', null, data(g.name + ' A ' + g.ip, '')); }),
        h('div', null, data('TTL ' + sec(m.ttl), ''))));
    }
    if (m.kind === 'nxdomain') {
      kv.push(h('dt', null, data('rcode', '')), h('dd', null, data('NXDOMAIN', ''), ' ', h('span', { class: 'dn-sub' }, t('msgNeg'))));
      if (m.soa) kv.push(h('dt', null, t('msgSoa')), h('dd', null, data(m.soa.zone + ' SOA · TTL ' + m.soa.ttl + ' · MINIMUM ' + m.soa.minimum, '')));
    }
    box.append(h('dl', { class: 'dn-kv' }, kv));
    if (m.fromCache) box.append(h('p', { class: 'dn-note' }, t('msgCache')));
    return box;
  }

  // ── cache ──
  function renderCache(c) {
    var s = c.state;
    var touched = {};
    // a glue address marks the NS row it belongs to
    var glueOf = {};
    s.cache.forEach(function (e) { if (e.type === 'NS') e.data.forEach(function (n) { glueOf[L.keyOf(n, 'A')] = L.keyOf(e.name, 'NS'); }); });
    if (c.n > 0) s.touched.forEach(function (x) { var k = glueOf[x.key] || x.key; if (!touched[k]) touched[k] = x.how; });
    var box = h('section', { class: 'dn-box dn-cache' },
      h('h2', null, t('cacheTitle'), h('span', { class: 'dn-muted' }, t.parts('cacheAt', { t: data(sec(s.t), '') }))));
    var list = h('ul', { class: 'dn-rows' });
    s.cache.forEach(function (e) {
      if (e.type === 'A' && (e.hint || e.glue)) return; // addresses of name servers: counted in their NS row
      var key = L.keyOf(e.name, e.type);
      var how = touched[key];
      var expired = !L.valid(e, s.t);
      var leftNow = L.left(e, s.t);
      var ttlCell = e.hint ? t('cacheHint') : expired ? t('cacheExpired') : data(sec(leftNow) + ' / ' + sec(e.ttl), '');
      var ds = {};
      if (e.hint) ds.hint = '';
      if (e.negative) ds.neg = '';
      if (expired) ds.expired = '';
      if (how) ds.how = how;
      var name = h('span', { class: 'dn-row-name' }, e.negative ? h('span', { class: 'dn-neg', 'aria-hidden': 'true' }, '⊘') : null,
        data(e.name, ''), e.negative ? null : data(e.type, 'dn-type'));
      var body = e.negative ? h('span', { class: 'dn-row-data' }, t('cacheNx')) : h('span', { class: 'dn-row-data' }, data(e.data.join(', '), ''),
        e.type === 'NS' ? [' ', h('span', { class: 'dn-glue' }, rich('cacheGlue', { n: e.data.length }))] : null);
      var bar = e.hint ? null : h('div', { class: 'dn-bar' }, h('span', { style: { width: (expired ? 0 : Math.round(leftNow / e.ttl * 1000) / 10) + '%' } }));
      list.append(h('li', { class: 'dn-row' + (how ? ' sd-changed' + (how === 'added' && c.dir === 'forward' ? ' sd-anim-in' : '') : ''), dataset: ds },
        name, h('span', { class: 'dn-row-ttl' }, ttlCell), body, bar));
    });
    box.append(list);
    return box;
  }

  // ── captions ──
  function q(name) { return h('b', { translate: 'no' }, name); }
  function lookupCaption(s, parts) {
    // the resolver's cache check after the stub's query (rule 1, steps (1) and (2))
    var m = s.msgs[s.msgs.length - 1];
    var neg = L.find(s.cache, m.q.name, 'NXDOMAIN'), pos = L.find(s.cache, m.q.name, 'A');
    var hit = L.cachedAnswer(s.cache, m.q.name, 'A', s.t);
    if (!hit && pos && !L.valid(pos, s.t)) parts.push(' ', t.parts('capExpired', { name: q(m.q.name) }));
    if (!hit && neg && !L.valid(neg, s.t)) parts.push(' ', t.parts('capExpiredNeg', { name: q(m.q.name) }));
    if (hit) {
      parts.push(' ', hit.negative ? t.parts('capHitNeg', { name: q(m.q.name), left: secData(L.left(hit.entry, s.t)) })
        : t.parts('capHit', { left: secData(L.left(hit.entry, s.t)) }));
    } else if (s.target && s.target.zone !== '.') {
      var ns = L.find(s.cache, s.target.zone, 'NS');
      parts.push(' ', t.parts('capMissZone', { zone: q(s.target.zone), left: secData(L.left(ns, s.t)), server: q(s.target.server) }));
    } else parts.push(' ', t('capMissRoot'));
    return parts;
  }
  function caption(c) {
    var s = c.state, p = c.params, n = c.n;
    if (c.first) return t.parts('capStart', { name: q(L.fqdn(p.name)) });
    var m = s.msgs[s.msgs.length - 1];
    var parts;
    if (m.from === 'S') {
      parts = m.lookup === 1 ? rich('capStub', { n: n, name: q(m.q.name), r: data(L.HOSTS.R.ip, '') })
        : rich('capStubAgain', { n: n, adv: advText(p.advance), name: q(m.q.name) });
      return lookupCaption(s, parts);
    }
    if (m.from === 'R' && m.to !== 'S') {
      parts = t.parts('capAsk', { n: n, server: q(m.server) });
      // every zone here has two NS (rule 8): said once, at the first server the run asks
      if (s.msgs.filter(function (x) { return x.from === 'R' && x.to !== 'S'; }).length === 1) parts.push(' ', t('capAskFirst'));
      return parts;
    }
    if (m.kind === 'referral') {
      parts = m.from === 'root' ? rich('capReferralRoot', { n: n }) : rich('capReferral', { n: n, server: q(m.server), zone: q(m.zone) });
      parts.push(' ', t.parts('capReferralCached', { ttl: secData(m.ttl) }));
      return parts;
    }
    if (m.to === 'R' && m.kind === 'answer') return t.parts('capAnswer', { n: n, server: q(m.server), ip: q(m.rr.data[0]), ttl: secData(m.ttl) });
    if (m.to === 'R' && m.kind === 'nxdomain') {
      return t.parts('capNxAuth', { n: n, server: q(m.server), name: q(m.q.name), soa: secData(m.soa.ttl), min: secData(m.soa.minimum), ttl: secData(m.ttl) });
    }
    // the resolver's reply to the stub
    var o = s.outcome[s.outcome.length - 1];
    if (m.fromCache) {
      parts = m.kind === 'nxdomain' ? t.parts('capReplyCacheNx', { n: n, adv: advText(p.advance), left: secData(m.ttl) })
        : t.parts('capReplyCache', { n: n, adv: advText(p.advance), left: secData(m.ttl) });
    } else {
      parts = m.kind === 'nxdomain' ? t.parts('capReplyNx', { n: n }) : t.parts('capReply', { n: n, ip: q(m.rr.data[0]), ttl: secData(m.ttl) });
      parts.push(' ', t.n('capOnce', o.out));
    }
    if (o.lookup === 2) parts.push(' ', t('capCompare', { a: s.outcome[0].msgs, b: o.msgs }));
    return parts;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'name', type: 'choice', label: t('name'), resets: true, options: [['www', t('nWww')], ['mail', t('nMail')], ['nema', t('nNema')]] },
      { key: 'again', type: 'choice', label: t('again'), resets: true, options: [['same', t('againSame')], ['www', t('nWww')], ['mail', t('nMail')], ['nema', t('nNema')]] },
      { key: 'advance', type: 'choice', label: t('advance'), options: [[60, '+' + sec(60)], [3600, '+' + sec(3600)], [86400, '+' + t('day')]] },
      { key: 'ttlA', type: 'range', label: t('ttlA'), min: 60, max: 86400, step: 60, format: sec },
      { key: 'ttlNS', type: 'range', label: t('ttlNS'), min: 3600, max: 172800, step: 3600, format: sec },
      { type: 'button', label: t('repeat'), hint: t('repeatHint'), key: 'w', run: function (sim) { sim.go(L.firstDone(sim.params) + 1); } }
    ],

    presets: [
      { id: 'cold', label: t('presetCold'), hint: t('presetColdHint'), params: { name: 'www', again: 'same', advance: 60 } },
      { id: 'warm', label: t('presetWarm'), hint: t('presetWarmHint'), params: { name: 'www', again: 'same', advance: 60 }, step: 8 },
      { id: 'same-zone', label: t('presetSameZone'), hint: t('presetSameZoneHint'), params: { name: 'www', again: 'mail', advance: 60 }, step: 8 },
      { id: 'ttl-expired', label: t('presetExpired'), hint: t('presetExpiredHint'), params: { name: 'www', again: 'same', advance: 3600 }, step: 8 },
      { id: 'nxdomain', label: t('presetNx'), hint: t('presetNxHint'), params: { name: 'nema', again: 'same', advance: 60 } }
    ],

    legend: [
      { shape: 'line', label: t('legendQuery') },
      { shape: 'dot', label: t('legendReferral') },
      { shape: 'bold', label: t('legendAnswer') },
      { shape: 'aa', label: t('legendAa') },
      { shape: 'neg', label: t('legendNeg') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'dn' }, chart, renderMsg(c), renderCache(c)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
