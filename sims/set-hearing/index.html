<!-- set-hearing: a crew member's shooting day built from noisy blocks. An explorer: the student adds blocks (a quiet
     dialogue scene, work near the generator, the wind machine, a blank-firing scene), changes their length, puts ear
     defenders on and off per block, lets the defenders be lifted a few minutes an hour, and moves the generator. The
     stage draws the cumulative daily dose through the day, without defenders (dashed, what the action values count) and
     at the ear (solid, what the limit counts), with the 80 / 85 / 87 dB(A) day levels; under it the blocks on the same
     clock and a table of them. Day model: day.js; noise: sim.js; rules: SPEC.md; words: strings.js. -->

      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>

<script src="strings.js"></script>
<script src="day.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var DAY = L.day;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var MIN_AXIS = 600;                          // the clock shows at least 10 h
  var COLOUR = { dialogue: '3', generator: '1', wind: '2', blanks: '5' };
  var LINES = [[L.LOWER, '80'], [L.UPPER, '85'], [L.LIMIT, '87']];

  /** A number with `dp` decimals and the page language's decimal mark. */
  function num(x, dp) { return String(x.toFixed(dp)).replace('.', t('dec')); }
  function pct(x) { return x >= 9.95 ? num(x, 0) : num(x, 1); }
  function db(x) { return num(x, 1); }
  /** A duration: "45 min", "4 h", "2 h 30". Not language: the same in both. */
  function dur(m) {
    m = Math.round(m);
    if (m < 60) return m + ' min';
    var hh = Math.floor(m / 60), mm = m % 60;
    return mm ? hh + ' h ' + (mm < 10 ? '0' : '') + mm : hh + ' h';
  }
  /** The time to a full dose: seconds under a minute, hours over ten. */
  function allowed(m) {
    if (m < 1) return Math.max(1, Math.round(m * 60)) + ' s';
    if (m >= 600) return Math.round(m / 60) + ' h';
    return dur(m);
  }
  function clock(m) {
    var x = ((Math.round(m) + DAY.CALL) % 1440 + 1440) % 1440, hh = Math.floor(x / 60), mm = x % 60;
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function band(b) { return h('span', { class: 'hh-band', dataset: { b: b } }, t((b === 'under' || b === 'over' ? 'lim_' : 'act_') + b)); }
  /** Dose % that matches a day level (dB(A)): 80 → 31.6 %, 85 → 100 %, 87 → 158.5 %. */
  function doseAt(level) { return 100 * Math.pow(10, (level - L.REF_LEVEL) / 10); }

  // ── stage controls keep keyboard focus across a re-render ──
  var refocus = null, refocusElse = null, curParams = null;
  function act(patchFn, sel) {
    return function (e) {
      var p = patchFn(window.simdeck.params);
      if (!p) return;
      refocus = e.currentTarget === document.activeElement ? sel : null;
      window.simdeck.set(p);
    };
  }
  function btn(attrs, patch, onclick, label, text) {
    var a = Object.assign({ type: 'button', class: 'hh-btn', 'aria-label': label, 'aria-disabled': patch ? 'false' : 'true',
      onmousedown: function (e) { e.preventDefault(); }, onclick: onclick }, attrs);
    return h('button', a, text);
  }

  // ── the totals ──
  function totals(s) {
    if (!s.blocks.length) return h('div', { class: 'hh-top' }, h('span', null, t('emptyDay')));
    function tot(k, lex, dose, b) {
      return h('div', { class: 'hh-tot', dataset: { k: k } },
        h('span', null, t(k === 'u' ? 'totU' : 'totE')),
        h('b', { translate: 'no' }, db(lex) + ' dB(A)'),
        h('span', null, t('doseOf', { p: pct(dose) })),
        band(b));
    }
    return h('div', { class: 'hh-top' },
      tot('u', s.lex, s.dose, s.action),
      tot('e', s.lexEar, s.doseEar, s.limit));
  }

  // ── the chart ──
  function axisOf(s) { return Math.max(MIN_AXIS, Math.ceil(s.len / 120) * 120); }
  function yMaxOf(s) { return Math.max(200, Math.ceil(Math.max(s.dose, s.doseEar) * 1.08 / 50) * 50); }

  function chart(s, A, Y) {
    function px(m) { return 1000 * m / A; }
    function py(d) { return 1000 - 1000 * d / Y; }
    var ptsU = s.curve.map(function (p) { return px(p.m) + ',' + py(p.u); }).join(' ');
    var ptsE = s.curve.map(function (p) { return px(p.m) + ',' + py(p.e); }).join(' ');
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    [['hh-e', ptsE], ['hh-u', ptsU]].forEach(function (x) {
      var pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
      pl.setAttribute('class', x[0]);
      pl.setAttribute('points', x[1]);
      svg.appendChild(pl);
    });
    var yticks = [h('span', { class: 'hh-ylabel' }, t('axisY'))], lines = [], names = [];
    var step = Y <= 200 ? 50 : Y <= 500 ? 100 : 200;
    for (var d = step; d < Y; d += step) {
      yticks.push(h('span', { class: 'hh-ytick', style: { bottom: (100 * d / Y) + '%' } }, d + ' %'));
    }
    yticks.push(h('span', { class: 'hh-ytick', style: { bottom: '0%' } }, '0'));
    // Each name sits at its line, but at least one name's height above the one below it (lines close on a tall axis).
    var floor = null;
    LINES.forEach(function (ln) {
      var y = (100 * doseAt(ln[0]) / Y) + '%';
      var at = floor ? 'max(' + y + ', calc(' + floor + ' + 1.35rem))' : y;
      lines.push(h('div', { class: 'hh-hline', dataset: { v: ln[1] }, style: { bottom: y } }));
      names.push(h('span', { class: 'hh-name', dataset: { v: ln[1] }, style: { bottom: at } }, t('line' + ln[1])));
      floor = at;
    });
    return h('div', { class: 'hh-chart' },
      h('div', { class: 'hh-yax' }, yticks),
      h('div', { class: 'hh-plot', role: 'img', 'aria-label': t('chartLabel', { u: pct(s.dose), e: pct(s.doseEar) }) }, lines, svg),
      h('div', { class: 'hh-names' }, names));
  }

  function lane(s, A) {
    var blocks = s.blocks.map(function (b) {
      var attrs = {
        class: 'hh-blk sd-fill', dataset: { c: COLOUR[b.kind], k: b.kind }, role: 'img',
        'aria-label': t('laneLabel', { kind: t('kind_' + b.kind), from: clock(b.start), to: clock(b.end), ear: t(b.ear ? 'earOn' : 'earOff') }),
        style: { left: (100 * b.start / A) + '%', width: (100 * b.len / A) + '%' }
      };
      if (b.ear) attrs.dataset.ear = '';
      return h('div', attrs, t('letter_' + b.kind));
    });
    var ticks = [];
    for (var m = 0; m <= A; m += 120) {
      ticks.push(h('span', { class: 'hh-tick', dataset: { odd: String((m / 120) % 2) }, style: { left: (100 * m / A) + '%' }, translate: 'no' }, clock(m)));
    }
    return [
      h('div', { class: 'hh-lanerow' }, h('span'), h('div', { class: 'hh-lane' }, blocks), h('span')),
      h('div', { class: 'hh-lanerow' }, h('span'), h('div', { class: 'hh-clock' }, ticks),
        s.blocks.length ? h('span', { class: 'hh-daylen' }, t('dayLen', { d: dur(s.len), end: clock(s.len) })) : h('span'))
    ];
  }

  // ── the table ──
  function table(s) {
    var p = curParams;
    var kids = ['colKind', 'colLen', 'colLevel', 'colFull', 'colShare', 'colEar'].map(function (k) { return h('span', { class: 'hh-th' }, t(k)); });
    kids.push(h('span', { class: 'hh-th' }));
    s.blocks.forEach(function (b, i) {
      var name = t('kind_' + b.kind);
      var note = b.kind === 'generator' ? t('genAt', { d: s.dist }) : b.kind === 'blanks' ? t.n('shotsN', b.shots) : null;
      var row = [];
      row.push(h('div', { class: 'hh-kind' },
        h('span', { class: 'hh-letter sd-fill', dataset: { c: COLOUR[b.kind] }, 'aria-hidden': 'true' }, t('letter_' + b.kind)),
        h('span', null, h('span', null, name), note ? h('span', { class: 'hh-muted' }, note) : null)));
      var lenBtn = function (dir) {
        var patch = L.bump(p, i, dir);
        var label = t('lenLabel', { kind: name, dir: t(dir < 0 ? 'less' : 'more') });
        var sel = '[data-len="' + i + '"][data-dir="' + dir + '"]';
        return btn({ dataset: { len: String(i), dir: String(dir) }, title: patch ? null : t(dir < 0 ? 'atMin' : 'atMax') }, patch,
          act(function (q) { return L.bump(q, i, dir); }, sel),
          patch ? label : label + ' (' + t(dir < 0 ? 'atMin' : 'atMax') + ')', dir < 0 ? '−' : '+');
      };
      row.push(h('div', { class: 'hh-step' }, lenBtn(-1), data(dur(b.len)), lenBtn(1)));
      row.push(h('span', { class: 'hh-num hh-lvl' }, b.ear ? db(b.level) + ' → ' + db(b.levelEar) : db(b.level)));
      row.push(h('span', { class: 'hh-num hh-full' }, allowed(b.allowed)));
      row.push(h('span', { class: 'hh-num hh-share' }, pct(s.doseEar ? 100 * b.doseEar / s.doseEar : 0) + ' %'));
      row.push(btn({ class: 'hh-btn hh-ear', dataset: { ear: String(i) }, 'aria-pressed': b.ear ? 'true' : 'false' }, true,
        act(function (q) { return L.toggleEar(q, i); }, '[data-ear="' + i + '"]'),
        t('earLabel', { kind: name }), t(b.ear ? 'earOn' : 'earOff')));
      row.push(btn({ class: 'hh-btn hh-rm', dataset: { rm: String(i) } }, true,
        act(function (q) { refocusElse = i > 0 ? '[data-rm="' + (i - 1) + '"]' : '[data-add]'; return L.remove(q, i); }, '[data-rm="' + i + '"]'),
        t('removeLabel', { kind: name }), '✕'));
      kids.push(h('div', { class: 'hh-row' }, row));
    });
    var adds = [h('span', { class: 'hh-muted' }, t('addHead'))];
    L.KIND_IDS.forEach(function (k) {
      var patch = L.add(p, k);
      adds.push(btn({ dataset: { add: k }, title: patch ? null : t('fullDay') }, patch,
        act(function (q) { return L.add(q, k); }, '[data-add="' + k + '"]'),
        patch ? t('addLabel', { kind: t('kind_' + k) }) : t('addLabel', { kind: t('kind_' + k) }) + ' (' + t('fullDay') + ')',
        t('add_' + k)));
    });
    if (s.full) adds.push(h('span', { class: 'hh-muted' }, t('fullDay')));
    return [h('div', { class: 'hh-table' }, kids), h('div', { class: 'hh-add' }, adds)];
  }

  // ── caption (SPEC.md "Legend and captions") ──
  function caption(s) {
    if (!s.blocks.length) return t('capEmpty');
    var out = [t('capTotals', { lex: db(s.lex), dose: pct(s.dose), lexE: db(s.lexEar), doseE: pct(s.doseEar) })];
    var share = function (x) { return pct(s.doseEar ? 100 * x / s.doseEar : 0); };
    if (s.top < 0) return out[0];
    var top = s.blocks[s.top];
    var openShots = s.blocks.filter(function (b) { return b.kind === 'blanks' && !b.ear; })[0];
    var shotsLine = function (b) { return t('capShots', { shots: t.n('shotsN', b.shots), kind: t('kind_blanks'), share: share(b.shotsEar) }); };
    if (top === openShots) {
      out.push(shotsLine(top));
    } else {
      var key = top.kind !== 'generator' ? 'capTop' : top.ear ? 'capTopGenEar' : 'capTopGen';
      out.push(t(key, {
        kind: t('kind_' + top.kind), base: db(top.base), level: db(top.levelEar), d: s.dist, allowed: allowed(top.allowed), share: share(top.doseEar)
      }));
      if (openShots) out.push(shotsLine(openShots));
      else if (s.lift && s.blocks.some(function (b) { return b.ear; })) out.push(t('capLift', { lift: s.lift, cut: num(L.cutOf(s.lift), 0) }));
    }
    return out.join(' ');
  }

  var hidden = function () { return false; };
  var params = [
    { key: 'dist', type: 'choice', label: t('dist'), hint: t('distHint'), options: L.DISTANCES.map(function (d) { return [d, t('distOpt', { d: d })]; }) },
    { key: 'lift', type: 'choice', label: t('lift'), hint: t('liftHint'), options: L.LIFTS.map(function (m) { return [m, m ? t('liftOpt', { m: m }) : t('lift_0')]; }) }
  ];
  for (var i = 0; i < DAY.SLOTS; i++) {
    params.push({ key: DAY.kKey(i), type: 'choice', label: t('kParam', { n: i + 1 }), visible: hidden,
      options: [[DAY.NONE, t('kind_none')]].concat(L.KIND_IDS.map(function (k) { return [k, t('kind_' + k)]; })) });
    params.push({ key: DAY.tKey(i), type: 'range', label: t('tParam', { n: i + 1 }), min: DAY.MIN_LEN, max: DAY.MAX_LEN, step: DAY.STEP, visible: hidden });
    params.push({ key: DAY.eKey(i), type: 'toggle', label: t('eParam', { n: i + 1 }), visible: hidden });
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'dash', label: t('legU') },
      { shape: 'hh-e', label: t('legE') },
      { shape: 'hh-ear', label: t('legEar') }
    ],
    render: function (c) {
      curParams = c.params;
      var s = c.state, A = axisOf(s), Y = yMaxOf(s);
      c.stage.replaceChildren(h('div', { class: 'hh' },
        totals(s),
        chart(s, A, Y),
        h('div', null, lane(s, A)),
        h('div', null, table(s)),
        h('p', { class: 'hh-foot' }, t('foot'))));
      if (refocus) {
        var b = c.stage.querySelector(refocus);
        if (b) b.focus();
        else if (refocusElse) { var f = c.stage.querySelector(refocusElse); if (f) f.focus(); }
        refocus = null;
      }
      refocusElse = null;
    },
    caption: function (c) { return caption(c.state); }
  });
})();
</script>
</body>
</html>
