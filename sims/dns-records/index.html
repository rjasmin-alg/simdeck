<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);

  var PRESET_KEY = {
    'ul-zone': 'presetUl', nxdomain: 'presetNx', cname: 'presetCname', mx: 'presetMx', nodata: 'presetNodata',
    'apex-cname': 'presetApex', delegation: 'presetDeleg'
  };
  /** Status badge per answer kind: an icon and a border style as well as a colour, so it reads in grayscale. */
  var KIND = {
    answer: { icon: '✓', st: 'ok', word: 'kindAnswer' },
    outside: { icon: '✓', st: 'ok', word: 'kindAnswer' },
    nodata: { icon: '∅', st: 'nodata', word: 'kindNodata' },
    nxdomain: { icon: '✕', st: 'nx', word: 'kindNx' },
    referral: { icon: '↷', st: 'ref', word: 'kindReferral' },
    loop: { icon: '✕', st: 'nx', word: 'kindFail' },
    'too-long': { icon: '✕', st: 'nx', word: 'kindFail' }
  };
  var CHECK_KEY = { 'bad-data': 'chkBadData', 'apex-no-soa': 'chkNoSoa', 'apex-no-ns': 'chkNoNs', 'cname-multiple': 'chkCnameMulti',
    'ttl-differs': 'chkTtl', 'mx-cname': 'chkMxCname' };
  var CAP_TYPE = { A: 'capA', AAAA: 'capAaaa', TXT: 'capTxt', SOA: 'capSoa', NS: 'capNsApex', CNAME: 'capCnameQ' };

  /** Data (names, addresses, types, codes) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function bare(name) { return name.replace(/\.$/, ''); }
  /** Record data that wraps only between its fields (an SOA has seven), never inside a name. */
  function dataWrap(text) {
    var out = [];
    String(text).split(' ').forEach(function (tok, i) { if (i) out.push(' '); out.push(h('span', { class: 'dr-tok' }, tok)); });
    return h('span', { translate: 'no' }, out);
  }
  /** A name or record data in the narrow answer table: it may break after a dot, or between fields. */
  function dotWrap(text) {
    var out = [];
    String(text).split(/(\.| )/).forEach(function (bit) {
      if (!bit) return;
      out.push(bit);
      if (bit === '.') out.push(h('wbr'));
    });
    return h('span', { translate: 'no' }, out);
  }

  /** The status chip: icon, code and (unless short) what it means. */
  function statusNode(a, short) {
    var k = KIND[a.kind];
    return h('span', { class: 'dr-st', dataset: { st: k.st } }, k.icon, data(L.statusOf(a)), short ? null : h('span', { class: 'dr-stw' }, t(k.word)));
  }

  // ── left: the zone as a rule table, then the zone check ──
  function zoneTable(s, fresh) {
    var a = s.answer;
    var used = L.rowsOf(a);
    // the status goes on the implicit row when nothing is in the answer, else (an alias that ends in NODATA or
    // NXDOMAIN) on the last answer row
    var statusAt = a.answer.length && a.kind !== 'answer' ? s.zone.map(function (r) { return r.id; }).indexOf(a.answer[a.answer.length - 1].id) : -1;
    // names the lookup visited: the query name and every canonical name it restarted at
    var visited = [s.query.name].concat(s.answer.chain.filter(function (c) { return c.kind === 'cname'; }).map(function (c) { return c.to; }));
    var notes = {};
    s.check.forEach(function (c) {
      if (c.code === 'cname-and-other' || c.code === 'cname-multiple') {
        s.zone.forEach(function (r) { if (c.rows.indexOf(r.id) >= 0 && r.type === 'CNAME') notes[r.id] = t('noteCname'); });
      } else if (c.code === 'mx-cname') notes[c.rows[0]] = t('noteMxAlias');
    });
    var rows = s.zone.map(function (r, i) {
      var spec = { no: i + 1, cells: { owner: r.owner, ttl: r.ttl, type: r.type }, action: dataWrap(L.dataText(r)), hit: false };
      if (s.served.indexOf(r.id) < 0) { spec.mark = 'skip'; spec.hit = null; spec.note = [{ k: 'muted', text: t('notLoaded') }]; }
      else if (used.answer.indexOf(r.id) >= 0) spec.hit = true;
      else if (used.authority.indexOf(r.id) >= 0 || used.additional.indexOf(r.id) >= 0) { spec.mark = 'hit'; spec.hit = null; }
      else if (visited.indexOf(L.absRow(r).owner) >= 0 && s.answer.kind !== 'referral') spec.miss = ['type'];
      if (notes[r.id]) spec.note = (spec.note || []).concat([{ k: 'dashed', text: notes[r.id] }]);
      return spec;
    });
    var table = RT({
      mode: 'deny',
      title: h('span', null, t('zoneTitle'), ' ', data('lab.example')),
      columns: [{ key: 'owner', label: t('colOwner') }, { key: 'ttl', label: t('colTtl') }, { key: 'type', label: t('colType') }],
      actionLabel: t('colData'),
      markLabel: t('colMark'),
      rows: rows,
      implicit: { text: t(a.kind === 'referral' ? 'implicitCut' : 'implicit'), action: '—' },
      at: 'all',
      done: true,
      outcome: function (i) { return i === rows.length || i === statusAt ? statusNode(a, true) : null; },
      words: { win: t('wordWin'), hit: t('wordHit') },
      stickyMark: true
    });
    // Rows the last toggle added: highlighted with an ink bar (a tag under the number would make the row taller).
    var trs = table.querySelectorAll('tbody tr');
    s.zone.forEach(function (r, i) {
      if (fresh.indexOf(r.id) >= 0) { trs[i].classList.add('dr-new'); trs[i].querySelector('.sd-rt-no').setAttribute('aria-label', t('tagNew')); }
    });
    return table;
  }

  function checkStrip(s) {
    var bad = L.hasError(s.check);
    var items = s.check.map(function (c) {
      var ico = c.level === 'ok' ? '✓' : c.level === 'warn' ? '⚠' : '✕';
      var text;
      var vars = { owner: data(c.owner), types: data(c.types.join(', ')), type: data(c.types[0] || ''), host: data(c.host || '') };
      if (c.level === 'ok') text = t.parts('chkOk', { n: s.zone.length, serial: data(s.zone[0].data.serial) });
      else if (c.code === 'cname-and-other') text = t.parts(c.apex ? 'chkApex' : 'chkCname', vars);
      else text = t.parts(CHECK_KEY[c.code], vars);
      return h('li', { dataset: { level: c.level } }, h('span', { class: 'dr-ico', 'aria-hidden': 'true' }, ico), h('span', null, text));
    });
    if (bad) items.push(h('li', { dataset: { level: 'error' } }, h('span', { class: 'dr-ico', 'aria-hidden': 'true' }, '⚠'),
      h('b', null, t('chkNotLoaded'))));
    return h('section', { class: 'dr-box dr-check', dataset: { bad: String(bad) } }, h('h2', null, t('checkTitle')), h('ul', null, items));
  }

  // ── right: the query, its status and the answer ──
  function answerBox(s, fresh) {
    var a = s.answer;
    var badges = h('div', { class: 'dr-badges' }, statusNode(a),
      h('span', { class: 'dr-aa', dataset: { on: String(a.aa) } }, t(a.aa ? 'aaYes' : 'aaNo')));
    var body = [];
    function section(key, sec, list) {
      if (sec !== 'answer' && !list.length) return;
      body.push(h('tr', null, h('th', { colspan: '5' }, t(key), ' · ', data(list.length))));
      if (!list.length) body.push(h('tr', null, h('td', { colspan: '5', class: 'dr-empty' }, t('empty'))));
      list.forEach(function (r, i) {
        var changed = fresh[sec].indexOf(i) >= 0;
        body.push(h('tr', { dataset: { sec: sec }, class: changed ? 'sd-changed' : null },
          h('td', { class: 'dr-own' }, dotWrap(r.owner)), h('td', null, data(r.ttl)), h('td', null, data('IN')), h('td', null, data(r.type)),
          h('td', { class: 'dr-data' }, dotWrap(L.dataText(r)))));
      });
    }
    section('secAnswer', 'answer', a.answer);
    section('secAuthority', 'authority', a.authority);
    section('secAdditional', 'additional', a.additional);
    return h('section', { class: 'dr-box dr-ans' },
      h('h2', null, t('queryTitle')),
      h('div', { class: 'dr-q' }, data(s.query.name + '  IN  ' + s.query.type)),
      badges,
      h('table', { class: 'dr-sec' }, h('tbody', null, body)));
  }

  function followBox(s) {
    var a = s.answer;
    if (!a.chain.length) return null;
    var tries = 0;
    var items = a.chain.map(function (c) {
      if (c.kind === 'cname') {
        return h('li', null, data(c.from), h('span', { class: 'dr-arrow', 'aria-hidden': 'true' }, '→'), data('CNAME'),
          h('span', { class: 'dr-arrow', 'aria-hidden': 'true' }, '→'), data(c.to));
      }
      if (c.kind === 'mx') {
        tries++;
        return h('li', { class: tries === 1 ? 'dr-first' : null }, h('span', null, t('followTry', { i: tries })), data(c.host),
          h('span', { class: 'dr-lbl' }, t('followPref', { pref: c.pref })),
          h('span', { class: 'dr-arrow', 'aria-hidden': 'true' }, '→'),
          c.addrs.length ? data(c.addrs.join(', ')) : h('span', { class: 'dr-lbl' }, t('followNoAddr')),
          c.alias ? h('span', { class: 'dr-warn' }, t('noteMxAlias')) : null);
      }
      if (c.kind === 'referral') {
        return c.ns.map(function (n) {
          return h('li', { class: 'dr-first' }, h('span', null, t('followAsk')), data(n.host),
            h('span', { class: 'dr-arrow', 'aria-hidden': 'true' }, '→'),
            n.addrs.length ? data(n.addrs.join(', ')) : h('span', { class: 'dr-lbl' }, t('followNoAddr')));
        });
      }
      return h('li', null, t('followOutside'));
    });
    return h('section', { class: 'dr-box dr-follow' }, h('h2', null, t('followTitle')), h('ol', null, items));
  }

  // "Changed" marks the zone rows the last param change added and the RRs of each answer section that are new since
  // the previous render (not on the renders while the page loads: preset, then the URL's params). A row a toggle
  // removes is gone from the table, so there is nothing to mark; the answer rows show what that removal changed.
  var last = { key: null, state: null, fresh: [], newRRs: null }, loaded = false;
  setTimeout(function () { loaded = true; }, 0);
  function changesFor(s, p) {
    var key = JSON.stringify(p);
    if (key !== last.key) {
      var prev = loaded ? last.state : null;
      last.fresh = prev ? s.zone.map(function (r) { return r.id; }).filter(function (id) { return !prev.zone.some(function (r) { return r.id === id; }); }) : [];
      last.newRRs = {};
      ['answer', 'authority', 'additional'].forEach(function (sec) { last.newRRs[sec] = prev ? L.newRRs(prev.answer, s.answer, sec) : []; });
      last.key = key; last.state = s;
    }
    return last;
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'qname', type: 'select', label: t('qname'), options: L.QNAMES.map(function (n) { return [n, n]; }) },
      { key: 'qtype', type: 'select', label: t('qtype'), options: L.TYPES.map(function (x) { return [x, x]; }) },
      { key: 'addWww', type: 'toggle', label: t('addWww') },
      { key: 'mx', type: 'toggle', label: t('mx') },
      { key: 'delegate', type: 'toggle', label: t('delegate') },
      { key: 'apexCname', type: 'toggle', label: t('apexCname') }
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(PRESET_KEY[x.id]), hint: t(PRESET_KEY[x.id] + 'Hint'), params: x.params };
    }),

    legend: [
      { shape: 'rt-win', label: t('legAnswer') },
      { shape: 'rt-hit', label: t('legAlong') },
      { shape: 'rt-no', label: t('legNo') },
      { shape: 'rt-warn', label: t('legWarn') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var ch = changesFor(s, c.params);
      c.stage.replaceChildren(h('div', { class: 'dr' },
        h('div', { class: 'dr-col' }, zoneTable(s, ch.fresh)),
        h('div', { class: 'dr-col' }, answerBox(s, ch.newRRs), followBox(s), checkStrip(s))));
    },

    caption: function (c) {
      var s = c.state, a = s.answer, q = s.query;
      var out = [];
      function add(parts) { if (out.length) out.push(' '); out = out.concat(parts); }
      if (s.loaded !== 'zone') {
        var apex = s.check.some(function (x) { return x.code === 'cname-and-other' && x.apex; });
        if (apex) add([t('capApex')]);
        add([t('capLastValid')]);
        return out;
      }
      var cn = a.chain.filter(function (x) { return x.kind === 'cname'; });
      var name = data(bare(q.name)), type = data(q.type);
      if (a.kind === 'answer') {
        if (cn.length) add(t.parts('capCname', { from: data(bare(cn[0].from)), type: type, to: data(bare(cn[cn.length - 1].to)) }));
        else if (q.type === 'MX') {
          var first = a.chain[0];
          add(t.parts('capMx', { host: data(bare(first.host)), pref: data(first.pref) }));
          if (first.addrs.length) add(t.parts('capMxHost', { addr: data(first.addrs[0]) }));
        } else {
          add(t.parts('capAnswer', { n: a.answer.length, name: name, type: type }));
          if (CAP_TYPE[q.type]) add([t(CAP_TYPE[q.type])]);
        }
      } else if (a.kind === 'nodata') {
        add(cn.length ? t.parts('capCnameNodata', { from: data(bare(cn[0].from)), to: data(bare(cn[cn.length - 1].to)), type: type })
          : t.parts('capNodata', { name: name, type: type }));
      } else if (a.kind === 'nxdomain') {
        add(cn.length ? t.parts('capCnameNx', { from: data(bare(cn[0].from)), to: data(bare(cn[cn.length - 1].to)) })
          : t.parts('capNx', { name: name }));
      } else if (a.kind === 'referral') {
        var ref = a.chain[a.chain.length - 1];
        add(t.parts('capReferral', { cut: data(bare(ref.cut)), ns: data(ref.ns.map(function (n) { return bare(n.host); }).join(', ')) }));
      } else if (a.kind === 'outside' && cn.length) {
        add(t.parts('capOutside', { to: data(bare(cn[cn.length - 1].to)) }));
      } else add([t('capFail')]);
      return out;
    }
  });
})();
</script>
