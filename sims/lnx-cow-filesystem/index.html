<!-- lnx-cow-filesystem: a pool of physical blocks under a copy-on-write filesystem. The live tree (podaci) and each
     snapshot are rows of pointers over the pool row; a snapshot copies pointers, a write goes to a new block and
     moves only the live pointer, rm and destroy free only what no tree points to. Drawn on kit view K3 (block grid).
     Preset win-vss (scenes previous-versions, diff-growth, diff-full) runs in copy-on-write mode: one row for the
     volume (the live data, never moved), one for the diff area, a row per shadow copy; renderCow below.
     Preset cow-vs-row (scenes four-writes, rewrite-same, delete-snapshot) runs in compare mode: two grids side by side,
     copy-on-write and redirect-on-write, each with its live map, snapshot map and 12 slots, and the I/Os of each write;
     renderCmp below.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

}

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">

      <details class="sd-explain">
        <summary></summary>

  </main>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { podaci: '1', '@s1': '2', '@s2': '3' };   // series colour per tree; rows also differ by label and place
  var SHARED = '8';                                         // a shared pool block: hatched, ×n, in the neutral colour
  COLOUR.S1 = '2'; COLOUR.S2 = '3'; COLOUR.S3 = '4';        // win-vss: the shadow copies

  /** Data (tree names, block ids and labels, the error text) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function sp(parts) { return [' '].concat(parts); }
  /** Block ids as a short list: runs of three or more as "0–7". */
  function ids(list) {
    var a = list.slice().sort(function (x, y) { return x - y; }), out = [];
    for (var i = 0; i < a.length;) {
      var j = i;
      while (j + 1 < a.length && a[j + 1] === a[j] + 1) j++;
      out.push(j - i >= 2 ? a[i] + '–' + a[j] : j > i ? a[i] + ', ' + a[j] : String(a[i]));
      i = j + 1;
    }
    return data(out.join(', '));
  }
  function names(list) { return data(list.join(t('and'))); }

  /** Caption parts from t(key) or, with n, t.n(key, n): node placeholders are put back where they land (cloned, so a
      node may appear twice), and *English term* becomes <em lang="en"> (the Croatian term rule, for terms the glossary
      lacks). */
  var MARK = '\u0001';
  function rich(key, vars, n) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var text = n === undefined ? t(key, flat) : t.n(key, n, flat);
    var out = [];
    text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
      if (!bit) return;
      bit.split(MARK).forEach(function (piece, j) {
        if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
        else if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }
  function term(key, later) { return h('span', null, rich(later ? key + 'Later' : key)); }

  function tree(s, name) { return s.trees.filter(function (x) { return x.name === name; })[0] || null; }
  function block(s, id) { return s.blocks.filter(function (b) { return b.id === id; })[0] || null; }
  function fs(s) { return L.fsOf(s); }
  function fileLen(s, p) { return L.norm(p).fileBlocks; }
  /** Has a snapshot been taken before step n (so the term is a later mention)? */
  function snapBefore(c) {
    var sc = L.script(c.params);
    for (var i = 0; i < c.n - 1; i++) if (sc[i].op === 'snapshot') return true;
    return false;
  }
  function cowBefore(c) {
    var sc = L.script(c.params);
    for (var i = 0; i < c.n - 1; i++) if (sc[i].op === 'write' && sc[i].idx) return true;
    return false;
  }

  // The legend of both modes; render hides the other mode's items (data-only, CSS above).
  var LEGEND = [
    { shape: 'hl', label: t('legChanged'), only: 'row' },
    { shape: 'hl', label: t('legChangedCow'), only: 'cow' },
    { shape: 'under', label: t('legRefs'), only: 'row' },
    { shape: 'bg-soft', c: Number(SHARED), label: t('legShared'), only: 'row' },
    { shape: 'bg-soft', c: Number(SHARED), label: t('legSharedCow'), only: 'cow' },
    { shape: 'bg-fill', c: 1, label: t('legOwned'), only: 'row' },
    { shape: 'bg-fill', c: 1, label: t('legLive'), only: 'cow' },
    { shape: 'bg-fill', c: 2, label: t('legCopy'), only: 'cow' },
    { shape: 'slot', label: t('legFree') },
    { shape: 'bg-dead', label: t('legFreed') },
    { shape: 'bg-link', label: t('legMoved'), only: 'row' },
    { shape: 'bg-link', label: t('legMovedCow'), only: 'cow' },
    // cow-vs-row (comparison)
    { shape: 'hl', label: t('legCmpWritten'), only: 'cmp' },
    { shape: 'bg-soft', c: Number(SHARED), label: t('legCmpShared'), only: 'cmp' },
    { shape: 'bg-fill', c: 1, label: t('legCmpLive'), only: 'cmp' },
    { shape: 'bg-fill', c: 2, label: t('legCmpSnap'), only: 'cmp' },
    { shape: 'bg-ghost', label: t('legCmpArea'), only: 'cmp' },
    { shape: 'bg-link', label: t('legCmpWrite'), only: 'cmp' },
    { shape: 'dash', label: t('legCmpRead'), only: 'cmp' },
    { shape: 'under', label: t('legCmpMeta'), only: 'cmp' },
    { shape: 'bg-span', label: t('legCmpRun'), only: 'cmp' },
    { shape: 'dot', label: t('legCmpJump'), only: 'cmp' }
  ];
  function setMode(p) {
    var m = L.mode(p), cow = m === 'copy-on-write', cmp = m === 'compare';
    document.documentElement.dataset.mode = cmp ? 'cmp' : cow ? 'cow' : 'row';
    // the host's subtitle says writes go to new blocks: in copy-on-write mode and in the comparison the subtitle says
    // what that mode does
    var sub = document.querySelector('.sd-subtitle');
    if (sub) {
      if (sub.dataset.host === undefined) sub.dataset.host = sub.textContent;
      sub.textContent = cmp ? t('subtitleCmp') : cow ? t('subtitleCow') : sub.dataset.host;
    }
    var lis = document.querySelectorAll('[data-sd-legend] > li');
    LEGEND.forEach(function (it, i) { if (lis[i] && it.only) lis[i].dataset.only = it.only; });
  }

  // ── stage ──

  function render(c) {
    setMode(c.params);
    if (L.mode(c.params) === 'copy-on-write') { renderCow(c); return; }
    if (L.mode(c.params) === 'compare') { renderCmp(c); return; }
    var s = c.state, p = c.params, o = L.norm(p), prev = c.prev;
    var moved = {};
    s.moved.forEach(function (m) { moved[m.k] = m; });
    var changedRefs = s.changed;
    var rows = L.treeNames(p).map(function (name) {
      var x = tree(s, name);
      var gone = s.gone.indexOf(name) >= 0;
      var cells = [];
      if (!x) {                                          // not yet taken or destroyed: the band keeps its place
        for (var k = 0; k < o.fileBlocks; k++) cells.push(null);
        return { id: name, label: gone ? h('span', { class: 'cw-gone', translate: 'no' }, name) : h('span', { class: 'cw-none', translate: 'no' }, name),
          aside: gone ? h('span', { class: 'cw-role' }, t('roleGone')) : '', cells: cells };
      }
      var f = x.files[L.FILE];
      for (var i = 0; i < o.fileBlocks; i++) {
        if (!f) { cells.push({}); continue; }
        var b = block(s, f[i]);
        var isNew = name === L.LIVE && moved[i];
        var created = s.event === 'snapshot' && s.op.name === name;
        cells.push({ text: b.ver, sub: '→' + b.id, kind: b.refs >= 2 ? 'soft' : 'fill', c: COLOUR[name],
          now: !!(isNew || created || (s.event === 'create')) });
      }
      var role = name === L.LIVE ? h('span', { class: 'cw-role', dataset: { on: 'true' } }, t('roleLive')) : h('span', { class: 'cw-role' }, t('roleSnap'));
      var aside = role;
      if (name === L.LIVE && !f && s.event !== 'start') aside = h('span', null, role, ' · ', h('span', { class: 'cw-role' }, t('roleNoFile')));
      if (name === L.LIVE && s.err) aside = h('span', null, role, ' · ', h('span', { class: 'cw-bad', translate: 'no' }, '✕ ' + s.err));
      return { id: name, label: name, aside: aside, cells: cells };
    });
    var freed = {};
    s.freed.forEach(function (f) { freed[f.id] = f.ver; });
    var pool = [];
    for (var id = 0; id < o.poolSize; id++) {
      var b = block(s, id);
      if (b) {
        var hs = L.holders(fs(s), id);
        pool.push({ text: b.ver, sub: p.showRefs ? '×' + b.refs : undefined, kind: b.refs >= 2 ? 'soft' : 'fill',
          c: b.refs >= 2 ? SHARED : COLOUR[hs[0]], now: s.allocated.indexOf(id) >= 0,
          mark: changedRefs.indexOf(id) >= 0 && s.allocated.indexOf(id) < 0 ? 'under' : undefined });
      } else if (id in freed) {
        pool.push({ text: freed[id], sub: p.showRefs ? '×0' : undefined, kind: 'dead' });
      } else pool.push({});
    }
    rows.push({ id: 'pool', label: h('span', null, t('poolRow')), cells: pool });

    // only the pointers that moved get an arrow (the kit's advice: few links); every other pointer is its "→n" line
    var links = s.moved.filter(function (m) { return m.from !== null; }).map(function (m) {
      return { from: { row: L.LIVE, cell: m.k }, to: { row: 'pool', cell: m.to }, now: true };
    });

    var t0 = L.space(fs(s)), t1 = prev ? L.space(fs(prev)) : null;
    var grid = Simdeck.blockGrid({
      dir: c.dir,
      title: t('gridTitle'),
      meta: [t.n('poolOf', o.poolSize), t.n('fileOf', o.fileBlocks, { f: L.FILE })],
      count: { text: t('count', { used: t0.used, total: t0.total }), hl: !!(t1 && t1.used !== t0.used) || s.event === 'rm' || !!s.err },
      cols: Math.max(o.poolSize, o.fileBlocks),
      colLabels: pool.map(function (x, i) { return String(i); }),
      cellHeight: '3.3rem',
      rows: rows, links: links,
      foot: [spaceTable(c, t0, t1)]
    });
    c.stage.replaceChildren(h('div', { class: 'cw' }, grid));
  }

  function spaceTable(c, now, before) {
    var p = c.params;
    var mark = function (v, was) { return h('td', { class: before && was !== v ? 'cw-now' : null }, v === null ? '–' : String(v)); };
    var find = function (sp, name) { return sp ? sp.trees.filter(function (x) { return x.name === name; })[0] || null : null; };
    var body = L.treeNames(p).map(function (name) {
      var r = find(now, name), w = find(before, name);
      var ref = r ? r.referenced : null, exc = r ? r.exclusive : null;
      return h('tr', { dataset: { off: r ? null : 'true' } }, h('th', { translate: 'no' }, name),
        mark(ref, w ? w.referenced : null), mark(exc, w ? w.exclusive : null));
    });
    var trees = h('table', { class: 'cw-table' },
      h('thead', null, h('tr', null, h('th', null, t('thTree')), h('th', null, t('thRef')), h('th', null, t('thExcl')))),
      h('tbody', null, body));
    var poolT = h('table', { class: 'cw-table' },
      h('thead', null, h('tr', null, h('th', null, t('thPool')), h('th', null, t('thUsed')), h('th', null, t('thFree')), h('th', null, t('thShared')))),
      h('tbody', null, h('tr', null, h('th', null, ''), mark(now.used, before && before.used), mark(now.free, before && before.free),
        mark(now.shared, before && before.shared))));
    return h('div', { class: 'cw-foot' }, trees, poolT);
  }

  // ── captions ──

  function used(s) { var x = L.space(fs(s)); return rich('capUsed', { used: x.used, total: x.total }); }

  function capSnap(c) {
    var s = c.state, later = snapBefore(c);
    var snap = term('termSnap', later);
    var live = tree(s, L.LIVE), ptrs = live.files[L.FILE] || [];
    var shared2 = ptrs.every(function (id) { return block(s, id).refs === 2; });
    if (!later && shared2) {
      return rich('capSnapFirst', { snap: snap, name: data(s.op.name), list: ids(ptrs), trees: t.n('trees', 2) });
    }
    return rich('capSnapLater', { snap: snap, name: data(s.op.name), live: data(L.LIVE), n: t.n('blocksOf', ptrs.length) })
      .concat(sp(used(s)));
  }

  function capCreate(c) {
    var s = c.state;
    return rich('capCreate', { f: data(L.FILE), live: data(L.LIVE), n: t.n('poolOf', s.allocated.length), list: ids(s.allocated) });
  }

  function capOverwrite(c) {
    var s = c.state, prev = c.prev;
    var ks = s.moved.map(function (m) { return m.k; });
    var out = rich('capWriteHead', { list: data(ks.join(', ')), f: data(L.FILE) }, ks.length);

  function capError(c) {

  // ── win-vss: copy-on-write mode ──

  /** A block id as the page shows it: a volume block by its number, a diff-area block as Δj. */
  function bid(s, id) { return id >= s.poolSize ? 'Δ' + (id - s.poolSize) : String(id); }

      }
      var xf = x.files[L.FILE];

        var xb = block(s, xf[i]);

  /** The Previous Versions list (each shadow, when it was taken, the diff blocks it reads, available or deleted) and

  // ── captions (copy-on-write mode) ──

  function captionCow(c) {

  /** One side: the live map and the snapshot map (logical block → slot) over the row of 12 physical slots. */

        h('tr', null, h('th', null, t('thThisWrite')),
          cell(write ? io.reads : null), cell(write ? io.writes : null), cell(write ? io.meta : null), cell(write ? io.reads + io.writes + io.meta : null)),
        h('tr', null, h('th', null, t('thAllWrites')),
          cell(tot.reads, write && io.reads > 0), cell(tot.writes, write && io.writes > 0), cell(tot.meta, write && io.meta > 0),
          cell(tot.reads + tot.writes + tot.meta, write))));
    return h('div', { class: 'cw-io' }, h('ol', { class: 'cw-ios' }, items), table);
  }

  // ── captions (comparison) ──

  function firstWrite(c) {
    var sc = L.script(c.params);
    for (var i = 0; i < c.n - 1; i++) if (sc[i].op === 'write') return false;
    return true;
  }
  function lastWrite(c) { var nx = L.script(c.params)[c.n]; return !nx || nx.op !== 'write'; }

  function captionCmp(c) {
    var s = c.state, sides = cmpSides(c.params), has = function (k) { return sides.indexOf(k) >= 0; };
    var out;
    if (s.event === 'start') {
      out = rich('capCmpStart', { snap: term('termSnap'), list: data('0–' + (L.CMP.vol - 1)) });
      out = out.concat(sp(rich(sides.length === 2 ? 'capCmpBoth' : sides[0] === 'cow' ? 'capCmpCowOnly' : 'capCmpRowOnly',
        { cow: term('termCmpCow'), row: term('termCmpRow') })));
      if (has('row')) out = out.concat(sp(rich('capCmpTrap', { cow: term('termCow', has('cow')) })));
      return out;
    }
    if (s.event === 'overwrite') {
      var k = s.op.idx[0];
      out = rich('capCmpHead', { k: data(k) });
      if (has('cow')) {
        var cw = s.cow;
        out = out.concat(sp(cw.copied.length
          ? rich('capCmpCowFirst', { to: data(cw.copied[0].to), n: t.n('ops', cw.io.list.length) })
          : rich('capCmpCowAgain', { n: t.n('ops', cw.io.list.length) })));
      }
      if (has('row')) {
        var rw = s.row, mv = rw.moved[0];
        out = out.concat(sp(rich('capCmpRow', { to: data(mv.to) })));
        if (rw.freed.length) out = out.concat(sp(rich('capCmpRowFreed', { old: data(mv.from) })));
        else out = out.concat(sp(rich('capCmpRowKept', { old: data(mv.from) })));
        var was = L.maps(c.prev.row.fs).live;
        if (contiguous(was) && !contiguous(L.maps(rw.fs).live)) out = out.concat(sp(rich('capCmpRowFrag')));
      }
      if (lastWrite(c) && !firstWrite(c)) {
        var nw = L.script(c.params).filter(function (o) { return o.op === 'write'; }).length;
        var ct = s.cow.total, rt = s.row.total;
        out = out.concat(sp(rich(sides.length === 2 ? 'capCmpTotalBoth' : sides[0] === 'cow' ? 'capCmpTotalCow' : 'capCmpTotalRow', {
          w: t.n('writesN', nw), n: t.n('ops', ct.reads + ct.writes + ct.meta), reads: t.n('reads', ct.reads), writes: t.n('writesN', ct.writes),
          rwrites: t.n('writesN', rt.writes), meta: t.n('metas', rt.meta) })));
      }
      return out;
    }
    if (s.event === 'read') {
      out = rich('capCmpRead');
      if (has('cow')) out = out.concat(sp(rich('capCmpReadCow', { list: data(s.cow.read.slots.join(' → ')), n: t.n('jumps', s.cow.read.jumps) })));
      if (has('row')) out = out.concat(sp(rich('capCmpReadRow', { list: data(s.row.read.slots.join(' → ')), n: t.n('jumps', s.row.read.jumps) })));
      return out;
    }
    out = rich('capCmpDestroy', { snap: term('termSnap', true) });
    if (has('cow')) out = out.concat(sp(rich('capCmpDestroyCow', { list: ids(s.cow.freed) })));
    if (has('row')) out = out.concat(sp(rich('capCmpDestroyRow', { list: ids(s.row.freed) })));
    return out;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'select', label: t('scene'), resets: true,
        options: [['basic', t('presetBasic')], ['delete-doesnt-free', t('presetDelete')], ['middle-snapshot', t('presetMiddle')],
          ['full-pool', t('presetFull')], ['previous-versions', t('presetPrev')], ['diff-growth', t('presetGrowth')],
          ['diff-full', t('presetDiffFull')], ['four-writes', t('presetFour')], ['rewrite-same', t('presetRewrite')],
          ['delete-snapshot', t('presetDelSnap')]],
        visible: function () { return false; } },
      { key: 'policy', type: 'choice', label: t('policy'),
        options: [['both', t('polBoth')], ['cow', t('polCow')], ['row', t('polRow')]],
        visible: function (q) { return L.mode(q) === 'compare'; } },
      { key: 'fileBlocks', type: 'range', label: t('fileBlocks'), min: 4, max: 8, resets: true,
        visible: function (q) { return L.mode(q) !== 'compare'; } },
      { key: 'poolSize', type: 'range', label: t('poolSize'), min: 10, max: 24, resets: true,
        visible: function (q) { return L.mode(q) === 'redirect-on-write'; } },
      { key: 'diffLimit', type: 'range', label: t('diffLimit'), min: 2, max: 8, resets: true,
        visible: function (q) { return L.mode(q) === 'copy-on-write'; } },
      { key: 'showRefs', type: 'toggle', label: t('showRefs') }
    ],

    presets: [
      { id: 'basic', label: t('presetBasic'), params: { scene: 'basic' }, hint: t('presetBasicHint') },
      { id: 'delete-doesnt-free', label: t('presetDelete'), params: { scene: 'delete-doesnt-free' }, hint: t('presetDeleteHint') },
      { id: 'middle-snapshot', label: t('presetMiddle'), params: { scene: 'middle-snapshot' }, hint: t('presetMiddleHint') },
      { id: 'full-pool', label: t('presetFull'), params: { scene: 'full-pool', poolSize: 10 }, hint: t('presetFullHint') },
      { id: 'previous-versions', label: t('presetPrev'), params: { scene: 'previous-versions', poolSize: 10, diffLimit: 8 }, hint: t('presetPrevHint') },
      { id: 'diff-growth', label: t('presetGrowth'), params: { scene: 'diff-growth', poolSize: 10, diffLimit: 8 }, hint: t('presetGrowthHint') },
      { id: 'diff-full', label: t('presetDiffFull'), params: { scene: 'diff-full', poolSize: 10, diffLimit: 4 }, hint: t('presetDiffFullHint') },
      { id: 'four-writes', label: t('presetFour'), params: { scene: 'four-writes', policy: 'both' }, hint: t('presetFourHint') },
      { id: 'rewrite-same', label: t('presetRewrite'), params: { scene: 'rewrite-same', policy: 'both' }, hint: t('presetRewriteHint') },
      { id: 'delete-snapshot', label: t('presetDelSnap'), params: { scene: 'delete-snapshot', policy: 'both' }, hint: t('presetDelSnapHint') }
    ],

    legend: LEGEND,

    render: render,

    caption: function (c) {
      var s = c.state;
      if (L.mode(c.params) === 'copy-on-write') return captionCow(c);
      if (L.mode(c.params) === 'compare') return captionCmp(c);
      if (s.event === 'start') return rich('capStart', { pool: t.n('blocksOf', s.poolSize), live: data(L.LIVE) });
      if (s.event === 'create') return capCreate(c);
      if (s.event === 'snapshot') return capSnap(c);
      if (s.event === 'overwrite') return capOverwrite(c);
      if (s.event === 'error') return capError(c);
      if (s.event === 'rm') return capRm(c);
      return capDestroy(c);
    }
  });

  // Both sliders start at their maximum, so a click near the end changes nothing: the kit blurs a slider only on
  // 'change', and the clicker's → would then move the slider instead of stepping. Release it after any pointer click (it fires after 'change')
  // (NOTES.md, Shared requests).
  document.querySelector('[data-sd-controls]').addEventListener('click', function (e) {
    var el = e.target;
    if (el.matches && el.matches('input[type="range"]') && e.detail > 0) el.blur();     // detail 0: not a pointer click
  });
})();
</script>
</body>
</html>
