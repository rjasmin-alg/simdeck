<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Inflacija, indeksacija i tečaj u višegodišnjem ugovoru</h1>
      <p class="sd-subtitle"></p>

    <div class="sd-tools" data-sd-tools></div>
  </header>

      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="indexation.js"></script>
<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var M = window.SimdeckModels.indexation;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var NAME = { fixed: 'clauseFixed', indexed: 'clauseIndexed', capped: 'clauseCapped' };
  var sim = null;
  var refocus = null;   // the stage button to give focus back to after a render

  // ── numbers in the page's language ──

  function dec(x, d) {
    var s = x.toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 11); minus is U+2212. */
  function money(x) {
    var r = M.roundMoney(x);
    return (r < 0 ? '−' : '') + t('eur', { n: group(Math.abs(r)) });
  }
  /** Euros with a sign: +2 030 € or −25 939 € (0 without one). */
  function signed(x) {
    var r = M.roundMoney(x);
    return (r > 0 ? '+' : '') + money(r);
  }
  /** A percentage with as many decimals as it needs (0 or 1); minus is U+2212. */
  function pct(v) { return (v < 0 ? '−' : '') + t('pct', { n: dec(Math.abs(v), v % 1 ? 1 : 0) }); }
  /** A choice's options with their labels: fx + eurWeak → t('fxEurWeak'). */
  function opts(list, prefix) {
    return list.map(function (id) { return [id, t(prefix + id[0].toUpperCase() + id.slice(1))]; });
  }
  function glyph(k) { return h('span', { class: 'ix-g', dataset: { k: k, c: k === 'nominal' ? '1' : '2' } }); }

  // ── the board: the three kinds of price on the same paths ──

  function subOf(s, id) {
    if (id === 'fixed') {
      var price = s.clauses[0].rows[0].price;   // in the contract's currency
      return t('subFixed', { p: s.p.cur === 'usd' ? t('usd', { n: group(M.roundMoney(price)) }) : money(price) });
    }
    if (id === 'indexed') return t('subIndexed');
    return t('subCapped', { f: pct(s.floorUsed), c: pct(s.p.cap) });
  }

  function board(s) {
    var th = function (k, title, sub, extra) {
      var attrs = { class: 'ix-th', dataset: { k: k } };
      if (k === 'last') attrs.dataset.col = k;
      return h('div', attrs, title, sub ? h('span', null, sub) : null, extra || null);
    };
    var cells = [
      th('clause', t('thClause'), null, h('span', { class: 'ix-key' }, t('cheapest'))),
      th('nominal', t('thNominal'), t('thNominalSub')),
      th('real', t('thReal'), t('thRealSub')),
      th('last', t('thLast'), t('thLastSub'))
    ];
    s.clauses.forEach(function (c) {
      var on = c.id === s.p.clause;
      cells.push(h('div', { class: 'ix-name' }, h('button', {
        type: 'button', class: 'ix-pick', 'aria-pressed': String(on), dataset: { key: 'clause:' + c.id },
        onclick: function () { refocus = 'clause:' + c.id; sim.set({ clause: c.id }); }
      }, h('div', null, h('b', null, t(NAME[c.id])), h('span', null, subOf(s, c.id))))));
      var win = function (k) { return s.best[k].indexOf(c.id) >= 0 ? ' ix-win' : ''; };
      cells.push(h('div', { class: 'ix-val' + win('nominal'), translate: 'no' }, h('b', null, money(c.nominal))));
      cells.push(h('div', { class: 'ix-val' + win('real'), translate: 'no' }, h('b', null, money(c.real))));
      var last = c.rows[c.rows.length - 1];
      cells.push(h('div', { class: 'ix-val', dataset: { k: 'last', col: 'last' }, translate: 'no' },
        money(last.nominal) + ' · ' + money(last.real)));
    });
    return h('div', { class: 'ix-board' }, cells);
  }

  // ── the currency buttons ──

  function buttons(label, key, options, current) {
    return h('div', { class: 'ix-tool', role: 'group', 'aria-label': label },
      h('span', { class: 'ix-tool-l' }, label),
      h('div', { class: 'sd-seg' }, options.map(function (o) {
        return h('button', {
          type: 'button', 'aria-pressed': String(o[0] === current), dataset: { key: key + ':' + o[0] },
          onclick: function () {
            var patch = {};
            patch[key] = o[0];
            refocus = key + ':' + o[0];
            sim.set(patch);
          }
        }, o[1]);
      })));
  }

  /** The currency, and in dollars the exchange-rate path. */
  function tools(s) {
    return h('div', { class: 'ix-tools' },
      buttons(t('cur'), 'cur', opts(L.CHOICES.cur, 'cur'), s.p.cur),
      s.p.cur === 'usd' ? buttons(t('fx'), 'fx', opts(L.CHOICES.fx, 'fx'), s.p.fx) : null);
  }

  // ── the chart: each yearly payment, paid (nominal) and worth (real) ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step that keeps the axis to about four or five grid lines. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }

  function chart(s) {
    var c = s.chosen, rows = c.rows, n = rows.length;
    var vals = [s.price];
    rows.forEach(function (r) { vals.push(r.nominal, r.real); });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var step = niceStep(Math.max(hi - lo, 20000) / 4);
    var bottom = Math.floor(lo / step) * step, top = Math.ceil(hi / step) * step;
    if (lo - bottom < 0.3 * step) bottom -= step;   // room for the marks and their labels at the edges
    if (top - hi < 0.3 * step) top += step;
    var yp = function (v) { return (100 * (top - v) / (top - bottom)) + '%'; };
    var yn = function (v) { return (1000 * (top - v) / (top - bottom)).toFixed(1); };
    var xc = function (y) { return 100 * (y + 0.5) / n; };
    var ticks = [], lines = [], marks = [], xs = [];
    for (var v = bottom; v <= top + 1e-6; v += step) {
      ticks.push(h('span', { class: 'ix-tick', translate: 'no', style: { top: yp(v) } }, money(v)));
      lines.push(h('div', { class: 'ix-gl', style: { top: yp(v) } }));
    }
    for (var k = 1; k < n; k++) lines.push(h('div', { class: 'ix-vl', style: { left: (100 * k / n) + '%' } }));
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    ['nominal', 'real'].forEach(function (key) {
      var d = rows.map(function (r, y) { return (y ? 'L' : 'M') + (10 * xc(y)).toFixed(1) + ',' + yn(r[key]); }).join(' ');
      var path = document.createElementNS(NS, 'path');
      path.setAttribute('class', 'ix-line');
      path.setAttribute('data-k', key);
      path.setAttribute('data-c', key === 'nominal' ? '1' : '2');
      path.setAttribute('d', d);
      svg.appendChild(path);
    });
    rows.forEach(function (r, y) {
      ['nominal', 'real'].forEach(function (key) {
        var pos = { left: xc(y) + '%', top: yp(r[key]) };
        marks.push(h('span', { class: 'ix-mark', dataset: { k: key }, style: pos }, glyph(key)));
        marks.push(h('span', { class: 'ix-v', translate: 'no', dataset: { k: key, c: key === 'nominal' ? '1' : '2' }, style: pos }, money(r[key])));
      });
      // under each year: the price level (and the past year's inflation), what held the price, the exchange rate
      var plus = function (v) { return (v > 0 ? '+' : '') + pct(v); };
      var bound = r.held === 'cap' ? s.p.cap : s.floorUsed;
      xs.push(h('div', { class: 'ix-x' },
        h('b', { class: 'ix-yr' }, t('yearN', { n: r.year })),
        h('b', { class: 'ix-yr-n', translate: 'no' }, String(r.year)),
        h('span', null, y === 0 ? t('levelStart') : t('levelN', { l: dec(100 * r.level, 1) }) + ' (' + plus(s.inflation[y - 1]) + ')'),
        r.held ? h('span', { class: 'ix-held' }, t(r.held === 'cap' ? 'heldCap' : 'heldFloor', { r: plus(bound) })) : null,
        s.p.cur === 'usd' ? h('span', null, t('fxN', { x: dec(r.fx, 2) })) : null));
    });
    var signLine = h('div', { class: 'ix-sign', style: { top: yp(s.price) } });
    return h('div', { class: 'ix-panel' },
      h('p', { class: 'ix-title' }, t('chartTitle'), h('span', null, t('chartNote'))),
      h('div', { class: 'ix-plotgrid' }, h('div', { class: 'ix-axis' }, ticks),
        h('div', { class: 'ix-plot' }, lines, signLine, svg, marks),
        h('div', { class: 'ix-xaxis' }, xs)));
  }

  // ── render and caption ──

  function render(c) {
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'ix' },
      board(s),
      tools(s),
      chart(s),
      h('p', { class: 'ix-foot' }, t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-key="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, ch = s.chosen, rows = ch.rows;
    var k = L.captionKey(s);
    var b = function (x) { return h('b', { translate: 'no' }, x); };
    var out = t.parts(k.key, { clause: t(NAME[ch.id]), n: b(money(ch.nominal)), r: b(money(ch.real)), b: b(money(s.signing)) });
    var paid = rows.map(function (r) { return r.nominal; });
    k.notes.forEach(function (key) {
      var vars = {
        nFixed: { p: b(money(rows[0].nominal)), r5: b(money(rows[rows.length - 1].real)) },
        nFixedDearer: { p: b(money(rows[0].nominal)), r5: b(money(rows[rows.length - 1].real)), d: b(money(s.clauses[0].realR - s.clauses[1].realR)) },
        nFixedUsdFlat: {},
        nFixedUsd: { lo: b(money(Math.min.apply(null, paid))), hi: b(money(Math.max.apply(null, paid))) },
        nIndexed: { p: b(money(s.price)) },
        nIndexedUsd: {},
        nCap: { k: t.n('anniversariesN', ch.heldCap), d: b(signed(s.vsIndexed)) },
        nFloor: { j: t.n('anniversariesN', ch.heldFloor), d: b(signed(s.vsIndexed)) },
        nCapFloor: { k: t.n('anniversariesN', ch.heldCap), j: t.n('anniversariesN', ch.heldFloor), d: b(signed(s.vsIndexed)) },
        nNoBound: {},
        nFxUp: { x: b(money(Math.abs(ch.fxEffect))) },
        nFxDown: { x: b(money(Math.abs(ch.fxEffect))) },
        nFxNone: {}
      }[key];
      out.push(' ');
      out = out.concat(t.parts(key, vars));
    });
    return out;
  }

  var labels = {
    'fixed-steady': 'pFixedSteady', 'indexed-spike': 'pIndexedSpike', 'capped-spike': 'pCappedSpike',
    'floor-low': 'pFloorLow', 'usd-euro-weak': 'pUsdEuroWeak', 'usd-euro-strong': 'pUsdEuroStrong'
  };
  var R = L.LIM;
  var never = function () { return false; };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'infl', value: L.defaults.infl, type: 'choice', label: t('infl'), options: opts(L.CHOICES.infl, 'infl') },
      { key: 'premium', value: L.defaults.premium, type: 'range', label: t('premium'), min: R.premium.min, max: R.premium.max, step: R.premium.step, format: pct },
      { key: 'cap', value: L.defaults.cap, type: 'range', label: t('cap'), min: R.cap.min, max: R.cap.max, step: R.cap.step, format: pct },
      { key: 'floor', value: L.defaults.floor, type: 'range', label: t('floor'), min: R.floor.min, max: R.floor.max, step: R.floor.step, format: pct },
      // set on the stage (the board's names, the currency and rate buttons); hidden here, kept in the URL
      { key: 'clause', value: L.defaults.clause, type: 'choice', label: t('clause'), options: opts(L.CHOICES.clause, 'clause'), visible: never },
      { key: 'cur', value: L.defaults.cur, type: 'choice', label: t('cur'), options: opts(L.CHOICES.cur, 'cur'), visible: never },
      { key: 'fx', value: L.defaults.fx, type: 'choice', label: t('fx'), options: opts(L.CHOICES.fx, 'fx'), visible: never }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'ix-nominal', label: t('legNominal') },
      { shape: 'ix-real', label: t('legReal') },
      { shape: 'ix-sign', label: t('legSigning', { x: money(L.PRICE) }) }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
