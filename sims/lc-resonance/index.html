<!-- LC resonant circuit: adopted from 50ohm-contents-hr/contents/html/applet_schwingkreis.html and its figures 891–899
     (the circuit with its fields) and 1027–1035 (the current over time) (CC BY 4.0, 50ohm.de-Autorenteam, AJW-Referat
     des DARC e.V.; figures by DL9MJ) into the simdeck kit (docs/sim-ui.md), translated and changed. A stepper: step 0 is
     the circuit at rest, then one eighth of a period per step from the charged capacitor (t = 0) to t = T. The model is
     in sim.js, the words in strings.js. The original's 18 pictures in a 2-second loop are now one circuit SVG and one
     plot drawn at 1:1 (nothing vendored: the original loads jQuery and Chart.js from 50ohm.de but uses neither). -->

<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="lc-resonance"]; colours only from kit tokens. */
[data-sim="lc-resonance"] .lc { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1.4rem; height: 100%; padding: 0.4rem 0.6rem; box-sizing: border-box; }
[data-sim="lc-resonance"] .lc-right { display: flex; flex-direction: column; gap: 0.6rem; min-height: 0; }
[data-sim="lc-resonance"] .lc-circ, [data-sim="lc-resonance"] .lc-plot { position: relative; min-height: 0; }
[data-sim="lc-resonance"] .lc-plot { flex: 1 1 auto; }
[data-sim="lc-resonance"] .lc-circ svg, [data-sim="lc-resonance"] .lc-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="lc-resonance"] h2 { margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
/* SVG text */
[data-sim="lc-resonance"] svg text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
[data-sim="lc-resonance"] svg text.lc-big { font-size: var(--fs-lg); font-weight: 700; fill: var(--ink); }
[data-sim="lc-resonance"] svg text.lc-c1 { fill: var(--c1); font-weight: 700; font-size: var(--fs-md); }
[data-sim="lc-resonance"] svg text.lc-c2 { fill: var(--c2); font-weight: 700; font-size: var(--fs-md); }
/* the circuit */
[data-sim="lc-resonance"] .lc-wire { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
[data-sim="lc-resonance"] .lc-plate { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
[data-sim="lc-resonance"] .lc-efield { stroke: var(--c2); stroke-width: 3; }
[data-sim="lc-resonance"] .lc-ehead { fill: var(--c2); }
[data-sim="lc-resonance"] .lc-hfield { fill: none; stroke: var(--c1); stroke-width: 3; stroke-dasharray: 10 6; }
[data-sim="lc-resonance"] .lc-hhead { fill: var(--c1); }
[data-sim="lc-resonance"] .lc-cur { stroke: var(--c1); stroke-linecap: round; }
[data-sim="lc-resonance"] .lc-curhead { fill: var(--c1); }
/* the plot */
[data-sim="lc-resonance"] .lc-axis { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="lc-resonance"] .lc-axhead { fill: var(--muted); }
[data-sim="lc-resonance"] .lc-grid { stroke: var(--line); stroke-width: 1; }
[data-sim="lc-resonance"] .lc-wave { fill: none; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
[data-sim="lc-resonance"] .lc-wave.lc-i { stroke: var(--c1); }
[data-sim="lc-resonance"] .lc-wave.lc-u { stroke: var(--c2); stroke-dasharray: 10 7; stroke-linecap: butt; }
[data-sim="lc-resonance"] .lc-wave.lc-rest { stroke: var(--line); stroke-width: 2; }
[data-sim="lc-resonance"] .lc-now { stroke: var(--muted); stroke-width: 2; stroke-dasharray: 3 5; }
[data-sim="lc-resonance"] .lc-dot-i { fill: var(--c1); stroke: var(--bg); stroke-width: 2; }
[data-sim="lc-resonance"] .lc-dot-u { fill: var(--bg); stroke: var(--c2); stroke-width: 3.5; }
/* energy bars and readout */
[data-sim="lc-resonance"] .lc-energy { display: grid; grid-template-columns: auto 1fr 4.2rem; gap: 0.3rem 0.6rem; align-items: center; font-size: var(--fs-md); }
[data-sim="lc-resonance"] .lc-energy h2 { grid-column: 1 / -1; }
[data-sim="lc-resonance"] .lc-track { height: 1.3rem; border: 2px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
[data-sim="lc-resonance"] .lc-fill { height: 100%; }
[data-sim="lc-resonance"] .lc-fill.lc-e { background-color: var(--c2); }
[data-sim="lc-resonance"] .lc-fill.lc-m { background-color: var(--c1); }
[data-sim="lc-resonance"] .lc-pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
[data-sim="lc-resonance"] .lc-read { margin: 0; padding: 0.4rem 0.8rem; border: 2px solid var(--line); border-radius: var(--radius-sm); font-size: var(--fs-md); line-height: 1.4; }
[data-sim="lc-resonance"] .lc-read p { margin: 0; }
[data-sim="lc-resonance"] .lc-read b { font-variant-numeric: tabular-nums; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's transport. */
[data-sim="lc-resonance"] .lc-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="lc-resonance"] .lc-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content; circuit, plot, energy and readout stack. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="lc-resonance"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="lc-resonance"] .lc { display: block; height: auto; padding: 0.3rem 0.3rem 0.6rem; }
  [data-sim="lc-resonance"] .lc-circ { aspect-ratio: 1.15 / 1; }
  [data-sim="lc-resonance"] .lc-right { margin-top: 0.8rem; }
  [data-sim="lc-resonance"] .lc-plot { flex: none; aspect-ratio: 1.3 / 1; }
  [data-sim="lc-resonance"] .lc-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="lc-resonance"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">LC titrajni krug</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="lc-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language (decimal comma in Croatian).
  function num(x) { return String(x).replace('.', t('dec')); }
  function mhz(x) { return t('mhz', { v: num(x) }); }
  function ns(x) { return t('ns', { v: num(x) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function pts(list) { return list.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }
  // A filled triangle with its tip at (x, y), pointing along (dx, dy), length d.
  function head(x, y, dx, dy, d, cls) {
    var len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, w = d * 0.5;
    return s('path', { class: cls, d: 'M' + x + ',' + y + 'L' + (x - ux * d - uy * w) + ',' + (y - uy * d + ux * w) +
      'L' + (x - ux * d + uy * w) + ',' + (y - uy * d - ux * w) + 'Z' });
  }
  function text(x, y, str, cls, attrs) {
    return s('text', Object.assign({ class: cls || null, x: x, y: y, translate: 'no' }, attrs || {}), str);
  }

  var presetKeys = { start: 'presetStart', magnetic: 'presetMagnetic', moreC: 'presetMoreC', lessL: 'presetLessL' };

  // ── the circuit, after figures 891–899: the coil on the left side of the loop, the capacitor on the right.
  //    Drawn in units of a 10 × 8 box, scaled to fit; text stays at its CSS size. ──
  function drawCircuit(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), k = Math.min(W / 10, H / 8), ox = (W - 10 * k) / 2, oy = (H - 8 * k) / 2;
    var X = function (x) { return ox + x * k; }, Y = function (y) { return oy + y * k; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var xl = 3, xr = 8, yt = 1, yb = 7, c0 = 2.5, c1 = 5.5, pTop = 3.6, pBot = 4.4, pw = 1;

    // the magnetic field around the coil: pairs of loops through the coil's axis, more of them for more current
    for (var j = 1; j <= st.hLines; j++) {
      var a = 0.42 * j, b = 1.15 + 0.5 * j;
      [-1, 1].forEach(function (side) {
        svg.append(s('ellipse', { class: 'lc-hfield', cx: X(xl + side * a), cy: Y(4), rx: a * k, ry: b * k }));
        // outside the coil the field runs against its direction inside: up there for positive current
        var xo = X(xl + side * 2 * a), d = 0.7 * rem;
        svg.append(head(xo, Y(4) - st.iDir * d / 2, 0, -st.iDir, d, 'lc-hhead'));
      });
    }
    if (st.hLines) svg.append(text(X(xl + 0.84 * st.hLines) + 0.6 * rem, Y(4) + 0.35 * rem, t('nameH'), 'lc-c1'));

    // the wires and the coil
    var coil = 'M' + X(xl) + ',' + Y(c0);
    var turns = 5, pitch = (c1 - c0) / turns;
    for (var n = 0; n < turns; n++) coil += 'A' + (0.42 * k) + ',' + (pitch / 2 * k) + ' 0 0 0 ' + X(xl) + ',' + Y(c0 + (n + 1) * pitch);
    svg.append(s('path', { class: 'lc-wire', d: 'M' + X(xl) + ',' + Y(c0) + 'L' + X(xl) + ',' + Y(yt) + 'L' + X(xr) + ',' + Y(yt) + 'L' + X(xr) + ',' + Y(pTop) }));
    svg.append(s('path', { class: 'lc-wire', d: 'M' + X(xr) + ',' + Y(pBot) + 'L' + X(xr) + ',' + Y(yb) + 'L' + X(xl) + ',' + Y(yb) + 'L' + X(xl) + ',' + Y(c1) }));
    svg.append(s('path', { class: 'lc-wire', d: coil }));
    // above the coil, right of the wire: clear of the widest field line there
    svg.append(text(X(xl) + 0.5 * rem, Y(1.85), t('nameL'), 'lc-big'));

    // the capacitor: two plates, charges and the electric field between them
    svg.append(s('line', { class: 'lc-plate', x1: X(xr - pw), x2: X(xr + pw), y1: Y(pTop), y2: Y(pTop) }));
    svg.append(s('line', { class: 'lc-plate', x1: X(xr - pw), x2: X(xr + pw), y1: Y(pBot), y2: Y(pBot) }));
    svg.append(text(X(xr - pw) - 0.5 * rem, Y(pTop) - 0.6 * rem, t('nameC'), 'lc-big', { 'text-anchor': 'end' }));
    if (st.eLines) {
      var m = st.eLines, gap = 0.15 * k, d2 = Math.min(0.6 * rem, (Y(pBot) - Y(pTop) - 2 * gap) * 0.6);
      for (var e = 0; e < m; e++) {
        var x = X(xr - pw + (e + 0.5) * 2 * pw / m);
        // from the + plate to the − plate
        var yFrom = st.uDir > 0 ? Y(pTop) + gap : Y(pBot) - gap, yTo = st.uDir > 0 ? Y(pBot) - gap : Y(pTop) + gap;
        svg.append(s('line', { class: 'lc-efield', x1: x, x2: x, y1: yFrom, y2: yTo - Math.sign(yTo - yFrom) * d2 * 0.8 }));
        svg.append(head(x, yTo, 0, yTo - yFrom, d2, 'lc-ehead'));
        svg.append(text(x, Y(pTop) - 0.35 * rem, st.uDir > 0 ? '+' : '−', 'lc-c2', { 'text-anchor': 'middle' }));
        svg.append(text(x, Y(pBot) + 1.25 * rem, st.uDir > 0 ? '−' : '+', 'lc-c2', { 'text-anchor': 'middle' }));
      }
      svg.append(text(X(xr + pw) + 0.5 * rem, Y(4) + 0.35 * rem, t('nameE'), 'lc-c2'));
    }

    // the current on the upper wire: positive from the capacitor's upper plate towards the coil (leftwards)
    var xm = X((xl + xr) / 2), ya = Y(yt);
    if (st.iDir) {
      var half = (0.9 + 0.9 * Math.abs(st.i)) * k / 2, dir = -st.iDir, dh = 1.1 * rem;
      var tip = xm + dir * half;
      svg.append(s('line', { class: 'lc-cur', x1: xm - dir * half, x2: tip - dir * dh * 0.8, y1: ya, y2: ya, 'stroke-width': 4 + 6 * Math.abs(st.i) }));
      svg.append(head(tip, ya, dir, 0, dh, 'lc-curhead'));
      svg.append(text(xm, ya - 0.9 * rem, t('nameI'), 'lc-c1', { 'text-anchor': 'middle' }));
    } else {
      svg.append(text(xm, ya - 0.7 * rem, t('iZero'), null, { 'text-anchor': 'middle' }));
    }
    box.replaceChildren(svg);
  }

  // ── current and voltage over one period, after figures 1027–1035: drawn up to the current instant, the rest faint ──
  function drawPlot(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 2.2 * rem, right = 1.6 * rem, top = 1 * rem, bottom = 2 * rem;
    var X = function (tt) { return left + tt / L.EIGHTHS * (W - left - right); };
    var amp = (H - top - bottom) / 2 / 1.12, y0 = top + (H - top - bottom) / 2;
    var Y = function (v) { return y0 - v * amp; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    [1, -1].forEach(function (v) { svg.append(s('line', { class: 'lc-grid', x1: left, x2: W - right, y1: Y(v), y2: Y(v) })); });
    // axes
    svg.append(s('line', { class: 'lc-axis', x1: left, x2: left, y1: Y(-1.12), y2: Y(1.12) }));
    svg.append(s('line', { class: 'lc-axis', x1: left, x2: W - right + 0.2 * rem, y1: y0, y2: y0 }));
    svg.append(head(W - right + 0.8 * rem, y0, 1, 0, 0.6 * rem, 'lc-axhead'));
    svg.append(text(W - right + 0.8 * rem, y0 - 0.5 * rem, t('axisT'), null, { 'text-anchor': 'end' }));
    [[2, 'tickQuarter'], [4, 'tickHalf'], [6, 'tickThree'], [8, 'tickFull']].forEach(function (p) {
      svg.append(s('line', { class: 'lc-axis', x1: X(p[0]), x2: X(p[0]), y1: y0 - 0.3 * rem, y2: y0 + 0.3 * rem }));
      svg.append(text(X(p[0]), Y(-1.12) + 1.5 * rem, t(p[1]), null, { 'text-anchor': 'middle' }));
    });
    svg.append(text(left - 0.3 * rem, y0 + 1.3 * rem, '0', null, { 'text-anchor': 'end' }));
    // the waves
    var tr = L.trace(), upto = st.k == null ? -1 : st.k * L.POINTS;
    var line = function (list, key, cls) { svg.append(s('polyline', { class: 'lc-wave ' + cls, points: pts(list.map(function (p) { return [X(p.t), Y(p[key])]; })) })); };
    line(tr, 'u', 'lc-rest');
    line(tr, 'i', 'lc-rest');
    if (upto > 0) {
      var done = tr.slice(0, upto + 1);
      line(done, 'u', 'lc-u');
      line(done, 'i', 'lc-i');
    }
    if (st.k != null) {
      var x = X(st.k);
      svg.append(s('line', { class: 'lc-now', x1: x, x2: x, y1: Y(1.12), y2: Y(-1.12) }));
      svg.append(s('circle', { class: 'lc-dot-u', cx: x, cy: Y(st.u), r: 0.45 * rem }));
      svg.append(s('circle', { class: 'lc-dot-i', cx: x, cy: Y(st.i), r: 0.45 * rem }));
      // the names next to their dots, on the side with room; nudged apart where the two dots are close
      var side = st.k >= 6 ? -1 : 1, anchor = side > 0 ? 'start' : 'end', dx = side * 0.8 * rem;
      var yu = Y(st.u), yi = Y(st.i);
      if (Math.abs(yu - yi) < 1.2 * rem) { var sp = st.u >= st.i ? -1 : 1; yu += sp * 0.6 * rem; yi -= sp * 0.6 * rem; }
      svg.append(text(x + dx, yu + 0.35 * rem, t('nameU'), 'lc-c2', { 'text-anchor': anchor }));
      svg.append(text(x + dx, yi + 0.35 * rem, t('nameI'), 'lc-c1', { 'text-anchor': anchor }));
    } else {
      svg.append(text(left - 0.4 * rem, Y(1), t('nameI') + ', ' + t('nameU'), null, { 'text-anchor': 'end', dy: '0.35em' }));
    }
    box.replaceChildren(svg);
  }

  function energy(st) {
    var row = function (label, share, cls) {
      var pct = Math.round(share * 100);
      return [h('span', null, label), h('div', { class: 'lc-track' }, h('div', { class: 'lc-fill ' + cls, style: { width: pct + '%' } })),
        h('span', { class: 'lc-pct', translate: 'no' }, t('pct', { v: String(pct) }))];
    };
    return h('div', { class: 'lc-energy' }, h('h2', null, t('energyTitle')),
      row(t('energyE'), st.wE, 'lc-e'), row(t('energyM'), st.wM, 'lc-m sd-hatch'));
  }

  function readout(st) {
    var b = function (x) { return h('b', null, x); };
    return h('div', { class: 'lc-read', translate: 'no' },
      h('p', null, t.parts('formula', { f: b(mhz(st.f0Mhz)) })),
      h('p', null, t.parts('period', { T: b(ns(st.Tns)) })),
      h('p', null, st.k == null ? t('timeRest') : t.parts('timeNow', { k: String(st.k), t: b(ns(st.tNs)) })));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [
      { key: 'l', type: 'choice', label: t('l'), hint: t('lHint'), options: L.L_OPTIONS.map(function (v) { return [v, t('uh', { v: num(v) })]; }) },
      { key: 'c', type: 'choice', label: t('c'), hint: t('cHint'), options: L.C_OPTIONS.map(function (v) { return [v, t('pf', { v: num(v) })]; }) }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: x.step }; }),
    legend: [
      { c: 2, shape: 'hollow', label: t('legendE') },
      { c: 1, label: t('legendH') }
    ],

    render: function (c) {
      var st = c.state;
      var circ = h('div', { class: 'lc-circ' }), plot = h('div', { class: 'lc-plot' });
      c.stage.replaceChildren(h('div', { class: 'lc' }, circ,
        h('div', { class: 'lc-right' }, h('h2', null, t('plotTitle')), plot, energy(st), readout(st))));
      drawCircuit(circ, st);
      drawPlot(plot, st);
    },

    caption: function (c) {
      var st = c.state;
      var out = [t('caption' + st.n)];
      if (st.k != null) {
        var b = function (x) { return h('b', { translate: 'no' }, x); };
        out.push(t.parts('captionTime', { t: b(ns(st.tNs)), f: b(mhz(st.f0Mhz)) }));
      }
      return out;
    }
  });

  // The drawings are in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
