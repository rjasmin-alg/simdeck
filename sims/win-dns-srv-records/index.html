<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { cl: '1', DC01: '2', dns: '3', pub: '4', DC02: '5' };

  /** Data (names, addresses, record names, codes) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'sr-mono' : cls || null }, String(text)); }
  /** A long name that may break after each dot. */
  function breakable(text) {
    var out = [];
    String(text).split(/(?<=[.])/).forEach(function (part, i) { if (i) out.push(h('wbr')); out.push(part); });
    return out;
  }
  function q(text) { return h('b', { translate: 'no' }, String(text)); }
  function qLong(text) { return h('b', { translate: 'no' }, breakable(text)); }
  function sub(text) { return h('span', { class: 'sr-sub' }, text); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function last(c) { return c.n > 0 ? c.state.log[c.state.log.length - 1] : null; }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  /** Full owner name of a record name relative to the domain. */
  function full(name) { return L.fqdn(name); }
  /** Short form for a chip's field: the service and the site or "dc". */
  function short(e) {
    var svc = e.purpose === 'kdc' ? '_kerberos' : '_ldap';
    return svc + ' ' + (e.scope === 'site' ? e.site : 'dc');
  }
  function lane(dc) { return dc; }
  function serverLane(c) { return c.state.client.dns === L.PUBLIC ? 'pub' : 'dns'; }

  // ── records ──
  function renderRecords(c) {
    var s = c.state, e = last(c);
    var picked = e && e.kind === 'answer' ? e.pick : null;
    var restored = e && e.kind === 'updateOk' ? s.restored : [];
    var box = h('section', { class: 'sr-box sr-recs' },
      h('h2', null, t('recsTitle')),
      h('div', { class: 'sr-line' }, data(L.DOMAIN + ' · ' + L.MSDCS, 'sr-sub sr-mono')),
      h('div', { class: 'sr-line' }, sub(t('recsNote'))));
    L.USES.forEach(function (use) {
      box.append(h('h3', null, t('use_' + use)));
      L.rowsOf(use).forEach(function (row) {
        var focus = s.focus === row.name;
        var chips = L.rowRecords(s, row.id).map(function (r) {
          var ds = { state: r.present ? 'present' : 'deleted', c: COLOUR[r.target] };
          var isPick = focus && picked === r.target;
          if (isPick) ds.pick = '';
          var back = restored.indexOf(r.key) >= 0;
          var label = t(back ? 'recRestored' : isPick ? 'recPicked' : r.present ? 'recPresent' : 'recDeleted');
          return h('span', { class: 'sr-chip' + (back ? ' sd-changed' + anim(c) : ''), dataset: ds, translate: 'no', title: label, 'aria-label': r.target + ': ' + label },
            r.target, h('span', { class: 'sr-mk', 'aria-hidden': 'true' }, r.present ? (isPick ? '◂' : '✓') : '✕'));
        });
        var name = row.type === 'CNAME' ? row.name.slice(0, 8) + '…._msdcs' : row.name;
        box.append(h('div', { class: 'sr-row' + (focus ? ' sd-changed' : '') },
          h('span', { class: 'sr-name', translate: 'no', title: full(row.name) }, breakable(name)),
          data(row.port ? ':' + row.port : row.type, 'sr-port'),
          h('span', { class: 'sr-chips' }, chips)));
      });
    });
    return box;
  }

  // ── result ──
  function renderResult(c) {
    var s = c.state, p = c.params, r = s.result;
    if (!r) {
      return h('section', { class: 'sr-box sr-res' }, h('h2', null, t('resTitle')),
        h('span', { class: 'sr-res-sym', 'aria-hidden': 'true' }, '…'), h('span', null, t('resWait_' + p.action)));
    }
    if (!r.ok) {
      return h('section', { class: 'sr-box sr-res' + (c.last ? anim(c) : ''), dataset: { k: 'fail' } }, h('h2', null, t('resTitle')),
        h('span', { class: 'sr-res-sym', 'aria-hidden': 'true' }, '✕'), h('span', { class: 'sr-res-main' }, t('resFail_' + r.action)),
        h('span', { class: 'sr-msg' }, '“', t('msg_' + r.action, { d: L.DOMAIN }), '”'));
    }
    var warn = r.wan || r.how === 'ntlm';
    var tags = [h('span', { class: 'sr-tag' }, t('resVia', { dc: r.dc }))];
    if (r.kdc) tags.push(h('span', { class: 'sr-tag' }, t('resKdc', { kdc: r.kdc })));
    if (r.how === 'ntlm') tags.push(h('span', { class: 'sr-tag', dataset: { k: 'warn' } }, '⚠ ', t('resNtlm')));
    if (r.wan) tags.push(h('span', { class: 'sr-tag', dataset: { k: 'warn' } }, '⚠ ', t('resWan')));
    return h('section', { class: 'sr-box sr-res' + anim(c), dataset: { k: warn ? 'warn' : 'ok' } }, h('h2', null, t('resTitle')),
      h('span', { class: 'sr-res-sym', 'aria-hidden': 'true' }, '✓'), h('span', { class: 'sr-res-main' }, t('resOk_' + r.action)), tags);
  }

  // ── chart ──
  function lanes(c) {
    var s = c.state, cl = s.client, e = last(c);
    function on(id) {
      if (!e) return null;
      var who = [];
      switch (e.kind) {
        case 'restart': who = ['DC01']; break;
        case 'update': case 'updateOk': who = ['DC01', 'dns']; break;
        case 'query': case 'answer': who = ['cl', serverLane(c)]; break;
        case 'ping': who = ['cl', e.to]; break;
        case 'pong': who = ['cl', e.from]; break;
        case 'asReq': case 'ntlm': who = ['cl', e.to]; break;
        case 'asRep': case 'ntlmOk': who = ['cl', e.from]; break;
      }
      return who.indexOf(id) >= 0 ? 'active' : null;
    }
    var site = cl.site ? data(cl.site, '') : t('siteUnknown');
    var out = [{ id: 'cl', mark: 'P', c: COLOUR.cl, shape: 'square', name: data(cl.name, ''), state: on('cl'),
      tags: sub(t('laneClient')),
      body: [h('div', { class: 'sr-line' }, data(cl.ip)), h('div', { class: 'sr-line' }, sub([t('siteWord'), ': ']), site)],
      changed: !!(c.prev && c.prev.client.site !== cl.site) }];
    if (cl.dns === L.PUBLIC) {
      out.push({ id: 'pub', mark: 'N', c: COLOUR.pub, name: t('pubName'), state: on('pub'),
        tags: null, body: [h('div', { class: 'sr-line' }, data(L.PUBLIC)), h('div', { class: 'sr-line' }, sub(t('pubTag')))] });
    }
    out.push({ id: 'dns', mark: 'N', c: COLOUR.dns, name: t('dnsWord'), state: on('dns'),
      tags: sub(t('dnsOnDc')), body: [h('div', { class: 'sr-line' }, data(L.DC.DC01.ip)), h('div', { class: 'sr-line' }, sub(t('dnsZones')))] });
    ['DC01', 'DC02'].forEach(function (dc) {
      out.push({ id: dc, mark: dc === 'DC01' ? '1' : '2', c: COLOUR[dc], name: data(dc, ''), state: on(dc),
        tags: null, body: [h('div', { class: 'sr-line' }, data(L.DC[dc].ip)), h('div', { class: 'sr-line' }, sub([t('siteWord'), ': ']), data(L.DC[dc].site, ''))] });
    });
    return out;
  }
  function rows(c) {
    var out = [], srv = serverLane(c);
    c.state.log.forEach(function (e) {
      var r = null;
      switch (e.kind) {
        case 'restart': r = { kind: 'note', lane: 'DC01', text: t('noteRestart'), k: 'solid' }; break;
        case 'update': r = { from: 'DC01', to: 'dns', label: 'UPDATE', c: COLOUR.DC01, line: 'dashed', fields: h('span', null, t.n('nRecords', e.count)) }; break;
        case 'updateOk': r = { from: 'dns', to: 'DC01', label: 'NOERROR', c: COLOUR.dns, line: 'dashed', fields: data('+' + e.added) }; break;
        case 'query': r = { from: 'cl', to: srv, label: 'SRV?', c: COLOUR.cl, line: 'dashed', fields: data(short(e)) }; break;
        case 'answer':
          r = e.rcode === 'NOERROR'
            ? { from: srv, to: 'cl', label: 'SRV', c: COLOUR[srv], line: 'dashed', fields: data(e.targets.map(function (x) { return x.dc; }).join(', ')) }
            : { from: srv, to: 'cl', label: 'NXDOMAIN', c: COLOUR[srv], line: 'dashed' };
          break;
        case 'ping': r = { from: 'cl', to: lane(e.to), label: 'LDAP ping', c: COLOUR.cl, line: 'dotted', place: 'mid' }; break;
        case 'pong': r = { from: lane(e.from), to: 'cl', label: h('span', null, t('pongLabel')), c: COLOUR[e.from], line: 'dotted',
          fields: h('span', null, data(e.site, ''), ' ', e.closest ? '✓ ' : '✕ ', t(e.closest ? 'closestYes' : 'closestNo')) }; break;
        case 'asReq': r = { from: 'cl', to: lane(e.to), label: 'AS-REQ', c: COLOUR.cl, fields: data(e.user), place: 'mid' }; break;
        case 'asRep': r = { from: lane(e.from), to: 'cl', label: 'AS-REP', c: COLOUR[e.from], fields: data('TGT'), place: 'mid' }; break;
        case 'ntlm': r = { from: 'cl', to: lane(e.to), label: 'NTLM', c: COLOUR.cl, weight: 'thin', fields: data(e.user), place: 'mid' }; break;
        case 'ntlmOk': r = { from: lane(e.from), to: 'cl', label: 'NTLM', c: COLOUR[e.from], weight: 'thin', fields: data('✓'), place: 'mid' }; break;
      }
      if (!r) return;
      r.changed = e.n === c.n;
      out.push(r);
      // no DC found: the failure as a note on the client, in the same step
      if (e.result && !e.result.ok) out.push({ kind: 'note', lane: 'cl', text: t('noteNoDc'), k: 'fill', changed: r.changed });
    });
    return out;
  }
  function renderChart(c) {
    return Simdeck.sequence({
      dir: c.dir,
      lanes: lanes(c),
      rows: rows(c),
      timeWidth: '0.4rem',
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, p = c.params, cl = s.client, n = c.n;
    var C = q(cl.name), D = q(L.DOMAIN), U = q(L.NETBIOS + '\\' + L.USER);
    if (c.first) {
      var out = rich('capStart_' + p.action, { c: C, ip: q(cl.ip), d: D, u: U, dns: q(cl.dns) });
      if (cl.dns === L.PUBLIC) out.push(t('startPublic'));
      if (p.action === 'join') out = out.concat(rich('startJoin', { site: q(cl.subnet) }));
      else out = out.concat(cl.site ? rich('startSite', { site: q(cl.site) }) : rich('startUnknown'));
      var del = [];
      L.ROWS.forEach(function (row) { if (s.records.some(function (r) { return r.row === row.id && !r.present; })) del.push(row.name); });
      if (del.length) {
        var list = [];
        del.forEach(function (x, i) { if (i) list.push(', '); list.push(qLong(x)); });
        out = out.concat(t.parts('startDeleted', { list: h('span', null, list) }));
      }
      if (p.restartNetlogon) out.push(t('startRestart'));
      return out;
    }
    var e = last(c), r = e.result;
    switch (e.kind) {
      case 'restart': return rich('capRestart', { n: n, dc: q(e.dc) });
      case 'update': return rich('capUpdate', { n: n, dc: q(e.from), k: q(e.count) });
      case 'updateOk': {
        var o = rich('capUpdateOk', { n: n });
        o.push(e.added ? t.n('backN', e.added) : t('backNone'));
        if (s.records.some(function (x) { return x.target === 'DC02' && !x.present; })) o.push(t('dc02Stays'));
        return o;
      }
      case 'query': {
        var Q = qLong(full(e.name));
        if (e.purpose === 'kdc') return rich(e.scope === 'site' ? 'capQueryKdcSite' : 'capQueryKdcDomain', { n: n, c: C, q: Q });
        if (e.scope === 'domain') {
          var triedSite = s.log.some(function (x) { return x.kind === 'query' && x.purpose === 'ldap' && x.scope === 'site'; });
          return rich(triedSite ? 'capQueryFallback' : p.action === 'join' ? 'capQueryJoin' : 'capQueryUnknown', { n: n, c: C, q: Q });
        }
        var pinged = s.log.filter(function (x) { return x.kind === 'pong'; });
        if (pinged.length) return rich('capQueryLearnt', { n: n, c: C, q: Q, dc: q(pinged[pinged.length - 1].from), site: q(e.site) });
        return rich('capQuerySite', { n: n, q: Q });
      }
      case 'answer':
        if (r && cl.dns === L.PUBLIC) {
          var all = s.records.every(function (x) { return x.present; });
          return rich((all ? 'capFailPublic_' : 'capFailPublicAny_') + r.action, { n: n, dns: q(L.PUBLIC), z: q(L.MSDCS) });
        }
        if (r) {
          var answers = s.log.filter(function (x) { return x.kind === 'answer'; }).length;
          return rich('capFail_' + r.action, { n: n, nx: t(answers > 1 ? 'nxAgain' : 'nxOnce'), msg: t('msg_' + r.action, { d: L.DOMAIN }) });
        }
        if (e.rcode !== 'NOERROR') {
          if (cl.dns === L.PUBLIC) return rich('capNxPublic', { n: n, dns: q(L.PUBLIC), d: D });
          var pongs = s.log.filter(function (x) { return x.kind === 'pong'; });
          if (e.purpose === 'ldap' && pongs.length) return rich('capNxStay', { n: n, c: C, site: q(e.site), dc: q(pongs[pongs.length - 1].from) });
          return rich('capNxDeleted', { n: n });
        }
        if (e.targets.length === 1) {
          var x = e.targets[0];
          return rich('capAnswer1', { n: n, t: q(L.fqdn(x.dc.toLowerCase())), ip: q(L.DC[x.dc].ip), port: q(x.port) });
        }
        return rich('capAnswer2', { n: n, list: q(e.targets.map(function (y) { return y.dc; }).join(', ')), t: q(e.pick) });
      case 'ping': return rich('capPing', { n: n, c: C, dc: q(e.to) });
      case 'pong':
        if (e.closest) return rich('capPongClosest', { n: n, c: C, dc: q(e.from), site: q(e.site) });
        if (e.learnt) return rich('capPongLearnt', { n: n, c: C, dc: q(e.from), site: q(e.site) });
        return rich('capPongFar', { n: n, c: C, dc: q(e.from), site: q(e.site) });
      case 'asReq': return rich('capAsReq', { n: n, c: C, u: U, dc: q(e.to) });
      case 'asRep': return tails(c, rich('capAsRep_' + r.action, { n: n, c: C, u: U, d: D, dc: q(e.from) }));
      case 'ntlm': return rich('capNtlm', { n: n, c: C, dc: q(e.to) });
      case 'ntlmOk': return tails(c, rich('capNtlmOk_' + r.action, { n: n, u: U, dc: q(e.from) }));
      default: return '';
    }
    function tails(c2, parts) {
      var res = c2.state.result, sub2 = c2.state.client.subnet;
      if (res.wan) {
        var far = [res.dc, res.kdc].filter(function (d, i, a) { return d && L.DC[d].site !== sub2 && a.indexOf(d) === i; });
        parts = parts.concat(t.parts('tailWan', { dcs: q(far.join(', ')) }));
      }
      if (c2.params.gc) parts.push(t('tailGc'));
      return parts;
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'action', type: 'choice', label: t('pAction'), options: [['join', t('optJoin')], ['logon', t('optLogon')]], resets: true },
      { key: 'site', type: 'choice', label: t('pSite'), options: [['hq', t('optHq')], ['branch', t('optBranch')], ['unknown', t('optUnknown')]], resets: true },
      { key: 'dns', type: 'choice', label: t('pDns'), options: [['dc01', t('optDc01')], ['public', t('optPublic')]], resets: true },
      { key: 'locator', type: 'toggle', label: t('pLocator'), resets: true },
      { key: 'siteRecord', type: 'toggle', label: t('pSiteRecord'), resets: true },
      { key: 'kerberos', type: 'toggle', label: t('pKerberos'), resets: true },
      { key: 'gc', type: 'toggle', label: t('pGc'), resets: true },
      { key: 'restartNetlogon', type: 'toggle', label: t('pRestart'), resets: true }
    ],

    presets: [
      { id: 'healthy-join', label: t('presetHealthy'), hint: t('presetHealthyHint'), params: {} },
      { id: 'no-site-record', label: t('presetNoSite'), hint: t('presetNoSiteHint'), params: { action: 'logon', site: 'branch', siteRecord: true } },
      { id: 'no-locator', label: t('presetNoLocator'), hint: t('presetNoLocatorHint'), params: { locator: true, siteRecord: true } },
      { id: 'public-dns', label: t('presetPublic'), hint: t('presetPublicHint'), params: { dns: 'public' } },
      { id: 'netlogon-fix', label: t('presetFix'), hint: t('presetFixHint'), params: { locator: true, siteRecord: true, restartNetlogon: true } },
      { id: 'no-kerberos', label: t('presetNoKerberos'), hint: t('presetNoKerberosHint'), params: { action: 'logon', kerberos: true } }
    ],

    legend: [
      { shape: 'dash', label: t('legDns') },
      { shape: 'dot', label: t('legCldap') },
      { shape: 'line', label: t('legKerb') },
      { shape: 'rec', label: t('legPresent') },
      { shape: 'del', label: t('legDeleted') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'sr' }, renderRecords(c), h('div', { class: 'sr-right' }, renderResult(c), chart)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
