<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var MSG = 'Permission denied';
  var MAP_PID = 4321;   // the container's first process on the host: its uid_map is the container's

  // ── small pieces ──

  /** Data (numbers, names, paths, commands) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { class: 'um-mono' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  function code(text) { return h('code', { translate: 'no' }, String(text)); }
  function has(s, key) { return s.changed.indexOf(key) >= 0; }
  function badgeC() { return h('span', { class: 'um-badge-c', translate: 'no' }, 'C'); }

  /** Caption parts: t.parts with every node placeholder cloned where it lands, *word* as <em lang="en"> and `x` as
      code (from sims/lnx-namespaces/index.html); a number becomes data. */
  var MARK = '\u0001';
  function rich(key, vars) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); }
      else if (typeof v === 'number') { flat[k] = MARK + nodes.length + MARK; nodes.push(data(v)); }
      else flat[k] = v;
    });
    var out = [];
    [].concat(t.parts(key, flat)).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/(\*[^*]+\*|`[^`]+`)/).forEach(function (bit) {
        if (!bit) return;
        if (/^\*[^*]+\*$/.test(bit)) { out.push(h('em', { lang: 'en' }, bit.slice(1, -1))); return; }
        if (/^`[^`]+`$/.test(bit)) { out.push(code(bit.slice(1, -1))); return; }
        bit.split(MARK).forEach(function (piece, j) {
          if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
          else if (piece) out.push(piece);
        });
      });
    });
    return out;
  }
  function sp(parts) { return [' '].concat(parts); }

  /** A UID badge: side 'c' hatched, 'h' plain; unmapped dashed; the side's name for it (or none) after it. */
  function uidBadge(side, uid, name, unmapped) {
    return h('span', { class: 'um-uid' + (side === 'c' ? ' um-uid-c' : '') + (unmapped ? ' um-uid-un' : '') },
      h('span', { translate: 'no' }, String(uid)), name ? h('small', { translate: 'no' }, name) : null);
  }
  function nameOf(name) { return name ? data(name, 'um-name') : h('span', { class: 'um-muted um-small' }, t('noName')); }

  // ── the command strip ──

  function cmdText(a) {
    if (a.op === 'create') return 'touch /data/' + a.path;
    if (a.op === 'ls') return 'ls -ln /data';
    if (a.op === 'read') return 'cat /data/' + a.path;
    return 'echo x >> /data/' + a.path;
  }
  function errText(a) {
    if (a.op === 'read') return 'cat: /data/' + a.path + ': ' + MSG;
    return 'sh: /data/' + a.path + ': ' + MSG;
  }
  function strip(s) {
    var a = s.action;
    if (!a) return h('div', { class: 'um-strip' }, h('span', { class: 'um-muted' }, t('before')));
    var w = s.who;
    var side = h('span', { class: 'um-side' + (a.side === 'c' ? ' um-side-c' : '') },
      a.side === 'c' ? [badgeC(), ' '] : null, t(a.side === 'c' ? 'sideC' : 'sideH'), ' ',
      h('span', null, t.parts('runsAs', { user: data(w.user), uid: data(a.side === 'c' ? w.uidIn : w.uidOut) })));
    var root = a.side === 'c' ? w.uidIn === 0 : w.uidOut === 0;
    var res;
    if (!s.result.ok) res = h('span', { class: 'um-res um-res-err', translate: 'no' }, '✗ ' + errText(a));
    else if (a.op === 'ls') res = h('span', { class: 'um-res-note' }, t.parts('resLs', { side: t(a.side === 'c' ? 'resLsC' : 'resLsH') }));
    else res = h('span', { class: 'um-res-ok' }, '✓ ', t(a.op === 'create' ? 'resCreated' : 'resOk'));
    return h('div', { class: 'um-strip' }, side,
      h('span', { class: 'um-cmd' }, h('span', { class: 'um-prompt', translate: 'no' }, root ? '# ' : '$ '), h('span', { translate: 'no' }, cmdText(a))),
      res);
  }

  // ── the grid ──

  function cell(col, cls, kids) { return h('div', { class: 'um-cell' + (col === 'm' ? ' um-mid' : '') + (cls ? ' ' + cls : ''), dataset: { col: col } }, kids); }
  function blank(col) { return cell(col, 'um-blank', null); }

  function arrow(line, unmapped, now) {
    var lab = unmapped ? t('arrowNone') : t('arrowLine', { n: line + 1 });
    return h('div', { class: 'um-arrow' + (unmapped ? ' um-arrow-un' : '') + (now ? ' um-now' : '') },
      h('span', { class: 'um-head-l', 'aria-hidden': 'true' }, '◀'), h('span', { class: 'um-lab' }, lab),
      h('span', { class: 'um-head-r', 'aria-hidden': 'true' }, '▶'));
  }

  function mapBox(c) {
    var s = c.state, now = c.n > 0;
    var rows = s.map.map(function (l, i) {
      var used = s.used.indexOf(i) >= 0;
      return h('tr', { class: used ? 'um-used' + (now ? ' um-now' : '') : null },
        h('td', null, t('mapLine', { n: i + 1 })),
        h('td', { translate: 'no' }, String(l.inside)), h('td', { translate: 'no' }, String(l.outside)), h('td', { translate: 'no' }, String(l.count)));
    });
    var su = s.subuid;
    return h('div', { class: 'um-map' },
      h('h4', null, t.parts('mapHead', { pid: data(MAP_PID) })),
      h('table', { class: 'um-maptab' },
        h('thead', null, h('tr', null, h('th'), h('th', { colspan: 3 }, t('mapCols')))),
        h('tbody', null, rows)),
      s.rootless ? null : h('div', { class: 'um-mapnote' }, t('mapRootful')),
      h('h4', null, data(t('subuidHead'))),
      h('div', null, h('span', { class: 'um-subuid' + (s.rootless ? '' : ' um-off'), translate: 'no' }, su.user + ':' + su.start + ':' + su.count),
        s.rootless ? null : [' ', h('span', { class: 'um-muted um-small' }, t('subuidUnused'))]));
  }

  function passwd(side) {
    var names = L.NAMES[side];
    var ids = Object.keys(names).map(Number).filter(function (u) { return u !== L.OVERFLOW; }).sort(function (a, b) { return a - b; });
    return h('div', null, h('h4', null, data(t('passwd'))),
      h('ul', { class: 'um-passwd', translate: 'no' }, ids.map(function (u) { return h('li', null, names[u] + ' ' + u); })));
  }

  function procRow(c, side, p) {
    var s = c.state;
    var now = c.n > 0 && has(s, 'proc:' + p.id);
    return h('div', { class: 'um-row' + (now ? ' um-now sd-changed' : '') },
      uidBadge(side, p.uid, null, false), nameOf(p.name),
      h('span', { class: 'um-dim', translate: 'no' }, 'PID ' + p.pid), data(p.id, 'um-dim'));
  }

  function fileRow(c, side, f, actorSide) {
    var s = c.state, a = s.action;
    var now = c.n > 0 && has(s, 'file:' + f.path);
    var listed = c.n > 0 && has(s, 'list:' + side);
    var refused = s.result && !s.result.ok && a.path === f.path && side === actorSide;
    var unmapped = side === 'c' && f.unmapped;
    return h('div', { class: 'um-row' + (listed ? ' um-listed' : '') + (refused ? ' um-refused' : '') + (now || listed ? ' um-now sd-changed' : '') },
      data(L.lsString(f.mode), 'um-dim um-mode'), uidBadge(side, f.uid, null, unmapped), nameOf(f.name),
      data('/data/' + f.path, 'um-name'), f.isNew ? h('span', { class: 'um-tag' }, t('newTag')) : null,
      refused ? h('span', { class: 'um-x', 'aria-label': t('legRefused') }, '✗') : null);
  }

  function render(c) {
    var s = c.state, a = s.action;
    var rows = [];                       // one entry per grid row: [container cell, middle cell, host cell]
    rows.push([cell('c', 'um-head', h('h3', null, badgeC(), t('colC'), h('small', null, t('colC_note')))),
      cell('m', 'um-head', h('h3', null, t('colMap'))),
      cell('h', 'um-head', h('h3', null, t('colH'), h('small', null, t('colH_note'))))]);
    rows.push([cell('c', null, passwd('c')), cell('m', null, mapBox(c)), cell('h', null, passwd('h'))]);
    // processes
    var pc = L.processes(s, 'c'), ph = L.processes(s, 'h');
    rows.push([cell('c', 'um-sec', h('h4', null, t('secProcs'), code('ps -o user,pid,comm'))), blank('m'),
      cell('h', 'um-sec', h('h4', null, t('secProcs'), code('ps -o user,pid,comm')))]);
    pc.forEach(function (p, i) {
      var now = c.n > 0 && has(s, 'proc:' + p.id);
      rows.push([cell('c', null, procRow(c, 'c', p)), cell('m', null, arrow(p.line, false, now)), cell('h', null, procRow(c, 'h', ph[i]))]);
    });
    // files
    var fc = L.listing(s, 'c'), fh = L.listing(s, 'h');
    rows.push([cell('c', 'um-sec', h('h4', null, t('secFiles'), code('ls -ln /data'))),
      cell('m', 'um-sec', h('div', { class: 'um-mapnote' }, t('secFilesNote'))),
      cell('h', 'um-sec', h('h4', null, t('secFiles'), code('ls -ln /data')))]);
    if (!fc.length) rows.push([cell('c', null, h('p', { class: 'um-empty' }, t('empty'))), blank('m'), cell('h', null, h('p', { class: 'um-empty' }, t('empty')))]);
    fc.forEach(function (f, i) {
      var now = c.n > 0 && (has(s, 'file:' + f.path) || has(s, 'list:c') || has(s, 'list:h'));
      rows.push([cell('c', null, fileRow(c, 'c', f, a && a.side)), cell('m', null, arrow(f.line, f.unmapped, now)), cell('h', null, fileRow(c, 'h', fh[i], a && a.side))]);
    });
    // every cell placed explicitly: row 1 is the strip, the panels behind columns 1 and 3 span the rest and one more
    var kids = [];
    rows.forEach(function (r, i) {
      r.forEach(function (el, j) {
        el.style.gridRow = String(i + 2);
        el.style.gridColumn = String(j + 1);
        if (i < 2) el.dataset.top = el.dataset.col;          // the phone reads these per column
        kids.push(el);
      });
    });
    var last = rows.length + 2;
    var strp = strip(s);
    strp.style.gridRow = '1';
    c.stage.replaceChildren(h('div', { class: 'um', style: { gridTemplateRows: 'repeat(' + (rows.length + 1) + ', auto) minmax(0.4rem, 1fr)' } },
      strp,
      h('div', { class: 'um-bg', style: { gridRow: '2 / ' + (last + 1) } }),
      h('div', { class: 'um-bg um-bg-h', style: { gridRow: '2 / ' + (last + 1) } }),
      kids));
  }

  // ── captions ──

  function isInitial(p, path) { return L.SCRIPTS[p.script].files.some(function (f) { return f.path === path; }); }

  function caption(c) {
    var s = c.state, p = c.params, a = s.action;
    if (!a) return rich(s.rootless ? 'capStart' : 'capStartRootful').concat(sp(rich('goal_' + p.script)));
    var w = s.who;
    var file = a.path ? L.findFile(s, a.path) : s.files[0];
    var path = file ? data('/data/' + file.path) : null;
    if (a.op === 'create') {
      if (!s.rootless) return w.uidIn === 0 ? rich('capCreateRootful', { path: path }) : rich('capCreateSame', { in: w.uidIn, path: path });
      var line = s.map[w.line];
      if (line.count === 1) return rich('capCreateRoot', { proc: data(w.proc), out: w.uidOut, user: data(s.hostUser.name), path: path });
      return rich('capCreateSub', { user: code(w.user), in: w.uidIn, ord: t('ord_' + w.line), start: line.outside, first: line.inside, out: w.uidOut });
    }
    if (a.op === 'ls') {
      if (!file) return [t('empty')];
      var inside = L.toInside(s.map, file.uidOut);
      if (a.side === 'h') {
        if (!s.rootless) {
          if (file.uidOut === 0) return rich(isInitial(p, file.path) ? 'capLsHostRootFile' : 'capLsHostRootful', { path: path });
          return rich('capLsHostSame', { path: path, out: file.uidOut });
        }
        if (file.uidOut === s.hostUser.uid) return rich('capLsHostOwn', { out: file.uidOut, user: data(s.hostUser.name) });
        if (inside.unmapped) return rich('capLsHostRootFile', { path: path });
        return rich('capLsHostSub', { out: file.uidOut, user: data(s.hostUser.name), line: code(s.subuid.user + ':' + s.subuid.start + ':' + s.subuid.count) });
      }
      if (inside.unmapped) return rich('capLsCUnmapped', { owner: file.uidOut, nobody: data('nobody') });
      if (!s.rootless) return rich('capLsCSame', { path: path, out: file.uidOut });
      return rich('capLsCMapped', { path: path, out: file.uidOut, in: inside.id });
    }
    // read / write
    var k = s.result.check;
    if (!s.result.ok) {
      if (k.capDenied) return rich('capReadDenied', { proc: data(w.proc), out: k.uidOut, owner: file.uidOut, bits: code(k.bits) });
      if (a.side === 'h') {
        var out = rich('capWriteDenied', { user: data(w.user), uid: w.uidOut, out: file.uidOut, bits: code(k.bits) });
        if (s.rootless && !L.toInside(s.map, file.uidOut).unmapped) out = out.concat(sp(rich('capEnterNs', { user: data(w.user), out: file.uidOut })));
        return out;
      }
      return rich('capDenied', { cls: t('cls_' + k.cls), bits: code(k.bits), need: code(k.need) });
    }
    if (k.cls === 'root' && a.side === 'c') return rich('capReadRoot', { path: path });
    return rich('capAccessOk', { cls: t('cls_' + k.cls) });
  }

  // ── mount ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'rootless', type: 'toggle', label: t('rootless') },
      { key: 'subuidStart', type: 'choice', label: t('subuidStart'),
        options: L.SUBUID_STARTS.map(function (x) { return [x, String(x)]; }) },
      // the actions come with the preset; hidden so the panel fits one screen
      { key: 'script', type: 'select', label: t('script'), resets: true, visible: function () { return false; },
        options: L.SCRIPT_IDS.map(function (x) { return [x, t('preset_' + x)]; }) }
    ],

    presets: L.PRESETS.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), params: x.params, hint: t('preset_' + x.id + '_hint') };
    }),

    legend: [
      { shape: 'um-in', label: t('legIn') },
      { shape: 'um-out', label: t('legOut') },
      { shape: 'um-line', label: t('legLine') },
      { shape: 'um-un', label: t('legUnmapped') },
      { shape: 'um-refused', label: t('legRefused') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
