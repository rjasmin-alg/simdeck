<style>

[data-sim="trap-antenna"] .ta-ant { grid-column: 1 / -1; position: relative; min-height: 0; }
[data-sim="trap-antenna"] .ta-chart { position: relative; min-height: 0; display: flex; flex-direction: column; }

/* Phone and portrait: the stage grows with its content; drawing, chart and readout stack. */

  [data-sim="trap-antenna"] .ta-plot { flex: none; height: 16rem; }
  [data-sim="trap-antenna"] .ta-read { margin-top: 0.8rem; grid-template-columns: 1fr; }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Trap-dipol</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="ta-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var X_MAX = 2.5, Y_MAX = 4;   // the chart's range: f / f_res from 0 to 2.5, X / Z0 from −4 to 4
  var sim = null;

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function num(v) { return String(v).replace('.', t('dec')); }
  // f_res for the {fres} placeholder of HTML strings: f with the subscript res
  function fresNode() { return h('span', { translate: 'no' }, 'f', h('sub', null, 'res')); }
  function text(x, y, str, cls, attrs) {
    return s('text', Object.assign({ class: cls || null, x: x, y: y, translate: 'no' }, attrs || {}), str);
  }
  // "f_res" with "res" as a subscript, as in the figures
  function fres(x, y, cls, anchor, pre, post) {
    var e = s('text', { class: cls || null, x: x, y: y, translate: 'no', 'text-anchor': anchor || null });
    var bits = String(pre || '').split('f_res');
    e.append(bits[0] || '');
    if (bits.length > 1) {
      e.append('f', s('tspan', { dy: '0.3em' }, 'res'), s('tspan', { dy: '-0.3em' }, bits[1]));
    }
    if (post) e.append(post);
    return e;
  }
  // A horizontal dimension line from x1 to x2 at y, with end ticks, and its label above it.
  function dim(svg, x1, x2, y, label, cls, tcls, raise) {
    var tk = 0.35 * remPx();
    svg.append(s('line', { class: cls, x1: x1, y1: y, x2: x2, y2: y }),
      s('line', { class: cls, x1: x1, y1: y - tk, x2: x1, y2: y + tk }),
      s('line', { class: cls, x1: x2, y1: y - tk, x2: x2, y2: y + tk }),
      text((x1 + x2) / 2, y - (raise || 0.45) * remPx(), label, tcls, { 'text-anchor': 'middle' }));
  }

  var presetKeys = { f80: 'presetF80', f40: 'presetF40', f20: 'presetF20' };

  // ── the antenna, after figures 235, 1135 and 1136: rope, insulator, outer wire, trap, inner wire, feed point and
  //    the same mirrored. Wire lengths to scale (10.07 m and 6.71 m), the traps and ropes a fixed size, text at 1:1. ──
  function drawAntenna(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), compact = W < 40 * rem;
    var rope = (compact ? 0.9 : 2.5) * rem, tw = (compact ? 2.6 : 4) * rem, gap = (compact ? 1.2 : 2.2) * rem;
    var bh = (compact ? 0.8 : 1.1) * rem;                     // the trap's branches above and below the wire
    var k = (W - 2 * rope - 2 * tw - gap - 0.6 * rem) / (2 * (L.INNER + L.OUTER));
    var y = H * 0.44;
    var x0 = 0.3 * rem + rope;                                // left insulator
    var a1 = x0 + L.OUTER * k, a2 = a1 + tw;                  // left trap
    var f1 = a2 + L.INNER * k, f2 = f1 + gap;                 // feed terminals
    var b1 = f2 + L.INNER * k, b2 = b1 + tw;                  // right trap
    var x1 = b2 + L.OUTER * k;                                // right insulator
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var on = function (part) { return st.active === 'whole' || (st.active === 'inner' && part === 'inner'); };
    var wire = function (xa, xb, part) {
      svg.append(s('line', { class: on(part) ? 'ta-wire-on' : 'ta-wire', x1: xa, y1: y, x2: xb, y2: y }));
    };

    // ropes and insulators at the ends
    svg.append(s('line', { class: 'ta-rope', x1: x0 - rope, y1: y, x2: x0, y2: y }),
      s('line', { class: 'ta-rope', x1: x1, y1: y, x2: x1 + rope, y2: y }));
    wire(x0, a1, 'outer'); wire(a2, f1, 'inner'); wire(f2, b1, 'inner'); wire(b2, x1, 'outer');
    [x0, x1].forEach(function (x) { svg.append(s('circle', { class: 'ta-ins', cx: x, cy: y, r: 0.3 * rem })); });

    // the traps: coil above, capacitor below, in parallel
    [a1, b1].forEach(function (xa) {
      var xb = xa + tw, cx = xa + tw / 2, cg = 0.18 * rem, ph = 0.55 * rem, coil = 0.42 * tw, hump = coil / 3;
      var d = 'M' + xa + ',' + y + 'V' + (y - bh) + 'H' + (cx - coil / 2);
      for (var i = 0; i < 3; i++) d += 'a' + hump / 2 + ',' + hump / 1.6 + ' 0 0 1 ' + hump + ',0';
      d += 'H' + xb + 'V' + y;
      d += 'M' + xa + ',' + y + 'V' + (y + bh) + 'H' + (cx - cg) + 'M' + (cx + cg) + ',' + (y + bh) + 'H' + xb + 'V' + y;
      svg.append(s('path', { class: 'ta-part', d: d }),
        s('line', { class: 'ta-plate', x1: cx - cg, y1: y + bh - ph, x2: cx - cg, y2: y + bh + ph }),
        s('line', { class: 'ta-plate', x1: cx + cg, y1: y + bh - ph, x2: cx + cg, y2: y + bh + ph }),
        s('circle', { class: 'ta-dot', cx: xa, cy: y, r: 0.22 * rem }), s('circle', { class: 'ta-dot', cx: xb, cy: y, r: 0.22 * rem }));
      // under each trap its name and f_res
      svg.append(text(cx, y + bh + ph + 1.25 * rem, t('trapLabel'), 'ta-ink', { 'text-anchor': 'middle' }));
      if (!compact || xa === a1) svg.append(fres(cx, y + bh + ph + 2.45 * rem, null, 'middle', 'f_res = ' + num(L.F_RES) + ' MHz'));
    });

    // the feed point
    [f1, f2].forEach(function (x) { svg.append(s('circle', { class: 'ta-dot', cx: x, cy: y, r: 0.28 * rem })); });
    svg.append(text((f1 + f2) / 2, y + 1.5 * rem, t('feed'), 'ta-ink', { 'text-anchor': 'middle' }));

    // the wire lengths above (on a phone in two rows, so the labels do not collide)
    var dy = y - bh - 1.1 * rem;
    [[x0, a1, L.OUTER], [a2, f1, L.INNER], [f2, b1, L.INNER], [b2, x1, L.OUTER]].forEach(function (p, i) {
      dim(svg, p[0], p[1], dy - (compact && i % 2 ? 1.4 * rem : 0), t('meters', { m: num(p[2]) }), 'ta-dim', null);
    });

    // the active wire, below everything: a span in the active colour with its length, or a note when nothing is
    var sy = y + bh + 0.55 * rem + 4.9 * rem;
    if (st.active === 'none') svg.append(text(W / 2, sy, t('activeNone'), 'ta-big', { 'text-anchor': 'middle' }));
    else {
      var sx1 = st.active === 'inner' ? a2 : x0, sx2 = st.active === 'inner' ? b1 : x1;
      dim(svg, sx1, sx2, sy, t('activeLen', { m: num(st.length) }), 'ta-span', 'ta-c1', 0.5);
    }
    box.replaceChildren(svg);
  }

  // ── the trap's reactance X / Z0 = x / (1 − x²) against x = f / f_res, with the original's three frequencies ──
  function drawChart(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var l = 1.2 * rem, r = 4.6 * rem, top = 1.6 * rem, bot = 2.6 * rem;
    var X = function (x) { return l + x / X_MAX * (W - l - r); };
    var Y = function (v) { return top + (Y_MAX - v) / (2 * Y_MAX) * (H - top - bot); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var c = L.curve(X_MAX, Y_MAX, 400);
    var line = function (pts) { return pts.map(function (p) { return X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' '); };

    svg.append(s('line', { class: 'ta-grid', x1: X(0), y1: Y(Y_MAX), x2: X(X_MAX), y2: Y(Y_MAX) }),
      s('line', { class: 'ta-grid', x1: X(0), y1: Y(-Y_MAX), x2: X(X_MAX), y2: Y(-Y_MAX) }),
      s('line', { class: 'ta-res', x1: X(1), y1: Y(Y_MAX), x2: X(1), y2: Y(-Y_MAX) }),
      s('line', { class: 'ta-axis', x1: X(0), y1: Y(0), x2: X(X_MAX), y2: Y(0) }),
      s('line', { class: 'ta-axis', x1: X(0), y1: Y(Y_MAX), x2: X(0), y2: Y(-Y_MAX) }),
      s('polyline', { class: 'ta-curve', points: line(c.below) }),
      s('polyline', { class: 'ta-curve', points: line(c.above) }));
    // axis names and the zones
    svg.append(text(X(0) + 0.4 * rem, Y(Y_MAX) - 0.5 * rem, 'X / Z₀', 'ta-c2'),
      fres(X(X_MAX) + 0.4 * rem, Y(0) + 0.4 * rem, 'ta-ink', null, t('axisX')),
      text(X(0.5), Y(Y_MAX * 0.55), t('zoneInd'), 'ta-ink', { 'text-anchor': 'middle' }),
      text(X(1.75), Y(-Y_MAX * 0.55), t('zoneCap'), 'ta-ink', { 'text-anchor': 'middle' }),
      text(X(1) + 0.4 * rem, Y(Y_MAX) + 1.2 * rem, t('zoneBlock'), 'ta-ink'));
    // the three frequencies on the x axis, labelled in MHz below it; the current one as a dot on the curve
    L.FREQS.forEach(function (f) {
      if (f == null) return;
      var x = f / L.F_RES;
      svg.append(s('circle', { class: 'ta-tick', cx: X(x), cy: Y(0), r: 0.25 * rem }),
        text(X(x), Y(-Y_MAX) + 1.6 * rem, num(f), f === st.f ? 'ta-big' : null, { 'text-anchor': 'middle' }));
    });
    svg.append(text(X(X_MAX) + 0.4 * rem, Y(-Y_MAX) + 1.6 * rem, 'MHz', null));
    if (st.f != null) {
      // at resonance the reactance has no finite value: the dot sits at the top of the chart, on the dashed line
      var v = st.reactance == null ? Y_MAX : st.reactance;
      svg.append(s('circle', { class: 'ta-mark', cx: X(st.x), cy: Y(v), r: 0.55 * rem }));
      if (st.reactance == null) svg.append(text(X(1) - 0.4 * rem, Y(Y_MAX) + 1.2 * rem, '∞', 'ta-c2', { 'text-anchor': 'end' }));
    }
    box.replaceChildren(svg);
  }

  function readout(st) {
    var row = function (dt, dd) { return [h('dt', null, dt), h.apply(null, ['dd', null].concat(dd))]; };
    var f = st.f == null ? t('fNone') : t.parts({ inductive: 'fLess', blocks: 'fEq', capacitive: 'fMore' }[st.trap], { f: num(st.f), fres: fresNode() });
    var trap = t({ none: 'trapNone', inductive: 'trapInductive', blocks: 'trapBlocks', capacitive: 'trapCapacitive' }[st.trap]);
    var act = t({ none: 'activeNoneRow', inner: 'activeInner', whole: 'activeWhole' }[st.active]);
    var eff = t({ none: 'effectNone', longer: 'effectLonger', ends: 'effectEnds', shorter: 'effectShorter' }[st.effect]);
    var half = st.halfWave == null ? t('halfNone') : t('halfValue', { m: num(st.halfWave.toFixed(1)) });
    return h('dl', { class: 'ta-read' }, h('h2', null, t('readTitle')),
      row(t('rowF'), f), row(t('rowTrap'), trap), row(t('rowActive'), act), row(t('rowEffect'), eff),
      row(h('span', { translate: 'no' }, t('rowHalf')), half));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: x.step }; }),
    legend: [
      { c: 1, label: t('legendActive') },
      { c: 2, label: t('legendX') }
    ],

    render: function (c) {
      var st = c.state;
      var ant = h('div', { class: 'ta-ant' }), plot = h('div', { class: 'ta-plot' });
      c.stage.replaceChildren(h('div', { class: 'ta' }, ant,
        h('div', { class: 'ta-chart' }, h('h2', null, t('chartTitle')), plot),
        readout(st)));
      drawAntenna(ant, st);
      drawChart(plot, st);
    },

    caption: function (c) { return t.parts('caption' + c.state.n, { fres: fresNode() }); }
  });

  // The drawings are in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
