<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var D = window.SimdeckModels.discount;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  // ── numbers in the page's language ──

  function dec(x, d) {
    var s = x.toFixed(d);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  /** A whole number with thousands grouped (120 000 / 120,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Euros, rounded to the euro (SPEC.md rule 5); plus adds "+" to positive amounts. Minus is U+2212. */
  function money(x, plus) {
    var r = D.roundMoney(x);
    var s = t('eur', { n: group(Math.abs(r)) });
    return (r < 0 ? '−' : plus && r > 0 ? '+' : '') + s;
  }
  function pct(rate) { return t('pct', { n: dec(rate, rate % 1 ? 1 : 0) }); }
  function data(text, tag) { return h(tag || 'span', { translate: 'no' }, String(text)); }
  function yearName(k) { return k === 0 ? t('today') : t('yearN', { n: k }); }

  // ── tiles ──

  function tiles(s, chg) {
    var p = s.p;
    var lost = D.roundMoney(s.lost);
    var base = (1 + p.rate / 100).toFixed(3).replace(/\.?0+$/, '');
    if (Simdeck.lang === 'hr') base = base.replace('.', ',');
    return h('div', { class: 'npv-tiles' },
      h('div', { class: 'npv-tile', dataset: { c: '1', k: 'nominal' } },
        h('span', { class: 'npv-tile-label' }, t('tileNominal')),
        h('span', { class: 'npv-big', translate: 'no' }, money(s.nominal, true)),
        h('span', { class: 'npv-sub' }, t('nominalSub'))),
      h('div', { class: 'npv-tile' + (chg.indexOf('sign') >= 0 ? ' sd-changed' : ''), dataset: { c: '2', k: 'npv' } },
        h('span', { class: 'npv-tile-label' }, t.parts('tileNpv', { rate: data(pct(p.rate)) })),
        h('span', { class: 'npv-big', translate: 'no' }, money(s.npv, true)),
        h('span', { class: 'npv-verdict', dataset: { s: String(s.sign) } },
          (s.sign > 0 ? '✓ ' : s.sign < 0 ? '✗ ' : '= ') + t(s.sign > 0 ? 'verdictPos' : s.sign < 0 ? 'verdictNeg' : 'verdictZero')),
        lost !== 0 ? h('span', { class: 'npv-sub' }, t.parts(lost > 0 ? 'npvLost' : 'npvAdded', { x: data(money(Math.abs(lost))) })) : null),
      h('div', { class: 'npv-tile', dataset: { c: '8', k: 'euro' } },
        h('span', { class: 'npv-tile-label' }, t.parts('tileEuro', { n: data(p.years) })),
        h('span', { class: 'npv-big' }, t.parts('euroBig', { x: data(t('eur', { n: dec(s.euroLater, 2) })) })),
        h('span', { class: 'npv-sub' }, t('euroSub'), ' ',
          h('span', { translate: 'no' }, '1 / ', base, h('sup', null, String(p.years)), ' = ', dec(s.euroLater, 3)))));
  }

  // ── the chart ──

  /** 1, 2, 2.5, 5 × 10^k: the smallest step that keeps a side to about four grid lines. */
  function niceStep(x) {
    var mag = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1))));
    var steps = [1, 2, 2.5, 5, 10];
    for (var i = 0; i < steps.length; i++) if (steps[i] * mag >= x) return steps[i] * mag;
    return 10 * mag;
  }
  /** The vertical range: top and bottom on whole grid steps, at least one step each side, so a bar can cross zero. */
  function domainOf(rows) {
    var pos = 0, neg = 0;
    rows.forEach(function (r) { pos = Math.max(pos, r.cf); neg = Math.max(neg, -r.cf); });
    var S = Math.max(pos, neg, 10000);
    var step = niceStep(S / 4);
    return { top: Math.max(step, Math.ceil(pos / step) * step), bot: Math.max(step, Math.ceil(neg / step) * step), step: step };
  }

  var drag = null;      // { k, rect, dom } while a column is dragged; the range stays frozen meanwhile
  var refocus = null;   // the column to give focus back to after a render (keyboard changes)

  function setFlow(k, v) {
    var x = Math.round(v / L.CF_STEP) * L.CF_STEP;
    x = Math.max(L.CF_MIN, Math.min(L.CF_MAX, x));
    var patch = {};
    patch['cf' + k] = x;
    sim.set(patch);
  }
  function valueAt(clientY) {
    var span = drag.dom.top + drag.dom.bot;
    return drag.dom.top - (clientY - drag.rect.top) / drag.rect.height * span;
  }
  function onMove(e) { if (drag) setFlow(drag.k, valueAt(e.clientY)); }
  function onUp() {
    if (!drag) return;
    drag = null;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    sim.render();
  }
  function startDrag(e, k, dom) {
    if (e.button !== 0) return;
    e.preventDefault();
    drag = { k: k, rect: e.currentTarget.getBoundingClientRect(), dom: dom };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    setFlow(k, valueAt(e.clientY));
  }
  function onKey(e, k, cf) {
    var by = e.shiftKey ? 10 * L.CF_STEP : L.CF_STEP;
    var to = null;
    if (e.key === 'ArrowUp') to = cf + by;
    else if (e.key === 'ArrowDown') to = cf - by;
    if (to === null) return;
    e.preventDefault();
    refocus = k;
    setFlow(k, to);
  }

  function chart(s) {
    var dom = drag ? drag.dom : domainOf(s.rows);
    var span = dom.top + dom.bot;
    var y = function (v) { return (100 * (dom.top - v) / span) + '%'; };
    var hgt = function (v) { return (100 * Math.abs(v) / span) + '%'; };
    var n = s.rows.length;

    var ticks = [], lines = [];
    for (var v = -dom.bot; v <= dom.top + 1e-6; v += dom.step) {
      ticks.push(h('span', { class: 'npv-tick', translate: 'no', style: { top: y(v) } }, money(v)));
      if (v !== 0) lines.push(h('div', { class: 'npv-gl', style: { top: y(v) } }));
    }
    var cells = [
      h('div', { class: 'npv-axis' }, ticks),
      h('div', { class: 'npv-grid' }, lines,
        h('div', { class: 'npv-zero', style: { top: y(0) } }),
        h('span', { class: 'npv-dir', style: { top: '0.1rem' } }, t('inflow')),
        h('span', { class: 'npv-dir', style: { bottom: '0.1rem' } }, t('outflow')))
    ];

    s.rows.forEach(function (r) {
      var k = r.t, col = { gridColumn: String(k + 2) };
      var valueText = t('barValue', { cf: money(r.cf), pv: money(r.pv) });
      cells.push(h('div', {
        class: 'npv-col', role: 'slider', tabindex: '0', style: { gridColumn: String(k + 2) },
        dataset: drag && drag.k === k ? { drag: 'true', year: String(k) } : { year: String(k) },
        'aria-label': t('barLabel', { year: yearName(k) }), 'aria-orientation': 'vertical',
        'aria-valuemin': String(L.CF_MIN), 'aria-valuemax': String(L.CF_MAX), 'aria-valuenow': String(r.cf),
        'aria-valuetext': valueText, title: valueText,
        onpointerdown: function (e) { startDrag(e, k, dom); },
        onkeydown: function (e) { onKey(e, k, r.cf); }
      },
        r.cf !== 0 ? h('div', { class: 'npv-nom', dataset: { c: '1' }, style: { top: y(Math.max(r.cf, 0)), height: hgt(r.cf) } }) : null,
        r.cf !== 0 ? h('div', { class: 'npv-pv', dataset: { c: '2' }, style: { top: y(Math.max(r.pv, 0)), height: hgt(r.pv) } }) : null,
        h('span', { class: 'npv-grip', style: { top: y(r.cf) } })));
      cells.push(
        h('span', { class: 'npv-cell npv-year', style: Object.assign({ gridRow: '2' }, col) }, yearName(k)),
        h('span', { class: 'npv-cell', translate: 'no', dataset: { k: 'nominal' }, style: Object.assign({ gridRow: '3' }, col) }, money(r.cf)),
        h('span', { class: 'npv-cell', translate: 'no', dataset: { k: 'factor' }, style: Object.assign({ gridRow: '4' }, col) }, '× ' + dec(r.df, 3)),
        h('span', { class: 'npv-cell', translate: 'no', dataset: { k: 'today' }, style: Object.assign({ gridRow: '5' }, col) }, money(r.pv)));
    });
    cells.push(
      h('span', { class: 'npv-rowlabel', style: { gridRow: '3' } }, t('rowNominal')),
      h('span', { class: 'npv-rowlabel', style: { gridRow: '4' } }, t('rowFactor')),
      h('span', { class: 'npv-rowlabel', style: { gridRow: '5' } }, t('rowToday')));
    return h('div', { class: 'npv-scroll' }, h('div', { class: 'npv-chart', style: { '--cols': String(n) } }, cells));
  }

  // ── render; the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'npv' }, tiles(s, chg), chart(s),
      h('p', { class: 'npv-foot' }, t('dragHint'), ' ', t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('.npv-col[data-year="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, p = s.p;
    var k = L.captionKey(s);
    if (k.key === 'capEmpty') return t(k.key);
    var b = function (x) { return h('b', { translate: 'no' }, x); };
    var out = t.parts(k.key, {
      rate: b(pct(p.rate)), n: b(String(p.years)), euro: b(t('eur', { n: dec(s.euroLater, 2) })),
      nominal: b(money(s.nominal, true)), npv: b(money(s.npv, true))
    });
    k.notes.forEach(function (key) { out.push(' ', t(key)); });
    return out;
  }

  var labels = {
    'euro-later': 'pEuroLater', 'upgrade': 'pUpgrade', 'dear-money': 'pDearMoney', 'just-the-rate': 'pJustTheRate',
    'late-payoff': 'pLatePayoff', 'early-payoff': 'pEarlyPayoff'
  };
  var never = function () { return false; };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'rate', type: 'range', label: t('rate'), hint: t('rateHint'), min: 0, max: L.RATE_MAX, step: L.RATE_STEP, format: pct },
      { key: 'years', type: 'range', label: t('years'), min: 1, max: L.MAX_YEARS, step: 1 },
      { type: 'button', label: t('mirror'), key: 'm', run: function (api) { api.set(L.mirror(api.params)); } }
    ].concat(L.CF_KEYS.map(function (key, k) {
      // The flows are dragged on the stage; these hidden ranges keep them in the URL and clamp them.
      return { key: key, type: 'range', label: yearName(k), min: L.CF_MIN, max: L.CF_MAX, step: L.CF_STEP, visible: never };
    })),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'npv-nominal', c: 1, label: t('legNominal') },
      { c: 2, label: t('legToday') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
