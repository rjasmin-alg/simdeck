<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var G = L.G, CP = L.CP;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var D2R = Math.PI / 180;
  var D_DIP = CP.directivity(0.5).d;
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function deg(v) { return t('degVal', { v: num(v, Math.abs(v - Math.round(v)) < 0.05 ? 0 : 1) }); }
  function lam(v) { return t('hVal', { v: num(v, 2) }); }
  function dbi(v) { return t('dbi', { v: num(v, 2) }); }
  function dbv(v) { return t('dbVal', { v: num(v, 1) }); }
  function km(v) { return t('kmVal', { v: String(Math.round(v / 10) * 10) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) e.append(arguments[i]);
    return e;
  }
  function pts(list) { return list.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function rgbOf(name) {
    var v = (Simdeck.cssVar(name) || '').trim(), m = /^#([0-9a-f]{6})$/i.exec(v);
    if (m) return [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4, 6), 16)];
    var c = document.createElement('canvas'); c.width = c.height = 1;
    var g = c.getContext('2d'); g.fillStyle = v || '#808080'; g.fillRect(0, 0, 1, 1);
    var d = g.getImageData(0, 0, 1, 1).data;
    return [d[0], d[1], d[2]];
  }

  // ── the waves from the side: direct wave plus the reflected one (the image's, times the ground's reflection at the
  //    image ray's elevation), far-field terms, brightness evened out with distance (SPEC §5, rule 11). Complex
  //    amplitudes are cached per geometry; each frame takes the real part at ωt. ──
  // The region in λ: the earth down to just below the image, at least 4 λ across and 2h + 3.2 λ tall, scaled to fit the
  // box; whatever room is left goes to more sky (or more width).
  function region(st, W, H) {
    var zb = -(st.h + 0.6), needW = 4, needH = 2 * st.h + 3.2;
    var ppl = Math.min(W / needW, H / needH);
    return { zb: zb, zt: zb + H / ppl, wide: W / ppl, tall: H / ppl, ppl: ppl };
  }
  var cache = { key: '' };
  function field(st, rg, nx, ny) {
    var key = [st.ant, st.h, st.p.ground, nx, ny, rg.wide.toFixed(3), rg.tall.toFixed(3)].join('|');
    if (cache.key === key) return cache;
    var eps = L.epsOf(st.p.ground), k = 2 * Math.PI, a = 0.5;
    var hs = st.h, re = new Float32Array(nx * ny), im = new Float32Array(nx * ny), top = 0;
    for (var j = 0; j < ny; j++) {
      var z = rg.zt - (j + 0.5) / ny * rg.tall;
      if (z < 0) continue;                                  // the earth: drawn over, no wave
      for (var i = 0; i < nx; i++) {
        var y = (i + 0.5) / nx * rg.wide - rg.wide / 2;
        var dz1 = z - hs, r1 = Math.sqrt(y * y + dz1 * dz1), u1 = r1 > 1e-9 ? dz1 / r1 : 0;
        var dz2 = z + hs, r2 = Math.sqrt(y * y + dz2 * dz2), u2 = r2 > 1e-9 ? dz2 / r2 : 0;
        var rf = G.reflect(eps, Math.asin(Math.min(1, u2))), f1, f2;
        if (st.ant === 'horizontal') { f1 = [1, 0]; f2 = [-rf.rh[0], -rf.rh[1]]; }
        else if (st.ant === 'vertical') {
          f1 = [CP.elementFactor(0.5, u1), 0];
          var e2 = CP.elementFactor(0.5, u2); f2 = [rf.rv[0] * e2, rf.rv[1] * e2];
        } else {
          f1 = G.rodFactor(u1);
          var c2 = G.rodFactor(u2); f2 = G.cmul(rf.rv, [c2[0], -c2[1]]);
        }
        var w1 = 1 / Math.sqrt(r1 + a), w2 = 1 / Math.sqrt(r2 + a), q1 = -k * r1, q2 = -k * r2;
        var c1r = Math.cos(q1), c1i = Math.sin(q1), c2r = Math.cos(q2), c2i = Math.sin(q2);
        var ar = w1 * (f1[0] * c1r - f1[1] * c1i) + w2 * (f2[0] * c2r - f2[1] * c2i);
        var ai = w1 * (f1[0] * c1i + f1[1] * c1r) + w2 * (f2[0] * c2i + f2[1] * c2r);
        var g = Math.sqrt(r1 + a), idx = j * nx + i;
        re[idx] = ar * g; im[idx] = ai * g;
        if (r1 > 0.6) top = Math.max(top, Math.sqrt(re[idx] * re[idx] + im[idx] * im[idx]));
      }
    }
    if (top > 0) for (var n = 0; n < re.length; n++) { re[n] /= top; im[n] /= top; }
    cache = { key: key, re: re, im: im };
    return cache;
  }

  function drawMap(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = st.p, top = 2.8 * r0;
    var SW = Math.max(40, W), SH = Math.max(40, H - top), ox = 0, oy = top;
    var rg = region(st, SW, SH), ppl = rg.ppl;
    var nx = Math.max(40, Math.min(300, Math.round(SW / 2))), ny = Math.max(40, Math.round(nx * SH / SW));
    var f = field(st, rg, nx, ny);
    var cv = document.createElement('canvas');
    cv.width = nx; cv.height = ny;
    cv.style.left = ox + 'px'; cv.style.top = oy + 'px'; cv.style.width = SW + 'px'; cv.style.height = SH + 'px';
    var g = cv.getContext('2d'), img = g.createImageData(nx, ny), data = img.data;
    var bg = rgbOf('--bg'), pos = rgbOf('--c1'), neg = rgbOf('--c5'), wt = p.t * D2R, c = Math.cos(wt), sn = Math.sin(wt);
    for (var i = 0; i < nx * ny; i++) {
      var v = Math.max(-1, Math.min(1, f.re[i] * c - f.im[i] * sn)), fg = v >= 0 ? pos : neg, u = Math.pow(Math.abs(v), 0.75);
      data[4 * i] = bg[0] + (fg[0] - bg[0]) * u;
      data[4 * i + 1] = bg[1] + (fg[1] - bg[1]) * u;
      data[4 * i + 2] = bg[2] + (fg[2] - bg[2]) * u;
      data[4 * i + 3] = 255;
    }
    g.putImageData(img, 0, 0);

    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'gi-title', x: 0.2 * r0, y: 1.2 * r0 }, t('mapTitle')));
    if (st.ant === 'horizontal') svg.append(s('text', { class: 'gi-mute', x: 0.2 * r0, y: 2.3 * r0 }, t('wireEndOn')));
    function X(y) { return ox + (y + rg.wide / 2) * ppl; }
    function Y(z) { return oy + (rg.zt - z) * ppl; }
    var gy = Y(0), cx = X(0);
    // the earth, hatched, and the ground line
    var defs = s('defs', null, s('pattern', { id: 'gi-hatch', width: 14, height: 14, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
      s('line', { class: 'gi-hatch', x1: 0, y1: 0, x2: 0, y2: 14 })));
    svg.append(defs);
    svg.append(s('rect', { class: 'gi-earth', x: ox, y: gy, width: SW, height: oy + SH - gy }));
    svg.append(s('rect', { x: ox, y: gy, width: SW, height: oy + SH - gy, fill: 'url(#gi-hatch)' }));
    svg.append(s('rect', { class: 'gi-frame', x: ox, y: oy, width: SW, height: SH }));
    svg.append(s('line', { class: 'gi-groundline', x1: ox, y1: gy, x2: ox + SW, y2: gy }));
    svg.append(s('text', { class: 'gi-halo gi-mute', x: ox + 0.4 * r0, y: gy + 1.3 * r0 }, t('earth')));
    // the rays at the take-off angle: direct from the antenna, reflected as if from the image (dashed under the ground)
    var a = st.main;
    if (a > 2 && a < 88) {
      var ux = Math.cos(a * D2R), uz = Math.sin(a * D2R), hs = st.h;
      var tEdge = function (z0) {                         // how far along the ray to the frame's right or top edge
        return Math.min((rg.wide / 2) / ux, (rg.zt - z0) / uz);
      };
      var t1 = tEdge(hs), d1 = [X(0), Y(hs)], d2 = [X(ux * t1), Y(hs + uz * t1)];
      svg.append(s('line', { class: 'gi-rayHalo', x1: d1[0], y1: d1[1], x2: d2[0], y2: d2[1] }));
      svg.append(s('line', { class: 'gi-ray', x1: d1[0], y1: d1[1], x2: d2[0], y2: d2[1] }));
      var tg = hs / uz, yr = ux * tg;                      // where the image ray meets the ground
      var tUnder = Math.min(tg, (rg.wide / 2) / ux);
      svg.append(s('line', { class: 'gi-rayUnder', x1: X(0), y1: Y(-hs), x2: X(ux * tUnder), y2: Y(-hs + uz * tUnder) }));
      if (yr < rg.wide / 2) {
        var t2 = tEdge(-hs) , e1 = [X(yr), Y(0)], e2 = [X(ux * t2), Y(-hs + uz * t2)];
        svg.append(s('line', { class: 'gi-rayHalo', x1: e1[0], y1: e1[1], x2: e2[0], y2: e2[1] }));
        svg.append(s('line', { class: 'gi-ray', x1: e1[0], y1: e1[1], x2: e2[0], y2: e2[1] }));
      }
    }
    // the antenna and its image
    var dotR = Math.max(5, 0.35 * r0);
    if (st.ant === 'horizontal') {
      svg.append(s('circle', { class: 'gi-img', cx: cx, cy: Y(-st.h), r: dotR }));
      svg.append(s('circle', { class: 'gi-dot', cx: cx, cy: Y(st.h), r: dotR }));
    } else {
      var lo = st.ant === 'vertical' ? st.h - 0.25 : 0, hi = st.ant === 'vertical' ? st.h + 0.25 : 0.25;
      svg.append(s('line', { class: 'gi-img', x1: cx, y1: Y(-lo), x2: cx, y2: Y(-hi) }));
      svg.append(s('line', { class: 'gi-ant', x1: cx, y1: Y(lo), x2: cx, y2: Y(hi) }));
      if (st.ant === 'groundplane') {
        svg.append(s('line', { class: 'gi-radial', x1: X(-0.25), y1: gy, x2: X(0.25), y2: gy }));
      }
    }
    var imgLow = st.ant === 'horizontal' ? -st.h : st.ant === 'vertical' ? -st.h - 0.25 : -0.25;
    svg.append(s('text', { class: 'gi-halo', x: cx + 0.8 * r0, y: Math.min(oy + SH - 0.4 * r0, Y(imgLow) + 0.4 * r0) }, t('image')));
    // the scale: one wavelength, in the earth's bottom left corner
    var sx = ox + 0.8 * r0, sy = oy + SH - 0.9 * r0;
    svg.append(s('line', { class: 'gi-scaleHalo', x1: sx, y1: sy, x2: sx + ppl, y2: sy }));
    svg.append(s('line', { class: 'gi-scale', x1: sx, y1: sy, x2: sx + ppl, y2: sy }));
    svg.append(s('text', { class: 'gi-halo', x: sx + ppl + 0.4 * r0, y: sy + 0.35 * r0, 'text-anchor': 'start' }, t('mapScale')));
    box.replaceChildren(cv, svg);
  }

  // ── the elevation pattern: a half circle over the horizon, field over a free-space dipole fed the same power ──
  function drawPolar(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'gi-title', x: 0.2 * r0, y: 1.2 * r0 }, t('polarTitle')));
    if (st.ant === 'horizontal') svg.append(s('text', { class: 'gi-mute', x: 0.2 * r0, y: 2.3 * r0 }, t('acrossWire')));
    var top = 2.8 * r0, bottom = 2.2 * r0;
    var R = Math.max(10, Math.min(W / 2 - 2.8 * r0, H - top - bottom - 1.2 * r0));
    var cx = W / 2, cy = top + 1.2 * r0 + R;
    function P(e, rr) { return [cx + rr * R * Math.cos(e * D2R), cy - rr * R * Math.sin(e * D2R)]; }
    var eps = L.epsOf(st.p.ground);
    function ratio(e, ground, fed) { return Math.sqrt(L.gainAt(st.ant, st.h, ground, fed, e) / D_DIP) / L.TOP; }
    function arc(rr, cls) {
      var a = P(0, rr), b = P(180, rr);
      svg.append(s('path', { class: cls, d: 'M' + a[0] + ',' + a[1] + ' A' + rr * R + ',' + rr * R + ' 0 0 0 ' + b[0] + ',' + b[1] }));
    }
    arc(1, 'gi-ring'); arc(1 / L.TOP, 'gi-ring'); arc(2 / L.TOP, 'gi-ring');
    [30, 60, 90, 120, 150].forEach(function (e) {
      var q = P(e, 1);
      svg.append(s('line', { class: 'gi-spoke', x1: cx, y1: cy, x2: q[0], y2: q[1] }));
    });
    var main = st.main;
    function nearMain(e) { return Math.abs(main - e) < 9; }
    [0, 30, 60, 90].forEach(function (e) {
      if (nearMain(e)) return;
      var q = P(e, 1.04), anc = e === 90 ? 'middle' : 'start';
      svg.append(s('text', { class: 'gi-halo gi-mute', x: q[0] + (e === 90 ? 0 : 0.2 * r0), y: q[1] - (e === 90 ? 0.3 * r0 : 0), 'text-anchor': anc }, e + '°'));
    });
    var hz1 = P(0, 1.06), hz2 = P(180, 1.06);
    svg.append(s('line', { class: 'gi-axis', x1: hz1[0], y1: hz1[1], x2: hz2[0], y2: hz2[1] }));
    svg.append(s('text', { class: 'gi-halo gi-mute', x: hz2[0], y: hz2[1] + 1.3 * r0, 'text-anchor': 'start' }, t('horizon')));
    svg.append(s('text', { class: 'gi-halo gi-mute', x: hz1[0], y: hz1[1] + 1.3 * r0, 'text-anchor': 'end' }, t('ringX', { v: num(L.TOP, 1) })));
    function curve(fn) { var out = []; for (var e = 0; e <= 180.001; e += 0.25) out.push(P(e, Math.min(1.02, fn(e)))); return out; }
    // the same dipole in free space, fed the same power
    var free = curve(function (e) {
      if (st.ant === 'horizontal') return 1 / L.TOP;
      var ee = e > 90 ? 180 - e : e;
      return CP.elementFactor(0.5, Math.sin(ee * D2R)) / L.TOP;
    });
    svg.append(s('polyline', { class: 'gi-free', points: pts(free) }));
    if (eps) svg.append(s('polyline', { class: 'gi-perfect', points: pts(curve(function (e) { return ratio(e, null, st.fedPerfect); })) }));
    var here = [[cx, cy]].concat(curve(function (e) { return ratio(e, eps, st.fed); }));
    svg.append(s('polygon', { class: 'gi-pat', points: pts(here) }));
    // half-power edges (and their mirror when the lobe goes over the top), the main lobe and its angle
    var edges = [st.hp[0], st.hp[1]];
    if (st.hp[1] >= 90 - 1e-9) edges = [st.hp[0], 180 - st.hp[0]];
    edges.forEach(function (e) {
      if (e <= 1e-9 || e >= 180 - 1e-9) return;
      var q = P(e, 1);
      svg.append(s('line', { class: 'gi-hp', x1: cx, y1: cy, x2: q[0], y2: q[1] }));
    });
    var mq = P(main, 1);
    svg.append(s('line', { class: 'gi-main', x1: cx, y1: cy, x2: mq[0], y2: mq[1] }));
    var lq = P(main, 1.04);
    svg.append(s('text', { class: 'gi-halo gi-title', x: lq[0] + (main > 80 ? 0 : 0.3 * r0), y: lq[1] - (main > 80 ? 0.4 * r0 : main < 4 ? 0.5 * r0 : 0), 'text-anchor': main > 80 ? 'middle' : 'start' }, deg(main)));
    box.replaceChildren(svg);
  }

  // ── where one hop lands: 0 … 4000 km, the half-power span shaded, the take-off angle's landing marked ──
  function drawHop(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('text', { class: 'gi-title', x: 0.2 * r0, y: 1.2 * r0 }, t('hopTitle')));
    var x0 = 1.0 * r0, x1 = W - 2.4 * r0, ay = H - 2.0 * r0, MAX = 4000;
    function X(v) { return x0 + (x1 - x0) * Math.min(v, MAX) / MAX; }
    svg.append(s('rect', { class: 'gi-band', x: X(st.hopNear), y: ay - 1.3 * r0, width: Math.max(3, X(st.hopFar) - X(st.hopNear)), height: 1.3 * r0 }));
    svg.append(s('line', { class: 'gi-axis', x1: x0, y1: ay, x2: x1, y2: ay }));
    [0, 1000, 2000, 3000, 4000].forEach(function (v) {
      svg.append(s('line', { class: 'gi-tick', x1: X(v), y1: ay, x2: X(v), y2: ay + 0.4 * r0 }));
      svg.append(s('text', { class: 'gi-mute', x: X(v), y: ay + 1.5 * r0, 'text-anchor': 'middle' }, v === MAX ? t('hopTick', { v: String(v) }) : String(v)));
    });
    var mx = X(st.hop), my = ay - 1.6 * r0;
    svg.append(s('path', { class: 'gi-mark', d: 'M' + (mx - 0.45 * r0) + ',' + (my - 0.7 * r0) + ' L' + (mx + 0.45 * r0) + ',' + (my - 0.7 * r0) + ' L' + mx + ',' + my + ' Z' }));
    var anc = mx < x0 + 3 * r0 ? 'start' : mx > x1 - 3 * r0 ? 'end' : 'middle';
    svg.append(s('text', { class: 'gi-halo', x: mx + (anc === 'start' ? -0.4 * r0 : anc === 'end' ? 0.4 * r0 : 0), y: my - 1.0 * r0, 'text-anchor': anc }, km(st.hop)));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    function row(label, value, key) {
      return h('tr', { class: key ? 'gi-key' : null }, h('th', { scope: 'row' }, label), h('td', null, value));
    }
    var height = st.ant === 'groundplane' ? t('heightGP') : t('heightCell', { v: num(st.h, 2), m: num(st.metres, 1) });
    return h('table', { class: 'gi-table' }, h('tbody', null,
      row(t('rowHeight'), height),
      row(t('rowTake'), st.kind === 'up' ? t('takeUp') : deg(st.main), true),
      row(t('rowLobes'), String(st.count)),
      row(t('rowSpan'), t('spanCell', { a: num(st.hp[0], 1), b: num(st.hp[1], 1) })),
      row(t('rowGain'), dbi(st.dbi), true),
      row(t('rowUp'), st.zenithDbi === null ? t('upNull') : dbi(st.zenithDbi)),
      row(t('rowLost'), t('lostCell', { v: num(100 * st.lost, 0) })),
      row(t('rowR'), st.r === null ? t('none') : t('ohm', { v: num(st.r, 1) })),
      row(t('rowHop'), km(st.hop), true)));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'ant', type: 'choice', label: t('ant'), options: [['horizontal', t('antH')], ['vertical', t('antV')], ['groundplane', t('antGP')]] },
      { key: 'h', type: 'range', label: t('h'), min: function (p) { return p.ant === 'vertical' ? L.H_MIN_VERTICAL : L.RANGES.h[0]; },
        max: L.RANGES.h[1], step: L.RANGES.h[2], visible: function (p) { return p.ant !== 'groundplane'; },
        format: function (v) { return lam(v); } },
      { key: 'ground', type: 'choice', label: t('ground'), options: [['perfect', t('groundPerfect')], ['average', t('groundAverage')], ['poor', t('groundPoor')]] },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'gi-wave', label: t('legendWave') },
      { shape: 'gi-pat', label: t('legendHere') },
      { shape: 'gi-perfect', label: t('legendPerfect') },
      { shape: 'gi-free', label: t('legendFree') },
      { shape: 'gi-ray', label: t('legendRay') }
    ],

    render: function (c) {
      var mp = h('div', { class: 'gi-pic' }), pp = h('div', { class: 'gi-pic gi-polar' }), hp = h('div', { class: 'gi-hop' });
      c.stage.replaceChildren(h('div', { class: 'gi' },
        h('div', { class: 'gi-col' }, mp),
        h('div', { class: 'gi-col' }, pp, hp),
        h('div', { class: 'gi-col' }, table(c.state), h('p', { class: 'gi-units' }, t('units')))));
      drawMap(mp, c.state);
      drawPolar(pp, c.state);
      drawHop(hp, c.state);
    },

    caption: function (c) {
      var st = c.state, parts = [], real = !st.perfectGround;
      var b = function (x) { return h('b', null, x); };
      function mk() { return {   // fresh nodes for each sentence: a node can sit in one place only
        h: b(lam(st.h)), r: b(st.r === null ? '' : t('ohm', { v: num(st.r, 1) })), pd: b(lam(st.pathDiff)), a: b(deg(st.main)),
        n: b(t.n('lobeCount', st.count)), g: b(dbi(st.dbi)), lost: b(t('lostCell', { v: num(100 * st.lost, 0) })),
        below: b(dbv(st.belowPerfect)), km: b(km(st.hop)), near: b(km(st.hopNear)), far: b(km(st.hopFar))
      }; }
      function say(key) { if (parts.length) parts.push(' '); parts = parts.concat(t.parts(key, mk())); }
      say('img_' + st.ant);
      if (st.kind === 'up') say(st.pathDiff <= 0.5 + 1e-9 ? 'main_up' : 'main_upHigh');
      else if (st.kind === 'horizon') say('main_horizon');
      else if (st.ant === 'horizontal') say(real ? 'main_lobeReal' : 'main_lobe');
      else say('main_lift');
      // "one for every λ/2" is the horizontal dipole over a perfect ground (rule 3); elsewhere only the trend holds
      if (st.count >= 2) say(st.ant === 'horizontal' && !real ? 'lobes_many' : 'lobes_other');
      else if (st.ant === 'horizontal') say(st.zenithDbi === null ? 'zenith_null' : 'hor_h');
      else if (!real) say('gp_low');
      say(real ? (st.nullsPerfect > 0 ? 'ground_real' : 'ground_realNoFill') : 'gain');
      say(st.kind === 'up' ? 'hop_up' : 'hop_lobe');
      return parts;
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"], [role="radiogroup"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
