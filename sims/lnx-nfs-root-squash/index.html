<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var C = L.CLIENT, S = L.SERVER;
  var MSG = { EROFS: 'Read-only file system', EACCES: 'Permission denied' };
  var CWD = 'sa-posluzitelja';

  /** Data (names, numbers, options, commands) never gets translated. */
  function data(text, cls) { return h('span', { class: 'nf-mono' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  /** t.parts with every plain placeholder value wrapped as data; a node used twice gets its own copy. */
  function parts(key, vars) {
    var out = {};
    Object.keys(vars).forEach(function (k) { out[k] = typeof vars[k] === 'object' ? vars[k] : data(vars[k]); });
    var seen = [];
    return [].concat(t.parts(key, out)).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function named(uid) { var n = L.serverName(uid); return n ? uid + ' (' + n + ')' : String(uid); }
  function ids(uid, gid) { return 'uid=' + uid + ' gid=' + gid; }

  // ── the client's command line and its error message (what a shell prints) ──

  function prompt(req) { return '[' + (req.via === 'sudo' ? 'student' : req.clientUser) + '@' + C.host + ' ' + CWD + ']$ '; }
  function cmdOf(req) {
    var sudo = req.via === 'sudo' ? 'sudo ' : '';
    if (req.op === 'read') return sudo + 'cat ' + req.name;
    if (req.op === 'create') return sudo + 'touch ' + req.name;
    return req.via === 'sudo' ? 'echo ok | sudo tee -a ' + req.name : 'echo ok >> ' + req.name;
  }
  function errOf(req, errno) {
    var msg = MSG[errno];
    if (req.op === 'read') return 'cat: ' + req.name + ': ' + msg;
    if (req.op === 'create') return 'touch: cannot touch \'' + req.name + '\': ' + msg;
    return (req.via === 'sudo' ? 'tee: ' : 'bash: ') + req.name + ': ' + msg;
  }
  function contentOf(name) { return t('content_' + name.replace(/\W/g, '_')); }

  // ── stage: client ──

  function person(name, uid) { return h('span', { class: 'nf-person', translate: 'no' }, String(uid)); }

  function client(c) {
    var s = c.state, req = s.request;
    var me = req ? req.clientUser : null;
    return h('div', { class: 'nf-box nf-client' },
      h('h3', null, t('client'), data(C.host)),
      // breaks only between the address, the path and the mount point
      h('div', { class: 'nf-mount' }, t('mounted'), ': ', data(S.addr + ':', 'nf-nb'), h('wbr'), data(S.path, 'nf-nb'), ' ',
        data('→ ' + C.mountpoint, 'nf-nb')),
      h('h4', null, data(t('passwd'))),
      h('ul', { class: 'nf-users' }, C.users.map(function (u) {
        return h('li', { class: 'nf-user' + (u.name === me ? ' nf-user-me' : '') }, person(u.name, u.uid), data(u.name));
      })),
      req ? h('div', { class: 'nf-cmd' },
        h('code', { translate: 'no' }, prompt(req), h('b', null, cmdOf(req))),
        h('div', { class: 'nf-who' }, t('runs'), ': ', data(req.clientUser),
          req.via === 'sudo' ? [' (', t('viaSudo'), ')'] : req.clientUser === 'bin' ? [' (', t('binProcess'), ')'] : null))
        : h('p', { class: 'nf-small nf-muted' }, t('idle')));
  }

  // ── stage: the request and the phases ──

  function mapLine(s) {
    var q = s.request, m = s.mapped;
    if (!m) return null;
    var same = m.uid === q.uid && m.gid === q.gid;
    if (same) return h('span', null, parts('mapSame', { ids: ids(m.uid, m.gid) }), ' ', data('= ' + L.serverName(m.uid)));
    var opt = s.export.squash;
    return h('span', { class: 'nf-map sd-changed', translate: 'no' },
      h('span', null, 'uid ' + q.uid), h('span', { class: 'nf-arrow' }, '→'), h('span', null, named(m.uid) + ','),
      h('span', null, 'gid ' + q.gid), h('span', { class: 'nf-arrow' }, '→'), h('span', null, String(m.gid)),
      h('span', { class: 'nf-opt' }, opt));
  }

  function checkLine(s) {
    var k = s.check;
    if (!k) return null;
    if (k.cls === 'root') return t('checkRoot');
    var target = k.target === 'dir' ? [t('targetDir'), ' ', data('.')] : data(k.name);
    return parts('checkLine', { target: h('span', null, target), cls: h('span', null, t('cls_' + k.cls)), bits: k.bits, need: k.need });
  }

  function applyLine(s) {
    if (!s.result || !s.result.ok) return null;
    var q = s.request;
    if (q.op === 'read') return t('applyRead');
    if (q.op === 'write') return t('applyWrite');
    return parts('applyCreate', { owner: named(s.result.owner.uid) });
  }

  function phase(key, letter, st, detail) {
    var state = st || 'idle';
    var mark = state === 'ok' ? '✓ ' + t('st_ok') : state === 'refused' ? '✗ ' + t('st_refused') : state === 'skipped' ? '– ' + t('st_skipped') : '';
    return h('li', { class: 'nf-ph nf-ph-' + state + (state === 'skipped' ? ' sd-hatch' : '') + (state === 'refused' ? ' sd-changed' : '') },
      h('span', { class: 'nf-ph-key', translate: 'no' }, '(' + letter + ')'),
      h('span', { class: 'nf-ph-name' }, t('ph_' + key)),
      h('span', { class: 'nf-ph-mark' }, mark),
      h('span', { class: 'nf-ph-detail' }, state === 'skipped' ? null : detail));
  }

  function middle(c) {
    var s = c.state, q = s.request, ph = s.phases || {};
    var env = q ? h('div', { class: 'nf-env' },
      h('div', { class: 'nf-ids', translate: 'no' }, ids(q.uid, q.gid)),
      h('div', { class: 'nf-env-op' }, data('sec=sys'), ' · ', t('op_' + q.op), ' ', data(q.name)),
      h('div', { class: 'nf-env-note' }, t('noNames')))
      : h('div', { class: 'nf-env' }, h('div', { class: 'nf-env-note' }, t('idle')));
    var write = q && (q.op === 'write' || q.op === 'create');
    var roWord = s.export.ro ? 'ro' : 'rw';
    return h('div', { class: 'nf-box nf-mid' },
      h('h3', null, t('request')),
      env,
      h('h4', null, t('phases')),
      h('ol', { class: 'nf-phases' },
        phase('send', 'a', ph.send, q ? data(ids(q.uid, q.gid)) : null),
        phase('export', 'b', ph.export, q ? parts(write ? 'exportWrite' : 'exportRead', { opt: roWord }) : null),
        phase('map', 'c', ph.map, mapLine(s)),
        phase('perm', 'd', ph.perm, checkLine(s)),
        phase('apply', 'e', ph.apply, applyLine(s))));
  }

  // ── stage: server ──

  var DIM = ['sync', 'wdelay', 'hide', 'no_subtree_check'];
  function exportLine(s) {
    var ph = s.phases || {};
    var words = [];
    DIM.forEach(function (w) { words.push({ w: w, cls: 'nf-w-dim' }); });
    words.push({ w: 'sec=sys', cls: '' });
    words.push({ w: s.export.ro ? 'ro' : 'rw', cls: 'nf-w-key' + (ph.export === 'refused' ? ' sd-changed' : '') });
    words.push({ w: 'secure', cls: 'nf-w-dim' });
    L.squashWords(s.export.squash).forEach(function (w) {
      var deciding = s.mapped && (s.mapped.uid !== s.request.uid || s.mapped.gid !== s.request.gid) &&
        (w === s.export.squash || (s.export.squash === 'all_squash' && w === 'all_squash'));
      words.push({ w: w, cls: 'nf-w-key' + (deciding ? ' sd-changed' : '') });
    });
    return h('div', { class: 'nf-export', translate: 'no' },
      h('div', null, S.path),
      h('div', null, S.clients + '(', words.map(function (x, i) {
        // a break is allowed only after a comma, never inside an option
        return [i ? ',\u200b' : '', h('span', { class: 'nf-w ' + x.cls }, x.w)];
      }), ')'));
  }

  function fileRow(s, f, kind) {
    var name = kind === 'dir' ? '.' : f.name;
    var k = s.check;
    var checked = k && k.name === name;
    var changed = s.changed.indexOf('file:' + name) >= 0;
    var refused = checked && !k.ok;
    var cls = [checked ? 'nf-row-checked' : '', f.isNew ? 'nf-row-new' : '', refused ? 'nf-row-refused' : '', changed ? 'nf-row-changed' : ''].join(' ');
    var own = L.serverName(f.uid), grp = L.serverName(f.gid);
    return h('tr', { class: cls },
      h('td', { class: 'nf-fname' }, data(name), f.isNew ? h('span', { class: 'nf-tag' }, t('newTag')) : null),
      h('td', { class: 'nf-own' }, h('b', { translate: 'no' }, String(f.uid)), own ? [' ', data(own)] : null),
      h('td', { class: 'nf-own' }, h('b', { translate: 'no' }, String(f.gid)), grp ? [' ', data(grp)] : null),
      h('td', { class: 'nf-mode' }, h('span', { class: 'nf-ls', translate: 'no' }, L.lsString(kind, f.mode)), data(L.octal(f.mode), 'nf-oct'),
        refused ? h('span', { class: 'nf-x', 'aria-label': t('legRefused') }, '✗') : null));
  }

  function server(c) {
    var s = c.state;
    var mappedUid = s.mapped ? s.mapped.uid : null;
    var mapChanged = s.changed.indexOf('mapped') >= 0;
    return h('div', { class: 'nf-box nf-server' },
      h('h3', null, t('server'), data(S.host), data(S.addr, 'nf-muted')),
      h('h4', null, data(t('passwd'))),
      h('ul', { class: 'nf-users' }, S.users.map(function (u) {
        var me = u.uid === mappedUid;
        return h('li', { class: 'nf-user' + (me ? ' nf-user-me' : '') + (me && mapChanged ? ' sd-changed' : '') }, person(u.name, u.uid), data(u.name));
      })),
      h('h4', null, t('exportfs')),
      exportLine(s),
      h('div', { class: 'nf-small nf-muted' }, t('outOfScope')),
      h('h4', null, t('files'), ' ', data(S.path)),
      h('table', { class: 'nf-files' },
        h('thead', null, h('tr', null, ['colName', 'colOwner', 'colGroup', 'colMode'].map(function (k) { return h('th', null, t(k)); }))),
        h('tbody', null, fileRow(s, s.dir, 'dir'), s.files.map(function (f) { return fileRow(s, f, 'file'); }))));
  }

  // ── stage: the result ──

  function foot(c) {
    var s = c.state, q = s.request, r = s.result;
    if (!q) return h('div', { class: 'nf-foot' }, h('span', { class: 'nf-muted' }, t('idle')));
    var out;
    if (r.errno) out = [h('span', { class: 'nf-out nf-out-err', translate: 'no' }, errOf(q, r.errno))];
    else if (q.op === 'read') out = [h('span', { class: 'nf-out', translate: 'no' }, contentOf(q.name))];
    else out = [];
    var srv;
    if (r.owner) srv = parts('ownerIs', { name: q.name, owner: named(r.owner.uid) });
    else if (r.ok && q.op === 'write') srv = parts('wroteTo', { name: q.name });
    else srv = t('nothingChanged');
    return h('div', { class: 'nf-foot' },
      h('span', null, h('b', null, t('result')), out, ' ', h('span', { class: 'nf-exit' }, t('exitStatus', { n: r.exit }))),
      h('span', null, h('b', null, t('onServer')), srv));
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'nf' }, client(c), middle(c), server(c), foot(c)));
  }

  // ── captions: what the server made of the number, then what happened ──

  function caption(c) {
    var s = c.state, q = s.request;
    if (!q) return parts('capStart', { cli: C.host, path: S.path, srv: S.host });
    var r = s.result, m = s.mapped;
    if (!m) return parts(q.via === 'sudo' ? 'map_notReached' : 'map_notReachedPlain', { ro: 'ro' }).concat(' ', parts('res_erofs', { msg: MSG.EROFS }));
    var opt = m.kind === 'keptSystem' ? 'root_squash' : s.export.squash;
    var first = parts('map_' + m.kind, {
      uid: 'uid=' + q.uid, opt: opt, nobody: 'nobody', root: 'root', user: q.clientUser, sname: L.serverName(m.uid) || String(m.uid)
    });
    var k = s.check, second;
    var target = k.target === 'dir' ? t('targetDirIn') : parts('targetFile', { name: k.name });
    if (r.owner) second = parts('res_created', { name: q.name, owner: r.owner.uid, sname: L.serverName(r.owner.uid) || String(r.owner.uid) });
    else if (k.cls === 'root') second = [t('res_root')];
    else if (!r.ok) second = parts('res_eacces', { cls: h('span', null, t('capCls_' + k.cls)), target: h('span', null, target), bits: k.bits, need: k.need, msg: MSG.EACCES });
    else second = parts('res_ok', { cls: h('span', null, t('capCls_' + k.cls)), target: h('span', null, target), bits: k.bits });
    return first.concat(' ', second);
  }

  // ── mount ──

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'ro', type: 'toggle', label: t('ro') },
      { key: 'squash', type: 'choice', label: t('squash'), options: L.SQUASH.map(function (x) { return [x, x]; }) },
      // the requests come with the preset; hidden so the panel fits one screen
      { key: 'script', type: 'select', label: t('script'), resets: true, visible: function () { return false; },
        options: L.SCRIPT_IDS.map(function (x) { return [x, t('preset_' + x)]; }) }
    ],

    presets: L.PRESETS.map(function (x) {
      return { id: x.id, label: t('preset_' + x.id), params: x.params, hint: t('preset_' + x.id + '_hint') };
    }),

    legend: [
      { shape: 'nf-user', label: t('legUser') },
      { shape: 'nf-env', label: t('legEnvelope') },
      { shape: 'nf-map', label: t('legMap') },
      { shape: 'nf-file', label: t('legFile') },
      { shape: 'nf-refused', label: t('legRefused') },
      { shape: 'nf-new', label: t('legNew') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
