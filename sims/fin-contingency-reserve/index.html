     the cumulative share, the sum of the most likely values and the chosen level's budget, the reserve between them;
     beside it the ladder of confidence levels (click a row to choose it).

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (65 443 / 65,443). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  function money(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  function pct(n) { return t('pct', { n: String(n) }); }
  /** A share in tenths of a per cent, with one decimal (1,5 % / 1.5%). */
  function share(tenths) {
    var s = (tenths / 10).toFixed(1);
    return t('share', { n: Simdeck.lang === 'hr' ? s.replace('.', ',') : s });
  }
  function pq(q) { return t('pq', { q: q }); }
  function lineName(id) { return t('line_' + id); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }

  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // the row to give focus back to after a render (keyboard)

  /** A stage row that acts as a button: click, or Enter / Space when focused. */
  function rowButton(cls, on, label, sel, apply, children) {
    return h('div', {
      class: cls, role: 'button', tabindex: '0', 'aria-pressed': String(on), 'aria-label': label, title: label,
      dataset: { sel: sel }, onmousedown: noFocus,
      onclick: function () { refocus = null; apply(); },
      onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); refocus = sel; apply(); } }
    }, children);
  }

  // ── the lines ──

  function lines(s) {
    var top = s.top;
    var x = function (v) { return (100 * v / top) + '%'; };
    var rows = s.lines.map(function (l) {
      var w = l.hi - l.lo, m = w ? 100 * (l.ml - l.lo) / w : 50;
      var label = t('lineLabel', { line: lineName(l.id), lo: money(l.lo), hi: money(l.hi), ml: money(l.ml) });
      return rowButton('cr-row', l.id === s.p.line, label, 'line-' + l.id, function () { sim.set({ line: l.id }); }, [
        h('span', { class: 'cr-name' }, lineName(l.id)),
        h('div', { class: 'cr-track', 'aria-hidden': 'true' },
          h('div', { class: 'cr-tri', style: { left: x(l.lo), width: (100 * w / top) + '%',
            clipPath: w ? 'polygon(0 100%, ' + m + '% 0, 100% 100%)' : 'none' } }),
          h('div', { class: 'cr-tick', dataset: { k: 'mean' }, style: { left: x((l.lo + l.ml + l.hi) / 3) } }),
          h('div', { class: 'cr-tick', dataset: { k: 'ml' }, style: { left: x(l.ml) } })),
        h('span', { class: 'cr-nums' },
          h('span', { class: 'cr-num', translate: 'no' }, t('lineNums', { lo: money(l.lo), hi: money(l.hi) })),
          h('span', null, t('lineMl', { ml: money(l.ml), m: money(l.mean) })))
      ]);
    });
    return h('div', { class: 'cr-lines' },
      h('p', { class: 'cr-head' }, t('headLines')),
      rows,
      h('p', { class: 'cr-sum' }, t('sumRow', { base: money(s.base), m: money(s.mean) })));
  }

  // ── the trials ──

  function chart(s) {
    var hs = s.hist, span = hs.hi - hs.lo;
    var px = function (v) { return 100 * (v - hs.lo) / span; };
    var most = Math.max.apply(null, hs.bins.map(function (x) { return x.in + x.res + x.over; }).concat(1));
    var bins = hs.bins.map(function (x) {
      return h('div', { class: 'cr-bin' }, ['in', 'res', 'over'].map(function (k) {
        return x[k] ? h('div', { class: 'cr-seg', dataset: { k: k }, style: { height: (100 * x[k] / most) + '%' } }) : null;
      }));
    });
    // the S-curve: the cumulative share at each bin's upper edge (viewBox 1000 × 1000, y down)
    var cum = 0, pts = ['0,1000'];
    hs.bins.forEach(function (x, i) {
      cum += x.in + x.res + x.over;
      pts.push((1000 * (i + 1) / hs.bins.length).toFixed(1) + ',' + (1000 - 1000 * cum / s.n).toFixed(1));
    });
    var lx = px(s.at.budget), bx = px(s.base);
    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'cr-curve');
    svg.setAttribute('viewBox', '0 0 1000 1000');
    svg.setAttribute('preserveAspectRatio', 'none');
    var guide = document.createElementNS(NS, 'line');   // the chosen share, across to the budget
    guide.setAttribute('x1', '0');
    guide.setAttribute('x2', String(10 * lx));
    guide.setAttribute('y1', String(1000 - 10 * s.at.q));
    guide.setAttribute('y2', String(1000 - 10 * s.at.q));
    var poly = document.createElementNS(NS, 'polyline');
    poly.setAttribute('points', pts.join(' '));
    svg.append(guide, poly);

    function mark(k, x, text) {
      return h('div', { class: 'cr-mark', dataset: { k: k }, style: { left: x + '%' } },
        h('span', { class: 'cr-tag', translate: 'no', dataset: { side: x > 55 ? 'l' : 'r' } }, text));
    }
    var brk = s.at.reserve > 0
      ? [h('div', { style: { left: bx + '%', width: (lx - bx) + '%' } }),
        h('span', { style: { left: ((bx + lx) / 2) + '%' } }, t('bracket', { v: money(s.at.reserve) }))]
      : [];
    return h('div', { class: 'cr-chart' },
      h('p', { class: 'cr-head' }, t('headTrials', { n: t.n('nTrials', s.n, { n: group(s.n) }) })),
      h('div', { class: 'cr-plot', 'aria-hidden': 'true' }, bins,
        h('div', { class: 'cr-layer' }, svg,
          mark('base', bx, t('tagBase', { v: money(s.base) })),
          mark('level', lx, t('tagLevel', { p: pq(s.at.q), v: money(s.at.budget) })))),
      h('div', { class: 'cr-share', 'aria-hidden': 'true', title: t('axisShare') }, [0, 50, 100].map(function (q) {
        return h('span', { translate: 'no', style: { bottom: q + '%' } }, pct(q));
      })),
      h('div', { class: 'cr-ticks', 'aria-hidden': 'true' }, hs.ticks.map(function (v) {
        return h('span', { translate: 'no', style: { left: px(v) + '%' } }, money(v));
      })),
      h('div', { class: 'cr-brk' }, brk));
  }

  // ── the ladder of confidence levels ──

  function ladder(s) {
    return h('div', { class: 'cr-ladder' },
      h('p', { class: 'cr-head' }, t('headLadder')),
      s.levels.map(function (l) {
        var label = t('ladderLabel', { p: pq(l.q), b: money(l.budget) });
        return rowButton('cr-lad', l.q === s.p.conf, label, 'conf-' + l.q, function () { sim.set({ conf: l.q }); }, [
          h('span', { class: 'cr-p', translate: 'no' }, pq(l.q)),
          h('span', { class: 'cr-b cr-num', translate: 'no' }, money(l.budget)),
          h('span', { class: 'cr-r cr-num' }, l.reserve > 0 ? t('ladderRes', { r: money(l.reserve), pct: pct(l.pct) }) : t('ladderCovered'))
        ]);
      }));
  }

  function result(s, chg) {
    var p = pq(s.at.q);
    var text = s.covered
      ? t('resultCovered', { p: p, b: money(s.at.budget), base: money(s.base) })
      : t('resultReserve', { p: p, b: money(s.at.budget), base: money(s.base), r: money(s.at.reserve), pct: pct(s.at.pct) });
    return h('p', { class: 'cr-result' + (chg.indexOf('outcome') >= 0 ? ' sd-changed' : ''), dataset: { o: s.covered ? 'covered' : 'reserve' } }, text);
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'cr' },
      lines(s),
      h('div', { class: 'cr-mid' }, chart(s), ladder(s)),
      result(s, chg),
      h('p', { class: 'cr-foot' }, t('foot', { low: money(s.low), high: money(s.high) }), ' ', t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state;
    var k = L.captionKey(s);
    var out = t.parts(k.key, {
      base: b(money(s.base)), e: b(share(s.enoughTenths)), p50: b(money(s.p50)), q: b(pct(s.at.q)),
      b: b(money(s.at.budget)), r: b(money(s.at.reserve)), pct: b(pct(s.at.pct))
    });
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, { m: b(money(s.mean)), n: b(group(s.n)) }));
    });
    return out;
  }

  var labels = { project: 'pProject', symmetric: 'pSymmetric', 'one-wild': 'pOneWild', 'few-trials': 'pFewTrials', 'spend-cap': 'pSpendCap' };
  var R = L.RANGES;
  function range(key, label, fmt, id) {
    return { key: key, type: 'range', label: label, min: R[key][0], max: R[key][1], step: R[key][2], format: fmt,
      visible: function (p) { return p.line === id; } };
  }
  var lineParams = [];
  L.LINES.forEach(function (id) {
    var name = lineName(id);
    lineParams.push(
      range(id, t('mlOf', { line: name }), money, id),
      range(id + 'D', t('downOf', { line: name }), pct, id),
      range(id + 'U', t('upOf', { line: name }), pct, id));
  });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      // the line is chosen on the stage (the line rows); this hidden param keeps it in the URL and checks it
      { key: 'line', type: 'choice', label: t('line'), options: L.LINES.map(function (id) { return [id, lineName(id)]; }),
        visible: function () { return false; } },
      // the seed: "Run again" adds 1; hidden, kept in the URL
      { key: 'seed', type: 'range', label: t('runAgain'), min: 1, max: L.SEED_MAX, step: 1, visible: function () { return false; } }
    ].concat(lineParams, [
      { key: 'conf', type: 'choice', label: t('conf'), options: L.CONF.map(function (q) { return [q, pq(q)]; }) },
      { key: 'trials', type: 'choice', label: t('trials'), options: L.TRIALS.map(function (n) { return [n, group(n)]; }) },
      { type: 'button', label: t('runAgain'), key: 'n', run: function (api) {
        api.set({ seed: L.nextSeed(api.params.seed) });
      } }
    ]),
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cr-in', label: t('legIn') },
      { shape: 'cr-res', label: t('legRes') },
      { shape: 'cr-over', label: t('legOver') },
      { shape: 'cr-base', label: t('legBase') },
      { shape: 'cr-level', label: t('legLevel') },
      { shape: 'cr-curve', label: t('legCurve') },
      { shape: 'cr-ml', label: t('legMl') },
      { shape: 'cr-mean', label: t('legMean') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
