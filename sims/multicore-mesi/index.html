<style>
/* Page CSS: every selector starts with [data-sim="multicore-mesi"]; colours only from kit tokens. */

}

}

/* False sharing */
[data-sim="multicore-mesi"] .mc-fs { grid-template-columns: minmax(0, 1fr); gap: 3cqh; align-content: start; }
[data-sim="multicore-mesi"] .mc-lines { display: flex; flex-direction: column; gap: 2cqh; }
[data-sim="multicore-mesi"] .mc-line { padding: 0.7rem 1rem; border: var(--line-w) solid var(--line); border-radius: var(--radius-sm); background: var(--panel); }
[data-sim="multicore-mesi"] .mc-line-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 1.5rem; margin-bottom: 0.6rem; font-size: 1.15rem; }

}

[data-sim="multicore-mesi"] .mc-cell[data-t="0"], [data-sim="multicore-mesi"] .mc-cellkey[data-t="0"] { --sw: var(--c4); }
[data-sim="multicore-mesi"] .mc-cell[data-t="1"], [data-sim="multicore-mesi"] .mc-cellkey[data-t="1"] { --sw: var(--c6); }
[data-sim="multicore-mesi"] .mc-cellkeys { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; margin: 0; padding: 0; list-style: none; font-size: var(--fs-sm); }
[data-sim="multicore-mesi"] .mc-cellkeys li { display: inline-flex; align-items: center; gap: 0.4rem; }
[data-sim="multicore-mesi"] .mc-cellkey { display: inline-block; width: 1.1em; height: 1.1em; border: var(--line-w) solid var(--sw); border-radius: 0.2rem; background: var(--sw); }
[data-sim="multicore-mesi"] .mc-cellkey[data-t="1"], [data-sim="multicore-mesi"] .mc-cell[data-t="1"] {
  background-image: repeating-linear-gradient(45deg, transparent 0 0.35em, color-mix(in srgb, var(--bg) 35%, transparent) 0.35em 0.5em);
}
[data-sim="multicore-mesi"] .mc-cellkey[data-last] { background: var(--hl); border-color: var(--ink); }
[data-sim="multicore-mesi"] .mc-fs-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2cqw; align-items: start; }
[data-sim="multicore-mesi"] .mc-fs-side > div { display: flex; flex-direction: column; gap: 1.2cqh; }
[data-sim="multicore-mesi"] .mc-fs-side .mc-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
[data-sim="multicore-mesi"] .mc-fs-last { padding: 0.4rem 1rem; border-left: 0.35rem solid var(--line); background: var(--panel); }
[data-sim="multicore-mesi"] .mc-bar { height: 1.2rem; border: var(--line-w) solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--bg); }
[data-sim="multicore-mesi"] .mc-bar span { display: block; height: 100%; background: var(--ok); }
[data-sim="multicore-mesi"] .mc-verdict { font-weight: 700; }

/* Phone and portrait: the stage grows with its content, one column. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {

  [data-sim="multicore-mesi"] .mc-meter-value { font-size: 1.8rem; }

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x, d) { var s = x.toFixed(d); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function times(x, d) { return num(x, d == null ? 2 : d) + '×'; }
  function pct(x) { return t('pct', { v: num(x * 100, 0) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function keepFocus(e) { e.preventDefault(); }
  function data(x) { return h('span', { translate: 'no' }, x); }
  function tag(st) { return h('span', { class: 'mc-tag', dataset: { st: st }, translate: 'no' }, st); }

  var labels = {
    'amdahl-80': 'presetAmdahl80', 'amdahl-95': 'presetAmdahl95', 'mesi-empty': 'presetMesiEmpty', 'mesi-share': 'presetMesiShare',
    'mesi-invalidate': 'presetMesiInval', 'mesi-pingpong': 'presetMesiPing', 'fs-shared': 'presetFsShared', 'fs-padded': 'presetFsPadded'
  };

  // ── params ──
  var inView = function (v) { return function (p) { return p.view === v; }; };
  var params = [
    { key: 'view', type: 'choice', label: t('view'),
      options: [['amdahl', t('viewAmdahl')], ['mesi', t('viewMesi')], ['fs', t('viewFs')]] },
    { key: 'p', type: 'range', label: t('parallel'), min: 1, max: 99, step: 1, visible: inView('amdahl'),
      format: function (v) { return t('pct', { v: v }); } },
    { key: 'n', type: 'range', label: t('cores'), min: 1, max: 64, step: 1, visible: inView('amdahl') },
    { key: 'writes', type: 'range', label: t('writes'), hint: t('writesHint'), min: 0, max: L.MAX_WRITES, step: 1, visible: inView('fs') },
    { key: 'pad', type: 'toggle', label: t('pad'), hint: t('padHint'), visible: inView('fs') }
  ];
  // The MESI operations are params too (never shown), so a reload, a link and the language switch keep them.
  for (var i = 1; i <= L.MAX_OPS; i++) {
    params.push({ key: 'o' + i, type: 'choice', label: t('opSlot', { i: i }), visible: function () { return false; },
      options: [['', '0']].concat(L.OPS.map(function (o) { return [o, o]; })) });
  }

  function doOp(op) {
    var p = sim.params;
    var patch = L.pushOp(p, op);
    if (!patch) { if (p.view !== 'mesi') sim.set({ view: 'mesi' }); return; }
    if (p.view !== 'mesi') patch.view = 'mesi';
    sim.set(patch);
  }
  function undo() { var patch = L.popOp(sim.params); if (patch) sim.set(patch); }

  // ── Amdahl view ──
  function meter(label, value, sub) {
    return h('div', { class: 'mc-meter' }, h('div', { class: 'mc-meter-label' }, label), h('div', { class: 'mc-meter-value' }, value),
      sub ? h('div', { class: 'mc-meter-sub' }, sub) : null);
  }
  function lineKey(line, label) {
    return h('li', null, s('svg', { 'aria-hidden': 'true', viewBox: '0 0 40 10' }, s('line', { class: 'mc-curve', 'data-line': line, x1: 0, y1: 5, x2: 40, y2: 5 })), label);
  }
  function niceStep(max) {
    var steps = [1, 2, 5, 10, 20];
    for (var k = 0; k < steps.length; k++) if (max / steps[k] <= 6) return steps[k];
    return 20;
  }
  function drawChart(box, a) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 2.6 * rem, r: 1 * rem, t: 0.8 * rem, b: 2.6 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var MAXN = 64;
    var yMax = Math.max(2, Math.ceil(Math.min(a.ceiling, MAXN) * 1.15));
    var X = function (n) { return pad.l + (Math.log2(n) / Math.log2(MAXN)) * cw; };
    var Y = function (v) { return pad.t + ch * (1 - v / yMax); };
    var svg = s('svg', { width: W, height: H, role: 'img', 'aria-label': t('chartTitle') });
    var step = niceStep(yMax);
    for (var v = 0; v <= yMax + 1e-9; v += step) {
      svg.append(s('line', { class: 'mc-grid', x1: pad.l, x2: pad.l + cw, y1: Y(v), y2: Y(v) }));
      svg.append(s('text', { x: pad.l - 0.4 * rem, y: Y(v) + 0.35 * rem, 'text-anchor': 'end' }, String(v)));
    }
    L.CHART_N.forEach(function (n) {
      svg.append(s('line', { class: 'mc-grid', x1: X(n), x2: X(n), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(n), y: pad.t + ch + 1.2 * rem, 'text-anchor': 'middle' }, String(n)));
    });
    svg.append(s('line', { class: 'mc-axis', x1: pad.l, x2: pad.l, y1: pad.t, y2: pad.t + ch }));
    svg.append(s('line', { class: 'mc-axis', x1: pad.l, x2: pad.l + cw, y1: pad.t + ch, y2: pad.t + ch }));
    svg.append(s('text', { x: pad.l + cw / 2, y: H - 0.2 * rem, 'text-anchor': 'middle' }, t('axisN')));
    if (a.ceiling <= yMax) {
      svg.append(s('line', { class: 'mc-curve', 'data-line': 'max', x1: pad.l, x2: pad.l + cw, y1: Y(a.ceiling), y2: Y(a.ceiling) }));
      svg.append(s('text', { class: 'mc-max-label', x: pad.l + 0.5 * rem, y: Y(a.ceiling) - 0.4 * rem }, times(a.ceiling, 1)));
    }
    var pts = [];
    for (var k = 0; k <= 120; k++) { var nn = Math.pow(MAXN, k / 120); pts.push(X(nn).toFixed(1) + ',' + Y(L.speedup(a.p, nn)).toFixed(1)); }
    svg.append(s('polyline', { class: 'mc-curve', 'data-line': 'speedup', points: pts.join(' ') }));
    a.curve.forEach(function (c) { svg.append(s('circle', { class: 'mc-mark', cx: X(c.n), cy: Y(c.s), r: 0.25 * rem })); });
    // Where the current settings sit; the label goes below and right of the rising curve, above and left of it near the edge.
    var nx = X(a.n), ny = Y(a.speedup);
    var right = nx > pad.l + cw * 0.7;
    svg.append(s('circle', { class: 'mc-dot', cx: nx, cy: ny, r: 0.45 * rem }));
    svg.append(s('text', { class: 'mc-dot-label', x: nx + (right ? -0.8 : 0.8) * rem, y: ny + (right ? -0.8 : 1.5) * rem, 'text-anchor': right ? 'end' : 'start' },
      t('point', { v: times(a.speedup) })));
    box.replaceChildren(svg);
  }
  var plot = null;
  function amdahlStage(a) {
    plot = h('div', { class: 'mc-plot' });
    return h('div', { class: 'mc mc-amdahl' },
      h('div', { class: 'mc-meters' },
        meter(t('meterSpeedup'), times(a.speedup), null),
        meter(t('meterEff'), pct(a.efficiency), t('meterEffSub')),
        meter(t('meterMax'), times(a.ceiling, 1), t('meterMaxSub'))),
      h('div', { class: 'mc-wall' }, t('wall', { serial: pct(a.serial), max: times(a.ceiling, 1) })),
      h('div', { class: 'mc-h' }, t('chartTitle')),
      plot,
      h('ul', { class: 'mc-keys' }, lineKey('speedup', t('lineSpeedup')), lineKey('max', t('lineMax'))));
  }

  // ── MESI view ──
  function eventText(ev) {
    var key = ev.op === 'r' ? (ev.outcome === 'hit' ? 'evReadHit' : 'evReadMiss')
      : ev.outcome === 'hit' ? 'evWriteHit' : ev.outcome === 'upgrade' ? 'evWriteUpgrade' : 'evWriteMiss';
    return t(key, { c: ev.core, v: ev.value });
  }
  function eventChanges(ev) {
    return ev.changes.map(function (x) { return t('evChange', { c: x.core, from: x.from, to: x.to }); }).join(' · ');
  }
  function eventWhy(ev) {
    if (ev.op === 'r') {
      if (ev.outcome === 'hit') return t('whyReadHit');
      var mine = ev.changes.filter(function (x) { return x.core === ev.core; })[0];
      return t(mine && mine.to === 'E' ? 'whyReadE' : 'whyReadS');
    }
    if (ev.outcome === 'upgrade') return t('whyWriteUpgrade');
    if (ev.outcome === 'miss') return t('whyWriteMiss');
    return t(ev.changes.length ? 'whyWriteE' : 'whyWriteM');
  }
  function opButton(label, key, op, full) {
    return h('button', { type: 'button', class: 'sd-btn', 'aria-keyshortcuts': key, 'aria-disabled': full ? 'true' : 'false',
      onmousedown: keepFocus, onclick: function () { doOp(op); } }, h('span', null, label), h('kbd', null, key.toUpperCase()));
  }
  function coreBox(m, c) {
    var e = m.caches[c][0];
    return h('div', { class: 'mc-core', dataset: { st: e.st } },
      h('div', { class: 'mc-core-name' }, t('core', { c: c })),
      tag(e.st),
      h('div', { class: 'mc-core-desc' }, h('b', null, t('name' + e.st)), ': ', t('desc' + e.st), ' · ',
        data(e.v == null ? 'X = –' : 'X = ' + e.v), ' ', t('inCache')),
      h('div', { class: 'mc-btns' },
        opButton(t('read'), c === 0 ? 'q' : 'o', 'r' + c, m.full),
        opButton(t('write'), c === 0 ? 'w' : 'p', 'w' + c, m.full)));
  }
  function stat(label, v) { return h('div', { class: 'mc-stat' }, h('b', null, String(v)), h('span', null, label)); }
  function mesiStage(m) {
    var shown = m.events.slice(-6);
    var log = shown.length ? shown.map(function (ev, k) {
      var chg = eventChanges(ev);
      return h('li', { class: k === shown.length - 1 ? 'mc-last' : null }, eventText(ev), ev.wb != null ? ' ' + t('evWb', { c: ev.wb }) : '',
        chg ? h('div', { class: 'mc-chg' }, chg) : null);
    }) : [h('li', { class: 'mc-note' }, t('logEmpty'))];
    var btn = function (label, run, off) {
      return h('button', { type: 'button', class: 'sd-btn', 'aria-disabled': off ? 'true' : 'false', onmousedown: keepFocus, onclick: run }, h('span', null, label));
    };
    return h('div', { class: 'mc mc-mesi' },
      h('div', { class: 'mc-col' },
        coreBox(m, 0),
        coreBox(m, 1),
        h('div', { class: 'mc-ram', dataset: m.stale ? { stale: '' } : {} },
          h('b', null, t('ram')), data('X = ' + m.ram[0]), h('span', { class: 'mc-ram-note' }, m.stale ? t('ramStale') : t('ramFresh')))),
      h('div', { class: 'mc-col' },
        h('div', { class: 'mc-h' }, t('logTitle')),
        h('ol', { class: 'mc-log' }, log),
        h('div', { class: 'mc-stats' }, stat(t('statHits'), m.hits), stat(t('statMisses'), m.misses + m.upgrades), stat(t('statInval'), m.inval), stat(t('statWb'), m.wb)),
        h('div', { class: 'mc-note', dataset: m.full ? { warn: '' } : {} }, m.full ? t('full', { max: L.MAX_OPS }) : t('opsCount', { n: m.ops, max: L.MAX_OPS })),
        h('div', { class: 'mc-btns' },
          btn(t('undo'), undo, !m.ops),
          btn(t('clear'), function () { sim.set(L.clearOps()); }, !m.ops))));
  }

  // ── false sharing view ──
  function fsStage(f) {
    var lines = [];
    for (var l = 0; l < f.lines; l++) {
      var cells = [];
      for (var k = 0; k < L.LINE_INTS; k++) {
        var who = f.place[0].line === l && f.place[0].slot === k ? 0 : f.place[1].line === l && f.place[1].slot === k ? 1 : null;
        var last = who != null && f.last && f.last.core === who;
        cells.push(h('span', { class: 'mc-cell' + (last ? ' sd-changed' : ''), dataset: who == null ? {} : { t: String(who) }, translate: 'no' },
          who == null ? '' : String(f.counters[who])));
      }
      var states = [0, 1].map(function (c) { return h('span', { class: 'mc-line-state' }, t('lineState', { c: c }), tag(f.caches[c][l].st)); });
      lines.push(h('div', { class: 'mc-line' },
        h('div', { class: 'mc-line-head' }, h('b', null, t('line', { l: l })), states),
        h('div', { class: 'mc-cells' }, cells)));
    }
    var verdict = f.pad ? t('fsApart') : t('fsSame');
    return h('div', { class: 'mc mc-fs' },
      h('div', { class: 'mc-col' },
        h('div', { class: 'mc-h' }, t('memTitle')),
        h('div', { class: 'mc-lines' }, lines),
        h('ul', { class: 'mc-cellkeys' },
          h('li', null, h('span', { class: 'mc-cellkey', dataset: { t: '0' } }), t('cellKey0')),
          h('li', null, h('span', { class: 'mc-cellkey', dataset: { t: '1' } }), t('cellKey1')),
          h('li', null, h('span', { class: 'mc-cellkey', dataset: { last: '' } }), t('cellKeyLast')))),
      h('div', { class: 'mc-fs-side' },
        h('div', null,
          h('div', { class: 'mc-verdict', dataset: f.pad ? { good: '' } : { bad: '' } }, verdict),
          h('div', null, f.writes ? t('fsHits', { v: pct(f.hitShare) }) : t('fsHitsNone')),
          h('div', { class: 'mc-bar', 'aria-hidden': 'true' }, h('span', { style: { width: ((f.hitShare || 0) * 100) + '%' } }))),
        h('div', null,
          h('div', { class: 'mc-stats' }, stat(t('fsWrites'), f.writes), stat(t('fsMisses'), f.misses), stat(t('fsInval'), f.inval)),
          f.last ? h('div', { class: 'mc-fs-last' }, t('fsLast', { c: f.last.core }), ' ', t(f.last.outcome === 'hit' ? 'fsLastHit' : 'fsLastMiss'),
            f.last.changes.length ? h('div', { class: 'mc-chg' }, eventChanges(f.last)) : null) : null)));
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 2, label: t('legendM') },
      { c: 1, label: t('legendE') },
      { c: 3, label: t('legendS') },
      { c: 8, shape: 'hollow', label: t('legendI') }
    ],
    keys: [
      { key: 'q', label: t('keyR0'), run: function () { doOp('r0'); } },
      { key: 'w', label: t('keyW0'), run: function () { doOp('w0'); } },
      { key: 'o', label: t('keyR1'), run: function () { doOp('r1'); } },
      { key: 'p', label: t('keyW1'), run: function () { doOp('w1'); } },
      { key: 'u', label: t('keyUndo'), run: function () { undo(); } }
    ],

    render: function (c) {
      var st = c.state;
      plot = null;
      if (st.view === 'mesi') c.stage.replaceChildren(mesiStage(st.mesi));
      else if (st.view === 'fs') c.stage.replaceChildren(fsStage(st.fs));
      else { c.stage.replaceChildren(amdahlStage(st.amdahl)); drawChart(plot, st.amdahl); }
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      if (st.view === 'mesi') {
        var m = st.mesi;
        if (!m.events.length) return t('captionMesiEmpty');
        var ev = m.events[m.events.length - 1];
        return [b(eventText(ev)), ' ', ev.wb != null ? t('evWb', { c: ev.wb }) + ' ' : '', eventWhy(ev)];
      }
      if (st.view === 'fs') {
        var f = st.fs;
        if (!f.writes) return t('captionFsNone');
        return t.parts(f.pad ? 'captionFsPadded' : 'captionFsShared', { k: b(String(f.writes)), m: b(String(f.misses)), i: b(String(f.inval)) });
      }
      var a = st.amdahl;
      return t.parts('captionAmdahl', { n: b(String(a.n)), s: b(times(a.speedup)), e: pct(a.efficiency), serial: pct(a.serial), max: b(times(a.ceiling, 1)) });
    }
  });

  // The chart is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var lastSize = '';
    new ResizeObserver(function (es) {
      var r = es[0].contentRect, key = Math.round(r.width) + 'x' + Math.round(r.height);
      if (key !== lastSize) { lastSize = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
