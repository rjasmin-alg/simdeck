<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

    </div>

      <div data-sd-presets></div>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var RT = Simdeck.ruleTable;
  var t = Simdeck.useStrings(window.SimStrings);
  var ROW_NAME = { user_obj: 'rOwner', user: 'rUser', group_obj: 'rGroupObj', group: 'rGroup', mask: 'rMask', other: 'rOther' };
  var CLASS_NAME = { owner: 'oOwner', users: 'oUsers', groups: 'oGroups', other: 'oOther' };

  /** Data (names, entries, bits, paths) is not language: the word check skips translate="no". */
  function code(s) { return h('code', { translate: 'no' }, String(s)); }
  function data(s, cls) { return h('span', Object.assign({ translate: 'no' }, cls ? { class: cls } : {}), String(s)); }
  function has(s, mark) { return s.changed.indexOf(mark) >= 0; }
  function anim(c) { return c.dir === 'forward' ? ' sd-anim-in' : ''; }
  function wantWord(s) { return s.want === 'r' ? t('wR') : s.want === 'w' ? t('wW') : s.file.kind === 'dir' ? t('wXdir') : t('wX'); }

  /** Effective perms beside the written ones: a bit the entry has and the mask removed is struck (.ad-cut). */
  function effNode(written, eff) {
    var out = [];
    for (var k = 0; k < 3; k++) {
      if (written[k] !== '-' && eff[k] === '-') out.push(h('s', { class: 'ad-cut' }, written[k]));
      else out.push(eff[k]);
    }
    return h('span', { class: 'ad-eff', translate: 'no' }, out);
  }

  // ── the order of the classes ──
  function orderStrip(s) {
    var present = L.classesOf(s.file.acl).map(function (k) { return k.cls; });
    var compared = {};
    s.rows.forEach(function (r, i) { if (r) compared[classOfRow(s, i)] = r; });
    var items = [];
    L.CLASS_ORDER.forEach(function (cls, n) {
      var v;
      if (present.indexOf(cls) < 0) v = 'none';
      else if (s.matched === cls) v = s.cursor === cls ? 'now' : 'win';
      else if (compared[cls]) v = 'no';
      else if (s.matched || s.privileged && s.phase !== 'identify' || s.verdict) v = 'skip';
      else v = 'pending';
      if (v === 'now' && s.verdict) v = 'win';
      var sym = { no: '–', win: '▶', now: '▷' }[v] || '';
      if (n) items.push(h('span', { class: 'ad-arrow', 'aria-hidden': 'true' }, '→'));
      items.push(h('span', { class: 'ad-cls' + (s.cursor === cls ? ' sd-changed' : ''), dataset: { v: v } },
        h('span', { class: 'ad-sym', 'aria-hidden': 'true' }, sym),
        h('span', { class: 'ad-name' }, t(CLASS_NAME[cls])),
        v === 'none' ? h('span', { class: 'ad-small' }, '(', t('oNone'), ')') : null));
    });
    return h('div', { class: 'ad-order' }, h('span', { class: 'ad-order-t' }, t('orderTitle')), items);
  }
  function classOfRow(s, i) { return { user_obj: 'owner', user: 'users', group_obj: 'groups', group: 'groups', other: 'other' }[s.file.acl[i].tag]; }

  // ── the process ──
  function procBox(s, c) {
    var hitGroups = [];
    if (s.cursor === 'groups' || s.matched === 'groups') {
      s.file.acl.forEach(function (en) {
        if (en.tag === 'group_obj') hitGroups.push(s.file.group);
        if (en.tag === 'group') hitGroups.push(en.qual);
      });
    }
    var priv = s.privileged === null ? null
      : h('div', { class: 'ad-priv', dataset: s.privileged ? { on: '' } : {} }, s.privileged ? t('privYes') : t('privNo'));
    return h('section', { class: 'ad-box ad-proc' + (has(s, 'proc') ? ' sd-changed' + anim(c) : '') },
      h('h3', null, t('procTitle')),
      h('div', { class: 'ad-user', translate: 'no' }, s.proc.user),
      h('div', { class: 'ad-kv' }, h('span', { class: 'ad-muted' }, t('euid')), data(s.proc.uid)),
      h('div', { class: 'ad-kv' }, h('span', { class: 'ad-muted' }, t('groups'))),
      h('div', { class: 'ad-chips' }, s.proc.groups.map(function (g) {
        return h('span', { class: 'ad-chip', translate: 'no', dataset: hitGroups.indexOf(g) >= 0 ? { hit: '' } : {} }, g);
      })),
      priv);
  }

  // ── the file: ls -l, owner and group, and the entries (K4 with the page's own marks) ──
  function lsLine(s) {
    var f = s.file, ls = f.ls;
    var trip = function (a, b, mask) {
      var kids = [];
      for (var i = a; i < b; i++) {
        var ch = ls[i];
        var xHere = s.phase !== 'start' && s.privileged && s.want === 'x' && f.kind !== 'dir' && (i === 3 || i === 6 || i === 9);
        kids.push(xHere ? h('span', { class: 'ad-x' }, ch) : ch);
      }
      return h('span', { class: 'ad-trip' + (mask && s.phase === 'mask' ? ' sd-changed' : ''), dataset: mask ? { mask: '' } : {} }, kids);
    };
    return h('div', { class: 'ad-ls' },
      h('span', { class: 'ad-prompt', translate: 'no' }, '$ ls -l'),
      h('b', { translate: 'no' }, ls[0], trip(1, 4), trip(4, 7, f.extended), trip(7, 10), ls.slice(10)),
      data(f.owner + ' ' + f.group + ' ' + f.path));
  }

  function markOf(s, i) {
    var en = s.file.acl[i];
    if (s.privileged) return s.phase === 'override' || s.verdict ? 'skip' : 'pending';
    if (en.tag === 'mask') {
      if (s.phase === 'mask' || s.maskUsed === true && s.verdict) return 'pending';
      return s.matched && !L.masked(s.matched) || s.verdict ? 'skip' : 'pending';
    }
    var r = s.rows[i];
    if (r === 'no') return 'no';
    if (r === 'hit') {
      if (!s.verdict) return 'hit';
      if (s.granting.length && s.granting.indexOf(i) < 0) return 'beaten';
      return 'win';
    }
    return s.matched || s.verdict ? 'skip' : 'pending';
  }

  function entryTable(s, c) {
    var f = s.file;
    var maskRow = -1;
    f.acl.forEach(function (en, i) { if (en.tag === 'mask') maskRow = i; });
    var at = s.phase === 'compare' || s.phase === 'mask' ? s.cursorRows[0] : -1;
    var table = RT({
      dir: c.dir,
      mode: 'first',
      title: t('tableTitle'),
      noLabel: t('colClass'),
      columns: [{ key: 'entry', label: t('colEntry') }, { key: 'who', label: t('colWho') }],
      actionLabel: t('colPerms'),
      extra: [{ key: 'eff', label: t('colEff') }],
      markLabel: data(s.proc.user),
      rows: f.acl.map(function (en, i) {
        var mark = markOf(s, i);
        var who = en.tag === 'user_obj' ? f.owner : en.tag === 'group_obj' ? f.group : en.qual ? en.qual
          : en.tag === 'mask' ? '' : h('span', null, t('whoOther'));
        var eff = s.effective && s.effective[i] != null ? effNode(en.perms, s.effective[i]) : '';
        var applied = en.tag === 'mask' && (s.phase === 'mask' || s.maskUsed === true && s.verdict);
        return {
          no: h('span', null, t(ROW_NAME[en.tag])),
          cells: { entry: L.entryText(en, ''), who: who, eff: eff },
          action: en.perms,
          hit: mark === 'no' ? false : null,
          miss: mark === 'no' ? ['who'] : [],
          mark: mark,
          note: applied ? [{ k: 'hl', text: t('maskOn') }] : null
        };
      }),
      at: at,
      subject: { mark: s.proc.user, c: 1 },
      done: s.verdict != null && !s.privileged,
      outcome: function () { return RT.verdict(s.verdict === 'granted', t(s.verdict === 'granted' ? 'granted' : 'denied')); },
      words: { hit: t('markHit'), win: t('markWin'), beaten: t('markBeaten'), skip: t('markSkip') },
      changed: at >= 0,
      stickyMark: true
    });
    return h('div', { class: 'ad-file' },
      lsLine(s),
      h('div', { class: 'ad-owner' },
        h('span', null, h('span', { class: 'ad-muted' }, t('ownerIs')), ' ', data(f.owner)),
        h('span', null, h('span', { class: 'ad-muted' }, t('groupIs')), ' ', data(f.group))),
      table,
      s.privileged && s.phase !== 'start' && s.phase !== 'identify' ? h('p', { class: 'ad-note' }, t('notRead')) : null);
  }

  // ── the request, what applies, the verdict ──
  function wantBox(s) {
    return h('section', { class: 'ad-box' },
      h('h3', null, t('wantTitle')),
      h('div', { class: 'ad-wants', translate: 'no' }, L.WANTS.map(function (w) {
        return h('span', { class: 'ad-want', dataset: w === s.want ? { on: '' } : {} }, w);
      })),
      h('div', { class: 'ad-small', style: { marginTop: '0.3rem' } }, wantWord(s)));
  }

  function hasNode(ok, s) {
    return h('span', { class: 'ad-has', dataset: { ok: String(ok) } }, (ok ? '✓ ' : '✕ '), t(ok ? 'hasBit' : 'lacksBit', { b: s.want }));
  }

  function calcBox(s, c) {
    var f = s.file, body;
    if (s.privileged && s.phase !== 'identify' && s.phase !== 'start') {
      var lines = f.kind === 'dir' ? [['ovRW', s.want !== 'x'], ['ovDir', s.want === 'x']] : [['ovRW', s.want !== 'x'], ['ovX', s.want === 'x']];
      body = [h('h3', null, t('ovTitle'))].concat(lines.map(function (l) {
        return h('div', { class: 'ad-ov' + (l[1] && has(s, 'override') ? ' sd-changed' : ''), dataset: l[1] ? { on: '' } : {} }, t(l[0]));
      }));
      return h('section', { class: 'ad-box ad-calc' }, body);
    }
    if (!s.matched) return h('section', { class: 'ad-box ad-calc' }, h('h3', null, t('calcTitle')), h('div', { class: 'ad-muted ad-small' }, t('calcWait')));
    var maskEn = null;
    f.acl.forEach(function (en) { if (en.tag === 'mask') maskEn = en; });
    var masked = L.masked(s.matched) && maskEn;
    var bit = { r: 0, w: 1, x: 2 }[s.want];
    body = s.matchedRows.map(function (i) {
      var en = f.acl[i];
      var parts = [code(L.entryText(en))];
      var eff = s.effective ? s.effective[i] : null;
      if (masked && eff != null) parts.push(h('span', { class: 'ad-op', 'aria-hidden': 'true' }, '∧'), code(L.entryText(maskEn)),
        h('span', { class: 'ad-op', 'aria-hidden': 'true' }, '='), h('code', null, effNode(en.perms, eff)));
      var final = masked ? eff : en.perms;
      if (final != null) parts.push(h('span', { class: 'ad-op', 'aria-hidden': 'true' }, '→'), hasNode(final[bit] !== '-', s));
      return h('div', { class: 'ad-line' + ((has(s, 'mask') || has(s, 'rows') && !masked) ? ' sd-changed' : '') }, parts);
    });
    var note = !masked && f.extended && s.matched ? h('div', { class: 'ad-small ad-muted' }, t('noMask')) : null;
    return h('section', { class: 'ad-box ad-calc' }, h('h3', null, t('calcTitle')), body, note);
  }

  function verdictBox(s, c) {
    var v = s.verdict || 'wait';
    var sym = { granted: '✓', denied: '✕', wait: '…' }[v];
    var by = !s.verdict ? null : s.privileged ? t('byPriv') : t('byClass', { cls: t(CLASS_NAME[s.matched]) });
    return h('section', { class: 'ad-box ad-verdict' + (has(s, 'verdict') ? ' sd-changed' + anim(c) : ''), dataset: { v: v } },
      h('h3', null, t('verdictTitle')),
      h('div', { class: 'ad-big' }, h('span', { 'aria-hidden': 'true' }, sym), ' ', t(s.verdict ? s.verdict : 'waiting')),
      by ? h('div', { class: 'ad-small' }, by) : null);
  }

  // ── captions: the sentence and its data come from the model (captionOf) ──
  function rich(parts) {
    var out = [];
    (Array.isArray(parts) ? parts : [parts]).forEach(function (p) {
      if (typeof p !== 'string') { out.push(p); return; }
      p.split('`').forEach(function (bit, i) { if (bit) out.push(i % 2 ? code(bit) : bit); });
    });
    return out;
  }
  function caption(c) {
    var cap = L.captionOf(c.state);
    var vars = {};
    Object.keys(cap.vars).forEach(function (k) {
      var v = cap.vars[k];
      vars[k] = typeof v === 'string' ? code(v) : t(v.t);
    });
    return rich(t.parts(cap.key, vars));
  }

  // ── the stage ──
  function render(c) {
    var s = c.state;
    var main = h('div', { class: 'ad-main' }, procBox(s, c), entryTable(s, c));
    var low = h('div', { class: 'ad-low' }, wantBox(s), calcBox(s, c), verdictBox(s, c));
    c.stage.replaceChildren(h('div', { class: 'ad' }, orderStrip(s), main, low));
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scene', type: 'choice', label: t('scene'), resets: true,
        options: [['projekt', t('fProjekt')], ['plan', t('fPlan')], ['proba', t('fProba')], ['druga', t('fDruga')], ['tajna', t('fTajna')]] },
      { key: 'who', type: 'choice', label: t('who'), resets: true,
        options: [['student', t('uStudent')], ['ana', t('uAna')], ['marko', t('uMarko')], ['nobody', t('uNobody')], ['root', t('uRoot')]] },
      { key: 'want', type: 'choice', label: t('want'), resets: true,
        options: [['r', t('wantR')], ['w', t('wantW')], ['x', t('wantX')]] },
      { key: 'mask', type: 'choice', label: t('mask'), hint: t('maskHint'),
        options: [['rwx', t('mRwx')], ['rw-', t('mRw')], ['r--', t('mR')], ['---', t('mNone')]],
        visible: function (p) { return L.hasMask(L.SCENES[p.scene] ? L.SCENES[p.scene].acl : []); } }
    ],

    presets: [
      { id: 'projekt-other', label: t('pProjekt'), params: { scene: 'projekt', who: 'student', want: 'r' } },
      { id: 'owner-locked', label: t('pOwner'), params: { scene: 'plan', who: 'student', want: 'r' } },
      { id: 'named-user', label: t('pNamed'), params: { scene: 'proba', who: 'nobody', want: 'w', mask: 'rw-' } },
      { id: 'mask-clips', label: t('pMask'), params: { scene: 'druga', who: 'marko', want: 'x', mask: 'rw-' } },
      { id: 'root', label: t('pRoot'), params: { scene: 'tajna', who: 'root', want: 'r' } }
    ],

    legend: [
      { shape: 'rt-no', label: t('legNo') },
      { shape: 'rt-hit', label: t('legHit') },
      { shape: 'rt-win', label: t('legWin') },
      { shape: 'rt-skip', label: t('legSkip') },
      { shape: 'ad-cut', label: t('legCut') },
      { shape: 'rt-verdict', label: t('legVerdict') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
