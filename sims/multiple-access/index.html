<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var SPAN_MS = 2 * L.FRAME_MS;   // the plane shows two frames
  var SERIES = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];   // user colours, by id
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian; at most d decimals, trailing zeros dropped.
  function num(x, d) {
    var s = String(Number(x.toFixed(d == null ? 1 : d)));
    s = s.replace('-', '−');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function signed(x) { return x > 0 ? '+' + num(x) : num(x); }
  function pct(share) { return t('pct', { v: num(share * 100) }); }
  function codeStr(code) { return code.map(function (x) { return x > 0 ? '+' : '−'; }).join(' '); }
  function ids(list) { return list.join(', '); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

  // ── the "changed" marks: what moved since the last hand change (a preset load marks nothing) ──
  var lastKey = null, lastState = null, marks = { users: [], chips: [] };
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key === lastKey) return;
    marks = c.preset ? { users: [], chips: [] } : L.changed(lastState, c.state);
    lastKey = key;
    lastState = c.state;
  }
  function moved(id) { return marks.users.indexOf(id) >= 0; }

  // ── the plane: time across (two frames), frequency up ──
  function drawPlane(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), k = st.scheme, B = st.bandKHz;
    var x0 = 4.2 * r, y0 = (k === 'tdma' ? 2.8 : 1.9) * r, pw = W - x0 - 0.6 * r, ph = H - y0 - 2.6 * r;
    var X = function (ms) { return x0 + ms / SPAN_MS * pw; };
    var Y = function (f) { return y0 + ph - f / B * ph; };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('defs', null, s('pattern', { id: 'ma-hatch', width: 10, height: 10, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' },
      s('rect', { class: 'ma-hatch-bg', width: 10, height: 10 }), s('line', { class: 'ma-hatch-line', x1: 0, y1: 0, x2: 0, y2: 10 }))));
    svg.append(s('rect', { class: 'ma-box', x: x0, y: y0, width: pw, height: ph }));
    // axes: frequency ticks at quarters of the band, time every 20 ms
    var fstep = B > 50 ? 25 : 2.5;
    for (var q = 0; q <= B / fstep; q++) (function (f) {
      var y = Y(f);
      svg.append(s('line', { class: 'ma-tick', x1: x0 - 0.3 * r, x2: x0, y1: y, y2: y }));
      svg.append(s('text', { x: x0 - 0.45 * r, y: y + 0.3 * r, 'text-anchor': 'end' }, num(f)));
    })(q * fstep);
    svg.append(s('text', { x: x0 - 0.45 * r, y: y0 - (k === 'tdma' ? 1.5 : 0.9) * r, 'text-anchor': 'end' }, t('axisF')));
    for (var ms = 0; ms <= SPAN_MS; ms += 20) {
      svg.append(s('line', { class: 'ma-tick', x1: X(ms), x2: X(ms), y1: y0 + ph, y2: y0 + ph + 0.3 * r }));
      svg.append(s('text', { x: X(ms), y: y0 + ph + 1.2 * r, 'text-anchor': 'middle' }, num(ms)));
    }
    svg.append(s('text', { x: x0 + pw, y: y0 + ph + 2.3 * r, 'text-anchor': 'end' }, t('axisT')));

    var chg = [];
    function label(x, y, n, sub, on, anchor) {
      var g = s('g', null);
      g.append(s('text', { class: 'ma-num' + (on ? '' : ' ma-ink'), x: x, y: y, 'text-anchor': anchor || 'start' }, String(n)));
      if (sub) g.append(s('text', { class: on ? 'ma-sub' : 'ma-ink', x: x + (anchor === 'middle' ? 0 : 1.4 * r), y: anchor === 'middle' ? y + 1.2 * r : y - 0.1 * r, 'text-anchor': anchor || 'start' }, sub));
      svg.append(g);
    }

    if (k === 'fdma') {
      st.fdma.guards.forEach(function (g) {
        svg.append(s('rect', { class: 'ma-guard', x: x0, y: Y(g.hiKHz), width: pw, height: Y(g.loKHz) - Y(g.hiKHz) }));
      });
      st.fdma.channels.forEach(function (c) {
        var y = Y(c.hiKHz), hh = Y(c.loKHz) - y;
        svg.append(s('rect', { class: c.active ? 'ma-on' : 'ma-idle', 'data-c': c.user, x: x0, y: y, width: pw, height: hh }));
        var sub = num(c.widthKHz) + ' kHz' + (c.active ? '' : ' · ' + t('quiet'));
        var ty = y + hh / 2 + 0.45 * r;
        label(x0 + 0.8 * r, ty, c.user, sub, c.active);
        label(X(SPAN_MS / 2) + 0.8 * r, ty, c.user, null, c.active);
        if (moved(c.user)) chg.push([x0, y, pw, hh]);
      });
    } else if (k === 'tdma') {
      // the shared clock: one tick at every slot start, in both frames
      var cy = y0 - 0.5 * r;
      svg.append(s('line', { class: 'ma-clock', x1: x0, x2: x0 + pw, y1: cy, y2: cy }));
      svg.append(s('text', { class: 'ma-ink', x: x0 + 0.4 * r, y: y0 - 1.5 * r }, '⏱ ' + t('clock')));
      [0, 1].forEach(function (f) {
        var off = f * L.FRAME_MS;
        if (f) svg.append(s('line', { class: 'ma-frame', x1: X(off), x2: X(off), y1: y0 - 1.1 * r, y2: y0 + ph }));
        svg.append(s('text', { class: 'ma-ink', x: X(off + L.FRAME_MS / 2), y: y0 - 1.5 * r, 'text-anchor': 'middle' }, t('frame', { k: f + 1 })));
        st.tdma.guards.forEach(function (g) {
          svg.append(s('rect', { class: 'ma-guard', x: X(off + g.startMs), y: y0, width: X(g.endMs) - X(g.startMs), height: ph }));
        });
        st.tdma.slots.forEach(function (x) {
          var xa = X(off + x.startMs), w = X(x.endMs) - X(x.startMs);
          svg.append(s('path', { class: 'ma-clock-tick', d: 'M' + (xa - 0.35 * r) + ' ' + (cy - 0.45 * r) + 'h' + 0.7 * r + 'l' + (-0.35 * r) + ' ' + 0.55 * r + 'z' }));
          svg.append(s('rect', { class: x.active ? 'ma-on' : 'ma-idle', 'data-c': x.user, x: xa, y: y0, width: w, height: ph }));
          label(xa + w / 2, y0 + ph / 2, x.user, num(x.lenMs) + ' ms', x.active, 'middle');
          if (!x.active) svg.append(s('text', { class: 'ma-ink', x: xa + w / 2, y: y0 + ph / 2 + 2.4 * r, 'text-anchor': 'middle' }, t('quiet')));
          if (moved(x.user)) chg.push([xa, y0, w, ph]);
        });
      });
    } else {
      // CDMA: every active user is a translucent layer over the whole plane, stacked up and to the right
      var act = st.cdma.rows.filter(function (u) { return u.d !== 0; }), m = act.length, d = 1.6 * r;
      act.forEach(function (u, i) {
        var x = x0 + i * d, y = y0 + (m - 1 - i) * d, w = pw - (m - 1) * d, hh = ph - (m - 1) * d;
        var coll = st.cdma.collided.indexOf(u.id) >= 0;
        svg.append(s('rect', { class: 'ma-layer' + (coll ? ' ma-coll' : ''), 'data-c': u.id, x: x, y: y, width: w, height: hh }));
        svg.append(s('rect', { class: 'ma-tag', 'data-c': u.id, x: x + w - 1.9 * r, y: y + 0.2 * r, width: 1.6 * r, height: 1.25 * r, rx: 3 }));
        svg.append(s('text', { class: 'ma-num', x: x + w - 1.1 * r, y: y + 1.2 * r, 'text-anchor': 'middle' }, String(u.id) + (coll ? '✕' : '')));
        if (moved(u.id)) chg.push([x, y, w, hh]);
      });
      svg.append(s('text', { class: 'ma-ink', x: x0 + pw / 2, y: y0 + ph / 2 + 0.6 * r, 'text-anchor': 'middle' }, t('layers')));
    }
    chg.forEach(function (b) {
      svg.append(s('rect', { class: 'ma-chg', x: b[0] + 3, y: b[1] + 3, width: Math.max(0, b[2] - 6), height: Math.max(0, b[3] - 6) }));
      svg.append(s('rect', { class: 'ma-chg-in', x: b[0] + 6, y: b[1] + 6, width: Math.max(0, b[2] - 12), height: Math.max(0, b[3] - 12) }));
    });
    box.replaceChildren(svg);
  }

  // ── counters and the share bar ──
  function counters(st) {
    var x = st[st.scheme];
    function cnt(k, v, bad) { return h('div', { class: 'ma-cnt' }, h('span', { class: 'ma-cnt-k' }, t(k)), h('span', { class: 'ma-cnt-v' + (bad ? ' ma-bad' : ''), translate: 'no' }, v)); }
    var per = st.scheme === 'cdma' ? t('perUserCdma', { bw: num(x.perUser.bandwidthKHz) })
      : t('perUserV', { bw: num(x.perUser.bandwidthKHz), ts: num(x.perUser.timeShare * 100) });
    var segs = [];
    if (st.scheme === 'fdma' || st.scheme === 'tdma') {
      var share = x.perUser.share;
      var list = st.scheme === 'fdma' ? x.channels : x.slots;
      list.forEach(function (c, i) {
        segs.push(h('div', { class: 'ma-seg ' + (c.active ? 'ma-seg-on' : 'ma-seg-idle'), dataset: { c: String(c.user) }, style: { width: share * 100 + '%' } }));
        if (x.guardShare > 0 && (st.scheme === 'tdma' || i < list.length - 1))
          segs.push(h('div', { class: 'ma-seg sd-hatch', style: { width: x.guardShare / (st.scheme === 'tdma' ? list.length : list.length - 1) * 100 + '%' } }));
      });
    } else {
      // one full bar in diagonal stripes of every sender's colour: in CDMA each user has the whole plane
      var act = st.cdma.rows.filter(function (u) { return u.d !== 0; });
      if (act.length) segs.push(h('div', { class: 'ma-seg', style: { width: '100%', backgroundImage: 'repeating-linear-gradient(135deg, ' +
        act.map(function (u, i) { return SERIES[u.id - 1] + ' ' + i * 0.6 + 'rem ' + (i + 1) * 0.6 + 'rem'; }).join(', ') + ')' } }));
    }
    return h('div', { class: 'ma-count' },
      cnt('cntServed', t('cntServedV', { s: x.served, n: st.n }), x.refused.length > 0),
      cnt('cntLeft', String(x.capacityLeft), st.scheme === 'cdma' && x.overflow),
      st.scheme === 'cdma' && x.collided.length ? cnt('cntCollided', ids(x.collided), true) : null,
      cnt('cntUnused', pct(x.idleShare), x.idleShare > 0),
      x.guardShare > 0 ? cnt('cntGuard', pct(x.guardShare)) : null,
      cnt('cntPerUser', per),
      h('div', { class: 'ma-bar', 'aria-hidden': 'true' }, segs));
  }

  // ── FDMA / TDMA: who holds which channel or slot ──
  function table(st) {
    var k = st.scheme, x = st[k];
    var list = k === 'fdma' ? x.channels : x.slots;
    var rows = st.users.map(function (u) {
      var c = list[u.id - 1];
      var refused = !c;
      var range = refused ? '–' : k === 'fdma' ? num(c.loKHz, 2) + '–' + num(c.hiKHz, 2) + ' kHz' : num(c.startMs, 2) + '–' + num(c.endMs, 2) + ' ms';
      return h('tr', { class: refused ? 'ma-refused' : moved(u.id) ? 'sd-changed' : null },
        h('td', null, h('span', { class: 'ma-u' + (u.active && !refused ? '' : ' ma-u-idle'), dataset: { c: String(u.id) }, translate: 'no' }, String(u.id))),
        h('td', { class: 'ma-mono', translate: 'no' }, refused ? '–' : String(c.index + 1)),
        h('td', { class: 'ma-mono', translate: 'no' }, range),
        h('td', { class: 'ma-st' }, t(refused ? 'stRefused' : u.active ? 'stSend' : 'stIdle')));
    });
    return [h('h3', { class: 'ma-h' }, t(k === 'fdma' ? 'tableFdma' : 'tableTdma')),
      h('table', { class: 'ma-tab' },
        h('thead', null, h('tr', null, h('th', null, t('colUser')), h('th', null, t(k === 'fdma' ? 'colChannel' : 'colSlot')), h('th', null, ''), h('th', null, t('colState')))),
        h('tbody', null, rows))];
  }

  // ── CDMA: each user's bit × code, the sum on the air, each receiver's products and result (K3 block grid) ──
  function chips(st) {
    var C = st.cdma, chip = function (v) { return v > 0 ? '+' + v : num(v); };
    var rows = C.rows.map(function (u) {
      var user = st.users[u.id - 1];
      var btn = h('button', {
        type: 'button', class: 'ma-flip' + (u.d ? '' : ' ma-u-idle'), dataset: { c: String(u.id) },
        title: t('flipHint', { k: u.id }), 'aria-label': t('flipHint', { k: u.id }),
        onclick: function () { sim.set({ bits: L.flipBit(st.bits, u.id) }); }
      }, u.d ? t('rowUser', { k: u.id, b: user.bit }) : t('rowUserIdle', { k: u.id }));
      return { id: 'u' + u.id, label: btn, aside: h('span', null, t('codeAside') + ' ', h('span', { class: 'ma-code', translate: 'no' }, codeStr(L.CODES[u.code]))),
        cells: u.chips.map(function (v) { return u.d ? { text: chip(v), kind: 'fill', c: u.id, now: moved(u.id) } : { text: '0', dim: true }; }) };
    });
    rows.push({ id: 'air', label: h('span', null, t('airRow')),
      cells: C.sumChips.map(function (v, i) { return { text: chip(v), now: marks.chips.indexOf(i) >= 0 }; }) });
    C.decoded.forEach(function (d, j) {
      var res = d.collision ? t('rxCollision', { corr: signed(d.corr) }) : d.bit === null ? t('rxNobody') : t('rxBit', { corr: signed(d.corr), bit: d.bit });
      rows.push({ id: 'r' + j, label: h('span', null, t('rxRow', { j: j + 1 })),
        aside: h('span', { class: 'ma-rx' + (d.collision ? ' ma-rx-bad' : '') }, res),
        cells: d.products.map(function (v) {
          return d.collision ? { text: chip(v), kind: 'bad' } : d.senders.length ? { text: chip(v), kind: 'soft', c: d.senders[0] } : { text: chip(v), dim: true };
        }) });
    });
    return Simdeck.blockGrid({ title: t('chipsTitle'), rows: rows, cellHeight: '2.3rem' });
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'scheme', type: 'choice', label: t('scheme'), options: [['fdma', t('nameFdma')], ['tdma', t('nameTdma')], ['cdma', t('nameCdma')]] },
      { key: 'users', type: 'range', label: t('users'), min: 1, max: L.MAX_USERS, step: 1 },
      { key: 'idle', type: 'select', label: t('idle'),
        options: [[0, t('idleNone')]].concat([1, 2, 3, 4, 5].map(function (k) { return [k, t('idleUser', { k: k })]; })) },
      { key: 'guard', type: 'toggle', label: t('guard') },
      { key: 'band', type: 'choice', label: t('band'), options: [[100, t('band100')], [12.5, t('band12')]] },
      // the users' bits stay a param (URL, presets); the CDMA panel flips them by clicking a user's label
      { key: 'bits', type: 'range', label: t('bits'), min: 0, max: 31, step: 1, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendUser') },
      { shape: 'ma-guard', label: t('legendGuard') },
      { shape: 'hollow', label: t('legendIdle') },
      { shape: 'bg-bad', label: t('legendCollision') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: function (c) {
      var st = c.state;
      track(c);
      var plane = h('div', { class: 'ma-plane' });
      var side = h('div', { class: 'ma-side' }, st.scheme === 'cdma' ? chips(st) : table(st));
      var root = h('div', { class: 'ma', dataset: { scheme: st.scheme } }, plane, counters(st), side);
      c.stage.replaceChildren(root);
      drawPlane(plane, st);
    },

    caption: function (c) {
      var st = c.state, k = st.scheme, x = st[k];
      if (k === 'fdma') {
        if (x.refused.length) return t.n('capFdmaRefused', x.refused.length, { ids: ids(x.refused), w: num(x.wouldBeKHz, 2), b: num(st.bandKHz), cap: x.capacity });
        if (x.idleShare > 0) return t('capFdmaIdle', { k: st.idle, w: num(x.perUser.bandwidthKHz), pct: pct(x.idleShare) });
        if (x.served > 1 && !st.guard) return t('capFdmaNoGuard', { n: x.served, w: num(x.perUser.bandwidthKHz) });
        return t.n('capFdma', x.served, { w: num(x.perUser.bandwidthKHz) });
      }
      if (k === 'tdma') {
        if (x.refused.length) return t.n('capTdmaRefused', x.refused.length, { ids: ids(x.refused), cap: x.capacity, slots: t.n('slotWord', x.capacity) });
        if (x.idleShare > 0) return t('capTdmaIdle', { k: st.idle, len: num(x.slots[0].lenMs), pct: pct(x.idleShare) });
        if (x.served === 1) return t('capTdma1', { b: num(st.bandKHz), len: num(x.slots[0].lenMs) });
        return t('capTdma', { b: num(st.bandKHz), len: num(x.slots[0].lenMs) });
      }
      var air = x.sumChips.map(function (v) { return num(v); }).join(', ');
      if (x.collided.length) return t('capCdmaCollision', { k: ids(x.reused), air: air, corr: signed(x.decoded[0].corr) });
      var senders = x.rows.filter(function (u) { return u.d !== 0; }), m = senders.length, tail = '';
      if (st.idle && x.reused.length) {
        // the silent user shares code 1: the other holder now has it to itself
        var other = x.decoded[0].holders.filter(function (id) { return id !== st.idle; });
        tail = st.idle === 1 || x.reused.indexOf(st.idle) >= 0 ? t('capCdmaIdleShared', { k: st.idle, o: other[0] }) : t('capCdmaIdle', { k: st.idle });
      } else if (st.idle) tail = t('capCdmaIdle', { k: st.idle });
      if (m === 0) return t('capCdma0', { air: air });
      if (m === 1) return t('capCdma1', { k: senders[0].id, air: air }) + tail;
      if (st.n === 2 && m === 2) return t('capCdma2', { air: air, r1: signed(x.decoded[0].corr), r2: signed(x.decoded[1].corr) });
      return t('capCdma', { m: m, air: air }) + tail;
    }
  });

  // The plane is drawn in pixels (text at 1:1), so it is redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var lastSize = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== lastSize) { lastSize = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
