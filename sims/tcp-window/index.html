<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Klizni prozor: veličina prozora i brzina</h1>
      <p class="sd-subtitle"></p>
    </div>

    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">

      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var SEG = L.seg, FIRST = L.first;
  function data(text) { return h('b', { translate: 'no' }, String(text)); }
  function range(a, b) { return a + '–' + b; }
  // octets/ms as a whole number, Mbit/s to one decimal, with the decimal comma on Croatian pages
  function num(x, places) {
    var v = String(Math.round(x * Math.pow(10, places)) / Math.pow(10, places));
    return /^hr/i.test(document.documentElement.lang) ? v.replace('.', ',') : v;
  }
  function rateVars(r) { return { rate: num(r, 0), mbit: num(r * 8 / 1000, 1) }; }
  function rateNow(s) { return s.ms ? s.sent * SEG / s.ms : 0; }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { win: 1000, rtt: 4 } },
    { id: 'full', label: t('presetFull'), hint: t('presetFullHint'), params: { win: 2000, rtt: 4 } },
    { id: 'far', label: t('presetFar'), hint: t('presetFarHint'), params: { win: 2000, rtt: 8 } },
    { id: 'big', label: t('presetBig'), hint: t('presetBigHint'), params: { win: 4000, rtt: 4 } }
  ];

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'win', type: 'choice', label: t('win'), hint: t('winHint'),
        options: L.windows.map(function (w) { return [w, String(w)]; }) },
      { key: 'rtt', type: 'choice', label: t('rtt'), hint: t('rttHint'),
        options: L.rtts.map(function (r) { return [r, String(r)]; }) }
    ],

    presets: presets,

    legend: [
      { c: 1, label: t('legendBusy') },
      { shape: 'cross', label: t('legendIdle') },
      { c: 3, shape: 'round', label: t('legendAck') },
      { shape: 'hollow', label: t('legendEmpty') }
    ],

    render: function (c) {
      var s = c.state, p = c.params, fwd = c.dir === 'forward' && !c.first;
      var lim = L.limit(p.win, p.rtt);

      // the path, folded: the first half of the round trip goes right (segments), the second half comes back left
      // (acknowledgments); a segment k ms on its way sits in slot k
      var half = p.rtt / 2;
      function slot(j) {
        var f = null;
        s.flight.forEach(function (x) { if (s.ms - x.ms + 1 === j) f = x; });
        if (!f) return h('div', { class: 'tw-slot tw-empty' }, h('span', { class: 'tw-ms' }, t('slotMs', { k: j })));
        var back = j > half;
        return h('div', {
          class: 'tw-slot sd-soft' + (back ? ' tw-back' : ' sd-hatch') + (fwd && j === 1 && s.sentNow ? ' sd-changed' : ''),
          dataset: { c: back ? '3' : '1' }
        }, h('span', { translate: 'no' }, (back ? '✓' : '') + '#' + f.k));
      }
      var goRow = [], backRow = [];
      for (var j = 1; j <= half; j++) goRow.push(slot(j));
      for (j = p.rtt; j > half; j--) backRow.push(slot(j));
      var path = h('div', { class: 'tw-path' },
        h('div', { class: 'tw-actor' }, t('sender')),
        h('div', { class: 'tw-pipe' },
          h('div', { class: 'tw-pipe-label' }, t('pathLabel', { rtt: p.rtt, pipe: lim.pipe })),
          h('div', { class: 'tw-dir' }, t('goes')),
          h('div', { class: 'tw-slots', style: { '--slots': String(half) } }, goRow),
          h('div', { class: 'tw-slots', style: { '--slots': String(half) } }, backRow),
          h('div', { class: 'tw-dir' }, t('returns'))),
        h('div', { class: 'tw-actor' }, t('receiver')));

      // the timeline: 16 ms
      var cells = [h('div', { class: 'tw-rowlabel' }, t('msAxis'))];
      for (var i = 1; i <= L.steps; i++) cells.push(h('div', { class: 'tw-tick' + (i === s.ms ? ' tw-now' : ''), translate: 'no' }, h('span', null, String(i))));
      cells.push(h('div', { class: 'tw-rowlabel' }, t('rowSend')));
      for (i = 1; i <= L.steps; i++) {
        var e = s.timeline[i - 1], now = fwd && i === s.ms;
        if (!e) cells.push(h('div', { class: 'tw-cell tw-future' }));
        else if (e.k) cells.push(h('div', { class: 'tw-cell sd-fill' + (now ? ' sd-changed sd-anim-in' : ''), dataset: { c: '1' }, translate: 'no' }, h('span', null, String(e.k))));
        else cells.push(h('div', { class: 'tw-cell tw-idle' + (now ? ' sd-changed sd-anim-in' : ''), 'aria-hidden': 'true' }, h('span', null, '–')));
      }
      cells.push(h('div', { class: 'tw-rowlabel' }, t('rowAck')));
      for (i = 1; i <= L.steps; i++) {
        var a = s.timeline[i - 1];
        if (a && a.acks) cells.push(h('div', { class: 'tw-cell tw-ack sd-soft', dataset: { c: '3' }, translate: 'no' }, h('span', null, '✓')));
        else cells.push(h('div', { class: 'tw-cell tw-noack' }));
      }

      var full = s.inFlight === p.win;
      var rate = rateNow(s);
      var facts = h('div', { class: 'tw-facts' },
        h('div', { class: 'tw-box' }, h('small', null, t('factPipe')), data(lim.pipe), h('small', null, t('factPipeNote'))),
        h('div', { class: 'tw-box' + (full ? ' tw-full' : '') }, h('small', null, t('factFlight')), data(s.inFlight + ' / ' + p.win)),
        h('div', { class: 'tw-box' }, h('small', null, t('factBusy')), h('b', null, t('factBusyValue', { busy: s.busy, ms: s.ms }))),
        h('div', { class: 'tw-box' }, h('small', null, t('factRate')), h('b', null, t('rateValue', rateVars(rate)))),
        h('div', { class: 'tw-box' }, h('small', null, t('factLimit')),
          h('b', null, t('rateValue', rateVars(lim.rate))),
          h('small', null, t(lim.by === 'window' ? 'limitWindow' : lim.by === 'link' ? 'limitLink' : 'limitBoth'))));

      c.stage.replaceChildren(h('div', { class: 'tw' }, path, h('div', { class: 'tw-time' }, cells), facts));
    },

    caption: function (c) {
      var s = c.state, p = c.params;
      if (s.ms === 0) return t.parts('captionStart', { last: data(FIRST - 1), rtt: data(p.rtt), win: data(p.win) });
      var out = [];
      if (s.acked.length) out = out.concat(t.parts('captionAcks', { ack: data(s.ack), left: data(s.ack), right: data(s.right) }), [' ']);
      if (s.sentNow) {
        out = out.concat(t.parts(s.inFlight === p.win ? 'captionSendFull' : 'captionSend', {
          ms: data(s.ms), k: data(s.sentNow.k), range: data(range(s.sentNow.seq, s.sentNow.seq + SEG - 1)),
          flight: data(s.inFlight), win: data(p.win) }));
      } else {
        out = out.concat(t.parts('captionIdle', { ms: data(s.ms), win: data(p.win) }));
      }
      if (s.ms === L.steps) {
        var lim = L.limit(p.win, p.rtt);
        var key = lim.by === 'window' ? 'captionEndWindow' : lim.by === 'link' ? 'captionEndLink' : 'captionEndBoth';
        out = out.concat([' '], t.parts(key, { ms: data(s.ms), busy: data(s.busy), rate: data(num(rateNow(s), 0)), win: data(p.win), rtt: data(p.rtt) }));
      }
      return out;
    }
  });
})();
</script>
</body>
</html>
