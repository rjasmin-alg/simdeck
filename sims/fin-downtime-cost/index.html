<!-- fin-downtime-cost: the cost of downtime is lost revenue + idle staff + recovery work + penalties, and it varies
     with the hour and the day; each extra nine removes a tenth as much downtime as the one before and costs more
     redundancy. The stage: what an hour down costs across the week (stacked by component, the average hour dashed),
     then one row per availability level with its expected yearly downtime cost, the redundancy's cost, the total and
     what its nine saves against what it costs; the target row is outlined (click a row to choose it).
     Sums: downtime.js (promotable); model: sim.js; rules: SPEC.md; words: strings.js. -->

    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>

    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>

        <summary></summary>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var PARTS = ['rev', 'staff', 'fix', 'pen'];

  // ── numbers in the page's language ──

  /** A whole number with thousands grouped (30 000 / 30,000). */
  function group(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, Simdeck.lang === 'hr' ? ' ' : ',');
  }
  /** Whole euros, sign dropped (the model rounds; the average hour is rounded here). */
  function money(x) { return t('eur', { n: group(Math.abs(Math.round(x))) }); }
  function perHour(x) { return t('perHour', { v: money(x) }); }
  function pct(n) { return t('pct', { n: String(n) }); }
  function lvl(n) { return t('lvl' + n); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }

  /** Seconds as hours and minutes (an hour or more) or minutes and seconds, rounded to the shown unit. */
  function dur(sec) {
    if (sec >= 3600) {
      var m = Math.round(sec / 60), hh = Math.floor(m / 60), mm = m % 60;
      return mm ? t('durHM', { h: hh, m: mm }) : t('durH', { h: hh });
    }
    var s = Math.round(sec), mi = Math.floor(s / 60), ss = s % 60;
    if (!mi) return t('durS', { s: ss });
    return ss ? t('durMS', { m: mi, s: ss }) : t('durM', { m: mi });
  }

  function noFocus(e) { e.preventDefault(); }   // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                           // the row to give focus back to after a render (keyboard)

  // ── the week ──

  var BANDS = [[8, 'off'], [10, 'work'], [6, 'off']];   // hours of the day: 00–08, 08–18, 18–24

  function stack(costs, top) {
    return PARTS.map(function (k) {
      var v = costs[k];
      return v > 0 ? h('div', { class: 'dt-seg', dataset: { k: k }, style: { height: (100 * v / top) + '%' } }) : null;
    });
  }

  function week(s) {
    var top = Math.max(s.top, 1);
    var avg = Math.round(s.avg);
    var days = [];
    for (var d = 1; d <= 7; d++) {
      days.push(h('div', { class: 'dt-day' }, BANDS.map(function (bd) {
        var kind = d <= 5 ? bd[1] : 'off';
        return h('div', { class: 'dt-band', style: { flex: bd[0] + ' 1 0' } }, stack(s.hour[kind], top));
      })));
    }
    var line = (100 * s.avg / top);
    days.push(h('div', { class: 'dt-avg', style: { bottom: line + '%' } },
      h('span', { class: 'dt-avgtag', dataset: line > 82 ? { low: '' } : {} }, t('avgTag', { a: perHour(avg) }))));
    return h('div', { class: 'dt-week' },
      h('p', { class: 'dt-head' }, t.parts('headWeek', { w: b(perHour(s.hour.work.sum)), o: b(perHour(s.hour.off.sum)) })),
      h('div', { class: 'dt-axis', 'aria-hidden': 'true' },
        h('span', { class: 'dt-tick', translate: 'no', style: { bottom: '0%' } }, money(0)),
        h('span', { class: 'dt-tick', translate: 'no', style: { bottom: '100%' } }, money(top))),
      h('div', { class: 'dt-plot', 'aria-hidden': 'true' }, days),
      h('div', { class: 'dt-days', 'aria-hidden': 'true' }, [1, 2, 3, 4, 5, 6, 7].map(function (i) { return h('span', null, t('d' + i)); })));
  }

  // ── the levels ──

  function levels(s, chg) {
    var top = Math.max.apply(null, s.levels.map(function (l) { return l.tot; }).concat(1));
    var rows = s.levels.map(function (l, i) {
      var on = l.n === s.p.target, isBest = l.n === s.best;
      var segs = PARTS.map(function (k) { return [k, l.parts[k]]; }).concat([['ha', l.ha]]).map(function (x) {
        return x[1] > 0 ? h('div', { class: 'dt-seg', dataset: { k: x[0] }, style: { width: (100 * x[1] / top) + '%' } }) : null;
      });
      var nine = i === 0 ? h('span', { class: 'dt-nine', dataset: { v: 'none' } }, t('noRedundancy'))
        : h('span', { class: 'dt-nine', dataset: { v: s.nines[i - 1].verdict } },
          t('nineCell', { v: money(s.nines[i - 1].value), c: money(s.nines[i - 1].cost) }));
      var label = t('levelLabel', { lvl: lvl(l.n), down: t('downYear', { d: dur(l.seconds) }), tot: money(l.tot) });
      var pick = function () { refocus = l.n; sim.set({ target: l.n }); };
      return h('div', {
        class: 'dt-row', role: 'button', tabindex: '0', 'aria-pressed': String(on), 'aria-label': label, title: label,
        dataset: { n: String(l.n) }, onmousedown: noFocus, onclick: function () { refocus = null; sim.set({ target: l.n }); },
        onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } }
      },
      h('span', null, h('span', { class: 'dt-lvl', translate: 'no' }, lvl(l.n)),
        h('span', { class: 'dt-down' }, t('downYear', { d: dur(l.seconds) }))),
      h('div', { class: 'dt-bar', 'aria-hidden': 'true' }, segs),
      h('span', { class: 'dt-tot' + (isBest && chg.indexOf('best') >= 0 ? ' sd-changed' : ''), translate: 'no', dataset: isBest ? { best: '' } : {} }, money(l.tot)),
      nine);
    });
    return h('div', { class: 'dt-levels' }, h('p', { class: 'dt-head' }, t('headLevels')), rows);
  }

  function result(s, chg) {
    var key = { base: 'resultBase', save: 'resultSave', loss: 'resultLoss', even: 'resultEven' }[s.outcome];
    return h('p', { class: 'dt-result' + (chg.indexOf('outcome') >= 0 ? ' sd-changed' : ''), dataset: { o: s.outcome } },
      t(key, { lvl: lvl(s.p.target), d: money(s.save) }));
  }

  function render(c) {
    track(c);
    var s = c.state;
    c.stage.replaceChildren(h('div', { class: 'dt' },
      week(s),
      levels(s, chg),
      result(s, chg),
      h('p', { class: 'dt-foot' }, t('foot', { w: money(L.WAGE), g: String(L.GROW) }), ' ', t('illustrative'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('.dt-row[data-n="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  // ── the changed mark follows param changes ──

  var lastKey = null, lastState = null, chg = [];
  function track(c) {
    var key = JSON.stringify(c.params);
    if (key !== lastKey) {
      chg = L.flipped(lastState, c.state);
      lastKey = key;
      lastState = c.state;
    }
  }

  function caption(c) {
    var s = c.state, x = s.target;
    var k = L.captionKey(s);
    var out = t.parts(k.key, {
      lvl: b(lvl(s.p.target)), down: b(dur(x.seconds)), dc: b(money(x.down)), ha: b(money(x.ha)), tot: b(money(x.tot)),
      base: b(money(s.base.tot)), d: b(money(s.save))
    });
    var bl = s.levels[L.LEVELS.indexOf(s.best)];
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, {
        lvl: b(lvl(key === 'nNaive' ? s.naive : s.best)), tot: b(money(bl.tot)),
        v: b(money(s.nines[0].value)), c: b(money(s.nines[0].cost)),
        w: b(perHour(s.hour.work.sum)), a: b(perHour(Math.round(s.avg)))
      }));
    });
    return out;
  }

  var labels = {
    'small-office': 'pSmallOffice', office: 'pOffice', shop: 'pShop', payments: 'pPayments', 'five-nines': 'pFiveNines'
  };
  var R = L.RANGES;
  function range(key, fmt) {
    return { key: key, type: 'range', label: t(key), min: R[key][0], max: R[key][1], step: R[key][2], format: fmt };
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      // the target is chosen on the stage (the level rows); this hidden param keeps it in the URL and checks it
      { key: 'target', type: 'choice', label: t('target'), options: L.LEVELS.map(function (n) { return [n, lvl(n)]; }),
        visible: function () { return false; } },
      range('rev', perHour),
      range('off', pct),
      range('people', function (v) { return t.n('nPeople', v); }),
      range('fix', perHour),
      range('pen', perHour),
      range('ha', function (v) { return t('perYear', { v: money(v) }); }),
      { type: 'button', label: t('best'), key: 'o', run: function (api) { api.set({ target: api.state.best }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'dt-rev', label: t('legRev') },
      { shape: 'dt-staff', label: t('legStaff') },
      { shape: 'dt-fix', label: t('legFix') },
      { shape: 'dt-pen', label: t('legPen') },
      { shape: 'dt-ha', label: t('legHa') },
      { shape: 'dt-avg', label: t('legAvg') },
      { shape: 'dt-best', label: t('legBest') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
