/* Phone and portrait: the stage grows with its content; road and result stack; cells in two columns. */

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var DEC = t('dec');
  var SEG = { data: 'segData', l34: 'segL34', l2: 'segL2', l1: 'segL1', share: 'segShare', retry: 'segRetry' };
  var CARS = 20;

  // ── numbers in the page's language (num: from sims/delay-components/index.html @ bf2e9b5) ──
  /** '1488095.5' → '1 488 095,5' (a no-break space between thousands from five digits up, the language's decimal mark). */
  function num(str) {
    var p = String(str).split('.');
    if (p[0].replace('-', '').length > 4) p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
    return p.length > 1 ? p[0] + DEC + p[1] : p[0];
  }
  function rateText(mb) { return mb >= 1000 ? t('gbps', { v: num(mb / 1000) }) : t('mbps', { v: num(mb) }); }
  /** A rate in bit/s in the given unit, 4 significant digits (cells, result) or one decimal (captions). */
  function val(bps, unit, short) {
    var v = L.inUnit(bps, unit);
    var s = short ? (v >= 10 ? v.toFixed(1) : L.sigText(v, 3)) : L.sigText(v, 4);   // captions: 94.9, 0.553
    return t(unit === 'MB/s' ? 'mBps' : 'mbps', { v: num(s) });
  }
  function pct(x) { return t('percent', { v: num(L.sigText(100 * x, 4)) }); }

  // the explanation: its terms that are missing from the glossary come in as written-out pairs (NOTES.md)
  document.querySelector('[data-nv-explain]').innerHTML = t.html('explain', {
    nb: t.html('termNominal'), oh: t.html('termOverhead'), hd: t.html('termHalf'), co: t.html('termCollision')
  });

  // ── "changed": the segments the last param change added, removed or resized (L.changed) ──
  var lastParams = null, lastState = null, lastPreset = null, ch = [];
  function same(a, b) { return !!a && Object.keys(L.defaults).every(function (k) { return a[k] === b[k]; }); }
  function track(c) {
    var loaded = !!c.preset && c.preset !== lastPreset;             // a preset load marks nothing, even with equal params
    if (!loaded && same(lastParams, c.params)) return;              // re-render (theme, resize, language): keep the marks
    ch = lastState && !loaded ? L.changed(lastState, c.state) : [];
    lastParams = Object.assign({}, c.params); lastState = c.state; lastPreset = c.preset;
  }

  // ── the road (URM ch06 figure): width = nominal bandwidth; solid cars carry useful data to the finish ──
  function road(st, p) {
    var useful = Math.round(CARS * st.achievedBps / (p.rate * 1e6));
    var lanes = [h('div', { class: 'nv-lane' }), h('div', { class: 'nv-lane' })];
    for (var i = 0; i < CARS; i++) {
      // car i (0 = nearest the finish) goes to lane i % 2; the useful ones lead
      lanes[i % 2].insertBefore(h('span', { class: 'nv-car' + (i < useful ? ' nv-useful' : ''), 'aria-hidden': 'true' }), lanes[i % 2].firstChild);
    }
    return h('div', { class: 'nv-roadwrap' },
      h('div', { class: 'nv-h' }, t('roadTitle'), ': ', h('span', { class: 'nv-mono' }, rateText(p.rate))),
      h('div', { class: 'nv-road' }, h('div', { class: 'nv-lanes' }, lanes), h('div', { class: 'nv-finish' })),
      h('div', { class: 'nv-roadfoot' }, h('span', null, t.n('roadCars', useful)), h('span', null, t('roadFinish') + ' ▸')));
  }

  function result(st, p) {
    var other = p.unit === 'MB/s' ? 'Mb/s' : 'MB/s';
    return h('div', { class: 'nv-res' + (ch.indexOf('data') >= 0 ? ' sd-changed' : '') },
      h('div', { class: 'nv-sub' }, t('resTitle')),
      h('div', { class: 'nv-big' }, val(st.achievedBps, p.unit)),
      h('div', { class: 'nv-line' }, t('resOther', { v: val(st.achievedBps, other) })),
      h('div', { class: 'nv-line' }, t('resFps', { v: num(String(Math.round(st.fps))) })),
      h('div', { class: 'nv-sub' }, t('resEff', { v: num(L.sigText(100 * st.efficiency, 4)) })));
  }

  // ── the bar: nominal bandwidth cut to scale ──
  function bar(st, p, barPx, rem) {
    var R = p.rate * 1e6;
    var data = st.segments[0].bits / R;
    var segs = st.segments.filter(function (x) { return x.bits > 0; }).map(function (x) {
      var share = x.bits / R;
      return h('div', { class: 'nv-seg' + (ch.indexOf(x.kind) >= 0 ? ' nv-ch' : ''), dataset: { k: x.kind },
        style: { flex: '0 0 ' + (100 * share) + '%' }, title: t(SEG[x.kind]) + ': ' + val(x.bits, p.unit) },
        share * barPx >= 6.5 * rem ? h('span', null, pct(share)) : null);
    });
    // the achieved bracket: under the data segment; its label leaves the bracket when the segment is narrow
    var underW = Math.max(data, 0.0001);
    return h('div', { class: 'nv-barblock' },
      h('div', { class: 'nv-bracket' }, h('span', { style: { left: '0', right: '0' } }, h('b', null, t('barNominal', { v: rateText(p.rate) })))),
      h('div', { class: 'nv-bar' }, segs),
      h('div', { class: 'nv-bracket nv-under' }, h('span', { style: { left: '0', width: (100 * underW) + '%' } },
        h('b', { style: data * barPx < 18 * rem ? { position: 'absolute', left: '100%' } : null }, t('barAchieved', { v: val(st.achievedBps, p.unit) })))),
      h('div', { class: 'nv-cells' }, st.segments.map(function (x) {
        return h('div', { class: 'nv-cell' + (ch.indexOf(x.kind) >= 0 ? ' sd-changed' : '') + (x.bits > 0 ? '' : ' nv-zero') },
          h('div', { class: 'nv-cell-h' }, h('span', { class: 'nv-sw', dataset: { k: x.kind } }), h('span', null, t(SEG[x.kind]))),
          h('div', { class: 'nv-val' }, val(x.bits, p.unit)),
          h('div', { class: 'nv-sub' }, pct(x.bits / R)));
      })));
  }

  // ── one frame to scale, with its fields' byte counts ──
  function frame(st) {
    return h('div', { class: 'nv-frame' },
      h('div', { class: 'nv-h' }, t('frameTitle', { w: num(st.wireBytes), d: num(st.dataBytes) })),
      h('div', { class: 'nv-strip' }, st.fields.map(function (f) {
        return h('div', { class: 'nv-fld', dataset: { k: f.kind }, style: { flex: '0 0 ' + (100 * f.bytes / st.wireBytes) + '%' },
          title: t('f_' + f.field) + ': ' + t('bytes', { v: num(f.bytes) }) });
      })),
      h('div', { class: 'nv-chips' }, st.fields.map(function (f) {
        return h('span', { class: 'nv-chip' }, h('span', { class: 'nv-sw', dataset: { k: f.kind } }), t('f_' + f.field), ' ', h('b', null, t('bytes', { v: num(f.bytes) })));
      })));
  }

  // ── captions (L.captionKey picks the sentence) ──
  function caption(c) {
    var p = c.params, st = c.state;
    var key = L.captionKey(p, st);
    var v = val(st.achievedBps, 'Mb/s', true), r = rateText(p.rate);
    var out;
    if (key === 'capShared' || key === 'capDuplex') {
      out = t.parts(key, { n: st.share, v: v, r: r });
      if (p.loss > 0) out = out.concat(' ', t.parts('capLossToo', { p: p.loss }));
    } else if (key === 'capLoss') {
      out = t.parts(key, { p: p.loss, g: val(st.goodputBps, 'Mb/s', true), v: v, r: r });
    } else {
      var off = [];
      if (!p.l1) off.push(t('offL1'));
      if (!p.l2) off.push(t('offL2'));
      if (!p.l34) off.push(t('offL34'));
      var list = off.length > 1 ? off.slice(0, -1).join(', ') + t('offAnd') + off[off.length - 1] : off[0];
      out = t.parts(key, { off: list, wire: num(st.wireBytes), data: num(st.dataBytes), v: v, r: r });
    }
    if (p.unit === 'MB/s') out = out.concat(' ', t.parts('capBytes', { mb: v, MB: val(st.achievedBps, 'MB/s', true) }));
    return out;
  }

  var view = null, lastCtx = null;
  function draw(c) {
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
    var probe = view.bar.querySelector('.nv-bar');
    var barPx = probe && probe.clientWidth > 0 ? probe.clientWidth : Math.max(200, c.stage.clientWidth - 2 * rem);
    view.top.replaceChildren(road(c.state, c.params), result(c.state, c.params));
    view.bar.replaceChildren(bar(c.state, c.params, barPx, rem));
    view.frame.replaceChildren(frame(c.state));
  }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'rate', type: 'choice', label: t('rate'), options: L.RATES.map(function (v) { return [v, rateText(v)]; }) },
      { key: 'packet', type: 'range', label: t('packet'), min: 46, max: 1500, step: 2, format: function (v) { return t('bytes', { v: num(v) }); } },
      { key: 'unit', type: 'choice', label: t('unit'), options: [['Mb/s', t('unitMb')], ['MB/s', t('unitMB')]] },
      { key: 'l34', type: 'toggle', label: t('l34') },
      { key: 'l2', type: 'toggle', label: t('l2') },
      { key: 'l1', type: 'toggle', label: t('l1') },
      { key: 'duplex', type: 'choice', label: t('duplex'), options: L.DUPLEX.map(function (d) { return [d, t(d)]; }) },
      { key: 'stations', type: 'range', label: t('stations'), min: function (p) { return p.duplex === 'half-both' ? 2 : 1; }, max: 8, step: 1,
        disabled: function (p) { return p.duplex === 'full' ? t('stationsOff') : false; } },
      { key: 'loss', type: 'range', label: t('loss'), min: 0, max: 30, step: 1, format: function (v) { return t('percent', { v: v }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('hint_' + x.id), params: x.params }; }),
    legend: [
      { shape: 'nv-data', label: t('legData') },
      { shape: 'nv-l34', label: t('legL34') },
      { shape: 'nv-l2', label: t('legL2') },
      { shape: 'nv-l1', label: t('legL1') },
      { shape: 'nv-share', label: t('legShare') },
      { shape: 'nv-retry', label: t('legRetry') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: function (c) {
      if (!view) {
        view = { top: h('div', { class: 'nv-top' }), bar: h('div'), frame: h('div') };
        c.stage.replaceChildren(h('div', { class: 'nv' }, view.top, view.bar, view.frame));
        var w = 0;
        new ResizeObserver(function () {
          var nw = c.stage.clientWidth;
          if (lastCtx && nw !== w) { w = nw; draw(lastCtx); }
        }).observe(c.stage);
      }
      track(c);
      lastCtx = c;
      draw(c);
    },
    caption: caption
  });
})();
</script>
</body>
</html>
