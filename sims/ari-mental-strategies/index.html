[data-sim="ari-mental-strategies"] .ms-num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
[data-sim="ari-mental-strategies"] .sd-caption .ms-num { font-family: inherit; }

}

[data-sim="ari-mental-strategies"] .ms-tlab { top: 77%; transform: translateX(-50%); color: var(--muted); font-family: var(--mono); font-size: max(16px, 0.75em); white-space: nowrap; }

}

}

[data-sim="ari-mental-strategies"] .ms-chip[data-last] { background: var(--hl); color: var(--on-hl); }

/* ── panel: the task field ── */
[data-sim="ari-mental-strategies"] .ms-field { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 0.3rem 0.8rem; }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {

<script src="numberline.js"></script>
<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var NL = window.SimdeckModels['number-line'];
  var P = Simdeck.paperColumns;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var sim = null;
  var audience = 'teacher';

  var SIGN = { sub: '−', add: '+' };
  var COLOR = { split: 1, round: 3, comp: 4 };

  /** t.parts, but a node that fills two placeholders is cloned for the second (the kit returns the same node twice). */
  function tp(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }
  function noFocus(b) { b.addEventListener('mousedown', function (e) { e.preventDefault(); }); return b; }
  function num(v) { return h('span', { class: 'ms-num', translate: 'no' }, String(v)); }
  function signed(s) { return (s < 0 ? '− ' : '+ ') + Math.abs(s); }
  function chipText(s) { return (s < 0 ? '−' : '+') + Math.abs(s); }
  function pct(x) { return (x * 100).toFixed(3) + '%'; }
  function wayName(s, id) { return t('w_' + id); }
  /** The way's name inside a sentence: lower case first letter. */
  function wayLow(s, id) { var n = wayName(s, id); return n.charAt(0).toLocaleLowerCase(Simdeck.lang) + n.slice(1); }
  function minus(v) { return String(v).replace('-', '−'); }
  function waySub(s, id) { return id === 'comp' ? t('ws_comp_' + s.op) : t('ws_' + id); }
  /** A phone or a narrow window. */
  function narrow() { var st = document.querySelector('[data-sd-stage]'); return !!st && st.clientWidth > 0 && st.clientWidth < 760; }

  /** The written form of a path after i jumps: "a ± |s1| ± |s2| …" and the current "= x ± |s(i+1)| …" or "= r". */
  function written(s, w) {
    var all = s.a + ' ' + w.jumps.map(function (j) { return signed(j.size); }).join(' ');
    var rest = w.jumps.slice(w.shown).map(function (j) { return signed(j.size); }).join(' ');
    var lhs = s.a + ' ' + SIGN[s.op] + ' ' + s.b;
    // a wrong path is not equal to the task: ≠
    var out = [h('span', { translate: 'no' }, lhs + (w.ok ? ' = ' : ' ≠ ') + all)];
    if (w.shown) out.push(h('span', { class: 'ms-now', translate: 'no' }, '= ' + w.at + (rest ? ' ' + rest : '')));
    return out;
  }

  /** Label levels, in path order: a label too close to the last one on its level goes one level down (two levels). */
  function levels(xs, minGap) {
    var last = [-9, -9];
    return xs.map(function (x) {
      var lv = Math.abs(x - last[0]) >= minGap ? 0 : Math.abs(x - last[1]) >= minGap ? 1 : 0;
      last[lv] = x;
      return lv;
    });
  }

  // ── one way's line, drawn in HTML on a percentage scale (text at 1:1; the arcs are SVG without text) ──
  function lineEl(s, w, label) {
    var line = s.line, X = function (v) { return L.xOf(line, v); };
    var kids = [h('div', { class: 'ms-axis' })];
    var pxw = Math.max(200, (document.querySelector('[data-sd-stage]') || { clientWidth: 1200 }).clientWidth * (narrow() ? 0.85 : 0.68));
    var landings = w.jumps.slice(0, w.shown).map(function (j) { return j.to; });
    if (line.kind === 'scale') {
      var v = line.view;
      NL.ticks(v, narrow() ? 30 : 60).forEach(function (tk) {
        kids.push(h('span', { class: 'ms-tick' + (tk.major ? ' ms-major' : ''), style: { left: pct(NL.pos(tk.v, v)) } }));
      });
      var every = narrow() ? 2 : 1;
      NL.freeLabels(v, [s.a].concat(landings), narrow() ? 0.16 : 0.07).forEach(function (x) {
        if (Math.round((x - v.lo) / v.step) % every) return;
        kids.push(h('span', { class: 'ms-tlab', translate: 'no', style: { left: pct(NL.pos(x, v)) } }, String(x)));
      });
    }
    // where every path lands, once all of them are there
    if (s.done && s.jmax) kids.push(h('span', { class: 'ms-goal', style: { left: pct(X(s.r)) } }));
    var shown = w.jumps.slice(0, w.shown);
    var chipLv = levels(shown.map(function (j) { return (X(j.from) + X(j.to)) / 2; }), 72 / pxw);
    shown.forEach(function (j, i) {
      var x1 = X(j.from), x2 = X(j.to);
      var lo = Math.min(x1, x2), wd = Math.abs(x2 - x1);
      var right = j.to > j.from;
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('class', 'ms-arc');
      svg.setAttribute('viewBox', '0 0 100 40');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      svg.dataset.kind = j.kind;
      svg.style.left = pct(lo);
      svg.style.width = pct(wd);
      var p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', 'M ' + (right ? 0 : 100) + ' 40 C ' + (right ? 15 : 85) + ' -8, ' + (right ? 85 : 15) + ' -8, ' + (right ? 100 : 0) + ' 40');
      p.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.append(p);
      kids.push(svg);
      kids.push(h('span', { class: 'ms-head', style: { left: pct(x2) } }));
      kids.push(h('span', { class: 'ms-chip', translate: 'no', dataset: { kind: j.kind, lv: String(chipLv[i]), last: i === w.shown - 1 && !s.done ? '1' : null },
        style: { left: pct(lo + wd / 2) } }, chipText(j.size)));
    });
    if (w.mistake && !w.ok && w.done && s.jmax) kids.push(h('span', { class: 'ms-pt ms-want', style: { left: pct(X(s.r)) } }));
    // the points: the start, each landing (the last one the result), labels below on two levels when crowded
    var pts = [{ v: s.a, shape: 'start' }];
    shown.forEach(function (j, i) {
      var last = i === w.jumps.length - 1;
      pts.push({ v: j.to, shape: last ? (w.ok ? 'end' : 'wrong') : 'part' });
    });
    var labLv = levels(pts.map(function (q) { return X(q.v); }), 60 / pxw);
    pts.forEach(function (q, i) {
      var x = X(q.v);
      kids.push(h('span', { class: 'ms-pt', dataset: { shape: q.shape }, style: { left: pct(x) } }));
      kids.push(h('span', { class: 'ms-plab', translate: 'no', dataset: { shape: q.shape, lv: String(labLv[i]) }, style: { left: pct(x) } }, String(q.v)));
    });
    return h('div', { class: 'ms-line', role: 'img', 'aria-label': label }, h('div', { class: 'ms-scale' }, kids));
  }

  function rowEl(s, w) {
    var child = audience === 'child';
    var info = [h('span', { class: 'ms-name' }, wayName(s, w.id))];
    if (!child) info.push(h('span', { class: 'ms-sub' }, waySub(s, w.id)));
    if (w.out) {
      // nothing to draw
    } else if (s.done) {
      var sum = [t.n('count', w.count)];
      if (!child) sum.push(', ', w.cross ? t.n('cross', w.cross) : t('noCross'));
      info.push(h('span', { class: 'ms-sum' }, sum));
      if (w.best) info.push(h('span', null, h('span', { class: 'ms-badge' }, h('span', { 'aria-hidden': 'true' }, '★ '), t('best'))));
      if (!w.ok) info.push(h('span', { class: 'ms-bad' }, h('span', { 'aria-hidden': 'true' }, '✗ '), tp('want', { v: num(s.r) })));
    } else {
      info.push(h('span', { class: 'ms-count' }, num(w.shown + ' / ' + w.count)));
    }
    var path = [s.a].concat(w.jumps.slice(0, w.shown).map(function (j) { return j.to; })).join(' → ');
    var main = w.out
      ? h('div', { class: 'ms-main' }, h('div', { class: 'ms-written' }, h('span', { translate: 'no' }, s.a + ' ' + SIGN[s.op] + ' ' + s.b)),
          h('p', { class: 'ms-out' }, t('out')))
      : h('div', { class: 'ms-main' }, h('div', { class: 'ms-written' }, written(s, w)),
          lineEl(s, w, t('lineLabel', { way: wayName(s, w.id), path: path })));
    return h('section', { class: 'ms-row', dataset: { c: String(COLOR[w.id]), way: w.id, best: s.done && w.best ? '1' : null, ok: w.ok || w.out ? 'yes' : 'no' } },
      h('div', { class: 'ms-info' }, info), main);
  }

  function render(c) {
    var s = c.state, child = audience === 'child';
    var res = s.done ? h('span', { class: 'ms-res', translate: 'no' }, String(s.r)) : h('span', { class: 'ms-res', translate: 'no', dataset: { q: '1' } }, '?');
    var btn = noFocus(h('button', { type: 'button', class: 'sd-btn sd-btn--primary ms-next', title: t('nextKey') + ' (S)', 'aria-keyshortcuts': 's', onclick: nextJump },
      t(s.done && s.jmax ? 'again' : 'next'), ' ', h('kbd', null, 'S')));
    var top = h('div', { class: 'ms-top' },
      h('div', { class: 'ms-task', role: 'group', 'aria-label': t('taskQ') }, h('span', { translate: 'no' }, s.a + ' ' + SIGN[s.op] + ' ' + s.b + ' = '), res),
      s.jmax ? btn : null,
      s.jmax && !child ? h('span', { class: 'ms-count' }, num(s.j + ' / ' + s.jmax)) : null);
    c.stage.replaceChildren(h('div', { class: 'ms', dataset: { aud: audience, op: s.op } },
      top, h('div', { class: 'ms-rows' }, s.ways.map(function (w) { return rowEl(s, w); }))));
    syncPanel(c);
  }

  function nextJump() {
    var s = sim.state;
    sim.set({ j: s.j >= s.jmax ? 0 : s.j + 1 }, { preset: sim.preset });
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, A = audience;
    var out = [];
    function add(nodes) { if (out.length) out.push(' '); out.push(h('span', null, nodes)); }
    function addHl(nodes) { if (out.length) out.push(' '); out.push(h('span', { class: 'sd-hl' }, nodes)); }
    var comp = s.ways[2];
    if (!s.done) {
      if (s.j === 0) { add(A === 'child' ? t('c0C') : tp('c0', { a: num(s.a) })); return out; }
      if (A === 'child') { add(t('cStepC', { i: s.j })); return out; }
      var list = [];
      s.ways.forEach(function (w) {
        if (w.out) return;
        if (list.length) list.push('; ');
        if (w.shown < s.j) { list.push(tp('cItemWait', { way: wayLow(s, w.id), to: num(w.at) })); return; }
        var j = w.jumps[s.j - 1];
        list.push(tp('cItem', { way: wayLow(s, w.id), jump: num(j.from + ' ' + signed(j.size)), to: num(j.to) }));
        if (j.kind === 'cross') list.push(' ', t('k_cross'));
      });
      add(tp('cStep', { i: s.j, list: h('span', null, list) }));
      return out;
    }
    if (!s.jmax) { add(tp('cEnd', { r: num(s.r) })); return out; }
    if (comp.mistake && !comp.out && !comp.ok) {
      if (A === 'child') { addHl(tp('cMisC', { e: num(comp.end), r: num(s.r) })); return out; }
      addHl(tp('cMis', { comp: wayName(s, 'comp'), e: num(comp.end), r: num(s.r) }));
      var k = Math.abs(comp.k), sg = SIGN[s.op];
      var right = (s.op === 'add' ? s.a - comp.k : s.a + comp.k) + ' ' + sg + ' ' + comp.R;
      var wrong = (s.op === 'add' ? s.a + comp.k : s.a - comp.k) + ' ' + sg + ' ' + comp.R + ' = ' + comp.end;
      add(tp('mis_' + s.op + '_' + (comp.k > 0 ? 'up' : 'down'), { b: num(s.b), k: num(k), R: num(comp.R), a: num(s.a), right: num(right), wrong: num(wrong) }));
      return out;
    }
    if (A === 'child') { add(tp('cEndC', { r: num(s.r) })); return out; }
    add(tp(comp.out ? 'cEnd2' : 'cEnd', { r: num(s.r) }));
    if (comp.out) add(tp('cOut', { v: num(minus(comp.over)) }));
    else if (comp.order === 'fix') add(tp('cFix', { how: t('ws_comp_' + s.op), v: num(minus(comp.over)), R: num(comp.R), k: num(Math.abs(comp.k)) }));
    var best = s.ways.filter(function (w) { return w.best; }).map(function (w) { return wayLow(s, w.id); });
    if (best.length) {
      add(t('cBest', { ways: best.join(t('and')) }));
      if (A === 'adult') add(t('cBestWhy'));
    }
    if (A === 'adult') s.ways.forEach(function (w) { if (!w.out) add(t(w.id === 'comp' ? 'why_comp_' + s.op : 'why_' + w.id)); });
    return out;
  }

  // ── the panel: the task field; the header: the audience switch ──
  var field = null;
  function buildTask() {
    var host = document.querySelector('[data-ms-task]');
    var label = h('label', { class: 'sd-ctl-label', for: 'ms-task' }, h('span', null, t('taskLabel')));
    var input = h('input', { id: 'ms-task', type: 'text', class: 'ms-input', spellcheck: 'false', autocomplete: 'off',
      autocapitalize: 'off', translate: 'no', title: t('taskHint'), 'aria-describedby': 'ms-task-msg' });
    var msg = h('small', { class: 'sd-hint', id: 'ms-task-msg', role: 'status' }, '');
    function clear() { input.removeAttribute('aria-invalid'); msg.textContent = ''; msg.className = 'sd-hint'; }
    input.addEventListener('input', function () {
      var r = L.parseTask(input.value);
      if (r.error) {
        input.setAttribute('aria-invalid', 'true');
        msg.textContent = t('err_' + r.error);
        msg.className = 'ms-err';
        return;
      }
      clear();
      sim.set({ op: r.task.op, a: r.task.a, b: r.task.b, j: L.J_ALL });
    });
    // Enter or Esc hands the keys back to the page
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); input.blur(); } });
    input.addEventListener('blur', function () { if (input.getAttribute('aria-invalid')) { clear(); sim.render(); } });
    host.replaceChildren(h('div', { class: 'sd-group', role: 'group', 'aria-label': t('taskTitle') },
      h('div', { class: 'ms-field' }, label, input, msg)));
    field = { host: host, input: input, clear: clear };
  }
  function syncPanel(c) {
    if (!field) return;
    field.host.hidden = audience === 'child';
    var tk = L.numbersOf(c.params);
    var shown = L.parseTask(field.input.value);
    var same = !shown.error && shown.task.op === tk.op && shown.task.a === tk.a && shown.task.b === tk.b;
    if (document.activeElement !== field.input && !same) { field.input.value = L.taskText(tk); field.clear(); }
  }
  function buildAudience() {
    var key = function (a) { return 'aud' + a.charAt(0).toUpperCase() + a.slice(1); };
    var names = {}, hints = {};
    P.AUDIENCES.forEach(function (a) { names[a] = t(key(a)); hints[a] = t(key(a) + 'Hint'); });
    var ctl = P.audience({ host: document.querySelector('[data-pc-audience]'), label: t('audLabel'), group: t('audGroup'),
      names: names, hints: hints, onChange: function (a) { audience = a; sim.render(); } });
    audience = ctl.value;
  }

  buildAudience();
  buildTask();

  var hidden = function (key, type) {
    return type === 'choice'
      ? { key: key, type: 'choice', label: t('taskTitle'), value: L.defaults[key], options: L.OPS.map(function (o) { return [o, o]; }), visible: function () { return false; } }
      : { key: key, type: 'range', label: t('taskTitle'), value: L.defaults[key], min: 0, max: L.MAX, visible: function () { return false; } };
  };
  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      hidden('op', 'choice'), hidden('a'), hidden('b'),
      { key: 'j', type: 'range', label: t('j'), value: L.defaults.j, min: 0,
        max: function (p) { return L.initial(p).jmax; },
        // the default (all) is above the longest path: show what the stage shows
        format: function (v) { return String(sim ? Math.min(v, sim.state.jmax) : v); } },
      { key: 'scale', type: 'toggle', label: t('scale'), value: L.defaults.scale, visible: function () { return audience !== 'child'; } },
      { key: 'mistake', type: 'toggle', label: t('mistake'), hint: t('mistakeHint'), value: L.defaults.mistake, visible: function () { return audience === 'teacher'; } }
    ],

    presets: L.PRESETS.map(function (pr) {
      return { id: pr.id, label: t('p_' + pr.id), hint: t('ph_' + pr.id), params: pr.params };
    }),

    keys: [
      { key: 's', label: t('nextKey'), run: nextJump }
    ],

    legend: [
      { c: 1, label: t('legPart') },
      { shape: 'hl', label: t('legResult') },
      { shape: 'dash', label: t('legCross') }
    ],

    render: render,
    caption: caption
  });

  // keep the params what the page shows: a clamped task is written back, so the field and the URL say what the stage says
  sim.on(function (c) {
    var p = c.params, s = c.state;
    if (p.op !== s.op || p.a !== s.a || p.b !== s.b) sim.set({ op: s.op, a: s.a, b: s.b });
  });
  sim.render();
})();
</script>
</body>
</html>
