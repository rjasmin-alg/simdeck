<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  /** Protocol colours: always paired with the protocol's name (chip, filter word, layer title). */
  var PROTO_C = { dhcp: '5', arp: '3', dns: '2', tcp: '1', tls: '6', http: '4' };
  /** The path as a zigzag: chips sit in the lane between the rows, clear of the cards. */
  var NODES = [
    { id: 'PC', kind: 'host', col: 0, row: 0, c: 1 },
    { id: 'AP', kind: 'ap', col: 1, row: 2, c: 8 },
    { id: 'SW', kind: 'switch', col: 2, row: 0, c: 8 },
    { id: 'R', kind: 'router', col: 3, row: 2, c: 4 },
    { id: 'NET', kind: 'cloud', col: 4, row: 0 },
    { id: 'SRV', kind: 'server', col: 5, row: 2, c: 2 }
  ];
  var LINKS = [['PC', 'AP'], ['AP', 'SW'], ['SW', 'R'], ['R', 'NET'], ['NET', 'SRV']];
  var CHAIN_KEY = { dhcp: 'chDhcp', dns: 'chDns', local: 'chLocal', arp: 'chArp', 'switch': 'chSwitch', router: 'chRouter',
    nat: 'chNat', tcp: 'chTcp', tls: 'chTls', http: 'chHttp', close: 'chClose' };
  /** Each phase's own simulator (task file "Reuse"); a preset where one shows this case. */
  var CHAIN_SIM = { dhcp: ['dhcp-dora'], dns: ['dns-resolution', 'cold'], local: ['arp-local-remote', 'remote'],
    arp: ['arp-local-remote', 'cache-hit'], 'switch': ['mac-table'], router: ['hop-rewrite', 'book'], nat: ['nat', 'book'],
    tcp: ['tcp-handshake', 'book'], tls: ['tls-handshake'], http: ['http-exchange'], close: ['tcp-handshake'] };
  /** The chain phase a step belongs to (its outline). */
  var PHASE_CHAIN = { dhcp1: 'dhcp', dhcp2: 'dhcp', click: 'dns', decide: 'local', 'arp-req': 'arp', 'arp-rep': 'arp',
    'dns-q': 'dns', 'dns-a': 'dns', syn: 'tcp', hop: 'router', synack: 'tcp', ack: 'tcp', tls1: 'tls', tls2: 'tls',
    req: 'http', resp: 'http', 'fin-c': 'close', 'fin-s': 'close' };
  var STATE_KEY = { pending: 'stPending', done: 'stDone', absent: 'stAbsent', unused: 'stUnused' };

  /** Data (addresses, MACs, ports, protocol names) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'sd-mono' : cls || null }, String(text)); }
  function b(text) { return h('b', null, data(text)); }
  function sock(ip, port) { return ip + ':' + port; }
  /** t.parts, but a placeholder used twice is cloned (the same node appended twice would move). */
  function parts(key, vars) {
    var seen = [];
    return t.parts(key, vars).map(function (p) {
      if (typeof p === 'string' || !p.nodeType || p.nodeType === 3) return p;
      var out = seen.indexOf(p) >= 0 ? p.cloneNode(true) : p;
      seen.push(p);
      return out;
    });
  }
  function protoOf(k) { return k.app ? k.app.proto : 'tcp'; }
  function httpWhat(app) { return app.msg === 'get' ? 'GET ' + app.path : '200 OK'; }

  /** The chip of a packet: the message's name. */
  function chipOf(k) {
    var a = k.app;
    if (a && a.proto === 'dhcp') return data(a.msg.toUpperCase(), '');
    if (a && a.proto === 'arp') return t(a.op === 'request' ? 'kArpReq' : 'kArpRep');
    if (a && a.proto === 'dns') return t(a.qr === 'query' ? 'kDnsQ' : 'kDnsA');
    if (a && a.proto === 'tls') return a.msg === 'client-hello' ? data('ClientHello', '') : a.msg === 'server-hello' ? data('ServerHello …', '') : t('kEnc');
    if (a && a.proto === 'http') return data(httpWhat(a), '');
    return data(k.l4.flags.indexOf('SYN') >= 0 ? k.l4.flags.join('-') : k.l4.flags.indexOf('FIN') >= 0 ? 'FIN' : 'ACK', '');
  }
  function flagsText(f) { return f.join(', '); }

  /** The application line of a packet, in words. */
  function appText(a) {
    if (!a) return null;
    if (a.proto === 'arp') return a.op === 'request' ? parts('aArpReq', { ip: data(a.tpa, ''), asker: data(a.spa, '') }) : parts('aArpRep', { ip: data(a.spa, ''), mac: data(a.sha, '') });
    if (a.proto === 'dhcp') {
      if (a.msg === 'discover') return parts('aDiscover');
      if (a.msg === 'offer') return parts('aOffer', { ip: data(a.yiaddr, '') });
      if (a.msg === 'request') return parts('aRequest', { ip: data(a.requested, '') });
      return parts('aAck', { ip: data(a.yiaddr, ''), p: data(a.prefix, ''), gw: data(a.router, ''), dns: data(a.dns, '') });
    }
    if (a.proto === 'dns') return a.qr === 'query' ? parts('aDnsQ', { name: data(a.name, '') }) : parts('aDnsA', { name: data(a.name, ''), ip: data(a.ip, ''), ttl: data(a.ttl, '') });
    if (a.proto === 'http') return a.msg === 'get' ? parts('aGet', { path: data(a.path, ''), host: data(a.host, '') }) : parts('aOk', { path: data(a.path, '') });
    if (a.msg === 'client-hello') return parts('aHello');
    if (a.msg === 'server-hello') return parts('aServerHello');
    return parts('aEnc', { inner: data(a.inner.msg === 'get' ? 'GET' : '200 OK', '') });
  }

  // ── topology (kit view K2) ──

  function badgesFor(id, s) {
    var out = [], k = s.packets[0], ph = s.phase;
    var on = function (key, kind) { out.push({ text: t(key), k: kind }); };
    if (ph === 'click' && id === 'PC') on(s.lookup.hit ? 'bHit' : 'bCache', s.lookup.hit ? 'dashed' : 'solid');
    if (ph === 'decide' && id === 'PC') { on('bAnd', 'solid'); if (s.lookup.hit) on('bHit', 'dashed'); }
    if (k && ph !== 'hop') {
      var first = k.path[0], last = k.path[k.path.length - 1];
      if (id === first) on((first === 'SRV' || first === 'R') && !(k.l4 && k.l4.flags && k.l4.flags.indexOf('FIN') >= 0) ? 'bAnswers' : 'bSends', 'fill');
      if (id === last) on('bGets', 'solid');
      if (id === 'AP' && k.path.indexOf('AP') >= 0) on('bBridge', 'muted');
      if (id === 'SW' && s.sw) on(s.sw.flood ? 'bFlood' : 'bForward', 'muted');
      if (id === 'R' && k.path.indexOf('R') > 0 && k.path.indexOf('R') < k.path.length - 1) on(k.dir === 'in' ? 'bReverse' : 'bNat', 'solid');
    }
    if (ph === 'hop') { if (id === 'R') on('bNat', 'fill'); if (id === 'SRV') on('bGets', 'solid'); }
    return out;
  }

  function nodeLines(id, s) {
    if (id === 'PC') return [s.host ? { text: s.host.ip + ' · ' + L.HOST.mac, kind: 'sub' } : { text: t('noAddr'), kind: 'role' }];
    if (id === 'AP') return [{ text: t('roleAp'), kind: 'role' }];
    if (id === 'SW') return [];
    if (id === 'R') return [{ text: L.ROUTER.lan + ' · ' + L.ROUTER.lanMac, kind: 'sub' }, { text: L.ROUTER.pub + ' · ' + L.ROUTER.wanMac, kind: 'sub' }];
    if (id === 'SRV') return [{ text: L.SERVER.ip, kind: 'sub' }];
    return [];
  }
  var NAME = { PC: 'nPc', AP: 'nAp', SW: 'nSw', R: 'nR', SRV: 'nSrv' };

  function renderTopo(c) {
    var s = c.state;
    var nodes = NODES.map(function (n) {
      if (n.id === 'NET') return { id: 'NET', kind: 'cloud', col: n.col, row: n.row, name: t('nNet'), lines: [{ text: t.n('roleNet', L.INTERNET_HOPS), kind: 'role' }], badges: [] };
      var bs = badgesFor(n.id, s);
      return { id: n.id, kind: n.kind, col: n.col, row: n.row, c: n.c, mark: n.id === 'SRV' ? 'S' : n.id, name: n.id === 'SRV' ? data(L.SERVER.name, '') : t(NAME[n.id]),
        lines: nodeLines(n.id, s), badges: bs, state: bs.length ? 'active' : null, align: 'start' };
    });
    var used = {};
    s.packets.forEach(function (k) { for (var i = 0; i + 1 < k.path.length; i++) used[[k.path[i], k.path[i + 1]].sort().join('-')] = true; });
    var links = LINKS.map(function (l) {
      return { id: l.join('-'), a: l[0], b: l[1], style: l[0] === 'PC' ? 'dashed' : null, active: !!used[l.slice().sort().join('-')] };
    });
    var packets = [];
    s.packets.forEach(function (k) {
      for (var i = 0; i + 1 < k.path.length; i++) {
        packets.push({ from: k.path[i], to: k.path[i + 1], c: PROTO_C[protoOf(k)], cast: k.cast, label: chipOf(k), chip: i === 0, at: 0.5 });
      }
    });
    return Simdeck.topology({ cols: 6, rows: ['auto', '2.2rem', 'auto'], gap: '1.6cqw', dir: c.dir, nodes: nodes, links: links, packets: packets });
  }

  // ── chain strip ──

  function renderChain(c) {
    var s = c.state, now = c.n > 0 ? PHASE_CHAIN[s.phase] : null;
    return h('ol', { class: 'pj-chain' }, L.CHAIN.map(function (id) {
      var st = s.chain[id], to = CHAIN_SIM[id];
      var href = '../' + to[0] + '/index.html?lang=' + Simdeck.lang + (to[1] ? '&preset=' + to[1] : '');
      var ds = { st: st };
      if (id === now) ds.now = '1';
      return h('li', null, h('a', { href: href, class: s.chainChanged.indexOf(id) >= 0 ? 'sd-changed' : null, dataset: ds,
        title: t('chainOpen', { name: to[0] }) },
        h('b', null, t(CHAIN_KEY[id])), h('small', null, t(STATE_KEY[st]))));
    }));
  }

  // ── the packet's headers ──

  function mainPacket(s) {
    if (!s.packets.length) return null;
    return s.phase === 'dhcp1' || s.phase === 'dhcp2' ? s.packets[s.packets.length - 1] : s.packets[0];
  }

  function fieldOf(label, value, o) {
    o = o || {};
    var v = [h('span', null, label), o.nat ? h('span', { class: 'pj-nat' }, data(value, '')) : data(value, '')];
    if (o.was != null) v.push(h('s', { translate: 'no' }, String(o.was)));
    return v;
  }

  function renderPacket(c) {
    var s = c.state, k = mainPacket(s);
    var box = h('section', { class: 'pj-box pj-pkt' });
    if (!k) {
      box.append(h('h2', null, t('hdrLan')), h('p', { class: 'pj-none' }, t(c.n === 0 ? 'hdrIdle' : 'hdrNone')));
      if (s.lookup) box.append(lookFoot(s, s.lookup.table, c));
      return box;
    }
    box.append(h('h2', null, t(k.view === 'wan' ? 'hdrWan' : 'hdrLan')));
    var ch = function (f) { return k.changed.indexOf(f) >= 0; };
    var was = function (f) { return ch(f) && k.was ? k.was[f] : null; };
    var natF = k.nat ? k.nat.field : null;
    var row = function (label, value, key, nat) { return [h('span', { class: 'pj-f' }, fieldOf(label, value, { nat: nat, was: was(key) })), null, { changed: ch(key) }]; };
    var kv = function (fields) { return fields.map(function (f) { return ['', f[0], f[2]]; }); };
    var proto = protoOf(k);
    var layers = [{ title: t('lEth'), dashed: k.cast === 'broadcast', fields: kv([
      row(t('fDstMac'), k.l2.dst, 'l2.dst'), row(t('fSrcMac'), k.l2.src, 'l2.src')]) }];
    if (k.l3) layers.push({ title: t('lIp'), c: 8, fields: kv([
      row(t('fSrc'), k.l3.src, 'l3.src', natF === 'src'), row(t('fDst'), k.l3.dst, 'l3.dst', natF === 'dst'), row(t('fTtl'), k.l3.ttl, 'l3.ttl')]) });
    if (k.l4) {
      var f4 = [row(t('fSport'), k.l4.sport, 'l4.sport', natF === 'src'), row(t('fDport'), k.l4.dport, 'l4.dport', natF === 'dst')];
      if (k.l4.flags) f4.push(row(t('fFlags'), flagsText(k.l4.flags), 'l4.flags'));
      layers.push({ title: t(k.l4.proto === 'tcp' ? 'lTcp' : 'lUdp'), c: 1, fields: kv(f4) });
    }
    if (k.app) layers.push({ title: data(proto.toUpperCase(), ''), c: PROTO_C[proto], body: h('span', { class: 'pj-body' }, appText(k.app)) });
    box.append(Simdeck.topology.headers(layers, c.dir === 'forward' ? 'forward' : null));
    if (k.nat) {
      var key = k.view === 'wan' ? 'natHop' : k.nat.field === 'src' ? 'natOut' : 'natIn';
      box.append(h('p', { class: 'pj-note' }, h('span', { class: 'pj-nat' }, parts(key, { pub: data(k.nat.pub, ''), priv: data(k.nat.wire, '') }))));
    }
    if (s.packets.length > 1) {
      var other = s.packets[0] === k ? s.packets[1] : s.packets[0];
      box.append(h('p', { class: 'pj-note' }, parts(s.packets[0] === k ? 'hdrTwo' : 'hdrReplyTo', { what: h('b', null, chipOf(other)) })));
    }
    return box;
  }

  // ── tables ──

  function wrote(s, table, key) { return s.wrote.some(function (w) { return w.table === table && String(w.key) === String(key); }); }
  function lookFoot(s, table, c) {
    var lk = s.lookup;
    if (!lk || lk.table !== table) return null;
    var nodes;
    if (table === 'dns') nodes = parts(lk.hit ? 'dnsHit' : 'dnsMiss', { name: data(lk.key, ''), ip: data(lk.hit ? s.dnsCache[lk.key].ip : '', '') });
    else if (table === 'arp') {
      var d = s.decision;
      nodes = [h('span', { style: { display: 'block' } }, d.local
        ? parts('andLocal', { dst: data(d.dst, ''), mask: data(d.mask, ''), theirs: data(d.theirs, '') })
        : parts('andRemote', { dst: data(d.dst, ''), mask: data(d.mask, ''), theirs: data(d.theirs, ''), own: data(d.own, ''), gw: data(d.nextHop, '') })),
        h('span', { style: { display: 'block' } }, parts(lk.hit ? 'arpHit' : 'arpMiss', { ip: data(lk.key, ''), mac: data(lk.hit ? s.arp[lk.key] : '', '') }))];
    } else return null;
    return h('div', { class: 'pj-look sd-changed' + (c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { hit: String(!!lk.hit) } }, nodes);
  }

  /** The last cell of a row, with "novo" after it on the same line when the row was just written. */
  function last(text, isNew) { return h('span', null, data(text, ''), isNew ? [' ', h('b', null, t('noteNew'))] : null); }

  function renderTables(c) {
    var s = c.state;
    var hitRow = function (table, key) { return s.lookup && s.lookup.table === table && s.lookup.hit && String(s.lookup.key) === String(key); };
    var mk = function (table, key) { return wrote(s, table, key) ? 'new' : hitRow(table, key) ? 'hit' : null; };
    var dns = Simdeck.topology.table({ title: t('tDns'), empty: t('empty'),
      rows: Object.keys(s.dnsCache).map(function (n) {
        return { cells: [n, last(s.dnsCache[n].ip + ' · TTL ' + s.dnsCache[n].ttl, wrote(s, 'dns', n))], c: 2, mark: mk('dns', n) };
      }) }, c.dir);
    var arp = Simdeck.topology.table({ title: t('tArp'), empty: t('empty'),
      rows: Object.keys(s.arp).map(function (ip) {
        return { cells: [last(ip + ' → ' + s.arp[ip], wrote(s, 'arp', ip))], c: 4, mark: mk('arp', ip) };
      }) }, c.dir);
    var conn = Simdeck.topology.table({ title: t('tConn'), empty: t('empty'),
      rows: s.conns.map(function (x) {
        return { cells: [':' + x.sport + ' → ' + sock(x.dst, x.dport), last(x.state.toUpperCase(), s.phase === 'syn')], c: 1, mark: mk('conn', x.sport) };
      }) }, c.dir);
    var nu = s.natUse;
    var nat = Simdeck.topology.table({ title: t('tNat'), empty: t('empty'),
      rows: s.nat.map(function (x, i) {
        return { cells: [x.priv, last('↔ ' + x.pub, wrote(s, 'nat', i))], c: 4, mark: wrote(s, 'nat', i) ? 'new' : nu && nu.row === i ? 'hit' : null };
      }) }, c.dir);
    return h('section', { class: 'pj-box' }, h('div', { class: 'pj-tabs' }, dns, arp, conn, nat));
  }

  // ── capture ──

  function capInfo(e) {
    var a = e.app;
    if (a && a.proto === 'http') return data(httpWhat(a), '');
    if (a && a.proto === 'tls') return a.msg === 'app-data' ? t('kEnc') : data(a.msg === 'client-hello' ? 'ClientHello' : 'ServerHello … Finished', '');
    if (a && a.proto === 'dhcp') return data(a.msg.toUpperCase() + (a.msg === 'offer' || a.msg === 'ack' ? ' ' + a.yiaddr : ''), '');
    if (a && a.proto === 'arp') return a.op === 'request' ? parts('cArpReq', { ip: data(a.tpa, '') }) : parts('aArpRep', { ip: data(a.spa, ''), mac: data(a.sha, '') });
    if (a && a.proto === 'dns') return a.qr === 'query' ? parts('cDnsQ', { name: data(a.name, '') }) : parts('cDnsA', { name: data(a.name, ''), ip: data(a.ip, '') });
    return data(e.sport + ' → ' + e.dport + ' [' + flagsText(e.flags) + ']', '');
  }

  function renderCapture(c) {
    var s = c.state;
    var box = h('section', { class: 'pj-box pj-cap' }, h('h2', null, t('capTitle')));
    if (!s.capture.length) { box.append(h('p', { class: 'pj-none' }, t('capEmpty'))); return box; }
    box.append(h('div', { class: 'pj-cap-wrap' }, h('table', null,
      h('thead', null, h('tr', null, h('th', null, t('colNo')), h('th', null, t('colFilter')), h('th', null, t('colSrcDst')), h('th', null, t('colInfo')))),
      h('tbody', null, s.capture.map(function (e, i) {
        var src = e.src, dst = e.dst === L.BCAST_MAC ? 'ff:ff:…' : e.dst;
        return h('tr', { class: s.newCapture.indexOf(i) >= 0 ? 'sd-changed' : null },
          h('td', null, data(e.n, '')),
          h('td', null, h('span', { class: 'pj-filt', dataset: { c: PROTO_C[e.filter] } }, data(e.filter, ''))),
          h('td', null, data(src + ' → ' + dst, '')),
          h('td', null, capInfo(e)));
      })))));
    return box;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'scheme', type: 'choice', label: t('scheme'), options: [['http', 'http://'], ['https', 'https://']], resets: true },
      { key: 'joined', type: 'toggle', label: t('joined'), hint: t('joinedHint'), resets: true },
      { key: 'dnsWarm', type: 'toggle', label: t('dnsWarm'), resets: true,
        disabled: function (p) { return p.joined && p.connOpen ? t('dnsWarmHint') : false; } },
      { key: 'arpWarm', type: 'toggle', label: t('arpWarm'), resets: true },
      { key: 'connOpen', type: 'toggle', label: t('connOpen'), hint: t('connOpenHint'), resets: true,
        disabled: function (p) { return p.joined ? false : t('connOpenHint'); } },
      { key: 'close', type: 'toggle', label: t('close'), resets: true }
    ],

    presets: [
      { id: 'prvi-student', label: t('presetFirst'), hint: t('presetFirstHint'), params: { scheme: 'http', joined: true, dnsWarm: false, arpWarm: false, connOpen: false, close: false } },
      { id: 'drugi-student', label: t('presetSecond'), hint: t('presetSecondHint'), params: { scheme: 'http', joined: true, dnsWarm: true, arpWarm: true, connOpen: false, close: false } },
      { id: 'arp-istekao', label: t('presetArp'), hint: t('presetArpHint'), params: { scheme: 'https', joined: true, dnsWarm: true, arpWarm: false, connOpen: false, close: false } },
      { id: 'novo-spajanje', label: t('presetJoin'), hint: t('presetJoinHint'), params: { scheme: 'https', joined: false, dnsWarm: false, arpWarm: false, connOpen: false, close: false } },
      { id: 'otvorena-veza', label: t('presetOpen'), hint: t('presetOpenHint'), params: { scheme: 'http', joined: true, dnsWarm: true, arpWarm: true, connOpen: true, close: false } }
    ],

    legend: [
      { shape: 'line', label: t('legWire') },
      { shape: 'dash', label: t('legBcast') },
      { shape: 'decide', label: t('legDecide') },
      { shape: 'absent', label: t('legAbsent') },
      { shape: 'nat', label: t('legNat') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'pj' },
        renderTopo(c),
        renderChain(c),
        h('div', { class: 'pj-low' },
          h('div', { class: 'pj-left' }, renderPacket(c), renderTables(c)),
          renderCapture(c))));
    },

    caption: function (c) {
      var s = c.state, p = L.norm(c.params), n = c.n, k = mainPacket(s);
      var N = function (v) { return data(v, ''); };
      var D = function (v) { return data(v); };
      if (n === 0) return s.host ? parts('capStart', { url: D(p.scheme + '://example.com'), ip: D(s.host.ip) }) : parts('capStartNew');
      var ph = s.phase, out;
      if (ph === 'dhcp1') return parts('capDhcp1', { n: N(n), ip: b(L.HOST.ip) });
      if (ph === 'dhcp2') return parts('capDhcp2', { n: N(n), ip: b(s.host.ip), p: N(s.host.prefix), gw: b(s.host.gw), dns: b(s.host.dns) });
      if (ph === 'click') {
        out = s.lookup.hit ? parts('capClickHit', { n: N(n), name: D(L.SERVER.name), ip: b(s.dnsCache[L.SERVER.name].ip) }) : parts('capClickMiss', { n: N(n), name: D(L.SERVER.name) });
        if (p.joined) out = out.concat(' ', parts('capNoDhcp'));
        return out;
      }
      if (ph === 'decide') {
        var d = s.decision, hit = s.lookup.hit;
        var v = { n: N(n), dst: D(d.dst), mask: D(d.mask), theirs: b(d.theirs), own: D(d.own), gw: b(d.nextHop), mac: b(hit ? s.arp[d.nextHop] : '') };
        var learnt = c.prev && c.prev.chain.arp === 'done';
        return parts(d.local ? (hit ? 'capLocalHit' : 'capLocalMiss')
          : hit ? (learnt ? 'capRemoteLearnt' : 'capRemoteHit') : (p.joined ? 'capRemoteMiss' : 'capRemoteMissNew'), v);
      }
      if (ph === 'arp-req') return parts('capArpReq', { n: N(n), ip: b(k.app.tpa) });
      if (ph === 'arp-rep') return parts('capArpRep', { n: N(n), ip: D(k.app.spa), mac: b(k.app.sha) });
      if (ph === 'dns-q') return parts('capDnsQ', { n: N(n), name: D(k.app.name), ip: b(k.l3.dst) });
      if (ph === 'dns-a') return parts('capDnsA', { n: N(n), name: D(k.app.name), addr: b(k.app.ip), ttl: N(k.app.ttl) });
      if (ph === 'syn') return parts('capSyn', { n: N(n), sport: b(k.l4.sport), dport: b(k.l4.dport), src: D(k.l2.src), dst: D(k.l2.dst), ttl: b(k.l3.ttl) });
      if (ph === 'hop') return parts('capHop', { n: N(n), a: N(k.was['l3.ttl']), b: b(k.l3.ttl), pub: b(k.nat.pub) });
      if (ph === 'synack') return parts('capSynAck', { n: N(n), pub: D(k.nat.pub), priv: b(k.nat.wire) });
      if (ph === 'ack') return parts('capAck', { n: N(n) });
      if (ph === 'tls1') return parts('capTls1', { n: N(n) });
      if (ph === 'tls2') return parts('capTls2', { n: N(n) });
      if (ph === 'req') {
        var open = s.lookup && s.lookup.table === 'conn', enc = k.app.proto === 'tls';
        var what = enc ? null : b(httpWhat(k.app));
        if (enc) return parts(open ? 'capReqEncOpen' : 'capReqEnc', { n: N(n), dport: b(k.l4.dport) });
        return parts(open ? 'capReqOpen' : 'capReq', { n: N(n), what: what, sport: b(k.l4.sport), dport: b(k.l4.dport) });
      }
      if (ph === 'resp') {
        out = k.app.proto === 'tls' ? parts('capRespEnc', { n: N(n) }) : parts('capResp', { n: N(n), what: b(httpWhat(k.app)) });
        if (s.next === 'req') out = out.concat(' ', parts('capMore'));
        else if (!s.next) out = out.concat(' ', parts('capStaysOpen'));
        return out;
      }
      if (ph === 'fin-c') return parts('capFinC', { n: N(n) });
      if (ph === 'fin-s') return parts('capFinS', { n: N(n) });
      return '';
    }
  });
})();
</script>
</body>
</html>
