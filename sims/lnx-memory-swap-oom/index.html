<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var NAME = { db: 'nDb', build: 'nBuild', backup: 'nBackup' };
  var GEN = { db: 'gDb', build: 'gBuild', backup: 'gBackup' };
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function mib(n) { return t('mib', { n: n }); }
  /** a process size on its slider: 0 = not started */
  function size(n) { return n > 0 ? mib(n) : t('notStarted'); }
  function pad(v, w) { v = String(v); while (v.length < w) v = ' ' + v; return v; }
  function on(list, k) { return list.indexOf(k) >= 0 ? 'sd-changed' : null; }
  /** a signed number as the kernel prints it, with a real minus sign */
  function signed(n) { return n < 0 ? '−' + Math.abs(n) : String(n); }
  function score(v) { return v === null ? t('never') : String(Math.round(v)); }

  // ── the bars: RAM, and swap at the same scale ──

  function segLabel(seg) {
    if (seg.key) return [h('b', { translate: 'no' }, seg.key), h('span', null, mib(seg.size))];
    var name = { other: 'segOther', fixed: 'segFixed', cache: 'segCache', free: 'segFree' }[seg.id];
    return [h('b', null, t(name)), h('span', null, mib(seg.size))];
  }

  function bars(st, chg) {
    var ram = h('div', { class: 'mo-bar', role: 'img', 'aria-label': t('ram') + ' ' + mib(st.total) },
      L.segments(st).map(function (seg) {
        return h('div', {
          class: 'mo-seg ' + (on(chg.seg, seg.id) || ''),
          dataset: { k: seg.key || seg.id },
          style: { flex: seg.size + ' 0 0' },
          title: mib(seg.size)
        }, segLabel(seg));
      }));
    var swap;
    if (!st.swapTotal) swap = h('div', { class: 'mo-nobar' }, t('noSwap'));
    else {
      var parts = st.procs.filter(function (x) { return !x.killed && x.swap > 0; }).map(function (x) {
        return h('div', { class: 'mo-seg ' + (on(chg.seg, 'swap') || ''), dataset: { k: 'swapused' }, style: { flex: x.swap + ' 0 0' } },
          h('b', { translate: 'no' }, x.key), h('span', null, mib(x.swap)));
      });
      var left = st.swapTotal - st.swapUsed;
      if (left > 0) parts.push(h('div', { class: 'mo-seg', dataset: { k: 'free' }, style: { flex: left + ' 0 0' } },
        h('b', null, t('segFree')), h('span', null, mib(left))));
      swap = h('div', { class: 'mo-bar', dataset: { k: 'swap' }, role: 'img', 'aria-label': t('swapBar') + ' ' + mib(st.swapTotal),
        style: { width: (st.swapTotal / st.total * 100) + '%' } }, parts);
    }
    return h('section', { class: 'mo-box' },
      h('div', { class: 'mo-barrow' }, h('div', { class: 'mo-barname' }, t('ram'), h('small', null, mib(st.total))), ram),
      h('div', { class: 'mo-barrow' }, h('div', { class: 'mo-barname' }, t('swapBar'), h('small', null, mib(st.swapTotal))), h('div', null, swap)),
      h('p', { class: 'mo-avail' }, t('availLine', { free: st.free, cache: st.cache - st.cacheFixed, avail: st.available })));
  }

  // ── free -m as it prints, and the process table ──

  function freeM(st, chg) {
    var cell = function (v, w, list, k) { return h('b', { class: on(list, k) }, pad(v, w)); };
    return h('section', { class: 'mo-box' },
      h('pre', { class: 'mo-console', translate: 'no' },
        h('span', { class: 'mo-prompt' }, '$ '), 'free -m\n',
        '       total  used  free shared buff/cache available\n',
        'Mem:   ', pad(st.total, 5), ' ', cell(st.used, 5, chg.mem, 'used'), ' ', cell(st.free, 5, chg.mem, 'free'),
        '      0 ', cell(st.cache, 10, chg.mem, 'cache'), ' ', cell(st.available, 9, chg.mem, 'available'), '\n',
        'Swap:  ', cell(st.swapTotal, 5, chg.swap, 'total'), ' ', cell(st.swapUsed, 5, chg.swap, 'used'), ' ',
        cell(st.swapTotal - st.swapUsed, 5, chg.swap, 'free')));
  }

  function procTable(st, chg) {
    var head = h('h3', null, t('procs'), h('span', null, t('orderHint')));
    if (!st.procs.length) return h('section', { class: 'mo-box' }, head, h('p', { class: 'mo-empty' }, t('noProcs')));
    var rows = st.procs.map(function (x) {
      var c = chg.procs[x.key] || [];
      var mark = function (k) { return c.indexOf('row') >= 0 || c.indexOf(k) >= 0 ? 'sd-changed' : null; };
      return h('tr', { dataset: x.killed ? { killed: '' } : {} },
        h('td', { translate: 'no', class: mark('pid') }, String(x.pid)),
        h('td', { class: mark('killed') }, h('span', { class: 'mo-name', translate: 'no' },
          x.killed ? h('span', { class: 'mo-x', 'aria-hidden': 'true' }, '✕') : h('span', { class: 'mo-chip', dataset: { k: x.key } }), x.key)),
        h('td', { class: mark('ask') }, x.key === 'backup' ? '—' : String(x.ask)),
        h('td', { class: mark('rss') }, String(x.rss)),
        h('td', { class: mark('swap') }, String(x.swap)),
        h('td', { class: mark('adj') }, signed(x.adj)),
        h('td', { class: mark('score') }, score(x.score)),
        x.killed ? h('td', { class: 'mo-killcell' }, t('killed')) : h('td', null, ''));
    });
    return h('section', { class: 'mo-box' },
      head,
      h('div', { class: 'mo-tablewrap' }, h('table', { class: 'mo-table' },
        h('thead', null, h('tr', null,
          h('th', null, t('thPid')), h('th', null, t('thName')), h('th', null, t('thAsk')), h('th', null, t('thRss')),
          h('th', null, t('thSwap')), h('th', { translate: 'no' }, t('thAdj')), h('th', null, t('thScore')), h('th', null, ''))),
        h('tbody', null, rows))));
  }

  // ── what each started process got, and the kernel log ──

  function step(k, text) { return h('span', { class: 'mo-step', dataset: { k: k } }, text); }
  function arrow() { return h('span', { class: 'mo-arrow', 'aria-hidden': 'true' }, '→'); }

  function trace(st) {
    if (!st.events.length) return null;
    var log = null;
    var items = st.events.map(function (e) {
      if (e.kind === 'read') return h('li', null, t('evRead', { free: e.fromFree, rest: e.replaced }));
      var parts = [h('b', null, t.parts('evAsk', { name: data(e.key), ask: e.ask }))];
      var add = function (k, text) { parts.push(arrow(), step(k, text)); };
      if (e.fromFree) add('free', t('evFree', { n: e.fromFree }));
      if (e.fromCache) add('cache', t('evCache', { n: e.fromCache }));
      e.swapped.forEach(function (sw) { add('swap', t.parts('evSwap', { n: sw.n, who: data(sw.key) })); });
      if (e.short) add('short', t('evShort', { n: e.short }));
      e.oom.forEach(function (o) {
        var list = o.scores.map(function (x) { return x.key + ' ' + Math.round(x.score); }).join(' · ');
        add('scores', t.parts('evScores', { list: data(list) }));
        add('kill', t.parts('evKill', { who: data(o.victim) }));
        var pid = L.PROCS.filter(function (d) { return d.key === o.victim; })[0].pid;
        log = h('pre', { class: 'mo-log', translate: 'no' }, h('b', null, 'Out of memory: '), 'Killed process ' + pid + ' (' + o.victim + ')');
      });
      var failed = e.oom.some(function (o) { return o.self; });
      add(failed ? 'kill' : 'done', t(failed ? 'evFail' : 'evDone'));
      return h('li', null, parts);
    });
    return h('section', { class: 'mo-box mo-trace' },
      h('h3', null, t('trace')),
      h('ul', { class: 'mo-events' }, items),
      log ? h('h3', null, t('kernelLog')) : null,
      log);
  }

  // ── render; "changed" compares with the state before the last param change ──

  var lastKey = null, shown = null, chg = L.changed(null, null);
  function track(c) {
    var k = JSON.stringify(c.params);
    if (k !== lastKey) {
      chg = L.changed(shown, c.state);
      lastKey = k;
    }
    shown = c.state;
  }

  function render(c) {
    track(c);
    var st = c.state;
    c.stage.replaceChildren(h('div', { class: 'mo' },
      bars(st, chg),
      h('div', { class: 'mo-mid' }, freeM(st, chg), procTable(st, chg)),
      trace(st) || h('div')));
  }

  function caption(c) {
    var st = c.state;
    var k = L.captionKey(st);
    var b = function (x) { return h('b', null, String(x)); };
    var allocs = st.events.filter(function (e) { return e.kind === 'alloc'; });
    var vars = {
      free: b(st.free), avail: b(st.available), used: b(st.used), bc: b(st.cache), cache: b(st.cache - st.cacheFixed)
    };
    if (k === 'cReclaim') vars.took = b(allocs.reduce(function (a, e) { return a + e.fromCache; }, 0));
    if (k === 'cSwap') {
      var sw = [];
      allocs.forEach(function (e) { sw = sw.concat(e.swapped); });
      vars.n = b(sw.reduce(function (a, x) { return a + x.n; }, 0));
      vars.who = t(GEN[sw[0].key]);
      vars.who2 = t(NAME[sw[0].key]);
    }
    if (k === 'cOomDb' || k === 'cOomProtected' || k === 'cOomSelf') {
      var e = allocs.filter(function (x) { return x.oom.length; })[0];
      var sc = {};
      e.oom[0].scores.forEach(function (x) { sc[x.key] = Math.round(x.score); });
      vars.short = b(e.short);
      vars.why = t(st.swapTotal ? 'whySwapFull' : 'whyNoSwap');
      vars.as = b(sc.build);
      var db = st.procs.filter(function (x) { return x.key === 'db'; })[0];
      // a −1000 database has no score: compare with its RSS + swap
      vars.vs = b(sc.db != null ? sc.db : db.rss + db.swap);
    }
    return t.parts(k, vars);
  }

  var labels = {
    'book-free': 'pBookFree', 'backup-reads': 'pBackupReads', 'cache-gives-way': 'pCacheGivesWay',
    'oom-kills-db': 'pOomKillsDb', 'swap-saves': 'pSwapSaves', 'protect-db': 'pProtectDb'
  };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'swap', type: 'choice', label: t('swap'), options: [[0, t('swapNone')], [512, mib(512)], [1024, mib(1024)]] },
      { key: 'backup', type: 'toggle', label: t('backup') },
      { key: 'dbSize', type: 'range', label: t('dbSize'), min: 0, max: 1200, step: 100, format: size },
      { key: 'dbAdj', type: 'choice', label: t('dbAdj'), options: [[0, '0'], [L.ADJ_MIN, '−1000']] },
      { key: 'buildSize', type: 'range', label: t('buildSize'), min: 0, max: 1200, step: 100, format: size }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'mo-proc', label: t('legProc') },
      { shape: 'mo-other', label: t('legOther') },
      { shape: 'mo-cache', label: t('legCache') },
      { shape: 'mo-fixed', label: t('legFixed') },
      { shape: 'mo-free', label: t('legFree') },
      { shape: 'mo-swap', label: t('legSwap') },
      { shape: 'mo-killed', label: t('legKilled') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
