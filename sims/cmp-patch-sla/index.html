<!-- cmp-patch-sla: a remediation policy sets deadlines by severity; compliance is reported as the share fixed in time,
     but exposure is open vulnerabilities × days, and the average hides the long tail on systems nobody owns; fixing
     the known-exploited ones first lowers real risk more than fixing by score; an exception needs an owner and an end
     date.
     The stage: four numbers (the report's share in time, the average time to fix, the oldest open item, open at year
     end); where the exposure is (items and exposure split by owned and unowned systems); the known-exploited exposure
     under both queue orders on the same stream; the open items at year end by age, one tile each, in two lanes, with
     the deadline of each severity as a line.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Rokovi za otklanjanje ranjivosti: prosjek i rep</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var LOCALE = Simdeck.lang === 'hr' ? 'hr-HR' : 'en-GB';
  var SPAN = (Math.floor(L.DAYS / L.BIN) + 1) * L.BIN;  // the age axis: 0…370 days, 37 columns of 10

  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function int(x) { return new Intl.NumberFormat(LOCALE).format(Math.round(x)); }
  function dec(x) { return new Intl.NumberFormat(LOCALE, { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(x); }
  function pct1(x) { return dec(x * 100) + ' %'; }
  function pct0(x) { return new Intl.NumberFormat(LOCALE, { maximumFractionDigits: 0 }).format(x * 100) + ' %'; }
  function days(n) { return t.n('days', n, { d: int(n) }); }
  function at(age) { return (age / SPAN * 100) + '%'; }
  function exposure(n) { return t('expUnit', { n: int(n) }); }

  var sim = null;
  function noFocus(e) { e.preventDefault(); }         // buttons do not take focus on click (docs/sim-ui.md §3)
  var refocus = null;                                 // after a keyboard press, focus goes back to the same button
  function btn(sel, attrs, run, kids) {
    return h('button', Object.assign({ type: 'button', class: 'ps-b', onmousedown: noFocus, dataset: { sel: sel },
      onclick: function (e) { refocus = e.detail === 0 ? sel : null; run(); } }, attrs), kids);
  }
  function newStream() { sim.set({ seed: L.nextSeed(sim.params.seed) }); }

  // the deadlines: steppers on the stage, next to the lines they move (the panel must fit one screen)
  function steppers(s) {
    return h('div', { class: 'ps-dlctl' }, h('span', { class: 'ps-head' }, t('dlHead')), L.DKEYS.map(function (k, sev) {
      var what = t(k), v = s.p[k];
      var move = function (dir) { return function () { var o = {}; o[k] = L.stepDeadline(sev, sim.params[k], dir); sim.set(o); }; };
      return h('span', { class: 'ps-step', dataset: { sev: String(sev) } },
        btn(k + '-', { 'aria-label': t('dlDown', { what: what }), 'aria-disabled': String(v <= L.DL_MIN[sev]) }, move(-1), '−'),
        h('span', { class: 'ps-sv' }, t('sev_' + sev), ' ', b(t('dShort', { d: int(v) }))),
        btn(k + '+', { 'aria-label': t('dlUp', { what: what }), 'aria-disabled': String(v >= L.DL_MAX[sev]) }, move(1), '+'));
    }));
  }

  // ── the four numbers ──

  function tile(kind, label, value, sub) {
    return h('div', { class: 'ps-k', dataset: { kind: kind } }, h('span', null, label), h('b', { class: 'ps-num', translate: 'no' }, value), sub);
  }

  function tiles(s) {
    var m = s.m, c = m.counts;
    var subIn = [h('small', null, t('kInTimeSub', { n: int(c.inTime), c: int(m.counted) }))];
    if (c.excepted > 0) subIn.push(h('small', null, t.n('kInTimeExc', c.excepted, { e: int(c.excepted) })));
    var old = m.oldest;
    var looks = m.inTime >= 0.95 ? 'report' : 'plain';  // the report's two numbers get the green tick when they look good
    return h('div', { class: 'ps-tiles' },
      tile(looks, t('kInTime'), pct1(m.inTime), subIn),
      tile(looks, t('kMean'), t('daysAvg', { d: dec(m.meanFix) }), h('small', null, t('kMeanSub', { f: int(m.fixed) }))),
      tile(old && old.age > 30 ? 'tail' : 'plain', t('kOldest'), old ? days(old.age) : t('kNoneOpen'),
        old ? h('small', null, t(old.owned ? 'kOldestOwned' : 'kOldestUnowned', { sev: t('sev_' + old.sev) })) : null),
      tile(c.overdue > 0 ? 'tail' : 'plain', t('kOpen'), int(m.open), h('small', null, t('kOpenSub', { o: int(c.overdue) }))));
  }

  // ── where the exposure is; the exploited exposure under both orders ──

  function split(label, owned, unowned, text) {
    var total = owned + unowned || 1;
    return h('div', { class: 'ps-bar' },
      h('span', { class: 'ps-blabel' }, label),
      h('span', { class: 'ps-track', 'aria-hidden': 'true' },
        h('span', { class: 'ps-seg', dataset: { k: 'owned' }, style: { width: (owned / total * 100) + '%' } }),
        h('span', { class: 'ps-seg sd-hatch', dataset: { k: 'unowned' }, style: { width: (unowned / total * 100) + '%' } })),
      h('span', { class: 'ps-btext ps-num' }, text));
  }

  function where(s) {
    var m = s.m;
    var iu = m.unownedItems, eu = m.exposureUnowned;
    return h('div', { class: 'ps-box' },
      h('p', { class: 'ps-head' }, t('headWhere')),
      split(t('rowItems'), m.items - iu, iu, [t('segUnowned') + ' ', b(int(iu)), ' / ' + int(m.items) + ' (' + pct0(iu / (m.items || 1)) + ')']),
      split(t('rowExposure'), m.exposure - eu, eu, [t('segUnowned') + ' ', b(pct0(eu / (m.exposure || 1))), ' · ' + exposure(m.exposure)]));
  }

  function kevBar(on, label, v, max, inTime) {
    return h('div', { class: 'ps-bar', dataset: { on: String(on) } },
      h('span', { class: 'ps-blabel' }, label),
      h('span', { class: 'ps-track', 'aria-hidden': 'true' },
        h('span', { class: 'ps-seg', dataset: { k: 'kev' }, style: { width: (v / (max || 1) * 100) + '%' } })),
      h('span', { class: 'ps-btext ps-num' }, b(exposure(v)), h('small', null, t('kevInTime', { pct: pct1(inTime) }))));
  }

  function kev(s) {
    var max = Math.max(s.kevBy.score, s.kevBy.exploited);
    return h('div', { class: 'ps-box ps-kev' },
      h('p', { class: 'ps-head' }, t('headKev')),
      kevBar(s.p.order === 'score', t('byScore'), s.kevBy.score, max, s.inTimeBy.score),
      kevBar(s.p.order === 'exploited', t('byKev'), s.kevBy.exploited, max, s.inTimeBy.exploited));
  }

  // ── the age chart ──

  function lane(items, cap) {
    var bins = {};
    items.forEach(function (x) { (bins[x.bin] = bins[x.bin] || []).push(x); });
    return Object.keys(bins).map(function (k) {
      var bin = Number(k), list = bins[k];
      return h('div', { class: 'ps-col', role: 'img',
        'aria-label': t('binLabel', { a: bin * L.BIN, b: bin * L.BIN + L.BIN - 1, n: list.length }),
        style: { left: at(bin * L.BIN), width: at(L.BIN), '--cap': String(cap) } },
        list.slice(0, cap).map(function (x) {
          return h('span', { class: 'ps-t', dataset: { sev: String(x.sev), kev: String(x.kev), exc: String(x.mark === 'exc') } });
        }));
    });
  }

  function ages(s) {
    var owned = s.open.filter(function (x) { return x.owned; });
    var unowned = s.open.filter(function (x) { return !x.owned; });
    var counts = {};
    s.open.forEach(function (x) { var k = (x.owned ? 'o' : 'u') + x.bin; counts[k] = (counts[k] || 0) + 1; });
    var cap = 10;
    Object.keys(counts).forEach(function (k) { cap = Math.max(cap, counts[k]); });
    var exc = unowned.filter(function (x) { return x.mark === 'exc'; }).length;

    var lines = L.DKEYS.map(function (k, sev) {
      var d = s.p[k];
      return h('div', { class: 'ps-dl', dataset: { sev: String(sev), flip: String(d / SPAN > 0.72) },
        style: { left: at(d), top: (sev * 1.35) + 'rem' } },
        h('span', null, t('dlLabel', { sev: t('sev_' + sev), d: int(d) })));
    });
    var ticks = [];
    for (var a = 0; a <= L.DAYS; a += 30) ticks.push(h('span', { class: 'ps-tick ps-num', style: { left: at(a) } }, int(a)));

    return h('div', { class: 'ps-age', style: { '--cap': String(cap) } },
      h('div', { class: 'ps-ahead' },
        h('p', { class: 'ps-head' }, t('headAge')),
        btn('new', { 'aria-keyshortcuts': 'N' }, newStream, [t('newStream'), h('kbd', { 'aria-hidden': 'true' }, 'N')])),
      steppers(s),
      h('div', { class: 'ps-over', 'aria-hidden': 'true' }, lines),
      h('div', { class: 'ps-name', style: { gridRow: '4' } }, h('span', null, t('laneOwned')),
        h('small', null, t('laneSub', { n: int(owned.length) }))),
      h('div', { class: 'ps-lane', style: { gridRow: '4' } }, lane(owned, cap)),
      h('div', { class: 'ps-name', style: { gridRow: '5' } }, h('span', null, t('laneUnowned')),
        h('small', null, exc ? t('laneSubExc', { n: int(unowned.length), e: int(exc) }) : t('laneSub', { n: int(unowned.length) }))),
      s.p.unowned > 0
        ? h('div', { class: 'ps-lane', style: { gridRow: '5' } }, lane(unowned, cap))
        : h('div', { class: 'ps-lane', dataset: { empty: 'true' }, style: { gridRow: '5' } }, t('laneEmpty')),
      h('span', { class: 'ps-axname', style: { gridRow: '6' } }, t('axisAge')),
      h('div', { class: 'ps-axis', style: { gridRow: '6' } }, ticks));
  }

  function render(c) {
    var s = c.state;
    // a shortcut (N) re-renders the stage: a focused stage button keeps its focus
    var had = document.activeElement && c.stage.contains(document.activeElement) && document.activeElement.dataset
      ? document.activeElement.dataset.sel : null;
    if (refocus === null && had) refocus = had;
    c.stage.replaceChildren(h('div', { class: 'ps' },
      tiles(s), h('div', { class: 'ps-mid' }, where(s), kev(s)), ages(s), h('p', { class: 'ps-foot' }, t('foot'))));
    if (refocus !== null) {
      var el = c.stage.querySelector('[data-sel="' + refocus + '"]');
      refocus = null;
      if (el) el.focus();
    }
  }

  function caption(c) {
    var s = c.state, m = s.m, k = L.captionKey(s);
    var out = t.parts(k.key, {
      pct: b(pct1(m.inTime)),
      mean: b(t('daysAvg', { d: dec(m.meanFix) })),
      open: b(t.n('nVulns', m.open, { c: int(m.open) })),
      oldest: b(m.oldest ? days(m.oldest.age) : t('kNoneOpen')),
      iu: b(pct0(m.unownedItems / (m.items || 1))),
      eu: b(pct0(m.exposureUnowned / (m.exposure || 1)))
    });
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, {
        e: b(int(m.counts.excepted)), u: b(int(m.overdueUnowned)),
        a: b(exposure(s.kevBy.score)), b: b(exposure(s.kevBy.exploited)),
        p0: b(s.inTimeStd === null ? '' : pct1(s.inTimeStd)),
        p1: b(pct1(s.inTimeBy.score)), p2: b(pct1(s.inTimeBy.exploited))
      }));
    });
    return out;
  }

  var hidden = function () { return false; };
  var noUnowned = function (p) { return p.unowned === 0 ? t('noUnowned') : false; };
  var labels = { report: 'pReport', 'no-exc': 'pNoExc', dated: 'pDated', short: 'pShort', kev: 'pKev', tight: 'pTight' };
  var dayFmt = function (v) { return t('dShort', { d: int(v) }); };

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'order', type: 'choice', label: t('order'), options: [['score', t('orderScore')], ['exploited', t('orderKev')]] },
      { key: 'cap', type: 'range', label: t('cap'), min: 1, max: 6, step: 0.5, format: function (v) { return dec(v); } },
      { key: 'unowned', type: 'range', label: t('unowned'), min: 0, max: 6, step: 1 },
      { key: 'exc', type: 'choice', label: t('exc'), disabled: noUnowned,
        options: [['none', t('excNone')], ['open', t('excOpen')], ['dated', t('excDated')]] },
      { key: 'dCrit', type: 'range', label: t('dCrit'), min: L.DL_MIN[0], max: L.DL_MAX[0], step: 1, format: dayFmt, visible: hidden },
      { key: 'dHigh', type: 'range', label: t('dHigh'), min: L.DL_MIN[1], max: L.DL_MAX[1], step: 1, format: dayFmt, visible: hidden },
      { key: 'dMed', type: 'range', label: t('dMed'), min: L.DL_MIN[2], max: L.DL_MAX[2], step: 1, format: dayFmt, visible: hidden },
      { key: 'dLow', type: 'range', label: t('dLow'), min: L.DL_MIN[3], max: L.DL_MAX[3], step: 1, format: dayFmt, visible: hidden },
      { key: 'seed', type: 'range', label: t('newStream'), min: 1, max: L.SEED_MAX, step: 1, visible: hidden }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'ps-0', label: t('legCrit') },
      { shape: 'ps-1', label: t('legHigh') },
      { shape: 'ps-2', label: t('legMed') },
      { shape: 'ps-3', label: t('legLow') },
      { shape: 'ps-kev', label: t('legKev') },
      { shape: 'ps-exc', label: t('legExc') }
    ],
    keys: [{ key: 'n', label: t('newStream'), run: function () { newStream(); } }],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
