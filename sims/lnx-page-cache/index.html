     Dirty + Writeback with its two marks; below, the disk with its counters beside the free -m and /proc/meminfo
     listings; at the bottom, what happened, one line per event.

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills

      <div data-sd-presets></div>

<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var GAUGE_MAX = 400;   // MiB at the right end of the dirty gauge
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function mib(n) { return t('mib', { n: n }); }
  /** seconds with one decimal, in the page's language (9.4 / 9,4) */
  function sec(x) { return String(Math.round(x * 10) / 10).replace('.', t('decSep')); }
  function pad(v, w) { v = String(v); while (v.length < w) v = ' ' + v; return v; }
  function on(list, k) { return list.indexOf(k) >= 0 ? 'sd-changed' : null; }
  function clock(age) { return h('span', { class: 'pc-age' }, h('span', { class: 'pc-clock', 'aria-hidden': 'true' }), t('sec', { n: age })); }
  function lostBadge() { return h('span', { class: 'pc-x', 'aria-hidden': 'true' }, '✕'); }

  // ── the RAM bar and the dirty gauge ──

  function segLabel(seg, st) {
    var lost = st.power && st.lost > 0 && (seg.id === 'dirty' || seg.id === 'wb');
    switch (seg.id) {
      case 'read': return [h('b', { translate: 'no' }, 'a.dat'), h('span', null, mib(seg.size))];
      case 'written': return [h('b', { translate: 'no' }, 'b.dat'), h('span', null, mib(seg.size))];
      case 'wb': return [h('b', null, '→ ', t('segWb')), h('span', null, mib(seg.size), lost ? [' ', lostBadge()] : null)];
      case 'dirty': return [h('b', null, t('segDirty')), h('span', null, mib(seg.size), lost ? [' ', lostBadge()] : null), clock(st.age)];
      default:
        var name = { proc: 'segProc', fixed: 'segFixed', old: 'segOld', free: 'segFree' }[seg.id];
        return [h('b', null, t(name)), h('span', null, mib(seg.size))];
    }
  }

  function ram(st, chg) {
    var bar = h('div', { class: 'pc-bar', role: 'img', 'aria-label': t('ram') + ' ' + mib(st.total) },
      L.segments(st).map(function (seg) {
        var lost = st.power && st.lost > 0 && (seg.id === 'dirty' || seg.id === 'wb');
        return h('div', {
          class: 'pc-seg ' + (on(chg.seg, seg.id) || ''),
          dataset: lost ? { k: seg.id, lost: '' } : { k: seg.id },
          style: { flex: seg.size + ' 0 0' },
          title: mib(seg.size)
        }, segLabel(seg, st));
      }));
    var total = st.dirty + st.writeback;
    var pctOf = function (n) { return Math.min(100, n / GAUGE_MAX * 100) + '%'; };
    var mark = function (n, ratio, key) {
      return h('div', { class: 'pc-mark', dataset: { k: key === 'markBg' ? 'bg' : 'limit' }, style: { left: pctOf(n) } },
        h('span', null, t('pct', { n: ratio }), ' · ', mib(n), h('small', null, ' ', t(key))));
    };
    var gauge = h('div', { class: 'pc-gauge', role: 'img', 'aria-label': t('gauge') + ' ' + mib(total) },
      st.dirty ? h('div', { class: 'pc-gfill', dataset: { k: 'dirty' }, style: { width: pctOf(st.dirty) } }) : null,
      st.writeback ? h('div', { class: 'pc-gfill', dataset: { k: 'wb' }, style: { width: pctOf(st.writeback) } }) : null,
      mark(st.th.bg, st.th.bgRatio, 'markBg'),
      mark(st.th.limit, st.th.ratio, 'markLimit'),
      h('span', { class: 'pc-gnum' }, mib(total), st.throttled ? h('span', { class: 'pc-thr' }, ' · ', t('throttled')) : null));
    return h('section', { class: 'pc-box' },
      h('div', { class: 'pc-barrow' }, h('div', { class: 'pc-barname' }, t('ram'), h('small', null, mib(st.total))), bar),
      st.power ? h('p', { class: 'pc-power' }, t('powerBanner', { t: sec(st.powerAt) }))
        : h('p', { class: 'pc-avail' }, t('availLine', { free: st.free, cache: st.clean + st.dirty + st.writeback, avail: st.available })),
      h('div', { class: 'pc-barrow' }, h('div', { class: 'pc-barname' }, t('gauge')),
        gauge));
  }

  // ── the disk, free -m and /proc/meminfo ──

  function disk(st, chg) {
    var files = [];
    if (st.readSize) files.push(h('li', null, h('span', { class: 'pc-fname', translate: 'no' }, 'a.dat'),
      h('span', null, mib(st.readSize) + ' · ' + t('onDisk'))));
    if (st.writeSize) files.push(h('li', null, h('span', { class: 'pc-fname', translate: 'no' }, 'b.dat'),
      h('span', null, t('partOnDisk', { n: st.diskWritten, m: st.writeSize })),
      st.lost ? h('span', { class: 'pc-lost' }, lostBadge(), t('lostPart', { n: st.lost })) : null));
    var busy = st.writeback > 0 && !st.power;
    return h('section', { class: 'pc-box pc-disk' },
      h('h3', null, t('disk'), h('span', { class: 'pc-busy', dataset: { k: busy ? 'busy' : 'idle' } }, t(busy ? 'diskBusy' : 'diskIdle'))),
      h('dl', null,
        h('dt', null, t('diskRead')), h('dd', { class: on(chg.disk, 'diskRead') }, mib(st.diskRead)),
        h('dt', null, t('diskWritten')), h('dd', { class: on(chg.disk, 'diskWritten') }, mib(st.diskWritten))),
      files.length ? h('ul', { class: 'pc-files' }, files) : null);
  }

  function freeM(st, chg) {
    var cell = function (v, w, k) { return h('b', { class: on(chg.mem, k) }, pad(v, w)); };
    return h('section', { class: 'pc-box' },
      h('pre', { class: 'pc-console', translate: 'no' },
        h('span', { class: 'pc-prompt' }, '$ '), 'free -m\n',
        '      total  used  free shared buff/cache available\n',
        'Mem:  ', pad(st.total, 5), ' ', cell(st.used, 5, 'used'), ' ', cell(st.free, 5, 'free'),
        '      0 ', cell(st.cache, 10, 'cache'), ' ', cell(st.available, 9, 'available')));
  }

  function meminfo(st, chg) {
    var line = function (name, v) {
      var text = (name + ':').padEnd(14) + pad(v * 1024, 9) + ' kB';
      return [h('b', { class: on(chg.info, name) }, text), '\n'];
    };
    return h('section', { class: 'pc-box' },
      h('pre', { class: 'pc-console', translate: 'no' },
        h('span', { class: 'pc-prompt' }, '$ '), 'cat /proc/meminfo  ', h('span', { class: 'pc-prompt' }, '# …'), '\n',
        line('MemFree', st.free), line('MemAvailable', st.available), line('Cached', st.cache),
        line('Dirty', st.dirty), line('Writeback', st.writeback).slice(0, 1)));
  }

  // ── what happened ──

  function eventText(e) {
    switch (e.kind) {
      case 'read': return [data('a.dat'), ': ', t('evRead', { size: e.size }), e.evicted ? ', ' + t('evEvicted', { n: e.evicted }) : '',
        e.again ? '; ' + t('evReread') : ''];
      case 'write': return [data('b.dat'), ': ', t('evWrite', { size: e.size }), e.evicted ? ', ' + t('evEvicted', { n: e.evicted }) : '', '; ',
        e.returnedAt > 0 ? t('evReturnedAt', { s: sec(e.returnedAt) }) : t('evReturnedNow')];
      case 'background': return t('evBackground', { mark: e.mark });
      case 'throttle': return t('evThrottle', { limit: e.limit, until: sec(e.until) });
      case 'expire': return t('evExpire', { tick: e.tick, size: e.size });
      case 'sync': return t('evSync', { size: e.size, took: sec(e.took) });
      case 'drop': return t('evDrop', { size: e.size }) + (e.kept ? ', ' + t('evDropKept', { kept: e.kept }) : '');
      case 'power': return t('evPower', { lost: e.lost });
    }
    return '';
  }

  /** the model's events, with a re-read folded into its read's line */
  function events(st) {
    var again = st.events.some(function (e) { return e.kind === 'reread'; });
    return st.events.filter(function (e) { return e.kind !== 'reread'; })
      .map(function (e) { return e.kind === 'read' ? Object.assign({ again: again }, e) : e; });
  }

  function trace(st) {
    return h('section', { class: 'pc-box pc-trace' },
      h('h3', null, t('trace')),
      st.events.length
        ? h('ol', { class: 'pc-events' }, events(st).map(function (e) { return h('li', { dataset: { k: e.kind === 'power' && e.lost ? 'lost' : e.kind } }, eventText(e)); }))
        : h('p', { class: 'pc-empty' }, t('noEvents')));
  }

  // ── render; "changed" compares with the state before the last param change ──

  var lastKey = null, shown = null, chg = L.changed(null, null);
  function track(c) {
    var k = JSON.stringify(c.params);
    if (k !== lastKey) {
      chg = L.changed(shown, c.state);
      lastKey = k;
    }
    shown = c.state;
  }

  function render(c) {
    track(c);
    var st = c.state;
    c.stage.replaceChildren(h('div', { class: 'pc' },
      ram(st, chg),
      h('div', { class: 'pc-mid' }, freeM(st, chg), meminfo(st, chg), disk(st, chg)),
      trace(st)));
  }

  function caption(c) {
    var st = c.state;
    var k = L.captionKey(st);
    var b = function (x) { return h('b', null, String(x)); };
    var vars = {
      free: b(st.free), avail: b(st.available), bc: b(st.cache), cache: b(st.clean + st.dirty + st.writeback),
      size: b(k === 'cRead' || k === 'cReread' ? st.readSize : st.writeSize), disk: b(st.diskRead), twice: b(st.readSize * 2),
      dirty: b(st.dirty), wb: b(st.writeback), written: b(st.diskWritten), age: b(st.seconds), bg: b(st.th.bg),
      limit: b(st.th.limit), ret: b(sec(st.returnedAt)), tick: b(st.expiredAt), t: b(sec(st.powerAt)), lost: b(st.lost),
      n: b(k === 'cDrop' ? st.dropped : (st.events.filter(function (e) { return e.kind === 'sync'; })[0] || { size: 0 }).size),
      took: b(sec(st.syncTook || 0)), kept: b(st.dirty + st.writeback)
    };
    var out = t.parts(k, vars);
    if (k === 'cDrop' && st.dirty + st.writeback > 0) out = out.concat([' '], t.parts('cDropKept', vars));
    return out;
  }

  var labels = {
    'book-free': 'pBookFree', 'read-twice': 'pReadTwice', 'small-write': 'pSmallWrite',
    'big-write': 'pBigWrite', 'drop-caches': 'pDropCaches', 'power-loss': 'pPowerLoss'
  };

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'readMiB', type: 'range', label: t('readMiB'), min: 0, max: 800, step: 50, format: function (v) { return v ? mib(v) : t('none'); } },
      { key: 'writeMiB', type: 'range', label: t('writeMiB'), min: 0, max: 500, step: 25, format: function (v) { return v ? mib(v) : t('none'); } },
      { key: 'seconds', type: 'range', label: t('seconds'), min: 0, max: 60, step: 5, format: function (v) { return t('sec', { n: v }); } },
      { key: 'ratios', type: 'choice', label: t('ratios'), options: [['10/20', '10 / 20 %'], ['5/10', '5 / 10 %']] },
      { key: 'reread', type: 'toggle', label: t('reread') },
      { key: 'sync', type: 'toggle', label: t('sync') },
      { key: 'dropCaches', type: 'toggle', label: t('dropCaches') },
      { key: 'powerLoss', type: 'toggle', label: t('powerLoss') }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'pc-proc', label: t('legProc') },
      { shape: 'pc-fixed', label: t('legFixed') },
      { shape: 'pc-clean', label: t('legClean') },
      { shape: 'pc-dirty', label: t('legDirty') },
      { shape: 'pc-wb', label: t('legWb') },
      { shape: 'pc-free', label: t('legFree') },
      { shape: 'dash', label: t('legMark') },
      { shape: 'pc-lost', label: t('legLost') },
      { shape: 'hl', label: t('legChanged') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
</html>
