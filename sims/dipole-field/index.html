<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // ── numbers in the page's language: a decimal comma and a true minus sign ──
  function num(x, d) {
    var v = Number(x).toFixed(d);
    if (Number(v) === 0) v = Number(0).toFixed(d);
    v = v.replace('-', '−');
    return Simdeck.lang === 'hr' ? v.replace('.', ',') : v;
  }
  function sig(x, n) {                       // n significant digits, never exponent notation
    var a = Math.abs(x);
    if (a === 0) return num(0, n - 1);
    var d = Math.max(0, n - 1 - Math.floor(Math.log10(a)));
    return num(x, Math.min(d, 6));
  }
  function lam(r) { return num(r, 2); }
  function metres(m) { return num(m, 1) + ' m'; }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    (function add(list) {
      for (var i = 0; i < list.length; i++) {
        if (Array.isArray(list[i])) add(list[i]);
        else if (list[i] != null) e.append(list[i]);
      }
    })(Array.prototype.slice.call(arguments, 2));
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize) || 16; }
  function arrowHead(x, y, ux, uy, size, cls) {
    var hw = 0.55 * size;
    return s('polygon', { class: cls, points: [
      [x, y], [x - ux * size - uy * hw, y - uy * size + ux * hw], [x - ux * size + uy * hw, y - uy * size - ux * hw]
    ].map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ') });
  }

  // ── the picture: field lines on a canvas, everything else in SVG on top ──
  var R_CLIP = 0.05;                                   // λ: no lines drawn this close to the dipole
  function view(W, H) {
    var sc = Math.min(H / 1.65, W / 1.75);             // px per λ: ±0.825 λ tall, ≥ 1.75 λ wide (−0.13 … 1.62 λ)
    var x1 = L.R_MAX + 0.12, x0 = x1 - W / sc, zTop = H / (2 * sc);
    return { sc: sc, x0: x0, x1: x1, zTop: zTop, X: function (x) { return (x - x0) * sc; }, Y: function (z) { return (zTop - z) * sc; } };
  }

  function drawLines(canvas, W, H, v, p) {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var cell = 4.5 / v.sc;                              // grid cell ≈ 4.5 px
    var spec = { x0: v.x0 - cell, z0: -v.zTop - cell, d: cell, nx: Math.ceil(W / 4.5) + 2, nz: Math.ceil(H / 4.5) + 2, rClip: R_CLIP };
    var sets = L.fieldLines(p, spec);
    var pos = Simdeck.cssVar('--c2'), neg = Simdeck.cssVar('--c1');
    ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    sets.forEach(function (st) {
      ctx.strokeStyle = st.level > 0 ? pos : neg;
      ctx.setLineDash(st.level > 0 ? [] : [7, 5]);
      ctx.beginPath();
      st.lines.forEach(function (ln) {
        ctx.moveTo(v.X(ln[0][0]), v.Y(ln[0][1]));
        for (var i = 1; i < ln.length; i++) ctx.lineTo(v.X(ln[i][0]), v.Y(ln[i][1]));
      });
      ctx.stroke();
    });
    return spec;
  }

  function drawPicture(box, c) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), p = c.params, st = c.state, v = view(W, H), X = v.X, Y = v.Y, sc = v.sc;
    var canvas = h('canvas', { 'aria-hidden': 'true' });
    var spec = drawLines(canvas, W, H, v, p);
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });

    // the pinch: the separatrix through each X point, then the × itself
    st.pinch.forEach(function (rx) {
      var g = L.HD.grid(spec, p.t * Math.PI / 180, st.inf);
      var lvl = L.HD.stream(2 * Math.PI * rx, Math.PI / 2, p.t * Math.PI / 180, st.inf);
      // only the pieces through the X point (the same level also runs elsewhere in the picture)
      L.HD.contour(g, lvl).filter(function (ln) {
        return ln.some(function (q) { return Math.abs(Math.abs(q[0]) - rx) < 3 * spec.d && Math.abs(q[1]) < 3 * spec.d; });
      }).forEach(function (ln) {
        svg.append(s('polyline', { class: 'df-sep', points: ln.map(function (q) { return X(q[0]).toFixed(1) + ',' + Y(q[1]).toFixed(1); }).join(' ') }));
      });
    });

    // the direction of E where the lines cross the broadside line: small arrowheads, one per crossing
    var lastX = -1e9;
    L.crossings(p, 0.12, v.x1).forEach(function (q) {
      var px = X(q.r);
      if (px - lastX < 0.75 * r0) return;
      lastX = px;
      svg.append(arrowHead(px, Y(0) + (q.up ? -0.42 : 0.42) * r0, 0, q.up ? -1 : 1, 0.62 * r0, q.level > 0 ? 'df-pos' : 'df-neg'));
    });

    // zones: dashed circles at λ/2π and λ, names above the ruler (c finite and the switch on)
    var showZones = p.zones && !st.inf;
    if (showZones) {
      [st.near, st.far].forEach(function (r) { svg.append(s('circle', { class: 'df-zone', cx: X(0), cy: Y(0), r: r * sc })); });
    }

    // the clipped disc and the dipole: a short wire, its end charges (sign and size from q) and the current arrow
    svg.append(s('circle', { class: 'df-clip', cx: X(0), cy: Y(0), r: R_CLIP * sc }));
    var half = Math.max(1.1 * r0, 0.035 * sc), cx = X(0), cy = Y(0);
    svg.append(s('line', { class: 'df-wire', x1: cx, x2: cx, y1: cy - half, y2: cy + half }));
    var q = st.dipole.q, rq = 0.3 * r0 + 0.42 * r0 * Math.abs(q);
    if (Math.abs(q) > 0.05) {
      [[-1, q > 0], [1, q < 0]].forEach(function (e) {
        var y = cy + e[0] * half;
        svg.append(s('circle', { class: e[1] ? 'df-qpos' : 'df-qneg', cx: cx, cy: y, r: rq }));
        if (Math.abs(q) > 0.45) svg.append(s('text', { class: 'df-sign', x: cx, y: y + 0.36 * r0, 'text-anchor': 'middle' }, e[1] ? '+' : '−'));
      });
    }
    if (Math.abs(st.dipole.i) > 0.05) {
      var up = st.dipole.i > 0, len = 0.9 * half * Math.abs(st.dipole.i), ax = cx - 0.95 * r0;
      svg.append(s('line', { class: 'df-cur', x1: ax, x2: ax, y1: cy + (up ? len : -len), y2: cy + (up ? -len : len) * 0.55 }));
      svg.append(arrowHead(ax, cy + (up ? -len : len), 0, up ? -1 : 1, 0.6 * r0, 'df-head'));
      svg.append(s('text', { class: 'df-halo', x: ax - 0.45 * r0, y: cy + 0.35 * r0, 'text-anchor': 'end' }, 'I'));
    }

    // the × of each X point, with its label
    st.pinch.forEach(function (rx, i) {
      [rx, -rx].forEach(function (xx) {                 // and its mirror image on the other side of the dipole
        var px = X(xx), py = Y(0), k = 0.55 * r0;
        if (px < k) return;
        [['df-xhalo'], ['df-x']].forEach(function (cl) {
          svg.append(s('line', { class: cl[0], x1: px - k, y1: py - k, x2: px + k, y2: py + k }));
          svg.append(s('line', { class: cl[0], x1: px - k, y1: py + k, x2: px + k, y2: py - k }));
        });
      });
      if (i === 0) svg.append(s('text', { class: 'df-halo df-title', x: X(rx) - 0.2 * r0, y: Y(0) + 2.3 * r0 }, t('pinchLabel')));
    });

    // the probe: a diamond, E as a vertical arrow scaled by e/|E|, H as a ring with a dot (out of the page) or a cross
    var pr = st.probe, px = X(pr.r), py = Y(0), kk = 0.62 * r0;
    var ef = pr.E > 0 ? pr.e / pr.E : 0, hf = pr.H > 0 ? pr.h / pr.H : 0;
    if (Math.abs(ef) > 0.04) {
      var ey = py + ef * 3.2 * r0;                      // E_θ > 0 points down (θ̂ = −z on the broadside line)
      svg.append(s('line', { class: 'df-earrow', x1: px, y1: py, x2: px, y2: ey - Math.sign(ef) * 0.4 * r0 }));
      svg.append(arrowHead(px, ey, 0, Math.sign(ef), 0.75 * r0, 'df-head'));
      svg.append(s('text', { class: 'df-halo df-title', x: px + 0.6 * r0, y: ey + (ef > 0 ? 0 : 0.9 * r0) }, t('eLabel')));
    }
    var side = px + 3.8 * r0 > W ? -1 : 1;              // H on the right of the probe, or on its left near the edge
    var hx = px + side * 2.4 * r0, hy = py - 1.7 * r0, hr = 0.25 * r0 + 0.65 * r0 * Math.abs(hf);
    svg.append(s('circle', { class: 'df-hring', cx: hx, cy: hy, r: hr }));
    if (hf < -0.04) svg.append(s('circle', { class: 'df-hdot', cx: hx, cy: hy, r: Math.max(2.5, 0.3 * hr) }));
    else if (hf > 0.04) {
      var m = 0.6 * hr;
      svg.append(s('line', { class: 'df-hmark', x1: hx - m, y1: hy - m, x2: hx + m, y2: hy + m }));
      svg.append(s('line', { class: 'df-hmark', x1: hx - m, y1: hy + m, x2: hx + m, y2: hy - m }));
    }
    svg.append(s('text', { class: 'df-halo df-title', x: hx + side * 1.2 * r0, y: hy + 0.35 * r0, 'text-anchor': side > 0 ? 'start' : 'end' }, t('hLabel')));
    svg.append(s('polygon', { class: 'df-probe', points: [[px, py - kk * 1.25], [px + kk * 1.25, py], [px, py + kk * 1.25], [px - kk * 1.25, py]].map(function (a) { return a.join(','); }).join(' ') }));

    // the ruler along the bottom, in wavelengths, with the zone names over it
    var ry = H - 1.9 * r0;
    svg.append(s('line', { class: 'df-ruler', x1: X(0), x2: X(L.R_MAX), y1: ry, y2: ry }));
    var ticks = [[0, '0'], [0.5, t('tickLambda', { n: num(0.5, 1) })], [1, 'λ'], [1.5, t('tickLambda', { n: num(1.5, 1) })]];
    if (showZones) ticks.splice(1, 0, [st.near, t('tickNear')]);
    ticks.forEach(function (tk) {
      svg.append(s('line', { class: 'df-tick', x1: X(tk[0]), x2: X(tk[0]), y1: ry - 0.35 * r0, y2: ry + 0.35 * r0 }));
      svg.append(s('text', { class: 'df-halo', x: X(tk[0]), y: ry + 1.45 * r0, 'text-anchor': tk[0] === L.R_MAX ? 'end' : 'middle' }, tk[1]));
    });
    var zy = ry - 0.7 * r0;
    if (showZones) {
      var placed = [];
      var wn = 0.56 * r0 * t('zoneNear').length;
      [[Math.max(X(0), wn / 2 + 0.4 * r0), Y(st.near) - 0.5 * r0, 'zoneNear'], [X((st.near + st.far) / 2), zy, 'zoneMid'], [X((st.far + L.R_MAX) / 2), zy, 'zoneFar']].forEach(function (z) {
        var w = 0.56 * r0 * t(z[2]).length, a = z[0] - w / 2, b2 = z[0] + w / 2;   // bold 16 px: about 0.56 em a letter
        if (a < 0.3 * r0 || b2 > W - 0.3 * r0) return;
        if (placed.some(function (q) { return Math.abs(q[2] - z[1]) < r0 && a < q[1] && b2 > q[0]; })) return;
        placed.push([a, b2, z[1]]);
        svg.append(s('text', { class: 'df-halo df-title', x: z[0], y: z[1], 'text-anchor': 'middle' }, t(z[2])));
      });
    } else if (st.inf && p.zones) {
      svg.append(s('text', { class: 'df-halo df-title', x: X(1), y: zy, 'text-anchor': 'middle' }, t('zoneAll')));
    }
    svg.append(s('text', { class: 'df-halo', x: W - 0.5 * r0, y: 1.4 * r0, 'text-anchor': 'end' }, t('lambdaNote')));
    if (st.inf) svg.append(s('text', { class: 'df-big df-halo', x: 0.6 * r0, y: 1.7 * r0 }, t('cInf')));

    box.replaceChildren(canvas, svg);
  }

  // ── plot 1: E and H at the probe over one period, each over its own amplitude ──
  function drawPeriod(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem(), data = L.period(st.probe.r, st.inf);
    var pad = { l: 3.4 * r0, r: 0.6 * r0, t: 2.2 * r0, b: 1.4 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var X = function (d) { return pad.l + d / 360 * cw; }, Y = function (y) { return pad.t + ch * (1 - (y + 1.1) / 2.2); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'df-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    [0, 90, 180, 270].forEach(function (d) {
      if (d) svg.append(s('line', { class: 'df-grid', x1: X(d), x2: X(d), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(d), y: H - 0.15 * r0, 'text-anchor': 'middle' }, String(d)));
    });
    svg.append(s('text', { x: pad.l + cw, y: H - 0.15 * r0, 'text-anchor': 'end' }, t('plotDeg')));
    svg.append(s('line', { class: 'df-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    [[1, t('max')], [-1, t('min')]].forEach(function (yv) { svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(yv[0]) + 0.32 * r0, 'text-anchor': 'end' }, yv[1])); });
    svg.append(s('text', { class: 'df-title', x: pad.l, y: pad.t - 0.95 * r0 }, t('plotTime')));
    // E_θ and H_φ as they are (E along θ̂, H along φ̂): in phase they coincide, and a lead shows as the earlier peak
    svg.append(s('polyline', { class: 'df-sH', points: data.map(function (q) { return X(q.t).toFixed(1) + ',' + Y(q.h).toFixed(1); }).join(' ') }));
    svg.append(s('polyline', { class: 'df-sE', points: data.map(function (q) { return X(q.t).toFixed(1) + ',' + Y(q.e).toFixed(1); }).join(' ') }));
    svg.append(s('line', { class: 'df-now', x1: X(st.t), x2: X(st.t), y1: pad.t, y2: pad.t + ch }));
    box.replaceChildren(svg);
  }

  // ── plot 2: |E| and 377 Ω·|H| against distance, log–log, with the zones and the probe ──
  var profKey = '', profData = null;
  function drawDistance(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r0 = rem();
    if (profKey !== String(st.inf)) { profKey = String(st.inf); profData = L.profile(st.inf); }
    var data = profData, lo = Infinity, hi = -Infinity;
    data.forEach(function (d) { lo = Math.min(lo, d.E, d.etaH); hi = Math.max(hi, d.E, d.etaH); });
    var y0 = Math.floor(Math.log10(lo)), y1 = Math.ceil(Math.log10(hi));
    var pad = { l: 3.4 * r0, r: 0.6 * r0, t: 2.2 * r0, b: 1.4 * r0 };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b, lr0 = Math.log10(L.R_MIN), lr1 = Math.log10(L.R_MAX);
    var X = function (r) { return pad.l + (Math.log10(r) - lr0) / (lr1 - lr0) * cw; };
    var Y = function (v) { return pad.t + ch * (1 - (Math.log10(v) - y0) / (y1 - y0)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'df-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    var stepY = y1 - y0 > 4 ? 2 : 1;
    for (var e = y0; e <= y1; e += stepY) {
      if (e > y0 && e < y1) svg.append(s('line', { class: 'df-grid', x1: pad.l, x2: pad.l + cw, y1: Y(Math.pow(10, e)), y2: Y(Math.pow(10, e)) }));
      svg.append(s('text', { x: pad.l - 0.3 * r0, y: Y(Math.pow(10, e)) + 0.32 * r0, 'text-anchor': 'end' }, sig(Math.pow(10, e), 1)));
    }
    [0.1, 1].forEach(function (r) {
      svg.append(s('line', { class: 'df-grid', x1: X(r), x2: X(r), y1: pad.t, y2: pad.t + ch }));
      svg.append(s('text', { x: X(r), y: H - 0.15 * r0, 'text-anchor': 'middle' }, num(r, r < 1 ? 1 : 0)));
    });
    if (!st.inf) [st.near, st.far].forEach(function (r) { svg.append(s('line', { class: 'df-gzone', x1: X(r), x2: X(r), y1: pad.t, y2: pad.t + ch })); });
    svg.append(s('text', { class: 'df-title', x: pad.l, y: pad.t - 0.95 * r0 }, t('plotDist')));
    svg.append(s('polyline', { class: 'df-sH', points: data.map(function (d) { return X(d.r).toFixed(1) + ',' + Y(d.etaH).toFixed(1); }).join(' ') }));
    svg.append(s('polyline', { class: 'df-sE', points: data.map(function (d) { return X(d.r).toFixed(1) + ',' + Y(d.E).toFixed(1); }).join(' ') }));
    // slope labels: near the left end E 1/r³ and H 1/r², at the right end 1/r (c finite) or the same again (c infinite)
    var a = data[6], b = data[data.length - 8];
    svg.append(s('text', { class: 'df-halo', x: X(a.r) + 0.4 * r0, y: Y(a.E) - 0.2 * r0 }, t('slope3')));
    svg.append(s('text', { class: 'df-halo', x: X(a.r) + 0.4 * r0, y: Y(a.etaH) + 1.1 * r0 }, t('slope2')));
    if (st.inf) {
      svg.append(s('text', { class: 'df-halo', x: X(b.r), y: Y(b.E) + 1.2 * r0, 'text-anchor': 'end' }, t('slope3')));
      svg.append(s('text', { class: 'df-halo', x: X(b.r), y: Y(b.etaH) - 0.4 * r0, 'text-anchor': 'end' }, t('slope2')));
    } else {
      svg.append(s('text', { class: 'df-halo', x: X(b.r), y: Y(b.E) - 0.5 * r0, 'text-anchor': 'end' }, t('slope1')));
    }
    var pr = st.probe;
    svg.append(s('line', { class: 'df-now', x1: X(pr.r), x2: X(pr.r), y1: pad.t, y2: pad.t + ch }));
    box.replaceChildren(svg);
  }

  // ── the readout table ──
  function table(st) {
    var pr = st.probe;
    function row(label, value, key, word) {
      return h('tr', { class: key ? 'df-key' : null }, h('th', { scope: 'row' }, label), h('td', { class: word ? 'df-word' : null }, value));
    }
    var zone = st.inf ? t('zoneAll') : t(st.zone === 'near' ? 'zoneNear' : st.zone === 'mid' ? 'zoneMid' : 'zoneFar');
    return h('table', { class: 'df-table' }, h('tbody', null,
      row(t('rowR'), t('valR', { r: lam(pr.r), m: metres(pr.metres) })),
      row(t('rowKr'), num(pr.kr, 2)),
      row(t('rowZone'), zone, false, true),
      row(t('rowE'), t('vm', { v: sig(pr.E, 3) })),
      row(t('rowH'), t('mam', { v: sig(pr.H * 1000, 3) })),
      row(t('rowZ'), t('ohm', { v: num(pr.Z, 0) }), true),
      row(t('rowLead'), t('deg', { v: num(pr.lead, Math.abs(pr.lead) < 10 ? 1 : 0) }), true),
      row(t('rowP'), t('mw', { v: num(pr.P * 1000, 0) }))));
  }

  // ── play: time runs round the period. Page state, not model state: a link opens still. ──
  var playing = false, lastT = 0, ownSet = false;
  function every() { return Simdeck.reducedMotion() ? 1000 : 70; }  // ms between frames
  function setT(v) {
    v = ((Math.round(v / L.T_STEP) * L.T_STEP) % 360 + 360) % 360;
    if (v !== sim.params.t) { ownSet = true; sim.set({ t: v }); ownSet = false; }
  }
  function frame(now) {
    if (!playing) return;
    if (now - lastT >= every()) {
      lastT = now;
      setT(sim.params.t + (Simdeck.reducedMotion() ? 45 : L.T_STEP));
    }
    requestAnimationFrame(frame);
  }
  var playBtn = h('button', { type: 'button', class: 'sd-btn sd-btn--primary', 'aria-keyshortcuts': 'p', title: t('playHint') + ' (P)',
    onmousedown: function (e) { e.preventDefault(); }, onclick: function () { toggle(); } });
  function playLabel() {
    var lbl = playing ? t('pause') : t('play');
    playBtn.replaceChildren(Simdeck.icon(playing ? 'pause' : 'play'), h('span', { class: 'sd-btn-label' }, lbl), h('kbd', null, 'P'));
    playBtn.setAttribute('aria-label', lbl);
    playBtn.setAttribute('aria-pressed', playing ? 'true' : 'false');
  }
  function start() { playing = true; lastT = performance.now(); playLabel(); requestAnimationFrame(frame); }
  function stop() { if (!playing) return; playing = false; playLabel(); }
  function toggle() { if (playing) stop(); else start(); }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'c', type: 'choice', label: t('c'), options: [['finite', t('c_finite')], ['inf', t('c_inf')]] },
      { key: 'r', type: 'range', label: t('r'), min: L.R_MIN, max: L.R_MAX, step: L.R_STEP,
        format: function (v) { return t('rVal', { r: lam(v), m: metres(v * L.LAMBDA) }); } },
      { key: 'zones', type: 'toggle', label: t('zones') },
      // time: in the URL like any param, but scrubbed from the transport bar (below), not from the panel
      { key: 't', type: 'range', label: t('t'), min: 0, max: 360 - L.T_STEP, step: L.T_STEP, visible: function () { return false; } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t('preset_' + x.id), hint: t('preset_' + x.id + 'Hint'), params: x.params }; }),
    keys: [
      { key: 'P', label: t('playKey'), run: toggle },
      { key: 'ArrowRight', label: t('keyFwd'), run: function () {} },
      { key: 'ArrowLeft', label: t('keyBack'), run: function () {} }
    ],
    legend: [
      { shape: 'df-pos', label: t('legendPos') },
      { shape: 'df-neg', label: t('legendNeg') },
      { shape: 'df-x', label: t('legendX') },
      { shape: 'df-probe', label: t('legendProbe') }
    ],

    render: function (c) {
      var pic = h('div', { class: 'df-pic' }), p1 = h('div', { class: 'df-plot' }), p2 = h('div', { class: 'df-plot' });
      var keys = h('p', { class: 'df-keys' },
        h('span', null, h('span', { class: 'df-key-e' }), t('seriesE')),
        h('span', null, h('span', { class: 'df-key-h' }), t('seriesHn')));
      c.stage.replaceChildren(h('div', { class: 'df' }, pic,
        h('div', { class: 'df-side' }, table(c.state), h('p', { class: 'df-units' }, t('units')), keys, p1, p2)));
      drawPicture(pic, c);
      drawPeriod(p1, c.state);
      drawDistance(p2, c.state);
    },

    caption: function (c) {
      var st = c.state, pr = st.probe;
      var b = function (x) { return h('b', null, x); };
      var deg = function (v) { return t('deg', { v: num(v, Math.abs(v) < 10 && v !== 0 ? 1 : 0) }); };
      var pct = function (v) { return num(Math.round(v * 100), 0) + ' %'; };
      var vars = {
        t: b(t('deg', { v: num(st.t, 0) })), q: b(pct(st.dipole.q)), i: b(pct(st.dipole.i)),
        r: b(lam(pr.r) + ' λ'), Z: b(t('ohm', { v: num(pr.Z, 0) })), lead: b(deg(pr.lead))
      };
      var key = st.t % 180 === 0 ? 'cap_peak' : st.t % 180 === 90 ? 'cap_zero' : 'cap_mid';
      var parts = t.parts(key, vars).concat([' ']);
      if (st.inf) parts = parts.concat(t.parts('cap_inf', vars));
      else if (st.pinch.length) parts = parts.concat(t.parts('cap_pinch', Object.assign({}, vars, { r: b(lam(st.pinch[0]) + ' λ') })));
      else parts = parts.concat(t.parts('cap_lines', Object.assign({}, vars, { r: b(lam(st.pinchR) + ' λ') })));
      parts.push(' ');
      return parts.concat(t.parts(st.inf ? 'p_inf' : 'p_' + st.zone, vars));
    }
  });

  // The play button sits in the transport bar, before the kit's reset (an explorer's bar has only that), and the time
  // scrubber after them, where a stepper has its step scrubber.
  var scrub = h('input', { type: 'range', class: 'sd-range', min: 0, max: 360 - L.T_STEP, step: L.T_STEP, 'aria-label': t('t') });
  var count = h('span', { class: 'sd-count', 'aria-hidden': 'true' });
  var byPointer = false;
  scrub.addEventListener('pointerdown', function () { byPointer = true; });
  scrub.addEventListener('change', function () { if (byPointer) { byPointer = false; scrub.blur(); } });
  scrub.addEventListener('input', function () { stop(); setT(Number(scrub.value)); });
  function syncScrub() {
    var v = sim.params.t;
    scrub.value = String(v);
    scrub.setAttribute('aria-valuetext', t('tNow', { v: num(v, 0) }));
    count.textContent = t('tNow', { v: num(v, 0) });
  }
  (function () {
    var g = document.querySelector('[data-sd-transport] .sd-tgroup');
    playLabel();
    if (g) {
      g.prepend(playBtn);
      g.after(h('div', { class: 'sd-scrub' }, count, scrub));
    }
    syncScrub();
  })();
  sim.on(syncScrub);
  // A preset stops the clock; a hand change while playing carries on from there.
  sim.on(function () { if (playing && !ownSet && sim.preset) stop(); });

  // Time keys. An explorer gets no step keys from the kit, so → / PgDn and ← / PgUp move time by 15° here (round the
  // period), Home and End to the slider's ends (arrows stay with a focused slider or choice; PgDn and PgUp always step).
  document.addEventListener('keydown', function (e) {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (document.querySelector('dialog[open]')) return;
    var blank = document.querySelector('.sd-blank');
    if (blank && !blank.hidden) return;
    var tg = e.target, owns = tg instanceof HTMLElement && !!tg.closest('input, select, textarea, [role="slider"], [role="tablist"]');
    var k = e.key, d = 0;
    if (k === 'PageDown' || (k === 'ArrowRight' && !owns)) d = 1;
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !owns)) d = -1;
    else if (k === 'Home' && !owns) { e.preventDefault(); stop(); setT(0); return; }
    else if (k === 'End' && !owns) { e.preventDefault(); stop(); setT(360 - L.T_STEP); return; }
    if (!d) return;
    e.preventDefault();
    stop();
    setT(sim.params.t + d * L.KEY_STEP);
  });

  // The drawing is in pixels (text at 1:1), so it is redrawn when the stage changes size or the theme changes.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
  Simdeck.onTheme(function () { sim.render(); });
})();
</script>
</body>
</html>
