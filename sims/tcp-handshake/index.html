     words in strings.js. The handshake's sequence chart is drawn here (it predates the kit's K1). The closing modes

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var COLOUR = { A: '1', B: '2' };
  var OTHER = { A: 'B', B: 'A' };
  var STEP_TAG = ['step1', 'step23', 'step4'];

  function num(v, cls) { return h('span', { translate: 'no', class: 'th-num' + (cls ? ' ' + cls : '') }, String(v)); }
  function bold(v) { return h('b', { translate: 'no' }, String(v)); }
  function data(v) { return h('span', { translate: 'no' }, v); }

  /** The sliders apply only to isn 'own'; the other choices bring their own pair. */
  function ownOnly(p) { return p.isn === 'own' ? false : t('slidersOff'); }

  var presets = [
    { id: 'book', label: t('presetBook'), hint: t('presetBookHint'), params: { isn: 'own', x: 4000, y: 9500 } },
    { id: 'small', label: t('presetSmall'), hint: t('presetSmallHint'), params: { isn: 'own', x: 100, y: 500 } },
    { id: 'merged', label: t('presetMerged'), hint: t('presetMergedHint'), params: { isn: 'own', x: 4000, y: 9500 }, step: 2 },
    { id: 'own-number', label: t('presetOwn'), hint: t('presetOwnHint'), params: { isn: 'own', x: 4000, y: 4000 } },
    { id: 'real', label: t('presetReal'), hint: t('presetRealHint'), params: { isn: 'real', x: 4000, y: 9500 } },
    { id: 'wrap', label: t('presetWrap'), hint: t('presetWrapHint'), params: { isn: 'wrap', x: 4000, y: 9500 } },
    // the closing modes (task tcp-teardown): they continue the book's numbers, X = 4000 and Y = 9500
    { id: 'close-client', label: t('presetCloseClient'), hint: t('presetCloseClientHint'), params: { isn: 'own', x: 4000, y: 9500, mode: 'close', closer: 'A' } },
    { id: 'close-server', label: t('presetCloseServer'), hint: t('presetCloseServerHint'), params: { isn: 'own', x: 4000, y: 9500, mode: 'close', closer: 'B' } },
    { id: 'half-close', label: t('presetHalf'), hint: t('presetHalfHint'), params: { isn: 'own', x: 4000, y: 9500, mode: 'half', closer: 'A' } },
    { id: 'fin-ack-combined', label: t('presetFinack'), hint: t('presetFinackHint'), params: { isn: 'own', x: 4000, y: 9500, mode: 'finack', closer: 'A' } },
    { id: 'simultaneous', label: t('presetSimul'), hint: t('presetSimulHint'), params: { isn: 'own', x: 4000, y: 9500, mode: 'simul', closer: 'A' } }
  ];

  // ── the closing modes (task tcp-teardown) ──

  /** The caption keys of each closing mode, one per segment step; the timeout step has its own. */
  var CLOSE_CAPS = {
    close: ['capFin1', 'capClose2', 'capClose3', 'capClose4'],
    half: ['capFin1', 'capHalf2', 'capHalf3', 'capHalf4', 'capHalf5', 'capHalf6'],
    finack: ['capFin1', 'capFinack2', 'capFinack3'],
    simul: ['capSimul1', 'capSimul2']
  };

  function yesNo(v, pv) {
    return h('dd', { class: (v ? '' : 'td-no') + (pv !== null && pv !== v ? ' sd-changed' : '') }, v ? '✓ ' + t('yes') : '✕ ' + t('no'));
  }

  /** One end's lane: its state (dashed once CLOSED), the next number it sends, the one it expects, and whether it may
      still send and receive data. */
  function closeLane(k, e, pe) {
    function ch(f) { return pe && pe[f] !== e[f] ? ' sd-changed' : ''; }
    return {
      id: k, c: Number(COLOUR[k]), name: t(k === 'A' ? 'client' : 'server'),
      state: e.state === 'CLOSED' ? 'down' : null,
      changed: !!(pe && pe.state !== e.state),
      body: [
        h('div', { class: 'td-state' + ch('state'), translate: 'no', dataset: { closed: e.state === 'CLOSED' ? 'true' : null } }, e.state),
        h('dl', { class: 'td-kv' },
          h('dt', null, t('sendsFrom')), h('dd', { class: 'th-num' + ch('sndNxt'), translate: 'no' }, String(e.sndNxt)),
          h('dt', null, t('expectsFrom')), h('dd', { class: 'th-num' + ch('rcvNxt'), translate: 'no' }, String(e.rcvNxt)),
          h('dt', null, t('maySend')), yesNo(L.canSend(e.state), pe ? L.canSend(pe.state) : null),
          h('dt', null, t('mayReceive')), yesNo(L.canReceive(e.state), pe ? L.canReceive(pe.state) : null))
      ]
    };
  }

  /** The K1 chart of a close: one row per segment (two FINs crossing are two rows of one step), a note where 2×MSL
      ends TIME-WAIT, a TIME-WAIT timer on each end that enters it; the receiver's new state at the arrow's tip. */
  function closeChart(s, c) {
    var pv = c.prev && c.prev.ends ? c.prev.ends : null;
    var rows = [], entered = {}, ended = {}, was = { A: 'ESTABLISHED', B: 'ESTABLISHED' };
    s.chart.forEach(function (r) {
      var now = r.step === s.sent;
      if (r.timeout) {
        r.closed.forEach(function (k) {
          ended[k] = rows.length;
          rows.push({ kind: 'note', lane: k, k: 'solid', text: t('noteTimeout'), time: h('span', null, '+' + t('tw')), changed: now });
        });
      } else {
        r.segs.forEach(function (g) {
          var re = {};
          if (r.after[g.to] !== was[g.to]) re[g.to] = '→ ' + r.after[g.to];
          if (r.after[g.to] === 'TIME-WAIT' && was[g.to] !== 'TIME-WAIT') entered[g.to] = rows.length;
          var pure = g.flags.join() === 'ACK';
          rows.push({
            from: g.from, to: g.to, c: Number(COLOUR[g.from]),
            label: g.flags.length ? g.flags.join('+') : h('span', null, t('dataChip')),
            fields: 'seq=' + g.seq + ' ack=' + g.ack + (g.len ? ' len=' + g.len : ''),
            weight: pure ? 'thin' : undefined, re: re, time: String(r.step), changed: now
          });
        });
      }
      was = r.after;
    });
    var timers = ['A', 'B'].filter(function (k) { return k in entered; }).map(function (k) {
      return { lane: k, from: entered[k], to: k in ended ? ended[k] : undefined, end: k in ended ? 'expired' : undefined, label: 'TIME-WAIT', side: k === 'B' ? 'r' : 'l' };
    });
    return Simdeck.sequence({
      dir: c.dir,
      timeWidth: '5.6rem',
      lanes: ['A', 'B'].map(function (k) { return closeLane(k, s.ends[k], pv && pv[k]); }),
      rows: rows,
      timers: timers,
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  /** The numbers end k sends, continuing the handshake's octet lines: what came before the FIN (its SYN, or the data it
      sent), the number the FIN takes (dashed until sent: the number it would take now) and the one after it, which the
      FIN's ACK carries. "B čeka" sits on the number the other end expects. */
  function closeLine(k, s) {
    var e = s.ends[k], waits = s.ends[OTHER[k]].rcvNxt, sent = e.finSeq !== null, fin = sent ? e.finSeq : e.sndNxt;
    var data = [];
    s.chart.forEach(function (r) { r.segs.forEach(function (g) { if (g.from === k && g.len) data.push(g); }); });
    var first = data.length
      ? { text: data[0].seq + '–' + L.seqAdd(data[data.length - 1].seq, data[data.length - 1].len - 1), v: null, cap: t('cellData', { n: data.reduce(function (a, g) { return a + g.len; }, 0) }), cls: '' }
      : { text: String(k === 'A' ? s.x : s.y), v: k === 'A' ? s.x : s.y, cap: t('cellSyn'), cls: ' th-syn th-used sd-hatch' };
    var cells = [
      first,
      { text: String(fin), v: fin, cap: t(sent ? 'cellFin' : 'cellFinNot'), cls: ' th-syn' + (sent ? ' th-used sd-hatch' : '') },
      { text: String(L.seqAdd(fin, 1)), v: L.seqAdd(fin, 1), cap: t('cellAfterFin'), cls: '' }
    ].map(function (cell) {
      var wait = cell.v !== null && cell.v === waits;
      return h('div', { class: 'th-cell' },
        h('span', { class: 'th-mark' }, wait ? t('expects', { who: OTHER[k] }) : ''),
        h('span', { class: 'th-box th-num' + cell.cls + (wait ? ' th-wait' : ''), translate: 'no', dataset: { c: COLOUR[k] } }, h('span', { class: 'th-chip' }, cell.text)),
        h('span', { class: 'th-cap' }, cell.cap));
    });
    return h('div', { class: 'th-seq' }, h('span', { class: 'th-small' }, t(k === 'A' ? 'closeLineA' : 'closeLineB')), h('div', { class: 'th-cells' }, cells));
  }

  /** t.parts with a node used twice: the kit puts the same node in both places, so it ends up in the last one only.
      Clone the repeats (Shared requests in NOTES.md). */
  function partsOnce(key, v) {
    var seen = [];
    return t.parts(key, v).map(function (x) {
      if (!(x instanceof Node)) return x;
      if (seen.indexOf(x) >= 0) return x.cloneNode(true);
      seen.push(x);
      return x;
    });
  }

  function closeCaption(c) {
    var s = c.state, cl = s.closer || 'A', op = cl === 'A' ? 'B' : 'A';
    var v = { x: bold(s.x), y: bold(s.y), a1: bold(L.seqAdd(s.x, 1)), b1: bold(L.seqAdd(s.y, 1)), c: bold(cl), o: bold(op), tw: t('tw'), step: bold(s.sent) };
    if (c.first) return partsOnce(s.mode === 'simul' ? 'capSimulStart' : 'capCloseStart', v);
    var r = s.chart[s.sent - 1];
    if (r.timeout) return partsOnce(s.mode === 'simul' ? 'capSimul3' : 'capTimeout', v);
    var g = r.segs[0], by = {};
    r.segs.forEach(function (x) { by[x.from] = x; });
    var dataSeg = s.chart.map(function (x) { return x.segs.filter(function (y) { return y.len; })[0]; }).filter(Boolean)[0];
    Object.assign(v, { seq: bold(g.seq), ack: bold(g.ack), fin: bold(L.seqAdd(g.ack, -1)), len: bold(dataSeg ? dataSeg.len : 0), dseq: bold(dataSeg ? dataSeg.seq : 0) });
    if (by.A && by.B) Object.assign(v, { seqA: bold(by.A.seq), seqB: bold(by.B.seq), ackA: bold(by.A.ack), ackB: bold(by.B.ack) });
    return partsOnce(CLOSE_CAPS[s.mode][s.sent - 1], v);
  }

  /** One side's card: name and role, its ISN, the next number it sends, what it expects, whether it is confirmed. */
  function end(k, side, prev) {
    function val(v, pv) {
      if (v === null) return h('span', { class: 'th-v th-num th-none' }, t('unknown'));
      return num(v, 'th-v' + (prev && pv !== v ? ' sd-changed' : ''));
    }
    return h('div', { class: 'th-end th-' + k.toLowerCase(), dataset: { c: COLOUR[k] } },
      h('div', { class: 'th-head' }, h('span', { class: 'th-name', translate: 'no' }, k), h('span', { class: 'th-small' }, t(k === 'A' ? 'client' : 'server'))),
      h('span', { class: 'th-k' }, t('iss'), ' ', data(k === 'A' ? 'X' : 'Y')), num(side.iss, 'th-v'),
      h('span', { class: 'th-k' }, t('sndNxt')), val(side.sndNxt, prev && prev.sndNxt),
      h('span', { class: 'th-k' }, t('rcvNxt', { other: OTHER[k] })), val(side.rcvNxt, prev && prev.rcvNxt),
      side.acked
        ? h('span', { class: 'th-status' + (prev && !prev.acked ? ' sd-hl' : '') }, '✓ ', t('acked', { other: OTHER[k] }))
        : h('span', { class: 'th-status th-no' }, '○ ', t('notAcked')));
  }

  /** One message row: sent (solid, coloured by its sender), the current one (highlighted, thicker) or not yet sent. */
  function message(seg, i, s, c) {
    var sent = i < s.sent, now = i === s.sent - 1;
    var label, parts = null;
    if (!sent) label = h('div', { class: 'th-label' }, t('notYet'));
    else {
      label = h('div', { class: 'th-label' },
        h('span', { class: 'th-flags', translate: 'no' }, seg.flags.join('+')),
        h('span', { class: 'th-field' }, t('seqField'), ' = ', num(seg.seq)),
        seg.ack !== null ? h('span', { class: 'th-field' }, t('ackField'), ' = ', num(seg.ack)) : null);
      if (seg.concept.length > 1) parts = h('div', { class: 'th-parts' }, h('span', null, t('part2')), h('span', null, t('part3')));
    }
    var cls = 'th-msg th-' + (seg.from === 'A' ? 'right' : 'left') + (now ? ' th-now' : '') + (sent ? '' : ' th-later');
    var arrow = h('div', { class: 'th-arrow' + (now && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { c: COLOUR[seg.from] } },
      label, h('div', { class: 'th-line', 'aria-hidden': 'true' }), parts);
    return h('div', { class: cls, style: { gridRow: String(i + 2) } }, h('span', { class: 'th-step' }, t(STEP_TAG[i])), arrow);
  }

  /** The octets side k sends: its ISN (taken by the SYN), the first data octet, the second; the other side's
      "waits for" mark sits on the number it expects. */
  function seqLine(k, s) {
    var iss = s[k].iss, waits = s[OTHER[k]].rcvNxt, synSent = s.segs.some(function (g, i) { return i < s.sent && g.from === k && g.flags.indexOf('SYN') >= 0; });
    var caps = ['cellSyn', 'cellFirst', 'cellNext'];
    var cells = [0, 1, 2].map(function (d) {
      var v = L.seqAdd(iss, d), wait = waits !== null && waits === v;
      var cls = 'th-box th-num' + (d === 0 ? ' th-syn' + (synSent ? ' th-used sd-hatch' : '') : '') + (wait ? ' th-wait' : '');
      return h('div', { class: 'th-cell' },
        h('span', { class: 'th-mark' }, wait ? t('expects', { who: OTHER[k] }) : ''),
        h('span', { class: cls, translate: 'no', dataset: { c: COLOUR[k] } }, h('span', { class: 'th-chip' }, String(v))),
        h('span', { class: 'th-cap' }, t(caps[d])));
    });
    return h('div', { class: 'th-seq' }, h('span', { class: 'th-small' }, t(k === 'A' ? 'lineA' : 'lineB')), h('div', { class: 'th-cells' }, cells));
  }

  Simdeck.mount({
    steps: L.stepsFor,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'closer', type: 'choice', label: t('closer'), options: [['A', t('legendA')], ['B', t('legendB')]],
        visible: function (p) { return p.mode !== 'open' && p.mode !== 'simul'; } },
      { key: 'isn', type: 'choice', label: t('isn'), options: [['own', t('isnOwn')], ['real', t('isnReal')], ['wrap', t('isnWrap')]] },
      { key: 'x', type: 'range', label: t('x'), min: L.min, max: L.max, step: 1, disabled: ownOnly },
      { key: 'y', type: 'range', label: t('y'), min: L.min, max: L.max, step: 1, disabled: ownOnly }
    ],

    presets: presets,

    legend: [
      { c: 1, label: t('legendA') },
      { c: 2, label: t('legendB') },
      { shape: 'hl', label: t('legendNow') },
      { shape: 'hollow', label: t('legendLater') },
      { shape: 'thin', label: t('legendAck') }
    ],

    render: function (c) {
      var s = c.state, p = c.prev, closeMode = !!s.ends;
      document.querySelector('[data-t-html="explain"]').hidden = closeMode;
      document.querySelector('[data-t-html="explainClose"]').hidden = !closeMode;
      c.stage.setAttribute('data-t-label', closeMode ? 'stageClose' : 'stage');
      c.stage.setAttribute('aria-label', t(closeMode ? 'stageClose' : 'stage'));
      if (closeMode) {
        var chartEl = closeChart(s, c);
        c.stage.replaceChildren(h('div', { class: 'td' }, chartEl, h('div', { class: 'th-lines' }, closeLine('A', s), closeLine('B', s))));
        chartEl.fit();
        return;
      }
      var chart = h('div', { class: 'th-chart' },
        h('div', { class: 'th-lane th-a', 'aria-hidden': 'true' }),
        h('div', { class: 'th-lane th-b', 'aria-hidden': 'true' }),
        end('A', s.A, p && p.A),
        h('div', { class: 'th-mid' }, s.established ? h('span', { class: 'th-est' + (c.dir === 'forward' ? ' sd-anim-in' : '') }, t('established')) : null),
        end('B', s.B, p && p.B),
        s.segs.map(function (g, i) { return message(g, i, s, c); }));
      var lines = h('div', { class: 'th-lines' }, seqLine('A', s), seqLine('B', s));
      c.stage.replaceChildren(h('div', { class: 'th' }, chart, lines));
    },

    caption: function (c) {
      var s = c.state;
      if (s.ends) return closeCaption(c);
      var v = { x: bold(s.x), x1: bold(L.seqAdd(s.x, 1)), y: bold(s.y), y1: bold(L.seqAdd(s.y, 1)) };
      if (c.first) return t.parts('captionStart', v);
      var out = t.parts('caption' + s.sent, v);
      var wrapX = s.wrapsX && (s.sent === 1 || s.sent === 2), wrapY = s.wrapsY && (s.sent === 2 || s.sent === 3);
      if (wrapX || wrapY) {
        var last = wrapX ? s.x : s.y;
        out = out.concat([' ', h('span', { class: 'sd-hl' }, t.parts('captionWrap', { last: bold(last), zero: bold(L.seqAdd(last, 1)) }))]);
      }
      return out;
    }
  });
})();
</script>
</body>
