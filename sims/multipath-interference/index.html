<html lang="hr" data-sim="multipath-interference">
<head>

<title>Višestazno širenje i interferencija · simdeck</title>
<meta name="description" content="Izravni i reflektirani signal zbrajaju se u prijamniku: ovisno o faznoj razlici zbroj je pojačan, oslabljen ili poništen.">
<link rel="stylesheet" href="../../kit/kit.css">
<script src="../../kit/kit.js"></script>

<!-- #simdeck-meta placeholder. sims/<id>/sim.json is the source (docs/site-structure.md §2); the build replaces this
     block with one generated from it, and new-sim.sh and the admin write it from sim.json. Unbuilt, the kit takes the
     header title and subtitle (title, concept) from here, and warns when id, class or steps differ from the page. -->
<script type="application/json" id="simdeck-meta">
{
  "id": "multipath-interference",
  "class": "explorer",
  "title": { "hr": "Višestazno širenje i interferencija", "en": "Multipath propagation and interference" },
  "concept": { "hr": "Signali s dvaju putova zbrajaju se: fazna razlika ih pojačava ili poništava", "en": "Signals from two paths add up; their phase difference makes them grow or cancel" }
}
</script>
<!-- Contract exceptions: [{"rule": "<rule id>", "why": "<reason>"}]. Empty means the page follows every rule. -->
<script type="application/json" id="simdeck-exceptions">[]</script>

<style>
/* Page CSS: every selector starts with [data-sim="multipath-interference"]; colours only from kit tokens. */
[data-sim="multipath-interference"] .mi { height: 100%; padding: 1.2cqh 1.6cqw; display: flex; flex-direction: column; gap: 0.6rem; }
[data-sim="multipath-interference"] .mi-plot { position: relative; flex: 1; min-height: 10rem; }
[data-sim="multipath-interference"] .mi-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="multipath-interference"] .mi-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="multipath-interference"] .mi-plot text.mi-title { fill: var(--ink); font-size: var(--fs-md); font-weight: 600; }
[data-sim="multipath-interference"] .mi-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="multipath-interference"] .mi-grid { stroke: var(--line); stroke-width: 1; opacity: 0.8; }
[data-sim="multipath-interference"] .mi-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="multipath-interference"] .mi-direct { fill: none; stroke: var(--c1); stroke-width: 4; stroke-linejoin: round; }
[data-sim="multipath-interference"] .mi-reflected { fill: none; stroke: var(--c2); stroke-width: 4; stroke-dasharray: 12 8; stroke-linejoin: round; }
[data-sim="multipath-interference"] .mi-sum { fill: none; stroke: var(--c3); stroke-width: 5; stroke-linejoin: round; }
[data-sim="multipath-interference"] .mi-env { stroke: var(--c3); stroke-width: 2; stroke-dasharray: 4 6; }
[data-sim="multipath-interference"] .mi-dot1 { fill: var(--c1); stroke: var(--bg); stroke-width: 2; }
[data-sim="multipath-interference"] .mi-dot2 { fill: var(--bg); stroke: var(--c2); stroke-width: 3; }
[data-sim="multipath-interference"] .mi-lag { stroke: var(--ink); stroke-width: 2.5; fill: none; }
[data-sim="multipath-interference"] .mi-ext { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
[data-sim="multipath-interference"] .mi-plot text.mi-label { fill: var(--ink); font-size: var(--fs-md); font-weight: 600; }
[data-sim="multipath-interference"] .mi-plot text.mi-halo { stroke: var(--panel); stroke-width: 6; paint-order: stroke; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="multipath-interference"] .mi-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="multipath-interference"] .mi-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="multipath-interference"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="multipath-interference"] .mi { height: auto; padding: 0.6rem; }
  [data-sim="multipath-interference"] .mi-plot { flex: none; width: 100%; height: 14rem; }
  [data-sim="multipath-interference"] .mi-credit { text-align: left; }
  /* The kit makes the bar sticky on a phone; with the credit in it, it would cover a third of the screen. */
  [data-sim="multipath-interference"] .sd-bar { position: static; }
}
</style>
</head>
<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Višestazno širenje i interferencija</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="mi-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma and a true minus sign.
  function num(x) {
    var s = String(x).replace('-', '−');
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function pct(x) { return t('pct', { v: num(Math.round(x)) }); }
  function db(x) { return x === null ? t('db', { v: '−∞' }) : t('db', { v: (x > 0 ? '+' : '') + num(x.toFixed(1)) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }

  var labels = { inPhase: 'presetInPhase', quarter: 'presetQuarter', third: 'presetThird', opposite: 'presetOpposite',
    oppositeWeak: 'presetOppositeWeak', quarterWeak: 'presetQuarterWeak', full: 'presetFull' };

  // One plot: a frame over 0 … 2.5 periods, y from −yMax … yMax (fractions of the direct amplitude), ticks in %.
  function frame(box, yMax, ticks, title, timeAxis) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return null;
    var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    var pad = { l: 4.2 * rem, r: 1.0 * rem, t: 2.2 * rem, b: timeAxis ? 1.6 * rem : 0.5 * rem };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var p = {
      rem: rem, pad: pad, cw: cw, ch: ch,
      X: function (tt) { return pad.l + (tt / L.PERIODS) * cw; },
      Y: function (y) { return pad.t + ch * (1 - (y + yMax) / (2 * yMax)); },
      svg: s('svg', { width: W, height: H, 'aria-hidden': 'true' })
    };
    p.svg.append(s('rect', { class: 'mi-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    for (var g = 0.5; g < L.PERIODS; g += 0.5) p.svg.append(s('line', { class: 'mi-grid', x1: p.X(g), x2: p.X(g), y1: pad.t, y2: pad.t + ch }));
    ticks.forEach(function (v) {
      p.svg.append(s('line', { class: v === 0 ? 'mi-zero' : 'mi-grid', x1: pad.l, x2: pad.l + cw, y1: p.Y(v), y2: p.Y(v) }));
      p.svg.append(s('text', { x: pad.l - 0.4 * rem, y: p.Y(v) + 0.3 * rem, 'text-anchor': 'end' }, pct(v * 100)));
    });
    p.svg.append(s('text', { class: 'mi-title', x: pad.l, y: pad.t - 0.55 * rem }, title));
    if (timeAxis) p.svg.append(s('text', { x: pad.l + cw, y: H - 0.2 * rem, 'text-anchor': 'end' }, t('axisTime')));
    return p;
  }

  function line(p, pts, key, cls) {
    return s('polyline', { class: cls, points: pts.map(function (q) { return p.X(q.t).toFixed(1) + ',' + p.Y(q[key]).toFixed(1); }).join(' ') });
  }

  // ── top: the direct signal and the delayed, weaker reflected copy; the lag φ marked between two crests ──
  function drawPaths(box, st, pts) {
    var p = frame(box, 1.2, [-1, 0, 1], t('plotPaths'), false);
    if (!p) return;
    var svg = p.svg, rem = p.rem;
    svg.append(line(p, pts, 'r', 'mi-reflected'));
    svg.append(line(p, pts, 'd', 'mi-direct'));
    var c1 = 1.25, c2 = 1.25 + st.lag;          // a crest of the direct signal, and the copy's crest that follows it
    svg.append(s('circle', { class: 'mi-dot1', cx: p.X(c1), cy: p.Y(1), r: 0.42 * rem }));
    if (st.a > 0) {
      svg.append(s('circle', { class: 'mi-dot2', cx: p.X(c2), cy: p.Y(st.a), r: 0.42 * rem }));
      if (st.lag > 0) {
        var x1 = p.X(c1), x2 = p.X(c2), yd = p.pad.t + 0.2 * rem, a = Math.min(0.5 * rem, (x2 - x1) / 3);
        svg.append(s('line', { class: 'mi-ext', x1: x1, x2: x1, y1: p.Y(1), y2: yd }));
        svg.append(s('line', { class: 'mi-ext', x1: x2, x2: x2, y1: p.Y(st.a), y2: yd }));
        svg.append(s('line', { class: 'mi-lag', x1: x1, x2: x2, y1: yd, y2: yd }));
        svg.append(s('polyline', { class: 'mi-lag', points: (x2 - a) + ',' + (yd - a / 1.6) + ' ' + x2 + ',' + yd + ' ' + (x2 - a) + ',' + (yd + a / 1.6) }));
        // the label right of the arrow, or left of it when it would leave the plot (lags near a whole period);
        // on a narrow plot only "φ", the caption and the slider give the value
        var text = p.cw < 40 * rem ? t('lagLabel') : t('lagLabel') + ' = ' + t('deg', { v: st.phase });
        var right = x2 + (p.cw < 40 * rem ? 1.5 : 6) * rem <= p.pad.l + p.cw;
        svg.append(s('text', { class: 'mi-label mi-halo', x: right ? x2 + 0.4 * rem : x1 - 0.4 * rem, y: yd + 0.35 * rem,
          'text-anchor': right ? 'start' : 'end' }, text));
      }
    }
    box.replaceChildren(svg);
  }

  // ── bottom: the sum at the receiver, with its amplitude A marked by dashed lines ──
  function drawSum(box, st, pts) {
    var p = frame(box, 2.3, [-2, -1, 0, 1, 2], t('plotSum'), true);
    if (!p) return;
    var svg = p.svg, rem = p.rem;
    if (st.A > 0) {
      svg.append(s('line', { class: 'mi-env', x1: p.pad.l, x2: p.pad.l + p.cw, y1: p.Y(st.A), y2: p.Y(st.A) }));
      svg.append(s('line', { class: 'mi-env', x1: p.pad.l, x2: p.pad.l + p.cw, y1: p.Y(-st.A), y2: p.Y(-st.A) }));
    }
    svg.append(line(p, pts, 's', 'mi-sum'));
    // the amplitude in the title row, right-aligned, so it never sits on the curve
    svg.append(s('text', { class: 'mi-label', x: p.pad.l + p.cw, y: p.pad.t - 0.55 * rem, 'text-anchor': 'end' }, t('sumLabel', { v: pct(st.A * 100) })));
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'phase', type: 'range', label: t('phase'), hint: t('phaseHint'), min: 0, max: 360, step: 1,
        format: function (v) { return t('deg', { v: v }); } },
      { key: 'amp', type: 'range', label: t('amp'), hint: t('ampHint'), min: 0, max: 100, step: 1,
        format: function (v) { return pct(v); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendDirect') },
      { c: 2, shape: 'hollow', label: t('legendReflected') },
      { c: 3, label: t('legendSum') }
    ],

    render: function (c) {
      var top = h('div', { class: 'mi-plot' }), bottom = h('div', { class: 'mi-plot' });
      c.stage.replaceChildren(h('div', { class: 'mi' }, top, bottom));
      var pts = L.curve(c.state, 400);
      drawPaths(top, c.state, pts);
      drawSum(bottom, c.state, pts);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var vars = {
        phi: b(t('deg', { v: st.phase })), amp: b(pct(st.amp)), sum: b(pct(st.A * 100)), db: db(st.db),
        effect: b(t('eff_' + st.effect)), path: b(t('lambdas', { v: num(parseFloat(st.pathFraction.toFixed(3))) }))
      };
      return t.parts(st.effect === 'cancelled' ? 'cap_cancelled' : st.effect === 'none' ? 'cap_none' : 'caption', vars);
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
