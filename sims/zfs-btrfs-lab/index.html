<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  function dec(x) { return Simdeck.lang === 'hr' ? x.replace('.', ',') : x; }
  /** The original's fmt, in GiB below 1 TiB, then TiB with one decimal unless whole. */
  function gib(n) {
    if (n >= 1024) return dec((n / 1024).toFixed(n % 1024 ? 1 : 0)) + ' ' + t('unitTiB');
    return n + ' ' + t('unitGiB');
  }
  function data(tag, text, cls) { return h(tag, { translate: 'no', class: cls || null }, text); }
  function short(name) { return name.replace('/dev/', ''); }

  var isZ = function (p) { return p.mode === 'zfs'; };
  var isB = function (p) { return p.mode === 'btrfs'; };
  var roleKey = { data: 'roleData', special: 'roleSpecial', log: 'roleLog', cache: 'roleCache', spare: 'roleSpare' };
  var bHealthKey = { online: 'bOnline', degraded: 'bDegraded', unavailable: 'bUnavailable', warning: 'bWarning', none: 'bNone' };
  var labels = {
    mirror: 'presetMirror', raidz2: 'presetRaidz2', special: 'presetSpecial', draid: 'presetDraid', badmix: 'presetBadmix',
    raid1: 'presetRaid1', mixed: 'presetMixed', raid56: 'presetRaid56', compare: 'presetCompare'
  };
  var opts = function (list) { return list.map(function (x) { return [x, t('opt_' + x)]; }); };

  var params = [
    { key: 'mode', type: 'choice', label: t('mode'),
      options: [['zfs', 'ZFS'], ['btrfs', 'Btrfs'], ['compare', t('modeCompare')]] },
    { key: 'zType', type: 'select', label: t('zType'), options: opts(L.Z_TYPES), visible: isZ },
    { key: 'zWidth', type: 'range', label: t('zWidth'), step: 1,
      min: function (p) { return L.minWidth(p.zType); }, max: function (p) { return L.maxWidth(p.zType); },
      visible: function (p) { return isZ(p) && p.zType !== 'single'; } },
    { key: 'zVdevs', type: 'range', label: t('zVdevs'), min: 1, step: 1, max: L.maxVdevs, visible: isZ },
    { key: 'zSize', type: 'range', label: t('zSize'), min: 500, max: 4000, step: 100, format: gib, visible: isZ },
    { key: 'zMix', type: 'toggle', label: t('zMix'), visible: isZ },
    { key: 'zSpecial', type: 'toggle', label: t('zSpecial'), visible: isZ },
    { key: 'zLog', type: 'toggle', label: t('zLog'), visible: isZ },
    { key: 'zCache', type: 'toggle', label: t('zCache'), visible: isZ },
    { key: 'zSpare', type: 'toggle', label: t('zSpare'), visible: isZ },
    { key: 'zEncrypt', type: 'toggle', label: t('zEncrypt'), visible: isZ },
    { key: 'zSnap', type: 'toggle', label: t('zSnap'), visible: isZ },
    { key: 'zFailed', type: 'range', label: t('zFailed'), min: 0, step: 1, max: L.dataDisks,
      visible: function (p) { return p.mode !== 'btrfs'; } },
    { key: 'zSpread', type: 'toggle', label: t('zSpread'), visible: function (p) { return isZ(p) && p.zFailed > 1; } },
    { key: 'bDevices', type: 'range', label: t('bDevices'), min: 1, max: L.MAX_BDEV, step: 1, visible: isB },
    { key: 'bSize', type: 'range', label: t('bSize'), min: 500, max: 4000, step: 100, format: gib, visible: isB },
    { key: 'bData', type: 'select', label: t('bData'), options: opts(L.B_DATA), visible: isB },
    { key: 'bMeta', type: 'select', label: t('bMeta'), options: opts(L.B_META), visible: isB },
    { key: 'bFailed', type: 'range', label: t('bFailed'), min: 0, step: 1,
      max: function (p) { return Math.max(1, Math.min(L.MAX_BDEV, p.bDevices)); },
      visible: function (p) { return p.mode !== 'zfs'; } },
    { key: 'bSnap', type: 'toggle', label: t('bSnap'), visible: isB }
  ];

  // ── building blocks ──
  function node(c, title, sub, cls, extra) {
    return h('div', { class: 'zb-node' + (cls ? ' ' + cls : ''), dataset: c ? { c: String(c) } : {} },
      data('b', title), extra || null, sub != null ? h('small', null, sub) : null);
  }
  function layer(label, nodes) {
    if (!nodes.length) return null;
    return h('div', { class: 'zb-layer' }, h('div', { class: 'zb-layer-label' }, label), h('div', { class: 'zb-nodes' }, nodes));
  }
  function stateCls(s) { return s === 'FAULTED' || s === 'unavailable' ? 'zb-down' : s === 'DEGRADED' || s === 'degraded' || s === 'warning' ? 'zb-degr' : null; }
  function disk(name, failed) { return h('span', { class: 'zb-disk' + (failed ? ' zb-x' : ''), translate: 'no' }, (failed ? '✕ ' : '') + short(name)); }
  /** Data vdevs take series colours 1–3 (the mixed mirror too); special, log, cache and spare 4–6 and 8. */
  var auxC = { special: 4, log: 5, cache: 6, spare: 8 };
  function vc(z, v) { return v.role === 'data' ? z.vdevs.filter(function (x) { return x.role === 'data'; }).indexOf(v) + 1 : auxC[v.role]; }
  var C_POOL = 7;

  // ── ZFS ──
  function zTopology(z) {
    var vdevs = z.vdevs.map(function (v) {
      var sub = v.role === 'data'
        ? [t('vdevSub', { usable: gib(v.cap.usable), faults: t.n('nDisks', v.cap.faults) }) + ' · ', data('span', v.state)]
        : t(roleKey[v.role] + 'Sub');
      return node(vc(z, v), v.type + ' · ' + t(roleKey[v.role]), sub,
        v.role === 'data' ? stateCls(v.state) : 'zb-aux',
        h('div', { class: 'zb-disks' }, v.disks.map(function (d) { return disk(z.disks[d].name, z.disks[d].failed); })));
    });
    var pool = node(C_POOL, z.pool, [data('span', z.health), ' · ' + t('poolSub', { usable: gib(z.usable), free: gib(z.free) })], stateCls(z.health));
    var down = z.health === 'FAULTED' ? 'zb-down' : null;
    var ds = z.datasets.map(function (d) {
      var sub = t(d.type === 'zvol' ? 'zvolSub' : 'fsSub', { used: gib(d.used), quota: gib(d.quota) }) +
        (d.encryption ? ' · ' + t('encrypted') : '');
      return node(C_POOL, z.pool + '/' + d.name, sub, down);
    });
    var snaps = z.snaps.map(function (s) { return node(C_POOL, z.pool + '/' + s.dataset + '@' + s.name, t('snapSub', { used: gib(s.used) }), down); });
    return h('div', { class: 'zb-topo' },
      layer(t('layerVdevs'), vdevs), layer(t('layerPool'), [pool]), layer(t('layerDatasets'), ds), layer(t('layerSnaps'), snaps));
  }

  var cellC = { data: 1, copy: 3, parity: 7 };
  function cell(role, label, failed) {
    if (!role) return h('span', { class: 'zb-cell zb-empty', 'aria-hidden': 'true' }, '·');
    return h('span', { class: 'zb-cell' + (failed ? ' zb-x' : ' sd-fill' + (role === 'parity' ? ' sd-hatch' : '')),
      dataset: { c: String(cellC[role]) }, translate: 'no' }, failed ? '✕' : label);
  }
  var recKey = { ONLINE: 'rowOk', DEGRADED: 'rowDegraded', FAULTED: 'rowLost', ok: 'rowOk', degraded: 'rowDegraded', lost: 'rowLost' };
  var recCls = { ONLINE: '', DEGRADED: 'zb-degraded', FAULTED: 'zb-lost', ok: '', degraded: 'zb-degraded', lost: 'zb-lost' };
  var recMark = { ONLINE: '✓ ', DEGRADED: '! ', FAULTED: '✕ ', ok: '✓ ', degraded: '! ', lost: '✕ ' };
  function stateTd(s) { return h('td', { class: 'zb-state ' + recCls[s] }, recMark[s] + t(recKey[s])); }

  function zPlacement(z) {
    var data = z.vdevs.filter(function (v) { return v.role === 'data'; });
    var head1 = [h('th', null)], head2 = [h('th', null)];
    data.forEach(function (v, k) {
      head1.push(h('th', { class: 'zb-vh' + (k ? ' zb-gap' : ''), colspan: String(v.disks.length) }, h('span', { translate: 'no' }, v.type)));
      v.disks.forEach(function (d, i) {
        var x = z.disks[d];
        head2.push(h('th', { class: (x.failed ? 'zb-x' : '') + (k && !i ? ' zb-gap' : ''), translate: 'no' }, short(x.name)));
      });
    });
    head1.push(h('th', null)); head2.push(h('th', null));
    var rows = z.records.map(function (r) {
      var tds = [h('td', { class: 'zb-rl' }, t('record', { i: r.index }))];
      data.forEach(function (v, k) {
        v.disks.forEach(function (d, i) {
          var c = v.index === r.vdev ? r.cells[i] : null;
          tds.push(h('td', { class: k && !i ? 'zb-gap' : null }, c ? cell(c.role, c.role === 'parity' ? 'P' : c.role === 'copy' ? 'C' : 'D', c.failed) : cell(null)));
        });
      });
      tds.push(stateTd(r.state));
      return h('tr', null, tds);
    });
    return h('div', { class: 'zb-place-wrap' }, h('table', { class: 'zb-place' }, h('thead', null, h('tr', null, head1), h('tr', null, head2)), h('tbody', null, rows)));
  }

  // ── Btrfs ──
  function bTopology(b) {
    var fs = b.fs;
    var devs = b.devices.map(function (d) { return node(d.failed ? null : 1, short(d.name), d.failed ? t('devFailed') : gib(d.size), d.failed ? 'zb-down' : null); });
    var layers = [layer(t('layerDevices'), devs)];
    if (!fs.ok) {
      layers.push(layer(t('layerFs'), [node(null, fs.name, t('fsNotCreated', { need: fs.need }), 'zb-down')]));
      return h('div', { class: 'zb-topo' }, layers);
    }
    var down = b.health === 'unavailable' ? 'zb-down' : null;
    layers.push(layer(t('layerFs'), [node(C_POOL, fs.name, t(bHealthKey[b.health]) + ' · ' + t('bfsSub', { usable: gib(b.usable), free: gib(b.free) }), stateCls(b.health))]));
    layers.push(layer(t('layerProfiles'), [
      node(3, t('profData', { p: fs.data }), t('profSub', { tol: t.n('nDevices', L.tolerates(fs.data)), min: L.profileMin(fs.data) })),
      node(4, t('profMeta', { p: fs.meta }), t('profSub', { tol: t.n('nDevices', L.tolerates(fs.meta)), min: L.profileMin(fs.meta) }))
    ]));
    layers.push(layer(t('layerSubvols'), b.subvols.map(function (s) { return node(C_POOL, s.name, t('subvolSub', { used: gib(s.used) }), down); })));
    layers.push(layer(t('layerSnaps'), b.snaps.map(function (s) { return node(C_POOL, '.snapshots/' + s.name, t('bsnapSub', { used: gib(s.used) }), down); })));
    return h('div', { class: 'zb-topo' }, layers);
  }

  function bPlacement(b) {
    if (!b.fs.ok) return null;
    var head = [h('th', null)].concat(b.devices.map(function (d) { return h('th', { class: d.failed ? 'zb-x' : null, translate: 'no' }, short(d.name)); }), [h('th', null)]);
    var rows = b.chunks.map(function (c) {
      var tds = [h('td', { class: 'zb-rl' }, t(c.meta ? 'chunkMeta' : 'chunkData', { i: c.index }), ' ', data('span', c.profile))];
      b.devices.forEach(function (d) {
        var mine = c.cells.filter(function (x) { return x.device === d.index; });
        tds.push(h('td', null, mine.length ? cell(mine[0].role, mine.map(function (x) { return x.label; }).join('+'), d.failed) : cell(null)));
      });
      tds.push(stateTd(c.state));
      return h('tr', null, tds);
    });
    return h('div', { class: 'zb-place-wrap' }, h('table', { class: 'zb-place' }, h('thead', null, h('tr', null, head)), h('tbody', null, rows)));
  }

  // ── commands ──
  function commands(list) {
    var lines = [h('span', { class: 'zb-note' }, t('cmdNote')), '\n'];
    list.forEach(function (c) {
      if (c.note) lines.push(h('span', { class: 'zb-note' }, t('noteFail', { device: c.device })), '\n');
      else if (c.failed) lines.push(h('span', { class: 'zb-fail' }, c.cmd), '  ', h('span', { class: 'zb-fail-note' }, t('cmdFailed')), '\n');
      else lines.push(c.cmd, '\n');
    });
    return h('pre', { class: 'zb-cmds', translate: 'no' }, lines);
  }

  // ── comparison ──
  function box(c, title, body) { return h('div', { class: 'zb-box', dataset: c ? { c: String(c) } : {} }, h('h3', null, title), h('p', null, body)); }
  function compare(st) {
    var z = st.z, b = st.b;
    return h('div', { class: 'zb-cmp' },
      h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('cmpZ')), zTopology(z)),
      h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('cmpB')), bTopology(b)),
      box(1, t('domZTitle'), t('domZ')),
      box(3, t('domBTitle'), t('domB')),
      h('div', { class: 'zb-wide' }, box(C_POOL, t('contrastTitle'), t('contrast'))));
  }

  function kpi(v, label, cls) { return h('div', { class: 'zb-kpi' + (cls ? ' ' + cls : '') }, data('b', v), h('span', null, label)); }
  function hcls(s) { return s === 'FAULTED' || s === 'unavailable' ? 'zb-bad' : s === 'DEGRADED' || s === 'degraded' || s === 'warning' ? 'zb-warn' : null; }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: params,
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendData') },
      { c: 3, label: t('legendCopy') },
      { c: 7, label: t('legendParity') },
      { shape: 'hollow', label: t('legendFailed') }
    ],

    render: function (c) {
      var st = c.state, z = st.z, b = st.b;
      var kpis, body, place = null;
      if (st.mode === 'zfs') {
        kpis = [kpi(String(z.disks.length), t('kpiDisks')), kpi(String(z.dataVdevs), t('kpiVdevs')),
          kpi(gib(z.usable), t('kpiUsable')), kpi(gib(z.used), t('kpiUsed')), kpi(z.health, t('kpiPoolHealth'), hcls(z.health))];
        body = h('div', { class: 'zb-body' },
          h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('topoZ')), zTopology(z)),
          h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('cmdTitle')), commands(z.commands)));
        place = h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('placeZ')), zPlacement(z));
      } else if (st.mode === 'btrfs') {
        var fs = b.fs;
        kpis = [kpi(String(b.devices.length), t('kpiDevices')), kpi(fs.data, t('kpiData')), kpi(fs.meta, t('kpiMeta')),
          kpi(fs.ok ? gib(b.usable) : t('none'), t('kpiUsableB')), kpi(t(bHealthKey[b.health]), t('kpiFsHealth'), hcls(b.health))];
        body = h('div', { class: 'zb-body' },
          h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('topoB')), bTopology(b)),
          h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('cmdTitle')), commands(b.commands)));
        var bp = bPlacement(b);
        if (bp) place = h('div', { class: 'zb-col' }, h('div', { class: 'zb-h' }, t('placeB')), bp);
      } else {
        kpis = [kpi(z.health, t('kpiZHealth'), hcls(z.health)), kpi(gib(z.usable), t('kpiZUsable')),
          kpi(t(bHealthKey[b.health]), t('kpiBHealth'), hcls(b.health)), kpi(b.fs.ok ? gib(b.usable) : t('none'), t('kpiBUsable')),
          kpi(String(z.datasets.length + b.subvols.length), t('kpiNamespaces'))];
        body = compare(st);
      }
      c.stage.replaceChildren(h('div', { class: 'zb' }, h('div', { class: 'zb-kpis' }, kpis), body, place));
    },

    caption: function (c) {
      var st = c.state, z = st.z, b = st.b;
      var bold = function (x) { return h('b', null, x); };
      var out = [];
      var add = function (parts) { if (out.length) out.push(' '); out = out.concat(parts); };
      if (st.mode === 'compare') {
        add(t.parts('capCompare', { zh: data('b', z.health), zu: bold(gib(z.usable)), bh: bold(t(bHealthKey[b.health])), bu: bold(gib(b.usable)) }));
        return out;
      }
      if (st.mode === 'zfs') {
        add(t.parts('capZRule', { n: bold(t.n('nVdevs', z.dataVdevs)), usable: bold(gib(z.usable)), raw: gib(z.raw) }));
        if (z.mixed) add(t.parts('capZMix', { type: data('span', z.vdevs[1].type), w: t.n('nDisks', z.vdevs[1].disks.length) }));
        if (z.vdevs.some(function (v) { return v.role !== 'data'; })) add(t.parts('capZAux'));
        if (z.health === 'DEGRADED') add(t.parts('capZDegraded', { n: bold(t.n('nDisks', z.failed)) }));
        if (z.health === 'FAULTED') {
          var bad = z.vdevs.filter(function (v) { return v.role === 'data' && !v.cap.ok; })[0];
          var k = z.vdevs.filter(function (v) { return v.role === 'data'; }).indexOf(bad) + 1;
          add(t.parts('capZFaulted', { v: bold(String(k)), type: data('span', bad.type), off: t.n('nDisks', bad.cap.offline), faults: t.n('nDisks', bad.cap.faults) }));
        }
        return out;
      }
      var fs = b.fs;
      if (!fs.ok) {
        add(t.parts('capBTooFew', { data: data('span', fs.data), meta: data('span', fs.meta), need: bold(String(fs.need)), have: fs.error.have }));
        return out;
      }
      add(t.parts('capBRule', { n: bold(String(b.devices.length)), data: data('b', fs.data), meta: data('b', fs.meta), usable: bold(gib(b.usable)), raw: gib(b.raw) }));
      if (fs.data === 'dup' || fs.meta === 'dup') add(t.parts('capBDup'));
      if (b.health === 'degraded') add(t.parts('capBDegraded', { n: bold(t.n('nDevices', b.failed)) }));
      if (b.health === 'unavailable') {
        var weak = L.tolerates(fs.meta) < L.tolerates(fs.data) ? 'capBLostMeta' : 'capBLost';
        add(t.parts(weak, { n: bold(t.n('nDevices', b.failed)), tol: t.n('nDevices', b.tol) }));
      }
      if (b.health === 'warning' || (b.health !== 'online' && /raid[56]/.test(fs.data + fs.meta))) add(t.parts('capBRaid56'));
      return out;
    }
  });
})();
</script>
</body>
