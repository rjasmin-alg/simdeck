     quillmoor.example), a strip of two sites with their DCs drawn apart from the domains, and a card with the facts of
     the selected box. The lens (the one visible param) lights the security, replication or GPO boundary; the user,
     the computer and the group can be dragged (or clicked, then a box clicked) into another container. Model: sim.js;
     rules: SPEC.md; words: strings.js. -->

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var PRESET_KEY = { 'security': 'presetSecurity', 'replication': 'presetReplication', 'policy': 'presetPolicy', 'quillmoor-as-is': 'presetAsIs' };
  /** Each domain's series colour (replication lens); the domain's name is always written too. */
  var DOM_C = { q: 'var(--c1)', brk: 'var(--c3)', thf: 'var(--c4)' };
  var HEAD_KEY = { user: 'hUser', computer: 'hComputer', group: 'hGroup' };
  var KIND_KEY = { forest: 'kForest', tree: 'kTree', domain: 'kDomain', ou: 'kOu', container: 'kContainer', site: 'kSite', dc: 'kDc', user: 'kUser', computer: 'kComputer', group: 'kGroup' };

  /** Data (names, DNs, subnets) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  /** A long DNS name that may break after its dots. */
  function dnsName(name) {
    var out = [];
    name.split('.').forEach(function (l, i, a) { out.push(l + (i < a.length - 1 ? '.' : '')); if (i < a.length - 1) out.push(h('wbr')); });
    return h('span', { translate: 'no' }, out);
  }
  /** An icon kept on the same line as the name after it. */
  function named(icon, name) { return h('span', { class: 'ad-named' }, icon, name); }
  function nameOf(id) { var n = L.node(id); return n ? n.name : id; }
  /** A list of data names, joined with the language's separator. */
  function list(names) {
    var out = [];
    names.forEach(function (x, i) { if (i) out.push(t('listSep')); out.push(typeof x === 'string' ? data(x) : x); });
    return h('span', null, out);
  }
  /** Parts of a string with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) { if (bit) out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit); });
    });
    return out;
  }
  function countText(c) {
    var parts = [];
    if (c.users) parts.push(t.n('nUsers', c.users));
    if (c.computers) parts.push(t.n('nComputers', c.computers));
    return parts.join(t('listSep'));
  }

  // ── drawing ──
  function cls(base, id, s) {
    var c = base;
    if (s.selected === id) c += ' ad-sel';
    if (s.lit.nodes.indexOf(id) >= 0) c += ' ad-lit';
    if (s.lit.grey.indexOf(id) >= 0) c += ' ad-grey';
    if (s.attempt && !s.attempt.ok && s.attempt.target === id) c += ' ad-refused';
    if (s.held && (L.kindOf(id) === 'ou' || L.kindOf(id) === 'container') && L.domainOf(id) === L.domainOf(s.held)) c += ' ad-target';
    return c;
  }
  function head(id, kids) {
    return h('button', { type: 'button', class: 'ad-head', dataset: { pick: id } }, kids);
  }
  function refusedBadge(s, id) {
    return s.attempt && !s.attempt.ok && s.attempt.target === id ? h('span', { class: 'ad-badge ad-bad' }, t('refused')) : null;
  }
  /** Policy lens: in the head, whether a GPO can be linked here; under it, the GPOs linked here. */
  function gpoMark(s, id) {
    if (s.lens !== 'policy') return null;
    return L.canLinkGpo(id) ? h('span', { class: 'ad-badge ad-yes' }, '✓ ' + t('gpoCan')) : h('span', { class: 'ad-badge ad-no' }, '✕ ' + t('gpoCannot'));
  }
  function gpoBadges(s, id) {
    var links = s.lens === 'policy' ? L.gpoLinks(id) : [];
    return links.length ? h('div', { class: 'ad-badges' }, links.map(function (g) { return h('span', { class: 'ad-gpo', translate: 'no' }, g); })) : null;
  }
  function chip(s, objId) {
    var o = L.node(objId);
    var moved = s.attempt && s.attempt.ok && s.attempt.obj === objId;
    return h('button', {
      type: 'button', draggable: 'true', class: 'ad-chip' + (s.held === objId ? ' ad-held' : '') + (moved ? ' sd-changed' : ''),
      dataset: { obj: objId, kind: o.kind }, 'aria-label': t('chipLabel', { obj: o.name, kind: t(KIND_KEY[o.kind]) }),
      'aria-pressed': s.held === objId ? 'true' : 'false'
    }, data(o.name));
  }

  /** Boxes drawn in two columns, and children that span both columns or two rows (the OU tree of quillmoor). */
  var TWO = { q: true, 'q-quillmoor': true };
  var SPAN = { 'q-quillmoor': { gridColumn: '1 / -1' }, 'q-staff': { gridRow: 'span 2' } };
  function children(s, parent) {
    var kids = L.CONTAINERS.filter(function (c) { return c.parent === parent; });
    return kids.length ? h('div', { class: 'ad-body' + (TWO[parent] ? ' ad-two' : '') }, kids.map(function (c) { return box(s, c); })) : null;
  }
  function box(s, c) {
    var count = countText(c);
    var objs = L.objectsIn(s.placed, c.id);
    return h('section', { class: cls('ad-box' + (c.kind === 'container' ? ' ad-cn' : ''), c.id, s), dataset: { node: c.id }, style: SPAN[c.id] || null },
      head(c.id, [named(h('span', { class: c.kind === 'ou' ? 'ad-tab' : 'ad-cnbox', 'aria-hidden': 'true' }), data(c.name)),
        count ? h('span', { class: 'ad-count' }, count) : null, gpoMark(s, c.id)]),
      objs.length ? h('div', { class: 'ad-objs' }, objs.map(function (o) { return chip(s, o); })) : null,
      gpoBadges(s, c.id), refusedBadge(s, c.id),
      children(s, c.id));
  }

  function domainBox(s, d) {
    var badges = [];
    var trust = L.trusts().filter(function (x) { return x.b === d.id; })[0];
    if (trust) badges.push(h('span', { class: 'ad-badge ad-dashed' }, t(trust.kind === 'parent-child' ? 'trustPc' : 'trustTr')));
    if (s.lens === 'security') badges.push(h('span', { class: 'ad-badge ad-no' }, t('bNotBoundary')));
    if (s.lens === 'replication') badges.push(h('span', { class: 'ad-badge' }, t('bPartition')));
    return h('section', { class: cls('ad-dom', d.id, s), dataset: { node: d.id }, style: { '--sw': DOM_C[d.id] } },
      head(d.id, [h('span', { class: 'ad-kind' }, t('kDomain')), dnsName(d.name), gpoMark(s, d.id)]),
      badges.length ? h('div', { class: 'ad-badges' }, badges) : null,
      gpoBadges(s, d.id),
      refusedBadge(s, d.id),
      children(s, d.id));
  }

  function forestBox(s) {
    var trees = L.trees();
    var badges = [];
    if (s.lens === 'security') badges.push(h('span', { class: 'ad-badge' }, t('bSecurity')));
    if (s.lens === 'replication') badges.push(h('span', { class: 'ad-badge' }, t('bSchemaConfig')));
    return h('section', { class: cls('ad-forest', 'forest', s), dataset: { node: 'forest' } },
      head('forest', [h('span', { class: 'ad-kind' }, t('kForest')), data(L.FOREST.name), badges, gpoMark(s, 'forest'), refusedBadge(s, 'forest')]),
      h('div', { class: 'ad-trees' }, trees.map(function (tr) {
        return h('section', { class: cls('ad-tree', tr.id, s), dataset: { node: tr.id } },
          head(tr.id, [h('span', { class: 'ad-kind' }, t('kTree')), dnsName(tr.name), refusedBadge(s, tr.id)]),
          h('div', { class: 'ad-doms', style: tr.domains.length === 1 ? { gridTemplateColumns: 'minmax(0, 1fr)' } : null },
            tr.domains.map(function (d) { return domainBox(s, L.node(d)); })));
      })));
  }

  function dcBox(s, x) {
    var parts = null;
    if (s.lens === 'replication') {
      var gcs = L.partitionsOn(x.id).filter(function (p) { return p.copy === 'partial'; }).map(function (p) { return nameOf(p.partition.slice(7)).split('.')[0]; });
      var own = nameOf(x.domain).split('.')[0];
      parts = h('div', { class: 'ad-parts' },
        h('span', { class: 'ad-part ad-sc' }, t('pSC')),
        h('span', { class: 'ad-part ad-full', style: { '--sw': DOM_C[x.domain] } }, t.parts(x.rodc ? 'pFullRo' : 'pFull', { d: data(own) })),
        gcs.length ? h('span', { class: 'ad-part ad-partial' }, t.parts('pGc', { list: list(gcs) })) : null);
    }
    return h('div', { class: cls('ad-dc' + (x.rodc ? ' ad-ro' : ''), x.id, s), dataset: { node: x.id } },
      head(x.id, [h('b', { translate: 'no' }, x.name), h('span', { class: 'ad-count', translate: 'no' }, nameOf(x.domain)),
        x.gc ? h('span', { class: 'ad-badge' }, t('gc')) : null, x.rodc ? h('span', { class: 'ad-badge ad-dashed' }, t('rodc')) : null]),
      parts, refusedBadge(s, x.id));
  }

  function sitesStrip(s) {
    var link = L.SITE_LINKS[0];
    var siteEl = function (site) {
      return h('section', { class: cls('ad-site', site.id, s), dataset: { node: site.id } },
        head(site.id, [h('span', { class: 'ad-kind' }, t('kSite')), data(site.name), h('span', { class: 'ad-count', translate: 'no' }, site.subnets.join(', ')),
          gpoMark(s, site.id), refusedBadge(s, site.id)]),
        L.DCS.filter(function (x) { return x.site === site.id; }).map(function (x) { return dcBox(s, x); }));
    };
    return h('div', { class: 'ad-sites', role: 'group', 'aria-label': t('sitesTitle') },
      h('div', { class: 'ad-sitelist' }, siteEl(L.SITES[0]),
        h('div', { class: 'ad-link' }, h('b', null, t('sitesTitle')), h('span', null, t('siteLink')), data(link.name)), siteEl(L.SITES[1])));
  }

  // ── the facts card ──
  function facts(s) {
    var id = s.selected;
    var n = id && L.node(id);
    if (s.held) return [h('h2', null, h('small', null, t(HEAD_KEY[L.kindOf(s.held)])), data(nameOf(s.held))), h('p', { class: 'ad-hold' }, t.parts('holding', { obj: data(nameOf(s.held)), again: data(nameOf(s.held)) }))].concat(objFacts(s, s.held));
    if (!n) return [h('p', null, t('cardEmpty')), h('p', null, t('cardMove'))];
    var title = h('h2', null, h('small', null, t(HEAD_KEY[n.kind] || KIND_KEY[n.kind])), data(n.name));
    var lines;
    if (n.kind === 'forest') lines = forestFacts();
    else if (n.kind === 'tree') lines = treeFacts(n);
    else if (n.kind === 'domain') lines = domainFacts(n);
    else if (n.kind === 'ou' || n.kind === 'container') lines = containerFacts(n);
    else if (n.kind === 'site') lines = siteFacts(n);
    else if (n.kind === 'dc') lines = dcFacts(n);
    else return [title].concat(objFacts(s, id));
    return [title, h('ul', null, lines.map(function (x) { return h('li', null, x); }))];
  }
  function forestFacts() {
    return [
      t.parts('fForestEa', { list: list(L.reach('enterprise-admins').map(nameOf)) }),
      t('fForestShared'),
      t('fForestDomain'),
      t.parts('fForestTrees', { list: list(L.trees().map(function (x) { return x.name; })) })
    ];
  }
  function treeFacts(tr) {
    var out = [t.parts('fTreeName', { root: data(tr.name) }), t.parts('fTreeDomains', { list: list(tr.domains.map(nameOf)) })];
    L.trusts().forEach(function (x) {
      if (tr.domains.indexOf(x.b) < 0) return;
      if (x.kind === 'parent-child') out.push(t.parts('fTreePc', { child: data(nameOf(x.b)), parent: data(nameOf(x.a)) }));
      else out.push(t.parts('fTreeTr', { root: data(nameOf(x.b)), forest: data(nameOf(x.a)) }));
    });
    out.push(t.parts('fTreePath', { path: data(L.trustPath('brk', 'thf').map(nameOf).join(' → ')) }));
    return out;
  }
  function domainFacts(d) {
    var reps = L.replicas('domain:' + d.id);
    var full = reps.filter(function (r) { return r.copy === 'full'; }).map(function (r) { return nameOf(r.dc); });
    var part = reps.filter(function (r) { return r.copy === 'partial'; }).map(function (r) { return nameOf(r.dc); });
    var out = [t.parts('fDomRepl', { full: list(full), partial: list(part) }), t('fDomAdmins'),
      t.parts('fDomSites', { sites: list(L.sitesOfDomain(d.id).map(nameOf)) }),
      t.parts('fDomGpos', { list: list(L.gpoLinks(d.id)) })];
    L.trusts().forEach(function (x) {
      if (x.a !== d.id && x.b !== d.id) return;
      out.push(t.parts('fDomTrust', { other: data(nameOf(x.a === d.id ? x.b : x.a)), kind: t(x.kind === 'parent-child' ? 'trustKind_pc' : 'trustKind_tr') }));
    });
    return out;
  }
  function containerFacts(c) {
    var out = [];
    if (c.kind === 'ou') {
      out.push(t.parts('fOu', { domain: data(nameOf(c.domain)) }), t('fOuNoSid'));
      out.push(c.gpos.length ? t.parts('fGpos', { list: list(c.gpos) }) : t('fNoGpos'));
    } else {
      out.push(t('fCn'), t('fCnScope'), t(c.name === 'CN=Users' ? 'fCnUsers' : 'fCnComputers'));
    }
    var count = countText(c);
    if (count) out.push(t.parts('fCount', { count: count }));
    return out;
  }
  function siteFacts(site) {
    var dcs = L.DCS.filter(function (x) { return x.site === site.id; }).map(function (x) { return x.name; });
    return [
      t.parts('fSite', { subnets: list(site.subnets), link: data(L.SITE_LINKS[0].name) }),
      t.parts('fSiteDcs', { dcs: list(dcs), domains: list(L.domainsInSite(site.id).map(nameOf)) }),
      t('fSiteIndep'), t('fSiteGpo')
    ];
  }
  function dcFacts(x) {
    var parts = L.partitionsOn(x.id).map(function (p) {
      if (p.partition === 'schema') return t('partSchema');
      if (p.partition === 'config') return t('partConfig');
      var d = data(nameOf(p.partition.slice(7)));
      return h('span', null, t.parts(p.copy === 'full' ? 'partFull' : 'partPartial', { d: d }));
    });
    var out = [t.parts('fDc', { domain: data(nameOf(x.domain)), site: data(nameOf(x.site)) }), t.parts('fDcHolds', { parts: list(parts) })];
    if (x.rodc) out.push(t('fDcRodc'));
    return out;
  }
  function objFacts(s, id) {
    var o = L.node(id);
    var gpos = s.gpos[id].map(function (g) { return g.gpo; });
    var lines = [t.parts('fObjDn', { dn: h('span', { class: 'ad-dn', translate: 'no' }, s.dn[id]) }), t('fObjSid'), t('fObjOne')];
    if (o.kind === 'group') lines.push(t('fObjGroup'), t('fObjNoGpo'));
    else lines.push(t.parts('fObjGpos', { list: list(gpos) }));
    return [h('ul', null, lines.map(function (x) { return h('li', null, x); }))];
  }

  // ── interaction: click a box to select it; click an object to pick it up, then a box to put it there ──
  function sim() { return window.simdeck; }
  function drop(obj, target) {
    var s = sim().state;
    var r = L.tryPlace(s.placed, obj, target);
    var patch = { held: '', sel: obj };
    if (r.ok && r.same) patch.last = '';
    else { patch.last = obj + '>' + target; if (r.ok) patch[obj] = target; }
    sim().set(patch);
  }
  function onPick(id) {
    var p = sim().params;
    if (p.held) { drop(p.held, id); return; }
    sim().set({ sel: p.sel === id ? '' : id, last: '' });
  }
  function onChip(id) {
    var p = sim().params;
    if (p.held === id) sim().set({ held: '', last: '' });
    else if (p.held) drop(p.held, sim().state.placed[id]);
    else sim().set({ held: id, sel: id, last: '' });
  }
  var DND = 'application/x-simdeck-object';
  var wired = null;
  function wire(stage) {
    if (wired === stage) return;
    wired = stage;
    stage.addEventListener('click', function (e) {
      var c = e.target.closest('[data-obj]');
      if (c) { onChip(c.dataset.obj); return; }
      var b = e.target.closest('[data-node]');
      if (b) onPick(b.dataset.node);
    });
    stage.addEventListener('dragstart', function (e) {
      var c = e.target.closest && e.target.closest('[data-obj]');
      if (!c) return;
      e.dataTransfer.setData(DND, c.dataset.obj);
      e.dataTransfer.effectAllowed = 'move';
    });
    function ours(e) { return Array.prototype.indexOf.call(e.dataTransfer.types || [], DND) >= 0; }
    stage.addEventListener('dragover', function (e) { if (ours(e) && e.target.closest && e.target.closest('[data-node]')) e.preventDefault(); });
    stage.addEventListener('drop', function (e) {
      if (!ours(e)) return;
      e.preventDefault();
      var box = e.target.closest && e.target.closest('[data-node]');
      var obj = e.dataTransfer.getData(DND);
      if (box && L.node(obj) && L.OBJECTS.indexOf(L.node(obj)) >= 0) drop(obj, box.dataset.node);
    });
  }
  /** Keep keyboard focus on the same box or object across the re-render. */
  function focusKey() {
    var a = document.activeElement;
    if (!a || !a.dataset) return null;
    return a.dataset.obj ? '[data-obj="' + a.dataset.obj + '"]' : a.dataset.pick ? '[data-pick="' + a.dataset.pick + '"]' : null;
  }

  // ── hidden params: the stage's state, kept in the URL like any param ──
  var IDS = L.allIds();
  function opts(values) { return values.map(function (v) { return [v, v || '-']; }); }
  var lastValues = [''];
  L.OBJECTS.forEach(function (o) { IDS.forEach(function (id) { lastValues.push(o.id + '>' + id); }); });
  var cont = L.CONTAINERS.map(function (c) { return c.id; });
  function hiddenSelect(key, values) { return { key: key, type: 'select', label: t('hidden'), options: opts(values), visible: function () { return false; } }; }

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'lens', type: 'choice', label: t('lens'), options: [['none', t('lensNone')], ['security', t('lensSecurity')], ['replication', t('lensReplication')], ['policy', t('lensPolicy')]] },
      hiddenSelect('sel', [''].concat(IDS)),
      hiddenSelect('held', [''].concat(L.OBJECTS.map(function (o) { return o.id; }))),
      hiddenSelect('ana', cont),
      hiddenSelect('pc07', cont),
      hiddenSelect('gprojects', cont),
      hiddenSelect('last', lastValues)
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(PRESET_KEY[x.id]), hint: t(PRESET_KEY[x.id] + 'Hint'), params: x.params };
    }),

    legend: [
      { shape: 'ad-forest', label: t('legForest') },
      { shape: 'ad-tree', label: t('legTree') },
      { shape: 'ad-domain', label: t('legDomain') },
      { shape: 'ad-ou', label: t('legOu') },
      { shape: 'ad-cn', label: t('legContainer') },
      { shape: 'ad-site', label: t('legSite') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var keep = focusKey();
      c.stage.replaceChildren(h('div', { class: 'ad ad-lens-' + s.lens },
        h('div', { class: 'ad-world' }, forestBox(s), sitesStrip(s)),
        h('aside', { class: 'ad-card' }, facts(s))));
      wire(c.stage);
      if (keep) { var el = c.stage.querySelector(keep); if (el) el.focus({ preventScroll: true }); }
    },

    caption: function (c) {
      var s = c.state;
      var a = s.attempt;
      if (a && !a.ok) {
        var tv = { obj: data(nameOf(a.obj)), target: data(nameOf(a.target)) };
        if (a.reason === 'other-domain') return rich('cap_other', Object.assign(tv, { from: data(nameOf(L.domainOf(a.obj))), to: data(nameOf(L.domainOf(a.target))) }));
        if (a.reason === 'site') return rich('cap_site', tv);
        if (a.reason === 'not-container') return rich('cap_notContainer', tv);
        return t('cap_unknown');
      }
      if (s.held) return t.parts('capHeld', { obj: data(nameOf(s.held)), domain: data(nameOf(L.domainOf(s.held))) });
      if (a && a.ok) return objCaption(s, a.obj, true);
      var id = s.selected, k = id ? L.kindOf(id) : null;
      if (k === 'forest' || !k) {
        if (s.lens === 'security') return rich('capSecurity');
        if (s.lens === 'replication') return rich('capReplication');
        if (s.lens === 'policy' && !k) return rich('capPolicy');
        if (k) return rich('capForest');
        return t('capStart');
      }
      if (k === 'tree') return rich('capTree');
      if (k === 'domain') return rich('capDomain');
      if (k === 'ou') return rich('capOu');
      if (k === 'container') {
        var objs = L.objectsIn(s.placed, id).filter(L.receivesGpo);
        return objs.length ? rich('capCn', { cn: data(nameOf(id)), obj: data(nameOf(objs[0])) }) : rich('capCnEmpty', { cn: data(nameOf(id)) });
      }
      if (k === 'site') return rich('capSite', { site: data(nameOf(id)), domains: list(L.domainsInSite(id).map(nameOf)) });
      if (k === 'dc') return rich('capDc', { dc: data(nameOf(id)) });
      return objCaption(s, id, false);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && window.simdeck && window.simdeck.params.held) window.simdeck.set({ held: '' });
  });
  var lastLens = window.simdeck.params.lens;
  window.simdeck.on(function (c) {
    if (c.params.lens === lastLens) return;
    lastLens = c.params.lens;
    if (c.params.last) setTimeout(function () { window.simdeck.set({ last: '' }); }, 0);
  });

  /** An object's caption: in a container, the task's "domain-level policy only" line; in an OU, its OU GPOs. */
  function objCaption(s, id, moved) {
    var where = s.placed[id];
    var out = [];
    if (moved) out = [t('capMoved'), ' '];
    if (!L.receivesGpo(id)) return out.concat(t.parts('capGroup', { obj: data(nameOf(id)), cn: data(nameOf(where)) }));
    if (L.kindOf(where) === 'container') return out.concat(rich('capCn', { cn: data(nameOf(where)), obj: data(nameOf(id)) }));
    var ouGpos = s.gpos[id].filter(function (g) { return L.kindOf(g.at) === 'ou'; }).map(function (g) { return g.gpo; });
    return out.concat(ouGpos.length ? rich('capObjOu', { obj: data(nameOf(id)), ou: data(nameOf(where)), n: list(ouGpos) })
      : rich('capObjOuNone', { obj: data(nameOf(id)), ou: data(nameOf(where)) }));
  }
})();
</script>
</body>
</html>
