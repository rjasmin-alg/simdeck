<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var COLOUR = { C: '1', A: '2', B: '3' };

  /** Data (addresses, MACs, message and state names, times) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls === undefined ? 'dh-mono' : cls || null }, text); }
  /** Caption parts with *English term* turned into <em lang="en"> (the Croatian term rule). */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      // a placeholder used twice is the same node: clone it, or appending moves it
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }

  // ── times: seconds for the 600 s lease, else days, hours, minutes ──
  function num(v) { var s = String(Math.round(v * 10) / 10); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function fmt(v, lease) {
    if (lease === 600) return t('tS', { v: num(v) });
    var d = Math.floor(v / 86400), r = v - d * 86400, hh = Math.floor(r / 3600);
    r -= hh * 3600;
    var mm = Math.floor(r / 60), ss = r - mm * 60, out = [];
    if (d) out.push(t('tD', { v: d }));
    if (hh) out.push(t('tH', { v: hh }));
    if (mm) out.push(t('tMin', { v: mm }));
    if (ss) out.push(t('tS', { v: num(ss) }));
    return out.length ? out.join(' ') : t('tS', { v: 0 });
  }

  /** The whole run for these params (cached): the lease bar keeps one scale for all its steps. */
  var runCache = {};
  function axisMax(p) {
    var key = JSON.stringify(p);
    if (runCache[key]) return runCache[key];
    var s = L.initial(p), max = p.lease;
    for (var n = 1; !s.done && n < 60; n++) {
      s = L.step(s, n, p);
      max = Math.max(max, s.t, s.client.exp || 0);
      s.servers.forEach(function (x) { x.leases.forEach(function (l) { if (l.mac === L.CLIENT.mac) max = Math.max(max, l.expires); }); });
    }
    return (runCache[key] = max);
  }

  function laneName(id) { return id === 'C' ? t('client') : id === 'A' ? t('serverA') : t('serverBName'); }
  function changedRow(c, i) { return !!c.prev && i >= c.prev.rows.length; }

  // ── lanes (the kit draws the card, its mark and name; the page fills the body) ──
  function clientLane(c) {
    var s = c.state, cl = s.client, pc = c.prev && c.prev.client;
    var stChanged = !!pc && (pc.state !== cl.state || pc.addr !== cl.addr || pc.leaseStart !== cl.leaseStart);
    var fwd = c.dir === 'forward';
    return { id: 'C', c: COLOUR.C, shape: 'square', name: t('client'), tags: data(L.CLIENT.name), body: [
      h('div', { class: 'dh-sub' }, data(L.CLIENT.mac, '')),
      h('div', { class: 'dh-state' },
        h('b', { class: stChanged ? 'sd-changed' + (fwd ? ' sd-anim-in' : '') : null, translate: 'no' }, cl.state),
        h('span', null, t('st' + cl.state))),
      h('dl', { class: 'dh-kv' },
        h('dt', null, t('addr')), h('dd', { class: stChanged && cl.addr ? 'sd-changed' : null }, cl.addr && cl.state !== 'OFF' ? data(cl.addr, '') : h('span', { class: 'dh-muted' }, t('noAddr'))),
        cl.opts && cl.state !== 'OFF' ? [h('dt', null, t('optRouter')), h('dd', null, data(cl.opts.router, '')),
          h('dt', null, t('optDns')), h('dd', { class: pc && pc.opts && pc.opts.dns !== cl.opts.dns ? 'sd-changed' : null }, data(cl.opts.dns, ''))] : null)] };
  }

  function serverLane(c, srv) {
    var s = c.state, prev = c.prev ? L.server(c.prev, srv.id) : null, fwd = c.dir === 'forward', lease = s.p.lease;
    var rows = srv.leases.map(function (l) {
      var old = prev && prev.leases.filter(function (x) { return x.addr === l.addr && x.mac === l.mac; })[0];
      var ch = !!prev && (!old || old.expires !== l.expires);
      return h('li', { class: ch ? 'sd-changed' + (fwd ? ' sd-anim-in' : '') : null, dataset: { k: 'lease' } },
        data(l.addr + ' · …' + l.mac.slice(-5), ''), ' ', h('span', null, t('until', { t: fmt(l.expires, lease) })));
    });
    if (srv.offered) {
      var newOffer = !!prev && !(prev.offered && prev.offered.addr === srv.offered.addr);
      rows.push(h('li', { class: newOffer ? 'sd-changed' + (fwd ? ' sd-anim-in' : '') : null, dataset: { k: 'offer' } },
        h('span', null, t('offered')), ' ', data(srv.offered.addr, '')));
    }
    var upChanged = !!prev && prev.up !== srv.up;
    var dnsChanged = !!prev && prev.opts.dns !== srv.opts.dns;
    return { id: srv.id, c: COLOUR[srv.id], name: laneName(srv.id), state: srv.up ? null : 'down',
      tags: h('span', { class: 'dh-badge' + (upChanged ? ' sd-changed' : ''), dataset: { up: String(srv.up) } }, srv.up ? t('up') : t('down')),
      body: [
        h('div', { class: 'dh-sub' }, data(srv.ip, ''), srv.partner ? [' · ', t('partnerRole')] : null),
        h('dl', { class: 'dh-kv' }, h('dt', null, t('optDns')), h('dd', { class: dnsChanged ? 'sd-changed' : null }, data(srv.opts.dns, ''))),
        h('div', { class: 'dh-sub' }, t('leases')),
        h('ul', { class: 'dh-tab' }, rows.length ? rows : h('li', { class: 'dh-empty' }, t('empty')))] };
  }

  // ── chart rows ──
  function reaction(did, m) {
    switch (did) {
      case 'standby': return t('reStandby');
      case 'silent': return t('reSilent');
      case 'full': return t('reFull');
      case 'lateOffer': return t('reLate');
      case 'ackIgnored': return t('reIgnored');
      case 'released': return t('reReleased');
      case 'freed': return t.parts('reFreed', { addr: data(m.freed, '') });
      default: return null;
    }
  }
  function cause(cause) {
    var word = { t1: 'T1', t2: 'T2' }[cause];
    if (word) return data(word, '');
    return { retry: t('causeRetry'), expiry: t('causeExpiry'), leave: t('causeLeave') }[cause] || null;
  }

  /** The lanes that are down in a row: a server is down from its "goes down" note on (that note's own lane is not). */
  function downIn(downAt, at, except) {
    return Object.keys(downAt).filter(function (id) { return downAt[id] <= at && id !== except; });
  }

  function msgRow(c, m, downAt, changed) {
    var re = {};
    m.to.forEach(function (id) {
      if (m.lost.indexOf(id) >= 0) return;
      var word = m.state === 'flight' && changed ? t('stFlight') : reaction(m.react[id], m);
      if (word) re[id] = word;
    });
    return { from: m.from, to: m.to, label: 'DHCP' + m.type, c: COLOUR[m.from], line: m.bcast ? 'dashed' : null, lost: m.lost, re: re,
      time: fmt(m.t, c.state.p.lease), cause: cause(m.cause), changed: changed, down: downIn(downAt, m.t) };
  }
  function noteRow(c, r, downAt, changed) {
    var text = r.what === 'down' ? t('noteDown', { srv: r.lane })
      : r.what === 'off' ? t('noteOff')
      : r.what === 'opt' ? t.parts('noteOpt', { dns: data(r.dns, '') })
      : t.parts('noteExpire', { addr: data(r.addr, '') });
    return { kind: 'note', lane: r.lane, text: text, k: r.what === 'down' ? 'fill' : null, time: fmt(r.t, c.state.p.lease), changed: changed,
      down: downIn(downAt, r.t, r.what === 'down' ? r.lane : null) };
  }

  function renderChart(c) {
    var s = c.state;
    var downAt = {};
    s.rows.forEach(function (r) { if (r.kind === 'note' && r.what === 'down') downAt[r.lane] = r.t; });
    return Simdeck.sequence({
      dir: c.dir,
      lanes: [clientLane(c)].concat(s.servers.map(function (srv) { return serverLane(c, srv); })),
      rows: s.rows.map(function (r, i) {
        return r.kind === 'msg' ? msgRow(c, L.msg(s, r.n), downAt, changedRow(c, i)) : noteRow(c, r, downAt, changedRow(c, i));
      }),
      empty: t('chartEmpty'),
      earlier: function (n) { return t.n('earlier', n); }
    });
  }

  // ── field card ──
  function shownMsg(c) {
    var s = c.state, before = c.prev ? c.prev.msgs.length : 0;
    if (s.msgs.length > before) return { m: s.msgs[before], fresh: true };
    if (s.last && s.last.msg) return { m: L.msg(s, s.last.msg), fresh: false };
    return s.msgs.length ? { m: s.msgs[s.msgs.length - 1], fresh: false } : null;
  }
  function renderMsg(c) {
    var sm = shownMsg(c), lease = c.state.p.lease;
    var box = h('section', { class: 'dh-box dh-msg' });
    if (!sm) { box.append(h('h2', null, t('msgNone'))); return box; }
    var m = sm.m, f = m.f;
    box.append(h('h2', null, t('msgTitle', { n: m.n }), ' · ', h('span', { class: 'dh-muted' }, sm.fresh ? t('msgNew') : t('msgOld'))));
    box.append(h('div', { class: 'dh-mtype' },
      h('b', { class: 'sd-fill' + (sm.fresh && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { c: COLOUR[m.from], b: String(m.bcast) }, translate: 'no' }, 'DHCP' + m.type),
      m.state === 'lost' ? h('span', { class: 'dh-badge' }, t('stLost')) : m.state === 'flight' ? h('span', { class: 'dh-muted' }, t('stFlight')) : null));
    var kv = [
      h('dt', null, t('fFrom')), h('dd', null, data(m.src, '')),
      h('dt', null, t('fTo')), h('dd', null, data(m.dst, '')),
      h('dt', null, t('fHow')), h('dd', null, h('span', null, m.bcast ? t('fBcast') : t('fUni'))),
      h('dt', { translate: 'no' }, 'ciaddr'), h('dd', null, data(f.ciaddr, '')),
      h('dt', { translate: 'no' }, 'yiaddr'), h('dd', null, data(f.yiaddr, '')),
      h('dt', { translate: 'no' }, 'chaddr'), h('dd', null, data(f.chaddr, '')),
      h('dt', null, t('fFlag')), h('dd', null, data(f.flagB ? '1' : '0', ''))
    ];
    var opts = [];
    if (f.o50) opts.push(h('dt', null, t('o50')), h('dd', null, data(f.o50, '')));
    if (f.o51) opts.push(h('dt', null, t('o51')), h('dd', null, data(fmt(f.o51, lease), '')));
    if (f.o54) opts.push(h('dt', null, t('o54')), h('dd', null, data(f.o54, '')));
    if (f.opts) opts.push(h('dt', null, t('o1')), h('dd', null, data(f.opts.mask, '')),
      h('dt', null, t('o3')), h('dd', null, data(f.opts.router, '')),
      h('dt', null, t('o6')), h('dd', null, data(f.opts.dns, '')));
    box.append(h('dl', { class: 'dh-kv' }, kv));
    if (opts.length) box.append(h('dl', { class: 'dh-kv', style: { marginTop: '0.35rem' } }, opts));
    if ((m.type === 'OFFER' || m.type === 'ACK') && f.ciaddr === '0.0.0.0') box.append(h('p', { class: 'dh-flagnote' }, f.flagB ? t('flagNote') : t('flagNoteOff')));
    return box;
  }

  // ── lease bar ──
  function renderBar(c) {
    var s = c.state, p = c.params, lease = s.p.lease, max = axisMax(p), cl = s.client;
    function pos(v) { return (Math.min(v, max) / max * 100) + '%'; }
    function span(a, b) { return { left: pos(a), width: ((Math.min(b, max) - Math.min(a, max)) / max * 100) + '%' }; }
    var histChanged = !!c.prev && (c.prev.hist.length !== s.hist.length || c.prev.hist[c.prev.hist.length - 1].state !== s.hist[s.hist.length - 1].state);
    var track = h('div', { class: 'dh-track' }, h('span', { class: 'dh-tlabel' }, t('client')));
    s.hist.forEach(function (seg, i) {
      var end = i + 1 < s.hist.length ? s.hist[i + 1].at : s.t;
      if (seg.state === 'INIT' || end <= seg.at) return;
      track.append(h('span', { class: 'dh-seg' + (histChanged && i === s.hist.length - 1 ? ' sd-changed' : ''), dataset: { st: seg.state }, style: span(seg.at, end) }));
    });
    var bound = cl.exp !== null && (cl.state === 'BOUND' || cl.state === 'RENEWING' || cl.state === 'REBINDING');
    if (bound) {
      [['BOUND', cl.leaseStart, cl.t1], ['RENEWING', cl.t1, cl.t2], ['REBINDING', cl.t2, cl.exp]].forEach(function (g) {
        var a = Math.max(g[1], s.t);
        if (g[2] > a) track.append(h('span', { class: 'dh-seg', dataset: { st: g[0], plan: '' }, style: span(a, g[2]) }));
      });
    }
    var axis = h('div', { class: 'dh-axis' }, track);
    // the server's record of this client: from the lease start to its expiry
    s.servers.forEach(function (srv) {
      var b = L.bindingOf(srv, L.CLIENT.mac);
      if (!b) return;
      var from = Math.max(0, b.expires - lease);
      axis.append(h('div', { class: 'dh-track' }, h('span', { class: 'dh-tlabel' }, t('barServer', { srv: srv.id })),
        h('span', { class: 'dh-seg', dataset: { st: 'REC' }, style: span(from, b.expires) })));
    });
    if (bound) {
      [[t('mStart'), cl.leaseStart], ['T1', cl.t1], ['T2', cl.t2], [t('mExp'), cl.exp]].forEach(function (mk, i) {
        var edge = cl[['leaseStart', 't1', 't2', 'exp'][i]] / max;
        axis.append(h('span', { class: 'dh-tick', dataset: { row: i % 2 ? '1' : '2', edge: edge > 0.93 ? 'end' : edge < 0.05 ? 'start' : '' }, style: { left: pos(mk[1]) } },
          h('span', null, i === 1 || i === 2 ? data(mk[0], '') : mk[0], h('span', { class: 'dh-tt' }, ' ', data(fmt(mk[1], lease), '')))));
      });
    }
    var nowEdge = s.t / max > 0.8 ? 'end' : '';
    var nowChanged = !!c.prev && c.prev.t !== s.t;
    axis.append(h('span', { class: 'dh-now', dataset: nowChanged ? { edge: nowEdge, moved: '' } : { edge: nowEdge }, style: { left: pos(s.t) } }, h('span', null, t.parts('now', { t: data(fmt(s.t, lease), '') }))));
    return h('section', { class: 'dh-box dh-lb' },
      h('div', { class: 'dh-lb-h' },
        h('h2', null, t('barTitle')),
        h('span', { class: 'dh-key' }, h('i', { dataset: { st: 'BOUND' } }), t('kBound')),
        h('span', { class: 'dh-key' }, h('i', { dataset: { st: 'RENEWING' } }), t('kRenew')),
        h('span', { class: 'dh-key' }, h('i', { dataset: { st: 'REBINDING' } }), t('kRebind')),
        h('span', { class: 'dh-key' }, h('i', { dataset: { st: 'OFF' } }), t('kOff'))),
      axis);
  }

  // ── captions ──
  function caption(c) {
    var s = c.state, r = s.last, cl = s.client, lease = s.p.lease;
    if (!r) return rich('capStart');
    var D = function (v) { return data(v); }, B = function (v) { return h('b', null, data(v)); };
    var BT = function (v) { return h('b', null, data(fmt(v, lease), '')); };
    var T = function (v) { return data(fmt(v, lease), ''); };
    var m = r.msg ? L.msg(s, r.msg) : null;
    var out = [];
    switch (r.did) {
      case 'discover':
        return rich('capDiscover', { src: D(m.src), dst: D(m.dst) });
      case 'delivered':
        if (r.type === 'DISCOVER') {
          var offers = r.acts.filter(function (a) { return a.did === 'offer'; });
          if (!offers.length) out = out.concat(rich('capNoOffer'));
          else {
            var one = offers.map(function (a) { return h('span', null, t.parts('capOfferOne', { srv: data(a.srv, ''), addr: B(a.addr) })); });
            var who = one.length === 1 ? one[0] : h('span', null, t.parts('list2', { a: one[0], b: one[1] }));
            out = out.concat(rich('capOffer', { who: who }));
          }
          r.acts.forEach(function (a) {
            if (a.did === 'standby') out = out.concat(rich('capStandby', { srv: data(a.srv, '') }));
            if (a.did === 'full') out = out.concat(rich('capFull', { srv: data(a.srv, '') }));
          });
          return out;
        }
        if (r.type === 'REQUEST' && r.kind === 'selecting') {
          r.acts.forEach(function (a) {
            if (a.did === 'ack') {
              var b = L.bindingOf(L.server(s, a.srv), L.CLIENT.mac);
              out = out.concat(rich('capAck', { srv: data(a.srv, ''), addr: B(a.addr), mac: D(L.CLIENT.mac), exp: T(b.expires) }));
              if (a.copy) out = out.concat(rich('capCopy', { p: data(a.copy, '') }));
            }
          });
          r.acts.forEach(function (a) { if (a.did === 'freed') out = out.concat(rich('capFreed', { srv: data(a.srv, ''), addr: D(a.addr) })); });
          return out;
        }
        if (r.type === 'REQUEST') {
          var ack = r.acts.filter(function (a) { return a.did === 'ack'; })[0];
          var nak = r.acts.filter(function (a) { return a.did === 'nak'; })[0];
          if (ack) {
            var bb = L.bindingOf(L.server(s, ack.srv), L.CLIENT.mac);
            return rich(r.kind === 'renewing' ? 'capRenewAck' : 'capRebindAck', { srv: data(ack.srv, ''), exp: T(bb.expires), addr: D(ack.addr) });
          }
          if (nak) return rich('capNakSent', { srv: data(nak.srv, '') });
          r.acts.forEach(function (a) { if (a.did === 'silent') out = out.concat(rich('capSilent', { srv: data(a.srv, '') })); });
          return out;
        }
        if (r.type === 'RELEASE') {
          var rel = r.acts[0];
          return rel ? rich('capReleased', { srv: data(rel.srv, ''), addr: B(rel.addr) }) : [];
        }
        return out;
      case 'choose':
        out = rich('capChoose', { srv: data(r.srv, ''), addr: B(r.addr), ip: D(L.server(s, r.srv).ip) });
        (r.late || []).forEach(function (x) { out = out.concat(rich('capLate', { srv: data(x.srv, ''), addr: D(x.addr) })); });
        return out;
      case 'bound':
        if (r.how === 'renew') out = rich('capRenewed', { now: T(s.t), t1: T(cl.t1), t2: T(cl.t2), exp: BT(cl.exp), addr: D(cl.addr) });
        else if (r.how === 'rebind') out = rich('capRebound', { srv: data(r.srv, ''), addr: B(cl.addr), now: T(s.t), exp: T(cl.exp) });
        else if (s.restarted) out = rich(cl.addr === s.lostAddr ? 'capBoundSame' : 'capBoundAgain', { addr: B(cl.addr), srv: data(r.srv, ''), now: T(s.t), exp: T(cl.exp) });
        else out = rich('capBound', { addr: B(cl.addr), lease: T(cl.lease), t1: BT(cl.t1), t2: BT(cl.t2), exp: T(cl.exp) });
        if (r.dnsChanged) out = out.concat(rich('capDns', { dns: B(r.dns) }));
        return out;
      case 'renew':
        out = rich('capRenew', { now: BT(s.t), srv: data(cl.serverId, '') });
        if (r.lost) out = out.concat(rich('capRenewLost', { srv: data(cl.serverId, ''), retry: r.retry === null ? T(cl.t2) : T(r.retry) }));
        return out;
      case 'retry':
        out = rich(r.phase === 'RENEWING' ? 'capRetryRenew' : 'capRetryRebind', { now: BT(s.t), srv: data(cl.serverId, '') });
        if (r.lost) out = out.concat(rich('capRetryLost'));
        return out;
      case 'rebind':
        out = rich('capRebind', { now: BT(s.t) });
        if (r.lost) out = out.concat(rich('capRebindLost'));
        return out;
      case 'expire':
        out = rich('capExpire', { addr: B(r.addr) });
        if (r.lost) out = out.concat(rich('capExpireLost'));
        return out;
      case 'down':
        return rich('capDown', { srv: data(r.srv, ''), now: T(s.t) });
      case 'opt':
        return rich('capOpt', { dns: B(r.dns), old: D(r.old) });
      case 'off':
        if (r.until === null || r.until === undefined) return rich('capOffNoLease', { now: T(s.t) });
        return rich('capOff', { now: T(s.t), srv: data(r.srv, ''), addr: B(r.addr), until: T(r.until), left: BT(r.until - s.t) });
      case 'release':
        return rich('capRelease', { now: T(s.t), srv: data(r.srv, ''), addr: D(r.addr) });
      case 'serverExpire':
        var offAt = s.hist.filter(function (x) { return x.state === 'OFF'; })[0];
        return rich('capServerExpire', { srv: data(r.srv, ''), now: T(s.t), addr: B(r.addr), left: BT(s.t - (offAt ? offAt.at : s.t)) });
      case 'nak':
        return rich('capNak', { addr: B(r.addr || '') });
      case 'ackIgnored':
      case 'lateOffer':
        return rich('capIgnored', { srv: data(r.srv, '') });
      default:
        return [];
    }
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'lease', type: 'choice', label: t('lease'), options: [[600, t('lease600')], [7200, t('lease2h')], [691200, t('lease8d')]], resets: true },
      { key: 'serverB', type: 'choice', label: t('serverB'), options: [['none', t('bNone')], ['plain', t('bPlain')], ['partner', t('bPartner')]], resets: true },
      { key: 'failAt', type: 'choice', label: t('failAt'), options: [['none', t('failNone')], ['t1', t('failT1')], ['t2', t('failT2')]], resets: true },
      { key: 'leave', type: 'choice', label: t('leave'), options: [['stay', t('leaveStay')], ['off', t('leaveOff')], ['release', t('leaveRelease')]], resets: true },
      { key: 'optChange', type: 'toggle', label: t('optChange'), resets: true,
        disabled: function (p) { return p.failAt !== 'none' ? t('optOff') : false; } },
      { key: 'bcastFlag', type: 'toggle', label: t('bcastFlag') }
    ],

    presets: [
      { id: 'lease-600', label: t('presetLease600'), params: { lease: 600 }, hint: t('presetLease600Hint') },
      { id: 'two-servers', label: t('presetTwo'), params: { serverB: 'plain' }, hint: t('presetTwoHint') },
      { id: 'server-dies', label: t('presetDies'), params: { failAt: 't1' }, hint: t('presetDiesHint') },
      { id: 'rebind-to-b', label: t('presetPartner'), params: { serverB: 'partner', failAt: 't1' }, hint: t('presetPartnerHint') },
      { id: 'no-backup', label: t('presetNoBackup'), params: { serverB: 'plain', failAt: 't1' }, hint: t('presetNoBackupHint') },
      { id: 'classroom-2h', label: t('presetClass'), params: { lease: 7200, leave: 'off' }, hint: t('presetClassHint') },
      { id: 'windows-8d', label: t('presetWin'), params: { lease: 691200, optChange: true }, hint: t('presetWinHint') }
    ],

    legend: [
      { shape: 'line', label: t('legUnicast') },
      { shape: 'dash', label: t('legBroadcast') },
      { shape: 'none', label: t('legLost') },
      { shape: 'none', label: t('legUpDown') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var chart = renderChart(c);
      c.stage.replaceChildren(h('div', { class: 'dh' }, chart, renderMsg(c), renderBar(c)));
      chart.fit();
    },

    caption: caption
  });
})();
</script>
</body>
