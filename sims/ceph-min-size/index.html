<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var C_UP = 1, C_CLEAN = 3, C_DEG = 7, C_CLIENT = 2;      // series colours: OSD / copy up, clean PG, degraded PG, client
  /** State marks next to the words: ✓ and ∅ as text; degraded (a half disc) and inactive (a pause sign) drawn in CSS,
      since the page font has no such glyphs. */
  function icon(g) {
    if (g === 'clean') return h('span', { class: 'cm-ic', translate: 'no' }, '✓');
    if (g === 'stale') return h('span', { class: 'cm-ic', translate: 'no' }, '∅');
    if (g === 'lost') return h('span', { class: 'cm-ic', translate: 'no' }, '✕');
    return h('span', { class: 'cm-ic cm-ic-' + g, 'aria-hidden': 'true' });
  }

  /** Data (OSD, host, pool and PG names, numbers) is not language: the word check skips translate="no". */
  function data(text) { return h('span', { translate: 'no' }, String(text)); }
  function sp(parts) { return [' '].concat(parts); }
  function num(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, t('thsep')); }
  function osd(x) { return 'osd.' + x; }
  function osdList(list) { return list.map(osd).join(', '); }
  function clock(m) { return Math.floor(m / 60) + ':' + ('0' + (m % 60)).slice(-2); }
  function pgId(s, pg) { return L.pgId(s.pool.id, pg); }
  function hostName(s, i) { return L.CLUSTERS[s.cluster].hosts[i].name; }
  /** A failure as words: osd.N (data) or "host ceph-01" ("Host ceph-01" at the start of a sentence). */
  function target(s, f, start) {
    if (f.indexOf('host:') === 0) return h('span', null, rich(start ? 'hostNamedStart' : 'hostNamed', { h: data(hostName(s, Number(f.slice(5)))) }));
    return data(f);
  }
  function firstFail(c) { return L.norm(c.params).fails[0]; }

  /** Caption parts from t(key) or, with n, t.n(key, n): node placeholders are put back where they land (cloned), and
      *English term* becomes <em lang="en"> (the Croatian term rule, for terms the glossary lacks). */
  var MARK = '\u0001';
  function rich(key, vars, n) {
    var nodes = [], flat = {};
    Object.keys(vars || {}).forEach(function (k) {
      var v = vars[k];
      if (v && typeof v === 'object' && v.nodeType) { flat[k] = MARK + nodes.length + MARK; nodes.push(v); } else flat[k] = v;
    });
    var text = n === undefined ? t(key, flat) : t.n(key, n, flat);
    var out = [];
    text.split(/\*([^*]+)\*/).forEach(function (bit, i) {
      if (!bit) return;
      bit.split(MARK).forEach(function (piece, j) {
        if (j % 2) out.push(nodes[Number(piece)].cloneNode(true));
        else if (piece) out.push(i % 2 ? h('em', { lang: 'en' }, piece) : piece);
      });
    });
    return out;
  }

  function changedSet(s) { var m = {}; ((s.ev && s.ev.changed) || []).forEach(function (pg) { m[pg] = true; }); return m; }
  function newlyDown(s) { return s.ev && s.ev.kind === 'fail' ? s.ev.newly : []; }

  // ── stage ──

  function head(c) {
    var s = c.state, prev = c.prev;
    var counts = L.GROUPS.map(function (g) {
      var moved = !!prev && prev.counts[g] !== s.counts[g];
      return h('span', { class: 'cm-st cm-st-' + g + (moved ? ' cm-now' : '') },
        icon(g), ' ', t.n('cnt_' + g, s.counts[g]));
    });
    return h('div', { class: 'cm-col' },
      h('div', { class: 'cm-head' },
        h('span', null, t('poolWord'), ' ', h('b', { translate: 'no' }, s.pool.name)),
        h('span', { class: 'cm-badge', translate: 'no' }, 'size ' + s.size),
        h('span', { class: 'cm-badge', translate: 'no' }, 'min_size ' + s.minSize),
        s.clock !== null ? h('span', { class: 'cm-clock' + (prev && prev.clock !== s.clock ? ' cm-now' : ''), translate: 'no' }, clock(s.clock)) : null),
      h('div', { class: 'cm-counts' }, counts));
  }

  function osdMap(c) {
    var s = c.state, newly = newlyDown(s);
    var hosts = L.CLUSTERS[s.cluster].hosts;
    return Simdeck.blockGrid({
      dir: c.dir,
      title: t('osdTitle'),
      meta: [t('osdMeta')],
      cellHeight: s.cluster === 'dr' ? '1.1rem' : '1.75rem',
      rows: hosts.map(function (hst, i) {
        var outHere = s.out.filter(function (x) { return hst.osds.indexOf(x) >= 0; });
        return {
          id: 'h' + i,
          label: data(hst.name),
          aside: outHere.length ? h('span', null, t('outAside', { x: outHere.join(', ') })) : '',
          cells: hst.osds.map(function (x) {
            if (s.out.indexOf(x) >= 0) return { text: String(x), kind: 'ghost' };
            var down = s.down.indexOf(x) >= 0;
            return { text: String(x), kind: down ? 'dead' : 'fill', c: C_UP, now: newly.indexOf(x) >= 0 };
          })
        };
      })
    });
  }

  function poolGrid(c) {
    var s = c.state;
    var perRow = s.pgNum > 128 ? 32 : 16;
    var cells = s.pgs.map(function (g, pg) {
      var cell = g === 'clean' ? { kind: 'fill', c: C_CLEAN } : g === 'degraded' ? { kind: 'soft', c: C_DEG }
        : g === 'inactive' ? { kind: 'bad' } : { kind: 'dead', text: '∅' };
      return cell;                                               // no changed mark: it would hide the state's pattern
    });
    var row = { id: 'pg', cells: cells, spans: [{ from: s.watched, len: 1, label: 'W', now: !!(s.ev && s.ev.kind === 'write') }] };
    var rows = Simdeck.blockGrid.split(row, perRow).map(function (r, k) {
      r.label = data(pgId(s, k * perRow) + '…');
      if (r.spans && !r.spans.length) delete r.spans;            // no band under rows without the watched PG
      return r;
    });
    return Simdeck.blockGrid({
      dir: c.dir,
      className: 'cm-pool',
      title: t('poolTitle'),
      meta: [h('span', null, data(s.pool.name), ' · ', t.n('pgCount', s.pgNum))],
      count: { text: h('span', null, icon('inactive'), ' ', t.n('cnt_down', s.counts.inactive + s.counts.stale)), hl: !!c.prev && (c.prev.counts.inactive + c.prev.counts.stale) !== (s.counts.inactive + s.counts.stale) },
      cellHeight: s.pgNum > 128 ? '0.85rem' : '1.55rem',
      rows: rows
    });
  }

  function zoom(c) {
    var s = c.state, ch = changedSet(s), ev = s.ev;
    var writing = ev && ev.kind === 'write' ? s.writes[ev.write - 1] : null;
    var last = s.writes.length ? s.writes[s.writes.length - 1] : null;
    var clientCells = [{ text: last ? 'W' + last.id : '', kind: last ? 'fill' : 'ghost', c: C_CLIENT, now: !!writing }];
    for (var k = 1; k < s.size; k++) clientCells.push(null);
    var rows = [{ id: 'cl', label: h('span', null, t('client')), cells: clientCells, aside: '' }];
    s.zoom.forEach(function (pg) {
      var g = s.pgs[pg];
      rows.push({
        id: 'pg' + pg,
        label: data(pgId(s, pg)),
        cells: L.copiesOf(s.cluster, s.size, pg).map(function (x) {
          var down = s.down.indexOf(x) >= 0;
          return { text: String(x), kind: down ? 'dead' : 'fill', c: C_UP };
        }),
        spans: pg === s.watched ? [{ from: 0, len: s.size, now: !!writing }] : [],
        aside: h('span', { class: 'cm-st cm-st-' + g + (ch[pg] ? ' cm-now' : '') }, icon(g), ' ', t('g_' + g))
      });
    });
    var links = writing ? [{ from: { row: 'cl', cell: 0 }, to: { row: 'pg' + s.watched, cell: 0 }, now: writing.status === 'ack', broken: writing.status !== 'ack' }] : [];
    return Simdeck.blockGrid({
      dir: c.dir,
      className: 'cm-zoom',
      title: t('zoomTitle', { n: s.zoom.length }),
      meta: [t('zoomMeta')],
      cols: s.size,
      cellHeight: '1.42rem',
      rows: rows,
      links: links
    });
  }

  function writeLine(s, w) {
    var st = w.status === 'ack' ? h('span', { class: 'cm-w-ack' }, t('wAck', { osds: osdList(w.on) }))
      : w.status === 'lost' ? h('span', { class: 'cm-w-lost' }, t('wLost', { osds: osdList(w.on) }))
      : h('span', { class: 'cm-w-blocked' }, icon('inactive'), ' ', t('wBlocked'));
    return h('div', { class: 'cm-w' }, h('b', { translate: 'no' }, t('wLine', { w: w.id, pg: pgId(s, w.pg) })), st);
  }

  function card(c) {
    var s = c.state;
    if (s.ev && s.ev.kind === 'summary') {
      var rows = s.ev.compare.map(function (r) {
        var bad = r.counts.inactive + r.counts.stale;
        return h('tr', { class: r.current ? 'cm-cur' : null },
          h('td', null, data(r.size + '/' + r.minSize), r.current ? h('span', { class: 'cm-muted' }, ' · ' + t('cmpNow')) : null),
          h('td', { class: r.counts.inactive ? 'cm-bad' : null, translate: 'no' }, String(r.counts.inactive)),
          h('td', { translate: 'no' }, String(r.counts.degraded)),
          h('td', { class: r.counts.stale ? 'cm-bad' : null, translate: 'no' }, String(r.counts.stale)),
          h('td', { class: bad || r.writes.lost ? 'cm-bad' : null, translate: 'no' },
            String(r.writes.ack), ' ', icon('clean'), ' · ', String(r.writes.blocked), ' ', icon('inactive'), ' · ', String(r.writes.lost), ' ', icon('lost')));
      });
      return h('div', { class: 'cm-card' },
        h('h3', null, t('cmpTitle')),
        h('table', { class: 'cm-cmp' },
          h('thead', null, h('tr', null, h('th', null, t('cmpSet')), h('th', null, t('cmpInactive')), h('th', null, t('cmpDegraded')),
            h('th', null, t('cmpStale')), h('th', null, t('cmpWrites')))),
          h('tbody', null, rows)));
    }
    var g = s.pgs[s.watched];
    var kids = [h('h3', null, t('writesTitle'))];
    if (!s.writes.length) kids.push(h('div', { class: 'cm-muted' }, t('wNone')));
    s.writes.forEach(function (w) { kids.push(writeLine(s, w)); });
    kids.push(h('div', { class: 'cm-w' }, h('span', { class: 'cm-muted' }, rich('pgNow', { pg: data(pgId(s, s.watched)) })),
      h('b', { translate: 'no' }, L.cephState(g))));
    return h('div', { class: 'cm-card' }, kids);
  }

  function render(c) {
    c.stage.replaceChildren(h('div', { class: 'cm' },
      h('div', { class: 'cm-col' }, head(c), osdMap(c), poolGrid(c)),
      h('div', { class: 'cm-col' }, zoom(c), card(c))));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, ev = s.ev, o = L.norm(c.params);
    var MIN = data(s.minSize), SIZE = data(s.size), N = data(s.pgNum);
    var pre = s.clock !== null && !(ev && ev.kind === 'later') ? rich('capClock', { clock: data(clock(s.clock)) }).concat([' ']) : [];
    if (!ev) {
      return pre.concat(rich('capStart', { pool: data(s.pool.name), pgs: N, size: SIZE, target: target(s, firstFail(c)) }, s.minSize));
    }
    var out = pre;
    var add = function (parts) { out = out.concat(out.length ? sp(parts) : parts); };
    if (ev.kind === 'fail') {
      if (!ev.newly.length) { add(rich('capFailNothing', { target: target(s, ev.target, true) })); return out; }
      add(rich('capFail', { target: target(s, ev.target, true) }, ev.hit.length));
      var to = { inactive: 0, degraded: 0, stale: 0 };
      ev.changed.forEach(function (pg) { if (to[s.pgs[pg]] !== undefined) to[s.pgs[pg]] += 1; });
      if (to.inactive) add(rich('capToInactive', { min: MIN }, to.inactive));
      if (to.degraded) add(rich('capToDegraded', { size: SIZE, min: MIN }, to.degraded));
      var still = ev.hit.filter(function (pg) { return s.pgs[pg] === 'degraded' && ev.changed.indexOf(pg) < 0; }).length;
      if (still) add(rich('capStillDegraded', {}, still));
      if (to.stale) add(rich('capToStale', {}, to.stale));
      ev.lost.forEach(function (id) {
        var w = s.writes[id - 1];
        add(rich('capLost', { w: data('W' + id), osds: data(osdList(w.on)) }));
      });
      return out;
    }
    if (ev.kind === 'later') {
      if (!s.counts.inactive) { add(rich('capLaterNone', { clock: data(clock(s.clock)) })); return out; }
      add(rich('capLater', { clock: data(clock(s.clock)), gib: data(ev.gib), obj: data(num(ev.objects)),
        mib: data(ev.mib), pgs: N, stuck: data(num(ev.stuck)) }, s.counts.inactive));
      return out;
    }
    if (ev.kind === 'write') {
      var w = s.writes[ev.write - 1], g = s.pgs[w.pg], live = L.liveOf(s.cluster, s.size, w.pg, s.down);
      var W = data('W' + w.id), PG = data(pgId(s, w.pg));
      if (w.status === 'ack') {
        add(rich('capWriteAck', { w: W, pg: PG, osds: data(osdList(w.on)) }, w.on.length));
        if (w.on.length === 1 && s.size > 1) add(rich('capWriteOne'));
        else if (g === 'degraded') add(rich('capWriteDegraded'));
      } else if (g === 'stale') add(rich('capWriteStale', { w: W, pg: PG }));
      else add(rich('capWriteBlocked', { w: W, pg: PG, min: MIN }, live.length));
      return out;
    }
    add(rich('capSum', { size: SIZE, min: MIN, i: data(s.counts.inactive), d: data(s.counts.degraded), s: data(s.counts.stale), n: N }));
    add(rich(o.minSize === 1 ? 'capSum1' : o.size === 2 ? 'capSum22' : 'capSum32'));
    return out;
  }

  var FAIL_LABEL = function (f) { return f === 'none' ? t('failNone') : f.indexOf('host:') === 0 ? L.CLUSTERS.hc.hosts[Number(f.slice(5))].name : f; };

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'size', type: 'choice', label: t('size'), options: [[2, '2'], [3, '3']], resets: true },
      { key: 'minSize', type: 'choice', label: t('minSize'), options: [[1, '1'], [2, '2']], resets: true },
      { key: 'cluster', type: 'choice', label: t('cluster'), options: [['hc', t('clusterHc')], ['dr', t('clusterDr')]], resets: true },
      { key: 'fail1', type: 'choice', label: t('fail1'), options: L.FAIL1.map(function (f) { return [f, FAIL_LABEL(f)]; }), resets: true,
        visible: function (p) { return p.cluster !== 'dr'; } },
      { key: 'fail2', type: 'choice', label: t('fail2'), options: L.FAIL2.map(function (f) { return [f, FAIL_LABEL(f)]; }), resets: true,
        visible: function (p) { return p.cluster !== 'dr'; } },
      { key: 'drFail', type: 'choice', label: t('drFail'), options: [['osd.15', 'osd.15'], ['host:2', 'hq-pve-03']], resets: true,
        visible: function (p) { return p.cluster === 'dr'; } }
    ],

    presets: [
      { id: 'size2-min2', label: t('p22'), params: { size: 2 }, hint: t('p22Hint') },
      { id: 'size3-min2', label: t('p32'), params: {}, hint: t('p32Hint') },
      { id: 'size3-two-down', label: t('p32two'), params: { fail2: 'osd.4' }, hint: t('p32twoHint') },
      { id: 'size2-min1', label: t('p21'), params: { size: 2, minSize: 1, fail2: 'osd.4' }, hint: t('p21Hint') },
      { id: 'dr-s2', label: t('pDr'), params: { cluster: 'dr', size: 2 }, hint: t('pDrHint') },
      { id: 'host-down', label: t('pHost'), params: { fail1: 'host:0' }, hint: t('pHostHint') }
    ],

    legend: [
      { shape: 'hl', label: t('legChanged') },
      { shape: 'bg-fill', c: C_CLEAN, label: t('legClean') },
      { shape: 'bg-soft', c: C_DEG, label: t('legDegraded') },
      { shape: 'bg-bad', label: t('legInactive') },
      { shape: 'stale', label: t('legStale') },
      { shape: 'bg-fill', c: C_UP, label: t('legUp') },
      { shape: 'bg-dead', label: t('legDown') },
      { shape: 'bg-span', label: t('legWatched') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
</body>
