}

/* Phone and portrait: one column; the field keeps a readable width and scrolls inside its box. */

  [data-sim="lora-mesh"] .lm-scene { container-type: normal; display: block; place-items: normal; width: 100%; overflow-x: auto; }

<body>
<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills
     the title and subtitle (from #simdeck-meta), the back link, the "Ideja" summary and its own controls. -->
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Kako poruka putuje kroz LoRa i mesh mreže</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport></footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var W = L.W, H = L.H, SERVER = [L.W / 2, 22];
  var sim = null;

  function s(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    for (var k in attrs || {}) if (attrs[k] != null) el.setAttribute(k, attrs[k]);
    return el;
  }
  function bold(text) { return h('b', { translate: 'no' }, String(text)); }
  function num(v) { var x = String(v); return Simdeck.lang === 'hr' ? x.replace('.', ',') : x; }
  function at(x, y, node) {
    node.classList.add('lm-at');
    node.style.left = (x / W * 100) + '%';
    node.style.top = (y / H * 100) + '%';
    return node;
  }
  /** A node's name as data: 7, or GW1 for the first gateway. */
  function name(p, id) { return id >= p.nodes ? t('gwName', { n: id - p.nodes + 1 }) : String(id + 1); }
  function names(p, ids) { return ids.map(function (id) { return name(p, id); }).join(', '); }

  function scene(c) {
    var p = c.params, st = c.state;
    var nodes = L.nodesOf(p), byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });
    var svg = s('svg', { viewBox: '0 0 ' + W + ' ' + H, 'aria-hidden': 'true' });
    var box = h('div', { class: 'lm-draw' }, svg);
    var src = byId[p.src - 1], dst = byId[p.dst - 1];
    var senders = st.active.filter(function (e) { return e.kind === 'tx'; }).map(function (e) { return e.from; });
    var ipOn = st.active.some(function (e) { return e.kind === 'ip'; });

    svg.append(s('circle', { cx: src.x, cy: src.y, r: L.reach(p), class: 'lm-reach' }));
    senders.forEach(function (id) {
      if (id !== src.id) svg.append(s('circle', { cx: byId[id].x, cy: byId[id].y, r: L.reach(p), class: 'lm-reach lm-sender' }));
    });
    L.links(p, nodes).forEach(function (l) {
      var a = byId[l[0]], b = byId[l[1]];
      svg.append(s('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, class: 'lm-link' }));
    });
    if (p.mode === 'star') {
      var ip = st.active.filter(function (e) { return e.kind === 'ip'; })[0];
      nodes.filter(function (n) { return n.gw; }).forEach(function (g) {
        var on = ip && (ip.from === g.id || ip.to[0] === g.id);
        svg.append(s('line', { x1: g.x, y1: g.y, x2: SERVER[0], y2: SERVER[1], class: 'lm-ip' + (on ? ' lm-on' : '') }));
      });
      box.append(at(SERVER[0], SERVER[1], h('span', { class: 'lm-tag lm-server' + (ipOn ? ' lm-on' : '') }, t('server'))));
    }
    st.active.forEach(function (e) {
      if (e.kind !== 'tx') return;
      var a = byId[e.from];
      e.to.forEach(function (v) { svg.append(s('line', { x1: a.x, y1: a.y, x2: byId[v].x, y2: byId[v].y, class: 'lm-tx' })); });
    });

    var heard = {};
    st.heard.forEach(function (id) { heard[id] = true; });
    nodes.forEach(function (n) {
      var role = n.id === src.id ? 'lm-src' : n.id === dst.id ? 'lm-dst' : n.gw ? 'lm-gw' : n.rep ? 'lm-rep' : '';
      var cls = 'lm-node ' + role + (heard[n.id] ? ' lm-heard' : '') +
        (senders.indexOf(n.id) >= 0 ? ' sd-changed' : '') + (st.blocked === n.id ? ' lm-blocked' : '');
      var label = n.gw ? name(p, n.id) : n.rep ? t('repName', { n: n.id + 1 }) : String(n.id + 1);
      var el;
      if (p.mode === 'relay') {
        el = h('button', { type: 'button', class: cls, translate: 'no',
          'aria-label': t('nodeBtn', { n: n.id + 1 }), 'aria-pressed': String(n.rep),
          onmousedown: function (e) { e.preventDefault(); },
          onclick: function () { if (sim) sim.set({ flip: L.toggleRepeater(sim.params, n.id) }); } }, label);
      } else {
        el = h('span', { class: cls, translate: 'no' }, label);
      }
      box.append(at(n.x, n.y, el));
    });
    box.append(at(src.x, src.y + 36, h('span', { class: 'lm-tag' }, t('srcTag'))));
    if (dst.id !== src.id) box.append(at(dst.x, dst.y + 36, h('span', { class: 'lm-tag' }, t('dstTag'))));
    return h('div', { class: 'lm-scene' }, box);
  }

  function side(c) {
    var p = c.params, st = c.state, ld = L.load(st, p);
    var prev = c.prev;
    function big(key, value, changed, extra) {
      var cls = (changed ? 'sd-hl ' : '') + (/^\d+$/.test(value) ? '' : 'lm-word');
      return h('div', { class: 'lm-big' + (extra || '') }, h('b', { class: cls || null }, value), h('span', null, t(key)));
    }
    var status = c.last ? st.status : 'running';
    var out = h('div', { class: 'lm-big lm-out', dataset: { status: status } },
      h('b', null, t('status_' + (c.n === 0 ? 'ready' : status))), h('span', null, t('outcome')));
    var nums = h('div', { class: 'lm-nums' },
      big('txN', String(st.tx), prev && prev.tx !== st.tx),
      big('hopsN', String(st.hops), prev && prev.hops !== st.hops),
      big('heardN', String(st.heard.length), prev && prev.heard.length !== st.heard.length),
      big('repN', p.mode === 'star' ? String(L.gatewayCount(p.nodes)) : p.mode === 'relay'
        ? String(L.nodesOf(p).filter(function (n) { return n.rep; }).length) : t('everyone'), false),
      out);
    var limit = p.dutyPct > 0, over = st.status === 'duty';
    var air = [
      h('div', { class: 'lm-air' }, h('span', { class: 'lm-head' }, t(limit ? 'airBusiest' : 'airTotal')), h('b', null, t('percent', { v: num(ld.pct) }))),
      h('div', { class: 'lm-bar' }, h('div', { class: 'lm-fill' + (over || ld.pct > 100 ? ' lm-over' : ''), style: { width: Math.min(100, ld.pct) + '%' } })),
      h('p', { class: 'lm-note' }, limit
        ? t.parts('airDuty', { used: bold(t('sec', { v: num(ld.busiest) })), legal: bold(t('sec', { v: num(ld.legal) })), pct: num(p.dutyPct) })
        : t.parts('airFree', { used: bold(t('sec', { v: num(st.air) })) }))
    ];
    var note = [h('p', { class: 'lm-modenote' }, t('note_' + p.mode))];
    if (p.mode === 'relay') note.push(h('p', { class: 'lm-note' }, t('relayClick')));
    return [nums].concat(air, note);
  }

  function caption(c) {
    var p = c.params, st = c.state;
    if (p.src === p.dst) return t('capSame');
    if (c.n === 0) return t.parts('capStart', { src: bold(p.src), dst: bold(p.dst), how: t('desc_' + p.mode) });
    var out = [];
    if (st.status === 'duty') {
      var ld = L.load(st, p);
      return t.parts('capDuty', { id: bold(name(p, st.blocked)), used: bold(t('sec', { v: num(Math.round(((st.perNode[st.blocked] || 0) + 1) * p.airtime) / 1000) })),
        legal: bold(t('sec', { v: num(ld.legal) })), pct: num(p.dutyPct) });
    }
    st.active.forEach(function (e) {
      if (e.kind === 'ip') out.push(t.parts('capIp', { gw: bold(name(p, e.from)), gw2: bold(name(p, e.to[0])) }));
      else if (p.mode === 'star' && e.from === p.src - 1) out.push(t.parts('capUplink', { src: bold(p.src), gws: bold(names(p, e.to)) }));
      else if (p.mode === 'star') out.push(t.parts('capDownlink', { gw: bold(name(p, e.from)), dst: bold(p.dst) }));
    });
    if (p.mode === 'flood' && st.active.length) {
      var senders = st.active.map(function (e) { return e.from; });
      var fresh = [];
      st.active.forEach(function (e) { fresh = fresh.concat(e.to); });
      out.push(t.parts('capFlood', { n: c.n, senders: bold(names(p, senders)), count: t.n('nodesTx', senders.length) }));
      out.push(fresh.length ? t.parts('capFresh', { fresh: bold(names(p, fresh)) }) : [t('capNoFresh')]);
    }
    if ((p.mode === 'relay' || p.mode === 'manet') && st.active.length) {
      var e = st.active[0];
      out.push(t.parts('capHop', { n: c.n, a: bold(name(p, e.from)), b: bold(name(p, e.to[0])) }));
    }
    if (c.last) {
      if (st.status === 'delivered') out.push(t.parts('capDelivered', { hops: t.n('hops', st.hops), tx: t.n('transmissions', st.tx), heard: bold(st.heard.length) }));
      else if (st.status === 'noroute') out.push([t('capNoRoute_' + p.mode)]);
      else out.push(t.parts('capLost', { n: t.n('rounds', c.n) }));
    }
    var flat = [];
    out.forEach(function (x, i) { if (i) flat.push(' '); flat = flat.concat(x); });
    return flat;
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), resets: true,
        options: [['star', t('mode_star')], ['flood', t('mode_flood')], ['relay', t('mode_relay')], ['manet', t('mode_manet')]] },
      { key: 'nodes', type: 'range', label: t('nodes'), min: 5, max: L.MAX_NODES, resets: true },
      { key: 'range', type: 'range', label: t('range'), min: 15, max: 42, resets: true,
        format: function (v) { return t('percent', { v: v }); } },
      { key: 'src', type: 'range', label: t('src'), min: 1, max: function (p) { return p.nodes; }, resets: true, visible: function () { return false; } },
      { key: 'dst', type: 'range', label: t('dst'), min: 1, max: function (p) { return p.nodes; }, resets: true },
      { key: 'dutyPct', type: 'choice', label: t('duty'), resets: true,
        options: [[0, t('dutyOff')], [0.1, t('percent', { v: num(0.1) })], [1, t('percent', { v: 1 })], [10, t('percent', { v: 10 })]] },
      { key: 'airtime', type: 'range', label: t('airtime'), min: 50, max: 1500, step: 50, resets: true,
        format: function (v) { return t('ms', { v: v }); } },
      { key: 'seed', type: 'range', label: t('seed'), min: 1, max: 99, visible: function () { return false; }, resets: true },
      { key: 'flip', type: 'range', label: t('flip'), min: 0, max: Math.pow(2, L.MAX_NODES) - 1, visible: function () { return false; }, resets: true },
      { type: 'button', label: t('newTopology'), key: 'n',
        run: function (sm) { sm.set({ seed: sm.params.seed % 99 + 1, flip: 0 }); } }
    ],

    presets: [
      { id: 'duty', label: t('presetDuty'), hint: t('presetDutyHint'), params: { mode: 'flood', airtime: 1000 } },
      { id: 'relay-chain', label: t('presetChain'), hint: t('presetChainHint'), params: { mode: 'relay', flip: 4162 } }
    ],

    legend: [
      { c: 1, shape: 'round', label: t('legendSrc') },
      { c: 3, shape: 'round', label: t('legendDst') },
      { c: 7, label: t('legendRelay') },
      { shape: 'hollow', label: t('legendHeard') },
      { shape: 'hl', label: t('legendTx') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'lm' }, scene(c), h('div', { class: 'lm-side' }, side(c))));
    },

    caption: caption
  });
})();
</script>
