<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var drawSeed = 1; // the new-draws button picks a seed from Simdeck.rng; the model itself stays deterministic
  var COLOUR = { A: '1', B: '2', C: '3', D: '4' };
  var svgNs = 'http://www.w3.org/2000/svg';

  function full(p) { return p.duplex === 'full'; }
  /** In full duplex the second end is the switch port. */
  function nameOf(id, p) { return full(p) && id === 'B' ? t('switchRef') : id; }
  function list(ids, p) {
    var a = ids.map(function (id) { return nameOf(id, p); });
    return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' ' + t('and') + ' ' + a[a.length - 1];
  }
  function zig() {
    var s = document.createElementNS(svgNs, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('class', 'cd-zig');
    s.setAttribute('aria-hidden', 'true');
    var pl = document.createElementNS(svgNs, 'polyline');
    pl.setAttribute('points', '2,13 7,5 11,19 15,5 19,19 22,11');
    pl.setAttribute('fill', 'none');
    pl.setAttribute('stroke', 'currentColor');
    pl.setAttribute('stroke-width', '2.8');
    pl.setAttribute('stroke-linejoin', 'round');
    s.append(pl);
    return s;
  }
  function dot(id, p) {
    return h('span', { class: 'cd-dot sd-fill', dataset: { c: COLOUR[id] }, translate: 'no', 'aria-hidden': 'true' }, full(p) && id === 'B' ? '⇄' : id);
  }

  // ── the slot timeline ──

  function cell(m, id, now, p) {
    var mark = full(p) && id === 'B' ? '⇄' : id, who = nameOf(id, p);
    var a = { class: 'cd-cell' + (now ? ' cd-now' : ''), dataset: { m: 'none', c: COLOUR[id] || '' } };
    if (!m) return h('div', a);
    if (m.m === 'send') {
      a.class += ' sd-fill';
      a.dataset.m = 'send';
      a['aria-label'] = t(m.end ? 'cellEnd' : 'cellSend', { id: who });
      return h('div', a, h('span', { translate: 'no' }, m.end ? mark + '✓' : mark));
    }
    if (m.m === 'jam') { a.dataset.m = 'jam'; a['aria-label'] = t('cellJam', { id: id }); return h('div', a, zig()); }
    if (m.m === 'wait') { a.dataset.m = 'wait'; a['aria-label'] = t('cellWait', { id: id, v: m.v }); return h('div', a, String(m.v)); }
    if (m.m === 'defer') { a.dataset.m = 'defer'; a['aria-label'] = t('cellDefer', { id: id }); return h('div', a, '…'); }
    if (m.m === 'drop') { a.dataset.m = 'drop'; a['aria-label'] = t('cellDrop', { id: id }); return h('div', a, '⊘'); }
    return h('div', a);
  }

  function mediumCell(col, now) {
    var a = { class: 'cd-cell' + (now ? ' cd-now' : ''), dataset: { m: 'idle' } };
    if (col.medium === 'collision') { a.dataset.m = 'coll'; a['aria-label'] = t('cellColl'); return h('div', a, zig()); }
    if (col.medium === 'busy') {
      var id = col.senders[0];
      a.class += ' sd-fill';
      a.dataset.m = 'send';
      a.dataset.c = COLOUR[id];
      a['aria-label'] = t('mBusy', { id: id });
      return h('div', a, h('span', { translate: 'no' }, id));
    }
    a['aria-label'] = t('cellIdle');
    return h('div', a);
  }

  function timeline(s, c) {
    var p = c.params, total = Math.max(c.steps, 1), kids = [];
    kids.push(h('div', { class: 'cd-lab cd-lab-muted' }, t('slot')));
    for (var j = 1; j <= total; j++) kids.push(h('div', { class: 'cd-head' + (j === s.slot ? ' cd-now' : ''), translate: 'no' }, String(j)));
    s.stations.forEach(function (x, i) {
      kids.push(h('div', { class: 'cd-lab' }, dot(x.id, p), full(p) && x.id === 'B' ? t('switchName') : null));
      for (var j = 1; j <= total; j++) {
        var col = s.columns[j - 1];
        kids.push(col ? cell(col.marks[i], x.id, j === s.slot, p) : h('div', { class: 'cd-cell', dataset: { m: 'future' } }));
      }
    });
    if (!full(p)) {
      kids.push(h('div', { class: 'cd-lab' }, t('medium')));
      for (var k = 1; k <= total; k++) {
        var col = s.columns[k - 1];
        kids.push(col ? mediumCell(col, k === s.slot) : h('div', { class: 'cd-cell', dataset: { m: 'future' } }));
      }
    }
    return h('div', { class: 'cd-tlwrap' }, h('div', { class: 'cd-tl', style: { '--cols': String(total), '--rows': String(s.stations.length + (full(p) ? 1 : 2)) } }, kids));
  }

  // ── the stations on the bus ──

  function phaseText(x, p) {
    switch (x.phase) {
      case 'ready': return t('phReady');
      case 'defer': return t('phDefer');
      case 'send': return t('phSend', { v: x.sentSlots, f: p.frameSlots });
      case 'jam': return t('phJam');
      // the counter as the timeline cell shows it in this slot: the slots left, this one included
      case 'backoff': return t('phWait', { v: x.backoffLeft + 1 });
      case 'done': return t('phDone');
      case 'gaveUp': return t('phGaveUp');
      default: return t('phIdle');
    }
  }

  function card(x, i, c) {
    var p = c.params;
    var changed = c.prev && c.prev.stations[i] && c.prev.stations[i].phase !== x.phase;
    var meta = full(p) ? null : h('div', { class: 'cd-meta', translate: 'no' },
      'n = ' + x.attempt, x.k != null ? '  ·  ' + t('drawLine', { k: x.k, max: x.range - 1 }) : null);
    return h('div', { class: 'cd-card' + (changed ? ' sd-changed' : '') + (changed && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { c: COLOUR[x.id] } },
      dot(x.id, p),
      h('div', { class: 'cd-card-body' },
        full(p) && x.id === 'B' ? h('div', { class: 'cd-lab-muted' }, t('switchName')) : null,
        h('div', { class: 'cd-phase' }, phaseText(x, p)),
        meta));
  }

  function busLabel(s) {
    if (s.medium === 'collision') return [zig(), t('mColl')];
    if (s.medium === 'busy') return t('mBusy', { id: s.columns[s.columns.length - 1].senders[0] });
    return t('mIdle');
  }

  function half(s, c) {
    var sender = s.medium === 'busy' ? s.columns[s.columns.length - 1].senders[0] : null;
    return h('div', { class: 'cd-net' },
      h('div', { class: 'cd-stations' }, s.stations.map(function (x, i) {
        return h('div', { class: 'cd-st' }, card(x, i, c), h('div', { class: 'cd-drop' }));
      })),
      h('div', { class: 'cd-bus', dataset: { m: s.medium, c: sender ? COLOUR[sender] : '' } },
        h('span', { class: 'cd-bus-label' }, h('span', { class: 'cd-lab-muted' }, t('bus')), busLabel(s))));
  }

  function lane(s, from, to, p) {
    var col = s.columns[s.columns.length - 1];
    var busy = !!col && col.senders.indexOf(from) >= 0;
    return h('div', { class: 'cd-bus cd-lane', dataset: { m: busy ? 'busy' : 'idle', c: COLOUR[from] } },
      h('span', { class: 'cd-bus-label' }, t('laneTo', { a: nameOf(from, p), b: nameOf(to, p) }), ' · ', t(busy ? 'laneBusy' : 'laneIdle')));
  }

  function duplexLink(s, c) {
    var p = c.params;
    return h('div', { class: 'cd-duo' },
      card(s.stations[0], 0, c),
      h('div', { class: 'cd-lanes' }, h('div', { class: 'cd-lanes-title' }, t('link')), lane(s, 'A', 'B', p), lane(s, 'B', 'A', p)),
      card(s.stations[1], 1, c));
  }

  // ── captions ──

  function prevOf(c, id) {
    return c.prev ? c.prev.stations.filter(function (x) { return x.id === id; })[0] : null;
  }

  function collisionParts(e, c) {
    var p = c.params, out = [];
    var prev = e.ids.map(function (id) { return prevOf(c, id); });
    var allDefer = prev.every(function (x) { return x && x.phase === 'defer'; });
    var sameK = prev.every(function (x) { return x && x.k != null && (x.phase === 'backoff' || x.phase === 'jam') && x.k === prev[0].k; });
    if (allDefer) out.push(t('capCollDefer', { ids: list(e.ids, p) }));
    else if (sameK) out.push(t('capCollSame', { ids: list(e.ids, p), k: prev[0].k }));
    else out.push(t('capCollNew', { ids: list(e.ids, p) }));
    out.push(t('capJam'));
    if (e.draws.length) {
      var sameN = e.draws.every(function (d) { return d.n === e.draws[0].n; });
      if (sameN) {
        out.push(t('capDrawsSame', { n: e.draws[0].n, max: e.draws[0].range - 1,
          list: e.draws.map(function (d) { return t('drawItem', { id: d.id, k: d.k }); }).join(', ') }));
      } else {
        out.push(t('capDrawsMixed', { list: e.draws.map(function (d) {
          return t('drawItemN', { id: d.id, n: d.n, max: d.range - 1, k: d.k });
        }).join(', ') }));
      }
      var byK = {};
      e.draws.forEach(function (d) { (byK[d.k] = byK[d.k] || []).push(d.id); });
      Object.keys(byK).forEach(function (k) { if (byK[k].length > 1) out.push(t('capTie', { ids: list(byK[k], p) })); });
    }
    return out;
  }

  function startText(e, c) {
    var p = c.params, id = e.ids[0], before = prevOf(c, id), f = p.frameSlots;
    if (before && before.phase === 'defer') return t('capStartAfterDefer', { id: id, f: f });
    if (before && before.phase === 'jam' && before.k === 0) return t('capStartK0', { id: id, f: f });
    if (before && (before.phase === 'backoff' || before.phase === 'jam')) return t('capStartAfterWait', { id: id, f: f });
    return t('capStart', { id: id, f: f });
  }

  function captionText(c) {
    var s = c.state, p = c.params, cfg = L.cfgOf(p), out = [];
    if (c.first) {
      var ready = s.stations.filter(function (x) { return x.phase === 'ready'; }).map(function (x) { return x.id; });
      if (full(p)) out.push(t('capStartFull'));
      if (ready.length) out.push(full(p) ? t.n('capReady', ready.length, { ids: list(ready, p) }) : t.n('capStartHalf', ready.length, { ids: list(ready, p) }));
      var later = {};
      cfg.stations.forEach(function (x) { if (x.arrive > 1) (later[x.arrive] = later[x.arrive] || []).push(x.id); });
      Object.keys(later).forEach(function (slot) { out.push(t.n('capLater', later[slot].length, { ids: list(later[slot], p), t: slot })); });
      return out.join(' ');
    }
    out.push(t('capSlot', { t: s.slot }));
    var ev = {};
    s.log.forEach(function (e) { ev[e.code] = e; });
    if (full(p)) {
      if (ev.fullStart) out.push(t('capFullStart'));
      else if (ev.deliver) out.push(t('capFullDeliver'));
      else if (ev.idle) out.push(t('capFullIdle'));
      else out.push(t('capFullContinue'));
    } else {
      if (ev.arrive) out.push(t.n('capArrive', ev.arrive.ids.length, { ids: list(ev.arrive.ids, p) }));
      if (ev.collision) out.push.apply(out, collisionParts(ev.collision, c));
      if (ev.start) out.push(startText(ev.start, c));
      if (ev['continue']) out.push(t('capContinue', { id: ev['continue'].ids[0], v: ev['continue'].v, f: p.frameSlots }));
      if (ev.deliver) out.push(t('capDeliver', { id: ev.deliver.ids[0] }));
      if (ev.idle) out.push(t('capIdle'));
      if (ev.defer) out.push(t.n('capDefer', ev.defer.ids.length, { ids: list(ev.defer.ids, p), by: ev.defer.by }));
      if (ev.drop) out.push(t.n('capDrop', ev.drop.ids.length, { ids: list(ev.drop.ids, p) }));
      if (ev.wait) {
        var still = [], over = [];
        // v: the counter as the cell shows it (slots left, this one included); 1 = the last waiting slot
        ev.wait.ids.forEach(function (id, i) { if (ev.wait.left[i] > 0) still.push(t('waitItem', { id: id, v: ev.wait.left[i] + 1 })); else over.push(id); });
        if (still.length) out.push(t.n('capWait', still.length, { list: still.join(', ') }));
        if (over.length) out.push(t.n('capWaitDone', over.length, { ids: list(over, p) }));
      }
    }
    if (c.last) {
      if (s.done) {
        var delivered = s.stations.reduce(function (a, x) { return a + x.delivered; }, 0);
        var dropped = s.stations.reduce(function (a, x) { return a + x.gaveUp; }, 0);
        out.push(t('capEnd', { frames: t.n('frames', delivered), colls: t.n('colls', s.collisions), slots: t.n('slots', s.slot) }));
        if (dropped) out.push(t('capEndDrop', { n: dropped }));
      } else {
        var left = s.stations.filter(function (x) { return x.queued > 0; }).map(function (x) { return x.id; });
        out.push(t.n('capCap', left.length, { slots: t.n('slots', s.slot), ids: list(left, p) }));
      }
    }
    return out.join(' ');
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'stations', type: 'range', label: t('pStations'), min: 2, max: 4,
        disabled: function (p) { return full(p) ? t('pStationsFull') : false; } },
      { key: 'duplex', type: 'choice', label: t('pDuplex'), resets: true, options: [['half', t('half')], ['full', t('full')]] },
      { key: 'frameSlots', type: 'range', label: t('pFrameSlots'), min: 1, max: 4 },
      // 0 = the example's scripted draws; 1–99 = every k from that seed
      { key: 'seed', type: 'range', label: t('pSeed'), min: 0, max: 99, visible: function (p) { return !full(p); },
        format: function (v) { return v ? String(v) : t('seedScript'); } },
      // N: a fresh seed, so every k is drawn anew (kit buttons cannot be hidden; in full duplex nothing is drawn)
      { type: 'button', label: t('bNewDraw'), key: 'n', run: function (sim) {
          var next = sim.params.seed;
          while (next === sim.params.seed) next = 1 + Simdeck.rng(drawSeed++).int(99);
          sim.set({ seed: next });
          sim.first();
        } },
      // the presets' scene (arrivals and scripted draws): hidden, but kept in the URL so a link or L keeps it
      { key: 'scene', type: 'choice', label: t('pScene'), visible: function () { return false; },
        options: Object.keys(L.SCENES).map(function (k) { return [k, k]; }) }
    ],

    presets: [
      { id: 'two-collide', label: t('prTwo'), hint: t('prTwoHint'), params: { scene: 'two-collide', stations: 2, duplex: 'half', seed: 0 } },
      { id: 'same-draw', label: t('prSame'), hint: t('prSameHint'), params: { scene: 'same-draw', stations: 2, duplex: 'half', seed: 0 } },
      { id: 'wait-then-crash', label: t('prWait'), hint: t('prWaitHint'), params: { scene: 'wait-then-crash', stations: 3, duplex: 'half', seed: 0 } },
      { id: 'three-stations', label: t('prThree'), hint: t('prThreeHint'), params: { scene: 'three-stations', stations: 3, duplex: 'half', seed: 0 } },
      { id: 'full-duplex', label: t('prFull'), hint: t('prFullHint'), params: { scene: 'full-duplex', stations: 2, duplex: 'full', seed: 0 } }
    ],

    legend: [
      { c: 1, shape: 'cd-send', label: t('legendSend') },
      { shape: 'hollow', label: t('legendIdle') },
      { shape: 'cd-coll', label: t('legendColl') },
      { c: 1, shape: 'cd-wait', label: t('legendWait') },
      { c: 1, shape: 'cd-defer', label: t('legendDefer') },
      { shape: 'hl', label: t('legendNow') }
    ],

    render: function (c) {
      var s = c.state;
      c.stage.replaceChildren(h('div', { class: 'cd' }, timeline(s, c), full(c.params) ? duplexLink(s, c) : half(s, c)));
    },

    caption: function (c) { return captionText(c); }
  });
})();
</script>
</body>
</html>
