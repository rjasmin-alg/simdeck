<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slučajni odabir studenta</title>
<style>
    /* --------------------------------------------------------------------
       Ove su stranice izvorno bile isjecci iz Claude artifacta i koristile
       njegove dizajn-tokene (--color-text-primary, --border-radius-lg, ...).
       Izvan artifacta ti tokeni ne postoje, pa je stranica bila neobojena i
       necitljiva. Ovdje su definirani da lab radi kao samostalna stranica.
       Vrijednosti prate paletu materijali.online. Ne brisati.
       -------------------------------------------------------------------- */
    :root {
      --color-text-primary:        #16212b;
      --color-text-secondary:      #5c6b78;
      --color-text-tertiary:       #8b98a3;
      --color-text-danger:         #b3261e;
      --color-text-warning:        #8a5a00;
      --color-background-primary:  #ffffff;
      --color-background-secondary: #f2ede1;
      --color-background-warning:  #fdf4e0;
      --color-border-secondary:    #c9bfa8;
      --color-border-tertiary:     #ddd3bd;
      --color-border-warning:      #e3c680;
      --border-radius-md:          6px;
      --border-radius-lg:          10px;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                   "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-text-primary:        #e9e6dd;
        --color-text-secondary:      #93a1ac;
        --color-text-tertiary:       #6f7d88;
        --color-text-danger:         #f2a2a0;
        --color-text-warning:        #e7a93c;
        --color-background-primary:  #10161d;
        --color-background-secondary: #171f28;
        --color-background-warning:  #2a2113;
        --color-border-secondary:    #3b444e;
        --color-border-tertiary:     #2c333c;
        --color-border-warning:      #6b5320;
      }
    }
    html { color-scheme: light dark; }
    body {
      margin: 0 auto;
      max-width: 60rem;
      padding: 1.25rem 1.5rem 3rem;
      background: var(--color-background-primary);
      color: var(--color-text-primary);
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
    .lab-natrag {
      display: inline-block; margin-bottom: 1rem;
      font-size: .82rem; letter-spacing: .04em; text-transform: uppercase;
      color: var(--color-text-secondary); text-decoration: none;
    }
    .lab-natrag:hover { color: var(--color-text-primary); }
</style>
</head>
<body>
<a class="lab-natrag" href="./">&larr; Svi materijali</a>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-mono, monospace); }
  #app { padding: 1.5rem 0; max-width: 640px; }
  h2.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
  #input-area { display: flex; gap: 8px; margin-bottom: 12px; }
  #name-input { flex: 1; font-family: var(--font-mono); font-size: 14px; }
  #add-btn { font-family: var(--font-mono); font-size: 13px; padding: 0 16px; }
  #bulk-area { margin-bottom: 12px; }
  #bulk-textarea { width: 100%; font-family: var(--font-mono); font-size: 13px; resize: vertical; min-height: 72px; }
  #bulk-btn { margin-top: 6px; font-family: var(--font-mono); font-size: 13px; padding: 0 16px; }
  #list-section { margin-bottom: 1.5rem; }
  #list-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  #list-header span { font-size: 12px; color: var(--color-text-secondary); font-family: var(--font-mono); }
  #count-badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); color: var(--color-text-secondary); }
  #student-list { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; }
  .student-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-family: var(--font-mono); padding: 4px 10px; border-radius: var(--border-radius-md); background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); transition: background 0.15s, border-color 0.15s; }
  .student-tag.picked { background: #EEEDFE; border-color: #AFA9EC; color: #3C3489; }
  @media (prefers-color-scheme: dark) { .student-tag.picked { background: #3C3489; border-color: #7F77DD; color: #CECBF6; } }
  .remove-x { cursor: pointer; font-size: 11px; color: var(--color-text-tertiary); line-height: 1; padding: 0 2px; }
  .remove-x:hover { color: var(--color-text-danger, #c0392b); }
  #pick-section { margin-top: 1rem; }
  #pick-btn { font-family: var(--font-mono); font-size: 15px; padding: 0 28px; height: 44px; letter-spacing: 0.04em; }
  #pick-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #result-box { margin-top: 1.5rem; min-height: 64px; display: flex; align-items: center; justify-content: center; border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); padding: 1rem 1.5rem; }
  #result-name { font-size: 28px; font-family: var(--font-mono); font-weight: 500; color: var(--color-text-primary); text-align: center; letter-spacing: 0.02em; opacity: 0; transform: scale(0.85); transition: opacity 0.25s ease, transform 0.25s ease; }
  #result-name.visible { opacity: 1; transform: scale(1); }
  #result-name.rolling { opacity: 0.5; transition: none; }
  #result-hint { font-size: 12px; color: var(--color-text-secondary); text-align: center; margin-top: 8px; font-family: var(--font-mono); }
  #stats-row { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 14px; flex: 1; min-width: 90px; }
  .stat-label { font-size: 11px; color: var(--color-text-secondary); font-family: var(--font-mono); margin-bottom: 4px; }
  .stat-val { font-size: 20px; font-weight: 500; font-family: var(--font-mono); color: var(--color-text-primary); }
  #reset-picks { font-size: 12px; font-family: var(--font-mono); margin-top: 10px; padding: 0 12px; height: 28px; }
  #clear-all { font-size: 12px; font-family: var(--font-mono); margin-top: 10px; padding: 0 12px; height: 28px; margin-left: 6px; }
</style>
<div id="app">
  <h2 class="sr-only">Alat za nasumični odabir polaznika tečaja</h2>

  <div id="bulk-area">
    <textarea id="bulk-textarea" placeholder="Zalijepi listu imena (jedno po redu ili zarezom odvojeno)..."></textarea>
    <button id="bulk-btn">uvezi listu</button>
  </div>

  <div id="input-area">
    <input type="text" id="name-input" placeholder="Ime polaznika..." maxlength="60" />
    <button id="add-btn">+ dodaj</button>
  </div>

  <div id="list-section">
    <div id="list-header">
      <span>polaznici</span>
      <span id="count-badge">0 / 30</span>
    </div>
    <div id="student-list"></div>
  </div>

  <div id="pick-section">
    <button id="pick-btn" disabled>▶ odaberi</button>
    <div id="stats-row">
      <div class="stat-card"><div class="stat-label">ukupno</div><div class="stat-val" id="stat-total">0</div></div>
      <div class="stat-card"><div class="stat-label">već odabrani</div><div class="stat-val" id="stat-picked">0</div></div>
      <div class="stat-card"><div class="stat-label">preostalo</div><div class="stat-val" id="stat-remain">0</div></div>
    </div>
    <button id="reset-picks">resetiraj odabrane</button>
    <button id="clear-all">obriši sve</button>
  </div>

  <div id="result-box" style="display:none;">
    <div>
      <div id="result-name"></div>
      <div id="result-hint"></div>
    </div>
  </div>
</div>

<script>
  const students = [];
  const pickedSet = new Set();
  let rolling = false;

  const nameInput = document.getElementById('name-input');
  const addBtn = document.getElementById('add-btn');
  const bulkTextarea = document.getElementById('bulk-textarea');
  const bulkBtn = document.getElementById('bulk-btn');
  const studentList = document.getElementById('student-list');
  const countBadge = document.getElementById('count-badge');
  const pickBtn = document.getElementById('pick-btn');
  const resultBox = document.getElementById('result-box');
  const resultName = document.getElementById('result-name');
  const resultHint = document.getElementById('result-hint');
  const statTotal = document.getElementById('stat-total');
  const statPicked = document.getElementById('stat-picked');
  const statRemain = document.getElementById('stat-remain');
  const resetPicksBtn = document.getElementById('reset-picks');
  const clearAllBtn = document.getElementById('clear-all');

  function normalize(name) { return name.trim().replace(/\s+/g, ' '); }

  function addStudent(name) {
    name = normalize(name);
    if (!name || students.includes(name) || students.length >= 30) return false;
    students.push(name);
    return true;
  }

  function renderList() {
    studentList.innerHTML = '';
    students.forEach((s, i) => {
      const tag = document.createElement('div');
      tag.className = 'student-tag' + (pickedSet.has(s) ? ' picked' : '');
      tag.innerHTML = `<span>${s}</span><span class="remove-x" data-i="${i}" title="ukloni">✕</span>`;
      studentList.appendChild(tag);
    });
    countBadge.textContent = `${students.length} / 30`;
    pickBtn.disabled = students.length === 0 || rolling;
    updateStats();
  }

  function updateStats() {
    const remain = students.filter(s => !pickedSet.has(s)).length;
    statTotal.textContent = students.length;
    statPicked.textContent = pickedSet.size;
    statRemain.textContent = remain;
  }

  studentList.addEventListener('click', e => {
    if (e.target.classList.contains('remove-x')) {
      const i = parseInt(e.target.dataset.i);
      const name = students[i];
      students.splice(i, 1);
      pickedSet.delete(name);
      renderList();
    }
  });

  function doAdd() {
    if (addStudent(nameInput.value)) {
      nameInput.value = '';
      renderList();
    }
    nameInput.focus();
  }

  addBtn.addEventListener('click', doAdd);
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });

  bulkBtn.addEventListener('click', () => {
    const raw = bulkTextarea.value;
    const parts = raw.split(/[\n,;]+/).map(s => s.trim()).filter(Boolean);
    let added = 0;
    parts.forEach(p => { if (addStudent(p)) added++; });
    bulkTextarea.value = '';
    renderList();
  });

  resetPicksBtn.addEventListener('click', () => {
    pickedSet.clear();
    resultBox.style.display = 'none';
    renderList();
  });

  clearAllBtn.addEventListener('click', () => {
    students.length = 0;
    pickedSet.clear();
    resultBox.style.display = 'none';
    renderList();
  });

  function pickRandom() {
    if (rolling) return;
    const pool = students.filter(s => !pickedSet.has(s));
    if (pool.length === 0) {
      resultBox.style.display = 'flex';
      resultName.classList.remove('visible', 'rolling');
      resultName.textContent = '—';
      resultName.classList.add('visible');
      resultHint.textContent = 'svi su već odabrani — resetiraj za novi krug';
      return;
    }

    rolling = true;
    pickBtn.disabled = true;
    resultBox.style.display = 'flex';
    resultName.classList.remove('visible');
    resultHint.textContent = '';

    const winner = pool[Math.floor(Math.random() * pool.length)];
    let ticks = 0;
    const maxTicks = 14 + Math.floor(Math.random() * 8);
    const allNames = [...students];

    const interval = setInterval(() => {
      ticks++;
      const fake = allNames[Math.floor(Math.random() * allNames.length)];
      resultName.classList.add('rolling');
      resultName.classList.remove('visible');
      resultName.textContent = fake;
      resultName.classList.add('visible');

      if (ticks >= maxTicks) {
        clearInterval(interval);
        resultName.classList.remove('rolling');
        resultName.classList.remove('visible');
        setTimeout(() => {
          resultName.textContent = winner;
          resultName.classList.add('visible');
          pickedSet.add(winner);
          const remain = students.filter(s => !pickedSet.has(s)).length;
          resultHint.textContent = remain > 0 ? `preostalo: ${remain}` : 'svi odabrani — resetiraj za novi krug';
          rolling = false;
          renderList();
        }, 80);
      }
    }, 80);
  }

  pickBtn.addEventListener('click', pickRandom);
  renderList();
</script>

</body>
</html>
