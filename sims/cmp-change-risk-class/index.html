<!-- cmp-change-risk-class: sending every change to a weekly change advisory board adds days of lead time and makes
     teams batch changes, so each release is bigger and fails more often; risk classes (standard, normal with the board
     only for high risk, emergency) cut lead time without raising the failure rate; unrecorded changes show up only as
     incidents. The stage: three lanes (no process, everything to the board, risk classes) over the same quarter of
     changes, each deployment a stack of blocks on its day, failed ones hatched with ✗, unrecorded ones dashed, board
     meetings ticked; beside each lane its lead time, changes per deployment, failure rate and unrecorded changes.
     Model: sim.js; rules: SPEC.md; words: strings.js. -->

<!-- Text in the page comes from strings.js: [data-t] text, [data-t-html] markup, [data-t-label] aria-label. The kit fills

<div class="sd-page">

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  // ── numbers in the page's language ──

  /** Tenths as text: 47 → "4,7" / "4.7". */
  function dec(x10) {
    var s = Math.floor(x10 / 10) + '.' + (x10 % 10);
    return Simdeck.lang === 'hr' ? s.replace('.', ',') : s;
  }
  function pct(n) { return t('pct', { n: String(n) }); }
  function b(text) { return h('b', { translate: 'no' }, String(text)); }
  function freq(I) { return t('b_' + I); }

  // ── the lanes ──

  /** Per lane: the deployments of each day, and what the tallest column needs (blocks, labels, gaps). */
  function columns(lane, H) {
    var cols = [];
    for (var d = 0; d < H; d++) cols.push([]);
    lane.deploys.forEach(function (x) { cols[x.day].push(x); });
    var max = 0, lab = 0, gaps = 0;
    cols.forEach(function (c) {
      var n = 0, k = 0;
      c.forEach(function (x) { n += x.size; if (tagOf(x)) k++; });
      max = Math.max(max, n); lab = Math.max(lab, k); gaps = Math.max(gaps, c.length);
    });
    return { cols: cols, max: max, lab: lab, gaps: gaps };
  }
  /** The label over a deployment: ✗ when it failed, its size from 3 changes up. */
  function tagOf(x) { return (x.failed ? '✗' : '') + (x.size >= 3 ? String(x.size) : ''); }

  function title(x, day) {
    var what = t.n(x.failed ? 'depFail' : 'depOk', x.size) + (x.unrec ? t('depUnrec') : '');
    return t('dayLabel', { w: Math.floor(day / 5) + 1, d: day % 5 + 1, what: what });
  }

  function timeline(s, g, c, fit) {
    var meets = g !== 'none';
    var cols = c.cols.map(function (list, day) {
      var kids = [];
      list.forEach(function (x) {
        kids.push(h('span', { class: 'cr-dep', title: title(x, day),
          dataset: { failed: String(x.failed), unrec: String(x.unrec) }, style: { '--n': String(x.size) } }));
        var tag = tagOf(x);
        if (tag) kids.push(h('span', { class: 'cr-tag', translate: 'no', dataset: { failed: String(x.failed) } }, tag));
      });
      if (meets && L.isMeeting(day, s.p.board)) kids.push(h('span', { class: 'cr-meet' }));
      return h('div', { class: 'cr-col' }, kids);
    });
    var m = s.lanes[g].m;
    return h('div', {
      class: 'cr-tl', role: 'img', dataset: { dense: String(fit.max > 30) },
      'aria-label': t('laneLabel', { name: t('r_' + g), lead: dec(m.lead10), batch: dec(m.batch10), f: m.failed, d: m.deploys, u: m.unrec }),
      style: { '--h': String(s.horizon), '--q': String(L.DAYS), '--max': String(fit.max), '--lab': String(fit.lab), '--gaps': String(fit.gaps) }
    }, cols);
  }

  /** Rule 7: the lane's numbers; the worst value of each across the three lanes is marked. */
  function label(s, g, worst) {
    var m = s.lanes[g].m;
    function cell(key, value, extra) {
      return h('div', { class: 'cr-m', dataset: { worst: String(worst[key] === g) } },
        h('span', { class: 'cr-mv cr-num', translate: 'no' }, value, extra ? h('small', null, ' ' + extra) : null),
        h('span', { class: 'cr-ml' }, t('m_' + key)));
    }
    return h('div', { class: 'cr-lab' },
      h('p', { class: 'cr-name' }, t('r_' + g)),
      h('p', { class: 'cr-sub' }, t('sub_' + g, { f: freq(s.p.board) })),
      h('div', { class: 'cr-ms' },
        cell('lead', dec(m.lead10)),
        cell('batch', dec(m.batch10)),
        cell('cfr', pct(m.cfr), m.failed + '/' + m.deploys),
        cell('unrec', String(m.unrec))),
      h('p', { class: 'cr-lf', translate: 'no' }, t.n('laneFoot', m.deploys, { r: m.rolled })));
  }

  /** The lane with the highest value of each number, when one lane alone has it and it is above zero. */
  function worstOf(s) {
    var out = {};
    [['lead', 'lead10'], ['batch', 'batch10'], ['cfr', 'cfr'], ['unrec', 'unrec']].forEach(function (k) {
      var vals = L.REGIMES.map(function (g) { return s.lanes[g].m[k[1]]; });
      var top = Math.max.apply(null, vals);
      var at = vals.filter(function (v) { return v === top; }).length;
      out[k[0]] = top > 0 && at === 1 ? L.REGIMES[vals.indexOf(top)] : null;
    });
    return out;
  }

  function render(c) {
    var s = c.state;
    var fits = {}, fit = { max: 1, lab: 0, gaps: 1 };
    L.REGIMES.forEach(function (g) {
      fits[g] = columns(s.lanes[g], s.horizon);
      fit.max = Math.max(fit.max, fits[g].max); fit.lab = Math.max(fit.lab, fits[g].lab); fit.gaps = Math.max(fit.gaps, fits[g].gaps);
    });
    var wk = [];
    for (var w = 0; w < L.DAYS / 5; w++) wk.push(h('span', { class: 'cr-wk', translate: 'no' }, t('week', { n: w + 1 })));
    var worst = worstOf(s);
    var kids = [h('div', { class: 'cr-axis', 'aria-hidden': 'true', style: { '--h': String(s.horizon) } }, wk)];
    L.REGIMES.forEach(function (g) {
      fits[g].max = fit.max; fits[g].lab = fit.lab; fits[g].gaps = fit.gaps;
      kids.push(label(s, g, worst), timeline(s, g, fits[g], fits[g]));
    });
    kids.push(h('p', { class: 'cr-foot' }, t('foot')));
    c.stage.replaceChildren(h('div', { class: 'cr' }, kids));
  }

  function caption(c) {
    var s = c.state;
    var k = L.captionKey(s);
    var cab = s.lanes.cab.m, cl = s.lanes.classes.m;
    var out = t.parts(k.key, {
      f: freq(s.p.board), cl: b(dec(cab.lead10)), cb: b(dec(cab.batch10)), cf: b(cab.failed), cd: b(cab.deploys),
      cp: b(pct(cab.cfr)), kl: b(dec(cl.lead10)), kp: b(pct(cl.cfr))
    });
    k.notes.forEach(function (key) {
      out.push(' ');
      out = out.concat(t.parts(key, { n: cab.unrec, u: b(cab.unrec), uf: b(cab.unrecFailed), k: b(s.stdMediumFailed), m: b(cab.meetings) }));
    });
    return out;
  }

  var labels = { weekly: 'pWeekly', fortnight: 'pFortnight', daily: 'pDaily', 'wide-standard': 'pWideStandard', busy: 'pBusy' };
  var R = L.RANGES;

  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'board', type: 'choice', label: t('board'), options: L.BOARDS.map(function (I) { return [I, freq(I)]; }) },
      { key: 'standard', type: 'choice', label: t('standard'), options: L.STANDARDS.map(function (x) { return [x, t('s_' + x)]; }) },
      { key: 'load', type: 'range', label: t('load'), min: R.load[0], max: R.load[1], step: 1 },
      // the seed: "New quarter" adds 1; hidden, kept in the URL
      { key: 'seed', type: 'range', label: t('newQuarter'), min: R.seed[0], max: R.seed[1], step: 1, visible: function () { return false; } },
      { type: 'button', label: t('newQuarter'), key: 'n', run: function (api) { api.set({ seed: L.nextSeed(api.params.seed) }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { shape: 'cr-dep', label: t('legDeploy') },
      { shape: 'cr-fail', label: t('legFailed') },
      { shape: 'cr-unrec', label: t('legUnrec') },
      { shape: 'cr-meet', label: t('legMeeting') },
      { shape: 'cr-after', label: t('legAfter') }
    ],
    render: render,
    caption: caption
  });
})();
</script>
</body>
