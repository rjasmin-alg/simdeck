<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);

  var AX0 = -100, AX1 = 400;   // the lane's time axis in days
  var SVG = 'http://www.w3.org/2000/svg';
  /** One example user per OU (made up), shown on the stack card. */
  var EX = {
    HQ: { name: 'j.ashby', sid: 'S-1-5-21-…-1107', guid: '7c1e…', groups: 'HQ-Staff, Finance-RW' },
    Brackenridge: { name: 't.mercer', sid: 'S-1-5-21-…-1342', guid: '2b90…', groups: 'BRK-Staff, Site-Leads' }
  };
  var OU_DN = { HQ: 'OU=HQ', Brackenridge: 'OU=Brackenridge' };

  /** Data (names, SIDs, numbers) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { class: 'rb-d' + (cls ? ' ' + cls : ''), translate: 'no' }, String(text)); }
  function num(d) { return String(d).replace('-', '−'); }
  function days(n) { return t.n('days', n); }
  function ousNode() { return data(OU_DN.HQ + ', ' + OU_DN.Brackenridge); }
  /** Parts of a string with *English term* turned into <em lang="en">. */
  function rich(key, vars) {
    var out = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(p.cloneNode(true)); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  function join(list) {
    var out = [];
    list.forEach(function (x) { if (!x) return; if (out.length) out.push(' '); out = out.concat(x); });
    return out;
  }
  function pct(d) { return ((Math.max(AX0, Math.min(AX1, d)) - AX0) / (AX1 - AX0) * 100) + '%'; }
  function firstOf(s, ou, kind) { return s.objects.filter(function (o) { return o.ou === ou && o.kind === kind; })[0]; }
  function look(o) { return o ? { state: o.state, keeps: o.keeps, by: o.by } : null; }
  function changed(c, get) {
    if (!c.prev || c.n === 0) return false;
    return JSON.stringify(get(c.state)) !== JSON.stringify(get(c.prev));
  }
  function stateWord(o) {
    if (o.state === 'live') return o.by === 'reanimate' ? t('byReanimate') : o.by === 'bin' ? t('byBin') : o.by === 'auth' ? t('byAuth') : t('stLive');
    return t({ deleted: 'stDeleted', tombstone: 'stTombstone', recycled: 'stRecycled', gone: 'stGone' }[o.state]);
  }

  function binIcon() {
    var svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('class', 'rb-icon');
    svg.setAttribute('aria-hidden', 'true');
    [['path', 'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v8M14 10v8']].forEach(function (p) {
      var el = document.createElementNS(SVG, p[0]);
      el.setAttribute('d', p[1]);
      el.setAttribute('fill', 'none');
      el.setAttribute('stroke', 'currentColor');
      el.setAttribute('stroke-width', '2');
      el.setAttribute('stroke-linejoin', 'round');
      el.setAttribute('stroke-linecap', 'round');
      svg.appendChild(el);
    });
    return svg;
  }

  // ── the lane ──

  function laneView(c) {
    var s = c.state, o = firstOf(s, 'HQ', 'user');
    var segs = [{ from: AX0, to: 0, state: 'live' }].concat(L.lane(s, o, AX1));
    var track = segs.map(function (g) {
      var w = (g.to - g.from) / (AX1 - AX0) * 100;
      var word = g.state === 'live' ? (g.by ? stateWord({ state: 'live', by: g.by }) : t('stLive'))
        : t({ deleted: 'stDeleted', tombstone: 'stTombstone', recycled: 'stRecycled', gone: 'stGone' }[g.state]);
      return h('div', { class: 'rb-seg', dataset: { st: g.state }, style: { left: pct(g.from), width: w + '%' } }, w >= 14 ? word : '');
    });
    if (o.deletedOn === null) track.push(h('div', { class: 'rb-before', style: { left: pct(0) } }, t('laneBefore')));
    else track.push(h('div', { class: 'rb-future', style: { left: pct(s.day) } }));
    var marks = [];
    if (s.backup) {
      track.push(h('div', { class: 'rb-pin', dataset: { k: 'event' }, style: { left: pct(s.backup.day) } }));
      marks.push(h('span', { class: 'rb-mark', style: { left: pct(s.backup.day) } }, '◆ ', t('mkBackup'), ' ', data(num(s.backup.day))));
    }
    if (s.enabledOn !== null) {
      track.push(h('div', { class: 'rb-pin', dataset: { k: 'event' }, style: { left: pct(s.enabledOn) } }));
      marks.push(h('span', { class: 'rb-mark', style: { left: pct(s.enabledOn) } }, '● ', t('mkEnable')));
    }
    track.push(h('div', { class: 'rb-pin', style: { left: pct(s.day) } }));
    var ticks = [0, 180, 360].map(function (d) { return h('span', { class: 'rb-tick', translate: 'no', style: { left: pct(d) } }, String(d)); });
    var flag = { class: 'rb-flag' + (changed(c, function (x) { return x.day; }) ? ' rb-ch' : ''), style: { left: pct(s.day) } };
    if (s.day > 300) flag.dataset = { end: '1' };
    return h('div', { class: 'rb-lane' },
      h('div', { class: 'rb-lane-head' }, h('b', null, t('laneTitle')), h('span', { class: 'rb-muted' }, t('laneAxis'))),
      h('div', { class: 'rb-flags' }, h('span', flag, '▼ ', t('mkNow', { d: num(s.day) }))),
      h('div', { class: 'rb-track', role: 'img', 'aria-label': t('laneTitle') }, track),
      h('div', { class: 'rb-scale' }, ticks),
      marks.length ? h('div', { class: 'rb-marks' }, marks) : null);
  }

  function forestBox(c) {
    var s = c.state;
    var bin = s.recycleBin
      ? [h('b', null, t('fOn')), s.enabledOn !== null ? [' (', t('fSince', { d: num(s.enabledOn) }), ')'] : null, ' · ', t('fOneWay')]
      : [t('fOff'), ' · ', t('fOneWay')];
    return h('div', { class: 'rb-box rb-forest' },
      h('b', null, t('fTitle'), ' ', data('quillmoor.example')),
      h('div', { class: changed(c, function (x) { return x.recycleBin; }) ? 'rb-ch' : null }, t('fBin'), ': ', bin),
      h('div', null, data('tombstoneLifetime'), ': ', days(s.tsl)),
      h('div', null, data('msDS-deletedObjectLifetime'), ': ', t('fNotSet'), ' ', days(s.dol)),
      h('div', null, t('fBackup'), ': ', s.backup ? t('fBackupDay', { d: num(s.backup.day) }) : t('fBackupNone')));
  }

  // ── the stacks ──

  function fieldRow(o, f, ou) {
    var ex = EX[ou];
    var val = { sid: data(ex.sid), guid: data(ex.guid), name: data(ex.name), attrs: t('vAttrs'), groups: data(ex.groups), password: t('vPassword') }[f];
    var label = { sid: t('fdSid'), guid: t('fdGuid'), name: t('fdName'), attrs: t('fdAttrs'), groups: t('fdGroups'), password: t('fdPassword') }[f];
    var kept = o.keeps[f];
    return h('tr', { class: kept ? 'rb-kept' : 'rb-lost' },
      h('th', null, label),
      h('td', { class: 'rb-v' }, val),
      h('td', { class: 'rb-m', 'aria-label': kept ? null : t('vLost') }, kept ? '✓' : '✗'));
  }

  function verdictBox(o) {
    var v = L.verdict(o);
    function yn(ok, word) { return h('span', { class: ok ? 'rb-yes' : 'rb-no' }, word); }
    return h('div', { class: 'rb-verdict' },
      h('p', null, t('vdLogon'), yn(v.logon === 'yes', t(v.logon === 'yes' ? 'vdYes' : v.logon === 'reset' ? 'vdReset' : 'vdNo'))),
      h('p', null, t('vdFiles'), yn(v.files, t(v.files ? 'vdYes' : 'vdNo'))),
      h('p', null, t('vdGroups'), yn(v.groups, t(v.groups ? 'vdYes' : 'vdNo'))));
  }

  function stackView(c, ou) {
    var s = c.state;
    var unit = firstOf(s, ou, 'ou'), user = firstOf(s, ou, 'user');
    var n = L.count(s, 'user', function (x) { return x.ou === ou; });
    var ouCh = changed(c, function (x) { return look(firstOf(x, ou, 'ou')); });
    var usCh = changed(c, function (x) { return look(firstOf(x, ou, 'user')); });
    var ouCard = h('div', { class: 'rb-ou' + (ouCh ? ' sd-changed' : ''), dataset: { st: unit.state } },
      data(OU_DN[ou]), h('span', { class: 'rb-badge' }, stateWord(unit)));
    var head = h('div', { class: 'rb-card-head' }, unit.state === 'deleted' || user.state === 'deleted' ? binIcon() : null, t.n('nUsers', n),
      h('span', { class: 'rb-badge' }, stateWord(user)),
      user.asOf !== null && user.state === 'live' ? h('span', { class: 'rb-badge' }, t('asOf', { d: num(user.asOf) })) : null);
    var body = user.state === 'gone'
      ? h('div', { class: 'rb-slot' }, t('goneSlot'))
      : h('table', { class: 'rb-tab' }, h('tbody', null, L.FIELDS.map(function (f) { return fieldRow(user, f, ou); })));
    var card = h('div', { class: 'rb-card' + (usCh ? ' sd-changed' : '') + (usCh && c.dir === 'forward' ? ' sd-anim-in' : ''), dataset: { st: user.state } }, head, body);
    return h('div', { class: 'rb-stack' }, ouCard, card, s.last && s.last.kind === 'outcome' ? verdictBox(user) : null);
  }

  // ── the restore panel ──

  function usedNow(s) {
    var e = s.last;
    if (!e) return null;
    if (e.kind === 'restore' || e.kind === 'attempt') return e.method;
    if (e.kind === 'auth') return 'auth';
    return null;
  }

  function opBox(c, key, label, brings) {
    var s = c.state, o = L.options(s)[key], e = s.last;
    var now = usedNow(s) === key;
    var status;
    if (o.ok) status = h('span', { class: 'rb-ok' }, '✓ ', o.n ? t.n('okN', o.n) : t('okAge', { age: days(o.age) }));
    else {
      var why = { live: 'whyLive', recycled: 'whyRecycled', gone: 'whyGone', off: 'whyOff', 'bin-on': 'whyBinOn', none: 'whyNone', 'too-old': 'whyTooOld' }[o.why];
      status = h('span', { class: o.why === 'live' || o.why === 'bin-on' ? 'rb-muted' : 'rb-bad' },
        o.why === 'live' || o.why === 'bin-on' ? '' : '✕ ', t(why, { age: o.age !== undefined ? days(o.age) : '' }));
    }
    var chips = L.FIELDS.map(function (f) {
      var label2 = { sid: t('fdSid'), guid: t('fdGuid'), name: t('fdName'), attrs: t('fdAttrs'), groups: t('fdGroups'), password: t('fdPassword') }[f];
      return h('span', { class: brings[f] ? null : 'rb-off' }, (brings[f] ? '✓ ' : '✗ ') + label2);
    });
    return h('div', { class: 'rb-op', dataset: now ? { now: '1' } : {} },
      h('b', null, label, now ? h('span', { class: 'rb-badge' }, '▶ ', t('thisStep')) : null,
        now && e && e.ok === 0 ? h('span', { class: 'rb-badge rb-bad' }, '✕ ', t('failed')) : null),
      h('p', null, status),
      h('p', { class: 'rb-chips' }, h('span', { class: 'rb-muted' }, t('brings')), chips));
  }

  function panel(c) {
    var all = { sid: true, guid: true, name: true, attrs: true, groups: true, password: true };
    var part = { sid: true, guid: true, name: true, attrs: false, groups: false, password: false };
    return h('div', { class: 'rb-panel' },
      h('span', { class: 'rb-head' }, t('rpTitle')),
      opBox(c, 'reanimate', t('opReanimate'), part),
      opBox(c, 'bin', t('opBin'), all),
      opBox(c, 'auth', t('opAuth'), all));
  }

  // ── captions ──

  function caption(c) {
    var s = c.state, e = s.last;
    var nUsers = L.count(s, 'user'), nAll = s.objects.length;
    if (!e) return rich('capStart', { bin: t(s.recycleBin ? 'capBinOn' : 'capBinOff'), tsl: days(s.tsl), ous: ousNode(), n: nUsers });
    if (e.kind === 'delete') return e.state === 'deleted' ? rich('capDeleteBin', { n: nAll, dol: days(s.dol) }) : rich('capDelete', { n: nAll - 1 });
    if (e.kind === 'wait') {
      var out = [rich('capWait', { d: days(e.to - e.from), gc: e.gc })];
      if (e.recycled) out.push(rich('capWaitRecycled', { n: e.recycled }));
      if (e.gone) out.push(rich(e.recycled ? 'capWaitGone' : 'capWaitGoneTomb', { n: e.gone }));
      if (!e.recycled && !e.gone) out.push(rich('capWaitSame'));
      return join(out);
    }
    if (e.kind === 'enable') return join([rich('capEnable', { n: nUsers }), e.recycled ? rich('capEnableWorse', { n: e.recycled }) : rich('capEnableNone')]);
    if (e.kind === 'restore') {
      if (e.why === 'parent') return rich('capParent', { n: e.failed, ous: ousNode() });
      if (e.what === 'ous') return rich(e.method === 'bin' ? 'capOusBin' : 'capOusRe', { ous: ousNode() });
      return rich(e.method === 'bin' ? 'capUsersBin' : 'capUsersRe', { n: e.ok });
    }
    if (e.kind === 'attempt') {
      var a = [e.why === 'gone' ? rich('capAttemptGone') : rich('capAttemptRecycled', { n: e.recycled })];
      if (!s.backup) a.push(rich('capNoBackup'));
      return join(a);
    }
    if (e.kind === 'auth') return e.ok ? rich('capAuth', { age: days(e.age), d: num(s.backup.day) }) : rich('capAuthOld', { age: days(e.age), life: days(e.life) });
    var u = s.objects.filter(function (o) { return o.kind === 'user'; });
    var live = u.every(function (o) { return o.state === 'live'; });
    if (!live) return rich('capOutNone', { n: nUsers });
    var by = u[0].by;
    if (by === 'bin') return rich('capOutBin', { n: nUsers });
    if (by === 'auth') return rich('capOutAuth', { n: nUsers, d: num(u[0].asOf) });
    return rich('capOutRe', { n: nUsers });
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'recycleBin', type: 'choice', label: t('pBin'), options: [['off', t('rbOff')], ['before', t('rbBefore')], ['after', t('rbAfter')]] },
      { key: 'daysSince', type: 'range', label: t('pDays'), min: 0, max: 400, step: 10 },
      { key: 'backupAgeDays', type: 'choice', label: t('pBackup'), options: [[0, t('bkNone')], [80, t('bk80')]] },
      { key: 'usersFirst', type: 'toggle', label: t('pUsersFirst') }
    ],

    presets: [
      { id: 'no-recycle-bin', label: t('prNoBin'), params: { recycleBin: 'off', daysSince: 0, backupAgeDays: 0, usersFirst: false } },
      { id: 'with-recycle-bin', label: t('prBin'), params: { recycleBin: 'before', daysSince: 0, backupAgeDays: 0, usersFirst: false } },
      { id: 'enable-after', label: t('prEnableAfter'), params: { recycleBin: 'after', daysSince: 0, backupAgeDays: 0, usersFirst: false } },
      { id: 'too-late', label: t('prTooLate'), params: { recycleBin: 'off', daysSince: 200, backupAgeDays: 0, usersFirst: false } },
      { id: 'wrong-order', label: t('prWrongOrder'), params: { recycleBin: 'before', daysSince: 0, backupAgeDays: 0, usersFirst: true } }
    ],

    legend: [
      { shape: 'rb-live', label: t('lgLive') },
      { shape: 'rb-deleted', label: t('lgDeleted') },
      { shape: 'rb-tomb', label: t('lgTomb') },
      { shape: 'rb-recycled', label: t('lgRecycled') },
      { shape: 'rb-gone', label: t('lgGone') },
      { shape: 'rb-lost', label: t('lgLost') },
      { shape: 'hl', label: t('lgChanged') }
    ],

    render: function (c) {
      c.stage.replaceChildren(h('div', { class: 'rb' }, laneView(c), forestBox(c), stackView(c, 'HQ'), stackView(c, 'Brackenridge'), panel(c)));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
