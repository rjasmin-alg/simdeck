<style>
/* Page CSS: every selector starts with [data-sim="dsp-basics"]; colours only from kit tokens. */
[data-sim="dsp-basics"] .bm { height: 100%; padding: 1.2cqh 1.4cqw; display: flex; flex-direction: column; gap: 0.6rem; }
/* the circuit as a row of blocks */
[data-sim="dsp-basics"] .bm-circuit { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.5rem; font-size: var(--fs-sm); }
[data-sim="dsp-basics"] .bm-col { display: flex; flex-direction: column; gap: 0.3rem; }
[data-sim="dsp-basics"] .bm-row { display: flex; align-items: center; gap: 0.5rem; }
[data-sim="dsp-basics"] .bm-block { border: 2px solid var(--line); border-radius: 0.4rem; padding: 0.2rem 0.6rem; background: var(--panel); color: var(--ink); line-height: 1.25; text-align: center; }
[data-sim="dsp-basics"] .bm-block b { display: block; font-weight: 600; }
[data-sim="dsp-basics"] .bm-block.sd-soft { border-color: currentColor; }
[data-sim="dsp-basics"] .bm-block .bm-v { color: var(--muted); white-space: nowrap; }
[data-sim="dsp-basics"] .bm-arrow { color: var(--muted); font-size: var(--fs-md); }
[data-sim="dsp-basics"] .bm-ring { font-family: var(--sans); font-size: var(--fs-md); }
/* the potentiometer: one bar, split at the wiper into its top and bottom part */
[data-sim="dsp-basics"] .bm-pot { min-width: 13rem; }
[data-sim="dsp-basics"] .bm-bar { position: relative; display: flex; height: 0.9rem; margin: 0.3rem 0 0.1rem; border: 2px solid var(--line); border-radius: 0.2rem; }
[data-sim="dsp-basics"] .bm-bar span { display: block; height: 100%; }
[data-sim="dsp-basics"] .bm-bar .bm-top { background: var(--muted); opacity: 0.45; }
[data-sim="dsp-basics"] .bm-bar .bm-wiper { position: absolute; top: -0.35rem; bottom: -0.35rem; width: 0.3rem; margin-left: -0.15rem; background: var(--ink); border-radius: 0.1rem; }
[data-sim="dsp-basics"] .bm-bar .bm-mid { position: absolute; top: -0.35rem; bottom: -0.35rem; left: 50%; border-left: 2px dashed var(--muted); }
[data-sim="dsp-basics"] .bm-parts { display: flex; justify-content: space-between; gap: 0.6rem; color: var(--muted); white-space: nowrap; }
/* Subscripts in the explanation stay at the text size (the phone floor is 14 px); only the baseline drops. */
[data-sim="dsp-basics"] .sd-explain sub { font-size: inherit; vertical-align: -0.3em; line-height: 0; }
/* the two plots */
[data-sim="dsp-basics"] .bm-fig { position: relative; flex: 1; min-height: 9rem; display: flex; flex-direction: column; }
[data-sim="dsp-basics"] .bm-fig h2 { margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--muted); }
[data-sim="dsp-basics"] .bm-plot { position: relative; flex: 1; }
[data-sim="dsp-basics"] .bm-plot svg { position: absolute; inset: 0; overflow: visible; }
[data-sim="dsp-basics"] .bm-plot text { font-family: var(--sans); font-size: var(--fs-sm); fill: var(--muted); }
[data-sim="dsp-basics"] .bm-frame { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
[data-sim="dsp-basics"] .bm-grid { stroke: var(--line); stroke-width: 1; opacity: 0.6; }
[data-sim="dsp-basics"] .bm-zero { stroke: var(--muted); stroke-width: 1.5; }
[data-sim="dsp-basics"] .bm-out { fill: none; stroke: var(--c1); stroke-width: 2; stroke-linejoin: round; }
[data-sim="dsp-basics"] .bm-af { fill: none; stroke: var(--c3); stroke-width: 3; stroke-dasharray: 10 6; }
[data-sim="dsp-basics"] .bm-guide { stroke: var(--c4); stroke-width: 1.5; stroke-dasharray: 4 4; }
[data-sim="dsp-basics"] .bm-stem { stroke: var(--muted); stroke-width: 2; }
[data-sim="dsp-basics"] .bm-stem-c { stroke: var(--c4); stroke-width: 4; }
[data-sim="dsp-basics"] .bm-stem-s { stroke: var(--c2); stroke-width: 4; }
[data-sim="dsp-basics"] .bm-head-c { fill: var(--c4); stroke: var(--bg); stroke-width: 2; }
[data-sim="dsp-basics"] .bm-head-s { fill: var(--c2); stroke: var(--bg); stroke-width: 2; }
[data-sim="dsp-basics"] .bm-plot text.bm-tag { fill: var(--ink); font-weight: 600; }
/* Attribution (CC BY 4.0), at the end of the footer bar, after the kit's reset button. */
[data-sim="dsp-basics"] .bm-credit { order: 9; flex: 1 1 30rem; margin: 0; text-align: right; font-size: var(--fs-sm); color: var(--muted); }
[data-sim="dsp-basics"] .bm-credit a { color: inherit; }

/* Phone and portrait: the stage grows with its content instead of a fixed height. */
@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="dsp-basics"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="dsp-basics"] .bm { height: auto; padding: 0.6rem; }
  [data-sim="dsp-basics"] .bm-fig { flex: none; height: 14rem; }
  [data-sim="dsp-basics"] .bm-row { flex-wrap: wrap; }
  [data-sim="dsp-basics"] .bm-pot { min-width: 0; flex: 1 1 12rem; }
  [data-sim="dsp-basics"] .bm-credit { text-align: left; }

<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">
      <h1 class="sd-title">Balansni modulator (DSB)</h1>
      <p class="sd-subtitle"></p>
    </div>
    <ul class="sd-legend" data-sd-legend></ul>
    <div class="sd-tools" data-sd-tools></div>
  </header>

  <main class="sd-main">
    <div class="sd-stagecol">
      <section class="sd-stage" data-sd-stage data-t-label="stage"></section>
      <p class="sd-caption" data-sd-caption aria-live="polite"></p>
    </div>
    <aside class="sd-panel">
      <div data-sd-presets></div>
      <div data-sd-controls></div>
      <details class="sd-explain">
        <summary></summary>
        <div data-t-html="explain"></div>
      </details>
    </aside>
  </main>

  <footer class="sd-bar" data-sd-transport>
    <p class="bm-credit" data-t-html="credit"></p>
  </footer>
</div>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Numbers in the page's language: a decimal comma in Croatian.
  function num(x) { var s = String(x); return Simdeck.lang === 'hr' ? s.replace('.', ',') : s; }
  function trim(x, d) { return num(parseFloat(x.toFixed(d))); }
  function freq(f) { return f >= 1000 ? t('khz', { v: trim(f / 1000, 2) }) : t('hz', { v: trim(f, 0) }); }
  function volts(x) { return x < 0.1 ? t('mv', { v: trim(x * 1000, 0) }) : t('volt', { v: num(x.toFixed(2)) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function rem() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }

  var labels = { balanced: 'presetBalanced', slightly: 'presetSlightly', far: 'presetFar', noAfBalanced: 'presetNoAfBalanced', noAfOff: 'presetNoAfOff' };

  // ── the circuit, as blocks: the AF source and the oscillator with its potentiometer into the ring, then the
  //    transformer and the output ──
  function circuit(st) {
    var arrow = function () { return h('span', { class: 'bm-arrow', 'aria-hidden': 'true' }, '→'); };
    var block = function (cls, name, value, c) {
      var a = { class: 'bm-block' + (cls ? ' ' + cls : '') };
      if (c) { a.class += ' sd-soft'; a['data-c'] = c; }
      return h('div', a, h('b', null, name), value ? h('span', { class: 'bm-v' }, value) : null);
    };
    var ohm = function (r) { return t('ohm', { v: trim(r, 0) }); };
    var pot = h('div', { class: 'bm-block bm-pot' },
      h('b', null, t('blockPot')),
      h('div', { class: 'bm-bar', 'aria-hidden': 'true' },
        h('span', { class: 'bm-top', style: 'width:' + st.bal + '%' }),
        h('span', { class: 'bm-mid' }),
        h('span', { class: 'bm-wiper', style: 'left:' + st.bal + '%' })),
      h('div', { class: 'bm-parts' },
        h('span', null, t('potTop', { v: ohm(st.r1) })),
        h('span', null, t('potBottom', { v: ohm(st.r2) }))));
    var vf = L.CIRCUIT;
    return h('div', { class: 'bm-circuit' },
      h('div', { class: 'bm-col' },
        block('', t('blockAf'), freq(st.fm) + ' · ' + volts(st.am), 3),
        h('div', { class: 'bm-row' },
          block('', t('blockOsc'), t('blockOscV', { f: freq(vf.fc), v: num(vf.uc) })),
          arrow(), pot)),
      arrow(), block('bm-ring', t('blockRing'), '◇'),
      arrow(), block('', t('blockTrafo'), '1 : 1'),
      arrow(), block('', t('blockOut'), null, 1));
  }

  // ── the output over time, with the AF input dashed on the same volt axis ──
  function drawTime(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), pad = { l: 3.4 * r, r: 1.2 * r, t: 0.6 * r, b: 1.6 * r };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var span = (st.time.length - 1) * st.dtView;
    var vmax = Math.max(1, Math.ceil(Math.max(st.vPeak, st.am) * 2) / 2);
    var X = function (tt) { return pad.l + (tt / span) * cw; };
    var Y = function (v) { return pad.t + ch * (1 - (v + vmax) / (2 * vmax)); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'bm-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    for (var us = 0; us <= span * 1e6 + 1e-6; us += 250) {
      var x = X(us / 1e6), ms = us / 1000;
      if (us > 0 && us < span * 1e6 - 1e-6) svg.append(s('line', { class: 'bm-grid', x1: x, x2: x, y1: pad.t, y2: pad.t + ch }));
      if (us % 500 === 0) svg.append(s('text', { x: x, y: H - 0.2 * r, 'text-anchor': us === 0 ? 'start' : us >= span * 1e6 - 1e-6 ? 'end' : 'middle' }, t('ms', { v: num(ms) })));
    }
    svg.append(s('line', { class: 'bm-zero', x1: pad.l, x2: pad.l + cw, y1: Y(0), y2: Y(0) }));
    [vmax, -vmax].forEach(function (v) {
      svg.append(s('text', { x: pad.l - 0.3 * r, y: Y(v) + (v > 0 ? 0.8 * r : -0.1 * r), 'text-anchor': 'end' }, t('volt', { v: num(v) })));
    });
    var pts = function (ys) { return ys.map(function (v, i) { return X(i * st.dtView).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' '); };
    svg.append(s('polyline', { class: 'bm-out', points: pts(st.time) }));
    if (st.am > 0) svg.append(s('polyline', { class: 'bm-af', points: pts(st.af) }));
    box.replaceChildren(svg);
  }

  // ── the spectrum: one line per 100 Hz bin; the carrier's place always marked (a square head, on the axis when
  //    suppressed), the two sidebands round heads ──
  function drawSpec(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var r = rem(), pad = { l: 3.4 * r, r: 1.2 * r, t: 1.4 * r, b: 1.6 * r };
    var cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;
    var fmax = L.FMAX, amax = Math.max(0.5, Math.ceil(Math.max.apply(null, st.spectrum.slice(1)) * 4) / 4);
    var X = function (f) { return pad.l + (f / fmax) * cw; };
    var Y = function (a) { return pad.t + ch * (1 - a / amax); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    svg.append(s('rect', { class: 'bm-frame', x: pad.l, y: pad.t, width: cw, height: ch }));
    var every = [5000, 10000, 20000].filter(function (e) { return cw / (fmax / e) >= 4.5 * r; })[0] || 20000;
    for (var f = 0; f <= fmax; f += 5000) {
      if (f > 0 && f < fmax) svg.append(s('line', { class: 'bm-grid', x1: X(f), x2: X(f), y1: pad.t, y2: pad.t + ch }));
      if (f % every === 0) svg.append(s('text', { x: X(f), y: H - 0.2 * r, 'text-anchor': f === 0 ? 'start' : f === fmax ? 'end' : 'middle' }, freq(f)));
    }
    svg.append(s('text', { x: pad.l - 0.3 * r, y: Y(amax) + 0.8 * r, 'text-anchor': 'end' }, t('volt', { v: num(amax) })));
    svg.append(s('text', { x: pad.l - 0.3 * r, y: Y(0), 'text-anchor': 'end' }, t('volt', { v: 0 })));
    var kc = Math.round(st.fc / st.bin), kl = Math.round(st.lsb / st.bin), ku = Math.round(st.usb / st.bin);
    var sides = st.am > 0 ? [kl, ku] : [];
    st.spectrum.forEach(function (a, k) {
      if (k === 0 || a < 0.002 || k === kc || sides.indexOf(k) >= 0) return;
      svg.append(s('line', { class: 'bm-stem', x1: X(k * st.bin), x2: X(k * st.bin), y1: Y(0), y2: Y(a) }));
    });
    var hr = 0.42 * r;
    // the carrier's place: a dashed guide, and its head at the residual amplitude
    var xc = X(st.fc), yc = Y(st.spectrum[kc]);
    svg.append(s('line', { class: 'bm-guide', x1: xc, x2: xc, y1: pad.t, y2: Y(0) }));
    if (st.spectrum[kc] >= 0.002) svg.append(s('line', { class: 'bm-stem-c', x1: xc, x2: xc, y1: Y(0), y2: yc }));
    svg.append(s('rect', { class: 'bm-head-c', x: xc - hr, y: yc - hr, width: 2 * hr, height: 2 * hr }));
    sides.forEach(function (k) {
      var x = X(k * st.bin), y = Y(st.spectrum[k]);
      svg.append(s('line', { class: 'bm-stem-s', x1: x, x2: x, y1: Y(0), y2: y }));
      svg.append(s('circle', { class: 'bm-head-s', cx: x, cy: y, r: hr }));
      var lower = k === kl;
      svg.append(s('text', { class: 'bm-tag', x: x + (lower ? -0.7 : 0.7) * r, y: y - 0.6 * r, 'text-anchor': lower ? 'end' : 'start' }, freq(k * st.bin)));
    });
    // the carrier's frequency above the plot, clear of the sideband tags
    svg.append(s('text', { class: 'bm-tag', x: xc, y: pad.t - 0.3 * r, 'text-anchor': 'middle' }, freq(st.fc)));
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'bal', type: 'range', label: t('bal'), hint: t('balHint'), min: L.BAL_MIN, max: L.BAL_MAX, step: 1,
        format: function (v) { return t('pct', { v: v }); } },
      { key: 'fm', type: 'range', label: t('fm'), hint: t('fmHint'), min: L.FM_MIN, max: L.FM_MAX, step: L.FM_STEP, format: freq },
      { key: 'am', type: 'range', label: t('am'), hint: t('amHint'), min: 0, max: L.AM_MAX * 10, step: 1,
        format: function (v) { return t('volt', { v: num(v / 10) }); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(labels[x.id]), hint: t(labels[x.id] + 'Hint'), params: x.params }; }),
    legend: [
      { c: 1, label: t('legendOut') },
      { c: 3, label: t('legendAf') },
      { c: 4, label: t('legendCarrier') },
      { c: 2, shape: 'round', label: t('legendSide') }
    ],

    render: function (c) {
      var time = h('div', { class: 'bm-plot' }), spec = h('div', { class: 'bm-plot' });
      c.stage.replaceChildren(h('div', { class: 'bm' },
        circuit(c.state),
        h('div', { class: 'bm-fig' }, h('h2', null, t('plotTime')), time),
        h('div', { class: 'bm-fig' }, h('h2', null, t('plotSpec')), spec)));
      drawTime(time, c.state);
      drawSpec(spec, c.state);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', null, x); };
      var fc = b(freq(st.fc)), ac = b(volts(st.aCarrier)), floor = b(volts(L.FLOOR));
      var gone = st.aCarrier < L.FLOOR;
      if (st.am === 0) return gone ? t.parts('captionNoAfGone', { fc: fc, floor: floor }) : t.parts('captionNoAf', { fc: fc, ac: ac });
      var side = t.parts('caption', { lsb: b(freq(st.lsb)), usb: b(freq(st.usb)), al: b(volts(st.aLsb)), au: b(volts(st.aUsb)) });
      var db = st.supp ? b(num(Math.abs(Math.round(st.supp.db)))) : b('–');
      var rest = st.supp && st.supp.more ? t.parts('captionGone', { fc: fc, floor: floor, db: db })
        : st.supp && st.supp.db < 0 ? t.parts('captionAbove', { fc: fc, ac: ac, db: db })
        : t.parts('captionBelow', { fc: fc, ac: ac, db: db });
      return [].concat(side, rest);
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
