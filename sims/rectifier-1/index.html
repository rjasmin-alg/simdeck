<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var PI = Math.PI;
  var sim = null;

  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function text(x, y, str, cls, attrs) {
    return s('text', Object.assign({ class: cls || null, x: x, y: y, translate: 'no' }, attrs || {}), str);
  }
  // "U" with a subscript (1, 2, a, e), as in the figures; pre is put before it ("~")
  function uText(x, y, sub, cls, anchor, pre) {
    return s('text', { class: cls || null, x: x, y: y, translate: 'no', 'text-anchor': anchor || null },
      (pre || '') + 'U', s('tspan', { dy: '0.3em' }, sub), s('tspan', { dy: '-0.3em' }, ''));
  }
  // U with a subscript for the {u1}, {u2}, {ua} placeholders of the captions
  function uNode(sub) { return h('span', { translate: 'no' }, 'U', h('sub', null, sub)); }
  // a small arrowhead at (x, y) pointing in direction (dx, dy), for the direction of the current
  function arrow(x, y, dx, dy, size, cls) {
    var px = -dy, py = dx;
    var pts = [[x + dx * size, y + dy * size], [x - dx * size * 0.6 + px * size * 0.75, y - dy * size * 0.6 + py * size * 0.75],
      [x - dx * size * 0.6 - px * size * 0.75, y - dy * size * 0.6 - py * size * 0.75]];
    return s('polygon', { class: cls, points: pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') });
  }
  // a vertical coil from y0 to y1 at x, n turns of half-ellipses bulging rx to the right (dir 1) or left (dir 0)
  function coil(x, y0, y1, n, dir, rx) {
    var d = 'M' + x + ',' + y0, hh = (y1 - y0) / n;
    for (var i = 0; i < n; i++) d += 'a' + rx + ',' + (hh / 2) + ' 0 0 ' + dir + ' 0,' + hh;
    return d;
  }

  var presetKeys = { half1: 'presetHalf1', half2: 'presetHalf2', both: 'presetBoth' };

  // ── the circuit, after figures 959–961: input terminals and primary, the core, the secondary with its centre tap,
  //    D1 on the top end and D2 on the bottom end, both cathodes joined at +, R between + and the centre tap. The CT
  //    line hops over the wire from D2 up to the cathodes, as in the figure (a crossing, not a junction). ──
  function drawCircuit(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), compact = W < 30 * rem;
    var xIn = (compact ? 3.4 : 4.4) * rem, xP = xIn + 1.4 * rem, xS = xP + 2.4 * rem;
    var span = W - (compact ? 2.4 : 3.6) * rem - xS;
    var xD = xS + 0.36 * span, xC = xS + 0.58 * span, xR = xS + 0.8 * span, xO = xS + span;
    var yT = 2.4 * rem, yB = H - 2.8 * rem, yM = (yT + yB) / 2;
    var pq = (yM - yT) * 0.45, yPT = yT + pq, yPB = yB - pq;   // the primary is shorter, centred
    var hop = 0.5 * rem, ds = (compact ? 0.6 : 0.75) * rem;    // the hop's radius, half a diode's height
    var rh = Math.min(3.4 * rem, (yM - yT) * 0.6), rw = 1 * rem; // the resistor's box
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });

    // the CT line from xa to xb (xa < xb), hopping over the vertical wire at xC
    function ctLine(xa, xb) {
      var d = 'M' + xa + ',' + yM;
      if (xa < xC - hop && xb > xC + hop) d += 'H' + (xC - hop) + 'a' + hop + ',' + hop + ' 0 0 1 ' + (2 * hop) + ',0';
      return d + 'H' + xb;
    }
    var cr = 0.7 * rem, secTop = coil(xS, yT, yM, 4, 0, cr), secBot = coil(xS, yM, yB, 4, 0, cr);

    // current paths first, under the wires; each with arrows in the direction of the current
    var as = 0.55 * rem;
    st.paths.forEach(function (d) {
      var one = d === 'D1', cls = 'rc-path rc-path' + (one ? 1 : 2), acls = 'rc-arrow' + (one ? 1 : 2);
      var path = (one ? secTop + 'M' + xS + ',' + yT + 'H' + xR : secBot + 'M' + xS + ',' + yB + 'H' + xC + 'V' + yT + 'H' + xR) +
        'V' + yM + ctLine(xS, xR);
      svg.append(s('path', { class: cls, d: path }));
      if (one) svg.append(arrow((xD + xC) / 2, yT, 1, 0, as, acls));
      else svg.append(arrow((xD + xC) / 2, yB, 1, 0, as, acls), arrow(xC, (yM + yB) / 2 + hop, 0, -1, as, acls));
      svg.append(arrow(xR, yM - 0.6 * rem, 0, 1, as, acls), arrow((xS + xC - hop) / 2, yM, -1, 0, as, acls));
    });

    // wires
    var wires = 'M' + xIn + ',' + yPT + 'H' + xP + coil(xP, yPT, yPB, 5, 1, cr).replace(/^M[^a]*/, '') + 'H' + xIn +
      secTop + secBot.replace(/^M[^a]*/, '') +
      'M' + xS + ',' + yT + 'H' + xO +                      // top end → D1 → cathodes → R → + terminal
      'M' + xS + ',' + yB + 'H' + xC + 'V' + yT +           // bottom end → D2 → up to the cathodes
      ctLine(xS, xO) +                                       // centre tap → R → − terminal
      'M' + xR + ',' + yT + 'V' + yM;                        // R
    svg.append(s('path', { class: 'rc-wire', d: wires }));
    // the core between primary and secondary
    var cx = (xP + xS) / 2;
    svg.append(s('line', { class: 'rc-core', x1: cx - 0.2 * rem, y1: yT - 0.3 * rem, x2: cx - 0.2 * rem, y2: yB + 0.3 * rem }),
      s('line', { class: 'rc-core', x1: cx + 0.2 * rem, y1: yT - 0.3 * rem, x2: cx + 0.2 * rem, y2: yB + 0.3 * rem }));
    // the resistor
    svg.append(s('rect', { class: 'rc-res', x: xR - rw / 2, y: (yT + yM) / 2 - rh / 2, width: rw, height: rh }),
      text(xR - rw / 2 - 0.4 * rem, (yT + yM) / 2 + 0.35 * rem, t('load'), 'rc-name', { 'text-anchor': 'end' }));
    // junctions and terminals
    [[xC, yT], [xR, yT], [xR, yM], [xS, yM]].forEach(function (p) { svg.append(s('circle', { class: 'rc-dot', cx: p[0], cy: p[1], r: 0.22 * rem })); });
    [[xIn, yPT], [xIn, yPB], [xO, yT], [xO, yM]].forEach(function (p) { svg.append(s('circle', { class: 'rc-term', cx: p[0], cy: p[1], r: 0.3 * rem })); });

    // the diodes: anode on the transformer side, cathode towards +; filled while they conduct
    [['D1', yT, st.d1], ['D2', yB, st.d2]].forEach(function (d, i) {
      var y = d[1], on = d[2] === 'conducts' || (d[2] === 'alternate');
      svg.append(s('polygon', { class: 'rc-diode' + (on ? ' rc-on' + (i + 1) : ''), points: [xD - ds, y - ds, xD - ds, y + ds, xD + ds, y].join(',') }),
        s('line', { class: 'rc-wire', x1: xD + ds, y1: y - ds, x2: xD + ds, y2: y + ds }),
        text(xD, y - ds - 0.45 * rem, d[0], 'rc-name', { 'text-anchor': 'middle' }));
      if (d[2] === 'conducts' || d[2] === 'blocks') {
        svg.append(text(xD, y + ds + 1.2 * rem, t(d[2]), d[2] === 'conducts' ? 'rc-t' + (i + 1) : 'rc-ink', { 'text-anchor': 'middle' }));
      }
    });

    // voltages, the centre tap and the output
    svg.append(uText(xIn - 0.5 * rem, yM + 0.35 * rem, 'e', 'rc-name', 'end', '~'),
      uText(xS + 0.6 * rem, (yT + yM) / 2 + 0.35 * rem, '1', 'rc-name', null, '~'),
      uText(xS + 0.6 * rem, (yM + yB) / 2 + 0.35 * rem, '2', 'rc-name', null, '~'),
      text(xS + 0.5 * rem, yM + 1.3 * rem, t('centreTap'), null),
      text(xO + 0.5 * rem, yT + 0.45 * rem, '+', 'rc-sign'),
      text(xO + 0.5 * rem, yM + 0.45 * rem, '−', 'rc-sign'),
      uText(xO + 0.2 * rem, (yT + yM) / 2 + 0.35 * rem, 'a', 'rc-name'));
    // the polarity of the secondary's ends against the centre tap in the step's half-period
    if (st.top) {
      svg.append(text(xS - 0.5 * rem, yT - 0.5 * rem, st.top === '+' ? '+' : '−', 'rc-sign', { 'text-anchor': 'end' }),
        text(xS - 0.5 * rem, yB + 1.4 * rem, st.bottom === '+' ? '+' : '−', 'rc-sign', { 'text-anchor': 'end' }));
    }
    box.replaceChildren(svg);
  }

  // ── U1, U2 and Ua against time, θ from 0 to 2.5π as in the figures; the step's half-periods shaded, and in them
  //    the part of U1 or U2 that the conducting diode passes, and the hump of Ua it gives, in its colour ──
  function drawPlots(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx();
    var l = 3 * rem, r = 1.6 * rem, top = 0.3 * rem, bot = 1.9 * rem, gap = 0.7 * rem;
    var ph = (H - top - bot - 2 * gap) / 3;
    var X = function (th) { return l + th / L.T_MAX * (W - l - r); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var plots = [['1', L.u1, 1], ['2', L.u2, 2], ['a', L.ua, 0]];
    var c = 240;

    // vertical guides at T/2 and T through all three plots, and their ticks below
    [PI, 2 * PI].forEach(function (th, i) {
      svg.append(s('line', { class: 'rc-grid', x1: X(th), y1: top, x2: X(th), y2: H - bot }),
        text(X(th), H - 0.3 * rem, t(i ? 'tickFull' : 'tickHalf'), 'rc-ink', { 'text-anchor': 'middle' }));
    });

    plots.forEach(function (p, i) {
      var y0 = top + i * (ph + gap);
      var Y = function (v) { return y0 + ph / 2 - v * (ph / 2 - 0.2 * rem); };
      var line = function (fn, a, b) {
        var pts = [];
        for (var k = 0; k <= c; k++) { var th = a + (b - a) * k / c; pts.push(X(th).toFixed(1) + ',' + Y(fn(th)).toFixed(1)); }
        return pts.join(' ');
      };
      // the step's windows, shaded, with the passed part of the curve in the diode's colour
      st.windows.forEach(function (w) {
        svg.append(s('rect', { class: 'rc-win' + w.half, x: X(w.from), y: y0, width: X(w.to) - X(w.from), height: ph }));
      });
      svg.append(s('line', { class: 'rc-axis', x1: X(0), y1: Y(0), x2: X(L.T_MAX) + 0.5 * rem, y2: Y(0) }),
        s('line', { class: 'rc-axis', x1: X(0), y1: y0, x2: X(0), y2: y0 + ph }),
        s('polyline', { class: 'rc-curve' + (p[2] ? '' : ' rc-curve-a'), points: line(p[1], 0, L.T_MAX) }),
        uText(X(0) - 0.4 * rem, Y(0) + 0.35 * rem, p[0], 'rc-name', 'end'),
        text(X(L.T_MAX) + 0.7 * rem, Y(0) + 0.35 * rem, t('axisT'), 'rc-ink'));
      st.windows.forEach(function (w) {
        if (p[2] && p[2] !== w.half) return;    // U1 passes in half-period 1, U2 in 2; Ua in both
        svg.append(s('polyline', { class: 'rc-seg' + w.half, points: line(p[1], w.from, w.to) }));
        // on Ua at step 3: which diode gave each hump
        if (!p[2] && st.half === 'both' && w.to - w.from > PI / 2) {
          svg.append(text((X(w.from) + X(w.to)) / 2, Y(0) - 0.3 * rem, w.diode, 'rc-t' + w.half, { 'text-anchor': 'middle' }));
        }
      });
      // over the top plot at steps 1 and 2: the window's name
      if (i === 0 && st.half !== 'both') {
        st.windows.forEach(function (w) {
          // on the side of the zero line that U1 leaves free in this half-period
          svg.append(text((X(w.from) + X(w.to)) / 2, Y(w.half === 1 ? -0.55 : 0.45), t('half' + w.half), 'rc-t' + w.half, { 'text-anchor': 'middle' }));
        });
      }
    });
    box.replaceChildren(svg);
  }

  function readout(st) {
    var row = function (dt, dd, name) { return [h('dt', name ? { translate: 'no' } : null, dt), h('dd', null, dd)]; };
    var d = function (v, alt) { return t(v == null ? 'dNone' : v === 'alternate' ? alt : v === 'conducts' ? 'dConducts' : 'dBlocks'); };
    var half = t(st.half == null ? 'halfNone' : st.half === 'both' ? 'halfBoth' : st.half === 1 ? 'halfOne' : 'halfTwo');
    return h('dl', { class: 'rc-read' }, h('h2', null, t('readTitle')),
      row(t('rowHalf'), half), row(t('rowD1'), d(st.d1, 'd1Alt'), true), row(t('rowD2'), d(st.d2, 'd2Alt'), true),
      row(t('rowLoad'), t(st.load ? 'loadDown' : 'loadNone')));
  }

  sim = Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,
    params: [],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: x.step }; }),
    legend: [
      { c: 1, label: t('legendHalf1') },
      { c: 2, shape: 'hollow', label: t('legendHalf2') }
    ],

    render: function (c) {
      var st = c.state;
      var circ = h('div', { class: 'rc-circ' }), plots = h('div', { class: 'rc-plots' });
      c.stage.replaceChildren(h('div', { class: 'rc' }, circ, plots, readout(st)));
      drawCircuit(circ, st);
      drawPlots(plots, st);
    },

    caption: function (c) { return t.parts('caption' + c.state.n, { u1: uNode('1'), u2: uNode('2'), ua: uNode('a') }); }
  });

  // The drawings are in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
