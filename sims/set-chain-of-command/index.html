<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var C = L.crew;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  /* Where each person sits in the chart (viewBox 1000 × 360, left to right: top, the 1st AD, the heads, their crew).
     The phone layout keeps the same table in a horizontally scrollable box (CSS), so the boxes keep their order. */
  var POS = {
    prod: [95, 120], dir: [95, 240],
    ad1: [290, 180],
    trainee: [490, 30], actor: [490, 90], dop: [490, 150], snd: [490, 270], pmast: [490, 330],
    op: [695, 90], gaf: [695, 150], kg: [695, 210], boom: [695, 270], prop: [695, 330],
    el: [900, 150], gr: [900, 210]
  };
  var W = 1000, H = 360, HALF = [87, 24.5], HALF_AD = [107, 24.5];

  function svg(tag, attrs) {
    var el = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }
  function role(id) { return t('r_' + id); }
  function qIndex(id) { return L.REQUESTS.map(function (r) { return r.id; }).indexOf(id); }
  function qNum(id) { return String(qIndex(id) + 1); }
  function chip(id, kind, text) {
    return h('span', { class: 'cc-q', dataset: { q: String(qIndex(id)), k: kind || '' } }, text || qNum(id));
  }
  function list(nums) {
    if (nums.length < 2) return nums.join('');
    return nums.slice(0, -1).join(', ') + t('and') + nums[nums.length - 1];
  }
  function pct(v, of) { return (100 * v / of) + '%'; }

  /* An arrow from box a to box b, cut at both box edges and shifted to the right of its direction, so two arrows
     between the same pair in opposite directions stay apart. */
  function ends(a, b) {
    var pa = POS[a], pb = POS[b];
    var dx = pb[0] - pa[0], dy = pb[1] - pa[1];
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    function cut(id) {
      var half = id === 'ad1' ? HALF_AD : HALF;
      var sx = ux === 0 ? Infinity : half[0] / Math.abs(ux);
      var sy = uy === 0 ? Infinity : half[1] / Math.abs(uy);
      return Math.min(sx, sy) + 5;
    }
    var off = 7, ox = -uy * off, oy = ux * off;
    var ca = cut(a), cb = cut(b);
    return {
      x1: pa[0] + ux * ca + ox, y1: pa[1] + uy * ca + oy,
      x2: pb[0] - ux * cb + ox, y2: pb[1] - uy * cb + oy, ux: ux, uy: uy
    };
  }

  function arrow(g, badges, a, b, q, how) {
    var e = ends(a, b);
    var tip = 14, wing = 7;
    var bx = e.x2 - e.ux * tip, by = e.y2 - e.uy * tip;
    var line = svg('line', { class: 'cc-arrow', x1: e.x1, y1: e.y1, x2: bx, y2: by, 'data-how': how });
    var head = svg('polygon', {
      class: 'cc-head', 'data-how': how,
      points: [e.x2, e.y2, bx - e.uy * wing, by + e.ux * wing, bx + e.uy * wing, by - e.ux * wing].join(' ')
    });
    if (how !== 'counter') { line.setAttribute('data-q', String(qIndex(q))); head.setAttribute('data-q', String(qIndex(q))); }
    g.append(line, head);
    var mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
    badges.push(h('div', { class: 'cc-badge', dataset: { how: how }, style: { left: pct(mx, W), top: pct(my, H) } },
      how === 'counter' ? h('span', { class: 'cc-q', dataset: { q: String(qIndex(q)) } }, '!') : chip(q)));
  }

  function chart(run, mode) {
    var bg = svg('g', { class: 'cc-bg', 'data-mode': mode });
    var ids = C.PEOPLE.map(function (p) { return p.id; });
    if (mode === 'direct') {
      for (var i = 0; i < ids.length; i++) for (var j = i + 1; j < ids.length; j++) {
        bg.append(svg('line', { x1: POS[ids[i]][0], y1: POS[ids[i]][1], x2: POS[ids[j]][0], y2: POS[ids[j]][1] }));
      }
    } else {
      C.lines().forEach(function (l) {
        bg.append(svg('line', { x1: POS[l[0]][0], y1: POS[l[0]][1], x2: POS[l[1]][0], y2: POS[l[1]][1] }));
      });
    }
    var fg = svg('g', null), badges = [];
    var touched = {};
    run.events.forEach(function (e) {
      if (e.kind === 'hop') { arrow(fg, badges, e.from, e.to, e.req, e.how); touched[e.to] = 1; }
      if (e.kind === 'counter') { arrow(fg, badges, e.from, e.to, e.req, 'counter'); touched[e.to] = 1; }
    });
    var root = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, preserveAspectRatio: 'none', 'aria-hidden': 'true' });
    root.append(bg, fg);

    // chips per person: requests they hold now, and where each one ended
    var chips = {};
    run.reqs.forEach(function (q) {
      var kind = q.status === 'idle' || q.status === 'moving' ? '' : q.status;
      var mark = { done: '✓', unapproved: '!', lost: '✕' }[kind];
      (chips[q.at] = chips[q.at] || []).push(chip(q.id, kind, mark ? qNum(q.id) + mark : null));
    });

    var nodes = C.PEOPLE.map(function (p) {
      var two = run.two.indexOf(p.id) >= 0;
      var dec = two ? t('twoOrders') : (p.decides ? t('d_' + p.decides) : null);
      return h('div', {
        class: 'cc-node' + (touched[p.id] ? ' sd-changed' : ''),
        dataset: { id: p.id, head: p.head ? '1' : '0', two: two ? '1' : '0' },
        style: { left: pct(POS[p.id][0], W), top: pct(POS[p.id][1], H) }
      },
        h('span', { class: 'cc-name' }, role(p.id)),
        dec ? h('span', { class: 'cc-dec' }, dec) : null,
        chips[p.id] ? h('span', { class: 'cc-chips' }, chips[p.id]) : null);
    });
    return h('div', { class: 'cc-chart' }, root, nodes, badges);
  }

  function reqTable(run, mode, changed) {
    if (!run.reqs.length) return h('p', { class: 'cc-empty' }, t('noRequests'));
    var rows = run.reqs.map(function (q) {
      var r = L.spec(q.id);
      var first = mode === 'direct' ? r.near : L.chainRoute(r.from, r, r.approvers).route[1];
      var st = q.status === 'moving' ? t('st_moving', { who: role(q.at) })
        : q.status === 'lost' ? t('st_lost', { who: role(q.at) })
        : t('st_' + q.status);
      var mins = L.answerTime(q);
      return h('tr', null,
        h('td', { class: 'cc-num' }, chip(q.id)),
        h('td', null, h('span', { class: 'cc-rq' }, t('q_' + q.id)), r.safety ? h('span', { class: 'cc-safe' }, t('safetyMark')) : null),
        h('td', null, role(r.from) + ' → ' + role(first)),
        h('td', null, r.approvers.map(function (a) {
          var y = q.yes.indexOf(a) >= 0;
          return h('span', { class: 'cc-yes', dataset: { y: y ? '1' : '0' } }, (y ? '✓ ' : '○ ') + role(a));
        })),
        h('td', { class: 'cc-st' + (changed[q.id] ? ' sd-changed' : ''), dataset: { k: q.status } }, st),
        h('td', { class: 'cc-time' }, mins == null ? t('none') : t('minutes', { n: mins })));
    });
    return h('table', { class: 'cc-tab cc-reqs' },
      h('thead', null, h('tr', null, h('th', null, '#'), h('th', null, t('thReq')), h('th', null, t('thFrom')),
        h('th', null, t('thYes')), h('th', null, t('thState')), h('th', null, t('thTime')))),
      h('tbody', null, rows));
  }

  function fmtMean(v) {
    if (v == null) return t('none');
    var s = (Math.round(v * 10) / 10).toString();
    return t('meanMin', { n: Simdeck.lang === 'hr' ? s.replace('.', ',') : s });
  }

  function score(s, p) {
    var d = L.tally(s.runs.direct), c = L.tally(s.runs.chain);
    var on = function (m) { return p.mode === m ? '1' : '0'; };
    function row(label, a, b, badA, badB) {
      return h('tr', null, h('td', null, label),
        h('td', { dataset: { on: on('direct'), bad: badA ? '1' : '0' } }, a),
        h('td', { dataset: { on: on('chain'), bad: badB ? '1' : '0' } }, b));
    }
    return h('table', { class: 'cc-tab cc-score' },
      h('thead', null, h('tr', null, h('th', null, t('thWay')),
        h('th', { dataset: { on: on('direct') } }, t('wayDirect')), h('th', { dataset: { on: on('chain') } }, t('wayChain')))),
      h('tbody', null,
        row(t('sc_done'), t('outOf', { a: d.done, b: d.total }), t('outOf', { a: c.done, b: c.total })),
        row(t('sc_unapproved'), String(d.unapproved), String(c.unapproved), d.unapproved > 0, c.unapproved > 0),
        row(t('sc_lost'), String(d.lost), String(c.lost), d.lost > 0, c.lost > 0),
        row(t('sc_two'), String(d.two), String(c.two), d.two > 0, c.two > 0),
        row(t('sc_mean'), fmtMean(d.mean), fmtMean(c.mean)),
        row(t('sc_links', { n: p.crew }), String(C.linksAll(p.crew)), String(C.linksChain(p.crew)))));
  }

  function caption(c) {
    var p = c.params, run = c.state.runs[p.mode];
    var k = run.reqs.length;
    if (!k) return t('capNone');
    if (c.first) return t.n(p.mode === 'direct' ? 'capStartDirect' : 'capStartChain', k);
    var ev = run.events, out = [];
    var by = function (kind) { return ev.filter(function (e) { return e.kind === kind; }); };
    by('counter').forEach(function (e) { out.push(t('capCounter', { head: role(e.from), who: role(e.to) })); });
    var lost = by('lost');
    if (lost.length) out.push(t.n('capLost', lost.length, { list: list(lost.map(function (e) { return qNum(e.req); })) }));
    by('unapproved').forEach(function (e) { out.push(t('capUnapproved', { who: role(e.at), num: qNum(e.req) })); });
    by('hop').forEach(function (e) { if (e.how === 'call') out.push(t('capCall', { num: qNum(e.req), from: role(e.from), to: role(e.to) })); });
    by('wait').forEach(function (e) { out.push(t('capWait', { who: role(e.at), num: qNum(e.req), behind: qNum(e.behind) })); });
    var done = by('done');
    if (done.length) out.push(t.n('capDone', done.length, { list: list(done.map(function (e) { return qNum(e.req); })) }));
    if (out.length < 2) {
      by('yes').forEach(function (e) {
        var isCall = ev.some(function (x) { return x.kind === 'hop' && x.req === e.req && x.how === 'call'; });
        var isDone = done.some(function (x) { return x.req === e.req; });
        if (!isCall && !isDone) out.push(t('capYes', { who: role(e.at), num: qNum(e.req) }));
      });
    }
    if (!out.length) {
      var hops = by('hop');
      if (hops.length) hops.forEach(function (e) { out.push(t('capHop', { num: qNum(e.req), from: role(e.from), to: role(e.to) })); });
      else {
        var open = run.reqs.some(function (q) { return q.status === 'idle' || q.status === 'moving'; });
        var tl = L.tally(run);
        if (!open) out.push(t(tl.lost > 0 ? 'capQuietDirect' : tl.done === k ? 'capQuietChain' : 'capQuietNone'));
      }
    }
    var text = t('capMinute', { m: c.n }) + ' ' + out.slice(0, 3).join(' ');
    if (c.last) text += ' ' + t(p.mode === 'direct' ? 'capEndDirect' : 'capEndChain');
    return text;
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'mode', type: 'choice', label: t('mode'), options: [['direct', t('modeDirect')], ['chain', t('modeChain')]] },
      { key: 'lamp', type: 'toggle', label: '1 · ' + t('q_lamp') },
      { key: 'overtime', type: 'toggle', label: '2 · ' + t('q_overtime') },
      { key: 'actor', type: 'toggle', label: '3 · ' + t('q_actor') },
      { key: 'exit', type: 'toggle', label: '4 · ' + t('q_exit') },
      { key: 'prop', type: 'toggle', label: '5 · ' + t('q_prop') },
      { key: 'crew', type: 'range', label: t('crewSize'), min: 10, max: 60, step: 1, hint: t('crewHint') }
    ],

    presets: [
      { id: 'direct', label: t('presetDirect'), params: { mode: 'direct' }, hint: t('presetDirectHint') },
      { id: 'chain', label: t('presetChain'), params: { mode: 'chain' }, hint: t('presetChainHint') },
      { id: 'exit', label: t('presetExit'), params: { mode: 'chain', lamp: false, overtime: false, actor: false, prop: false }, hint: t('presetExitHint') },
      { id: 'overtime', label: t('presetOvertime'), params: { mode: 'chain', lamp: false, actor: false, exit: false, prop: false }, hint: t('presetOvertimeHint') }
    ],

    keys: [{ key: 'm', label: t('modeKey'), run: function (sim) { sim.set({ mode: sim.params.mode === 'direct' ? 'chain' : 'direct' }); } }],

    legend: [
      { shape: 'line', label: t('legendLine') },
      { shape: 'dash', label: t('legendCall') },
      { shape: 'cc-lost', label: t('legendLost') },
      { shape: 'cc-two', label: t('legendTwo') }
    ],

    render: function (c) {
      var p = c.params, s = c.state, run = s.runs[p.mode];
      var changed = {};
      if (!c.first) run.events.forEach(function (e) { if (e.kind !== 'wait') changed[e.req] = 1; });
      c.stage.replaceChildren(h('div', { class: 'cc' },
        h('div', { class: 'cc-top' }, chart(run, p.mode)),
        h('div', { class: 'cc-bottom' }, reqTable(run, p.mode, changed), score(s, p)),
        h('p', { class: 'cc-foot' }, t('foot'))));
    },

    caption: caption
  });
})();
</script>
</body>
</html>
