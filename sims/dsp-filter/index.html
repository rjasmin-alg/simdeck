<body>
<div class="sd-page">
  <header class="sd-header">
    <a class="sd-back" data-sd-back href="../../index.html">Popis</a>
    <div class="sd-titles">

      <div data-sd-presets></div>

        <summary></summary>

<script src="strings.js"></script>
<script src="sim.js"></script>
<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';
  var sim = null;

  // Frequencies in the page's language (decimal comma in Croatian). Model frequencies are whole hertz.
  function dec(s) { return s.replace('.', t('dec')); }
  function knum(hz) { return dec((hz / 1000).toFixed(1)); }               // 9001500 → 9001,5
  function khz(hz) { return t('khz', { v: knum(hz) }); }
  function af(hz) { return hz < 1000 ? t('hz', { v: String(hz) }) : t('khz', { v: dec(String(hz / 1000)) }); }
  function range(b) { return t('range', { a: knum(b[0]), b: khz(b[1]) }); }
  function s(tag, attrs) {
    var e = document.createElementNS(SVG, tag);
    Object.keys(attrs || {}).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) e.append(arguments[i]);
    return e;
  }
  function remPx() { return parseFloat(getComputedStyle(document.documentElement).fontSize); }
  function pts(list) { return list.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '); }
  function fOsc() { return h('span', null, h('i', null, 'f'), h('sub', null, t('sigOsc'))); }

  var presetKeys = { lsb: 'presetLsb', usb: 'presetUsb', lsbEdge: 'presetLsbEdge', usbLow: 'presetUsbLow' };

  // ── the block diagram ──
  function diagram(st) {
    function block(name, v, cls) { return h('div', { class: 'df-block' + (cls ? ' ' + cls : '') }, name, v ? h('span', { class: 'df-v', translate: 'no' }, v) : null); }
    function arrow() {
      var kids = Array.prototype.slice.call(arguments);
      return h('div', { class: 'df-arrow' }, kids, h('span', { class: 'df-glyph', 'aria-hidden': 'true' }, '→'));
    }
    function band(which) {
      var cls = st.kept === which ? 'df-kept' : 'df-gone';
      return h('span', { class: cls }, t(which === 'lower' ? 'dsbLower' : 'dsbUpper'), ' ', h('span', { translate: 'no' }, range(st[which])));
    }
    var chip = function (sb) {
      return h('div', { class: 'df-chip' + (st.sb === sb ? ' df-on' : '') },
        h('span', { translate: 'no' }, t(sb === 'lsb' ? 'sbLsb' : 'sbUsb')), h('br'), h('span', { translate: 'no' }, khz(L.XTAL[sb])));
    };
    return h('div', { class: 'df-diag' },
      block(t('blockMic')),
      arrow(),
      block(t('blockAmp')),
      arrow(h('span', { class: 'df-sig' }, t('sigAf')), h('span', { translate: 'no' }, t('range', { a: String(L.AF_LO), b: af(L.AF_HI) }))),
      block(t('blockMix')),
      arrow(h('span', { class: 'df-sig' }, t('sigDsb')), band('lower'), band('upper')),
      block(t('blockFilter'), t('range', { a: knum(st.filter[0]), b: khz(st.filter[1]) }), 'df-filter'),
      arrow(h('span', { class: 'df-sig' }, t('sigSsb')), st.out ? h('span', { class: 'df-kept', translate: 'no' }, range(st.out)) : null),
      block(t('blockOut')),
      h('div', { class: 'df-oscrow' },
        h('div', { class: 'df-up' }, h('span', { class: 'df-glyph', 'aria-hidden': 'true' }, '↑'), fOsc(), h('span', { translate: 'no' }, ' = ', khz(st.fo))),
        block(t('blockOsc')),
        h('div', { class: 'df-xtal' }, chip('lsb'), chip('usb')))
    );
  }

  // An axis line with an arrow head at (x1, y1).
  function axis(svg, x0, y0, x1, y1, d) {
    var len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    svg.append(s('line', { class: 'df-axis', x1: x0, y1: y0, x2: x1 - ux * d, y2: y1 - uy * d }));
    svg.append(s('path', { class: 'df-axhead', d: 'M' + x1 + ',' + y1 + 'L' + (x1 - ux * d - uy * d * 0.45) + ',' + (y1 - uy * d + ux * d * 0.45) +
      'L' + (x1 - ux * d + uy * d * 0.45) + ',' + (y1 - uy * d - ux * d * 0.45) + 'Z' }));
  }
  function text(svg, x, y, str, cls, attrs) {
    // text on a filled band (df-in) needs no halo
    var c = cls === 'df-in' ? cls : 'df-halo' + (cls ? ' ' + cls : '');
    svg.append(s('text', Object.assign({ class: c, x: x, y: y, translate: 'no' }, attrs || {}), str));
  }
  function tone(svg, x, y0, y1, on, rem) {
    svg.append(s('line', { class: 'df-stem' + (on ? '' : ' df-off'), x1: x, x2: x, y1: y0, y2: y1 }));
    svg.append(s('circle', { class: 'df-head' + (on ? '' : ' df-off'), cx: x, cy: y1, r: 0.4 * rem }));
  }

  // ── the speech spectrum: power over f, 0 … 3.5 kHz ──
  function drawAf(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 1.8 * rem, right = 1.4 * rem, top = 1.4 * rem, bottom = 1.8 * rem;
    var X = function (f) { return left + f / 3500 * (W - left - right); };
    var Y = function (p) { return H - bottom - p / 1.3 * (H - top - bottom); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var poly = [[X(L.AF_LO), Y(0)], [X(L.AF_LO), Y(L.P_LO)], [X(L.AF_HI), Y(L.P_HI)], [X(L.AF_HI), Y(0)]];
    svg.append(s('polygon', { class: 'df-band', points: pts(poly) }));
    axis(svg, left, Y(0), W - right + 0.6 * rem, Y(0), 0.6 * rem);
    axis(svg, left, Y(0), left, top - 0.4 * rem, 0.6 * rem);
    svg.append(s('text', { class: 'df-halo', x: left - 0.4 * rem, y: top - 0.2 * rem, transform: 'rotate(-90 ' + (left - 0.4 * rem) + ' ' + (top - 0.2 * rem) + ')', 'text-anchor': 'end' }, t('axisPower')));
    text(svg, W - right + 0.6 * rem, Y(0) - 0.5 * rem, t('axisF'), null, { 'text-anchor': 'end' });
    text(svg, X(L.AF_LO), Y(0) + 1.2 * rem, af(L.AF_LO), null, { 'text-anchor': 'middle' });
    text(svg, X(L.AF_HI), Y(0) + 1.2 * rem, af(L.AF_HI), null, { 'text-anchor': 'middle' });
    var x = X(st.tone), y = Y(st.tonePower + 0.12);
    tone(svg, x, Y(0), y, true, rem);
    text(svg, x, y - 0.6 * rem, af(st.tone), 'df-c3', { 'text-anchor': x > W - 3 * rem ? 'end' : 'middle' });
    box.replaceChildren(svg);
  }

  // ── after the mixer: both sidebands, the carrier's place, the filter's passband and the tone's two images ──
  var F0 = 8994500, F1 = 9005500;
  function drawRf(box, st) {
    var W = box.clientWidth, H = box.clientHeight;
    if (!W || !H) return;
    var rem = remPx(), left = 1 * rem, right = 1.6 * rem, top = 2.6 * rem, bottom = 1.8 * rem;
    var X = function (f) { return left + (f - F0) / (F1 - F0) * (W - left - right); };
    var Y = function (p) { return H - bottom - p / 1.3 * (H - top - bottom); };
    var svg = s('svg', { width: W, height: H, 'aria-hidden': 'true' });
    var wide = W >= 30 * rem;   // the phone gets the shapes without the small labels that would overlap
    // the passband
    svg.append(s('rect', { class: 'df-pass', x: X(st.filter[0]), y: Y(1.25), width: X(st.filter[1]) - X(st.filter[0]), height: Y(0) - Y(1.25) }));
    text(svg, (X(st.filter[0]) + X(st.filter[1])) / 2, Y(1.25) - 0.4 * rem, t('tagFilter'), 'df-c2', { 'text-anchor': 'middle' });
    // the sidebands: the lower one mirrored (300 Hz next to the carrier)
    ['lower', 'upper'].forEach(function (which) {
      var sg = which === 'lower' ? -1 : 1, on = st.kept === which;
      var near = X(st.fo + sg * L.AF_LO), far = X(st.fo + sg * L.AF_HI);
      var poly = [[near, Y(0)], [near, Y(L.P_LO)], [far, Y(L.P_HI)], [far, Y(0)]];
      svg.append(s('polygon', { class: 'df-band' + (on ? '' : ' df-off'), points: pts(poly) }));
      text(svg, (near + far) / 2, Y(0.22), t(which === 'lower' ? 'tagLower' : 'tagUpper'), on ? 'df-in' : 'df-ink', { 'text-anchor': 'middle' });
      if (on && wide) {
        // the AF ends at the band's corners: shows which way round the speech came out
        // inside the band, under its top edge, so they stay clear of the tone's head and the filter's edges
        var inward = sg < 0 ? -1 : 1;
        if (Math.abs(st.tone - L.AF_LO) > 1000) text(svg, near + inward * 0.35 * rem, Y(L.P_LO) + 1.3 * rem, af(L.AF_LO), 'df-in', { 'text-anchor': inward > 0 ? 'start' : 'end' });
        if (Math.abs(st.tone - L.AF_HI) > 1000) text(svg, far - inward * 0.35 * rem, Y(L.P_HI) + 1.3 * rem, af(L.AF_HI), 'df-in', { 'text-anchor': inward > 0 ? 'end' : 'start' });
      }
    });
    // the carrier's place, on the filter's edge
    var xc = X(st.fo), outward = wide ? (st.fo >= st.filter[1] ? 1 : -1) : (xc < W / 2 ? 1 : -1);
    svg.append(s('line', { class: 'df-carrier', x1: xc, x2: xc, y1: Y(0), y2: top - 1.6 * rem }));
    text(svg, xc + outward * 0.4 * rem, top - 1.2 * rem, t('tagCarrier'), null, { 'text-anchor': outward > 0 ? 'start' : 'end' });
    // the gap between the passband and the suppressed sideband
    if (st.gone && st.gap > 0) {
      var g = st[st.gone], ga = st.gone === 'upper' ? st.filter[1] : g[1], gb = st.gone === 'upper' ? g[0] : st.filter[0];
      var yg = Y(0.5), xa = X(ga), xb = X(gb);
      svg.append(s('line', { class: 'df-gap', x1: xa, x2: xb, y1: yg, y2: yg }));
      [xa, xb].forEach(function (x) { svg.append(s('line', { class: 'df-gap', x1: x, x2: x, y1: yg - 0.35 * rem, y2: yg + 0.35 * rem })); });
      if (wide) text(svg, st.gone === 'upper' ? xb + 0.3 * rem : xa - 0.3 * rem, yg + 0.35 * rem, af(st.gap), 'df-ink', { 'text-anchor': st.gone === 'upper' ? 'start' : 'end' });
    }
    // the tone's two images
    [['lower', st.toneLower], ['upper', st.toneUpper]].forEach(function (p) {
      var on = st.toneOut === p[1], x = X(p[1]);
      tone(svg, x, Y(0), Y(L.power(st.tone) + 0.12), on, rem);
    });
    // the frequency axis, a tick every 1 or 2 kHz, the numbers in kHz
    axis(svg, left, Y(0), W - right + 0.6 * rem, Y(0), 0.6 * rem);
    var every = (X(9001000) - X(9000000)) >= 3.4 * rem ? 1000 : 2000;
    for (var f = 8995000; f <= 9005000; f += 1000) {
      if ((f / 1000) % (every / 1000) !== 0) continue;
      svg.append(s('line', { class: 'df-tick', x1: X(f), x2: X(f), y1: Y(0), y2: Y(0) + 0.35 * rem }));
      text(svg, X(f), Y(0) + 1.3 * rem, String(f / 1000), null, { 'text-anchor': 'middle' });
    }
    // on the phone the suppressed band reaches the axis end, so the unit goes to the top corner
    text(svg, W - right + 0.6 * rem, wide ? Y(0) - 0.5 * rem : top - 2 * rem, t('axisKhz'), null, { 'text-anchor': 'end' });
    box.replaceChildren(svg);
  }

  sim = Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,
    params: [
      { key: 'sb', type: 'choice', label: t('sb'), hint: t('sbHint'), options: [['lsb', t('sbLsb')], ['usb', t('sbUsb')]] },
      { key: 'tone', type: 'range', label: t('tone'), hint: t('toneHint'), min: L.TONE_MIN, max: L.TONE_MAX, step: L.TONE_STEP, format: function (v) { return af(L.snapTone(v)); } }
    ],
    presets: L.presets.map(function (x) { return { id: x.id, label: t(presetKeys[x.id]), hint: t(presetKeys[x.id] + 'Hint'), params: x.params, step: 0 }; }),
    legend: [
      { c: 1, label: t('legendKept') },
      { shape: 'hollow', label: t('legendGone') },
      { c: 2, shape: 'hollow', label: t('legendFilter') },
      { c: 3, shape: 'round', label: t('legendTone') }
    ],

    render: function (c) {
      var st = c.state;
      var af1 = h('div', { class: 'df-plot' }), rf = h('div', { class: 'df-plot' });
      c.stage.replaceChildren(h('div', { class: 'df' },
        diagram(st),
        h('div', { class: 'df-plots' },
          h('div', { class: 'df-fig' }, h('h2', null, t('plotAf')), af1),
          h('div', { class: 'df-fig' }, h('h2', null, t('plotRf')), rf))));
      drawAf(af1, st);
      drawRf(rf, st);
    },

    caption: function (c) {
      var st = c.state;
      var b = function (x) { return h('b', { translate: 'no' }, x); };
      var out = [t.parts(st.sb === 'usb' ? 'captionUsb' : 'captionLsb', {
        fo: b(khz(st.fo)), lo: b(range(st.lower)), hi: b(range(st.upper)),
        f0: b(knum(st.filter[0])), f1: b(khz(st.filter[1])), gap: b(af(st.gap))
      })];
      if (st.toneOut != null) out.push(t.parts('captionTone', { tone: b(af(st.tone)), out: b(khz(st.toneOut)) }));
      out.push(t(st.mirrored ? 'captionMirror' : 'captionKeep'));
      if (st.toneEdge) out.push(t('captionEdge'));
      return out;
    }
  });

  // The plots are drawn in pixels (text at 1:1), so they are redrawn when the stage changes size.
  if (typeof ResizeObserver === 'function') {
    var last = '';
    new ResizeObserver(function (es) {
      var rc = es[0].contentRect, key = Math.round(rc.width) + 'x' + Math.round(rc.height);
      if (key !== last) { last = key; sim.render(); }
    }).observe(document.querySelector('[data-sd-stage]'));
  }
})();
</script>
</body>
</html>
