<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var SVG = 'http://www.w3.org/2000/svg';

  var PRESET_KEY = { 'byod-term': 'presetByod', 'short-lease': 'presetShort', 'hidden-hotspot': 'presetHotspot', 'server-vlan-under': 'presetServers', 'threshold-70': 'presetT70' };
  var SHAPE = { under: '▽', optimal: '○', over: '△' };
  var LEG = { under: 'legUnder', optimal: 'legOptimal', over: 'legOver' };

  // ── words and data ──
  /** Data (addresses, server names, counts, percentages) is not language: the word check skips translate="no". */
  function data(text, cls) { return h('span', { translate: 'no', class: cls || null }, String(text)); }
  function B(node) { return h('b', null, node); }
  /** 65 536, 5 865: a space between thousands (four-digit numbers too, so 5 865 and 65 536 read alike side by side). */
  function grouped(n) { return n >= 1000 ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : String(n); }
  /** A percentage to one decimal, ",0"/".0" dropped, the decimal sign of the page language: 27,5 % / 27.5 %. */
  function pctText(u) {
    var r = Math.round(u * 10) / 10;
    var s = r % 1 === 0 ? String(r) : r.toFixed(1);
    return (Simdeck.lang === 'hr' ? s.replace('.', ',') : s) + ' %';
  }
  function pct(u) { return data(pctText(u)); }
  function thr(v) { return data(v + ' %'); }
  /** Parts with *English term* turned into <em lang="en"> (the Croatian term rule); repeated nodes are cloned. */
  function rich(key, vars) {
    var out = [], seen = [];
    t.parts(key, vars).forEach(function (p) {
      var s = typeof p === 'string' ? p : p.nodeType === 3 ? p.textContent : null;
      if (s === null) { out.push(seen.indexOf(p) >= 0 ? p.cloneNode(true) : p); seen.push(p); return; }
      s.split(/\*([^*]+)\*/).forEach(function (bit, i) {
        if (!bit) return;
        out.push(i % 2 ? h('em', { lang: 'en' }, bit) : bit);
      });
    });
    return out;
  }
  /** A count for t.parts plural forms: the kit picks the form from Number(n) and writes String(n). */
  function count(n) { return { valueOf: function () { return n; }, toString: function () { return String(n); } }; }
  function rangeById(s, id) { for (var i = 0; i < s.ranges.length; i++) if (s.ranges[i].id === id) return s.ranges[i]; return null; }
  function selOf(s, p) { return p.sel === 'block' || rangeById(s, p.sel) ? p.sel : 'students'; }
  function leaseText(r) { return t(r.lease === 1 ? 'lease1' : 'lease8'); }
  function stClass(r) { return r.full ? 'iu-full' : 'iu-' + r.status; }

  // ── "status changed by the last param": page memory, not model state ──
  var memo = null;
  function changedSet(c) {
    var p = Object.assign({}, c.params); delete p.sel;
    var key = JSON.stringify(p);
    if (memo && memo.key === key) return memo.changed;
    var now = { block: c.state.block.status };
    c.state.ranges.forEach(function (r) { now[r.id] = r.status + (r.full ? '+full' : ''); });
    var changed = {};
    if (memo) Object.keys(now).forEach(function (id) { if (memo.st[id] !== now[id]) changed[id] = true; });
    memo = { key: key, st: now, changed: changed };
    return changed;
  }

  // ── pieces ──
  function bar(util, status, th, big, full) {
    return h('div', { class: 'iu-bar iu-' + status + (big ? ' iu-big' : '') + (full ? ' iu-full' : ''), 'aria-hidden': 'true' },
      h('span', { class: 'iu-fill', style: { width: Math.min(100, util).toFixed(3) + '%' } }),
      h('span', { class: 'iu-tick iu-tunder', style: { left: th.under + '%' } }),
      h('span', { class: 'iu-tick', style: { left: th.over + '%' } }));
  }
  function chip(status, changed) {
    return h('span', { class: 'iu-chip iu-' + status + (changed ? ' sd-changed' : '') }, h('b', { 'aria-hidden': 'true' }, SHAPE[status]), t('st_' + status));
  }
  function fullChip(r) {
    return h('span', { class: 'iu-chip iu-fullchip' }, h('b', { 'aria-hidden': 'true' }, '✕'), t('full'),
      r.refused ? [' · ', data(r.refused), ' ', t('refused')] : null);
  }

  /** A trend chart: the weeks so far as a solid line, the rest of the term dotted (big chart only), thresholds as
      dashed lines. Lines are SVG (no text in it); labels are HTML, so they never scale. */
  function chart(trend, week, th, big) {
    var N = trend.length - 1;
    function X(k) { return 100 * k / N; }
    function Y(u) { return 100 - Math.min(100, u); }
    function pts(from, to) { var a = []; for (var k = from; k <= to; k++) a.push(X(k).toFixed(2) + ',' + Y(trend[k]).toFixed(2)); return a.join(' '); }
    var svg = document.createElementNS(SVG, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    function line(cls, p) {
      var l = document.createElementNS(SVG, 'polyline');
      l.setAttribute('class', cls); l.setAttribute('points', p); l.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(l);
    }
    if (big && week < N) line('iu-future', pts(week, N));
    if (week > 0) line('iu-past', pts(0, week));
    var box = h('div', { class: 'iu-chart ' + (big ? 'iu-plot' : 'iu-spark') },
      h('span', { class: 'iu-overzone', style: { height: (100 - th.over) + '%' } }),
      h('span', { class: 'iu-hline', style: { top: (100 - th.over) + '%' } }),
      h('span', { class: 'iu-hline iu-tunder', style: { top: (100 - th.under) + '%' } }),
      svg,
      h('span', { class: 'iu-dot', style: { left: X(week) + '%', top: Y(trend[week]) + '%' } }));
    return { el: box, X: X, Y: Y };
  }

  // ── the block card ──
  function blockCard(s, sel, changed) {
    var b = s.block;
    return h('div', { class: 'iu-block' },
      h('button', { type: 'button', class: 'iu-name' + (changed.block ? ' sd-changed' : ''), 'aria-pressed': sel === 'block' ? 'true' : 'false', dataset: { sel: 'block' } },
        data(b.name), h('span', { class: 'iu-note' }, t('blockKind'))),
      bar(b.util, b.status, s.thresholds, true),
      h('span', { class: 'iu-bnums' }, B(pct(b.util)), ' · ', data(grouped(b.used)), ' ', t('blockOf'), ' ', data(grouped(b.size)), ' ', t('blockAddr')),
      chip(b.status, changed.block),
      h('div', { class: 'iu-bline iu-note' },
        h('span', null, rich('failoverOnce'), ' ', data(grouped(b.naiveUsed)), '.'),
        h('span', null, t('collected', { w: s.collected.week, h: (s.collected.hour < 10 ? '0' : '') + s.collected.hour + ':00', i: s.collected.interval }))));
  }

  // ── the range table ──
  function table(s, sel, changed) {
    var rows = s.ranges.map(function (r) {
      var on = sel === r.id;
      var srv = r.servers.map(function (x) { return data(x); });
      return h('tr', { class: on ? 'iu-sel' : null },
        h('td', null,
          h('button', { type: 'button', class: 'iu-name' + (changed[r.id] ? ' sd-changed' : ''), 'aria-pressed': on ? 'true' : 'false', dataset: { sel: r.id } }, t('n_' + r.id)),
          h('span', { class: 'iu-addr', translate: 'no' }, r.start + ' – ' + r.end)),
        h('td', { class: 'iu-srv' }, srv.length > 1 ? [srv[0], ' + ', srv[1], h('small', null, rich('failover'))] : srv),
        h('td', { class: 'iu-num' }, data(grouped(r.size))),
        h('td', { class: 'iu-num' }, data(grouped(r.used))),
        h('td', { class: 'iu-utiltd' }, h('div', { class: 'iu-utilcell ' + stClass(r) }, bar(r.util, r.status, s.thresholds, false, r.full), h('span', { class: 'iu-pct' }, pct(r.util)))),
        h('td', null, h('div', { class: 'iu-stcell' }, chip(r.status, changed[r.id]), r.full ? fullChip(r) : null)),
        h('td', null, chart(r.trend, s.week, s.thresholds, false).el));
    });
    return h('table', null,
      h('caption', null, t('ipamTitle')),
      h('thead', null, h('tr', null,
        h('th', null, t('thRange')), h('th', null, t('thServer')), h('th', { class: 'iu-num' }, t('thSize')), h('th', { class: 'iu-num' }, t('thUsed')),
        h('th', null, t('thUtil')), h('th', null, t('thStatus')), h('th', null, t('thTrend'), ' ', data('0–' + s.week)))),
      h('tbody', null, rows));
  }

  // ── the detail: composition and the big trend ──
  function composition(s, sel) {
    var parts, total, refused = 0, title;
    if (sel === 'block') {
      var b = s.block;
      title = data(b.name);
      total = b.size;
      parts = [
        { n: b.used, cls: 'sd-fill', c: 1, key: 'c_ranges' },
        { n: b.inRanges - b.used, cls: 'iu-rfree', key: 'c_rfree' },
        { n: b.size - b.inRanges, cls: 'iu-free', key: 'c_outside' }
      ];
    } else {
      var r = rangeById(s, sel);
      title = t('n_' + r.id);
      total = r.size;
      refused = r.refused;
      parts = r.live ? [
        { n: r.residents, cls: 'sd-fill', c: 1, key: 'c_residents' },
        { n: r.gone, cls: 'iu-gone', key: 'c_gone', hl: r.gone > 0 },
        { n: r.today, cls: 'iu-dots', key: 'c_today' }
      ] : [{ n: r.residents, cls: 'sd-fill', c: 1, key: 'c_inuse' }];
      if (r.reserved) parts.push({ n: r.reserved, cls: 'sd-fill', c: 4, key: 'c_reserved' });
      parts.push({ n: r.free, cls: 'iu-free', key: 'c_free' });
    }
    var shown = parts.filter(function (x) { return x.n > 0 || x.key === 'c_free'; });
    var stack = h('div', { class: 'iu-stack', 'aria-hidden': 'true' },
      shown.filter(function (x) { return x.n > 0; }).map(function (x) {
        return h('span', { class: 'iu-part ' + x.cls, dataset: x.c ? { c: String(x.c) } : null, style: { width: (100 * x.n / total).toFixed(3) + '%' } });
      }),
      refused ? h('span', { class: 'iu-refused' }, '✕ ', data(refused)) : null);
    var keys = shown.map(function (x) {
      return h('li', { class: x.hl ? 'iu-hl' : null },
        h('span', { class: 'iu-key ' + x.cls, dataset: x.c ? { c: String(x.c) } : null }),
        h('span', { class: 'iu-n' }, data(grouped(x.n))), h('span', { class: 'iu-lab' }, t(x.key)));
    });
    if (refused) keys.push(h('li', null, h('span', { class: 'iu-key iu-x' }, '✕'), h('span', { class: 'iu-n' }, data(refused)), h('span', { class: 'iu-lab' }, t('c_refused'))));
    return h('div', { class: 'iu-comp' },
      h('h3', null, title, ' · ', data(grouped(total))),
      h('span', { class: 'iu-note' }, t('detUsed')),
      h('div', { class: 'iu-stackwrap' }, stack),
      h('ul', { class: 'iu-keys' }, keys));
  }

  function bigTrend(s, sel) {
    var obj = sel === 'block' ? s.block : rangeById(s, sel);
    var th = s.thresholds;
    var c = chart(obj.trend, s.week, th, true);
    var el = c.el;
    [0, th.under, th.over, 100].forEach(function (u) {
      el.append(h('span', { class: 'iu-ylab', style: { top: c.Y(u) + '%' } }, data(u + ' %')));
    });
    el.append(h('span', { class: 'iu-rlab iu-over', style: { top: c.Y(th.over) + '%' } }, '△ ', thr(th.over)));
    el.append(h('span', { class: 'iu-rlab iu-under', style: { top: c.Y(th.under) + '%' } }, '▽ ', thr(th.under)));
    [0, 4, 8, 12, 16].forEach(function (k) {
      if (k !== s.week) el.append(h('span', { class: 'iu-xlab', style: { left: c.X(k) + '%' } }, data(k)));
    });
    el.append(h('span', { class: 'iu-xlab iu-now', style: { left: c.X(s.week) + '%' } }, data(s.week)));
    el.append(h('span', { class: 'iu-xname' }, t('weekAxis')));
    function mark(k, cls, sym) {
      if (k === null || k === undefined) return;
      el.append(h('span', { class: 'iu-mark ' + cls + (k > s.week ? ' iu-later' : ''), style: { left: c.X(k) + '%', top: c.Y(obj.trend[k]) + '%' } }, sym, ' ', data(k)));
    }
    var ff = obj.firstFull;
    if (ff !== undefined && ff !== null && ff === obj.firstOver) mark(ff, 'iu-full', '△✕');
    else { mark(obj.firstOver, 'iu-over', '△'); mark(ff, 'iu-full', '✕'); }
    return h('div', { class: 'iu-big' },
      h('h3', null, t('trendTitle')),
      el,
      s.week < s.weeks ? h('span', { class: 'iu-proj' }, t('projection')) : null);
  }

  // ── stage clicks: select the block or a range ──
  function wire(stage) {
    if (stage.dataset.wired) return;
    stage.dataset.wired = '1';
    stage.addEventListener('mousedown', function (e) { if (e.target.closest('button')) e.preventDefault(); });
    stage.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-sel]');
      if (b && window.simdeck) window.simdeck.set({ sel: b.dataset.sel });
    });
  }

  // ── captions ──
  function studentsCaption(s, r) {
    // every placeholder gets a fresh node: a node put into two sentences would move out of the first one
    function over() { return thr(s.thresholds.over); }
    function under() { return thr(s.thresholds.under); }
    var w = data(s.week), fo = r.firstOver, ff = r.firstFull;
    var gone = r.gone ? [' '].concat(t.parts('capGone', { n: data(r.gone) })) : [];
    function aheadKey() { return ff === null ? 'capAheadNoFull' : ff === fo ? 'capAheadSame' : 'capAhead'; }
    if (r.full) {
      // a full range is always over (100 % > any threshold), so firstOver ≤ firstFull ≤ week
      var out = fo === 0 ? rich('capStartFull', { w: w })
        : fo === s.week ? rich('capCrossFull', { w: w, over: over() })
        : fo === ff ? rich('capFullSame', { w: w, size: data(r.size) })
        : rich('capFull', { w: w, size: data(r.size), fo: data(fo) });
      if (r.refused) out = out.concat([' '], t.parts('capRefused', { n: data(r.refused) }));
      return out.concat(gone);
    }
    if (r.status === 'over') {
      var v = { w: w, used: data(r.used), size: data(r.size), pct: pct(r.util), over: over(), fo: data(fo), ff: data(ff) };
      // over from week 0: nothing crossed, the term started above the threshold
      if (fo === 0) return t.parts(ff === null ? 'capStartOverNoFull' : 'capStartOver', v).concat(gone);
      if (fo === s.week) {
        return (ff === null ? rich('capCrossNoFull', { w: w, over: over() }) : rich('capCross', { w: w, over: over(), n: count(ff - fo) })).concat(gone);
      }
      return t.parts(ff === null ? 'capOverSinceNoFull' : 'capOverSince', v).concat(gone);
    }
    var head = r.visitors
      ? t.parts('capWeek', { w: w, used: data(r.used), size: data(r.size), pct: pct(r.util), res: data(r.residents), vis: data(r.visitorLeases), v: data(r.visitors), l: leaseText(r) })
      : t.parts('capWeekNoVis', { w: w, used: data(r.used), size: data(r.size), pct: pct(r.util), res: data(r.residents) });
    var tail = [];
    function add(parts) { tail = tail.concat([' '], parts); }
    if (r.status === 'under') add(t.parts('capUnderSt', { under: under() }));
    else if (r.used * 100 === s.thresholds.under * r.size) add(t.parts('capTieUnder', { under: under() }));
    if (r.used * 100 === s.thresholds.over * r.size) add(t.parts('capTie', { over: over() }));
    if (fo === null) add(t.parts('capNever', { over: over() }));
    else add(t.parts(aheadKey(), { over: over(), fo: data(fo), ff: data(ff) }));
    return head.concat(tail);
  }

  function blockCaption(s) {
    var b = s.block;
    // the hot spot: the fullest range (ties: table order)
    var hottest = s.ranges.reduce(function (m, r) { return r.util > m.util ? r : m; });
    if (hottest.full && b.status !== 'over') return t.parts('capHotspot', { pct: pct(b.util) });
    if (hottest.status === 'over' && b.status !== 'over') return t.parts('capHotOver', { pct: pct(b.util), name: B(t('n_' + hottest.id)), rp: pct(hottest.util) });
    return rich('capBlock', { name: data(b.name), used: data(grouped(b.used)), size: data(grouped(b.size)), pct: pct(b.util) });
  }

  function rangeCaption(s, r) {
    var v = { name: B(t('n_' + r.id)), used: data(grouped(r.used)), size: data(grouped(r.size)), pct: pct(r.util) };
    if (r.status === 'under') return t.parts('capUnder', v);
    return t.parts('capSteady', Object.assign(v, { status: t(LEG[r.status]) }));
  }

  var lastFocus = null;
  Simdeck.mount({
    defaults: L.defaults,
    initial: L.initial,

    params: [
      { key: 'week', type: 'range', label: t('week'), min: 0, max: L.weeks, step: 1 },
      { key: 'lease', type: 'choice', label: t('lease'), options: [[1, t('lease1')], [8, t('lease8')]] },
      { key: 'growth', type: 'range', label: t('growth'), min: 0, max: 20, step: 1, format: function (v) { return v + ' ' + t('growthUnit'); } },
      { key: 'visitors', type: 'range', label: t('visitors'), min: 0, max: 30, step: 1, format: function (v) { return v + ' ' + t('visitorsUnit'); } },
      { key: 'over', type: 'range', label: t('over'), min: 60, max: 95, step: 5, format: function (v) { return v + ' %'; } },
      { key: 'under', type: 'range', label: t('under'), min: 5, max: 40, step: 5, format: function (v) { return v + ' %'; } },
      { key: 'sel', type: 'select', label: t('hidden'), options: ['block'].concat(L.ids).map(function (v) { return [v, v]; }), visible: function () { return false; } }
    ],

    presets: L.presets.map(function (x) {
      return { id: x.id, label: t(PRESET_KEY[x.id]), hint: t(PRESET_KEY[x.id] + 'Hint'), params: x.params };
    }),

    legend: [
      { shape: 'iu-bar', label: t('legBar') },
      { shape: 'iu-under', label: t('legUnder') },
      { shape: 'iu-optimal', label: t('legOptimal') },
      { shape: 'iu-over', label: t('legOver') },
      { shape: 'iu-full', label: t('legFull') },
      { shape: 'hl', label: t('legChanged') }
    ],

    render: function (c) {
      var s = c.state;
      var sel = selOf(s, c.params);
      var changed = changedSet(c);
      // keep keyboard focus on the pressed name: the stage is rebuilt on every change
      var a = document.activeElement;
      lastFocus = a && c.stage.contains(a) && a.dataset && a.dataset.sel ? a.dataset.sel : null;
      c.stage.replaceChildren(h('div', { class: 'iu' },
        blockCard(s, sel, changed),
        h('div', { class: 'iu-tablebox' }, table(s, sel, changed)),
        h('div', { class: 'iu-detail' }, composition(s, sel), bigTrend(s, sel))));
      wire(c.stage);
      if (lastFocus) { var el = c.stage.querySelector('[data-sel="' + lastFocus + '"]'); if (el) el.focus({ preventScroll: true }); }
    },

    caption: function (c) {
      var s = c.state;
      var sel = selOf(s, c.params);
      if (sel === 'block') return blockCaption(s);
      var r = rangeById(s, sel);
      return r.live ? studentsCaption(s, r) : rangeCaption(s, r);
    }
  });
})();
</script>
</body>
</html>
