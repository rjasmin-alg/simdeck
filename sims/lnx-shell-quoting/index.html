/* Page CSS: every selector starts with [data-sim="lnx-shell-quoting"]; colours only from kit tokens.
   Quote spans carry a pattern, not only a colour: single = hatched, double = dotted frame; "from an expansion" is a
   thick underline; a word or field is a box, so its edges are the field boundaries. */
[data-sim="lnx-shell-quoting"] { --sq-single: var(--c2); --sq-double: var(--c1); --sq-exp: var(--c3); }
[data-sim="lnx-shell-quoting"] .sq {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 17em);
  gap: 1.2em;
  height: 100%;
  padding: 2cqh 2cqw;
  font-size: max(1rem, min(3.8cqh, 1.6cqw));
  line-height: 1.3;
}
[data-sim="lnx-shell-quoting"] .sq-strips { display: grid; grid-auto-rows: auto; align-content: start; gap: 0.4em; min-width: 0; min-height: 0; }

/* one stage strip: number and name at the left, the boxes at the right */
[data-sim="lnx-shell-quoting"] .sq-strip {
  display: grid;
  grid-template-columns: 11.5em minmax(0, 1fr);
  align-items: center;
  gap: 0.3em 0.7em;
  min-height: 2.3em;
  padding: 0.25em 0.6em;
  border: 0.14rem solid var(--line);
  border-radius: var(--radius);
  background: var(--bg);
}
[data-sim="lnx-shell-quoting"] .sq-strip[data-future] { border-style: dashed; color: var(--muted); }
[data-sim="lnx-shell-quoting"] .sq-strip[data-current] { border: 0.22rem solid var(--ink); background: var(--panel); }
[data-sim="lnx-shell-quoting"] .sq-name { display: flex; align-items: center; gap: 0.4em; font-weight: 700; line-height: 1.15; }
[data-sim="lnx-shell-quoting"] .sq-num {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 1.5em;
  height: 1.5em;
  border: 0.14rem solid currentColor;
  border-radius: 50%;
  font-size: max(16px, 0.8em);
}
[data-sim="lnx-shell-quoting"] .sq-strip[data-current] .sq-num { background: var(--hl); color: var(--on-hl); border-color: var(--ink); }
[data-sim="lnx-shell-quoting"] .sq-wait { font-style: italic; font-size: max(16px, 0.8em); }

[data-sim="lnx-shell-quoting"] .sq-typed { font-family: var(--mono); font-size: 1.15em; white-space: pre-wrap; overflow-wrap: anywhere; }
[data-sim="lnx-shell-quoting"] .sq-prompt { color: var(--muted); margin-right: 0.5em; }

/* boxes, grouped by the word they came from */
[data-sim="lnx-shell-quoting"] .sq-boxes { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.35em 1.1em; min-width: 0; }
[data-sim="lnx-shell-quoting"] .sq-group { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.3em; min-width: 0; }
[data-sim="lnx-shell-quoting"] .sq-arg { display: inline-grid; justify-items: center; gap: 0.1em; min-width: 0; }
[data-sim="lnx-shell-quoting"] .sq-ix { color: var(--muted); font-family: var(--mono); font-size: max(16px, 0.7em); }
[data-sim="lnx-shell-quoting"] .sq-box {
  display: inline-block;
  min-width: 1.4em;
  max-width: 100%;
  padding: 0.05em 0.3em;
  border: 0.14rem solid var(--ink);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-family: var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
[data-sim="lnx-shell-quoting"] .sq-box[data-syntax] { border-color: var(--line); color: var(--muted); }
[data-sim="lnx-shell-quoting"] .sq-box[data-vanished] { border-style: dashed; border-color: var(--muted); color: var(--muted); font-family: inherit; font-style: italic; text-decoration: line-through; }
[data-sim="lnx-shell-quoting"] .sq-box[data-empty] { min-width: 2em; }
[data-sim="lnx-shell-quoting"] .sq-box.sq-changed { background: var(--hl); color: var(--on-hl); outline: 0.2rem solid var(--ink); outline-offset: 0.1rem; }

/* parts inside a box */

}
[data-sim="lnx-shell-quoting"] .sq-p[data-q='double'] {

[data-sim="lnx-shell-quoting"] .sq-p[data-qc] { color: var(--muted); font-weight: 700; }

/* what the command did */

[data-sim="lnx-shell-quoting"] .sq-out > div { overflow-wrap: anywhere; white-space: pre-wrap; }
[data-sim="lnx-shell-quoting"] .sq-status { font-family: var(--sans); color: var(--muted); }
[data-sim="lnx-shell-quoting"] .sq-status b { color: var(--ink); font-family: var(--mono); }
[data-sim="lnx-shell-quoting"] .sq-passes { display: flex; flex-wrap: wrap; gap: 0.3em 1.2em; font-family: var(--sans); }
[data-sim="lnx-shell-quoting"] .sq-passes code { font-family: var(--mono); }
[data-sim="lnx-shell-quoting"] .sq-none { color: var(--muted); font-style: italic; font-family: var(--sans); }

/* the side card */
[data-sim="lnx-shell-quoting"] .sq-side { display: grid; align-content: start; gap: 0.7em; min-width: 0; font-size: max(1rem, 0.85em); }
[data-sim="lnx-shell-quoting"] .sq-card { padding: 0.4em 0.7em 0.5em; border: 0.14rem solid var(--line); border-radius: var(--radius); background: var(--panel); min-width: 0; }
[data-sim="lnx-shell-quoting"] .sq-card h3 { margin: 0 0 0.25em; font-size: 1em; }
[data-sim="lnx-shell-quoting"] .sq-kv { display: block; padding: 0.05em 0.2em; border-radius: var(--radius-sm); font-family: var(--mono); overflow-wrap: anywhere; }

[data-sim="lnx-shell-quoting"] .sq-cwd { font-family: var(--mono); font-weight: 400; }

/* legend swatches */
[data-sim="lnx-shell-quoting"] .sd-swatch[data-shape='sq-none'] { background: var(--bg); }
[data-sim="lnx-shell-quoting"] .sd-swatch[data-shape='sq-single'] {
  background-color: color-mix(in srgb, var(--sq-single) 18%, var(--bg));
  background-image: repeating-linear-gradient(45deg, transparent 0 0.2em, color-mix(in srgb, var(--ink) 45%, transparent) 0.2em 0.3em);
}
[data-sim="lnx-shell-quoting"] .sd-swatch[data-shape='sq-double'] { background: color-mix(in srgb, var(--sq-double) 14%, var(--bg)); border-style: dotted; }
[data-sim="lnx-shell-quoting"] .sd-swatch[data-shape='sq-exp'] { height: 0; border: 0; border-radius: 0; background: none; border-bottom: 0.25rem solid var(--sq-exp); width: 1.5em; }

@media (max-width: 900px), (max-aspect-ratio: 1/1) {
  [data-sim="lnx-shell-quoting"] .sd-stage { height: auto; container-type: inline-size; }
  [data-sim="lnx-shell-quoting"] .sq { grid-template-columns: minmax(0, 1fr); height: auto; font-size: 1rem; gap: 0.8rem; padding: 0.6rem; }
  [data-sim="lnx-shell-quoting"] .sq-strip { grid-template-columns: minmax(0, 1fr); }
}

<script>
(function () {
  'use strict';
  var L = window.SimLogic;
  var h = Simdeck.h;
  var t = Simdeck.useStrings(window.SimStrings);
  var PRESET_KEY = { bez: 'pBez', jednostruki: 'pJednostruki', razmaci: 'pRazmaci', polja: 'pPolja', uzorak: 'pUzorak', zamjena: 'pZamjena' };
  var IFS_SHOWN = { 'default': "$' \\t\\n'", colon: ':', newline: "$'\\n'" };
  var STRIPS = ['words', 'expanded', 'split', 'globbed', 'argv'];

  function code(s) { return h('code', { translate: 'no' }, s); }
  /** A value as code, in quotes, with a newline shown as a mark. */
  function valueCode(v) { return code('"' + v.replace(/\n/g, '↵') + '"'); }
  function joinNodes(nodes) {
    var out = [];
    nodes.forEach(function (n, i) { if (i) out.push(t('listSep')); out.push(n); });
    return h('span', null, out);
  }
  function codes(list) { return joinNodes(list.map(function (x) { return code(x.replace(/\n/g, '↵')); })); }

  /** Text with spaces and newlines made visible (they matter inside a box). */
  function visible(text, marks) {
    if (!marks) return text;
    var out = [];
    var buf = '';
    text.split('').forEach(function (c) {
      if (c === ' ' || c === '\n') {
        if (buf) { out.push(buf); buf = ''; }
        out.push(h('span', { class: 'sq-mark', 'aria-label': t(c === ' ' ? 'spaceMark' : 'newlineMark') }, c === ' ' ? '␣' : '↵'));
      } else buf += c;
    });
    if (buf) out.push(buf);
    return out;
  }
  function box(item, changed) {
    if (item.vanished) return h('span', { class: 'sq-box' + (changed ? ' sq-changed' : ''), dataset: { vanished: '' } }, t('vanished'));
    var ds = {};
    if (item.syntax) ds.syntax = '';
    if (!item.text.length) ds.empty = '';
    return h('span', { class: 'sq-box' + (changed ? ' sq-changed' : ''), dataset: ds, translate: 'no' },
      item.parts.map(function (p) {
        var pd = { q: p.quoted };
        if (p.fromExpansion) pd.x = '';
        if (p.quoteChar) pd.qc = '';
        return h('span', { class: 'sq-p', dataset: pd }, visible(p.text, true));
      }));
  }

  /** One strip's boxes, grouped by source word; `lit` marks the boxes this stage changed. */
  function boxes(items, lit, argvLabels, kind) {
    var groups = [];
    items.forEach(function (it) {
      var g = groups[groups.length - 1];
      if (!g || g.src !== it.src) { g = { src: it.src, items: [] }; groups.push(g); }
      g.items.push(it);
    });
    var itemNo = 0;
    return h('div', { class: 'sq-boxes' }, groups.map(function (g) {
      return h('span', { class: 'sq-group' }, g.items.map(function (it) {
        var b = box(it, lit && it.changed);
        if (!argvLabels) return b;
        var label = kind === 'for' ? (it.syntax ? '' : t('argvItem', { i: ++itemNo })) : 'argv[' + it.index + ']';
        return h('span', { class: 'sq-arg' }, b, h('span', kind === 'for' ? { class: 'sq-ix' } : { class: 'sq-ix', translate: 'no' }, label || ' '));
      }));
    }));
  }

  function strip(n, s, content) {
    var ds = {};
    if (n > s.stage) ds.future = '';
    if (n === s.stage) ds.current = '';
    return h('div', { class: 'sq-strip', dataset: ds },
      h('div', { class: 'sq-name' }, h('span', { class: 'sq-num', 'aria-hidden': 'true' }, String(n)), t('s' + n)),
      n > s.stage ? h('span', { class: 'sq-wait' }, t('waiting')) : content);
  }

  function resultView(s) {
    var r = s.result;
    if (!r) return null;
    if (r.kind === 'for') {
      return h('div', { class: 'sq-out' },
        h('div', { class: 'sq-passes' }, r.items.map(function (it, i) {
          return h('span', null, t('pass', { i: i + 1 }), ': ', h('code', { translate: 'no' }, r.name + ' = '),
            box({ text: it, parts: [{ text: it, quoted: 'none' }] }, false));
        })),
        h('div', { class: 'sq-status' }, t('status'), ' ', h('b', null, String(r.status))));
    }
    if (r.kind === 'unknown') return h('div', { class: 'sq-out' }, h('div', { class: 'sq-none' }, t('notModelled')));
    return h('div', { class: 'sq-out' },
      r.out.length ? r.out.map(function (l) { return h('div', { translate: 'no' }, l); }) : h('div', { class: 'sq-none' }, t('noOutput')),
      h('div', { class: 'sq-status' }, t('status'), ' ', h('b', null, String(r.status))));
  }

  function side(c) {
    var s = c.state, p = c.params;
    var used = {};
    s.exps.forEach(function (e) { if (e.name) used[e.name] = true; });
    var matched = {};
    if (s.stage === 4) (s.globInfo || []).forEach(function (g) { g.matches.forEach(function (m) { matched[m] = true; }); });
    var removed = s.result ? s.result.removed : [];
    return h('div', { class: 'sq-side' },
      h('div', { class: 'sq-card' },
        h('h3', null, t('vars')),
        Object.keys(s.vars).map(function (k) {
          return h('span', { class: 'sq-kv' + (s.stage === 2 && used[k] ? ' sq-lit' : ''), translate: 'no' }, k + '="' + s.vars[k] + '"');
        }),
        h('span', { class: 'sq-kv' + (s.stage === 3 ? ' sq-lit' : ''), translate: 'no' }, 'IFS=' + IFS_SHOWN[p.ifs]),
        h('span', { class: 'sq-kv' + (s.stage === 4 ? ' sq-lit' : '') }, h('span', { translate: 'no' }, 'set -f'), ': ', t(s.noglob ? 'on' : 'off'))),
      h('div', { class: 'sq-card' },
        h('h3', null, t.parts('files', { cwd: h('span', { class: 'sq-cwd', translate: 'no' }, s.cwd) })),
        s.cwdFiles.map(function (f) {
          var gone = removed.indexOf(f) >= 0;
          return h('span', { class: 'sq-kv sq-file' + (matched[f] || (gone && s.stage === 6) ? ' sq-lit' : ''), dataset: gone ? { removed: '' } : {} },
            h('span', { translate: 'no' }, f), gone ? [' ', h('small', null, t('removed'))] : null);
        })));
  }

  function render(c) {
    var s = c.state;
    var strips = [strip(0, s, h('div', { class: 'sq-typed', translate: 'no' }, h('span', { class: 'sq-prompt', 'aria-hidden': 'true' }, '$'), s.line))];
    STRIPS.forEach(function (key, i) {
      var n = i + 1;
      strips.push(strip(n, s, s[key] ? boxes(s[key], n === s.stage && n > 1, key === 'argv', s.kind) : null));
    });
    strips.push(strip(6, s, resultView(s)));
    c.stage.replaceChildren(h('div', { class: 'sq' }, h('div', { class: 'sq-strips' }, strips), side(c)));
  }

  // ── captions ──

  function sepOf(value, ifs) {
    var sp = value.indexOf(' ') >= 0 && ifs.indexOf(' ') >= 0;
    var nl = value.indexOf('\n') >= 0 && ifs.indexOf('\n') >= 0;
    if (sp && nl) return t('sepBoth');
    if (sp) return t('sepSpace');
    if (nl) return t('sepNewline');
    if (value.indexOf(':') >= 0 && ifs.indexOf(':') >= 0) return t('sepColon');
    return t('sepTab');
  }
  function sentences(list) {
    var out = [];
    list.forEach(function (x, i) { if (!x) return; if (out.length) out.push(' '); out.push(h('span', null, x)); });
    return out;
  }
  function hl(x) { return h('span', { class: 'sd-hl' }, x); }

  function presetNote(p, s) {
    var r = s.result;
    switch (p.line) {
      case 'bez': return t('nBez');
      case 'jednostruki': return t.parts('nJednostruki', { tok: code("'$ime'"), d: code('$') });
      case 'razmaci': return t(r.status ? 'nRazmaciSplit' : 'nRazmaciOk');
      case 'polja': return t(r.items.length > 1 ? 'nPoljaList' : 'nPoljaOne');
      case 'uzorak': return t(r.removed.length ? 'nUzorakGlob' : p.quoted ? 'nUzorakQuoted' : 'nUzorakNoglob');
      case 'zamjena': return t(r.items.length === 3 ? 'nZamjenaSplit' : r.items.length === 2 ? 'nZamjenaLines' : p.quoted ? 'nZamjenaOne' : 'nZamjenaWhole');
    }
    return null;
  }

  function caption(c) {
    var p = c.params, s = c.state;
    var argv = s.argv ? s.argv.map(function (a) { return a.text; }) : [];
    if (s.stage === 0) return t('c0');
    if (s.stage === 1) {
      var single = s.words.some(function (w) { return w.parts.some(function (x) { return x.quoted === 'single' && !x.quoteChar && x.text.indexOf('$') >= 0; }); });
      var tok = single ? s.words.filter(function (w) { return w.parts.some(function (x) { return x.quoted === 'single'; }); })[0].text : '';
      var quotes = s.words.some(function (w) { return w.parts.some(function (x) { return x.quoteChar; }); });
      return sentences([t.parts('c1', { n: t.n('wordsN', s.words.length) }), quotes ? t('c1Quotes') : null,
        single ? t.parts('c1Single', { d: code('$'), tok: code(tok) }) : null]);
    }
    if (s.stage === 2) {
      if (!s.exps.length) return t.parts('c2None', { d: code('$') });
      var list = joinNodes(s.exps.map(function (e) {
        if (e.kind === 'cmd') return h('span', null, t.parts('expCmd', { tok: code(e.text), cmd: code(e.cmd), val: valueCode(e.value) }));
        return h('span', null, t.parts(e.kind === 'tilde' ? 'expTilde' : 'expParam', { tok: code(e.text), val: valueCode(e.value) }));
      }));
      var dbl = s.exps.some(function (e) { return e.q === 'double'; });
      return sentences([t.parts('c2', { list: list }), dbl ? t.parts('c2Double', { d: code('$') }) : null]);
    }
    if (s.stage === 3) {
      if (!s.exps.length) return t('cSplitNone');
      var parts = [];
      var quoted = false;
      s.splitInfo.forEach(function (si) {
        var e = s.exps[si.exp];
        var exp = code(e.text);
        if (si.outcome === 'quoted') { quoted = true; parts.push(t.parts('cSplitQuoted', { exp: exp })); }
        else if (si.outcome === 'split') parts.push(t.parts('cSplit', { exp: exp, sep: sepOf(e.value, s.ifs), n: t.n('fieldsN', si.fields.length), list: codes(si.fields) }));
        else if (si.outcome === 'whole') parts.push(t.parts('cSplitWhole', { exp: exp, ifs: code(IFS_SHOWN[p.ifs]) }));
        else if (si.outcome === 'trim') parts.push(t.parts('cSplitTrim', { exp: exp, list: codes(si.fields) }));
        else if (si.outcome === 'blank') parts.push(t.parts('cSplitBlank', { exp: exp }));
        else parts.push(t.parts('cSplitEmpty', { exp: exp }));
      });
      if (quoted) parts.push(hl(t('cProtect')));
      if (p.ifs !== 'default') parts.push(t('cTypedBlanks'));
      return sentences(parts);
    }
    if (s.stage === 4) {
      if (!s.globInfo.length) return t.parts('cGlobNothing', { chars: code('* ? [') });
      var g = [];
      s.globInfo.forEach(function (gi) {
        var pat = code(gi.field);
        if (gi.outcome === 'matched') {
          g.push(t.parts('cGlobMatched', { pat: pat, list: codes(gi.matches) }));
          var spaced = gi.matches.filter(function (m) { return m.indexOf(' ') >= 0; })[0];
          if (spaced) g.push(hl(t.parts('cGlobSpace', { name: code(spaced) })));
        } else if (gi.outcome === 'quoted') g.push(t.parts('cGlobQuoted', { pat: pat }));
        else if (gi.outcome === 'notpattern') g.push(t.parts('cGlobNotPattern', { pat: pat }));
        else if (gi.outcome === 'noglob') g.push(t.parts('cGlobNoglob', { pat: pat, setf: code('set -f') }));
        else g.push(t.parts('cGlobNomatch', { pat: pat }));
      });
      return sentences(g);
    }
    if (s.stage === 5) {
      var count = s.kind === 'for'
        ? t.parts('cItems', { n: t.n('itemsN', argv.length - 3) })
        : t.parts(argv.length > 2 ? 'cArgs' : 'cArgs1', { cmd: code(argv[0] || ''), n: t.n('argsN', Math.max(0, argv.length - 1)) });
      return sentences([t(s.removedQuotes ? 'cQuotes' : 'cQuotesNone'), count]);
    }
    // stage 6: the command runs
    var r = s.result;
    var what;
    var cmd = code(argv[0] || '');
    if (r.kind === 'for') what = t.parts(r.items.length === 1 ? 'cForOne' : 'cFor', { n: t.n('timesN', r.items.length), var: code(r.name), list: codes(r.items) });
    else if (r.kind === 'unknown') what = t.parts('cUnknown', { cmd: cmd });
    else if (argv[0] === 'echo') what = t.parts('cEcho', { cmd: cmd });
    else if (argv[0] === 'ls') {
      var ops = argv.slice(1).filter(function (a) { return a[0] !== '-'; });
      what = r.status ? t.parts('cLsMissing', { cmd: cmd, missing: t.n('missingN', r.missing), s: String(r.status) }) : t.parts('cLsOk', { cmd: cmd, name: codes(ops) });
    } else {
      what = r.removed.length ? t.parts('cRmOk', { cmd: cmd, n: t.n('filesN', r.removed.length), list: codes(r.removed) })
        : t.parts('cRmFail', { cmd: cmd, name: codes(argv.slice(1)), s: String(r.status) });
    }
    var note = presetNote(p, s);
    return sentences([what, note ? hl(note) : null]);
  }

  Simdeck.mount({
    steps: L.steps,
    defaults: L.defaults,
    initial: L.initial,
    step: L.step,

    params: [
      { key: 'line', type: 'select', label: t('line'), resets: true,
        options: L.LINE_IDS.map(function (id) { return [id, t(PRESET_KEY[id])]; }) },
      { key: 'quoted', type: 'toggle', label: t('quoted'), hint: t('quotedHint'),
        disabled: function (p) { return L.LINES[p.line] && !L.LINES[p.line].quoted ? t('quotedNone') : false; } },
      { key: 'ifs', type: 'choice', label: t('ifs'),
        options: [['default', t('ifsDefault')], ['colon', t('ifsColon')], ['newline', t('ifsNewline')]] },
      { key: 'noglob', type: 'toggle', label: t('noglob') }
    ],

    presets: L.LINE_IDS.map(function (id) { return { id: id, label: t(PRESET_KEY[id]), params: { line: id } }; }),

    legend: [
      { shape: 'sq-none', label: t('legendNone') },
      { shape: 'sq-single', label: t('legendSingle') },
      { shape: 'sq-double', label: t('legendDouble') },
      { shape: 'sq-exp', label: t('legendExp') },
      { shape: 'hl', label: t('legendChanged') }
    ],

    render: render,
    caption: caption
  });
})();
</script>
